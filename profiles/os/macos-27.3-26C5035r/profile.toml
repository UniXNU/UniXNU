["os"]
"name" = "macos-27.3-26C5035r"
"arch" = "arm64e"
"darwin" = "25.5.0"
# No Darwin 26 XNU source is published yet. 26C5035r runs on the xnu-12377 kernel with the Darwin 26
# system calls, the macOS KPIs and the macOS build target added (patches/xnu/series); move to the
# Darwin 26 tag when Apple publishes it. Apple's own kernel of this release is xnu-13432.60.57.
"xnu_version" = "12377.121.6"
"xnu_revision" = "ac9718fb1af618d5ce8678d0dc6e8a58f252216f"
# 12377 carries iokit/DriverKit; EXTERNAL_HEADERS/TrustCache comes from the last tag that ships it.
"driverkit_tag" = "xnu-12377.121.6"
"trustcache_tag" = "xnu-8796.101.5"
# The kernel serves macOS userspace: XNU_TARGET_OS_OSX (the padded kext vtables and aligned containers of
# the macOS kexts) on the same iOS-platform kernel, memory layout and link address as iPadOS; the macOS
# machine options come from patches/xnu-12377/macos-machine-config.patch.
"target" = "macosx"
# The deployment version of that iOS-platform kernel.
"ios_version" = "27.0"
"abi" = []


["ipsw"]
"url" = "https://updates.cdn-apple.com/2026FallSeed/53df7654-4865-4259-8dae-30177b76f104/UniversalMac_27.3_26C5035r_Restore.ipsw"
"product" = "Mac17,11"
"version" = "27.3"
"build" = "26C5035r"
"device_class" = "k114cap"
"chip_id" = 24656
"board_id" = 4
"fetch" = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache", "Cryptex1,AppTrustCache"]


["kernel"]

["kernel"."prelink"]
"tool" = "kits/XnuPrelink/emit_prelink.py"
"kernel" = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
# kernelcache.release.mac17j decompressed. mac17j keeps full symbol tables on the kernel and every kext,
# so the prelink map is built from names; the fileset stays at its linked addresses, there is no slide.
"kernelcache_sha256" = "d1003b5143ffd88439b4d45b6017f587171cfe6855660bed05370a2ea5db9fe9"
# The fileset roots of the macOS startup closure (BaseSystem is not part of it; the installed system
# volume carries everything), with the USB device and host stacks. USB host mode reaches AppleOnboardSerial
# and AppleSMC only through a metaclass in an OSDynamicCast, and they bring RTBuddy, AppleA7IOP and more:
# left out, that cast finds nothing.
"roots" = ["com.apple.AppleFSCompression.AppleFSCompressionTypeZlib", "com.apple.AppleFSCompression.AppleFSCompressionTypeDataless", "com.apple.driver.AppleARMPlatform", "com.apple.driver.AppleARMWatchdogTimer", "com.apple.driver.AppleAudioClockLibs", "com.apple.driver.AppleEffaceableStorage", "com.apple.driver.AppleIISController", "com.apple.driver.AppleM2ScalerCSCDriver", "com.apple.driver.AppleMobileFileIntegrity", "com.apple.driver.ApplePMGR", "com.apple.driver.IODARTFamily", "com.apple.filesystems.apfs", "com.apple.filesystems.hfs.kext", "com.apple.iokit.CoreAnalyticsFamily", "com.apple.iokit.IOAVFamily", "com.apple.iokit.IOAudio2Family", "com.apple.iokit.IOCECFamily", "com.apple.iokit.IOCryptoAcceleratorFamily", "com.apple.iokit.IOGPUFamily", "com.apple.iokit.IOHDCPFamily", "com.apple.iokit.IOMobileGraphicsFamily", "com.apple.iokit.IOReportFamily", "com.apple.iokit.IOSlowAdaptiveClockingFamily", "com.apple.iokit.IOStorageFamily", "com.apple.iokit.IOSurface", "com.apple.kec.Libm", "com.apple.kec.corecrypto", "com.apple.kext.AppleMatch", "com.apple.kext.CoreTrust", "com.apple.security.AppleImage4", "com.apple.security.sandbox", "com.apple.security.quarantine", "com.apple.AppleSystemPolicy", "com.apple.iokit.IOHIDFamily", "com.apple.iokit.IOTimeSyncFamily", "com.apple.plugin.IOgPTPPlugin", "com.apple.driver.AppleDiskImages2", "com.apple.driver.DiskImages", "com.apple.driver.DiskImages.FileBackingStore", "com.apple.driver.DiskImages.KernelBacked", "com.apple.driver.DiskImages.RAMBackingStore", "com.apple.driver.DiskImages.ReadWriteDiskImage", "com.apple.driver.DiskImages.UDIFDiskImage", "com.apple.driver.AppleMultitouchDriver", "com.apple.iokit.IONetworkingFamily", "com.apple.iokit.IOUSBDeviceFamily", "com.apple.driver.AppleUSBXDCI", "com.apple.driver.AppleUSBDeviceMux", "com.apple.iokit.IOUSBHostFamily", "com.apple.driver.usb.AppleUSBXHCI", "com.apple.driver.usb.AppleUSBHub", "com.apple.driver.usb.AppleUSBHostCompositeDevice", "com.apple.driver.usb.IOUSBHostHIDDevice", "com.apple.iokit.IOUSBMassStorageDriver", "com.apple.iokit.IOSCSIArchitectureModelFamily", "com.apple.iokit.IOSCSIBlockCommandsDevice", "com.apple.iokit.IOBluetoothFamily", "com.apple.iokit.IO80211Family", "com.apple.iokit.EndpointSecurity", "com.apple.driver.AppleHIDKeyboard", "com.apple.driver.AppleTopCaseHIDEventDriver", "com.apple.driver.AppleInputDeviceSupport", "com.apple.iokit.IOGraphicsFamily", "com.apple.driver.AppleFDEKeyStore", "!com.apple.driver.AppleOnboardSerial", "!com.apple.driver.AppleSMC"]
# _amfi_register_mac_policy: calls _initializeAppleMobileFileIntegrity and returns 0. AMFI __start does not
# register the policy; the kernel patch calls this routine early.
"early_security_init" = "com.apple.driver.AppleMobileFileIntegrity=0xfffffe0009840dd4"


["adt"]

["adt"."root"]

["adt"."root"."string"]
"model" = "Mac17,11"
"target-type" = "K114c"
"target-sub-type" = "K114cAP"
"compatible" = "K114cAP"
"manufacturer" = "Apple Inc."
"secure-root-prefix" = "md"


["adt"."chosen"]

["adt"."chosen"."string"]
"osenvironment" = "main"
"crypto-hash-method" = "sha2-384"
"cryptex1-certificate-format" = "x509"


["adt"."chosen"."u32"]
# A Mac reads these two and chip-id over lockdown and looks them up in MobileDevice's device map. No match leaves the device class unknown,
# which it reports as "a software update is required". The chip-id is the board's [payload.adt] chip_id.
"board-id" = 4
"security-domain" = 1
"certificate-production-status" = 0
"effective-production-status-ap" = 0
"certificate-security-mode" = 1
"effective-security-mode-sep" = 1
"amfi-only-platform-code" = 1


# The local boot policy csr_bootstrap reads (kern_csr.c): lp-sip0 keeps every SIP protection on, lp-sip1 adds
# CSR_ALLOW_UNAUTHENTICATED_ROOT, as `csrutil authenticated-root disable` does. The system volume carries no Apple seal
# manifest here; the owner-signed root policies verify every block of it instead.
["adt"."chosen"."asmb"."u64"]
"lp-sip0" = 0

["adt"."chosen"."asmb"."u32"]
"lp-sip1" = 1



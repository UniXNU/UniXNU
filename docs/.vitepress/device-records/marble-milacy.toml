[[area]]
id = "packaging"
status = "device-verified"
components = ["XnuPrelink"]
paths = ["package/**", "configs/**", "docs/**"]
inputs = ["XNU source, iPadOS kernelcache, trust cache, Data seed, firmware DTB and UEFI FD."]
configuration = ["[kernel] prelink comes from the iPadOS 17.7.11 profile. [payload] selects a 160 MiB FAT16 volume, panic screen and the full UFS root arguments. [firmware] supplies the FD path."]
procedure = ["Build kernel, payload and boot image in order; inspect boot.json and payload.json before booting."]
findings = ["2026-11-01 on-screen boot log: CONFIG_XNU_BOOT_PROGRESS=y links libBootProgress.a and routes vcputc/PE_kputc to the GOP framebuffer. The screen-log kernel is SHA-256 51f44694f19cf829a87462f0c431b2dfa00cf7c7914c355fa90a13e074be2716 and its boot.img is 99998e8a5b9b72d2d7143ddab699e785791a2d9a8dcbe9dcad9e5b62cde84f7b; userdata is unchanged. This gives stage and exec lines on screen but still no host log channel.", "2026-11-01 unverified tail-root package: 51,146,752-byte kernel b1ae430b..., 160 MiB payload 992815d5..., 169,607,168-byte boot.img ce31ab2f..., and 9,382,658,048-byte userdata image fd43ee70.... The boot image uses cpus=1, native-ufs-root=1, LBA 59589627, 2290688 blocks, stream 0xE0, SMMU takeover, native-ufs-allow-unverified=1 and root-unverified=1.", "2026-11-01 first-entry console build: marble-console_defconfig (no UFS/root/Data/display) with the 21H461 IPSW, kernel.macho SHA-256 5270a0b93bea8db7de01f56440f8142430df4395954bf18335f8f5806c32e6df, 160 MiB payload SHA-256 4a416b4ef506ea69279cde3e7ebe5ffeacc9fbb3a77630f54b0d43612e36f1c9, and 169,607,168-byte boot.img SHA-256 d169cb16d8d9bb25b6184bd544ce0d831a6f01499f037ab1424972b67b696b7e. The image passes cpus=1 and zeroed UFS arguments; it is host-built only.", "The first console boot reached IOKit and data-aborted at IODTGetICellCounts+0x2c (PC 0xfffffff0078ec634, ESR 0x96000005, FAR 0), with IODTMapInterruptsSharing+0x290 in the stack. The generated ADT had only `phandle`; AddPHandle records `AAPL,phandle`, so interrupt-parent resolved to NULL. The ADT generator now maps phandle/linux,phandle to AAPL,phandle; the regenerated ADT contains the property and the payload hash changed. The kernel itself was unchanged.", "The OS profile pins the same 21H461 kernelcache and trust caches used by sheng and alioth.", "The payload path is resolved relative to \\EFI\\UniXNU, so the builder writes \\EFI\\UniXNU\\Payloads\\kernel.macho; a file at the FAT root is not found.", "mformat -F produced a FAT32 BPB that the EDK2 FAT driver refused (TotSec16 nonzero with TotSec32 zero). The builder now creates FAT16 (mkfs.fat -F 16, or mformat without -F) and rejects FAT32 or a missing 0x55AA signature.", "UniXNURamDiskDxe validates the FAT boot sector, aligns initrd-end down to 512 bytes and calls ConnectController after installing BlockIo. UniXNU also connects all controllers before scanning for unixnu.toml, so the payload volume appears without relying on BDS enumeration order.", "The working fastboot boot path is an Android v0 image: kernel 0x80008000, 160 MiB payload at 0xA8000000, DTB /chosen initrd 0xA8000000-0xB2000000. The earlier v4 image did not load the ramdisk reliably.", "Host build 2026-10-30 produced the historical two-module original trust bundle (SHA-256 7416ca4f...); that file is not in this checkout. The 2026-11-01 empty-ramdisk Stage 1 image is 1,835,008 bytes (SHA-256 8adf6380c2991c389b6c08cbfc86036543f2fa647c71c34e3d52523c69f891cd) and is derived from the current FD and DTB.", "Host build 2026-10-31 (full UFS root): kernel.macho SHA-256 c3ea36a2b438f2f84bca0e342699b9640dfb61a7631463576674a1b63a1795bd; boot.img 68947968 bytes with the Android v0 header (SHA-256 ce8b5f6e57c716ecf0605839734bd2806d4ae470c83d96eb829842caff6147cc); payload.img 64 MiB FAT16 (historical build); userdata-root.img 9382658048 bytes (SHA-256 fd43ee7035ce185ce4215ac93fdc006fd784a54b3b7442e21457c226cbe03093) with OS/SystemOS windows.", "The payload FAT volume contains EFI/UniXNU/unixnu.toml, Payloads/kernel.macho, kernel.macho.adt and kernel.macho.trustcache; the packed command line includes native-ufs-stream=0xe0, native-ufs-smmu-takeover=1, native-ufs-root=1 and sheng-pmgr=2."]
completion = ["Kernel and prelink succeed, the payload contains all declared inputs, and the boot image matches the Android v0 header, the fixed ramdisk range and the userdata partition."]
limits = ["The console boot image has no UFS/root driver, so it stops at IOKitBSDInit.cpp:984 as expected. The userdata image has not been flashed and no launchd result exists."]
next_action = ["Build an unverified root kernel/image first; only then decide whether to back up and flash userdata."]
evidence = [
  { kind = "host", reference = "firmware/README.md", command = "./unixnu build firmware -D ../UniXNU-marble --uefi ../uefi-marble --edk2 ../uefi-marble/Mu_Basecore && ./unixnu bootimg -D ../UniXNU-marble --uefi ../uefi-marble --fd ../uefi-marble/Build/marblePkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd --dtb ../uefi-marble/Resources/DTBs/marble-unixnu.dtb --ramdisk none", revision = "d1f18525135544426fae87c9497155df7f9e1fc7", result = "Stage 1 firmware and empty-ramdisk boot image built and round-trip verified on the host; boot.json records ramdisk_bytes=0, kernel_address=0x80008000, hardware_tested=false." },
  { kind = "host", reference = "configs/marble-console_defconfig", command = "./unixnu build kernel -D ../UniXNU-marble --ipsw ../iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw && ./unixnu build payload ... --kernel-arg cpus=1 ... && ./unixnu bootimg ...", revision = "466b025c2d8c74dc60c3122e9eb8766de9f783c0", result = "Console kernel, 160 MiB payload and 169,607,168-byte boot.img built and round-trip verified on the host; no verified-root/Data inputs; hardware_tested=false." },
  { kind = "host", reference = "package/BootProgress.c", command = "./unixnu build kernel -D ../UniXNU-marble --ipsw ../iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw && ./unixnu build payload ... && ./unixnu bootimg ...", revision = "12e6d2977166292b5a5898234162e338265b665f", result = "Screen-log kernel and 169,607,168-byte boot image built; BootProgress symbols link and the payload retains the tail-root arguments. Not yet device-tested." },
  { kind = "host", reference = "configs/marble-root_defconfig", command = "./unixnu build payload ... --kernel .../marble-root/kernel/kernel.macho ... && ./unixnu bootimg ...", revision = "0a6717c3212147f65c1b59a173dfd1565e9c5adb", result = "Unverified UFS tail-root payload and boot image built; payload record names LBA 59589627/2290688 blocks and zeroed Data inputs." },
  { kind = "device", reference = "docs/REAL-DEVICE-TESTS.md", command = "fastboot boot artifacts/marble-xnu-console/boot.img", revision = "0a6717c3212147f65c1b59a173dfd1565e9c5adb", result = "XNU booted from the 169,607,168-byte console image and failed at IOFindBSDRoot+0xc88 (`IOKitBSDInit.cpp:984`) because UFS/root is deliberately absent. This is the Stage 2 success checkpoint, not a regression." },
  { kind = "host", reference = "docs/REAL-DEVICE-TESTS.md", command = "./unixnu build kernel -D ../UniXNU-marble && ./unixnu build payload ... && ./unixnu bootimg ...", revision = "e13cbdc5da195f9e52ac72d406fadeac3107fb57", result = "Previous full UFS root kernel, payload and 8.8 GiB userdata image; not present in this checkout and not a current verification." },
]


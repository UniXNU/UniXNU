schema_version = 1

[device]
name = "marble"
soc = "SM7475"
os_profile = "ipados-17.7.11-21H461"
summary = "Format-2 first-console port for the Redmi Note 12 Turbo / POCO F5 (SM7475). The UEFI image and UniXNU menu are buildable; XNU kernel entry needs user-supplied IPSW inputs; system entry is a documented later stage."

[[area]]
id = "configuration"
status = "implemented"
components = []
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", ".github/**", ".gitignore", "local.toml.example", "README.md", "AGENTS.md", "porting.toml"]
inputs = ["Board identity, SM7475 SoC profile, iPadOS 17.7.11 OS profile, component selection and external source pins."]
configuration = ["board.toml selects soc_source=sm7475, kit=marble and the iPadOS 17.7.11 profile. The SM7475 DTSI and SMP/cluster patches are pinned through feeds.toml from the sibling UniXNU-sm7475-common repository."]
procedure = ["Run ./unixnu defconfig marble_defconfig, fetch, status and tree from the main UniXNU checkout; inspect the resolved sources and output path."]
findings = ["The legacy ios-port-marble tree is an iOS 16 / XNU 8796 / 16 KiB-page shim port; this repository is a source-backed Format-2 migration to the upstream iPadOS 17 / XNU 10063 / 4 KiB UEFI profile. The subsystem-by-subsystem mapping and the deliberately unported audio/GPU/touch work are recorded in docs/MIGRATION.md.", "The common ADT generator now emits AAPL,phandle instead of the FDT spelling phandle. XNU's AddPHandle/IODTFindInterruptParent look up AAPL,phandle; without the rename the UFS interrupt-parent resolved to NULL and IODTGetICellCounts() data-aborted at PC 0xfffffff0078ec2d4 (ESR 0x96000005, FAR 0).", "The board is SM7475-AB (Cape), not SM8550. The CPU topology is 4x A510, 3x A710 and 1x X2, so the shared DTSI differs from SM8550 even though GIC and UFS addresses match.", "The apps-SMMU stream from the vendor DT is 0xE0, while upstream ShengUfs programs 0x60. The local drivers/ShengUfs fork adds native-ufs-stream with a 0xE0 default.", "The stock marble UEFI port provides Resources/DTBs/marble.dtb. The port adds Resources/DTBs/marble-unixnu.dtb with the stale /chosen initrd properties removed, keeping the splash region, so the bootloader can publish the actual payload range and the board does not add a duplicate [[bootimg.dtb_node]]."]
completion = ["All source pins resolve; status shows the intended SoC, OS and device layers; the device tree compiles."]
limits = ["The SM7475 shared repository is published at https://github.com/MiLacy/UniXNU-sm7475-common and pinned to fc78deda27304248186fec2320c5678c45d8e431."]
next_action = ["Run the status check on a clean clone of the published repositories."]
evidence = [
  { kind = "source", reference = "board.toml", result = "Board identity, component selection, firmware paths and payload inputs." },
  { kind = "source", reference = "dts/marble.dts", result = "Board memory, splash reservation and CPU cluster tags." },
  { kind = "source", reference = "configs/marble_defconfig", result = "First-console kernel configuration." },
  { kind = "source", reference = "docs/HARDWARE.md", result = "Source-backed hardware inventory." },
]

[[area]]
id = "firmware"
status = "device-verified"
components = ["DarwinBoot"]
paths = ["README.md", "docs/HARDWARE.md", "proprietary-files.txt", "package/**"]
inputs = ["Mu-Silicium-marble Platforms/Xiaomi/marblePkg, Resources/Configs/marble.toml, the stock Resources/DTBs/marble.dtb and the derived Resources/DTBs/marble-unixnu.dtb, and the four Mu edk2 patches."]
configuration = ["[firmware] selects config=marble, the marble DSC, the 3 MiB FD path and the four Mu patches. UniXNU, UniXNUDxe, UniXNURamDiskDxe and DarwinBoot are listed in the DSC and DXE.inc."]
procedure = ["Build the firmware with ./unixnu build firmware, then pack an empty-ramdisk boot.img with the marble DTB and boot it with fastboot boot."]
findings = ["The stock marble DSC already includes DiskIoDxe, PartitionDxe, Fat and EnglishDxe; the UniXNU integration adds the four modules and the UniXNULib, FdtLib and HobLib mappings.", "The FD is 3 MiB at 0xA7100000, the same window the stock Mu-Silicium marble port uses.", "Host build 2026-11-01 from upstream fc9e410d plus integration d1f18525: the DEBUG FD is exactly 0x300000 bytes (one build SHA-256 9a0a727f136cd7e97d4a6aaf43adee6517f637b122f09e444d9db090c6a51f2a; a later rebuild produced 7bce194a... because EDK II embeds a timestamp). The build log lists UniXNU.efi, UniXNUDxe.efi, UniXNURamDiskDxe.efi and DarwinBoot.efi, and FVMAIN used 99% of its space.", "The stock BootShim header did not describe the complete shim plus payload; bootimg rejected the image. BootShim.S now writes `FD_SIZE + _Payload - _Head` as the ARM64 image size.", "The marble SEC did not save the previous stage's x0 or build gSiliciumEntryArgHobGuid, so UniXNURamDiskDxe could not publish the payload volume and the menu reported no boot entry found. ModuleEntryPoint.S now keeps x0 in x19 and passes it as the third CEntryPoint argument; Sec.c builds the HOB after InitializeMemory. The GUID is present in the FD. DarwinBoot also detects EL2 and returns to EL1h (SPSR_EL2/ELR_EL2 eret, HCR_EL2.RW=1, CNTHCTL_EL2=3, CNTVOFF_EL2=0, CPTR_EL2=0, CPACR_EL1 FPEN) as a defensive guard. The observed fiq_context_init panic was already at EL1 and persisted with that guard; the actual cause is Gunyah trapping the EL1 `CNTP_CTL_EL0` write as UNDEF (instr d51be228, PC 0xfffffff0074204fc), fixed by the device kernel patch marble-virtual-timer-only.patch.", "Resources/DTBs/marble-unixnu.dtb removes the stock /chosen linux,initrd-start/end values so the bootloader's real payload range is the only one the driver sees."]
completion = ["Firmware volume builds at the configured size and contains UniXNU, UniXNUDxe, UniXNURamDiskDxe and DarwinBoot; the menu appears on the phone."]
limits = ["The DEBUG FVMAIN is 99% full; a later module needs RELEASE or removal of an unused vendor driver. The console image deliberately has no UFS or root device."]
next_action = ["Build the unverified UFS root image, then decide whether to flash userdata for the root stage."]
evidence = [
  { kind = "host", reference = "firmware/README.md", command = "./unixnu build firmware -D ../UniXNU-marble --uefi ../uefi-marble --edk2 ../uefi-marble/Mu_Basecore", revision = "d1f18525135544426fae87c9497155df7f9e1fc7", result = "DEBUG FD built at 0x300000 bytes from upstream fc9e410d plus the integration patch; build log and FVMAIN.inf list UniXNU.efi, UniXNUDxe.efi, UniXNURamDiskDxe.efi and DarwinBoot.efi; the SEC entry-argument HOB GUID is present in Sec.efi." },
  { kind = "device", reference = "docs/REAL-DEVICE-TESTS.md", command = "fastboot boot artifacts/marble-xnu-console/boot.img", revision = "0a6717c3212147f65c1b59a173dfd1565e9c5adb", result = "POCO F5 / Redmi Note 12 Turbo booted the 3 MiB FD, UniXNU and DarwinBoot into XNU. The console kernel then reached IOKitBSDInit.cpp:984 with `Failed to mount root device` (frames IOFindBSDRoot+0xc88, bsd_init+0x6e8), which is the expected no-root stop. Image SHA-256 d169cb16d8d9bb25b6184bd544ce0d831a6f01499f037ab1424972b67b696b7e." },
]

[[area]]
id = "cpu"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu"]
paths = ["dts/**", "configs/**", "patches/xnu/**", "docs/HARDWARE.md"]
inputs = ["Eight CPU affinities, PSCI smc, GIC distributor 0x17100000/0x10000, redistributors 0x17180000/0x200000, stride 0x40000, 19.2 MHz timer."]
configuration = ["sm7475.dtsi declares cpu0-7, the GIC and the PSCI node. marble.dts tags cpu0-3 E and cpu4-7 P. The SoC patch series adds MAX_CPUS=8, MAX_CPU_CLUSTERS=2 and the Edge scheduler policy."]
procedure = ["Apply the SoC patch series, build the kernel and payload, boot the phone and read the ArmCpu SMP counters and per-CPU work rows."]
findings = ["The vendored stock DT reports Affinity1 core numbers 0x000 through 0x700, so the native-smp-secondary patch is required for secondary CPUs.", "The UFS interrupt specifier now resolves to the GIC: the ADT GIC node carries AAPL,phandle=1 and ufshc interrupt-parent=1. IODTMapInterruptsSharing no longer calls IODTGetICellCounts(NULL).", "Gunyah traps the EL1 CNTP_CTL_EL0 write as UNDEF (device witness PC 0xfffffff0074204fc, instruction d51be228, @sleh.c:1045). marble-virtual-timer-only.patch keeps CNTV enabled and removes the CNTP write, matching the legacy marble port. The kernel now passes fiq_context_init.", "The E/P flags must not be enabled without the AMP patch; MAX_CPU_CLUSTERS would remain 1 and the topology parser would write past its array."]
completion = ["Every enabled CPU reaches its entry checkpoint; timer interrupts and IPIs work on each core; the P cluster carries the UI workload."]
limits = ["Only the boot CPU was enabled in the verified console image (cpus=1). SMP, IPIs and the P cluster are still untested."]
next_action = ["Enable the remaining CPUs and IPI paths, then record per-core counters."]
evidence = [
  { kind = "source", reference = "docs/HARDWARE.md", result = "CPU, GIC and timer values with their vendor-DT source." },
  { kind = "source", reference = "dts/marble.dts", result = "E/P cluster tags and enabled UFS nodes." },
]

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**", "docs/HARDWARE.md"]
inputs = ["UEFI memory map, stock DDR banks, PIL/display/TZ reservations and the firmware FD window at 0xA7100000."]
configuration = ["marble.dts declares a 2 GiB handoff memory node at 0x80000000 and the 0x2B00000 splash reservation at 0xB8000000. payload.adt requests a 4 GiB owned window."]
procedure = ["Compare the DTS handoff, the UEFI memory map and the DarwinBoot free-memory runs; adjust owned_memory_size only after a real-device NO WINDOW or memory-pressure result."]
findings = ["The stock 12 GiB DTB has six DDR banks, but only the low region is a contiguous 2 GiB handoff. The owned window is separate and is placed by DarwinBoot in free memory.", "The memory map reserves 0x1C200000 bytes of PIL, 0x2B00000 display/Demura, 0x10000000 kernel, 0x5000000 OEM VM and 0x20000000 MTE space below 4 GiB."]
completion = ["Memory reservations reconcile with the actual UEFI map; every enabled DMA engine stays inside a mapped range."]
limits = ["No device memory reading exists; owned_memory_size is a conservative 4 GiB choice, not a measured value."]
next_action = ["Read the DarwinBoot window and the kernel RAM/free/available counters on the phone before increasing the window."]
evidence = [
  { kind = "source", reference = "docs/HARDWARE.md", result = "Memory map and reservation table." },
]

[[area]]
id = "storage"
status = "device-verified"
components = ["SoftwareAES", "ShengUfs", "VirtioMmioBlock", "RamBlock", "VerifiedRoot", "AppleKeyStoreState"]
paths = ["drivers/ShengUfs/**", "scripts/**", "configs/**", "docs/HARDWARE.md"]
inputs = ["UFS host 0x1d84000/0x3000, PHY 0x1d80000/0x2000, apps SMMU 0x15000000, UFS stream 0xE0, GCC 0x100000, userdata GPT."]
configuration = ["The local ShengUfs fork adds native-ufs-stream with a 0xE0 default, native-ufs-smmu-takeover and NATIVE_UFS_PROBE_ONLY guards. marble_defconfig selects CONFIG_XNU_NATIVE_UFS and CONFIG_XNU_NATIVE_UFS_FULL; the full build links NativeUfsBlock against the original IOBlockStorageDevice ABI through scripts/data/native-storage-original-bindings.S and scripts/build-storage-bindings.py. The verified-root and Data chains stay off."]
procedure = ["Build the full UFS component with XNU_NATIVE_UFS_FULL=1, boot with native-ufs-stream=0xe0, native-ufs-smmu-takeover=1 and native-ufs-root=1, then read the root-matching line and launchd/authentication result."]
findings = ["2026-11-01 verified image: macOS GitHub artifact verified-root-data (OS policy 04769D26..., SystemOS 8846FE78..., Data seed 6f984785..., owner public key) was used on Linux to build libVerifiedRootProbe.a and a verified kernel with OS/SystemOS policies and Data. kernel.macho SHA-256 46873b37e857dd9f5e8ec58a1f6e01b5bc0f58af2f38e4c02edfae3821b478ed; payload cdf90334d3076338ff58ed5f1791d420d9b7e387d646779227d9db21903b8c89; boot.img 23592cd6ad4b3b2db96c6c825605dc0bde5e562dc0e9ddc298ba3c3493af9e4d. No device test yet. The macOS-15 workflow run failed at seed-data-grow.py (No APFS container found on the attached seed); the image uses the previous successful artifact.", "2026-11-01 unverified tail-root build: marble-root_defconfig enables ShengUfs and links NativeUfsBlock without the verified-root bundle; kernel.macho SHA-256 b1ae430bf1105e433f780ae88c762ddfcb2ab39d96963da4a98ae174f6105918, payload SHA-256 531158dfcc33aed5797ad3bbd9f5c74d4fb16236de39c4bb562f5bee7047a2db, boot.img SHA-256 ce31ab2fa3a8bdf7109ce59c0dc6f653e3fcf05d776b869450c1142538caa611. The userdata image is 9,382,658,048 bytes (SHA-256 fd43ee7035ce185ce4215ac93fdc006fd784a54b3b7442e21457c226cbe03093) and is written only at LBA 59589627..61880314, leaving Android ext4 data at the start intact. The payload opts in with native-ufs-allow-unverified=1 and root-unverified=1.", "The first launchd mount phase exited 66 with `failed to get boot-manifest-hash`; the unverified kernel did not publish `/chosen/boot-manifest-hash`. board.toml now supplies a development-only 48-byte value (SHA-384 of `MarbleBringup.BootSet.v1\\0`) in [adt.chosen.bytes], which the common ADT generator emits at `/chosen`; the boot image changed from 6ac2fc9e... to ce31ab2f.... This is an opaque bring-up identity, not an owner signature. Retest pending.", "The first tail-root boot mounted OS and reached load_init_program, then initproc failed with `Library not loaded: /usr/lib/libSystem.B.dylib` and `no dyld cache` because CONFIG_XNU_OWNER_CACHE_MOUNT and CONFIG_XNU_OWNER_UNION_SYSTEMOS were off. A development-only build now enables both and resolves the SystemOS APFS UUID through package/MarbleUnverifiedRoot.cpp without the owner signature; the verified path stays fail-closed. This is still unverified and has no Data seed.", "Upstream ShengUfs hardcodes stream 0x60; the vendor marble DT uses 0xE0. The fork changes the stream argument and the SMR match scan.", "Device probe 2026-10-31 (read-only, no writes): UFS host/GCC and the SMMU bank-2 takeover work. userdata first=0x2f6a00 last=0x3b037fa (4096-byte LBAs, 224.2 GiB); block0 has no SHNGROOT manifest (manifest status=1, windows=0), so it is the Android ext4 userdata. The geometry is now in board.toml [userdata].", "The first UFS probe reached SMMU planning and stopped at `conflicting UFS stream mapping`. The device reported slot=2 bank=74 smr=800000e0 s2cr=2 id2=5111: the firmware leaves an exclusive SMR for stream 0xE0 mapped to translating context bank 2.", "The fork now accepts that exclusive bank with native-ufs-smmu-takeover=1 and clears SCTLR/CBAR before using it as the driver bypass context. The first takeover build still failed because planUfsSmmu only scanned the top eight banks; the retry range is now the full context-bank count, so it reaches firmware bank 2. The rebuilt probe should continue to the GPT/userdata read.", "The full (non-probe) UFS block class subclasses IOBlockStorageDevice, whose vtable, ctors, dtors, metaclass and inherited methods live in the prelinked IOStorageFamily kext. The bindings were recovered from the reference IOBlockStorageDevice.o (190 slots, 14 pure virtual) and the built kernel.macho: vtable 0xfffffff005cb44c0, metaclass 0xfffffff006add1d0, ctor 0xfffffff00496ed98, D2 0xfffffff00496edb8, D1 0xfffffff00496edbc, D0 0xfffffff00496edc0. They are absolute symbols in scripts/data/native-storage-original-bindings.S, archived into libShengUfs.a by scripts/build-storage-bindings.py when XNU_NATIVE_UFS_FULL=1.", "Host build 2026-10-31: the full UFS root kernel links and prelinks (kernel.macho SHA-256 c3ea36a2b438f2f84bca0e342699b9640dfb61a7631463576674a1b63a1795bd). The IOStorageFamily __DATA_CONST table address in the built kernel still matches the binding, and NativeUfsBlock is present. The matching boot.img is ce8b5f6e57c716ecf0605839734bd2806d4ae470c83d96eb829842caff6147cc and the userdata-root.img is fd43ee7035ce185ce4215ac93fdc006fd784a54b3b7442e21457c226cbe03093 (9,382,658,048 bytes).", "The root is unverified: CONFIG_XNU_VERIFIED_ROOT_PROBE, CONFIG_XNU_OWNER_ROOT_AUDIT and CONFIG_XNU_OWNER_ROOT_TRUST are off and there is no Data seed. The expected device results are a root-authentication panic or a launchd stop on missing /private/var; both identify the next stage.", "The controller, GCC and SMMU bases match the SM8550 layout, but the per-controller clock/power state and the UFS PHY ownership are not measured on marble.", "A probe-only attempt exposed an upstream compile error: timerTicks() and native_ufs_read_ticks were inside the NATIVE_VERIFIED_BLOCK guard. The fork moves them outside it so the transport can be compiled without the verified-root bundle."]
completion = ["UFS registers read, GPT and capacity match, root mounts and launchd starts, Data writes stay inside the measured window."]
limits = ["The unverified tail root reaches launchd and the SystemOS union; launchd then spawns /sbin/mount as PID 3 and the child exits 66 because no boot-manifest-hash is published. The root remains unauthenticated, there is no Data seed, and no verified-root/owner policy is present."]
next_action = ["Provide the verified-root bundle and Data seed, enable XNU_OWNER_BOOT_MANIFEST, then rerun the tail root and record whether mount -P 1 passes. Do not use fastboot flash userdata for this layout."]
evidence = [
  { kind = "device", reference = "docs/REAL-DEVICE-TESTS.md", command = "fastboot boot boot.img (native-ufs-probe=10)", revision = "7f9a3e506235bf69479faf8f47dcda663fa9e658", result = "UFS host/GCC/SMMU takeover and userdata GPT read on marble 2026-10-31; manifest status=1 windows=0." },
  { kind = "device", reference = "docs/REAL-DEVICE-TESTS.md", command = "fastboot boot artifacts/marble-root/boot.img", revision = "7b8f56b4b3c6464c242ec213f835050f118bcc44", result = "OS root mounted from the userdata tail and launchd started with the SystemOS union (libSystem resolved). launchd then spawned /sbin/mount as PID 3; the child exited 66 with `mount[3] exited -- no exit reason available`, the known missing boot-manifest-hash checkpoint. Image SHA-256 6ac2fc9e...; Android first userdata block had remained UNCHANGED after the tail write." },
  { kind = "host", reference = "package/BootProgress.c", command = "./unixnu build payload ... --data-ramdisk artifacts/verified-root-data-old/owner-data/data-3g.dbr && ./unixnu bootimg ...", revision = "7f74d9e0564f7c917e325c25f85515fc106cfa62", result = "Verified kernel/payload/boot image linked from the GitHub macOS owner-policy artifact and local libVerifiedRootProbe.a; verified-root symbols present, Data seed included; hardware_tested=false." },
  { kind = "host", reference = "configs/marble-root_defconfig", command = "./unixnu build kernel -D ../UniXNU-marble --ipsw ../iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw && ./unixnu build userdata -D ../UniXNU-marble --ipsw ../iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw", revision = "0a6717c3212147f65c1b59a173dfd1565e9c5adb", result = "Unverified UFS root kernel (NativeUfsBlock, no verified-root bundle) and 9,382,658,048-byte tail image built and header-checked on the host; no device write." },
  { kind = "host", reference = "scripts/data/native-storage-original-bindings.S", command = "./unixnu build kernel -D ../UniXNU-marble", revision = "f0721e9745c45ad2600cd69c74730f1cca55d56a", result = "Absolute IOBlockStorageDevice ABI bindings recovered from IOBlockStorageDevice.o and the 21H461 prelink; full kernel links with NativeUfsBlock at kernel.macho SHA-256 c3ea36a2b438f2f84bca0e342699b9640dfb61a7631463576674a1b63a1795bd." },
  { kind = "source", reference = "drivers/ShengUfs/NativeUfs.cpp", result = "Stream override implementation and SM8550 register constants." },
  { kind = "source", reference = "docs/HARDWARE.md", result = "UFS, SMMU and GCC sources." },
]


[[area]]
id = "storage"
status = "planned"
components = []
paths = ["drivers/**", "configs/r11_defconfig", "patches/xnu/qcom-emmc-root.patch", "patches/xnu/zzz-no-root-media-panic.patch"]
inputs = ["eMMC 5.1 on sdhci@c0c4000 (0x0C0C4000, core 0x0C0C5000), 512-byte LBA, non-A/B.", "GPT (inputs/partitions.json): boot 245760-376831 (64 MiB), userdata grow from 10944512, 69 partitions."]
configuration = ["[userdata] first_lba 0x14E000, last_lba 0xE8F7FA, lba_bytes 4096.", "CONFIG_XNU_NATIVE_UFS=n and CONFIG_XNU_NATIVE_RAM_BLOCK=n for the first bring-up; the root is mockfs."]
procedure = ["Write a board eMMC driver (SDHCI v5 with SDM660 clocks and GDSC), then enable CONFIG_XNU_NATIVE_RAM_BLOCK.", "Build the userdata image with unixnu build userdata and record the volume UUID back into board.toml."]
findings = ["userdata is a grow partition in the shipped GPT (size 0), so its end LBA depends on the eMMC capacity; the value here is the 64 GiB mapping.", "root_match_volume_uuid is zero until the userdata image exists.", "bsd/dev/qcom_emmc.c (837 lines, added by patches/xnu/qcom-emmc-root.patch) had never executed before boot-irq18: its only entry point is qcom_emmc_rootdev(), called from vfs_mountroot(), and bsd_init never reached vfs_mountroot() because IOKitBSDInit() panicked first while waiting for an IOMedia with Content=Apple_HFS. boot-irq18 adds patches/xnu/zzz-no-root-media-panic.patch so the mount loop runs and the probe reports its verdict on the boot panel.", "The IOMedia wait is the real gate, not just a panic: IOService::waitForService matches IOMedia+Apple_HFS by default (IOKitBSDInit.cpp:906), so a storage driver that merely assigns rootdev is not enough -- something must publish an IOMedia.", "Reference implementation: the OPPO R11T Arch Linux package (HEDC2333, 2026-07-24). Its kernel carries an appended DTB and, decompiled, it is the only known-good description of this board's eMMC. mmc@c0c4000 there requires clocks iface/core/xo/ice (GCC 0x16008 / 0x16004 / xo_board / 0x1600c), a GCC reset, rpmpd power-domain 0, vmmc = pm660l l4 at 2.95 V, vqmmc = pm660 l8 at 1.8 V, 8-bit bus, HS200/HS400. Both rails sit under regulators-0 with compatible = \"qcom,rpm-pm660l-regulators\" and carry no regulator-always-on, so Linux enables them through the RPM co-processor -- which XNU has no driver for. The unmodified boot image is staged at boot-control/boot-archlinux-r11t-ref.img and a repack in this board's geometry at boot-control/boot-archlinux-r11t-oppo.img; booting the repack leaves the panel dark because that kernel only reaches console=ttyMSM0/earlycon, so it cannot be used as an on-screen diagnostic. Never boot the installer recovery: its cmdline carries r11t.install_target=all r11t.storage_write=1.", "boot-irq35 cleared CORE_VENDOR_SPEC to its POR value 0xa9c and CMD1 answered, so the probe moved to the data phase. irq51/52/54 read LBA 1 at 1 MHz and 4.2 MHz with correct bs/bc/sdm and always got 0x4546492045464920 (\"EFI \" twice); irq55 forced the card back to 1-bit with CMD6 and broke the data phase (all-zero + EIO), so that hypothesis is dead. boot-irq56 (tag irq56) drops zzz-emmc-1bit.patch from the series, returns the block clock to ~400 kHz, enables real SDMA (address written and DMA Enable set) with a TC-gated PIO copy of the same block, and adds a CMD13 after the data phase.", "Enceka/UniXNU-e5 (Rongyue E5, Unisoc UMS9621) is the same UniXNU shape with a working eMMC path: scripts/emmc/NativeEmmc.cpp reads LBA0/LBA1, validates the GPT and publishes 70 partitions, all on SDHCI in 1-bit default speed. Its header documents the failure class this board hit: an SDHCI 4.x host (HC2 V4EN) keeps the 32-bit block count at 0x00 and the system address at 0x58/0x5c, while this driver wrote the v3 count at 0x06 and the v3 address at 0x00, leaving the real count zero and the buffer port returning its previous word (\"EFI EFI \"). boot-irq57 (tag irq57) programs HC2=0x3000, uses the v4 count/address and the v4 10-bit clock divider, selects SDMA explicitly, and drops the CMD6 width/HS switch like NativeEmmc.", "boot-irq57 photo (tag irq57): hc2=3000/0003 -- the bootloader left V4EN clear, and forcing it made PIO time out (e=3c) and SDMA fail with EIO (e2=05), d1=d2=0, while CMD13 still reported Transfer (st=00000900). The host is v3 in practice; the v4 forcing is reverted and the boot HC2 selects the layout. boot-irq58 takes E5's other lesson: warm-inherit first (CMD13 on RCA 1 + SDMA LBA1 before any SWRST_ALL/CORE_VENDOR_SPEC/clock/power change), keeps the boot state only when EFI PART arrives, and otherwise falls back to the v3 re-identification path.", "boot-irq58 (tag irq58) black-screened on device: fastboot boot returned OKAY, then the panel went black with no photo. The warm probe ran before emmc_clocks() and issued CMD13+SDMA from an unknown bootloader HS400/8-bit state, the likely bus hang. boot-irq59 (tag irq59) is read-only: enable the GCC gates, publish hc1/hc2/clock/present-state/CORE_VENDOR_SPEC, issue no card command or data transfer, then run the ordinary v3 re-identification.", "boot-irq59 photo: bootloader left HC1=0x38 (8-bit + ADMA2 64-bit), HC2=0x0003 (V4EN=0), CLK=0x0007 (~100 MHz), PRESENT_STATE=0x01f800f0 (card inserted, lines high), CORE_VENDOR_SPEC=0x240a0e (HS400 select-in/DLL). So the card is in 8-bit HS400, while the normal re-identification path sets the host to 1-bit SDMA/400 kHz without first clearing HS_TIMING; irq55 forced only BUS_WIDTH=0 and left HS400 timing on a 1-bit bus, which explains its all-zero/EIO result. The two correct paths are (a) warm ADMA2 with HC1=0x38/8-bit/100 MHz/DLL preserved, or (b) CMD6 EXT_CSD[185]=0 then EXT_CSD[183]=0, then host 1-bit/400 kHz.", "boot-irq60 also blacked (user correction), so the charger watchdog is not the cause and EnableChargerWdog=0 is not a fix. irq55 did not black; every later image did, so the black screen is a regression of the eMMC normal path (most likely HS400/1-bit mismatch wedging SDCC). boot-irq61/62 added the warm ADMA2 path but irq61 fell back to the normal path (REG row hid w); the next test must isolate the normal path instead of adding more transfers.", "boot-irq61 photo (tag irq61): row 3 was overwritten by the match-pass REG row (BootProgress line(3) from the ArmCpu/IOKit register block), so the eMMC w/hc1/hc2/st/de line was invisible. The stage history shows hc2 v3 -> pwrctl ack -> sw reset ok, i.e. the ordinary re-identification path ran, so the warm probe did not succeed; d1=d2=0 and e=e2=0 only mean the normal path had not reached its data command at 281 s. boot-irq62 (tag irq62) is a panel-only fix: move the REG row to row 28, keep the eMMC row on row 3, same warm-ADMA2 kernel as irq61.", "boot-irq62 photo (tag irq62): the eMMC row is visible again and shows w=1, hc1=00/38, hc2=0000/0003, bs=bc=sdm=ok=0, st=00000000, de=0. w=1 means the warm probe failed at CMD13 before the ADMA read: UEFI/SdccDxe left the card deselected/not in Transfer even though the controller still had HC1=0x38/HS400/DLL. Next warm step: send CMD7 RCA1 (R48) first, then CMD13 and the ADMA2 LBA1 read. If CMD7 also fails, the RCA is not 1 or UEFI reset the card; then either preserve the selected state in UEFI or go through re-identification with the correct HS_TIMING/BUS_WIDTH order.", "boot-irq63 (tag irq63) adds CMD7 RCA1 (R48, no busy) before the warm CMD13 and ADMA2, because irq62 showed w=1/st=0 and the card was deselected at handoff. HC1=0x38, CLK=0x0007 and VSPEC=0x240a0e stay untouched. Expected stages are warm c7 ok -> warm c13 ok -> w=3 with d2=EFI PART; warm c7 err means the RCA is not 1 or UEFI reset the card, and warm c13 state/err means the card is selected but not in Transfer. The black screen remains a separate irq55-vs-irq56+ normal-path regression (irq60 also blacked).", "boot-irq63 photo (tag irq63): w=1/st=0, but that build was flawed -- the original CMD13 still ran before CMD7 and the code compared the CMD7 response against 0x900, so the result is not a valid RCA test (the stray CMD13 could also wedge the command line). boot-irq64 (tag irq64) corrects the order to CMD7 RCA1 -> CMD13 -> ADMA2 and uses single-step w codes: 1 boot state/precondition, 2 CMD7 failed, 3 CMD13 failed, 4 ADMA failed, 5 EFI PART kept. HC1=0x38/CLK/VSPEC still untouched.", "boot-irq64 photo (tag irq64): w=2, st=00000000, hc1=00/38, hc2=0000/0003, bs=bc=sdm=ok=0. w=2 is CMD7 RCA1 failing -- the card does not answer the bootloader RCA at handoff, consistent with UEFI/SdccDxe deselecting or powering the card down. The normal path then runs (EMMC st=1266 power/voltage probe, e=0001, p=00). irq55 (PIO, no SDMA) did not black; irq56+ added the normal SDMA LBA1 probe and every later image did. boot-irq65 (tag irq65) removes that normal SDMA probe: LBA1 is PIO-only, d2/r2 stay zero, emmc_read_blocks stays PIO, while the warm CMD7/ADMA2 code remains diagnostic (expected w=2).", "boot-irq65 photo (tag irq65): PIO-only stayed alive to time=308s (no black), so the normal-path SDMA LBA1 probe added in irq56 was the black-screen regression. But LBA1 still read 4546492045464920 (\"EFI \" twice, n=512, s=0), EXT_CSD read as rev0/sec0 and init failed 6; CMD13 stayed Transfer/no error. The card is still HS400 while the host is 1-bit default speed. boot-irq66 (tag irq66) adds the correct CMD6 order after CMD7/CMD13: EXT_CSD[185]=0 (HS_TIMING) then EXT_CSD[183]=0 (BUS_WIDTH), before the PIO LBA1 read. irq55 only did the width half, hence its invalid HS400-on-1-bit result.", "boot-irq66 photo (tag irq66): the HS_TIMING=0 then BUS_WIDTH=0 reset did not change the result -- d1 is still 4546492045464920, n=512, s=0, EXT_CSD rev0/sec0 and init failed 6 -- but the panel stayed alive at time=412s, so PIO-only fixed the black screen and the card-state switch did not fix the data. The hs0/bw1 stage lines had already scrolled out. boot-irq67 (tag irq67) stores each CMD6 as (error<<24)|busy-timeout|R1 and prints c6=<hs>/<bw> on the EMMC2 row, so the next photo says whether the card accepted the switch, returned SWITCH_ERROR, or the command/busy failed.", "boot-irq67 photo (tag irq67): EMMC2 c6=00800900/00800900. Decode: high byte error 0, bit23 0x800000 set (DAT0 busy not released in 200 ms), low 24 bits R1=0x900 (Transfer, no SWITCH_ERROR). So both CMD6 commands were accepted by the card, but the driver continued while the switch was still busy; the PIO LBA1 then timed out at Transfer Complete (e=cc04) and returned the stale word. boot-irq68 (tag irq68) waits up to 2 s per R1b busy, stops before data if still busy, and settles 1 ms before the PIO read.", "boot-irq68 photo (tag irq68): c6 first value 00000900 = HS_TIMING=0 succeeded with no busy/error, but init then returned 60 (ETIMEDOUT), bs=bc=0 and no data command; the bottom state had CMD inhibit set. The BUS_WIDTH=0 step is what wedged -- forcing the bootloader 8-bit card to 1-bit was wrong. boot-irq69 (tag irq69) keeps HS_TIMING=0 only, drops BUS_WIDTH entirely, sets host HC1 to 8-bit (0x20), and keeps the PIO-only data path.", "HuajiFruit/UniXNU-sirius (Xiaomi Mi 8 SE, SDM710/SDCC1 eMMC) is the closest working reference: package/sirius_emmc.c documents that vqmmc is fixed 1.8 V while the controller was left at 3.0 V, so commands work but multi-line data does not; its probe sets POWER_CONTROL=0x0b and HOST_CONTROL2 bit3 before PIO and then reads EFI PART. It stays 8-bit, uses HS_TIMING=1 at 25/50 MHz (EXT_CSD rev8 width2 timing1), uses 32-bit ADMA2 with 8-byte descriptors (the 64-bit form walked past END), scans RCA 1..8 and sends CMD7 R1b, and package/NativeEmmc.cpp publishes IOBlockStorageDevice so IOStorageFamily makes the IOMedia root window. Our irq65-69 ran POWER_CONTROL=0x0f (3.3 V) and HC2 bit3 clear; boot-irq70 (tag irq70) forces 0x0b + HC2 bit3 before the PIO read, keeping 8-bit/default speed/PIO-only.", "boot-irq70 photo (tag irq70): c7 ok st=00000900, hs0 ok, hs0 busy, init failed 60. HS_TIMING=0 was accepted but DAT0 busy did not clear in 2 s, and the 1.8 V write was placed after HS0, so irq70 never executed the sirius voltage fix. boot-irq71 (tag irq71) moves POWER_CONTROL=0x0b + HC2 bit3 to after CMD3 and before CMD7/CMD13/HS0, matching sirius prepare order; the late duplicate is removed.", "boot-irq72 (tag irq72) adds a diagnostic auto-reboot: BootProgress monitor sees qcom_emmc_err != 0, keeps the panel alive for 30 s, then calls reboot_kernel(RB_QUICK|RB_NOSYNC, NULL). This is a reset to the current boot partition (TWRP right now), not fastboot; it only removes the manual power cycle after a failed eMMC run.", "boot-irq72 photo (tag irq72): the autoreboot stage fired, but reboot_kernel(RB_QUICK|RB_NOSYNC) went through IOPlatformExpert shutdown notifications and panicked \"Halt/Restart Timed Out\" after 30 s; the device did not reset. boot-irq73 (tag irq73) calls PE_halt_restart(kPERestartCPU) directly, bypassing the notification timer, and logs PE restart/PE returned/no PE restart on the panel.", "boot-irq74 (tag irq74) removes the autoreboot and adds a native polling USB2 CDC ACM console ported from UniXNU-zeta (pexpert/arm/native-dwc3-console.c). It registers as a pe_serial backend, polls from the rtclock tick, and reads ADT /chosen/unixnu,dwc3-console = {0x0a800000, 0x100000} (R11 ssusb@a800000). Product is r11 XNU log, VID:PID 0525:a4a7. It relies on firmware leaving DWC3 clocks/PHY alive; the zeta QSCRATCH qcom-usb0 override is not enabled for this base.", "boot-irq75 (tag irq75) adds the R11 QUSB2 PHY init at 0xc012000 using the stock DTS qcom,qusb-phy-init-seq, QSCRATCH session bits at 0xa8f8810, and panel diagnostics u=phase/error/gsnpsid. This is a port of the hardware init sequence, not a Linux driver injection; GCC USB clocks/GDSC/VBUS are still not initialized in XNU."]
completion = ["The kernel mounts an APFS root from eMMC and the payload can address block slices."]
limits = ["No XNU eMMC driver has completed a read on hardware yet. UEFI storage exists through the vendor SdccDxe, which is enough to read the payload but not to run the kernel stack.", "Nothing publishes an IOMedia yet, so IOKitBSDInit cannot find a root media; boot-irq18 only stops it from panicking there."]
next_action = ["Boot boot-control/boot-irq75.img manually and read the EMMC2 u=phase/error/gsnpsid field plus the host USB tree. u=0/0/0 means the driver never ran; u=1 with a nonzero gsnpsid is the DWC3 core ID (expect high 16 bits 0x5533 or 0x3331); u=4 means active and the host should show 0525:a4a7 / r11 XNU log.", "If u shows an error or no host port appears, add the GCC USB clocks/GDSC and VBUS/QSCRATCH details from the stock DTS; the PHY/QSCRATCH sequence alone assumes UEFI left those supplies on. If u=4 but no tty, check the CDC descriptors/macOS binding.", "No auto-reboot: the panel stays up for reading."]


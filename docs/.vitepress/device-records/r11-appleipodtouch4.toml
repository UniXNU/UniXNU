procedure = ["Verify charger detection and battery readings from the firmware menu before adding kernel power management."]
findings = ["Charging is not PMIC-only: OPPO VOOC runs through an external MCU, so the vendor charger profile must be replaced with R11 values.", "The watchdog must be disabled or serviced before XNU reaches launchd; the board passes r11-disable-watchdogd=1.", "The minutes-later black screen was first attributed to the PMIC charger watchdog (QcomChargerCfg.cfg EnableChargerWdog=1, no XNU charger driver), but boot-irq60 with EnableChargerWdog=0 also blacked, so that hypothesis is disproved. irq55 is the only non-blacking control: the black screen is a regression introduced by the eMMC normal path changes after irq55 (irq56+ removed CMD6/1-bit, then 400 kHz and the new probe), most likely the HS400/1-bit mismatch wedging SDCC. Keep EnableChargerWdog=0 (harmless), but do not treat the charger watchdog as the cause.", "boot-irq60 also blacked (user correction), so the charger watchdog is excluded. irq55 did not black; every image after it did. The next test must isolate the normal eMMC path: read-only boot state and no emmc_device_init/data command, then see whether the black screen disappears before touching APSS/TZ/PMIC watchdog reasoning."]

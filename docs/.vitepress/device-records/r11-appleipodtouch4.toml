[[area]]
id = "packaging"
status = "implemented"
components = ["XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "inputs/hw.json", "inputs/partitions.json"]
inputs = ["Stock boot image header: version 0, page 4096, kernel 0x8000, ramdisk 0x1000000, tags 0x100, second 0xf00000.", "IPSW: iPhone X 16.5 (20F66), product iPhone10,3, chip_id 0x8011."]
configuration = ["[bootimg.image] mirrors the stock header; [payload] volume R11ESP, size 192 MiB, loader firmware.", "No [[bootimg.dtb_node]]: the stock tree already has /reserved-memory/splash_region."]
procedure = ["./unixnu build kernel -D ../UniXNU-r11 (macOS 12 host, scripts/xnu-clang)", "./unixnu build payload --unique-chip-id <hex> --trust-cache <bundle>", "./unixnu bootimg -D ../UniXNU-r11 --uefi ../uefi-r11-base --dtb ../uefi-r11-base/Platforms/OPPO/r11Pkg/DeviceTree/r11.dtb"]
findings = ["OPPO uses tags 0x100 rather than the usual 0x1e00000; bootimg verifies the load addresses and rejects a wrong offset.", "The boot partition is 64 MiB while the payload is 192 MiB, so the image must go through fastboot boot, not fastboot flash boot.", "The stock boot image is gzip(Image) plus a multi-DTB block of three trees; the firmware DTB for bootimg is the single 16051 tree.", "Measured on this host: kernel.macho 53,792,768 bytes (prelinked, sha256 7cf8d413d5c7edcf...), ADT 15,688 bytes, payload.img 201,326,592 bytes, boot.img 202,670,080 bytes with kernel (BootShim) 1,338,688 bytes at 0x8000 and the payload as ramdisk at 0x1000000. The payload volume holds EFI/UniXNU/unixnu.toml, Payloads/kernel.macho and Payloads/kernel.macho.adt.", "The ramdisk address in the boot header is an offset from ABL's DRAM base 0x80000000, not a physical address: 0x01000000 lands at 0x81000000. The firmware memory map reserves 0x80000000+0x05800000 for kernel and ramdisk and puts SMEM at 0x86000000, so a 192 MiB payload spans 0x81000000-0x8D000000 and covers SMEM, while a 64 MiB payload (boot.img 68,452,352 bytes) stops at 0x85000000. The first device boot of the 192 MiB image showed no output at all after fastboot reported OKAY."]
completion = ["boot.json reports the expected kernel address, tags address and a nonzero ramdisk size, and the image boots to the UniXNU menu.", "Device run of boot-payload-lzma3.img (8,802,304 bytes, LZMA-packed 56 MiB payload): the menu shows the payload entry, selecting xnu runs BootShim to ExitBootServices, prints the CPU state (CurrentEL 1, TCR_EL1 0x2b00803510, ID_AA64MMFR0_EL1 0x1122) and draws the green handoff bar -- the kernel branch was reached on 2026-11-01."]
limits = ["Payload size assumes fastboot boot with max-download 512 MiB (reported by getvar on the reference unit).", "The ramdisk is placed by ABL at ramdisk_addr + DRAM base, so size_mib is bounded by the firmware memory map, not only by the download limit: 192 MiB lands on 0x81000000-0x8D000000 and covers SMEM at 0x86000000. 64 MiB keeps the payload inside the 0x80000000+0x05800000 kernel/ramdisk window.", "ABL silently refuses ramdisks above ~32-56 MiB: 8/32 MiB payloads boot the menu, 64 MiB produces no output. The working payload is LZMA-packed (raw stream, hand-built 13-byte header, dict 32 KiB to fit the LZMA library 64 KiB scratch) and UniXNURamDiskDxe expands it into the kernel window."]
next_action = ["XNU branch was reached but the kernel printed nothing after the handoff bar. Observe whether the device reboots on its own (panic watchdog) or stays dark, then bring up a serial console (SDM660 debug UART) or an early framebuffer console in XNU to capture the first kernel output."]


[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["dts/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = ["Handoff DRAM at 0x80000000 with size 0x80000000; splash reservation at 0xb8000000 with size 0x2b00000.", "Payload owned-memory request is 0x130000000. Device DMA requires controller stream IDs, address widths and ownership."]
configuration = ["device_tree.source = device:dts/sheng.dts; include_dirs = [soc:dts].", "payload.adt.owned_memory_size and firmware reservations describe separate allocations."]
procedure = ["Compare firmware RAM ranges, reserved regions, DTS ranges and ADT memory-map entries.", "Check DMA buffers against controller address width, cache policy and SMMU mapping before submitting work."]
findings = ["macOS 27.3: DarwinBoot lists the free memory outside the kernel's window (the low DRAM bank, about 867 MiB by the firmware's map) and the kernel adopts it as ordinary VM memory, page by page after a probe load (458 MiB on hardware, hw.memsize 6.37 GiB). The aperture addresses of that memory lie below the kernel's static region, outside the addresses the kernel map's ranges share. The built-in arguments keep the GPU pool off (gpu-pool=0); the rest is memory another owner keeps (the probe's load is refused) and stays untouched. payload.adt owned_memory_outside_reserved keeps the audio driver's DSP buffer (64 KiB at 0xd0000000) out. The GPU pool of package/GpuMemoryPool.cpp is used only by a kernel that does not adopt the memory.", "macOS 27.3: the kernel window starts at DRAM bank 1 (0x880000000) and spans the inaccessible range 0x8BB300000..0x8C0000000; DarwinBoot lists that range and firmware-held memory and the kernel leaves them out (expected hw.memsize 5811 to 6067 MiB, was 4864). Not yet run on hardware.", "The macOS kernel was built with the embedded jetsam policy: 196 highwater kills in five boots (com.apple.dock.extra 113, iconservicesagent 62); on the macOS target the highwater and compressor-thrashing kills are removed, as in Apple's macOS kernel.", "The sheng WLAN node exports the wlan ADT name used by wifid matching. It adds service-discovery metadata to the shared DTS; DRAM reservations and DMA resource ownership continue to use the existing board and controller descriptions.", "Physical register translation and CPU virtual mappings have different purposes. Preserve physical resource ranges in hardware descriptions.", "GPU and UFS use different SMMU instances and stream assignments.", "The DTS carries each CPU's cluster type for the ADT (see the cpu area).", "The GPU memory host fixture uses the current trace and task-role interfaces. Image backing reuse and deferred physical release are bounded by the Metal runtime; foreground placement and room-worker allocations can still overlap.", "The exported Bluetooth node carries transport encoding and baud as little-endian u32 properties; its runtime MAC address is derived from the chosen platform identity."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["The DTS declares the current handoff window and splash region; memory sizing requires the selected firmware map."]
next_action = ["Record the firmware memory map and each DMA consumer when changing reserved memory."]


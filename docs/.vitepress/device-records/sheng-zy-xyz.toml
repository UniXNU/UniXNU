id = "usb"
status = "device-verified"
components = ["QcomDwc3"]
paths = [".gitmodules", "board.toml", "drivers/QcomDwc3", "drivers/QcomDwc3/**", "package/UsbProbe.cpp", "package/LegacyDisplayProbe.cpp", "package/ShengBattery.cpp", "package/ShengAdsp.h", "package/AudioProbe.cpp", "patches/xnu-12377/**", "scripts/build-gop-legacy-display-27.py", "scripts/gen-usb27-abi.py", "scripts/gen-usb27-host-abi.py", "scripts/gen-qmp-usb3-table.py", "scripts/usb-xdci-24A446.json", "scripts/usb-xhci-24A446.json"]
inputs = ["AppleUSBXDCI, AppleUSBXHCI, IOUSBDeviceFamily, IOUSBHostFamily and AppleUSBDeviceMux from the 24A446 kernelcache.", "Linux reference https://github.com/ianchb/sm8550-mainline for the SoC sequences and sm8550-xiaomi-sheng.dts for the board."]
configuration = ["drivers/QcomDwc3 is a submodule of https://github.com/UniXNU/QcomDwc3.", "usb=1 runs the driver; 2 adds register sampling; 3 also takes the controller off the bus and back once.", "usb-host=<s> forces host mode after a delay; usb-back=<s> then returns to the cable's role.", "aks-sls=3 reports no passcode.", "board.toml adds the USB device and host stacks to the prelink roots for iPadOS 27 and leaves out AppleOnboardSerial and AppleSMC.", "chip_id 0x8142 comes from board.toml; board-id 0xc and security-domain 1 come from the OS profile.", "The provider's configuration-string is standardMuxOnly."]
procedure = ["Generate the class layouts again after the kernelcache changes.", "Boot and connect to a Mac: the device lists as 05ac:12ab and lockdownd answers QueryType.", "Unlock the tablet and tap Trust: the Mac reports the device as paired and starts a lockdown session."]
findings = ["board.toml documents the adoption of the low DRAM bank, on by default; nothing of the USB controller depends on it.", "The USB controller's buffers come from the VM, which on macOS 27.3 includes the adopted low DRAM bank; no USB memory sits at a fixed address there.", "The [usb ...] board rows come from package/UsbProbe.cpp; package/BootLog.c, which prints them, belongs to the diagnostics area.", "With log-power=1 the boot log has a [pmic rtc] row: the PMK8550 real-time clock's control register and seconds counter, read only. The counter runs but is not wall time, and the system has no real-time clock service yet; the calendar starts one day before the kernel build date until the network time arrives.", "The macOS 27.3 override of board.toml keeps the Bluetooth runtime tool with target macos27 and adds bluetooth=1 to the kernel arguments (864 bytes); the iPadOS settings are unchanged.", "ucsi-delay=<seconds> in ShengBattery.cpp holds the first UCSI command (PPM_RESET) back after the channel comes up; it is a diagnosis of the missing USB input under this kernel and defaults to no delay.", "The [kernel cpu] rows that boot-ui-trace=1 adds to the boot log in BootLog.c do not change the [usb] rows or the USB stacks.", "keyboard=1 in board.toml and the keyboard cover in LegacyDisplayProbe.cpp, BootLog.c and the iPadOS 27 board build start after the USB probe and do not change the USB stacks.", "The boot log's [usb] rows travel in the text slot, which UFS log version 5 writes only up to its last used block.", "payload.runtime.appsync and appsync=1 in board.toml do not change the USB stacks; unsigned apps install over USB through installation_proxy and the AppSync installation hook.", "AppleUSBXDCI programs the DWC3 itself; a subclass supplies the register window at base + 0xc000, one interrupter, power and PHYs. AppleUSBXDCI has no personality, so it needs an explicit kext load before the subclass registers.", "The driver does no cache maintenance. Stream 0x40 needs a stage 1 identity context with write-back inner shareable blocks; through the shared bypass bank the CPU reads stale event words.", "The eUSB2 reference is 38.4 MHz (xo_board 76.8 MHz, RPMH_CXO_CLK divides by 2). With the 19.2 MHz table chirp passes and high-speed data fails.", "Slot 179 of the class keeps the family's configuration list when true, which leaves bNumConfigurations 0; it must stay false without an IOPort transport object.", "lockdownd starts on the IOResources property AppleUSBCableType=USBHost, one of its launch events; configd's USBDeviceConfiguration plug-in then sets the description and the family goes on the bus.", "UCSI reports the cable partner and selects the role. Until it answers, the charger's online value stands in for a host.", "In host mode the family's desired power is 0 once ports are idle, so the xHCI subclass answers on. The device stack answers 0 while the host role owns the core.", "A Mac looks up chip-id, board-id and security-domain in MobileDevice's device map. A pair that is missing makes it ask for a software update.", "SpringBoard accepts a CFUserNotification from a process on the system partition: it compares statfs f_fsid of the executable with /System. The SystemOS union layer has its own number, so native-union-statfs-fsid reports the root volume's number for that layer.", "lockdownd completes Trust directly only in lock state 3. Any other state asks for a passcode.", "The BootLog.c DIO row does not change the USB stacks."]
completion = ["A Mac enumerates the device, usbmuxd lists it and lockdownd answers, at 10 Gbps on a USB 3 cable and 480 Mbps on a USB 2 cable.", "A physical reconnect re-enumerates.", "Trust appears on the panel, the Mac pairs and starts a session, and lockdownd starts installation_proxy, afc, atc and diagnostics_relay."]
limits = ["Sustained transfers and app installation have not run.", "One cable orientation has run on USB 3.", "Host mode runs Apple's xHCI stack and completes commands; enumerating a peripheral is not verified.", "MobileDeviceMinimumVersion has no answer; a Mac treats that as no update needed.", "fairplayd.A2 and adid stay disabled: with both enabled, SpringBoard does not finish starting."]
next_action = ["Run a sustained transfer and an app installation.", "Test the reverse cable orientation on USB 3.", "Verify peripheral enumeration in host mode."]


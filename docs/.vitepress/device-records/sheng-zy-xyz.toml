findings = ["keyboard-lone=1 keeps a report's only touching contact although the controller gives it no confidence; two or more such contacts are still lifted as resting hands. Not yet run on hardware.", "On macOS the touchpad is dead while its reports carry only touching contacts without confidence (3 to 28 s at first use); cause unknown, the KP rows record such reports. The pointer takes movement only between reports with the same contact ids and keeps a click's button until release.", "On macOS 27.3 the cover is a keyboard and a pointer: no Keyboard Power input (macOS reads it as the power key held down) and the touchpad as relative motion, scroll steps and two buttons (wn8030_pointer_report). On the tablet the keys work, macOS's keyboard setup completes and the pointer moves in the right directions (macOS 27.3, 2026-11-10); scrolling and the buttons were not reported on.", "keyboard=1 is in the macOS 27.3 kernel arguments; the cover enumerates there as an I2C HID keyboard.", "The boot ROM answers id 0xc8 in state 0, takes a 65-byte header (state 1), 99 data blocks of up to 503 bytes, a verify command (state 3) and a boot command. The image header's ram_code_checksum is the byte sum of the 49756 code bytes; the header command carries their 32-bit word sum.", "Controller frames start with 0x57 and byte 3 names the content: report 5 keyboard, 6 consumer, 0x19 touchpad, 0x22 to 0x24 vendor messages (0xa2 attach state, 0x64 accelerometer, 0x24, 0x31 and 0x32 authentication).", "SmartCoverServiceFilter matches a service whose usage pairs include Touch Pad, Finger and Keyboard and whose transport does not contain test, and it needs SurfaceDimensions. IOHIDDevice lists only Application and Physical collections as usage pairs, so the fingers are Physical collections of one device.", "The event driver's SurfaceDimensions conversion handles only centimetre units (0x11); the touchpad X and Y extents are 9.35 and 5.55 cm.", "Keyboard Power (page 7, usage 0x66) as a feature and an input element sets KeyboardEnabled, which decides whether the system shows the on-screen keyboard.", "Every I2C transfer runs from the engine interrupt. The keyboard thread sleeps until a controller, hall or engine event or the 12 s keep-awake deadline.", "The controller's touchpad Y grows toward the hinge; the driver sends 2031 minus Y.", "SmartCoverServiceFilter aborts backboardd (index past the end of the hand event's children) when a touching contact with Touch Valid 0 is the last child. The driver sends such palms as lifted.", "While a finger moves, the controller sends about 20 touchpad frames per second at both 100 kHz and 1 MHz."]

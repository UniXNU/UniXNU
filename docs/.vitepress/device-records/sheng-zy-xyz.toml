id = "gpu"
status = "implemented"
components = ["Adreno740", "AdrenoMetal", "AirNir", "Sm8550Platform", "AdrenoPM4", "AdrenoFirmware", "ArmSmmu4K"]
paths = ["package/*Gpu*", "package/*Gmu*", "package/*Adreno*", "package/audit-adreno*", "scripts/*adreno*", "scripts/*gpu*", "scripts/*metal*", "scripts/*turnip*", "scripts/*air*", "package/GpuMemoryPool.cpp"]
inputs = ["A740 GPU/GMU registers, GPU SMMU streams 0/1 and GMU stream 5, signed ZAP firmware and board power votes.", "Turnip, metal2vulkan, AIR translation and the selected OS GPU/Metal ABI."]
configuration = ["Select Adreno740, AdrenoMetal and AirNir; shared SM8550 operations arrive through component dependencies.", "Board scripts combine shared GMU code with package/ShengGmuVotes.c.", "gpu-preempt defaults to 2: requested high priorities use ring 0, normal/low work uses ring 1. Mode 1 sends only low/background to ring 1; mode 0 selects one ring."]
procedure = ["Qualify power, firmware, SMMU and GMU startup before command submission.", "Check memory mapping, command completion and a known rendered image before staging the Metal plugin."]
findings = ["The GPU governor counts a 16 ms window as work only when the GPU was busy for 1 % of it or the ring holds jobs; an idle window's trace of busy time is rest, so the wake boost fires at the first work after a pause (60 to 95 boosts a run on hardware, none before).", "macOS 27.3: DarwinBoot lists the free memory outside the kernel's window (the low DRAM bank, about 867 MiB) and package/GpuMemoryPool.cpp hands it to the GPU driver, which serves buffer objects from it before it takes window memory (gpu-pool=0 turns it off). gpu-bundle-system=1 is off: with the plugin only under /System/Library/Extensions IOGPU refuses it and WindowServer gets no Metal device.", "Fence waiters are woken by the driver's completion pass from the GPU interrupt (gpu-fence-wake=0 keeps the timed pause); a submission no longer cleans the driver's eleven context buffers (8548 KiB each time before); a GPU-denied task submits at background priority; gpu-dcvs-span sets how many 16 ms windows the governor sums (default 1). Not yet run on hardware.", "The Metal runtime discards idle resources that callers declare Volatile and answers Empty when they are used again (gpu-purge=0 keeps them). Not yet run on hardware.", "The GPU governor treats the GPU as idle only after 80 ms without work. One empty 16 ms window at the floor level used to count as idle, so every light frame after it took the wake boost to the top level: macOS at rest spent 96 % of the time above the floor with the GPU under 1 % busy. With the corrected rule the wake boosts at rest dropped from 530 to none in a run.", "Each ring restores its executed page-table snapshot, saves GMEM and runs the SRAM postamble. GMU keepalive covers restore-register writes through the incoming WPTR update; board writes retry AHB-fence drops.", "The shared process queue keeps FIFO across priority changes. Current live Metal requests determine priority, with task GPU role selecting foreground or background.", "All AdrenoMetal clients use one sample by default; NATIVE_METAL_SINGLE_SAMPLE=0 preserves a process's requested sample counts. The frontend implements heap aliasing, swizzles, mip/slice copies, function constants and callbacks, specialized link names, backing-allocation statistics, queue capacity and full viewport/scissor arrays.", "Writable same-user caches cover frontend, runtime and Turnip IR3 artifacts; restricted clients use private caches. Normal builds enable Mesa disk caching and apply the recorded vendor patches.", "The optional wallpaper-freeze=1 mode retains a Poster renderer's first completed large IOSurface draw and parks later runtime commits. PosterBoard and compositor clients keep running. Event 60 identifies the completion boundary and parked commands.", "The current sheng iPadOS 27 image boots and accepts touch interaction, and shader priming covers 280 of 280 selected libraries. Foreground and room-worker 64 MiB allocations still overlap. Focused latency capture retains full-width runtime memory phases, command and pass timings, paired callbacks and allocation roles. GPU pixel collection and per-frame content scans are disabled.", "The kernel GPU ring keeps submission, retirement, display arrival, fence, latch, build identity and the render server's render, encode and completion thread identities; client processes forward nothing else. The decoders read only these records and write touch-window subsets.", "check-gpu-trace.py checks that Turnip's GMEM swap trace (passes, transfers, attachments) leaves only the render server, and the kernel store keeps events 36, 37 and 44.", "AdrenoMetal carries 25 patches over metal2vulkan 963f0e64. The lowering thread, commit submission and pipeline warm pass are off by default and metal-flow=1 enables them for testing. They showed no measured frame rate gain, and one of four boots with them stopped presenting at the logo. pipeline_waits stays Exact because the upstream default drops draws of a pipeline not made in time.", "The macos27 target builds Turnip, the Rust bridge and NativeAdrenoMetal.bundle as arm64e Mach-Os for macOS 27 (LC_BUILD_VERSION platform 1, minos 27.0). The macOS bundle keeps the executable and Turnip in Contents/MacOS (turnip::libraryPath looks beside the executable) and gpu-build.json in Contents/Resources, which codesign seals as data. The macOS payload does not yet carry it ([payload.runtime] gpu_addon = false).", "Mesa's ir3 parser needs GNU Bison 3 or newer (-Wcounterexamples); Xcode's bison is 2.3. The builds take tools from .cache/mesa-tools/bin first."]

configuration = ["boot-progress=2 enables checkpoints; source and image revisions accompany every log.", "On the iPadOS 27 native source path, log=1 plus boot-ui-trace=1 starts a separate process-capture worker. boot-ui-focus3=chronod adds the display-query client to backboardd and SpringBoard. Arm64e return-address PAC is stripped for diagnostic stacks."]

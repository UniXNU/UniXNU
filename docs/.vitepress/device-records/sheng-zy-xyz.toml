[[area]]
id = "storage"
status = "implemented"
components = ["ShengUfs", "VirtioMmioBlock", "RamBlock", "VerifiedRoot"]
paths = ["drivers/ShengUfs", "scripts/*ufs*", "scripts/*storage*", "scripts/*userdata*", "scripts/*root*", "package/SourceRoot*", "package/SourceStorage*", "scripts/make-userdata-*", "scripts/make-nosetup-*", "scripts/make-sparse-*", "scripts/policies/**"]
inputs = ["UFS host 0x01d84000/0x3000; PHY 0x01d80000/0x2000; GCC base 0x00100000.", "GCC AXI, AHB, UniPro, symbol and PHY auxiliary branches; power domains and firmware link state.", "Apps SMMU at 0x15000000, UFS stream 0x60, context-bank ownership, DMA width and cache maintenance.", "LUN 0 uses 4096-byte blocks; userdata spans LBAs 3094592 through 64007162."]
configuration = ["iOS 17 uses CONFIG_XNU_NATIVE_UFS=y. The 23F84 source adapter uses the deferred source archive with native-source-storage=1 native-ufs-root=1; do not also install the old personality.", "userdata defines OS and SystemOS windows. 23F84 payload.adt.root_match_volume_uuid = 546DFF4A-4172-4026-9F1B-7FDAD45F3D2E."]
procedure = ["Read https://unixnu.com/porting/ufs with this storage record.", "Inspect clock enables, power state, HCE/HCS, link state, request-list base and SMMU mappings before changing controller ownership.", "Validate SCSI capacity and GPT reads, then publish root windows and mount the configured root UUID.", "Verify persistent Data writes on the documented Data allocation with a recovery image available."]
findings = ["Verified-root tables of header-only policies are read and authenticated whole at bring-up, but only a SHA-256 of each 4096-byte table page stays wired (about 1 MiB for the macOS 27.3 windows instead of 130 MiB of tables). A block takes its table page from a wired cache of native-vroot-cache MiB (default 8) shared by all windows, or reads it from the .vroot object through the transport, checks it against the kept page hash and caches it; a page that does not match refuses every block it covers. native-vroot-cache=0 keeps each whole table wired. The UFS row shows vt (hits, misses, reads, evictions, waits, refused pages) and vtc (cache pages, wired KiB). Not yet run on hardware.", "macOS 27.3: cs-lazy=1 authenticates a 16 KiB signed block when one of its pages is first validated instead of reading every image whole when its signature is added. Not yet run on hardware.", "Both block devices report Medium Type Solid State; before, every disk logged isssd 0 and swap, read-ahead and I/O throttling used their rotating-disk values. Not yet run on hardware.", "On macOS 27.3 no volume and no swap is encrypted; UFS command slots never ran out (32, peak 13). The signature pass over the dyld shared cache (6873 MiB, about 30 s of every boot in one thread) runs on every processor.", "ShengUfs also owns the apps SMMU stage 1 windows for the display bank (dpu-scanout) and the WiFi endpoint (wifi=2 or more); both are off by default.", "An idle AHB branch may report CLK_OFF with hardware gating enabled. Check enable and gating bits together.", "SMMU bypass still has address-width constraints. Validate every DMA range and context-bank assignment.", "ShengUfs contains controller access, GPT/window parsing and sheng Data/log policy. Reuse each layer according to its inputs.", "iPadOS 26 source-interface build: ShengUfs and all 15 public IOStorageFamily 337.100.1 compilation units produce arm64e iOS 26 objects. Verified-root policy flags remain enabled; four root-path host suites pass ASan/UBSan.", "The Wi-Fi SMMU window is now 128 MiB: the mainline firmware/CE/DP allocation exceeded the previous 48 MiB window on device; stream ownership and 32-bit IOVA base remain unchanged. The display bank's TCR2 SEP field (bits 17:15) is set so IOVAs with bit 31 translate. The userdata reserve past the log and its export region is readable through native_ufs_import_read and is never written by the driver.", "scripts/policies/ipados-* carry the signed root-policy headers (manifest.header.bin, trusted-key.bin, verification.json) of each OS profile; the kernel archives pass scripts/policies/<profile> to build-sheng-source-storage.py with --policy-dir, and the full block tables stay local inputs of the userdata image., and .gitignore keeps scripts/policies/**/*.bin tracked under the global *.bin ignore.", "ShengUfs runs up to 32 commands at once: the request list sits on a write-combined page of its own (as Linux's coherent DMA memory on this non-coherent stream) and slot s uses entry s; without that page 16 slots use the even entries of region A. Completion takes the controller interrupt (GIC SPI 265, UTRCE, UTRD interrupt bit) and wakes only the slots whose doorbell bits cleared; a wait spins for 200 us (native-ufs-spin-us), one WFE between polls instead of 2 us timer pauses, then sleeps on the interrupt, earlier if another thread waits for its CPU; native-ufs-wait=0 restores the timer pauses and 2 sleeps at once. The UFS row shows where commands complete, the spins and the commands still in flight. Not yet run on hardware. Page-aligned buffers are read and written by DMA through a PRDT of up to 1 MiB per command. A full slot pool hands a freed slot to its oldest waiter.", "The link runs HS-G5 Rate A on two lanes in FAST mode as the boot firmware left it (PA_TxGear and PA_RxGear 5, PA_PWRMode 0x11). ufs-bench=1 runs, before the boot goes on, the read tests of the Linux reader's ufsbench on the same LBAs of the root image, compares zero copy with the data-area path, prints the results into the message buffer and restarts into fastboot. scripts/linux-ufsbench.py runs the same tests on the same LBAs under the mainline Linux reader, unattended; scripts/compare-ufsbench.py compares the two.", "NativeRamBlock serves direct Data requests without its gate: reads take no lock, a write holds its page range and the flush lock shared and commits its bits under one lock, a flush holds the flush lock exclusive. A synchronize with no write since the last flush sends no command.", "macOS mounts Data at /System/Volumes/Data. The system volume's /private is empty; /etc, /var and /tmp resolve through the /private firmlink of /usr/share/firmlinks. APFS sets firmlinks only for the Data volume of the system volume's own group, and the owner Data volume is on another device, so macos-owner-data-firmlinks.patch sets each listed firmlink with vnode_setasfirmlink after the mount and follows firmlinks on name cache misses.", "The macOS Data seed comes from /System/Library/Templates/Data (about 0.8 GiB). Its entries are owned by root and service accounts (_windowserver, _mdnsresponder, _postfix and others), so scripts/make-macos-data-seed.py copies it with ditto as root; the iPadOS seed is written with owners off (uid 99).", "The Data seed is carried in every payload beside the 137 MiB macOS kernel, and the packed format holds at most 256 MiB, so the 0.8 GiB template is not copied whole: files below private/, Users/, Library/Preferences/ and Library/Keychains/ (267 files, 18 MiB) are copied, and the other 13004 files become links to the system volume's template, as macOS does for Data.symlink-patterns. The copy goes through a scratch volume so the seed image holds no blocks of the replaced files; the macOS payload volume is 192 MiB."]
completion = ["Host: register, clock, link and SMMU facts match the board inventory.", "Reads: SCSI capacity, GPT and known blocks are correct; OS/SystemOS windows stay within userdata.", "Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region."]
limits = ["The SoC DTSI exports host and PHY ranges. GCC and UFS SMMU handling currently use constants and operations in ShengUfs.", "The root transport uses a polled request slot. Its firmware adoption path requires a usable existing request list.", "23F84 now has deferred source storage registration, original IOStorageFamily/APFS loading, signed policy sidecar handoff and build selection. These latest changes have not been built or run: the user explicitly stopped testing. Runtime class/interface compatibility, root mount and persistence remain unqualified. See reports/ipados26-source-storage-runtime.json.", "The macOS Data template has 19 entries with the restricted flag (Library/StagedExtensions, private/var/db/oah and others). With System Integrity Protection enabled on the build Mac no process may set that flag, so make-macos-data-seed.py copies them without it and fails on any other copy error; on the device those Data directories are not SIP-protected."]
next_action = ["Record clock/PHY/reset initialization ownership and the SMMU stream before adapting this driver to another board."]


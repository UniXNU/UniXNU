configuration = ["Select GopFramebuffer; CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y; artwork-display-gamut = sRGB.", "vsync=120 requests board display timing.", "dpu-scanout=2 lets the display pipes fetch the compositor surface through a stage 1 window of the display bank (TCR2 SEP 7); off by default. The flip waits for the GPU fence of the frame (always on).", "backlight=1 starts the backlight driver; backlight-control=0 leaves out backlight-control and the AppleARMBacklight metaclass answer."]
procedure = ["Verify GOP address, dimensions, stride and pixel layout before enabling presentation.", "Build the late display archive with the selected OS ABI records, then check display publication and frame presentation."]
findings = ["macOS 27.3: QuartzCore presents half float because the device answers as virtualized (vmm-present); ca-fb-8bit=1 makes WindowServer present 8-bit BGRA, which the display pipes scan out directly. Not yet run on hardware.", "macOS: WindowServer presents half-float frames that are already encoded; fb-half=2 in the macOS kernel arguments takes them as such, and the grey cast of the linear reading (fb-half=1) is gone on hardware.", "The GENI I2C core also moves buffered transfers of any length for the keyboard cover; the backlight register transfers are unchanged.", "iPadOS 27 reads the nits range from IODisplayParameters.BrightnessMilliNits and sets brightness-nits as signed 16.16. CoreBrightness needs backlight-marketing-table and backlight-calibration-parameters to create the display. BrightnessControl reads LmaxProduct as 4 bytes of 16.16 and LmidProduct and LminProduct as numbers; a zero LmaxProduct makes every slider position the maximum. iPadOS 17 uses brightness and FadePeriod; the service accepts both.", "ADT vmm-present makes MobileGestalt answer IsVirtualDevice, and iPadOS 27 CoreBrightness then selects VMBLControl, which drops every brightness request. AMFI and many frameworks need the answer, so UniXNU scripts/appsync/BacklightMode.m changes only backboardd: initBLControl: gets mode 1 instead of 3.", "The board archive records SmmuBypass.h and AppsSmmuLock.h from the resolved board package directory as Bluetooth build dependencies.", "The 24A446 display adapter declares fixed original targets. XnuPrelink relocates BTI/B stubs after native segment placement; a cached native-slide value is no longer used. The 2026-11-02 device log showed the unrelocated constructor branch jumping to 0xfffffff00dbb4c74 instead of 0xfffffff00a288c74, an excess of 0x392c000.", "The display source and ABI binding are selected independently from the physical panel configuration.", "The board configuration declares sRGB for the current 8-bit framebuffer path.", "scripts/build-gop-legacy-display.py also builds the board driver objects in the display archive, including the ADSP, IPC router, FAT reader and battery manager.", "With dpu=2 DisplayTimingProbe reads the VIG 0 and 1 pipes, CTL 0 and the tear checks; dpu=3 also rewrites the pipe addresses and times the flush latch (5.4 ms, no start needed: the panel refreshes by itself).", "Direct scanout: the compositor submits a swap when the command buffer is scheduled, so the flip waits until the GPU wrote the frame; the wait removes the flicker (content changes of the shown surface fell from 808 to 2 per run). Direct scanout needs the 8-bit BGRA framebuffer.", "The GENI I2C core also moves 1 to 8 byte writes and 1 to 4 byte reads (the audio amplifiers use 32-bit registers); the backlight keeps its 8-bit transfers.", "The legacy display builder now refuses arm64e/iOS 26 before reading original ABI addresses. Its existing use of kernel_target.TRIPLE does not qualify the iOS 17 class layout for 23F84. Source input transport compilation is independent of this builder.", "The 24A446 adapter creates a BGRA IOSurface through the original IOSurfaceRoot factory, checks allocation and geometry, and transfers its reference to the family default-surface field. The void create_default_fb_surface slot is invoked by the original start method.", "build-gop-legacy-display-27.py reads the device checkout from UNIXNU_DEVICE (set by the release) before the sibling directory name, so a checkout under any name works., and the HID source is the tree pin (refer/IOHIDFamily of the feed) instead of a hand-placed driver-sources copy.", "The 24A446 board archive resolves QcaBluetooth from the assembled tree before the device fallback, matching the selected runtime component.", "The late probe starts USB through the weak sheng_usb_probe, and the board package build compiles QcomDwc3."]
completion = ["A known frame appears with correct geometry and colors, then userland presentation and backlight controls work."]
limits = ["The late display builder needs qualified prelink candidates and ABI records. A timing request requires a measured presentation result. The 24A446 default-surface adapter still requires a hardware boot result.", "On iPadOS 27 backlight off on sleep is not verified. The range of 2, 140 and 500 nits is not measured and only sets the slider's scale."]
next_action = ["Record frame timing, pixel format and presentation evidence for each image used to qualify display.", "On iPadOS 27, verify that sleep turns the backlight off."]


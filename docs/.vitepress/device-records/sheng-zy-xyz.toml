findings = ["[gpu dcvs why] rests= counts the pauses the governor saw; 0 over a run with pauses means every idle window was taken as work.", "[gpu switch timeout] keeps the CP state (the [gpu stall] words and the ring progress words) of the first two ring switches the CP never finished.", "[map met] follows [map fails]: what the last refused GPU mapping asked (address, bytes, 'again' where its handle was mapped already) and the mapping at or past that address. A kernel memory allocation that fails prints a kmem_alloc line in the message stream: size, flags, result, the free, reserved and wired page counts, the kernel map's bounds and its ranges. [memory outside] gives the pages the kernel adopted and left; [gpu bring-up] keeps the GPU probe's rows in the order they were set with its stage and the first failed kernel allocation; [touch cost] counts the touch thread's interrupts, wakes, reads and their time; [cmdline] shows what the kernel parses. autoreset marks the bootloader cell and arms the hypervisor watchdog as the first thing after the scheduler starts.", "Every slot has a [cmdline] row: the length of the command line the kernel parses, whether autoreset parses, and its last 80 characters.", "diag=1 keeps the normal board rows and the message stream and adds [diag msgs], the latency lines of the kernel messages new in each round. Every slot has [log round] (last, longest and slowest step of a round); a watch thread reports a round running over 10 s, and the panic flush names the step a round was in and marks a panic that left no text. New rows: [gpu jobs]/[gpu long]/[gpu slow], [gpu kick], [gpu pool views], [edge queued], [cs sha]. Not yet run on hardware.", "macOS 27.3: gpu-bundle-system=1 (the Metal plugin only through a union over /System/Library/Extensions, /Library/GPUBundles covered) left WindowServer without a Metal device: IOGPU's trusted-bundle check refuses the plugin there, WindowServer aborted in WSSystemCanCompositeWithMetal (run64). It stays off.", "The board log gained rows for fence wakes, GPU maintenance by kind, submission time, GPU priority requests, CPU wake and timer statistics, UFS command paths, code signature preparation, the Edge scheduler and stuck threads with the waited object and file. Rows that divide ticks by the counter frequency read 1.25 times high on macOS, whose timebase is scaled to 24 MHz.", "With log-power=1 the boot log has a [pmic rtc] row: the PMK8550 real-time clock's control register and seconds counter, read only. The counter runs but is not wall time, and the system has no real-time clock service yet; the calendar starts one day before the kernel build date until the network time arrives.", "The macOS 27.3 override of board.toml keeps the Bluetooth runtime tool with target macos27 and adds bluetooth=1 to the kernel arguments (864 bytes); the iPadOS settings are unchanged.", "With log-power=1 the boot log has [pmic chg] rows: the charger PMIC's boost, charger, DC-DC, battery interface, USB input, Type-C and misc pages, registers 06 to 0d and 40 to 47, read through the arbiter's observer channel. The [fb centre] row prints the centre pixel of half-float frames in thousandths.", "With boot-ui-trace=1 each boot log slot has a [kernel cpu] section: the CPU time of all kernel threads in the last 10 s and the eight threads that used the most, by name. On macOS 27.3 under memory pressure it showed VM_swapout and VM_cswap_trigger at 12 s of CPU per 10 s.", "The boot log K row shows the keyboard cover stage, boot ROM states, frames, reports, attach and hall state, I2C failures and the HID device counters; scripts/check-wn8030-host.py tests the controller codec.", "HidInputProbe logs [hid] digitizer usage pair published at +N ms each time it restores the pair.", "The device cache-only export contains five files and confirms identical parser, system-path and Data-path bytes with the packed cache as an exact prefix plus 55 stale bytes. GENI retains failed IRQ status for bounded error reports.", "A published parser-input snapshot triggers one cache-only export to the reserved diagnostic region. The export contains the immutable input, both fixed cache paths and the loader log, without starting GPU or latency capture.", "The shared bypass register fixture covers UART14 joining the touch bank with 64-bit physical DMA addresses and preserves the touch stream.", "A source implementation, a host check and a device observation establish different completion levels.", "Keep an unresolved cause explicit and record the next measurement that can distinguish it.", "The UFS log carries [adsp], [qrtr], [battery], [battery-raw] and [charger] lines for the DSP, the IPC router and the charger.", "BatteryProbe starts the battery with adsp=2, so the [battery] and [charger] lines appear on every DSP image; a missing [battery] line on such an image means battery=0 or a failed start.", "Host checks for the ADSP path: check-adsp-host.py, check-modem-fw-host.py, check-qrtr-host.py and check-battery-host.py.", "The log carries [audio], [amps], [audio-glink], [audio-buffer], [mic] and [mic regs] for the audio path, and [gpu wptr] for fenced GPU write pointer writes.", "GPU memory rows: [vm map], [vm unmap], [vm kinds] (time per owned map, fast and full import, unmap by page and by ASID) and [bo memory]. Governor rows: [cpu gov] with boost and frame-floor counts, [cpu throttle] and [gpu dcvs] with touch and wake boosts. [touch doze] counts the doze requests sent to the touch controller, the refused ones and the frames read after the last request. Display rows (dpu=2 or 3, dpu-scanout): [dpu vig0], [dpu vig1], [dpu ctl0], [swap surfaces], [direct scanout] and [dpu smmu].", "The 23F84 branch lock and source-driver report describe different stages: unixnu.lock covers the selected minimal build, while reports/ipados26-source-drivers.json records separate public-family compile inputs, object hashes, warning counts and unresolved imports. Neither report qualifies source-driver device execution.", "unixnu.lock records the sm8550 source at the same commit as feeds.toml; fetch rewrites it, so a hand edit and a fetch must agree.", "scripts/check-sheng.py reads the firmware checkout from UNIXNU_UEFI, which the firmware step of unixnu sets for its preflight scripts.", "The direct scanout log labels native_legacy_direct[12] as waits>=250ms. This counter records a slow GPU wait; direct display retries busy queries and keeps the current frame until completion or swap cancellation.", "kernel.latency.bin pairs IPC send attempts and receive completions by message cookie, records user exception registers, accepted GPU frequency votes and touch coordinates, and exports a bounded LAT1 ring before filesystem logs. Events 61-63 expose encoding batch waits, frontend phases and render-thread identities; client samples mark the selected render thread with state 0x1000, and CPU process names follow xpcproxy exec. The exporter prioritizes the complete backboardd frames.trace before optional CPU reports; framework files, unified logs, shader inventories and images are excluded.", "Detailed capture records slow encoding operations, callback and destructor identities, outgoing IPC/reply ports, blocked-thread user/kernel stacks and Mach service peers. Faults retain registers, bounded worker-read stacks and image UUIDs; signal exits include reason descriptions. gpu-perf=1 enables the 19-counter A7XX BR plan with selector, reset and preemption validity. The source-storage archive includes the latency capture object.", "LAT1 separates 32768 fault/identity records from 491519 ordinary events and one coverage summary. IPC keeps traced requests, matching receives and tracked replies, with unmatched or ambiguous traffic counted. Tracking tables are allocated when capture starts and do not occupy linked kernel data. Pending display queries retain state changes, a 100 ms heartbeat and omitted counts. Idle runtime stages and duplicate generic IOKit/GPU/IPC streams are excluded before recording. Fast unannounced resource spans below 250 microseconds are omitted; paired callback spans remain. Dispatch task tracing uses the optional introspection SPI.", "The latency capture keeps only seven-issue evidence: the backboardd frame trace, kernel GPU submission and display records, large GPU allocations, CPU occupancy and process CPU time, 4 ms samples of the render server's render, encode and completion threads and SpringBoard's main thread, blocked-thread waits, faults with exit reasons, shared-region unnests with kernel and user callers, and touch report times that bound the analysed windows. Mach message flow, user-client calls, contiguous allocations, per-contact touch records and dispatch points are not collected, and their xnu hooks are removed from the series. The export reads the sampler rings at their allocated sizes.", "scripts/sheng-latency-report.py prints the acceptance figures of a capture inside touch windows: frame intervals, large allocations, full-screen pass times, slow completions, encode thread priority and run-queue share, client crashes and Metal refusal texts.", "shots=<s> adds bursts of six quarter-resolution screenshots 50 ms apart, one burst every 10 s, as screen-<s>-<index>.bgrx; they are compared by code with a system memory reference tile by tile. With SHENG_GPU_TRACE the render server's Turnip sends its GMEM passes (36), transfers between tile memory and memory (37) and attachments (44) to the GPU trace, decoded by decode-gpu-trace.py.", "Disabled GPU/display groups skip collection, formatting and register reads. Wi-Fi fixtures cover native control, association events, RX batching, DMA capacity, cache serialization and VFS firmware reads.", "check-bluetooth-runtime.py validates the actual packed runtime, signatures, firmware, launchd jobs, preserved trust modules and Data seed. The bluetooth-runtime boot row records library and executable mount stages.", "Full image extraction verifies the Bluetooth startup, protocol, DMA, transport, firmware and diagnostic exports. The panic screen remains enabled with no automatic reset.", "Cache-loader capture uses the log writer's relative boot time and requires cache-log=1. On a 24A446 launchd cache failure this flag also records the parser input length, head, trailer and complete FNV-1a hash through bounded copyin reads. Bluetooth allocation failures emit one cached selection row without rescanning MMIO.", "The [usb] rows report QcomDwc3 state from native_usb_stats. The boot log allocates its large buffers at run time, including the 128 KiB message ring, because the kernel's __DATA has no room with the USB stacks prelinked.", "UFS log version 5 writes per 2 s round only the used blocks of the text slot, the message-area blocks that new kernel messages reached, and the header. The message area is a ring of the message stream (msg_mode 1, msg_head bytes appended); the panic flush and diag=1 write the linear form (msg_mode 0). read-sheng-log.py decodes versions 1 to 5, and check-boot-log-host.py covers wrap, quiet rounds, a replaced kernel ring and a failed write.", "The [data] DIO row reports Data disk requests (count, MiB, time, lock wait, longest), synchronize calls, the store window's UFS commands, the command slots (in use, peak, waits) and the root window reads with their transport and integrity check time.", "package/linux-log/ufsbench.c is a static aarch64 Linux program without libc: O_DIRECT reads of a fixed-seed sequence of offsets at queue depths of forked processes, one line per test with IOPS, MB/s, mean, p50, p99 and longest latency."]

[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu", "ArmDTPlatform"]
paths = ["package/CpuFreq*", "scripts/*armcpu*"]
inputs = ["SM8550 CPU affinities, GIC distributor at 0x17100000, redistributors at 0x17180000, 0x40000 stride and 19.2 MHz timer.", "PSCI uses SMC. All eight CPUs are enabled; the DTS tags cpu0 to cpu2 (A510) as an E cluster and cpu3 to cpu7 as a P cluster with unixnu,cluster-type."]
configuration = ["dts/sheng.dts includes sm8550.dtsi; shared CPU and interrupt definitions come from the SoC source.", "Kernel arguments select smp=1 and armcpu-spi-ipi=1."]
procedure = ["Compile the board DTS and inspect enabled CPUs, GIC ranges and timer properties in the ADT.", "Record per-CPU entry, timer interrupts and inter-processor interrupt delivery."]
findings = ["macOS 27.3: timebase-user=1 lets userspace read the 5/4 scaled timebase without a trap; the kernel changes libsystem's counter path in place after code signing validation. Not yet run on hardware.", "armcpu-edge=1 with the two-cluster matrix of zzzzzzzzzzz-sheng-edge-matrix.patch lets an idle P core take waiting E work; without the argument no thread moves between the clusters (macOS runs 56 to 61: the busiest E core at 90 % or more in 13 to 28 % of the rows). Not yet run on hardware.", "The cores are registered without a power gate latency, so every IODelay of a thread blocks on a timer; armcpu-idle-latency-us sets one (default 0).", "cpufreq=4 is in the macOS 27.3 kernel arguments; the probe runs there unchanged.", "CPU affinity values are hardware identifiers. Enabled CPU count and MPIDR affinities must be checked together.", "GIC register ranges must use translated physical addresses from the hardware tree.", "XNU accepts work interval operations 6, 7 and 8 (interval start, update and finish) through patches/xnu/native-work-interval-instance.patch in UniXNU; without a performance controller they only succeed.", "patches/xnu/zzyf-sheng-amp.patch runs the Edge scheduler with the E and P clusters from the ADT; UI work stays on the P cluster and coreduetd is stopped."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["CPU selection and frequency policy are board inputs; SoC topology describes all cores."]
next_action = ["Attach per-CPU and interrupt observations for the selected firmware and image."]


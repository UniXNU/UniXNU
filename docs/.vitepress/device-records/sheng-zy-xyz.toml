[[area]]
id = "arm64e-os"
status = "planned"
components = []
paths = ["package/SoftwareAesProbe.cpp", "scripts/software-aes-26C5035r.json", "configs/*ipados26*", "patches/xnu-12377/**"]
inputs = ["iPadOS 26.5.2 build 23F84 IPSW for iPad17,1 to iPad17,4; target identity iPad17,3 J820AP.", "Public XNU source xnu-12377.121.6; arm64e profile requirements in https://unixnu.com/porting/arm64e."]
configuration = ["board.os_profile = ipados-26.5.2-23F84 with [os] arch = \"arm64e\"; kernel defconfig sheng_ipados26_defconfig selects the full sheng component set; the xnu-12377 patch series is split into arch, SoC, OS and device layers.", "Payload kernel arguments: -v serial=3 debug=0x14e kt_fixed_zones=120 -no_slto_panic; no install menu.", "The arm64e build uses the BCM2837 machine config restored for xnu-12377, the non-SPTM pmap and no Apple CPU counters."]
procedure = ["Check FEAT_PAuth, EL1 key register writes and PAC instruction behavior on all eight CPUs.", "Build the arm64e kernel from xnu-12377.121.6 with the ported 4 KiB patches, then prelink the 23F84 kexts.", "Follow the bring-up order: arm_init, bsd_init, root mount, launchd, SpringBoard."]
findings = ["The xnu-12377 device series gained vmwait-dyld-pager-source-release.patch (the dyld pager held its source page busy while it faulted the other three 4 KiB parts of a 16 KiB fixup page; APFS verified page-in then waited for the thread's own page, and on macOS every later private mapping of the file waited too) and zzzzzzzzzzz-sheng-edge-matrix.patch (a two-cluster Edge matrix the scheduler accepts). Not yet run on hardware.", "On macOS 27.3 the software AES accelerator is compiled against the 26C5035r class layout and started by its board probe; AppleImage4 finds it at boot.", "The series ends with sheng-appsync-runtime.patch and sheng-appsync-user-trust.patch. appsync=0 disables their mounts and registration; trust_cache_rt_storage stays writable in either case.", "After load_machfile, exec clears the platform status of an appsync user .app main executable, so the app runs without platform restrictions, the hardened IPC policy or the platform-only mapping rule.", "The shared region slider and the dyld pager use the upstream per-process jop_key checks, so arm64 processes (key 0) get unsigned pointers; the arm64e profile runs arm64 processes at EL0 with the PAC keys off.", "The matched 24A446 failure frame publishes a bounded 4 MiB copyin snapshot through a weak board callback before process teardown.", "The 24A446 cache failure diagnostic uses the selected launchd frame layout and bounded copyin reads to record parser input under cache-log=1.", "The 23F84 kernelcache is xnu-12377.122.8; xnu-12377.121.6 is the closest public source.", "SM8550 CPUs implement FEAT_PAuth; signatures are created on the device, so the PAC algorithm need not match Apple's.", "Public XNU programs PAC keys only for VMAPPLE through HVC; the arm64e profile provides native key programming.", "The 23F84 dyld cache is arm64e and contains SME code; SM8550 has no SME.", "The arm64e xnu-12377.121.6 kernel compiles and links as MH_EXECUTE with chained fixups.", "The 23F84 kernelcache is an MH_FILESET with stripped symbol tables; kext code branches directly into the kernel, so the prelink step for iPadOS 17 does not apply.", "The bringup patch includes sys/proc.h at its exception record: the RELEASE-config fileset reference build compiles the same tree without the DEVELOPMENT block that carried proc_pid's declaration.", "The shared xnu-12377 device series carries latency, fault-detail and signal-exit hooks backed by BootLatencyTrace.c. The capture is enabled by diagnostic export; qualification of another OS profile requires its own build and device evidence.", "The iPadOS 27 kernel keeps the board user-fault and exit hooks and adds the shared-region unnest hook; the IPC send/receive, user-client call and contiguous-allocation hooks are no longer patched in.", "The selected device series supplies the launchd cache/executable overlays and the bounded 540-byte IEEE80211 association event transport for 24A446.", "The 24A446 Bluetooth runtime patch compiles with the target kern_exec command. The signed native daemon retains its identifier and all original entitlements; the platform service carries typed properties for native transport selection.", "The device series relaxes the disabled-signal assertion in processor_cpu_reinit once sheng_sigp_recover has run."]
completion = ["The arm64e kernel reaches launchd on sheng from the 23F84 root volume, then SpringBoard."]
limits = ["Facts: only the boot core has a recorded PAC check; the other seven cores are unmeasured.", "Facts: no fileset prelink output exists yet, so the kernel has not booted.", "Facts: the storage, AES, HID, platform power, Adreno and GOP binding archives use original kext addresses recorded from the iPadOS 17 kernelcache; the iPadOS 26 kernelcache has no symbols for them.", "Guess: the SME functions are selected at run time from hw.optional and commpage features; this is unconfirmed."]
next_action = ["Produce a fileset kernel collection from the native kernel and the selected 23F84 kexts.", "Read ID_AA64ISAR1_EL1 and ID_AA64ISAR2_EL1 on all eight CPUs and run a PACIA and AUTIA round trip on each."]


inputs = ["WCN7850 PCIe endpoint, MSI routing, DMA callbacks and hash-pinned amss.bin, m3.bin and board-2.bin."]
configuration = ["wifi=5 selects the mainline cfg80211/mac80211/ath12k runtime; wpa_supplicant 2.12 owns userspace authentication.", "WifiProbe supplies power/PCIe/MSI and the 128 MiB DMA window; WifiNet exposes en0/Apple80211. The DTS exports /arm-io/wlan for wifid.", "The signed service runs at /usr/libexec/unixnu-wpa_supplicant. package/WifiFirmware.h defines the shared loader/packer directory /private/var/ngpu/firmware/ath12k/WCN7850/hw2.0/."]
procedure = ["Run host checks affected by source changes, build the kernel/payload/boot image and verify packed inputs.", "Check scanning, association, DHCP, traffic, cancellation and signal display on the device; measure throughput, jitter and heat."]
findings = ["The wireless daemon reaches the driver through its user client: the interface grants it to airportd, sharingd and wifivelocityd, a set request without a length takes the sent length, the capability reply states scan completion, and a scan-results request rewinds the result cursor. On hardware the daemon's scans complete without error and return 5 to 13 networks.", "wifi-aj=2 keeps the unattended-test join beside the wireless daemon: the kernel joins the network of join.txt, does not carry out the daemon's disconnect requests, and en0 gets its address by DHCP (192.168.10.x on hardware, the router answers ping). wifi-aj=1 stops once the daemon acts.", "Apple80211 byte replies (country code, SSID, BSSID) to a request the kernel made are copied with memcpy: its buffer is a kernel buffer, which copyout refuses. With that the wireless daemon's scan and country requests succeed on macOS 27.3.", "Receive path: packet metadata lives in heap memory instead of the uncached DMA window, the spare receive mbufs are kept between batches, and a frame is classified from its copy; log-wifi=1 adds per-stage times and TCP order counters. Not yet run on hardware.", "With log-power=1 the boot log has a [pmic rtc] row: the PMK8550 real-time clock's control register and seconds counter, read only. The counter runs but is not wall time, and the system has no real-time clock service yet; the calendar starts one day before the kernel build date until the network time arrives.", "WifiProbe.cpp also hosts the read-only charger PMIC survey for the power log (sheng_charger_pmic_sample); the WiFi power sequence is unchanged.", "On macOS 27.3 (26C5035r) the module's frames travel over en0, an IOEthernetController of the original IONetworkingFamily; the supplicant is built for macOS and its job is a plist in /Library/LaunchDaemons. Association, DHCP and traffic are verified on the device.", "The supplicant job runs with -q -s and no StandardOutPath: warnings and errors go to syslog and logd's bounded store, and no Wi-Fi log file grows on Data. The Ath12kWifi pin builds the supplicant with CONFIG_DEBUG_SYSLOG.", "Device verification covers Wi-Fi toggling, SSID scanning, WPA2 association, DHCP, traffic and join-result delivery.", "Accepted joins complete after port authorization, cancel once and time out after 30 seconds. Association and cached peer RSSI supply signal updates.", "TX/RX use direct copies, shared DMA storage, bounded reuse and batching; mac80211 supplies aggregation, reordering, FQ and AQL.", "Data firmware reads wait for addon installation. Packaging validates file hashes, service/cache signatures, stock jobs, trust modules and the preserved Data seed.", "The shared runtime cache retains the native Wi-Fi jobs and adds the supplicant alongside the Bluetooth service configuration; the original Data seed and existing trust modules are preserved."]
completion = ["Scanning, association, address configuration and sustained bidirectional traffic pass with the selected firmware."]
limits = ["Current-image device checks pending: cancellation/timeout completion, runtime signal display, Data firmware startup, throughput, jitter and heat."]
next_action = ["Complete the pending device checks and tune packet processing, scheduling and power from the measured results."]


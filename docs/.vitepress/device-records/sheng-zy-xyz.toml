findings = ["The built-in arguments of package/BootWatchdogPolicy.c carry the defaults a run may override on the command line (gpu-pool); the adoption of the low DRAM bank is on without an argument and memory-outside=0 turns it off.", "A run's extra kernel arguments are placed before the board's on the command line, so autoreset and the log switches are parsed first.", "macOS 27.3: with boot-payload-release=1 the kernel returns the GPU addon blob and the packed Data seed inside the boot image to the VM once they are installed (about 40 MiB); loader_inputs records where the payload RAM disk lies in the firmware's memory map (sysctl kern.boot_payload_memory). Not yet run on hardware.", "The macOS 27.3 override of board.toml keeps the Bluetooth runtime tool with target macos27 and adds bluetooth=1 to the kernel arguments (864 bytes); the iPadOS settings are unchanged.", "The iPadOS 27 kernel embeds the pinned keyboard controller image (82524 bytes).", "The AppSync runtime applies native ad-hoc installation and FrontBoard trust to every user .app tree on Data. Rejected unsigned, fakesigned and expired bundles are repaired on device by the source-pinned ldid library inside installd, preserving entitlements, then revalidated. XNU registers validated CodeDirectory hashes on demand before AMFI checks, covering new apps, updates and nested code without per-app build inputs. Runtime hashes remain in the boot trust bundle; Data and original trust modules are preserved. Exec runs these apps without platform status. An unsigned arm64 app installs over USB, launches and stays installed across reboots; reports/ipados27-appsync.md describes the runtime.", "Addon replacement sets va_data_size explicitly with va_mode after a successful write, removing stale tails when kernel vnode_open leaves an existing size. The host fixture reproduces and removes the observed 55-byte tail.", "The cache-only export retains full plist bytes from the parser and filesystem; it is enabled by cache-log=1 and preserves the existing Data seed.", "The 27 patch series includes the opt-in launchd cache-input diagnostic; payloads retain the panic screen with automatic reset disabled.", "The next 24A446 device run passed the display branch but aborted in vfs_fsadd+0x364: APFS still referenced an old vnop_mknod descriptor address, which now held zone_array data (index 0xaaaaab). XnuPrelink now pins 13 missing vnode descriptors, four metaclass pointer slots, gIODTPHandleKey and audio_active by data identity and source consumers. A subsequent run mounted the OS root and SystemCryptex, then stopped because the payload omitted its Data seed. The payload now rejects CONFIG_XNU_OWNER_DATA_MOUNT without a seed; a persistent overlay also requires the original seed.", "Fileset adapters contain N_ABS function branches without split-segment records. XnuPrelink now retargets them after placement and rejects destinations outside retained executable code. The final packed 24A446 kernel passes checks for 266 branches and five absolute data symbols; the scan covers 317146 branch-shaped words, with two source-confirmed inline constants.", "The 2026-11-02 packaged 24A446 image panicked at corecrypto_kext_start: its kprintf import was rebound to unixnu_fileset_unmapped. The recipe omitted --lto and the reference builder accepted any existing output. Restore LTO and rebuild the reference and mapping; packaging success with --allow-missing does not establish boot compatibility.", "The OS boot-progress integration follows the SoC hooks in patch order.", "The payload carries kernel.macho.adt; the boot image carries the firmware FDT. Keep the two inputs named explicitly.", "The device patch series adds zzyd-sheng-audio-addon-mount.patch: the payload addon's audio directory is union-mounted over /System/Library/Audio/Plug-Ins/HAL (mount4 in the A log line).", "zzyf-sheng-amp.patch follows it: the AMP Edge scheduler for the E and P clusters (see the cpu area).", "The selected xnu-12377 board series contains CPU-idle, AMP and audio-addon patches. The new source-driver archives are compile-audit outputs only and are not added to the minimal 23F84 boot payload.", "scripts/package.sh is the shared packaging script of the device repositories (templates/package.sh in UniXNU) and holds no board value: board.toml [package] names the UniXNU checkout and the defconfig of each OS profile, and [os_overrides] holds the kernel, payload and component values of the 17 and 26 profiles. unixnu release --check lists 64 patches for 17, 75 for 26 and 78 for 27. scripts/package.sh --os 27 produces boot.img (185733120 bytes), payload.img (184549376 bytes) and kernel.macho (96354304 bytes) when --uefi and UNIXNU_UNIQUE_CHIP_ID are given. The firmware preflight runs scripts/fetch-sheng-dts.py, which builds the firmware device tree that board.toml [bootimg] dtb names, and scripts/check-sheng.py reads the firmware checkout from UNIXNU_UEFI. build-ath12k-wifi.py runs tools/fetch-sources.sh of Ath12kWifi first, which fetches the pinned Linux sources.", "The bringup patch includes sys/proc.h at its exception record: the RELEASE-config fileset reference build compiles the same tree without the DEVELOPMENT block that carried the declaration.", "The xnu-12377 board series includes optional latency hooks for IPC, user exceptions, fault registers and signal exit reasons. build-sheng-source-storage.py links BootLatencyTrace.c and includes its header hashes in the source identity.", "The xnu-12377 board series drops the IPC, user-client, contiguous-allocation and latency-detail trace patches and includes zzzzzzzzz-sheng-unnest-trace.patch, a board hook in log_unnest_badness before its rate limit; the latency trace patch keeps only the user-fault hook.", "The runtime merges the signed Wi-Fi service/cache and firmware into the Data addon, preserves stock launchd jobs and Data identity, and packages the bounded IEEE80211 association-event transport.", "Bluetooth and Wi-Fi share one signed launchd cache. The builder preserves existing trust modules and the Data seed, adds the service hashes, and installs the capability library before the executable overlay. Verified firmware downloads are cached after their hash check.", "The device series adds a patch that relaxes the disabled-signal assertion once sheng_sigp_recover has run.", "On macos-27.3-26C5035r the touch and keyboard firmware images (0x5025c bytes) are placed in __DATA,__firmware. Neither the kernel's __TEXT nor its __DATA_CONST has room before the first retained kext segment of the macOS collection; native __DATA has 0x9c000 bytes free. __DATA,__const is renamed to __DATA_CONST by the XNU link.", "The macOS closure (84 bundles) excludes AppleOnboardSerial and AppleSMC as on iPadOS and leaves out com.apple.kec.pthread, which the board builds from source. AMFI's __start does not register its policy; the profile names _amfi_register_mac_policy (0xfffffe0009840dd4) as early_security_init. Prelink reports 0 unresolved closure references and 0 stubbed functions."]
completion = ["Kernel and prelink succeed, payload contains all declared inputs, and the boot image matches the bootloader format and size limit."]

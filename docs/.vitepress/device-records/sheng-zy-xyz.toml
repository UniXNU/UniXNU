findings = ["The touch thread counts its line interrupts, wakes, header peeks (stale, invalid), full frame reads and frames with the time in each ([touch cost]); idle, it reads one frame about every 1.5 s, 2.4 ms each.", "The touch thread sleeps through the 5418-byte frame transfer until the serial engine's interrupt (GIC SPI 357) instead of polling; a deadline covers a lost interrupt and after eight transfers without gain it polls again (touch-spi-irq=0 keeps polling). Not yet run on hardware.", "Once touched, the touch controller leaves doze and sends every frame of its active scan, about 0.38 s of CPU per second in the touch thread with nobody touching. The touch thread sends the doze host command again once three seconds have passed without a finger, checked after every wake whatever frame type was announced; on hardware the thread then returns to no CPU time.", "On macOS 27.3 the HID device starts with offline-hid-home=1, and WindowServer pairs the touch screen with the display by the service's displayUUID, the UUID the framebuffer publishes as IOMFBUUID.", "ButtonProbe retries the PMIC interrupt setup up to four times; a failure records the failing command in B err.", "backboardd caches the event service's usage pair when it first sees the service, and drops every touch if that pair is not 0x0d/4. The DriverKit driver writes 1/6 and registers the service, so HidInputProbe checks every 2 ms until the service has been registered for 10 s.", "The shared SMMU fixture adds UART14 stream 0x423 beside touch without modifying its route and accepts a 64-bit DMA buffer address.", "The arm64e HID adapter uses the same fixed-target stub contract as the display adapter. Host verification checks all 51 IOHIDFamily stub destinations after fileset placement.", "Controller transfer logic, sensor protocol and board sensor geometry are separate inputs.", "Track contact IDs across movement and lift events; a register read alone covers only transport access.", "sheng_buttons_press() holds a button mask for a given time through the HID sink, for unattended tests (the audio lock sound test uses it).", "iPadOS 26 source-interface build: IOHIDDevice reports and independent touch/button, GENI SPI, Novatek and firmware archives compile. Four host model suites pass ASan/UBSan. The source path does not patch a foreign vtable.", "On arm64e the event driver's vtable is copied and every slot is re-signed with the 220 discriminators read from the 24A446 kernelcache; each slot is checked against the original table first, and AppleUserHIDEventService, this device's event driver, takes the copy as well. A search over 16-bit values can accept a second discriminator with the same 24-bit signature and stops touch events.", "With latency capture enabled, the HID input path records the time of each touch report handed to the event driver; these times bound the analysed touch windows. Contact IDs and coordinates are not recorded."]
completion = ["Touches map to the display, simultaneous contacts keep stable IDs, release events arrive, and buttons produce expected HID reports."]
limits = ["Sensor firmware and board dimensions remain sheng inputs.", "23F84 HID linking/startup and edge gestures remain unqualified. Apple IOHIDFamily 2238.120.5 omits event-type/struct headers and the complete device build needs private reporting/analytics dependencies."]

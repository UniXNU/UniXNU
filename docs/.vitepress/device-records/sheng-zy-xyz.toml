procedure = ["Document each clock, regulator and firmware-owned state before enabling power transitions.", "Check battery units and update behavior separately from suspend/resume and peripheral power.", "Read the [battery], [battery-raw] and [charger] log lines with scripts/read-sheng-log.py."]
findings = ["After a pause the GPU returns to the governor's floor (348 MHz) and the wake boost raises it at the first busy window; [gpu dcvs] boosts wake= and [gpu dcvs why] rests= count both.", "package/GpuPowerProbe.cpp keeps every row the GPU power-up sets in order (native_gpu_row_log) with its stage, so a power-up that stops shows the step it stopped at.", "thermal-level=1 publishes the service thermalmonitord reads its pressure level from (key mTPL, read once a second); the level follows the CPU and GPU trip points of the device tree with hysteresis and is nominal for an unreadable sensor. Not yet run on hardware.", "thermal=1 adds [thermal] rows: the three TSENS controllers' sensors and, per CPU frequency domain, the temperature of the samples in which the firmware limited a busy domain (thermal-ms sets the period). board-clock=<bits> runs the calendar from the PMK8550 counter plus the offset at 0xbc of the second SDAM: 1 measures, 2 starts the calendar from it, 4 stores it when the system sets the time. Not yet run on hardware.", "At rest under macOS two things kept the load up with nobody using the tablet: the GPU governor boosted to the top level about once a second, and the touch thread read every frame of the touch controller after the first touch. The governor now needs an 80 ms rest before it calls the GPU idle, and the touch thread returns the controller to doze after three seconds without a finger. Both are confirmed on hardware.", "Under this kernel the charger firmware reports no USB input (online 0, 6 to 44 mV) although the bootloader charges on the same cable; the cause is not known. With log-power=1 the boot log shows the charger PMIC's own registers, and ucsi-delay=<seconds> holds the first UCSI command back for the diagnosis.", "The ADSP firmware runs charging and PD/PPS negotiation without host requests.", "Battery properties after 11 are shifted by one: charge current 12, temperature 13, charge counter 15, cycles 16, design 17, full 18, time to full 20, time to empty 21.", "Charge is the sum of both fuel gauges' remaining over full capacity. Battery current is reported discharge-positive.", "USB property 6 reads SDP on every port. Property 7 carries the adapter type (6 PD, 8 PD PPS).", "A PPS adapter gets a 3 A input limit at about 8.7 V; the battery charges at the 2000 mA charge current with the charge pump off.", "Both cells and the PD adapter read unauthenticated.", "A Mac USB-C port negotiates PD 5 V with a 1.2 A input limit: about 1.1 A in, and the battery gains 0.25 to 0.4 A on the desktop.", "Power policy belongs to the board even when controller operations are shared.", "The GPU power probe hands the ring its register window without a GMU fence callback: only the GPU service checks fenced WPTR writes.", "The CPU governor reads each CPU idle time through patches/xnu/zzye-sheng-cpu-idle.patch. Domain 0, the E cluster, scales with load like the other domains.", "The GPU governor reads the GMU XO busy counter and votes over HFI with the level bandwidth.", "A touch holds the P CPU domains and the GPU at their top level for cpufreq-boost-ms and gpu-dcvs-boost-ms (1000) after the last report. GPU submits in 2 of 4 windows keep every CPU domain at 60 percent of its top for 300 ms. A fence waiter sleeps up to gpu-pause-us (1000) and the fence interrupt wakes it.", "The existing xnu-12377 migration uses kernel_target.TRIPLE and DEPLOYMENT for platform-power binding assembly and the deployment audit instead of a fixed iOS 17 target. This compilation-target change does not provide new 23F84 power or charging device evidence.", "GpuPowerProbe retries AHB-fenced context-switch writes for up to 2 ms while keepalive is held. The governor records accepted frequency votes and, with gpu-perf=1 and diagnostic export enabled, samples 19 A7XX BR counters approximately every 32 ms with selector, reset and preemption validity.", "package/WcnPower.h keeps independent Wi-Fi and Bluetooth votes over the six shared WCN supplies; the last owner releases them. scripts/check-wcn-power.py covers both startup orders, independent release, repeated votes and failed transitions.", "ShengBattery routes GLINK owner 32779 to the UCSI client and passes the charger's USB online value to QcomDwc3."]
completion = ["Declared power controls and battery readings match observations; each claimed sleep/resume transition restores its dependent peripherals."]
limits = ["Adapter details shown to iOS come from USB property 6, so every adapter reads as a computer port.", "Charge current stays at 2 A without fuel gauge and adapter authentication.", "A low-battery shutdown panics in vnode_rele_ext during unmount.", "Per-peripheral controls and battery publication have separate coverage from system suspend.", "The GPU governor changes level several times a second and spends most busy time at 680 MHz; its effect on frame times is not measured."]
next_action = ["Take adapter details from property 7.", "Authenticate both fuel gauges, then qualify PPS charge pump charging; Xiaomi adapter authentication follows."]


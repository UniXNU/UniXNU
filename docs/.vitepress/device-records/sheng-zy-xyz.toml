schema_version = 1

[device]
name = "sheng"
soc = "SM8550"
os_profile = "ipados-27.0.1-24A446"
summary = "Xiaomi Pad 6S Pro 12.4 uses shared SM8550 support and board-owned storage, input, firmware and power integration. This record describes implementation coverage and the evidence required for each milestone."

[[area]]
id = "configuration"
status = "implemented"
components = []
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore"]
inputs = ["SM8550 profile, iPadOS 26.5.2 build 23F84, arm64e sheng_ipados26_defconfig and pinned component sources."]
configuration = ["board.soc_source = sm8550; board.os_profile = ipados-26.5.2-23F84; schema_version = 2.", "The device owns ShengUfs, ShengHidInput, ShengNovatekTouch and ShengPreflight submodules."]
procedure = ["Read https://unixnu.com/porting/device-repository and https://unixnu.com/porting/records.", "Run ./unixnu defconfig sheng_ipados26_defconfig -D ../UniXNU-sheng from UniXNU.", "Run ./unixnu status --json -D ../UniXNU-sheng and review profiles, components, source pins and patch order."]
findings = ["The kernel adopts the low DRAM bank by default; memory-outside=0 on the command line leaves it alone. The built-in macOS arguments include gpu-pool=0.", "The macOS payload.adt lists owned_memory_outside_ranges 8 (the loader's table of free memory outside the window, which the kernel adopts) and owned_memory_outside_reserved for memory a driver uses there at a fixed address; memory-outside=0 on the command line leaves that memory alone.", "The macOS-only switches the kernel reads (timebase-user, cs-lazy, keyboard-lone, armcpu-edge, boot-payload-release, thermal, thermal-ms, thermal-level, board-clock) are built-in arguments of package/BootWatchdogPolicy.c on the macOS target, which keeps the command line under its 1000-byte limit; payload.adt sets owned_memory_outside_ranges 8. Not yet run on hardware.", "The macOS 27.3 kernel arguments drop -v and serial=3 and add ca-fb-8bit=1, armcpu-edge=1, boot-payload-release=1, thermal=1 and board-clock=7; the macOS payload.adt sets owned_memory_size 0x180000000 with owned_memory_excluded_ranges 64 and loader_inputs. Not yet run on hardware.", "The macOS 27.3 kernel arguments in board.toml include fb-half=2, the reading of WindowServer half-float frames that gives correct colours on hardware.", "The macOS 27.3 override of board.toml keeps the Bluetooth runtime tool with target macos27 and adds bluetooth=1 to the kernel arguments (864 bytes); the iPadOS settings are unchanged.", "The 24A446 kernel arguments include keyboard=1, which starts the keyboard cover driver; the 17 and 26 overrides do not.", "The 24A446 profile enables payload.runtime.appsync and appsync=1. The 17 and 26 overrides remove payload.runtime and replace the kernel arguments, so they do not select this adapter.", "Tables merge in ARM64, SoC, OS, device order. Arrays replace inherited selections, so include every required component and fragment.", "The selected defconfig applies after the explicit configuration fragments. Keep OS ABI and IPSW pins in the OS profile.", "The active 23F84 configuration remains minimal. Source storage/input archives are built separately and are not yet selected for boot. OS-profile source pins select the public macOS 26.5 families without claiming binary ABI compatibility.", "feeds.toml pins the SoC source at the commit that holds patches/xnu-12377/series, which board.toml lists as soc:patches/xnu-12377/series; a pin older than that commit leaves the series missing.", "board.toml carries the 27 values at the top level and the differences of the 17 and 26 profiles under os_overrides, so one branch serves every profile., .github/workflows/package.yml runs scripts/package.sh on a macOS runner with the UniXNU and uefi-sheng checkouts beside the device repository; the platform seed comes from the UNIXNU_UNIQUE_CHIP_ID secret, and the run offers boot.img, payload.img, kernel.macho and the manifest as its artifacts. Run it in a fork and delete the run after downloading them., and the run passes its own GITHUB_TOKEN to the packaging step for api.github.com, whose anonymous quota a hosted runner exhausts., The kernel archives of the 27 and 26 profiles list build-sheng-source-storage.py after component:ShengUfs, so the source storage archive and root-policies.bin the defconfigs link no longer depend on a leftover of an earlier build., and name scripts/policies/<profile> in --policy-dir, the signed headers the repository ships., and the 27 kernel archives run fetch-adreno-inputs.py and the three prepare-sheng-* generators before build-adreno740-kits.py, so the generated GMU and SMMU headers no longer come from earlier local runs., with fetch-sheng-dts.py first: the firmware step runs after the kernel step, and the generators read the DTS sources it fetches.", "[firmware] preflight lists scripts/fetch-sheng-dts.py before scripts/check-sheng.py, and [bootimg] dtb names the device tree it builds (build/sheng/sheng.dtb) for the pack step.", ".gitignore keeps policies/**/*.bin tracked under the global *.bin ignore: the signed root-policy headers are repository inputs of the storage area.", ".gitignore keeps firmware/**/*.bin tracked under the global *.bin ignore.", "The 27 kernel archives end with build-fileset-release-reference.py --tree . --lto, the comparison kernel the prelink step reads.", ".github/workflows/package.yml puts /opt/homebrew/opt/llvm/bin first on the package step PATH: the packaging step needs lld-link of the Homebrew LLVM the tools step installs.", "The tools step also installs cmake: the packaging step builds EDK II BaseTools with it.", "The package step PATH keeps /opt/homebrew/bin ahead of the LLVM tools: dropping it hid the tools step installs (cmake).", "The tools step installs lld beside llvm (the keg-only llvm bottle has no lld-link; the packaging step finds /opt/homebrew/opt/lld/bin through the loader), and the PATH override is gone: the default runner PATH keeps Apple clang driving the kernel link.", "The tools step installs the complete external set (dtc, llvm, lld, cmake, mtools, blacktop/tap/ipsw) and asserts every tool of the flow before the build: mtools builds the payload FAT volume, the ipsw tool fetches the AEA keys of the OS images.", "The keg-only tool check accepts either the llvm or the lld keg for a tool: ls with two paths fails when only one of them carries it.", "The uefi-sheng checkout carries its submodules recursively: the firmware volume builds from Binaries/sheng, itself a submodule.", "The firmware preflight runs the download, extract and import scripts between the DTS fetch and the memory-map check.", ".github/workflows/package.yml pins UniXNU revision be0e4fab0072bceaa8d744a4a6875ba5461cd7ff, which selects the GPU, Metal, display and source-storage latency integration. Existing installations retain their original Data seed through the packaging cache or an explicit seed import.", "The packaging workflow pins the UniXNU commit with the GMEM colour order fix and lazily allocated memory for memoryless attachments.", "The packaging workflow pins the Wi-Fi runtime builder and Data firmware integration; device gitlinks pin the matching Ath12kWifi and Wi-Fi DMA support.", "The 24A446 runtime selects signed Bluetooth userland and bluetooth=1. Other OS profiles remove the runtime stanza.", "drivers/QcomDwc3 is a submodule. The iPadOS 27 prelink roots add the USB stacks, and its boot arguments add usb=1 and aks-sls=3.", "The board's kernel.prelink.roots (the iPadOS 27 list plus the USB stacks) replaced every profile's list, so the macOS kernel was prelinked with the iPadOS closure. The list moved to os_overrides.\"ipados-27.0.1-24A446\"; iPadOS 27, 26 and 17 resolve to unchanged roots and macos-27.3-26C5035r uses its profile list. An os_overrides remove deletes the merged key, so it cannot drop only the board value.", "The macOS override (macos-27.3-26C5035r) removes the iPadOS install entry, seed-edit tool and audio, Wi-Fi, Bluetooth, wallpaper and AppSync runtime layers, and sets ADT chip_id 6050 (T6050, Mac17,11)."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["Local overrides can select a different source from the published pin; record the effective source in each verification result."]
next_action = ["Compare the effective status output whenever a profile, source or component selection changes."]


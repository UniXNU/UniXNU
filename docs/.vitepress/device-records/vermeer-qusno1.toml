[[area]]
id = "packaging"
status = "implemented"
components = ["XnuPrelink"]
paths = ["scripts/package.sh", "scripts/patch-xnu-entry-probe.py", "package/**", "patches/**", "unixnu.lock"]
inputs = [
  "Target restore image from the OS profile: iPadOS 27.0.1 build 24A446 for iPad17,3, including the profile's url and fetch list.",
  "Platform seed supplied at build time, never stored in the repository.",
  "Prelink inputs from the OS profile: kernelcache pin, slide, early security init address, roots and the fileset reference.",
  "The fileset reference kernel named by the profile's prelink extra_args. It is not a profile input that ships ready: [kernel] archives builds it with build-fileset-release-reference.py --tree . --lto, which must run before the prelink step.",
]
configuration = [
  "[ipsw] comes from the OS profile; board.toml has no [ipsw] table, so the profile's url, product, device_class, chip_id and fetch list apply unchanged.",
  "[payload] volume VERMEER, size_mib 192, loader firmware, panic_screen on, kernel_args -v, serial=3, debug=0x14e.",
  "scripts/package.sh runs the fixed steps deps, preflight, patches, build, pack and verify, and reads every board value from board.toml.",
]
procedure = [
  "Run scripts/package.sh --check --os 27 --uefi ../uefi-vermeer to resolve dependencies, configuration and patches without building.",
  "Run scripts/package.sh --os 27 --uefi ../uefi-vermeer on macOS to produce the kernel, payload and boot image.",
  "Inspect payload.json, boot.json and package.manifest.json before flashing anything.",
]
findings = [
  "The kernel step needs Xcode; this repository cannot produce kernel.macho on a Linux or Windows host.",
  "The payload must stay under the DarwinBoot command-line limit of 1000 bytes and every argument must match the accepted character set.",
  "scripts/package.sh and the board preflight script must keep mode 100755. Committed as 100644 they made the packaging workflow stop at its first command with 'scripts/package.sh: Permission denied', because the workflow runs the file directly rather than through an interpreter.",
  "scripts/package.sh --check --os 27 --uefi ../uefi-vermeer resolves dependencies, configuration and the ordered patch series and stops before building.",
  "patches/xnu/vermeer-kernel-stack-shift.patch publishes _unixnu_kernel_stack_shift. XnuPrelink's kit fixture fileset-24A446-symbols.json binds the original AppleMobileFileIntegrity GOT slot 0xfffffe0008136458 to that name, and the fixture is keyed by the same kernelcache pin as this profile; reviewed_sites rejects the build rather than falling back, and --allow-missing does not cover reviewed sites.",
  "patches/xnu/vermeer-mountroot-diagnostic.patch bounds bsd_init.c's root retry loop: after eight failed vfs_mountroot() calls it panics with the last errno. The loop only prints through kprintf, and this board has neither a UART nor a video console, so a boot that reaches the loop would sit there silently and look exactly like a hang earlier in bsd_init. The panic screen turns that into a photograph, which is what tells stage 5 apart from a failure before it. The patch exists only for the pre-storage state and is expected to go away once the UFS root path works; it applies after the whole shared series, and its context was rebuilt from the same ordered patches the kernel step applies (offline-*, sheng-platform-power, zzz-boot-progress).",
  "patches/xnu/vermeer-framebuffer-console.patch keeps XNU's text console on the framebuffer, which is what turns one panic message per boot into a scrolling kernel log. The mechanism is Apple's own: PE_create_console() calls PE_initialize_console(&PE_state.video, kPEGraphicsMode) because DarwinBoot fills boot_args.Video, so gc_graphics_boot is TRUE when startup_initialize() runs initialize_screen(NULL, kPEAcquireScreen); the kPEAcquireScreen branch then computes graphics_now = gc_graphics_boot && !gc_desire_text = TRUE and calls gc_enable(!graphics_now) = gc_enable(FALSE), and gc_enable(FALSE) sets disableConsoleOutput = TRUE unless the console is serial. Every kprintf and IOLog after that point is discarded, which is exactly what IOFindBSDRoot's 30 s service wait and its ROOTDEVICETIMEOUT (120 s in a DEBUG build) produced: two and a half minutes with no output at all. kPETextScreen is XNU's switch for this and calls gc_enable(TRUE) after checking console_is_serial() == FALSE, gc_acquired == TRUE and gc_graphics_boot == TRUE - all three true one line after kPEAcquireScreen, which is why the patch adds case kPETextScreen immediately after it, preceded by switch_to_video_console() to keep the switch off its serial early-out. gc_enable(TRUE) allocates its character buffers behind a vm_initialized guard, so it is safe at that point in startup. Nothing on ARM calls kPETextScreen (its only caller is bsd/dev/i386/km.c), which is why every ARM port of this tree shows no kernel output. Verified on hardware: the built kernel carries the patch as mov w1,#3 followed by the call at 0xfffffff00b57facc/0xfffffff00b57fad0 inside kernel_bootstrap_thread, and the phone now prints the whole boot.",
  "The visible log turns the boot into evidence. It shows iBoot 7.0.0 starting the task, AMFI reporting 'Booted in a VM' (which is the vmm-present property doing its job), AMFI/Sandbox/vnguard loading, the MRC framework, zone_init with a 164 MB pool, apfs_module_start and 'apfs: Successfully initialized', AppleFSCompressionTypeZlib loading, and finally the serialised root match carrying IOProviderClass = IOMedia with the profile's OS volume UUID. The two components that mount a root are therefore already running; what is missing is only a block device for them to sit on.",
  "The kernel reached the pmap hint asserts and panicked there. arm_vm_init.c sets ARM_PTE_HINT in ptmp only when use_contiguous_hint is true, and the two asserts immediately below assume 16 KiB granule semantics. This port maps 4 KiB kernel pages, and native-4k-block-split.patch pre-fills the L3 entries of a split 2 MiB block without a hint, so the compare at arm_vm_init.c:1113 failed with kva_active=1, i=400, va=0xfffffff007190000. The board now passes use_contiguous_hint=0, the switch PE_parse_boot_argn reads at arm_vm_init.c:2077 and the same value the reference board uses, so the hint branch and both asserts are skipped. kt_fixed_zones=120 and -no_slto_panic ride along: both are memory/startup switches with no board hardware dependency, and the reference board passes them for this profile.",
  "scripts/patch-xnu-entry-probe.py overrides the UniXNU copy because the device scripts directory is assembled into the tree last. The upstream parser takes any three-field llvm-nm line, and an MH_FILESET kernel makes llvm-nm print 'Symbols for <bundle id>:' headings that match that shape, so the payload step failed with int('Symbols', 16).",
  "Overriding [ipsw] with another product broke the prelink pin: the profile's kernelcache digest belongs to its own image. Keeping the profile image keeps every pin valid.",
]

[[area]]
id = "storage"
status = "implemented"
components = ["ShengUfs", "VerifiedRoot", "VirtioMmioBlock"]
paths = ["package/**", "drivers/ShengUfs/**", "scripts/*ufs*", "scripts/*storage*", "scripts/*userdata*", "scripts/policies/**", "feeds.toml", "configs/**"]
inputs = [
  "UFS host at 0x1d84000 and PHY at 0x1d80000, both standard SM8550 positions confirmed in the stock device tree.",
  "userdata starts at LBA 2570304 with 4096-byte LBAs and ends at LBA 115933951, measured on the phone.",
  "UFS device descriptor on the phone: manufacturer_id 0x0198, number_of_luns 6; the host exposes gear and clkscale controls.",
  "Root volume: the OS and Cryptex1,SystemOS disk images of the target restore image, addressed through the OS profile [userdata] windows.",
  "The apps SMMU context and clocks are shared with the display and WiFi windows the UFS driver owns on request.",
  "The root image lives in this board's own GPT partition (unixnu, sda30, start 927471616 x 512B, 67108864 sectors), holding a SHNGROOT v1 image; Android's userdata is untouched.",
  "ShengUfs from https://github.com/qusno1/ShengUfs.git at bf21739 in feeds.toml, a fork of the catalog component.",
]
configuration = [
  "[userdata] first_lba = 2570304, last_lba = 115936099, lba_bytes = 4096; these are the OS profile window bounds, not the root partition's.",
  "[components] includes ShengUfs, [kernel] archives includes component:ShengUfs, and configs/vermeer_defconfig sets CONFIG_XNU_NATIVE_UFS=y.",
  "[payload] kernel_args carries native-ufs-root=1 and vermeer-root-partition=unixnu.",
  "feeds.toml pins the ShengUfs fork by commit, because that name is not in UniXNU's own feeds and the catalog points at the upstream repository.",
]
procedure = [
  "Confirm the userdata extent on the device with fastboot getvar partition-size:userdata.",
  "Verify register access, link state, command completion and known-block reads before attempting a root mount.",
]
findings = [
  "payload.py refuses native-ufs-root=1 unless the kernel links _sheng_pmgr_run and exactly one sheng-pmgr=2 is present, because the unchanged target AMFI panics with No PMGR otherwise. That check is skipped when the device tree declares vmm-present, which this board does, so native-ufs-root=1 works here with no PMGR stand-in and no sheng-pmgr argument.",
  "The SoC patch series provides sheng-platform-power.patch, which calls sheng_pmgr_run from bsd_init under XNU_SHENG_PMGR.",
  "The stock GPT image carries no userdata extent: the flasher patches the last partition to NUM_DISK_SECTORS-6, so the usable size depends on the phone's part, not on the archive.",
  "ShengUfs cannot be used unmodified on this board. Its RootLayout.h compiled in the partition name \"userdata\" because on sheng the root image was flashed over the whole userdata partition; this board keeps Android's userdata and puts the root image in its own partition, so the driver would have looked in the wrong place and reported a manifest mismatch. The fork makes the name a runtime value read from the boot argument vermeer-root-partition, with \"userdata\" as the default so upstream behaviour is unchanged, and adds the terminator check that the old fixed-size comparison got for free.",
  "On arm64e the driver is not a standalone kext. build-arm-driver.py routes ShengUfs to build-sheng-source-storage.py, which builds a deferred IOBlockStorageDevice adapter plus the SourceStorage runtime that loads the original IOStorageFamily and APFS and authenticates the root volumes against a signed policy bundle. The first build with the component selected stopped with FileNotFoundError on scripts/policies/ipados-27.0.1-24A446/OS/trusted-key.bin, so the bundle is a build input, not an optional extra.",
  "scripts/policies/ipados-27.0.1-24A446 holds OS/ and SystemOS/, each with manifest.header.bin (544 bytes), trusted-key.bin (395 bytes) and verification.json. These are the same files sheng uses, and reusing them is correct rather than convenient: the OS profile pins the same restore image, so os_image_sha256 8a12cdad... and systemos_image_sha256 d5b4873d... match exactly, both trusted-key.bin files are the same 395-byte anchor (sha256 73090c0a...), and the volume UUIDs match the profile. The headers are the header-only form, which is what CONFIG_XNU_SOURCE_STORAGE_TABLES=\"userdata\" wants: 544 bytes per volume in the boot image, block tables in the userdata image.",
  "The CONFIG_XNU_OWNER_* family stays off for now. Those add the owner-signed root audit, the Data volume, the cache mount and the SystemOS union, each of which needs a matching Data seed. They are a separate step from publishing a block device, and enabling them together would make a transport failure indistinguishable from a policy failure.",
  "The runtime that starts the adapter is board code, not a prelinked kext. patches/xnu/vermeer-source-storage.patch calls native_source_storage_start() from bsd_init right after vfsinit(), guarded by a weak import so a kernel without the runtime still links. That position is required, not convenient: the adapter subclasses the source IOBlockStorageDevice and registers its metaclasses at run time, which only works once the original IOStorageFamily is loaded and the platform expert is published.",
  "package/SourceStorage.cpp is a reduced copy of sheng's. The sequence is identical - load IOStorageFamily, verify the base-class size against the source header, authenticate the policies, load APFS, register the three deferred metaclasses, then create and start the UFS service - but sheng's boot-log writer, UFS benchmark, process and UI trace probes, diagnostic export and WiFi and Bluetooth staging are left out. Those need a log window, a mounted root and drivers this board does not have yet; carrying them would add 300 KB of board-specific code whose hardware assumptions do not hold here.",
  "The remaining board files the source-storage build requires are stubs that document what they replace: BootLog.c keeps the writer contract (state 3 means no log) so callers can still tell \"not configured\" from \"stuck\", and BootReset.c, BootProcessProbe.c, BootUiTraceProbe.c, BootProcessWorker.c, BootWatchdogPolicy.c, BootDiagExport.c, WifiFirmware.c and BluetoothFirmware.c are empty translation units. build-sheng-source-storage.py only checks that each file exists, so an empty one is honest where a fake implementation would not be.",
  "[payload] root_policies points at build/sheng-source-storage/root-policies.bin and kernel_args carries native-source-storage=1. Both are required together: without the argument native_source_storage_start() returns immediately, and without the bundle native_source_root_policies_load() fails and the runtime panics. The bundle is a VROOTB01 container of the OS and SystemOS signed headers, and DarwinBoot writes {physical, length} into /chosen/memory-map/RootPolicies, a placeholder that only exists when root_policies is set.",
  "One failure in the first storage run was not the blocker it looked like: the bootstrap pass reported \"_corecrypto_kext_start, referenced from _sourcecrypto14_bootstrap in prng_random.o\" and make exited 2, but build-xnu-4k-baseline.sh continues past that pass and the archive steps run afterwards. The real stop was the missing policy bundle.",
]
completion = [
  "Host: register, clock, link and SMMU facts match the board inventory.",
  "Reads: capacity, GPT and known blocks are correct and the OS/SystemOS windows stay inside the root partition.",
  "Root: the configured volume mounts and launchd starts; writes survive a reboot inside the Data region.",
]
limits = [
  "No storage driver has run on the phone yet, so nothing about the transport is device-verified. The defconfig and component selection resolve and package.sh --check passes with 76 ordered patches.",
  "UFS negotiated gear and link speed have not been read from the device; only the descriptor (manufacturer_id 0x0198, 6 LUNs) and the gear/clkscale controls are known.",
  "Whether the boot chain leaves the UFS power domains and link usable for XNU is unmeasured. If it does not, the QMP-PHY sequence has to be written, and the sheng driver's own header marks that part unqualified.",
]
next_action = [
  "Build with ShengUfs linked and read the boot log for the controller bring-up stages: cap/version, SMMU slot, NOP OUT, power mode, LUN ready.",
]
evidence = [
  { kind = "source", reference = "board.toml", result = "userdata geometry, the root-partition argument and the per-profile defconfig selection." },
  { kind = "source", reference = "feeds.toml", result = "Pins https://github.com/qusno1/ShengUfs.git at bf21739416d3c28c77e371d5565652b876efe2ce, the fork that selects the root partition by name." },
]


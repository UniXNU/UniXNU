[[area]]
id = "diagnostics"
status = "planned"
components = []
paths = ["unixnu.lock", "scripts/prepare-vermeer-firmware-dtb.py", "reports/**"]
inputs = [
  "The phone has no UART; the firmware must expose its log on screen.",
  "The boot path reports through the framebuffer and the panic screen.",
]
configuration = [
  "kernel_args include -v, serial=3 and debug=0x14e.",
  "[payload] panic_screen = true, so the panic screen is patched into the payload copy of the kernel.",
]
procedure = [
  "Capture the screen at each bring-up checkpoint: firmware output, UniXNU menu, payload parsing, loader handoff, kernel entry, root mount, launchd.",
  "Record the last confirmed stage and the image hash for every attempt.",
  "Run fastboot boot, since it writes no partition and can be retried; reboot to the bootloader with the hardware keys when the firmware stops responding.",
]
findings = [
  "The reference platform documents an Advanced Logger with QR export as the fallback log channel; this board's firmware has not wired it.",
  "After the firmware starts, the phone disappears from both adb and fastboot: the firmware replaces those USB stacks, so the screen is the only channel until a log export exists.",
  "The panic screen is what makes the last two failures readable at all. Each run it delivered a message plus a frame chain that resolves to symbols in the same kernel.macho, which is enough to name an entire call path without a serial port: the CTRR assert resolved to machine_routines.c:3379 with dtrace_sdt_probes_restricted and sdt_init on the stack, and the root-device stop resolved to IOFindBSDRoot.cold.6, IOFindBSDRoot+0xfa0, bsd_init+0x70c and kernel_bootstrap_thread+0x3ec.",
  "Keep notes/kernel-<image>.nm.txt (llvm-nm -n of that image's kernel.macho) next to each build: the panic screen prints VAs, and one kernel symbol table turns them into names. The kernel is an MH_FILESET, so llvm-nm prints per-bundle 'Symbols for' headings and a naive three-field parser reads the heading as a symbol. The addresses shift between builds, so a symbol table is only valid for the image it was taken from - the root-device frames moved by 0x10 between two builds of the same source.",
  "A defect that only prints through kprintf is invisible here. IOFindBSDRoot waits ROOTDEVICETIMEOUT (120 s in a DEBUG build) after a 30 s service wait before it panics, so a run that looks frozen may still be inside a timeout; with the console enabled the wait is now visible as it happens.",
  "patches/xnu/vermeer-framebuffer-console.patch makes the kernel log visible on the panel, and hardware confirmed it: the first boot with it showed the entire path from 'iBoot version 7.0.0' through APFS initialisation to the serialised root match. The panic screen and the text console are complementary: the console scrolls everything, the panic screen survives a panic that happens before or after the console is up. Both read and write the same framebuffer DarwinBoot advertises in boot_args.Video, so neither needs a serial port.",
  "The same log surfaces /chosen properties XNU probes and does not find: AppleARMBootPerf cannot find its profile handoff region, and AppleARMSFRManifest cannot open /chosen/secure-boot-hashes or find /chosen/iBoot, so it fails to publish the SFR manifest. (Read carefully: the component is the ARM SFR manifest, not an RSK one, and the strings were confirmed against kernel.macho rather than the photograph.) None of those errors is fatal and the boot passes them, so they do not block a root device. They bite one stage later: launchd runs /sbin/mount and the child exits 66 without a published /chosen/boot-manifest-hash. [adt.chosen.bytes] boot-manifest-hash now carries a development-only 48-byte bring-up identity, the SHA-384 of 'VermeerBringup.BootSet.v1\\0', following the same pattern marble uses for 'MarbleBringup.BootSet.v1\\0' and sirius for 'UkeBringup.BootSet.v1\\0'; sirius records that supplying it made mount-phase-1 and mount-phase-2 pass and launchd report 'Early boot complete'. It is opaque bring-up material, not an owner signature, and it authenticates nothing: this board's root stays unauthenticated.",
  "Three boot attempts are recorded for this board, covering stages 1 through 5.",
]
completion = [
  "Each claimed milestone has a reproducible command, a matching source and image revision, and an accessible result.",
]
limits = [
  "No text log has been captured from this board; every result rests on a screen observation.",
  "Stage 6 has no checkpoint beyond the root-device panic, and stage 7 has none.",
]
next_action = [
  "Wire the firmware log export, which is what would turn the current one-message-per-run cycle into a trace of the whole boot.",
]
evidence = [
  { kind = "source", reference = "board.toml", result = "Kernel arguments, panic screen setting and the serial console selection." },
  { kind = "device", reference = "reports/2026-11-09-uefi-menu.md", command = "fastboot boot boot.img", revision = "b1c88c0808db7955a9ffd0e55ff35489e34bc25b", result = "The UniXNU menu appeared after the bootloader sent 1788 KB, confirming the UEFI and UniXNU checkpoints of the bring-up order." },
  { kind = "device", reference = "reports/2026-11-10-framebuffer-console-and-apfs.md", command = "fastboot boot boot.img", revision = "44c5e2579fd0b6a35b0bbbe3d6a1f5a0f4e0e6c3", result = "With the framebuffer console patch the panel scrolled the whole kernel boot: iBoot 7.0.0 task start, AMFI 'Booted in a VM', AMFI/Sandbox/vnguard, the MRC framework, zone_init 164 MB, apfs successfully initialized, AppleFSCompressionTypeZlib load succeeded, then the serialised root match and the root-device panic. Image boot.img sha256 7078c8ca065827ee72aaf13eef6be557b45eee5c38beec2f864af450768238d2." },
]

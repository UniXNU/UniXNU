# Device porting record for rodin (Redmi Turbo 4 / POCO X7 Pro).
# schema_version = 1 (record) pairs with board.toml schema_version = 2.
# Structure follows /porting/records. When the UniXNU checkout is available,
# regenerate from examples/device/porting.toml and merge the content below.

schema_version = 1

[device]
name = "rodin"
soc = "mt6899"
os_profile = "ipados-17.7.11-21H461"
summary = "Redmi Turbo 4 / POCO X7 Pro (rodin): MediaTek Dimensity 8400-Ultra (MT6899, 8x Cortex-A725 arm64), 12 GiB LPDDR5X, UFS storage. Porting target: UniXNU UEFI + XNU boot chain for the ipados-17.7.11-21H461 profile; configuration chain and UEFI scaffold are in place, drivers are in progress."


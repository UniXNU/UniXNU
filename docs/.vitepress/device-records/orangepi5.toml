[[area]]
id = "power"
status = "implemented"
components = []
paths = ["package/Rk3588DvfsBoard.cpp", "docs/power.md"]
inputs = ["RK806 PMIC on SPI (BUCK1 GPU, BUCK2 little cores), RK8602 and RK8603 at 0x42 and 0x43 on I2C0 for the big cores, HYM8563 RTC at I2C6 0x51, a PWM fan header, no remote power switch."]
configuration = ["package/Rk3588DvfsBoard.cpp is the rail table for UniXNU-rk3588-common Rk3588Dvfs; board.toml builds build-rk3588-dvfs.py with it and defaults rk3588-dvfs=6 with rk3588-gpu=0 (GPU governor off); orangepi5_display_defconfig force-loads libRk3588Dvfs.a; LegacyDisplayProbe calls rk3588_dvfs_start() before mali_start(). Activity boost reads native_touch_hid_reports and native_usb_hid_reports."]
procedure = ["Boot with the display kernel; read rk3588-dvfs: lines. Probes: EXTRA_KERNEL_ARGS rk3588-dvfs=1..5 / 7..10 as in docs/power.md and UniXNU-evb10/docs/power.md."]
findings = ["Read on the board, not assumed: SCMI lists 408..1800 MHz (little) and 408..2400 MHz (big) and answers error 102 for the DDR clock; RK806 BUCK1 750 mV (GPU), BUCK2 950 mV (little); RK8602 0x42 and RK8603 0x43 on I2C0 both 1000 mV, die id 10; the firmware starts the big cores at 2400 MHz / 1000 mV. The CPU governors move frequency and voltage with the load (30 to 100 changes per 10 s while SpringBoard starts, 1200 MHz / 675 mV when idle), the thermal sensors read 50 to 65 C and peaked at 79.4 C, no throttling.", "With the GPU governor on, the board reset itself without a message in five of seven boots, 58 to 61 s after the kernel started and in the first seconds of Mali work (not the watchdog, not a panic, not PSCI); with rk3588-gpu=0 four boots (244 s, then 185 s three times, the watchdog ending those by design) did not. The governor lowers the GPU rail from 750 mV to 675 mV at the 198 MHz the Mali driver already uses; that is the untested candidate. board.toml therefore defaults rk3588-gpu=0.", "CRU GLB_RST_ST reads 0 after silent resets, watchdog resets and panics alike, so it cannot name a reset reason here.", "Soft reset via CRU_GLB_SRST_FST after wdt-kick remains in NativeNvme."]
completion = ["The governors start and print rk3588-dvfs: gov lines."]
limits = ["The GPU governor is off and the reset with it on is not explained; the CPU governors ran four boots of at most 244 s, not a long soak. No power meter. DDR clock unmanaged."]
next_action = ["A 600 s soak with rk3588-gpu=0; add a voltage floor argument to the GPU governor (SoC repository) and test 750 mV with the governor on."]


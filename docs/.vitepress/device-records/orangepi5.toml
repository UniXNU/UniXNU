[[area]]
id = "packaging"
status = "host-verified"
components = ["XnuPrelink", "DarwinBoot", "SoftwareAES"]
paths = ["patches/**", "package/**"]
inputs = ["Kernel from orangepi5_defconfig with the NVMe driver, the original trust cache bundle, the 2 GiB Data seed and unixnu.toml of the payload, the 256 MiB OPI5ESP payload volume that goes on the NVMe ESP, the 9.4 GB root image."]
configuration = ["payload.loader = firmware: the loader is part of the firmware volume of uefi-orangepi5, so the payload carries no loader image."]
procedure = ["unixnu build kernel, then uefi-orangepi5 tools/board/make-bundle.sh (unixnu build payload, the power-off menu entry removed, bundle with the firmware image and the root image); nvme-install.py writes the ESP of the drive."]
findings = ["The SoC patch rk3588-root-trust.patch makes bsd_init.c call native_emmc_root_trusted; the NVMe driver defines it, so the stub patch of the console kernel is gone.", "The five EVB10 kernel patches (exit trace, mmap grant, thread sample, userland mounts, vc mirror) are vendored with their source commit; the NVMe personality patch is the board's own.", "The payload assembles on the host (payload.img 256 MiB, ADT with the pcie-nvme node); the ADT memory values are still the placeholders.", "The SoC repository is pinned in feeds.toml; local.toml can point at a checkout during development."]
completion = ["The payload boots from the NVMe ESP through the firmware and reaches the kernel entry."]
limits = ["The vendored EVB10 patches keep the EVB10 names and drift when the EVB10 repository changes (scripts/check-vendored-patches.sh shows it).", "The payload has not been started by the firmware."]
next_action = ["Start the payload on the board and replace the memory placeholders with the first log."]


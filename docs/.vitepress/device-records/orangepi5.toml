[[area]]
id = "memory"
status = "device-verified"
components = []
paths = ["dts/orangepi5.dts"]
inputs = ["The board of this port has 8 GiB of LPDDR4x. The firmware (edk2-rk3588 as built by uefi-orangepi5) maps it as the lower bank below 0xf0000000 (3.75 GiB, cut by OP-TEE, TF-A and the firmware's own allocations) and the 4 GiB bank from 0x100000000; U-Boot also reports 256 MiB at 0x2f0000000 that edk2 does not map."]
configuration = ["payload.adt.owned_memory_size = 0xF8000000 (3.875 GiB): DarwinBoot takes that many contiguous bytes from one run of free memory of the UEFI map, first fit. With the firmware as built here that is the 4 GiB run at 0x100000000: the window is pa 0x10007C000 to 0x1F807C000 and 127 MiB of the run stay free behind it.", "The memory node of dts/orangepi5.dts (memory@100000000, 3.875 GiB) and payload.dram_size = 0xF8000000 follow the window; the kernel does not read the node.", "Firmware side (uefi-orangepi5): the link order of the ACPI tables (dc08d7c) and PcdImageLargeAddressLoad = FALSE (e1ac136), which keep the 4 GiB bank in one piece; without them the longest run is 2.6 GiB."]
procedure = ["Read the memory map the firmware prints (UniXNUMemMapDxe: before the menu and at ExitBootServices) and take the largest run of free memory (4096 MiB at 0x100000000 on this firmware); set owned_memory_size below it with margin (2 MiB steps), rebuild the payload (REBUILD=1 tools/board/make-bundle.sh) and write kernel.macho.adt to the ESP (through U-Boot: uboot-put.py, fatwrite, crc32). DarwinBoot prints 'boot refused: Out of Resources' when no run is long enough, and the UniXNU menu then waits for a key (5 restarts the board)."]
findings = ["Observed with the firmware as first built (evidence/device-memory-20261103.txt, section 1): free runs 0x7F0000 + 124 MiB, 0x9400000 + 849 MiB and 0x40000000 + 2674 MiB (the largest, up to 0xE72DA000) in the lower bank, 0x100000000 + 2048 MiB and 0x180024000 + 2047 MiB above it.", "The upper bank was cut at 0x180000000 by RtkUndiDxe.efi (prebuilt Realtek UNDI driver of edk2-non-osi, ImageBase 0x180000000, 0x24000 bytes): DxeCore loads an image at its linked address when that is free because PcdImageLargeAddressLoad is TRUE (host reading of the PE header and of Image.c; the log shows the load at 0x180000000). So no run above 4 GiB was longer than 2 GiB, and window requests of 3.5 GiB (0xE0000000) and of sizes between 2.75 and 3 GiB were refused ('DARWINBOOT: boot refused: Out of Resources'); 2.5 GiB (0xA0000000) booted (memC, memH, memI: pa 0x4007C000, 626169 to 626173 free pages against 497587 with the 2 GiB window, launchd 'Early boot complete' 30 s after the hand-off, no panic in 400 s; section 4).", "The two ways tried to get the upper bank in one piece (-D NETWORK_ENABLE=FALSE; PcdImageLargeAddressLoad=FALSE) stopped the firmware before the menu with a data abort in AcpiTableDxe (FAR 0xFFFFFFF0, 0xAFAFAFAF in the registers; memG, memJ). Cause of the broken ACPI install, found on the host (section 5): Pptt.aslc compiled with clang has an 8-byte ReferenceAcpiTable pointer in .data.rel.ro in front of the table in .data, GenFw -c copies the sections in the order the linker gives, so Pptt.acpi began with 8 stray bytes; the firmware read a sixth table with a garbage signature and length 0, its install failed, SPCR and DSDT were never installed. Linking the ACPI tables with -Wl,--sort-section=name puts the table first (reproduced by hand: the first bytes are 'PPTT' with the flag, 40 02 00 00 00 00 00 00 'PPTT' without). Observed after dc08d7c: all eight tables install (memK); the memJ configuration (PcdImageLargeAddressLoad=FALSE, window 0xE0000000) plus the fix no longer aborts (memL). Which line of AcpiTableDxe reads the freed memory was not traced; the memG build was not repeated with the fix.", "With both firmware changes the 4 GiB above 0x100000000 is one run of 4096 MiB (memL map, section 6) and the kernel boots from a window there: 3.5 GiB (memL: pa 0x10007C000, 884604 free pages), 4094 MiB (memM: 1013320 free pages) and the committed 3.875 GiB (memN: pa 0x10007C000, args 0x1040C4000, 981518 free pages, 3968 MiB 'loader code' run with 127 MiB free behind it); each reaches launchd 'Early boot complete' 30 s after the hand-off with no panic, for 150 s (memL, memM) and 400 s (memN) of feeding. The kernel has run above 4 GiB on this port since memL.", "The ADT generator takes one range and DarwinBoot one window, and nothing in the kernel sources of this tree reads dram-base or dram-size from /chosen (host reading), so the lower bank (3.75 GiB, 2.6 GiB free) and the upper one cannot both be given to the kernel; the 256 MiB at 0x2f0000000 are not mapped by edk2."]
completion = ["The kernel reports the memory it owns and the ADT memory ranges match the firmware map."]
limits = ["The kernel owns 3.875 GiB of the 8 GiB: the lower bank (3.75 GiB, 2.6 GiB of it free) and the 256 MiB at 0x2f0000000 are unused (one window, one ADT range).", "The window leaves 127 MiB in the run. A firmware change that splits the upper bank again (a prebuilt driver with a fixed load address, PcdImageLargeAddressLoad back to TRUE) makes DarwinBoot refuse the boot and the board waits in the menu for a key; the MEMMAP lines show the runs before the menu.", "Which of the captures memA, memB, memD and memE had which size was not written down; the refusals and the sizes tried are recorded, the pairing is not.", "SpringBoard did not start in the longest run (memN, 400 s), so the effect of the larger window on the later boot was not measured. The committed unixnu.toml itself (default entry xnu-probe, wdt-kick=1800) was not booted with this window: memN used entry xnu and wdt-kick=400."]
next_action = ["None for the window itself. Watch the MEMMAP lines whenever a firmware driver is added or a PCD changes, and test that the contents of Data survive a reboot (storage area)."]


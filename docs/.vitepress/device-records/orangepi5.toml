[[area]]
id = "firmware"
status = "device-verified"
components = []
paths = ["docs/bring-up.md"]
inputs = ["edk2-rk3588 firmware built by uefi-orangepi5 (an SPI NOR image with TF-A at EL3, OP-TEE and the UEFI volume, or the UEFI volume alone as a launcher image), UEFI GOP frame buffer on HDMI0.", "A U-Boot in the SPI NOR supplied by the board's owner. Reported from its console (not observed from here): kernel_addr_r=0x00400000, fdt_addr_r=0x08300000, boot_targets=mmc1 mmc0 nvme scsi usb pxe dhcp spi, and a working ums."]
configuration = ["board.toml has no [firmware] section: the unixnu firmware step builds Mu-Silicium, and this board boots edk2-rk3588 built by uefi-orangepi5.", "payload.loader = firmware: DarwinBoot is inside the firmware volume and reads the payload from the ESP of the NVMe drive, found through NvmExpressDxe.", "The board has no SD card, so the firmware is not flashed: boot.scr on the ESP makes U-Boot load uefi-launcher.img (a stub with the volume inside) at 0xa000000 and booti it; the stub copies the volume to 0x200000 and jumps to its reset vector target (0x1400) at EL2. The volume is built with RK_NOR_FLASH_ENABLE=FALSE (build.sh -L), so edk2 does not write the SPI that holds U-Boot."]
procedure = ["Build the volume (uefi-orangepi5 build.sh -L), the bundle (tools/board/make-bundle.sh puts uefi-launcher.img and boot.scr on the ESP) and the disk files (tools/board/make-disk-image.sh). Put the drive on a Mac with U-Boot's ums, write head.img, tail.img, the zeroed Data header and esp.img with dd, then power-cycle: U-Boot runs boot.scr. With an SD card the firmware can go into the SPI NOR instead (tools/board/spi-flash.sh, Maskrom when /proc/mtd does not list the flash). All of it is in uefi-orangepi5/docs/first-boot.md."]
findings = ["Observed on the board (evidence/device-first-boot-20261103.txt, sections 1 to 3 and 6): the SPI NOR U-Boot (v5-gc507c92ef837-261013) scans the NVMe, finds /boot.scr and runs it; the stub copies the volume to 0x200000 and jumps to 0x1400 at EL2 (booti left it where it was loaded); the UEFI banner follows 0.04 s after the jump; the firmware reports 4 x 2048 MB = 8192 MB of RAM, brings the PCIe link up again after U-Boot used the drive (x1, 2.5 GT/s), reads kernel.macho and its companions from the ESP of the NVMe drive, and DarwinBoot hands the kernel over with the GOP frame buffer 0xE7AC0000 (640x480, row 2560). The device tree U-Boot hands over reaches edk2 as x0 (one harmless 'Bad transfer list signature 0xEDFE0DD0' line).", "The board's U-Boot counts the entries of a script image up to a word of 0xffffffff, not up to 0 as mkimage writes: boot.scr as mkimage writes it printed \"Unknown command '<garbage>'\" because the text was taken from behind the end of the file. With [length, 0xffffffff] as the size table iminfo lists one image and source runs the text (checked with small images in RAM, then with the real boot.scr, which now starts the launcher by itself, also after the restart that follows a kernel panic). tools/board/make-bootscr.py writes that by default and --table-end 0 gives the mkimage layout.", "The UniXNU menu takes keys from the serial port: serial-capture.py --send 'menu: shown' text:1 picked the xnu entry (menu: key 1, booting 0) in the 10 s countdown.", "HDMI0 shows the kernel log: the xnu-hdmi entry (vc_mirror=1) copies it to the GOP frame buffer (video base 0xE7AC0000, 640x480, row 2560) and the person at the board saw text scrolling on the monitor (evidence/device-hdmi-watchdog-20261103.txt; not photographed, so colours, position and readability are not recorded). The xnu and xnu-probe entries leave the monitor black after the menu, as designed.", "A kernel panic restarts the board at once (the next U-Boot banner 0.97 s after the panic line); the hardware watchdog path was run once: after the kernel's wdt-kick feeder stopped (1800 s), the board was reset and ran by itself again, the adapter dropping off the bus at 11:49 (the 89 s were due 11:49:33). The reset itself was not seen on the serial line, so that it was the watchdog is an inference from the time. The launcher arms the DW watchdog, UniXNUBootWdtDxe takes over, and the kernel's wdt-kick feeder kept the board up for the 400 s from the hand-off to the end of the xnu capture.", "The firmware builds on the host with the GPU rail set to 0.75 V and the hardware watchdog driver of uefi-orangepi5 armed (the board has no remote power switch, so a hung kernel must end in a watchdog reset).", "The firmware image is a bundle member (nor.img) built by uefi-orangepi5 tools/board/make-bundle.sh; spi-flash.sh was checked for its /proc/mtd parsing only, it has not touched a flash.", "Host-verified for the launcher: the stub's instructions are identical to the EVB10 stub that ran on a board (only strings and the text_offset field differ); the entry offset read from the volume's reset vector is 0x1400 for the EVB10 and both Orange Pi 5 volumes; boot.scr written with --table-end 0 is byte for byte what mkimage -T script writes; the ESP with both files passes fsck.vfat and reads back identical; make-disk-image.sh runs nvme-install.py with read-back into a 128 GB sparse file.", "The ESP can be updated from the serial console, with no second computer: at the U-Boot prompt uboot-put.py (UniXNU-rk3588-common tools/board) sends a file with YMODEM, fatwrite puts it on the ESP, fatload and crc32 read it back (all numbers hex). uefi-launcher.img (5251560 bytes) takes about 40 s at 1.5 Mbaud; the launcher, kernel.macho.adt and unixnu.toml were replaced that way for the memory runs and verified by crc32 (evidence/device-memory-20261103.txt, section 7). The firmware logs its UEFI memory map (UniXNUMemMapDxe, uefi-orangepi5 e35d303) before the menu and at ExitBootServices.", "Two firmware fixes came out of the memory work (uefi-orangepi5 dc08d7c and e1ac136; memory area, evidence/device-memory-20261103.txt, sections 5 and 6): the ACPI tables are linked with -Wl,--sort-section=name so the table, not clang's ReferenceAcpiTable pointer, is first in Pptt.acpi (observed on the board: all eight tables install, the 'Couldn't locate ACPI DSDT' line is gone, no more AcpiTableDxe abort in the builds that had one) and PcdImageLargeAddressLoad is FALSE (RtkUndiDxe loads at 0xE7CFB000 instead of its linked 0x180000000)."]
completion = ["Firmware enters DarwinBoot, publishes the GOP frame buffer and finds the NVMe ESP."]
limits = ["The HDMI picture is a text mirror only (no display driver; the monitor was reported as scrolling text, nothing more); the SPI NOR route (nor.img) has not run; the U-Boot is the owner's build, known by its console, its environment and what it did in the runs above.", "The first runs started from the U-Boot prompt by 'reset' typed on the serial console; a power-on from cold (BootROM to U-Boot) is the same path but was not captured.", "The USB serial adapter drops off the bus at every board reset and returns under another name; captures need its /dev/serial/by-id path (BOARD_SERIAL_DEV)."]
next_action = ["Capture the watchdog reset on a line that survives it (by-id path) to confirm the 89 s; once the runs are good, make xnu the default (DEFAULT_ENTRY=xnu MENU_TIMEOUT=3 tools/board/make-bundle.sh) and write the new esp.img."]


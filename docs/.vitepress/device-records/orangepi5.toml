schema_version = 1

[device]
name = "orangepi5"
soc = "RK3588"
os_profile = "ipados-17.7.11-21H461"
summary = "Orange Pi 5 (Rockchip RK3588S) with an HDMI display and an M.2 NVMe drive, running the iPadOS 17.7.11 userland on a source-built XNU, started from edk2-rk3588 firmware (uefi-orangepi5). Shared SoC support is in UniXNU-rk3588-common, which the EVB10 port already proved on hardware. Observed on the board (2026-11-03): U-Boot starts the firmware from the NVMe ESP, the console kernel finds the drive, publishes the root windows and a persistent Data window, and launchd runs. No display, GPU, input, audio or network driver exists yet."

[[area]]
id = "configuration"
status = "host-verified"
components = []
paths = ["board.toml", "feeds.toml", "configs/**", ".github/**", ".gitignore", ".env.example", "local.toml.example", "unixnu.lock", "LICENSE", ".gitattributes", "scripts/build-orangepi5-kernel.sh"]
inputs = ["ARM64 profile, rk3588 SoC source pinned in feeds.toml, iPadOS 17.7.11 build 21H461 profile, orangepi5_defconfig."]
configuration = ["board.soc_source = rk3588; board.os_profile = ipados-17.7.11-21H461; schema_version = 2.", "orangepi5_defconfig is the console kernel with NVMe storage and the Mali driver linked (inert without mali=N): no display, no RAM disk, no UFS; orangepi5_display_defconfig, the configuration of the image, adds CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y and the link stubs (scripts/build-orangepi5-kernel.sh builds the two in that order); the trust-cache runtime and the code-signing hash cache stay on.", "[adt.defaults.u32] carries sleep-disabled = 1 and vmm-present = 1, which the EVB10 port found necessary for watchdogd."]
procedure = ["From the UniXNU checkout run ./unixnu defconfig orangepi5_defconfig -D ../UniXNU-orangepi5, then ./unixnu fetch, ./unixnu status --json and ./unixnu tree with the same -D.", "scripts/build-orangepi5-kernel.sh runs the kernel build; it needs the environment of the machine that builds (.env) and CMake 3.19.6 or newer."]
findings = ["Resolution is host-verified: defconfig, fetch, status --json and tree complete against the pinned SoC repository.", "The UniXNU bootstrap pass builds AvailabilityVersions with CMake; the distribution CMake of Ubuntu 20.04 is 3.16 and fails, so the build script puts /usr/local/bin first.", "The kernel now carries the NVMe driver: board.toml archives build-orangepi5-drivers.py Rk3588Nvme and bind-nvme-storage.py, the defconfig force-loads libRk3588Nvme.a, and the build script verifies the bound addresses against the kernel (18 addresses inside the audited IOStorageFamily).", "board.toml [userdata] is the layout of the 128 GB drive: userdata at LBA 526336..134744063 behind a 256 MiB ESP at LBA 2048; the boot arguments are the EVB10 ones with the storage names of the NVMe driver (nvme=4, nvme-root-trust=1, nvme-data-size=2048, nvme-data-persist=1).", "board.toml payload.dram_size and payload.adt.owned_memory_size are 0xF8000000 (3.875 GiB, in the 4 GiB bank at 0x100000000) now, the window measured on the board (memory area, evidence/device-memory-20261103.txt); the old 4 GiB and 2 GiB values were EVB10 placeholders.", "The kernel is built in two passes now and carries the GOP-backed legacy display (board.toml archive build-orangepi5-display.py, component GopFramebuffer, the offline-legacy-* and sheng-* arguments; evidence/host-display-build-20261103.txt) and the Mali-G610 driver (archives build-mali-firmware.py and build-orangepi5-drivers.py Mali, libMali.a force-loaded by both defconfigs, no mali argument in the list; evidence/host-gpu-build-20261103.txt). Both link on the host; neither has run on the board."]
completion = ["Every source pin resolves, ./unixnu status lists the intended patch order, and the defconfig materialises."]
limits = ["Display and GPU are linked but have not run on the board; input, network and audio have no driver and no archive yet (docs/bring-up.md)."]
next_action = ["Add the mali arguments to board.toml once the Mali bring-up steps (mali=1, 2, 3, 8) have run on the board."]


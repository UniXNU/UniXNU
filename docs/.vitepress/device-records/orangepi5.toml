[[area]]
id = "network"
status = "device-verified"
components = []
paths = ["package/Opi5Eth/**", "scripts/build-orangepi5-eth.py", "docs/network.md"]
inputs = ["GMAC1 of the RK3588S (Synopsys DesignWare EQoS 5.10a, register block 0xfe1c0000, 32-bit DMA) with RGMII to a Motorcomm YT8531 PHY (MDIO address 0, ID 0x4f51e91b) behind the Gigabit Ethernet connector; the firmware's GmacPlatformDxe sets the pins, the RGMII mode and clock, the transmit delay and the PHY up before the kernel; the chip's OTP (0xfecc0000) gives the MAC address the way the firmware derives it. The on-board Wi-Fi and Bluetooth module and USB Ethernet adapters are not covered."]
configuration = ["opi5-eth=1 identifies the controller and the PHY and follows the link for a minute; opi5-eth=2 runs the controller and tests it with a DHCP exchange, an ARP request and four pings of its own; opi5-eth=3 gives the OS the interface en0 and its IOKit entries (IONetworkStack, controller, interface). Not in board.toml (the kernel line stays 811 bytes): add it with EXTRA_KERNEL_ARGS, because a network makes the system download until the 2 GiB Data window is full. Probes: opi5-eth-builtin=0, opi5-eth-filter=0x..., opi5-eth-flap=N (docs/network.md). board.toml archives build-orangepi5-eth.py, configs/orangepi5_display_defconfig force-loads libOpi5Eth.a and the display probe starts it."]
procedure = ["Plug a cable into the Ethernet port, build the kernel (scripts/build-orangepi5-kernel.sh), make the bundle with EXTRA_KERNEL_ARGS=\"opi5-eth=3\" (REBUILD=1 DEFAULT_ENTRY=xnu MENU_TIMEOUT=3 tools/board/make-bundle.sh), write the ESP with rockusb and capture the serial console: opi5: eth: lines (identity, link, statistics every 10 s) and opi5: eth-net: lines (the stack opened, DHCP, en0 address, per-kind counters). opi5-eth=2 first when the controller itself is in doubt (the self-test needs no OS)."]
findings = ["Host-verified: the pure parts (the MAC address derivation from the OTP, the PHY link resolution, the checksum, the queue size field) pass tests/test-eth.cpp; NativeEth.cpp and EthNet.cpp compile with the kernel's recorded flags and -Werror, are archived (the network side's static initializer made external, the code checked unchanged) and link into the display kernel (evidence/host-ethernet-build-20261106.txt).", "Observed on the board (evidence/device-ethernet-20261106.txt): GMAC1 is EQOS 0x51, the PHY ID 0x4f51e91b, the MAC address computed from the OTP equals the one the firmware wrote into the address registers, the link comes up at 1000 Mbit/s full duplex, the controller's self-test gets a DHCP lease in 4 ms, the router's unicast ARP reply and 4 of 4 pings, and with opi5-eth=3 iPadOS makes a service for en0, takes a DHCP lease (and renews it at T1), sets its clock, answers 93 DNS queries and 279 of 279 TCP connection attempts and takes 179 MB of TCP payload in 380 s with no controller error, no ring full and no buffer shortage.", "Found on the board and fixed: the address registers were written low word first and the controller then received every broadcast and multicast frame but no unicast frame to its own address (0 of 9178 in 150 s), so the router's ARP reply and the OS's DHCP offer (no broadcast flag) never arrived; written high word first, low word last, as the Linux driver does, unicast arrived at once.", "The link follows the PHY: a probe (opi5-eth-flap=60) powered the PHY down 15 times in 981 s and the driver went down and up 15 times at 1000 Mbit/s full, the system kept its address and its traffic; by a mistake of the probe the PHY ran one capture at 10 Mbit/s half duplex and the driver followed it with no error.", "The OS makes the service for en0 itself (the interface is IOBuiltin, which is the default of opi5-eth-builtin; the other value was not tried); the network stack is opened about 57 s after the boot, the first DHCP discover follows 5 s later.", "The DMA pool is 1 MiB at physical 0x63000000 (the controller addresses 32 bits and the kernel window is above 4 GiB), Normal non-cacheable, so there is no cache maintenance; the receive ring is polled (a 1 ms sleep when idle) and the transmit ring is filled from the OS's output function under a mutex."]
completion = ["A wired interface en0 that the OS configures by DHCP and uses for TCP and DNS, whose link follows the cable."]
limits = ["No person plugged or unplugged the cable (a PHY power-down probe stands in), looked at the Settings app, or measured throughput with a tool; 100 Mbit/s was never negotiated and IPv6 addresses were not checked; no interrupts (polled), no checksum/TSO/VLAN offload, no jumbo frames; off by default because of the Data window filling up with the OS's downloads; only the first MAC of this board's OTP was seen; the Wi-Fi and Bluetooth module and USB Ethernet are not done."]
next_action = ["Have a person look at Settings with the cable in and pull and re-plug it; measure throughput with a tool on the LAN; decide whether opi5-eth=3 becomes a default once the Data window problem is handled (a bigger Data container or keeping the OS from downloading); then the Wi-Fi/Bluetooth module (identify it on the board first) or USB Ethernet."]


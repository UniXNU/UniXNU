[[area]]
id = "storage"
status = "device-verified"
components = ["AppleKeyStoreState"]
paths = ["package/Rk3588Nvme/**", "scripts/build-orangepi5-drivers.py", "scripts/bind-nvme-storage.py", "scripts/check-vendored-patches.sh", "scripts/data/**", "dts/orangepi5.dts"]
inputs = ["M.2 M-key slot on PCIe 2.0 x1 (pcie2x1l2 through combphy0_ps, reset GPIO3_D1, 3.3 V enable GPIO0_PC5), a 128 GB NVMe drive for the ESP, the root image and the Data volume; the eMMC socket and the microSD slot are left unused."]
configuration = ["board.toml [userdata]: an ESP of 256 MiB at LBA 2048 and a 64 GiB userdata partition at LBA 526336..134744063, with the OS and SystemOS windows at its start and the Data window (1 MiB header + 2 GiB container) at its end.", "dts/orangepi5.dts exports /arm-io/pcie-nvme (compatible unixnu,rk3588-pcie-nvme, no reg, no interrupts) and keeps the pcie@fe190000 node disabled; patches/xnu/orangepi5-nvme-personality.patch matches NativeNvme to it.", "Boot arguments nvme=4, nvme-root-trust=1, nvme-data-size=2048, nvme-data-persist=1; probe-only runs use nvme=1."]
procedure = ["Write GPT, ESP (payload) and userdata to the drive with uefi-orangepi5 tools/board/nvme-install.py from a Linux booted on the board, then boot; the driver publishes the OS and SystemOS windows read-only and the Data window writable."]
findings = ["package/Rk3588Nvme follows the EVB10 eMMC driver above the controller (GPT scan, SHNGROOT root image, Data window, kernel hooks, watchdog feeder, PMGR nub) and has its own host: PCIe bring-up from the state edk2-rk3588 leaves, a polled NVMe controller core (reset, admin queue, identify, one I/O queue pair, PRP transfers through a contiguous bounce window, writes only inside the Data window).", "Host-verified: the NVMe core and the GPT reader against a controller model behind a non-coherent cache (seven mutations of the core are caught), the root manifest reader, the BAR window classification (four mutations caught), the driver compiled with -Werror and bound to the original IOBlockStorageDevice (190 slots, 11 imports), the kernel link and its bound-address check, and the installer's GPT through the driver's own reader.", "Observed on the board (evidence/device-first-boot-20261103.txt, sections 4 and 6): the PCIe controller addresses derived from the sources of edk2-rk3588 are right (APB 0xfe190000, DBI 0xa41000000, CFG0 0xa36500000: vendor 0x126f device 0x2263 class 0x10802 at 00:00.0, LTSSM L0); the drive is a Silicon Motion NE-128 with 250069680 512-byte blocks; the controller is enabled as the firmware leaves it and the driver resets and initialises it; GPT and the SHNGROOT header are read; the probe reads 4096 blocks twice with the same CRC at 72 MiB/s, 0 retries, 0 failures; the OS (5796 MiB) and SystemOS (3150 MiB) windows are published and the root device is accepted; the Data window is formatted at the first boot (64 MiB zeroed, 9216 KiB seed, 534 ms) and published writable (650 write calls, 0 failures); launchd starts 29 s after the hand-off and the kernel runs the 400 s until the capture ends without a panic.", "Found on the board and fixed (b1d3c18f): BAR0 is a 64-bit non-prefetchable BAR that edk2 places in the 32-bit window (bus 0xf0000000, CPU 0xa38000000); the first version of the driver took every 64-bit BAR for the 64-bit window and refused it. The run that carried the fix logged \"BAR0 0xf0000000 (64-bit, not prefetchable) is at CPU address 0xa38000000\" and everything after it worked.", "The link: the firmware (2.5 GT/s) and the kernel (link status Gen1 x1) see Gen1 where U-Boot reported Gen2 x1 for its own link-up; the driver does not retrain the link.", "The kernel patches of the EVB10 call two Mali hooks (mali_gpu_addon, mali_test_file); the driver defines weak versions that answer none until a display archive is linked.", "Design debts: the storage code is duplicated between Rk3588Emmc and Rk3588Nvme (a fix to the shared parts goes into both); the headers Gpt.h, RootManifest.h and StorageCommon.h are copies with the namespace renamed; the first round keeps the 2 GiB Data container of the existing seed.", "Second and later boots (evidence/device-memory-20261103.txt, section 8): the Data window's header is found again ('version 1 state 2 ... formatted 1 times') and Data mounts writable on /dev/disk3s1, the OS window as the read-only root, with the new ADT of the memory change (memory node memory@40000000, 2.5 GiB window); the driver does not read the memory node.", "scripts/build-orangepi5-drivers.py also builds the display objects and the Mali driver now (components NativeLegacyDisplay, NativeGOPPresenter, NativeKeyStoreEvents, Mali); the Rk3588Nvme entry and its bind step are unchanged and the bound-address check still passes on the two-pass kernel (18 addresses inside the audited IOStorageFamily, evidence/host-display-build-20261103.txt and host-gpu-build-20261103.txt)."]
completion = ["The kernel mounts the root and Data volumes from the NVMe drive and launchd starts."]
limits = ["Boots after the first (hdmi3, memH, memI) found the Data window's header ('formatted 1 times') and mounted it writable without formatting; that contents written in one boot are read in the next, long write loads and the cache handling under them were not checked.", "The probe's 72 MiB/s is below what the Gen1 x1 link can carry; whether the link or the polled bounce-window reads limit it was not measured.", "Only 512-byte logical blocks are supported."]
next_action = ["Write a marker file to Data, reboot and read it back, then measure the read speed with a larger probe (nvme-probe=N) and decide whether the link or the driver limits it."]


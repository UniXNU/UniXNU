[[area]]
id = "diagnostics"
status = "device-verified"
components = []
paths = ["README.md", "AGENTS.md", "docs/**", "evidence/**"]
inputs = ["UART2 on the 3-pin debug header at 1.5 Mbaud 8N1; the firmware prints its own log on the same port."]
configuration = ["serial=3 and debug=0x10014e keep the kernel console on UART2 and restart after a panic."]
procedure = ["Attach a 3.3 V USB serial adapter to the debug header and capture from power-on."]
findings = ["The serial adapter is on the board host (UART2 at 1.5 Mbaud) and the first two captures are stored as excerpts in evidence/device-first-boot-20261103.txt (the raw logs stay out of the repository).", "uefi-orangepi5 tools/board/capture.sh and capture-remote.sh record the port with times (serial-capture.py of the SoC repository, which can also type keys after a matching line: --send); docs/first-boot.md of that repository lists the log lines that settle each step (firmware, PCIe, NVMe, GPT, root, Data, userland) and what each failure means.", "The driver's PCIe, controller and identify lines did show which derived assumption was wrong (the BAR window) in the first log, as planned.", "The USB serial adapter re-enumerates when the board resets: a long capture on /dev/ttyUSB0 went silent at the watchdog reset while the board kept running. serial-capture.py now stops with '# device closed' (or 'read error') when the line goes away, and capture-remote.sh takes the device from BOARD_SERIAL_DEV.", "The firmware's memory map is in the serial log (MEMMAP lines of UniXNUMemMapDxe: before the menu, when it changes, and at ExitBootServices); capture-remote.sh can type Ctrl-C at the U-Boot banner (--send 'U-Boot v' ctrl-c,...) and stop on the prompt, so a run starts and ends without anyone at the board.", "evidence/device-display-firmware-20261103.txt is cut from the same capture as the memory evidence (memN); the EDID dump is left out of it because it carries the monitor's serial number (the lines about the EDID stay).", "The host records of the display and Mali builds (evidence/host-display-build-20261103.txt, host-gpu-build-20261103.txt) state which checksums were written to the ESP over U-Boot and which were verified; the file written last (the display kernel without Mali, f7215c41) is the one whose read back aborted U-Boot and is unverified.", "evidence/device-vop-direct-20261105.txt is an excerpt of capture vop2b after esp-put verified kernel crc32 6612adcc: VOP direct iommu 1 with zero CPU copies.", "evidence/device-usb-dvfs-20261105.txt is an excerpt of the captures usb6, usb8, usbg2, bisC and soak1 after esp-put-delta verified kernel crc32 a7b54353. A silent reset shows in the serial log as the firmware's DDR training line in the middle of the kernel log (no panic text; CRU GLB_RST_ST reads 0 after it, as after a watchdog reset), and wdt-kick=100 in the ESP unixnu.toml makes the board restart itself about every 190 s, so one capture covers several boots without anyone at the board.", "The video decoder self-test (rk3588-vdec=N) reports on the serial console only: per-job lines 'done status 0x107 N us crc X expected X: ok' and a per-trace summary; evidence/device-vdec-20261107.txt keeps an excerpt of the vd3 capture and the checksums of the kernel and the ESP image, and docs/media.md says how to repeat the run.", "Two more evidence files for the video decoder (2026-11-07): evidence/host-vdec-hevc-20261107.txt (six H.265 traces, how the reference pictures were checked against the stream's picture hash SEI, the two recording-shim faults) and evidence/device-vdec-hevc-20261107.txt (board runs vd4 and vd5: per-trace results, timing, image hashes, what the replay does not show); the raw serial logs stay on the board host.", "evidence/host-d5500-abi-20261107.txt is a static reading of the AppleD5500 kext and the H264H8 video decoder plug-in (selector table with sizes, what the plug-in puts into the decode call, what is not known); no board run, the extracted shared cache used is rebuilt as described in uefi-evb10/tools/xnu-probe/symbolize/README.md.", "evidence/host-mpp-kernel-port-20261107.txt: unresolved-symbol census of MPP's H.264 parser and vdpu34x register generator and the kernel-flags syntax check of the parser (UniXNU-rk3588-common tools/mpp-kernel-syntax-check.py, 45c0876); host only.", "evidence/device-vdec-d5500-20261107.txt is cut from the captures vt25, vt26, vt28, vt29 and vt30 (VideoToolbox through the AppleD5500 service: the failures before the pmap cache fix, the 248 sessions after it, the end of vt29 at 716 s when the adapter re-enumerated); the raw logs stay on the board host.", "The video encoder self-test (rk3588-venc=N) reports on the serial console only: per-job lines 'ok status 0x1 stream N bytes in N us, crc X' and a per-trace summary, and with the dump on the stream bytes as hex; evidence/device-venc-20261108.txt keeps the vc2 and vc4 numbers, the checksums of the kernel and the ESP image and the host decode of all twelve streams, evidence/host-venc-20261108.txt the host test, the mutants, how the traces were recorded and the corrupted-byte control; the raw serial logs stay on the board host.", "evidence/device-ave2-abi-20261108.txt is cut from the captures ave1, ave10, ave11 and ave20 (the AppleAVE2 service: VideoToolbox opens a hardware H.264 compression session, the selector sequence, the plug-in's request ring, the two faults that kept the Start answer from working (the kext address slide, the frames-in-flight answer), the first YUV record, the callback still failing with -12912 after about two minutes); the raw logs stay on the board host.", "The encoder core reports on the serial console only: rk3588-venc=6 prints each self-test recipe ('core NAME: WxH, N pictures', per picture the bytes, the quantizer, whether it is an IDR, the time in all and on the block, a CRC, and with rk3588-venc-core-dump=1 the stream as hex) and a summary with the stack depth; every core stream of a VideoToolbox session prints its settings on open and its pictures, jobs, bytes, time a picture and stack depth on close; evidence/device-venc-core-20261109.txt keeps those lines, the host decodes and the negative control, evidence/host-venc-core-20261109.txt the host test; the raw serial log stays on the board host.", "evidence/device-venc-core-h265-20261109.txt and evidence/host-venc-core-h265-20261109.txt are the same kind for H.265: the self-test lines of the seven H.265 recipes, the H.265 core streams' open and close lines, the host decodes (libhevc) and the host test with the re-recorded H.265 traces; the first of them also corrects the readback wording of device-venc-core-20261109.txt (upgrade_tool's rl readback of the ESP never matches the image; the log is what shows which kernel ran)."]
completion = ["A boot log from the board is stored with the evidence."]
limits = ["Excerpts, not the raw logs, are kept in the repository; each evidence file names the command that repeats its run."]
next_action = ["Capture a cold power-on run and the second boot over the formatted Data window and add them as evidence."]


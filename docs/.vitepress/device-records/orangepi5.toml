findings = ["Observed (evidence/device-display-firmware-20261103.txt): the firmware detects HDMI0, reads the EDID (2 blocks, preferred mode 1920 x 1080 @ 60 Hz), sets VOP2 video port 2 with Esmart window 2 to 1920x1080p60 (VOP VP2 enable Esmart2[1920x1080->1920x1080@0x0] fmt[0] addr[0xE73D0000]; HDPTX PHY locked, DwHdmiQp in HDMI mode) and DarwinBoot hands the kernel the frame buffer 'video base=0xE73D0000 display=1 row=7680 width=1920 height=1080 depth=32' (8294400 bytes inside the 'runtime data' run 0xE73D0000-0xE7BC0000 of the memory map).", "Reported by the user (evidence/device-hdmi-watchdog-20261103.txt, not photographed): with vc_mirror=1 (entry xnu-hdmi) the kernel log scrolls as text on the monitor, so the kernel can write to that frame buffer; no display driver is in the kernel.", "Host-verified: the kernel built for this board already carries the original IOMobileGraphicsFamily, IOSurface and IOGPUFamily (kernel.json original_executable_sha256), which the EVB10's display pass needs as its reference candidate.", "The EVB10 display stack is a two-pass kernel build (configs/evb10_defconfig, then evb10_display_defconfig with CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y; scripts/build-evb10-display.py, build-display-abi.py, build-native-legacy-display.py, build-link-stubs.py, build-evb10-hid.py) plus a board display backend (package/Evb10Display/NativeLegacyDisplay.cpp with a VOP2 direct-scanout path) and a 1040-line probe (package/LegacyDisplayProbe.cpp) that also starts HID, touch, Wi-Fi, audio, DVFS and the Mali; its VOP2 values are for the EVB10's panel (host reading of the sources).", "Host-verified (evidence/host-display-build-20261103.txt, device repository f2831c1): configs/orangepi5_display_defconfig and the two-pass scripts/build-orangepi5-kernel.sh build the display kernel with UniXNU's own drivers/GopFramebuffer backend (NativeLegacyDisplay with the GOP presenter: the UI is copied into the frame buffer DarwinBoot hands over, 1920x1080x32 at 0xE73D0000) bound to the unchanged original IOMobileFramebufferLegacy (358 virtual entries: 24 own, 154 inherited native, 7 guarded backend leaves, 193 symbols bound into the original executable, original_instructions_modified false), with package/LegacyDisplayProbe.cpp reduced to the display (no touch, Wi-Fi, audio, DVFS, Mali; opi5-hid=1 loads only the original IOHIDFamily and IOHIDEventDriver). kernel.macho 51286016 bytes, sha256 2425c31b..., the NVMe bound-address check passes, the payload carries the display arguments (553 of 1000 bytes).", "configs/orangepi5_display_defconfig force-loads libMali.a besides libRk3588Nvme.a, and the late probe (package/LegacyDisplayProbe.cpp) calls mali_start() after the HID start; the call returns at once without mali=N, so the display trial is not changed by it (gpu area, evidence/host-gpu-build-20261103.txt; the display kernel is then 51658752 bytes, crc32 of the payload copy 7bec4f41)."]
completion = ["The kernel draws the boot screen on the HDMI monitor and SpringBoard appears."]
limits = ["Nothing of the display kernel has run on the board: the build links, but whether the display classes load, the original IOMobileFramebufferLegacy initialises, the copy into the frame buffer shows a picture and SpringBoard comes up without a GPU is unknown. The trial kernel, ADT and unixnu.toml are on the ESP, the kernel file is not verified (the crc32 over it aborted U-Boot, see docs/first-boot.md section 9) and the board hung there, waiting for its power to be cycled.", "The pixel order of the frame buffer and the VOP2 registers the firmware leaves were not read (only its log lines)."]
next_action = ["After the power cycle: stop at the U-Boot prompt, read the kernel back at 0xa000000 and compare crc32 f7215c41 over 0x30e9000, boot entry xnu-hdmi (key 2) with the serial capture, read the 'opi5: display' lines, ask the person at the monitor what it shows; later a VOP2 scanout of its own on video port 2 for frame rate."]


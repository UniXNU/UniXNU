schema_version = 1

[device]
name = "orangepi5"
soc = "RK3588"
os_profile = "ipados-17.7.11-21H461"
summary = "Orange Pi 5 (Rockchip RK3588S) with an HDMI display and an M.2 NVMe drive, planned to run the iPadOS 17.7.11 userland on a source-built XNU, started from edk2-rk3588 firmware (uefi-orangepi5). Shared SoC support is in UniXNU-rk3588-common, which the EVB10 port already proved on hardware. Nothing in this repository has run on an Orange Pi 5 yet: the configuration resolves, the kernel with the NVMe driver builds and links, and the payload and the NVMe image are assembled and checked on the host; every area below records what is still to be measured."

[[area]]
id = "configuration"
status = "host-verified"
components = []
paths = ["board.toml", "feeds.toml", "configs/**", ".github/**", ".gitignore", ".env.example", "local.toml.example", "unixnu.lock", "LICENSE", ".gitattributes", "scripts/build-orangepi5-kernel.sh"]
inputs = ["ARM64 profile, rk3588 SoC source pinned in feeds.toml, iPadOS 17.7.11 build 21H461 profile, orangepi5_defconfig."]
configuration = ["board.soc_source = rk3588; board.os_profile = ipados-17.7.11-21H461; schema_version = 2.", "orangepi5_defconfig keeps the console kernel with NVMe storage: no display, no GPU, no RAM disk, no UFS; the trust-cache runtime and the code-signing hash cache stay on.", "[adt.defaults.u32] carries sleep-disabled = 1 and vmm-present = 1, which the EVB10 port found necessary for watchdogd."]
procedure = ["From the UniXNU checkout run ./unixnu defconfig orangepi5_defconfig -D ../UniXNU-orangepi5, then ./unixnu fetch, ./unixnu status --json and ./unixnu tree with the same -D.", "scripts/build-orangepi5-kernel.sh runs the kernel build; it needs the environment of the machine that builds (.env) and CMake 3.19.6 or newer."]
findings = ["Resolution is host-verified: defconfig, fetch, status --json and tree complete against the pinned SoC repository.", "The UniXNU bootstrap pass builds AvailabilityVersions with CMake; the distribution CMake of Ubuntu 20.04 is 3.16 and fails, so the build script puts /usr/local/bin first.", "The kernel now carries the NVMe driver: board.toml archives build-orangepi5-drivers.py Rk3588Nvme and bind-nvme-storage.py, the defconfig force-loads libRk3588Nvme.a, and the build script verifies the bound addresses against the kernel (18 addresses inside the audited IOStorageFamily).", "board.toml [userdata] is the layout of the 128 GB drive: userdata at LBA 526336..134744063 behind a 256 MiB ESP at LBA 2048; the boot arguments are the EVB10 ones with the storage names of the NVMe driver (nvme=4, nvme-root-trust=1, nvme-data-size=2048, nvme-data-persist=1)."]
completion = ["Every source pin resolves, ./unixnu status lists the intended patch order, and the defconfig materialises."]
limits = ["The kernel configuration is the console minimum; storage, display, GPU and input join it as those drivers exist (docs/bring-up.md)."]
next_action = ["Add the display archive to board.toml when the display driver exists."]


inputs = ["RK806 PMIC on SPI (BUCK1 GPU, BUCK2 little cores), RK8602 and RK8603 at 0x42 and 0x43 on I2C0 for the big cores, HYM8563 RTC at I2C6 0x51, a PWM fan header, no remote power switch."]
configuration = ["The firmware initialises the rails; the GPU rail is set to 0.75 V at build time (GPU_RAIL_UV in uefi-orangepi5). The kernel keeps the hardware watchdog fed with wdt-kick=1800."]
procedure = ["Run the kernel and read the watchdog behaviour on the serial console; CPU and GPU frequency management reuse the EVB10 DVFS tables once the probe hook exists."]

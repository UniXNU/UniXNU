schema_version = 1

[device]
name = "orangepi5"
soc = "RK3588"
os_profile = "ipados-17.7.11-21H461"
summary = "Orange Pi 5 (Rockchip RK3588S) with an HDMI display and an M.2 NVMe drive, running the iPadOS 17.7.11 userland on a source-built XNU, started from edk2-rk3588 firmware (uefi-orangepi5). Shared SoC support is in UniXNU-rk3588-common, which the EVB10 port already proved on hardware. Observed on the board (2026-11-03..05): U-Boot starts the firmware from the NVMe ESP; NVMe root and persistent Data mount; SpringBoard and Mali Metal compose over HDMI0 through the shared RK3588 VOP2 direct scanout (iommu paging, no CPU GOP copy). Network and audio drivers are not started yet; DVFS is not hooked; physical USB input is not brought up (a software HID digitizer stand-in is linked)."

[[area]]
id = "configuration"
status = "host-verified"
components = []
paths = ["board.toml", "feeds.toml", "configs/**", ".github/**", ".gitignore", ".env.example", "local.toml.example", "unixnu.lock", "LICENSE", ".gitattributes", "scripts/build-orangepi5-kernel.sh"]
inputs = ["ARM64 profile, rk3588 SoC source pinned in feeds.toml, iPadOS 17.7.11 build 21H461 profile, orangepi5_defconfig."]
configuration = ["board.soc_source = rk3588; board.os_profile = ipados-17.7.11-21H461; schema_version = 2.", "orangepi5_defconfig is the console kernel with NVMe storage and the Mali driver linked (inert without mali=N): no display, no RAM disk, no UFS; orangepi5_display_defconfig, the configuration of the image, adds CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y and the link stubs (scripts/build-orangepi5-kernel.sh builds the two in that order); the trust-cache runtime and the code-signing hash cache stay on.", "[adt.defaults.u32] carries sleep-disabled = 1 and vmm-present = 1, which the EVB10 port found necessary for watchdogd."]
procedure = ["From the UniXNU checkout run ./unixnu defconfig orangepi5_defconfig -D ../UniXNU-orangepi5, then ./unixnu fetch, ./unixnu status --json and ./unixnu tree with the same -D.", "scripts/build-orangepi5-kernel.sh runs the kernel build; it needs the environment of the machine that builds (.env) and CMake 3.19.6 or newer."]
findings = ["Resolution is host-verified: defconfig, fetch, status --json and tree complete against the pinned SoC repository.", "The UniXNU bootstrap pass builds AvailabilityVersions with CMake; the distribution CMake of Ubuntu 20.04 is 3.16 and fails, so the build script puts /usr/local/bin first.", "The kernel now carries the NVMe driver: board.toml archives build-orangepi5-drivers.py Rk3588Nvme and bind-nvme-storage.py, the defconfig force-loads libRk3588Nvme.a, and the build script verifies the bound addresses against the kernel (18 addresses inside the audited IOStorageFamily).", "board.toml [userdata] is the layout of the 128 GB drive: userdata at LBA 526336..134744063 behind a 256 MiB ESP at LBA 2048; the boot arguments are the EVB10 ones with the storage names of the NVMe driver (nvme=4, nvme-root-trust=1, nvme-data-size=2048, nvme-data-persist=1).", "board.toml payload.dram_size and payload.adt.owned_memory_size are 0xF8000000 (3.875 GiB, in the 4 GiB bank at 0x100000000) now, the window measured on the board (memory area, evidence/device-memory-20261103.txt); the old 4 GiB and 2 GiB values were EVB10 placeholders.", "The kernel is built in two passes now and carries the GOP-backed legacy display (board.toml archive build-orangepi5-display.py, component GopFramebuffer, the offline-legacy-* and sheng-* arguments; evidence/host-display-build-20261103.txt) and the Mali-G610 driver (archives build-mali-firmware.py and build-orangepi5-drivers.py Mali, libMali.a force-loaded by both defconfigs, no mali argument in the list; evidence/host-gpu-build-20261103.txt). Both link on the host.", "board.toml now defaults mali=8 mali-metal=1 evb10-gpu-addon=1, rk3588-vop-direct=1 with esmart=2/vp=2/fence=1, opi5-hid-input and sheng-touch-hid, and thin-bezel=1; feeds.toml pins UniXNU-rk3588-common at b5f5d94 (Rk3588VopDirect). Observed on the board with that list (evidence/device-vop-direct-20261105.txt).", "board.toml now also defaults rk3588-dvfs=6 and opi5-usb=5 (DVFS governors + OHCI HID) and rk3588-gpu=0 (GPU governor off, see the power area); the kernel argument list is 772 bytes.", "board.toml also defaults mali-wallpaper-fit=1 (the Metal plugin fits the disc-shaped lock screen wallpaper to the 16:9 panel; gpu area, evidence/device-wallpaper-20261105.txt); the kernel argument list is 793 bytes.", "board.toml boots with mali-sched-wait=2 (811 bytes of kernel command line): ten of ten SplashBoard launch pictures whole in two boots, two to four bad of five without it (evidence/device-snapshots-20261106.txt, runs d28-d34).", "board.toml builds build-rk3588-vdec.py (the SoC repository's Rk3588Vdec archive with this board's DMA window, package/Rk3588VdecBoard.cpp); no boot argument was added to the defaults: the video decoder self-test runs only with rk3588-vdec=N (docs/media.md, evidence/device-vdec-20261107.txt).", "board.toml builds build-rk3588-venc.py (the SoC repository's Rk3588Venc archive with this board's DMA window, package/Rk3588VencBoard.cpp, force-loaded by orangepi5_display_defconfig); no boot argument was added to the defaults: the video encoder self-test runs only with rk3588-venc=N (docs/media.md, evidence/device-venc-20261108.txt).", "feeds.toml pins the SoC repository at 7281615, which has the AppleAVE2 service of the encoder archive (boot argument rk3588-venc-ave2=N, not in the defaults; it logs the calls, answers Start with kernel-made IOSurfaces and four frames in flight, and dumps the first YUV requests; docs/media.md, evidence/device-ave2-abi-20261108.txt).", "feeds.toml pins the SoC repository at c0b78e3, which has the encoder core for H.264 and H.265 behind the AppleAVE2 service (boot arguments rk3588-venc=6 and rk3588-venc-ave2-encode=2, not in the defaults; its core/ compiles 63 files of the pinned MPP and takes two more by #include, fetched by tree hash and never copied into a repository; docs/media.md, evidence/device-venc-core-20261109.txt, evidence/device-venc-core-h265-20261109.txt)."]
completion = ["Every source pin resolves, ./unixnu status lists the intended patch order, and the defconfig materialises."]
limits = ["Network and audio still have no driver; the GPU governor is off by default; a keyboard is not attached yet; the default menu entry is still xnu-probe."]
next_action = ["DEFAULT_ENTRY=xnu MENU_TIMEOUT=3 rewrite of esp.img; Ethernet or Wi-Fi."]


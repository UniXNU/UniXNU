configuration = ["serial=3 and debug=0x10014e keep the kernel console on UART2 and restart after a panic."]
procedure = ["Attach a 3.3 V USB serial adapter to the debug header and capture from power-on."]
findings = ["The serial adapter is on the board host (UART2 at 1.5 Mbaud) and the first two captures are stored as excerpts in evidence/device-first-boot-20261103.txt (the raw logs stay out of the repository).", "uefi-orangepi5 tools/board/capture.sh and capture-remote.sh record the port with times (serial-capture.py of the SoC repository, which can also type keys after a matching line: --send); docs/first-boot.md of that repository lists the log lines that settle each step (firmware, PCIe, NVMe, GPT, root, Data, userland) and what each failure means.", "The driver's PCIe, controller and identify lines did show which derived assumption was wrong (the BAR window) in the first log, as planned.", "The USB serial adapter re-enumerates when the board resets: a long capture on /dev/ttyUSB0 went silent at the watchdog reset while the board kept running. serial-capture.py now stops with '# device closed' (or 'read error') when the line goes away, and capture-remote.sh takes the device from BOARD_SERIAL_DEV.", "The firmware's memory map is in the serial log (MEMMAP lines of UniXNUMemMapDxe: before the menu, when it changes, and at ExitBootServices); capture-remote.sh can type Ctrl-C at the U-Boot banner (--send 'U-Boot v' ctrl-c,...) and stop on the prompt, so a run starts and ends without anyone at the board.", "evidence/device-display-firmware-20261103.txt is cut from the same capture as the memory evidence (memN); the EDID dump is left out of it because it carries the monitor's serial number (the lines about the EDID stay).", "The host records of the display and Mali builds (evidence/host-display-build-20261103.txt, host-gpu-build-20261103.txt) state which checksums were written to the ESP over U-Boot and which were verified; the file written last (the display kernel without Mali, f7215c41) is the one whose read back aborted U-Boot and is unverified."]
completion = ["A boot log from the board is stored with the evidence."]
limits = ["Excerpts, not the raw logs, are kept in the repository; each evidence file names the command that repeats its run."]
next_action = ["Capture a cold power-on run and the second boot over the formatted Data window and add them as evidence."]

[[area.evidence]]
kind = "source"
reference = "README.md"
result = "Repository overview and status"

[[area.evidence]]
kind = "device"
reference = "evidence/device-first-boot-20261103.txt"
result = "The first serial logs of the board, excerpted"
command = "cd uefi-orangepi5 && tools/board/capture-remote.sh auto1 330 (reset typed at the U-Boot prompt); CAPTURE_ARGS=\"--send 'menu: shown' text:1\" tools/board/capture-remote.sh xnu1 480"
revision = "b1d3c18fc1ba985101e5d3c372d18e59d0378df4"

[[area.evidence]]
kind = "device"
reference = "evidence/device-hdmi-watchdog-20261103.txt"
result = "HDMI text mirror, the watchdog reset and the adapter that drops off the bus, excerpted"
command = "cd uefi-orangepi5 && CAPTURE_ARGS=\"--send 'menu: shown' text:2\" tools/board/capture-remote.sh hdmi3 1500 /dev/serial/by-id/ADAPTER"
revision = "b1d3c18fc1ba985101e5d3c372d18e59d0378df4"

[[area.evidence]]
kind = "host"
reference = "evidence/host-gpu-build-20261103.txt"
result = "Checksums of the Mali-linked display kernel and its payload (kernel crc32 7bec4f41), and what the ESP holds"
command = "source host/env.sh && cd UniXNU-orangepi5 && scripts/build-orangepi5-kernel.sh && cd ../uefi-orangepi5 && REBUILD=1 tools/board/make-bundle.sh"
revision = "ce6c6fb8d6f31b3c0a87dd4ead1f6d444c79f366"

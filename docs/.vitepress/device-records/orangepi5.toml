findings = ["On the board with mali=8 mali-metal=1 (same runs as the VOP evidence): mali user status shows SpringBoard and poster extensions composing (vkpipe failed=0); VOP flips the Metal surfaces without a CPU copy.", "The GPU stopped for good 80 to 400 s after boot (a person at the mouse: the pointer and the lock screen clock froze, MMU page fault in the address space of backboardd at address 0, then the CSG firmware stopped answering TERMINATE). In all ten serial logs with such a fault (7 Orange Pi 5, 3 EVB10) it comes within 0.5 s after the restart of a group that had run before: the driver evicted idle groups with TERMINATE and restarted them with START and zeroed suspend buffer and queue pages, so the persistent CS registers that PanVK sets in the first job only were zero. package/Mali 7b8aa39 evicts with CSG SUSPEND and restarts with RESUME and keeps the queue pages and suspend buffers per group; on the board (gpu5, no mouse, 855 s) the same restart (group 1 at 309.0 s) does not fault, with no suspend failure, no STALL line, no backboardd exit and no panic, and the swap counter keeps counting (evidence/device-mouse-gpu-20261105.txt).", "The cause is concluded from the timing, the address 0 and from the same event passing after the change; the CS registers of a restarted group were not read.", "The black ellipse on the lock screen is not a layer format or compositing fault: J120.HEIC is a 3416x3416 two-plane YCbCr disc and SpringBoard lays it out as a 1798x2338 quad for a 4:3 screen in portrait, so a 16:9 landscape panel gets a 61 pixel black strip at each side and the picture stretched into an ellipse (dump of the draws on the board). package MaliMetal b165316 adds mali-wallpaper-fit=1 (default in board.toml): the frontend replaces that quad and its antialiasing fringe by a square that holds the viewport; on the board (wp1) the lock screen covers the whole panel without the black ellipse (evidence/device-wallpaper-20261105.txt).", "The backboardd exit with signal 11 (real3, 96 s, a person at the mouse) was a read through a freed object in objc_msgSend called from the Metal plugin: the table of held IOSurface imports kept an unretained IOSurfaceRef while Core Animation hands a new wrapper for the same surface every frame. MaliMetal b1c580f makes the entry retain it; the idle lock screen then ran about 25 minutes without a backboardd or SpringBoard exit (dump1, dump2, wp1). The cause is concluded from the crash registers and the code, not reproduced on demand.", "First launch of an app: the black blocks were the launch pictures SplashBoard keeps (made once, by an older stack, then reused) and, once those are replaced, new ones read before the GPU had finished (half empty or cut in 2 to 4 of 5 per boot). The plugin replaces the old pictures once per Data volume (marker file) and, with mali-sched-wait=2, the render server delivers scheduled when the GPU is done: ten of ten pictures whole in two boots, no black rectangle in the first-launch frames of five apps, no SpringBoard exit in 12 boots (d28-d39).", "Video decoder bring-up (UniXNU-rk3588-common Rk3588Vdec, rk3588-vdec=N, off by default, docs/media.md): on the board (run vd3) the driver's own PMU sequence powers the VDPU and RKVDEC0 domains, the clocks land at 750 / 594 MHz, the block reads ID 0x53813f05 with its IOMMU in bypass, and four H.264 traces recorded from unmodified Rockchip MPP on a host (CABAC, CAVLC, B pictures at 320x240, CABAC at 1280x720) were replayed 50 times each: 2000 of 2000 jobs finish with status 0x107 and every output picture's CRC-32 equals libavc's decoded picture (50 to 100 us per 320x240 picture, 0.6 ms per 720p picture). The first run panicked because the 16 MiB DMA window was mapped with ml_io_map_wcomb and XNU's io_submap is 8 MiB; it is mapped through IOMemoryDescriptor now. Host test: 7071 checks against a model of the block's registers with the sanitizers, five mutations of the player each fail it (evidence/host-vdec-20261107.txt, evidence/device-vdec-20261107.txt).", "H.265 on the same block (run vd4: every trace once, vd5: 30 passes; evidence/device-vdec-hevc-20261107.txt): six more traces recorded from MPP's h265 parser and vdpu34x register generator with libhevc reference pictures that equal the picture hash SEI of each stream (320x240 plain, B pyramid with reordering and non-reference B pictures, default scaling matrices, deblocking off, WPP entry points, and 1280x720) were replayed and every picture's CRC-32 equals libhevc's: 10 of 10 traces ok, 3000 of 3000 jobs in the 30-pass run, status 0x107, 50 to 57 us per 320x240 picture and 0.49 ms per 720p picture, no kernel panic. No driver change was needed (same power, clocks and DMA window; only the register image differs). On the host two faults of the recording shim had to be fixed: it answered the hardware ID query with a made-up value, so MPP used its older register layout (it takes the vdpu34x H.265 path only for 0x53813f05, the ID the board reads), and it lacked a lock, so a job of a B-pyramid recording went missing (evidence/host-vdec-hevc-20261107.txt; host test now 10483 checks, 0 failed).", "AppleD5500 interface read from the original kext and the VideoToolbox plug-in (static, evidence/host-d5500-abi-20261107.txt, docs/media.md): the kext carries Imagination's host decoder code (parameter sets, slice headers, reference lists, DPB) and the user client has eight structure-only external methods (CreateDecoder 0x110/0x48, DestroyDecoder, DecodeFrameFig 0x858/0x410, MapPixelBuffer, UnmapPixelBuffer, SetCryptSession, two unnamed), so a kernel replacement on rkvdec2 needs its own parser and DPB in front of the replayable register generation; nothing of it ran on the board.", "Way A for the iPadOS side of the video decoder was chosen (docs/media.md, plan only): the AppleD5500 service + user client (eight selectors; selector 7 SetCallback = asynchronous frame results) on top of MPP's own H.264 parser and vdpu34x register generator running in the kernel. Host measurement (evidence/host-mpp-kernel-port-20261107.txt): the ten parser files compile with the kernel's flags against a libc shim (only libc declarations missing), and parser plus generator need about 120 helper names from the rest of MPP; nothing was linked into a kernel or run on the board at that point (the next entries are the work that followed).", "AppleD5500 service and user client over that core, driven by iPadOS's own VideoToolbox (rk3588-vdec=7, evb10-exec=2; evidence/device-vdec-d5500-20261107.txt, docs/media.md): a signed tool run as launchd's job com.apple.ptpd (its trust cache entry needs launch-constraint category 7) asks for a hardware-required H.264 VTDecompressionSession on the four embedded streams; H264H8.videodecoder finds the AppleD5500 service, creates the decoder (the avcC extradata sits in the ring buffer at offset 0), sends length-prefixed frames and reads asynchronous completions and 0x410-byte result records; every returned NV12 picture's CRC-32 equals the reference decoder's: 248 of 248 sessions (vt29: 15 passes, vt30: 16 passes, up to 727 s after boot, two boots), no panic. The first runs (vt25, vt26) failed from 70 to 150 s on in three ways (extradata all zero, one 64-byte line of a frame zero, then every picture flagged as an error): the cause is the batch path of the pmap, which never cleans or invalidates the data cache when pages become non-cacheable (the write-combined IOSurface ring), so a later write-back of a dirty line puts zeros or old data over the owner's stores; patches/xnu/rk3588-wc-batch-flush.patch in the SoC series adds the flush (vt26 without it: 8 of 24 sessions right; with it 24 of 24 in vt28, 248 of 248 in vt29 and vt30). The cause is concluded from the source of this XNU and from the failures stopping after the change, not from a cache dump.", "Where a frame's time went (runs vt31 - vt34, evidence/device-vdec-perf-20261107.txt): the 25 to 28 ms (320x240) and 300 ms (720p) a frame took through the service were its own default-on diagnostic, a CRC-32 of every picture read twice a byte at a time through uncached memory (about 100 ns a byte, 99 % of the frame); it now runs only at rk3588-vdec-d5500-log=2. Without it a frame is about 0.3 ms (320x240) and 2.2 ms (720p) in the service (the block 0.07 and 0.65 ms from start to interrupt, the CPU copy into the surface 0.07 and 1.2 ms), and a ten-picture VideoToolbox session takes 158 ms and 1.45 s instead of 400 ms and 4.25 s; the rest of that was the test tool reading each pixel buffer byte by byte (101 to 107 ns a byte), which it now copies out with memcpy first: 49 ms and 147 ms a session. The mpp_buf_slot assertion at the B-frame stream's DestroyDecoder (14 of 14 sessions in vt31) is gone since vdec_core_destroy resets the core first (none in 96 B-frame sessions of vt32 - vt34, whose 128-session runs all passed; the probe was changed in the same step). The 485 us of 'prepare' per frame is most likely the default log lines (an inference, never run with them off).", "RGA3 copy of the decoded picture into the output surface (UniXNU-rk3588-common Rk3588Rga, rk3588-rga=5, off by default, docs/media.md, evidence/host-rga-20261107.txt, evidence/device-rga-20261107.txt): RGA3 core 0 with its Rockchip IOMMU reaches every page of an IOSurface (RGA2 cannot, it has a 32-bit table); on the board the block reads version 0x30076831, the IOMMU walks scattered 40-bit pages, six picture shapes copy byte-identically with the IOMMU off and on, a copy to an unmapped address stops with an error bit and a page fault and the next copy after a reset is right. It does about 3.8 pixels per clock (720p 326 us at 750 MHz, the setting found at boot, the default). Through VideoToolbox the 720p frame in the service fell from 2241 to 1319 us (the copy from 1227 to 339 us) and every picture's CRC-32 stayed the reference decoder's: 128 of 128 sessions in the 396 MHz run and in the final configuration, every picture through the block, none by the CPU, no failure; one other boot lost a session to videocodecd killed by SIGKILL before any picture (not the block's, described in the evidence file). Host: 4357 checks against strict models with the sanitizers, 32 mutants all killed.", "More H.264 streams in the video decoder's self-test (UniXNU-rk3588-common 2ef3e31, evidence/host-vdec-h264-streams-20261107.txt, evidence/device-vdec-h264-streams-20261107.txt): thirteen High profile streams made with x264 (CABAC / CAVLC with the 8x8 transform, JVT scaling matrices, four slices, MBAFF, MBAFF with slices, frame_mbs_only_flag 0, six references with a B pyramid, P-only, IDR-only, a 312x234 crop, 720p, 1080p) decode bit-exactly on the Orange Pi 5 in all three paths: the replay of MPP's register images (23 of 23 traces), the in-kernel core (17 of 17 streams, 1.7 ms per 1080p picture on the block) and VideoToolbox through AppleD5500 with the RGA3 copy (16 passes of two rounds over 17 streams: 544 runs, 0 failed, the cropped streams at their visible size). The decoder's DMA window is 64 MiB now (a 1080p trace needs 34 MiB) and the RGA3's window moved to 0x69000000. The first failing job on the board (a wrong expected CRC: x264 pads an interlaced 240-row picture to 256 rows and crops it, the block writes the padded one) found a bug that no earlier run could: the driver's recovery pulsed SOFTRST_CON(20), which are the DDR controller's reset lines (ids 320 to 323 in the vendor header; the block's are SOFTRST_CON(40) bits 2 to 9), and the board stopped until its watchdog reset it 89 s later, on every boot of four runs; fixed (UniXNU-rk3588-common 16f4b7a) and exercised on purpose with rk3588-vdec-reset-test=1 (a failing job, the reset, then 23 of 23 traces again). Not covered: H.264 PAFF, High 10 / 4:2:2, streams with errors, a block that is really stuck (the reset ran on a healthy one), H.265 behind AppleD5500.", "The in-kernel core also runs MPP's H.265 parser (h265d) and vdpu34x H.265 register generator: six libhevc streams (I/P, B pyramid with reordering, default scaling matrices, deblocking off, WPP entry points, 320x240 and 1280x720) give the recorded register images on the host (UniXNU-rk3588-common 4b366f5, tests/run-core.sh 52692 checks, 0 failed, fed whole and in 4093/1000/7 byte pieces) and 10 of 10 pictures each with the reference's CRC-32 on the board (rk3588-vdec=5, 23 of 23 streams). MPP's own splitter overwrote the first four bytes of a handed-out frame when a start code was cut by the end of an input piece (one stream, 1000-byte pieces), so the core cuts access units itself with MPP's rule; two of four mutations of that cutter survive (multi-slice and prefix-SEI cases no stream covers).", "H.265 behind AppleD5500, through VideoToolbox's own hardware decoder (UniXNU-rk3588-common b12daa3, evidence/host-d5500-hevc-20261108.txt, evidence/device-vdec-d5500-hevc-20261108.txt, docs/media.md): the plug-in registers its HEVC decoder classes only when the first AppleD5500 service has the boolean property HEVCSupported (read from the disassembly of H264H8Register / AppleD5500CheckPlatform), which the service now sets (rk3588-vdec-hevc=0 turns it off). On the board (run vh1, rk3588-vdec=7 rk3588-rga=5, 16 passes of 46 sessions, 641 s) VTIsHardwareDecodeSupported(HEVC) is 1 and 736 sessions (192 of them H.265: six streams, 320x240 and 1280x720) all returned pictures with the reference decoders' CRC-32, no failed frame, every picture through the RGA3, no panic; the plug-in makes the same calls for both codecs (codec word 3 instead of 2, extradata = length-prefixed VPS/SPS/PPS, frames length-prefixed), a frame is 289 us (320x240) and 1158 us (720p) in the service. The service tells the codec from the extradata (D5500Stream.h, host test tests/run-d5500.sh: 6489 checks over 23 streams in five extradata layouts and three framings, three mutants killed, one survivor listed) and ends each call's access unit with a delimiter so the core's H.265 cutter emits it at once; an H.265 unit carries the pts of the call that held its first slice segment (it carried the call before's).", "Zero-copy decoding into the VideoToolbox output surface looked into (docs/media.md, evidence/device-vdec-d5500-hevc-20261108.txt): in all 736 sessions of vh1 the plug-in maps one output surface per decoder (MapPixelBuffer twice: the ring and one picture surface) and names the same output slot in every DecodeFrameFig, so it is a staging surface read once per picture, not a pool of reference pictures; the decoder's DPB would still have to be a second picture, so the rkvdec2 IOMMU bring-up was not started (an inference from the call pattern, nothing tried on the board).", "Video encoder (2026-11-08, rk3588-venc=4, hardware): RKVENC0 (VEPU580, ID 0x50603312) is powered (VENC0 domain was off), clocked (aclk 500 MHz, core 750 MHz) and replays twelve recorded H.264/H.265 encode jobs from unmodified MPP 9b56348; every job ends with status 0x1, 20 passes give the same stream, 158 to 172 us per frame at 320x240, 443 us at 640x360, 1.72 ms at 720p, and the twelve streams decode on the host with libavc/libhevc, every picture, luma PSNR 37.0 to 45.9 dB (P pictures included). The vendor safe reset times out on this block (ignored, reset lines pulsed). No iPadOS user of the encoder.", "Video encoder through VideoToolbox (2026-11-08, ave28..ave30, hardware): with the finished-frame fields the plug-in's handler reads (found by running it on the host with tools/ave_emu.py: header bit count at record +0x5528, the parameter block's slice list with byte +0x20c = 0, the frame type at record +0x5b34) the H.264 VTCompressionSession of the test program delivers 5 of 5 samples; with rk3588-venc-ave2-encode=1 the application's NV12 pixel buffer goes through RKVENC0 (a recorded trace of the same size supplies the job, fixed quantizer and GOP, 0.45 ms per 640x360 frame), the IDR samples are sync samples and libavc decodes all five at PSNR Y 42-44 dB (tools/check-vt-enc.py). The H.265 plug-in (same code base) is served the same way from the H.265 trace (codec = word +0x10 of the Open struct) and its 5 of 5 samples decode with libhevc at PSNR Y 44-45 dB (ave32, two passes of both codecs, no panic); no rate control, no sizes without a trace.", "Video encoder core (2026-11-09, vt4, hardware): MPP's H.264 encoder (controller, rate control, slice and parameter-set writers, hal_h264e_vepu580: 54 files of the pinned MPP, unmodified; an earlier version of this text said 60, which counted comment lines) runs in the kernel behind a shim (UniXNU-rk3588-common f5f0e6f, e5fd097, 6e80526); rk3588-venc=6 encodes nine self-test recipes on the block (planar and NV12, 176x144 to 1920x1080, fixed quantizer and constant bit rate) and all nine decode on the host, 41 pictures, luma PSNR 24.7 to 43.4 dB, above a floor that follows the quantizer; with rk3588-venc-ave2-encode=2 the hardware-required H.264 VTCompressionSessions of the test program are served from the core: any size (480x270 with coded height 272, 640x360, 1920x1080), the bit rate (+0x1b0), the maximum key-frame interval (+0x1c4) and the frame rate (+0x1dc) read from the Prepare/Start descriptor, every sample delivered in both passes, the key-frame session with its three sync samples, libavc decodes everything at 41 to 56 dB, 0.8 ms a 640x360 picture (0.72 ms on the block) and 4.2 ms at 1080p, 3.2 KB of the 16 KB kernel stack on the core thread, 1500 s without a panic. On the host the core equals MPP's own register images on its six H.264 recordings and passes 887 checks with the sanitizers (evidence/host-venc-core-20261109.txt, evidence/device-venc-core-20261109.txt). H.265 was added the same day, see the next finding.", "Video encoder core, H.265 (2026-11-09, h2, hardware): hal_h265e_vepu580 and MPP's h265e codec files (63 files compiled, two #included, pinned commit, unmodified) run in the same core (UniXNU-rk3588-common 54c3bc1, fedaecf); rk3588-venc=6 now has sixteen self-test recipes and all sixteen decode on the host (the seven H.265 ones with libhevc: 3 to 8 pictures each, luma PSNR 28.9 to 43.1 dB, above a floor that follows the quantizer, 0.36 ms for 176x144 to 4.1 ms for 1080p on the block); with rk3588-venc-ave2-encode=2 the five hardware-required H.265 VTCompressionSessions of the test program (640x360 default, 1 Mbit/s with a key frame every 7, 3 Mbit/s every 12, 1920x1080, 480x270) are served from the core, with the settings from the descriptor (+0x1b0, +0x1c4; +0x1dc is 0 in the H.265 plug-in when the application sets no frame rate, the service gives the core 30), every sample delivered in both passes with the same byte counts, the key-frame session has its three sync samples, libhevc decodes everything at 47 to 56 dB, 0.84 ms a 640x360 picture (0.75 ms on the block), 4.2 ms at 1080p, 3.3 KB of the 16 KB kernel stack, 1500 s without a panic. The streams are 4 to 25 % smaller than H.264's at the same settings. The H.265 recordings made on 2026-11-08 were wrong (the recording shim let MPP's read-backs lag behind the jobs and the encoder coded IDR pictures where P was due; mechanism not traced) and were remade with VENC_TRACE_DELIVER=job; on the host the core equals MPP's register images on all twelve recordings and passes 1794 checks with the sanitizers; two mutants of the core are not caught and are explained (hal_h265e_vepu580 does not read hw:qbias_arr; our pictures have one tile) (evidence/host-venc-core-h265-20261109.txt, evidence/device-venc-core-h265-20261109.txt).", "Real-time encoding through VideoToolbox (UniXNU-rk3588-common 969e04b, 168f742): the AppleAVE2 stub slept 300 ms in each call (a diagnostic of the first runs; with rk3588-venc-ave2=3, which keeps it, every session ran at 3.1 to 3.2 pictures a second, 306 to 316 ms a sample at 640x360 and 1920x1080 alike); without it the plug-in's receiver was still copying frame N out of slot 0 when frame N+1 was written, so the stub now writes the slot of each frame into word +0x3a8 of the plug-in's request record (found by running the plug-in's frame-done code on the host with unicorn: tools/ave_slot.py; the earlier notes had +0x46c, which nothing reads; the original driver initialises the word to -1 and assigns a slot before it answers) round robin over eight sets (twice the four frames in flight Start announces). On the board (runs sp7 and sp9, the same kernel, rk3588-venc-ave2=1) the speed sessions of the test program deliver a sample every 1.37 to 1.80 ms at 640x360 (557 to 729 pictures a second, H.264 and H.265) and every 7.1 to 9.2 ms at 1920x1080 (109 to 140 a second), the first sample 178 to 424 ms after the first call, 0 errors, the same stream byte counts as with the sleep, the five dumped sessions of each codec (among them 16 samples over the eight slots twice) decode with libavc / libhevc at 41 to 56 dB luma, and sp9 ran 1500 s without a panic (the encoder was busy only in the first 210 s). The block takes 0.7 and 4.2 ms of those times; the rest was not split. Logging every call (=2) costs about 3 ms a 640x360 picture (evidence/host-venc-realtime-20261109.txt, evidence/device-venc-realtime-20261109.txt)."]
completion = ["Mali composition runs on the Orange Pi 5."]
limits = ["The CSG SUSPEND/RESUME fix ran for one 14 minute boot without a person at the mouse and was not run on the EVB10 (its package/Mali checkout is older); only idle groups are evicted, a busy one was never suspended; after the poster wave the clock digits of the lock screen show horizontal dashes and the buffer pool is nearly full (cause not investigated), the wallpaper fit puts a fixed square, so SpringBoard zoom and parallax animations of the wallpaper are not followed, and the home screen and App Library were not looked at with it; the held-import fix has not run with a person opening apps for a long session; frame rate under gesture not measured on this board; GPU rail/clock may still be the firmware default (~198 MHz) unless DVFS or mali-npll is set; 5 GHz Wi-Fi and audio unrelated.", "The wallpaper card carousel of the lock screen (long press) is laid out wrong with and without mali-sched-wait=2 and mali-wallpaper-fit=0 (not investigated); the lock screen flicker did not reproduce in 195 s runs; the sceneID snapshot pictures stay 0 bytes; no 600 s soak with mali-sched-wait=2 and no gesture frame rate with it; not run on the EVB10.", "The video decoder's only user is the test tool: no App has decoded a frame with it. What ran through VideoToolbox is 17 H.264 streams (Main and High profile, B frames and a B pyramid, scaling matrices, several slices, MBAFF, 1080p) and 6 H.265 streams (Main profile, 8 bit, 4:2:0, one slice per picture, 320x240 and 1280x720); the pictures are compared as a set, so the display order and an end-of-stream flush are not checked (with one access unit per call the core's flush leaves the last picture of display order of t320_bframes in the parser, 9 of 10 shown, not investigated). The RGA3 copy is off by default; with the CPU copy the copy of a picture into the surface at 720p of a picture into the surface (1.2 ms) is larger than the block's own 0.65 ms; the cost of the default log lines was not measured, the encrypted path is refused without a test of what VideoToolbox does then, the reset of the block on an error status was never exercised, and the service runs the core on one thread, one job at a time. Completion is polled, the IOMMU is bypassed, one decode core runs, and the clocks are a little below the vendor's. The pmap patch is in the shared SoC series but was run on the Orange Pi 5 only. The captures vt28 (749 s) and vt29 (716 s) ended when the serial adapter of the board host re-enumerated (together with the reset controller's ACM device, so possibly a USB event of the host rather than a board restart; not looked at), vt30 did not lose it. H.265 was run for six single-slice 8-bit streams only (no multi-slice, tiles, Main10, CRA, prefix SEI or AUD: libhevc's encoder cannot make them), 720p at most, and only through the test tool.", "The encoder core ran only the test program: no rate-control result against hard content (the test picture compresses so well that no session reached its bit rate; the quantizer does follow the rate), no H.265 Main10, several slices or tiles (the core has one slice and one tile), no key-frame request or bit-rate change from the application in mid-stream, strides of 16 only, nothing above 1080p; real-time use was measured only on easy synthetic pictures (no session reaches its bit rate) with the test program as the only application, nothing captures or displays the pictures, and the original driver's slot allocation and number of frames in flight are not known beyond a call site."]
next_action = ["A longer run with a person at the mouse after the fix; bump the EVB10 package/Mali and run it there; the digit dashes after the wave; the home screen and App Library under mali-wallpaper-fit=1; gesture frame measurement; optional mali-npll / DVFS for higher clocks.", "Video decoder: H.264 PAFF, High 10 / 4:2:2 and error streams, H.265 Main10 / slices / tiles / CRA; decoding straight into the surface (the RGA3 copy is done, 0.34 ms at 720p; a direct write looks pointless, see the findings); the interrupt, the IOMMU and the vendor clock rates; a real App playing a video (the test tool is the only user); run the pmap patch on the EVB10 and see whether the lock-screen clock digits stop showing dashes.", "Video encoder: AppleAVE2 — H.264 and H.265 pictures of the application's pixel buffers come out of RKVENC0 through VideoToolbox at any size and at the application's bit rate and key-frame interval (the encoder core, MPP's own encoders in the kernel); next: the plug-in's key-frame and bit-rate requests, rate control against hard content, a long run of continuous encoding; H.265 Main10, several slices and tiles; interrupts, the IOMMU, RKVENC1."]


[[area]]
id = "packaging"
status = "device-verified"
components = ["XnuPrelink", "DarwinBoot", "SoftwareAES"]
paths = ["patches/**", "package/**"]
inputs = ["Kernel from orangepi5_defconfig with the NVMe driver, the original trust cache bundle, the 2 GiB Data seed and unixnu.toml of the payload, the 256 MiB OPI5ESP payload volume that goes on the NVMe ESP, the 9.4 GB root image."]
configuration = ["payload.loader = firmware: the loader is part of the firmware volume of uefi-orangepi5, so the payload carries no loader image."]
procedure = ["unixnu build kernel, then uefi-orangepi5 tools/board/make-bundle.sh (unixnu build payload, the power-off menu entry removed, bundle with the firmware image and the root image); nvme-install.py writes the ESP of the drive."]
findings = ["The SoC patch rk3588-root-trust.patch makes bsd_init.c call native_emmc_root_trusted; the NVMe driver defines it, so the stub patch of the console kernel is gone.", "The five EVB10 kernel patches (exit trace, mmap grant, thread sample, userland mounts, vc mirror) are vendored with their source commit; the NVMe personality patch is the board's own.", "The payload assembles on the host (payload.img 256 MiB, ADT with the pcie-nvme node) and the board started it (evidence/device-first-boot-20261103.txt): the firmware read kernel.macho, its ADT and trust cache from the NVMe ESP, DarwinBoot handed the kernel over, the driver bound to the original IOBlockStorageDevice and the kernel booted to launchd. The ADT memory values were placeholders in those runs; they are the measured ones now (memory area).", "The package gained PcieWindows.h and its host test (tests/test-pcie-windows.cpp) after the first run showed the BAR in the 32-bit window; the kernel was rebuilt and the bound-address check still passes (18 addresses inside the audited IOStorageFamily, kernel.macho sha256 178d2e1f...).", "The SoC repository is pinned in feeds.toml; local.toml can point at a checkout during development.", "The kernel is now built in two passes (configs/orangepi5_defconfig, then orangepi5_display_defconfig) and the payload comes from the second one: package/LegacyDisplayProbe.cpp, KeyStoreProbe.cpp and LinkStubs.c are the display pass's device code, tools/board/make-bundle.sh of uefi-orangepi5 selects the kernel by KERNEL_CONFIG (default the display kernel), and board.toml carries the display archive, the GopFramebuffer component and the offline-legacy-* / sheng-* arguments (553 of 1000 bytes). Host-verified in evidence/host-display-build-20261103.txt; the ADT of a payload build differs from build to build while the kernel does not.", "package/Mali is a submodule now (Ken-u/Mali, the EVB10's commit 9dd949a; the pointer is staged with the change that adds it, otherwise unixnu resets it to the index). The payload of the Mali-linked display kernel is kernel.macho 51658752 bytes crc32 7bec4f41, ADT crc32 970b5293 (the ADT differs per payload build), trust cache e3343405 and unixnu.toml fe909e88 unchanged; the ESP of the board still holds the display kernel without Mali (f7215c41, written, not verified).", "Later esp-put (tools/board/esp-put.sh) verified kernel.macho crc32 6612adcc (VOP+Mali+HID display kernel), ADT and unixnu.toml on the NVMe ESP; make-bundle.sh carries the GPU addon and owner trust when evb10-gpu-addon=1.", "package/Opi5Usb and package/Rk3588DvfsBoard.cpp join the package sources and board.toml archives (build-orangepi5-usb.py, build-rk3588-dvfs.py): the kernel with them links (51757056 bytes, crc32 a7b54353), was written to the NVMe ESP with uefi-orangepi5 tools/board/esp-put-delta.sh (24 of 50 1 MiB blocks sent, read-back VERIFIED) and booted to launchd and SpringBoard (evidence/device-usb-dvfs-20261105.txt).", "The display kernel links the SoC repository's video decoder archive with its ten recorded traces (four H.264 and six H.265, about 100 to 120 KB each, compiled into the image as byte arrays; the kernel is 53055488 bytes with them); the archive step compiles with the kernel's -Werror compile record and passes the Mach-O audit (evidence/host-vdec-20261107.txt).", "patches/xnu/opi5-launchd-test.patch (the board's own, after evb10-userland-mounts.patch) adds evb10-exec=2: the owner's program (launchd/ptpd in the test file list) is union-mounted over /usr/libexec and runs as the job com.apple.ptpd under the real launchd, which VideoToolbox needs (as init it cannot make a decoder session); a new job plist is not possible (launchd takes the system daemons from its signed cache). Its trust cache entry needs launch-constraint category 7 (make-owner-trust-bundle.py MACHO@7; category 0 was refused as a constraint violation). Ran on the board in vt25 to vt30 (evidence/device-vdec-d5500-20261107.txt); the kernel with it is 53477376 bytes, sha256 c546e9ee5e2ecaf4...", "package/LegacyDisplayProbe.cpp now also calls rk3588_venc_start() (after rk3588_rga_start()), the entry of the video encoder self-test that runs only with rk3588-venc=N; the kernel with it builds and boots (evidence/device-venc-20261108.txt, 70434816-byte kernel.macho)."]
completion = ["The payload boots from the NVMe ESP through the firmware and reaches the kernel entry."]
limits = ["The vendored EVB10 patches keep the EVB10 names and drift when the EVB10 repository changes (scripts/check-vendored-patches.sh shows it).", "The payload was started from U-Boot through the launcher only; the SPI NOR route has not run.", "Default menu entry is still xnu-probe."]
next_action = ["DEFAULT_ENTRY=xnu MENU_TIMEOUT=3 tools/board/make-bundle.sh and rewrite esp.img."]


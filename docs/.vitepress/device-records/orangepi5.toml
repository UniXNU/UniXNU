id = "input"
status = "device-verified"
components = []
paths = ["package/Evb10Hid/**", "package/Evb10HidProbe.cpp", "package/Opi5Usb/**", "scripts/build-orangepi5-hid.py", "scripts/build-orangepi5-usb.py", "docs/usb.md", "scripts/gen-opi5-touch-script.py", "package/Rk3588XhciBoard.cpp"]
inputs = ["No on-board digitizer; USB-A ports on OHCI companions (0xfc840000 / 0xfc8c0000); Type-C power GPIO3 PC0; USB 3 xHCI controllers at 0xfc000000 (xhci0) and 0xfcd00000 (xhci2)."]
configuration = ["opi5-hid=1 loads IOHIDFamily; opi5-hid-input / sheng-touch-hid start NativeHidInput; opi5-usb=5 starts the polled OHCI host and feeds the boot-protocol keyboard and the report-protocol mouse (layout read from its report descriptor; opi5-usb-boot-mouse=1 keeps the boot protocol, which has no wheel) into NativeHidInput via native_usb_* mailbox.", "rk3588-xhci=N (default 0, not in board.toml) starts the SoC repo's polled xHCI driver on the two DWC3 controllers with this board's table (package/Rk3588XhciBoard.cpp: registers, DMA windows 0x64000000 / 0x64100000, a HID sink into the same native_usb_* mailbox): 1 look, 2 start and watch ports, 3 enumerate, 4 hubs, 5 HID boot keyboards and mice."]
procedure = ["Boot with a USB 2.0 keyboard or mouse in a Type-A port (docs/usb.md) and read the opi5: usb: and opi5: hid: mouse lines; moving the mouse raises mouse_seq and hid_total in the poll line and the type 17 count of the event driver. Without a person: opi5-mouse-demo=SECS opi5-mouse-click=1|2|3 in the kernel arguments and a screenshot of the HDMI output."]
findings = ["Both OHCI controllers start (rev 0x10, HcControl operational) behind powered EHCI ports; a Logitech mouse (046d:c077, low speed) on the second host (OHCI 0xfc8c0000) is enumerated, its boot interface configured and polled, and mouse reports are counted when the mouse moves (3275 and 705 in two 10 s windows; evidence/device-usb-dvfs-20261105.txt).", "The mouse is an IOHIDDevice of its own (Generic Desktop / Mouse, not built in) and the kernel IOHIDEventDriver takes it through a personality added with gIOCatalogue->addDrivers (Transport USB, usage pairs (1,1) and (1,2), score 0x500; the DriverKit AppleUserHIDEventDriver does not start here): every report becomes a Pointer event (pers1: 1244 of 1244, real3: 10778 of 10778, type 17). A kernel-made mouse walk shows the grey iPadOS pointer on the lock screen in screenshots taken with screentools (demo1), and a person moving the mouse confirmed that it works (real3).", "The wheel did not work because the mouse was put into the HID boot protocol (three bytes: buttons, X, Y). NativeUsb now reads the report descriptor, package/Opi5Usb/MouseReport.h finds the buttons, X, Y and wheel fields (host test tests/test-mouse-report.cpp), and SET_PROTOCOL 1 is sent: the serial shows \"mouse report protocol: id -1, 4 bytes, ... wheel@24/8\" and proto=1. A person moved the mouse and turned the wheel in wh10: 46 wheel counts, 46 Scroll events (type 6), 405 Pointer events for 403 reports with motion, and the person said the wheel works (evidence/device-mouse-wheel-20261106.txt).", "Wheel counts injected by the kernel (opi5-mouse-wheel=1..5) become Scroll events but scrolled nothing on the screen in ten runs; the real wheel on the same kernel works, so the injected path only tests the kernel half and the reason is unknown.", "The USB driver accumulates the movement of all reports between two flushes (the first version kept only the newest report of each 8 ms tick: 523 of 3086 reached handleReport). The kernel restarts the board on three Ctrl-C from the serial console (watchdog-kick thread), which the flashing loop of these runs uses (evidence/device-mouse-gpu-20261105.txt).", "The first OHCI code could not reset the controllers (wrong register offsets) and its DMA pool in Device memory faulted in bzero; the pool is Normal non-cacheable memory below 4 GiB now (0x62000000 / 0x62010000, ml_io_map_wcomb).", "The software digitizer stand-in remains for SpringBoard; USB keyboard and mouse reports go through the same IOHIDDevice (a boot mouse collection was added to its descriptor).", "Scripted touch without a person (opi5-touch-script=SECS, opi5-touch-id=N; scripts/gen-opi5-touch-script.py writes the git-ignored opi5_touch_script.inc): two unlock swipes (the first after the boot is often lost, a third opens the App Switcher), dock taps open Photos, Messages, App Store, Settings and Safari, a flick Home goes Home when the finger rests 32 ms on its first point before it moves; used for the launch picture runs d20-d39.", "An xHCI host driver (UniXNU-rk3588-common scripts/data/Rk3588Xhci, rk3588-xhci=N) is built into the display kernel, off by default. Host-verified: the driver code runs against a strict model of an xHC and its devices (5287 checks, 25 tests: enumeration and HID at every speed, hubs behind hubs, unplugging, stalls, a silent device, ring wraps, slot exhaustion; sanitizers on; seven mutations of the driver each make it fail) and the kernel builds with -Werror (evidence/host-xhci-20261106.txt). On the board both controllers reset and start with rk3588-xhci=5 (xHCI 1.10, 64 slots, 64 byte contexts, 2 ports, USB 3 on port 2; one run of 1500 s without a panic, the committed code read for 150 s) and the OHCI mouse path unchanged; nothing was plugged into either controller, so no enumeration, hub or HID traffic has run on hardware (evidence/device-xhci-start-20261106.txt). xhci2 is SuperSpeed only (its USB 2 lines go to EHCI per the edk2 ACPI table), so a USB 2 device or a USB 3 hub's USB 2 half is seen by the OHCI side, not by xHCI."]
completion = ["A USB keyboard or mouse reaches IOHIDEventDriver through NativeHidInput and a pointer shows on the monitor."]
limits = ["No keyboard was attached, a click opening an app was not checked, the wheel was confirmed by a person without a record of which screen scrolled, in which direction or how fast, and the pointer was not watched by a person after the GPU fix (the fix run had no one at the mouse); one run with a person moving the mouse had backboardd exit with signal 11 at 96 s (real3, old Mali code, cause unknown); no hubs on the OHCI side; the xHCI driver has run on hardware only as far as starting the controllers (no device was attached; which connector is on which controller is unknown); no EHCI, so high speed USB 2 devices (a USB 2 camera or hub) are not seen; polled, no interrupts."]
next_action = ["Plug in a keyboard and type; click to open an app and scroll a list with a person at the mouse (note the screen and the direction); find out whether the backboardd exit of real3 comes from early pointer input; then, with a person at the board, plug a SuperSpeed device into a blue port and run rk3588-xhci=3 (then 4 with a USB 3 hub), and find the connector of xhci0 for rk3588-xhci=5 with a keyboard or mouse."]


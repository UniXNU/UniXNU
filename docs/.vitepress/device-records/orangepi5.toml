[[area]]
id = "firmware"
status = "planned"
components = []
paths = ["docs/bring-up.md"]
inputs = ["edk2-rk3588 firmware built by uefi-orangepi5 (an SPI NOR image with TF-A at EL3, OP-TEE and the UEFI volume), UEFI GOP frame buffer on HDMI0."]
configuration = ["board.toml has no [firmware] section: the unixnu firmware step builds Mu-Silicium, and this board boots edk2-rk3588 built by uefi-orangepi5.", "payload.loader = firmware: DarwinBoot is inside the firmware volume and reads the payload from the ESP of the NVMe drive, found through NvmExpressDxe."]
procedure = ["Build the firmware in uefi-orangepi5 (build.sh); tools/board/spi-flash.sh of that repository writes the SPI NOR image from a Linux booted on the board (backup first, flashcp, compare), or Maskrom mode when /proc/mtd does not list the flash. Both are described in uefi-orangepi5/docs/first-boot.md."]
findings = ["The firmware builds on the host with the GPU rail set to 0.75 V and the hardware watchdog driver of uefi-orangepi5 armed (the board has no remote power switch, so a hung kernel must end in a watchdog reset).", "Not yet observed on the board: the UEFI banner, the DRAM size, the PCIe link of the NVMe drive and the GOP resolution.", "The firmware image is a bundle member (nor.img) built by uefi-orangepi5 tools/board/make-bundle.sh; spi-flash.sh was checked for its /proc/mtd parsing only, it has not touched a flash."]
completion = ["Firmware enters DarwinBoot, publishes the GOP frame buffer and finds the NVMe ESP."]
limits = ["No hardware access so far: serial console, flashing method and the board's RAM size are open inputs."]
next_action = ["Connect the board (UART2 at 1.5 Mbaud, HDMI, NVMe), write the NOR image and record the first firmware log."]

[[area.evidence]]
kind = "source"
reference = "docs/bring-up.md"
result = "Boot flow and milestones M0 to M4"

[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu", "ArmDTPlatform"]
paths = ["scripts/*armcpu*"]
inputs = ["Four Cortex-A55 and four Cortex-A76 at affinities 0x000 to 0x700, GICv3 at 0xfe600000, 24 MHz architected timer, PSCI over SMC: the same cluster layout and GIC as the EVB10, since the RK3588S is the RK3588 without some interfaces."]
configuration = ["The CPU, GIC and PSCI nodes come from the SoC dtsi (rk3588-common dts/rk3588.dtsi); the board DTS enables nothing extra.", "Kernel arguments sheng-smp=1, armcpu-self-ipi=1, armcpu-mmio-sgi=0 and cpumask=31 are the ones of the EVB10 port."]
procedure = ["Compile dts/orangepi5.dts through ./unixnu tree and inspect /cpus, /psci and /arm-io/intc in the generated device tree.", "Boot and read the per-core entry lines on the serial console."]
findings = ["The CPU path is shared with the EVB10 and unchanged here; the EVB10 record documents the EL2 to EL1 drop of secondary cores and the Darwin assembler caveat.", "Whether the Orange Pi 5 firmware leaves the same state is not yet observed."]
completion = ["Every enabled core reaches its entry checkpoint and receives timer and inter-processor interrupts."]
limits = ["No CPU frequency governor yet; the DVFS rail table of the EVB10 (RK8602 at I2C0 0x42 and 0x43, RK806 BUCK1 and BUCK2) matches the Orange Pi 5 and will be reused with the power area."]
next_action = ["Boot the console kernel and compare the per-core lines with the EVB10 log."]

[[area.evidence]]
kind = "source"
reference = "dts/orangepi5.dts"
result = "Board device tree on top of the shared SoC description"

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/orangepi5.dts"]
inputs = ["The board of this port has 8 GiB of LPDDR4x; the RK3588 maps DRAM in two banks (below 0xf0000000, 3.75 GiB, and from 0x100000000, 4.25 GiB) around the peripheral window and the reserved regions of the firmware."]
configuration = ["The memory node and payload.dram_size are placeholders for 4 GiB at 0x100000000; payload.adt.owned_memory_size = 0x80000000 takes 2 GiB from the UEFI memory map."]
procedure = ["Read the memory map from the firmware log of the first run and replace both placeholders; keep the kernel's 2 GiB inside the bank the firmware reports as conventional memory."]
findings = ["The 4 GiB node at 0x100000000 lies inside the upper bank of an 8 GiB board; it is the value of the EVB10 port, not yet compared with this board's memory map. The NVMe driver does not depend on where DarwinBoot puts the kernel's pages: its DMA window accepts any address below 1 TiB.", "Not yet measured. The EVB10 port found that DarwinBoot takes contiguous memory from the UEFI memory map and that the shared-region and DRAM-carve-out sizes must agree with the ADT."]
completion = ["The kernel reports the memory it owns and the ADT memory ranges match the firmware map."]
limits = ["Where DarwinBoot places the 2 GiB of kernel pages is known only from the first firmware log."]
next_action = ["Capture the UEFI memory map on the board."]

[[area.evidence]]
kind = "source"
reference = "dts/orangepi5.dts"
result = "Placeholder memory node"

[[area]]
id = "storage"
status = "host-verified"
components = ["AppleKeyStoreState"]
paths = ["package/Rk3588Nvme/**", "scripts/build-orangepi5-drivers.py", "scripts/bind-nvme-storage.py", "scripts/check-vendored-patches.sh", "scripts/data/**", "dts/orangepi5.dts"]
inputs = ["M.2 M-key slot on PCIe 2.0 x1 (pcie2x1l2 through combphy0_ps, reset GPIO3_D1, 3.3 V enable GPIO0_PC5), a 128 GB NVMe drive for the ESP, the root image and the Data volume; the eMMC socket and the microSD slot are left unused."]
configuration = ["board.toml [userdata]: an ESP of 256 MiB at LBA 2048 and a 64 GiB userdata partition at LBA 526336..134744063, with the OS and SystemOS windows at its start and the Data window (1 MiB header + 2 GiB container) at its end.", "dts/orangepi5.dts exports /arm-io/pcie-nvme (compatible unixnu,rk3588-pcie-nvme, no reg, no interrupts) and keeps the pcie@fe190000 node disabled; patches/xnu/orangepi5-nvme-personality.patch matches NativeNvme to it.", "Boot arguments nvme=4, nvme-root-trust=1, nvme-data-size=2048, nvme-data-persist=1; probe-only runs use nvme=1."]
procedure = ["Write GPT, ESP (payload) and userdata to the drive with uefi-orangepi5 tools/board/nvme-install.py from a Linux booted on the board, then boot; the driver publishes the OS and SystemOS windows read-only and the Data window writable."]
findings = ["package/Rk3588Nvme follows the EVB10 eMMC driver above the controller (GPT scan, SHNGROOT root image, Data window, kernel hooks, watchdog feeder, PMGR nub) and has its own host: PCIe bring-up from the state edk2-rk3588 leaves, a polled NVMe controller core (reset, admin queue, identify, one I/O queue pair, PRP transfers through a contiguous bounce window, writes only inside the Data window).", "Host-verified: the NVMe core and the GPT reader against a controller model behind a non-coherent cache (seven mutations of the core are caught), the root manifest reader, the driver compiled with -Werror and bound to the original IOBlockStorageDevice (190 slots, 11 imports), the kernel link and its bound-address check, and the installer's GPT through the driver's own reader.", "Not observed on the board: the PCIe controller addresses (APB 0xfe190000, DBI 0xa41000000, CFG0 0xa36500000, the BAR windows) are derived from the sources of edk2-rk3588, the controller state the firmware leaves, the drive's BAR placement, its model and LBA format, and DMA coherence of the bounce window.", "The kernel patches of the EVB10 call two Mali hooks (mali_gpu_addon, mali_test_file); the driver defines weak versions that answer none until a display archive is linked.", "Design debts: the storage code is duplicated between Rk3588Emmc and Rk3588Nvme (a fix to the shared parts goes into both); the headers Gpt.h, RootManifest.h and StorageCommon.h are copies with the namespace renamed; the first round keeps the 2 GiB Data container of the existing seed."]
completion = ["The kernel mounts the root and Data volumes from the NVMe drive and launchd starts."]
limits = ["Nothing in this area has run on the board; the first log decides whether the derived addresses and the cache handling hold.", "Only 512-byte logical blocks are supported."]
next_action = ["Boot with nvme=1 first and read the pcie:, NVMe and probe lines, then nvme=4 for the root volume (uefi-orangepi5/docs/first-boot.md)."]


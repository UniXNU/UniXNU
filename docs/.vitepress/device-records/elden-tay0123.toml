evidence = [
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM-boot the lifs GPUCC Recovery candidate and capture XNU USB through the automatic return", revision = "0b61f6b3ba77f039db784b44efb01c04c144af0c", result = "The lifs RAM candidate started original Boot Picker PID 161 and reached software First frame with all eight cores active. USB captured the run and the tablet returned to fastboot at its managed deadline without a host reset. Physical app pixels are unverified; the final progress report has 246 dropped log bytes and 87 missed events." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Capture the QEMU ramfb after 600 seconds with the paired lifs module", revision = "0b61f6b3ba77f039db784b44efb01c04c144af0c", result = "Original Boot Picker rendered Options, a spinner, keyboard indicator, Shut Down and Restart controls. Language Chooser still had no start. This is a QEMU Recovery app frame; full Recovery tools and physical presentation remain to be qualified." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Disassemble the matched 25F71 CoreFoundation cache at the preferences reply, client shared-memory mapping and fault sites", revision = "a9b4cef8ccc3a394d021588d258eec1527834829", result = "The faulting CFPrefsSource field is set from the 16 KiB read-only POSIX shared-memory mapping plus four bytes per preferences index. The fault's live mapping bounds and lifetime are still unverified." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Run DarwinBoot preflight and packed verification on the eight-core Recovery GUI capture RAM image", revision = "590f3601843d93d698b5cc5ee2ea546d12cddc8a", result = "The image uses the previously hardware-qualified ADT and pairs the GUI probe with USB management. MacBook readback matched the build. The all-core GUI path awaits a physical run." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Compare the owner-supplied panic QR with the packed kernel UUID and WindowServer PID in the MacBook capture", revision = "a9b4cef8ccc3a394d021588d258eec1527834829", result = "The physical WindowServer process raised EXC_CRASH with SIGABRT. The saved PC and LR match the pthread_kill pair at a plausible cache slide. The USB log lacks the panic frame and the callers above pthread_kill remain unknown." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Boot the Recovery GUI capture RAM image from the MacBook and monitor XNU USB", revision = "db032d0850b5d48347acca9afec4e282a3ff3458", result = "Base System mounted, launchd passed Data restore, recoveryosd and WindowServer executed, and Recovery created an Aqua audit session. The serial capture reported no first frame." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Use gdb-stop.py to select configd and reason 37 code 57, then resolve the unslid ELR against the paired dyld cache", revision = "db032d0850b5d48347acca9afec4e282a3ff3458", result = "The 8-vCPU QEMU fault occurred at the pointer load in CFPrefsSource copyOSLogDescription + 116. This result is specific to the QEMU run." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Capture the eight-core 4 KiB tablet control over USB after Data restore", revision = "7623a4a86dbb2ca8492b93b8406d887b6ef569ff", result = "configd, remoted and other services exited with reason 37, code 57 on the tablet." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Run the patched 4 KiB kernel in eight-vCPU QEMU and read allproc at 345 seconds", revision = "7623a4a86dbb2ca8492b93b8406d887b6ef569ff", result = "With the VM fault range patch, the initial configd PID 42 was still running. WindowServer aborted three times after launch and reached Display on without a first frame." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Repeat the eight-vCPU VM fix boot with sheng-boot-progress-panel=1", revision = "c198f0a5bc7554a17437675b58820b958100249a", result = "WindowServer first executed at 150.7 s versus 168.8 s with scrolling. Both runs retained configd PID 42 and recorded three WindowServer aborts. The progress-panel stream missed 3,420 bytes between debugger samples." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM boot elden-4k-vm-fault-recovery-ram.img and select Capture Recovery GUI Failure (8 cores)", revision = "c198f0a5bc7554a17437675b58820b958100249a", result = "BaseSystem, launchd main, all eight cores and Aqua creation passed. USB captured the WindowServer SIGABRT and no reason 37 code 57 exits. The tablet returned to bootloader fastboot on slot A without host reset." },
  { kind = "source", reference = "scripts/elden_recovery_graphics.py", result = "The optional software display derives three 4 KiB graphics rules from verified 25F71 cache pages. The shared-region pager edits its own authenticated copies and preserves the original APFS pages." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Boot the first 4 KiB graphics test in eight-vCPU QEMU and inspect the VM fault and sealed APFS logs", revision = "cbfd75d087cf000e2535e5b42396ac9ffabd9205", result = "All three display rules applied. APFS rejected a 16 KiB re-read containing a changed resident 4 KiB page. The first test stopped before a first frame." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Boot the shared-region graphics pager in eight-vCPU QEMU and read the page bitmap and RAMFB", revision = "cbfd75d087cf000e2535e5b42396ac9ffabd9205", result = "Three verified private mappings applied, first frame at 245.2 seconds. The screenshot showed a pointer on black. The 540-second run retained WindowServer and configd with no APFS hash mismatch." },
  { kind = "source", reference = "scripts/prepare-elden-recovery-adt.py", result = "The Elden Recovery tree can add the inherited GOP display descriptor using UniXNU's ADT writer. The actual tablet control tree and updated tree compared equal after removing that one descriptor." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM boot the eight-core graphics pager with the inherited GOP display descriptor and capture XNU USB", revision = "cbfd75d087cf000e2535e5b42396ac9ffabd9205", result = "The repacked tablet ADT reached display on and applied all three graphics rules. RecoveryOS Agent started. WindowServer raised SIGABRT before its first swap, then the tablet returned to bootloader fastboot." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM boot the WindowServer backtrace build and symbolicate 12 frames using the actual shared-cache slide", revision = "2315d2527cce8cc57a12e2a474ee5207ef66cb65", result = "The physical WindowServer abort resolves to the unsupported IOSurface format branch of WSCompositeDestinationCreateWithIOSurface. The capture does not identify the format value." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM boot the eight-core backtrace build with the format annotation overlay and capture XNU USB", revision = "96d72a52a812f2a6d9ef2a61db364b2604374d68", result = "The panel powered on and WindowServer rejected the compressed BGRA FourCC 0x26424741 before the first swap. The tablet returned automatically to bootloader fastboot." },
  { kind = "source", reference = "configs/elden-macos26-display-pages.json", result = "The software display selects uncompressed allocation through two verified QuartzCore rules in addition to the three SHENG rules." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Exercise five pinned cache pages with the existing rule engine under sanitizers and boot the paired kernel in eight-vCPU QEMU", revision = "15036d4a503a41ea81382a911fa7a9b00871cfdc", result = "Original bytes, guarded application, repeat application and corruption rejection passed. QEMU reached First frame and the QMP screenshot shows a pointer on black." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM boot the uncompressed display image with Capture Recovery GUI Failure (8 cores) and collect XNU USB", revision = "15036d4a503a41ea81382a911fa7a9b00871cfdc", result = "All five cache pages applied. The physical panel scanout received the first frame from a 1904x3040 BGRA surface. WindowServer, recoveryosd and RecoveryOS Agent remained running and all eight cores reported timers and IPIs. Language Chooser had zero starts at the last observed milestone." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Boot the same eight-vCPU QEMU fixture with the recovery-boot-mode guest variable in a volatile CHRP system bank", revision = "3f9b3fb51b0c6917d3b668dc7ed8977b112ebec7", result = "XNU loaded the CHRP system region and reached First frame. The Recovery services remained active at 380 seconds with no Language Chooser start. The framework boot-mode read was not traced." },
  { kind = "source", reference = "board.toml", result = "The repeater engine comes from the firmware device tree. The panel's GPIO 98 is outside the new repeater path." },
  { kind = "source", reference = "docs/MACOS-RECOVERY-BRINGUP.md", result = "Live Linux pinctrl assigns TLMM GPIO 98 to the panel. The UniXNU PTN3222 path uses the board’s separate PM8550VE reset GPIO." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "build --build-gop-display and verify the Recovery Framebuffer Test", revision = "1241b6e42385bf4ad7afc9c48f3f39df0a5ab322", result = "The 4 KiB prelink includes the Elden software framebuffer, matched the 473-slot display ABI and PAC metadata, and passed eleven host tests. Display on and First frame remain pending on the tablet." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "modetest -M msm -c -p (read-only Linux DRM query)", revision = "cc333727e6badf997e6b2b9174934fe7ec144023", result = "2026-11-10, porting checkout at capture: Linux 7.2.8-y700-r2-androidcrypt1 drove the internal DSI panel at 1904x3040 and 165 Hz. The DRM connector reports 118x190 mm, and sysfs reports a 32-bit Linux framebuffer with a 7680-byte stride." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "python scripts/build_macos26_xnu.py --build-qemu-gop-display --build-gop-display --elden-gop-board (with paired ARM64e build inputs)", revision = "ca57db73c066162323e77156a9f0f1d72b1de4ff", result = "2026-11-10: the Mac compiled the opt-in Elden profile in both VirtIO and UFS companions. The QEMU VirtIO candidate passed the 473-slot framebuffer vtable and PAC audit." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "python scripts/observe_macos26_kernel.py --native-gop-display --follow-launchd-main --let-vector-log (with paired QEMU Recovery inputs)", revision = "ca57db73c066162323e77156a9f0f1d72b1de4ff", result = "2026-11-10: the generic GOP path mapped the QEMU framebuffer and powered on the display service. The original launchd ran, and WindowServer recorded one start and zero exits in 180 seconds. An explicit Elden-profile control rejected the QEMU framebuffer before mapping. A composited frame and language chooser remain unverified." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "observe_macos26_kernel.py --elden-bootstrap --native-gop-display with one and eight CPUs", revision = "c91a093e571376545915a5d41e7a1a9497c2328f", result = "Both 4 KiB local QEMU runs completed Data restore and reached Display on without a first frame. The eight-CPU run verified all secondary starts, timers and IPIs. Its sequential cache verification took 75 seconds versus 69 seconds with one CPU. Repeated configd guard-object faults caused launchd shutdown and WindowServer was killed during cleanup." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Boot the one-CPU QEMU GOP build with sheng-windowserver-stop=1 and symbolicate the panic stackshot", revision = "c91a093e571376545915a5d41e7a1a9497c2328f", result = "A CRC-verified panic stackshot recorded WindowServer SIGABRT after display power-on and before the first swap. Matching the loaded cache UUID and slide placed the main thread in the original WSSystemCanCompositeWithMetal check called by WSCompositorActivateDefault." },
  { kind = "source", reference = "docs/PHASE1-STATUS.md", result = "GOP menu display was observed on hardware." },
  { kind = "source", reference = "docs/porting-analysis.md", result = "Display topology, panel risk and GOP-first strategy." },
]


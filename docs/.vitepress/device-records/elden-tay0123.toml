completion = ["The ADT contains exactly one continuous memory range.", "The range is covered by live firmware RAM and avoids recorded reservations, initrd, GOP and UEFI FD.", "DarwinBoot and the UEFI exit map confirm that same range is conventional memory before XNU entry."]

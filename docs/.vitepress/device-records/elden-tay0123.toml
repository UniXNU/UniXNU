[[area]]
id = "packaging"
status = "device-verified"
components = []
paths = ["scripts/**", "package/**", "patches/**", "out/build.json", "unixnu.lock"]
inputs = ["iPad7,1 iPadOS 17.7.11 build 21H461 restore inputs.", "Target kernelcache, XNU 10063.141.1, DriverKit and TrustCache ABI inputs.", "Android v3 RAM-boot image, a 4 MiB phase 1 embedded FAT payload and a measured 56 MiB phase 2 candidate."]
configuration = ["The phase 1 image is produced by the project build script and verified against recorded hashes.", "Format 2 output is out/elden/ipados-17.7.11-21H461/elden/.", "The 2.2 prelink output is kernel/kernel.macho and its ADT sidecar; no phase 2 boot image is generated."]
procedure = ["Run scripts/build_phase1.py for the accepted firmware path.", "Fetch the target IPSW components and build the patched 4 KiB XNU.", "Prelink against the pinned kernelcache and audit Mach-O, ABI, symbols and ADT.", "Package an isolated near-final-size payload only in Phase 2.3."]
findings = ["2026-11-07: manual120-second poweroff and8-second autostart candidates include unchanged FD/56MiB FAT,6GiB ADT, original TrustCache, RAM Data and session IDs. Independent RSA/data/stock properties and embedded-file audits pass; every boot index stays1738713600@0.", "2026-11-06 prerequisites: direct9ebc7b6a and KShimC6af63b3e experiments are signed at exact stock index. A frozen dual11 control rebuild is byte-identical; the48MiB recovery FAT preserves the full stock kernel/initrd and raises the explicit FreeExec copy bound to64MiB. Source runtime and old signed artifacts are preserved.", "2026-11-06 host: source GOP console kernel/archives/prelink completed; separate read-only UFS root-check archive compiled with inherited identity DMA and LUN selection. TWRP/Linux EFI prototype and userdata/ESP design remain hardware-unverified. Details and bounded evidence in docs/NIGHT-BRINGUP-20261106.md; no stock index change or device write.", "2026-11-05 offline: ramdisk argv placement fixed; gzip made deterministic; embedded validation checks both header and actual x3 constant and rejects a FAT BPB extending past published bytes. The isolated marker candidate uses the accepted FD and a rebuilt 56 MiB shim, and passes kernel/ADT/FAT/FD checks. See docs/OFFLINE-PAYLOAD-20261105.md. No device run is claimed.", "The documented Phase 1 build was device-verified and the current procedure rebuilds and passes structural checks.", "The same current recipe produced 94b6a6315b04fc9d276bc15e9519107be292244380fc3bf139f5af6c96a3bb0a instead of the historical accepted image hash; byte-for-byte rebuild identity is not claimed, but the new image completed two owner RAM cold boots.", "The verified UniXNU third-party pin is intentionally retained for the accepted build.", "Phase 2.2 produced a 21,206,040-byte native kernel and a 54,050,816-byte prelinked kernel. The 57-patch sequence selects 30 executable Apple components, 7 kernel interfaces and 30 module entrypoints.", "A 58,720,256-byte FAT volume held the 54,063,968-byte kernel/config/ADT set with 3,734,016 bytes free and a byte-identical kernel readback; that 2026-10-25 volume was actually FAT32 (mformat -F) and is only mountable because 56 MiB clears the EnhancedFatDxe FAT16 cluster floor.", "EnhancedFatDxe derives the FAT type from the cluster count: a FAT32 BPB with fewer than 65,525 clusters returns EFI_VOLUME_CORRUPTED, so the 8 MiB FAT32 probe volume never became a SimpleFileSystem and UniXNU fell back to the built-in menu. The probe and payload volumes are now written as FAT16 by scripts/make_payload.py, and scripts/verify_phase2_artifact.py recomputes the cluster count and BPB label for every candidate.", "The prelink report remains runtime_qualified=false, abi_qualified=false and loadable=false until device execution evidence exists.", "The embed_payload images were device-verified on 2026-11-01: EnhancedFatDxe mounted both FAT16 volumes, UniXNU read \\EFI\\UniXNU\\unixnu.toml from the embedded payload and listed its entries next to the green checkpoint, so the kernel-field payload channel replaces the ramdisk channel for phase 2.3.", "The menu used the automatic scale (MAX (1, Width / 270) = 7 on the 1904-pixel short side) and truncated the footer; the scale is now pinned to 4 in package/phase2.3-unixnu.toml, which scripts/make_phase2_payload.py reads by default.",
  "2026-11-01: the stage 2.3 embed-payload boot image 3dc8ae9611ec899ff14d50032ecd0ce2dd1035b3af9f9d3183bbab6cd41bcd93 reached the DarwinBoot hand-off in two RAM cold boots: the screen printed the ARM64, video and inputs-validated lines and the Entry.S green band, so EL1, the 256 MiB window at 0xB927C000 and ExitBootServices are device-verified. The green band is the loader breadcrumb; it does not prove that the XNU entry instruction ran.",
  "The stage 2.5 entry probe appends an r-x LC_SEGMENT_64 after Kernel.End, rewrites the entry B to branch into it and draws a blue band from boot_args->Video before branching back to the original target; scripts/darwinboot_preflight.py replays ParseKernel/AdtNode on the host (16 segments, span 0x4310000, window 0x10000000) and the 12,738,560-byte image a4ad1fc74abef35da9f947c350ff5763f2b8dea61da5adeee72aefcd0a67abf7 passes the stage 2.3 verifier with probe kernel a8f04b455996a4656a3055254c127e42f0676187c9550aa0b5fa57bbbe94e2d9."]
completion = ["All format 2 build steps run from the resolved output directory.", "The payload contains the kernel, ADT and declared optional inputs.", "The boot image matches the ABL header and size limits."]
limits = ["The three 2026-10-31 device failures (two v3 probe boots, one v4 boot) share the broken FAT32 probe volume, so they do not disprove the ABL ramdisk handoff; that channel is unproven rather than closed, and reopening it needs firmware that still contains UniXNURamDiskDxe. The embed_payload channel that replaced it is device-verified; see docs/PHASE2.3-STATUS.md.", "The current 4 MiB board payload belongs to the accepted phase 1 build; the phase 2 payload is 56 MiB and is only used by the separate out/phase2.3 candidate.", "The 2.2 host build used Command Line Tools with an iPhone platform shim because full Xcode is absent; release rebuilding still requires the official Xcode/iPhoneOS SDK.", "The entry-probe kernel is a diagnostic artifact for out/phase2.4 only; it is not the release kernel and must not replace the phase 2.3 payload in a final image."]
next_action = ["Use the manual startup image first; autostart is not a qualified unattended fastboot recovery loop."]
evidence = [
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM-boot the lifs GPUCC Recovery candidate and capture XNU USB through the automatic return", revision = "0b61f6b3ba77f039db784b44efb01c04c144af0c", result = "The lifs RAM candidate started original Boot Picker PID 161 and reached software First frame with all eight cores active. USB captured the run and the tablet returned to fastboot at its managed deadline without a host reset. Physical app pixels are unverified; the final progress report has 246 dropped log bytes and 87 missed events." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Apply the Elden prelink overlay and emit Recovery with its default module contract", revision = "0b61f6b3ba77f039db784b44efb01c04c144af0c", result = "The Elden-only module contract now includes paired com.apple.filesystems.lifs. Its 31-module candidate is byte-identical to the explicit-module QEMU test, with SHA-256 fbbcd5f97f27ecee9028592b72925d77b85365381f142a27802d8457de1395ac. The reference SHENG selection remains unchanged." },
  { kind = "source", reference = "scripts/build-elden-macos26-bootstrap.py", result = "The build record includes the pinned GMU firmware digest and all staged Adreno source digests for the optional Recovery kernel." },
  { kind = "source", reference = "scripts/build-ufs-stage2.py", result = "The generated repeater header contains the board wiring. The QUP instance is resolved in the EFI driver at boot." },
  { kind = "source", reference = "scripts/build-ufs-stage2.py", result = "The Elden USB build generates the repeater resource header from the board table. Only the USB EFI application changes in the r37 RAM payload." },
  { kind = "source", reference = "patches/macos-recovery/elden-macos26-progress-panel.patch", result = "The regular Recovery entry requests a framebuffer progress summary. The kernel updates the milestone panel without mirroring each retained log byte to the screen. The GUI capture entry uses the detailed console." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Run observe_macos26_kernel.py --early-console --boot-progress --stream-retained-log --smp 8 with sheng-boot-progress-panel=1", revision = "bec62110c376f803882389b26c792fb848e1bf0f", result = "On the same eight-vCPU QEMU Recovery fixture the first task after Data restore moved from 132.1 to 125.0 seconds, and WindowServer exec moved from 169.3 to 154.2 seconds. The summary mode retained the detailed stream. Repeated configd guard-object faults again triggered shutdown before a first frame." },
  { kind = "source", reference = "patches/macos-recovery/elden-macos26-cache-pipeline.patch", result = "The Elden bootstrap overlaps buffered reads with verification of independent CodeDirectory blocks. One pool of up to four workers shares 1 MiB of read scratch, and short signed ranges request smaller allocations. Later page validation reuses the read-only page-digest tables." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Compare ELDEN-CS markers from observe_macos26_kernel.py --elden-bootstrap --native-gop-display with --smp 1 and --smp 8", revision = "5b562f0811c2f22f39b8f05b9ae53010a6a42642", result = "The same 25F71 BaseSystem and eight-vCPU QEMU fixture authenticated 1,136,214,016 bytes in 51.2 seconds versus 75.4 for the serial baseline. Four workers shared 1 MiB of read scratch and the four retained page-digest tables totaled 8.47 MiB. The one-vCPU fallback authenticated all four files in 71.3 seconds versus 69.3. Host tests matched digests and checked corruption, short-read, memory protection and concurrent fallback paths." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Audit the original 25F71 ARM64e shared-cache signing blocks, compile the CodeDirectory gate, and build the r38 RAM image", revision = "800d7b888e4c116c3c5e38a33e2b30a9508c6bf1", result = "The main cache and four subcaches matched all 69,356 original 16 KiB SHA-256 blocks. Twelve host cases passed for the exact patched gate. The linked feature symbol, Recovery ABI, DarwinBoot and packed payload checks passed. The installed r37 log showed this granule was rejected at signature registration." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "fastboot boot elden-recovery-cache-signature-ram.img and capture the recovery-usb entry", revision = "2d06dd3afbc4a89681657cc63b3367db83850cc1", result = "The r38 tablet boot mounted the BaseSystem and executed PID 1. AMFI reached subcache .01 with the 16 KiB compatibility path active. PID 1 stayed in fcntl for more than nine minutes without starting Recovery services." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Build and verify elden-recovery-cache-progress-ram.img", revision = "2d06dd3afbc4a89681657cc63b3367db83850cc1", result = "The r39 progress overlay marks file reads, verification offsets and the registration result. The linked messages, Recovery module and ABI comparisons, DarwinBoot preflight, packed payload and MacBook checksum passed with the local overlay." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "fastboot boot elden-recovery-cache-progress-ram.img and capture the recovery-usb entry", revision = "b787f6d0c93272428f9d6d6a0ef5f5598bcb4198", result = "The tablet verified the first MiB of the 720,125,952-byte signed range. It did not reach the 64 MiB checkpoint after more than seven minutes, and the PID 1 fcntl was still pending." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Build and verify elden-recovery-cache-buffered-ram.img", revision = "b787f6d0c93272428f9d6d6a0ef5f5598bcb4198", result = "The r40 buffered-read overlay keeps CodeDirectory verification and reports separate read and hash times. The linked progress strings, prelink ABI comparisons, DarwinBoot preflight, packed payload and MacBook checksum passed with the local overlay." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "fastboot boot elden-recovery-cache-buffered-ram.img and capture the recovery-usb entry", revision = "e8680d43aca454e2a65ea39591d6a221deb29aba", result = "With buffered reads, the tablet verified 32 MiB within two seconds, then reported a swap-file open failure before the 64 MiB checkpoint. VM bootstrap accounted for 65,536 native pages in the 256 MiB allocation." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "make_phase2_payload.py --owned-memory-size 0x100000000 and verify_phase2_artifact.py", revision = "e8680d43aca454e2a65ea39591d6a221deb29aba", result = "The r41 image requests a 4 GiB conventional-memory allocation and uses the same r40 kernel. FAT readback, DarwinBoot preflight, packed image verification and the MacBook checksum passed with the local packaging changes." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "fastboot boot elden-recovery-4g-memory-ram.img and read the panel panic record", revision = "93c9bda3829895d179624818ff20ba4b50321e6a", result = "The tablet entered XNU with the 4 GiB window. kmem_range_init reported 90.77 GiB of fixed claims and a 42.84 GiB hole. The panic occurred before the USB worker was available." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Build and verify elden-recovery-memory-reset-ram.img and the separate early-panic test image", revision = "93c9bda3829895d179624818ff20ba4b50321e6a", result = "The local Elden overlays cap the default compressor claim and arm the PSCI panic reset during early device-tree setup. Linked code, prelink ABIs, DarwinBoot preflight, packed payload readback and MacBook checksums passed for the RAM images." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "fastboot boot elden-recovery-early-panic-check-ram.img and monitor for bootloader fastboot over USB", revision = "8f5f355b09ff3e1d91bd97219da4588271e43cc7", result = "The tablet returned to fastboot 66 seconds after the MacBook selected the deliberate early-panic entry. No XNU USB interface or host reset command appeared. The MacBook immediately RAM-booted the corrected image." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Boot the r42 4 GiB image with two USB timeout values, then read the previous retained log over UniXNU USB", revision = "8f5f355b09ff3e1d91bd97219da4588271e43cc7", result = "Both boots reset after about 149 seconds before XNU USB enumeration. The partly corrupted retained log showed an 8 GiB compressor range, completed VM bootstrap, and a later write_pte_fast alignment panic. The 4 KiB XNU source had selected 16 KiB VM pages because RAM exceeded 1 GiB." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Build and verify elden-recovery-4k-vm-ram.img", revision = "ef4ded874aca91dc9b1e15bf6217384e3d80b3f5", result = "The local arm_init overlay keeps the hardware and VM granules equal for the native 4 KiB SHENG target. The linked signature and panic hooks, Recovery ABI checks, 4 GiB ADT preflight, packed payload and MacBook checksum passed." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "fastboot boot elden-recovery-4k-vm-ram.img and capture the recovery-usb entry", revision = "ae78b9a7fe63a685b38d86323d6c5a556acbdfc8", result = "The tablet booted with 4 GiB and 4 KiB VM pages, mounted the BaseSystem, and registered every dyld subcache signature. PID 1 then hit EXC_ARM_PAC_FAIL on AUTIA x16, x17. The MacBook captured the complete panic and the tablet reset to fastboot automatically." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Audit original v5 fixup chains and build elden-recovery-shared-region-ram.img", revision = "ae78b9a7fe63a685b38d86323d6c5a556acbdfc8", result = "All 4,854 nonempty 16 KiB chains were reproduced as 4 KiB parts. The audit found 13,952 crossings. The local integration links the UniXNU slide function and PID 1 PAC diagnostics, and passed prelink ABI, DarwinBoot, packed image and MacBook checksum checks." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "fastboot boot elden-recovery-shared-region-ram.img and capture the recovery-usb entry", revision = "40ad9317d88a944e8c879b407c0e9d509ef117cc", result = "The tablet mapped the shared cache and advanced past the prior AUTIA failure. PID 1 exited with SIGSEGV before any tracked Recovery service started. The MacBook captured the panic and the tablet reset to fastboot automatically." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Build and verify elden-recovery-pid1-abort-ram.img", revision = "40ad9317d88a944e8c879b407c0e9d509ef117cc", result = "The local PID 1 trace logs unresolved EL0 aborts before exception delivery. The linked diagnostics, paired prelink ABIs, DarwinBoot preflight, packed payload and MacBook checksum passed." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "fastboot boot elden-recovery-pid1-abort-ram.img and capture the recovery-usb entry", revision = "9ba3a222426de0702e669d7d69c879c81700e1a0", result = "PID 1 faulted at original libobjc cache offset 0x25524 while loading an isa-derived class pointer. USB captured the complete panic and the tablet returned to fastboot without intervention." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Build and verify elden-recovery-user-va47-ram.img with the local 47-bit overlay", revision = "2b42e94c36129a66771e746716246268e7ae4e90", result = "The local 47-bit TTBR0 and 38-bit TTBR1 candidate links both table geometries and passed the 30-module prelink, DarwinBoot preflight, packed image checks and MacBook checksum." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "build r49 and verify the original 25F71 BaseSystem trust cache in the packed and rebuilt payloads", revision = "c85e28cfbe638496f39aa940ab5350528e06eb7c", result = "The original IPSW BaseSystem IM4P matches the BuildManifest and contains the signed ditto code hash. The r49 prelinked copy trace and TrustCache payload passed host checks. The table stays local." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM-boot r49 and r50 and capture the recovery-usb entry", revision = "665138f450a03796167c33c6088f0ee452465d69", result = "Both builds reached AMFI OSEntitlements.cpp:806 during mount-phase-1 and captured the complete panic. r49 loaded the matching external trust module and r50 reported an empty external trust segment. Both returned to bootloader fastboot automatically." },
  { kind = "host", reference = "scripts/elden-usb-control.py", command = "python3 -m py_compile scripts/elden-usb-control.py and run mocked handoff, reset and fastboot detection cases", revision = "665138f450a03796167c33c6088f0ee452465d69", result = "The controller reports missing reset as failure, rejects fastbootd, and can verify a return to fastboot without opening the XNU port or issuing a reset after the Recovery handoff." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "python3 elden-usb-control.py boot recovery-usb --ram-image elden-recovery-copy-trace-ram.img --require-fastboot --no-xnu-console --seconds 530 --log elden-recovery-unattended-reset.log", revision = "665138f450a03796167c33c6088f0ee452465d69", result = "The MacBook left the enumerated XNU CDC port unopened and issued only the firmware boot selection. Elden returned to bootloader fastboot with is-userspace=no. The exact reset cause was unavailable from the retained record." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "python3 elden-usb-control.py boot recovery-usb --ram-image elden-recovery-apple-trust-control-ram.img --require-fastboot --seconds 900 --log elden-recovery-apple-trust-control.log", revision = "5a4d2116cecd451f31572c621cf771c634f31869", result = "The byte-identical r47 kernel with the matching Apple trust module reached restore-datapartition. Ditto still received EPERM copying protected template directories into temporary Data. USB captured the task failure panic and the tablet returned to bootloader fastboot." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "python3 elden-usb-control.py boot recovery-usb --ram-image elden-recovery-nohost-short-ram.img --require-fastboot --no-xnu-console --seconds 530 --log elden-recovery-nohost-short.log", revision = "5a4d2116cecd451f31572c621cf771c634f31869", result = "Changing only the timeout from 90 to 15 seconds shortened total elapsed time from 302 to 210 seconds. The tablet returned to bootloader fastboot with the XNU console unopened and no host reset after Recovery handoff." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "python3 elden-usb-control.py boot recovery-usb-smp8 --ram-image elden-recovery-copy-trace-smp8-ram.img --require-fastboot --seconds 900 --log elden-recovery-copy-trace-smp8.log", revision = "6a88fabff9a9d6da5d71d77d98a434a808289064", result = "The r50 trace kernel with the verified eight-core ADT brought up CPUs 0 through 7 and repeated the AMFI entitlement panic at mount-phase-1. No ditto diagnostic was reached. The tablet returned to bootloader fastboot." },
  { kind = "source", reference = "scripts/build-elden-macos26-bootstrap.py", result = "The recovery copy trace is opt-in. The default source path preserves the normal syscall handler, and the diagnostic no longer reads userspace strings in the syscall path." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "python3 elden-usb-control.py boot recovery-usb --ram-image elden-recovery-copy-trace-scalar-ram.img --require-fastboot --seconds 900 --log elden-recovery-copy-trace-scalar.log", revision = "7176bd7c28e3412ad943036344205c930cb431bc", result = "r54 passed mount-phase-1. Recovery ditto received exactly 18 setxattr EPERMs and reported 18 protected destination directory failures. The MacBook captured the complete panic and verified automatic return to fastboot." },
  { kind = "source", reference = "patches/macos-recovery/elden-macos26-recovery-copy-trace.patch", result = "The opt-in xattr trace reports the source of a com.apple.rootless denial while preserving every VFS authorization and error return." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "python3 elden-usb-control.py boot recovery-usb --ram-image elden-recovery-copy-trace-xattr-ram.img --require-fastboot --seconds 900 --log elden-recovery-copy-trace-xattr.log", revision = "934680444fb79034bd9abcb70866d4ba01521f7e", result = "All 18 com.apple.rootless setxattr calls returned EPERM at the MAC-policy check with CSR 0x82. The task failed and the tablet returned to bootloader fastboot after sending the complete panic." },
  { kind = "source", reference = "patches/macos-recovery/elden-macos26-recovery-copy-trace.patch", result = "The optional exec trace records the process and caller code-signing flags for the signed rc_script_wrapper, sh, bash and ditto to locate where installer inheritance is lost." },
  { kind = "source", reference = "patches/macos-recovery/elden-macos26-ce-stack.patch", result = "The stackless CoreEntitlements helper measures the active thread or interrupt stack. The paired AMFI prelink preserves the original 128-byte threshold and failure branch." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "observe_macos26_kernel.py --elden-bootstrap --follow-launchd-main --continue-after-launchd-main", revision = "8e218fd2727c74132cf50df21ff9ce421dc0c024", result = "Base revision plus the stack helper and prelink overlays. The paired 4 KiB QEMU images differ only in the stack calculation. The original produced 18 MAC denials and panicked in restore-datapartition. The fixed image produced zero denials and started recoveryosd and WindowServer. The headless run reported missing imgsrc device information in mountrecursive. Tablet verification is pending." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Write the AVB-verified CoreEntitlements stack fix to inactive boot_a over SSH and hash both boot partitions", revision = "6026b268ca785fca8fea12fcd37a76782eb2cc96", result = "The native UFS image passed packaging and AVB verification. The installed boot_a backup and full post-write readback matched their source digests. Slot B remained active, boot_b and vbmeta were unchanged, and both boot partitions returned to read-only. Booting Recovery from the installed image is pending." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Verify the packed Elden Recovery menu and the signed boot_a image", revision = "915a9650aadd57728ed4f0f873e48596a67783ed", result = "Base revision plus the consolidated menu. The payload readback has one Recovery entry with optional USB, the ISC overlay and a 900-second deadline. All Linux and boot control entries were preserved. Embedded kernel, ADT, Linux and EFI binaries matched the previous image, and AVB verification passed." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Write the consolidated menu to inactive boot_a over SSH and hash both boot partitions", revision = "915a9650aadd57728ed4f0f873e48596a67783ed", result = "Base revision plus the consolidated menu. Full boot_a readback matched the signed image. Slot B Linux remained active and boot_b and vbmeta hashes matched the pre-flash values. Booting the consolidated entry is pending." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Boot the consolidated Recovery entry and inspect the on-screen progress", revision = "7f215858335b3e48f5c7c26dfac912da5d4aaef5", result = "WindowServer started and exited twice. The final wait status was SIGKILL and launchd printed shutdown transitions. The user saw no Recovery GUI. A follow-up SSH write added the optional WindowServer QR capture entry and verified the full boot_a digest." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "python3 elden-usb-control.py boot recovery-usb --ram-image elden-recovery-installer-exec-trace-ram.img --require-fastboot --seconds 900 --log elden-recovery-installer-exec-trace.log", revision = "13b83cff8dade21e821239697f4c0cdfdfbcfacb", result = "The signed wrapper already lacked CS_INSTALLER and CS_EXEC_INHERIT_SIP at its first exec. Both successive shells and ditto lacked both flags. MAC rejected all 18 protected writes, and the device returned automatically to fastboot with a complete panic capture." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "python3 elden-usb-control.py boot recovery-usb --ram-image elden-recovery-installer-blob-trace-ram.img --require-fastboot --seconds 900 --log elden-recovery-installer-blob-trace.log", revision = "fb0d950fe65dcf2acd55b5bec350f0e8b6bd58f7", result = "The signed wrapper's UBC code-signing blob already lacked both installer flags, as did the selected process flags. The 18 MAC denials recurred. The MacBook captured the complete panic and verified an autonomous return to bootloader fastboot on slot A." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "python3 elden-usb-control.py boot recovery-usb-timed --ram-image elden-recovery-signature-trace-ram.img --require-fastboot --seconds 1260 --log elden-recovery-signature-trace.log", revision = "f4bd859be237d6a06d1464f2ae823b0e7b1482f4", result = "Base revision plus the signature policy trace. The wrapper and ditto both reached policy with XML and DER present. Policy accepted both and chose 0x24014a01, without the installer flags. The 18 MAC denials recurred. USB captured the full panic and the tablet returned to bootloader fastboot." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Resolve the paired AMFI registration slots and build elden-recovery-credential-trace-ram.img", revision = "34acd26443af2772cd8649f06b3431f60fbabcf8", result = "The original AMFI installer entitlement evaluation is in the credential-update hook. Base revision plus a diagnostic that records the check and update results. The 30-module prelink, DarwinBoot preflight, packed image and MacBook checksum passed." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM-boot the timed Recovery USB entry of elden-recovery-credential-trace-ram.img", revision = "3ec7c83ba7d2549999bd9e927faedcde3644edd5", result = "MAC requested and completed the credential update for the original wrapper and ditto. Both returned 0x22014a01 with neither installer flag. The 18 MAC denials recurred, the complete panic arrived over USB and the tablet returned to bootloader fastboot." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM-boot the timed Recovery USB entry of elden-recovery-entitlement-query-ram.img", revision = "abb55bfec3a3c0678a916694c7f6c99829242b79", result = "Both Apple executables had parsed entitlements and the XNU query found the expected installer entitlement. The aggregate MAC result omitted the installer flags. USB captured the 18 MAC denials and complete panic before autonomous return to bootloader fastboot on slot A." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Build and package elden-recovery-policy-trace-ram.img", revision = "f7ed7c5844ffd33945b081b532b8577f60e6966d", result = "Base revision plus per-policy credential tracing and a comparison of the AMFI Boolean entitlement query with the XNU vnode dictionary. The 30-module prelink, DarwinBoot preflight, packed image check and MacBook checksum passed." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM-boot the timed Recovery USB entry of elden-recovery-policy-trace-ram.img", revision = "f7ed7c5844ffd33945b081b532b8577f60e6966d", result = "Base revision plus r64 trace. AMFI, Sandbox, and Quarantine each left the wrapper and ditto flags unchanged. Both Boolean and dictionary entitlement queries succeeded after the update. USB captured all 18 MAC denials and the full panic before autonomous return to fastboot." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Build and verify elden-recovery-entitlement-blob-trace-ram.img and decode the paired AMFI call sites", revision = "a413503d5151f620bd857ff27c64536cc2d38370", result = "Base revision plus the r67 trace. The image passed 30-module prelink, storage and display ABI audits, DarwinBoot preflight, packed-image verification and the MacBook checksum. All eleven AMFI branches to the traced XNU accessors matched the packaged instructions and relocated destinations." },

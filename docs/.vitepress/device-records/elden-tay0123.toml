[[area]]
id = "diagnostics"
status = "device-verified"
components = []
paths = ["scripts/check-*", "scripts/verify_*", "scripts/phase2_1_audit.py", "scripts/build_phase2_firmware.py", "patches/uefi/serial-menu-commands.patch", "patches/macos-recovery/elden-el1-*.patch", "patches/macos-recovery/elden-macos26-pid1-trace.patch", "docs/**", "out/build.json", "assets/**"]
inputs = ["RAM-only owner-operated boot procedure.", "Build and artifact SHA-256 values.", "UEFI screen output and recovery path."]
configuration = ["verify_artifact.py checks the FD, Android image and embedded FAT.", "build.json records artifact sizes and hashes.", "The phase 1 acceptance requires two consecutive cold boots."]
procedure = ["Build and verify the image.", "Owner runs fastboot boot twice and records the visible result.", "Power off and confirm stock Android before further work."]
findings = ["2026-11-07: panic duplication is fixed and device-confirmed. New generic MIT DWC3 core plus guarded elden adapter, nonblocking console ring, bounded panic drain, session-bound status and PID1 EL0 syscall observation are built; CDC hardware remains unqualified.", "2026-11-06 prerequisites: final EFI31744-byte application passes FDT mailbox, parent metadata and memory-report contracts, and reaches the same XNU registration return1 through the neutral-debug AAVMF driver. Known-read expectations are prepared but were not sampled on the tablet.", "2026-11-06 host: source GOP console kernel/archives/prelink completed; separate read-only UFS root-check archive compiled with inherited identity DMA and LUN selection. TWRP/Linux EFI prototype and userdata/ESP design remain hardware-unverified. Details and bounded evidence in docs/NIGHT-BRINGUP-20261106.md; no stock index change or device write.", "2026-11-05 offline: marker menu fallback is 600 seconds; NativeUfs probe 2 deliberately panics to display read-only GCC/UFS diagnostics. Probes 7/8 inspect SMMU/CB; SM8750 rejects probe 3. This changes acceptance wording, not the driver. See docs/OFFLINE-PAYLOAD-20261105.md.", "The original accepted image is b56ef4b7e5a71382b8c279c4ee1560764fabd126ba37ac0fd6e495c80b9ec6e1.", "Earlier UFSDxe failure images are identified and must not be reused.", "Phase 2 requires separate kernel and DarwinBoot evidence.", "On 2026-10-25 a fresh phase 1 rebuild produced image SHA-256 94b6a6315b04fc9d276bc15e9519107be292244380fc3bf139f5af6c96a3bb0a and FD SHA-256 e5420517d55f4b638c07617a252d3a65c95cfb731584dcb10dd1d98bae412580. The build and prior local candidate were read-only preserved under .cache/phase2.0, and the owner then completed two RAM cold boots of the new image.", "Phase 2.1 host auditing now checks the ADT independently and records FDT, ADT, UEFI memory and boot argument sources under .cache/phase2.1 without replacing phase 1 artifacts.", "Phase 2.2 audits passed for 1,010 target objects, 7,730 prelink XML tags, iOS 17.0 deployment, 4 KiB TCR and the expected ArmDTPlatform/ArmCpu symbols. These are host-only checks.", "2026-11-01: the two phase 2.3 embed-payload images both reached the UniXNU menu with the green payload checkpoint and printed config: \\EFI\\UniXNU\\unixnu.toml, so a visible menu no longer depends on the ABL ramdisk.", "2026-11-01: choosing xnu on the stage 2.3 boot image printed the DarwinBoot ARM64/video/inputs-validated lines twice and painted the Entry.S green band. This is loader evidence; the entry probe now supplies the first kernel-side checkpoint."]
completion = ["Every claimed checkpoint has a reproducible command, image hash and visible result.", "Failures reach a diagnosable screen or log instead of a silent hang."]
limits = ["The DarwinBoot hand-off and ADT acceptance are device-verified, but there is no XNU console or serial log yet; the entry probe is the first kernel-side checkpoint and still needs a device result.", "The generated hardware ADT input is a minimal host candidate. The separate firmware memory description contains the source-derived reservation map, but neither is a live device FDT.", "The historical accepted image bytes are absent from the workspace, so they cannot be booted or byte-compared locally."]
next_action = ["Build and test the 4 KiB ARM64e macOS kernel handoff after the passing standalone translation and PAC probes.", "Qualify the opt-in UniXNU firmware command menu over a physical EFI serial port, then bring up a pre-boot USB CDC transport for the MacBook cable.", "Run the PC CDC logger before boot. Require actual bytes, matching session, both mount results and repeated PID1 user-trap status; do not infer success from a launchd filename."]
evidence = [
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "fastboot boot elden-macos26-4k-recovery-pid1-trace-ram.img", revision = "1241b6e42385bf4ad7afc9c48f3f39df0a5ab322", result = "Bootloader fastboot accepted the RAM image on the tablet. The on-screen PID 1 result is pending." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "compile the PID 1 trace and verify its report symbol", revision = "0a0254a5efb72452bdb4622b567b5727bb2a69fb", result = "The opt-in trace records return from the initial exec, PID 1 synchronous EL0 traps, syscall entries, and the launchd main acknowledgment. Device execution remains pending." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "select Elden macOS 26.5 - Recovery PID 1 Log in image 76d640cd…", revision = "ed8f382d36ea0d3ebaa3a1582aa8e03410c9645d", result = "The screen remained at launchd exec after 153 seconds with one PID 1 exec, zero exits, and zero recorded Recovery service starts. No PID 1 stdout or stderr appears in the capture." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "scripts/build-elden-macos26-bootstrap.py; scripts/darwinboot_preflight.py --arm64e; scripts/verify_phase2_artifact.py", revision = "ca57db73c066162323e77156a9f0f1d72b1de4ff", result = "The isolated 4 KiB ARM64e source kernel linked at 0xfffffff007004000 with 38-bit bootstrap translation. Its SHA-256 is 27a8b2c7… and the verified RAM image is 3e64fc1a…. The on-device loader's ARM64e admission checks both PAC features." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "fastboot boot elden-macos26-4k-ram.img and select Elden macOS 26.5 - 4 KiB Kernel Entry", revision = "ca57db73c066162323e77156a9f0f1d72b1de4ff", result = "The tablet entered the macOS source kernel and lit bootstrap stages 0 through C green. D through F were blue mapping indicators. Kernel entry is confirmed. The first translated instruction, arm_init, and Recovery media remain unverified." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Rebuild with the 4 KiB bootstrap trace overlay and verify elden-macos26-4k-r2-ram.img", revision = "dbbd614ab15e97b1c4b93aac1f471771ddba8782", result = "The retest derives framebuffer descriptor geometry from XNU's selected granule. Disassembly confirmed L1 shift 30 and L2 shift 21 with 9 index bits. The three Elden framebuffer blocks and the embedded RAM image 1f6faa01… passed host checks." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM boot elden-macos26-4k-r2-ram.img and select Elden macOS 26.5 - 4 KiB Kernel Entry", revision = "dbbd614ab15e97b1c4b93aac1f471771ddba8782", result = "The device panic UUID FB8F5446-4A2F-3991-916F-148E0D3DB677 matched the retest. XNU passed arm_init and reached kmem_range_init. The 128 GiB macOS zone claim exceeded the approximately 46 GiB hole, producing a wrapped private data claim. Recovery storage was not in this image." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Rebuild the small-map kernel and verify elden-macos26-4k-r3-ram.img", revision = "ca57db73c066162323e77156a9f0f1d72b1de4ff", result = "The linked startup spec now claims 24 GiB for zones. The build, firmware input preflight, embedded image checks, and MacBook checksum passed for image 7a4c686c…. The owner-operated menu test is a separate checkpoint." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM boot elden-macos26-4k-r3-ram.img and select the kernel", revision = "ca57db73c066162323e77156a9f0f1d72b1de4ff", result = "Panic UUID 3021AE3E-E615-31E6-9E7C-3A85656F42E0 confirmed the small-map kernel passed kmem_range_init and reached IOKit. The first data abort dereferenced a null interrupt-parent entry in IODTGetICellCounts." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Generate and inspect the Elden ADT with the interrupt phandle overlay", revision = "95ad78129203442c3c14c02336303adbddf8d0a3", result = "The GIC AAPL,phandle matches the existing phandle and the UFS interrupt-parent. The three-cell IRQ specifier is unchanged. The embedded image b3dd3c4a… passed preflight and byte comparison." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM boot elden-macos26-4k-r4-ram.img and select the kernel", revision = "ca57db73c066162323e77156a9f0f1d72b1de4ff", result = "The device passed IOKit interrupt-parent parsing and advanced to platform UUID setup. The next data abort at 0xfffffff007a8bb68 was SHA1Init dereferencing the absent corecrypto provider." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "emit_macos26_security.py --elden-bootstrap --recovery-components and verify elden-macos26-4k-r5-ram.img", revision = "ca57db73c066162323e77156a9f0f1d72b1de4ff", result = "The paired dSYM and 15-module prelink passed relocation and DarwinBoot input checks. Kernel 4d561d48… has 144975 chained pointers, 62884 authenticated, and no instruction blockers. Image b6dd5633… passed embedded payload checks and the MacBook checksum." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM boot elden-macos26-4k-r5-ram.img and select the Recovery Components entry", revision = "ca57db73c066162323e77156a9f0f1d72b1de4ff", result = "The device passed the previous SHA1 initialization fault and reached ArmCpu startup. Panic UUID 3021AE3E-E615-31E6-9E7C-3A85656F42E0 reported CPU 0 registration failed: 5. The original lookup masks Aff2, aliasing ADT affinities 0x0 and 0x10000 when cpus=1." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Rebuild the Elden source kernel, emit paired modules, and verify elden-macos26-4k-r6-ram.img", revision = "ca57db73c066162323e77156a9f0f1d72b1de4ff", result = "The ADT contains one boot CPU match under the Aff2-inclusive mask. Disassembly of ml_get_cpu_number confirms the 24-bit mask, and the 15-module prelink and embedded image checks passed. The retest UUID is 4BC95A0C-8278-3B67-A060-99E592519074." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM boot elden-macos26-4k-r6-ram.img and select the Recovery Components entry", revision = "ca57db73c066162323e77156a9f0f1d72b1de4ff", result = "Panic UUID 4BC95A0C-8278-3B67-A060-99E592519074 passed CPU registration. The paired dSYM resolves the next panic to the ml_unsafe_kernel_text assertion at machine_routines.c:3384." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Generate the Elden ADT with the restrictive text policy and verify elden-macos26-4k-r7-ram.img", revision = "95ad78129203442c3c14c02336303adbddf8d0a3", result = "The only non-ephemeral ADT change was the little-endian u32 policy value 1 for kernel-ctrr-to-be-enabled. The kernel and firmware hashes match the previous candidate, and image a58bff66… passed the embedded FAT and MacBook checksum checks." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM boot elden-macos26-4k-r7-ram.img and select the Recovery Components entry", revision = "43bc768e965363f0d2c73838b01caf246e5431cc", result = "The owner photo shows PE_lockdown_iokit, successful APFS module loading and registration, and IOFindBSDRoot waiting on the fallback Apple_HFS IOMedia match. The text-policy assertion is cleared. No Recovery root was attached and no userspace launch is shown. NVRAM sync reports no controller." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Select the 4 KiB 47-bit control and photograph the result", revision = "c1bc42e59c647d5cedbf2a3a0ed3c5787747bbc2", result = "Image 8f4103d1… ran at EL1 on Elden. Both direct aliases returned the expected PCs and data read back as 0x5757. Execution, register readback and firmware restoration all passed. XNU was not part of this probe." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM-boot 800e8b7e… and select the EL1 PAC probe", revision = "c1bc42e59c647d5cedbf2a3a0ed3c5787747bbc2", result = "Elden returned bank-switch=PASS flags=7FFF expected=7FFF and EFI Success. Boot-CPU address and generic PAC, key discrimination, and firmware key/SCTLR restoration passed. XNU task and thread PAC remains unverified." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Select the direct 16 KiB execution probe and photograph the result", revision = "5661c8899873d82d9ca45113f90f7f6ce39decf6", result = "Active TCR 0x475113514 and TTBR1 0xccc64000 matched, and firmware restoration passed. The first direct fetch at 0xffff800000004000 faulted with ESR 0x86000002. EL1 MMFR0 0x2100122100001024 reports no stage-1 16 KiB support and reports 4 KiB support." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "fastboot boot ~/Downloads/elden-el1-native47-4k-ram.img (MacBook USB)", revision = "3ee06f7bd7a8284c55be6db4a52f96d4834abc88", result = "The Elden bootloader accepted the transfer and RAM boot of 4 KiB control image 8f4103d1…. The linked EFI and independent 47-bit 4 KiB table walk passed host checks. On-screen execution is pending." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Apply the serial menu overlay, build_phase2_firmware.py --output-dir out/elden-tty/firmware, and verify the packaged RAM image", revision = "c62bf12595f9a86c1b7282cf12d5af40b441fdac", result = "The opt-in firmware menu accepts help, list, status and configured boot IDs via EFI Serial I/O. Sanitized host parser tests, firmware link, phase 2.3 checks and the MacBook checksum passed for image 6fb0e19c…. Physical TTY and pre-boot USB CDC are unverified." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Select the EL1 16K 47-bit probe after the Elden RAM boot and photograph the result", revision = "2bba508f26d6bac75d3766e537b765bdb7756e10", result = "Tablet reached EL1 and restored firmware state. The first AT S1E1R raised ESR 0x96000010 with FAR 0xffff800000004000 and ELR 0xcccb80a8 before either indirect call." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Build the direct EL1 follow-up and verify it with scripts/verify_phase2_artifact.py", revision = "ca57db73c066162323e77156a9f0f1d72b1de4ff", result = "The direct-execution overlay builds against the pinned reference and its two indirect calls are present without AT instructions in the temporary translation phase. Image 6ec54f8b… passed structural checks and MacBook copy verification. The tablet result is pending." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "fastboot boot ~/Downloads/elden-el1-native47-direct-ram.img (MacBook USB)", revision = "4d25676a90f77263b306b5d73177efa9ee836995", result = "Elden bootloader fastboot returned OKAY for the transfer and boot of direct-execution image 6ec54f8b…. The on-screen result is pending." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "python scripts/test_el1_native.py and python scripts/test_el1_native.py --layout47 (macOS-ForSheng reference, with Clang and QEMU paths)", revision = "ca57db73c066162323e77156a9f0f1d72b1de4ff", result = "2026-11-10: QEMU 11.1.1 booted ARM64 UEFI and passed all six reference EL1 cases for PAC, 16 KiB translation, and 47-bit execution. Evidence covers the emulator and standalone probes." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "python scripts/prepare_macos26_recovery.py and python scripts/prepare_macos26_block.py (macOS-ForSheng reference, with verified 25F71 inputs)", revision = "ca57db73c066162323e77156a9f0f1d72b1de4ff", result = "2026-11-10: BaseSystem identified as macOS 26.5 build 25F71 with ARM64e launchd and dyld. The raw Recovery disk and manifest-matched root hash were prepared for QEMU." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "python scripts/observe_macos26_kernel.py --checkpoint arm_init (macOS-ForSheng reference, with the linked ARM64e kernel and EFI firmware)", revision = "ca57db73c066162323e77156a9f0f1d72b1de4ff", result = "2026-11-10: The Apple silicon build host linked the macOS 26.5 kernel and paired dSYM. The kernel reached arm_init through QEMU UEFI and DarwinBoot, with matched instructions and 16 KiB / 47-bit EL1 translation." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "python scripts/observe_macos26_kernel.py --checkpoint thread_setentrypoint --follow-init-entry --follow-launchd-main --let-vector-log (macOS-ForSheng reference, with the paired QEMU Recovery inputs)", revision = "ca57db73c066162323e77156a9f0f1d72b1de4ff", result = "2026-11-10: QEMU mounted the paired 25F71 APFS BaseSystem and executed the original launchd LC_MAIN entry in EL0. Recovery services started. WindowServer restarted and the language chooser had zero starts." },
  { kind = "host", reference = "docs/STARTUP-USB-CANDIDATE-20261107.md", command = "python edl_work/audit_startup_candidates.py (Y700 work repository)", revision = "33b55083a0b61630f71478230f648606163115eb", result = "Base revision plus local working-tree patches. 2026-11-07: panic duplication is fixed and device-confirmed. New generic MIT DWC3 core plus guarded elden adapter, nonblocking console ring, bounded panic drain, session-bound status and PID1 EL0 syscall observation are built; CDC hardware remains unqualified." },
  { kind = "source", reference = "docs/PANIC-CONSOLE-ALIAS-20261107.md", result = "Panic duplicates originate from console output plus PE_kputc pointing to console_write_unbuffered. Both panic entry points now skip only that aliased second sink; panic buffer and independent future USB sink are preserved. Build and hardware checks pending." },
  { kind = "host", reference = "docs/PREREQUISITES-20261106.md", command = ".venv/bin/python scripts/build-payload-loader.py", revision = "33b55083a0b61630f71478230f648606163115eb", result = "2026-11-06 prerequisites: final EFI31744-byte application passes FDT mailbox, parent metadata and memory-report contracts, and reaches the same XNU registration return1 through the neutral-debug AAVMF driver. Known-read expectations are prepared but were not sampled on the tablet. Source revision plus local working-tree changes." },
  { kind = "host", reference = "docs/NIGHT-BRINGUP-20261106.md", command = ".venv/bin/python third_party/UniXNU/unixnu build kernel -D . -j4", revision = "33b55083a0b61630f71478230f648606163115eb", result = "2026-11-06 host: source GOP console kernel/archives/prelink completed; separate read-only UFS root-check archive compiled with inherited identity DMA and LUN selection. TWRP/Linux EFI prototype and userdata/ESP design remain hardware-unverified. Details and bounded evidence in docs/NIGHT-BRINGUP-20261106.md; no stock index change or device write. Revision plus local working-tree patches." },

  { kind = "host", reference = "docs/OFFLINE-PAYLOAD-20261105.md", command = ".venv/bin/python scripts/build_offline_ufs_packet.py --fd out/phase3/old-fd-verified.bin --source-payload out/phase3/payload-fat16.img --kernel third_party/UniXNU/out/elden/ipados-17.7.11-21H461/elden-ufs_probe/kernel/kernel.macho", revision = "33b55083a0b61630f71478230f648606163115eb", result = "2026-11-05 offline: marker menu fallback is 600 seconds; NativeUfs probe 2 deliberately panics to display read-only GCC/UFS diagnostics. Probes 7/8 inspect SMMU/CB; SM8750 rejects probe 3. This changes acceptance wording, not the driver. See docs/OFFLINE-PAYLOAD-20261105.md. Source revision plus uncommitted local packaging changes." },


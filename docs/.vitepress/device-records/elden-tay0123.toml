  { kind = "host", reference = "docs/PHASE3-STORAGE.md", command = ".venv/bin/python -c 'generate(Path(\"/tmp/elden.dtb\"), merged_board_config, unique_chip_id=\"0x1\")'", revision = "b82bb65b4b3ba7508ae8ec9b18d0f36ec183da9f", result = "2026-11-01: a decoupled ADT generated with scripts/unixnu/devicetree.py exports arm-io base 0x1000000 size 0x16000000, arm-io/ufshc reg 0xd84000/+0x3000, arm-io/ufsphy reg 0xd80000/+0x2000 and interrupts (0, 265, 4); the ADT grew from 13,152 to 13,624 bytes. No XNU boot is claimed." },
]



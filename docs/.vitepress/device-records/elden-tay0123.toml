schema_version = 1

[device]
name = "elden"
soc = "SM8750P"
os_profile = "ipados-17.7.11-21H461"
summary = "Lenovo Legion Y700 Gen 4 format 2 migration. Phase 1 UEFI is device-verified; XNU, storage, display and touch remain bring-up work."

[[area]]
id = "configuration"
status = "host-verified"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "soc/**", "configs/**", ".github/**", ".gitignore", "local.toml.example"]
inputs = ["Use the ARM64 and iPadOS 17.7.11 profiles supplied by UniXNU.", "Select the shared platform, CPU and DarwinBoot components.", "Provide an SM8750 profile until an official shared SoC repository exists."]
configuration = ["board.toml declares schema_version = 2, soc_source = sm8750 and os_profile = ipados-17.7.11-21H461.", "The complete component list is explicit because profile arrays replace inherited arrays.", "Configuration and patch roots are ordered as ARM64, SoC, OS and device.", "soc/sm8750 supplies the transition profile and is referenced from feeds.toml."]
procedure = ["Run defconfig from a current UniXNU checkout.", "Inspect status JSON for profile order, component dependencies, patch order and output path.", "Replace the local SoC source with a reviewed UniXNU-sm8750-common commit before release."]
findings = ["2026-11-06 host: source GOP console kernel/archives/prelink completed; separate read-only UFS root-check archive compiled with inherited identity DMA and LUN selection. TWRP/Linux EFI prototype and userdata/ESP design remain hardware-unverified. Details and bounded evidence in docs/NIGHT-BRINGUP-20261106.md; no stock index change or device write.", "The repository was format 1 and did not select shared SoC or OS profiles.", "A public UniXNU-sm8750-common repository was not available during migration.", "Keeping a separate local SoC profile preserves parser validation without mislabelling unqualified hardware support as shared.", "Phase 2.0 resolved ARM64, local SM8750, iPadOS and device layers; the selected component order, 56 patches, 4 KiB page setting and separate format 2 output were checked with current UniXNU.", "Phase 2.1 keeps the XNU handoff and firmware memory description separate from the phase 1 dummy firmware DTB.", "Phase 2.2 resolved 57 patches after adding compile-time-disabled PMGR context required by the shared boot-progress patch. CONFIG_XNU_BOOT_PROGRESS is disabled for the minimum kernel because that diagnostic layer currently requires UFS, owner-root and Virtio.", "Phase 2.5 proved XNU entry execution from the device and located the Apple-platform dependencies without adding a panic renderer: PE_create_console reads the iBoot video console handoff at 0x3C0F0000, and the kernel then runs through bsd_init, IOKit and kext loading until AMFI panics with AMFI: not booted with security-mode-change-enabled. The earlier reading that a stage-16 kernel_startup_initialize_upto entry never returns is withdrawn: those freezes were panics with the kprintf gate closed."]
completion = ["board.toml resolves four ordered configuration layers.", "All selected components come from the UniXNU catalog and include their dependencies.", "No array field depends accidentally on inheritance.", "The SoC source is a reviewed remote commit and unixnu.lock records it."]
limits = ["soc/sm8750 is local and is not yet a release-quality shared source.", "The first resolution pass selects only platform, CPU, AES, prelink and DarwinBoot components."]
next_action = ["Phase 2.5 is complete on the kernel side: v51 (cc739804217c3277bb07e4ce967381d5e1dd970eb46e9bb6637ebb83c5c668be) reaches the root-device wait with no panic. Phase 3 starts with the storage entry: select and port a UFS component for the SM8750 controller so IOMedia/Apple_HFS can match. Replace the local SM8750 source with a reviewed shared commit before release."]
evidence = [
  { kind = "host", reference = "docs/NIGHT-BRINGUP-20261106.md", command = ".venv/bin/python third_party/UniXNU/unixnu build kernel -D . -j4", revision = "33b55083a0b61630f71478230f648606163115eb", result = "2026-11-06 host: source GOP console kernel/archives/prelink completed; separate read-only UFS root-check archive compiled with inherited identity DMA and LUN selection. TWRP/Linux EFI prototype and userdata/ESP design remain hardware-unverified. Details and bounded evidence in docs/NIGHT-BRINGUP-20261106.md; no stock index change or device write. Revision plus local working-tree patches." },

  { kind = "source", reference = "board.toml", result = "Schema 2 profile, component, kernel, device-tree and payload declarations." },
  { kind = "source", reference = "feeds.toml", result = "SM8750 transition source with the release replacement documented." },
  { kind = "source", reference = "soc/sm8750/soc.toml", result = "Shared-profile-shaped SM8750 transition metadata." },
  { kind = "source", reference = "docs/FORMAT2-MIGRATION.md", result = "Migration result, preserved phase 1 inputs and remaining release work." },
  { kind = "host", reference = "docs/PHASE2-STATUS.md", command = ".venv/bin/python .cache/phase2-plan/UniXNU/unixnu status --json -D .", revision = "16e592abee8a550dec8154ed1f38b5ebc4f16213", result = "2026-10-25: fresh defconfig, tree and status runs resolved four profiles, five pinned components, 56 patches and 4 KiB pages under a format 2 output directory separate from phase 1. The local SM8750 source remains unpinned for release." },
  { kind = "host", reference = "docs/PHASE2.2-STATUS.md", command = "PATH=.cache/phase2-plan/toolchain/bin:.venv/bin:$PATH .venv/bin/python .cache/phase2-plan/UniXNU/unixnu build kernel -D .", revision = "c91a2191fdf591a401a03027ed8b7fbfdbcad3a7", result = "2026-10-25: defconfig and status resolved five canonical components and 57 applied patches. The Command Line Tools host-shim build produced and prelinked the target kernel; release rebuilding still requires a full Xcode iPhoneOS SDK." },
  { kind = "device", reference = "docs/PHASE2.5-STATUS.md", command = "fastboot boot out/phase2.4/v3/elden-phase2.4-probe-boot.img", revision = "ef0e33d97c1a9571ec097e3ae37442efb8f4bb45", result = "2026-11-01: the entry probe drew the full-width blue band at mid-screen and the device reset through PSCI after about two seconds, so the patched XNU entry instruction executed and the reset channel works." },
  { kind = "device", reference = "docs/PHASE2.5-STATUS.md", command = "fastboot boot out/phase2.4/v45/elden-phase2.4-probe-boot.img", revision = "ef0e33d97c1a9571ec097e3ae37442efb8f4bb45", result = "2026-11-01: console and initialize_screen skipped; reset probes at 0x985d68 and 0x985d54 both froze while 0x985d44 reset, so the kernel halts inside the stage-16 kernel_startup_initialize_upto call at 0x985d50." },
  { kind = "host", reference = "docs/PHASE2.5-STATUS.md", command = ".venv/bin/python scripts/make_entry_probe_kernel.py --output-dir out/phase2.4/v45 --reset-va 0xfffffff007985d68 --ret-at 0xfffffff0073bde3c --ret-at 0xfffffff007941dec", revision = "ef0e33d97c1a9571ec097e3ae37442efb8f4bb45", result = "2026-11-01: the probe builder appends no segment in this mode; it overwrites the target instruction in place with a wait-then-PSCI-reset stub and optionally writes ret over named Apple handoffs. Every probe image passed verify_phase2_artifact.py with a v4 boot header and the 56 MiB FAT16 payload." },
  { kind = "host", reference = "docs/PHASE2.5-STATUS.md", command = ".venv/bin/python scripts/make_entry_probe_kernel.py --output-dir out/phase2.4/v49 --poke 0xfffffff0073bdf24=0x14000005 --poke 0xfffffff007941e0c=0x1400001d --poke 0xfffffff007941e90=0x52800041 --poke 0xfffffff0071fd970=0x00000000 --poke 0xfffffff0071fd978=0x073bb01c --poke 0xfffffff0071fd97c=0xfffffff0 --poke 0xfffffff0071652a4=0x00000001 --poke 0xfffffff007053aac=0x000d2970", revision = "718f75ae7215880274fda8c423858f68456509c2", result = "2026-11-01: the working tree at 718f75a adds --poke ADDRESS|SYMBOL=WORD to the probe builder (32-bit, code or data, prints the previous word and the owning segment) on top of new segments/locate/symbol_address helpers. The console candidate kernel is 54,050,920 bytes sha256 8a57a771b987477135692dc6b7a0c25c2a94587b8e0200e3a5934f284483de08 with eight pokes and no injected code; payload 5ebb049ef53865994e5870929397bddad4fb19c653116e77a4bfc6d757dc3f70 and image 0e3648192f2c2f3b1d6d01f75efa99b83b5f4d91fbcd06c07bd8790865fb41f9 passed verify_phase2_artifact.py with a v4 header, and darwinboot_preflight accepted 16 segments and the ADT. Host evidence only; the image has not been booted." },
  { kind = "device", reference = "docs/PHASE2.5-STATUS.md", command = "fastboot boot out/phase2.4/v49/elden-phase2.4-probe-boot.img", revision = "718f75ae7215880274fda8c423858f68456509c2", result = "2026-11-01: the poke-only console image printed kernel text on the device for the first time. The log runs from DarwinBoot and AppleCredentialManager through bsd_init, IOKit, APFS, Skywalk, IONVRAM and IOSurface and ends in panic(cpu 0 caller ...): \"AMFI: not booted with security-mode-change-enabled\\n\" @ConfigurationSettings.cpp, preceded by Waiting on <dict ... IOProviderClass ... IOMedia ... Apple_HFS ...>. So the kernel passes the stage-16 kernel_startup_initialize_upto call; the earlier stage-16 halt reading was a panic with kprintf gated off." },
  { kind = "host", reference = "docs/PHASE2.5-STATUS.md", command = ".venv/bin/python scripts/make_entry_probe_kernel.py --output-dir out/phase2.4/v50 --poke 0xfffffff0073bdf24=0x14000005 --poke 0xfffffff007941e0c=0x1400001d --poke 0xfffffff007941e90=0x52800041 --poke 0xfffffff0071fd970=0x00000000 --poke 0xfffffff0071fd978=0x073bb01c --poke 0xfffffff0071fd97c=0xfffffff0", revision = "718f75ae7215880274fda8c423858f68456509c2", result = "2026-11-01: v50 keeps the six console pokes and drops the startup_debug and format-string pokes so the normal log scrolls, and pairs them with package/phase2.5-unixnu.toml whose xnu args add security-mode-change-enable=1 and amfi_get_out_of_my_way=1 (DarwinBoot copies the payload args into boot_args->CommandLine). Kernel 54,050,920 bytes sha256 f97e5f15b91630bbbad0dee002c352f122c7ff22747c6d2830148da63596deac, payload 2493716f6b8fbadd380c60bb236cc925cd90992c5c2fa6b1722af929903faf62, image d12b56ecd6e3e53fb23982ab09fbd0a26820501b8cb8d8edf1eacfa95e0cae70 passed verify_phase2_artifact.py (--xnu-title) and darwinboot_preflight.py. Host evidence only; not yet booted." },
  { kind = "device", reference = "docs/PHASE2.5-STATUS.md", command = "fastboot boot out/phase2.4/v50/elden-phase2.4-probe-boot.img", revision = "1724a7a6b8f87e8ecc5875a8586e7417e747a95c", result = "2026-11-01: the AMFI security-mode-change gate passed, so the boot-arg channel from package/phase2.5-unixnu.toml through DarwinBoot to boot_args->CommandLine is device-proven. The panic moved to \"AMFI: No PMGR?\\n\" @ConfigurationSettings.cpp:235: the developer-mode latch looks up the ApplePMGRNub service (string 0xfffffff0042dde02, lookup at 0xfffffff004aaeb00) and panics through the thunk at 0xfffffff004ac93e4 when the lookup returns NULL, which it does because elden publishes no power-management driver. The root-device wait text and the AMFI panic appear in the same screen tail." },
  { kind = "host", reference = "docs/PHASE2.5-STATUS.md", command = ".venv/bin/python scripts/make_entry_probe_kernel.py --output-dir out/phase2.4/v51 --poke 0xfffffff0073bdf24=0x14000005 --poke 0xfffffff007941e0c=0x1400001d --poke 0xfffffff007941e90=0x52800041 --poke 0xfffffff0071fd970=0x00000000 --poke 0xfffffff0071fd978=0x073bb01c --poke 0xfffffff0071fd97c=0xfffffff0 --poke 0xfffffff004aaecfc=0x17ffffd4", revision = "1724a7a6b8f87e8ecc5875a8586e7417e747a95c", result = "2026-11-01: v51 keeps the six console pokes and adds 0xfffffff004aaecfc: mov x0,x21 (0xaa1503e0) -> b 0xfffffff004aaec4c (0x17ffffd4), the epilogue of the developer-mode latch, so a missing ApplePMGRNub skips the latch instead of panicking. Kernel 54,050,920 bytes sha256 08def1c8206c04d1c20d6df273250a5ef04d72921c96112c6f863f84b8df7106, payload b912b4dfd0f86f2c92286049338756030f1592b0b2137523b4e79aa24fccc161, image cc739804217c3277bb07e4ce967381d5e1dd970eb46e9bb6637ebb83c5c668be passed verify_phase2_artifact.py (--xnu-title \"ELDEN 2.5 CONSOLE\") and darwinboot_preflight.py. Host evidence only; not yet booted." },
  { kind = "device", reference = "docs/PHASE2.5-STATUS.md", command = "fastboot boot out/phase2.4/v51/elden-phase2.4-probe-boot.img", revision = "1724a7a6b8f87e8ecc5875a8586e7417e747a95c", result = "2026-11-01: v51 reaches the root-device wait loop and stops there with no panic. The screen repeats Waiting on <dict ID=\"0\"><key>IOProviderClass</key><string ID=\"1\">IOMedia</string><key>Content</key><string ID=\"2\">Apple_HFS</string></dict>, which means the kernel completed arm_init, kernel_bootstrap_thread, bsd_init, IOKit and kext loading, skipped the AMFI developer-mode latch with the 0xfffffff004aaecfc poke, and is now waiting for a block device that elden does not publish. Kernel-side phase 2.5 goal met; storage (UFS) is the phase 3 entry point. Display, the ArmCpu/GIC/timer checkpoints and the firmware-level console fix remain unproven." },
]

[[area]]
id = "firmware"
status = "device-verified"
components = ["DarwinBoot"]
paths = ["scripts/**", "drivers/**", "patches/overlays/**", "patches/uefi/**", "package/**", "proprietary-files.txt"]
inputs = ["mu_wide_platforms lenovo-y700g4 UEFI source and patched PMIC binaries.", "UniXNU, UniXNUDxe, DarwinBoot and EldenRamDiskDxe firmware modules.", "A 4 MiB FAT16 payload containing package/unixnu.toml."]
configuration = ["firmware.dsc points to PakalaPkg/PakalaNoSb.dsc.", "firmware.fd points to the DEBUG CLANGPDB SM8750_EFI.fd.", "payload volume is ELDENRAM and loader is firmware.", "panic_screen remains false because the phase 2 panic renderer is not integrated."]
procedure = ["Build the phase 1 image with scripts/build_phase1.py.", "Run scripts/verify_artifact.py against the FD and Android v3 image.", "Owner performs two RAM cold boots with fastboot boot."]
findings = ["2026-11-06 prerequisites: bounded current-boot FDT/original-initrd bootconfig inheritance and a conventional-memory report mode are compiled in the31744-byte EFI application. Synthetic metadata bounds/CRC, priority and full-initrd cleanup/retry pass in AAVMF; the accepted FD is unchanged. See docs/PREREQUISITES-20261106.md.", "2026-11-06 host: source GOP console kernel/archives/prelink completed; separate read-only UFS root-check archive compiled with inherited identity DMA and LUN selection. TWRP/Linux EFI prototype and userdata/ESP design remain hardware-unverified. Details and bounded evidence in docs/NIGHT-BRINGUP-20261106.md; no stock index change or device write.", "2026-11-05 offline inventory of the accepted FD confirms EldenPayloadDxe present and UniXNURamDiskDxe absent. Actual old/new BootShim bytes were emulated through both copy and in-place branches: x3=8 MiB versus 56 MiB, x0 preserved, FD copy identical. The newer FD regression is not hardware-isolated. See docs/OFFLINE-PAYLOAD-20261105.md.", "The vendor UFSDxe crashed before the menu, so it was removed from the phase 1 APRIORI, DSC and FDF.", "The embedded FAT payload avoids persistent storage and makes the menu independent of UFS.", "The same image reached the visible menu twice and returned to stock Android after reset.", "Phase 2.5 isolated the first kernel-side blocker: PE_create_console reads PA 0x3C0F0000, the iBoot video console handoff, and faults because this device never initialised it; replacing its first instruction with ret lets arm_init reach machine_startup. The firmware and payload do not need to change for this.", "DarwinBoot already forwards the UniXNU payload entry args verbatim into boot_args->CommandLine, so kernel boot arguments (debug flags, security-mode-change-enable, amfi_get_out_of_my_way) can be changed without rebuilding firmware."]
completion = ["Firmware contains UniXNU, UniXNUDxe, DarwinBoot and the RAM payload driver.", "The payload config is readable and the menu accepts volume-key input.", "Two RAM boots produce the same visible checkpoint and do not modify persistent partitions."]
limits = ["The verified firmware is phase 1 and does not contain a bootable XNU payload.", "The new format 2 firmware command is not yet switched from the project build script.", "The kernel console now works, but only through image-level pokes: DarwinBoot still hands over the raw physical framebuffer without initialize_screen's physical-address marker, so the console patch has to be replaced by a firmware-side fix before release."]
next_action = ["Use the current phase 1 image as the accepted baseline. Phase 2.5: keep the firmware unchanged and add the kernel-side GOP console fallback; the embedded payload channel and DarwinBoot hand-off are already device-verified."]
evidence = [
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "verify the Recovery Framebuffer Test RAM image", revision = "1241b6e42385bf4ad7afc9c48f3f39df0a5ab322", result = "The candidate keeps the accepted firmware. The BootShim and embedded FAT carry the new 128 MiB payload." },

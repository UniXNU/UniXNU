  { kind = "host", reference = "docs/PHASE2.3-STATUS.md", command = "python3 scripts/make_phase2_probe.py && python3 scripts/make_phase2_payload.py --from-image out/phase2.3/payload.img && python3 scripts/build_phase2_image.py --kind probe --embed-payload && python3 scripts/build_phase2_image.py --kind boot --embed-payload && python3 scripts/verify_phase2_artifact.py --kind probe --image out/phase2.3/elden-phase2-embed-probe.img --shim out/phase2.3/shim-probe-embed.bin --embed-payload --payload out/phase2.3/probe.img && python3 scripts/verify_phase2_artifact.py --kind boot --image out/phase2.3/elden-phase2-embed-boot.img --shim out/phase2.3/shim-boot-embed.bin --embed-payload --payload out/phase2.3/payload.img", revision = "5582de7371ea5d880235e05854f459c7b819b41a", result = "2026-11-01: FAT16 probe (16,223 clusters) and FAT16 56 MiB payload (57,103 clusters) replace the mformat -F FAT32 volumes EnhancedFatDxe rejects below 65,525 clusters. Probe image d6bf11a7a260856a525a831689def5b12ea028dedaca7dc2c78009bc6f0c6adf and final image 863d1b02ae7c7c5b7a7de0ac6cd8590aa36332dbf25540735ed4a264de8288e9 pass FAT type, BPB label, gzip(shim+FD+payload) and FV module checks; firmware is unchanged at 20b4b370d599aee9b081a283bd62faffe6ee66005d0de32967284d7d53adf245. Host evidence only; no device boot was performed." },

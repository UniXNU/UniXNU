  { kind = "source", reference = "dts/elden.dts", result = "SPI4, chip select, GPIO interrupt and active/sleep pin states are taken from the verified board Linux tree. The device DTS leaves these nodes disabled." },
  { kind = "host", reference = "drivers/EldenNovatekTouch/test-firmware.c", command = "Run the sanitizer-instrumented SPI model against the tablet firmware and compile the loader and GENI transport for arm64e", revision = "3ec7c83ba7d2549999bd9e927faedcde3644edd5", result = "Base revision plus the firmware loader. The model verified all firmware bytes, CRC setup, cascade completion, version and PID, and exercised invalid input, mismatched hardware, timeout and transport errors." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Read the embedded initramfs in the saved tablet Linux boot input", revision = "34ab2d1d134c589d16f9a56a03e2fc902db84b23", result = "Recovered the 253,952-byte NT36536 firmware. The version byte pair, end marker and cascade header were verified offline." },
  { kind = "host", reference = "drivers/EldenNovatekTouch/test-frame.c", command = "Compile EldenNovatekTouch.c and test-frame.c with QcomGeniSpi headers, AddressSanitizer and UndefinedBehaviorSanitizer", revision = "f4bd859be237d6a06d1464f2ae823b0e7b1482f4", result = "Base revision plus the report reader. Verified the event-page command, dummy bytes, checksum, contact IDs, coordinate bounds, release frame and transfer errors. The shared GENI PIO and DMA register-model tests also passed." },
  { kind = "source", reference = "docs/PHASE1-STATUS.md", result = "Volume-key navigation reached the accepted menu." },

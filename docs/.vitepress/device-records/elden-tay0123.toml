inputs = ["SM8750 Adreno 830 chip ID 0x44050000.", "GPU, GMU and GPU SMMU resources measured from the tablet's Linux device tree.", "Matched gen80000 GMU, SQE, AQE and ZAP firmware identities.", "The saved Linux kernel and device tree supply the four speed-bin mappings and candidate GPU and GMU OPPs."]
configuration = ["The GMU loader reuses AdrenoFirmware and constrains destinations to SM8750 GMU address ranges.", "The reset-held transfer checks 4 KiB IOVA backing, writes and reads back TCM, and synchronizes instruction-cache and scratch payloads for device access.", "The GMU context adapter uses ArmSmmu4K for the five inactive buffer mappings and read-only observation of the exact SID 5 route and active table graph.", "An optional ARM64e build embeds the pinned GMU image. elden-adreno830-probe=1 validates it and elden-adreno830-gpucc=1 reads GPUCC handoff state.", "The HFI configuration adapter requires the reported DRM chip and speed-bin code, matching observed OPP rates and a verified live command-db lookup before deriving the A8xx performance and bandwidth tables.", "The cold-start adapter reuses the reset-held transfer and shared HFI queue, verifies fresh CM3 and HFI ready states, and attempts reset recovery on failure.", "The SM8750 clock controller verifies the rail floor and sequences CX, GPU PLL, GMU and hub roots and SMMU clock. Its stop path preserves inherited enables and parks both roots before dropping its parent clocks.", "The optional Recovery USB worker verifies the MX read, then acknowledges the highest supported MX and CX active votes in that order. The votes remain held until reset.", "The managed clock test calls the SM8750 power controller after both votes and reads the GMU reset and counter through a read-only mapping.", "The same entry observes the GPU SMMU slots and candidate GMU context bank after the clocks come up."]
procedure = ["Validate the full firmware image and check every destination before transfer.", "Read the GPUCC CX power and branch status on a dedicated RAM probe.", "Qualify one RPMh MX read after USB CDC and managed reset are ready.", "Establish SM8750 power and clock control and ArmSmmu4K ownership of GMU SID 5 before calling the transfer.", "Bring up A8xx HFI before enabling submission."]
findings = ["The tablet's Linux DRM and Turnip stack identifies Adreno 830.", "The shared loader validated the four expected firmware blocks on the build host and on the tablet under Linux and XNU.", "The tablet DT places the GMU at 0x03d37000 with a 0x68000-byte aperture. ITCM, DTCM and CM3 reset are at offsets 0x36000, 0x3a000 and 0x47000 within that aperture."]
completion = ["GMU firmware starts and responds on HFI under XNU.", "GPU submissions, fences and mapping work.", "A known image renders and Metal presentation is visible."]
limits = ["GPUCC and command database readback are device-verified. The reset-held firmware transfer remains host-verified only.", "The transfer needs a powered, clocked and exclusively owned GMU and pinned IOVA backing. The XNU boot hook currently calls the diagnostics only.", "The HFI adapter produced matching tables in XNU using native database resources and the same-device Linux speed bin. The direct QFPROM probe reset before USB. Hardware HFI exchange remains pending.", "The rail-hold and clock candidates are built and host-verified. Physical rail votes, GPUCC writes, GMU MMIO, SMMU survey and route attachment, firmware startup, submission and Metal remain pending."]
next_action = ["Run the deferred MX read and active rail hold entries on the tablet. After both acknowledgments and fastboot return, run the managed GPU Clock and SMMU Survey entry and verify the power result, advancing counter, slot validity and candidate bank state.", "Bind the GMU stream to an ArmSmmu4K context and exercise the cold-start adapter before sending HFI tables on hardware."]
evidence = [
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Run test-smmu-survey with ASan and UBSan, prepare the XNU sources, relink the ARM64e kernel and verify the Recovery RAM image", revision = "3f2401e0c966808668f7668a7da47a6d0604debe", result = "Base revision plus the read-only GPU SMMU survey. The model exercised masked and exact SID 5 matches, invalid routes, extended IDs and aperture checks. Kernel 48888ED0 and the packed MacBook image passed verification. Tablet execution is pending." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Run the RPMh and clock models, prepare XNU sources, relink the ARM64e kernel and verify the Recovery RAM image and QEMU control", revision = "6dd7112c9ebf41adaa3d91c6ebc9ede641f17f5f", result = "Base revision plus the opt-in managed CX and GMU clock test. Kernel 09C6A640 and its dSYM match. The 31-module prelink, packed image and MacBook readback passed. Eight-vCPU QEMU reached launchd and skipped the worker for the non-Elden tree. Tablet execution is pending." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Run the ordered RPMh model with the same-tablet command database, relink the two ARM64e units, and verify the Recovery RAM image and MacBook copy", revision = "1ec0870351d9e2de56f134c74874d68e0a9c47e3", result = "Base revision plus the opt-in active rail hold. The model passed MX index 9 before CX index 10, two acknowledgments, restoration, timeout, cleanup and invalid database cases. Kernel F0800C83 and its RAM image passed prelink and packed readback. Both entries require CDC and managed reset. Tablet execution remains pending." },
  { kind = "host", reference = "drivers/Adreno830/test-gpu-power.c", command = "Run the SM8750 GPU power model under ASan and UBSan and compile the power controller to ARM64e", revision = "d339a18f5f5cd74468084ab79d38f31b2214ea63", result = "Base revision plus the SM8750 clock controller. The captured Elden register model passed cold start, stop, restart and every one of 151 start and 59 stop callback failure points. The model verifies preserved GCC votes and source retention if the root cannot park or CX does not collapse. Hardware power and clock ownership still need verification." },
  { kind = "host", reference = "drivers/Adreno830/test-gmu-boot.c", command = "Run the ARM64 GMU register model under ASan and UBSan against pinned gen80000_gmu.bin and compile EldenAdreno830GmuBoot.c to ARM64e", revision = "047ba191c07855e6000b66f58ce26cd335c0831f", result = "Base revision plus the cold-start adapter. The model verified TCM and cache transfer before reset release, fresh firmware and HFI ready transitions, both HFI table acknowledgments through the real queue, and bounded timeout and fault recovery. The model supplies the firmware replies. The hardware power and SMMU owner still needs to call the adapter." },
  { kind = "host", reference = "drivers/Adreno830/test-rpmh-read.c", command = "Run the DRV-2 ACTIVE TCS1 model under ASan and UBSan, compile the paired ARM64e kernel and verify the deferred Recovery RAM image", revision = "6b9b56a40ca827cba32c4aff8a628d33afb7616f", result = "Base revision plus the deferred RPMh probe. The model verified an MX read, independent slot completion, cleanup, and the refusal and timeout paths. XNU schedules the test after the USB start marker transfer completes and the managed reset deadline is armed. Tablet completion and the returned value remain unverified." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM boot 742DD3C5 with elden-adreno830-rpmh=1 and capture XNU USB", revision = "7d35ac725697038bb18ef56546e3f594e52354e4", result = "Base revision plus passive RPMh probe. XNU read DRV-2 ID 00030800 and config 800c8104, three idle ACTIVE slots, and LOW_SVS hardware index 2 for MX and CX. All eight CPUs, software first frame, Language Chooser startup and automatic fastboot return were observed." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM boot kernel 90DCD9AD with the opt-in HFI probe and same-device Linux speed bin", revision = "fa0fa6630f461f99782a5a41734e6b157aa7c76f", result = "XNU produced 15 GX, four CX and eight DDR rows using the live database. The 59-word performance payload and DDR table matched the host reference digests. No GMU exchange occurred." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM boot the paired kernel with elden-adreno830-cmd-db=1 and compare the USB resource lines with Linux", revision = "3fd338d5698df54bca7955e101e52ada71f27f5c", result = "With the read-only database probe, kernel 0FA14065 reported all eight expected resource addresses, aux lengths and digests. All matched the Linux capture. Seven secondary CPUs reported online." },
  { kind = "source", reference = "drivers/Adreno830/EldenAdreno830Boot.inc", result = "An opt-in XNU probe reads the bounded command database into temporary memory and reports the addresses and aux digests of eight GPU resources for comparison with Linux." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM boot the original Linux backup and read MSM GET_PARAM, OPP debugfs and cmd-db over the USB console", revision = "ade69ab09ea20ba10d277dbae491191ef22763b3", result = "MSM reported chip 0x44050000 and speed bin 0xe8, with all 14 GPU rates through 1.1 GHz and three GMU rates enabled. The command database dump contained 166 entries and all eight HFI resources. Linux returned to fastboot on slot A." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Run the HFI adapter under ASan and UBSan using the live capture and compare rows with the paired Linux algorithms and DT", revision = "ade69ab09ea20ba10d277dbae491191ef22763b3", result = "The live inputs produced 15 GX, four CX and eight DDR rows matching the independent calculations. HFI performance message 15 encoded 59 payload words." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Run the AdrenoFirmware deaaae24 A8xx encoder oracle, real-ring QEMU peer and ARM64e compile", revision = "0b61f6b3ba77f039db784b44efb01c04c144af0c", result = "The performance encoder matched pinned Linux for 155 GX/CX count combinations. The shared two-table prefix validates both tables before sending and waits for the performance ACK before bandwidth. Host and QEMU tests passed; there is no hardware HFI exchange yet." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM-boot the paired software display image with elden-adreno830-gpucc=1 and capture XNU USB", revision = "d431007e0cbc75786472b291129c345acf695600", result = "Physical kernel 76B9E3DF read GPUCC CX=0222f801 HW=2a00010a AHB=08000000 GMU=88002001 CXO=88000001 HUB=88000001. CX PWR_ON is clear and GMU/CXO/HUB CLK_OFF is set. Firmware validation passed four blocks and 88656 bytes. All eight cores and software first frame remained working; the run returned automatically to fastboot. No runtime firmware transfer or GPU rendering is claimed." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM-boot elden-adreno830-usb-ram.img with elden-adreno830-probe=1 and read XNU USB", revision = "34ab2d1d134c589d16f9a56a03e2fc902db84b23", result = "XNU on the physical tablet validated four GMU firmware blocks containing 88,656 payload bytes. The timed run returned to bootloader fastboot on slot A." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "vulkaninfo --summary and run test-gmu against the installed firmware over Linux SSH", revision = "a6190077af83a6e02645a6b02a70f86c43696e3e", result = "The physical tablet reports Adreno 830 via Turnip. The loader test passed against the installed 88896-byte GMU image. These results are from Linux." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "compile the GMU loader with sanitizers and build the opt-in 4 KiB ARM64e probe", revision = "a6190077af83a6e02645a6b02a70f86c43696e3e", result = "Firmware validation and refusal cases passed. The linked kernel, prelink, RAM image and MacBook copy passed host checks. XNU runtime remains unverified." },
  { kind = "host", reference = "drivers/Adreno830/test-transfer.c", command = "Run test_gmu and test-transfer with ASan and UBSan against the pinned gen80000_gmu.bin, compile EldenAdreno830.c for arm64e-apple-macos26.5 and run the XNU wrapper with --prepare-only", revision = "3f9b3fb51b0c6917d3b668dc7ed8977b112ebec7", result = "Base revision plus reset-held transfer. The model verified 139 TCM writes and readbacks, 88100 instruction-cache bytes, scratch and failure cases. The ARM64e object exposes the transfer and 4 KiB XNU preparation stages the optional GPUCC hook." },
  { kind = "host", reference = "drivers/Adreno830/test-context.c", command = "Build and run test-context with ASan and UBSan and compile EldenAdreno830GmuContext.c for arm64e-apple-macos26.5", revision = "d431007e0cbc75786472b291129c345acf695600", result = "Base revision plus the A830 adapter, using ArmSmmu4K 83969cd874503e65997ff7639f7dcf3d0a92cd17. The model verified 4,111 leaves in 13 table pages, checked the exact SID 5 route without register writes, and rejected physical aliasing, TTBR and leaf changes, bank sharing and route drift. The adapter compiled to ARM64e and remains outside the boot hook." },
  { kind = "host", reference = "drivers/Adreno830/test-hfi-config.c", command = "Compare the saved Linux compiled catalog and DT OPP properties, run test-hfi-config with ASan and UBSan and compile EldenAdreno830HfiConfig.c for arm64e-apple-macos26.5", revision = "0b61f6b3ba77f039db784b44efb01c04c144af0c", result = "Base revision plus the Elden HFI adapter, using AdrenoFirmware deaaae24d7fe1a8fdd10a0fe8bfb3fbc4c9a3c87. The saved catalog and all 14 GPU and three GMU OPP tuples match. Synthetic command-db tests cover all four fuse profiles, exact vote and performance payload fields, and refusal of inconsistent inputs without changing output. The ARM64e adapter has no boot caller." },

  { kind = "host", reference = "drivers/EldenNovatekTouch/test-spi4.c", command = "Compile and run the SE4 MMIO model with AddressSanitizer and UndefinedBehaviorSanitizer, then link the setup with the digitizer as ARM64e kernel code", revision = "3d39f154207ad93de8edbf3da8fbf76fbbdb8a61", result = "Base revision plus the SPI4 setup. The model verified a 9.6 MHz clock, SPI mode 0, pin setup and rollback, and preservation of inherited QUP1 and USB repeater clock votes. The code is outside the tablet boot image." },
  { kind = "host", reference = "drivers/EldenNovatekTouch/EldenNovatekDigitizer.cpp", command = "Compile and link the digitizer, SPI and HID encoder as ARM64e kernel code and compare its authenticated vtable to the paired Recovery HID object", revision = "39c86a97aaa692e5635715e2dbcfca9248c7fd3c", result = "Base revision plus Elden HID bridge. The 208-byte IOHIDDevice base and 334 authenticated slots match the reference layout. The bridge remains outside the tablet boot image." },

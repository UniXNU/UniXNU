schema_version = 1

[device]
name = "elden"
soc = "SM8750P"
os_profile = "ipados-17.7.11-21H461"
summary = "Lenovo Legion Y700 Gen 4. Eight-core macOS Recovery reaches software first frame over inherited GOP. Recovery UI startup, GPU acceleration, installation, touch, radios and sleep remain bring-up work."

[[area]]
id = "configuration"
status = "host-verified"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "soc/**", "configs/**", "drivers/EldenPmicRtc/**", "scripts/build-elden-macos26-bootstrap.py", "patches/macos-recovery/elden-macos26-4k-platform.patch", "patches/macos-recovery/elden-armdt-nvram-options.patch", "patches/macos-recovery/elden-macos26-iortc-wait.patch", "patches/macos-recovery/elden-macos26-pmic-rtc.patch", "patches/macos-recovery/native-4k-vm-fault-range.patch", ".github/**", ".gitignore", "local.toml.example"]
inputs = ["Use the ARM64 and iPadOS 17.7.11 profiles supplied by UniXNU.", "Select the shared platform, CPU and DarwinBoot components.", "Provide an SM8750 profile until an official shared SoC repository exists."]
configuration = ["board.toml declares schema_version = 2, soc_source = sm8750 and os_profile = ipados-17.7.11-21H461.", "The complete component list is explicit because profile arrays replace inherited arrays.", "Configuration and patch roots are ordered as ARM64, SoC, OS and device.", "soc/sm8750 supplies the transition profile and is referenced from feeds.toml."]
procedure = ["Run defconfig from a current UniXNU checkout.", "Inspect status JSON for profile order, component dependencies, patch order and output path.", "Replace the local SoC source with a reviewed UniXNU-sm8750-common commit before release."]
findings = ["2026-11-06 host: source GOP console kernel/archives/prelink completed; separate read-only UFS root-check archive compiled with inherited identity DMA and LUN selection. TWRP/Linux EFI prototype and userdata/ESP design remain hardware-unverified. Details and bounded evidence in docs/NIGHT-BRINGUP-20261106.md; no stock index change or device write.", "The repository was format 1 and did not select shared SoC or OS profiles.", "A public UniXNU-sm8750-common repository was not available during migration.", "Keeping a separate local SoC profile preserves parser validation without mislabelling unqualified hardware support as shared.", "Phase 2.0 resolved ARM64, local SM8750, iPadOS and device layers; the selected component order, 56 patches, 4 KiB page setting and separate format 2 output were checked with current UniXNU.", "Phase 2.1 keeps the XNU handoff and firmware memory description separate from the phase 1 dummy firmware DTB.", "Phase 2.2 resolved 57 patches after adding compile-time-disabled PMGR context required by the shared boot-progress patch. CONFIG_XNU_BOOT_PROGRESS is disabled for the minimum kernel because that diagnostic layer currently requires UFS, owner-root and Virtio.", "Phase 2.5 proved XNU entry execution from the device and located the Apple-platform dependencies without adding a panic renderer: PE_create_console reads the iBoot video console handoff at 0x3C0F0000, and the kernel then runs through bsd_init, IOKit and kext loading until AMFI panics with AMFI: not booted with security-mode-change-enabled. The earlier reading that a stage-16 kernel_startup_initialize_upto entry never returns is withdrawn: those freezes were panics with the kprintf gate closed."]
completion = ["board.toml resolves four ordered configuration layers.", "All selected components come from the UniXNU catalog and include their dependencies.", "No array field depends accidentally on inheritance.", "The SoC source is a reviewed remote commit and unixnu.lock records it."]
limits = ["soc/sm8750 is local and is not yet a release-quality shared source.", "The first resolution pass selects only platform, CPU, AES, prelink and DarwinBoot components."]
next_action = ["Phase 2.5 is complete on the kernel side: v51 (cc739804217c3277bb07e4ce967381d5e1dd970eb46e9bb6637ebb83c5c668be) reaches the root-device wait with no panic. Phase 3 starts with the storage entry: select and port a UFS component for the SM8750 controller so IOMedia/Apple_HFS can match. Replace the local SM8750 source with a reviewed shared commit before release."]
evidence = [
  { kind = "host", reference = "drivers/EldenPmicRtc/test-rtc.cpp", command = "Run the ASan and UBSan PMIC observer model, prepare the patched source, and relink the paired ARM64e kernel", revision = "a1aee9ee1feebfc95db4456d1a65216bc56660a3", result = "Base revision plus PMK8550 UTC reader. The model checks channel ownership, raw UTC, optional SDAM2 offset, counter rollover, disabled hardware, denied access and bounded timeout. The kernel and dSYM matched UUID 465091A5-149E-3123-8CCB-CCB9A2C725F3. Device UTC and RTC wake remain unverified." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Run paired eight-vCPU QEMU with elden-pmic-rtc=1 and a non-Elden ADT, then verify the tablet inspect image", revision = "a1aee9ee1feebfc95db4456d1a65216bc56660a3", result = "Base revision plus PMK8550 UTC reader. QEMU retained the normal calendar path and reached BaseSystem and launchd PID 1. Packed RAM image and MacBook readback passed for the raw RTC and read-only install entry." },
  { kind = "host", reference = "patches/macos-recovery/elden-macos26-iortc-wait.patch", command = "Observe IOKitInitializeTime and clock_initialize_calendar on the same paired eight-CPU QEMU kernel with and without elden-iortc-wait=0", revision = "0d1d07a82a3e07f9dc6cc63542272356d95c1146", result = "Base revision plus the timeout option. The interval fell from 30.036 to 0.181 seconds. A subsequent immediate run returned from load_init_program after exec launchd pid=1. The packed hardware test image passed readback checks." },
  { kind = "source", reference = "drivers/Adreno830/EldenAdreno830GmuContext.h", result = "The SM8750 resource header adds the A8xx debug/log/HFI buffer sizes, GPU SMMU aperture and GMU stream ID used by the inactive ArmSmmu4K context adapter. Runtime selection and the hardware-proven boot path are unchanged." },
  { kind = "source", reference = "soc/sm8750/include/Sm8750AdrenoResources.h", result = "The SM8750 profile supplies the tablet GMU register aperture, fixed IOVA windows and GPUCC CX status offsets to the opt-in ARM64e Recovery build." },
  { kind = "source", reference = "patches/macos-recovery/native-4k-vm-fault-range.patch", result = "The VM fault range uses the same page mask as its aligned start, preserving guard-slot checks for 16 KiB user mappings on a 4 KiB kernel." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Inspect the actual configd fault and its containing VM entry in eight-vCPU QEMU", revision = "7623a4a86dbb2ca8492b93b8406d887b6ef569ff", result = "The guard rejected a 16 KiB range starting 8 KiB into a live 16 KiB slot. A sanitizer check of the corrected range and the original guard predicate passed 16 cases." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Stage the original and rewritten Elden builders, hash all prepared source files, and repeat --prepare-only", revision = "8802ef2ebb2b665f5a6de05260facc0177730b6d", result = "The profile build and original wrapper produced 6,142 byte-identical prepared files. Repeat preparation preserved all timestamps and build metadata with and without USB and the GMU validation probe." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Build the profile on the MacBook with --recovery-usb-core and --build-gop-display, then prelink and verify the packed RAM image", revision = "8802ef2ebb2b665f5a6de05260facc0177730b6d", result = "The ARM64e kernel and read-only UFS/GOP companion linked. The 30-module Recovery prelink reported zero instruction blockers, and DarwinBoot preflight and the raw v4 payload readback passed." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Regenerate the iPadOS ADT with phase2_1_audit.py and compare against the packed Recovery ADT", revision = "783549b385763c1c4a8eb6b3df620f0a4cb5bbf1", result = "Both ADTs used the same eight MPIDRs and PSCI and UFS properties. The GIC node differed only in AAPL,phandle. iPadOS requested 256 MiB and identified as iPad7,1. Recovery requested 4 GiB and identified as Elden." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Compile the Elden DTS, compare the saved Linux DTB to the embedded copy, and decode both packed Recovery ADTs", revision = "3cde0ac497e4a4cdfe07b7f0631a7dc89287c2e7", result = "The saved Linux handoff tree and embedded Linux DTB were byte-identical. The 22-node XNU ADTs matched eight MPIDRs and physical GIC and UFS addresses. Peripheral dependency gaps are recorded in the comparison. A fresh Linux runtime FDT was unavailable while the tablet ran XNU." },
  { kind = "source", reference = "drivers/EldenUfsStage2/EldenUsbRepeater.inc", result = "The PTN3222 transport derives the I2C instance from the effective Qualcomm firmware tree and checks the board-defined GENI base." },
  { kind = "source", reference = "board.toml", result = "The USB repeater hardware table records Elden GENI, I2C, PMIC reset and mux wiring for the menu driver build." },
  { kind = "host", reference = "docs/NIGHT-BRINGUP-20261106.md", command = ".venv/bin/python third_party/UniXNU/unixnu build kernel -D . -j4", revision = "33b55083a0b61630f71478230f648606163115eb", result = "2026-11-06 host: source GOP console kernel/archives/prelink completed; separate read-only UFS root-check archive compiled with inherited identity DMA and LUN selection. TWRP/Linux EFI prototype and userdata/ESP design remain hardware-unverified. Details and bounded evidence in docs/NIGHT-BRINGUP-20261106.md; no stock index change or device write. Revision plus local working-tree patches." },

  { kind = "source", reference = "board.toml", result = "Schema 2 profile, component, kernel, device-tree and payload declarations." },
  { kind = "source", reference = "patches/macos-recovery/elden-armdt-nvram-options.patch", result = "The macOS ArmDTPlatform excludes /options from generic nub creation so the IODTNVRAM provider remains in the device-tree plane." },
  { kind = "source", reference = "feeds.toml", result = "SM8750 transition source with the release replacement documented." },
  { kind = "source", reference = "soc/sm8750/soc.toml", result = "Shared-profile-shaped SM8750 transition metadata." },
  { kind = "source", reference = "docs/FORMAT2-MIGRATION.md", result = "Migration result, preserved phase 1 inputs and remaining release work." },
  { kind = "host", reference = "docs/PHASE2-STATUS.md", command = ".venv/bin/python .cache/phase2-plan/UniXNU/unixnu status --json -D .", revision = "16e592abee8a550dec8154ed1f38b5ebc4f16213", result = "2026-10-25: fresh defconfig, tree and status runs resolved four profiles, five pinned components, 56 patches and 4 KiB pages under a format 2 output directory separate from phase 1. The local SM8750 source remains unpinned for release." },
  { kind = "host", reference = "docs/PHASE2.2-STATUS.md", command = "PATH=.cache/phase2-plan/toolchain/bin:.venv/bin:$PATH .venv/bin/python .cache/phase2-plan/UniXNU/unixnu build kernel -D .", revision = "c91a2191fdf591a401a03027ed8b7fbfdbcad3a7", result = "2026-10-25: defconfig and status resolved five canonical components and 57 applied patches. The Command Line Tools host-shim build produced and prelinked the target kernel; release rebuilding still requires a full Xcode iPhoneOS SDK." },
  { kind = "device", reference = "docs/PHASE2.5-STATUS.md", command = "fastboot boot out/phase2.4/v3/elden-phase2.4-probe-boot.img", revision = "ef0e33d97c1a9571ec097e3ae37442efb8f4bb45", result = "2026-11-01: the entry probe drew the full-width blue band at mid-screen and the device reset through PSCI after about two seconds, so the patched XNU entry instruction executed and the reset channel works." },
  { kind = "device", reference = "docs/PHASE2.5-STATUS.md", command = "fastboot boot out/phase2.4/v45/elden-phase2.4-probe-boot.img", revision = "ef0e33d97c1a9571ec097e3ae37442efb8f4bb45", result = "2026-11-01: console and initialize_screen skipped; reset probes at 0x985d68 and 0x985d54 both froze while 0x985d44 reset, so the kernel halts inside the stage-16 kernel_startup_initialize_upto call at 0x985d50." },
  { kind = "host", reference = "docs/PHASE2.5-STATUS.md", command = ".venv/bin/python scripts/make_entry_probe_kernel.py --output-dir out/phase2.4/v45 --reset-va 0xfffffff007985d68 --ret-at 0xfffffff0073bde3c --ret-at 0xfffffff007941dec", revision = "ef0e33d97c1a9571ec097e3ae37442efb8f4bb45", result = "2026-11-01: the probe builder appends no segment in this mode; it overwrites the target instruction in place with a wait-then-PSCI-reset stub and optionally writes ret over named Apple handoffs. Every probe image passed verify_phase2_artifact.py with a v4 boot header and the 56 MiB FAT16 payload." },
  { kind = "host", reference = "docs/PHASE2.5-STATUS.md", command = ".venv/bin/python scripts/make_entry_probe_kernel.py --output-dir out/phase2.4/v49 --poke 0xfffffff0073bdf24=0x14000005 --poke 0xfffffff007941e0c=0x1400001d --poke 0xfffffff007941e90=0x52800041 --poke 0xfffffff0071fd970=0x00000000 --poke 0xfffffff0071fd978=0x073bb01c --poke 0xfffffff0071fd97c=0xfffffff0 --poke 0xfffffff0071652a4=0x00000001 --poke 0xfffffff007053aac=0x000d2970", revision = "718f75ae7215880274fda8c423858f68456509c2", result = "2026-11-01: the working tree at 718f75a adds --poke ADDRESS|SYMBOL=WORD to the probe builder (32-bit, code or data, prints the previous word and the owning segment) on top of new segments/locate/symbol_address helpers. The console candidate kernel is 54,050,920 bytes sha256 8a57a771b987477135692dc6b7a0c25c2a94587b8e0200e3a5934f284483de08 with eight pokes and no injected code; payload 5ebb049ef53865994e5870929397bddad4fb19c653116e77a4bfc6d757dc3f70 and image 0e3648192f2c2f3b1d6d01f75efa99b83b5f4d91fbcd06c07bd8790865fb41f9 passed verify_phase2_artifact.py with a v4 header, and darwinboot_preflight accepted 16 segments and the ADT. Host evidence only; the image has not been booted." },
  { kind = "device", reference = "docs/PHASE2.5-STATUS.md", command = "fastboot boot out/phase2.4/v49/elden-phase2.4-probe-boot.img", revision = "718f75ae7215880274fda8c423858f68456509c2", result = "2026-11-01: the poke-only console image printed kernel text on the device for the first time. The log runs from DarwinBoot and AppleCredentialManager through bsd_init, IOKit, APFS, Skywalk, IONVRAM and IOSurface and ends in panic(cpu 0 caller ...): \"AMFI: not booted with security-mode-change-enabled\\n\" @ConfigurationSettings.cpp, preceded by Waiting on <dict ... IOProviderClass ... IOMedia ... Apple_HFS ...>. So the kernel passes the stage-16 kernel_startup_initialize_upto call; the earlier stage-16 halt reading was a panic with kprintf gated off." },
  { kind = "host", reference = "docs/PHASE2.5-STATUS.md", command = ".venv/bin/python scripts/make_entry_probe_kernel.py --output-dir out/phase2.4/v50 --poke 0xfffffff0073bdf24=0x14000005 --poke 0xfffffff007941e0c=0x1400001d --poke 0xfffffff007941e90=0x52800041 --poke 0xfffffff0071fd970=0x00000000 --poke 0xfffffff0071fd978=0x073bb01c --poke 0xfffffff0071fd97c=0xfffffff0", revision = "718f75ae7215880274fda8c423858f68456509c2", result = "2026-11-01: v50 keeps the six console pokes and drops the startup_debug and format-string pokes so the normal log scrolls, and pairs them with package/phase2.5-unixnu.toml whose xnu args add security-mode-change-enable=1 and amfi_get_out_of_my_way=1 (DarwinBoot copies the payload args into boot_args->CommandLine). Kernel 54,050,920 bytes sha256 f97e5f15b91630bbbad0dee002c352f122c7ff22747c6d2830148da63596deac, payload 2493716f6b8fbadd380c60bb236cc925cd90992c5c2fa6b1722af929903faf62, image d12b56ecd6e3e53fb23982ab09fbd0a26820501b8cb8d8edf1eacfa95e0cae70 passed verify_phase2_artifact.py (--xnu-title) and darwinboot_preflight.py. Host evidence only; not yet booted." },
  { kind = "device", reference = "docs/PHASE2.5-STATUS.md", command = "fastboot boot out/phase2.4/v50/elden-phase2.4-probe-boot.img", revision = "1724a7a6b8f87e8ecc5875a8586e7417e747a95c", result = "2026-11-01: the AMFI security-mode-change gate passed, so the boot-arg channel from package/phase2.5-unixnu.toml through DarwinBoot to boot_args->CommandLine is device-proven. The panic moved to \"AMFI: No PMGR?\\n\" @ConfigurationSettings.cpp:235: the developer-mode latch looks up the ApplePMGRNub service (string 0xfffffff0042dde02, lookup at 0xfffffff004aaeb00) and panics through the thunk at 0xfffffff004ac93e4 when the lookup returns NULL, which it does because elden publishes no power-management driver. The root-device wait text and the AMFI panic appear in the same screen tail." },
  { kind = "host", reference = "docs/PHASE2.5-STATUS.md", command = ".venv/bin/python scripts/make_entry_probe_kernel.py --output-dir out/phase2.4/v51 --poke 0xfffffff0073bdf24=0x14000005 --poke 0xfffffff007941e0c=0x1400001d --poke 0xfffffff007941e90=0x52800041 --poke 0xfffffff0071fd970=0x00000000 --poke 0xfffffff0071fd978=0x073bb01c --poke 0xfffffff0071fd97c=0xfffffff0 --poke 0xfffffff004aaecfc=0x17ffffd4", revision = "1724a7a6b8f87e8ecc5875a8586e7417e747a95c", result = "2026-11-01: v51 keeps the six console pokes and adds 0xfffffff004aaecfc: mov x0,x21 (0xaa1503e0) -> b 0xfffffff004aaec4c (0x17ffffd4), the epilogue of the developer-mode latch, so a missing ApplePMGRNub skips the latch instead of panicking. Kernel 54,050,920 bytes sha256 08def1c8206c04d1c20d6df273250a5ef04d72921c96112c6f863f84b8df7106, payload b912b4dfd0f86f2c92286049338756030f1592b0b2137523b4e79aa24fccc161, image cc739804217c3277bb07e4ce967381d5e1dd970eb46e9bb6637ebb83c5c668be passed verify_phase2_artifact.py (--xnu-title \"ELDEN 2.5 CONSOLE\") and darwinboot_preflight.py. Host evidence only; not yet booted." },
  { kind = "device", reference = "docs/PHASE2.5-STATUS.md", command = "fastboot boot out/phase2.4/v51/elden-phase2.4-probe-boot.img", revision = "1724a7a6b8f87e8ecc5875a8586e7417e747a95c", result = "2026-11-01: v51 reaches the root-device wait loop and stops there with no panic. The screen repeats Waiting on <dict ID=\"0\"><key>IOProviderClass</key><string ID=\"1\">IOMedia</string><key>Content</key><string ID=\"2\">Apple_HFS</string></dict>, which means the kernel completed arm_init, kernel_bootstrap_thread, bsd_init, IOKit and kext loading, skipped the AMFI developer-mode latch with the 0xfffffff004aaecfc poke, and is now waiting for a block device that elden does not publish. Kernel-side phase 2.5 goal met; storage (UFS) is the phase 3 entry point. Display, the ArmCpu/GIC/timer checkpoints and the firmware-level console fix remain unproven." },
]

[[area]]
id = "firmware"
status = "device-verified"
components = ["DarwinBoot"]
paths = ["scripts/**", "drivers/**", "patches/overlays/**", "patches/uefi/**", "package/**", "proprietary-files.txt"]
inputs = ["mu_wide_platforms lenovo-y700g4 UEFI source and patched PMIC binaries.", "UniXNU, UniXNUDxe, DarwinBoot and EldenRamDiskDxe firmware modules.", "A 4 MiB FAT16 payload containing package/unixnu.toml."]
configuration = ["firmware.dsc points to PakalaPkg/PakalaNoSb.dsc.", "firmware.fd points to the DEBUG CLANGPDB SM8750_EFI.fd.", "payload volume is ELDENRAM and loader is firmware.", "panic_screen remains false because the phase 2 panic renderer is not integrated."]
procedure = ["Build the phase 1 image with scripts/build_phase1.py.", "Run scripts/verify_artifact.py against the FD and Android v3 image.", "Owner performs two RAM cold boots with fastboot boot."]
findings = ["2026-11-06 prerequisites: bounded current-boot FDT/original-initrd bootconfig inheritance and a conventional-memory report mode are compiled in the31744-byte EFI application. Synthetic metadata bounds/CRC, priority and full-initrd cleanup/retry pass in AAVMF; the accepted FD is unchanged. See docs/PREREQUISITES-20261106.md.", "2026-11-06 host: source GOP console kernel/archives/prelink completed; separate read-only UFS root-check archive compiled with inherited identity DMA and LUN selection. TWRP/Linux EFI prototype and userdata/ESP design remain hardware-unverified. Details and bounded evidence in docs/NIGHT-BRINGUP-20261106.md; no stock index change or device write.", "2026-11-05 offline inventory of the accepted FD confirms EldenPayloadDxe present and UniXNURamDiskDxe absent. Actual old/new BootShim bytes were emulated through both copy and in-place branches: x3=8 MiB versus 56 MiB, x0 preserved, FD copy identical. The newer FD regression is not hardware-isolated. See docs/OFFLINE-PAYLOAD-20261105.md.", "The vendor UFSDxe crashed before the menu, so it was removed from the phase 1 APRIORI, DSC and FDF.", "The embedded FAT payload avoids persistent storage and makes the menu independent of UFS.", "The same image reached the visible menu twice and returned to stock Android after reset.", "Phase 2.5 isolated the first kernel-side blocker: PE_create_console reads PA 0x3C0F0000, the iBoot video console handoff, and faults because this device never initialised it; replacing its first instruction with ret lets arm_init reach machine_startup. The firmware and payload do not need to change for this.", "DarwinBoot already forwards the UniXNU payload entry args verbatim into boot_args->CommandLine, so kernel boot arguments (debug flags, security-mode-change-enable, amfi_get_out_of_my_way) can be changed without rebuilding firmware."]
completion = ["Firmware contains UniXNU, UniXNUDxe, DarwinBoot and the RAM payload driver.", "The payload config is readable and the menu accepts volume-key input.", "Two RAM boots produce the same visible checkpoint and do not modify persistent partitions."]
limits = ["The verified firmware is phase 1 and does not contain a bootable XNU payload.", "The new format 2 firmware command is not yet switched from the project build script.", "The kernel console now works, but only through image-level pokes: DarwinBoot still hands over the raw physical framebuffer without initialize_screen's physical-address marker, so the console patch has to be replaced by a firmware-side fix before release."]
next_action = ["Use the current phase 1 image as the accepted baseline. Phase 2.5: keep the firmware unchanged and add the kernel-side GOP console fallback; the embedded payload channel and DarwinBoot hand-off are already device-verified."]
evidence = [
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM-boot the paired software display image with elden-adreno830-gpucc=1 and capture XNU USB", revision = "d431007e0cbc75786472b291129c345acf695600", result = "The full kernel build now includes vm/memory_types.h for the GPUCC IO mapping. The paired RAM image reached XNU USB, sampled GPUCC and returned automatically to fastboot without modifying firmware or boot slots." },
  { kind = "source", reference = "drivers/Adreno830/EldenAdreno830Boot.inc", result = "The Recovery kernel reads the inherited GPUCC CX state through a temporary read-only mapping when the GPUCC probe is selected." },
  { kind = "source", reference = "drivers/Adreno830/EldenAdreno830HfiConfig.h", result = "The 0x44050000 HFI table builder requires a separately verified command database and measured OPP selection. It has no firmware or Recovery boot integration." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM-boot the GUI capture image from the MacBook and read the USB setup banner", revision = "d5b4024347026a9a8598c266499cf4d7ff744ac5", result = "Vendor I2C open returned 0xc before the repeater transfer. Both UniXNU CDC and XNU CDC appeared. The macOS Base System mounted and launchd started." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "RAM-boot the PTN3222 image from the MC50 and MacBook", revision = "2af501a6d3d7b2607ddf9b164431fcbf241c1c44", result = "Both hosts reached the menu. MC50 showed no USB serial device. The MacBook read the PTN3222 fallback banner and received Recovery output from the XNU CDC port." },
  { kind = "source", reference = "drivers/EldenUfsStage2/EldenUsbRepeater.inc", result = "The menu driver uses the installed Qualcomm I2CDxe protocol to identify and configure the PTN3222 while preserving the existing DWC3 fallback." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Boot installed r37 Recovery on slot A and monitor USB through the panic", revision = "88289ea663c239d9aa77894c090df18fd24283da", result = "The MacBook captured arm_init, the macOS Base System mount, PID 1 exec, and the full libSystem.B.dylib panic with the no-dyld-cache reason. Bootloader fastboot enumerated after the panic without a host reset command. The no-host timeout remains unverified." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Capture Recovery over XNU CDC, request reboot-fastboot, and install the signed r37 image to boot_a", revision = "b5ec68e1ee8823cdf191f2ff3cada262225f6b86", result = "Base revision plus the Recovery panic poll and timeout changes. The r37 RAM image streamed the retained log from arm_init over XNU USB. XNU acknowledged reboot-fastboot and bootloader fastboot enumerated on slot A. Fastboot accepted the signed boot_a image and its installed menu listed nine entries." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Flash signed r36 to boot_a and run list, slot-status and fastboot over USB", revision = "50e90091fcce705c918115e013e62865bcc9a54b", result = "Base revision plus the live FDT handoff and macOS serial name fix. Bootloader fastboot accepted the write to active slot A. The installed UEFI CDC console listed all nine entries and completed a USB-triggered round trip to fastboot. The slot check returned open=Unsupported after the FDT transport was restored." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Use the MacBook controller to list entries, run slot-status and start recovery-usb on the r35 RAM image", revision = "50e90091fcce705c918115e013e62865bcc9a54b", result = "macOS enumerated /dev/cu.usbmodemELDEN_UEFI1. With underscore handling in the host script, all nine entries listed. Read-only slot status returned open=Not Found, and Recovery handed off without an XNU CDC device appearing during capture. No flash write was performed." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Build the Elden USB menu driver, UniXNU firmware, Recovery USB management kernel, and combined RAM image", revision = "b622c0d7339e0ed1f4094699f786b94ed5a4e3ba", result = "Base revision plus the USB management changes. UEFI, XNU, packed payload and MacBook controller checks passed. The tablet was visible over Linux USB ADB, then did not enumerate on the MacBook in bootloader fastboot. RAM transfer and on-device USB management remain pending." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Build and test EldenBootSlot.efi and verify the combined native slot RAM image", revision = "bd467b20d19a3d62ab962a6ef79b308a842aba14", result = "Base revision plus the direct firmware action. Mock UFS, both slot directions on copies of real GPTs, write bounds, rollback and embedded image readback passed. Native tablet qualification remains pending." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Inspect the tablet desktop launcher and read protected slot status over SSH", revision = "3c414c39606b4889d97a64ac0c241e7e3c1e719e", result = "The desktop launcher delegates slot writes to Linux qbootctl. The installed protected helper reported slot B with UFS boot LUN 2. The Qualcomm reference firmware uses both GPT slot state and the UFS boot LUN. A standalone Elden UEFI writer remains unqualified." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Flash the Recovery USB Console image to inactive boot_a over SSH", revision = "06cc83d15dc86b40c492fea2267eb0a0d02fbe64", result = "Full readback matched the signed USB console image built from this base and the Recovery USB patch. Original boot_b matched before and after. Both partitions returned to read-only and slot B remained active with UFS boot LUN 2. The new Recovery USB entry has yet to boot." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Flash the Recovery without Ignition and Linux console retention image to inactive boot_a over SSH", revision = "35e753350164a82cfe2f67b4c7f589c1bb1f20d7", result = "The full boot_a readback matched the signed SHA-256. Original boot_b matched before and after the write. Both boot partitions returned to read-only and slot B remained active with UFS boot LUN 2. Boot testing of the new image is pending." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Flash combined diagnostics to inactive boot_a and verify both boot partitions over SSH", revision = "3847c50b48becb05d08f7cb8438ee039eb9b8200", result = "Full boot_a readback matched the signed combined image. Original boot_b SHA-256 and active B/UFS boot LUN 2 were confirmed, and both partitions were read-only after the write. Boot of the combined image remains pending." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Package and verify the combined Recovery PID 1 and Linux EFI diagnostic image", revision = "3847c50b48becb05d08f7cb8438ee039eb9b8200", result = "Raw-v4 image passed DarwinBoot preflight, full FAT comparison, Linux/DTB/menu readback and slot A AVB verification. Both diagnostic payloads are present in the combined image." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Inspect active slot, systemd slot-service journal, pstore and boot partition hashes over SSH", revision = "8c7e7d1667575429f3b0ca41ac678cef867ee4fd", result = "After the reported menu failures, the tablet was reachable on the original slot B Linux path. Active B and UFS boot LUN 2 matched. The journal recorded no executed slot-switch request, pstore was empty, and both boot partition digests matched." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "prepare-elden-linux-efi.py --diagnostics and verify_phase2_artifact.py --raw-packed-payload", revision = "8dad62f706e8fbcce1cf2f49683467a12fe3980d", result = "Base revision plus the diagnostic option. After the owner reported both Linux menu entries returning, a raw-v4 RAM image with EFI debug logging, framebuffer early console, and panic hold passed host verification. No hardware diagnostic result yet." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Write inactive boot_a from slot B Linux and verify full readbacks over SSH", revision = "f2aa1a017da59b08d99bbd8c398285349a6edd2b", result = "2026-11-11: raw-v4 signed boot_a matches the full partition readback. Original boot_b digest, active slot B and UFS boot LUN 2 were verified. The first boot of the replacement is pending." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "build_phase2_image.py --embed-payload --raw-boot-reference and verify_phase2_artifact.py --raw-packed-payload", revision = "134edd73729109491cd3e7ace5bcbd013d40adfc", result = "Base revision plus raw ARM64 boot packaging and packed FAT driver. After the owner reported a return to fastboot on slot A, the host built an Android v4 image with stock A header metadata, a raw ARM64 payload smaller than working Linux B and LZ4 chunks decoded by DXE. Host FAT, decoder and AVB checks passed. Tablet boot of the new candidate is pending." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Read back boot_a and boot_b from the running Linux system", revision = "d6a8f4280f791fffc27957d475707e48c5b5321a", result = "2026-11-11: full inactive boot_a readback matches the signed dual-boot image. Original boot_b SHA-256 and active B/UFS boot LUN 2 were confirmed. Boot of the installed slot A image remains unverified." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "prepare-elden-linux-efi.py and verify_phase2_artifact.py", revision = "96bb7e12ea6effc4a41d55a36c65167cec671fc7", result = "Base revision plus Linux EFI and menu changes. The Linux EFI payload uses the FDT passed in x0. The signed slot A candidate passes a one-time slot request to the installed Linux rootfs. Host artifact and service command checks passed." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "tb322fc-select-boot-slot status and select a --dry-run", revision = "96bb7e12ea6effc4a41d55a36c65167cec671fc7", result = "The original Linux boot in slot B reported active B and UFS boot LUN 2. Slot A selection dry-run passed. The installed UniXNU slot service skipped the normal Linux boot without a request property. Menu-driven slot selection remains unverified." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "build and verify the Elden Adreno 830 GMU probe", revision = "a6190077af83a6e02645a6b02a70f86c43696e3e", result = "The Adreno 830 GMU probe RAM image passed embedded verification with the existing firmware and BootShim." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "verify the combined Recovery and Linux RAM image", revision = "cf9b0ba7c8a000b3ed4f4199707095ffd9b5fa0c", result = "The v4 image embeds the existing firmware and a 224 MiB FAT payload. The Linux entry uses UniXNU's ARM64 EFI-stub handoff and installs the matching Elden DTB." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "verify the Recovery Framebuffer Test RAM image", revision = "1241b6e42385bf4ad7afc9c48f3f39df0a5ab322", result = "The candidate keeps the accepted firmware. The BootShim and embedded FAT carry the new 128 MiB payload." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "compare the PID 1 Trace BootShim and verify the embedded image", revision = "0a0254a5efb72452bdb4622b567b5727bb2a69fb", result = "The PID 1 Trace RAM image uses the accepted firmware and a byte-identical BootShim." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "fastboot boot elden-macos26-4k-recovery-smp-aff2-ram.img", revision = "ed8f382d36ea0d3ebaa3a1582aa8e03410c9645d", result = "The Elden bootloader accepted the new SMP RAM image with the previously verified firmware and byte-identical BootShim." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "verify_phase2_artifact.py on elden-macos26-4k-ufs-result-ram.img", revision = "95e9740ea6da4727a0119d878a51f93b563305bf", result = "The result-display candidate embeds the same verified Elden firmware and a byte-identical BootShim with the manual probe menu." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "fastboot boot elden-macos26-4k-ufs-uic-ram.img", revision = "623c1f937c423c039c11991ff5e2a9150bb0542c", result = "Elden bootloader fastboot accepted the transfer and RAM boot of the UIC retest image. The packaged firmware and BootShim are byte-identical to the first UFS probe." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Build and verify out/elden-fastboot/elden-fastboot-ram.img", revision = "c62bf12595f9a86c1b7282cf12d5af40b441fdac", result = "Elden's opt-in firmware menu action uses PSCI SYSTEM_RESET2 with reset type 0x80010001 and cookie 0x2. The host checked the SMC arguments and returned errors, firmware linked, FAT payload verified, and the MacBook image checksum matched." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "fastboot boot elden-fastboot-ram.img, select Reboot to Fastboot, verify fastboot getvar product and is-userspace", revision = "c62bf12595f9a86c1b7282cf12d5af40b441fdac", result = "2026-11-10: the tablet accepted the temporary image and left fastboot. The owner selected the new menu action. USB re-enumerated as elden_prc_wifi with is-userspace: no. EFI serial invocation was not exercised." },
  { kind = "host", reference = "docs/PREREQUISITES-20261106.md", command = ".venv/bin/python scripts/build-payload-loader.py", revision = "33b55083a0b61630f71478230f648606163115eb", result = "2026-11-06 prerequisites: bounded current-boot FDT/original-initrd bootconfig inheritance and a conventional-memory report mode are compiled in the31744-byte EFI application. Synthetic metadata bounds/CRC, priority and full-initrd cleanup/retry pass in AAVMF; the accepted FD is unchanged. See docs/PREREQUISITES-20261106.md. Source revision plus local working-tree changes." },
  { kind = "host", reference = "docs/NIGHT-BRINGUP-20261106.md", command = ".venv/bin/python third_party/UniXNU/unixnu build kernel -D . -j4", revision = "33b55083a0b61630f71478230f648606163115eb", result = "2026-11-06 host: source GOP console kernel/archives/prelink completed; separate read-only UFS root-check archive compiled with inherited identity DMA and LUN selection. TWRP/Linux EFI prototype and userdata/ESP design remain hardware-unverified. Details and bounded evidence in docs/NIGHT-BRINGUP-20261106.md; no stock index change or device write. Revision plus local working-tree patches." },

  { kind = "host", reference = "docs/OFFLINE-PAYLOAD-20261105.md", command = ".venv/bin/python scripts/build_offline_ufs_packet.py --fd out/phase3/old-fd-verified.bin --source-payload out/phase3/payload-fat16.img --kernel third_party/UniXNU/out/elden/ipados-17.7.11-21H461/elden-ufs_probe/kernel/kernel.macho", revision = "33b55083a0b61630f71478230f648606163115eb", result = "2026-11-05 offline inventory of the accepted FD confirms EldenPayloadDxe present and UniXNURamDiskDxe absent. Actual old/new BootShim bytes were emulated through both copy and in-place branches: x3=8 MiB versus 56 MiB, x0 preserved, FD copy identical. The newer FD regression is not hardware-isolated. See docs/OFFLINE-PAYLOAD-20261105.md. Source revision plus uncommitted local packaging changes." },

  { kind = "source", reference = "docs/PHASE1-STATUS.md", result = "Accepted phase 1 artifact and firmware/module inventory." },
  { kind = "source", reference = "scripts/verify_artifact.py", result = "Static FD, Android image and embedded FAT verification." },
  { kind = "device", reference = "docs/PHASE2-STATUS.md", command = "fastboot boot out/elden-phase1.img", revision = "dffc3020a85830d0d981a85871d9ab31aac5827d", result = "2026-10-25: owner reported that the current image completed two RAM cold boots, reached the visible and operable UniXNU menu, and returned to stock Android." },
  { kind = "device", reference = "docs/PHASE1-HANDOFF.md", command = "fastboot boot out/elden-phase1.img", revision = "c591b1a0a471f24978aba25c56c8f6ec9bd06668", result = "Two owner-run RAM cold boots reached the UniXNU menu and returned to Android." },
]

[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu"]
paths = ["soc/sm8750/dts/**", "dts/**", "patches/macos-recovery/elden-macos26-*affinity.patch", "scripts/build-elden-macos26-bootstrap.py", "package/elden-macos26-smp-unixnu.toml"]
inputs = ["SM8750 MPIDRs 0x0, 0x100, 0x200, 0x300, 0x400, 0x500, 0x10000 and 0x10100.", "GICv3 distributor 0x16000000, redistributor base 0x16080000 and stride 0x40000.", "19.2 MHz architectural timer and PSCI SMC conduit."]
configuration = ["The SoC DTSI declares eight CPU nodes, timebase-frequency = 19200000 and psci method = smc.", "The GIC node exports unixnu,adt-name = intc.", "The device defconfig enables ARM DT platform, ArmCpu, native timer and PAN."]
procedure = ["Compile dts/elden.dts with the SoC include path.", "Generate an ADT from the DTB and inspect /cpus, /psci and /arm-io/intc.", "Boot the smallest XNU payload and record the first CPU, GIC or timer failure."]
findings = ["The board evidence documents the same eight MPIDR layout used by other SM8750 ports.", "The shared ADT generator emitted cpu0 as running and all other cores as waiting; ArmCpu does not probe secondary nubs unless sheng-smp is enabled.", "ArmCpu reads the GIC through /arm-io/intc and requires a complete two-range reg property.", "The old kernel argument set enabled armcpu-spi-ipi before elden had evidence that SGIs fail or that per-core SPI routing works. Phase 2.1 removed it from the single-boot-CPU milestone.", "v49 shows the boot CPU survives arm_init, the vm/pmap bootstrap, bsd_init, IOKit and kext loading until AMFI panics, so the earlier claim that it halts inside a stage-16 startup entry is withdrawn; ArmCpu, GIC and timer checkpoints are still not separately recorded because no kernel trace names them yet.", "Phase 2.5 explains why no probe ever printed kernel text: pexpert/arm/pe_kprintf.c gates the whole kprintf body on disable_serial_output and disable_kprintf_output (both default true), and vcputc_options gates painting on gc_initialized and gc_enabled (gc_enable runs only from initialize_screen with kPEAcquireScreen). PE_init_iokit calls PE_init_printf(TRUE) -> vcattach just before the stage-16 call, so forcing PE_create_console into kPETextMode and mapping the GOP framebuffer brings the console up without rebuilding XNU.", "v50 device evidence shows AMFI passes its security-mode-change gate but then panics \"AMFI: No PMGR?\" at ConfigurationSettings.cpp:235, because the developer-mode latch needs an ApplePMGRNub service that elden does not publish. That latch is AMFI policy rather than a hardware description gap, so phase 2.5 skips it with a probe poke and leaves a real power-management driver to phase 3."]
completion = ["The boot CPU reaches the ArmCpu checkpoint.", "GIC distributor and its own redistributor frame map successfully.", "Timer handling works before secondary cores or IPI transport are qualified."]
limits = ["Physical macOS Recovery verifies eight-core startup and timer and IPI delivery. Installed-system workload and suspend/resume remain unqualified."]
next_action = ["Exercise all eight cores under an installed-system workload and after suspend and resume."]
evidence = [
  { kind = "source", reference = "scripts/build-elden-macos26-bootstrap.py", result = "The Adreno probe is staged at PE_lockdown_iokit and uses separate opt-in boot arguments alongside the existing eight-core Recovery profile." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "build and verify the Elden Adreno 830 GMU probe", revision = "a6190077af83a6e02645a6b02a70f86c43696e3e", result = "The Adreno 830 GMU probe uses the single-core Recovery trace entry with the GPU firmware check enabled." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "build the Recovery Framebuffer Test with the Elden bootstrap wrapper", revision = "1241b6e42385bf4ad7afc9c48f3f39df0a5ab322", result = "The framebuffer test requests one CPU, retains the PID 1 trace, and preserves the kernel affinity overlays." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "build the PID 1 Trace image with the Elden bootstrap wrapper", revision = "0a0254a5efb72452bdb4622b567b5727bb2a69fb", result = "The separate PID 1 trace entry requests one CPU and retains the Aff2 fixes in the kernel." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "fastboot boot elden-recovery-isc-smp8-ram.img and capture recovery-usb-smp8", revision = "a7642afd892387c0d34f01197c7f096b5d23add5", result = "All eight XNU cores online. Every secondary reached step 7 with matching affinity and PSCI result 0. Each core handled timer interrupts and IPIs. The sample recorded 3205 sent and 3205 received while Recovery ran." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Select Eight-core Test on elden-macos26-4k-recovery-smp-aff2-ram.img", revision = "1540fdbd208c22f6bc7d6d3929316889640d0954", result = "Logical CPU 7 received two timer interrupts and one IPI. The photo does not capture the aggregate or the other secondary rows. After 218 seconds at launchd exec it shows one exec, zero exits, and no starts for the watched Recovery services." },
  { kind = "device", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "Select CPU Aff2 Test on elden-macos26-4k-recovery-smp-aff2-ram.img", revision = "1540fdbd208c22f6bc7d6d3929316889640d0954", result = "The photos show one running secondary, CPU 1 step 7, fail=0, PSCI result 0, and rising timer and IPI counters. Observed MPIDR 0x80010000 matches requested affinity 0x10000. The paired BaseSystem mounted and XNU recorded one launchd exec and zero exits with no later service at the 31-second sample." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "build-elden-macos26-bootstrap.py --output-name for the Aff2 candidate and llvm-objdump reset audit", revision = "ed8f382d36ea0d3ebaa3a1582aa8e03410c9645d", result = "The rebuilt reset vector preserves 24-bit MPIDR affinity and ArmCpu checks the hardware affinity. All 64 expected/observed Elden affinity pairs matched or rejected correctly. Secondary execution remains pending." },
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "decode Recovery ADT and verify elden-macos26-4k-recovery-smp2-ram.img", revision = "9053888e29bac20c0160efcaa7b2d75a6d969778", result = "2026-11-11: the two-core image selects MPIDRs 0x0 and 0x100 under the current reset mask. The kernel includes SMP stage, timer and IPI counters. The embedded image and MacBook copy were verified. Secondary CPU execution remains pending." },
  { kind = "source", reference = "soc/sm8750/dts/sm8750.dtsi", result = "SM8750 CPU, PSCI, GICv3 and timer resources." },
  { kind = "source", reference = "docs/PHASE2-HANDOFF.md", result = "Board CPU/GIC/timebase inventory and planned diagnostic sequence." },
  { kind = "host", reference = "docs/PHASE2.1-STATUS.md", command = ".venv/bin/python scripts/phase2_1_audit.py --linux-dir .cache/elden-linux", revision = "16e592abee8a550dec8154ed1f38b5ebc4f16213", result = "2026-10-25: independently decoded ADT contains the eight expected MPIDRs, cpu0 running and seven CPUs waiting, 19.2 MHz timebase, SMC PSCI, and GIC distributor/redistributor bases with 0x40000 stride. No device CPU checkpoint is claimed." },
  { kind = "host", reference = "docs/PHASE2.2-STATUS.md", command = "xcrun nm -g .cache/phase2-plan/UniXNU/out/elden/ipados-17.7.11-21H461/elden/kernel/kernel.macho", revision = "c91a2191fdf591a401a03027ed8b7fbfdbcad3a7", result = "2026-10-25: the prelinked kernel exports ArmCpu probe/start, GIC distributor and timer-related symbols and ArmDTPlatform configure/createDeviceNubs symbols. Symbol presence is source evidence, not a device checkpoint." },
]

[[area]]
id = "memory"
status = "implemented"
components = ["ArmDTPlatform"]
paths = ["dts/**", "soc/sm8750/dts/**", "scripts/phase2_1_audit.py", "patches/macos-recovery/elden-macos26-47bit-user-va.patch"]
inputs = ["The owner-captured live elden FDT, including the 12 GiB RAM map, initrd and reserved-memory nodes.", "The pinned Linux 16 GiB variant and the elden UEFI static memory map.", "A conservative 256 MiB XNU handoff window in UEFI DXE conventional memory."]
configuration = ["dts/elden.dts declares one 256 MiB XNU handoff node at 0xC2400000.", "payload.dram_size and payload.adt.owned_memory_size both request 0x10000000.", "dts/elden-firmware-memory.dts records the sanitised live 12 GiB RAM map, reserved-memory ranges and expected GOP framebuffer.", "The current format 2 generator creates a 256-byte seed, CHRP NVRAM proxy and optional-input memory-map placeholders. The audit also accepts the older 64-byte seed."]
procedure = ["Compile the hardware and firmware memory descriptions.", "Generate an ADT with the shared generator and decode it independently.", "Cross-check the XNU window against firmware RAM, reserved-memory and the pinned UEFI memory map."]
findings = ["2026-11-07: device read-check succeeds with a 6GiB high-address window. EFI reports a 13GiB free run at0x8c0000000. Installed loader accepts at most8GiB; current bootstrap-table reserve is sized for6GiB. Fresh512MiB test Data expands exactly under the actual C decoder.", "2026-11-06 prerequisites: offline FDT/EFI intersection planning and readonly EFI extent reporting are prepared. A historical FDT suggests a high-address4GiB candidate but dynamic reservations and a same-boot EFI map remain unqualified; the256MiB XNU probe configuration was not enlarged.", "The previous [0x80000000, 0x100000000) candidate overlapped 44 recorded no-map reservations and was removed.", "The live FDT is 885,861 bytes with SHA-256 8a653a3e790f29bf2b0f3545135f06fe771360f31da3d37c04f648c26b95e26e and describes the current 12 GiB RAM map.", "The former A8000000+10000000 UEFI Kernel carveout overlaps the live initrd B74AC000-B7FFEE30 and is unsuitable for RAM-boot phase 2.", "C2400000+10000000 is covered by live RAM, avoids all live reservations and the initrd, and lies in UEFI DXE conventional memory.", "The flashed vendor FDT uses generic qcom,sun-qrd compatible strings but retains the elden 3K panel marker, 1904x3040 display and UFS path.", "The ADT has no optional RAMDisk, TrustCache or GPU addon placeholders because phase 2.1 has no matching inputs.", "The unique chip ID remains a local input and is not stored in the repository."]
completion = ["The ADT contains exactly one continuous memory range.", "The range is covered by live firmware RAM and avoids recorded reservations, initrd, GOP and UEFI FD.", "DarwinBoot and the UEFI exit map confirm that same range is conventional memory before XNU entry."]
limits = ["The raw live FDT remains local-only because it can contain device identifiers.", "Actual DarwinBoot ADT, boot_args and allocated-window addresses remain runtime evidence.", "The live vendor tree and pinned 16 GiB source differ in RAM size and generic compatible strings; both are tracked separately.", "SMMU and cache policy are not complete."]
next_action = ["Keep6GiB for the next hardware test; separately qualify any larger window and do not advertise a flat16GiB."]
evidence = [
  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "scripts/phase2_1_audit.py --unixnu-dir ../UniXNU and observe_macos26_kernel.py arm_init with a 256 MiB QEMU window", revision = "abdae5c70bc1d7eb8eea28a045ae3544881274e2", result = "2026-11-10: Elden ADT audit accepts the current nonzero 256-byte seed and the prior 64-byte format. The exact macOS UFS candidate reached arm_init in QEMU with 256 MiB owned. Five matching windows are available in the static Elden descriptions. Runtime tablet memory allocation remains unverified." },
  { kind = "host", reference = "docs/STARTUP-USB-CANDIDATE-20261107.md", command = "python edl_work/audit_startup_candidates.py (Y700 work repository)", revision = "33b55083a0b61630f71478230f648606163115eb", result = "Base revision plus local working-tree patches. 2026-11-07: device read-check succeeds with a 6GiB high-address window. EFI reports a 13GiB free run at0x8c0000000. Installed loader accepts at most8GiB; current bootstrap-table reserve is sized for6GiB. Fresh512MiB test Data expands exactly under the actual C decoder." },
  { kind = "host", reference = "docs/PREREQUISITES-20261106.md", command = ".venv/bin/python scripts/build-payload-loader.py", revision = "33b55083a0b61630f71478230f648606163115eb", result = "2026-11-06 prerequisites: offline FDT/EFI intersection planning and readonly EFI extent reporting are prepared. A historical FDT suggests a high-address4GiB candidate but dynamic reservations and a same-boot EFI map remain unqualified; the256MiB XNU probe configuration was not enlarged. Source revision plus local working-tree changes." },
  { kind = "source", reference = "dts/elden.dts", result = "One 256 MiB XNU range in UEFI DXE conventional memory and board compatible values." },
  { kind = "source", reference = "dts/elden-firmware-memory.dts", result = "Sanitised live 12 GiB RAM, reserved-memory and expected GOP framebuffer description." },
  { kind = "source", reference = "docs/porting-analysis.md", result = "Documented DRAM base, fragmentation risk and memory handoff constraints." },

  { kind = "host", reference = "docs/MACOS-RECOVERY-BRINGUP.md", command = "build-elden-macos26-bootstrap.py --trace-recovery-copy, then prelink and verify the r54 RAM image", revision = "6a88fabff9a9d6da5d71d77d98a434a808289064", result = "The linked unix_syscall frame is 128 bytes, matching r47. The earlier r50 diagnostic used 208 bytes. The r54 30-module Recovery prelink, DarwinBoot preflight, payload and MacBook checks passed." },

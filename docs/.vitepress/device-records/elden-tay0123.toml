findings = ["2026-11-07: LUN0/ipados root header read is device-verified. New AVB-kernel-pinned complete-image and per-block verification, live readonly media ancestry bridge, SystemOS union and RAM Data startup candidate compile/link and host checks pass; new mount/startup remains untested on hardware.", "2026-11-06 prerequisites: official21H461 OS/SystemOS and original trust inputs are verified. Native readonly APFS inspection supplies actual filesystem UUIDs. A9381609472-byte raw root layout passes file readback and the actual RootLayout parser with file callbacks; Data, runtime policies and real root-target kernel remain pending. No hardware disk access.", "2026-11-06: standalone GPL UEFI UFS backend and current/previous stage2 applications compile; original/session suites and independent SHA/header/torn-update tests pass. Actual AAVMF probe platform rejection and RAM FAT child failure/cleanup/retry pass; no tablet UFS operation is claimed. See docs/UFS-STAGE2-20261106.md.", "The full root-check kernel 07d4df1d… compiled/prelinked successfully; the diagnostic derivative is 3fd40e9f….", "190 original/concrete slots, 23 concrete overrides, 11 original imports and actual C2/D2 were qualified without replacing the storage class with stubs.", "The final derivative executes to the real registered original storage class in QEMU using the actual menu arguments; class sizes are 0xd8/0x90/0x88.", "The compressed EFI loader decoded all complete assets in AAVMF, and a neutral-debug DarwinBoot test build passed EBS to the same XNU console and UFS registration gate. This is not a test of the entire vendor firmware.", "The exact accepted DarwinBoot binary needs its platform graphics debug sink in AAVMF; its observed fault is before EBS, unlike a proved hardware handoff failure.", "2026-11-06 hardware: corrected arm-io/AAPL,phandle ADT and fixed-address SMMU loads reach read-only LUN4 GPT/block checks. LUN0/ipados source configuration is added; block publication and root mounting remain pending."]
completion = ["Controller and PHY initialize.", "Read-only capacity, GPT and known-block checks match the device.", "The configured OS volume mounts and launchd starts.", "A verified APFS install on the former Android data extent boots with writes bounded to the selected partition."]
limits = ["The macOS BaseSystem and three ISC volumes mount on the physical tablet. The XNU root path uses read-only UFS media, with a bounded volatile overlay for ISC. The opt-in r66 probe verified a single native 4 KiB write and restoration in the Recovery partition.", "The existing 2 GiB ARMADA_BACKUP is an empty iPadOS test window. LUN 0 iPadOS root publication remains unqualified.", "The install device's multi-block write and cache flush path has host evidence. Device publication, persistent APFS writes, installer operation, and physical power-loss recovery remain unqualified."]
next_action = ["Populate the verified scratch APFS group with the matching Data template and cryptexes and exercise installed boot in QEMU.", "RAM-boot Inspect macOS Install Target and verify the read-only block device reports the exact LUN 0 userdata extent.", "Qualify extent-bounded persistent APFS writes and flush readback before installing on the former Android data extent."]

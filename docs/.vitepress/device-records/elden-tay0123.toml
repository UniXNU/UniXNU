  { kind = "host", reference = "docs/UFS-STAGE2-20261106.md", command = ".venv/bin/python scripts/build-ufs-stage2.py", revision = "33b55083a0b61630f71478230f648606163115eb", result = "Local working-tree GPL UFS adapter built as separate EFI applications; five core/session host suites, 114 SHA vectors, 512 C/Python header checks, six interrupted-update points, and real AAVMF RAM-volume retry/cleanup passed. Stage2 packaging, 15 full C selection fault cases, actual external menu/reset and QEMU-ADT menu-to-XNU registration return=1 now pass. Tablet UFS remains unverified; ADB has root/su model tests only. No device access or accepted FD replacement." },
  { kind = "host", reference = "docs/NIGHT-BRINGUP-20261106.md", command = ".venv/bin/python third_party/UniXNU/unixnu build kernel -D . -j4", revision = "33b55083a0b61630f71478230f648606163115eb", result = "2026-11-06 host: source GOP console kernel/archives/prelink completed; separate read-only UFS root-check archive compiled with inherited identity DMA and LUN selection. TWRP/Linux EFI prototype and userdata/ESP design remain hardware-unverified. Details and bounded evidence in docs/NIGHT-BRINGUP-20261106.md; no stock index change or device write. Revision plus local working-tree patches." },

  { kind = "host", reference = "docs/OFFLINE-PAYLOAD-20261105.md", command = ".venv/bin/python scripts/build_offline_ufs_packet.py --fd out/phase3/old-fd-verified.bin --source-payload out/phase3/payload-fat16.img --kernel third_party/UniXNU/out/elden/ipados-17.7.11-21H461/elden-ufs_probe/kernel/kernel.macho", revision = "33b55083a0b61630f71478230f648606163115eb", result = "2026-11-05 offline: existing Mac probe kernel (51,986,432 bytes) was matched against the payload and checked for NativeUfs symbols and PROBE_ONLY/READ_ONLY/SM8750 compile flags. No new kernel build or device storage evidence. Root publication is absent; probe 7/8 are SMMU/CB diagnostics and probe 3 is rejected. See docs/OFFLINE-PAYLOAD-20261105.md. Source revision plus uncommitted local packaging changes." },

  { kind = "source", reference = "docs/porting-analysis.md", result = "Storage addresses, missing root inputs and phase 1 bypass decision; implementation remains a later phase." },
  { kind = "host", reference = "docs/STORAGE-ABI-20261106.md", command = "python out/elden-storage-abi/scripts/audit-elden-storage.py --candidate out/bringup-20261105/kernel-gop.macho --plan elden-ufs_probe/kernel/kernel.json --snapshot storage-snapshot.json", revision = "33b55083a0b61630f71478230f648606163115eb", result = "Owned candidate: 190 original storage slots, actual C2/D2, live class sizes 0x90/0x88 and native 4K qualified. SCTLR alias was independently checked against the unchanged kernel's real MSR input. Raw-entry VM evidence only; no UEFI/EBS/UFS hardware evidence." },
  { kind = "source", reference = "scripts/build-elden-ufs-bindings.py", result = "Concrete NativeUfsBlock slot/signature verification and genuine original-class bindings require a qualified audit, candidate and prelink plan. New lifecycle patch refuses root work before actual class registration. Complete root-check link and final candidate audit remain separate checks." },
  { kind = "host", reference = "docs/STORAGE-ABI-20261106.md", command = "python out/build-rootcheck-kernel.py", revision = "33b55083a0b61630f71478230f648606163115eb", result = "Full root-check kernel compiled/prelinked (07d4df1d…) and its signed diagnostic derivative (3fd40e9f…) passed their own 190-slot static/live ABI audits. The actual menu arguments reach the genuine registration gate with result 1 before UFS MMIO. Hardware transport and root remain unverified." },
  { kind = "source", reference = "docs/COMPRESSED-RESCUE-20261106.md", result = "Complete XNU/Linux/vendor/TWRP compressed assets round-trip in 48.3 MiB. Standalone EFI decompression and recovery application added; compilation, firmware execution and hardware acceptance are separate gates. No firmware rebuild, device operation or KShimC removal." },
  { kind = "source", reference = "docs/ENTRY-FDT-HANDOFF-20261106.md", result = "Optional 128-byte BootShim writes the live ABL FDT pointer only into a reserved RAM FAT slot; the default build remains identical. Recovery validates/copies the current FDT and restores table ownership after failure. Hardware recovery remains unverified." },
  { kind = "source", reference = "docs/PHASE3-STORAGE.md", result = "Full SM8750 UFS inventory with Linux line references, driver reality, the arm-io window change and the four-stage probe plan." },

schema_version = 1

[device]
name = "munch"
soc = "SM8250"
os_profile = "ipados-17.7.11-21H461"
summary = "Redmi K40S (munch) bring-up derived from UniXNU-alioth: SM8250-AC, GOP framebuffer, FocalTech SE4 touch, UFS root. Hardware results are inherited from alioth and not yet measured on a K40S."


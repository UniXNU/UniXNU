[[area]]
id = "packaging"
status = "planned"
components = ["DarwinBoot", "XnuPrelink"]
paths = ["scripts/package.sh", "scripts/*payload*", "scripts/*image*", "scripts/*flash*", "patches/**", "package/**"]
inputs = [
  "Boot image format measured on the stock OnePlus boot.img and on LineageOS 22.2: header_version 0, pagesize 4096, base 0x0, kernel_offset 0x8000, ramdisk_offset 0x1000000, tags_offset 0x100 [PORT].",
  "Superseded: boot_a on this unit parses as header_version = 1 (kernel 14770103 bytes at 0x8000, ramdisk 22254283 bytes at 0x01000000) and Android boots from that slot, so the handset loads v1. The format2 boot image still defaults to v0 because v0 is the conservative shape, not because v1 is rejected [LOCAL].",
  "initrd window reserved by the bootloader is 0x8454D000-0x856FEF79, about 18 MiB, reported by EnchiladaBootMemoryDxe [PORT].",
  "Four measured payload sizes: none gives a menu with a red no-boot-entry message; 16 MiB reaches the menu and exposes USB 05C6:F000; 32 MiB resets into EDL 9008 after 68 s; 192 MiB shows no USB for 118 s and returns to fastboot [PORT].",
  "The 120.0 MiB figure belongs to the community VerifiedRoot build, not to this port: the kernel this device runs is 17,326,832 bytes (out/xnu_uart2/x/kernel.development.sweet) and the ADT is 12,940 bytes, so the cannot-fit conclusion was drawn from a kernel size that is not ours [LOCAL].",
  "Route 2 therefore applies: flash the payload into system_b (2,998,927,360 B) and build a boot image with no ramdisk [PORT].",
  "kernel_args are 970 bytes against a 1000-byte limit and a 1024-byte DarwinBoot buffer, leaving 30 bytes [PORT].",
  "ABL refuses fastboot boot after the active slot fails to boot (Load Error) and each reset consumes a retry, so set_active must precede every attempt [PORT].",
  "The bundled fastboot in C:\\platform-tools is a 32-bit binary and raises std::bad_alloc on an 8.74 GiB raw image; sparse chunks are required [PORT].",
]
configuration = ["Record the boot image fields and the payload volume once Route 2 is confirmed on this unit."]
procedure = ["Build the payload, write it to system_b, build a boot image with ramdisk none, then fastboot set_active before each boot attempt."]
findings = ["The 18 MiB initrd window, not the ABL image size limit, is what forbids carrying the payload in the ramdisk.",
  "The live device tree writes linux,initrd-start 0x841c9000 and linux,initrd-end 0x856fe8cb, a 0x15358cb = 21.21 MiB window that is byte-identical to the ramdisk_size field of the boot_a header, so 21.21 MiB is what this boot actually loaded and not a ceiling. The community figure of about 18 MiB is neither: it starts 3.52 MiB higher and ends 0x6ae lower than this range, and no measurement on this unit supports it as an upper bound [LOCAL]",
  "boot_a parses as header_version = 1 (kernel 14770103 bytes at 0x8000, ramdisk 22254283 bytes at 0x01000000, tags at 0x100, page size 4096), which contradicts the community note that this handset refuses v1 boot images: the live slot is v1 and Android boots from it [LOCAL]",
  "Layer 3 of the porting guide is the boot manager, and until now it had never been built: .github/workflows/package.yml answered mode=package with the package stage is not implemented and exit 1, so UniXNU.efi, UniXNUDxe.efi and UniXNURamDiskDxe.efi did not exist anywhere. The mode now fetches the edk2 refer tree, initialises the three submodules MdePkg submodule check in package/build.sh demands (MdePkg/Library/BaseFdtLib/libfdt, MdePkg/Library/MipiSysTLib/mipisyst, BaseTools/Source/C/BrotliCompress/brotli), runs unixnu build package --target RELEASE, and fails the job unless all three .efi products are on disk [LOCAL]. This matters beyond bookkeeping: without the boot manager the firmware volume drops straight from UEFI into whatever the shim payload carries, which is the architecture this port has been using.",
  "The IOKit C++ ABI in xnu-8796 has no kernelContent member in struct IORPC, while the iig that ships with Xcode 16.4 and Xcode 26 generates code that reads it and designates it. iokitcpp is on unconditionally (config/MASTER:510), so the 8796 DriverKit sources cannot compile at all. Runs 42875463977 (macos-26, Xcode 26) and 42877902675 (macos-15, Xcode 16.4) failed identically, so the SDK is not the variable: macosx and iphoneos both carry that iig. patches/xnu/iokitcpp-kernel-content.patch adds the fifth field to both copies of the header under the same KERNEL guard xnu-10063 uses, so user space keeps the four-field layout. Replaying the 182-patch community series on xnu-8796.141.3 and applying this board patch last is clean; the struct grows only for KERNEL builds [HOST].",]
completion = ["Kernel and prelink succeed, payload contains all declared inputs, and the boot image matches the bootloader format and size limit."]
limits = ["No build host; bootloader lock state unknown, which may forbid fastboot entirely."]
next_action = ["Confirm system_b is free and its size matches 2,998,927,360 B before planning any write."]
evidence = []


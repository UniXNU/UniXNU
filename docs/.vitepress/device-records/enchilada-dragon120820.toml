schema_version = 1

[device]
name = "enchilada"
soc = "SDM845"
os_profile = "ios-16.7.16-20H392"
summary = "OnePlus 6 (A6003) / SDM845 / Cortex-A75+A55, arm64 only (no FEAT_PAuth). Skeleton record: every area is planned; inputs below are measured facts, not verified implementation."

# ---------------------------------------------------------------------------
# 本文件是 P2 阶段产出的**预填骨架**，不是完成品。
# - 所有 area 的 status 保持 "planned"（没有任何代码在本机实现过）。
# - inputs 字段填入的是本次审计已取得的实测/交叉验证事实，供 P3 直接引用。
# - evidence 全部为空：本机未做任何设备验证，不得伪造验证记录。
# - 事实来源标记：[LOCAL]=本机 adb 只读实测；[PORT]=社区 128GB 同 SKU 机实测；
#   [MU]=Mu-Silicium MemoryMapLib/ConfigurationMapLib 源码；[CFG]=本机内核配置。
# ---------------------------------------------------------------------------

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", ".github/**", ".gitignore", "README.md", "AGENTS.md", "local.toml.example"]
inputs = [
  "SoC: SDM845 (Qualcomm codename Napali) [MU]. No upstream UniXNU-sdm845-common exists; this SoC layer must be created [DOC].",
  "CPU: 4x Cortex-A75 (part 0x803, rev 12) + 4x Cortex-A55 (part 0x802, rev 13); MIDR_EL1(cpu0) = 0x00000000517f803c [LOCAL].",
  "CPU features: fp asimd evtstrm aes pmull sha1 sha2 crc32 atomics fphp asimdhp. No sha3/sha512/dcpop/sve, no FEAT_PAuth -> arm64 profile only [LOCAL].",
  "OS profile: ios-16.7.16-20H392 (supercedes the ipados-17.7.11-21H461 entry whose kernelcache_sha256 f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7 no longer applies: no kernelcache pin is recorded for 20H392 yet). The profile lives in the UniXNU fork dragon120820/UniXNU as profiles/os/ios-16.7.16-20H392; slide -0x1000000 is kept because the kernel link address does not change with the userspace build [LOCAL].",
  "SKU: 8 GB RAM / 128 GB storage -> dram_size 0x200000000; do NOT inherit the 6 GB 0x180000000 value from bringup [LOCAL][PORT].",
  "DTS: dts/enchilada.dts does not exist in any candidate repository; it must be authored. Required ADT roots: /cpus /arm-io /defaults /options [DOC].",
]
configuration = ["Pin the SDM845 SoC commit and record every board.toml override; no REQUIRED_ placeholder may remain before build."]
procedure = ["Fill board.toml [board] [components] [kernel] [kernel.prelink] [firmware] [bootimg] [payload] [payload.adt] from the inputs above, then run scripts/package.sh --check --os ios-16.7.16-20H392."]
findings = ["Upstream registers all three enchilada repositories as format 1 legacy, so a format 2 device repository must be created rather than migrated in place.",
  "Format 2 key names differ from the skeleton draft: [device_tree] takes source/include_dirs (not path), [kernel] patch_series is a list of series files (a bare string is iterated character by character by scripts/unixnu/patches.py:12), and [package] unixnu plus [package.defconfig] are required by templates/package.sh and scripts/unixnu/config.py:154-159 [DOC]",
  "A board.toml that restates [kernel.prelink] roots or kernel replaces the 31 roots and the kernel path the OS profile supplies, because profiles.load() merges dicts per key; the skeleton therefore sets only slide and early_security_init [DOC]",
  "board.toml must carry schema_version = 2: scripts/unixnu/config.py:127 defaults to 1 and then loads a legacy board, which silently skips the whole device-tree and payload path [DOC]",
  "The package workflow under .github/ runs the device repository on a GitHub macOS runner because no local host has Xcode or compression_tool: the check mode passed in 1m42s and the check-deps mode passed after downloading the 4.7 GiB IPSW and decompressing its kernelcache [HOST]",
  "The kernel mode needs the workflow token, not just a macOS host: scripts/prepare-xnu-source.py restores 26 DriverKit headers through the anonymous GitHub contents API, which returned HTTP 403 rate limit exceeded on the fourth run, so the preflight step now exports GITHUB_TOKEN [HOST]",
  "profiles.load() merges dicts per key but replaces ordinary arrays, so board.toml must repeat the complete arch, SoC, OS and device lists: a two-entry patch_series dropped all 56 arm64 patches and 3 IPSW patches, and a one-entry config_fragments dropped arch:configs/common.config. The first kernel run failed on make_symbol_aliasing.sh looking for availability.pl inside the Xcode SDK, which patches/xnu/local-availability.patch exists to fix; the check now reports 60 patches instead of 0 [DOC]",
  "kernel.archives has the same replace-not-append rule and archive_plan() also rejects a selected component that no component: entry names: selecting RamBlock without adding it to archives failed the second kernel run with [kernel] archives needs component entries for: RamBlock, so board.toml now repeats the eight arch entries and appends component:RamBlock [SRC]",
  "The firmware stage does not need the 41 proprietary inputs published anywhere: Mu-Silicium and its Device-Binaries submodule are public repositories, and Device-Binaries HEAD equals the pinned 9f4dbfd7, so a CI job can clone exactly what upstream already serves. The workflow therefore gained a firmware mode that checks out Project-Silicium/Mu-Silicium at 8471e47f, applies the UniXNU payload patch in the checkout only, and runs unixnu build firmware [HOST]",
  "The firmware FD is not uploaded (the workflow publishes logs only), so the firmware step prints sha256sum of SILICIUM_UEFI.fd; without that the build has no recordable identity [HOST]",
  "mode=bootimg packs the built FD with BootShim, the device DTB and mkbootimg into boot.img, uploads it as an artifact (with boot.json recording image_sha256, fd_sha256, dtb_sha256), and never touches a device; the device-side fastboot boot remains a separately authorised step [HOST]; the B7 pin repair now runs in every build mode (bootimg needs it too) [HOST]",
  "SUPERSEDED (2026-11-07 14:16): an earlier patch dropped the ARM64 kernel header from the boot shim; that direction was wrong. The ABL inflates the gzip kernel package and requires an ARM64 Image header, so a headerless shim dead-loops in fastboot. Now fixed by mu-silicium-bootshim-image-header.patch: BootShim.S Image Size = FD_SIZE + (_Payload - _Head), keeping requires_kernel_header = true; header_version aligned to 1; community one-byte placeholder ramdisk added. Root cause and sources: evidence/device/20261107_bootimg/root_cause_pivot.md [HOST]",
  "mode=bootimg first success (run 42342820777, commit 3bc0509): boot.img 1196032 bytes sha256 6b68183c..., fd_sha256 53893e2f..., dtb_sha256 0371d596... (byte-identical to the local dtc build), ramdisk_bytes 0, header_version 0, hardware_tested false [HOST]",
  "A git -C DIR apply patch resolves the patch name inside DIR, so the firmware step must hand it an absolute path: the first firmware run died with cant open patch device/firmware/mu-silicium-unixnu-integration.patch after sha256sum had already hashed that same relative path from the workspace root [HOST]",
  "The firmware FDT is not the format 2 device tree: a control experiment booted the community edk2-msm 2301.1 boot-enchilada.img to a UEFI Shell on the same ABL, which proves fastboot boot, the gzip kernel shape, the trailing DTB and the v1 header all work, so the remaining difference is our FD. Mu ships Resources/DTBs/enchilada.dtb at 555398 bytes (the same size the community image appends), while dts/enchilada.dtb is a 2697-byte working draft that starves SEC/PlatformPei of the DRAM map and reserved-memory nodes; the bootimg step now passes Mu's tree as the firmware FDT and keeps ours for the UniXNU ADT [HOST]",
  "UNIXNU_PAYLOAD = \"1\" reaches the DSC through [firmware.defines], because firmware.py:38-39 forwards that table as build -D KEY=VALUE and a command-line -D overrides the DSC default; the workflow asserts board.toml carries the key so a firmware built without the payload cannot pass silently [SRC]",
  "The firmware and bootimg steps now pass --target RELEASE to unixnu build firmware: unixnu --target defaults to DEBUG (cli.py:46), and the DEBUG DXE ran out of page pool on the device after APRIORI index 31, so 14 drivers failed LoadImage with Out of Resources and the six architectural protocols never appeared. Both steps keep RELEASE so a boot.img is always packed from a firmware that can actually dispatch [HOST]",
  "mode=package now builds the boot manager instead of refusing the stage: the arm fetches the edk2 refer tree, initialises the three submodules package/build.sh demands, runs unixnu build package --target RELEASE and fails the job unless UniXNU.efi, UniXNUDxe.efi and UniXNURamDiskDxe.efi all exist [LOCAL]. This is layer 3 of the porting guide; without it the firmware volume drops from UEFI straight into whatever the shim payload carries, which is the architecture this port had been using.",
  "run 42855567340 (head 207ce94, mode=package, macos-26, 3m34s) built the boot manager for the first time: UniXNU.efi 86,528 B sha256 7e4c808e45b9d3095fefac3ff4a74ed916b45f77386b808a1c8e48632b, UniXNUDxe.efi 9,728 B sha256 f19bc7454db8389290a6774e10f61ef3de0b334ee22013f1628511e, UniXNURamDiskDxe.efi 7,168 B sha256 13ddc99455b1b154d06360ed313a5ddf619270d1e2b437e8, under out/enchilada/ipados-17.7.11-21H461/enchilada/package/Build/Out/AARCH64-RELEASE [HOST]. Before this run those three files existed nowhere, so porting guide layer 3 had no product at all.",
  "mode=payload now produces the official ADT and payload volume, which is what DarwinBoot needs and the community ADT builder never wrote: the arm runs unixnu build kernel then unixnu build payload with --unique-chip-id (board.toml sets [payload.adt] unique_chip_id = <required>, and payload.py:157 refuses to run without a seed) and uploads payload.img plus payload.json. Because board.toml is schema_version = 2, payload.py:191-196 routes ADT generation to the official devicetree.generate(), which is the only writer of the /chosen/memory-map RAMDisk/PackedRAMDisk/TrustCache placeholders and of /chosen/darwinboot-memory-size; DarwinBoot.c:658-680 returns EFI_COMPROMISED_DATA when an input it was handed has no placeholder, so layer 4 cannot start on the mkadt.py ADT this port has used so far. This mode is also the first real test of the 46-line board DTS: generate() demands one contiguous DRAM range, /cpus with timebase-frequency and a PSCI method, all of which currently live in UniXNU-sdm845-common/dts/sdm845.dtsi behind the board file's /include/ [LOCAL].",
  "The stock Silicium SEC discards the x0 the previous stage enters with and never builds gSiliciumEntryArgHobGuid, so UniXNURamDiskDxe (UniXNURamDiskDxe.c:215) finds no HOB, prints \"UNIXNURAMDISK: no entry argument HOB\" and returns without publishing the payload volume: the menu keeps showing the built-in configuration and reports no boot entry found even when a payload ramdisk is present. A probe boot with a 2 MiB FAT12 volume carrying EFI/UniXNU/unixnu.toml with a RAMDISK PROBE entry still drew the built-in menu, which rules out ramdisk size and load address and points at the missing handoff. The same fault is recorded for marble in docs/devices/marble-milacy.md; the fix follows hanzi123-bilp/uefi-fuxi (ModuleEntryPoint.S stores x0, Sec.c reserves the tree with BuildMemoryAllocationHob because DXE otherwise maps an image over it, then publishes the GUID HOB after PlatformPeim) [HOST]",
  "The OS layer is no longer iPadOS: [board] os_profile now names ios-16.7.16-20H392, a profile this port adds to the UniXNU fork because upstream ships three iPadOS profiles and one macOS profile and nothing for an iPhone. profiles.py:19-30 resolves --os against the directory names under profiles/os/ and hard-codes no prefix, so a new directory is the supported extension; the workflow gained unixnu_repository and unixnu_ref inputs (default dragon120820/UniXNU) because the Check out UniXNU step had upstream pinned. The profile pins xnu-8796.101.5 with commit aca3beaa3dfbd42498b42c5e5ce20a938e6554e5, which is the Darwin 22.6.0 kernel the handset actually runs, rather than the xnu-10063.141.1 the iPadOS profile names. It carries no [kernel.prelink] section on purpose: static prelink hashes the original kernelcache of this exact build and its prelinked-kext roots are unknown for 20H392, so writing a kernelcache_sha256 or a roots list here would fail with a qualification mismatch rather than do anything useful [LOCAL].",
  "The kernel stage moved to macos-15, and that alone did NOT fix the iig failure. macos-26 carries Xcode 26 and macos-15 carries Xcode 16.4 (runs 42875463977 and 42877902675), and both still failed DriverKit/OSObject.iig.cpp with the compiler error no member named kernelContent in IORPC, so the Xcode version is not the variable. The real one is SDKROOT: makedefs/MakeInc.cmd line 199 derives the tool as IIG := $(shell $(XCRUN) -sdk $(SDKROOT) -find iig), and both Xcode releases ship an iPhoneOS SDK whose iig generates DriverKit code assigning IORPC.kernelContent, a field xnu-8796 does not declare. scripts/build-xnu-4k-baseline.sh line 843 already reads the value from XNU_SDKROOT and defaults it to iphoneos, so configs/enchilada_defconfig now pins CONFIG_XNU_SDKROOT=macosx: the macOS SDK keeps the ABI this xnu was written against, and it is what the installhdrs step above and blacktop/darwin-xnu-build both use for their own iOS kernels. Keeping macos-15 for the kernel and payload is still right on its own merits, since it is the image the community CI uses.",
  "The kernel patch series no longer starts with the arch profile. profiles/arch/arm64/patches/xnu/series is written against xnu-10063: 12 of its own 56 patches reject on xnu-8796 (SPTM under osfmk/arm64/sptm/, the IOExclaveProxy personality, SystemOS mounting and the SystemOS cryptex view in kern_exec.c, the pgz alignment validation, the freezer condition syntax fix), and stacking the series on the community sweet-* block rejects 151 of those 184 patches because the two are two implementations of the same layer. Both orders were measured on clean trees and recorded in evidence/host/20261111_arch_patch_8796/patch_base_matrix.txt, together with the finding that the community series applies 182/184 on xnu-8796.141.3 (1b191cb58250d0705d8a51287127505aa4bc0789) and that the three official arch patches this tree still needs (local-availability, cxx-flag-dependencies, kernel-sdk-root) apply cleanly on top of it. The OS profile therefore owns the whole series, and this board keeps only the SoC, OS and device lists. CONFIG_XNU_MACHINE_CONFIG=SWEET is new in enchilada_defconfig because that block brings config/MASTER.arm64.sweet instead of the KDK closed per-SoC objects the BCM2837 machine config links against; the value reaches scripts/build-xnu-4k-baseline.sh as XNU_MACHINE_CONFIG.",
  "The XNU stage runs on macos-26 like every other mode again. It had been pinned to macos-15 because Xcode 26 leaves IORPC.kernelContent in the DriverKit implementation it generates, a field xnu-8796 lacks; patches/xnu/iokitcpp-kernel-content.patch now carries that field behind the #ifdef KERNEL guard 10063 uses, so the original reason is gone. Staying on Xcode 16.4 is not possible for the rest of the pipeline: its clang rejects flags the archive recipes pass unconditionally, e.g. -Wno-unnecessary-virtual-specifier, and run 42946585505 stopped in component-ArmDTPlatform on exactly that. Those recipes read the compile record that patches/xnu/0186-sweet-compile-records.patch makes 8796 emit with -MJ, which is how xnu-10063 writes it; without the flag a 8796 tree builds every object and writes no record at all, so build-arm-driver.py, build-libpthread-kernel.py and build-mockfs-fixture.py all died with FileNotFoundError on IOPlatformExpert.cpo.json (runs 42909069912 and 42910519244). [HOST]",
  "[LOCAL] [kernel.prelink] now names the built kernel so --skip-prelink can stage it. cli.py:173 calls kernel.prelink(ctx) after every `build kernel`, and prelink() reads spec['kernel'] (kernel.py:271) before it looks at --skip-prelink, so run 42954929695 died with KeyError 'kernel' the moment the kernel finished building. The iOS profile deliberately carries no [kernel.prelink] because static prelink hashes the ORIGINAL Apple kernelcache; this port keeps the community Mach-O kernel and has no 20H392 kernelcache, so the workflow passes --skip-prelink in both the kernel and payload modes and stage_native() copies the native executable to kernel.macho after checking MH_EXECUTE/ARM64 and recording its digest. The key added here is only the path to stage from.",
  "[LOCAL] [payload] kernel_args now carries the bring-up command line. Run 42957359561 built the payload volume successfully but wrote an empty args field into unixnu.toml, because payload.py:117 reads board.toml [payload] kernel_args and the key did not exist; an XNU started that way has no console (debug/serial), no 4 MiB log ring (sweetlog), no root volume (rd=ufsroot0) and no framebuffer offset (sweetfb_offy), i.e. it cannot be observed at all. The 26 entries are the values this handset was brought up with on the community kernel, and check_args() validates each against a name or name=value pattern with a 1000-byte cap (this line is 372). The ADT keeps an empty /chosen/memory-map and that is fine: DarwinBoot.c:663-678 only demands a RAMDisk placeholder when the boot request carries a ramdisk, and a TrustCache placeholder when a kernel.macho.trustcache file exists - this port ships neither.",
  "[LOCAL] mode=chain builds layers 1-4 of the porting guide in one job, because each link is only meaningful with the next present: kernel --skip-prelink stages kernel.macho, unixnu build payload packs kernel.macho + kernel.macho.adt + unixnu.toml into the FAT volume, unixnu build firmware compiles the FD with UNIXNU_PAYLOAD=1 so UniXNU.efi, UniXNUDxe.efi, UniXNURamDiskDxe.efi and DarwinBoot are inside it, and unixnu bootimg wraps shim+FD into a boot image whose ramdisk IS that payload volume - the ramdisk the FDT describes and UniXNURamDiskDxe publishes for UniXNU to read unixnu.toml from. [payload] size_mib drops 144 to 20 for the same reason: 144 MiB was sized for the community Route 2 payload whose linked kernel was about 120 MiB and shipped in system_b, while this payload holds a 16,056,816-byte kernel.macho plus a 14,432-byte ADT and has to fit the 21.21 MiB initrd window the live FDT reports. No partition is written: everything this mode produces is loaded by fastboot boot only.",]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["Blocked on a Linux or macOS build host (Windows native builds are unsupported) and on git for pinning."]
next_action = ["Decide between the official format 2 route (build the SDM845 SoC layer) and the community format 1 baseline plus minimal completion."]
evidence = []

[[area]]
id = "firmware"
status = "device-verified"
components = []
paths = ["proprietary-files.txt", "scripts/check-*.py", "scripts/extract-*.py", "firmware/**"]
inputs = [
  "Candidate: Project-Silicium/Mu-Silicium commit 8471e47f5248ebbffc2e6196b683204163efe155; platform package Platforms/OnePlus/enchiladaPkg (10 files) [MU].",
  "DSC: PLATFORM_GUID F8A6C376-C5D3-4F61-B911-CE778BCB5DEB, USE_CUSTOM_DISPLAY_DRIVER=1, includes NapaliPkg/NapaliPkg.dsc.inc [MU].",
  "Memory: PcdSystemMemoryBase 0x80000000; PcdCPUCoresStackBase 0x9FF90000; primary stack 0x40000; FD 0x9FC00000 + 0x300000 [MU].",
  "Display PCD: 1080x2280x32; SMBIOS OnePlus/6/enchilada/A6003/17819 [MU].",
  "Enchilada builds ACPI, not DTB: enchilada.fdf includes INF RuleOverride = ACPITABLE enchilada/AcpiTables.inf, and the DtPlatformDxe plus FdtBlob lines are commented out [MU].",
  "Required Mu patches: Auth-Service.patch, Boot-Manager.patch, Timer.patch, Usb-Bus.patch. AsmMacroLib.patch must NOT be applied (it reverts an MdePkg fix) [PORT].",
  "RAW.inc references Binaries/enchilada/RawFiles/{SecParti.cfg,QcomChargerCfg.cfg,BATTERY.PROVISION}; the Binaries submodule is not present locally [MU].",
  "Mu ConfigurationMapLib.c sets ImageFVFlashed = 0x0 and its consumer is not in the source tree; neither Mu nor edk2 uses the ImageFv partition [MU].",
]
configuration = ["Record the firmware defines: DEVICE_MODEL=enchilada, ENABLE_SECUREBOOT=0, MEMORY_PROTECTION=TRUE, SHIP_MODE=FALSE."]
procedure = ["Build via DeviceBuild.py on a host with git (build_uefi.py runs submodule update plus four git apply steps)."]
findings = ["Neither UEFI candidate contains any UniXNU, DarwinBoot or initrd integration; that work is entirely ours to add.",
  "The integration gap is four INF plus one library mapping, not a rewrite: enchilada.dsc [Components] appends only enchilada/AcpiTables.inf while SiliciumPkg.dsc.inc:379 already supplies SEC, the DXE core and the runtime services, and same-named sections merge under EDK II semantics [MU]",
  "FdtLib and HobLib need no board-level mapping: enchilada.dsc:28 includes NapaliPkg.dsc.inc, which includes QcomPkg.dsc.inc, which includes SiliciumPkg.dsc.inc, where :322 maps FdtLib and :184 maps HobLib. Only UniXNULib is absent from the whole Mu-Silicium tree [MU]",
  "Include/DXE.inc:42-45 already lists DiskIoDxe, PartitionDxe, Fat and EnglishDxe unconditionally, so only the four UniXNU INF are missing from the FV, and APRIORI.inc needs no change because UniXNURamDiskDxe declares [Depex] TRUE [MU]",
  "PcdDxe self-deadlock: PcdDxe links DxePcdLib whose depex is gEfiPcdProtocolGuid; BaseTools merges library depex into module depex (FfsInfStatement.py:132-163, ModuleAutoGen.py:559-602), so the as-built PcdDxe depex is PUSH gEfiPcdProtocolGuid END and the driver never dispatches. 29 PCD-dependent drivers then starve (VariableRuntimeDxe, RealTimeClock, ResetSystem, Metronome, CapsuleRuntimeDxe, UniXNUDxe), all architectural protocols go missing and DxeCore asserts at DxeMain.c(581). Observed on-device 2026-11-07: six 'Arch Protocol not present' lines and four 'discovered but not loaded' drivers [HOST]",
  "CORRECTION 2026-11-07: the PcdDxe self-deadlock was real and is fixed (as-built depex is now TRUE END, re-checked in the FV; the probe reports LocateProtocol(gEfiPcdProtocol)=Success iface=9B763350), but it was not what starved the runtime drivers. A DXE dispatcher probe records LoadImage failures = 14, every one of them Out of Resources, for VariableRuntimeDxe, EmbeddedMonotonicCounter, ResetSystemRuntimeDxe, RealTimeClock, CapsuleRuntimeDxe and nine more. Cause: the workflow built the DEBUG target (cli.py --target defaults to DEBUG, firmware.py:23 target='DEBUG'), whose PE images are several times larger than RELEASE, so the DXE page pool ran out after APRIORI index 31 and the six architectural protocols never appeared, which is what DxeCore reports at DxeMain.c(581). The community image boot-enchilada-2301.1 is a RELEASE build and starts for exactly that reason. Fix: build with --target RELEASE [HOST]",
  "Fix: mu-silicium-pcddxe-depex.patch overrides PcdLib with BasePcdLibNull for MdeModulePkg/Universal/PCD/Dxe/Pcd.inf in enchilada.dsc, the same override upstream OvmfPkgX64.dsc carries for the same module; applied on both firmware and bootimg CI runs [MU]",
  "The depex override alone did not fix the device: the fifth boot (2026-11-07 16:03, image sha256 0634f37d) reached the DXE self-check with the same six missing arch protocols, and the disassembly of that image shows PcdDxe's as-built depEX is now 'TRUE END' while VariableRuntimeDxe/MonotonicCounter/ResetSystem/RTC/Capsule still wait on gEfiPcdProtocolGuid. The community boot-enchilada-2301.1 image carries byte-identical depEX for the same six drivers and does boot, so the difference is not the depEX: either PcdDxe's entry point never completes or the PCD database section cannot be read at runtime [HOST]",
  "Diagnostic: mu-edk2-pcddxe-probe.patch adds four DEBUG prints on PcdDxe's entry path and in PcdDatabaseLoaderLoad's GetSectionFromFfs call, so the next serial capture says which of the two fails. It is wired through Resources/MuPatches/ and [firmware] patches and removed once answered [MU]",
  "UniXNURamDiskDxe published no payload volume because the SEC never handed over the device tree. grep -rni daee82e6 over Mu-Silicium returns nothing: Sec.c never calls BuildGuidDataHob, ModuleEntryPoint.S discards the x0 a Linux-style boot loader uses for the flattened device tree, and UniXNURamDiskDxe returns EFI_SUCCESS with no volume when GetFirstGuidHob misses, so the menu falls back to the built-in configuration [MU]",
  "SEC entry-argument fix, first attempt, crashed the device: firmware/mu-silicium-sec-entryarg.patch v1 stored x0 as the very first instruction of _ModuleEntryPoint, before PlatformAssemblyInitialize installs the exception vectors and before MainEntryPoint sets SP, and Sec.c read the tree header and reserved it with BuildMemoryAllocationHob before ProcessLibraryConstructorList ran. On 2026-11-07 23:32 the image carrying it (sha256 b72ee9bd) went from Booting OKAY to no USB enumeration at all, and the phone reset into the Android boot screen with no UEFI output; the same build without the patch (sha256 58cf21ae has it, bootimg9 does not) still reaches the menu. Isolated by flashing out/bootimg10/boot/boot.img, which has the patch and a one-byte ramdisk, and losing USB, against the earlier menu run [HOST]",
  "SEC entry-argument fix, second attempt: the patch now moves x0 into the callee-saved x19 at entry, writes it to gSecEntryArg0 only inside MainEntryPoint after the stack is live, and in Sec.c does a single BuildGuidDataHob after ProcessLibraryConstructorList, reading no memory and reserving nothing, so a junk value is rejected by the driver instead of killing the firmware. SiliciumPkg.dec and Sec.inf declare gSiliciumEntryArgHobGuid; the integration, PcdDxe and SEC patches apply cleanly in that order on 8471e47f [MU]",]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["Blocked on git (build_uefi.py requires it) and on a non-Windows host for edk2; bootloader lock state also unknown."]
next_action = ["Package the built firmware into a boot image (the package and bootimg stages are still unimplemented), then boot it once on the device; that last step needs its own authorisation."]
evidence = [
  { kind = "host", reference = "firmware/mu-silicium-unixnu-integration.patch", command = "python3 ./unixnu build firmware --device ../device --os 17 --uefi ../Mu-Silicium --target RELEASE", revision = "aaaff2dfbfde8969f10ee543da40f99c919e99b1", result = "2026-11-07: run 42380779873 succeeded, SILICIUM_UEFI.fd sha256 5bd55aa8..., packed into a 1,626,112 byte boot.img" },
  { kind = "device", reference = "evidence/20261107_unixnu_menu.md", command = "fastboot boot out/bootimg9/boot/boot.img", revision = "2b9e37c84f9e4d94de311b70c3594216bfd01801", result = "2026-11-07 22:22: the UniXNU 0.1.0 boot menu appeared on the enchilada screen; no boot entry found because no payload volume exists; zero partition writes" },
]

[[area]]
id = "cpu"
status = "planned"
components = ["ArmCpu"]
paths = ["drivers/ArmCpu/**", "scripts/*armcpu*"]
inputs = [
  "8 cores, all AArch64: cpu0-3 Cortex-A75, cpu4-7 Cortex-A55 [LOCAL].",
  "Timer interrupt id 19 (armcpu-timer-intid=19) [PORT].",

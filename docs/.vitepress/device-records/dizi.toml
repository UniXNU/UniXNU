schema_version = 1

[device]
name = "dizi"
soc = "SM7435"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Redmi Pad Pro (dizi), SM7435 (Parrot). Bring-up stage: CPU, interrupts, timer and GOP framebuffer through Mu-Silicium diziPkg. No hardware boot evidence yet."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore"]
inputs = ["Identify the configuration hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for configuration."]
procedure = ["Follow the configuration stage in the porting guide and record the actual commands."]
findings = ["feeds.toml previously pinned an SM8550 commit, so status resolved the sm8550 SoC profile; it now pins sm7435-common and status reports soc sm7435.", "board.toml carries the bring-up component set, config fragments, patch series, device tree, Mu-Silicium firmware paths and a 56 MiB payload that fits the 100 MiB boot partition.", "The ADT declares vmm-present = 1: dizi firmware publishes no Apple PMGR and AMFI otherwise panics with 'AMFI: No PMGR?' at ConfigurationSettings.cpp:235.", "2026-11-15: kernel_args default to cpus=8 smp=1; [kernel] archives add ShengUfs, its KDK-free bindings (candidate kernel without ShengUfs), the PMGR bridge and the boot-progress page; [userdata] holds the GPT range 0x35a228-0x1d13ffa; ruan's 2.75 GiB window does not fit dizi's UEFI map, and the 1952 MiB window above 4 GiB stops at setconf, so the default window stays.", "2026-11-17: board.toml adds the RamBlock component and its archives (component:RamBlock, NativeRamBlock bindings), packed_data_ramdisk = true, [userdata] partition = 'unixnu' with the unixnu range, native-ufs-partition=unixnu in kernel_args, and records the failed memory windows; dizi_defconfig links build/ram-block/libRamBlock.a."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["Payload memory is the single 2 GiB DDR region0 at 0x80000000 that UniXNU's ADT generator requires; other RAM sizes are not checked."]
next_action = ["Add the root filesystem inputs (storage driver, userdata root image)."]
evidence = [{ kind = "source", reference = "board.toml", result = "unixnu status resolves soc sm7435, profile ipados-17.7.11-21H461 and the dizi patch order" }]

[[area]]
id = "firmware"
status = "implemented"
components = []
paths = ["proprietary-files.txt", "scripts/extract-files.py", "scripts/gen-touch-firmware.py"]
inputs = ["Identify the firmware and boot hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for firmware and boot."]
procedure = ["Follow the firmware and boot stage in the porting guide and record the actual commands."]
findings = ["Mu-Silicium diziPkg embeds UniXNU, UniXNUDxe, UniXNURamDiskDxe and DarwinBoot; Silicium SEC saves the bootloader x0 (FDT) in the entry-argument HOB.", "On dizi the initrd starts with the vendor_boot LZ4 legacy ramdisk (0x184C2102) followed by the FAT32 payload; UniXNURamDiskDxe now skips the LZ4 frames and publishes the payload, so the menu loads \\EFI\\UniXNU\\unixnu.toml.", "The Windows KEP ExitBootServices hook is left out with DISABLE_KEP; BootShim's image size covers the shim plus the FD.", "Volume and power keys use the PMIC/SPMI reader from the old-ChatGPT branch in diziPkg/Library/UniXNULibDizi; Volume Down timing was shortened and is not yet re-tested."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["The UEFI vendor binaries in Mu-Silicium Binaries/dizi are documented as Redmi Note 13 Pro 5G firmware."]
next_action = ["Test Volume Down in the menu with the shortened guard."]
evidence = [{ kind = "source", reference = "https://github.com/vildangil/Mu-Silicium/tree/dizi-bringup", result = "DarwinBoot handoff with the green bar observed on dizi on 2026-11-14" }]

[[area]]
id = "cpu"
status = "device-verified"
components = []
paths = ["package/CpuFreq*", "scripts/*armcpu*"]
inputs = ["Identify the cpu and interrupts hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for cpu and interrupts."]
procedure = ["Follow the cpu and interrupts stage in the porting guide and record the actual commands."]
findings = ["2026-11-14 on dizi with cpus=1: entry probe showed the blue (kernel entry) and magenta (pre-MMU) bands, and a reset after MMU-on.", "XNU then panicked at fiq_context_init writing CNTP_CTL_EL0: the hypervisor traps EL1 physical-timer access. sm7435-virtual-timer-only.patch removes that write.", "With the patch XNU passes arm_init, IOKit and AMFI and stops at 'Failed to mount root device' (IOKitBSDInit.cpp:984), which is expected without a root filesystem."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["Secondary CPUs (SMP) are not started or tested; cpus=1 stays the default."]
next_action = ["Test SMP with an explicit cpus=2 run after root mount works."]
evidence = [{ kind = "device", reference = "https://github.com/vildangil/UniXNU-sm7435-common/commit/1765d1bc3601d288f00fa6f7be9b7634b4e10e18", command = "fastboot boot out/dizi/ipados-17.7.11-21H461/dizi/boot/boot.img", revision = "1765d1bc3601d288f00fa6f7be9b7634b4e10e18", result = "XNU reaches 'Failed to mount root device' at IOKitBSDInit.cpp:984 on the panic screen" }]

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = ["Identify the memory and dma hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for memory and dma."]
procedure = ["Follow the memory and dma stage in the porting guide and record the actual commands."]
findings = ["dizi's low DRAM bank has almost no free memory (diziPkg MemoryMapLib), so DarwinBoot's window starts in the 0x840000000 run (UEFI: 0x7AB00000 bytes).", "2026-11-17: windows of 0x7A000000, 0x78000000 and 0x40000000 all froze the tablet about one second into BSD (clock stopped, irq=0), with or without the Data seed and with ShengUfs DMA kept below 0x850000000. The default 256 MiB window works; launchd's daemons then get jetsam-killed.", "Linux (OrangeFox, /proc/iomem) has 0x840000000-0x8baafffff, 0x8bb100000-0x8bcefffff and 0x8c0000000-0x8ffffffff as System RAM, so the larger windows lay in RAM given to HLOS; the 6 MB hole 0x8bab00000-0x8bb0fffff explains only the 0x7A000000 window. The cause of the freeze is open."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["XNU gets 256 MiB; daemons and SpringBoard are killed by jetsam."]
next_action = ["Find why windows above 256 MiB freeze one second into BSD, then grow the window inside 0x840000000-0x8baafffff."]
evidence = []

[[area]]
id = "storage"
status = "implemented"
components = ["ShengUfs", "VerifiedRoot", "VirtioMmioBlock", "RamBlock"]
paths = ["drivers/ShengUfs", "scripts/*ufs*", "scripts/*storage*", "scripts/*userdata*", "scripts/*root*"]
inputs = ["Identify the storage and root hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for storage and root."]
procedure = ["Follow the storage and root stage in the porting guide and record the actual commands."]
findings = ["ShengUfs drives dizi's UFS host (0x1d84000, SPI 265) with SMMU stream 0x20 (native-ufs-stream). Gunyah blocks the SMMU's GR1 and context banks (external abort), so native-ufs-smmu-reuse=1 keeps the firmware's stream-to-bank-2 mapping.", "The GPT read gives userdata at 0x35a228-0x1d13ffa on LUN 0, matching fastboot's partition size.", "DMA straight into caller pages powered the tablet off; native-ufs-zero-copy=0 keeps all DMA in the host buffer.", "With native-ufs-allow-unverified=1 and dizi-ufs-unverified-root.patch the iPadOS 17.7.11 OS volume (04769D26) mounts read-only from userdata and launchd starts.", "Without SystemOS launchd stopped at dyld: libSystem.B.dylib is only in the dyld shared cache of the SystemOS cryptex. A DarwinBoot window above 4 GiB (0x7A000000 at 0x840000000) stops at setconf with no interrupts.", "2026-11-16: dizi-systemos-union.patch turns on UniXNU's owner SystemOS union (XNU_OWNER_CACHE_MOUNT, CACHE_STARTUP, UNION_SYSTEMOS) and boot manifest; ShengUfs answers native_verified_block_volume_device, root_authorized and manifest_sha384 for UFS window volumes only with native-ufs-allow-unverified=1. The SystemOS volume (8846FE78) mounts as a read-only union over / and launchd loads.", "mount(8) exited 66 on a missing boot-manifest-hash; /chosen now gets one built from placeholder per-volume digests (SHA-384 of a tag and the UUID). launchd then runs 17 processes (fsck, mount, keybagd, usermanagerd, apfs_boot_util, seputil and others) and stops at the critical tzinit: /private/var is read-only (errno 30), so there is no Data volume.", "2026-11-17: writable Data on /private/var. dizi-data-volume.patch turns on the owner Data mount with XNU_NATIVE_RAM_BLOCK; NativeRamBlock (component RamBlock, KDK-free bindings) serves the payload's packed Data seed (make-data-seed.py), whose APFS volume UUID comes from data-uuid=<UUID>. Without a persistent store a seed above 2 GiB refuses writes (device is not ready), and a seed of 512 MB or more hashes every page at start and resets the tablet at setconf; a 128 MB seed works.", "2026-11-17: dual boot. GPT entry 21 (userdata, 0x35a228-0x1d13ffa) was split with sgdisk from an unofficial OrangeFox (fox_dizi) started with fastboot boot: entry 22 unixnu (0x35a228-0xb5a227, 32 GiB) keeps the iPadOS root in place, entry 21 userdata (0xb5a228-0x1d13ffa, 70.9 GiB, original GUIDs) is Android's. ShengUfs finds the root by name with native-ufs-partition=unixnu. HyperOS 3 boots on the new userdata after fastboot erase userdata and metadata.", "ShengUfs reports each driver stage on the boot-progress page (ufs: ...); native-ufs-dma-max=<address> limits the host DMA memory (off by default)."]
completion = ["Host: register, clock, link and SMMU facts match the board inventory.", "Reads: SCSI capacity, GPT and known blocks are correct; OS/SystemOS windows stay within userdata.", "Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region."]
limits = ["The OS and SystemOS volumes are not authenticated, and the boot-manifest-hash is a placeholder, not an Apple manifest digest. Data lives in RAM: 128 MB, lost on reboot."]
next_action = ["Keep Data changes in a UFS store inside unixnu (data-persist), and hash only nonzero seed pages so a larger Data volume starts."]
evidence = [{ kind = "source", reference = "patches/drivers/ShengUfs-dizi.patch", result = "dizi changes to ShengUfs: stream, SMMU reuse, zero-copy switch, unverified root, unverified volume queries" }, { kind = "device", reference = "https://github.com/vildangil/UniXNU-Dizi-Ruan/commit/0d560de946ba7ce41b4687677d3baabca165a677", command = "fastboot boot boot.img", revision = "0d560de946ba7ce41b4687677d3baabca165a677", result = "2026-11-16: SystemOS mount returned; launchd ran 17 processes and stopped at tzinit (read-only /private/var)" }, { kind = "device", reference = "https://github.com/vildangil/UniXNU-Dizi-Ruan/commit/357c534a38b3f527fb7736a5d326f81129211a0e", command = "fastboot boot boot.img", revision = "357c534a38b3f527fb7736a5d326f81129211a0e", result = "2026-11-17: root from unixnu, Data mount returned, about 85 processes, SpringBoard started; Android boots from the new userdata" }]


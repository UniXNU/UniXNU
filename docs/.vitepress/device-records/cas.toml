schema_version = 1

[device]
name = "cas"
soc = "SM8250"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi 10 Ultra: UEFI menu and CPU0 platform start verified; moving to the standard UniXNU build with a UFS root, eight CPUs and touch."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "unixnu.lock", "configs/**", ".github/**", ".gitignore", "ci/**", "local.toml.example", "AGENTS.md", "README*.md", "CONTRIBUTING.md", "LICENSE"]
inputs = ["UniXNU format 2 layers: arm64, sm8250 SoC source, ipados-17.7.11-21H461 OS profile and the cas board."]
configuration = ["board.toml schema 2 with soc_source sm8250 and defconfig cas_defconfig."]
procedure = ["Run ./unixnu defconfig cas_defconfig, fetch, status and tree from the UniXNU checkout."]
findings = ["The layered configuration resolves with the pinned SoC source and component revisions."]
completion = ["The configuration builds a kernel, firmware, payload and boot image with the standard commands."]
limits = ["Only CPU0 and the minimal component set are selected; storage, display and input are pending."]
next_action = ["Add boot-progress, a 4.75 GiB owned window and the standard payload settings."]
evidence = [{ kind = "source", reference = "board.toml", result = "Format 2 board configuration with the SM8250 and iPadOS 17.7.11 layers." }]

[[area]]
id = "firmware"
status = "device-verified"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", "scripts/build_shim.py", "scripts/prepare_boot_dtb.py"]
inputs = ["uefi-cas Mu-Silicium firmware with the bounded CasBootShim, inherited framebuffer and SPMI buttons."]
configuration = ["FD 0x9f000000 / 8 MiB; Android boot image header v2, page 4096; stock SoC DTB index 2."]
procedure = ["Boot the image with fastboot boot; ABL applies the existing DTBO."]
findings = ["The UniXNU menu, buttons, RAM FAT, EFI run and return and the return to Android passed three complete runs."]
completion = ["The firmware enters UniXNU, exposes the framebuffer and the payload volume, and starts DarwinBoot."]
limits = ["The standard firmware profile cas-upstream.dsc has not been booted on the phone yet."]
next_action = ["Add the static high-RAM descriptor and boot the standard firmware profile."]
evidence = [{ kind = "device", reference = "https://github.com/ht94911/UniXNU-cas/blob/15bc58bb060a1e3c3cd15d4220997e4e54953d0a/docs/validation.md", command = "fastboot boot boot.img (cas-complete-001)", revision = "346a404f6cee464e3e95f6ded464caf804a1f89e", result = "Three complete runs of the UniXNU menu, buttons, RAM FAT, EFI return and Android return." }]

[[area]]
id = "cpu"
status = "device-verified"
components = ["ArmCpu"]
paths = ["package/armcpu/**", "patches/xnu/**", "scripts/cas-armcpu-asm-fix.py"]
inputs = ["Eight CPUs with MPIDR 0x000 to 0x700, PSCI smc, GICv3 0x17a00000/0x17a60000 and a 19.2 MHz timer."]
configuration = ["CPU0 enabled; ArmCpu with the Darwin assembler separator fix."]
procedure = ["Boot the kernel and read the CPU0 platform checkpoints."]
findings = ["CPU0 returned from arm_vm_init, early platform expert setup, cpu_timebase_init and PE_init_cpu with CNTFRQ 19.2 MHz."]
completion = ["All eight CPUs run with working timer and IPI handling."]
limits = ["Timer interrupts after machine_startup and the secondary CPUs are not verified yet."]
next_action = ["Enable the remaining seven CPUs after the kernel reaches the root mount."]
evidence = [{ kind = "device", reference = "https://github.com/ht94911/UniXNU-cas/blob/15bc58bb060a1e3c3cd15d4220997e4e54953d0a/docs/cpu0-platform-clock.md", command = "fastboot boot boot.img (candidate 005)", revision = "bae4311fe0a8c9b8d4258fe66a19b2615c3d4adb", result = "CPU0 completed VM setup and early platform and timebase initialization." }]

[[area]]
id = "memory"
status = "implemented"
components = ["ArmDTPlatform"]
paths = ["dts/**"]
inputs = ["DRAM banks 0x80000000+0x39900000, 0xc0000000+5 GiB and 0x200000000+6 GiB with 31 reserved regions."]
configuration = ["dts/cas.dts describes the banks and reservations; DarwinBoot owns the kernel window."]
procedure = ["Compile the board DTS through the format 2 payload step."]
findings = ["A 512 MiB window at 0x100000000 maps on the phone and 256 MiB of it allocates with full read-back."]
completion = ["A 4.75 GiB owned window at 0x100000000 is published by UEFI and used by XNU."]
limits = ["The large owned window for userland has not been run yet."]
next_action = ["Publish 0x100000000 to 0x240000000 as conventional memory in UEFI."]
evidence = [{ kind = "source", reference = "dts/cas.dts", result = "Board DRAM banks and reserved regions." }]

[[area]]
id = "storage"
status = "planned"
components = []
paths = ["package/*Ufs*", "scripts/*ufs*", "scripts/*userdata*"]
inputs = ["UFS host 0x1d84000; userdata is LUN0 LBA 0x2c0000 to 0x3b4b7fa with 4 KiB blocks."]
configuration = ["The OS and SystemOS images go to userdata; the root is read-only and Data stays in RAM."]
procedure = ["Port the UniXNU-umi SM8250 UFS adaptation onto the ShengUfs component."]
findings = ["UniXNU-umi mounts OS and SystemOS from UFS on the same SoC."]
completion = ["The root volume mounts from userdata and launchd starts."]
limits = ["No UFS driver is selected yet."]
next_action = ["Build the userdata root image and port the read-only UFS driver."]

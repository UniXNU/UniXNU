inputs = ["A-line marker/reader technique (32-byte record at PA 0x8C4000000, high-water channel, boot nonce), panic-screen and boot-log tooling, UEFI Advanced Logger QR, persistent log region."]
configuration = ["First-boot diagnostics use the official bring-up stages S1-S7 plus the framebuffer console and a persistent kernel log; no binary marker patching on the format-2 kernel.", "CONFIG_XNU_DT_PANIC_REGION is on; embedded-panic-log-size is emitted in the ADT, but the /pram node has no converter binding yet."]

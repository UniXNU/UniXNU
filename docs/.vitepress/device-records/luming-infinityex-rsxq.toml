paths = ["configs/luming_defconfig", "drivers/**", "docs/GAP-LIST.md"]
inputs = ["SM8735 GCC/RPMh/regulator facts are partially measured (GCC tuna offsets, UFS GDSC/reset); PMIC/regulator rails are not enumerated for the iOS load."]
configuration = ["SHENG_PMGR is on; the copied build-luming-platform-power.py (DadaPlatformPower, same kernelcache/slide addresses) publishes the ApplePMGRNub; untested on SM8735.", "The no-AMFI first boot relies on firmware-left power and the UFS/display components for their own rails."]
procedure = ["Record GCC/UFS GDSC/branch state in the stage-0 snapshot (A-line technique).", "If the AMFI/PMGR route is wanted later, port sheng's build-sheng-platform-power.py candidate-based instrument for luming."]
findings = ["The copied PMGR instrument must satisfy AMFI on SM8735; the copied AMFI-less entitlement guards are the fallback only.", "The UFS transport's clock/power assumptions are inherited from the firmware handoff."]

schema_version = 1

[device]
name = "luming"
soc = "SM8735"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Civi 5 Pro format-2 bring-up skeleton: native 4K XNU + XnuPrelink with the proven iPadOS 17.7.11 profile, a dada-shaped AMFI+PMGR kernel configuration, SM8735 measured hardware facts, SHNGROOT/VerifiedRoot userdata recipe and Mu-Silicium UEFI + DarwinBoot. Every area is planned; no build or boot evidence exists yet."

[[area]]
id = "configuration"
status = "planned"
components = ["XnuPrelink", "SoftwareAES"]
paths = ["board.toml", "feeds.toml", "unixnu.lock", "local.toml.example", "configs/**", ".github/**"]
inputs = ["Official UniXNU format-2 tool + profiles, local UniXNU-sm8735-common scaffold, luming measured lab facts, dada/sheng board references."]
configuration = ["schema_version = 2; board luming/SM8735; soc_source = sm8735 local feed; os_profile = ipados-17.7.11-21H461; kit = luming.", "The board vendors a soc/ feed scaffold because UniXNU-sm8735-common is not published or validated."]
procedure = ["Run ./unixnu defconfig luming_defconfig -D ../../agents/f2-luming.", "Run ./unixnu fetch, status --json and tree from the UniXNU checkout.", "Compare the resolved profile/components/patch order with board.toml and the official device-repository spec."]
findings = ["The chosen OS profile is the proven official one (sheng full UI, dada userland); no official Darwin22/iOS16 profile exists, so iOS16 is an alternative only (proposals/).", "dada's board shape is the primary template because it is the closest proven source-XNU format-2 device (AMFI+PMGR restored)."]
completion = ["The resolver reports device luming, SoC sm8735, profile ipados-17.7.11-21H461, output out/luming/ipados-17.7.11-21H461/luming/ and the expected patch order."]
limits = ["SM8735 SoC feed is a local scaffold that its own migration note flags as unvalidated.", "Porting record identity and every selected component must stay covered by these areas."]
next_action = ["Run defconfig/status/tree once the UniXNU base feeds are fetched and record the JSON output under docs/evidence/."]
[[area.evidence]]
kind = "source"
reference = "board.toml"
result = "Format-2 board configuration with pinned measured/placeholder values and sources"

[[area]]
id = "firmware"
status = "planned"
components = ["DarwinBoot"]
paths = ["firmware/**", "board.toml", "patches/unixnu/**"]
inputs = ["uefi-luming Mut-Silicium checkout for the luming package, stock luming vendor DXE set, Mu-Silicium patches listed in firmware/patches/, UniXNU/UniXNUDxe/UniXNURamDiskDxe modules."]
configuration = ["firmware.dsc = Platforms/Xiaomi/lumingPkg/luming.dsc; firmware.fd = Build/lumingPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd; ENABLE_SECUREBOOT=0 for the first boot.", "The firmware must embed UniXNU, UniXNUDxe, UniXNURamDiskDxe, DarwinBoot and DiskIo/FAT; the payload volume is LUMINGESP."]
procedure = ["uefi-builder builds the FD from the local uefi-luming tree (see firmware/README.md).", "./unixnu build firmware --uefi <uefi-luming>; record the FD size and module list.", "./unixnu bootimg passes the firmware DTB as --dtb; check boot.json fd_sha256/dtb_sha256/ramdisk_bytes."]
findings = ["The local uefi-luming tree boots the known-good UniXNU menu baseline but does not yet embed the format-2 modules.", "luming needs the luming-specific platform FDT/DTB handling already fixed in the UFS/AI8 campaign."]
completion = ["FD size matches the Mu-Silicium config, contains the required modules, and the v4 boot image starts UniXNU/DarwinBoot with the payload volume visible."]
limits = ["FD base/size for the format-2 path is not measured; uefi-luming is not published as a uefi-luming repository.", "Firmware ownership is uefi-builder; this record tracks the interface only."]
next_action = ["Hand firmware/README.md to uefi-builder and record the first FD hash + module list."]
[[area.evidence]]
kind = "source"
reference = "firmware/README.md"
result = "Firmware interface, required modules and Mu-Silicium patch set for the format-2 route"

[[area]]
id = "cpu"
status = "planned"
components = ["ArmCpu", "ArmDTPlatform"]
paths = ["dts/**", "soc/dts/**", "soc/patches/**"]
inputs = ["Live DT /cpus (8 Kryo cores, MPIDR Aff1 0..0x700), arm,armv8-timer PPI 13/14/11/12 at 19.2 MHz, PSCI SMC, GICD 0x17100000/0x10000 and GICR 0x17180000/0x200000 stride 0x40000."]
configuration = ["dts/luming.dts + soc/dts/sm8735.dtsi carry the 8 CPUs, PSCI and GIC nodes; virtual-timer-intid = <27> is recorded but the converter has no typed binding for it.", "soc/patches/xnu/native-smp-secondary.patch raises MAX_CPUS to 8 and handles the MPIDR Aff1 numbering."]
procedure = ["Compile the board DTS with dtc and inspect the ADT /cpus and /arm-io/intc nodes.", "Record per-CPU entry, timer interrupts, IPI delivery and the VTIMER=27 value on hardware."]
findings = ["VTIMER INTID is 27 (PPI 11 + 16), not sheng's 19 and the same as the SM8350 star port.", "The timer property needs an upstream converter binding before it reaches the ADT; the arch profile timer patch currently owns the generic timer path."]
completion = ["All enabled CPUs reach their entry checkpoint, timer/IPI handling works on every enabled CPU, and the GIC/timer values match the measured A-line facts."]
limits = ["CPU selection and frequency policy are board inputs; the SoC DTSI describes all eight cores but the first boot should use cpus=1."]
next_action = ["Run the DTS compile and record the ADT CPU/GIC byte dump; then verify the timer binding question with the format-2 owners."]
[[area.evidence]]
kind = "source"
reference = "docs/KNOWN-VALUES.md"
result = "Measured CPU/timer/GIC facts with their source paths"

[[area]]
id = "memory"
status = "planned"
components = ["RamBlock"]
paths = ["dts/**", "docs/KNOWN-VALUES.md", "configs/**"]
inputs = ["Live /proc/iomem: low bank 0x80000000..0xffffffff with XPU carve-outs; upper System RAM 0x880000000..0xaffffefff with holes; largest contiguous window 0x8c0000000..0xaffffefff = 0x23ffff000.", "A-line prelinked kernel physBase/markers around 0x8c01e06a0/0x8c4000000."]
configuration = ["dts/luming.dts memory@8c0000000 reg = <0 0x8c0000000 0 0x23ffff000>; board.toml payload.dram_size = 0x23ffff000.", "payload.adt owned_memory_size = 0x10000000 (dada measured value; luming not measured)."]
procedure = ["Compare the firmware memory map, DTS memory node, ADT chosen dram-base/size and DarwinBoot owned window.", "Check every DMA buffer (UFS, display later) against controller address width and SMMU mapping."]
findings = ["Format 2 requires exactly one contiguous DRAM range; the measured luming tree has several XPU-split regions, so the high-bank contiguous window was chosen and the alternative low 2 GiB shape is documented.", "0x23ffff000 is not 2 MiB aligned; if XNU/DarwinBoot rejects it, use 0x23ff00000 in both the DTS and payload.dram_size."]
completion = ["All handoff regions are accounted for, the ADT dram window matches the DTS, and each enabled DMA engine reaches its buffers with the documented cache policy."]
limits = ["The DarwinBoot owned window for luming is not measured; the value is inherited from dada as a placeholder.", "RamBlock/Data-seed staging still needs the DBRDISK1 seed input."]
next_action = ["Measure the luming DarwinBoot window during S1/S3, then update owned_memory_size and the ADT memory window together."]
[[area.evidence]]
kind = "source"
reference = "docs/KNOWN-VALUES.md"
result = "DRAM window measurements and alignment risk (sections 2-3)"

[[area]]
id = "storage"
status = "planned"
components = ["LumingUfs", "VirtioMmioBlock", "VerifiedRoot"]
paths = ["drivers/**", "docs/UFS.md", "configs/luming_defconfig", "board.toml"]
inputs = ["UFS host 0x1d84000/0x3000 + ICE/MCQ windows, PHY 0x1d80000 qcom,ufs-phy-qmp-v4-niobe, apps SMMU stream 0x60, GCC tuna offsets, userdata GPT LBAs 3124736..128619514 at 4096 B.", "SHNGROOT image windows OS/SystemOS built from the active profile; root UUID 04769D26-2CA0-4825-B443-E2E5F88300F2; DBRDISK1 Data seed."]
configuration = ["Select LumingUfs (board module; catalog lineage ShengUfs/NativeUfs) and point CONFIG_XNU_NATIVE_UFS_ARCHIVE at build/luming-ufs/libLumingUfs.a; native-ufs-root=1/native-ufs-diagnostics=1 in kernel_args.", "board.toml userdata windows OS/SystemOS; payload.adt packed_data_ramdisk/persistent_data + root UUID; VerifiedRoot selected for the SHNGROOT recipe."]
procedure = ["Read docs/UFS.md and the A-line UFS reports.", "Use the luming fork of DadaUfs/ShengUfs (NativeUfs) with the storage-class/kext-binding archives; add the catalog entry and publish the source.", "Validate stage-0 snapshot, GPT read, SHNGROOT windows, root UUID mount and Data seed."]
findings = ["The UFS SM8735 driver exists only as a prelinked/device-repo build path; it is not a format-2 component.", "The A-line proved the controller can be adopted and the GPT read; the UFSDxe init works after the platform-FDT fix.", "The transport must not compile IOBlockStorageDevice itself; the base class comes from the prelinked IOStorageFamily kext (dada)."]
completion = ["Host: controller/PHY/clock/SMMU facts match the board inventory and the component builds from source.", "Reads: capacity/GPT/known blocks correct; SHNGROOT windows within userdata.", "Root: the APFS volume mounts by UUID and launchd starts; Data seed mounts at /private/var."]
limits = ["LumingUfs is a board module; it needs an upstream catalog entry (patch prepared) and a published source.", "The no-AMFI first boot may need dada's AMFI-less entitlement guards before userland exec."]
next_action = ["Create the LumingUfs component and its archive builders, then run the stage-0 UFS validation from docs/UFS.md."]
[[area.evidence]]
kind = "source"
reference = "docs/UFS.md"
result = "Storage facts, component work order and acceptance criteria"

[[area]]
id = "display"
status = "planned"
components = []
paths = ["drivers/LumingDisplayTouch/**", "docs/KNOWN-VALUES.md", "dts/**"]
inputs = ["ABL splash FB 0xFC800000/0x2b00000, stride 4944, 1236x2750; panel command qcom,mdss_dsi_o9_42_02_0a_dsc_cmd; UEFI GOP hand-off via DarwinBoot boot_args.Video."]
configuration = ["No display component selected for the first boot: XNU's pexpert video console draws through DarwinBoot's GOP boot_args.", "board.toml [[bootimg.dtb_node]] keeps the splash reservation so ABL does not power the panel off."]
procedure = ["First boot validates the text console and panic screen.", "Then port/select a display component publishing IOMobileFramebuffer for luming (panel/backlight/rail work), recording frame timing and pixel format."]
findings = ["dada also reaches userland without a display service; sheng has GopFramebuffer but its stack is SM8550/Adreno-oriented.", "The A-line/format-1 facts give the FB geometry for the console and the future display component."]
completion = ["Text console/panic screen visible on first boot; later a known frame is presented with correct geometry/colors and userland presentation works."]
limits = ["No luming display component exists; the GPU family (gen8-6-0) has no matching catalog component."]
next_action = ["Record the first-boot console screenshot, then scope the display component with the panel/backlight/regulator inputs."]
[[area.evidence]]
kind = "source"
reference = "drivers/LumingDisplayTouch/README.md"
result = "Display/input scope, inputs and missing-component note"

[[area]]
id = "input"
status = "planned"
evidence = []
components = []
paths = ["drivers/LumingDisplayTouch/**", "docs/KNOWN-VALUES.md"]
inputs = ["Stock DT touch node, PMIC/SPMI key nodes, luming panel/touch power rails (to be identified from the live DT and vendor kernels)."]
configuration = ["No input component selected yet; sheng's ShengHidInput + touch component are shape references, not luming hardware.", "The first boot does not need input; the menu can auto-boot (timeout 0) and the console needs no keys."]
procedure = ["Identify the touch controller and key wiring from the stock DT and vendor sources.", "Port an input component delivering Apple HID events (IOHIDEventService) and validate touch/keys on hardware."]
findings = ["sheng's Novatek touch is SM8550 hardware; luming's touch controller must be measured.", "Input is required for Setup/SpringBoard interaction, not for S1-S6."]
completion = ["Touch and hardware keys reach iOS/backboardd as HID events and the UI can be navigated."]
limits = ["No luming input driver exists; no hardware touch facts are recorded yet."]
next_action = ["Extract the touch/keys nodes from backup/analysis/device-live/luming-live/dtb-dump.json and pick the driver family."]


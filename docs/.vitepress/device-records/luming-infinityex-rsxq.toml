next_action = ["Capture GCC/UFS GDSC/branch values in the first hardware snapshot, then decide whether the PMGR instrument is needed."]

[[area]]
id = "packaging"
status = "planned"
components = ["XnuPrelink", "SoftwareAES"]
paths = ["package/**", "kits/**", "docs/FIRST-BUILD-PLAN.md", ".github/**", "patches/**"]
inputs = ["XnuPrelink kit + profile prelink values, source corecrypto/SoftwareAES archives, payload volume/dram inputs, boot image v4 parameters, Dada/Sheng packaging references."]
configuration = ["board.toml [kernel].archives selects corecrypto/pthread/Arm*/SoftwareAES/RamBlock/LumingUfs builders; storage-class and luming builders are missing placeholders.", "Payload = LUMINGESP 192 MiB; bootimg image = header v4, base 0, kernel_offset 0x8000, ramdisk_offset 0x01000000, tags 0x100."]
procedure = ["Build kernel then package, firmware, payload, userdata and bootimg in that order.", "Validate boot.json (header v4, ramdisk_bytes, fd/dtb hashes) and the payload FAT contents before any device step."]
findings = ["Format 2 owns prelink through the OS profile + kit; the A-line prelinked-kernel binary bypasses must not be reused.", "The format-1 LumingKit stub is kept only as a reference."]
completion = ["All artifacts build from a clean checkout, their hashes are recorded, and the image passes the host validation gates G2-G5."]
limits = ["The package/kit is a format-1 stub; storage-class/luming builders are not ported; CI is not runnable until the repo is published."]
next_action = ["Port the missing archive builders and re-derive the package/kit for format 2, then dispatch the macOS workflow."]

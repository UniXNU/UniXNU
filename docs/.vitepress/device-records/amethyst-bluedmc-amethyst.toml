  { kind = "device", reference = "scripts/log/WORKING-BOOT.md", result = "V60 (staging amethyst-tap-v60, SHA-256 fbfd6f43...): taps, scrolling, swipes up from the bottom, brightness and lock/unlock confirmed by the user.", command = "fastboot -s <serial> boot <image>.img (RAM only); in LineageOS Recovery: python3 scripts/log/pull-log.py --out <result-dir> --serial <serial>", revision = "5b9c6ed8b9e7329e12c4da2a338a2ed0295adbe8" },

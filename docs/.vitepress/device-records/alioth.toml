t presents nothing still reads sw=0 own=0, so the client rendered and never called the display." }, { kind = "device", reference = "docs/evidence/2026-11-07-align1-round.md", command = "fastboot boot tmp/boot-align1.img (sha256 d6f2d41a496fbcd6255132cbe84d717ee8916a1cfe0683763b486b90ebd6180e), then sh tmp/read-log.sh --diag and read build/sheng-logs/align1-0000002291370ffa", revision = "bdff7cd239a2bd1fcf2478d75e5d9d224ed15639", result = "The desktop appeared and the owner confirmed it; the 240 s screen export showed the home screen. GPUROW19 CP ok with marker a6500c0d, GPUROW25 sub 729/729 bo 316/316 busy 0 roqavail 0/0/0, GPUROW24 METAL ok, [metal askers] named ten processes, [gpu clients] carried slots s0..s4, [gpu objects] showed s0 w485M subs=682 and s4 w21M subs=19, and prime.log compiled the CoreImage pipelines. The known-image render is still outstanding. Wallpaper is absent: UnityPosterExtension reported no-device Vulkan(-3) and crashed in DecodeRow/Write_BGRA8_vec; the other poster extensions reached s4 and submitted." }
  , { kind = "device", reference = "docs/evidence/2026-11-09-gpu-known-image.md", command = "sh tmp/rounds-count2.sh tmp/boot-in22.img in22 1 220 with sheng-swaptest=1 and sheng-gpu-trace=1, then read GTPROB2", result = "The GMEM colour-order test reports the declared bytes for all four transport kinds on one healthy boot: devs/devg/hosts/hostg each read A3366cc B0a141e C1e1e1e Dcccccc with p12288 e0, while the compositor accepted 241 swaps (own=1) and presented 84 frames. The known image renders with correct geometry and colours through the same Turnip path the desktop uses.", revision = "f571906aee3d86c6ad8f1ffe207b8c18a04cd989" }]

[[area]]
id = "network"
status = "planned"
components = []
paths = ["package/alioth_pcie.c", "package/*Wifi*", "package/MhiBoot*", "scripts/*wifi*", "scripts/*mhi*"]
inputs = [
  "QCA6390 at 17cb:1101 behind qcom,pcie@1c00000; parf 0x01c00000+0x3000, phy 0x01c06000+0x1000, dm_core 0x60000000+0xf1d, ELBI 0x60000f20+0xa8, IATU 0x60001000+0x1000, conf 0x60100000+0x100000.",
  "package/alioth_pcie.c is this board's diagnostic bring-up. Step 11 now follows pci-msm.c:4374-4409: after PERST is released it writes the seven DBI training words, sets PARF_LTSSM bit 8, then polls ELBI XMLH_LINK_UP (0x08 bit 10), DLLLA (DBI 0x80 bit 29) and a real vendor/device ID (DBI 0x00) for 20 rounds at 5 ms. Steps 12-15 remain separate read-only or opt-in diagnostics. The PHY reset is only GCC_PCIE_0_PHY_BCR (0x6c01c) before the 99-pair sequence; the later-generation 0x6f000/0x6f010 resets after the sequence were removed. The 100 MHz refgen CFG_RCGR is 0x105 (parent 1, divider 6), not 0x501. PARF_DBI_BASE is written only at the 2.7.0 offset 0x350; 0x168 is read-only here. WLAN_EN and PERST# use the NORTH TLMM tile at 0x0f900000 and set the level before output enable. These constants were verified against reference/k40-kernel f3d39dae and the board-validated MrMoxing/ios-alioth commit 6a5a2d56be33; that repository is iOS 16.5 / xnu-8796, so only its hardware sequence was used, not its Linux compatibility layer or userland.", "The whole resource set the bring-up has to vote, read from the vendor tree on 2026-11-06. Clocks, eleven of them (kona-pcie.dtsi:76-88): pcie_0_pipe_clk, pcie_0_ref_clk_src, pcie_0_aux_clk at 19.2 MHz, pcie_0_cfg_ahb_clk, pcie_0_mstr_axi_clk, pcie_0_slv_axi_clk, pcie_0_ldo, pcie_0_slv_q2a_axi_clk, pcie_tbu_clk, pcie_phy_refgen_clk, pcie_ddrss_sf_tbu_clk at 100 MHz. Resets, two (kona-pcie.dtsi:90-93): GCC_PCIE_0_BCR and GCC_PCIE_0_PHY_BCR. Supplies (kona-pcie.dtsi:46-52): gdsc-vdd from pcie_0_gdsc, vreg-1p8 from pm8150_l9 at 1200000/1200000 uV with 16000 headroom, vreg-0p9 from pm8150_l5 at 880000/880000 uV with 73500 headroom, vreg-cx voted to RPMH_REGULATOR_LEVEL_MAX. SMMU sid base 0x1c00 with two iommu-map entries, and dma-coherent.", "The link-training sequence, from drivers/pci/controller/pci-msm.c:4407-4440. Enable training by writing PCIE20_PARF_LTSSM (parf + 0x1b0) bit 8 to 0. Then poll ELBI + PCIE20_ELBI_SYS_STTS (0x08): bit 10 (0x400, XMLH_LINK_UP) is link up, and bits [17:12] are the LTSSM state. Each check sleeps 5000-5100 us and the default cap is 20 checks, so the whole wait is about 100 ms; a debugfs vote in bits [31:4] of a module parameter can shorten it. A set bit alone is not enough: msm_pcie_confirm_linkup also requires dm_core + 0x80 bit 29 to be set and dm_core + 0x00 (vendor and device id) to differ from the link-down value, and on failure the driver reasserts PERST and returns an error (pci-msm.c:1242-1250).", "The PHY is not a handful of writes: kona-pcie.dtsi carries qcom,phy-sequence as 99 register/value/delay triples (297 numbers) that the driver replays from phy power-down at 0x840, with phy version 1102, link status at 0x814 bit 6, and L1 substate settings of a 10 ms timeout, no L0s, th-scale 2 (1 us) and th-value 70. A port that does not replay all 99 writes is not doing the same bring-up as the vendor kernel.",
]
configuration = [
  "board.toml passes pcie=<steps>; pcie_skip=<mask> skips a step, and pcie_skip=32 skips the PHY sequence.",
  "The file was wrapped in #if defined(ARM64_BOARD_CONFIG_SWEET) and compiled to an empty object under this board; the guard now accepts BCM2837 as well.",
  "The kernel's C record carries -Werror and the driver leaves struct fields implicit, so the recipe passes -Wno-missing-field-initializers; sweet_log_flush is shimmed because that log belongs to the ios-sweet tree.",
  "printf does not reach this board's console, so the driver's line() tees to qcom_usb_debug_write and the rows appear as PCIE <step>: <text>.",
]
procedure = [
  "Build with the archive entry and call alioth_pcie_init() from the late display probe; a run is pcie=<n> on the kernel command line.",
]
findings = [
  "The PCIe probe's thread is named alioth-pcie so a stopped core's thread is identifiable. 2026-11-08: the hardware sequence was corrected to the vendor clock/DBI/PERST order. This is a source-verified board-probe change, not a claim that Wi-Fi works; no link-up reading exists on the UniXNU 4 KiB line yet.",
  "Step 9 now reads the clock vote register once more after the PHY reference generator is running, and changes nothing. Step 3 now votes all six branches (CLOCK_VOTES=0x3f), including pipe bit 4. The earlier 0x2f left it out; the external same-board success records that DBI, IATU and link-block reads never return with bit 4 out while PARF reads work, and pc3 measured exactly that. The read remains as the check that bit 4 is set before step 10 touches the IATU window.",
  "The DBI window was run on the board on 2026-10-30 -- step 10 in the table as it then stood, and steps 13 and 14 in the fifteen-step table the file carries now -- and produced exactly what step_dbi's own comment predicts: with pcie=10 the board never returned, no console device enumerated and no fastboot or adb endpoint appeared, so the first access to the controller's DBI window (the iatu_viewport read) takes the machine down. The step table in alioth_pcie.c already carries all ten steps including step_dbi, so the record's earlier statement that step 10 had never run is out of date; what is now known is that it runs and kills the board rather than that it is missing. Deciding between the mapping and the access rule needs a probe that writes its line before the access and survives it, which this board has no channel for.",
  "Step 1 reads gcc pcie_0_gdscr = 0x22f001: PWR_ON clear, SW_COLLAPSE set, the controller fully off — the same value the ios-sweet series recorded.",
  "Step 2 powers it: writing 0x22f000 reads back 0xf822f000 within a millisecond.",
  "Step 3 finds the halt registers already zero; step 2's power-up cleared them.",
  "Step 4 reports phy_status 0x68 with bit 6 set before any PHY write, so the bootloader left the PHY initialised and the sequence can be skipped.",
  "Step 9 with pcie_skip=32 reaches the PARF: parf_mhi_clock_reset_ctrl 0x3 written to 0x13, parf_axi_mstr_wr_addr_halt_v2 unchanged at 0x80000014, both matching the reference.",
  "The firmware provenance this area required is recorded (2026-11-09): proprietary-files.txt pins ath11k/QCA6390/hw2.0/{amss.bin,m3.bin,board-2.bin} from linux-firmware under an @fetch base with SHA-256 digests, and scripts/extract-files.py fills .cache/firmware for every build tree (--check verifies without writing). The images are the generic QCA6390 hw2.0 set used by mainline Linux on this part; the phone's own BDF in a vendor partition is a later substitution, not a prerequisite for MHI start. The MSI routing is recorded above (SPI 768, doorbell 0x17a10000, endpoint data 768) and the SMMU stream IDs are in inputs (sid base 0x1c00).",
  "2026-11-09: the board layer now runs inside the kernel and reaches ath11k's PCI claim. in28 (image 7269fda4...) read, in one healthy boot with the desktop up (own=1 sw=20): link up at 15 ms (endpoint 17cb:10b), outbound window conf bar0 readback 0x60300004 and mem+0x8 0xdeadbeef, inbound window ctrl2 0x80000000 target 0x17a10000, MSI control 0x10b address 0x60400040 data 0x300, TCSR_SOC_HW_VERSION major 2, config id 0x110117cb, SMMU SID 0x1c01 claimed at SMR slot 7 with S2CR bypass, a 32 MiB physically contiguous DMA arena, four WLAN rails voted, 'ath11k: MSI vectors: 32', 'qca6390 hw2.0'. The start then failed at 'firmware .../amss.bin open 2' because that round's addon did not carry the firmware; the addon with firmware/qca6390/{amss.bin,m3.bin,board-2.bin} is built and the next round uses it. Two source defects were found and fixed on the way: cfgRead refused every width but 4 while ath11k claims the device with a 16-bit read, and the firmware lookup used the driver's full 'ath11k/QCA6390/hw2.0/<file>' name against this board's flat directory. Still no MHI start, no firmware download, no QMI/QRTR, no WMI, no scan, no association, no traffic.",
  "The PCIe bring-up runs only when the command line carries pcie=N; alioth_pcie_init returns at once otherwise. in24 and in25 omitted it, so the board layer read an unprogrammed BAR0 and the CPU hung until a power cycle. alioth_pcie.c now exports how far the steps got and the board layer refuses to map or read the endpoint below step 19 (17 is the outbound window, 19 the inbound window and the MSI capability), naming the argument to add instead of hanging. A round therefore needs 'pcie=19 pp=1 alioth-wifi=1'; pt=1 must not be used with it, because it runs the steps on a thread and lets the boot continue before step 19 finishes.",
  "The driver cannot come from the catalog component. Ath12kWifi implements ath12k for WCN7850/QCC2072/QCN9274 (components.toml:495-513, tools/sources.txt builds only ath12k), and QCA6390 is ath11k: PCI 17cb:1101, ATH11K_HW_QCA6390_HW20, firmware directory QCA6390/hw2.0 (reference/repo/linux-mainline ath11k/pci.c:30, core.c:220-232, hw.h:74-81). The same stack exists on a sibling device: qiumochen/UniXNU-zizhan drives QCA6490 (17cb:1103) with Linux v7.0.14 ath11k built against the Ath12kWifi shim and reached scan, WPA2, DHCP and HTTPS (docs/devices/zizhan.md g275-g337). Its 149-line ath11k glue and shim headers are imported under drivers/AliothWifi and adapted to 0x1101; the platform, network layer and build recipe are next. No Wi-Fi code is in the image yet.",
  "2026-11-09: the endpoint's stream was claimed as TRANSLATE, not BYPASS, and that is what stopped MHI. claimStream wrote S2CR = 0 with a comment calling it bypass; the vendor register header (reference/k40-kernel/drivers/iommu/arm-smmu-regs.h:119-128) encodes the type in bits [17:16] as TRANS 0, BYPASS 1, FAULT 2, and the shared kit repeats it (ArmSmmu4KStreams.c:3). Zero sends every transaction from SID 0x1c01 to context bank 0, which this layer never configured, so all of it faults; a non-posted read from the endpoint then never completes and the host's next register read blocks behind it, which is exactly in32's shape (doorbell rung, then the CPU stops on BHI_STATUS). The same rule is already in this record for the GPU SMMU: clearing a slot to zero turns FAULT into TRANSLATE. The claim now writes BYPASS with EXIDVALID when ID0 reports EXIDS, writes S2CR and reads it back before publishing the SMR, refuses a slot whose S2CR still names an enabled context bank (the UFS takeover writes S2CR before SMR), and logs ID0, sCR0, GFSR before and after and both readbacks. Not yet measured on the board.",
  "2026-11-09, in30 and in31: the AMSS file is read into the kernel and MHI's power-up completes, then the CPU stops inside the SBL load. in30 (sha256 580057a4...) and in31 (c96b121d...) both print 'Requested to power ON' and 'Power on setup success' (both from mhi_async_power_up), then the firmware line for amss.bin (3,628,672 bytes, first word 0x464c457f), and nothing more; the console freezes at t=13 s and the watchdog resets the board, so no desktop appears either. in31 also ruled out the BAR0 window: MHICFG reports BHI at 0x100 and BHIe at 0x224 and the window register reads 0x40000000 before the driver touches it, so every MHI register access is below the 0x80000 window start. The MHI register hooks now go through the window anyway (they are correct for any offset), but that was not the cause. What remains is the SBL transfer: mhi_fw_load_handler reads BHI_SERIALNU, requests amss.bin, takes sbl_size bytes, gives the endpoint a DMA buffer and rings BHI_IMGTXDB, then polls BHI_STATUS. A wedged MMIO read and a transfer the endpoint never completes look identical from the console, so the next round logs each step (exec env, buffer address and length, each doorbell, the load result).",
]
completion = ["Scanning, association, address configuration and sustained receive/transmit traffic pass with the selected firmware."]
limits = [
  "Step 10 stops at its first access, and the window addresses are not the reason. Every one of parf, phy, dm_core, elbi and iatu matches the vendor DTS byte for byte (kona-pcie.dtsi:7-13); only the conf window differs, 0x100000 there against 0x1000 here, and that is not the access that hangs. What differs is the clock vote set: step_clocks votes slv_axi, mstr_axi, cfg_ahb, aux and slv_q2a, while the vendor clock-names also carries pcie_0_ldo, pcie_phy_refgen_clk, pcie_0_ref_clk_src, pcie_tbu_clk and pcie_ddrss_sf_tbu_clk. The LDO and the PHY reference generator decide whether the core and the PHY are powered and clocked at all, so a bus that never returns is what their absence predicts. Next: vote those two only and run to step 9 without touching DBI, then retry step 10.",
  "No link has trained on the UniXNU 4 KiB line and no endpoint has been enumerated there; MHI, QMI and ath11k do not exist in this tree, and the local reference Ath12kWifi is ath12k, a different driver for a different part. pc2 (boot image sha256 1d3b01eb..., console tmp/console-pc22308321.txt, source revision 1ba611e) ran pcie=11 pp=1 pt=1 once. Step 2 voted ldoa9 1.2 V, ldoa5 0.88 V and cx.lvl 0x30000 level 256 before it powered the controller; the command database resolved cx.lvl, the RSC read 0x800c8104 (8 TCS, 16 commands each), TCS 0 was idle, and the vote completed after one poll with command status 0x10101 and irq 0x1. That 0x10101 is CMD_STATUS_ISSUED (bit 8) plus CMD_STATUS_COMPL (bit 16), the vendor completion criterion (rpmh-rsc.c:283-290); the earlier rail2 line that called it DID NOT COMPLETE used the TCS IRQ status instead and is corrected in docs/evidence/2026-10-31-rail-vote.md. The link still did not train: parf_ltssm stayed 0 after step 10, the PCIE 11 announce reached the console, but no 'about to read dbi' line, THE LINK IS UP or link row followed; the persistent writer stopped at BOOTLOG beat 2 phase 7 and the boot showed CORES deaf=9e. The missing first DBI line is not proof that the DBI read hung: pc2's line_persist waited for the writer before its USB write, and that wait used a timer. pc3 (revision 822f7a4, image b4e5a5b9...) writes USB first and spins on cntpct_el0 so the next run separates the log wait from the first register access. The iOS 16.5 / xnu-8796 commit 6a5a2d56 reports parf_ltssm 0x111 and an open-network join on the same board; it establishes the hardware sequence, not compatibility with this kernel or OS. This early vote is a verified hardware action, not a link or Wi-Fi result. pc3 then printed 'PCIE 11: about to read dbi ... 0x080c' and never returned; the TWRP read shows slots_written=2 and no step 11. The local CLOCK_VOTES was 0x2f and omitted pipe bit 4; the external same-board success uses 0x3f and records that DBI/IATU/link-block reads never return with bit 4 out while PARF reads work. The fix is CLOCK_VOTES=0x3f plus the DT qcom,ep-latency=10 ms before PERST release (source 73a0080); docs/evidence/2026-11-08-pc3-pipe-clock.md records the round. pc4 (image 900494a9..., console tmp/console-pc42331111.txt, source 73a0080/c93f12f) then ran once: the first DBI read returned 0x20190 and the link came up at 5 ms with ELBI 0x11401, DLLLA bit 29 and endpoint 17cb:10b; step 11 and the step table completed. That is link/endpoint evidence, not Wi-Fi: no BAR, DMA, MSI, firmware, MHI, QMI, QRTR, scan or join. The same boot still did not reach the desktop: DATAMOUNT stage=0, [addon] 0/-1, SUPER own=0, and CORES moved from deaf=00 at t=10 s to deaf=1e at t=30 s as c4 froze after link-up. The probe has no PCIe interrupt owner; source e3d5a6f now masks PARF_INT_ALL before link training (pci-msm.c:4537-4552), and pc5 image f6226e27... is built. A normal control image without pcie= (tmp/boot-norm1.img, e4fa67c2...) is also built to separate a probe-induced stall from the known random one. Neither pc5 nor norm1 has a board result yet.",
  "Of the two clock votes that limit above named as missing, only one was. pcie_phy_refgen_clk is GCC 0x6f02c and every run reads it as 0x1 at step 1, before this file writes anything, so step 9's vote already covered it. pcie_0_ldo is the device tree's name for GCC_PCIE_WIFI_CLKREF_EN (gcc-kona.h:86, clock id 74), whose branch gcc-kona.c:2521 puts at 0x8c004; that one read 0x80000000 (bit 0 clear, branch off) and this file never touched it. Voting it in step 3 turns it to 0x1, and the PARF readings after it (sys_ctrl 0x2000361c, phy_ctrl 0x900, ltssm 0) are identical to the runs without it, so the clock reference reaches the endpoint's side and not the root complex's own registers.",
  "The DBI base is 0 at both candidate offsets, so the v2/v3 layout question does not explain step 10. The v3 tell is real -- 0x358 reads 0x1000000 while 0x16c reads 0 -- but the vendor driver's 0x350 (pci-msm.c:43) reads 0 as well as the mainline 0x168, before and after step 9's zero write. Step 10's hang therefore has neither of the two explanations this area carried.",
  "Step 1 never reads the PARF, the PHY or ELBI: gdscr is 0x22f001 (PWR_ON clear) and axi_misc is 0x4100040 (low six bits zero, not 0x3f), so step_look returns at alioth_pcie.c:272 before those reads. The earlier statement that step 1 read elbi_sys_ctrl was wrong -- elbi has a value line in zero console captures -- so the overlapping elbi/dbi mapping has no evidence behind it either way.",
  "The GPIO write this limit used to say was missing now exists and the limit is not that it is absent. step_endpoint() in package/alioth_pcie.c (from :812) reads both pads first, writes gpio20 as function gpio with pull-up, drive 16 mA and output high, waits the vendor's 1000 us WLAN_ENABLE_DELAY, then writes gpio79 as pull-down, drive 2 mA, output high (which releases the active-low PERST#), waits perst_delay and reads both back, printing HIGH or STILL LOW and RELEASED or STILL ASSERTED. It then reads PARF_LTSSM without writing it, so that a change in link state is attributable to the pads alone. That step has not been run on the board: reference.md:660 still says not to write LTSSM, PERST or WLAN_EN until the read/write path is proven, and the earliest open question is still whether a write inside the controller's windows returns at all. Until step 10 runs, the link has never been asked to train: parf_ltssm reads 0 (LTSSM_DETECT_QUIET) at steps 8, 9 and 10 because nothing ever set the enable bit, not because training was attempted and failed. step_train() at :884 does write that bit, as a read-modify-write that ORs bit 8 in and preserves the state field the way the vendor's msm_pcie_write_mask call does, and it then waits 100 ms and reads PARF back; so the file now carries the write, and what is missing is a run, not the code.",
]
next_action = ["Bring up the QCA6390 MHI boot, then QMI/QRTR and the station path. Order and evidence: first the board platform (reuse the trained link, BAR and MSI of package/alioth_pcie.c; own one SMMU context for the endpoint with the recorded sid base 0x1c00, a DMA window and the WLAN rails), then the build recipe that compiles Linux v7.0.14 ath11k against the Ath12kWifi shim the way zizhan's build-pong-ath11k.py does, then the Darwin 23 network layer. Firmware is already pinned; the addon carries it to /private/var/ngpu/firmware/qca6390. Record firmware start, QMI, WMI_INIT, scan, association, address configuration and traffic as separate results; a link or MHI start is not Wi-Fi."]
evidence = [{ kind = "device", reference = "docs/evidence/2026-11-06-pcie-controller-stage1.md", command = "fastboot boot tmp/boot-p2.img (kernel argument pcie=1) and read the PCIE 1 lines on the USB console", result = "The read-only stage ran and the controller is still fully collapsed after the bootloader: gcc pcie_0_gdscr 0x22f001, pcie_0_axi_misc 0x4100040, slv_axi_halt 0x80000220, mstr_axi_halt 0x80000220, cfg_ahb_halt 0x80000000, aux_halt 0x80000000, pipe_halt 0x80000000, slv_q2a_halt 0x80000000. The halt registers carry bit 31 with only the acknowledge bits set, which is the held-in-reset shape, and the desktop was unaffected (sw=71/71/0).", revision = "c9285a9780b36402771943d289216fdc93d3ecbc" }, { kind = "device", command = "boot a pcie=1 image and read the PCIE 1 lines from the console capture", revision = "dc3ab04aa4b05d38a1c372fa2ec257b3ae8547ce", reference = "docs/evidence/2026-10-28-gpu-wifi-bringup.md", result = "gcc pcie_0_gdscr reads 0x22f001, the value the ios-sweet series recorded for a fully collapsed controller." }, { kind = "device", command = "boot a pcie=2 image and read the PCIE 2 lines from the console capture", revision = "28be364f4dc9223a006770635dbc0f352d230401", reference = "docs/evidence/2026-10-28-gpu-wifi-bringup.md", result = "Writing 0x22f000 reads back 0xf822f000 within a millisecond: the controller has power." }, { kind = "device", command = "boot a pcie=9 pcie_skip=32 image and read the PCIE 9 lines from the console capture", revision = "eeda5a8139786ca8029044708679c40e7382eb1e", reference = "docs/evidence/2026-10-28-gpu-wifi-bringup.md", result = "With pcie_skip=32 the PARF setup completes and parf_mhi_clock_reset_ctrl 0x3 becomes 0x13, matching the reference." }, { kind = "device", command = "boot a pcie=9 pcie_skip=32 image tagged wifi1 and read the PCIE 1/3/8/9 lines from the console capture; the persistent log header confirms tag=wifi1", revision = "db6747c7f97f78b8d445e1c524c40b5ca9ce250b", reference = "docs/evidence/2026-10-28-gpu-wifi-bringup.md", result = "pcie_wifi_clkref reads 0x80000000 at step 1 and 0x1 after step 3's vote, so the device tree's pcie_0_ldo was off and voting it works; pcie0_phy_refgen reads 0x1 at step 1 already, so it was never missing; parf_dbi_base is 0 at both 0x168 and 0x350; parf_ltssm is 0 before and after the init." }]

[[area]]
id = "audio"
status = "planned"
components = []
paths = ["package/*Adsp*", "package/*Apr*", "package/*Audio*", "package/*Gpr*", "package/QcomGlink*", "package/QcomMdt*", "package/QcomSmem*", "package/QcomSmp2p*", "scripts/*adsp*", "scripts/*audio*", "scripts/*gpr*"]
inputs = ["Collected from the vendor device tree (reference/k40-kernel/arch/arm64/boot/dts/vendor/qcom) on 2026-11-06, which is the inventory porting/power asks for before implementation. Codec: WCD938x, referenced as &wcd938x_codec from alioth-audio-overlay.dtsi. Amplifiers: two Cirrus CS35L41 on I2C, cs35l41@40 (speaker) and cs35l41@41 (speaker and receiver), each with its own interrupt GPIO through pinctrl.", "SoundWire and macros, kona-audio.dtsi:36-60: wsa-macro@3240000 carries swr0 (wsa_swr_master), rx-macro@3200000 carries swr1 (rx_swr_master), tx-macro@3220000 carries swr2 (tx_swr_master), and bolero-clk-rsc-mngr owns the codec clock. The microphone path therefore runs through the TX macro and swr2, not through a separate SoundWire controller.", "DSP transport, kona.dtsi:3725-3748: GLINK to the ADSP uses qcom,remote-pid = <2> over transport = \"smem\", mailbox IPCC_CLIENT_LPASS / IPCC_MPROC_SIGNAL_GLINK_QMP delivered as an edge interrupt from ipcc_mproc, with intents 0x800x5, 0x2000x3 and 0x4400x2. Two channels are registered under the lpass label: IPCRTR with QRTR net-id 2, and apr_audio_svc with intents 0x200 x 20 -- 20 intents of 512 bytes, which is APR_MAX_BUF. apr_audio_svc is the APR stack's channel; AudioReach does not use it (see the findings). Reserved memory: pil_adsp_region@8bb00000 for the firmware and smem_region@80900000 for SMEM. A separate voice-mhi-audio node takes mailbox_mem.", "Headset detection is described too: alioth-audio-overlay.dtsi sets qcom,msm-mbhc-usbc-audio-supported = 1 and qcom,uart-audio-sw-gpio = <&sbu_uart_en>, so the USB-C audio switch is a GPIO the port has to own before the codec can be told which path is active.", "The protocol is APR, not GPR/AudioReach, and that is a correction: this board's vendor kernel is Linux 4.19.312 and carries the older APR stack in techpack/audio (include/ipc/apr.h, include/ipc/apr_tal.h, dsp/apr_audio-v2.h), with drivers/soc/qcom/apr.c as the transport. GPR and AudioReach are the newer stack the SM8550 reference board uses; copying its arguments here would name a protocol this firmware does not speak. The GLINK channel the device tree registers is apr_audio_svc, which is APR's service port.", "APR packet, from include/ipc/apr.h: a fixed 20-byte header of hdr_field, pkt_size, src_svc, src_domain, src_port, dest_svc, dest_domain, dest_port, token and opcode. hdr_field carries the message type (0 event, 1 command response, 2 sequenced command, 3 non-sequenced) plus the header length and APR_PKT_VER 0x0. Responses are matched by token, and the two universal opcodes are APR_BASIC_RSP_RESULT 0x000110E8 and APR_RSP_ACCEPTED 0x000100BE. The buffer limit is APR_MAX_BUF 512 bytes, which is the same 512 the reference board's SHENG_ADSP_MAX_MESSAGE carries, so the message-size constraint transfers.", "APR addressing, from the same header: domains SIM 1, PC 2, MODEM 3, ADSP 4 and APPS 5; services TEST_CLIENT 0x2, ADSP_CORE 0x3, AFE 0x4, VSM 0x5, VPM 0x6, ASM 0x7, ADM 0x8, MVM 0x9, CVS 0x0A, CVP 0x0B, USM 0x0C, LSM 0x0D and VIDC 0x16. The path that matters for this board is APPS to ADSP (5 to 4) on AFE 0x4 for the port connection and on ASM 0x7 for the stream, with the AFE port ids named in include/dsp (for example AFE_PORT_ID_INT0_MI2S_RX and AFE_PORT_ID_DIGITAL_MIC_TX for the digital microphone).", "Where the port map is written, from asoc/kona.c: the backend tables are msm_common_dai_links (line 5835), msm_bolero_fe_dai_links (6390), msm_common_misc_fe_dai_links (6408), msm_common_be_dai_links (6583), msm_tdm_be_dai_links (6729) and msm_wcn_be_dai_links (6896). Each entry carries .name (LPASS_BE_*), .cpu_dai_name (\"msm-dai-q6-dev.N\", where N is the AFE port id in decimal), .codec_dai_name and .id (MSM_BACKEND_DAI_*). msm_get_port_id() at kona.c:2807 is the switch that turns .id into the AFE_PORT_ID_* constant, so the two halves of the mapping are in the same file and a path can be read off without guessing. Confirmed numeric ports from include/dsp: PRIMARY_MI2S_RX 0x1000 and TX 0x1001, QUATERNARY_MI2S_RX 0x1006, WSA_CODEC_DMA_RX_0 0xB000 and TX_0 0xB001, VA_CODEC_DMA_TX_0 0xB021. Worked example from the same file: msm_bolero_fe_dai_links at 6390 binds LPASS_BE_WSA_CDC_DMA_TX_0 with .cpu_dai_name = \"msm-dai-cdc-dma-dev.45057\", and 45057 is 0xB001, so a cdc-dma device number is the AFE codec-DMA port in decimal. That is the rule for reading each remaining path.", "The two amplifiers are not codec DAI links at all: kona.c declares them as snd_soc_aux_dev entries, CS35L41_SPEAKER_NAME \"cs35l41.1-0040\" and CS35L41_RECEIVER_NAME \"cs35l41.1-0041\" (asoc/kona.c:100-104, and the aux table uses .dai_name at :128). That is the standard smart-amplifier topology: the amp hangs off the card, and its audio arrives through the codec's path rather than through a backend of its own, so there is no third port to find for the speakers.", "The OS side, read out of the selected kernelcache (out/ipsw/21H461/kernelcache.decompressed) on 2026-11-06. The provider the port has to publish is IOAudio2Device, and the class the OS audio service opens against it is IOAudio2DeviceUserClient; both are present as class-name strings, and the kernelcache is stripped of local symbols so no method list can be read from it directly. The two mechanisms porting/power asks to record are visible by name: clientMemoryForType is the mapped-memory mechanism for the stream buffer (6 occurrences) and registerNotificationPort is the completion mechanism (4).", "The same kernelcache shows that part of this OS's audio path is not IOAudio2 at all: it carries ExclavesAudioDrivers_C.c, ExclavesAudioProxyInterface, ExclavesAudioProxyTightbeam and IISAudioIsolatedStreamECProxy, plus IISAudio,IsolatedStreamHandle. So iOS 17.7.11 has an Exclaves-backed audio proxy layer in addition to IOAudio2Device. The matching question is now answered below, and differently from what this paragraph first suspected: the personalities match on AppleARMIISDevice, and the Exclaves proxies are a separate layer rather than the one the card personalities use.", "Still to collect: the method list and request layout of IOAudio2DeviceUserClient, which needs a disassembly rather than a string read, and which of the two layers this OS's audio service actually drives.", "SHENG_ADSP_MAX_MESSAGE is 512 bytes, and one constraint is not device-specific: CoreAudio assumes a 24 MHz host clock while this SoC's counter is 19.2 MHz, so the audio service must correct that constant rather than inherit it.", "What the OS actually matches on, read from the kernelcache's prelink personalities on 2026-11-06, and it is not IOAudio2 that decides the shape. The com.apple.driver.AppleEmbeddedAudio kext declares a family of personalities whose IOProviderClass is AppleARMIISDevice and whose IONameMatch is a node name of the form audio-data,<role>: aop-mca-loopback, tap, voice, baseband-voice, hawking, virtual-secondary, mikeybus-secondary, haptics-external, audio-loopback, external, maggie-debug, dsp-debug2 and the codec inputs. Their IOClass is AppleSecondaryAudio, with AppleExternalSecondaryAudio and AppleHapticsExternalSecondaryAudio for two of them. AppleSecondaryAudio, AppleARMIISDevice and AppleARMIISAudioDevice are all present in the kernelcache, and AppleARMIICDevice is present the same way for the codec side, so the card and codec classes ship with the OS: the port does not write an audio card class, it supplies an AppleARMIISDevice for the OS to match. That word carries the real work, because AppleARMIISDevice is Apple's driver for Apple's own I2S controller and this SoC's controllers are Qualcomm MI2S blocks, so the provider has to be that class (or a subclass) with the Qualcomm hardware underneath, and the node names have to be audio-data,<role> for the personalities to match at all. Neither dts/alioth.dts nor board.toml has an audio node of any kind today, so that tree is the missing piece.", "I tried that this round and it does not link, which is the most useful thing known about this area. Adding com.apple.driver.AppleEmbeddedAudio to the [kernel.prelink] roots makes the prelink stop at: Kernel target 0xfffffff0078a5c30 has 0 native address candidates: ['_tb_message_complete']. That symbol is Tightbeam, Apple's Exclaves message layer: Apple's own kernelcache exports _tb_message_complete and this kernel exports nothing by that name, so the audio kext cannot bind. Its OSBundleLibraries also name com.apple.driver.AppleEmbeddedAudioLibs and com.apple.iokit.AppleARMIISAudio, and the kernelcache carries com.apple.driver.ExclavesAudioKext beside them. So the Exclaves layer is not an alternative to IOAudio2 that might be bypassed; it is on the dependency path of the audio kext, and the choice for this board is to implement Tightbeam or to write an audio stack that does not use Apple's kexts at all.", "The DSP firmware path already exists in this tree and is not what a reader would guess. package/AdspFirmware.c is a loader, not a blob: it reads adsp.mbn and adsp_dtb.mbn from /private/var/firmware on the mounted Data volume at runtime, and its own header says they are never part of the build, on the caller's thread with plain VFS reads. So an ADSP-side audio provider has a firmware source already wired, and what it does not have is a reader for the image contents, a verification step, or any statement of which adsp.mbn build the board carries. That is the audio area's remaining firmware-service input."]
configuration = ["board.toml carries no audio field yet. porting/power names sheng-audio=4 as the boot-time switch; it is not on this board's command line."]
procedure = ["Collect the inputs listed above from the vendor device tree, the firmware manifest and the vendor audio driver, record each binary's source and version in the firmware inventory, then select the DSP and audio components and run defconfig, status, kernel, payload and bootimg."]
findings = ["No audio code has been written for this board, but the hardware inventory porting/power asks for first is now collected from the vendor device tree and recorded in inputs: codec, amplifiers, the three SoundWire masters and their macros, the GLINK transport to the ADSP with its intents and channels, the two reserved regions, and the headset switch GPIO. What is still missing is the protocol side, which lives in the vendor driver and the kernelcache rather than in a device tree.", "The vendor tree also settles two questions the reference board's record could not answer for this board: the microphone path is the TX macro's swr2 with the WCD938x rather than a separate capture controller, and the speaker amplifiers are I2C parts (CS35L41) rather than SoundWire ones, so they are configured over a different bus than the codec.", "The sheng reference the official page names is not in this workspace's checkout, and that matters for anyone who opens it next. The page pins commit 552b6749 for package/ShengAdsp.h, ShengGpr.h, ShengAudioReach.h, AudioProbe.cpp, ShengCs35l43.c, ShengAudioService.cpp and hal/ShengAudioPlugIn.c. `UniXNU-sheng` is at 516a780, which does not contain those files: 552b6749 is on another branch, so read them with git show 552b6749:<path>, not from the working tree.", "Which sheng layer transfers is now settled by reading both sides. package/ShengAdsp.h is the GLINK transport: sheng_adsp_channel(name, intent_size, intent_count, initiator, client, context) registers a channel, sheng_adsp_send queues at most 512 bytes, and the receive callback runs on the DSP thread. AudioProbe.cpp calls it as sheng_adsp_channel(\"adsp_apps\", 512, 20, 0, ...), which is the same intent geometry this board's device tree gives apr_audio_svc (0x200 x 20), and initiator 0 means sheng answers the DSP's channel open. That layer is transport-only and transfers as written. package/ShengGpr.h is the packet router above it, and it does not transfer.", "The two wire formats differ in every field, so this is not a rename. sheng's GPR header is 24 bytes in six little-endian words: word 0 is version[3:0], header size in words[7:4] = 6, and total packet size in bytes[31:8]; word 1 is destination domain[7:0] and source domain[15:8]; words 2 to 5 are source port, destination port, token and opcode, each 32-bit. APR's header is 20 bytes in five words: a 16-bit hdr_field holding message type[9:8], header size in words[7:4] = 5 and version[3:0]; a separate 16-bit pkt_size; then four 8-bit bytes src_svc, src_domain, dest_svc, dest_domain; then 16-bit src_port and dest_port, then 32-bit token and opcode (include/ipc/apr.h:24-40). So APR has an 8-bit service id per side that GPR does not, APR's ports are 16-bit where GPR's are 32-bit, APR carries a message type that GPR does not, and the packet size lives in a different place in both.", "The opcodes differ too, and that is the part a port cannot paper over. GPR asks the DSP's audio framework manager whether it is ready with GPR_OP_APM_GET_SPF_STATE 0x01001021 and expects GPR_OP_APM_SPF_STATE 0x02001007 with a one-word payload where 1 means ready; its generic result is GPR_OP_BASIC_RESULT 0x02001005 with a two-word {opcode, status} payload. APR's generic result is APR_BASIC_RSP_RESULT 0x000110E8 with the same two-word payload -- q6core.c:267 rejects an empty one and one shorter than 8 bytes -- so the result shape matches and only the opcode number differs. What has no counterpart is the readiness query: this vendor tree carries no SPF_STATE message, because the APM/SPF framework is the AudioReach generation. APR readiness comes from the subsystem state instead: apr_send_pkt refuses to send while apr_get_q6_state() is not APR_SUBSYS_LOADED (apr.c:376-379), and that state arrives from the PIL/SSR side, not from a query. A port that reuses ShengGpr on this firmware would send a query the DSP does not implement.", "The decisive evidence is in the device tree, and it shows the vendor kernel ships both generations for kona. kona-audio-ar.dtsi declares qcom,gpr on GLINK channel adsp_apps with qcom,intents = <0x200 20>, and hangs spf_core, audio-pkt, audio_prm and spf-core-platform under it; kona-arglass.dtsi includes that file. kona-audio.dtsi, which alioth reaches through alioth-audio-overlay.dtsi -> kona-audio-overlay.dtsi, has none of those nodes: it declares qcom,q6core-audio, qcom,bolero-codec and qcom,kona-asoc-snd, which is the APR generation. alioth-sm8250.dtsi:8 includes the APR overlay. The transport geometry is identical in both (512-byte intents, 20 of them), which is why the transport layer transfers and nothing above it does. The channel name is not the same, though: GPR uses adsp_apps and this board's APR uses apr_audio_svc.", "The APR header now exists as code and is checked without a device. package/AprCore.h holds the 20-byte layout as byte offsets rather than a struct, the hdr_field packing of message type, header words and version, and the receive-side validation in the vendor receiver's own order: version above APR_PKT_VER + 1, header shorter than one header, packet size below a header, below the declared header, or above what arrived, then a domain at or above APR_DOMAIN_MAX and a service at or above APR_SVC_MAX. It also carries the two-word {command, status} basic result and the 512-byte limit. package/tests/apr_host.c builds it with -Wall -Wextra -Werror and checks the packing against apr.h's own macro over all 1024 combinations, the offset of every field, each rejection path, the basic result and the buffer edge.", "The transport is adopted and runs both ends without a device. package/QcomGlink.c/.h comes verbatim from `UniXNU-sheng` at commit 552b67499135bae191f415f444d782a6942c252e: it is the native GLINK protocol -- version handshake, channel open and close, receive intents, data with continuation, done -- on a pair of SMEM FIFOs, event driven and allocation free, with the doorbell left to the owner as a callback. It carries no board constant, so it needed no edit for this board: the FIFOs, the remote pid and the doorbell are the caller's, and those come from kona.dtsi. package/tests/glink_host.c links the two directions through one process so each end's transmit is the other's receive, and checks the handshake, the channel open in both roles, the intent exchange, a byte-exact message each way, twenty sends through a FIFO that wraps, the refusal of a payload one byte over the remote intent, the refusal of anything above half the ring, and a corrupt command stopping the link rather than being skipped. A mutation that breaks either the version handshake or the payload copy fails it."]
completion = ["Each declared route carries the selected audio format through playback or capture and handles start/stop correctly."]
limits = ["The APR header codec is written and host-tested; nothing else is. The transport, the DSP session, the codec, the amplifiers, SoundWire and the audio service are all outstanding, and the device tree has no node for any of them.", "The microphone route inputs porting/power lists (codec reset and supply, SoundWire device and TX master, micbias, ADC, decimator, DMA channel, sample rate) are the reference board's; this board's equivalents have to be established from its own vendor tree before they are copied."]
next_action = ["Adopt the transport next. package/QcomGlink.c/.h in `UniXNU-sheng` at commit 552b67499135bae191f415f444d782a6942c252e is the GLINK layer the findings say transfers: read it against this board's numbers before copying, because the addresses in sheng's AdspProbe.cpp are sheng's SoC and this board's are in kona.dtsi:3691-3758 -- remote pid 2, transport smem, IPCC_CLIENT_LPASS signal IPCC_MPROC_SIGNAL_GLINK_QMP, and the two FIFO items AdspProbe names. Register the channel apr_audio_svc, not adsp_apps, with 512-byte intents and 20 of them. Then the first message is against ADSP_CORE, not a readiness query: this firmware reports readiness through the PIL/SSR subsystem state, so the port waits for that state rather than asking the DSP."]
evidence = [
  { kind = "host", reference = "package/tests/apr_host.c", command = "cc -std=c11 -Wall -Wextra -Werror -o apr_host package/tests/apr_host.c && ./apr_host", result = "apr_host: all assertions passed, exit 0. The test checks apr_hdr_field against apr.h's macro over every message type, header size and version, then encodes a real packet and asserts each byte offset, decodes it back field for field, and drives every rejection path in the vendor receiver's order.", revision = "aaadf8b5b4e0ab28863844efeec7751694b9291f" },
]

[[area]]
id = "power"
status = "planned"
components = []
paths = ["package/*Battery*", "package/*Battmgr*", "package/*Power*", "package/*PlatformPower*", "package/QcomQmp*", "package/QcomRpmh*", "package/QcomScm.h", "scripts/*power*", "scripts/*battery*", "scripts/*pmgr*"]
inputs = ["Already in the tree: the EPSS clock domains and their per-domain CPU counts (four, three and one on kona), voted through the qcom-cpufreq-hw-epss register interface that the reference board also uses; the RPMH communication path through AliothRpmhPort; and the platform power service built by build-platform-power.py.", "Battery side, collected from the vendor device tree on 2026-11-06: the charger is pm8150b_charger with qcom,usbpd-phandle = <&pm8150b_pdphy> and qcom,battery-data = <&umi_batterydata> (alioth-sm8250.dtsi:519-536); the profile label umi_batterydata is defined in the sibling board file thyme-sm8250.dtsi:580, and this board also ships three fg-gen4 battery-data files of its own (FMT and GY at 4520 mAh, sun at 5000 mAh), so the gauge is fg-gen4 and the profile in use is the shared one. Two pm8150b GPIOs describe wireless charging: idt,wpc-det and rx,power_good on pm8150b_gpios 7. Charger current readings come from the pm8150b_vadc channels ADC_USB_IN_V_16, ADC_MID_CHG_DIV6 and ADC_USB_IN_I.", "The fuel gauge is not on a firmware protocol at all: it is a pm8150b SPMI peripheral, qcom,fg-gen4, with four 0x100-byte SRAM windows (pm8150b.dtsi:286-350) -- batt-soc at 0x4000, batt-info at 0x4100, rradc at 0x4200, memif at 0x4300. Its notification messages are the block interrupts: soc-update, soc-ready, bsoc-delta, msoc-delta, msoc-low, msoc-empty, msoc-high and msoc-full from batt-soc; vbatt-low, vbatt-pred-delta and esr-delta from batt-info; batt-missing, batt-id, batt-temp-delta, batt-temp-hot and batt-temp-cold from rradc. Every read is paired: the driver reads the value and its shadow copy and retries up to five times until they match (fg-util.c:1014-1050), so a port that reads once will return torn values.", "The units and the sign, from the driver rather than from the header. Current is a 16-bit two's-complement field whose sign bit is bit 15 (fg-util.c:1052, sign_extend32), assembled little-endian and scaled by 488281/1000 to uA on the direct register path, while the SRAM table for IBAT_FINAL uses 488282/1000 -- the two paths differ by one, and a port must pick one and say which. Voltage is scaled 122070/1000 to uV on the direct register path, and the SRAM table's 244141/1000 is exactly twice it, so the SRAM keeps one more bit of the same measurement. State of charge is a raw percentage with no scaling. The SRAM word index for the main fields: IBAT_FINAL 320, VBAT_FINAL 321, ESR 331, OCV 417, VOLTAGE_PRED 432, BATT_SOC 449 (qpnp-fg-gen4.c:143-168).", "Outstanding for thermal and interconnect: the OPP table, regulators, firmware votes and thermal limits, and the peripheral vote ownership and reference counting that must stop dependent DMA and interrupts before a vote is released.", "dts/alioth.dts itself carries only the compatible, memory, the splash region, the eight CPUs and UFS; every battery, charger, gauge and regulator node above is in the vendor tree and has not been carried into this port."]
configuration = ["board.toml: sheng-cpufreq=3 votes every EPSS domain that reads enabled, sheng-pmgr=2 selects the PMGR path. The ADT carries sleep-disabled=1, which porting/power names as required for the watchdog not to trap."]
procedure = ["Boot the image and read the CPU frequency row (panel row 39, native_cpufreq_row) together with the CLK row, which converts the same counter through the device-tree timebase and through CNTFRQ_EL0 and prints both; they agree only if the timebase is right."]
findings = ["CPU frequency and PMGR are implemented and reporting; battery, charging, thermal and interconnect are not. The area therefore stays planned even though part of it works, because the record's completion condition covers battery readings and sleep/resume restoration, neither of which has been measured.", "porting/power's policy inputs are the reference board's (16 ms scheduler sampling, GMU XO busy voting, touch keeping the P domain and GPU at maximum, the GPU resume boost). They are policy for SM8550 with that board's GPU and touch stack and are not transferable verbatim; this board has no GMU HFI vote path and no battery service.", "The gauge's decoder now exists and is checked without a device, which is the one piece of the battery half that can be finished offline. package/BatteryCore.h holds the four SPMI blocks and their PPIDs (sid 2, peripherals 0x40 to 0x43, so PPIDs 0x240 to 0x243), the batt-info register offsets with the v1.1 byte-order swap fg-reg.h warns about, and both decode paths: the direct registers at 122.070 uV and 488.281 uA per count with the current sign-extended from bit 15, and the SRAM at 244141 and 488282. The header also pins the trap that the same raw count 0x4000 reads as 4 V through the SRAM and 2 V through the registers, which is how a port knows it has picked the wrong path. package/tests/battery_host.c builds it with -Wall -Wextra -Werror and asserts every constant against the vendor sources.", "The paired read is now written and host-tested too, and the vendor implementation it was copied from is wrong in both directions. Every measurement must be read as a value plus its shadow copy six bytes later, retried until the two agree (fg-util.c:1014-1050), because the gauge updates between the two bus accesses. The vendor loop -- `while (tries++ < MAX_READ_TRIES) { ...; if (match) break; }` then `if (tries == MAX_READ_TRIES) return -EINVAL;` -- leaves tries at 6 when the copies never agree, so a torn pair falls out of the loop and is returned as a good value, and leaves tries at 5 when the fifth and last try matches, so a good read is reported as -EINVAL. package/BatteryCore.h implements the intent instead: a counted loop of BG_PAIR_TRIES (the driver's own 5) that fails when no try agrees. package/tests/battery_host.c reproduces the vendor loop and asserts both defects, then drives the port's own loop through a scripted bus: a clean first try, a torn first try, a match only on the last allowed try, copies that never agree, and a bus error that must abort without spending the remaining tries.", "2026-11-08: scripts/build-platform-power.py replaces the kernelcache symlink instead of creating it twice. A broken link made exists() false and the second build raised FileExistsError. The generated PMGR contract is unchanged."]
completion = ["Declared power controls and battery readings match observations; each claimed sleep/resume transition restores its dependent peripherals."]
limits = ["Battery, charging, thermal and interconnect are unimplemented. The gauge's decoder is the exception: it is written and host-tested, but no code reads the gauge on the device yet, so there is no reading of this board's battery, and none of the battery, charger or thermal nodes is in this board's own device tree.", "Sleep and resume are not claimed: the ADT sets sleep-disabled=1 and no round has exercised a sleep transition, so the completion condition's second half has no evidence either way."]
next_action = ["Read the gauge once on the device and print what came back, which is the smallest step that tests everything in BatteryCore.h at once: find the APID for PPID 0x241, read 0xA0, 0xA1 and their copies 0xA6, 0xA7 until the pair agrees, decode, and print the raw bytes beside the decoded microvolts. A plausible voltage settles the byte order, the scaling and the APID rule together; an implausible one says which of the three is wrong, because the raw bytes are printed next to it. The IOPMPowerSource service comes after that reading, not before."]
evidence = [
  { kind = "host", reference = "package/tests/battery_host.c", command = "cc -std=c11 -Wall -Wextra -Werror -o battery_host package/tests/battery_host.c && ./battery_host", result = "battery_host: all assertions passed, exit 0. The test derives the PPIDs from the devicetree's own interrupt specifiers rather than from the header it checks, and pins the two decode paths apart: raw 0x4000 decodes to 4000006 uV through the SRAM and 1999994 uV through the registers. It also reproduces the vendor retry loop and asserts its two defects, and drives the port's own paired read through a scripted bus: a clean read, a torn read that the second try fixes, a match on the last allowed try, copies that never agree, and a bus error that aborts after one read.", revision = "fe3b945239e466ca42d265afdeaa54599577ae13" },
]

[[area]]
id = "packaging"
status = "device-verified"
components = ["DarwinBoot", "XnuPrelink"]
paths = ["scripts/*payload*", "scripts/*image*", "scripts/*flash*", "scripts/check-payload-kernel.py", "scripts/build-round.sh", "scripts/*usb*", "patches/**"]
inputs = [
  "The prelinked kernel from build kernel, the firmware volume from build firmware, the device tree the bootloader reads (uefi-alioth/Resources/DTBs/alioth.dtb, 933,795 bytes, not the 3 KB hardware DTB the ADT is built from), and the target IPSW's trust cache.",
  "Inputs that are not in any repository: the Data seed (--data-ramdisk), the platform seed (--unique-chip-id, board.toml marks it required), and optionally a GPU addon (--gpu-addon).",
  "The board's own inputs: 3 MiB firmware volume at 0x9FC00000, 180 MiB payload volume, boot_a and boot_b at 192 MiB each, and a kernel command line of 952 bytes on 2026-11-06 against unixnu's 1023-byte limit. The limit is enforced by the payload step, which prints the measured length; the build script appends sheng-build-tag, so the script's own count is 19 bytes short.",
]
configuration = [
  "[payload]: volume ALIOTHESP, size_mib 180, loader firmware, title Boot, dram_size 0x200000000, skip_setup_tool scripts/seed-data-skip-setup.py. payload.py refuses content above 95 percent of size_mib, which is 171 MiB.",
  "size_mib history: 192 does not fit with the shim, the FD and the appended device tree; 184 leaves less than the 8 MiB margin; 176 is what the archived port booted; 180 since the Metal staging took the payload files to 168 MiB.",
  "[payload] trust_cache_sha256 names one accepted bundle, the three-module owner bundle make-owner-trust-bundle.py builds from the two original 21H461 modules plus the Metal plugin's CDHash. payload.py refuses any other --trust-cache. The value changes on every plugin rebuild and must be rewritten from 'shasum -a 256 build/adreno-metal-plugin/owner-trust.bundle' after make-owner-trust-bundle.py; it was 35684e79c41f8e76 on 2026-11-06.",
  "[payload] panic_screen true patches the panic screen into a copy of the kernel. It shares the zero padding after _start with one stage-4 probe cave, and a third cave pushes the screen past PANIC_CAVE_END, which scripts/patch-xnu-entry-probe.py then refuses.",
  "boot image geometry comes from uefi-alioth/Resources/Configs/alioth.toml, not board.toml: header_version 1, base 0x10000000, kernel_offset 0x8000, ramdisk_offset 0x16000000, tags_offset 0x100, pagesize 2048. scripts/check-alioth.py refuses any other value.",
]
procedure = [
  "./unixnu defconfig alioth_defconfig -D ../UniXNU-alioth, then ./unixnu build kernel -D ../UniXNU-alioth --local-module driver:ShengUfs=../NativeUfs-alioth --local-module driver:ArmCpu=../ArmCpu-alioth.",
  "./unixnu build payload -D ../UniXNU-alioth --uefi ../uefi-alioth --unique-chip-id 0xe835c44a614a1914 --trust-cache <owner bundle> --data-ramdisk <seed> --gpu-addon <addon> --kernel-arg sheng-build-tag=uNNN.",
  "./unixnu bootimg -D ../UniXNU-alioth --uefi ../uefi-alioth --dtb ../uefi-alioth/Resources/DTBs/alioth.dtb -o tmp/boot-uNNN.img.",
  "python3 scripts/check-payload-kernel.py --kernel out/DEVICE/OS/CONFIG/kernel/kernel.macho --image tmp/boot-uNNN.img, which must exit 0 before the image is flashed.",
  "fastboot boot tmp/boot-uNNN.img, which loads the image into RAM and writes no slot; a flash goes to boot_b. Read boot/boot.json and payload/payload.json for the hashes of the parts actually packed.",
]
findings = [
  "patches/xnu/series carries one board patch, thread-creation-trail.patch, which records every kernel thread's tid and creation continuation in a 256-entry table that the boot package reads. It is how a stopped core's thread is named when the thread has no name of its own. The patch touches only osfmk/kern/thread.c and adds no behaviour when the table is unread.",
  "2026-11-08: the round build moved from tmp/build-parity.sh into scripts/build-round.sh, and scripts/build-alioth-usb.py names the base catalog without a workspace prefix. The kernel, payload and boot image keep the same inputs and steps.",
  "2026-11-08: board.toml trust_cache_sha256 changed from f5449ea4... to c2b71ada8e5c476d8895f02625d80c43699cc697b8ca48ed9f6f80473eab481e after the rebuilt Metal plugin and its owner trust bundle (plugin CDHash cddc5705, daemon CDHash 3bdcdfff, Turnip CDHash a9c5a07a). This pins the exact bundle accepted by payload.py; rebuilds must update both the hash and this finding. The trust bundle itself is not tracked as a binary input.",
  "The XNU kernel does not live in boot.img's kernel section. That section is the boot shim plus the UEFI firmware volume, gzipped, followed by the device tree; the kernel travels inside the payload ramdisk at EFI/UniXNU/Payloads/kernel.macho. Running build kernel and then bootimg without build payload therefore packs the previous kernel, and the device boots and looks healthy on stale code. That is what boot-usb65 did.",
  "check-payload-kernel.py closes that hole by checking both links: payload.json kernel_sha256 against the built kernel, and the kernel inside the image against payload.json payload_kernel_sha256. The two payload hashes differ from each other because build payload patches a staged copy of the kernel. Measured 2026-10-30: the check refuses boot-u269, whose payload carries a kernel the current payload record does not name, which is exactly the staleness it exists to catch.",
  "The two reports name different things under the same key. boot.json kernel_sha256 (bootimg.py:134) is the hash of the gzip kernel section, which is the boot shim plus the firmware volume plus the appended device tree; payload.json kernel_sha256 is the prelinked XNU Mach-O. Comparing them across files says nothing. Read payload.json for the kernel, the ADT, the trust cache and the seed, and boot.json only for the header geometry, the FD and the ramdisk size.",
  "The kernel command line is 987 bytes against a 1000-byte limit, so adding an argument means removing one. payload.py refuses a longer line before it writes the volume, and --kernel-arg NAME=VALUE replaces the board's argument of the same name instead of appending a second copy.",
  "The device tree that bootimg packs must be uefi-alioth/Resources/DTBs/alioth.dtb (933,795 bytes), not the dtc output of dts/alioth.dts (3,218 bytes). The small tree is the hardware input the ADT is generated from; the bootloader needs the firmware tree, which is the phone's own. Passing the small one produced an image that never reached the kernel.",
  "bootimg verifies its own output: it unpacks the image and compares the gzip stream, the firmware volume, the appended device tree and the ramdisk bytes with their inputs, and refuses a firmware volume whose size differs from [uefi_fd]. The output is deterministic apart from the ADT's random seed.",
]
completion = [
  "The kernel and prelink succeed, the payload contains all declared inputs, and the boot image matches the bootloader format and the 192 MiB partition limit.",
  "Measured on the device: the image booted from fastboot, reached the lock screen at about 104 s, and the same build path has produced every image since, through the one that first published the GPU accelerator.",
]
limits = [
  "The build inputs that no repository carries are passed on the command line every time: --unique-chip-id, --trust-cache, --data-ramdisk and --gpu-addon. A checkout alone cannot rebuild a given image byte for byte.",
  "The payload volume is 180 MiB against a 192 MiB partition and the kernel command line has 13 bytes of head room, so the next added argument or asset needs something removed first.",
  "The images at the end of the run have not all been booted: four in a row (u268, u269 twice, u271) failed to reach the kernel through fastboot boot while the same u269 image reached the GPU after a manual power cycle, and that load path is not yet attributed.",
]
next_action = [
  "Boot the next image and read the BUILD row to confirm the console now carries the image's own tag; that closes the identity half of the fastboot question, which until 2026-11-06 could not be answered from a console capture at all.",
  "Attribute the remaining fastboot boot failures: with the tag on the console, a boot that dies before the kernel still has no tag, so the four-in-a-row u268/u269/u271 case needs the firmware side rather than the kernel side.",
]
evidence = [
  { kind = "source", reference = "scripts/check-payload-kernel.py", result = "Refuses a boot image whose payload was not rebuilt from the kernel just built, by checking the record against the build and the image against the record; it refused boot-u269 on 2026-10-30." },
  { kind = "device", reference = "docs/evidence/2026-10-27-boot-diagnostics.md", command = "./unixnu build kernel; ./unixnu build payload; ./unixnu bootimg; fastboot boot the image; photograph the panel and read the console", revision = "c207f91df6000038aac1b91f002a857c07de3b40", result = "boot-usb34 reached a stable lock screen: the date and time stayed drawn, SWAP calls=7 ok=7 rej=0, and backboardd created its resources with kret=0 -- the image assembly path produced a bootable image." },
  { kind = "device", reference = "docs/evidence/2026-11-06-per-core-interrupts-and-touch-wakeup.md", command = "fastboot boot tmp/boot-s14.img and read the USB console for the first seconds", revision = "ab53842422feadf058a0575b6e5a968623c6c052", result = "BUILD tag=s14 on the console within the first second, at t=1 s of the boot supervisor. Until this row existed no console capture could say which image it came from: the tag reached only the persistent-log header and the boot page." },
]

[[area]]
id = "diagnostics"
status = "device-verified"
components = ["QcomXnuUsbDebug"]
paths = ["scripts/check-*", "scripts/probe-*", "scripts/audit-*", "scripts/read-*", "scripts/prepare-*", "scripts/decode-*", "scripts/run-host-tests.sh", "scripts/sheng-*", "scripts/*latency*", "scripts/data/**", "package/tests/**", "package/*Tests*", "package/*Diagnostic*", "package/*Probe*", "package/Boot*", "package/linux-log/**", "unixnu.lock", "scripts/run-sheng-unattended.sh", "docs/evidence/**"]
inputs = [
  "The board's DWC3 controller, its apps SMMU stream, and the boot arguments qcom-usb-debug=1 and qcom-usb-ctl=1 in board.toml.",
  "The diagnostic page is boot-progress=2 with boot-diag-resume=10, so it returns after scanout stops.",
]
configuration = [
  "board.toml selects the QcomXnuUsbDebug component and passes qcom-usb-debug=1 and qcom-usb-ctl=1.",
  "configs/alioth_defconfig sets CONFIG_XNU_BOOT_PROGRESS=y and CONFIG_XNU_QCOM_USB_DEBUG=y.",
  "The apps SMMU is iommu@15000000 with qcom,skip-init; the USB node's iommus = <0x47 0x00 0x00> gives SID 0.",
]
procedure = [
  "./unixnu build kernel, then build payload and bootimg, then fastboot flash boot_b.",
  "Read the console at /dev/tty.usbmodem<N> with a raw 115200 8N1 tty; the dock's SN234567892 node is not the phone.",
  "Control frames are SXNU1 <16 hex session> <8 hex seq> <VERB> <8 hex crc32>, HELLO first to learn the session.",
  "One unattended round is scripts/run-sheng-unattended.sh <image> [timeout]: fastboot boot the image, wait for the board's own return, boot the reader from slot a, read and decode into build/sheng-logs/<tag>-<boot id>/, then restore the slot. Fail-closed, and the timeout must exceed sheng-autoreset by 60 s.",
]
findings = [
  "A stopped core is now named from the console without a debugger. The GICR row carries the trapped user PC and CPSR of the thread that core holds, the group and priority of every core's SGIs and PPIs, and a GICRKT line with that thread's creation continuation from patches/xnu/thread-creation-trail.patch; armcpu_ipi_probe_core samples a core that takes no interrupts of its own. Two readings settled the question this was built for: the deaf core's thread has pr=31 and no name (the init thread inside its first exec of launchd, not a kernel probe), and its IGROUPR0/IPRIORITYR0 match every healthy core, so a masked section rather than the GIC withholds the interrupt.",
  "package/tests/adt_properties_host.py covers scripts/check-adt-properties.py: one fixture node carrying a non-writable key must fail with that key named, one carrying only writable keys must pass. The checker runs the real read_fdt and hardware_properties path, so the test exercises the omission rather than a mock of it.",
  "Four images in a row failed to reach the kernel through fastboot boot (u268, u269 twice, u271) while the same u269 image reached the GPU and the wallpaper after a manual power cycle. The four span different contents -- two carried timer rows, one was rebuilt without them, one differs by a single driver string -- so the content is not what decides it. What all four share is the load path: fastboot boot has the bootloader pull 182.4 MB over USB into memory and jump to it, while a power cycle reads the active slot from flash. Whether the board then runs the slot image rather than the booted one is unverified; the persistent log's tag field would say, and reading it needs a boot that reaches the kernel.",
  "The timer rows were withdrawn the same day they were added. Two images carried them and both failed to reach a usable kernel, so they came out; but the same image booted to the GPU and the wallpaper after a manual power cycle, so the rows were not shown to be the cause and the withdrawal is a control, not a verdict. The instrument itself is sound: ArmCpu already counts the virtual timer's lead and its short deadlines, and re-adding it needs a boot that survives regardless.",
  "The persistent log kept the oldest 128 KiB of the kernel message buffer, not the newest: copy_msgbuf started at msg_bufx, the ring's oldest byte, and stopped at the region's limit, so every read-back carried the start of the boot and dropped the seconds before a crash -- the only window an abort diagnosis needs. Every header from u250 to u255 reports msg_bytes 131072, which is the cap, not the buffer. u259 starts at msg_bufx + size - cap instead; its msgbuf covers a later slice of the kernel log than u258's on the same image family (986..1126 s against 516..638 s).",
  "The CDC-ACM console refused to start with error=10 core=0 domain=5. QcomUsbDomainInstall calls halted() before scan(), so a PRTCAPDIR of 3 would have returned CoreRunning=4; it returned 5, which proves the controller already reported device mode.",
  "Firmware leaves an SMR entry for SID 0 pointing at context bank 5 with SCTLR=0xe0 (M=0) and TTBR0=0: the stream is programmed but no table exists under it. scan() now reclaims that slot only when translation is off and there is no table, and still refuses a bank that holds a live mapping.",
  "With that, the console enumerates as 1209:316d named QcomXnuUsbDebug and the kernel log is readable on the host. It is the only channel that keeps a record after the panel has moved on.",
  "printf and kprintf both fail to reach the console: a DEVELOPMENT kernel leaves disable_kprintf_output true without -enable_kprintf_spam, and printf's console path did not reach the _cnputs tee either. qcom_usb_debug_write() is the entry point that works.",
  "Exit records measured over 420 s: 180 xpcproxy exits with status=0 (normal fork and exit), 13 cryptexd SIGABRT with ns=18 code=2 (OS_REASON_LIBSYSTEM_CODE_FAULT), 11 liveactivitiesd SIGTRAP, 2 lsd SIGSEGV. Each process crashes at one fixed PC repeated, so the fault is deterministic rather than a race.",
  "A software REBOOT via the control channel is acknowledged (state=queued) but does not reach fastboot: the worker calls reboot_kernel(0, NULL), an orderly restart that unmounts every filesystem and returns through UEFI. Entering fastboot needs the ABL IMEM handshake, whose address is not measured here.",
  "The persistent log writer runs: boot-usb101 recorded 273 rounds over 546 s with zero write errors after the console had already stopped, so the medium is the only record past the link's death.",
  "Returning to fastboot works with sheng-log=1 and sheng-autoreset=<seconds> together: boot-usb102 rebooted at 153 s and boot-usb103 at 120 s, both landing in the board's own bootloader with the PON spare cell written ('pon: subtype 04 shift 1 spare 00 -> 04 want 04 rc=0 ok pon_rc=0') and IMEM reading the reason back (known=1). PSCI alone cannot do it: SYSTEM_RESET, SYSTEM_RESET2(32) and SYSTEM_RESET2(64) all report NOT_SUPPORTED, so PS_HOLD is the path that works.",
  "The reader must seek relative to the partition: /dev/block/by-name/userdata starts at LBA 0x2a8000, so the window's last 8192 blocks are skip=59086843, not the absolute LBA 61872123 the header records. Passing the absolute value reads nothing at all and looks like a hung read.",
  "The console's death is a latch, not a transient: dwc3_poll() returns -1 forever once d->failed is set (Dwc3.c:570/581/584), and nothing in the driver clears it, so the worker's retry path cannot revive the link.",
  "The takeover pixel probe is opt-in through alioth-pixel-check=1 and runs on the published backboardd device with owned private, RGBA/BGRA IOSurface, composition and 1080x2400 BGRA fixtures. CPU and GPU readback are checked independently against exact expected pixels. Reserved Metal rows 46/47 are printed explicitly. The older two-word surface mutation is disabled unless alioth-surface-magic is requested; surviving words never prove an untouched whole frame.",
  "cpx2 (2026-11-05) fails ordinary owned-buffer fill, creation-upload copy and contents-written copy as well as private clear, compute and render. Destinations retain A5/5A sentinels despite Completed status. Actual TU_DEBUG is sysmem,nocb; A650 APRIV reads 0x6e and CPU table mode is 1. This is a generic effective-write failure, not proof of a CA, host-import, format or cache cause. No desktop status is promoted. The exact artifact hashes and raw console are recorded in the workspace takeover progress.",
  "The row sender previously skipped the terminator after an odd-length character pair, leaking stale suffix bytes into diagnostics. NativeAdrenoUserTest.h now stops after that pair; tests/test_marker_stream.py compiles the actual sender and verifies 96 text lengths plus an invalid row. The red run failed at length 1 (48 markers instead of 2); the fixed run passes. This is separate from the unresolved GPU pixel failure.",
  "2026-11-08: the poster-store listing and first-page SQLite text runs now fire once at the 200-exec cadence without sheng-wallpaper-db=1 or sheng-wp=1, and BootLog prints [wallpaper list] and [wallpaper db] on the 10-tick console channel. This measures whether PosterBoard has a stored selection on a boot that never reaches the desktop. The widget host is already running on the iPadOS 17 line: align1 unified logs contain com.apple.chronod.timeline-host entries for Maps, Stocks, Calendar, Batteries, ScreenTime, News, Notes and Tips widgets. The iOS 16.5 port's missing com.apple.chronod finding is therefore not a current-line diagnosis. Both rows are diagnostic code; no visual wallpaper/widget result is promoted.",
]
completion = [
  "The console enumerates and answers HELLO and STATUS on the board; STATUS reports usb=3 er=0.",
  "Every process exit and crash reaches the host console, which is what the exit-loop investigation needs.",
]
limits = [
  "cryptexd's fault is not yet attributed: OWNER_CRYPTEX_FILES is 0 by design because UNION_SYSTEMOS requires it off, so cryptexd's expected paths do not exist. Its crash PC is captured but not symbolicated.",
  "The MAC exec refusal is intermittent. One boot showed backboardd, imagent, lockdownd, cfprefsd, sharingd and nfcd exiting with status=9 ns=9 code=8; the next showed none of them, so the errno the patch now reports has not been observed yet.",
  "Symbolication of the crash PCs against the extracted dyld shared cache was attempted and produced implausible image names, so it is not reported as a result.",
  "The iOS USB device stack is not in this kernel: the prelinked component list carries no USB kext (IOUSBDeviceFamily, AppleUSBDeviceMux, AppleEmbeddedUSB, AppleSynopsysOTGDevice all count 0 in out/<device>/kernel/kernel.macho), and the ADT has no usb-complex, usb-device or otgphyctrl node. The board's only USB path is QcomXnuUsbDebug, a self-written CDC-ACM console that owns the DWC3 controller. docs/evidence/2026-10-30-usb-stack-architecture.md records the chain and the two implementation constraints: devicetree.py emits platform nodes only for a fixed name list, so [adt.*] cannot add a usb node (it needs a DTS node with unixnu,adt-name), and IONameMatch is exact string equality against the node name, not a compatible-list match. An offline prelink with four USB roots added resolves and links (components 30 to 42, exit 0, AppleNubSynopsysOTGDevice present); runtime behaviour is unverified, and t7000 versus SM8250 register offsets and PHY topology have not been compared.",
  "usbmuxd is a host-side daemon, not a device component. macOS runs it at /var/run/usbmuxd from MobileDevice.framework, and the device-side peer is lockdownd, which listens on TCP 62078 (com.apple.mobile.lockdown.plist Sockets). The kernel AppleUSBDeviceMux is a client: sock_connect appears twice in its code and sock_bind, sock_listen and sock_accept appear zero times. An earlier analysis treated the absence of usbmuxd from the root volume as a hard blocker; that conclusion is withdrawn.",
  "installd is not running on the board, and the usual count of processes is wrong. EXITLOG records only process exits (BootProgress.c boot_progress_exit), so it cannot enumerate running daemons: u266's EXITLOG yields 37 distinct names while its [spawn] census reports names=233. That census lists containermanagerd, misagent, appstored and lockdownd but not installd or afcd. com.apple.mobile.installd.plist carries MachServices and no RunAtLoad, so the job starts on demand; the board has not asked for it. Diagnosing why needs userspace os_log, which has no channel today.",
  "The Device documentation workflow fails on every push with 'unknown component QcomXnuUsbDebug'. The workflow reuses UniXNU/UniXNU's checker at main, whose catalog lists 25 components, all from the UniXNU organisation; QcomXnuUsbDebug is this port's own CDC-ACM console and exists only in the FFT-infra fork of the base repository. The checker tests 'component in catalog or allow_custom_components' and never passes the second argument. Locally the check passes because the fork's components.toml carries the entry. Resolving it needs a decision: contribute the component upstream, move the repository into the UniXNU organisation, or accept the red check. The record itself is not wrong; only the component's absence from the upstream catalog is.",
]
next_action = [
  "Make the console survive its first error: clear d->failed and re-initialise the controller from the worker, with backoff, and draw the worker's retry and error counters on the diagnostic page so the failure is readable without the link it is about.",
  "Attribute cryptexd's fault, then decide whether the fix is a stub, a mount change, or accepting the crash.",
  "Wait for the MAC refusal to reproduce and read the ip_mac_return value it now prints.",
]
evidence = [
  { kind = "device", reference = "docs/evidence/2026-10-27-boot-diagnostics.md", command = "read /dev/tty.usbmodem<N> at 115200 8N1 and send SXNU1 ... HELLO / STATUS", revision = "15a15d7cc526262a64531ff56b3a33bdbc46379c", result = "Console enumerated as 1209:316d named QcomXnuUsbDebug; STATUS returned usb=3 er=0 with the worker polling, so the port is live in both directions." },
  { kind = "device", reference = "docs/evidence/2026-10-27-serial-exit-records.log", command = "./unixnu build kernel; ./unixnu bootimg; fastboot flash boot_b; read the CDC-ACM console for 420 s", revision = "15a15d7cc526262a64531ff56b3a33bdbc46379c", result = "215 exit records captured. 180 xpcproxy status=0 (normal), 13 cryptexd ns=18 code=2, 11 liveactivitiesd sig5, 2 lsd sig11; each process repeats one fixed crash PC, so the faults are deterministic." },
]

[[area]]
id = "baseband"
status = "planned"
components = []
paths = ["package/*Baseband*", "package/*Modem*", "package/*Bhi*", "package/*Qmi*", "package/*Qrtr*", "scripts/*baseband*", "scripts/*modem*"]
inputs = ["porting/baseband asks for these before implementation and none of them is in the tree: the modem model and its control transport, data engine, firmware, SIM interface and EFS/NV storage, after platform memory and DMA work.", "What the vendor tree does and does not describe, checked across the whole qcom directory on 2026-11-06. Every other SoC in this tree carries a modem: bengal, khaje, lagoon, lito and msm8917 each declare qcom,firmware-name = \"modem\" and a GLINK edge qcom,glink-label = \"mpss\". kona declares neither, and its GLINK edges are cdsp, dsps, lpass, npu and spss only, so on this SoC the AP does not load the modem and has no mpss GLINK edge to it. What kona does describe is the packet path: qcom,ipa@1e00000 with IPA core version 17 (IPAv4.5), reg-names ipa-base 0x1e00000 length 0x84000 and gsi-base 0x1e04000 length 0x23000, interrupts 311 and 432, qcom,use-ipa-tethering-bridge, qcom,mhi-event-ring-id-limits = <9 11>, qcom,modem-cfg-emb-pipe-flt, qcom,arm-smmu and qcom,smmu-fast-map, with qcom,ipa_fws and qcom,ipa_uc as pil-tz-generic loaders over their own memory regions and qcom,ipa-mpm holding the modem MHI doorbell bases 0x64300300 and 0x64300700 (kona.dtsi:3557-3600). IPA is therefore the only recorded AP-to-modem interface on this board, and it is a data path rather than a control one. The earlier note that alioth-sm8250.dtsi and alioth-sm8250-overlay.dts carry no modem node was true of those two files and misleading as a conclusion, because they inherit kona.dtsi, which does carry the IPA; dts/alioth.dts declares only the compatible, memory, the splash region, the eight CPUs and UFS, with no /chosen baseband node, no /baseband node, no baseband-chipset property and no cellular ADT product attribute. So there is nothing for launchd to select a cellular CommCenter with, and the vendor tree does not supply the description either.", "Firmware provenance has no entry, and the manifest is emptier than that sentence suggested: proprietary-files.txt is 32 comment lines and not one entry, so it records no firmware of any kind, not merely no modem image. What the board does carry follows two other paths, both worth naming before a modem is planned. GpuFirmwareA650.c compiles 262795 bytes of A650 firmware into the kernel, generated from the archive's redwood_fw_a650.c. AdspFirmware.c is not a blob at all: it reads adsp.mbn and adsp_dtb.mbn from /private/var/firmware on the mounted Data volume at runtime, and its header says they are never part of the build. So this board's firmware story is compile-in plus runtime-read-from-Data, and a modem image would have to pick one of those two, with its source and hash recorded, before the page's provenance requirement is met."]
configuration = ["No board.toml field, DTS property or defconfig value is set for baseband."]
procedure = ["Establish the modem's power, reset, clock, interconnect request, interrupt, firmware memory and SMMU stream, then bring up the transport, confirm the modem boot and the SMP2P ready signal, and only then add the cellular ADT nodes and product attributes."]
findings = ["Nothing has been started, and the record did not previously carry this area at all: porting/baseband is on the site's navigation and the port is of a phone, so the omission was a coverage gap rather than a decision. Recording it as planned makes the gap visible to the checker and to the catalog."]
completion = ["Modem boot, QMI, SIM identity, network registration, data, reset and eSIM are each recorded separately, and the data path passes send, receive, disconnect, aeroplane mode and modem reset in order."]
limits = ["No modem firmware, no ADT node, and no control transport: the AP-side data path is IPA and nothing in the vendor tree gives the AP a GLINK edge or a loader for the modem itself. The board is a phone, so this is pending work rather than something outside the device's scope."]
next_action = ["Get the modem firmware off the stock firmware and record its source and hash. The tree has now given what it can: the AP-side transport is IPA v4.5 with the modem's MHI doorbells, there is no modem PIL node and no mpss GLINK edge on kona, and the firmware manifest is empty, so the image itself is the one input no source in this workspace holds. Reading it from NON-HLOS.bin on a stock device is a read, not a port, and it is the gate for everything after it."]

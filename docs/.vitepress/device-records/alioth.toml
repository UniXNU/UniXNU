[[area]]
id = "bluetooth"
status = "planned"
components = []
paths = ["package/*Bt*", "package/*Bluetooth*", "kits/*bt*", "scripts/*bt*", "scripts/*bluetooth*"]
inputs = ["The controller is the same QCA6390 as the Wi-Fi: the SoC board device trees declare a bluetooth label over a bt_qca6390 node (kona-mtp.dtsi:154 and the other kona board files), and alioth-sm8250.dtsi:1110 only overrides its supply, qca,bt-vdd-dig-supply = <&pm8150_s6> at 950 mV, which is the same rail the WLAN node uses. So one part provides both radios, and the network area's 17cb:1101 endpoint is the same silicon.", "Not yet recorded: which transport carries the host-controller interface on this board, the firmware and .nvm/.hcd files, and whether the same PCIe link is shared. The board device tree does not add a transport node of its own beyond the supply override.", "The boot argument alioth-bt=1 is not Bluetooth. It is read by ButtonProbe.cpp:358, names the thread 'alioth-bt' for the buttons, and reads the PM8150 PON and PM8150 GPIO 6 keys over SMBus. The name is a shortening of 'buttons' and must not be read as a Bluetooth switch.", "The transport is settled, and the property that settles it is one no other UART carries. qupv3_se6_4uart is compatible qcom,msm-geni-serial-hs at 0x998000 length 0x4000, fed by GCC_QUPV3_WRAP0_S6_CLK with the wrap-0 master and slave AHB clocks, taking GIC SPI 607 plus a tlmm 19 wake line on four pins (gpio16 sleep, gpio17 and gpio19, gpio18 flow control), and it is the only serial engine in the tree with qcom,wakeup-byte = <0xFD> (kona-qupv3.dtsi:85-105). That byte is the Bluetooth HCI wakeup, and the board enables this engine and no other four-wire one (xiaomi-sm8250-common.dtsi:16-18). The other enabled UART, qupv3_se12_2uart, is two-wire and stays the console candidate.", "The qca,qca6390 node is the power driver's, not the host-controller node, and that is why it has no UART phandle: drivers/bluetooth/bluetooth-power.c lists that compatible at :48 and reads bt-reset-gpio, wl-reset-gpio and bt-sw-ctrl-gpio. Its rails and levels are exact (kona-mtp.dtsi:154-174): BT_EN on tlmm 21, WL_EN on tlmm 20 which is the same pad the Wi-Fi bring-up drives, SW_CTRL on tlmm 124, vdd-aon pm8150_s6 at 950 mV, vdd-dig pm8009_s2 at 950-952 mV, vdd-rfa1 pm8150_s5 at 1.9 V, vdd-rfa2 pm8150a_s8 at 1.35 V and vdd-asd pm8150_l16 at 3.024-3.304 V drawing 10 mA. The firmware names come from the driver's own format strings (btqca.c:354-376): qca/crbtfw%02x.tlv and qca/crnv%02x.bin keyed on the ROM version, with qca/rampatch_%08x.bin and qca/nvm_%08x.bin keyed on the SoC version as the fallback. What the ROM version of this particular chip is, and whether either file exists on the stock firmware, is not recorded here."]
configuration = ["board.toml: alioth-bt=1 selects the button probe, which belongs to the input area."]
procedure = ["Identify the controller and its transport first, then record the firmware and the OS Bluetooth ABI before selecting a component."]
findings = ["The area was missing from the record although the site's navigation carries Bluetooth, and the one argument whose name suggests it is a button probe. Both facts are recorded here so a later reader does not mistake the existing argument for partial Bluetooth support.", "The controller turned out to be the Wi-Fi part rather than an unknown: QCA6390 provides both radios, so this area cannot be brought up before the PCIe link in the network area trains, and the two share the pm8150_s6 rail. That ordering is the useful conclusion of the inventory.", "2026-11-08: the bt1 and btn6 round scripts moved to scripts/archive/ as history; they are not part of the maintained build. Bluetooth state is unchanged."]
completion = ["The controller is enumerated, its firmware loads, and the OS Bluetooth service sees an adapter that can complete a scan."]
limits = ["Nothing implemented. The controller, transport, pads, rails and firmware naming rule are recorded above; what is missing is the ROM and SoC versions that select the two firmware files, and the files themselves, none of which the tree holds."]
next_action = ["Get the ROM and SoC versions this chip reports, because they are what turn the driver's format strings into the two file names the board actually needs, and then check whether those files exist on the stock firmware. That is a read of the running radio's own version response, so it needs the board or a stock image, not another pass over the tree. Everything the tree can give is now in inputs: the controller, its transport, its pads, its five rails, its firmware naming rule and the driver that owns each node."]

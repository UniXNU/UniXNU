findings = ["The stride used while drawing a glyph row must remain (FB_WIDTH - FONT_WIDTH * FontScale) * FB_BPP; using a full scanline there shears every glyph.", "The framebuffer is a DSC command-mode panel; the firmware console renders correctly with the inherited GOP.", "PE_create_console blocks in ml_io_map_wcomb while it maps the framebuffer, so the bring-up kernel replaces it with a ret; vcattach and vc_progress_initialize block on the same mapping and are patched the same way.", "initialize_screen is the next call after PE_init_iokit in kernel_bootstrap_thread; it reaches the same framebuffer mapping that blocks PE_create_console, so it is the next checkpoint."]
completion = ["The kernel presents the boot logo and later the SpringBoard frame through the controller or GOP."]
limits = ["Only the firmware text console is verified; the kernel has no display driver, so kernel output is limited to the entry probe bands."]

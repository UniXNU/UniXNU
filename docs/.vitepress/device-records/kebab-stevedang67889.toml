[[area]]
id = "packaging"
status = "device-verified"
components = ["XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "scripts/**", "docs/patches/**", "docs/bring-up.md"]
inputs = ["XNU built from source on a macOS runner against kernelcache f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7", "iPadOS 17.7.11 21H461 userland image", "64 MiB payload FAT image"]
configuration = ["header_version 2, pagesize 4096, kernel_offset 0x8000, tags_offset 0x100, dtb section from the live device tree", "payload as a raw FDF region at 0x00300000, published by KebabRamDisk over BlockIo", "kernel args -v keepsyms=1 kt_fixed_zones=120"]
procedure = ["./unixnu build payload, then run scripts/pack-payload-mbr.py on the FAT image, point the FDF FILE region at the wrapped image, rebuild the firmware and run ./unixnu bootimg", "./unixnu bootimg --uefi <Mu-Silicium> --dtb desktop-kebab.dtb --ramdisk none verifies the gzip payload, firmware volume and appended DTB before flashing"]
findings = ["The payload cannot be an FFS file, and RamDiskDxe refused the buffer with EFI_INVALID_PARAMETER, so KebabRamDisk publishes the region as a BlockIo device with a device path for PartitionDxe.", "unixnu bootimg needs the patched mkbootimg call that passes the DTB for header version 2.", "The payload builder now injects the device tree nodes XNU looks up by property, and scripts/patch-func-ret.py replaces a single kernel function with a ret when one call has to be skipped without a kernel rebuild.", "The exported firmware patch keeps every edited firmware file, including the two kebab drivers and the BootShim, so the tree can be rebuilt from the patch alone.", "The bring-up kernel is reproducible: the CI Mach-O with a ret in _PE_create_console, _vcattach, _vc_progress_initialize and _PE_get_default is sha256 db666dcf2b930fac1ed5da95accf2a4ed5f9e6c780ab7445284bbcbeedcc7d96, and the entry probe refuses to apply unless that base is un-probed.", "The payload FAT volume has to be wrapped in an MBR disk before it becomes the FDF FILE region: a type 0x0c partition at LBA 2048 plus a 1 MiB pad, written by scripts/pack-payload-mbr.py.", "The working boot image DTB is desktop-kebab.dtb (sha256 8ba6ed34b8396102eac4d95769c56317aece50cf95b69cd3d98aa8353b27f293); the 11 MiB raw live dump carries trailing data past the FDT totalsize and fails the bootimg check.", "The bring-up kernel grew to six ret patches on 2026-10-30: PE_create_console, vcattach, vc_progress_initialize, PE_get_default, initialize_screen and kperf_init_early (sha256 9531eef048f30eba31d159194260e19044fec25b9cd605cbbb2c82ca997d1461).", "The 2026-10-30 evening bring-up kernel grew to eight ret patches: the six above plus vm_commpage_init and vm_commpage_text_init (sha256 63ac20f91988a04f96396408f1d0b1248784d805a5c2e0eee3632082cbef49f4), used to bisect past the commpage stall.", "The 2026-10-31 bring-up kernel is kernel-bsd9: sixteen patches on top of the source build - ret for PE_create_console, vcattach, vc_progress_initialize, PE_get_default, initialize_screen, kperf_init_early, vm_commpage_init, vm_commpage_text_init, OSKextLog, OSKextRemoveKextBootstrap, machine_lockdown, kernel_list_tests, kernel_do_post and PE_lockdown_iokit, mov x0,#0 over the OSKext::copyKexts call in loadSecurityExtensions, and a nop over the ml_set_interrupts_enabled(1) call in kernel_bootstrap_thread.", "The 2026-10-31 evening bring-up kernel is kernel-bsd11: kernel-bsd9 plus a ret for vm_set_restrictions and a mov x0,#0; ret for kernel_do_post, whose return value kernel_bootstrap_thread checks with cbnz before the Assert path at 0xfffffff007984414."]
completion = ["The boot image loads, the menu appears and the kernel is entered."]
limits = ["The payload image must be rebuilt whenever the ADT node injection changes."]
next_action = ["Fold the ADT node injection into the payload step so the wrapper step disappears."]

[[area]]
id = "memory"
status = "implemented"
components = ["ArmDTPlatform"]
paths = ["dts/kebab.dts", "scripts/patch-func-ret.py", "docs/bring-up.md"]
inputs = ["DRAM banks 0x80000000+0x39900000, 0xC0000000+0xC0000000 and 0x200000000+0x200000000", "DarwinBoot window request of 3 GiB"]
configuration = ["dram-base, dram-size and darwinboot-memory-size all 0xC0000000", "/memory node in dts/kebab.dts restricted to the 0xC0000000 window", "DarwinBoot skips conventional-memory runs below 0x40000000"]
procedure = ["Build the payload so the generated ADT carries the window, then boot and read the DarwinBoot log line with the kernel virtual and physical base"]
findings = ["The kernel first-fit allocated at 0x7D000 and faulted during relocation; loading above 0x40000000 moved it to DRAM.", "A 256 MiB window leaves too little room in arm_vm_init's early I/O page-table reservation for the 0x2300000-byte framebuffer region; only after the window became 3 GiB did the kernel reach the MMU enable and _machine_startup.", "The physical aperture starts at gPhysBase and maps upward, so the 0xB9000000 ring has no phystokv mapping. ml_phys_write_data falls back to the uncached CPU copy window for this unmanaged page, which is how the stage-1 stub writes it.", "The 4 GiB test window put the kernel physical base at 0x20007C000, measured by a temporary DarwinBoot colour band; the 3 GiB build's 0xC007C000 is not the current local base.", "Normal DRAM does not carry the checkpoint flags across the reset: the 0xB9000010 ring, 0xC0001000/0x200001000 and a real __DATA BSS page all lose the byte after a reboot. The pram page at 0x17F00FE0 is the reset-persistent page; UEFI must map it before it can read the flags.", "The ADT handed to the kernel is 13980 bytes with 21 nodes, 122 properties and maximum depth two, so a tree that small cannot make a walk loop; a stall inside IODeviceTreeAlloc would be a lock or a fault.", "SecureDTIsLockedDown() is false because the ADT sits physically after the kernel, so arm_vm_prot_init does not treat it as EXTRADATA; the tree stays mapped through the boot_args window up to topOfKernelData."]
completion = ["All handoff regions are accounted for and each enabled DMA engine uses the documented cache policy."]
limits = ["Only 3 GiB of the 12 GiB is handed to the kernel; no DMA or SMMU work is done yet."]
next_action = ["Widen the window or describe all three banks once the platform expert completes."]

[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu"]
paths = ["dts/kebab.dts", "scripts/patch-func-ret.py", "scripts/patch-xnu-log-probe.py", "docs/bring-up.md", "docs/log-capture.md"]
inputs = ["Eight cores at MPIDR affinities 0x000 through 0x700", "PSCI method smc", "19.2 MHz timebase"]
configuration = ["cpus node with one cpu per affinity and state running/waiting", "timebase-frequency 0x124f800", "arm-io/gic interrupt-controller master, virtual-timer-intid 27"]
procedure = ["Install the kernel entry probe with entry_probe_reset_delay and a symbol to bisect", "Read the stage bars: blue is kernel entry with the MMU off, magenta is just before the MMU is on", "A reboot six seconds after the bars proves the probe point was reached", "Run scripts/patch-xnu-log-probe.py on a private kernel copy, build the payload and read the 32 flags in KebabBootLog"]
findings = ["The kernel is entered and enables the MMU once ExitBootServices is allowed to finish; the timed reset after the MMU enable proves it.", "With PE_create_console replaced by a ret, the kernel completes PE_init_printf, PE_init_cpu, machine_conf, vm_mem_bootstrap, console_init, sched_init and kernel_thread_create, and reaches the bootstrap thread with its first context switch.", "_machine_startup is four instructions and tail-branches into _kernel_bootstrap, so a probe placed after that call can never fire; earlier readings of it measured nothing.", "_arm_init calls PE_init_platform twice and kernel_startup_initialize_upto is called once per init stage, so a probe needs entry_probe_reset_occurrence when the call appears more than once.", "The kernel clears the screen when it creates the console, so a black panel after the stage bars does not mean the kernel died.", "The kernel removes its identity map in arm_vm_init and the physical aperture starts at gPhysBase. The ring is below both window configurations' kernel base, so the stub uses ml_phys_write_byte, which maps the unmanaged page through the uncached CPU copy window instead of phystokv.", "A call-site stub can save x0-x8 and LR, call ml_phys_write_byte, restore and tail-call the original callee, so arguments and return address are unchanged.", "The 32 calls between PE_init_iokit and the first bsd_init locks name the gap: the last set byte is the call entered, and the next unset byte is the callee that did not return.", "The 4 GiB window loads the kernel at physical 0x20007C000 (base A, measured by a temporary DarwinBoot colour band). A one-stub BSS write at 0x7B281B0, dc cvac and PSCI reset reboots, but the next reader still sees no prefix, so normal DRAM does not carry the flag across the reset; pram 0x17F00FE0 is the persistent page.", "The 2026-10-29 checkpoints reach IOLibInit, OSlibkernInit, IOMachPortInitialize, the OSSymbol interners, OSSet::withObjects, interruptAccountingInit and the IOPlatformExpertDevice allocation on the boot CPU.", "cpus=1, and ret patches on ml_wait_max_cpus, kperf_init_early and platform_stall_panic_or_spin, do not move the PE_init_iokit stall."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer and IPI handling works on each enabled CPU."]
limits = ["Only the boot CPU runs; secondary cores are not started and _machine_conf does not complete."]
next_action = ["Confirm the pram one-stub at 0x17F00FE0 (out/prammap-boot.img), then move the 32 checkpoint bytes from the ring to pram and read last/next in KebabBootLog."]

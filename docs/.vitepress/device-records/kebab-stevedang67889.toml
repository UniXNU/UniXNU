[[area]]
id = "firmware"
status = "device-verified"
components = ["DarwinBoot"]
paths = ["docs/bring-up.md", "docs/patches/**", "package/**"]
inputs = ["Mu-Silicium Platforms/OnePlus/kebabPkg", "Phone's own live device tree as the boot image DTB", "boot_a, 96 MiB, header v2 with 4096-byte pages"]
configuration = ["FD_BASE 0x9FC00000, FD_SIZE 0x4600000 (3 MiB firmware volume plus a raw payload region at 0x00300000)", "UFSDxe removed from DXE.inc; SEC disables the APSS watchdog at 0x17C10008", "ScmDxeLA and SdccDxe are included; TzDxeLA is commented out", "Framebuffer PCDs 1080x2400x32", "unixnu bootimg passes the live DTB; ABL refuses images without the splash region node"]
procedure = ["Build firmware with ./unixnu build firmware -D ../UniXNU-kebab --uefi <Mu-Silicium>", "./unixnu bootimg -D ../UniXNU-kebab --uefi <Mu-Silicium> --fd <SILICIUM_UEFI.fd> --dtb <live.dtb> --ramdisk none", "fastboot flash boot_a <image>; fastboot reboot"]
findings = ["ABL hands the framebuffer over only when the boot image carries the phone's own device tree; the tree shipped with Mu-Silicium has no cont_splash_region@9c000000 and the panel stays black.", "A payload file inside the firmware volume is impossible: the FFS size field is 24 bits, so the 64 MiB payload is a raw FDF region instead.", "FrameBufferSerialPortLib handled newline and carriage return but ignored form feed, so DarwinBoot's clear screen did nothing and the left half of every log line was cut off.", "The payload builder injects the nodes XNU looks up by property (gic with interrupt-controller master, a one-cell redistributor stride, virtual-timer-intid, a timer node, pram and the panic log size); without them the kernel stops before PE_init_platform returns.", "KebabBootLog reads the 32 checkpoint bytes at 0xB9000010, prints the set list and clears the flags; CacheMaintenanceLib flushes the clear.", "The current firmware has SCM and SDCC but no UFS block device: UFSDxe is removed for the vendor assert, TzDxeLA is disabled and SdccDxe does not replace UFS."]
completion = ["Firmware boots from boot_a, the menu is rendered on the panel, the keys navigate it and the log is readable."]
limits = ["USB is not brought up in the firmware; the only log transport is the panel."]
next_action = ["Publish a firmware image revision alongside each kernel change."]

[[area]]
id = "diagnostics"
status = "device-verified"
components = ["DarwinBoot"]
paths = ["docs/bring-up.md", "docs/log-capture.md", "docs/patches/**"]
inputs = ["Panel as the only output", "kernel entry probe and timed reset from patch-xnu-entry-probe.py"]
configuration = ["DEBUG output routed to the framebuffer console", "entry_probe_reset_delay with entry_probe_reset_after and entry_probe_reset_in selects the bisect point"]
procedure = ["Build the payload with the probe, flash, boot and read the panel", "A reboot after the delay means the probe point was reached"]
findings = ["Stage bars mark kernel entry and the point just before the MMU is on; a timed reset is the only signal available once the kernel runs without a console.", "A probe registered after the exit-boot-services notifications proved those notifications never returned; skipping them made the hand-off complete.", "Probes can mislead: an inline-assembly probe hardcoded to an identity mapping crashes after arm_vm_init closes that mapping and looks like a kernel hang.", "A checkpoint ring at 0xB9000000 and a BSS probe were tried. A one-stub BSS write + dc cvac + PSCI reset reboots, but the next reader still reads no prefix, so normal DRAM does not carry the flag across the reset; the 0xB9000010, 0xC0001000 and 0x200001000 probes behaved the same way.", "pram 0x17F00FE0 is the panic-log page that survives the reset. UEFI leaves it unmapped; a reader that adds it to the GCD and sets it uncached with gDS->AddMemorySpace and gDS->SetMemorySpaceAttributes was built, together with a one-stub ml_phys_write_byte(0x17F00FE0,1) + reset image (out/prammap-boot.img).", "Do not clear the flag page from the firmware: pram may be read-only to UEFI and the kernel clears its own BSS. The prefix check must accept only the value 1, not any non-zero byte.", "debug=0x144 enables a branch that calls SecureDTLookupEntry on /chosen/iBoot and stalls before any IOKit code, so debug stays out of kernel_args.", "The 2026-10-29 chain uses entry_probe_reset_after and entry_probe_reset_in on _InitIOKit and IOPlatformExpertDevice::init: the patched bl performs the call, waits six seconds of the 19.2 MHz counter and issues PSCI SYSTEM_RESET, so one flash answers exactly one question.", "2026-10-30 bisection of IODeviceTreeAlloc: the checkpoint after IODeviceTreeAlloc did not fire, the one after the first child MakeReferenceTable fired, getRegistryRoot fired and IORegistryIterator::iterateOver fired, which left the interrupt-mapping loop as the stall.", "The device tree carried interrupts and interrupt-parent on the gic node. IODTFindInterruptParent resolves the phandle through gIODTPHandles, which AddPHandle fills only from AAPL,phandle; the ADT has none, so the parent was NULL and IODTGetICellCounts(NULL) dereferenced it. A CPU exception screen after repeated resets is the bootloader crash dump for that fault.", "Removing the gic interrupts property from dts/kebab.dts clears IODeviceTreeAlloc, InitIOKit and ConfigureIOKit; the kernel now reaches initialize_screen in kernel_bootstrap_thread.", "kernel_bootstrap_thread calls PE_init_iokit, then initialize_screen, vm_commpage_init, mac_policy_initmach, OSKextRemoveKextBootstrap, machine_lockdown, kernel_do_post, PE_lockdown_iokit, vm_set_restrictions and kperf_init_early before bsd_init.", "2026-10-30, after the gic fix: the checkpoint after PE_init_iokit fired, and the one after ConfigureIOKit fired too, so InitIOKit and ConfigureIOKit both return.", "kernel_bootstrap_thread runs kernel_startup_initialize_upto(16) (THREAD_CALL) right after PE_init_iokit; that checkpoint fires. The next checkpoints - after initialize_screen, mac_policy_initmach and vm_commpage_text_init - do not, so the stall is in vm_commpage_init.", "vm_commpage_init calls commpage_populate, whose first call is pmap_create_commpages; it is the current bisection target.", "vm_commpage_init calls commpage_populate, whose first call is pmap_create_commpages. The checkpoint after pmap_create_commpages did not fire, and inside it the one after the second pmap_enter_options_addr did not either, so the commpage pmap creation stops in its first half (page allocation, pmap_create_options, ASID or the first enter).", "Replacing vm_commpage_init and vm_commpage_text_init with ret lets the boot continue; the next checkpoint after OSKextRemoveKextBootstrap still fails, so the stall moves into mac_policy_initmach, vnguard_policy_init, dtrace_early_init, sdt_early_init or OSKextRemoveKextBootstrap.", "The stall after the commpage is mac_policy_initmach: the checkpoints after vnguard_policy_init and dtrace_early_init never fire and the one after mac_policy_initmach does not either.", "mac_policy_initmach calls load_security_extensions_function, which the libsa KLDBootstrap static constructor points at bootstrapLoadSecurityExtensions. That walks com.apple.* kexts and calls OSKext::loadKextWithIdentifier for every kAppleSecurityExtension kext, so the boot is now inside prelinked kext loading (AMFI and friends) before PE_lockdown_iokit.", "Inside KLDBootstrap::loadSecurityExtensions the checkpoint after OSKext::copyKexts already fails, and the one after the first OSKext::loadKextWithIdentifier fails too, so the boot stops in OSKext::copyKexts itself.", "OSKext::copyKexts takes sKextLock with IORecursiveLockLock and then copies sKextsByID with copyCollection. Nothing else in this path runs, so either the lock is held by another thread (deadlock) or the kext registry is not usable at this point.", "The sKextLock acquisition inside OSKext::copyKexts returns, so the lock is fine and the stall is sKextsByID->copyCollection().", "OSKext::initialize creates both sKextLock and sKextsByID and asserts them, and __PRELINK_INFO lists 38 bundle identifiers, so a valid registry of that size should copy instantly; the copy is most likely faulting on a corrupt entry recorded by readStartupExtensions rather than looping.", "Correction, 2026-10-31: OSKext::copyKexts has three callers - KLDBootstrap::loadSecurityExtensions, KLDBootstrap::loadKernelExternalComponents (which runs inside InitIOKit) and IOCatalogue::resetAndAddDrivers. The 2026-10-30 checkpoint inside copyKexts therefore fired during InitIOKit, not at mac_policy_initmach, and patching the whole function broke InitIOKit so every later checkpoint failed.", "With only the copyKexts call inside loadSecurityExtensions neutralised, the checkpoint after OSKextLog at the top of that function still does not fire, so the stop is at that log call or the jump into the bootstrap segment rather than in the kext registry copy.", "2026-10-31 chain with kernel-bsd9: startup step 16, initialize_screen, vm_commpage_init, vm_commpage_text_init, mac_policy_initmach, vnguard_policy_init, dtrace_early_init, sdt_early_init, mbuf_tag_init all return; machine_lockdown, kernel_do_post and PE_lockdown_iokit only return because they are patched out.", "The stop after that is vm_set_restrictions, whose argument is machine_info.max_cpus and whose body starts with assert(num_cpus > 0); machine_conf derives the value from the topology max_cpu_id, so a zero there panics before kperf_init_early and bsd_init.", "Checkpoints at or after ml_set_interrupts_enabled(1) never fire unless that call is nop'd, which is why the earlier bisection reported contradictory results: with IRQs unmasked the checkpoint cave cannot complete its wait either.", "With kernel-bsd11 the checkpoint after kperf_init_early fires: the whole kernel_bootstrap_thread completes and bsd_init is entered. The checkpoint after bsd_init does not fire, so bsd_init itself now holds the boot.", "A plain ret on kernel_do_post sent the boot to the Assert path at 0xfffffff007984414 because cbnz w0 tested a garbage return value; returning zero fixes it.", "Inside bsd_init the boot stops in throttle_init: the checkpoints after throttle_init and after its first thread_call_allocate never fire, while the earlier bsd_init calls (platform_stall_panic_or_spin, whose stall value is disabled) do not stall.", "throttle_init first calls throttle_init_throttle_window, which reads three kern.io_throttle_window_tier* defaults through PE_get_default. Restoring the real PE_get_default and replacing it with a clean mov x0,#0; ret both leave the stop unchanged, so the PE_get_default bring-up patch is not what blocks it; the remaining suspects inside throttle_init are its PE_parse_boot_argn calls and the lck_mtx_init of each throttle lock.", "throttle_init stops in thread_call_allocate, which does not reach zalloc but kalloc_type_impl_internal, the typed allocator; setup itself is trivial, so the allocation is what blocks.", "bsd_init's first printf also never returns: kprintf's disabled-output branch calls os_log_with_args, and printf itself formats through console_printbuf_putc, which needs a console that PE_create_console and vcattach currently never create. Patching os_log_with_args out is not enough; patching printf out moves the boot to kauth_init, which then does not return either.", "The interrupt controller is not part of the kernel image: the symbols are ArmCpu::mapGic, ArmCpu::prepareGic and ArmCpu::enableGic in the prelinked AppleARMCPU kext. Without kext loading and IOKit matching there is no GIC, so the bring-up kernel has to keep IRQs masked, and every wait that needs an interrupt or a timer never returns.", "The devicetree generator added the arm-io window base to the GIC reg but pe_arm_map_interrupt_controller already maps soc_phys + reg, so the GIC and timer landed at 0x2EA00000 instead of 0x17A00000. The injected reg now keeps the window offsets (0xa00000, 0xa60000) and the mapping resolves to the real addresses.", "Restoring the real PE_lockdown_iokit (IOKit matching) with the printf/os_log/throttle stubs in place still does not return, so driver matching is the next thing to walk.", "PE_lockdown_iokit is zalloc_iokit_lockdown() followed by a tail branch to StartIOKitMatching; StartIOKitMatching calls IOPlatformExpertDevice::startIOServiceMatching, which stops in IOWorkLoop::workLoop, whose first step is OSObject_typed_operator_new - so the stop could never be about drivers: it is kalloc_type_impl_internal.", "kalloc_type_impl_internal ends in zalloc_ext with the Z_NOFAIL flag set, and Z_NOFAIL retries forever; with one CPU, no interrupt controller and IRQs masked, a zone that cannot reach a page never returns. ArmCpu::start (drivers/ArmCpu/ArmCpu.cpp) is what would call prepareGic/mapGic/enableGic, so the GIC, the kext matching and the allocator are one dependency cycle."]
completion = ["A failed boot leaves enough on the panel or over a transport to identify the failed stage."]
limits = ["No USB or storage log transport yet; the RAM ring did not survive the reset in the 2026-10-28 test; the pram reader mapping is the current work."]
next_action = ["Break the cycle at the GIC: either build the kernel with the generic gic_v3_irq.c driver (add it to osfmk/arm64/Makefile, it is not in the object list today, and it reads /arm-io/gic whose reg the ADT now encodes correctly), or get ArmCpu::prepareGic to run before matching. Also confirm why zalloc_ext cannot reach a page at that point."]
[[area.evidence]]
kind = "device"
reference = "docs/bring-up.md"
command = "flash each bisect image and photograph the panel"
revision = "97f6fea12dae49a1bbc30ccd22c098b82b97dbe4"
result = "Seventeen exit-boot-services notifications, a hung notification phase and a passing hand-off after skipping them; kernel entry, MMU enable and _machine_startup all confirmed by bars and timed resets."

[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu"]
paths = ["package/CpuFreq*", "patches/xnu/**", "dts/**"]
inputs = ["Four Cortex-A520 (cpus 0-3, EPSS domain 0) and four Cortex-A720 (4-6 domain 1, 7 domain 2); EPSS domains at 17d91000/17d92000/17d93000.", "Gunyah hypervisor: SGIs are not delivered, so IPIs use armcpu-spi-ipi=1."]
configuration = ["sheng-smp=1 and armcpu-spi-ipi=1 in board.toml; unixnu,cluster-type E/P in dts/asteroids.dts; sheng-cpufreq=<mode> selects the CPU governor."]
procedure = ["Boot with sheng-cpufreq=1 and the banner on, read the CPU row (domain state and LUT), then sheng-cpufreq=4."]
findings = ["The CPU governor is sheng's CpuFreqProbe with 4/3/1 CPUs per domain and no L3 vote (the 3a has no EPSS L3).", "The E/P Edge scheduler and the idle-time helper are sheng's zzyf and zzye patches (patches/xnu).", "T40c (2026-10-27): the cpu0 park thread is off by default (sheng-cpu0-park=0, as UniXNU-sheng d361b53): the E/P Edge scheduler places work by cluster, and T39b found the park thread holding cpu0 at 100 %. The governor and the AMP and idle patches already match sheng's latest.", "T64 (2026-10-29): dts/asteroids.dts's memory node covers the whole high bank (0x8C0000000 + 0x23FE00000), equal to board.toml dram_size, since the GPU pool at its top is gone (memory area).", "T76 (2026-10-30): the board classes here register through OSKextRegisterBoardClasses (zzyg-board-class-registration.patch), under the kext lock, in place of preModLoad/postModLoad alone, which deadlocked T75f's boot (storage area).", "T76's first kernel build (run 41109301209) failed: XNU has no kOSReturnNoMemory; OSKextRegisterBoardClasses and its callers use kOSKextReturnNoMemory (libkern/OSKextLib.h), and the helper has a prototype before its definition."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["The governor and the E/P scheduler are not yet verified on the phone (T35)."]
next_action = ["Boot T35a (read-only) and T35b (governor) and record the clocks and frame rate."]

[[area.evidence]]
kind = "source"
reference = "package/CpuFreqProbe.cpp"
result = "EPSS CPU governor with touch boost and frame floor."

[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = ["DRAM high bank 0x8C0000000-0xAFFE00000 (9 GiB less 2 MiB, one conventional run since T64) for the XNU window; GMU pool at 0xE6440000 (32 MiB), reserved in the uefi-asteroids memory map. Until T63 a GPU pool sat at 0xABFE00000 (1 GiB)."]
configuration = ["owned_memory_size 0x180000000 (6 GiB, T64; 4.75 GiB before) and dram_size 0x23FE00000; the DTS memory node equals dram_size."]
procedure = ["Check that payload.dram_size equals the DTS memory node and that DarwinBoot places the window."]
findings = ["384 MiB of owned memory left iPadOS short; 4.75 GiB in the high bank (uke's layout) is enough.", "Metal's 64 MiB blocks need a 1 GiB GPU pool outside the XNU window.", "T62b-light (2026-10-29): with every app on the GPU the 1 GiB pool filled and the GPU stopped once BOs fell back to scattered pages, while XNU had 849 pages free. T64: no pool; user BOs are XNU's pageable memory (sheng's Adreno740 882f4bf) and the window grows from 4.75 to 7.75 GiB over the whole high bank, leaving 1.25 GiB of the run to UEFI's own allocations.", "T64 first boot (2026-10-29): 7.75 GiB stopped at the kernel's entry, the green and blue bars without the magenta one: before the MMU is on, start.s maps the window twice with 1 GiB per L2 table page, and UniXNU's native-4k-bootstrap-capacity patch held 16 pages, enough for 6 GiB; the patch's own guard loops when the pool runs out. The window is 6 GiB until a kernel with UniXNU 2867796 (22 pages, windows up to 9 GiB; staged, not built) is built, then 7.75 GiB."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["The GMU pool is a fixed reservation in the firmware memory map. DarwinBoot gives XNU at most 8 GiB."]
next_action = ["Record the firmware memory map with each firmware change."]


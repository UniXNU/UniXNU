[[area]]
id = "display"
status = "implemented"
components = ["GopFramebuffer"]
paths = ["drivers/GopFramebuffer", "package/LegacyDisplay*", "package/PanelProbe.cpp", "package/AsteroidsBacklight.cpp", "drivers/NativeMobileDisplay", "package/Boot*", "package/Font.h", "scripts/build-native-legacy-display.py", "scripts/build-boot-progress.py", "scripts/audit-mobile-graphics-default-surface.py"]
inputs = ["The firmware's GOP framebuffer, 1080x2392 x8r8g8b8 at stride 4320, on a 120 Hz video-mode panel."]
configuration = ["offline-legacy-* arguments, sheng-vsync=120, sheng-fb-gpu=1 (the GPU copies each frame to the panel)."]
procedure = ["Boot and watch the banner rows (sheng-banner=1) for swaps per second and copy times."]
findings = ["T37 (2026-10-26): DSI0 is reachable under Gunyah (T37a st=1), the brightness test ran (T37b), and with asteroids-panel=3 iOS sets the brightness and sleep turns the panel off and on again (T37d). It is a board default since then.", "T37: the panel (Visionox RM69220 AMOLED, video mode, DSI0 at 0x0ae94000, dsi-ctrl v2.8) takes DCS commands through the controller's TPG command FIFO, scheduled for the first front-porch line (package/PanelProbe.cpp, asteroids-panel=1..4): brightness 51 hi lo (10..4095), off 28 + 10, on 11 + 29. The iOS brightness service is sheng's AppleARMBacklight.cpp with the DCS write instead of I2C (package/AsteroidsBacklight.cpp); level 0 turns the panel off.", "The CPU copy (143-285 ms a frame) mapped the surfaces cacheable without invalidation and showed stale patches; the GPU copy removes both.", "GopFramebuffer 33e941a's direct scanout needs ShengUfs's display SMMU window (native_ufs_dpu_map); our NativeUfs fork has none, so package/LegacyDisplayStubs.c supplies weak zero stand-ins that keep it off.", "T40c (2026-10-27): BootProgress.c's cpu0_park defaults off (see cpu).", "T40k-T42 (2026-10-27): zero copy on the 3a. NativeUfs sheng-dpu-linux=1 sets the display bank up as Linux does: CBA2R and CBAR written (the apps SMMU is qcom,virt-smmu and the hypervisor attaches the bank on that write), TCR2 with the ASID size and SEP, cached inner-shareable walks with T0SZ 28, TTBR0 with an ASID. The bank then took stage 1 without a fault (T40k), where every earlier setup faulted at level 0, even with blocks lacking the access flag (T40i-af). T41: 1018 direct flips, 4.4 ms mean latch, once startDirect waited for the bank (40 ms); frames showed half drawn (the wallpaper without the app), so T42 flips only once the GPU's completed fence reaches the newest fence submitted at the swap.", "T42 (2026-10-28): the GPU wait never ran (0 of 1272 flips), yet opening apps still alternated the new frame with the wallpaper alone. The original completion (IOMobileFramebufferLegacy slot 295, its body at 0xfffffff00578a96c in 21H461) clears the current swap and releases its surfaces, and it ran as soon as a swap latched: the compositor got back the surface still on screen and drew its next frame over it. T43: sheng-dpu-hold=<ms> keeps the shown swap current until the next latch (or <ms> without a new swap) and only then completes it; [direct scanout] held / timed out count the two.", "T44: [direct scanout] adds frame gaps (flip to flip: up to 17, 25, 34, 50, 100 ms, longer, the longest under a second), to measure the frame rate opening an app reaches under blur.", "T43-copy (2026-10-28): copy mode felt slower and choppier than older builds. Its log (25 minutes) shows the copy path as before: 5310 GPU copies, none failed, no CPU throttling. The session was heavier, though: two wallpaper renderers (PosterBoard, CollectionsPoster) on the GPU, 691 MB of GPU memory against 345-582 MB, and seven times the time freeing it. Every counter covers the whole boot. T46: the [frames] row counts frames shown by copy and by flip and the gaps between them (T44's flip-only histogram moved there).", "T46 (2026-10-28): zero copy with the end-of-submission GPU cache flush still alternated the new frame with the wallpaper alone. 1102 flips in 78 s: 68 % of the gaps 17 ms or less, 17 % up to 25 ms, 3 % over 50 ms. T47 reverts the guesses that did not fix it: the GPU wait (904bccf) and the frame hold (8393a37) in GopFramebuffer (d4f7b59, the direct path is a5fc6bf's again), keeping the frame counting.", "T47 review (2026-10-28): T42's flip wait never waited. It found the GPU's fence page through NativeAdreno's native_adreno_fence_phys, which only NativeAdreno's service sets; this board attaches the ring in GpuPowerProbe, so it stayed 0 (no [fence page] row in any log) and gpuCaughtUp() always answered done. 'No flip waited for the GPU' therefore says nothing. T48: sheng-dpu-probe=1 samples what the display fetches (4 x 4 luminance grid through an uncached mapping) at the flip, the latch, each refresh tick and when the surface leaves, with the real fences (GpuPowerProbe native_gpu_fences); sheng-dpu-flipdelay=<us> and sheng-dpu-gpuwait=1 test late GPU work. T47-copy: copy mode is GPU-bound (23 % of frames within 17 ms against 68 % with zero copy; 435 of 1507 busy windows at the ceiling).", "T49: [mic peaks] (the capture's peak per second and its start time) and BTN taps=.", "T49-probe/T49-gpuwait (2026-10-28): the flicker's cause is flipping to frames the GPU has not finished. With the probe, 663 of 703 flips found GPU work outstanding and 277 surfaces changed between flip and latch (222 more before leaving the screen, none on a refresh tick while shown). Waiting for every submission made before the flip (the real fences from GpuPowerProbe) gave 0, 0 and 0 over 821 flips, 691 waits over 1 ms, longest 23.6 ms, and no visible flicker; smoothness felt like copy mode. T50 makes it the default: board.toml sets sheng-dpu-scanout=2 and sheng-dpu-linux=1, GopFramebuffer waits unless sheng-dpu-gpuwait=0.", "T51: [frame time] splits each frame into compositor time, swap to screen and flip to latch; [frames] gains a 9 ms (120 Hz) bucket. The panel is advertised as 24-120 Hz (sheng-vsync=120).", "T51: per frame, compositor time had a wide spread, swap to screen 8-12 ms (the GPU), flip to latch 4.5 ms mean; they run in series because the compositor starts the next frame only when the swap completes. T52: sheng-dpu-early-done=1 completes a direct swap when its flip is programmed.", "T53: the boot log gains [gpu work] (BootLog.c), the GPU work per submission by render passes against its GPU time.", "T54: the boot log gains [gpu sysmem why]; [gpu work] drops the draw count.", "T55: the boot log gains [gpu ops] (GPU time per kind of work).", "T61: BootProgress.c also anchors boot_diag_scan_gpu (BootDiagExport.c), which the periodic GPU trace export (sheng-gpu-trace-export, see diagnostics) calls; its rounds include the half-resolution screen, so a trace comes with what was shown.", "T62: BootLog.c gains the [gpu tables] and [gpu recovery] rows (see diagnostics).", "T64 (2026-10-29): build-native-legacy-display.py no longer checks board.toml gpu_pool_* against GpuPowerBoard.h (both gone with the BO pool); BootLog's [bo pool] row is [bo memory] (diagnostics area).", "T64: BootLog.c adds the [gpu uc] rows (diagnostics area).", "T65: the boot log adds a [bo pool] row (native_adreno_pool_stats): pool MiB and chunks, the reservation's and write-combine's IOReturn, BOs from the pool, BOs sent to the system, MiB in use and peak.", "T73 (2026-10-30): native_legacy_display_late_probe records which probe bsd_autoconf's thread is in (native_late_probe_step) and the thread itself, for the boot log's [late probe] and [kernel threads] rows (T67 and T72 hung inside it).", "T76 (2026-10-30): the board classes here register through OSKextRegisterBoardClasses (zzyg-board-class-registration.patch), under the kext lock, in place of preModLoad/postModLoad alone, which deadlocked T75f's boot (storage area).", "T76's first kernel build (run 41109301209) failed: XNU has no kOSReturnNoMemory; OSKextRegisterBoardClasses and its callers use kOSKextReturnNoMemory (libkern/OSKextLib.h), and the helper has a prototype before its definition.", "T76's second kernel build (run 41111730079) failed in ShengPlatformPower.cpp: BoardClasses.h had been included after the file's last #include, which there sits inside the ShengPlatformPower class; every probe now includes it after its first #include."]
completion = ["The desktop presents through the legacy display with measured frame times."]
limits = ["Under 60 frames per second."]
next_action = ["Measure the frame rate with the CPU governor (T35)."]


[[area]]
id = "storage"
status = "implemented"
components = ["ShengUfs", "RamBlock", "SoftwareAES", "VirtioMmioBlock", "VerifiedRoot"]
paths = ["drivers/ShengUfs", "drivers/NativeUfs", "scripts/build-arm-driver.py", "scripts/build-ufs-original-bindings.py", "scripts/ci-bootstrap-candidate.sh", "scripts/pull-asteroids-data.py"]
inputs = ["UFS host 0x1d84000 and PHY 0x1d80000 (SM8550's windows), apps SMMU stream 0x60; userdata LUN 0 blocks 0x256248-0x3a8bffa."]
configuration = ["native-ufs-root=1 and native-ufs-allow-unverified=1; sheng-data-persist=2 keeps Data at the end of userdata."]
procedure = ["Build the userdata image, write it to userdata from recovery, boot, and pull the Data volume with scripts/pull-asteroids-data.py."]
findings = ["Format 2 builds VirtioMmioBlock as ShengUfs's dependency; build-arm-driver.py skips it while XNU_NATIVE_VIRTIO_BLOCK is off.", "NativeUfs (the ShengUfs fork) is built without the verified-root check until signed volume policies exist.", "Its IOBlockStorageDevice imports bind against the original class in a bootstrap kernel candidate built first in CI.", "T67, T72 and T72 again (2026-10-29/30) hung before the root mount: NativeUfs published SystemOS and never saw IOMedia under it (no block request, \"SystemOS volume  not ready\" after 30 s), while the UFS transport kept writing the log and every processor sat idle. bsd_init's stage markers stopped at bsd_autoconf, whose late probes had not reached the CPU clock row ([clocks] absent, [gpu uc] stage 0, B st=0); T71 on the same kernel booted. Both stalled together, so a race between the probes and IOKit matching; T73 logs where each thread waits.", "T75f (2026-10-30) hung before the root mount and T73's [kernel threads] rows caught it: a lock-order deadlock. The boot thread, in native_keystore_probe (late probe step 1, key events stage 1), held OSMetaClass's class lock from preModLoad and waited in postModLoad for sKextLock (OSKext::lookupKextWithIdentifier); IOConfigThread_'IOResources' held sKextLock loading a kext (OSKext::load, OSRuntimeInitializeCPP) and waited for the class lock in preModLoad; IOConfigThread_'NativeUfsBlock' waited for sKextLock in IOCatalogue::personalityIsBoot, so the SystemOS disk never got a driver. XNU takes sKextLock first; the board's probes took only the class lock. Intermittent because it needs a kext load during the probe's registration, right after bsd_autoconf publishes IOBSD. T76: OSKextRegisterBoardClasses (patches/xnu/zzyg-board-class-registration.patch) registers board classes under sKextLock, and all eight probes that called preModLoad/postModLoad use it."]
completion = ["The root volume mounts read-only from UFS and Data persists across boots."]
limits = ["Root reads are not authenticated."]
next_action = ["Build the owner verified-root bundle."]


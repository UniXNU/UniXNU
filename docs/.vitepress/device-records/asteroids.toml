schema_version = 1

[device]
name = "asteroids"
soc = "SM7635"
os_profile = "ipados-17.7.11-21H461"
summary = "Nothing Phone (3a) runs the unchanged iPad7,1 iPadOS 17.7.11 image from its UFS userdata partition, with shared SM7635 support and board-owned storage, GPU, input and power integration. Bring-up runs as numbered staged tests; their results are in docs/asteroids-gpu-gen8.md and docs/asteroids-touch.md of rootstockos/iosonandng."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "XnuPrelink"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore", "LICENSE", "scripts/make-asteroids-adt.py"]
inputs = ["SM7635 SoC profile (rootstockos/UniXNU-sm7635-common), iPadOS 17.7.11 build 21H461, asteroids_defconfig, the board's own driver forks as submodules."]
configuration = ["board.soc_source = sm7635; board.os_profile = ipados-17.7.11-21H461; schema_version = 2.", "drivers/Adreno740, drivers/ShengUfs, drivers/ShengHidInput, drivers/ArmDTPlatform and kits/AdrenoFirmware are this repository's submodules at their catalog paths and take precedence over UniXNU's."]
procedure = ["Run ./unixnu status --json -D ../UniXNU-asteroids from rootstockos/UniXNU and review profiles, components and patch order."]
findings = ["Format 2 builds every selected component's kernel recipe, so [kernel] archives lists them as component: entries in the format 1 order; build-arm-driver.py skips Adreno740 and VirtioMmioBlock while their configuration switches are off, as format 1 never built them (T36 run 40297420036).", "Format 2 applies the arch, SoC and OS configuration fragments before the defconfig; bootstrap_defconfig turns off the five options common.config adds, so both passes have their format 1 configuration (checked with parse_config: no differences).", "Format 2 keeps only catalog components, so the forks of NativeAdreno and NativeUfs moved from their legacy names to drivers/Adreno740 and drivers/ShengUfs; legacy aliases are made only for UniXNU's own sources.", "T36 is the first format 2 image (build tag T36). Every board.toml value matches the format 1 board (4f05a36) except what moved to the SoC and OS profiles, the ADT tool options and the firmware pins (proprietary-files.txt); a dry-run pack caught kernel_args lost in the first rewrite.", "The ADT from the shared generator matches the former make-asteroids-adt.py output except for the OS profile's additions (J120AP first in the root compatible, product-id, /product/audio) and the arm-io window, which now covers UFS.", "T40a (2026-10-27): every fork has one working branch, asteroids (former branches are archive/* tags); drivers/ArmDTPlatform became the submodule fork rootstockos/ArmDTPlatform; the record check runs rootstockos/UniXNU's workflow and catalog, since UniXNU main's catalog does not know Sm7635Platform or QcomPmicRtc.", "T40c (2026-10-27): build tag T40; the GPU governor and fence spin are board defaults (see gpu).", "T40d (2026-10-27): sheng-lite=1 as on sheng; sheng-disable-jobs keeps only bluetoothd and coreduetd (the lite list holds the XPC wait cycle). The kernel from fork asteroids-dev 0d215db carries native-union-root-checkdirs.patch: the SystemOS union over / no longer leaves the OS root one usecount short (T40c's shutdown panic in vnode_rele_ext).", "T50: board.toml kernel_args gain sheng-dpu-scanout=2, sheng-dpu-linux=1 and sheng-audio=1.", "T64 (2026-10-29): [payload] dram_size 0x23FE00000 and [payload.adt] owned_memory_size 0x1F0000000 (7.75 GiB) over the whole high bank, which the uefi-asteroids map now declares as one run without GPU_Pool; [gpu] gpu_pool_base and gpu_pool_bytes are gone with the BO pool (memory area).", "T64: owned_memory_size is 0x180000000 (6 GiB) instead of 7.75 GiB until the kernel carries UniXNU 2867796's larger bootstrap table pool (memory area).", "T76 (2026-10-30): gpu-addon.yml's encrypted artifact also carries NativeAdrenoMetal.unstripped and libvulkan_freedreno.unstripped (build-asteroids-metal-plugin.py keeps Turnip unstripped), for symbolizing the encode thread's CPU profile; the phone gets neither."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["The SoC profile is pinned to a local checkout (local.toml) until rootstockos/UniXNU-sm7635-common is published."]
next_action = ["Publish the SoC repository and pin its commit in feeds.toml."]

[[area.evidence]]
kind = "source"
reference = "board.toml"
result = "Format 2 board configuration with the SM7635 SoC and 21H461 OS profiles."

[[area]]
id = "firmware"
status = "implemented"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", "scripts/extract-files.py", "scripts/fetch-asteroids-gpu-firmware.py", "scripts/patch-xnu-entry-probe.py", "scripts/xnu-panic-screen.c"]
inputs = ["rootstockos/uefi-asteroids (Mu-Silicium VolcanoPkg and asteroidsPkg) with UniXNU, UniXNUDxe and DarwinBoot.", "The 3a's ABL loads the boot image with fastboot boot; it ignores the boot image's ramdisk."]
configuration = ["[bootimg] payload_in_kernel = true: the payload rides in the kernel image and ShengBootMemoryDxe finds it in the Kernel memory region."]
procedure = ["Build the payload and boot image with ./unixnu build payload and ./unixnu bootimg --dtb (the phone's live DTB), then fastboot boot the image."]
findings = ["The ABL passes the vendor_boot and init_boot ramdisks plus bootconfig as the initrd, never the boot image's own ramdisk.", "Proprietary files follow sheng's method: proprietary-files.txt with an @fetch source and SHA-256 per file, put in .cache/firmware by scripts/extract-files.py (which falls back to curl when Python has no CA store)."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["Images are booted from RAM only (fastboot boot); nothing is flashed."]
next_action = ["Record the firmware revision with each boot image."]


findings = ["Never boot a test without on-screen diagnostics: T24b had none and taught nothing.", "T37 adds sheng's UFS diagnostic log (BootLog.c, sheng-log=1) through NativeUfs's log window (the last 32 MiB of userdata), with weak stand-ins (BootLogStandins.c) for the 104 references to probes this board does not build; scripts/pull-asteroids-log.py copies the window from recovery over adb and decodes it with sheng's read-sheng-log.py --decode. The unified log on Data cannot tell boots apart (one boot UUID and clock base for every boot).", "T43: [direct scanout] adds held / timed out (sheng-dpu-hold).", "T44: [direct scanout] frame gaps and the [gpu load] row (BootLog.c, native_gpu_windows with a BootLogStandins.c stand-in).", "T46: [frames] (native_legacy_frames) replaces T44's frame gaps in [direct scanout].", "T47: [direct scanout] loses the GPU wait and hold counters with the code they counted.", "T48: [dpu probe] counters and up to 24 [dpu probe n] rows (slot, flags, fences, flip/latch/leave signatures).", "T49: [mic peaks] (the capture's peak per second and its start time) and BTN taps=.", "T51: [frame time], [gpu time], [gpu maint] and [fence asked] rows; [frames] buckets 9/17/25/34/50 ms.", "T53: [gpu work] (passes, system-memory passes, blits, draws, render area per submission against GPU time).", "T54: [gpu sysmem why] (system-memory pass reasons against GPU time).", "T55: [gpu ops] (GPU time per pass kind, blit, copy, resolve and clear, from Turnip's timestamp brackets).", "T61: sheng-gpu-trace-export=<seconds> exports the render server's GPU trace directory (m2v/gpu, boot_diag_scan_gpu) with the screen every so many seconds, each round into the 64 MiB quarter of the diagnostic half that the header does not name, so the header always names a complete copy whenever the phone is taken to recovery; a full export (sheng-diag-export) still runs once and ends the rounds. While it runs, the Metal plugin's pipeline-cache exports are refused, as with any diagnostic export. [diag] counts the rounds. scripts/pull-asteroids-log.py now also reads a named diagnostic export from the export region, unpacks it into diag/ and runs scripts/gpu-trace.py into gpu-trace.txt.", "T62: [gpu tables] (sheng's row: table mode, CP aperture and switch check, switches by CP and CPU, address spaces, table pages on demand, ias, BO pool chunks) and [gpu recovery] (hangs and restarts, shown once one happened); eight [gpu client text] rows.", "T64 (2026-10-29): [bo pool] is replaced by [bo memory]: system BOs made and their spans, MiB in use and peak, refusals with the last status, kernel-owned allocations and import spans, from the driver's native_adreno_bo_memory; [gpu tables] drops the pool chunk counts.", "T64: [gpu uc] rows: the GPU probe's stage (0x108 passed, 0x10e missed), its kernel-client test counters (rounds, steps, first error and its step, burst, system BOs, opens) and the test's result lines.", "T65: [bo pool] in the boot log shows the GPU BO pool next to [bo memory]: MiB and chunks reserved, the reservation's and write-combine's IOReturn, BOs it served, BOs sent to system memory for lack of room, MiB in use and peak.", "T73 (2026-10-30): until the root is mounted, the UFS log shows [late probe] (bsd_autoconf's probe step, key events and CPU clock stages) and [kernel threads]: every kernel thread that keeps its stack while it waits, with name, state, wait event and unslid return addresses (boot_kthread_blocked_rows), '*' for bsd_autoconf's thread."]

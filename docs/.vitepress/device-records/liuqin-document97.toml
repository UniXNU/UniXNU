configuration = ["package.yml runs the release against uefi-liuqin, merges adsp.mbn, embeds the touch and Wi-Fi firmware, takes the stock Cape DTB and passes --board liuqin to the ADT step", "Without ipsw_url the run uses uuid5 placeholder volume UUIDs, so its kernel mounts no real volume"]
procedure = ["Run the workflow, read the product check, then download the encrypted artifact and decrypt it with the password from the repository secret."]
findings = ["Runs 42781679150 and 42788427078 are green end to end: firmware, boot image, product check, encrypted upload.", "The bootable image is a v4 container assembled outside `release`: gzip(BootShim + FD) plus the stock Cape SoC DTB in the kernel slot, PONGFAT1 payload in the ramdisk slot, so one `fastboot boot` from the stock ABL is enough.", "The shared tree has no driver package for PACKAGES_PATH; a firmware preflight copies {tree}/drivers/DarwinBoot24 out of the device repository (5d09b75, still required).", "The uEFI FD has 2632 B free in FVMAIN: the next module added to liuqinPkg will not fit."]

evidence = [{kind = "source", reference = ".github/workflows/package.yml", result = "Workflow: stock release steps for ADSP, touch and Wi-Fi firmware, then kernel, payload, firmware, boot image and the product check."}, {kind = "host", reference = "https://github.com/Document97/UniXNU-liuqin/actions/runs/42788427078", result = "Green run: liuqin-xnu-initial.img 102,162,432 B, kernel.macho 30,256,864 B, product check passed, artifact uploaded encrypted.", command = "gh workflow run package.yml -R Document97/UniXNU-liuqin --ref liuqin -f os=ipados-18.7.10-22H374 -f prelink=false", revision = "df2dd999fb24fa462896b0240e4bad2ad6bff1dc"}]

[[area]]
id = "memory"
status = "implemented"
components = ["PongPlatform24"]
paths = ["configs/liuqin-memory-sm8475.json", "scripts/gen-liuqin-memory.py"]
inputs = ["8 GB unit /memory from the stock ABL: 0x80000000+0x6A000000, 0xF1400000+0xEC00000, 0x800000000+0x39700000, 0x839D00000+0x1E00000, 0x840000000+0x140000000 (1696108518/iPadOS-liuqin NOTES.md 6.2)"]
configuration = ["Reserved = union of mainline liuqin reserved-memory, stock uefiplat.cfg and the pong SM8475 vendor capture; allocatable = DRAM minus that union"]
procedure = ["python3 scripts/gen-liuqin-memory.py [--fetch] [--dram base:size,...] regenerates the file and the memory/reserved-memory of dts/liuqin.dts."]
findings = ["7.81 GiB in five banks; 58 distinct reserved ranges; 12 allocatable ranges, 6.33 GiB.", "Every Reserv/RtData region of the V14.0.9.0.TMYCNXM uefiplat.cfg is excluded; HYP Reserved 0x830000000 +0x10000000 was allocatable before it was read.", "The kernel intersects every allocatable range with the boot's EfiConventionalMemory, so the union can only over-reserve."]
completion = ["DarwinBoot claims its window from these ranges and the kernel reaches launchd without a memory fault."]
limits = ["The 12 GB variant needs its own --dram; this tablet's /sys/firmware/fdt should replace the mainline input when captured."]
next_action = ["Capture /sys/firmware/fdt on the tablet and regenerate."]
evidence = [{kind = "source", reference = "scripts/gen-liuqin-memory.py", result = "Generated 5 banks 7.81 GiB, 99 reserved entries, 12 allocatable ranges 6.33 GiB; dts/liuqin.dts is written by the same run."}]

[[area]]
id = "display"
status = "implemented"
components = ["PongPlatform24"]
paths = ["configs/liuqin-board.json", "drivers/PongPower/LiuqinBacklight.cpp", "configs/liuqin_ipados18_defconfig"]
inputs = ["CSOT m81_42_02_0b NT36532 TDDI, dual DSI, DSC, video mode, 1800x2880", "KTZ8866 backlight at QUP0 SE1 (i2c@984000, gpio4/gpio5), address 0x11, 11-bit brightness (0x04 bits 2:0, 0x05 bits 10:3, 0x08 bit 6 enable)"]
configuration = ["The UI renders in software into the ABL framebuffer (0xb8000000, display-scale 2); no GPU scanout yet", "CONFIG_XNU_PONG_BACKLIGHT=y builds LiuqinBacklight.cpp in place of pong's DSI backlight; pong_backlight=0 keeps the ABL brightness"]
procedure = ["Drive the KTZ8866 over the GENI I2C bus at 100 kHz the way Linux ktz8866.c does (LSB, then MSB, enable bit cleared at 0), leaving the ABL's bias, current sinks and ramp untouched, and keep PongBacklight's CoreBrightness layer above it."]
findings = ["pong dims an OLED with DSI DCS commands; liuqin's LCD has the KTZ8866 at a different bus, so the driver was replaced rather than extended.", "The ABL already configured the panel's bias and sinks, so the driver only touches the brightness registers.", "The ADT carries no backlight node: the driver uses fixed bus and GPIO numbers, and PongBacklight's /chosen property stays absent."]
completion = ["SpringBoard renders on the panel and the brightness slider changes it."]
limits = ["Built into kernel.macho (run 42788427078) but never booted.", "Software rendering only; no refresh-rate control and no GPU scanout."]
next_action = ["Boot it and move the brightness slider."]
evidence = [{kind = "source", reference = "drivers/PongPower/LiuqinBacklight.cpp", result = "KTZ8866 driver: register writes, GENI I2C setup, the CoreBrightness conformance, and the ABL-configured parts it deliberately leaves alone."}, {kind = "host", reference = "https://github.com/Document97/UniXNU-liuqin/actions/runs/42788427078", result = "The kernel builds with PONG_BACKLIGHT=y and the boot arguments carry pong_backlight=0.", command = "gh workflow run package.yml -R Document97/UniXNU-liuqin --ref liuqin -f os=ipados-18.7.10-22H374 -f prelink=false", revision = "df2dd999fb24fa462896b0240e4bad2ad6bff1dc"}]
[[area]]
id = "input"
status = "implemented"
components = ["PongPlatform24"]
paths = ["dts/liuqin.dts", "configs/liuqin-board.json", "drivers/LiuqinTouch/liuqin_nvt.c", "patches/xnu-ipados18/zzzzzzzzzz-liuqin-nt36532-touch.patch"]
inputs = ["NT36532 on spi@990000 CS0, 8 MHz by default (9.6 MHz maximum), IRQ gpio21, no reset line", "Novatek images from the stock release touch/: CSOT m81_42_02_0b (this tablet, liuqin_touch_fw=1) and Tianma m81_36_02_0a (=2), both checked against the release manifest"]
configuration = ["liuqin_touch=1 selects the liuqin driver; pong_touch=0 leaves pong's Goodix driver out", "liuqin_touch_fw, liuqin_touch_hz, liuqin_touch_flip and liuqin_touch_log are the other arguments", "build-xnu-ipados18.sh embeds the images found in LIUQIN_TOUCH_FW_DIR into kernel.macho, so the kernel carries the firmware it downloads at boot"]
procedure = ["Keep pong_goodix.c's GENI/TLMM/clock path (same SE4, same pins 16-19 and 21) and add the NT36532 download and report protocol; samples go to /dev/pong-touch through pong_touch_post()."]
findings = ["The NT36532 is flashless: it waits in its boot loader until the host downloads the image, and it wants the status handshake within about 18 s.", "liuqin has no touch reset line and no touch supplies of its own: the panel's prepare resets the TDDI die and the firmware is downloaded after that.", "The device quirks (GENI duplex opcode 3, the CRC reboot loop and its 0xa5 escape) come from the earlier iPadOS-liuqin work on this tablet."]
completion = ["Touches reach SpringBoard; the pen and the keys behave."]
limits = ["Built into kernel.macho (run 42788427078) but never booted on the tablet.", "The report decode has only been exercised by the driver's own log so far."]
next_action = ["Boot it with liuqin_touch_log=8 and read the first reports."]
evidence = [{kind = "source", reference = "drivers/LiuqinTouch/liuqin_nvt.c", result = "Polled NT36532 driver over QUP0 SE4: image download with the hardware CRC, the 65-byte point report, and the boot arguments above."}, {kind = "host", reference = "https://github.com/Document97/UniXNU-liuqin/actions/runs/42788427078", result = "kernel.macho 30,256,864 B carries both Novatek images (names visible in the binary) and the ADT carries /arm-io/liuqin-touch.", command = "gh workflow run package.yml -R Document97/UniXNU-liuqin --ref liuqin -f os=ipados-18.7.10-22H374 -f prelink=false", revision = "df2dd999fb24fa462896b0240e4bad2ad6bff1dc"}]
[[area]]
id = "storage"
status = "planned"
components = ["PongPlatform24"]
paths = ["board.toml"]
inputs = ["UFS host 0x1d84000, SID 0xe0, SPI 265 (same SoC); this tablet's GPT"]
configuration = ["[userdata] carries this tablet's own window, 0x2A1600..0x1D143FA in 4 KiB sectors (105.795 GiB), and scripts/install-pong-ufs-data.py and scripts/prepare-ipados18-ufs-layout.py now read it from board.toml instead of hardcoding pong's"]
procedure = ["Parse images/gpt_both0.bin from the stock release that matches the build the tablet runs, with tools/parse-gpt.py; the entry gives the start and the grow-to-end marker, fastboot gives the size. Root, the stage-one UEFI and a reboot are all unnecessary."]
findings = ["The stock release carries the answer: images/gpt_both0.bin of liuqin_images_V14.0.9.0.TMYCNXM_13.0 is the LUN 0 table, and LUN 0 is the disk Android calls sda, so its entry 34 is the sda35 /dev/block/by-name reports.", "That table stores userdata as first_lba 0x2A1600 with last_lba = first_lba - 1, the grow-to-end marker, so the end comes from fastboot: partition-size:userdata = 0x1A72DFB000 B = 0x1A72DFB 4 KiB sectors, hence 0x1D143FA.", "Three checks agree: all 34 partitions above userdata match fastboot's partition-size byte for byte, entries 13 and 24 of gpt_both4.bin are boot_a and vendor_boot_a (the sde14 and sde25 of the 2026-11-12 adb session), and boot_a is 201,326,592 B like the release's boot.img.", "The window is 105.795 GiB, which is df -k /data (110,930,924 KiB) plus 3 MiB of f2fs metadata, and the extent implies a 124.89 GB LUN 0, the usable size of the 128 GB part.", "An unprivileged adb shell never had to be rooted: /proc/partitions, /proc/cmdline and /sys/class/block/*/start stay denied on this ROM, but the GPT in the matching stock release needs neither root nor the stage-one UEFI."]
completion = ["The root and Data volumes mount from UFS."]
limits = ["The other installers, install-ipados18-ufs.py, install-pong-sparse-windows.py and install-pong-relocated-os.py, still name /dev/block/sda13 and pong's window in their own checks; only the layout writer and install-pong-ufs-data.py read board.toml today.", "liuqin has no recovery image yet, and every install script refuses to run outside recovery with userdata unmounted."]
next_action = ["Run package.yml with ipsw_url for 22H374 so the userdata image and the kernel carry the real volume UUIDs, then boot stage two and check the Data volume."]
evidence = [{kind = "source", reference = "board.toml", result = "userdata 0x2A1600..0x1D143FA, 4 KiB sectors, 105.795 GiB, with the derivation recorded in the section comment."}, {kind = "source", reference = "docs/userdata-geometry.zh.md", result = "35 partitions, userdata at entry 34 with last_lba = first_lba - 1; gpt_main0.bin gives the same start and gpt_both4.bin puts boot_a and vendor_boot_a at entries 13 and 24, the sde14 and sde25 of 2026-11-12. The document also records the four cross-checks and why the device side could not supply the number."}, {kind = "source", reference = "tools/parse-gpt.py", result = "The reader the numbers came from: it validates the header CRC and the entry array CRC, detects 512 or 4096 B sectors and header-only files, and compares every partition against a fastboot getvar table."}, {kind = "source", reference = "device-info/fastboot-getvar-2026-11-14.txt", result = "partition-size:userdata = 0x1A72DFB000 B, the measured end the grow-to-end marker needs, plus the 132 partition sizes the six LUN tables were checked against. The serial number is redacted."}]


[[area]]
id = "diagnostics"
status = "implemented"
components = ["PongPlatform24"]
paths = ["board.toml", "configs/liuqin_ipados18_defconfig", "patches/xnu-ipados18/zzzzzzzzz-liuqin-weak-optional-hooks.patch", "scripts/check-liuqin-kernel-probe.py"]
inputs = ["The applog ring of the kernel, the DT panic region, and the ramoops region the defconfig records for this board (0xA7000000)"]
configuration = ["pong_init_trace=1, applog=1 with launchd, backboardd, SpringBoard, containermanagerd, lsd, runningboardd, logd_helper and powerd", "CONFIG_XNU_PONG_RAMOOPS_CONSOLE=y writing at 0xA7000000; [payload] panic_screen is false", "CONFIG_XNU_PONG_VOLATILE_PANIC_LOG=n: the 128 KiB fallback buffer is for a kernel without a DT panic region"]
procedure = ["Read the boot trace through the applog ring; after a panic reboot to Android with Magisk root and read /sys/fs/pstore/console-ramoops-0 and pmsg-ramoops-0, which receive the panic text because the console path records before it checks disableConsoleOutput."]
findings = ["0xA7000000 is not in XNU's managed memory: dts/liuqin.dts declares /memory@840000000 (5 GiB), so the 4 GiB owned window starts at 0x840000000 and the console region at 0xA7000000 is far below it, where the kernel never allocates.", "0xA7000000 is the stock ramoops node of liuqin's dtbo.img (reg 0x400000, console-size 0x200000, pmsg-size 0x200000), so Android's pstore driver exposes the buffer as console-ramoops-0 after the tablet reboots; the 12-byte header and the 0x43474244 magic are persistent_ram_buffer's.", "The mainline liuqin DTS of the same address exists for this purpose: its comment says the zone sizes deliberately match the vendor firmware's ramoops node so a failed boot is readable from the stock kernel's /sys/fs/pstore, since a retail unit has no debug UART, and that pstore allocates dmesg, console then pmsg in that order, so an extra dmesg zone would move the console and break it. The node carries no ecc-size, mem-type or ftrace-size, so the buffer really is a plain persistent_ram with console first.", "The firmware memory map puts the region on FD Reserved (1 MiB) and UEFI FD (3 MiB), both BsData: memory the OS may reclaim after ExitBootServices, and no RtData descriptor lies inside the 4 MiB.", "The pong ramoops address 0x85200000 falls inside the stock PIL reservation of liuqin, which is why the console stayed off until it was repointed.", "PongPower needs pong_ramoops_console_write even with the console off; 3507c53 added a weak default so the build links.", "scripts/patch-xnu-entry-probe.py can patch this kernel: _start_first_cpu, _panic and _vinfo are in the symbol table, the entry branches to _start_first_cpu, the SCTLR/ISB/CPACR sequence is at _start_first_cpu+0x2fc and the probe caves after the entry are NOP padding.", "The applog list is trimmed to the services the first-boot trace reads, and the assembled command line stays below 1000 bytes (785 B in run 42788427078).", "The cave the panic screen links into is NOP fill in this kernel, not zero fill: patch-xnu-entry-probe.py requires zero fill, so run 43184148347 linked the kernel and then stopped with \"Padding at 0xfffffff007fe2518 is not empty\"; panic_screen is off and the ramoops console is the panic channel."]
completion = ["A panic and a boot trace can be read from the device without a serial cable."]
limits = ["The ramoops console is in the kernel of run 43190178662 and in liuqin-xnu-initial.img, but nothing has read it from the tablet.", "Android's pstore read needs Magisk root on the tablet after the unlock; without it /sys/fs/pstore is unreadable."]
next_action = ["Rebuild without panic_screen, then boot the image after the unlock and read console-ramoops-0 from Android."]
evidence = [{kind = "source", reference = "configs/liuqin_ipados18_defconfig", result = "RAMOOPS_CONSOLE=y, VOLATILE_PANIC_LOG=n and the 0x85200000 and 0xA7000000 note."}, {kind = "source", reference = "dts/liuqin.dts", result = "/memory@840000000 reg <0x8 0x40000000 0x1 0x40000000>: physBase 0x840000000 and 5 GiB, so the 4 GiB owned window does not reach 0xA7000000."}, {kind = "source", reference = "scripts/check-liuqin-kernel-probe.py", result = "kernel.macho of run 42788427078: _start_first_cpu, _panic and _vinfo present, the entry branches to _start_first_cpu, the SCTLR/ISB/CPACR sequence is found and the probe cave is empty."}, {kind = "host", reference = "https://github.com/Document97/UniXNU-liuqin/actions/runs/42788427078", result = "The kernel links with PONG_POWER=y and the command line is 785 B.", command = "gh workflow run package.yml -R Document97/UniXNU-liuqin --ref liuqin -f os=ipados-18.7.10-22H374 -f prelink=false", revision = "df2dd999fb24fa462896b0240e4bad2ad6bff1dc"}, {kind = "host", reference = "https://github.com/Document97/UniXNU-liuqin/actions/runs/43184148347", result = "The kernel linked and carries PONG DIAGNOSTIC v92 and pong_ramoops_console, so the ramoops console is in it; the payload step then stopped at patch-xnu-entry-probe.py with Padding at 0xfffffff007fe2518 is not empty.", command = "gh workflow run package.yml -R Document97/UniXNU-liuqin --ref liuqin -f os=ipados-18.7.10-22H374 -f prelink=false", revision = "be91815e91470a2d1d0ac27614a2193017121a0d" }, {kind = "host", reference = "https://github.com/Document97/UniXNU-liuqin/actions/runs/43190178662", result = "Green end to end: liuqin-xnu-initial.img 102,162,432 bytes, sha256 00f714b24ebc001c, carrying a 30,257,184-byte kernel whose symbol table has _pong_ramoops_console_init, _pong_ramoops_console_write and _pong_ramoops_diagnostic_write as real code (the run with the console off has only the weak stubs four bytes apart), and whose strings include PONG DIAGNOSTIC v92 and isolated pmsg recorder ready. The command line is 785 bytes.", command = "gh workflow run package.yml -R Document97/UniXNU-liuqin --ref liuqin -f os=ipados-18.7.10-22H374 -f prelink=false", revision = "9050350664864cd84aed8b715cef1c70958242ba" }]

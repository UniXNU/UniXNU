components = []
paths = ["scripts/**", "package/**", "patches/**", "out/build.json", "unixnu.lock"]
inputs = ["iPad7,1 iPadOS 17.7.11 build 21H461 restore inputs.", "Target kernelcache, XNU 10063.141.1, DriverKit and TrustCache ABI inputs.", "Android v3 RAM-boot image, a 4 MiB phase 1 embedded FAT payload and a measured 56 MiB phase 2 candidate."]
configuration = ["The phase 1 image is produced by the project build script and verified against recorded hashes.", "Format 2 output is out/elden/ipados-17.7.11-21H461/elden/.", "The 2.2 prelink output is kernel/kernel.macho and its ADT sidecar; no phase 2 boot image is generated."]
procedure = ["Run scripts/build_phase1.py for the accepted firmware path.", "Fetch the target IPSW components and build the patched 4 KiB XNU.", "Prelink against the pinned kernelcache and audit Mach-O, ABI, symbols and ADT.", "Package an isolated near-final-size payload only in Phase 2.3."]
findings = ["The documented Phase 1 build was device-verified and the current procedure rebuilds and passes structural checks.", "The same current recipe produced 94b6a6315b04fc9d276bc15e9519107be292244380fc3bf139f5af6c96a3bb0a instead of the historical accepted image hash; byte-for-byte rebuild identity is not claimed, but the new image completed two owner RAM cold boots.", "The verified UniXNU third-party pin is intentionally retained for the accepted build.", "Phase 2.2 produced a 21,206,040-byte native kernel and a 54,050,816-byte prelinked kernel. The 57-patch sequence selects 30 executable Apple components, 7 kernel interfaces and 30 module entrypoints.", "A 58,720,256-byte FAT volume held the 54,063,968-byte kernel/config/ADT set with 3,734,016 bytes free and a byte-identical kernel readback; that 2026-10-25 volume was actually FAT32 (mformat -F) and is only mountable because 56 MiB clears the EnhancedFatDxe FAT16 cluster floor.", "EnhancedFatDxe derives the FAT type from the cluster count: a FAT32 BPB with fewer than 65,525 clusters returns EFI_VOLUME_CORRUPTED, so the 8 MiB FAT32 probe volume never became a SimpleFileSystem and UniXNU fell back to the built-in menu. The probe and payload volumes are now written as FAT16 by scripts/make_payload.py, and scripts/verify_phase2_artifact.py recomputes the cluster count and BPB label for every candidate.", "The prelink report remains runtime_qualified=false, abi_qualified=false and loadable=false until device execution evidence exists.", "The embed_payload images were device-verified on 2026-11-01: EnhancedFatDxe mounted both FAT16 volumes, UniXNU read \\EFI\\UniXNU\\unixnu.toml from the embedded payload and listed its entries next to the green checkpoint, so the kernel-field payload channel replaces the ramdisk channel for phase 2.3.", "The menu used the automatic scale (MAX (1, Width / 270) = 7 on the 1904-pixel short side) and truncated the footer; the scale is now pinned to 4 in package/phase2.3-unixnu.toml, which scripts/make_phase2_payload.py reads by default."]
completion = ["All format 2 build steps run from the resolved output directory.", "The payload contains the kernel, ADT and declared optional inputs.", "The boot image matches the ABL header and size limits."]
limits = ["The three 2026-10-31 device failures (two v3 probe boots, one v4 boot) share the broken FAT32 probe volume, so they do not disprove the ABL ramdisk handoff; that channel is unproven rather than closed, and reopening it needs firmware that still contains UniXNURamDiskDxe. The embed_payload channel that replaced it is device-verified; see docs/PHASE2.3-STATUS.md.", "The current 4 MiB board payload belongs to the accepted phase 1 build; the phase 2 payload is 56 MiB and is only used by the separate out/phase2.3 candidate.", "The 2.2 host build used Command Line Tools with an iPhone platform shim because full Xcode is absent; release rebuilding still requires the official Xcode/iPhoneOS SDK."]
next_action = ["Phase 2.3 host and device work is complete; the owner re-boots out/phase2.3/elden-phase2-embed-probe.img (d40537f5a752d306e57d5d7672f1bd2ca3706b933b356f0e4d9b2c1af796ff7e) and out/phase2.3/elden-phase2-embed-boot.img (3dc8ae9611ec899ff14d50032ecd0ce2dd1035b3af9f9d3183bbab6cd41bcd93) only to confirm the smaller menu scale. Choosing the xnu entry is Phase 2.4 work."]

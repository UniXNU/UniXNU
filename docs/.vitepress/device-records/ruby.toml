id = "configuration"
status = "host-verified"
components = []
paths = ["README.md", "board.toml", "porting.toml"]
inputs = ["MT6877 board identity, iPhone X iOS 16.7.16 (20H392) userland, XNU 8796 recipe and the 0179 patchset from lky005/ruby-ios-bringup."]
configuration = ["board.name = ruby; board.soc = MT6877; board.os_profile = ios-16.7.16-20H392; [components].include = [].", "No SoC source, kit, defconfig, firmware or package section is selected in this catalog repository."]
procedure = ["Read README.md and follow the pinned links to the main repository.", "Use the main repository xnu-0179 workflow as the build gate; this repository has no CI."]
findings = ["Public main is the 0179 line: patchset 10b1e2e8 (175 files), exec-data a4fb021e and image d438ba47; v0.5.0 is anchored at 22cdb29 and the current main is b3c704f.", "The 0179 device gates passed G1-G6; the 8-failure soft reset logged no-ack and G7/G8 plus a full 10 min repeat were cancelled by decision."]
completion = ["The catalog identity matches the main repository and the generated device page links to the pinned record."]
limits = ["This repository is not a UniXNU build tree; it has no configs, patches, firmware, package or component sources."]
next_action = ["None for this line; future P2c/P3 changes get their own record."]

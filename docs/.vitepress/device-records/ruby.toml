schema_version = 1

[device]
name = "ruby"
soc = "MT6877"
os_profile = "ios-16.7.16-20H392"
summary = "Catalog identity for the ruby (Redmi Note 12 Pro 5G, MT6877) XNU 8796 + iPhone X iOS 16.7.16 (20H392) userland bring-up. Public main documents the verified 0155 line; p3-eint-hal (0160, ruby_eint/EINT14) is in development. The implementation, build recipe and device evidence live in lky005/ruby-ios-bringup. This repository selects no UniXNU components and does not claim a UniXNU UEFI or format-2 build."

[[area]]
id = "configuration"
status = "host-verified"
components = []
paths = ["README.md", "board.toml", "porting.toml"]
inputs = ["MT6877 board identity, iPhone X iOS 16.7.16 (20H392) userland, XNU 8796 recipe and the 0155 patchset from lky005/ruby-ios-bringup."]
configuration = ["board.name = ruby; board.soc = MT6877; board.os_profile = ios-16.7.16-20H392; [components].include = [].", "No SoC source, kit, defconfig, firmware or package section is selected in this catalog repository."]
procedure = ["Read README.md and follow the pinned links to the main repository.", "Use the main repository xnu-0155 workflow as the build gate; this repository has no CI."]
findings = ["Public main is the 0155 line: patchset da13b6df (151 files), exec-data 2e98fd85 and image 3b44c0e2.", "The development branch p3-eint-hal (0160) adds ruby_eint and wires EINT14 into the touch thread; its CI builds are green, but this record does not claim a 0160 device gate."]
completion = ["The catalog identity matches the main repository and the generated device page links to the pinned record."]
limits = ["This repository is not a UniXNU build tree; it has no configs, patches, firmware, package or component sources."]
next_action = ["Merge the 0160 line to main and refresh the public status links after its device gate is published."]

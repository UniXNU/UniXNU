[[area]]
id = "input"
status = "device-verified"
components = []
paths = ["README.md"]
inputs = ["Goodix GT9916R touch panel on EINT14 (edge falling) with the SPI288 parent, and the volume/power keys."]
configuration = ["The 0179 line boots with the native EINT14 oneshot service (rubyeint=1, rubyeintb1=1, rubykpdirq=1); gt_thread is removed and commands run on the IOCommandGate. The 0085 bit-bang poll is historical."]
procedure = ["Boot the 0179 image; touch the panel; observe EINT14 oneshot active/enabled and HID down/up; press the volume down key; run eint status and gt diag."]
findings = ["Public STATUS records G1-G6; first 10 min isr 2381->6004, ok 5997, fail 7; ~5 min stress isr 8672->13282, ok 12866, fail +9; 1-5-finger frames; no panic/stuck/re-activation.", "G7/G8 and a full 10 min repeat were cancelled by decision; the 8-failure soft reset logged no-ack and the ok path is not proven; no ESD timer."]
completion = ["Native EINT14 touch and the hardware keys reach userland on the 0179 image."]
limits = ["G7/G8, a full 10 min repeat, the soft-reset ok path and ESD/silent-stuck recovery are not claimed."]
next_action = ["No additional gate for this line; future P2c/P3 changes get their own record."]
[[area.evidence]]
kind = "device"

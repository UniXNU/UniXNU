schema_version = 1

[device]
name = "ruby"
soc = "MT6877"
os_profile = "ios-16.7.16-20H392"
summary = "Catalog identity for the ruby (Redmi Note 12 Pro 5G, MT6877) XNU 8796 + iPhone X iOS 16.7.16 (20H392) userland bring-up. Public main documents the verified 0179 line (v0.5.0 at 22cdb29; current main b3c704f); the native EINT14 touch path is verified, G7/G8 and a full 10 min repeat were not run. The implementation, build recipe and device evidence live in lky005/ruby-ios-bringup. This repository selects no UniXNU components and does not claim a UniXNU UEFI or format-2 build."


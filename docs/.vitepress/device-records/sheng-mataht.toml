[[area]]
id = "power"
status = "device-verified"
components = []
paths = ["platform/sheng/macos26/power/**", "platform/sheng/macos26/adsp/**"]
inputs = ["PMIC state (RTC, backlight drivers KTZ8866 x 2), ADSP-owned battery and charger services, RPMh, the performance and memory-latency state, and PSCI system reset/off."]
configuration = ["Default-off drivers: NativeRtc (sheng-rtc), NativeBacklight (sheng-backlight, always clamped to 64..2047), NativeMemPerf (sheng-memperf), NativeAdsp and NativeBattery (sheng-adsp, sheng-battery), and a PSCI reset/poweroff hook (sheng-psci-reset). Charger writes are off and the critical battery level is never asserted."]
procedure = ["Boot with sheng-<driver>=1 for the read-only snapshot; with sheng-rtc=2 and sheng-psci-reset=1 for RTC calendar publication and Apple menu Restart / Shut Down."]
findings = ["The first stage of each ran on the tablet without writes. XNU waits up to 30 seconds for an IORTC service at boot. With sheng-rtc=2 the platform expert publishes IORTC early and NativeRtc moves the calendar forward; on the tablet this saved about 30 seconds (WindowServer's screen about 49 seconds after the boot command against 75 to 81 seconds before). The calendar starts at the packaging time, not the true time. The ADSP firmware owns the Type-C controller.", "With sheng-psci-reset=1, clicking Restart in the Apple menu (boot 49) and Shut Down in the Apple menu (boot 50) cleanly unmounted the APFS Data and Update volumes (xid 13986 and 14318, 0 checksum failures) and rebooted to Android or powered off the tablet.", "System sleep panics in QEMU because the platform does not register its cores for sleep, so sleep is disabled."]
completion = ["Clean system restart and shutdown from macOS; RTC calendar published at boot; battery state, brightness control and sleep."]
limits = ["No thermal sensor driver ran on hardware in this repository; no battery reporting, no brightness control, no true time (the calendar starts at the packaging time), no sleep."]
next_action = ["Archived; see upstream UniXNU / UniXNU-sheng for active development."]


[[area]]
id = "cpu"
status = "device-verified"
components = []
paths = ["platform/sheng/macos26/patches/machine-cpu-*.patch", "platform/sheng/macos26/pac/smp_keys*.h", "platform/sheng/macos26/power/native_cpufreq.cpp"]
inputs = ["Eight cores (three Cortex-A510, four A715, one X3) brought up with PSCI; inter-processor interrupts through SPIs; CPU frequency registers read from the performance domains."]
configuration = ["Boot arguments cpus=8, sheng-smp=1, armcpu-spi-ipi=1; sheng-cpufreq=1 enables the read-only frequency reader."]
procedure = ["Boot with the packager's 8-CPU configuration; with sheng-cpufreq=1 the reader prints a CPUFREQ row every 5 seconds for 120 seconds."]
findings = ["All eight cores came online on the tablet on 2026-11-07 (cpu_start 0 to 7), on an earlier build of this repository.", "The bootloader leaves the clusters near the top of their ranges: 1670 MHz (A510), 2707 MHz (A715), 2956 MHz (X3), L3 vote 12 (1574 MHz), including during slow Metal plug-in boots, so CPU throttling is ruled out.", "This CPU reports cache geometry in the 64-bit CCIDX format of CCSIDR; XNU's whole-cache set/way shortcut parses the old format and is effectively a no-op here, so display and GPU code clean caches by address."]
completion = ["Every enabled core reaches its entry checkpoint; timers and inter-processor interrupts work on each core."]
limits = ["No thermal sensor (TSENS) or dynamic CPU frequency scaling (DCVS) has run on hardware in this repository; kernel work-interval creation fails when AppKit starts live scrolling (causing scroll-bar drags to abort)."]
next_action = ["Archived; upstream UniXNU / UniXNU-sheng already includes CPU/GPU DCVS and kernel work-interval patches."]


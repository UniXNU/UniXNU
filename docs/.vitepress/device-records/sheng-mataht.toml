[[area]]
id = "storage"
status = "device-verified"
components = []
paths = ["platform/sheng/macos26/storage/**", "scripts/package_macos26_ufs.py", "scripts/native_log_file.py", "scripts/repartition_*.py", "scripts/install_macos26_*.py"]
inputs = ["UFS controller with several LUNs; a dedicated partition for macOS on LUN0; a small log partition; a system image supplied by the user (this repository neither contains nor documents how it is made)."]
configuration = ["NativeUfs publishes only registered partition windows after checking the SHNGROOT header (size and SHA-256). Writes are off by default and can go either to a volatile RAM overlay (native-ufs-root-overlay-mib, with optional wired-page pool outside the zone map via native-ufs-root-overlay-pool=1) or to persistent disk within the OS window of macossystem (native-ufs-root-writes=1)."]
procedure = ["Create the partition and write the image only with the device owner's approval for each step; the packager refuses a package without matching install evidence. Boot with `fastboot boot`; after persistent boots, run a read-only TWRP 8 MiB chunk scan and offline APFS Fletcher-64 verification."]
findings = ["The 1140 s RAM overlay write report (boot 47, 4096 MiB pool) showed a ~2 GiB burst in the first 6 minutes and ~250 MiB over the next 800 s, written by system cache daemons (coresymbolicationd 1885 MiB, iconservicesd 392 MiB, mediaanalysisd 385 MiB, iconservicesagent 198 MiB, corespotlightd 130 MiB).", "Persistent disk writes (native-ufs-root-writes=1) are guarded in both RootLayout and RootCommands (20 of 21 injected defects caught offline, 1 no-op when closed) and verified across four tablet boots (boots 46, 48, 49, 50, up to 593 modified 8 MiB chunks / ~2.59 GB), with 0 changes outside the OS window, 0 APFS Fletcher-64 checksum failures across checkpoints xid 12808 -> 13104 -> 13409 -> 13986 -> 14318 (up to 1008 objects verified), clean Data and Update volume unmounts on Apple menu Restart (boot 49) and Shut Down (boot 50), and 1266 log and crash-report files extracted from the Data volume."]
completion = ["The root volume mounts, the data volume mounts, and both RAM-overlay and persistent OS-window writes work cleanly across reboots."]
limits = ["No TRIM in persistent mode; UFS read/write/flush timeouts are tight (1 s, 2 s, 10 s). The UFS driver cannot be exercised in QEMU, so full-system QEMU evidence comes from a VirtIO build of the same kernel with only the storage driver replaced."]
next_action = ["Archived; see upstream UniXNU / UniXNU-sheng for active development."]


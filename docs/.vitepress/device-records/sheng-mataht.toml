configuration = ["The packager refuses a package unless its evidence matches: same kernel identity, QEMU observations, root install evidence and, for full-system packages, a sibling VirtIO build of the same kernel. A tiered policy decides whether earlier long-run evidence can be reused, by comparing build records."]
procedure = ["Assemble the kernel twice and compare byte for byte; run the quick QEMU gates (root found, storage default off, memory layout, eight cores); package; verify the package with an independent script that compares container, kernel, device tree and boot arguments."]
findings = ["Assembly outputs and packages contain Apple code and vendor firmware and stay local; the repository holds the tools and tests.", "Reusing evidence is decided by comparing build records, not by hand.", "Every new kernel booted on 2026-11-10 evening and 2026-11-11 early morning had a complete 1200-second QEMU full-system run beforehand without a panic and with the image unchanged, as did the changed-rows display copy mode. Earlier boots 14 to 17 were made under per-package user waivers before their 1200-second runs were completed afterwards.", "The QEMU observer tool was fixed so that if the VM stops in user space at the time limit, it briefly steps the VM into kernel space before the final kernel data read."]
completion = ["Every package passes the independent review before any boot is requested."]
limits = ["The local assembly and review outputs are not published, so a third party cannot rerun the review without their own inputs."]
next_action = ["Archived; see upstream UniXNU / UniXNU-sheng for active development."]


[[area]]
id = "input"
status = "device-verified"
components = []
paths = ["platform/sheng/macos26/input/**", "scripts/native_touch.py", "scripts/native_button_keys.py", "scripts/native_keyboard.py", "patches/UniXNU-sheng/0010-touch-firmware-from-device-tree-and-cn-pins.patch"]
inputs = ["Novatek NT36532E touch on a GENI SPI engine (QUP1 SE4, GPIO 44 to 47, interrupt GPIO 25), 20319 x 30479 raw range; power and volume keys on the PMIC (SPMI); the keyboard cover on GENI I2C with its own MCU."]
configuration = ["Touch follows UniXNU-sheng's host-computed route: the host downloads the touch firmware into the controller at each boot, reads the capacitance frames and computes a single absolute pointer (sheng-touch=1..4). The firmware is a vendor file read from the user's own device and injected into the device tree locally; it is not in this repository. Keys: native-button-keys=1 reports arrows, Tab and Return. Keyboard cover: sheng-kbd=1..5, default off."]
procedure = ["Boot with sheng-touch=4 for a working pointer; bring-up stages 1 to 3 are read-only or clock and pin only and were run in order with approval for each boot."]
findings = ["The pointer follows the finger from the Apple-logo phase on; touch opens and interacts with Finder, Notes, System Settings, App Store and Apple menu items (Restart in boot 49, Shut Down in boot 50); selecting About This Mac with the power key (Return) opens the window in boot 50, while slight finger movement between press and release causes menu items to treat some touch taps as drags.", "On the full system a stage-1 read of the keyboard cover shows regulators L6B, L12B and L13B off. Stage 2 (clocks and engine identity, no rail, no bus traffic) passed on the tablet. Stage 3 (boot 28, first voltage vote via RPMh for L12B 1.8 V and L13B 3000 mV) did not receive a completion signal for L12B within 50 ms and stopped by design (L13B not voted, no I2C traffic); 13 seconds later a kernel lock-wait timeout panic occurred (same signature as boots 03 and 45 without a keyboard driver, causal link not established). Inferred cause of the missing completion: the command channel (TCS 2) completion interrupt was not enabled before voting; a fix was written and verified in host tests and QEMU offline but not booted before archiving."]
completion = ["Touch produces correct pointer coordinates and clicks; keys drive Recovery and menus; the cover types."]
limits = ["Single finger only, no tap-slop threshold yet. The keyboard cover's stage 3 voltage vote did not complete on hardware in this repository, and stages 4 and 5 were not run on hardware. No interrupt line is used; the drivers poll."]
next_action = ["Archived; upstream UniXNU-sheng already has working keyboard cover keys and touchpad pointer on macOS 27.3."]


[[area]]
id = "display"
status = "device-verified"
components = []
paths = ["platform/sheng/macos26/display/**", "platform/sheng/macos26/recovery/**", "config/macos26-recovery-ui-pages.json", "config/macos26-full-ui-pages.json"]
inputs = ["Framebuffer left by the bootloader, 3048 x 2032 BGRA; panel size 262 x 175 mm."]
configuration = ["NativeGOPDisplay presents the framebuffer as an IOMobileFramebuffer (native-gop-display=1, requesting kIOMapWriteCombineCache). Without the Metal plug-in (sheng-full-ui=1), WindowServer is switched to CPU compositing; with the Metal plug-in (sheng-full-ui=2), WindowServer composites on the Adreno 740. A software cursor is forced; sleep is disabled; optional changed-row copy (native-gop-forward-mode=1), per-address cache maintenance (native-gop-cache=1) and strip-free desktop mode."]
procedure = ["Boot with native-gop-display=1 and either sheng-full-ui=1 (software) or sheng-full-ui=2 (Metal plug-in)."]
findings = ["Both CPU-rendered and GPU-composited desktops display wallpaper, menu bar, widgets, Dock and application windows; strip-free clean desktop verified in boots 49 and 50.", "In boot 43 (single GPU ring), GPU fence waits averaged ~1.5 ms, whereas the display driver's CPU copy took 0.36 to 0.40 s per frame (~2.5 to 3 fps): most sampled frames spent 330 to 368 ms reading and comparing 24.8 MB of surface pixels (~75 MB/s), while two fast frames completed read/compare and wrote 223 rows in 52 to 55 ms (>=475 MB/s read), inferred to reflect non-cacheable vs cacheable surface page mappings. NativeGOPDisplay requests kIOMapWriteCombineCache, which XNU honors only when is_dram_addr(pa) holds."]
completion = ["The first frame is presented, the GPU-composited desktop and apps are drawn and the pointer follows the finger."]
limits = ["No backlight control; per-frame CPU surface read/compare and blit takes 0.36 to 0.40 seconds (~2.5 to 3 fps)."]
next_action = ["Archived; upstream UniXNU-sheng uses GPU framebuffer copy (fb-gpu=1) and experimental direct DPU scanout."]


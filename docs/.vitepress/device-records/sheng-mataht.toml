[[area]]
id = "network"
status = "implemented"
components = []
paths = ["platform/sheng/macos26/net/**", "scripts/native_wifi.py"]
inputs = ["Wi-Fi and Bluetooth chip (WCN7850 family) on PCIe0 with its power rails, the sleep-clock pin and the MHI interface; vendor firmware is never stored here."]
configuration = ["NativeWifi, default off: sheng-wifi=1 read-only snapshot, 2 power and PCIe link with endpoint identification, 3 BAR0 and MHI registers. The class is an Ethernet-style controller from IONetworkingFamily. RPMh TCS 0 is used."]
procedure = ["Boot with sheng-wifi=N for stage N; stages 2 and above power the chip and need approval for each boot."]
findings = ["Stage 1 on the tablet: the PCIe0 power domain is collapsed with no clock votes; WLAN_EN, BT_EN and PERST# read low; two of the chip's rails read off and three on at the pinned voltages; the sleep-clock pin is idle and owned by another execution environment.", "Stage 2 on the tablet: power, PCIe0 link and endpoint identification; the endpoint ID reads 17cb:1107 (WCN7850), the sleep clock goes from idle to driving and one chip rail from off to on.", "Stage 3 on the tablet: BAR0 (2 MiB) mapped, bus mastering on, the MHI register block and the BHI registers read without a panic; MHIVER reads 0xdeadbeef, meaning not established (digits read from a video).", "Stage 4 on the tablet (boot 23): firmware loaded into the 8 MiB DMA window (length and digest verified by the kernel), Wi-Fi SMMU stream routed and MHI/BHI layout read without hanging; this SMMU does not support address translation self-test (ATOS), so the DMA window translation is unverified.", "Stage 5 on the tablet (boot 26): chip power-up and boot loader doorbell executed without hanging or panicking; the result rows print only after the chip reports ready, after the GUI had already taken over the screen, so the stage 5 outcome is unknown."]
completion = ["The endpoint enumerates, firmware loads, a network interface is published and packets flow."]
limits = ["The SMMU does not support ATOS, so the stage 4 DMA translation is unverified; the stage 5 outcome was hidden behind GUI takeover; there is no wireless protocol stack in this repository. Firmware is read from the tablet's own Android partitions and never stored here. Bluetooth has only had its pin and clock read."]
next_action = ["Archived; upstream UniXNU-sheng already has working Wi-Fi association, DHCP and traffic on macOS 27.3."]


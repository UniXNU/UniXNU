[[area]]
id = "userspace"
status = "device-verified"
components = []
paths = ["platform/sheng/macos26/login/**", "platform/sheng/macos26/recovery/**"]
inputs = ["The installed macOS 26.5 system supplied by the user, its original trust caches, and a few services the platform lacks (a watchdog and a key store)."]
configuration = ["Development policy: dyld skips libignition; the original trust caches are loaded unchanged with no entries of our own (Metal plug-in boots add the plug-in's two CDHashes and set lp-sip0 to 2); platform UUID from the device tree; panic_on_crash_disabled=1; minimal IOWatchdog (reports disabled) and AppleKeyStore (no keybag, no passcode, unlocked) enabled by sheng-watchdog=1 and sheng-aks=1; autoLoginUserScreenLocked=false and MiniBuddyLaunch=false."]
procedure = ["Boot the full-system package; auto-login, no screen lock and skipping the post-login Setup Assistant (MiniBuddyLaunch=false) are used on the tablet."]
findings = ["With the login services, MiniBuddyLaunch=false and the single-ring Metal plug-in stack, the tablet boots directly into the GPU-composited macOS desktop and opens Finder (including full-screen), Notes, System Settings, App Store and About This Mac.", "Crash reports extracted from the tablet's Data volume after persistent boots identified two userland/kernel gaps: dragging or clicking a scroll bar aborts in AppKit PerfRegulatorStart with 'Failed to create performance regulator work interval (error %i).' because kernel work-interval calls are unimplemented in this repository; Photos aborts with an uncaught NSAssertionHandler exception in PhotosUIFoundation PXCreateContext under PXGMetalTextureConverter createTextureFromCGImage / _createTransparentTexture. Offline inspection also showed Safari is missing because the AppOS cryptex was not installed in the 26.5 system image (17 dangling symlinks into /System/Cryptexes/App), and mobileactivationd and apsd crash every ~10 seconds as in QEMU.", "In QEMU, opendirectoryd's first node open often times out after 5 seconds and is retried; runs that hit its intermittent /Search or /Local/Default panic are rerun and not used as evidence."]
completion = ["The GPU-composited desktop appears, persists across clean Apple menu restarts and shutdowns, and runs bundled applications."]
limits = ["Development kernel without a root seal check, AMFI developer mode, no SEP; scroll-bar drag aborts in PerfRegulatorStart without kernel work-interval patches; Photos aborts in PXCreateContext; AppOS cryptex not installed in the 26.5 image."]
next_action = ["Archived; upstream UniXNU / UniXNU-sheng includes the kernel work-interval patches and mounts the AppOS cryptex on macOS 27.3."]


schema_version = 1

[device]
name = "sheng"
soc = "SM8550"
os_profile = "macos-26.5-25F71"
summary = "ARCHIVED (2026-11-12): This experimental repository is archived and no longer updated because upstream (UniXNU / UniXNU-sheng, https://github.com/UniXNU/UniXNU-sheng) already has a faster-progressing macOS implementation for the Xiaomi Pad 6S Pro (sheng) covering macOS 27.3, GPU framebuffer copy and experimental direct scanout, CPU/GPU dynamic frequency scaling, working Wi-Fi networking, keyboard cover and touchpad support, audio and kernel work-interval patches. In this repository's macOS 26.5 (25F71) port on the CN 16 GB / 1 TB unit (RAM-only fastboot boots), the Metal plug-in stack (WindowServer -> Metal plug-in -> metal2vulkan -> Turnip -> Adreno 740 kernel driver) on a single GPU command ring (sheng-gpu-preempt=0) at 401 MHz with IO-coherent GPU buffers boots into a full GPU-composited macOS desktop (wallpaper, menu bar, widgets, Dock) where Finder (including full-screen), Notes, System Settings, App Store and About This Mac open and touch works. Persistent disk writes (native-ufs-root-writes=1) to the OS window on UFS and clean restarts and shutdowns from the Apple menu (sheng-psci-reset=1) are verified across four tablet boots (boots 46, 48, 49, 50), with TWRP chunk scans and offline APFS Fletcher-64 checks (up to xid 14318, 1008 objects verified, Data and Update volumes cleanly unmounted) confirming zero checksum failures and extracting 1266 log and crash-report files from the Data volume."

[[area]]
id = "configuration"
status = "host-verified"
components = []
paths = ["board.toml", "porting.toml", "sources.lock.json", "config/**", "patches/**", ".github/**"]
inputs = ["Pinned upstream sources in sources.lock.json (UniXNU, UniXNU-sheng, uefi-sheng, Apple's open-source XNU 12377.121.6 and companion libraries) and the paired macOS 26.5 (25F71) kernel debug kit, used by CI for headers and signature checks."]
configuration = ["Kernel configuration DEVELOPMENT ARM64 with the SHENG board; XNU patches in platform/sheng/macos26/patches and platform/sheng/macos26/pac, applied in numeric order; driver switches are boot arguments (sheng-gpu-power, sheng-wifi, sheng-kbd, sheng-usb and so on), all default off."]
procedure = ["Build in CI (the builds run in a private repository; the workflow file hw-sheng-cn-1tb.yml in this repository shows the steps, and Actions are disabled here): scripts/build_macos26_xnu.py --link-kernel with the --build-* switches of the drivers to include.", "Assemble the kernel collection locally; assembly uses Apple kernel extensions and its output is not published."]
findings = ["CI compiles and links with the Apple toolchain on an xcode-27 runner; -Werror failures in earlier runs were fixed on the same branch (see docs/ci.md).", "CI artifacts are kept for seven days; the build.json of each run records the SHA-256 of every output.", "A kernel can also be built on a Mac with Xcode 27.2 (SDK 27.2) by the same steps; the SDK check of the build script also accepts 27.2. Against a CI build of the same source the build records have the same keys and differ only in toolchain versions, output identities and absolute paths or parallelism, but object files and the kernel are not byte-identical. A Mac-built kernel counts as a new kernel and passes its own gates."]
completion = ["Every selected driver compiles and links, the ABI audits pass (vtable slot counts, pointer-authentication metadata, no weak imports) and the artifact digests match the GitHub API."]
limits = ["CI does not run the kernel. It proves compile, link and static audits only. This repository is not a UniXNU device repository and does not build with the unixnu tool."]
next_action = ["Archived; see upstream UniXNU / UniXNU-sheng for active development."]


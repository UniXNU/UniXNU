[[area]]
id = "gpu"
status = "device-verified"
components = []
paths = ["platform/sheng/macos26/gpu/**", "patches/Adreno740/**", "patches/UniXNU-sheng-gpu/**", "config/turnip-sources.json", "config/metal-bridge-sources.json", "config/metal-plugin-sources.json"]
inputs = ["Adreno 740 (a7xx) with its GMU, SMMU and firmware (firmware is read from a device tree node and is never stored here); UniXNU's Adreno740 component; Mesa's Turnip driver with a Darwin backend; a Rust Metal-to-Vulkan bridge; a Metal plug-in loaded by WindowServer."]
configuration = ["Kernel: an IOAccelerator front end over UniXNU's Adreno kernel stack, 16 KiB pages, default off, sheng-gpu-power=1..9 (1 is read-only), with cacheable client buffers + pre-submit cache maintenance (sheng-gpu-wc=0), IO-coherent GPU-owned buffers (sheng-gpu-owned-coherent=1), fixed operating point 401 MHz (sheng-gpu-perf=4) and single command ring (sheng-gpu-preempt=0). User space: plug-in bundle (Metal front end, bridge, Turnip) delivered via device tree node."]
procedure = ["Build with the --build-gpu switch (kernel) and the gpu-userland workflow (plug-in); boot with sheng-gpu-power=1 for the read-only stage. Higher stages power the GPU and need the device owner's approval."]
findings = ["QEMU stage A and fake A740 stage B verified WindowServer plug-in loading and first-frame Turnip submission.", "Tablet, stages 1 to 9 without the Metal plug-in (including control boot 39): power domains, clocks, GMU SMMU context and firmware, GX power and heartbeat, TrustZone zap authentication (three secure calls returning 0) and the first GPU command and interrupt through the GPU's own SMMU context all succeeded; boot 39 reached the CPU-rendered desktop quickly.", "Tablet, GPU hang avoided (sheng-gpu-wc=0), IO-coherent GPU-owned buffers (sheng-gpu-owned-coherent=1, boot 40, cutting 300 s driver cache maintenance from ~20.4 s to ~0.58 s and raising completed submissions from 758 to 1088) and 401 MHz clock vote (sheng-gpu-perf=4, boot 41, raising completed submissions to 1534 and cutting the longest client fence wait from ~2.2 s to ~91.5 ms).", "Tablet, full GPU-composited macOS desktop and apps on a single command ring (boots 42, 43, 44, 46 to 50): after setting MiniBuddyLaunch=false, boot 42 reached the full GPU-composited desktop (~9 fps) before hanging the second ring on a CP_BLIT when opening the App Store; switching to a single command ring (sheng-gpu-preempt=0, boot 43) completed 2677 of 2677 submissions in 300 s with 0 hangs and ~1.5 ms average client fence wait, opening App Store, Notes, Finder (including full-screen), System Settings and About This Mac, and running 19 minutes without a GPU hang in boot 47.", "The plug-in contains metal2vulkan (GPL-2.0-or-later or LGPL-3.0-or-later); its build artifacts are not redistributed."]
completion = ["WindowServer and system apps render through the Adreno 740 with Metal on a single command ring."]
limits = ["No GPU thermal control or DCVS has run on hardware in this repository (fixed at 401 MHz); two-ring preemption hangs on a CP_BLIT when opening the App Store; Photos aborts in PXCreateContext when creating a Metal texture bitmap context; intermittent slow boots with the plug-in (boots 21 and 33 slow, subsequent boots fast, cause undetermined)."]
next_action = ["Archived; see upstream UniXNU / UniXNU-sheng for active development."]


result = "Rodin's panel shows the UEFI Boot Manager ('Please select boot device', UniXNU, UniXNU, Power Off, Exit, key hints) and, on selecting UniXNU, the UniXNU 0.1.0 screen (Return to Firmware/Restart/Power off/Tools, red 'no boot entry found', 'drivers 0 loaded / 0 failed'). Volume Up/Down move the selection and the power key activates it, exercising the MT6363/PMIC-GPIO-196 key path and the DSC+VDO framebuffer GOP on hardware. boot-smoke.img sha256 4ad1daace0ecb2584d295541a824cb22ca221df8a04fdec3302b7fe787ed387b = gzip(BootShim + SILICIUM_UEFI.fd) with the stock vendor_boot DTB appended."
revision = "fb30ebe5f837bdd55f4ff128a8ca799122577f08"


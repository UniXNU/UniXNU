schema_version = 1

[device]
name = "rodin"
soc = "MT6899"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Redmi Turbo 4 (rodin, Dimensity 8400-Ultra / MT6899) port. Baseline: rothko (K70 Ultra, MT6989). Hardware inventory largely filled from HyperOS 3.0.305.0 package (PGPT_UFS / vendor_boot DTB / dtbo)."

# 各区域记录：status = planned → implemented → host-verified → device-verified
# 每条 finding / limit / next_action 都要写实际观察，不写推测。

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**"]
inputs = ["SoC 型号确认、stock DTS、内存版本（见 docs/hardware-inventory.md）"]
configuration = ["TODO: 填入 board.toml 字段、DTS 属性与 defconfig 值"]
procedure = ["TODO: 记录实际执行的配置命令"]
findings = ["TODO", "2026-11-14: board.toml 接线 [firmware] preflight 与 [bootimg] dtb（stock DTS→dtc→boot.img）；configuration 区域引用不变，仅随 board.toml 记录该提交。", "2026-11-14: schema 2 ADT 生成器从 dts/rodin.dts 产生 ADT（本地验证 12,824 字节）：修复 memory 段为 12 GiB 单段（0x40000000+0x300000000，与 payload.dram_size 一致）、删除非法占位 touch-spi=<TODO>、GIC 记录值改 0x0c400000；root_match_volume_uuid 留空跳过（尚无 userdata 卷 UUID）。"]
completion = ["所有 source pin 可解析；status 显示预期的覆盖与补丁顺序"]
limits = ["硬件输入未收集"]
next_action = ["按 docs/hardware-inventory.md 收集配置输入"]
evidence = []

[[area]]
id = "firmware"
status = "device-verified"
components = []
paths = ["proprietary-files.txt", "board.toml", ".github/workflows/**", "docs/device-proc-iomem.txt", "docs/hardware-inventory.md"]
inputs = ["官方线刷包、UEFI fork（nvhv460-sketch/Silicium-Rothko，已 add rodinPkg）、lk/preloader 日志"]
configuration = ["external_repository=https://github.com/nvhv460-sketch/Silicium-Rothko.git; config=rodin; dsc=Platforms/Xiaomi/rodinPkg/rodin.dsc; fd=Build/rodinPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd; defines ENABLE_SECUREBOOT=0 DEVICE_MODEL=0 MEMORY_PROTECTION=TRUE SHIP_MODE=FALSE; submodules Mu_Basecore/Common/Mu/Common/Mu_OEM_Sample（linux.yml checkout 不带子模块）; packages 含 Silicon/Silicium + Silicon/MediaTek + Platforms/Xiaomi + Common/Mu(_OEM_Sample) + Mu_Basecore，因 EDK2 !include 沿 PACKAGES_PATH 解析"]
procedure = ["TODO: GitHub Actions Linux full build (steps=full, uefi_repository=nvhv460-sketch/Silicium-Rothko) 产出 SILICIUM_UEFI.fd；再 fastboot boot"]
findings = ["MT6899 SoC mmio 全部与 rothko (MT6989) 一致：GIC 0x0C400000/0x0C440000，watchdog 0x1C00B000，pinctrl 0x10005000，PMIF 0x1CC04000，UFS PHY/HCI 0x112A0000/0x112B0000；DSC0@0x14206000、DSI0@0x1420a000、MUTEX/DISPSYS/MMSYS/OVLSYS 地址均相同。面板 o10_42_02_0a_dsc_vdo_lcm_drv，1220x2712 stride 1248，32bpp；LK 帧缓冲 atag,videolfb = 0xFCC20000/0x33D0000，真机实测验证。RodinHighMemDxe 使用 rodin 实际 12GiB 单段布局。MemoryMapLib v1 保守映射低段 124MiB 固件区+所有 MMIO+LK handoff 结构（DTB 0x47C80000、initrd 0x66F00000、Display Reserved 0xFCC20000）。高段至 0xC0000000 从 live iomem 转录。DSI mode 为 VDO（非 rothko CMD），现有 mode-check 路径自动跳过 command-mode push，GOP 通过 LK framebuffer 发布。", "2026-11-14: linux.yml 的 uefi_repository 默认值钉为 nvhv460-sketch/Silicium-Rothko —— 首次手工触发（run 43571077006）因输入留空在 Check the inputs 阶段即失败。", "2026-11-14 本地 EDK II CLANGPDB 构建（clang 14.0.6，repo Mu_Basecore b2382909 + libfdt/brotli/libspdm 子模块）打通到 FD：SILICIUM_UEFI.fd 2,097,152 字节 sha256 27e8a9d0...8279，FVMAIN_COMPACT 22% 满、FVMAIN 99% 满（72 字节余量）。过程中修掉三个真实阻塞：DarwinBoot 是独立组件包（DarwinBootPkg）而非 UniXNUPkg 子模块；UniXNUPkg 已删除 RamDisk 偏移/大小 PCD；PACKAGES_PATH 必须含 Silicon/Silicium、Silicon/MediaTek、Platforms/Xiaomi、Common/Mu(_OEM_Sample) 与 {tree}/drivers/DarwinBoot。", "2026-11-14 首次 Linux full build（run 43571244515）：内核两遍构建后产出 kernel.macho sha256 fe35b1b3...（第一遍 make 因 mockfs 符号缺失而失败是有意的，第二遍通过），package 产出 UniXNU.efi；固件步骤失败于 fork 专有的 Library/RothkoStage.h 在官方 mu_basecore 中不存在（RodinDisplayDxe.c:1）。修复：驱动自带 RodinStage.h（0x1C00B000 看门狗舞台记录），本地增量构建通过；workflow 增加 firmware (package firmware) 快速通道，跳过内核与 bootimg。", "2026-11-14 真机冒烟（解锁 + A/B 双槽）：MTK LK fastboot 0.5 不支持 fastboot boot（remote: unknown command），改用 root dd 写非活动槽 boot_b + fastboot set_active b 启动；UEFI Boot Manager 与 UniXNU 0.1.0 界面在面板正常显示，音量键移动选择、电源键确认，红字 no boot entry found（空 ramdisk 预期）。恢复命令 fastboot set_active a。", "2026-11-14: CI 固件步骤已成功（run 43576572068，firmware-only 通道，FD 产出 Build/rodinPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd）；新增 firmware preflight 生成 boot.img 基础 DTB，bootimg 需要 --dtb 因此 workflow 显式传入；payload 步骤补 unique-chip-id secret 环境变量。", "2026-11-14: workflow 增加 boot.img 产物上传（含预链接内核，机主专用：下载后删除该 run）；firmware 区域记录该产物与删除要求。", "2026-11-14: schema 2 ADT 生成器从 dts/rodin.dts 产生 ADT（本地验证 12,824 字节）：修复 memory 段为 12 GiB 单段（0x40000000+0x300000000，与 payload.dram_size 一致）、删除非法占位 touch-spi=<TODO>、GIC 记录值改 0x0c400000；root_match_volume_uuid 留空跳过（尚无 userdata 卷 UUID）。"]
completion = ["固件构建通过，进入 DarwinBoot，发布 framebuffer，保持内存契约"]
limits = ["首次 fastboot boot 尚未执行；高段 0xC0..0x33FF 内存未验证；payload trust cache 待填充；FD 基址沿用 rothko 的 0x40400000，rodin LK 的实际内核加载地址是运行时变量，需第一次 fastboot boot 的屏幕/日志确认（备选 0x40000000）；本地构建用 clang 14，CI 用较新 clang + 流水线 {edk2}（mu_basecore release/202608），两者源码相同但工具链不同"]
next_action = ["触发 github workflow 'Linux full build' steps=full，下载 .fd 产物，fastboot boot"]


command = "WORKSPACE=<uefi> EDK_TOOLS_PATH=<mu_basecore>/BaseTools CLANG_BIN=<clang dir>/ PACKAGES_PATH=<uefi>:<uefi>/Platforms/Xiaomi:<uefi>/Common/Mu:<uefi>/Common/Mu_OEM_Sample:<mu_basecore>:<uefi>/Silicon/MediaTek:<uefi>/Silicon/Silicium:<tree>/package:<tree>/drivers/DarwinBoot python3 <mu_basecore>/BaseTools/Source/Python/build/build.py -p Platforms/Xiaomi/rodinPkg/rodin.dsc -a AARCH64 -b DEBUG -t CLANGPDB -n 8 -D FD_BASE=0x40400000 -D FD_SIZE=0x200000 -D FD_BLOCKS=0x200 -D ENABLE_SECUREBOOT=0 -D DEVICE_MODEL=0 -D MEMORY_PROTECTION=TRUE -D SHIP_MODE=FALSE"
result = "Build ended with '- Done -'; Build/rodinPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd is 2,097,152 bytes with FV header FvLength 0x200000, sha256 27e8a9d0baf5ac16121efacdd1e5207cdad4901b2b140c3602b00b41ade82979. Every module compiles and links: the UFS stack, keypad pair, RodinDisplayDxe, RodinHighMemDxe, RodinWatchdogDxe, UniXNUPkg modules and DarwinBootPkg. FVMAIN is 99% full (72 bytes free) as expected for a DEBUG volume; FVMAIN_COMPACT is 22% full."

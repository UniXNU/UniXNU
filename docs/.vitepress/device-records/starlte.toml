[[area]]
id = "memory"
status = "device-verified"
components = []
paths = ["uefi/files/*"]
inputs = ["RAM 0x80000000-0xFFFFFFFF and 0x880000000-0x8FFFFFFFF (4 GB); secure holes removed by Silicium's RamManagerLib.", "reserved-memory of Samsung's device tree: modem_if 0xF0000000-0xF91FFFFF, cp_ram_logging, exynos_ss, ABOX."]
configuration = ["Payload at 0xD0000000 + 64 MB after payload_move; the display's scan-out buffers 0xD4000000-0xD6FFFFFF; the camera's frames 0xD8000000-0xD9FFFFFF; UFS's own mode 0xDA000000 + 4 MB; Wi-Fi's optional DMA pool 0xDC000000 + 44 MB; fb_zc's pool 0xDEC00000-0xE18FFFFF; one table with build-time non-overlap checks in the kernel's sys/hakios.exynos9810_mem.h. XNU's RAM the largest free block at 0x880000000 + 2 GB."]
procedure = ["The loader reserves the CP, ABOX and exynos_ss pages from UEFI (keep_out_reserve) and chooses XNU's window around them (choose_window)."]
findings = ["None of XNU's RAM is below 4 GB, so 32-bit DMA engines (DECON's DPP, the camera's WDMA, DWC3 descriptors) use fixed buffers below 4 GB mapped through IOKit.", "An 11 MB ml_io_map_wcomb of the display buffers panicked; mapping them through IOKit works."]
completion = ["Boots with the payload out of the modem region and the 32-bit DMA buffers below 4 GB."]
limits = ["No SMMU (SysMMU) programming; devices use physical addresses."]
next_action = ["Program the SysMMUs where a driver needs more than a fixed buffer."]


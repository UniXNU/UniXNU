[[area]]
id = "cpu"
status = "device-verified"
components = []
paths = ["soc/configs/exynos9810.config"]
inputs = ["GIC-400 (GICv2); 4 Cortex-A55 and 4 Exynos M3; PSCI from Carbon at EL2.", "PMU fields of the big cluster written by Samsung's kernel before any CPU_ON (BSP flexpmu_cal_system_exynos9810.h, read for facts only)."]
configuration = ["cpus=6 bootcpu=2 m3_prep=3 pan=0 (isa_floor on by m3_prep=3): A55s 2 and 3 plus the four M3s; core 1 is parked by S-Boot and left out by the loader."]
procedure = ["m3_prep=1 reads the cluster's PMU state, 2 writes the six fields with read-back, 3 lets the M3s start; each step is logged before it is taken (drivers/core/hakios.exynos_m3.c, patch 1508)."]
findings = ["An M3's CPU_ON hung until the big cluster's PMU fields were written as Samsung's kernel does.", "PAN is ARMv8.1 and UNDEFINED on the ARMv8.0 M3, so pan=0 (patch 1509).", "launchd got SIGILL on an M3 when told the A55's 8.2 features; isa_floor (patch 1510) reports only the ARMv8.0 set all cores share.", "A cache-coherency check across clusters (cohtest=1, every A55 against every M3 both ways) passed."]
completion = ["Six cores run iOS: two A55s and four M3s, booted on an A55."]
limits = ["Core 1 is unavailable (parked by S-Boot); an M3 does not return from CPU_OFF, so the kernel idles with WFI; booting on an M3 (bootcpu=4) has not been tried."]
next_action = ["Try bootcpu=4 cpus=8 and recover core 1."]


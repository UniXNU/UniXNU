[[area]]
id = "storage"
status = "device-verified"
components = []
paths = ["mkimage.sh"]
inputs = ["UFS 2.1 host on the Exynos 9810 (0x11120000), as Silicium's UEFI leaves it; GPT on LUN 0 (SYSTEM, USERDATA and the rest)."]
configuration = ["ufs=3 system_apfs=ufs_SYSTEM ufs_write=1 var_hfs=ufs_USERDATA_data, the defaults: the kernel's own UFS driver takes the controller after a self-test against the loader's reads (kernel PR 155, scion-starlte PR 33), writes fenced to USERDATA, /private/var on an HFS+ volume in USERDATA made once from TWRP.", "ufs=2: block I/O through the loader and the UEFI's block service, ufs=3's fallback."]
procedure = ["ufs=3: references read through the loader, the controller taken as UEFI left it, every unit's head, GPTs and partition blocks compared byte for byte, writes fenced by a whitelist, then the switch; any failure falls back to ufs=2."]
findings = ["Loader-backed UFS reads and writes carry the root and a persistent /private/var.", "ufs=3 on the phone: the self-test and the fence test (68 writes judged, none sent) passed and the kernel switched to native reads (read only); some runs fell back to ufs=2 after a read failed past the switch, which the branch's later commits address."]
completion = ["iOS mounts its system from SYSTEM through the kernel's own driver and keeps /private/var in USERDATA across boots."]
limits = ["The controller is taken as UEFI left it (never reset); the loader keeps core 0 to serve ufs=2's fallback."]
next_action = ["Keep the self-test's fallback count at zero across daily runs; a reset of the controller of the kernel's own."]


[[area]]
id = "firmware"
status = "device-verified"
components = []
paths = ["uefi/*", "prebuilt/*"]
inputs = ["Samsung S-Boot (bootloader unlocked) loads an Android boot image (header v1) from BOOT.", "Project Silicium's Mu-Silicium starltePkg UEFI with HakiOS's changes (uefi/), and Silicium's Carbon Hypervisor at EL2 (Hyp.bin, GPL-2.0), which answers PSCI."]
configuration = ["uefi/BASE pins the Silicium commit; uefi/files/.../MemoryMapLib.c reserves 0xF0000000 + 64 MB where the boot shim copies the payload.", "The boot image kernel is BootShim + UEFI FD + payload, uncompressed, without a device tree (S-Boot uses the phone's dtb partition)."]
procedure = ["S-Boot -> boot image -> Silicium UEFI (GOP on the panel's buffer at 0xCC000000) -> xnuloader (platform starlte) -> XNU at EL1."]
findings = ["The Exynos 9810's own firmware does not do PSCI properly; Carbon at EL2 provides it and forwards CPU_ON to EL3.", "The payload lands in the CP's region (modem_if); the loader moves it to 0xD0000000 first thing (payload_move) and keeps the CP's and ABOX's memory from UEFI and XNU."]
completion = ["The phone boots from S-Boot through UEFI and the loader into XNU and iOS's user space."]
limits = ["The prebuilt UEFI's Silicium base predates Carbon's update of 2026-10-13."]
next_action = ["Rebase uefi/ on a newer Silicium and rebuild prebuilt/SILICIUM_UEFI.fd."]


  { kind = "device", reference = "PHASE0.md", result = "The M3 probe issued the first T830 write: GPU_INT_MASK/CLEAR and GPU_CMD_SOFT_RESET completed (reset=0, GPU_INT_RAWSTAT=0x00000100); GPU_ID remained 0x08300010.", command = "manual boot of the display kernel with gtaxllte-mali-probe=1 gtaxllte-mali-reset=1; panic photo IMG_7784", revision = "2b5731ab9f99a1e1d4f49f4c303031658075e998" },

[[area]]
id = "storage"
status = "device-verified"
components = []
paths = ["drivers/ShengUfs", "scripts/*ufs*", "scripts/*storage*", "scripts/*userdata*", "scripts/*root*", "scripts/*dwmmc*", "scripts/data/native-storage-original-bindings.S", "package/NativeDwMmc.cpp"]
inputs = ["Identify the storage and root hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for storage and root."]
procedure = ["Follow the storage and root stage in the porting guide and record the actual commands."]
findings = [
  "The eMMC is a Samsung MSHC at 0x13540000: VERID 0x6c, RINTSTS 0x44, STATUS 0x48, FIFO 0x100 or 0x200, 32-bit FIFO items, 8-bit bus; Mu-Silicium MshcDxe initializes it and leaves the card selected with 512-byte blocks.",
  "USERDATA is mmcblk0p23 at LBA 8,013,824 with 53,043,200 sectors; HIDDEN is mmcblk0p21 at LBA 7,880,704 with 122,880 sectors. The read-only bsd_init probe prints the controller state and reads LBA 0/1 through the PIO FIFO.",
  "No block driver or root mount exists yet; the first goal is the GPT signature (EFI PART) from the probe, then IOBlockStorageDevice publication.",
  "The same probe is also reachable from arm_init behind an emmc-probe=1 boot argument, so the eMMC state can be read even while the prelinked kernel still hangs inside IOKit.",
  "E2 passed on the tablet: with the 64-bit FIFO item width and a DTO check, LBA0 returns mbr=aa55 and LBA1 starts with EFI PART (20494645 54524150). The probe is now gated behind bsd-emmc-probe=1 so bsd_init can continue by default.",
  "NativeDwMmc is a read-only PIO IOBlockStorageDevice over the USERDATA window. It takes the FIFO item width from HCON, requires DTO, and links through a device build script, a kernel personality in KernelConfigTables.cpp and a build-script archive block. The dwmmc0 node is exported by the SoC DTS.",
  "The first driver build stopped at -Werror because seven register constants were unused; only the constants the transport actually touches remain. The bootstrap kernel link warning about the mockfs vnodeop descriptor is the expected first-pass link without archives and does not fail the release.",
  "A source IOBlockStorageDevice cannot link against the native kernel: the class lives in the prelinked IOStorageFamily kext. The device vendors the recorded absolute symbols for the pinned iPadOS 17.7.11 21H461 kernelcache (f18b4df8..., already -0x1000000 slid) and re-archives the driver object with them, the same pattern the alioth/marble repositories use.",
  "NativeDwMmcWindow publishes each SHNGROOT manifest window (OS, SystemOS) as its own 512-byte IOBlockStorageDevice, after the parent start returns, so IOStorageFamily can create the IOMedia that APFS probes. The driver checks the manifest SHA-256 and exposes only 512-byte flag-1 windows; framebuffer markers 40-43 report start, first sector, manifest and window service.",
  "No public prebuilt iPad7,1 17.7.11 Data or Preboot seed was found. A fresh Data volume is generated instead from the OS image's unchanged /private/var template: prepare-owner-data-fixture.py creates the 32 MiB APFS volume, packed_ramdisk.pack makes the packed seed, and seed-data-grow.py grows it to 8 GiB. The seed keeps the same 611,715 bytes of original template and publishes volume UUID 76BACD4A-80F1-48F0-B5B6-5A3DE1F123A5; the packed 1,040,512-byte image is data/owner-data-8g.dbr.",
  "Preboot is not needed for this first userland bring-up: the SystemOS cryptex is already a whole-disk SHNGROOT window, so the original owner cache mount can mount it as APFS and union its dyld cache over /. The fresh-seed tooling creates a Data volume only, and the SystemOS volume UUID 8846FE78-2910-4297-AF97-D59BB6F8FC16 is the cache identity the mount asks for.",
  "The IPSW StaticTrustCache and Cryptex1,SystemTrustCache IM4P payloads are the two unchanged original trust modules, not either file alone. DarwinBoot's ValidTrustCaches accepts them only as a version-2 bundle with a module-offset table; the raw trst IM4P was the earlier Compromised Data failure. data/original-static-system.bundle has the exact static (da88460e...) and System (d121ba89...) module hashes.",
]
completion = ["Host: register, clock, link and SMMU facts match the board inventory.", "Reads: SCSI capacity, GPT and known blocks are correct; OS/SystemOS windows stay within userdata.", "Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region."]
limits = ["Hardware inputs and implementation are pending for this example board."]
next_action = ["Boot the prelinked kernel with gtaxllte-allow-unverified=1, the packed Data seed and the original static+System trust bundle; then check launchd, backboardd and the first SpringBoard frame."]
evidence = [
  { kind = "device", reference = "PHASE0.md", result = "NativeDwMmc publishes the USERDATA SHNGROOT OS/SystemOS windows and XNU mounts the OS volume at the root-matching UUID, reaching load_init_program (markers 290-292).", command = "manual boot of the SM-T585; photos IMG_7754-IMG_7762 record the MSHC panic and the root-mount markers", revision = "c2452fb48cf8b4d78b9a810a32f0dd464580de96" },
]

[[area]]
id = "display"
status = "device-verified"
components = ["GopFramebuffer"]
paths = ["drivers/GopFramebuffer", "package/LegacyDisplayProbe.cpp", "scripts/build-gop-legacy-display.py", "docs/display-plan.md", "package/*Display*", "package/*Framebuffer*", "package/*Backlight*", "package/AppleARMBacklight.cpp", "package/GeniI2c*", "scripts/*display*", "scripts/*gop*", "scripts/*framebuffer*"]
inputs = [
  "The UEFI GOP hands off 1200x1920, 32 bpp, 4800-byte rows at the physical base; DarwinBoot records v_display=1.",
  "The original IOMobileGraphicsFamily and IOSurface are in the prelink closure; the display ABI audit identifies the 358-slot IOMobileFramebufferLegacy class and its nine abstract leaves.",
]
configuration = [
  "board.toml [kernel.prelink] roots include com.apple.iokit.IOMobileGraphicsFamily and com.apple.iokit.IOSurface; [components] includes GopFramebuffer; [payload] kernel_args enable offline-legacy-phase=4, GOP, validation, CPU transfer, retirement, registration and a 60 Hz vsync tick.",
  "configs/gtaxllte_defconfig sets CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y.",
  "The workflow builds one reference kernel with a bootstrap probe archive, then rebuilds scripts/build-gop-legacy-display.py against that prelink plan and relinks the final kernel.",
]
procedure = [
  "Build the display kernel with scripts/package.sh --os 17 --prelink=true; download the prelinked-kernel artifact.",
  "Flash the kernel and ADT to HIDDEN and replace EFI/UniXNU/unixnu.toml with host/write-unixnu-config.py so the display boot arguments are active.",
  "Boot and read the bottom-row markers 295-305, then the first frame in the GOP.",
]
findings = [
  "The original IOMobileGraphicsFamily __TEXT_EXEC base is 0xfffffff00576c000 (slide -0x1000000) and its text SHA-256 is 2e044ee68c1650397e1435234ca6459206262e4c7ed709cb7131c6f664f9bd9b, matching the sheng/pipa legacy ABI reference without rebasing.",
  "The audit passes on this profile's prelinked candidate: 358 vtable slots, nine abstract leaves and the exact original surface, vsync and refresh-setter bytes.",
  "The backend uses the firmware GOP with QuartzCore's CPU renderer: NativeLegacyDisplay copies each validated full-frame BGRA/RGBA16F surface into the scanout mapping and retires it through the original completion body.",
  "The pinned GopFramebuffer e47c1b8 source is vendored because the workflow's UniXNU submodule is b0d812d, whose ioav/hotplug calls this board does not implement.",
  "The GPU trace, UFS DPU and Adreno fence symbols are stubbed because the T830 has no driver; the probe markers 295-305 and the full-width stage bars report the display lifecycle on the framebuffer.",
  "The first sequence registered the native subclass before IOKitBSDInit and stalled bsd_autoconf after the display object was retained. Registering and starting the display from the late probe (after IOKitBSDInit) reached startHardware, start and registerService on hardware.",
  "The on-device stage bars show prepare/registration/init, late probe, Surface, GOP nub, startHardware and registerService (silver) with no failure bar; the first compositor swap (bright green) has not occurred because userland presentation is not running yet.",
]
completion = ["A known frame appears with correct geometry and colors, then userland presentation and backlight controls work."]
limits = ["Only the UEFI GOP is used: DECON/DSI, panel power, backlight and touch are not programmed by XNU. The render server draws with the CPU; the T830 GPU is a separate port.", "The display service registers, but no compositor frame has been submitted: the static trust cache, SystemOS union and Data volume are not configured yet, so backboardd/SpringBoard cannot present the UI."]
next_action = ["Add the static trust cache and the Data/SystemOS startup to get a compositor frame; then add touch and the T830 GPU."]
evidence = [
  { kind = "host", reference = "docs/display-plan.md", result = "The legacy display ABI audit and every hardcoded family, surface, vsync and refresh byte check pass on this profile's prelinked candidate.", command = "python3.12 scripts/audit-mobile-graphics-legacy.py in the audit tree; the same checks are run by scripts/build-gop-legacy-display.py", revision = "006b531f56f2a6abd1691289a5ee0c22595836aa" },
  { kind = "device", reference = "PHASE0.md", result = "The prelinked display kernel prepares the display, finds the IOSurface root, starts the GOP nub, reaches startHardware/start and publishes the IOMobileFramebuffer service (full-width bars through the silver registration stage, no dark-red failure, no first-swap bar).", command = "manual boot of the SM-T585 in TWRP-flashed HIDDEN kernel; photos IMG_7776/IMG_7777 show the stage bars", revision = "3ba51af27445a7c29369b6c2abd7d1ee8412aabb" },
]


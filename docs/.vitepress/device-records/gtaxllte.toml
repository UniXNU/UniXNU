schema_version = 1

[device]
name = "gtaxllte"
soc = "Exynos 7870"
os_profile = "ipados-17.7.11-21H461"
summary = "Samsung Galaxy Tab A 10.1 (2016) LTE (SM-T585). S-Boot loads the UniXNU UEFI, DarwinBoot hands off to the prelinked XNU, NativeDwMmc reads the eMMC and publishes the USERDATA SHNGROOT windows, and the kernel mounts the APFS OS volume and reaches /sbin/launchd. DECON/DSI display, touch and the T830 GPU are the remaining work."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore"]
inputs = ["Identify the configuration hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for configuration."]
procedure = ["Follow the configuration stage in the porting guide and record the actual commands."]
findings = [
  "The prelinked payload is the working architecture: it is written to HIDDEN (mmcblk0p21, 60 MiB FAT16, label UNIXNU) and loaded from EFI/UniXNU/Payloads/kernel.macho because the 49 MiB image cannot fit the 14 MiB ramdisk.",
  "The prelinked AppleARMPlatform ships an AppleARMCPU personality with IONameMatch cpu; IODTPlatformExpert matches by prefix and would claim the Exynos /cpus. The kernel artifact is rewritten byte-for-byte to xpu before it is written to HIDDEN.",
  "The prelink roots are trimmed to the software, security and storage closure plus AppleARMPlatform and ApplePMGR; the display, GPU and media kexts wait for Apple hardware and are excluded until the Exynos drivers exist.",
  "The board now carries the measured USERDATA geometry (first 8013824, last 61057023, 512-byte sectors) with the OS/SystemOS SHNGROOT windows, the OS volume UUID 04769D26-2CA0-4825-B443-E2E5F88300F2, and the same UUID as the ADT root match. The userdata image build and flash are separate from the kernel build.",
  "The package workflow takes a userdata boolean: when set it builds the OS/SystemOS root image before the kernel package step and uploads userdata-root.img separately, so the kernel artifact is unaffected by the optional image build.",
  "The ADT generator dropped #address-cells/#size-cells from hardware nodes. That was invisible until the first node with an interrupts property (dwmmc0) made IODTMapInterruptsSharing call IODTGetICellCounts on the GIC; the missing cell count faulted in IODeviceTreeAlloc. Patch 0006 adds both properties to the generated ADT.",
  "The GIC phandle was emitted as phandle, but XNU's IODT support indexes interrupt parents by AAPL,phandle. IODTFindInterruptParent returned NULL and IODTGetICellCounts(NULL) faulted. Patch 0007 renames the generated hardware phandle to AAPL,phandle; the value is packed from the FDT's phandle before the output key changes, since the FDT has no AAPL,phandle property to read.",
  "With the phandle fixed the kernel reached bsd_init and stayed in its root-mount retry loop with no panic: vfs_mountroot returned an error that the console cannot show. The diagnostic now paints attempts 283-286 and panics on the third failure with the errno and rootdevice, while the MC window reader marks the first APFS read and any failed window read.",
  "The first root-probe build failed the bootstrap kernel pass on an implicit gtaxllte_fb_mark declaration, which then stopped the corecrypto archive with 'No XNU symbol names'. The probe declares the helper before use; device patches that call a kernel helper must carry their own extern.",
  "The root-mount probe shows no third-attempt panic after several minutes, so vfs_mountroot is either succeeding or blocking. The boot now paints 290 after a successful mount, 291 after set_rootvnode and 292 before load_init_program, so the next photo distinguishes a mounted root from a wait.",
]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["Hardware inputs and implementation are pending for this example board."]
next_action = ["Inventory the required configuration inputs before implementation."]
evidence = []


[[area]]
id = "storage"
status = "device-verified"
components = []
paths = ["drivers/ShengUfs", "scripts/*ufs*", "scripts/*storage*", "scripts/*userdata*", "scripts/*root*", "scripts/*dwmmc*", "scripts/data/native-storage-original-bindings.S", "package/NativeDwMmc.cpp"]
inputs = ["Identify the storage and root hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for storage and root."]
procedure = ["Follow the storage and root stage in the porting guide and record the actual commands."]
findings = [
  "The eMMC is a Samsung MSHC at 0x13540000: VERID 0x6c, RINTSTS 0x44, STATUS 0x48, FIFO 0x100 or 0x200, 32-bit FIFO items, 8-bit bus; Mu-Silicium MshcDxe initializes it and leaves the card selected with 512-byte blocks.",
  "USERDATA is mmcblk0p23 at LBA 8,013,824 with 53,043,200 sectors; HIDDEN is mmcblk0p21 at LBA 7,880,704 with 122,880 sectors. The read-only bsd_init probe prints the controller state and reads LBA 0/1 through the PIO FIFO.",
  "No block driver or root mount exists yet; the first goal is the GPT signature (EFI PART) from the probe, then IOBlockStorageDevice publication.",
  "The same probe is also reachable from arm_init behind an emmc-probe=1 boot argument, so the eMMC state can be read even while the prelinked kernel still hangs inside IOKit.",
  "E2 passed on the tablet: with the 64-bit FIFO item width and a DTO check, LBA0 returns mbr=aa55 and LBA1 starts with EFI PART (20494645 54524150). The probe is now gated behind bsd-emmc-probe=1 so bsd_init can continue by default.",
  "NativeDwMmc is a read-only PIO IOBlockStorageDevice over the USERDATA window. It takes the FIFO item width from HCON, requires DTO, and links through a device build script, a kernel personality in KernelConfigTables.cpp and a build-script archive block. The dwmmc0 node is exported by the SoC DTS.",
  "The first driver build stopped at -Werror because seven register constants were unused; only the constants the transport actually touches remain. The bootstrap kernel link warning about the mockfs vnodeop descriptor is the expected first-pass link without archives and does not fail the release.",
  "A source IOBlockStorageDevice cannot link against the native kernel: the class lives in the prelinked IOStorageFamily kext. The device vendors the recorded absolute symbols for the pinned iPadOS 17.7.11 21H461 kernelcache (f18b4df8..., already -0x1000000 slid) and re-archives the driver object with them, the same pattern the alioth/marble repositories use.",
  "NativeDwMmcWindow publishes each SHNGROOT manifest window (OS, SystemOS) as its own 512-byte IOBlockStorageDevice, after the parent start returns, so IOStorageFamily can create the IOMedia that APFS probes. The driver checks the manifest SHA-256 and exposes only 512-byte flag-1 windows; framebuffer markers 40-43 report start, first sector, manifest and window service.",
]
completion = ["Host: register, clock, link and SMMU facts match the board inventory.", "Reads: SCSI capacity, GPT and known blocks are correct; OS/SystemOS windows stay within userdata.", "Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region."]
limits = ["Hardware inputs and implementation are pending for this example board."]
next_action = ["Inventory the required storage and root inputs before implementation."]
evidence = [
  { kind = "device", reference = "PHASE0.md", result = "NativeDwMmc publishes the USERDATA SHNGROOT OS/SystemOS windows and XNU mounts the OS volume at the root-matching UUID, reaching load_init_program (markers 290-292).", command = "manual boot of the SM-T585; photos IMG_7754-IMG_7762 record the MSHC panic and the root-mount markers", revision = "c2452fb48cf8b4d78b9a810a32f0dd464580de96" },
]


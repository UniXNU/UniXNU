id = "firmware"
status = "device-verified"
components = []
paths = ["proprietary-files.txt", "scripts/extract-files.py", "scripts/gen-touch-firmware.py"]
inputs = ["Identify the firmware and boot hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for firmware and boot."]
procedure = ["Follow the firmware and boot stage in the porting guide and record the actual commands."]
findings = [
  "S-Boot loads the UniXNU UEFI, the menu entries run, and DarwinBoot reports the prelinked kernel virtual address, entry point and boot args before branching to XNU.",
  "Early kernel progress is visible through direct framebuffer bars at y=400/500/600/700: green after arm_vm_init, red after the console init, blue at PE_init_iokit, yellow at bsd_init. Green, red and blue appear; yellow does not yet.",
]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["The prelinked kernel stops inside IOKit before bsd_init; storage and display drivers are not built yet."]
next_action = ["Name the IOKit sub-phase that stops the prelinked kernel with the traced framebuffer squares."]
evidence = [
  { kind = "device", reference = "PHASE0.md", result = "S-Boot loads the UniXNU UEFI, the menu boots, DarwinBoot hands off to the prelinked kernel, and the early framebuffer bars appear on the panel.", command = "manual boot of the SM-T585; the photos are recorded in the workspace", revision = "f45b68897f5f48da0026881847d9204680c9dd24" },
]


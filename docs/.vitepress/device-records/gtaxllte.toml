[[area]]
id = "gpu"
status = "implemented"
components = []
paths = ["package/MaliT830Probe.cpp", "package/*Gpu*", "package/*Gmu*", "package/*Adreno*", "scripts/*adreno*", "scripts/*gpu*", "scripts/*metal*", "scripts/*turnip*", "scripts/*air*"]
inputs = [
  "The stock DTS GPU node is mali@11400000, reg 0x11400000+0x5000, compatible arm,mali, power-domain pd-g3d@10484000, interrupts JOB 282, MMU 283, GPU 281.",
  "The stock kernel reports Mali-T830 0x0830 r0p1. The CMU_G3D block is at 0x11460000.",
]
configuration = [
  "A read-only Mali-T830 probe (package/MaliT830Probe.cpp) runs from the display late probe when gtaxllte-mali-probe=1; it reads the G3D power-domain state, CMU_G3D and, only while the domain is on, the GPU ID/version/status.",
  "The probe is compiled into the display archive and panics with the register values; no GPU write is performed.",
]
procedure = [
  "Boot the display kernel with gtaxllte-mali-probe=1; photograph the panic screen.",
  "Record the G3D/CMU/GPU values; remove the probe argument before normal boots.",
]
findings = [
  "The Mali-T830 is Midgard v5 with a Job Manager; Mesa PanVK has no arch 5 backend, so the GPU needs a new PanVK backend and a NativeMali JM driver.",
  "M2 read-only probe on the SM-T585: pd=0x0000000f/0x0003000f (G3D domain on), CMU_G3D mux=0x00200000, div=0, gate=0x000001ff/0x0000007f, gpu=0x08300010, L2=0x07100206, core=0. The T830 ID 0x0830 and the powered GPU are readable without any write.",
  "The G3D domain and CMU_G3D gates are already on at UniXNU handoff; M3 can start with the soft reset/MMU/WRITE_VALUE path and keep a rollback power-down sequence.",
  "The GPU plan and source fork live in UniXNU-mali-t830; the Mesa PanVK arch-5 backend is the M1 host build, the NativeMali JM kernel is the M3 device path.",
  "M3 first write on the SM-T585: the Panfrost v5 software reset completed (reset=0, GPU_INT_RAWSTAT=0x100), with pd=0x0000000f/0x0003000f, CMU_G3D 0x00200000/0/0x1ff/0x7f, gpu=0x08300010 and l2=0x07100206.",
]
completion = ["GPU submissions complete, mapping/fence handling is correct, a known image renders, and the selected Metal client presents it."]
limits = ["M2 is read-only and panics for the no-UART record. No GPU write, MMU, job, PanVK device or Metal path exists yet; the visible UI also needs the missing iPad Data/Preboot seed."]
next_action = ["M3: port the G52 NativeMali JM base to the T830 v5, keep the confirmed soft reset, then enable the MMU and submit one WRITE_VALUE job with a software fence."]

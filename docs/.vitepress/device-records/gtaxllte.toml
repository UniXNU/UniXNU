[[area]]
id = "packaging"
status = "planned"
components = []
paths = ["scripts/*payload*", "scripts/*image*", "scripts/*flash*", "patches/**", "package/Kit.toml"]
inputs = ["Identify the image assembly hardware, resources and existing component interfaces for this board."]

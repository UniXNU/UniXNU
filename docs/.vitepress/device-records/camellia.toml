[[area]]
id = "diagnostics"
status = "device-verified"
components = []
paths = ["README.md", "configs/**", "package/**", "scripts/**", "patches/**"]
inputs = ["Framebuffer debug console, UEFI stage colors, podman/pstore notes where available, Linux hot-jump dmesg and fastboot recovery."]
configuration = ["CONFIG_XNU_DT_PANIC_REGION=y and CONFIG_XNU_NATIVE_PAN=y.", "The pre-Android stage uses red, green, cyan and magenta framebuffer states; UEFI uses the framebuffer-backed console."]
procedure = ["Record FD, KO, payload and boot-image hashes before every device test.", "Record the last visible stage, UEFI driver name, exception PC/ESR/FAR or the first failing operation.", "Keep original boot_a and vendor_boot_a images available before flashing."]
findings = ["A fixed approximately 25-30 second reset can identify a loader or early UEFI failure and should not be assumed to be a DXE watchdog.", "The direct BootShim route and a base-only hot-jump FD both fail; checking FD entry and stack prevents misdiagnosis.", "The final boot image can show a short pause before continuing, so a brief delay is not by itself a failure."]
completion = ["Each claimed milestone has an image hash, source revision, command and observed device result, with a tested recovery route."]
limits = ["Phone UART is not available for all early paths; some diagnostics rely on framebuffer stages and Android dmesg."]
next_action = ["Add a pstore or USB serial transport when the next XNU milestone needs logs beyond the framebuffer."]
evidence = [
  { kind = "source", reference = "https://github.com/stanveyjiang/uefi-camellia/blob/31f482a209bd04fd2b264d1fa180fa862966a1a6/GUIDE.zh-CN.md", result = "Boot-stage diagnostics, recovery and hash requirements." },
  { kind = "device", reference = "https://github.com/stanveyjiang/uefi-camellia/releases/tag/v2026.10.26", command = "fastboot flash boot_a camellia-preboot-uefi-v2026.10.26.img; fastboot flash vendor_boot_a payload.img; fastboot reboot", revision = "31f482a209bd04fd2b264d1fa180fa862966a1a6", result = "Final boot image reached UEFI after a short initial pause and was recoverable with the stock partitions." },

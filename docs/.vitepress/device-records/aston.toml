[[area]]
id = "storage"
status = "implemented"
components = ["ShengUfs", "VirtioMmioBlock", "RamBlock", "VerifiedRoot"]
paths = ["drivers/ShengUfs/**", "package/SourceRoot*", "package/SourceStorage*", "scripts/prepare-aston-ramblock.py", "scripts/patches/ramblock-publish-after-store.patch", "scripts/*storage*", "scripts/*ufs*", "scripts/policies/**"]
inputs = ["The unixnu GPT partition spans LBA 115424000..123812607 at 4096 bytes per block. The Data seed is 8 GiB.", "RamBlock 4be2d7eb05ef5a98126c91e0302c149140c0e3e1 and the existing installation seed."]
configuration = ["native-source-storage=1 native-ufs-root=1 sheng-data-persist=2. Android userdata is not the root partition."]
procedure = ["Preserve the existing Data seed. Stage the RamBlock patch before compiling either storage archive.", "Record the data persistence row, the Data mount capacity checkpoint and Files crash reason; verify a file survives reboot."]
findings = ["The pinned RamBlock publishes its seed before selectVolumeSeed attaches persistent pages. APFS can cache seed checkpoint metadata before the block backend changes.", "Aston starts UFS before RamBlock, so the persistent window is available before RamBlock registerService. The patch attaches it before publication and removes late attachment from volume lookup.", "A refused, mismatched or unavailable writable store is not published as an apparently writable seed-only disk. Reset remains explicit; no automatic reformat, seed replacement or GPT change is added.", "This ordering defect is established from source. Its contribution to the reported zero-capacity UI and Files crashes needs an aston boot log.", "Device 2026-11-09 (boot 5, root 158d94bc, diag): the Data mount reports status 0, total 8589934592, free 6893985792 bytes, and the store row D st=2 er=0, so the kernel capacity and persistence are sound; Settings' 0 KB is a userland symptom.", "The Data store read back with scripts/pull-aston-data.py and opened with scripts/apfs-read.py has no /containers/Data/Application and no /containers/Shared/AppGroup. The seed carries com.apple.migration.plist (buildVersion 24A446), so datamigrator skipped the first-boot migration that registers the system apps. Files and DockFolderViewService crash in +[FILocalStorageNode sharedNodeWithDomain:] on a nil local-storage URL (10 and 78 reports) and dasd aborts in -[NSURL initFileURLWithPath:] (50 reports).", "patches/xnu-12377/aston-migration-rerun.patch removes the marker before launchd starts when sheng-rerun-migration=1 (menu entry Rebuild app data), so that boot runs the migration once; the BootLog capacity row reports migration=<status>."]
completion = ["The first APFS probe reads the persisted checkpoint, Data reports nonzero capacity, Files opens and can save a file, and the same file survives reboot without persistence errors."]
limits = ["Native fixtures use API stand-ins. They do not mount APFS or establish that existing on-device Data is undamaged. The reported storage symptoms are not yet confirmed resolved."]
next_action = ["Boot without init_data or an erase menu choice using the original seed, inspect capacity and persistent state, and exercise Files across a reboot."]


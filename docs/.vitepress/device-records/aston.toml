findings = ["This CPU/storage change does not enable USB on aston. Existing sheng USB observations below are retained only as reference.", "payload.runtime.appsync and appsync=1 in board.toml do not change the USB stacks.", "AppleUSBXDCI programs the DWC3 itself; a subclass supplies the register window at base + 0xc000, one interrupter, power and PHYs. AppleUSBXDCI has no personality, so it needs an explicit kext load before the subclass registers.", "The driver does no cache maintenance. Stream 0x40 needs a stage 1 identity context with write-back inner shareable blocks; through the shared bypass bank the CPU reads stale event words.", "The eUSB2 reference is 38.4 MHz (xo_board 76.8 MHz, RPMH_CXO_CLK divides by 2). With the 19.2 MHz table chirp passes and high-speed data fails.", "Slot 179 of the class keeps the family's configuration list when true, which leaves bNumConfigurations 0; it must stay false without an IOPort transport object.", "lockdownd starts on the IOResources property AppleUSBCableType=USBHost, one of its launch events; configd's USBDeviceConfiguration plug-in then sets the description and the family goes on the bus.", "UCSI reports the cable partner and selects the role. Until it answers, the charger's online value stands in for a host.", "In host mode the family's desired power is 0 once ports are idle, so the xHCI subclass answers on. The device stack answers 0 while the host role owns the core.", "A Mac looks up chip-id, board-id and security-domain in MobileDevice's device map. A pair that is missing makes it ask for a software update.", "SpringBoard accepts a CFUserNotification from a process on the system partition: it compares statfs f_fsid of the executable with /System. The SystemOS union layer has its own number, so native-union-statfs-fsid reports the root volume's number for that layer.", "lockdownd completes Trust directly only in lock state 3. Any other state asks for a passcode."]
completion = ["A Mac enumerates the device, usbmuxd lists it and lockdownd answers, at 10 Gbps on a USB 3 cable and 480 Mbps on a USB 2 cable.", "A physical reconnect re-enumerates.", "Trust appears on the panel, the Mac pairs and starts a session, and lockdownd starts installation_proxy, afc, atc and diagnostics_relay."]
limits = ["Inherited sheng implementation notes below are reference material, not an aston hardware qualification.", "Sustained transfers and app installation have not run.", "One cable orientation has run on USB 3.", "Host mode runs Apple's xHCI stack and completes commands; enumerating a peripheral is not verified.", "MobileDeviceMinimumVersion has no answer; a Mac treats that as no update needed.", "fairplayd.A2 and adid stay disabled: with both enabled, SpringBoard does not finish starting."]

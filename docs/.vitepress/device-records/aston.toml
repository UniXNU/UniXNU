inputs = ["WCN7850 firmware and NVM pinned by firmware/bluetooth/manifest.json.", "Linux reference https://github.com/ianchb/sm8550-mainline at 1fb56e66091e71160d7c7f8e13b065d5b6ab8b8c and https://github.com/ianchb/debian-sheng.", "Original iPadOS 27 build 24A446 bluetoothd and BlueTool for native ABI adaptation."]
configuration = ["UART14 is QUP2 SE6 at 0x898000, GIC INTID 493, wrapper 0x8c0000 and apps-SMMU stream 0x423; CTS/RTS/TX/RX use GPIO 76/77/78/79 and BT_EN uses GPIO 81.", "The board's 3.2 Mbaud operating rate uses a 51.2 MHz serial source and 16x oversampling.", "package/BluetoothFirmware.h and stage-bluetooth-firmware.py share firmware/qca under the Data addon.", "sheng-bluetooth=1 starts the bound UART14 worker after Data addon installation; log-bluetooth=1 enables initialization messages. The drivers/QcaBluetooth submodule or an explicit --local-module checkout supplies kernel and runtime sources."]
procedure = ["Stage firmware with scripts/stage-bluetooth-firmware.py OUTPUT --source FIRMWARE_QCA_DIRECTORY.", "Run scripts/check-wcn-power.py and scripts/check-bluetooth-board.py ASSEMBLED_TREE after changing shared power.", "Build the protocol, GENI DMA and Skywalk sources with the selected arm64e kernel command, then package BlueTool and the native controller adapter.", "Boot the integrated image with log-bluetooth=1, then check pairing, reconnection, audio, sleep and recovery."]
findings = ["On iPadOS 27.0.1 (24A446) the device pairs AirPods Pro, reconnects after reboot without pairing again, toggles power, plays A2DP at normal volume and quality, and shows noise control and battery. Music over Bluetooth during 2.4 and 5 GHz speed tests stays normal.", "WcnPower records independent WLAN and Bluetooth ownership of the six shared supplies; the last owner releases them. Bluetooth-only startup omits the PCIe NoC vote. Wi-Fi startup uses this ownership interface.", "The firmware VFS reader waits for Data addon installation, accepts controller firmware names, bounds file size and rejects short reads.", "The protocol core uses the byte-identical Linux btqca.c initialization through namespaced host services. H4 backpressure retains input, and IBS control bytes enter only between TX packets.", "The GENI engine provides bounded DMA buffers, deferred IRQ work, wire drain checks, quiesce/resume and error reporting. UART.SK and BlueTool sources compile for the 27 target.", "BluetoothProbe binds UART14 clocks, 32 KiB of DMA buffers through the firmware-managed bypass bank, IRQ 493 and GPIO79 wake. The 64-bit physical DMA addresses use the same shared mapping planner as touch and audio; Bluetooth uses no private page tables. Shared configuration locks preserve touch and audio resources; GIC routes dispatch directly to registered handlers. Hardware faults abort command waiters immediately.", "The version-locked 27 adapter selects type zero, clears vendor hooks, preserves generic callbacks and skips the empty H4 pre-stop hook. Real HCI reports supply eleven capabilities, including coded and 2M PHY; an asynchronous 0x203b query supplies up to six native advertising sets. Model, cache, lower flags and broadcaster mode agree.", "The board publishes a bluetooth IOService before userland starts, with H4 encoding, 3.2 Mbaud and a private stable MAC. Public addresses use network order and convert to Linux bdaddr_t at initialization. The runtime signs three arm64e binaries, preserves bluetoothd entitlements and uses read-only system-path overlays; BlueTool runs as root with transactions enabled.", "The kernel archive and runtime builder accept the same resolved QcaBluetooth checkout. UART clock-restore failures end the transport, preserve the hardware error and stop command waits and wake retries. The board startup entry uses C linkage to match the late platform probe. The archive record hashes the Bluetooth board, core, shim and SoC inputs before kernel linkage.", "Controller shutdown and faults clear the UART.SK queues, wake both rings and return the controller error from sync callbacks before data movement. In-flight notifications retain both rings until disconnect can release them.", "BlueTool starts the controller by reading kern.qbt_power_on because its sandbox denies sysctl writes; connecting to UART.SK also starts a stopped controller. Closing state belongs to the nexus that owns the session, so a channel torn down after its control socket closed cannot block the next connection.", "Extended scanning uses 0x2041 and 0x2042, because the controller rejects legacy scan commands once extended advertising commands have been used. Apple's scan extension stays off because it has no type zero backend.", "A random address (0x2005) is queued before a scan can be enabled, and starting an advertising set always sends its address (0x2035). When no resolvable address can be generated, the refresh uses a non-resolvable address and completes, so the daemon does not restart on the busy flag.", "Pairing keys need the keychain, which needs AppleKeyStoreState software key wrapping. The board returns /chosen/unique-chip-id through native_aks_device_id."]
completion = ["The integrated kernel and payload boot with independent Bluetooth power and live UART DMA/IRQ.", "The native stack scans, pairs, reconnects, stores keys, supports BLE and plays Bluetooth audio.", "Idle power, audio continuity, recovery and Wi-Fi coexistence have device measurements tied to the image revision."]
limits = ["Inherited sheng implementation notes below are reference material, not an aston hardware qualification.", "Calls and microphone (HFP/SCO), sleep and wake, idle power and recovery are not tested.", "The kern.qbt_* sysctl names compile but have not run on the device; the device results use the earlier names. A build that resolves the driver from the submodule has not been run.", "Features that need Apple vendor commands are unavailable. Non-connectable advertising uses a non-resolvable address because the secondary IRK is zero."]
next_action = ["Boot an image built from the submodule to confirm the kern.qbt_* sysctls, then test calls and microphone, sleep and wake, idle power and recovery."]


paths = ["package/CpuFreq*", "scripts/*armcpu*", "patches/xnu-12377/aston-edge-policy.patch", "patches/xnu-12377/aston-cpu-idle-samples.patch"]
inputs = ["Eight SM8550 CPUs: cpu0-2 A510, cpu3-6 A715/A710, cpu7 X3. EPSS frequency domains contain 3, 4 and 1 CPUs."]
configuration = ["dts/aston.dts exports E/P cluster types. armcpu-edge=1 enables cross-cluster scheduler initialization. sheng-cpufreq=4 uses the governor."]
procedure = ["Apply the complete selected patch series and run scripts/check-aston-cpu-storage.py against the patched XNU and pinned RamBlock.", "On the phone, record per-CPU startup, idle counts, busy share, frequency votes, frame latency and battery current."]
findings = ["The former policy forbids P-to-E migration for high QoS but allows it for lower QoS, violating the XNU non-decreasing-strictness invariant used by early-exit searches.", "The replacement preserves P preference for foreground work, permits weighted P-to-E spill at all QoS levels and keeps E work from being stolen onto P cores. The XNU matrix assertion is restored.", "Missing or offline processors return UINT64_MAX. The governor rebases those samples and regressing counters instead of treating a parked CPU as 100 percent busy."]
completion = ["The ordered patch series applies, native policy fixtures pass, all enabled CPUs start, and measured UI latency and power improve without scheduler warnings."]
limits = ["No device boot or thermal result from this branch. L3 remains at the inherited maximum vote; deep idle and thermal feedback are not implemented by this change."]
next_action = ["Compare the same workload on this branch and the previous image; retain the CPU and battery logs."]


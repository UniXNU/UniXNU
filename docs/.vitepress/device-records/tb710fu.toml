[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["dts/**", "scripts/gen-board-dts.py", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = ["Reserved memory from the mainline sm8650-lenovo-tb710fu.dtb; stock UEFI memory map from the DTB embedded in xbl_config; DDR banks from /sys/firmware/fdt."]
configuration = ["dts/tb710fu.dts generated by scripts/gen-board-dts.py: 37 mainline regions plus display-demura@a3600000 and display-reserved@d5100000; /memory = 0x8c0000000 + 5 GiB.", "MemoryMapLib: PIL_Reserved 0x16F80000 and Display_Demura from the stock map; DXE_Heap ends at 0xD3000000."]
procedure = ["scripts/gen-board-dts.py LINUX_DTB LIVE_FDT; scripts/stock-memory-map.py xbl_config_a.img MemoryMapLib.c; scripts/check-memory-map.py."]
findings = ["DDR is split: 2 GiB at 0x80000000 and 6 GiB at 0x880000000 with secure holes (MemTotal 7.4 GiB, 8 GB SKU). XNU manages one contiguous window, so the largest run 0x8c0000000-0xa00000000 is the /memory node.", "The mainline board DT puts rmtfs at 0xd3000000, inside the stock DXE heap (stock Android allocates rmtfs dynamically).", "Display_Demura (0xA3600000, 43 MiB) exists only in the stock UEFI map; mainline does not reserve it."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["The 2 GiB owned window is the caihong value; the UEFI free map on this device is not observed yet."]
next_action = ["Read the DarwinBoot window address on the first boot; try a larger owned_memory_size after root works."]
evidence = [
  { kind = "source", reference = "dts/tb710fu.dts", result = "generated board DTS; compiles against the SoC DTSI in CI" }
]


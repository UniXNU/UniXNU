schema_version = 1

[device]
name = "tb710fu"
soc = "SM8650"
os_profile = "ipados-17.7.11-21H461"
summary = "Lenovo Xiaoxin Pad Pro GT (TB710FU) port. Board DTS generated from mainline Linux; UEFI built from the device's own firmware; boot and vendor_boot images built, not yet booted."

[[area]]
id = "configuration"
status = "host-verified"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore", ".gitattributes", "local.toml.example", "unixnu.lock"]
inputs = ["SM8650 shared support from loolooc/UniXNU-sm8650-common (pinned commit); arm64 iPadOS 17.7.11 profile as on houji and caihong."]
configuration = ["board.toml: soc_source sm8650, os_profile ipados-17.7.11-21H461, defconfig tb710fu_defconfig (meizu21 values), payload 64 MiB, owned_memory_size 0x80000000."]
procedure = ["./unixnu defconfig tb710fu_defconfig -D ../UniXNU-tb710fu; ./unixnu fetch; ./unixnu status --json; CI build.yml kernel job on macos-26."]
findings = ["The configuration resolves and the XNU kernel (xnu-10063.141.1 with the SM8650 patch series) builds and prelinks against the iPadOS 17.7.11 kernelcache in about 10 minutes.", "The bootstrap pass ends in an expected link error (mockfs symbols) before the archives exist; the step result is the final build.", "payload.panic_screen = true (no UART on the tablet); CI runs the AVB selftest and syntax-checks every script.", "kernel_args add ramoops=0xac340000 and ramoops_reset_after=120; CI runs tests/run-ramoops-test.sh.", "logs/ (pulled ramoops/pstore logs) is ignored by git, like firmware-dump/ and images/."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["macOS needs a separate OS profile (macOS-ForSheng approach); no SM8650 macOS profile exists."]
next_action = ["Boot the images on the unlocked device; switch the OS profile after storage and display work."]
evidence = [
  { kind = "host", reference = "https://github.com/bmk-mikufan/UniXNU-tb710fu/actions/runs/42738403553", result = "kernel job success; kernel.macho Mach-O sha256 edb98193a248...", command = "./unixnu build kernel -j $(sysctl -n hw.ncpu)", revision = "a28f8b97df73988506594c8ccca3c67f461b418c" }
]

[[area]]
id = "firmware"
status = "implemented"
components = []
paths = ["proprietary-files.txt", "uefi/**", "scripts/dump-firmware.sh", "scripts/extract-files.py", "scripts/gen-touch-firmware.py"]
inputs = ["Device partitions dumped read-only over adb (uefi_a, xbl_a, xbl_config_a, abl_a, imagefv_a, uefisecapp_a, vendor_boot_a, boot_a, dtbo_a) with sizes checked against the block devices.", "uefi_a: ELF with one FV, BOOT.MXF.2.1-02000-LANAI-1; 100 DXE INFs extracted with UEFIReader (duplicate Ebl renamed instead of aborting)."]
configuration = ["uefi/Platforms/Lenovo/tb710fuPkg from Mu-Silicium giulia (SM8650, LanaiPkg); Lenovo SMBIOS; framebuffer 3200x2000 (mainline NT36532 panel); SOC_TYPE only selects SMBIOS strings.", "UniXNU.inf, UniXNUDxe, UniXNURamDiskDxe, DarwinBoot in DSC and FDF; UniXNULib and FdtLib mapped; built on UniXNU/uefi-sheng for the SEC FDT handoff."]
procedure = ["UEFIReader uefi_a.img tb710fu; copy uefi/ over uefi-sheng; ./unixnu build firmware --uefi ../uefi-tb710fu."]
findings = ["The giulia references resolve against the TB710FU blobs except OplusProject and OnePlus panel XMLs, which were dropped.", "uefiplat.cfg matches giulia's configuration map except EnableDisplayThread/EnableDisplayImageFv (kept 0 as in Silicium).", "SILICIUM_UEFI.fd builds at exactly 0x300000 with all four UniXNU modules (WSL, clang 18).", "scripts/dump-firmware.sh also dumps vbmeta and takes SLOT=_b for the inactive slot (read-only); scripts/sign-images.sh signs from the slot-a dumps (vbmeta_a, boot_a).", "First device boot (2026-11-11, slot b, locked ABL): ABL accepted the testkey chain and BootShim started Mu-Silicium; the framebuffer showed DxeCore 'Loading driver at' lines, then the panel went black with the backlight on and nothing else appeared. pstore was empty afterwards. This matches sheng's PORTING.md for its vendor drivers (panel blanks at ClockDxe). The APRIORI list also loaded GLinkDxe, which DXE.inc marks as crashing.", "TB710FU_VENDOR_HW (DSC, default 0) gates every Binaries/tb710fu DXE and RamManagerDxe and sets PcdBuildXblHobs FALSE, as in sheng. Without RamManagerDxe, the UEFI has only the MemoryMapLib DXE_Heap (432 MiB) as conventional memory.", "With TB710FU_VENDOR_HW = 0 the device reaches the UniXNU menu with the payload (kits 0, drivers 0 is normal), and the 3 s timeout starts the xnu entry. DarwinBoot then returned Out of Resources: the 2 GiB owned window had no conventional run. MemoryMapLib therefore maps RAM_High (0x8C0000000 + 3 GiB, DDR in the live FDT) as Conv. Buttons do nothing without the vendor PMIC drivers."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["The vendor-driver build blanks the panel; the Mu-only build has no UFS, USB or clocks in UEFI. Firmware blobs are not redistributed."]
next_action = ["Boot the TB710FU_VENDOR_HW = 0 image from slot b; check the UniXNU menu and the payload line; then re-add vendor drivers in groups to find the one that blanks the panel."]
evidence = [
  { kind = "source", reference = "uefi/Platforms/Lenovo/tb710fuPkg/tb710fu.dsc", result = "board package with UniXNU integration" }
]


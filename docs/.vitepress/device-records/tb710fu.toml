[[area]]
id = "packaging"
status = "implemented"
components = []
paths = ["scripts/*payload*", "scripts/*image*", "scripts/*flash*", "scripts/avb/**", "patches/**", "package/Kit.toml", "scripts/android/**"]
inputs = ["Stock boot_a: header v4, ramdisk 0 (GKI). Stock vendor_boot_a: header v4, ramdisk at 0x1000000, DTB 0x317e5d bytes at 0x1f00000.", "Bootloader stays locked (LTBox root). Stock vbmeta is signed with the AOSP testkey (2597c218...); it chains boot (rollback location 3) to the testkey and carries a hash descriptor for vendor_boot."]
configuration = ["Payload in vendor_boot with --ramdisk-addr 0x2400000; boot.img with --ramdisk none and the live FDT as firmware DTB."]
procedure = ["./unixnu build payload; ./unixnu vendor_boot --stock vendor_boot_a.img --ramdisk payload.img --ramdisk-addr 0x2400000; ./unixnu bootimg --uefi ../uefi-tb710fu --dtb live-fdt.dtb --ramdisk none.", "scripts/sign-images.sh firmware-dump images -> images/slot-b; scripts/flash-slot-b.sh images/slot-b [--write]."]
findings = ["boot.img 2228224 bytes; vendor_boot.img 100663296 bytes (the partition size) with the 64 MiB payload; the payload holds kernel.macho and kernel.macho.adt, no trust cache or Data seed yet.", "A locked bootloader refuses fastboot boot and flash, so the images are signed for the testkey path and written to slot b from rooted Android (LTBox EDL partition writes are the recovery path).", "scripts/avb/avbsign.py rehash recomputes vbmeta hash descriptors; on the stock vbmeta the init_boot descriptor equals sha256(salt + init_boot[:size]), and the rehashed vendor_boot descriptor (70365184 bytes) matches the built image.", "patches/xnu/tb710fu-ramoops-console.patch applies on the 61-patch arm64/SM8650/iPadOS 17 series (git apply --check on xnu d8b80295).", "The stock slot-b chain is mixed firmware: vbmeta_b's vendor_boot descriptor matches vendor_boot_a, its dtbo descriptor matches neither dtbo_a nor dtbo_b. vbmeta_a matches dtbo_a, init_boot_a and vendor_boot_a, and chains vbmeta_system to the testkey, so slot b is built as slot a's chain plus the UniXNU boot/vendor_boot and a re-signed vbmeta_a (shared with the tb710fu-arch-linux E2 design).", "A simulated slot b (images/slot-b + dtbo_a + init_boot_a) passes tb710fu-arch-linux build/avbcheck.py; boot_b verifies against the testkey with rollback index 1736035200.", "adb exec-in can return before the device-side dd finishes; the flash path now runs on the tablet (scripts/android/flash-slot-b.sh, from tb710fu-arch-linux) with cmp verification.", "Real AOSP libavb avb_slot_verify (tb710fu-arch-linux build/avbverify, locked, testkey only, partitions boot/dtbo/vendor_boot/init_boot) returns OK on images/slot-b plus slot a's dtbo, init_boot, vbmeta_system and recovery, with the device rollback floors 0/1/1780617600/1736035200.", "Qualcomm ABL (SM8650 VerifiedBoot.c GetOsVerAndSecPactchLevel, found by the tb710fu-arch-linux session) reads com.android.build.boot.os_version/security_patch from the boot vbmeta and falls back to the boot header os_version, refusing 0. The UniXNU boot.img header carries 0x200001a7 (16, 2026-07), so it passed either way; sign-images.sh now copies boot_a's properties (14, 2025-01-05) with avbsign.py footer --props-from so the OS version handed to the TEE matches stock, and fails when the property is missing. The ABL-emulating build/avbverify harness returns OK for the new slot b.", "PVMFW_BCC ABL builds add pvmfw to the avb_slot_verify request when the partition holds an image (HasPvmFw); its hash descriptor is in vbmeta_system, so copying vbmeta_system_a without pvmfw_a fails verification (tb710fu-arch-linux found it; their E1 then passed ABL on the device). The flash path copies pvmfw from slot a; the build/avbverify harness returns ERROR_VERIFICATION for UniXNU slot b with the old pvmfw_b and OK with pvmfw_a.", "After AVB, ABL's UpdateDeviceTree() fails BootLinux (fastboot fallback) when the selected DTB lacks /, /memory, /chosen, /reserved-memory or /soc/cache-controller (LLCC, SCT DDR); the mainline DTB names it system-cache-controller and stalled the Linux E2 boot. UniXNU keeps the stock vendor_boot DTBs: tb710fu-arch-linux build/dtcheck.py passes on the msm-id 0x2b8 entry ABL selects."]
completion = ["The signed images boot from slot b, the menu lists the xnu entry and DarwinBoot hands off."]
limits = ["Not booted. Slot b currently holds the tb710fu-arch-linux E2 set (written 18:31, after the UniXNU writes); UniXNU images are written again only after the user assigns slot b.", "ABL loads a 70365184-byte vendor_boot (stock 11.9 MB, mostly the 64 MiB FAT payload); whether ABL caps the vendor ramdisk size is unknown, and libavb success does not cover ABL's image loading (a header-v2 boot passed libavb yet was rejected).", "The GKI init_boot ramdisk is appended after the 64 MiB FAT payload; UniXNURamDiskDxe reads the FAT from initrd-start, but this is unverified on TB710FU."]
next_action = ["Agree slot-b ownership with the Linux session, then scripts/flash-slot-b.sh (dry run), scripts/flash-slot-b.sh images/slot-b --write; the user activates slot b."]
evidence = [
  { kind = "source", reference = "README.md", result = "build, signing and test commands" },
  { kind = "source", reference = "scripts/avb/avbsign.py", result = "selftest covers footer, rekey and rehash" }
]

[[area]]
id = "diagnostics"
status = "implemented"
components = []
paths = ["scripts/check-*", "scripts/probe-*", "scripts/audit-*", "scripts/read-*", "scripts/prepare-*", "scripts/data/**", "package/tests/**", "package/*Tests*", "package/*Diagnostic*", "package/*Probe*", "package/Boot*", "package/linux-log/**", "tests/**"]
inputs = ["Host-side checks for the hardware description."]
configuration = ["scripts/check-memory-map.py fails when a UEFI Conv region overlaps a no-map DTS region; every script carries a --selftest run in CI."]
procedure = ["python3 scripts/check-memory-map.py; CI build.yml checks job."]
findings = ["The check caught the giulia DXE_Heap overlapping the TB710FU rmtfs at 0xd3000000.", "Kernel console mirrored into the stock Android ramoops console zone (live DT ramoops_region 0xac300000, 1 MiB, console 0x40000 at 0xac340000 after the dmesg zone, ecc-size 16) in the fs/pstore/ram_core.c format: DBGC header, ring, RS(255) parity per 128-byte block plus header parity (poly 0x11d, fcr 0, prim 1). Hooked at _cnputc, so console, printf and panic text all reach it; output before arm_vm_init is buffered (4 KiB) and replayed. A panic flushes, waits ramoops_panic_delay and issues PSCI SYSTEM_RESET; ramoops_reset_after resets a hung boot. tests/run-ramoops-test.sh builds the writer from the patch with ASan/UBSan and checks every codeword has zero syndromes, append across boots, ring wrap and no-ECC mode.", "scripts/read-ramoops.sh reads /sys/fs/pstore from rooted Android; --check prints the stock ramoops module parameters, --mark proves a reset keeps the zone. Not run on the device yet."]
completion = ["Every check runs in CI and fails on a regression."]
limits = ["No device-side diagnostics yet."]
next_action = ["Add log capture once the UniXNU menu runs on the device."]
evidence = [
  { kind = "source", reference = "scripts/check-memory-map.py", result = "overlap check with selftest" }
]

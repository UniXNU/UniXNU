schema_version = 1

[device]
name = "raphael"
soc = "SM8150"
os_profile = "ipados-18.7.12-22H390"
summary = "Redmi K20 Pro / Mi 9T Pro (raphael, SM8150) arm64 UniXNU port, targeting ipados-18.7.12-22H390 (Darwin 24.6.0)."

# ---------------------------------------------------------------- configuration
[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform"]
paths = ["board.toml", "feeds.toml", "configs/raphael_defconfig", "dts/raphael.dts", "patches/xnu/series"]
inputs = [
  "SM8150 device identity and partition plan from the raphael board configuration",
  "OS profile ipados-18.7.12-22H390 (arm64) carried by this repository and installed into the UniXNU checkout",
  "iOS 18.7.12 payload IPSW and the staged iPadOS 18.7.12 arm64 kernelcache, both build 22H390",
  "Shared SM8150 support pinned in feeds.toml",
]
configuration = [
  "format 2 board: soc_source=sm8150, kit=raphael, os_profile=ipados-18.7.12-22H390",
  "upstream UniXNU has no 18.x profile, so os-profiles/ipados-18.7.12-22H390/ is copied in by scripts/install-device-profile.py",
  "the arm64 kernelcache is staged by scripts/stage-arm64-kernelcache.py into the path [kernel.prelink] kernelcache names",
  "kernel fragments arch:configs/common.config and soc:configs/sm8150.config",
  "arm64e-only profiles are intentionally not mapped: SM8150 has no FEAT_PAuth",
]
procedure = [
  "From the UniXNU checkout: python3 ../UniXNU-raphael/scripts/install-device-profile.py --unixnu .",
  "python3 ../UniXNU-raphael/scripts/stage-arm64-kernelcache.py --unixnu .",
  "./unixnu defconfig raphael_defconfig -D ../UniXNU-raphael, ./unixnu fetch -D ../UniXNU-raphael, then ./unixnu status --json -D ../UniXNU-raphael",
]
findings = [
  "arm64e-only Apple OS profiles (iPadOS 26/27) cannot run on this SoC (no FEAT_PAuth); iPadOS 18 still ships an arm64 kernelcache because the no-PAC A10 iPad 7 runs it",
  "UniXNU reads exactly one IPSW per run, so the iOS payload is [ipsw] and the arm64 kernelcache is passed to prelink by path instead",
  "iPadOS and iOS share the 22H390 build ID, so the staged kernelcache needs its own output path or the two would overwrite each other in out/ipsw/22H390/",
  "both 22H390 dmgs are AEA encrypted, so building the root image needs macOS /usr/bin/aea",
  "status resolves arch=arm64, soc=sm8150, os=ipados-18.7.12-22H390 and the device board.toml",
  "board.toml [firmware] and [bootimg.image] describe the Mu-Silicium route only (config raphael, Platforms/Xiaomi/raphaelPkg/raphael.dsc, SILICIUM_UEFI.fd, header_version 1 with base 0x10000000 and pagesize 2048); ./unixnu build firmware and ./unixnu bootimg read those paths, and that route has never produced an image that booted on this device",
  "the shipping firmware route is Project Aloha instead: build_cfg/sm8150.json uses header_version 0 with base 0 and pagesize 4096, and PythonLibs/PostBuild.py is the packer, so the Mu-Silicium values in [bootimg.image] are deliberately not applied to it",
  "board.toml [payload] is what makes the Aloha image bootable: volume UNIXNU, 192 MiB, loader firmware, carrying Payloads/kernel.macho, its ADT and EFI/UniXNU/unixnu.toml",
]
completion = [
  "Every profile root, source pin, component closure and patch order resolves without error",
]
limits = [
  "Resolution success is not a boot result; nothing here has run on raphael hardware",
]
next_action = [
  "Record the resolved status output as host evidence once the CI build produces it",
]

[[area.evidence]]
kind = "source"
reference = "board.toml"
result = "Format 2 board definition with the arm64 ipados-18.7.12-22H390 profile (iOS 18.7.12 payload for the root image, staged iPadOS 18.7.12 arm64 kernelcache for prelink) and raphael_defconfig mapping."

[[area.evidence]]
kind = "source"
reference = "feeds.toml"
result = "Pinned shared SM8150 source used as the soc profile."

# --------------------------------------------------------------------- firmware
[[area]]
id = "firmware"
status = "device-verified"
components = ["DarwinBoot"]
paths = ["board.toml", ".github/workflows/build.yml", "scripts/stage-aloha-unixnu.py", "scripts/check-bootimg-ramdisk.py"]
inputs = [
  "Project Aloha platforms checkout (Project-Aloha/mu_aloha_platforms), which lists xiaomi-raphael and builds the SurfaceDuo1Pkg platform",
  "Aloha's own packer: build_uefi.py drives Platforms/SurfaceDuo1Pkg/PlatformBuildNoSb.py, and PythonLibs/PostBuild.py writes the Android boot image from BootShim.bin + FV/SM8150_EFI.fd + the device DTB",
  "build_cfg/sm8150.json for the boot geometry (header_version 0, base 0, pagesize 4096) and Device/xiaomi-raphael/*.inc for the module set",
]
configuration = [
  "board.toml [firmware] still names the Mu-Silicium layout (config raphael, Platforms/Xiaomi/raphaelPkg/raphael.dsc, FD Build/raphaelPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd); ./unixnu build firmware and ./unixnu bootimg read exactly those paths, which is why the Aloha route does not go through them",
  "the Aloha route is driven by scripts/stage-aloha-unixnu.py: it writes Include/UniXNU.dsc.inc, Include/UniXNU.fdf.inc and Include/UniXNULLib.dsc.inc, sets BUILD_UNIXNU in both SurfaceDuo1.dsc and SurfaceDuo1NoSb.dsc, packages those includes after DXE.dsc.inc / DXE.inc, and appends ALOHA_EXTRA_PACKAGES to the hard-coded PACKAGES_PATH tuple in both PlatformBuild*.py",
  "the disk stack is not added again: Device/xiaomi-raphael/APRIORI.inc embeds DiskIoDxe and PartitionDxe as fixed-GUID PE32 images and SurfaceDuo1.fdf already lists FatPkg, so the script only verifies them",
  "BUILD_UNIXNU=1 compiles UniXNU, UniXNUDxe, UniXNURamDiskDxe and DarwinBoot into the FD; BUILD_UNIXNU=0 leaves a byte-identical stock Aloha build",
]
procedure = [
  "python3 scripts/stage-aloha-unixnu.py --aloha <mu_aloha_platforms> --unixnu <UniXNU> --payload <payload.img>",
  "cd <mu_aloha_platforms> && python3 build_uefi.py --init, then ALOHA_EXTRA_PACKAGES=<UniXNU>/package:<UniXNU>/drivers/DarwinBoot python3 build_uefi.py -d xiaomi-raphael",
  "fastboot flash boot <aloha>/Build/SurfaceDuo1Pkg/xiaomi-raphael.img",
]
findings = [
  "the Mu-Silicium raphael platform never booted on hardware; Project Aloha lists xiaomi-raphael as supported and is what produced the working image",
  "./unixnu build firmware and ./unixnu bootimg only understand the Mu-Silicium layout (Resources/Configs/<config>.toml with [uefi_fd], Resources/Scripts/mkbootimg.py, BootShim.S built with -DFD_BASE/-DFD_SIZE), so an Aloha checkout cannot be passed to --uefi; Aloha packs its own boot image instead",
  "build_uefi.py drives EDK II through os.system and ignores the child's exit status, so a failed build still exits 0; the workflow verifies FV/SM8150_EFI.fd and the .img exist rather than trusting the exit code",
  "the boot geometry that boots on this device is build_cfg/sm8150.json as-is (kernel_addr 0x8000, ramdisk_addr 0x1000000, tags 0x100, pagesize 4096, i.e. base 0). board.toml [bootimg.image] pins base 0x10000000 for the Mu-Silicium route; forcing that here would move the shim to 0x10008000 for no benefit",
  "PostBuild.py:99-100 emits --ramdisk ./PythonLibs/emptyramdisk whenever emptyramdisk is true, and that file is a six-byte placeholder (b'dummy\\n'). Copying the payload over it is the one seam Aloha exposes without patching PythonLibs",
  "with the placeholder ramdisk the menu still renders but falls back to the built-in configuration, which has no bootable entry: Config.c reads \\EFI\\UniXNU\\unixnu.toml from any SimpleFileSystem volume and UniXNURamDiskDxe publishes the payload volume as BlockIo from the FDT /chosen initrd range",
  "the kernel and the firmware are built in one workflow run (jobs build on macos-26 and firmware on ubuntu-24.04, joined by needs), so the payload can only carry the kernel that run compiled; the firmware job re-checks kernel.macho's sha256 against the build job's output before packing it",
  "the firmware job runs on a plain push to main as well as on dispatch: the platform seed comes from the UNIXNU_UNIQUE_CHIP_ID repository variable, and only an explicit dispatch with build_firmware=false turns the job off",
  "the payload volume is sized for the boot partition, not for comfort: kernel.macho plus its ADT and unixnu.toml take about 20 MiB, and a 192 MiB volume produced a 195 MiB boot image that cannot be flashed, so size_mib is 48 and the boot image is about 51 MiB",
  "the payload image itself is byte-correct: the boot image header reports ramdisk_size 50331648 at ramdisk_addr 0x1000000, and check-bootimg-ramdisk.py confirms the ramdisk is the payload. The problem is that the ramdisk is never published as a UEFI volume",
  "UniXNURamDiskDxe reads the DTB address from the Mu-Silicium entry-argument HOB (0xDAEE82E6...), which only that platform's SEC emits. Searching the whole tree shows no producer of that HOB at all, so on Aloha the driver returns at 'no entry argument HOB' and publishes nothing",
  "a fallback to the FDT configuration table (gFdtTableGuid) alone is not enough: Aloha installs the Android board tree, whose /chosen names the MIUI boot's initrd (0x84518000) rather than this handoff's ramdisk, so the driver read a valid tree and still published the wrong range; the UniXNU FV entries were moved after DtPlatformDxe and its FDT freefile because a configuration table is not a protocol and cannot be expressed as a Depex",
  "the driving fix is a fallback that does not depend on a tree at all: UniXNURamDiskDxe scans the HOB system-memory ranges for the payload's FAT32 boot sector (mformat OEM MTOO4043, volume label UNIXNU, 0x55AA signature, BPB geometry check) and publishes whatever it finds, so the volume is reachable even though Aloha publishes neither the Mu-Silicium HOB nor a /chosen that points at the payload",
  "the driver change is shipped as a patch applied by .github/workflows/build.yml (patches/unixnu/ramdisk-scan-fat-volume.patch, applied right after the UniXNU checkout). Editing the local UniXNU copy had no effect at all: the workflow checks out UniXNU/UniXNU@main, so only a patch in this repository reaches the firmware; the earlier 'fallback' had never been in any built image, which is why flashing still showed the built-in configuration",
  "the firmware job log is the evidence that the patch is in the image: 'Applied patch .../UniXNURamDiskDxe.c cleanly.', then 'Building ... UniXNURamDiskDxe.inf [AARCH64]' under -Wall -Werror, with 'Build total time: 00:01:39' and a 3145728-byte FV",
  "the Aloha EDK II chain is Linux-only: build_setup.sh is an apt script and CLANGPDB uses aarch64-linux-gnu-gcc, so the macOS runner cannot host it; the XNU kernel conversely needs Xcode, cctools and lzfse",
]
completion = [
  "A firmware volume builds, and the boot image carries the UniXNU payload volume as its ramdisk",
  "UniXNU draws its boot menu on raphael",
  "UniXNURamDiskDxe compiles into the firmware together with the system-memory scan patch, so the payload volume has a path to BlockIo that does not need the Mu-Silicium HOB or a /chosen that names it",
]
limits = [
  "Verified on the handset (images built before this patch): the menu renders with working UI, fonts and input, but the footer reads \"built-in configuration\", so no unixnu.toml was found. On those images the driver had no path to the volume at all, which is why the DTB swap and the FDF reorder changed nothing on screen",
  "The scan fallback only makes the volume reachable; whether the menu then lists the xnu entry and hands off to DarwinBoot is still an on-device question. The 48 MiB payload (kernel.macho, its ADT and unixnu.toml, about 20 MiB used) keeps the boot image at about 51 MiB",
  "DarwinBoot has not handed off to XNU on this device: the payload kernel is the native Mach-O (build kernel --skip-prelink), and a prelinked kernelcache needs macOS AEA + hdiutil",
]
next_action = [
  "Flash the image built with the scan patch (xiaomi-raphael-v4.img) and confirm the menu lists the xnu entry instead of \"built-in configuration\", then capture the DarwinBoot handoff",
]

[[area.evidence]]
kind = "source"
reference = ".github/workflows/build.yml"
result = "jobs.build runs on macos-26 (Xcode, cctools, lzfse) and produces kernel.macho; jobs.firmware runs on ubuntu-24.04 with needs: build, packs that run's kernel into the payload volume, installs it as Aloha's ramdisk and verifies the result with scripts/check-bootimg-ramdisk.py."
[[area.evidence]]
kind = "source"
reference = "scripts/stage-aloha-unixnu.py"
result = "Patches both Aloha DSC variants and the FDF to compile UniXNU, UniXNUDxe, UniXNURamDiskDxe and DarwinBoot into the FD, teaches PlatformBuild*.py about ALOHA_EXTRA_PACKAGES, and with --payload installs the volume over PythonLibs/emptyramdisk."
[[area.evidence]]
kind = "device"
reference = "docs/evidence/2026-11-14-aloha-unixnu-menu.md"
command = "fastboot flash boot aloha-unixnu.img, then photograph the UniXNU boot menu on the handset"
revision = "dc881bab4a5c44206ecb6802ef2cb8a58349169c"
result = "UniXNU draws its menu on raphael: blue title, Input/Tools on the right, and the footer reads \"built-in configuration\", which is Config.c:1595 falling back because no \\EFI\\UniXNU\\unixnu.toml volume was present."
[[area.evidence]]
kind = "host"
reference = "https://github.com/Aruvelut-123/UniXNU-raphael/actions/runs/43620004865"
command = "gh api -X POST repos/Aruvelut-123/UniXNU-raphael/actions/workflows/build.yml/dispatches -f ref=main -f 'inputs[build_kernel]=true' -f 'inputs[build_firmware]=true' -f 'inputs[unique_chip_id]=0123456789ABCDEF'"
revision = "43803ea568627dd054c7ae5a3ade9d446f4e2d7d"
result = "Both jobs pass in one run: build compiles the kernel on macos-26, firmware installs device-tree-compiler and mtools, builds the 192 MiB payload volume, stages it over PythonLibs/emptyramdisk, builds Aloha, and asserts in step 17 that the boot image ramdisk is the payload. The artifact aloha-raphael-bootimg carries SM8150_EFI.fd (3145728 B), payload.img (201326592 B) and xiaomi-raphael.img (204840960 B); scripts/check-bootimg-ramdisk.py reports the ramdisk is the payload volume at offset 0x35a000."

# -------------------------------------------------------------------------- cpu

[[area]]
id = "cpu"
status = "planned"
components = ["XnuPrelink"]
paths = ["configs/raphael_defconfig"]
inputs = [
  "CPU topology for SM8150 (four Cortex-A76 plus four Cortex-A55) from the vendor DTS",
]
configuration = [
  "raphael_defconfig carries the kernel options; CPU enablement is not yet wired to a device tree",
]
procedure = [
  "Build the kernel, boot it and capture the CPU bring-up log",
]
findings = [
  "SM8150 Cortex-A76 and A55 do not implement ARMv8.3 FEAT_PAuth, which is why arm64e is excluded",
  "xnu-11417.140.69 (Darwin 24) dropped the BCM2837 machine configuration entirely: 'grep -r BCM2837' over the tree returns nothing, pexpert/pexpert/arm64/BCM2837.h and config/MASTER.arm64.bcm2837 no longer exist, and the supported list is now T6000..T8132 VMAPPLE. Apple added config/MASTER.arm64.iPhoneOS in their place",
  "the shared arch patch series (profiles/arch/arm64/patches/xnu/series, 56 patches) was written against xnu-10063.141.1 / Darwin 23 and does not survive the move: 15 of the 56 fail 'git apply --check' against xnu-11417, 41 still apply. Two of the 15 (native-arm-pan, source-machine-layer) fail because their target file is gone, not merely shifted; the other 13 fail on hunk context alone",
  "the prelink path still names DEVELOPMENT_ARM64_BCM2837 (profile.toml [kernel.prelink] kernel), so the machine configuration has to be settled before any kernel link can be trusted",
  "pong (SM8475, /tmp/pong18) resolved the same problem by dropping BCM2837 rather than reviving it: it adds config/MASTER.arm64.pong, registers PONG in SUPPORTED_ARM64_MACHINE_CONFIGS, builds DEVELOPMENT_ARM64_PONG, and leaves profiles/arch/arm64's own series out of its patch_series behind an effectively empty migration/format2/arch-darwin24.series. Its Darwin24 work rides in a single 480 KB device aggregate (patches/xnu-ipados18/0001-pong-darwin24.patch, 97 files) that is SoC-specific and not reusable here",
]
completion = [
  "All eight CPUs come up and the interrupt controller delivers timer interrupts",
]
limits = [
  "No device log exists yet; the CPU area is unverified on hardware",
  "The Darwin 23 -> 24 arch adaptation is not started: nothing yet replaces the 15 failing arch patches or names the machine configuration the kernel will actually be built with",
]
next_action = [
  "Decide the machine configuration: drop BCM2837 for a raphael one (pong's path) or regenerate the arch series against xnu-11417",
  "Boot the arm64 kernel and record the per-CPU startup log",
]


evidence = [{ kind = "host", reference = "board.toml", command = "./unixnu build kernel -D ../enuma/UniXNU-enuma && ./unixnu build payload --kernel out/enuma/ipados-17.7.11-21H461/enuma/kernel/kernel.macho --config .cache/stage3-build.toml -D ../enuma/UniXNU-enuma && ./unixnu bootimg --uefi ../enuma/uefi-enuma --fd <stage3 FD> --dtb <stage3 DTB> -o out/enuma/stage4/boot.img -D ../enuma/UniXNU-enuma", revision = "01500a9a38a4185306cb9f27df17677bb2307158", result = "Host build, self-checked (no device run, not device-verified). kernel.macho sha256 39cecb2e... (51064832 B); payload.img 192 MiB FAT, content 51078722 B (~25% of size_mib); boot.img sha256 bee177a2... (203505664 B, header v1). build kernel / build payload / bootimg all exit 0." }, { kind = "device", reference = "docs/firmware-log-capture.md", command = "fastboot -s <enuma> boot out/enuma/stage3/boot.img", revision = "bf4eeffdde548ffafa813062bfaac52c01d38d56", result = "fastboot boot OKAY (push 4.5 s), no partition flashed. boot.img sha256 141eaa7eacaa5865bb852cb435124a38b43abf92715de2609e7005297f32b7bb (203505664 B, header v1, ramdisk 192 MiB FAT payload). Log: 'UNIXNURAMDISK: initrd block device 0xA3FFF000 size 0xC000000 Success' then '[Bds]Booting UniXNU', UniXNU.efi loaded, FAT mounted; no 'no initrd in /chosen', no ASSERT, no NO WINDOW. Menu default UniXNU item counts down 3 s then Load Error (32-byte placeholder kernel, expected)." }, { kind = "device", reference = "docs/firmware-log-capture.md", command = "fastboot -s <enuma> boot out/enuma/stage4-log/boot.img", revision = "829cf6a491ec2af86dc086410eea46d57b937408", result = "fastboot boot OKAY, no partition flashed. stage4-log/boot.img sha256 056a095f... (203505664 B, header v1), kernel.macho 39cecb2e... (51064832 B), payload.img 4e601ff7... (201326592 B), firmware FD e524988b... (3145728 B). Log: UNIXNU: menu timeout -> boot entry 'xnu' -> DARWINBOOT: hand-off -> Exiting boot services (green bar). Verifier (Luna) independently re-ran the hash/header/bootimg reproduction (byte-identical). Does not prove the XNU entry executed." }, { kind = "host", reference = "board.toml", command = "./unixnu build payload -D ../enuma/UniXNU-enuma --kernel out/enuma/ipados-17.7.11-21H461/enuma/kernel/kernel.macho --config .cache/stage3-build.toml && ./unixnu bootimg --uefi ../enuma/uefi-enuma --fd <stage4 FD> --dtb <stage3 DTB> -o out/enuma/stage5-probe/boot.img -D ../enuma/UniXNU-enuma", revision = "700772a915c40c75061087e977da2f950f66c427", result = "Host build, self-checked (no device run, not device-verified). board.toml [payload] entry_probe_reset_delay = 6 with panic_screen omitted (the panic screen code is 2607 B, exceeding this kernel's __text padding 2512 B by 95 B, so only probe stages 1/2/3 are installed). build payload exit 0; payload-patch.log: 'patched kernel.macho: stage 1 blue bar, stage 2 magenta bar, stage 3 reset 6 s after the MMU is on'. The source kernel.macho (39cecb2e..., 51064832 B) is copied, not modified in place; the patched payload kernel is b45918924d8e5399462be00de2ab087990a8b1146e36b39caf12b75c2a849cb9. payload.img sha256 7c42e252fab9955b3431da97b9191deca9dc42c667d2908ae7ec7826333de448 (201326592 B; content ~48.7 MiB, under the 182 MiB 95% cap). bootimg exit 0; boot.img sha256 5ee53cb0ded71248981d3df31133b9befd0f36197a26db3d4cee44fe5f8d656e (203505664 B, header v1, ramdisk 201326592 B == payload.img, FD e524988b..., DTB 42d36a00...)." }, { kind = "device", reference = "docs/firmware-log-capture.md", command = "fastboot -s <enuma> boot out/enuma/stage5-probe/boot.img", revision = "b64e5564fc8be0213a52df65a479a7ff44d2ee07", result = "fastboot boot OKAY (push 4.5 s), no partition flashed. Screen (user observation, filmed; the reset itself was not captured on video): after the countdown the green bar, then blue bar, then magenta bar appeared in order, and ~6 s later the device auto-reset into fastboot (magenta bar -> fastboot clearly < 20 s, so not the ~20 s firmware watchdog); bootreason=bootloader in Android. First device evidence that the XNU entry instruction executed (blue bar, MMU off), reached just before MMU-on (magenta bar), and the MMU was enabled (stage 3 reset 6 s after). This run had no console-ramoops-0 in pstore (dmesg shows ramoops attached 0xb0000000/4 MiB; stages 3/4 had it): hypothesis (unverified) - XNU ran and took/zeroed 0xB0000000, and the ADT does not reserve it, or the reset path did not retain RAM. Does not prove any execution past the MMU enable (after _arm_init)." }, { kind = "host", reference = "docs/entry-probe-bisect.md", command = "./unixnu build payload -D ../enuma/UniXNU-enuma --kernel out/enuma/ipados-17.7.11-21H461/enuma/kernel/kernel.macho --config .cache/stage3-build.toml && ./unixnu bootimg --uefi ../enuma/uefi-enuma --fd <stage4 FD> --dtb <stage3 DTB> -o out/enuma/stage5-bisect/<NN>-<symbol>/boot.img -D ../enuma/UniXNU-enuma", revision = "0fc2405d82a78fea9d3b813d9ecbdcde47a5eda2", result = "Host build, self-checked (no device run, not device-verified). Six entry-probe bisect images built, each with entry_probe_reset_delay=6 + entry_probe_reset_after=<symbol> (in _arm_init or _kernel_bootstrap), occurrence 1. payload-patch.log for each: 'stage 1 blue bar, stage 2 magenta bar, stage 4 reset after call #1 to <symbol> in <fn>'; panic_screen false. Each boot.img is 203505664 B, header v1, ramdisk 201326592 B == its payload.img, FD e524988b..., DTB 42d36a00...; the patched payload kernel differs from the source 39cecb2e... . Checkpoint table, sha256 and read-out in docs/entry-probe-bisect.md." }, { kind = "host", reference = "docs/entry-probe-bisect.md", command = "./unixnu build payload -D ../enuma/UniXNU-enuma --kernel out/enuma/ipados-17.7.11-21H461/enuma/kernel/kernel.macho --config .cache/stage3-build.toml && ./unixnu bootimg --uefi ../enuma/uefi-enuma --fd <stage4 FD> --dtb <stage3 DTB> -o out/enuma/stage5-bisect/<NN>-<symbol>/boot.img -D ../enuma/UniXNU-enuma", revision = "a27731a4ddf7def41f034c2943ed32b322f5574e", result = "Host build, self-checked (no device run, not device-verified). Five more entry-probe bisect images (07-11), larger steps: entry_probe_reset_delay=6 + entry_probe_reset_after=<symbol> with entry_probe_reset_in in _kernel_bootstrap / _kernel_bootstrap_thread / _bsd_init. payload-patch.log: 'stage 1 blue bar, stage 2 magenta bar, stage 4 reset after call #1 to <symbol> in <fn>'; panic_screen false. Each boot.img 203505664 B, header v1, ramdisk 201326592 B == its payload.img, FD e524988b..., DTB 42d36a00...; patched payload kernel differs from source 39cecb2e... . Checkpoints: _kernel_thread_create, _sched_startup, _PE_init_iokit, _bsd_init, _vfs_mountroot. Images 01-06 unchanged (sha256 re-verified). See docs/entry-probe-bisect.md." }, { kind = "host", reference = "docs/entry-probe-bisect.md", command = "./unixnu build payload -D ../enuma/UniXNU-enuma --kernel out/enuma/ipados-17.7.11-21H461/enuma/kernel/kernel.macho --config .cache/stage3-build.toml && ./unixnu bootimg --uefi ../enuma/uefi-enuma --fd <stage4 FD> --dtb <stage3 DTB> -o out/enuma/stage5-bisect/<NN>-before-<symbol>/boot.img -D ../enuma/UniXNU-enuma", revision = "a6295419cde9ab30cb01828edce109bc2d797dbe", result = "Host build, self-checked (no device run, not device-verified). Five entry-probe bisect images (12-16) with entry_probe_reset_before=true + entry_probe_reset_delay=6 + entry_probe_reset_after=<symbol> (in _kernel_bootstrap_thread or _bsd_init). payload-patch.log: 'stage 1 blue bar, stage 2 magenta bar, stage 4 reset before call #1 to <symbol> in <fn>'; panic_screen false. Each boot.img 203505664 B, header v1, ramdisk 201326592 B == its payload.img, FD e524988b..., DTB 42d36a00...; patched payload kernel differs from source 39cecb2e... . Checkpoints: _bsd_init, _IOKitInitializeTime, _IOKitBSDInit, _IOFindBSDRoot, _vfs_mountroot (all reset-before). Images 01-11 unchanged (sha256 re-verified). See docs/entry-probe-bisect.md." }, { kind = "device", reference = "docs/entry-probe-bisect.md", command = "fastboot -s <enuma> boot out/enuma/stage5-bisect/<NN>-<symbol>/boot.img (16 checkpoint images)", revision = "07664d7844c122ef34186fd3cb163697d52f362a", result = "fastboot boot OKAY, no partition flashed (each image). Three colour bars then ~6 s auto-reset into fastboot at 04/05/06/09 and 15 (reset-before _IOFindBSDRoot); 16 (reset-before _vfs_mountroot) stuck with no reset (10+ s, manual long-press back to fastboot). Inferred: the kernel reaches IOFindBSDRoot and stops waiting for the root device (expected without a storage driver). Auto (PSCI) reset leaves no console-ramoops-0; manual long-press preserves it (firmware log only, up to DARWINBOOT hand-off / Exiting boot services). No kernel fault before the root-device wait." }]


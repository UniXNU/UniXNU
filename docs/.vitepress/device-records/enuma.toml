FF000 size 0xC000000 Success', then [Bds]Booting UniXNU -> UniXNU.efi loaded -> FAT payload mounted. No 'no initrd in /chosen', no ASSERT, no NO WINDOW; SPSS/SMBIOS 'start failed' are known harmless. ABL wrote initrd into /chosen (previously unconfirmed, now confirmed). Tested firmware source 1070b371e95bf59cfc6f955a37fec3c26ad2e804, same FD/candidate DTB as stage12-simplefb (no firmware rebuild for stage 3)." }, { kind = "device", reference = "docs/firmware-log-capture.md", command = "fastboot -s <enuma> boot out/enuma/stage4-log/boot.img (then fastboot continue + pstore read-back)", revision = "4db39e8fac0e6d76a1f0e9968e51f06f9b81e271", result = "fastboot boot OKAY, no partition flashed. ramoops read-back (console-ramoops-0.txt, 15732 B / 279 lines) shows 8 UNIXNU: lines (vs 0 before PcdUniXNUDebugLevel=0x4) and the DARWINBOOT: hand-off block, proving DARWINBOOT Print reaches ramoops. Firmware stays implemented (not device-verified)." }]


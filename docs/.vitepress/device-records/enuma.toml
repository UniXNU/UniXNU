findings = ["unixnu.lock committed from the first complete fetch: xnu d8b80295, sm8250 166235ec, edk2 cfb93724, libplatform a00a4cc3, libdispatch 30fe6a7d, libpthread c0e60fb5, AvailabilityVersions 933f9360, corecrypto-2023 11fba65b, IOStorageFamily e45fbe30.", "2026-11-07 feasibility (source review only, no build or device I/O): kernel-stage disk persistence is a separate mechanism from Advanced Logger. The reference (UniXNU-sheng 516a780473a2ac59c8b438e132bb60204dda9e22, package/BootLog.c boot_log_tick) writes msgbuf and panic snapshots through native_ufs_log_open/write/sync into a reserved userdata tail window and reads them back with a Linux or recovery reader, so it needs ShengUfs, CONFIG_XNU_NATIVE_UFS, CONFIG_XNU_BOOT_PROGRESS and sheng-log=1, none of which enuma enables. It cannot run before UFS publishes a root layout, and its reset glue (BootReset.c, PMIC reboot-reason cell) is board-specific and must not be copied. Before UFS the only options are the firmware QR export, UART/screen capture, and an unproven RAM-reserved buffer (the legacy R-002 Log Buffer 0x9fff7000/0x8000 note, warm-reset retention untested).", "Official kernel-stage capture that needs no storage driver (unixnu.com guide/debugging and porting/log-capture, checked 2026-11-07): UART via [payload] kernel_args serial=3 debug=0x14e (UNIXNU:/DARWINBOOT: lines), the framebuffer diagnostic page (boot-progress=1 freezes after 30 s stall, =2 runs continuously; needs CONFIG_XNU_BOOT_PROGRESS, which configs/enuma_defconfig leaves disabled), the pulse bar, the panic screen ([payload] panic_screen = true via patch-xnu-entry-probe.py, optional CONFIG_XNU_DT_PANIC_REGION), the entry-probe colour bars and entry_probe_reset_delay, and the USB debug terminal scripts/debug_terminal.py (CDC, giulia protocol only; enuma has no matching board backend). Persistent disk logging stays storage-gated as recorded above.", "2026-11-08 device run: firmware log channel established via RamoopsLogLib writing DEBUG output to the stock kernel's ramoops console zone (0xB0000000, 4 MiB = console 2 MiB + pmsg 2 MiB, no ECC, DBGC header). SEC sets the PON reset type to warm + bootloader reason, so an ASSERT or watchdog reset warm-restarts into fastboot with RAM preserved. Read-back flow: device in fastboot -> fastboot -s <enuma> continue (no reset) -> Android boots -> root reads /sys/fs/pstore/console-ramoops-0 (su -c cp to /data/local/tmp then adb pull, then delete the temp file). A hard reset loses the log. See docs/firmware-log-capture.md.", "Collect the first diagnostics observation, its cause when established, and the resulting implementation decision."]
completion = ["Each claimed milestone has a reproducible command, a matching source/image revision and an accessible result."]

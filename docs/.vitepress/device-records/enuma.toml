schema_version = 1

[device]
name = "enuma"
soc = "SM8250-AC"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Pad 5 Pro 5G (SM8250-AC) iPadOS 17.7.11 bring-up. Format 2 migration started 2026-11-06: device repo + UniXNU-sm8250-common + uefi-enuma. Every area is planned until hardware evidence is recorded."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", "patches/xnu/series", ".github/**", ".gitignore", "local.toml.example", "scripts/__pycache__/**", "scripts/**/__pycache__/**"]
inputs = ["FFT-infra/UniXNU-sm8250-common at 166235ec2480ff0992627b7aafa15c65ce6b4efa.", "Vendor DTS for SM8250-AC register, interrupt and clock values.", "A device-verified memory map for [payload] dram_size and the board DTS memory nodes."]
configuration = ["board.toml schema_version = 2 with [board], [components], [kernel], [device_tree], [firmware], [ipsw], [payload], [payload.adt], [package].", "feeds.toml and unixnu.lock pin FFT-infra/UniXNU-sm8250-common at 166235ec2480ff0992627b7aafa15c65ce6b4efa.", "dts/enuma.dts includes soc:dts sm8250.dtsi; no unverified addresses are written."]
procedure = ["./unixnu defconfig enuma_defconfig -D ../UniXNU-enuma", "./unixnu fetch -D ../UniXNU-enuma", "./unixnu status --json -D ../UniXNU-enuma", "./unixnu tree -D ../UniXNU-enuma"]
findings = ["2026-11-09: board.toml [kernel] config_fragments gains \"os:configs/ipados.config\" and patch_series gains a device-local OS layer (patches/xnu/os-series) that omits zzz-boot-progress.patch and keeps the two XnuPrelink ABI patches (security-init + sparse-index); the omitted patch needs the sheng XNU_SHENG_PMGR hook enuma does not select, per the upstream sm-t970 device record. The resolved set is 60 patches (56 arch + 2 soc + 2 os).", "2026-11-07: corrected stale skeleton/feed notes and enabled payload Tools for the planned firmware logger. No new hardware driver is selected.", "Upstream HEAD check: UniXNU 10edc1efeeabc8c180b1a3ad9f96b7c8e36a385e, uefi-sheng 66421cb7bb5694843aec8de1ca3d1de4c20cca38, kona 166235ec2480ff0992627b7aafa15c65ce6b4efa. Independent UniXNU clone failed with TLS EOF; API comparison shows steps/log-capture unchanged. Existing pins remain active pending a successful isolated upgrade review.", "Repo hygiene: removed committed __pycache__ copies; format-1 legacy scripts are not part of the official flow.", "The official tree ships no SM8250 common repository; this board adopts FFT-infra/UniXNU-sm8250-common pinned at 166235ec (alioth record used a6e7e36c).", "The shared layer covers common registers, GIC, timer, CPU topology and controller bases; enuma CPU/GPU OPP, power votes and thermal zones stay board-owned.", "SM8250-AC is Snapdragon 870; the public device index archives it under the SM8250 family name.", "alioth (Redmi K40) is SM8250-AC (Snapdragon 870), the same SoC bin as enuma, not 865; its board-specific CPU/GPU votes remain non-portable to enuma.", "2026-11-08: board.toml [firmware] submodules is commented out because the firmware inputs (Mu_Basecore, openssl, Common/Mu) are hand-placed at their gitlink commits and git submodule update --init fails on a non-empty openssl directory; no other board.toml value changed. See the firmware area for the build evidence.", "2026-11-08 device run (user authorised, filmed; media in .cache/media, not in repo): fastboot boot of stage12-simplefb/boot.img (sha256 ef7822890e993e49a2d921b008f0bbb82db86c18894642b53ae37d1760096dca, firmware source 1070b371e95bf59cfc6f955a37fec3c26ad2e804) walked SEC -> DXE -> BDS -> the UniXNU built-in menu: MMU 48 regions / map valid / enabled, SEC entry x0 = 0xAFDFE000 (the FDT handed by ABL, 980226 bytes, inside the Kernel reservation), UFS INQUIRY SAMSUNG KLUEG8UHDC-B0E1, menu Return to firmware / Restart / Power off / Tools with countdown, volume keys move and power key confirms, Tools > Advanced Logger QR carousel works. Not reached: [payload] is not built, bring-up stage 3 onward is untested, and the memory-reservation preservation clause is not yet device-verified (hence implemented, not device-verified).", "2026-11-08 stage 3 (payload): [payload] dram_size = 0x200000000 (8 GiB; RamManagerDxe mapped 0x80000000-0x280000000 on device). [payload.adt] chip_id = 958bdc0f is a locally generated 32-bit software identity value (not the hardware ECID and not the donor chip-id); the platform seed stays in the git-ignored build config, never in the repository. root_match_volume_uuid is commented out for stages 1-5 and is backfilled at stage 6 from the built userdata root volume UUID. dts/enuma.dts now declares one enabled memory node (0x80000000, 0x200000000).", "2026-11-09 stage 3 first device run (user authorised, filmed; media .cache/media/stage3-20261109T004402, git-ignored): fastboot boot of out/enuma/stage3/boot.img (sha256 141eaa7eacaa5865bb852cb435124a38b43abf92715de2609e7005297f32b7bb, 203505664 B, header v1, ramdisk = 192 MiB FAT payload; firmware source 1070b371e95bf59cfc6f955a37fec3c26ad2e804, same FD and candidate DTB as stage12-simplefb) pushed in 4.5 s and returned OKAY with no partition flashed. The menu appeared and the board.toml [payload] dram_size / [payload.adt] chip_id and the dts memory node values now boot on device. The default UniXNU item counts down 3 s then calls DarwinBoot and shows Load Error (32-byte placeholder kernel, expected, no kernel handoff). Configuration stays capped at implemented (not device-verified): the ramdisk/FDT placement and the DarwinBoot window are stage-4 questions.", "2026-11-09 stage 4 first device run (user authorised, filmed; media .cache/media/stage4-20261109T181331, git-ignored): fastboot boot of out/enuma/stage4-log/boot.img (sha256 056a095f69876c552f2e71ebfb41fced08642032d04ff02e10e8302ed3eac1ac, 203505664 B, header v1, ramdisk = 192 MiB FAT payload; firmware source uefi-enuma fix/unixnu-debug-level commit 4db39e8fac0e6d76a1f0e9968e51f06f9b81e271, new FD sha256 e524988b8a05f15847ffc991170de8a5e0ead607400421e0835084497a71bf1e) returned OKAY with no partition flashed. The same board.toml values that booted stage 3 (dram_size 0x200000000, chip_id 958bdc0f, dts memory node) now boot the real kernel to the DarwinBoot hand-off (UNIXNU: menu: timeout, booting default 0 -> UNIXNU: boot: entry 'xnu' (UniXNU) -> DARWINBOOT: hand-off to the kernel -> Exiting boot services, green bar). Configuration stays planned (not implemented): the XNU entry and MMU enable are not yet proven."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["Board DTS has no verified memory or peripheral wiring; shared kona resources do not establish enuma reservations or AC power policy."]
next_action = ["Extract enuma vendor DTS and reconcile board memory and wiring before extending dts/enuma.dts."]
evidence = [{ kind = "device", reference = "docs/firmware-log-capture.md", command = "fastboot -s <enuma> boot out/enuma/stage3/boot.img", revision = "bf4eeffdde548ffafa813062bfaac52c01d38d56", result = "fastboot boot OKAY (push 4.5 s), no partition flashed. Log shows 'UNIXNURAMDISK: initrd block device 0xA3FFF000 size 0xC000000 Success' then '[Bds]Booting UniXNU', UniXNU.efi loaded, FAT mounted; no 'no initrd in /chosen', no ASSERT, no NO WINDOW. Menu default UniXNU item counts down 3 s then Load Error (32-byte placeholder kernel, expected). Confirms the board.toml [payload] dram_size / [payload.adt] chip_id and the dts memory node values boot on device." }, { kind = "device", reference = "docs/firmware-log-capture.md", command = "fastboot -s <enuma> boot out/enuma/stage4-log/boot.img", revision = "829cf6a491ec2af86dc086410eea46d57b937408", result = "fastboot boot OKAY, no partition flashed. Reached the DarwinBoot hand-off (DARWINBOOT: hand-off to the kernel -> Exiting boot services, green bar), confirming the stage-4 board.toml values ([payload] dram_size, [payload.adt] chip_id, dts memory node) boot a real kernel. Does not prove the XNU entry executed or the MMU was enabled." }]


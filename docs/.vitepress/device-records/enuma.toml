[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = ["Identify the memory and dma hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for memory and dma."]
procedure = ["Follow the memory and dma stage in the porting guide and record the actual commands."]
findings = ["2026-11-07: the live pre-root FDT (fdt.stdout) /memory reg carries three ranges - 0x80000000-0xBBB00000 (0x3bb00000), 0x180000000-0x280000000 (0x100000000), 0xC0000000-0x180000000 (0xC0000000), about 7.9 GiB usable; input provenance, not verified runtime ownership. The three vendor_boot SoC DTBs all declare an empty memory reg (0x00 0x00 0x00 0x00).", "Astra High pre-logger review (ses_e4e61aafcffeyH5oBsTu0pSMYe): SEC InitializeMemory (Sec.c 97-122) builds memory HOBs/MMU before SecMain builds the pointer-only entry HOB (172-178); RamManager fills uncovered RAM conventional; there is no enuma FDT/initrd mapping/reservation contract yet. RamManager.c ManageRam has an uninitialized memory-range local, narrowly fixed by the firmware worker, not in this device task.", "2026-11-08: uefi-enuma MemoryMapLib.c DDR table now has 23 rows reconciled against enuma XBL uefiplat.cfg [MemoryMap] (per-row 'cfg L<n>' citations; xbl_a sha256 7ac67cbf4c7870a972cb4ffd9cc09d5db1c96b7f4a5abc7a80c0da9cabc65057). HYP shortened to 0x5D0000 (sheng hyp-region no-map form); Kernel 0xA0000000/0x10000000 kept (cfg L33). Overlap check (UniXNU-enuma/.cache/check-memorymap-overlap.py) reports 23 rows with no overlaps, all inside enuma DRAM 0x80000000-0xbbb00000. Kernel reservation vs owned_memory_size window stays PENDING-STAGE4 (DarwinBoot AllocateWindow failure shows 'NO WINDOW/BIG RUN/FREE').", "2026-11-08 reviewer Sol open: RAM Partition protocol producer unconfirmed (EnvDxe.efi has only a GUID reference, no producer identified); Kernel reservation vs owned_memory_size window remains for stage 4 device observation before any value is committed.", "2026-11-08 device run: DXE Heap 2 (0x93200000/0x05700000) merged with the DXE Heap to ~138 MiB (was 51 MiB) in uefi-enuma MemoryMapLib.c resolved the DxeCore DxeMain.c(581) AllocatePoolPages ASSERT seen in an earlier run. RamManagerDxe then mapped the DRAM regions spanning 0x80000000-0x280000000 (8 GiB physical): 0x805F0000-0x80600000, 0x80800000-0x80860000, 0x80880000-0x80884000, 0x80894000-0x80900000, 0x80B00000-0x82400000, 0x85E00000-0x86000000, 0x9E400000-0x9F800000, 0x9FFD0000-0x9FFF7000, 0xB0400000-0x280000000. A RAMOOPS row (0xB0000000/0x400000) reserves the stock kernel's ramoops console zone. Candidate [payload] dram_size = 0x200000000 (recorded as a candidate only, NOT written to board.toml; needs user confirmation). Kernel reservation vs owned_memory_size window remains PENDING-STAGE4.", "2026-11-08 stage 3: dts/enuma.dts adds memory@80000000 (device_type = memory, reg = <0 0x80000000 0 0x200000000>). The shared ADT generator (scripts/unixnu/devicetree.py) requires exactly one DRAM range and [payload] dram_size must equal it, so the live FDT /memory three ranges (0x80000000-0xBBB00000, 0xC0000000-0x180000000, 0x180000000-0x280000000) are represented as one 8 GiB span. Correction (reviewer Sol 2026-11-09): the single span is not a conservative carve-out and does not exclude the hole - reg 0x80000000 + 0x200000000 includes the reserved 0xBBB00000-0xC0000000 (~69 MiB) hole inside the span, so it is a span, not proof of contiguous allocatable memory. Host build only; not device-verified.", "2026-11-09 stage 3 first device run (user authorised, filmed; log .cache/media/stage3-20261109T004402/console-ramoops-0.txt, 14516 B / 256 lines, git-ignored): with the 192 MiB ramdisk, ABL placed the FDT at 0xA3DFE000 (980302 bytes) - with an empty ramdisk it was 0xAFDFE000 - and wrote the initrd into /chosen (the previously unconfirmed ABL-initrd-into-/chosen item is now confirmed). The initrd block device is 0xA3FFF000 size 0xC000000 (0xA3FFF000-0xAFFFF000), entirely inside the Kernel reservation 0xA0000000/0x10000000, with no overlap against the firmware FD (0x9FC00000+0x300000), the DXE Heap 2 (0x93200000), and 4 KiB clear of ramoops (0xB0000000). This 192 MiB initrd occupies most of the 256 MiB Kernel reservation, so stage 4 must reconsider the DarwinBoot window / owned_memory_size before committing a value (pending stage 4 on-device).", "2026-11-09 stage 4 first device run (user authorised, filmed): DarwinBoot allocated the owned-memory window and handed off. DARWINBOOT: hand-off to the kernel -> kernel va 0xFFFFFFF00427C000 pa 0xC007C000; entry pa 0xC321A488 (entry words 140006F5); args pa 0xC40B0000 window 0x20000000 bytes; video base 0x9C000000 1600x2560 row 6400 bytes 32 bpp; CurrentEL 1 SCTLR_EL1 0xC0180D; Exiting boot services. No NO WINDOW / BIG RUN / FREE failure, so the ~512 MiB (0x20000000) window was allocated around 0xC0000000 (immediately above the 0xBBB00000-0xC0000000 hole) and the kernel was copied to pa 0xC007C000. This proves the DarwinBoot window allocation and ExitBootServices, NOT that the XNU entry executed or the MMU was enabled (needs the entry probe, stage 5)."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["Hardware inputs and implementation are pending for enuma.", "Parser live-FDT evidence is input provenance, not proof of memory runtime ownership; [payload] dram_size and the board DTS memory nodes still need runtime verification before any memory value is written.", "Astra High (ses_e4e61aafcffeyH5oBsTu0pSMYe): source-only conditions unresolved - SEC memory init precedes the entry HOB, and no enuma FDT/initrd reservation contract exists.", "Reviewer Sol 2026-11-08: RAM Partition protocol producer and the Kernel reservation / owned_memory_size window are unconfirmed; they stay pending until stage 4 device observation."]
next_action = ["Confirm RAM Partition protocol producer and the Kernel reservation / owned_memory_size window at stage 4 (device observation) before writing any memory value."]
evidence = [{ kind = "device", reference = "docs/firmware-log-capture.md", command = "fastboot -s <enuma> boot out/enuma/stage3/boot.img (then fastboot continue + pstore read-back)", revision = "bf4eeffdde548ffafa813062bfaac52c01d38d56", result = "Log: 'UNIXNURAMDISK: device tree at 0xA3DFE000, 980302 bytes' and 'UNIXNURAMDISK: initrd block device 0xA3FFF000 size 0xC000000 Success'. ABL wrote initrd into /chosen; ramdisk 0xA3FFF000-0xAFFFF000 sits inside Kernel reservation 0xA0000000/0x10000000 with no overlap vs FD / DXE Heap 2 / ramoops. 192 MiB initrd occupies most of the 256 MiB Kernel reservation -> stage-4 DarwinBoot window / owned_memory_size must be re-derived on device." }, { kind = "device", reference = "docs/firmware-log-capture.md", command = "fastboot -s <enuma> boot out/enuma/stage4-log/boot.img (then fastboot continue + pstore read-back)", revision = "829cf6a491ec2af86dc086410eea46d57b937408", result = "DARWINBOOT: hand-off to the kernel: kernel va 0xFFFFFFF00427C000 pa 0xC007C000, entry pa 0xC321A488 (words 140006F5), args pa 0xC40B0000 window 0x20000000 bytes, video base 0x9C000000 1600x2560 row 6400 32 bpp, CurrentEL 1 SCTLR_EL1 0xC0180D; 'Exiting boot services'. No NO WINDOW / BIG RUN / FREE, so the 512 MiB window was allocated at ~0xC0000000. Does not prove XNU entry / MMU enable (needs entry probe)." }]


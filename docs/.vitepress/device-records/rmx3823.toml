[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["dts/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = [
    "The stock firmware set: uefi.elf (the vendor UEFI, 3 MiB at 0xA7000000), tz.mbn, uefi_sec.mbn, boot.img and recovery.img.",
    "The board's uefiplatLA.cfg, recovered from the string blob inside uefi.elf.",
    "The 28 reserved-memory regions previously listed from /sys/firmware/devicetree/base/reserved-memory, addresses only.",
]
configuration = [
    "dts/board.dts declares one contiguous handoff range, memory@bab00000, reg = <0 0xbab00000 0 0x0d1c0000>.",
    "0xBAB00000 + 0x0D1C0000 is the \"DXE Heap\" entry of the vendor memory map and the only region it marks EFI_RESOURCE_SYSTEM_MEMORY with EfiConventionalMemory.",
    "aop_cmd_db_region@81c60000 keeps 0x20000, which the map supports: \"AOP\" is 0x81C00000 + 0xA0000 and aop_config_merged@81c80000 starts immediately after it.",
    "smem_region@81d00000 corrected from 0x400000 to 0x200000, the map's \"SMEM\" size. The old value would have covered adsp_mhi@81f00000, which begins where SMEM ends.",
]
procedure = [
    "Parsed the ELF program headers of uefi.elf: one LOAD segment, vaddr 0xA7000000, filesz 0x300000, entry 0xA7000000.",
    "Located the embedded config text by searching for \"[MemoryMap]\" and dumped it between the [Config] and [ConfigParameters] markers, replacing NULs with newlines.",
    "Parsed both the cfg and MemoryMapLib.c and compared address, size and name row by row; 39 rows, exact match, no overlaps within any section.",
    "Cross-checked against tz.mbn's program headers and the dtbo overlay's carveout addresses.",
]
findings = [
    "The vendor memory map has 39 regions: 25 DDR, 2 IMEM and 12 register windows. That is the whole of what UEFI may touch, and it is now what rmx3823Pkg carries.",
    "tz.mbn's entry point and first LOAD vaddr are 0x14680000, exactly the map's \"IMEM Base\", and its 0xd830a000 segment falls inside \"TZApps Reserved\" 0xD8800000 + 0x07400000. Two independent files agreeing on the same extraction.",
    "The map stops at 0x100000000 and does not describe installed RAM, so 24 GiB remains an inference from MemTotal. The DDR base 0x80000000 is confirmed by the map's first entry.",
    "Twelve of the device's 28 reserved regions fall in gaps the vendor map does not describe at all - chipinfo@81cf4000, adsp_mhi@81f00000, global_sync@82600000, tz_stat@82700000, mpss@89800000, mpss_dsm@d4d00000, xbl_sc@d8100000, cpucp_fw@d8140000, qtee@d8300000, oem_vm@f7c00000, oem_vm_swiotlb@f7b00000, trust_ui_vm@f3800000 - so UEFI neither reserves nor maps them.",
    "The handoff range cannot be the whole 24 GiB: the carveouts are interleaved through the low address space and no single contiguous range avoids them. The vendor's \"Kernel\" window 0xA8000000 + 0x10000000 is specifically wrong, because it is where ABL loads the boot image and this device's boot partition is 192 MiB, matching payload.size_mib.",
    "reserved-memory in dts/board.dts does not protect anything: the ADT generator only reads the memory node, and /chosen/memory-map carries RAMDisk, TrustCache, GpuAddon and RootPolicies only. The nodes are kept as verified documentation and because ShengGmuCommandDbInputs and the GPU driver name those addresses.",
]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = [
    "The handoff range is 210 MiB, enough to bring up but not to run a full system. Widening it needs the booter to exclude the carveouts, which is unverified.",
    "Individual extents inside \"PIL Reserved\" are still unknown; only the enclosing range 0x8A800000 + 0x18280000 is established.",
    "mpss@89800000 sits below 0x8A800000 and is not covered by any map entry, so its extent is unknown.",
    "Installed RAM is unconfirmed; the map does not state it.",
]
next_action = ["Verify the handoff range on hardware, then extend it once the booter's carveout exclusions are established."]
evidence = [
    { kind = "source", reference = "dts/board.dts", result = "Handoff range 0xBAB00000 + 0x0D1C0000, corrected SMEM size, and the 28 device regions reconciled against the firmware map into covered, collectively-covered and undescribed groups." },
    { kind = "source", reference = "docs/firmware.md", result = "Records that the firmware memory map is transcribed from the stock uefiplatLA.cfg, how the extraction was checked, and which values remain unverified." },
]


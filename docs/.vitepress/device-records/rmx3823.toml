[[area]]
id = "display"
status = "planned"
components = []
paths = ["package/*Display*", "package/*Framebuffer*", "package/*Backlight*", "package/AppleARMBacklight.cpp", "package/GeniI2c*", "scripts/*display*", "scripts/*gop*", "scripts/*framebuffer*"]
inputs = ["Identify the display hardware, resources and existing component interfaces for this board.", "The DSI controller and PHY nodes in dtbo.img entry 1."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for display."]
procedure = ["Follow the display stage in the porting guide and record the actual commands.", "Decompiled the stock dtbo.img; the overlay carries qcom,dsi-ctrl-hw-v2.7, qcom,dsi-phy-v5.2 and qcom,dsi-display, but no panel node."]
findings = [
    "The panel itself is still unidentified. The overlay carries the DSI controller (v2.7), PHY (v5.2) and display nodes, but the panel node lives in the base device tree, which is in vendor_boot.img - and boot.img is header_version 4, so it does not carry it either.",
    "Two facts about the panel are established. Its resolution is 1240x2772, confirmed independently by the touch node's display-coords 0x4D8 x 0xAD4, and the touch node reports panel_type 7.",
    "Display Reserved is 0xB8000000 + 0x02B00000 and Display Demura is 0xA2A80000 + 0x02B00000 in the vendor memory map, so the framebuffer carveouts are known even though the panel is not.",
]
completion = ["A known frame appears with correct geometry and colors, then userland presentation and backlight controls work."]
limits = [
    "No panel model, and therefore no initialisation sequence. vendor_boot.img or a device-side /sys/firmware/fdt dump is required.",
    "The firmware volume runs with RMX3823_VENDOR_HW = 0 and publishes a GOP over the framebuffer ABL already scans out, so this does not block bringing up the menu.",
]
next_action = ["Obtain vendor_boot.img or a device FDT dump to identify the panel, then extract its init sequence."]
evidence = [
    { kind = "source", reference = "docs/hardware-survey.md", result = "Section 10.3 explains why boot.img cannot carry the base device tree, and section 10.4 records the panel resolution and panel_type recovered from the touch node." },
]

[[area]]
id = "input"
status = "planned"
components = []
paths = ["drivers/ShengHidInput", "drivers/ShengNovatekTouch", "package/*Touch*", "package/*Button*", "scripts/*touch*", "scripts/*hid*"]
inputs = ["Identify the input hardware, resources and existing component interfaces for this board.", "The touch fragments in dtbo.img entry 1, machine Kalama MTP,zonda-A/B."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for input."]
procedure = ["Follow the input stage in the porting guide and record the actual commands.", "Decompiled the stock dtbo.img and read fragment@66, which carries all three touch candidates."]
findings = [
    "The active touch controller is a Synaptics S3910 over SPI, from fragment@66 of the dtbo overlay. synaptics_tcm@0 is the only one of three candidates marked status = ok; goodix-berlin@5d and synaptics_tcm_hbp@0 are both disabled.",
    "Wiring from that node: SPI CS0 at 15 MHz, IRQ GPIO 25 with interrupts = <25 0x2008> (falling edge, ONESHOT), reset GPIO 24, avdd GPIO 10, TX 17 x RX 38, panel_type 7, firmware AB641.",
    "drivers/ShengNovatekTouch does not apply to this board; a Synaptics TCM (SPI) implementation is needed instead.",
    "The same overlay carries a goodix node for a 1080x2400 panel, so the model ships with more than one touch and panel SKU. This unit is the 1240x2772 + S3910 combination.",
]
completion = ["Touches map to the display, simultaneous contacts keep stable IDs, release events arrive, and buttons produce expected HID reports."]
limits = [
    "No Synaptics TCM driver exists in this tree yet.",
    "The SPI bus instance is not identified: the overlay fragment targets a phandle rather than a named controller, so the bus number and its GPIO controller base still have to be resolved.",
    "Touch firmware AB641 has not been extracted.",
]
next_action = ["Resolve the SPI bus instance and GPIO controller, then write a Synaptics TCM reader against the addresses above."]
evidence = [
    { kind = "source", reference = "docs/hardware-survey.md", result = "Section 10.4 records the S3910 node, its status, bus, GPIOs and panel_type, and why the two other candidates are disabled." },
]


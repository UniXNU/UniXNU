schema_version = 1

[device]
name = "apollo"
soc = "SM8250"
os_profile = "ios-16.5-20F66"
summary = "Migrated from HakiOS, where iOS 16.5 reaches the home screen with touch, GPU, audio, Wi-Fi and battery. Format 2 configuration and hardware description in place; no UniXNU build and no UniXNU device boot yet."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "XnuPrelink"]
paths = ["board.toml", "feeds.toml", "configs/**", "os-profiles/**", ".github/**", ".gitignore", "local.toml.example", "unixnu.lock", "LICENSE", "NOTICE", "package/LICENSE.MIT"]
inputs = ["Pistachio-Project/UniXNU-sm8250-common at 90fa1fd; xnu-8796.121.2 (c54f35c); the iOS 16.5 20F66 iPhone10,3 IPSW."]
configuration = ["board.toml selects SoC sm8250, OS profile ios-16.5-20F66 (os-profiles/, linked by scripts/install-os-profile.sh) and apollo_defconfig."]
procedure = ["scripts/install-os-profile.sh; then from UniXNU: ./unixnu defconfig apollo_defconfig -D ../UniXNU-apollo; ./unixnu fetch; ./unixnu status --json."]
findings = ["UniXNU reads OS profiles only from its own profiles/os/, so the iOS 16.5 profile is linked in until it is contributed upstream.", "The OS cryptex hash 2279bf44... was measured on the HakiOS image and matches UniXNU-nio's published pin for the same IPSW.", "The OS profile now carries its own 51-patch kernel series for xnu-8796, so board.toml no longer selects the xnu-10063 ARM64 series.", "unixnu fetch resolves every source and unixnu status resolves without local overrides (unixnu.lock committed 2026-11-12).", "board.toml [payload.adt] chip_id is the Qualcomm SoC ID, 0x164 (356) as /sys/devices/soc0/soc_id reports on the phone; the ADT generator requires it.", "TOML keys with a dot (kern.maxvnodes) must be quoted in the profile's [adt] tables, or they become nested tables and the ADT generator fails.", "The root image (64354ba3...) matches its pin too; its APFS volume UUID is 97A3EB1A-5218-4936-BC85-9574EC2C8CC9. Both images are seeded in UniXNU's out/ipsw/20F66 cache."]
completion = ["defconfig, fetch and status resolve; status shows arm64, sm8250, ios-16.5-20F66 and device profiles in order with the intended patch order."]
limits = ["The firmware and boot image values have not been through unixnu firmware/bootimg yet."]
next_action = ["Rebase the arch series onto xnu-8796 so ./unixnu kernel can run (area packaging)."]
evidence = []

[[area]]
id = "firmware"
status = "implemented"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", "scripts/pull-firmware.sh"]
inputs = ["Pistachio-Project/uefi-apollo: Mu-Silicium apolloPkg from HakiOS (KonaPkg, XBL BOOT.XF.3.2-00304-SM8250-2 drivers).", "The phone's firmware, pulled by scripts/pull-firmware.sh into .cache/firmware (42 files in proprietary-files.txt)."]
configuration = ["[firmware] config apollo, apollo.dsc, FD at 0x9FC00000 size 0x300000."]
procedure = ["scripts/pull-firmware.sh with the phone in LineageOS, rooted adb; ./unixnu firmware -D ../UniXNU-apollo --uefi ../uefi-apollo."]
findings = ["On the phone (2026-11-12, fastboot boot from RAM): the RELEASE firmware reaches the UniXNU menu. Bisected on hardware: with the MdeModulePkg DiskIoDxe/PartitionDxe the firmware hangs on a blank screen, with the phone's prebuilt pair it reaches the menu (uefi-apollo ab70992).", "UniXNU's default boot image header (base 0, 4096-byte pages, tags at 0x1e00000) makes apollo's ABL boot Android instead; Mu-Silicium's mkbootimg values in [bootimg.image] work. A firmware-only image also needs a non-empty ramdisk (uefi-apollo Resources/ramdisk).", "A DEBUG build stops on ASSERT_EFI_ERROR (Out of Resources) in a prebuilt Qualcomm driver's uncached allocation; seen with the MdeModulePkg disk drivers, not retested with the prebuilt pair.", "Under HakiOS the same apolloPkg boots via fastboot boot and hands off to HakiOS's own XNU loader; UniXNU replaces that loader with UniXNU.efi and DarwinBoot.", "uefi-apollo needed sheng's SEC device-tree handoff (entry-argument HOB) and BootShim for UniXNURamDiskDxe and bootimg.py; DiskIo/Partition now come from MdeModulePkg instead of the XBL binaries."]
completion = ["Firmware image builds, enters the UniXNU menu, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["Only the firmware is verified: no payload, DarwinBoot handoff or XNU yet.", "uefi-apollo bc8f586 builds (RELEASE and DEBUG, 0x300000-byte FD) but has not been booted. The payload must stay inside ABL's reserved Kernel window at 0xA0000000 (256 MiB); check the UNIXNURAMDISK initrd address on first boot."]
next_action = ["Retest the DEBUG build with the prebuilt disk drivers, then boot a payload through DarwinBoot once the kernel builds."]
evidence = [
  { kind = "device", command = "./unixnu firmware --target RELEASE; ./unixnu bootimg --ramdisk ../uefi-apollo/Resources/ramdisk; fastboot boot", revision = "ab70992cdf353d7531df77649740bcce405365f4", reference = "https://github.com/Pistachio-Project/uefi-apollo/commit/ab70992cdf353d7531df77649740bcce405365f4", result = "Xiaomi Mi 10T M2007J3SY, LineageOS ABL: the UniXNU menu appears (no boot entries, no payload)." },
]

[[area]]
id = "cpu"
status = "planned"
components = ["ArmCpu"]
paths = ["dts/apollo.dts"]
inputs = ["GICv3 at 0x17a00000 / 0x17a60000; eight cores, Affinity1 ids 0x0-0x700; 4 Cortex-A55 + 4 Cortex-A77; EPSS cpufreq domains."]
configuration = ["All eight cpu nodes enabled; E/P cluster types from the SoC DTSI."]
procedure = ["Follow https://unixnu.com/porting/bring-up for CPU entry checkpoints."]
findings = ["HakiOS runs all eight cores and the big cores at full speed (apollo_cpufreq=1) on xnu-8796 with its own SMP patch."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["The SMP numbering and cluster patches for xnu-8796 are not in the SoC series yet."]
next_action = ["Split HakiOS's SMP changes into UniXNU-sm8250-common/patches/xnu."]
evidence = []

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**"]
inputs = ["XBL memory map from uefi-apollo MemoryMapLib.c: HYP, AOP CMD DB, SMEM, TZApps, PIL, display regions."]
configuration = ["dts/apollo.dts: DRAM 0x80000000 + 6 GiB, reserved-memory nodes for each firmware region."]
procedure = ["Compile with dtc -i ../UniXNU-sm8250-common/dts and inspect the generated ADT."]
findings = ["dtc compiles dts/apollo.dts with the SoC DTSI without warnings; scripts/make-adt.py produces a 14 KiB ADT with dram-base 0x80000000, dram-size 0x200000000, cpu0-3 E and cpu4-7 P, iPhone10,3 identity, sRGB, chip-id 0x164, and only intc under arm-io (2026-11-12).", "Measured on an 8 GiB M2007J3SY: the bootloader reports three DRAM banks with a 69 MiB hole at 0xbbb00000-0xc0000000; the DTS describes 8 GiB from 0x80000000 and reserves the hole."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["6 GiB units need their own memory node. Reserved regions reach XNU through the firmware memory map, not the ADT; not checked on hardware."]
next_action = ["On the first DarwinBoot handoff, compare the memory map XNU reports with the reserved-memory nodes."]
evidence = []

[[area]]
id = "storage"
status = "planned"
components = ["RamBlock"]
paths = ["scripts/gpt-carve-darwin.py", "scripts/darwin-write.py"]
inputs = ["UFS on SM8250 at 0x1d84000; HakiOS's Darwin partition carved from userdata (entry 34 of LUN 0)."]
configuration = ["RamBlock root for bring-up, as HakiOS runs from RAM; [userdata] points at the darwin partition, LBAs 25691904-30935034 (4096-byte)."]
procedure = ["Follow https://unixnu.com/porting/dual-system-partition with scripts/gpt-carve-darwin.py."]
findings = ["HakiOS keeps the system in RAM for a session; persistent /private/var is still in progress on apollo."]
completion = ["Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region."]
limits = ["No UFS driver for SM8250 in the catalog; ShengUfs is SM8550-only."]
next_action = ["Check unixnu userdata against the darwin partition, then the UFS path."]
evidence = []

[[area]]
id = "display"
status = "planned"
components = ["GopFramebuffer"]
paths = ["package/*Display*", "package/*Backlight*"]
inputs = ["Video-mode DSC panel mdss_dsi_j3s_37_02_0a_dsc_video, 1080x2400 at 0x9c000000, DPU INTF_1 at 0xae6b800, PM8150L WLED backlight."]
configuration = ["GopFramebuffer on the firmware's framebuffer; board ADT artwork-display-gamut sRGB, oled-display 0."]
procedure = ["Boot to the UniXNU menu, then XNU; check the framebuffer geometry and colors."]
findings = ["Under HakiOS, iOS draws black with the iPhone's P3 gamut on this sRGB panel; sRGB fixes it.", "HakiOS drives the refresh rate (60-144 Hz) and WLED brightness from patches/xnu/0001."]
completion = ["A known frame appears with correct geometry and colors, then userland presentation and backlight controls work."]
limits = ["Backlight and refresh control are in the unapplied HakiOS patches."]
next_action = ["Verify the GOP framebuffer path, then move the WLED driver to a board service."]
evidence = []

[[area]]
id = "input"
status = "planned"
components = []
paths = ["scripts/touch-fw-from-boot.py", "package/*Touch*", "package/*Button*"]
inputs = ["Novatek NT36675 (j3s) on QUPv3 SE4 SPI; PM8150 power-on block and GPIO6 for the keys."]
configuration = ["Touch firmware from .cache/firmware/touch (proprietary-files.txt)."]
procedure = ["Apply patches/xnu/0001-0002 once their base is available; boot with apollo_touch=1 apollo_buttons=1."]
findings = ["HakiOS has working multitouch and power/volume keys on apollo through /dev/hakios-touch."]
completion = ["Touches map to the display, simultaneous contacts keep stable IDs, release events arrive, and buttons produce expected HID reports."]
limits = ["ShengNovatekTouch targets NT36532 over a different transport; the HakiOS driver is not a catalog component."]
next_action = ["Port hakios.apollo_touch.c onto QcomGeniSpi and an IOHIDDevice source."]
evidence = []

[[area]]
id = "gpu"
status = "planned"
components = []
paths = ["package/*Gpu*", "package/*Adreno*"]
inputs = ["Adreno 650 with GMU at 0x3d6a000; a650_gmu.bin, a650_sqe.fw, a650_zap.* from .cache/firmware/gpu."]
configuration = ["No catalog component; HakiOS's A650 driver is in patches/xnu/0001 (apollo_adreno, ApolloGPU)."]
procedure = ["Boot with apollo_gpu=21 apollo_gpu_use=1 once the driver patches apply."]
findings = ["HakiOS renders the iOS UI on the A650 through Mesa freedreno (OpenGL ES); Metal is not available."]
completion = ["GPU submissions complete, mapping/fence handling is correct, a known image renders, and the selected Metal client presents it."]

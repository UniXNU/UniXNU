[[area]]
id = "packaging"
status = "planned"
components = ["SoftwareAES", "AppleKeyStoreState"]
paths = ["patches/**", "package/userland/**", "scripts/package.sh", "scripts/install-os-profile.sh", "package/Kit.toml"]
inputs = ["patches/xnu/0001-0002 from HakiOS (against xnu-8796.121.2 plus HakiOS's core patch); UniXNU's arch series (written for xnu-10063)."]
configuration = ["board.toml selects soc, os and device series; the OS series os-profiles/ios-16.5-20F66/patches/xnu/series replaces arch:patches/xnu/series. Device patch series lists the HakiOS patches commented out."]
procedure = ["scripts/package.sh --check --os ios-16.5-20F66, then scripts/package.sh --os ios-16.5-20F66 --uefi ../uefi-apollo."]
findings = ["UniXNU's 56 ARM64 patches against xnu-8796.121.2 (2026-11-12): 44 apply unchanged and are referenced from UniXNU (arch:); 5 are ported in os-profiles/ios-16.5-20F66/patches/xnu-8796 (apple-only-cpu-tunables, external-archive-dependencies, native-aes-personality, source-machine-layer, zzx-pmap-sync-64bit-pa); 3 do not apply to xnu-8796 (pgz-aligned-validation, public-entitlements-header, published-freezer-condition); 4 iPadOS 17 owner/addon/cryptex patches are left out. Both XnuPrelink patches apply unchanged. The resolved 51-patch order applies cleanly to a fresh xnu-8796.121.2 tree.", "zzx-pmap-sync-64bit-pa matters on apollo: 4 GiB of DRAM lies above 4 GiB.", "With UniXNU's Linux toolchain (2026-11-12) xnu-8796.121.2 compiles and links (mach.development.bcm2837) after seven more OS-profile patches: clang-drop-auto-var-init-acknowledgement and clang-uio-stackbuf (current clang), iorpc-kernel-content (the toolchain's iig emits xnu-10063 DriverKit glue), kalloc-pointee-type (os_get_pointee_type backport for C++ void pointers), arm64-kpc-from-xnu-10063 (the 8796 source release omits osfmk/arm64/kpc.c; non-Apple stubs), compile-records (clang -MJ, which the archive builders read) and pthread-jit-entitled-callback (UniXNU's libpthread 519.120.4). ArmDTPlatform, ArmCpu, SoftwareAES, RamBlock, AppleKeyStoreState, corecrypto and libpthread then build against xnu-8796.", "Prelink stops on the iOS 16.5 kernelcache (sha256 e6fa7559...): emit_prelink finds external PC-relative encodings in inline data. With its existing catalogue applied (SHA-256 K, Adler-32 vectors and the Libm pools all match iOS 16.5 too), only 8 words remain, all in com.apple.kec.Libm __TEXT_EXEC (va 0xfffffff005b8d000): 0x11cc, 0x11dc, 0x11ec, 0x11fc and 0x1490, 0x14a0, 0x14d4, 0x14ec. They lie in one block of double-precision constants that starts after the RET at 0x1050 and is read through ADR (targets 0x1068, 0x107c, 0x1088, 0x109c, 0x10c4, 0x14cc). Libm has no symbols, LC_FUNCTION_STARTS or ADRP data references, and no BL target delimits the block end yet.", "UniXNU build caching: patches that change exported headers do not reach .cache/fakeroot until its .xnu-<version>-headers stamp and the startup.o.json record are removed.", "The HakiOS apollo drivers depend on HakiOS's shared core patch (input, QMI, lx, audio plug-in layers), which is not in this repository."]
completion = ["Kernel and prelink succeed, payload contains all declared inputs, and the boot image matches the bootloader format and size limit."]
limits = ["kernel.macho is not produced yet: prelink is blocked (see findings). Nothing has run on hardware."]
next_action = ["Find the end of the Libm constant block after 0x1054 (first real instruction after 0x14ec), catalogue that span (prefix, size, SHA-256) in a device prelink wrapper that extends emit_prelink.MATH_LITERAL_POOLS, set [kernel.prelink] tool to it, then finish ./unixnu kernel."]
evidence = []


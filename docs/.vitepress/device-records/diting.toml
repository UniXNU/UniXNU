findings = ["scripts/package.sh --check --no-deps 在 Linux 上通过：1 个补丁、diting_ipados18_defconfig、OS ipados-18.7.10-22H374。release 只跑 kernel/package/firmware/payload，不含 userdata；本板内核需要 MACHINE_CONFIGS=DITING，共享 kernel 步骤写死 BCM2837，因此由 kits/DitingPlatform24 作为组件 recipe 编译；共享 kernel 步骤的 tree 已有真实 drivers/ 目录，设备 builder 另用一棵树并在编完后回填 mach.development.diting。bootimg 的 validate 只认 v0-v2 头，board 覆写 header_version = 0。本板固件只认 PONGFAT1 包装的 ramdisk，故规范产物 boot/boot.img 之外另出 boot.img.diting。userdata 不走 unixnu userdata：它写 SHNGROOT v2 且缺 Data 窗口，本板 RootLayout.h 只接受 v1 且强制 OS/SystemOS/Data 三窗口。", "package.yml 去掉未使用的 blacktop/tap/ipsw；porting-record.yml 改为 submodules: recursive，与 drivers/ submodule 拆分对齐。"]
completion = ["在 macOS runner 上跑通 package.yml 两个 job，并取得 boot.img、boot.img.diting、payload.img、kernel.macho、package.manifest.json 与 userdata 分片"]
limits = ["CI 尚未在 macOS runner 上运行；真机未刷入。prelink slide 尚未在本板表达，流水线用 --skip-prelink。devicetree.generate() 要求单段 /memory，自定义 DT 属性不透传。"]
next_action = ["在 fork 上手动触发 package.yml，带 ipsw_url，核对两处产物再上真机"]

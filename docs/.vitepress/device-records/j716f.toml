wn; later marker state cannot isolate that path. Repeat a controlled P7 boot_b cycle from a photographed baseline, without forced shutdown or ZUI detour. No new flash/source/device commands performed.", "V23P11A/B/D built and host verified, unflashed. Terminal phase11 value is P11S stage1..5, not SCTLR or MMU-on. Entry CRC writer and linked reader match P9. 40 kernel, 18 reader and 22 power-app mocked cases passed; actual images/HMAC/sources audited, nonpayload FV and compact SEC match P9/P8. Reboot and Power off are included through direct PSCI queries/actions, without RESET2; device power actions remain untested."]

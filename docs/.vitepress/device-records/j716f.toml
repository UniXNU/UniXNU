findings = ["2026-10-27 P22显式线性会话成功照片确认：NOW VALID next=size0x40、logical/raw1/1、ID1/query0/armed0/EL1；冻结ENTRY保留旧满环形头。INIT CRC5FF8AFC6按哈希一致reader格式及照片旧/新头重建前48字节独立重算一致，未直接读取RAM；线性尾部262068字节。下一步同一reader Query一次，Query OK后ARM一次，拍完整成功状态/ID/CRC再核对；不重复新建会话。尚无P22内核启动/VM返回/重启保留结论，P21仍为最新内核实机边界。", "2026-10-27 P22初始只读reader照片确认VM RETURN TRACE r1/EL1；ENTRY/NOW VALID next0x2a871/size0x3fff4满环形，显示console CRC BE70D923，logical/raw0，冻结ID0，八槽及四终点/failure行均零，THIS RUN ID1/query0/armed0。线性尾部0，不满足Query所需896字节；须在同一项连续确认New linear session两次，拍成功/NOW页复核后再Query/ARM。父菜单未拍，完整console CRC未独立重算；尚无P22内核启动/VM返回或重启保留结果，P21仍为最新内核实机边界。", "2026-10-27 用户恢复P22测试并确认录像就绪：固定镜像SHA256再次核对；首次仅刷boot_b，B激活/可启动及reboot命令成功。仅记录命令证据，菜单/初始reader待照片确认，尚无P22 Query/ARM、内核启动或VM返回结果。P21仍为最新内核实机边界；不要再次刷写或直接启动，先reader FIRST。", "2026-10-27 原生 IRQ 观测候选：参照固定版 pipa/umi，在隔离 ArmCpu 副本加入 CPU/GIC/timebase 和 IRQ1/2/8 的 enter/rtclock-return/EOI 九快照。原厂/Recovery timer输入独立一致为PPI11/INTID27；保留原始调用/EOI并逐字节反向审计。Linux GCC/Clang各通过10实际writer样本、10解码反例、AArch64 sysreg汇编及隔离安装检查。首次CI因in-tree Module.commit为空在编译前被版本门槛拒绝；已改核对实际Git HEAD并保持字节哈希，修复后9ae5d75的CI40445461837源码编译/实际链接观测数组ABI/加密导出上传全部成功；解码器startup字段扩展另经双编译器主机校验；只用内核静态内存，无持久化writer、预链接、刷写或实机IRQ结论；P22待测不变。", "2026-10-27 文档与既有证据审查：P21 是最新实机边界，原始 TTBR1/TTBR0 返回及 TLB 同步后到达；P22 的 pmap/VM 收尾/原始返回仅主机通过，按用户要求暂缓刷入。仍处上游阶段5；原生平台源码候选已有 CI 成功证据，预链接、平台匹配、真实 timer IRQ、调度、存储/根卷与用户态待验证。上游 f85b5a60 相比 ae687009 仅刷新设备目录/记录；sheng、SM8550公共层、ArmCpu版本未变，构建固定版本不变。", "P22M built/host qualified, unflashed: 26 kernel, 8 dependency and 31 reader checks, final firmware/image audit. Pinned static bootstrap array precedes allocator; all post-switch writes and eight lifetime boundaries checked with shared PA/KVA and descriptor+ptov-validated physmap aliases. Original pmap_bootstrap, dynamic/copy-window tables, static-region patch, enable_preemption, stack canary and original RET execute; independent phases18/19/20/21 end at caller0xfffffff0079e1bbc. All152 original BLs/RET preserved, no mocked VM returns; borrowed table lifetime and diagnostic nonempty low root bounded to immediate stop. No device writes or P22 silicon/full-system/IRQ claim; preserve P21 hardware evidence.", "P21M continuous video10.632s/all319 frames decoded, sampled frames show one launch, dark screen, Lenovo/Android, same menu and first read-only reader agreeing with full photo. ENTRY/NOW VALID next=size0x380 logical/raw14/14; frozen ID1 bound to ARM145911AB, new reader ID2/query0/armed0. Six slots all L1/R1, nine CRCs independently match; terminal912996CC SCTLR0x3454593d/M1. Guarded console bridge, original TTBR1/TTBR0 setters and TLBI/DSB/ISB stop0xfffffff0073f5e0c reached; 512-byte growth after ARM and one reboot retention. MAP_FAILURE/RESET_RETURN zero. Diagnostic requests SYSTEM_RESET; reset source unresolved. No full arm_vm_init return, later borrowed-subtable lifetime, independent table/register dump, complete mapping/cache, timer IRQ/GIC/scheduler/storage/userspace result. No device command during media review.", "P21M built/host qualified, unflashed: 26 actual-kernel, 5 dependency and 31 linked-reader checks plus final FD/FAT/EFI/source/HMAC/nonpayload/SEC/image audit. Original VM preparation/physmap/qsort and TTBR1/TTBR0 setters retain BL/LR/errors; six independent CRC-bound slots through original TLBI/DSB/ISB stop0xfffffff0073f5e0c. Bridge writes only empty new low-root L1 slot2, reusing console-only bootstrap L2/L3 until immediate terminal; pinned TCR/MAIR/root/source/destination/readback guards. TCR-aware current-root walker checks active code/data PA/AF/AP/PXN; hierarchical permissions and exact root delta checked. P20 walker bit38 error corrected: high probe/stack map, low console absent; old device image/CRC evidence unchanged. No device write or silicon translation/TLB/cache/IRQ/full-VM claim. P20 remains latest hardware milestone.", "P20M 11.932s continuous video, all358 frames decoded, confirms one launch, dark display, Lenovo/Android splash, same P20M menu and first read-only reader matching separate photo. ENTRY/NOW VALID next=size0x2c45f, logical/raw13/13, fresh ID1/ARM8DD10BB5; new reader ID2/query0/armed0. Six slots L1/R1; all nine record CRCs independently match. Terminal9BD55B1B actual SCTLR0x3454593d/M1 at0xfffffff0073f5c04. Original arm_vm_init entry, early allocation, segment/page-size preparation and arm_vm_prot_init return reached. Header grows512 bytes after ARM; records retained over one observed reboot. Terminal deliberately requests SYSTEM_RESET, reset source independently unresolved. No full arm_vm_init return or new TCR/TTBR activation, complete new-table mapping, advancing counter, timer IRQ, GIC, scheduling, storage or userspace qualification. Candidate mapping gaps remain a host-model finding, not a measured device table dump. No device command during media review.", "P20M built/host verified and unflashed: 27 actual-kernel, 5 VM dependency and 31 linked-reader cases plus final image/HMAC/source/nonpayload/SEC audit. Original arm_vm_init entry, early_random/table allocation, segment/page-size processing and arm_vm_prot_init return execute; original BL/LR/error branches preserved. Stop0xfffffff0073f5c04 before TCR/TTBR replacement. Full Mach-O segments, loader-owned tail and AT/PAR walks modeled; 219 initial high data pages checked. New candidate roots lack retained-console and complete probe/stack mappings at this early stop; later activation gated. No device write or full VM/IRQ/scheduler claim; P19 remains latest hardware milestone.", "P19M 11.365s continuous video/341 decoded frames confirms one launch, splash reboot, same menu and first read-only reader. ENTRY/NOW VALID next=size0x2cef8 logical/raw13/13, fresh ID1/ARM17BBA853; new reader ID2/query0/armed0. All six slots L1/R1, terminal71ECEFD3 actual SCTLR0x3454593d/M1 at0xfffffff0079e1b34. All nine record CRCs independently match; header grows512 bytes after ARM. Original debug/startup, timer_call_init, cpu_init and processor_bootstrap returns reached; records retained over one observed reboot. Terminal intentionally requests SYSTEM_RESET; reset source independently unresolved. No arm_vm_init, advancing-counter, timer IRQ, GIC, scheduling, storage or userspace qualification. Host849 callbacks/27 functions are not measured device counts. No device operation during result review.", "P19M built and host verified: 57 actual-kernel, six dependency and 31 linked-reader modeled cases; final image/source/HMAC/nonpayload/SEC checks pass. Original debug/startup (849 callbacks, 27 functions), timer_call_init, cpu_init and processor_bootstrap execute in host model; BL/LR and original error branches preserved. 191 high virtual data-page mappings checked against original tables. MIDR/cache/debug/DAIF/counter and MMU/SMC/UEFI are synthetic models, no device claim. Intentional SCTLR/M1 stop at0xfffffff0079e1b34 then SYSTEM_RESET request, before later arm_init/arm_vm_init. Uncommitted P19 additions on recorded base with exact hashes; no flash. P18 remains latest hardware baseline; no native provider/timer IRQ/scheduler/storage/userspace result.", "P18M 14.277s continuous video/428 frames confirms single launch, splash reboot, same menu and first read-only reader. ENTRY/NOW VALID next=size0x380 logical/raw14/14, ID1/phase12; new reader ID2/query0/armed0. ARM209C5114, ENTRY664EEDB4 value209C511400C00808, six L1/R1 slots25EB17EA/A656094C/BD767B76/96C1194C/8B369F02/C778294C bind tag50313853 and ARM; terminal912996CC actual SCTLR0x3454593d/M1. All9 CRCs independently match; records retained over one observed reboot. Original boot CPU publish/max-CPU check, thread setter, cpu_bootstrap RET stub and rtclock_early_init return reached. Intentional stop0xfffffff0079e1b18 precedes debug/timer_call/cpu_init/processor_bootstrap and requests SYSTEM_RESET; reset source unresolved. No timer IRQ/full cpu_init/scheduler qualification. No new device operations during review.", "P18 preparation photo shows NOW VALID next=size0x180 logical/raw6/6, ID1/query1/armed1 ARM CRC209C5114, EL1, PSCI1.1 and SYSTEM_RESET FEATURES0; ARM + six invalid templates OK. ARM phase9 CRC independently reconstructs using P18 cookie and prior0x140/0x140. Frozen initial ENTRY and zero rows unchanged. Bound fresh ARM saved for one recorded P18M launch; complete header0x380/14 records is derived, not observed. No P18 kernel or retention result yet.", "P18 new-session photo confirms frozen initial ENTRY unchanged, NOW VALID next=size0x40, logical/raw1/1, ID1/query0/armed0 at EL1 and status New session OK. INIT CRC5A2B8DA8 independently reconstructs from old next0x23dc2/size0x3fff4 and new prior0/0. Full-ring logical reset and INIT readback observed; no Query/ARM, P18 kernel attempt or retention result.", "P18 initial photo confirms r1 reader at EL1, ENTRY/NOW VALID next0x23dc2 size0x3fff4 consoleCRCFFA3E073; P18 logical/raw counts0, frozen checkpointID0, all rows zero, THIS RUN ID1/query0/armed0. Saturated circular console requires explicit double-confirmed new linear session before Query/ARM. No P18 kernel attempt or terminal/retention result. Parent menu not pictured; boot_b flash identity and private image/media hashes retained.", "V14 reached the UniXNU menu and exercised the documented button and DarwinBoot protocol paths.", "V16 on boot_b displayed the green ExitBootServices bar, the blue MMU-off XNU entry probe and the magenta pre-MMU-enable probe; the screen also showed the normal CapsuleRuntimeDxe LockCapsuleInterface callback.", "V17 on boot_b waited through the post-MMU probe, executed PSCI reset, and returned to the UniXNU menu with the same three entry bars.", "V18 displayed the same three bars but later reset back to UniXNU despite replacing stage 3 with a WFE loop; the external reset/watchdog source is unresolved.", "V19/V20 added read-only reset diagnostics. V20 photographs showed the DarwinBoot pre-ExitBootServices message and a later menu, but no readable PMIC value.", "V21 continuous video confirms its own green/blue/magenta bands and restart through a Lenovo logo; V22A/1s and V22B/3s have passed host builds and final-image audits but have not been flashed.", "V22A/B hardware times were 20.245/19.730s, without the intended 1s/3s response; B ended in A-slot ZUI. V23P/C/V/M host builds passed. P alone was flashed to boot_b and tested; only its first diagnostic line appeared before restart, so PSCI remains unverified.", "V23P2 bootloader flash failed with unknown command; fastbootd flash of boot_b, B activation and reboot succeeded. Keep both operation outcomes separate.", "P3A/B builds passed and every extracted non-payload firmware module matches P2. No P3 device operation was performed; the V23 DSC/FDF and platform modules are unchanged.", "V23P3A was flashed only to boot_b via fastbootd, B activated and reboot command succeeded. Video, menu identity, prefix progress and PSCI results are pending; P3B remains unflashed.", "V23P3B was flashed only to boot_b via fastbootd, B activated and reboot command succeeded. User report for P3A was brief screen then reboot; no checkpoint or PSCI result established. P3B video is pending.", "V23P4 r1 actual non-payload firmware modules match P2; only embedded FAT changes. Original P4 was not flashed after preflight found its markers would be cleared.", "V23P4 r1 was flashed only to boot_b through fastbootd; B activation, current-slot b and slot-unbootable:b=no were verified; reboot command succeeded. Menu identity, marker visibility, PSCI and reset observations await video. Retry-count variable is unsupported.", "V23P4 r1 video confirms both early MMIO markers and title mode 5 with prefix squares 1/2; square 3 and EL/SCTLR are not observed. Original STR was passed, but external transaction completion is unproven. Diagnostic display disappears about 15.9s after entry, then Lenovo/Android splash and r1 menu return; PMIC 0x02000001 -> 0x02000041, reset cause unknown. Next-build source preference: UniXNU menu scale changed from 4 to 3 after r1 video; not compiled or flashed. Kernel diagnostic font unchanged. Original r1 library sources were privately snapshotted and match its remote-build hashes; the next build must explicitly audit the changed menu module.", "V23P5A/B matched controls passed host image, source/HMAC, pair-delta and emulator checks. A kernel equals P4 r1; B differs only in relocated STR-to-NOP and HMAC. Both use compiled menu scale 3, identical non-payload modules, markers and title DSB. No P5 hardware trial or device write. Test A then B on boot_b. See docs/V23P5_MATCHED_MMIO_CONTROL.md.", "V23P5A was flashed only to boot_b in fastbootd; B activation, current-slot b and slot-unbootable:b=no were verified; reboot command succeeded. A menu identity, marker progression and reset observations await video. P5B remains unflashed. No PSCI or MMU-on result is claimed.", "V23P5A video confirms the compact A menu, title mode 5, prefix squares 1/2 and both early MMIO markers, reproducing P4 r1 visible progress. No square 3, EL/SCTLR or PSCI evidence. Display disappears about 17.47s after entry, followed by Lenovo/Android splash and return to A menu; PMIC 0x02000001 -> 0x02000041. Reset cause and external MMIO completion remain unknown. P5B is the next boot_b control and remains unflashed.", "V23P5B was flashed only to boot_b in fastbootd; B activation, current-slot b and slot-unbootable:b=no were verified; reboot command succeeded. Its menu identity and diagnostic progress await video. Reviewed P5A remains the visible control; no P5B functional, PSCI or MMU-on result is claimed.", "V23P5B video confirms the compact B menu, both lower envelope markers and partial title in frame 56; the diagnostic is captured in only one camera frame. Top prefix 1 completion, prefix 2/3, EL/SCTLR and A0/pre-SMC are not established. Entry band to display loss is about 0.067s (camera observation), followed by Lenovo/Android splash and return to B menu; PMIC 0x02000001 -> 0x02000041. Rapid intentional PSCI reset is a hypothesis, not a verified result. Next proposed control retains P5B and replaces only its SMC with an in-place branch, preserving the preceding DSB; not yet built. This checkpoint supersedes earlier pending/unflashed notes; no new device operations or push occurred during video review.", "Reviewed upstream logging/automatic-test guide at 16e592abee8a550dec8154ed1f38b5ebc4f16213 and same-SoC umi at 3eb72578597d2ca16471b172d45eddc096a34a04. Prioritize board-qualified retained RAM trace plus separate firmware QR logging. Existing J716F Recovery DT/dmesg show overlapping boot_log 0xb0000000+0x80000 and pstore 0xb0000000+0x100000; console file length 262132 does not establish its physical subrange. Do not copy umi 4MiB/2MiB layout or sheng disk/reset constants. Verify layout/format and minimal reset retention before attaching XNU records. Full unattended logging requires a validated reader and return-to-fastboot cycle. Read-only source/evidence review only; no new device test or logging implementation.", "V23P6 RAMLOG r1 is host-verified and unflashed: read-only TWRP live parameters plus matching-build Recovery allocator emulation locate console at 0xb00be000+0x40000 (12-byte DBGC, ECC=0). iomem difference is reserved System RAM vmap versus non-RAM request_mem_region. Independent app validates live header before manual single-marker append; default read-only, no automatic start/reset, manual EFI warm request, no XNU. Actual SEC/four DXE nonpayload deltas are only the reservation-size byte; other modules/APRIORI unchanged. Retention and live header remain unverified. See docs/V23P6_RAMLOG_RETENTION.md.", "V23P6 RAMLOG r1 (uncommitted additions on the recorded repository base; exact source/image hashes are in the P6 manifest) was flashed only to boot_b through fastbootd with the audited image; B activation, current-slot b and slot-unbootable:b=no were verified, and reboot command succeeded. First live header, marker append, warm-reset retention and Recovery readback await device observation. No other partition write or repository push occurred.", "V23P6 first video/photo confirms the correct menu and read-only app: console DBGC 0x43474244, next=size=0x37bd9, capacity=0x3fff4, VALID, marker counts 0 and no append. The inferred console header is now device-readable and consistent, with 33819 bytes of unused capacity. No append, restart retention, Recovery readback or XNU progress is established. See research/v23p6-first-header.json.", "V23P6 second video verifies manual RAM marker append and same-run readback: next=size 0x37bd9 -> 0x37c09 (+48 bytes), now=1, appended_this_run=1, APPEND READBACK OK. At about 15s the app reports Warm reset returned; no actual reboot is observed. At about 28s the app exits to parent EFI return diagnosis with Success/code 0, which is normal app return and not reset success. Cross-reset retention and Recovery readback remain unverified. Root cause of the returned firmware reset call is unknown. First-header transcription corrected to 0x37bd9 (33819 free bytes). See research/v23p6-append-reset-return.json.", "V23P7 RESET r1 is host verified and unflashed. Only the P6 embedded FAT config/app changes; all non-payload inner-FV module sections and compact SEC executable match P6 exactly. Actual P6 reset driver uses SMC, queries RESET2 then falls back to SYSTEM_RESET; unused stack inputs are a host finding, not the proven failure cause. P7 defaults to read-only inventory; manual PSCI queries/firmware Warm/direct reset actions log PRE/RETURN to the validated console. Five wrapper cases, two linked record/gate cases and image/source audits passed with mocked SMC responses. First hardware trial must only photograph inventory and Query PSCI results on boot_b; no reset, retention or XNU result yet.", "V23P7 RESET r1 (uncommitted source additions on the recorded repository base; exact source/image hashes in the P7 manifest) was flashed only to boot_b through fastbootd. B activation, current-slot b and slot-unbootable:b=no were verified; reboot command succeeded. Inventory/PSCI-query observations await video. No reset trial, retention result or new XNU checkpoint is established.", "V23P7 photos verify EL1, installed reset driver GUID/RVA/prefix match, PSCI_VERSION=0x00010001 (1.1) and FEATURES=0 for SYSTEM_RESET and RESET2 A64. Valid console next=size grows 0x2923f -> 0x2958a (+843 bytes); P7 entry=0/now=6 and Queries complete=1. Query returns and app-displayed same-run records are established. No actual P7 reset, retention, Recovery readback or new XNU checkpoint. Next manual trial uses Direct RESET2 only; preserve initial post-reboot inventory or returned x0..x3. Uninitialized old-driver inputs remain an unproven cause.", "V23P7 RESET2 video/photo confirms two direct 0xc4000012 type=0/cookie=0 calls return x0=0xfffffffffffffffe (INVALID_PARAMS -2), x1..x3=0. FEATURES remains 0; valid console next=size 0x2958a -> 0x296a3 -> 0x297bc and P7 now 6 -> 8 -> 10. No reboot is observed in the 10.50s video; retention and Recovery readback remain untested. Old Warm falls back only on FEATURES failure, not on returned RESET2 error; historical P6 SMC returns remain uncaptured. Next manual test is existing Direct SYSTEM_RESET only. No new device commands, flash or source changes during this media review.", "User reports the first P7 Direct SYSTEM_RESET rebooted, then selecting it after reentering the app did not reboot. No new SYSTEM_RESET photo/video or post-reset ring counts yet. Fresh app load clears mQueried; without rerunning Query, the action is blocked before SMC. Second-attempt gate status versus actual returned SMC is unresolved. Preserve full page/entry/now before new queries. One reboot is user-reported; repeatability and RAM retention remain unverified.", "User clarified the second no-reboot selection displayed blocked; rerunning Query then Direct SYSTEM_RESET rebooted again. Two successful SYSTEM_RESET invocations are user-reported; no SYSTEM_RESET error return was reported. User then forced power off and entered ZUI13 before post-reset inventory capture. Earlier reset retention remains unknown; later marker state cannot isolate that path. Repeat a controlled P7 boot_b cycle from a photographed baseline, without forced shutdown or ZUI detour. No new flash/source/device commands performed.", "Controlled P7 retention cycle relaunched: fastboot initially reported current-slot a and slot-unbootable:b=yes. set_active b succeeded; current-slot b and slot-unbootable:b=no verified; reboot command succeeded. No partition image was flashed. Prior P7 flash/image hash supplies expected identity, not a new partition readback. Await menu identity, baseline and post-SYSTEM_RESET read-only photo; retention remains unverified.", "V23P9E was flashed only to boot_b after exact image-hash and fastbootd identity/unlock/size gates. B activation, current-slot b and slot-unbootable:b=no were verified; reboot command succeeded. Await the initial read-only reader ENTRY photo before Query/ARM. No kernel entry/reset-retention observation or MMU progress yet. V23P9M remains unflashed and gated on observed E entry-record retention.", "V23P12A/B built and host verified, unflashed. Six independent pre-staged CRC-bound records use one-byte commits; ENTRY high32 binds ARM CRC and low32 is SCTLR. A skips BCM and B preserves captured original address/value, with exactly one STR/NOP probe delta and identical reader/ADT/nonpayload firmware. 58 actual-assembly and22 linked-reader mocked cases passed; final image/HMAC/source audits passed. Byte-identical P11 power app reuses22 host cases. No P12 hardware/retention/MMU-on result; A first on boot_b only.", "V23P12A BCM SKIP was flashed only to boot_b after image SHA256, matched-probe and fastbootd product/unlock/slot-count/partition-size gates. B activation, current-slot b and slot-unbootable:b=no verified; reboot command succeeded. Menu-only launch; recording readiness was not separately confirmed. Menu identity, initial reader, fresh Query/ARM and kernel/slot observations pending. B remains unflashed and gated by reviewed A evidence; no P12 retention, reset-source or MMU-on result. A image SHA256=49e924cd6fc784dff9c9df0df917d2d05156d34f95eea9f24569dea69234b5f8.", "P12A initial photo confirms V23P12 reader at EL1, frozen ENTRY/NOW VALID next0x26e9 size0x3fff4 consoleCRC50977087, logical0/raw0 and all eight rows zero. THIS RUN ID1/query0/armed0. This is a saturated circular console, not an empty log. P12 linear-tail requirement fails before Query (832 bytes required); no Query block message or kernel launch observed. Parent A menu not pictured; variant follows recorded flash. Preserve baseline; qualify full-ring handling before a new attempt, B/P10C remain gated.", "P12 r2 A/B built and host verified, unflashed. New reader requires explicit double confirmation before discarding a VALID saturated/exhausted console logical history; frozen entry remains, payload not bulk-cleared, INIT records old next/size, failure locks Query/ARM. 45 actual-linked reader cases passed including full-session-to-both-unchanged-kernels-to-frozen-reader flow, changed-console cancellation, failure and stale-ID gates. A/B kernel/ADT/probes equal r1 byte for byte; 58 prior assembled cases reused after identity check. Power app equals P11, 22 cases reused. Final FD/FAT/EFI/source/HMAC/nonpayload/boot-image checks passed. No r2 hardware, retention or MMU-on result; A first on boot_b only.", "V23P12R2A BCM SKIP flashed only to boot_b after image SHA256/matched-probe/fastbootd identity gates. B active and bootable verified; reboot command succeeded. Menu-only launch; no independent recording-ready confirmation. Initial r2 reader, manual new-session action, Query/ARM and kernel observations pending. r2B remains unflashed and gated by reviewed r2A six-slot/header/reboot evidence. No new kernel progress, retention or MMU-on result.", "P12 r2A initial photo confirms r2 reader at EL1; ENTRY/NOW VALID next=size0x38b69, consoleCRC98919B86, logical0/raw0, frozen checkpointID0 and all eight rows zero. THIS RUN ID1/query0/armed0/CRC0. Unused linear tail29835 bytes exceeds Query832-byte budget; no session rollover needed or performed. No kernel launch, r2 retention or hardware rollover qualification; parent A menu not visible, variant follows recorded flash. Earlier r1 saturated baseline stays independent.", "P12 r2A Query/ARM photo shows NOW VALID next=size0x38ca9 logical5/raw5, THIS RUN ID1/query1/armed1 CRC063FE873 at EL1, PSCI1.1/FEATURES0 and ARM + six invalid templates OK. Frozen initial ENTRY remains0x38b69/CRC98919B86 with zero rows. Header growth320 bytes matches four Query records plus ARM; ARM phase9 CRC reconstructs exactly with cookie5031324b45524e4c and prior0x38c69. No session rollover or kernel launch observed. Fresh ARM binding saved for one A launch; expected terminal header0x38e69 is derived, not observed.", "P12 r2A postreboot photo confirms ENTRY/NOW VALID next=size0x38e69 consoleCRCC067D0A6, logical12/raw12 latest ID1/phase21/04FFEC87. Fresh ARM063FE873 matches prelaunch; ENTRY1210179B value063FE87300C00808(M0). All six stages16..21 are L1/R1 with CRCsE66CD221,AA22646F,B1021655,9AB5746F,8742F221,04FFEC87 and ARM-bound value50313253063FE873; all eight CRCs reconstruct exactly. New reader ID2/query0/armed0, read-only. User explicitly reports automatic reboot/menu return; no continuous video reviewed. A skipped BCM and reached all six commits/publication, with matching records present after reported reboot. Kernel SMC/reset source, original BCM completion, MMU-on and manual session rollover remain unqualified. r2B original-STR control is next."]

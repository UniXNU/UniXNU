findings = ["2026-11-01 Standard package.sh integration: aligned repository with upstream packaging specification (docs/porting/packaging.md) by introducing standardized scripts/package.sh and configuring [package] in board.toml.", "2026-11-01 Kernel naming alignment: per upstream commit 02f8cdd, .noctf suffix is dropped; build and prelink scripts directly consume and seal mach.development.bcm2837.unstripped in-place, passing HMAC post-verification. Packaged canonical boot image 3db23bc0870fc01ebb2bcd833500ebd87f46663e78b423b86e061ff548031976.", "2026-10-30 NATIVE FAST-V12: integrated metadata-preserved Apple 10MB APFS RAMDisk (ramdisk_apfs_meta_10mb.dmg, 234 metadata/bitmap blocks preserved, 66KB LZMA) with ADT /chosen/memory-map/RAMDisk and boot-arg rd=md0 inside V11's exact 7MB FD (0x700000), and updated NativeMenu/Main.c line 97 StrCmp guard to accept rd=md0 (fixing the pre-UI EFI_SECURITY_VIOLATION Lenovo splash hang).", "2026-10-27 P22显式线性会话成功照片确认：NOW VALID next=size0x40、logical/raw1/1、ID1/query0/armed0/EL1；冻结ENTRY保留旧满环形头。INIT CRC5FF8AFC6按哈希一致reader格式及照片旧/新头重建前48字节独立重算一致，未直接读取RAM；线性尾部262068字节。下一步同一reader Query一次，Query OK后ARM一次，拍完整成功状态/ID/CRC再核对；不重复新建会话。尚无P22内核启动/VM返回/重启保留结论，P21仍为最新内核实机边界。", "2026-10-27 P22初始只读reader照片确认VM RETURN TRACE r1/EL1；ENTRY/NOW VALID next0x2a871/size0x3fff4满环形，显示console CRC BE70D923，logical/raw0，冻结ID0，八槽及四终点/failure行均零，THIS RUN ID1/query0/armed0。线性尾部0，不满足Query所需896字节；须在同一项连续确认New linear session两次，拍成功/NOW页复核后再Query/ARM。父菜单未拍，完整console CRC未独立重算；尚无P22内核启动/VM返回或重启保留结果，P21仍为最新内核实机边界。", "2026-10-27 用户恢复P22测试并确认录像就绪：固定镜像SHA256再次核对；首次仅刷boot_b，B激活/可启动及reboot命令成功。仅记录命令证据，菜单/初始reader待照片确认，尚无P22 Query/ARM、内核启动或VM返回结果。P21仍为最新内核实机边界；不要再次刷写或直接启动，先reader FIRST。", "2026-10-27 原生 IRQ 观测候选：参照固定版 pipa/umi，在隔离 ArmCpu 副本加入 CPU/GIC/timebase 和 IRQ1/2/8 的 enter/rtclock-return/EOI 九快照。原厂/Recovery timer输入独立一致为PPI11/INTID27；保留原始调用/EOI并逐字节反向审计。Linux GCC/Clang各通过10实际writer样本、10解码反例、AArch64 sysreg汇编及隔离安装检查。首次CI因in-tree Module.commit为空在编译前被版本门槛拒绝；已改核对实际Git HEAD并保持字节哈希
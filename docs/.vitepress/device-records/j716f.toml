findings = ["2026-10-27 P22显式线性会话成功照片确认：NOW VALID next=size0x40、logical/raw1/1、ID1/query0/armed0/EL1；冻结ENTRY保留旧满环形头。INIT CRC5FF8AFC6按哈希一致reader格式及照片旧/新头重建前48字节独立重算一致，未直接读取RAM；线性尾部262068字节。下一步同一reader Query一次，Query OK后ARM一次，拍完整成功状态/ID/CRC再核对；不重复新建会话。尚无P22内核启动/VM返回/重启保留结论，P21仍为最新内核实机边界。", "2026-10-27 P22初始只读reader照片确认VM RETURN TRACE r1/EL1；ENTRY/NOW VALID next0x2a871/size0x3fff4满环形，显示console CRC BE70D923，logical/raw0，冻结ID0，八槽及四终点/failure行均零，THIS RUN ID1/query0/armed0。线性尾部0，不满足Query所需896字节；须在同一项连续确认New linear session两次，拍成功/NOW页复核后再Query/ARM。父菜单未拍，完整console CRC未独立重算；尚无P22内核启动/VM返回或重启保留结果，P21仍为最新内核实机边界。", "2026-10-27 用户恢复P22测试并确认录像就绪：固定镜像SHA256再次核对；首次仅刷boot_b，B激活/可启动及reboot命令成功。仅记录命令证据，菜单/初始reader待照片确认，尚无P22 Query/ARM、内核启动或VM返回结果。P21仍为最新内核实机边界；不要再次刷写或直接启动，先reader FIRST。", "2026-10-27 原生 IRQ 观测候选：参照固定版 pipa/umi，在隔离 ArmCpu 副本加入 CPU/GIC/timebase 和 IRQ1/2/8 的 enter/rtclock-return/EOI 九快照。原厂/Recovery timer输入独立一致为PPI11/INTID27；保留原始调用/EOI并逐字节反向审计。Linux GCC/Clang各通过10实际writer样本、10解码反例、AArch64 sysreg汇编及隔离安装检查。首次CI因in-tree Module.commit为空在编译前被版本门槛拒绝；已改核对实际Git HEAD并保持字节哈希，修复后9ae5d75的CI40445461837源码编译/实际链接观测数组ABI/加密导出上传全部成功；解码器startup字段扩展另经双编译器主机校验；只用内核静态内存，无持久化writer、预链接、刷写或实机IRQ结论；P22待测不变。", "2026-10-27 文档与既有证据审查：P21 是最新实机边界，原始 TTBR1/TTBR0 返回及 TLB 同步后到达；P22 的 pmap/VM 收尾/原始返回仅主机通过，按用户要求暂缓刷入。仍处上游阶段5；原生平台源码候选已有 CI 成功证据，预链接、平台匹配、真实 timer IRQ、调度、存储/根卷与用户态待验证。上游 f85b5a60 相比 ae687009 仅刷新设备目录/记录；sheng、SM8550公共层、ArmCpu版本未变，构建固定版本不变。", "P22M built/host qualified, unflashed: 26 kernel, 8 dependency and 31 reader checks, final firmware/image audit. Pinned static bootstrap array precedes allocator; all post-switch writes and eight lifetime boundaries checked with shared PA/KVA and descriptor+ptov-validated physmap aliases. Original pmap_bootstrap, dynamic/copy-window tables, static-region patch, enable_preemption, stack canary and original RET execute; independent phases18/19/20/21 end at caller0xfffffff0079e1bbc. All152 original BLs/RET preserved, no mocked VM returns; borrowed table lifetime and diagnostic nonempty low root bounded to immediate stop. No device writes or P22 silicon/full-system/IRQ claim; preserve P21 hardware evidence.", "P21M continuous video10.632s/all319 frames decoded, sampled frames show one launch, dark screen, Lenovo/Android, same menu and first read-only reader agreeing with full photo. ENTRY/NOW VALID next=size0x380 logical/raw14/14; frozen ID1 bound to ARM145911AB, new reader ID2/query0/armed0. Six slots all L1/R1, nine CRCs independently match; terminal912996CC SCTLR0x3454593d/M1. Guarded console bridge, original TTBR1/TTBR0 setters and TLBI/DSB/ISB stop0xfffffff0073f5e0c reached; 512-byte growth after ARM and one reboot retention. MAP_FAILURE/RESET_RETURN zero. Diagnostic requests SYSTEM_RESET; reset source unresolved. No full arm_vm_init return, later borrowed-subtable lifetime, independent table/register dump, complete mapping/cache, timer IRQ/GIC/scheduler/storage/userspace result. No device command during media review.", "P21M built/host qualified, unflashed: 26 actual-kernel, 5 dependency and 31 linked-reader checks plus final FD/FAT/EFI/source/HMAC/nonpayload/SEC/image audit. Original VM preparation/physmap/qsort and TTBR1/TTBR0 setters retain BL/LR/errors; six independent CRC-bound slots through original TLBI/DSB/ISB stop0xfffffff0073f5e0c. Bridge writes only empty new low-root L1 slot2, reusing console-only bootstrap L2/L3 until immediate terminal; pinned TCR/MAIR/root/source/destination/readback guards. TCR-aware current-root walker checks active code/data PA/AF/AP/PXN; hierarchical permissions and exact root delta checked. P20 walker bit38 error corrected: high probe/stack map, low console absent; old device image/CRC evidence unchanged. No device write or silicon translation/TLB/cache/IRQ/full-VM claim. P20 remains latest hardware milestone.", "P20M 11.932s continuous video, all358 frames decoded, confirms one launch, dark display, Lenovo/Android splash, same P20M menu and first read-only reader matching separate photo. ENTRY/NOW VALID next=size0x2c45f, logical/raw13/13, fresh ID1/ARM8DD10BB5; new reader ID2/query0/armed0. Six slots L1/R1; all nine record CRCs independently match. Terminal9BD55B1B actual SCTLR0x3454593d/M1 at0xfffffff0073f5c04. Original arm_vm_init entry, early allocation, segment/page-size preparation and arm_vm_prot_init return reached. Header grows512 bytes after ARM; records retained over one observed reboot. Terminal deliberately requests SYSTEM_RESET, reset source independently unresolved. No full arm_vm_init return or new TCR/TTBR activation, complete new-table mapping, advancing counter, timer IRQ, GIC, scheduling, storage or userspace qualification. Candidate mapping gaps remain a host-model finding, not a measured device table dump. No device command during media review.", "P20M built/host verified and unflashed: 27 actual-kernel, 5 VM dependency and 31 linked-reader cases plus final image/HMAC/source/nonpayload/SEC audit. Original arm_vm_init entry, early_random/table allocation, segment/page-size processing and arm_vm_prot_init return execute; original BL/LR/error branches preserved. Stop0xfffffff0073f5c04 before TCR/TTBR replacement. Full Mach-O segments, loader-owned tail and AT/PAR walks modeled; 219 initial high data pages checked. New candidate roots lack retained-console and complete probe/stack mappings at this early stop; later activation gated. No device write or full VM/IRQ/scheduler claim; P19 remains latest hardware milestone.", "P19M 11.365s continuous video/341 decoded frames confirms one launch, splash reboot, same menu and first read-only reader. ENTRY/NOW VALID next=size0x2cef8 logical/raw13/13, fresh ID1/ARM17BBA853; new reader ID2/query0/armed0. All six slots L1/R1, terminal71ECEFD3 actual SCTLR0x3454593d/M1 at0xfffffff0079e1b34. All nine record CRCs independently match; header grows512 bytes after ARM. Original debug/startup, timer_call_init, cpu_init and processor_bootstrap returns reached; records retained over one observed
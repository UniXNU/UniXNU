findings = ["2026-11-01 Standard package.sh --check verified on Linux host (Ubuntu 24.04): resolved 59 patches, fetched and extracted IPSW members, and pinned ShengUfs in unixnu.lock.", "2026-11-01 Added scripts/package.sh for standard release packaging flow.", "2026-11-01 macOS CI Run 41266339953 passed 100%: built clean XNU kernel with ArmCpu, ArmDTPlatform, VirtioMmioBlock, and native UFS driver linked; all 6 required platform symbols verified.", "2026-10-30 FAST-V12 diagnostics: compared V11 vs V12 and isolated Lenovo splash hang to NativeMenu/Main.c line 97 hardcoded StrCmp guard on Config.Entries[2].Args returning EFI_SECURITY_VIOLATION before UniXNUUiInit when rd=md0 was added. Updated Main.c guard and preserved V11's exact 7MB FD (0x700000) via metadata-preserved 10MB APFS RAMDisk (ramdisk_apfs_meta_10mb.dmg).", "2026-10-27 P22显式线性会话成功照片确认：NOW VALID next=size0x40、logical/raw1/1、ID1/query0/armed0/EL1；冻结ENTRY保留旧满环形头。INIT CRC5FF8AFC6按哈希一致reader格式及照片旧/新头重建前48字节独立重算一致，未直接读取RAM；线性尾部262068字节。下一步同一reader Query一次，Query OK后ARM一次，拍完整成功状态/ID/CRC再核对；不重复新建会话。尚无P22内核启动/VM返回/重启保留结论，P21仍为最新内核实机边界。", "2026-10-27 P22初始只读reader照片确认VM RETURN TRACE r1/EL1；ENTRY/NOW VALID next0x2a871/size0x3fff4满环形，显示console CRC BE70D923，logical/raw0，冻结ID0，八槽及四终点/failure行均零，THIS RUN ID1/query0/armed0。线性尾部0，不满足Query所需896字节；须在同一项连续确认New linear session两次，拍成功/NOW页复核后再Query/ARM。父菜单未拍，完整console CRC未独立重算；尚无P22内核启动/VM返回或重启保留结果，P21仍为最新内核实机边界。", "2026-10-27 用户恢复P22测试并确认录像就绪：固定镜像SHA256再次核对；首次仅刷boot_b，B激活/可启动及reboot命令成功。仅记录命令证据，菜单/初始reader待照片确认，尚无P22 Query/ARM、内核启动或VM返回结果。P21仍为最新内核实机边界；不要再次刷写或直接启动，先reader FIRST。", "2026-10-27 原生 IRQ 观测候选：参照固定版 pipa/umi，在隔离 ArmCpu 副本加入 CPU/GIC/timebase 和 IRQ1/2/8 的 enter/rtclock-return/EOI 九快照。原厂/Recovery timer输入独立一致为PPI11/INTID27；保留原始调用/EOI并逐字节反向审计。Linux GCC/Clang各通过10实际writer样本、10解码反例、AArch64 sysreg汇编及隔离安装检查。首次CI因in-tree Module.commit为空在编译前被版本门槛拒绝；已改核对实际Git HEAD并保持字节哈希，修复后9ae5d75的CI40445461837源码编译/实际链接观测数组ABI/加密导出上传全部成功；解码器startup字段扩展另经双编译器主机校验；只用内核静态内存，无持久化writer、预链接、刷写或实机IRQ结论；P22待测不变。", "2026-10-27 文档与既有证据审查：P21 是最新实机边界，原始 TTBR1/TTBR0 返回及 TLB 同步后到达；P22 的 pmap/VM 收尾/原始返回仅主机通过，按用户要求暂缓刷入。仍处上游阶段5；原生平台源码候选已有 CI 成功证据，预链接、平台匹配、真实 timer IRQ、调度、存储/根卷与用户态待验证。上游 f85b5a60 相比 ae687009 仅刷新设备目录/记录；sheng、SM8550公共层、ArmCpu版本未变，构建固定版本不变。", "P22M built/host qualified, unflashed: 26 kernel, 8 dependency and 31 reader checks, final firmware/image audit. Pinned static bootstrap array precedes allocator; all post-switch writes and eight lifetime boundaries checked with shared PA/KVA and descriptor+ptov-validated physmap aliases. Original pmap_bootstrap, dynamic/copy-window tables, static-region patch, enable_preemption, stack canary and original RET execute; independent phases18/19/20/21 end at caller0xfffffff0079e1bbc. All152 original BLs/RET preserved, no mocked VM returns; borrowed table lifetime and diagnostic nonempty low root bounded to immediate stop. No device writes or P22 silicon/full-system/IRQ claim; preserve P21 hardware evidence.", "P21M continuous video10.632s/all319 frames decoded, sampled frames show one launch, dark screen, Lenovo/Android, same menu and first read-only reader agreeing with full photo. ENTRY/NOW VALID next=size0x380 logical/raw14/14; frozen ID1 bound to ARM145911AB, new reader ID2/query0/armed0. Six slots all L1/R1, nine CRCs independently match; terminal912996CC SCTLR0x3454593d/M1. Guarded console bridge, original TTBR1/TTBR0 setters and TLBI/DSB/ISB stop0xfffffff0073f5e0c reached; 512-byte growth after ARM and one reboot retention. MAP_FAILURE/RESET_RETURN zero. Diagnostic requests SYSTEM_RESET; reset source unresolved. No full arm_vm_init return, later borrowed-subtable lifetime, independent table/register dump, complete mapping/cache, timer IRQ/GIC/scheduler/storage/userspace result. No device command during media review.", "P21M built/host qualified, unflashed: 26 actual-kernel, 5 dependency and 31 linked-reader checks plus final FD/FAT/EFI/source/HMAC/nonpayload/SEC/image audit. Original VM preparation/physmap/qsort and TTBR1/TTBR0 setters retain BL/LR/errors; six independent CRC-bound slots through original TLBI/DSB/ISB stop0xfffffff0073f5e0c. Bridge writes only empty new low-root L1 slot2, reusing console-only bootstrap L2/L3 until immediate terminal; pinned TCR/MAIR/root/source/destination/readback guards. TCR-aware current-root walker checks active code/data PA/AF/AP/PXN; hierarchical permissions and exact root delta checked. P20 walker bit38 error corrected: high probe/stack map, low console absent; old device image/CRC evidence unchanged. No device write or silicon translation/TLB/cache/IRQ/full-VM claim. P20 remains latest hardware milestone.", "P20M 11.932s continuous video, all358 frames decoded, confirms one launch, dark display, Lenovo/Android splash, same P20M menu and first read-only reader matching separate photo. ENTRY/NOW VALID next=size0x2c45f, logical/raw13/13, fresh ID1/ARM8DD10BB5; new reader ID2/query0/armed0. Six slots L1/R1; all nine record CRCs independently match. Terminal9BD55B1B actual SCTLR0x3454593d/M1 at0xfffffff0073f5c04. Original arm_vm_init entry, early allocation, segment/page-size preparation and arm_vm_prot_init return reached. Header grows512 bytes after ARM; records retained over one observed reboot. Terminal deliberately requests SYSTEM_RESET, reset source independently unresolved. No full arm_vm_init return or new TCR/TTBR activation, complete new-table mapping, advancing counter, timer IRQ, GIC, scheduling, storage or userspace qualification. Candidate mapping gaps remain a host-model finding, not a measured device table dump. No device command during media review.", "P20M built/host verified and unflashed: 27 actual-kernel, 5 VM dependency and 31 linked-reader cases plus final image/HMAC/source/nonpayload/SEC audit. Original arm_vm_init entry, early_random/table allocation, segment/page-size processing and arm_vm_prot_init return execute; original BL/LR/error branches preserved. Stop0xfffffff0073f5c04 before TCR/TTBR replacement. Full Mach-O segments, loader-owned tail and AT/PAR walks modeled; 219 initial high data pages checked. New candidate roots lack retained-console and complete probe/stack mappings at this early stop; later activation gated. No device write or full VM/IRQ/scheduler claim; P19 remains latest hardware milestone.", "P19M 11.365s continuous video/341 decoded frames confirms one launch, splash reboot, same menu and first read-only reader. ENTRY/NOW VALID next=size0x2cef8 logical/raw13/13, fresh ID1/ARM17BBA853; new reader ID2/query0/armed0. All six slots L1/R1, terminal71ECEFD3 actual SCTLR0x3454593d/M1 at0xfffffff0079e1b34. All nine record CRCs independently match; header grows512 bytes after ARM. Original debug/startup, timer_call_init, cpu_init and processor_bootstrap returns reached; records retained over one observed reboot. Terminal intentionally requests SYSTEM_RESET; reset source independently unresolved. No arm_vm_init, advancing-counter, timer IRQ, GIC, scheduling, storage or userspace qualification. Host849 callbacks/27 functions are not measured device counts. No device operation during result review.", "P19M built and host verified: 57 actual-kernel, six dependency and 31 linked-reader modeled cases; final image/source/HMAC/nonpayload/SEC checks pass. Original debug/startup (849 callbacks, 27 functions), timer_call_init, cpu_init and processor_bootstrap execute in host model; BL/LR and original error branches preserved. 191 high virtual data-page mappings checked against original tables. MIDR/cache/debug/DAIF/counter and MMU/SMC/UEFI are synthetic models, no device claim. Intentional SCTLR/M1 stop at0xfffffff0079e1b34 then SYSTEM_RESET request, before later arm_init/arm_vm_init. Uncommitted P19 additions on recorded base with exact hashes; no flash. P18 remains latest hardware baseline; no native provider/timer IRQ/scheduler/storage/userspace result.", "P18M 14.277s continuous video/428 frames confirms single launch, splash reboot, same menu and first read-only reader. ENTRY/NOW VALID next=size0x380 logical/raw14/14, ID1/phase12; new reader ID2/query0/armed0. ARM209C5114, ENTRY664EEDB4 value209C511400C00808, six L1/R1 slots25EB17EA/A656094C/BD767B76/96C1194C/8B369F02/C778294C bind tag50313853 and ARM; terminal912996CC actual SCTLR0x3454593d/M1. All9 CRCs independently match; records retained over one observed reboot. Original boot CPU publish/max-CPU check, thread setter, cpu_bootstrap RET stub and rtclock_early_init return reached. Intentional stop0xfffffff0079e1b18 precedes debug/timer_call/cpu_init/processor_bootstrap and requests SYSTEM_RESET; reset source unresolved. No timer IRQ/full cpu_init/scheduler qualification. No new device operations during review.", "P18 preparation photo shows NOW VALID next=size0x180 logical/raw6/6, ID1/query1/armed1 ARM CRC209C5114, EL1, PSCI1.1 and SYSTEM_RESET FEATURES0; ARM + six invalid templates OK. ARM phase9 CRC independently reconstructs using P18 cookie and prior0x140/0x140. Frozen initial ENTRY and zero rows unchanged. Bound fresh ARM saved for one recorded P18M launch; complete header0x380/14 records is derived, not observed. No P18 kernel or retention result yet.", "P18 new-session photo confirms frozen initial ENTRY unchanged, NOW VALID next=size0x40, logical/raw1/1, ID1/query0/armed0 at EL1 and status New session OK. INIT CRC5A2B8DA8 independently reconstructs from old next0x23dc2/size0x3fff4 and new prior0/0. Full-ring logical reset and INIT readback observed; no Query/ARM, P18 kernel attempt or retention result.", "P18 initial photo confirms r1 reader at EL1, ENTRY/NOW VALID next0x23dc2 size0x3fff4 consoleCRCFFA3E073; P18 logical/raw counts0, frozen checkpointID0, all rows zero, THIS RUN ID1/query0/armed0. Saturated circular console requires explicit double-confirmed new linear session before Query/ARM. No P18 kernel attempt or terminal/retention result. Parent menu not pictured; boot_b flash identity and private image/media hashes retained.", "CI review: native source build step succeeded at e104fe3b; encrypted transfer rejects six outputs against old four-output allowlist. Profile-specific seal/open validation and synthetic regression checks added; remote repair run pending, no device operation.", "V16 device evidence confirms ExitBootServices and XNU early-entry probes on boot_b; the result is preserved in docs/V16_SOURCE_ENTRY_RESULT.md.", "Source-build diagnostics record both device-local compatibility patches and keep patch preparation idempotent across repeated macOS runner attempts.", "V21 video and extracted kernel establish the pre-MMU checkpoint and a later restart; its default post-MMU timer hook is absent. V22A/1s and V22B/3s install independently audited post-MMU reset probes. They omit the panic renderer because the verified padding cannot fit both. Hardware timing remains unverified.", "V23 provides terminal single-core PSCI/counter/direct-MMU screen records and an early exception handler. Sixteen mocked logic cases and renderer checks passed. P video confirms only the common prefix and title, followed by restart; first-line DSB/return, register reads and A0 execution require finer records. Screen records require video and are not retained RAM logs.", "V23P2 narrows the last visible progress to title stores and RAW checkpoint 2, followed by DSB SY at 0xfffffff0073fca54; checkpoint 3 is not observed. The earlier BCM MMIO store is a candidate access, not a confirmed cause. Isolate barrier behavior and that store separately.", "P3 isolates legacy MMIO and title barrier behavior independently. A retains all DSBs; B uses a title-only DMB dispatcher without changing registers, NZCV or LR. Only menus identify A/B; hardware trials are pending.", "V23P3A was flashed only to boot_b via fastbootd, B activated and reboot command succeeded. Video, menu identity, prefix progress and PSCI results are pending; P3B remains unflashed.", "V23P3B was flashed only to boot_b via fastbootd, B activated and reboot command succeeded. User report for P3A was brief screen then reboot; no checkpoint or PSCI result established. P3B video is pending.", "V23P4 r1 host simulation executes the actual kernel legacy branch, original store and return, then explicitly reenters pre for a complete clear/filter. It verifies stale after-marker removal and preserved registers. Intervening privileged instructions and real MMIO ordering are excluded; device result pending.", "V23P4 r1 was flashed only to boot_b through fastbootd; B activation, current-slot b and slot-unbootable:b=no were verified; reboot command succeeded. Menu identity, marker visibility, PSCI and reset observations await video. Retry-count variable is unsupported.", "V23P4 r1 video confirms both early MMIO markers and title mode 5 with prefix squares 1/2; square 3 and EL/SCTLR are not observed. Original STR was passed, but external transaction completion is unproven. Diagnostic display disappears about 15.9s after entry, then Lenovo/Android splash and r1 menu return; PMIC 0x02000001 -> 0x02000041, reset cause unknown. Next-build source preference: UniXNU menu scale changed from 4 to 3 after r1 video; not compiled or flashed. Kernel diagnostic font unchanged. Original r1 library sources were privately snapshotted and match its remote-build hashes; the next build must explicitly audit the changed menu module.", "V23P5A/B matched controls passed host image, source/HMAC, pair-delta and emulator checks. A kernel equals P4 r1; B differs only in relocated STR-to-NOP and HMAC. Both use compiled menu scale 3, identical non-payload modules, markers and title DSB. No P5 hardware trial or device write. Test A then B on boot_b. See docs/V23P5_MATCHED_MMIO_CONTROL.md.", "V23P5A was flashed only to boot_b in fastbootd; B activation, current-slot b and slot-unbootable:b=no were verified; reboot command succeeded. A menu identity, marker progression and reset observations await video. P5B remains unflashed. No PSCI or MMU-on result is claimed.", "V23P5A video confirms the compact A menu, title mode 5, prefix squares 1/2 and both early MMIO markers, reproducing P4 r1 visible progress. No square 3, EL/SCTLR or PSCI evidence. Display disappears about 17.47s after entry, followed by Lenovo/Android splash and return to A menu; PMIC 0x02000001 -> 0x02000041. Reset cause and external MMIO completion remain unknown. P5B is the next boot_b control and remains unflashed.", "V23P5B was flashed only to boot_b in fastbootd; B activation, current-slot b and slot-unbootable:b=no were verified; reboot command succeeded. Its menu identity and diagnostic progress await video. Reviewed P5A remains the visible control; no P5B functional, PSCI or MMU-on result is claimed.", "V23P5B video confirms the compact B menu, both lower envelope markers and partial title in frame 56; the diagnostic is captured in only one camera frame. Top prefix 1 completion, prefix 2/3, EL/SCTLR and A0/pre-SMC are not established. Entry band to display loss is about 0.067s (camera observation), followed by Lenovo/Android splash and return to B menu; PMIC 0x02000001 -> 0x02000041. Rapid intentional PSCI reset is a hypothesis, not a verified result. Next proposed control retains P5B and replaces only its SMC with an in-place branch, preserving the preceding DSB; not yet built. This checkpoint supersedes earlier pending/unflashed notes; no new device operations or push occurred during video review.", "Reviewed upstream logging/automatic-test guide at 16e592abee8a550dec8154ed1f38b5ebc4f16213 and same-SoC umi at 3eb72578597d2ca16471b172d45eddc096a34a04. Prioritize board-qualified retained RAM trace plus separate firmware QR logging. Existing J716F Recovery DT/dmesg show overlapping boot_log 0xb0000000+0x80000 and pstore 0xb0000000+0x100000; console file length 262132 does not establish its physical subrange. Do not copy umi 4MiB/2MiB layout or sheng disk/reset constants. Verify layout/format and minimal reset retention before attaching XNU records. Full unattended logging requires a validated reader and return-to-fastboot cycle. Read-only source/evidence review only; no new device test or logging implementation.", "V23P6 RAMLOG r1 is host-verified and unflashed: read-only TWRP live parameters plus matching-build Recovery allocator emulation locate console at 0xb00be000+0x40000 (12-byte DBGC, ECC=0). iomem difference is reserved System RAM vmap versus non-RAM request_mem_region. Independent app validates live header before manual single-marker append; default read-only, no automatic start/reset, manual EFI warm request, no XNU. Actual SEC/four DXE nonpayload deltas are only the reservation-size byte; other modules/APRIORI unchanged. Retention and live header remain unverified. See docs/V23P6_RAMLOG_RETENTION.md.", "V23P6 RAMLOG r1 (uncommitted additions on the recorded repository base; exact source/image hashes are in the P6 manifest) was flashed only to boot_b through fastbootd with the audited image; B activation, current-slot b and slot-unbootable:b=no were verified, and reboot command succeeded. First live header, marker append, warm-reset retention and Recovery readback await device observation. No other partition write or repository push occurred.", "V23P6 first video/photo confirms the correct menu and read-only app: console DBGC 0x43474244, next=size=0x37bd9, capacity=0x3fff4, VALID, marker counts 0 and no append. The inferred console header is now device-readable and consistent, with 33819 bytes of unused capacity. No append, restart retention, Recovery readback or XNU progress is established. See research/v23p6-first-header.json.", "V23P6 second video verifies manual RAM marker append and same-run readback: next=size 0x37bd9 -> 0x37c09 (+48 bytes), now=1, appended_this_run=1, APPEND READBACK OK. At about 15s the app reports Warm reset returned; no actual reboot is observed. At about 28s the app exits to parent EFI return diagnosis with Success/code 0, which is normal app return and not reset success. Cross-reset retention and Recovery readback remain unverified. Root cause of the returned firmware reset call is unknown. First-header transcription corrected to 0x37bd9 (33819 free bytes). See research/v23p6-append-reset-return.json.", "V23P7 RESET r1 is host verified and unflashed. Only the P6 embedded FAT config/app changes; all non-payload inner-FV module sections and compact SEC executable match P6 exactly. Actual P6 reset driver uses SMC, queries RESET2 then falls back to SYSTEM_RESET; unused stack inputs are a host finding, not the proven failure cause. P7 defaults to read-only inventory; manual PSCI queries/firmware Warm/direct reset actions log PRE/RETURN to the validated console. Five wrapper cases, two linked record/gate cases and image/source audits passed with mocked SMC responses. First hardware trial must only photograph inventory and Query PSCI results on boot_b; no reset, retention or XNU result yet.", "V23P7 RESET r1 (uncommitted source additions on the recorded repository base; exact source/image hashes in the P7 manifest) was flashed only to boot_b through fastbootd. B activation, current-slot b and slot-unbootable:b=no were verified; reboot command succeeded. Inventory/PSCI-query observations await video. No reset trial, retention result or new XNU checkpoint is established.", "V23P7 photos verify EL1, installed reset driver GUID/RVA/prefix match, PSCI_VERSION=0x00010001 (1.1) and FEATURES=0 for SYSTEM_RESET and RESET2 A64. Valid console next=size grows 0x2923f -> 0x2958a (+843 bytes); P7 entry=0/now=6 and Queries complete=1. Query returns and app-displayed same-run records are established. No actual P7 reset, retention, Recovery readback or new XNU checkpoint. Next manual trial uses Direct RESET2 only; preserve initial post-reboot inventory or returned x0..x3. Uninitialized old-driver inputs remain an unproven cause.", "V23P7 RESET2 video/photo confirms two direct 0xc4000012 type=0/cookie=0 calls return x0=0xfffffffffffffffe (INVALID_PARAMS -2), x1..x3=0. FEATURES remains 0; valid console next=size 0x2958a -> 0x296a3 -> 0x297bc and P7 now 6 -> 8 -> 10. No reboot is observed in the 10.50s video; retention and Recovery readback remain untested. Old Warm falls back only on FEATURES failure, not on returned RESET2 error; historical P6 SMC returns remain uncaptured. Next manual test is existing Direct SYSTEM_RESET only. No new device commands, flash or source changes during this media review.", "User reports the first P7 Direct SYSTEM_RESET rebooted, then selecting it after reentering the app did not reboot. No new SYSTEM_RESET photo/video or post-reset ring counts yet. Fresh app load clears mQueried; without rerunning Query, the action is blocked before SMC. Second-attempt gate status versus actual returned SMC is unresolved. Preserve full page/entry/now before new queries. One reboot is user-reported; repeatability and RAM retention remain unverified.", "User clarified the second no-reboot selection displayed blocked; rerunning Query then Direct SYSTEM_RESET rebooted again. Two successful SYSTEM_RESET invocations are user-reported; no SYSTEM_RESET error return was reported. User then forced power off and entered ZUI13 before post-reset inventory capture. Earlier reset retention remains unknown; later marker state cannot isolate that path. Repeat a controlled P7 boot_b cycle from a photographed baseline, without forced shutdown or ZUI detour. No new flash/source/device commands performed.", "Controlled P7 retention cycle relaunched: fastboot initially reported current-slot a and slot-unbootable:b=yes. set_active b succeeded; current-slot b and slot-unbootable:b=no verified; reboot command succeeded. No partition image was flashed. Prior P7 flash/image hash supplies expected identity, not a new partition readback. Await menu identity, baseline and post-SYSTEM_RESET read-only photo; retention remains unverified.", "The later P7 INVALID photo has unknown timing and intervening actions. Read-only Recovery capture confirmed unchanged DTB/config/ramoops layout and mounted but empty pstore; the prior 65-byte console-ramoops-0 capture is missing-file error text. The P7 image-length boot_b prefix matches, with partition tail untested. Retention remains unknown.", "V23P8 is host-verified and unflashed. Frozen ENTRY includes raw header, full-console CRC and separate logical/raw CRC-checked record summaries. Manual invalid-only header initialization preserves payload except appended records; two-step SYSTEM_RESET is gated on same-run BASELINE, PSCI query and unchanged PRE_RESET. No automatic RAM write, SMC or reset; no XNU. Collector rejects failed or unframed remote status; the new decoder requires accepted hash-matching pstore capture evidence.", "V23P8 RETENTION r1 was flashed only to boot_b after exact image-hash and fastbootd identity/unlock/size gates. B activation, current-slot b and slot-unbootable:b=no were verified; reboot command succeeded. Initial ENTRY and actual retention observations remain pending.", "The first P8 photo confirms RETENTION r1, ENTRY/NOW DBGC 0x43474244, next=size=0x3fb3f, ENTRY whole-console CRC32=0x9e93c89c, NOW VALID, zero logical/raw P8 records, run ID=1, baseline=0 and query=0 at EL1. This establishes the initial readable header, not append or reboot retention. Skip initialization; append BASELINE once, run Query PSCI + record (NO RESET), and photograph the full page before reset.", "P8 BASELINE photo confirms readback OK: NOW VALID, next=size=0x3fb7f (+64 bytes), logical/raw count=1, ID=1, phase=2, CRC=0x668a6fef, baseline=1/query=0. Query photo confirms NOW VALID, next=size=0x3fc7f (+256 bytes), logical/raw count=5, ID=1, phase=8, CRC=0xb4d25630, baseline=1/query=1, EL1, PSCI_VERSION=0x10001 (1.1), FEATURES(SYSTEM_RESET)=0 and last-x0=0. Frozen ENTRY remains unchanged. Same-invocation append/readback and query are observed; PRE_RESET and cross-reset retention remain untested.", "P8 PRE_RESET photograph confirms NOW VALID, next=size=0x3fcbf, logical/raw count=6, ID=1, phase=3, record CRC=0xe13f0c63, baseline=1/query=1 and PRE_RESET ready. Frozen ENTRY remains unchanged. First reset press committed the pre-reset record; no reset or retention result is yet observed. Matching post-reboot ENTRY must be captured before any initialization, append or Query.", "P8 controlled SYSTEM_RESET video shows the armed PRE_RESET page, screen loss, Lenovo/Android splash, return to the P8 menu and manual app reentry. At 10.898s (frame 327), frozen ENTRY and NOW retain DBGC 0x43474244, next=size=0x3fcbf, six logical and six raw CRC-valid records, latest ID=1/phase=3/CRC=0xe13f0c63, exactly matching the pre-reset photo. NOW remains VALID. New invocation ID=2 with baseline=0/query=0 and read-only status confirms capture before new app writes/query. One observed immediate UEFI-to-UEFI reset cycle preserves the header and matching PRE_RESET record. This does not establish all payload bytes, power-off/ZUI/Recovery retention, repeated reliability, or XNU/MMU checkpoint progress.", "V23P9E/M host-verified kernel trace candidates are prepared. E logs the first kernel entry then direct SYSTEM_RESET; M logs entry, pre-MMU and post-MSR/ISB before terminal reset. A manual UEFI Query/ARM cookie and expected prior CRC/phase bind each kernel append to its session. Exactly the audited console is mapped as 64 NC pages after strict TCR/MAIR/TTBR/spare-page guards. Pre/post preserve integer registers, SP and NZCV; pre handles the already-virtual SP with M=0. Original BCM store and vectors remain unchanged. 23 actual-assembly logic cases and 12 linked-reader cases pass with mocked system registers/SMC/UEFI; E/M nonpayload FV sections and compact SEC match P8; crypto HMACs match. No P9 device write or MMU progress yet. Test E before M.", "V23P9E was flashed only to boot_b after exact image-hash and fastbootd identity/unlock/size gates. B activation, current-slot b and slot-unbootable:b=no were verified; reboot command succeeded. Await the initial read-only reader ENTRY photo before Query/ARM. No kernel entry/reset-retention observation or MMU progress yet. V23P9M remains unflashed and gated on observed E entry-record retention.", "First P9 reader photo confirms KERNEL TRACE r1, ENTRY/NOW DBGC 0x43474244, next=size=0x2b0e4, ENTRY whole-console CRC32=0x51d98b35 and NOW VALID. Logical count=0; raw count=6 with old P8 ID=1/phase=3/CRC=0xe13f0c63. All six P9 checkpoint rows have logical/raw hits=0; invocation ID=2, query=0/armed=0 at EL1 and read-only status. Old P8 payload bytes remain outside current logical extent after the intervening fastboot path; this is not a controlled P9 kernel-retention result or evidence locating a header change. Next Query then ARM once, photograph this-run ID/CRC before kernel launch.", "P9E Query/ARM photos confirm NOW VALID throughout. Query: next=size=0x2b1e4, logical/raw counts=4/10, ID=2, query=1/armed=0, last CRC=0x3ef428f0, EL1, PSCI_VERSION=0x00010001 and SYSTEM_RESET FEATURES=0. ARM: next=size=0x2b224, logical/raw counts=5/11, ID=2, query=1/armed=1, last CRC=0x47ccacb5 and ARM readback OK. Frozen ENTRY and checkpoint rows remain unchanged from reader entry; no kernel launch or reset is observed in these photos.", "P9E controlled entry trial is device-observed. Video starts with armed ID=2/CRC=47CCACB5, shows the E entry-only kernel selected, then screen loss, Lenovo/Android splash and return to the P9E menu. The separate photo, identified by the user as first reader reentry after that reboot, shows frozen ENTRY and NOW VALID: DBGC=0x43474244, next=size=0x2b264, whole-console CRC=0x8b79118f, logical/raw counts=6/12, latest ID=2/phase=10/CRC=0xf17e59fc. ARM has one logical and one raw hit with matching prior CRC=0x47ccacb5; KERNEL_ENTRY has one of each with CRC=0xf17e59fc and SCTLR_EL1=0xc00808 (M=0). Reconstructing phase-10 record bytes from ID/value/prior header reproduces the photographed CRC. New reader invocation ID=3/query=0/armed=0 and read-only status confirm capture before new Query/ARM. PRE_MMU, POST_MMU, MAP_FAILURE and RESET_RETURN have zero hits, expected for E. The valid header and same-session entry record survived one observed reboot; actual reset-source attribution, M execution and sustained MMU-on remain unverified.", "V23P9M was flashed only to boot_b after exact image SHA256 and fastbootd product/unlock/slot-count/partition-size gates. B activation, current-slot b and slot-unbootable:b=no were verified; reboot command succeeded. Launch targets the untimed menu only; recording readiness for the manual kernel trial was not newly confirmed. Initial M menu identity, reader ENTRY, Query/ARM and kernel/MMU checkpoints await device observations. The observed P9E entry-record retention prerequisite remains preserved.", "Initial reader photo after the P9M fastboot launch confirms common J716F V23P9 KERNEL TRACE r1 reader, frozen ENTRY/NOW DBGC=0x43474244, next=size=0x2bf58, ENTRY whole-console CRC=0xbdb07c93 and NOW VALID. Logical count=0; raw count=6 with old P8 ID=1/phase=3/CRC=0xe13f0c63; all six frozen P9 checkpoint rows have zero logical/raw hits. THIS RUN ID=2/query=0/armed=0 at EL1, read-only status. The earlier E ARM/ENTRY chain is not present in this snapshot after the intervening fastboot path; the cause or timing of those changes is not isolated, and this does not alter the separately observed E controlled-reboot result. No M kernel launch or MMU progress is observed.", "P9M Query/ARM video and photo show a successful same-invocation preparation, with frozen ENTRY unchanged. At video frame 90, Query OK: NOW VALID next=size=0x2c058, logical/raw counts=4/10, ID=2, query=1/armed=0, CRC=0xbbfaa9d1, EL1, PSCI_VERSION=0x00010001 and SYSTEM_RESET FEATURES=0. ARM photo: NOW VALID next=size=0x2c098, logical/raw counts=5/11, ID=2, query=1/armed=1, CRC=0xc2c22d94 and ARM readback OK. The phase-8/phase-9 CRCs reconstructed from the displayed session/value/prior headers match. All frozen P9 rows remain zero because they describe the earlier reader-entry snapshot. The approximately 11.065-second video ends on the armed reader; it does not show M kernel launch or reset. Match this M attempt by both ID=2 and ARM CRC=C2C22D94, distinct from E ID=2/CRC=47CCACB5.", "P9M launch photo confirms menu identity J716F V23P9M KERNEL TRACE r1 and the M entry/pre-MMU/post-MMU kernel item, with stage DARWIN BOOT, a green top band, and visible DARWINBOOT text: inputs validated; exiting boot services. It is a launch/handoff display, not a reader checkpoint. User subsequently reports an automatic reboot. No video of this launch/reboot or post-reboot reader snapshot has been supplied yet; entry/PRE/POST/MAP_FAILURE record state and actual reset source remain unknown. Do not infer MMU progress or a specific stopping PC from the still image or reboot alone.", "User clarifies that after the first user-reported automatic M reboot, the M kernel was launched a second time directly, without a fresh Query/ARM or a supplied first post-reboot reader capture. User reports this second launch remains stopped; the supplied photo shows DARWINBOOT inputs validated; exiting boot services. Source stage1 requires an immediately preceding valid phase-9 ARM cookie, and branches to the WFE halt if append validation fails. If the first launch consumed ARM by appending ENTRY or later records, the unarmed second launch would be rejected; this is a source-supported explanation, not a confirmed device stopping PC. Neither first-run MMU progress nor second-run rejection is established without retained reader records. The second launch must not be treated as a freshly armed M trial.", "M recovery reader photo shows frozen ENTRY and NOW VALID: DBGC=0x43474244, next=size=0x2c0d8, whole-console CRC=0xc0749332, logical/raw counts=6/12, latest ID=2/phase=10/CRC=0xdc7aa441. Frozen ARM has one logical and one raw hit, CRC=0xc2c22d94 and cookie=0x50394b45524e454c, exactly matching the M prelaunch baseline. KERNEL_ENTRY has one logical and one raw hit, CRC=0xdc7aa441, SCTLR_EL1=0xc00808 (M=0); reconstructing the record with prior header 0x2c098 reproduces that CRC. PRE_MMU, POST_MMU, MAP_FAILURE and RESET_RETURN all have zero hits. New reader invocation ID=3/query=0/armed=0 with read-only status confirms no new Query/ARM in the snapshot. This recovery capture follows the user-reported first automatic reboot, an unarmed second launch that stalled, and the requested hardware recovery; it is not the missing immediate first-reboot capture, and recovery method/timing is not independently captured. It establishes a surviving M-session entry record and consumed ARM, with no retained later checkpoints. Source requires ARM immediately before entry: the now-visible consumed chain supports second-launch gate rejection, but does not prove the exact PC of that launch. The missing PRE record spans original firstcpu code, pre-hook stack handling, mapping checks/setup/barriers and PRE append; it does not isolate an SCTLR/MMU failure or a reset source.", "Fresh M session ID=3 photo sequence supplies ARM preparation, M handoff display and a new read-only reader invocation. ARM photo: NOW VALID next=size=0x2c218, logical/raw counts=11/17, ID=3/query=1/armed=1, CRC=0x671d1670, PSCI_VERSION=0x00010001, FEATURES=0. Frozen rows still describe prior ID=2, as designed. M launch photo identifies entry/pre-MMU/post-MMU terminal SYSTEM_RESET and shows the DarwinBoot handoff prompt. Subsequent reader photo: ENTRY/NOW VALID next=size=0x2c258, whole-console CRC=0x8b348f61, logical/raw counts=12/18, latest ID=3/phase=10/CRC=0xd1afe339. Frozen ID=3 ARM and KERNEL_ENTRY each have one logical/raw hit; ARM CRC=0x671d1670 matches prelaunch, ENTRY CRC=0xd1afe339 and SCTLR_EL1=0xc00808 (M=0). Both displayed CRCs reconstruct from the record format and prior headers. PRE_MMU, POST_MMU, MAP_FAILURE and RESET_RETURN again have no hits. New invocation ID=4/query=0/armed=0 confirms a fresh read-only snapshot. Photos were supplied in response to the requested single-launch/immediate-reader sequence; they independently establish the fresh chain and ENTRY-only repeat, while continuous reboot timing, reset source and absence of all intervening operations are not video-verified. Further identical M retries are not required before adding finer probes. Missing PRE spans original firstcpu, pre stack conversion, map_console and PRE append, not a demonstrated MMU-enable failure.", "V23P10A/B/C are built and host verified, without device writes. Terminal sites are before BCM STR, after STR before ISB, and before original SCTLR. Entry and terminal phase11 use the unchanged P9 CRC writer; phase11 means prefix stop, not P9M mapping success. Eighteen actual full-prefix kernel cases and thirteen linked-reader cases passed with explicit system-register/barrier/MMIO/SMC/UEFI mocks and synthetic boot args. Exact images, sources, probe and reader hashes are in research/v23p10-prefix-controls.json. Actual packed FAT/menu/kernel/HMAC audited; nonpayload FV modules and compact SEC match P9/P8, and reader EFI is byte-identical to P9. No new hardware MMU or retained terminal record is established.", "V23P10A was flashed only to boot_b after exact image SHA256, fastbootd product/unlock/slot-count/partition-size gates. Image SHA256=6637e8055846c79d64f09a8115d311cc92c4ac8ba91977ec9dd81f4ef9c98e0b. B activation, current-slot b and slot-unbootable:b=no were verified; reboot command succeeded. User confirmed fastboot and recording readiness. Only the untimed menu was launched; no manual Query/ARM, kernel execution, terminal record or reset retention is observed yet. B/C remain unflashed.", "P10A initial reader photo shows common J716F V23P9 KERNEL TRACE r1 reader; parent-menu variant is not visible and expected A identity is tied to the recorded flash. Frozen ENTRY/NOW VALID: DBGC=0x43474244, next=size=0x2e137, whole-console CRC=0x5104221a. Logical/raw record counts are both zero; latest ID/phase/CRC and all six frozen checkpoint rows are zero. THIS RUN ID=1/query=0/armed=0/CRC=0 at EL1, read-only status; PSCI/features zeros are unqueried defaults. This is a valid starting baseline after the fastboot path, not a controlled retention result or proof of P10 kernel execution. Fresh Query/ARM and kernel launch remain pending.", "P10A ARM photo confirms NOW VALID next=size=0x2e277 (+0x140 from baseline), logical/raw counts=5/5, THIS RUN ID=1/query=1/armed=1, CRC=0xde027ae6, EL1, PSCI_VERSION=0x00010001 and SYSTEM_RESET FEATURES=0. ARM readback OK is visible. Frozen ENTRY remains next=size=0x2e137/CRC=0x5104221a and all frozen checkpoint rows are zero, as expected before these writes. Reconstructing phase9 with ID1/cookie=0x50394b45524e454c/prior next=size=0x2e237 reproduces CRC DE027AE6. No kernel launch or reset is observed in this photo; use ID and CRC together to identify this A attempt.", "P10A continuous video confirms A menu/kernel identity, green handoff band, screen loss, Lenovo/Android splash, return to A menu and read-only reader reentry. At frame240 (~7.999s), frozen ENTRY/NOW VALID next=size=0x2e2f7, whole-console CRC=0x4e5c6046, logical/raw counts=7/7, latest ID1/phase11/CRC=D8F17B33. ARM/ENTRY/PRE_MMU each have logical/raw hits 1/1: ARM DE027AE6 matches prelaunch photo, ENTRY F3461909 and terminal phase11 D8F17B33 both have SCTLR=0xc00808 (M=0). Reconstructed record CRCs match all three. POST/MAP_FAILURE/RESET_RETURN have no hits; new reader ID2/query0/armed0 and read-only status preserve the first snapshot. PMIC changes 0x02000001 to 0x02000041 without independent reset-source attribution. In A phase11 is the terminal prefix stop BEFORE BCM STR; it proves this prefix/physical-stack/logger path and one observed reset retention cycle. A does not execute BCM STR, map_console or MMU enable. Advance to already-built B with a fresh Query/ARM; B/C remain unflashed.", "V23P10B was flashed only to boot_b after exact image SHA256, fastbootd product/unlock/slot-count/partition-size gates and the observed A terminal-record prerequisite. B image SHA256=e77d5b67e8b6a044ef1ca1df10e143f07bc78e060ad371214c5634bd9f690cb4. B activation, current-slot b and slot-unbootable:b=no were verified; reboot command succeeded. User confirmed fastboot and recording readiness. Only the untimed menu was launched; B menu identity, initial reader, fresh Query/ARM and kernel/BCM terminal result await observation. A retained phase11 result remains preserved; C remains unflashed.", "P10B initial reader photo shows common P9 reader, expected B identity tied to recorded flash (parent menu not visible). ENTRY/NOW VALID next=size=0x27fe9, whole-console CRC=0x2394a7e1, logical count0/raw count7. Frozen checkpoint ID1 ARM/ENTRY/PRE_MMU have L0/R1 with raw CRCs DE027AE6/F3461909/D8F17B33 matching historical A; later rows are zero. THIS RUN ID2/query0/armed0/CRC0 at EL1 and read-only status; PSCI/features zeros are unqueried defaults. A bytes are raw-only outside current logical extent, not B progress. Header changes across intervening fastboot/boot are not isolated to a cause; A immediate observed retention remains independently established. Next fresh B Query/ARM; no B kernel launch or retained terminal result yet.", "P10B Query and ARM photos confirm fresh reader session ID2. Query: NOW VALID next=size=0x280e9, logical/raw=4/11, query1/armed0, CRC=DCAE06F5, PSCI1.1/FEATURES0 and Query OK. ARM: NOW VALID next=size=0x28129, logical/raw=5/12, query1/armed1, CRC=A59682B0 and ARM readback OK. Both phase8/phase9 CRCs reconstruct exactly from ID2/value/prior headers. Frozen ENTRY remains 0x27fe9/CRC2394A7E1 and frozen rows still describe old raw A ID1, as designed. No B kernel launch or reset is shown. Match the coming B attempt using both ID2 and ARM A59682B0, distinct from historical A.", "P10B 22.648s video starts on NOW VALID armed ID2/CRC A59682B0, then reader returns through EFI diagnosis START IMAGE/Success/code0 before B kernel selection. B menu and STOP after BCM STR before ISB identity are confirmed. Green handoff band and DarwinBoot inputs validated; exiting boot services remain visible through final frame678 (~22.615s). User reports a later automatic reboot into UniXNU, but supplied clip ends before that later cycle and has no post-reboot reader. Earlier EFI Success is reader return, not B terminal reset evidence. B intentionally resets after successful phase11 append, so reboot alone neither proves nor disproves terminal/BCM progress. Need first read-only post-reboot reader matching B ID2/ARM A59682B0; C stays gated.", "B post-reported-reboot reader photo matches fresh ID2 ARM A59682B0 logically/raw. ENTRY/NOW VALID next=size=0x28169, whole-console CRC=F03B33AB; logical6 latest phase10 CRC DCD7DF11, raw14 latest phase11 CRC C49C5711. Frozen ENTRY L1/R1 and PRE_MMU L0/R1 both value SCTLR=0xc00808 (M0); reconstructed ID2 phase10/prior28129 and phase11/prior28169 CRCs exactly match. New reader ID3/query0/armed0 is read-only. This is new B raw terminal data, distinct from old A CRC D8F17B33. The audited path crosses original BCM STR into terminal writer, but phase11 is not published in current logical extent: expected next=size after commit would be 0x281a9. Source order is record byte stores -> DSB SY at 0xfffffff0073fc7d0 -> byte readback -> size/next stores at fc828/fc82c -> DSB SY fc830 -> return -> reset DSB/SMC. Raw bytes plus old header do not isolate exact PC; first DSB, readback, publication/visibility and reset-retention differences remain candidates. Direct SYSTEM_RESET and external BCM transaction completion are unverified. Supplied video does not include later reboot; user reports it. Keep B terminal_record_survived_observed_reset false and C gated; isolate writer publication with an independent terminal-only control.", "V23P11A/B/D built and host verified, unflashed. Terminal phase11 value is P11S stage1..5, not SCTLR or MMU-on. Entry CRC writer and linked reader match P9. 40 kernel, 18 reader and 22 power-app mocked cases passed; actual images/HMAC/sources audited, nonpayload
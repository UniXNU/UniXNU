findings = ["2026-11-01 Added package table in board.toml and standard scripts/package.sh.", "2026-11-01 UniXNU upstream sync to cac8257: updated ArmCpu submodule to 93a5030c5d983d0ef90f0fca93879d6e36ad1ba8 with verified SHA256 202bc278dfe52c2d0a988ec3672a95fbbd169be7f3b323d088b93c8e814f6f8f and 12-hook reverse audit; rebased J716F compatibility patches.", "2026-10-27 原生 IRQ 观测候选：参照固定版 pipa/umi，在隔离 ArmCpu 副本加入 CPU/GIC/timebase 和 IRQ1/2/8 的 enter/rtclock-return/EOI 九快照。原厂/Recovery timer输入独立一致为PPI11/INTID27；保留原始调用/EOI并逐字节反向审计。Linux GCC/Clang各通过10实际writer样本、10解码反例、AArch64 sysreg汇编及隔离安装检查。首次CI因in-tree Module.commit为空在编译前被版本门槛拒绝；已改核对实际Git HEAD并保持字节哈希，修复后9ae5d75的CI40445461837源码编译/实际链接观测数组ABI/加密导出上传全部成功；解码器startup字段扩展另经双编译器主机校验；只用内核静态内存，无持久化writer、预链接、刷写或实机IRQ结论；P22待测不变。", "CI review: native source build step succeeded at e104fe3b; encrypted transfer rejects six outputs against old four-output allowlist. Profile-specific seal/open validation and synthetic regression checks added; remote repair run pending, no device operation.", "The local SM8250 source remains a transition snapshot; a public common scaffold is not yet qualified for this port.", "The macOS source workflow is pinned to UniXNU cac8257 and keeps its J716F compatibility fixes in the device repository.", "The source qualification defconfig disables the profile's MOCKFS fixture because that fixture requires ArmCpu, while this board intentionally keeps ArmCpu disabled.", "The source-output sealing step discovers the migration-qualified report and tree instead of assuming the legacy out/j716f root.", "A public SM8250 common scaffold exists at 6bb9b025704764a662728dce1a30557a35e082d8, but it is not yet qualified or selected for this port; the local transition snapshot remains."]
completion = ["The format 2 identity, source paths, defconfig, and patch order resolve without ambiguous board fields."]
limits = ["The SoC source is local and not yet a reusable fixed public commit; component ABI inputs remain incomplete."]
next_action = ["2026-10-29 NATIVE FAST-V3 device verified on boot_b: 8/8 CRC-valid records (0:start_begin -> 1:boot_pt_map -> 2:arm_init -> 3:vm_entry -> 4:vm_perm_map -> 5:vm_ttbr_sw -> 6:pmap_boot -> 7:vm_done) with zero faults after fixing T1SZ=26 L1 root mask and pre-TTBR1_EL1 _phystokv. Next test host-audited FAST-V4 (8ac33597) on boot_b to observe post-vm_done _arm_init tail, _kernel_debug_string_early, _kernel_bootstrap, _PE_init_iokit and panic traps. See research/native-fast-vm-done-20261029.json and research/native-fast-v4-build-20261029.json."]


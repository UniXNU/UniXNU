1, PSCI1.1 and SYSTEM_RESET FEATURES0; ARM + six invalid templates OK. ARM phase9 CRC independently reconstructs using P18 cookie and prior0x140/0x140. Frozen initial ENTRY and zero rows unchanged. Bound fresh ARM saved for one recorded P18M launch; complete header0x380/14 records is derived, not observed. No P18 kernel or retention result yet.", "P18 new-session photo confirms frozen initial ENTRY unchanged, NOW VALID next=size0x40, logical/raw1/1, ID1/query0/armed0 at EL1 and status New session OK. INIT CRC5A2B8DA8 independently reconstructs from old next0x23dc2/size0x3fff4 and new prior0/0. Full-ring logical reset and INIT readback observed; no Query/ARM, P18 kernel attempt or retention result.", "P18 initial photo confirms r1 reader at EL1, ENTRY/NOW VALID next0x23dc2 size0x3fff4 consoleCRCFFA3E073; P18 logical/raw counts0, frozen checkpointID0, all rows zero, THIS RUN ID1/query0/armed0. Saturated circular console requires explicit double-confirmed new linear session before Query/ARM. No P18 kernel attempt or terminal/retention result. Parent menu not pictured; boot_b flash identity and private image/media hashes retained.", "The V14 256 MiB physical window passed seven checks, including two complete write/read rounds with cache maintenance and release; this does not validate full DRAM ownership.", "V21 host audit confirms the same embedded FAT payload and module GUID set as V20; this does not add a new RAM qualification result.", "V22 retains the actual V21 ADT, memory map and 256 MiB request. Its host image audits add no new device RAM qualification.", "V23M checks exact TCR/MAIR/TTBR layout and a zero unreferenced spare page inside the kernel-owned 64KiB bootstrap reserve before mapping the existing display reservation. It changes no firmware ownership; real MMU translation is untested.", "V23P2 adds only bounded stores within the existing validated framebuffer reservation; no table, RAM ownership or MMU mapping change is introduced.", "P3B uses 20 previously zero bytes inside the existing guarded kernel code cave. It introduces no new firmware allocation, ownership or framebuffer mapping change; real MMIO/barrier behavior is untested.", "V23P4 r1 uses the existing guarded cave (2108 of 2800 bytes) and fixed framebuffer reservation; no mapping or MMU configuration changes. Exact P2 rollback includes restoring the original clear STP.", "V23P4 r1 video confirms both early MMIO markers and title mode 5 with prefix squares 1/2; square 3 and EL/SCTLR are not observed. Original STR was passed, but external transaction completion is unproven. Diagnostic display disappears about 15.9s after entry, then Lenovo/Android splash and r1 menu return; PMIC 0x02000001 -> 0x02000041, reset cause unknown.", "V23P5A/B matched controls passed host image, source/HMAC, pair-delta and emulator checks. A kernel equals P4 r1; B differs only in relocated STR-to-NOP and HMAC. Both use compiled menu scale 3, identical non-payload modules, markers and title DSB. No P5 hardware trial or device write. Test A then B on boot_b. See docs/V23P5_MATCHED_MMIO_CONTROL.md.", "Reviewed upstream logging/automatic-test guide at 16e592abee8a550dec8154ed1f38b5ebc4f16213 and same-SoC umi at 3eb72578597d2ca16471b172d45eddc096a34a04. Prioritize board-qualified retained RAM trace plus separate firmware QR logging. Existing J716F Recovery DT/dmesg show overlapping boot_log 0xb0000000+0x80000 and pstore 0xb0000000+0x100000; console file length 262132 does not establish its physical subrange. Do not copy umi 4MiB/2MiB layout or sheng disk/reset constants. Verify layout/format and minimal reset retention before attaching XNU records. Full unattended logging requires a validated reader and return-to-fastboot cycle. Read-only source/evidence review only; no new device test or logging implementation.", "V23P6 RAMLOG r1 is host-verified and unflashed: read-only TWRP live parameters plus matching-build Recovery allocator emulation locate console at 0xb00be000+0x40000 (12-byte DBGC, ECC=0). iomem difference is reserved System RAM vmap versus non-RAM request_mem_region. Independent app validates live header before manual single-marker append; default read-only, no automatic start/reset, manual EFI warm request, no XNU. Actual SEC/four DXE nonpayload deltas are only the reservation-size byte; other modules/APRIORI unchanged. Retention and live header remain unverified. See docs/V23P6_RAMLOG_RETENTION.md.", "V23P6 RAMLOG r1 (uncommitted additions on the recorded repository base; exact source/image hashes are in the P6 manifest) was flashed only to boot_b through fastbootd with the audited image; B activation, current-slot b and slot-unbootable:b=no were verified, and reboot command succeeded. First live header, marker append, warm-reset retention and Recovery readback await device observation. No other partition write or repository push occurred.", "V23P6 first video/photo confirms the correct menu and read-only app: console DBGC 0x43474244, next=size=0x37bd9, capacity=0x3fff4, VALID, marker counts 0 and no append. The inferred console header is now device-readable and consistent, with 33819 bytes of unused capacity. No append, restart retention, Recovery readback or XNU progress is established. See research/v23p6-first-header.json.", "V23P6 second video verifies manual RAM marker append and same-run readback: next=size 0x37bd9 -> 0x37c09 (+48 bytes), now=1, appended_this_run=1, APPEND READBACK OK. At about 15s the app reports Warm reset returned; no actual reboot is observed. At about 28s the app exits to parent EFI return diagnosis with Success/code 0, which is normal app return and not reset success. Cross-reset retention and Recovery readback remain unverified. Root cause of the returned firmware reset call is unknown. First-header transcription corrected to 0x37bd9 (33819 free bytes). See research/v23p6-append-reset-return.json.", "V23P7 RESET r1 is host verified and unflashed. Only the P6 embedded FAT config/app changes; all non-payload inner-FV module sections and compact SEC executable match P6 exactly. Actual P6 reset driver uses SMC, queries RESET2 then falls back to SYSTEM_RESET; unused stack inputs are a host finding, not the proven failure cause. P7 defaults to read-only inventory; manual PSCI queries/firmware Warm/direct reset actions log PRE/RETURN to the validated console. Five wrapper cases, two linked record/gate cases and image/source audits passed with mocked SMC responses. First hardware trial must only photograph inventory and Query PSCI results on boot_b; no reset, retention or XNU result yet.", "V23P7 RESET r1 (uncommitted source additions on the recorded repository base; exact source/image hashes in the P7 manifest) was flashed only to boot_b through fastbootd. B activation, current-slot b and slot-unbootable:b=no were verified; reboot command succeeded. Inventory/PSCI-query observations await video. No reset trial, retention result or new XNU checkpoint is established.", "V23P7 photos verify EL1, installed reset driver GUID/RVA/prefix match, PSCI_VERSION=0x00010001 (1.1) and FEATURES=0 for SYSTEM_RESET and RESET2 A64. Valid console next=size grows 0x2923f -> 0x2958a (+843 bytes); P7 entry=0/now=6 and Queries complete=1. Query returns and app-displayed same-run records are established. No actual P7 reset, retention, Recovery readback or new XNU checkpoint. Next manual trial uses Direct RESET2 only; preserve initial post-reboot inventory or returned x0..x3. Uninitialized old-driver inputs remain an unproven cause.", "V23P7 RESET2 video/photo confirms two direct 0xc4000012 type=0/cookie=0 calls return x0=0xfffffffffffffffe (INVALID_PARAMS -2), x1..x3=0. FEATURES remains 0; valid console next=size 0x2958a -> 0x296a3 -> 0x297bc and P7 now 6 -> 8 -> 10. No reboot is observed in the 10.50s video; retention and Recovery readback remain untested. Old Warm falls back only on FEATURES failure, not on returned RESET2 error; historical P6 SMC returns remain uncaptured. Next manual test is existing Direct SYSTEM_RESET only. No new device commands, flash or source changes during this media review.", "User clarified the second no-reboot selection displayed blocked; rerunning Query then Direct SYSTEM_RESET rebooted again. Two successful SYSTEM_RESET invocations are user-reported; no SYSTEM_RESET error return was reported. User then forced power off and entered ZUI13 before post-reset inventory capture. Earlier reset retention remains unknown; later marker state cannot isolate that path. Repeat a controlled P7 boot_b cycle from a photographed baseline, without forced shutdown or ZUI detour. No new flash/source/device commands performed.", "Controlled P7 retention cycle relaunched: fastboot initially reported current-slot a and slot-unbootable:b=yes. set_active b succeeded; current-slot b and slot-unbootable:b=no verified; reboot command succeeded. No partition image was flashed. Prior P7 flash/image hash supplies expected identity, not a new partition readback. Await menu identity, baseline and post-SYSTEM_RESET read-only photo; retention remains unverified.", "V23P12A/B built and host verified, unflashed. Six independent pre-staged CRC-bound records use one-byte commits; ENTRY high32 binds ARM CRC and low32 is SCTLR. A skips BCM and B preserves captured original address/value, with exactly one STR/NOP probe delta and identical reader/ADT/nonpayload firmware. 58 actual-assembly and22 linked-reader mocked cases passed; final image/HMAC/source audits passed. Byte-identical P11 power app reuses22 host cases. No P12 hardware/retention/MMU-on result; A first on boot_b only.", "P12 r2 A/B built and host verified, unflashed. New reader requires explicit double confirmation before discarding a VALID saturated/exhausted console logical history; frozen entry remains, payload not bulk-cleared, INIT records old next/size, failure locks Query/ARM. 45 actual-linked reader cases passed including full-session-to-both-unchanged-kernels-to-frozen-reader flow, changed-console cancellation, failure and stale-ID gates. A/B kernel/ADT/probes equal r1 byte for byte; 58 prior assembled cases reused after identity check. Power app equals P11, 22 cases reused. Final FD/FAT/EFI/source/HMAC/nonpayload/boot-image checks passed. No r2 hardware, retention or MMU-on result; A first on boot_b only.", "P12 r2A postreboot photo confirms ENTRY/NOW VALID next=size0x38e69 consoleCRCC067D0A6, logical12/raw12 latest ID1/phase21/04FFEC87. Fresh ARM063FE873 matches prelaunch; ENTRY1210179B value063FE87300C00808(M0). All six stages16..21 are L1/R1 with CRCsE66CD221,AA22646F,B1021655,9AB5746F,8742F221,04FFEC87 and ARM-bound value50313253063FE873; all eight CRCs reconstruct exactly. New reader ID2/query0/armed0, read-only. User explicitly reports automatic reboot/menu return; no continuous video reviewed. A skipped BCM and reached all six commits/publication, with matching records present after reported reboot. Kernel SMC/reset source, original BCM completion, MMU-on and manual session rollover remain unqualified. r2B original-STR control is next."]

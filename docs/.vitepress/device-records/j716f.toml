>02000041; independent reset attribution unknown. No original BCM store, MMU enable, sustained XNU or power-app result. P11B is next; D/P10C remain gated.", "V23P11B was flashed only to boot_b after observed P11A stage5/ARM/CRC/reset-retention prerequisite and exact image SHA256, fastbootd product/unlock/slot-count/partition-size gates. B activation, current-slot b and slot-unbootable:b=no verified; reboot command succeeded. User confirmed fastboot/recording readiness. Untimed menu only; B menu identity, initial reader, fresh Query/ARM and kernel/stage observations pending. Original BCM STR is present in B, but its execution has not yet been observed in this trial. A result preserved, D/P10C gated. B image SHA256=94c97bacfef84deab3bceaacfee5f1f95b20f4e74a57c01f9beb5bbabc64a40c.", "P11B initial reader photo confirms ENTRY/NOW VALID next=size=0x2c55a, console CRCAC4189D6, logical0/raw7. Raw ID1 ARM DE027AE6, ENTRY F3461909 and phase11 D8F17B33/value0xc00808 match historical P10A, not B progress. THIS RUN ID2/query0/armed0/CRC0 at EL1 read-only. Parent B menu identity not visible; expected B follows recorded boot_b flash. Fresh B ARM CRC required because ID2 is reused after the intervening fastboot/boot path; earlier A immediate stage5 retention stays independently established. No B kernel launch or P11S stage observed.", "P11B Query/ARM photos confirm Query NOW VALID next=size0x2c65a logical4/raw11 ID2/query1/armed0 CRC9E81CF4A, then ARM NOW VALID next=size0x2c69a logical5/raw12 ID2/query1/armed1 CRCE7B94B0F. PSCI1.1/FEATURES0 and ARM readback OK. Both phase8 and phase9 CRCs reconstruct exactly using prior0x2c61a/0x2c65a. Frozen ENTRY remains0x2c55a/CRCAC4189D6 with historical P10A raw ID1 rows. This B CRC differs from prior A ID2/58E2DBCF; no B launch or terminal stage observed yet.", "P11B 31.562s video confirms B after-STR/before-ISB menu identity, green handoff/DarwinBoot inputs, screen loss, Lenovo/Android splash, B menu return and read-only reader. Frame946 (~31
configuration = ["board.toml declares the p33 boot size, package defconfig and payload inputs. scripts/package.sh is the fixed release entry point."]
procedure = ["Run scripts/package.sh with the selected OS profile and local inputs, then flash the boot image to p33."]
findings = ["Kernel and payload builds succeed with the packed Data seed. The validation image carries the seed and boot stages."]
completion = ["The release command writes boot.img, payload.img and kernel.macho with a manifest that verifies."]

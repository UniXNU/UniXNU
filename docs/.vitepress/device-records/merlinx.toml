[[area]]
id = "diagnostics"
status = "device-verified"
components = []
paths = ["patches/xnu/offline-owner-cache-*", "scripts/xnu-panic-screen.c", "docs/devices/merlinx.md"]
inputs = ["Panel output, panic screen and the GOP status lines."]
configuration = ["The kernel draws ROOT, VOL, CACHE, EXEC and LAUNCHD through the GOP framebuffer. The panic screen renders kernel panics on the panel."]
procedure = ["Flash a diagnostic image to p33 and read the panel."]
findings = ["The status lines identified the cache and launchd checkpoints without a UART. The Mali diagnostics add MATCH, START, RC, M2W, M2P, PMIC, GIC and staged M2 voltage markers. The launchd exit trace showed IOMFB_FDR_loader exit 1 while SpringBoard did not exit."]
completion = ["Each claimed milestone has a panel checkpoint or a reproducible panic result."]
limits = ["There is no UART and no userland log transport. The current Mali image omits the panic screen because the local UEFI font input was unavailable. Data I/O and userland display remain inferred from panel checkpoints."]
next_action = ["Add pwrap read sub-markers for the VSRAM path and restore the panic screen in the next CI payload build."]
evidence = [
  { kind = "source", reference = "docs/devices/merlinx.md", result = "The device page records the panel checkpoints and their limits." },
  { kind = "device", reference = "https://github.com/Dracen-W/UniXNU-merlinx", command = "fastboot flash boot <merlinx-boot.img>", revision = "237c204655577c1ed1c9536a4bdc890bb2eaf1cc", result = "The panel shows ROOT, VOL, CACHE, EXEC and LAUNCHD." },
]

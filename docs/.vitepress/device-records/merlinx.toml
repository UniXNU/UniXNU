[[area]]
id = "packaging"
status = "implemented"
components = ["DarwinBoot", "XnuPrelink"]
paths = ["scripts/package.sh", "scripts/make-merlinx-adt.py", "scripts/make-data-seed-*.py", "data-seed.json", "board.toml", "patches/**"]

limits = ["Paired compressed-payload boot/vendor_boot reached the user-accepted 24A446 GPU system. Other devices, suspend/resume and long repeated-boot stress are not qualified by this report."]
next_action = ["Use the paired UEFI decompression-capable boot and compressed vendor_boot; preserve raw FAT fallback and runtime overlap checks."]

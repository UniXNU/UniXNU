  { kind = "host", reference = "docs/PROGRESS.md", result = "display-submit diagnostic built, CRC804CD0D45D379053, original missing2/stubbed24 exact sets unchanged, final snapshot uses24A446 fields and actual source dispatch retains IPC/PAC/results; NOT FLASHED per user request.", command = "./unixnu build kernel && ./unixnu build payload; python3 uke-port/fixes/2026-11-03-display-submit/pack.py", revision = "5ed46420025be331b51d98207ea6aa679faac9c7" },
  { kind = "host", reference = "board.toml", result = "schema_version 2 resolves the ipados-27.0.1-24A446 profile with the four-layer patch series; kernel.macho is MH_FILESET/arm64e (95,322,112 B, sha256 99a6b970...)", command = "./unixnu status --json -D ../UniXNU-uke-build && ./unixnu build kernel -D ../UniXNU-uke-build", revision = "a8da9009d43f6c679ebd46903810906afa8ce906" },
  { kind = "source", reference = "configs/uke_ipados27_defconfig", result = "the active 27 track: CONFIG_XNU_BUILD_ARCHIVES=y, CHAINED_FIXUPS=y, native display backend, source storage with the OS root policy, NATIVE_ADRENO off." },
  { kind = "source", reference = "patches/xnu-12377/series", result = "the device's xnu-12377 entries: Darwin 26 posix_spawn attrs, ptrauth null portability, 4K stack shift and the source-storage runtime hook." },

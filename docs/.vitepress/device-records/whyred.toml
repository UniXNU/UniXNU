[[area]]
id = "packaging"
status = "planned"
components = ["XnuPrelink", "DarwinBoot"]
paths = ["scripts/**", "patches/**", "package/**", "proprietary-files.txt"]
inputs = [
  "iPhone X (iPhone10,3) / iOS 16.7.16 / 20H392 IPSW supplied by the OS profile.",
  "Board platform seed through --unique-chip-id or UNIXNU_UNIQUE_CHIP_ID.",
  "Firmware checkout N1709/uefi-whyred through --uefi or UNIXNU_UEFI.",
]
configuration = [
  "[package] unixnu = \"../UniXNU\"; [package.defconfig] maps ios-16.7.16-20H392 to whyred_defconfig.",
  "[payload.adt] chip_id = \"636\", owned_memory_size = 0x40000000, packed_data_ramdisk = true, unique_chip_id = \"required\".",
  "profiles/os/ios-16.7.16-20H392 is vendored here and installed into UniXNU/profiles/os/ because that profile is not in the UniXNU repository.",
]
procedure = [
  "scripts/check-whyred.sh",
  "scripts/package.sh --check --os ios-16.7.16-20H392",
  "scripts/package.sh --os ios-16.7.16-20H392 --uefi ../uefi-whyred",
]
findings = [
  "patches/xnu/arm64-nonapple-kpc-stub.patch declared +1,183 for a 189-line body, so git apply dropped the trailing int kpc_pc_capture and the final link reported that symbol undefined; the header is corrected to +1,189 and every patch is checked by scripts/check-patches.py, whose default root is the repository patches/ directory.",
  "patches/libpthread/ shadows the framework directory and carries explicit-kernel-address.patch plus xnu-8796-no-jit-entitlement.patch: the pinned libpthread is the iOS 17 drop and bsdthread_register calls proc_get_jit_entitled, which xnu-8796 does not have, so the component failed with 1 error generated in run 42922819047.",
  "The template packaging action points at N1709/uefi-whyred; the previous REPLACE/uefi-whyred placeholder is gone.",
  "unixnu.lock pins AvailabilityVersions, IOStorageFamily, corecrypto-2023, edk2, libdispatch, libplatform, libpthread, xnu and whyred-android-dt; component revisions come from components.toml.",
  "The package workflow builds only ios-16.7.16-20H392, passes the full profile name and publishes the artifact as Mu-whyred.",
  "The workflow checks out UniXNU without recursive submodules (the deps step initializes the module submodules), installs the vendored iOS 16 profile, adds unifdef and tcsh to the Homebrew tools and accepts a 1 to 16 digit nonzero UNIXNU_UNIQUE_CHIP_ID seed.",
  "The iOS 16 series vendors six 8796-adapted patches (apple-only-cpu-tunables, external-archive-dependencies, native-aes-personality, offline-owner-systemos-mount, source-machine-layer, zzx-pmap-sync-64bit-pa) and omits three 10063-only ones (pgz-aligned-validation, public-entitlements-header, published-freezer-condition) plus boot progress; all 58 resolve and apply to xnu-8796.141.3.",
  "patches/xnu/new-clang-drop-removed-auto-var-init-flag.patch removes the -enable-trivial-auto-var-init-zero-knowing-it-will-be-removed-from-clang flag from makedefs/MakeInc.def because the LLVM 58c46bae the UniXNU toolchain builds no longer accepts it.",
  "patches/xnu/uio-stackbuf-alignment.patch replaces the uio_stackbuf_t char array with the 10063 UIO_STACKBUF macro and rounds UIO_SIZEOF up to 8 bytes, because newer clang rejects an array whose element size is not a multiple of its alignment.",
  "patches/xnu/iig-kernel-content.patch adds IORPC.kernelContent and fills it in IOUserServer entry paths, because iig DriverKit-440 generates kernel dispatch code that reads that field, which 8796 predates.",
  "patches/xnu/arm64-nonapple-kpc-stub.patch adds the non-Apple arm64 kpc.c stub, because osfmk/conf/files.arm64 lists that file under kpc nos_arm_asm and 8796 predates it; with the group active make stopped at No rule to make target kpc.c. The stub also defines kpc_pc_capture, which kern_kpc.c exports through pc_capture_supported and the Apple PMU would otherwise provide.",
  "patches/xnu/arm64-nonapple-pmap-stub.patch defines pmap_pending_preemption in osfmk/arm/pmap/pmap_misc.c when SCHED_HYGIENE_DEBUG and DEVELOPMENT are on: pmap.h declares it out of line for that configuration, but 8796 only ships the definition in Apple's closed per-SoC pmap.",
  "scripts/compile-records.py is the per-object record generator XNU's KCC = $(CCACHE) $(CC) hook expects: the workflow exports CCACHE so every C compile writes <object>.json before execv, which is what build-mockfs-fixture.py and build-libpthread-kernel.py replay. Without it the pinned UniXNU b936519 never leaves startup.o.json, unixnu build always takes its bootstrap pass, and the mockfs fixture archive is never compiled.",
  "patches/xnu/source-machine-layer.patch also adds nos_arm_asm nos_arm_pmap to the KERNEL_BASE group in config/MASTER.arm64.bcm2837: doconf only activates an option when its tag is in the kernel group, so the raw options lines alone left the arm64 assembly and pmap sources out of the link. apple_amcc stays inactive because xnu-8796 has no amcc_rorgn_*.c sources."
]
completion = [
  "Kernel, payload and boot image build reproducibly and contain every declared input.",
  "The boot image matches the whyred bootloader format and size limit.",
]
limits = [
  "The package workflow has not linked a boot image yet. Run 42787794966 stopped at the link on kpc_pc_capture, mockfs_* and pmap_pending_preemption; the two non-Apple stubs cover the first and last, and mockfs is selected by CONFIG_XNU_SOURCE_MOCKFS, but the bootstrap pass that builds the compile records never reached the fixture archive. The CCACHE wrapper and the libpthread adaptation are proven: run 42925053394 built the mockfs fixture and every archive, and the final link then failed on kpc_pc_capture alone, which a short patch hunk header had silently dropped. The header is fixed and checked, but no run has linked the kernel yet.",
]
next_action = [
  "Rerun the package workflow; require every archive log to end without a python3 failure and the final kernel link to have no undefined-symbol block, then download Mu-whyred.img from the artifacts.",
]
evidence = [
  { kind = "source", reference = "scripts/package.sh", result = "Unmodified device packaging script; reads [package] unixnu from board.toml." },
  { kind = "source", reference = ".github/workflows/package.yml", result = "Full profile name, non-recursive UniXNU checkout, vendored profile install and Mu-whyred.img artifact." },

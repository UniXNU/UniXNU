schema_version = 1

[device]
name = "garnet"
soc = "SM7435"
os_profile = "ipados-27.0.1-24A446"
summary = "Preliminary research scaffold; no verified build or device boot."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "unixnu.lock", "configs/**", "patches/xnu/**", ".gitignore", "docs/linux-host.md"]
inputs = ["Pinned UniXNU and preliminary SM7435 sources; target OS profile."]
configuration = ["Example guard remains enabled; profile 27 is unverified."]
procedure = ["Resolve sources and inspect configuration after required inputs are established."]
findings = ["The SoC feed is pinned; ARM64e compatibility is not established.", "WSL defconfig and status resolve garnet and its SM7435 feed. Empty kernel.archives selects automatic component recipes, while auxiliary archives and several components' research-profile ABI support need review.", "The guarded board selects a provisional OS patch series without the incompatible boot-progress layer; equivalent diagnostics and profile compatibility are unverified.", "The guarded board file describes candidate UEFI package roots and submodules, not a verified build configuration.", "The user authorized system packages and administrator access for compilation; the WSL host check reports llvm-config missing. The official installer was started as WSL root; completion is pending."]
completion = ["Configuration and all selected component dependencies resolve with reviewed inputs."]
limits = ["The board is deliberately incomplete and is not ready to build."]
next_action = ["Verify PAC and complete the board resource inventory."]
evidence = []

[[area]]
id = "firmware"
status = "planned"
components = []
paths = ["proprietary-files.txt", "docs/evidence.md", "docs/uefi-integration.md", "patches/uefi/**", "scripts/inventory-uefi-inputs.py", "scripts/check-uefi-patch.py"]
inputs = ["Garnet UEFI source, firmware files, device DTB, and redistribution terms."]
configuration = ["Guarded board configuration lists candidate garnet DSC, FD, package roots and source-declared submodules; it does not apply the UEFI patch or supply the required vendor files."]
procedure = ["Audit the exact UEFI revision and integrate UniXNU and DarwinBoot modules."]
findings = ["The audited garnet firmware configuration does not establish UniXNU integration.", "The user reports that HakiOS boots garnet; its source specifies boot header version 4 and a separate loader workflow that must not be assumed compatible with UniXNU.", "The candidate firmware package roots and submodules follow its DeviceBuild.py; vendor binaries and their provenance are not verified.", "A preliminary DSC/FDF integration patch avoids redeclaring inherited DiskIo, FAT, HobLib and FdtLib; it has not been compiled or booted.", "A read-only checker rejects unknown firmware revisions and modified relevant files before checking patch applicability.", "UniXNU firmware.patches targets EDK II, not Mu-Silicium, so the device UEFI patch is not automatically applied by that setting.", "A read-only inventory extracts garnet binary INF and RAW references from the pinned UEFI source without redistributing or validating their files.", "The proposed UniXNUDxe can modify nonvolatile UEFI boot variables; the platform includes VariableRuntimeDxe but its backing store, manual-launch path and recovery remain unverified."]
completion = ["Firmware builds with required modules and boots on the target with logs."]
limits = ["Firmware sources and device-specific binary inputs are not yet integrated.", "Do not test firmware with UniXNUDxe before evaluating persistent variable writes and recovery."]
next_action = ["Identify the firmware input list and audit provenance."]
evidence = []

[[area]]
id = "cpu"
status = "planned"
components = []
paths = ["dts/**", "configs/**"]
inputs = ["SM7435 CPU topology, PSCI, interrupt controller, timer, and PAC."]
configuration = ["The preliminary boot arguments request one CPU."]
procedure = ["Verify boot CPU and PAC, then record timer and secondary CPU checkpoints."]
findings = ["The shared SMP patch does not apply to the selected XNU 27 profile after its architecture changes; the provisional board omits that series and keeps cpus=1.", "Android on the connected target reported eight processors and did not advertise paca or pacg in its CPU feature list; this does not establish EL1 behavior under UEFI."]
completion = ["Each enabled CPU, timer, and interprocessor interrupt works on the target."]
limits = ["No CPU or PAC behavior has been observed on the target."]
next_action = ["Collect target CPU feature and boot CPU evidence."]
evidence = []


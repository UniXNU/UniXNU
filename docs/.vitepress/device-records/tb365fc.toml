schema_version = 1

[device]
name = "tb365fc"
soc = "MT6835"
os_profile = "ipados-17.7.11-21H461"
summary = "Lenovo Xiaoxin Pad 12.1 (2025), Lenovo TB365FC, board cava_prc_consumer_wifi. The stock ZUXOS 1.1.10.122 package is unpacked and the unit itself has been inventoried over rooted adb (8 GB DRAM, 128 GB UFS, BOE HX83122B 1600x2560 @90 Hz, MT6631 combo). The UEFI firmware from uefi-tb365fc boots on the unit and shows the UniXNU menu with the Advanced Logger viewer; no XNU image has been built or booted yet."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", ".github/**", ".gitignore", "local.toml.example"]
inputs = ["MT6835 platform identity, Lenovo TB365FC (cava_prc_consumer_wifi) board identity, iPad7,1 / iPadOS 17.7.11 build 21H461 target identity and the TB365FC bootstrap defconfig.", "Stock package ZUXOS 1.1.10.122 (Android 15, build TB365FC_CN_OPEN_USER_M1317.3_V_ZUXOS_1.1.10.122_ST_250828), hashed in proprietary-files.txt."]
configuration = ["board.soc = MT6835; board.soc_source = mt6835; board.os_profile = ipados-17.7.11-21H461; schema_version = 2.", "tb365fc_defconfig enables the shared ARM DT platform, ARMCPU, architected timer, panic and prelinked crypto paths.", "feeds.toml pins the published UniXNU-mt6835-common commit; the workstation override lives in the git-ignored local.toml."]
procedure = ["Run ./unixnu defconfig tb365fc_defconfig -D ../UniXNU-tb365fc from a UniXNU checkout.", "Run ./unixnu status --json -D ../UniXNU-tb365fc and inspect the effective SoC layer and source pins."]
findings = ["The device identifies as MT6835 with stock board name cava_prc_consumer_wifi, Android 15, build TB365FC_CN_OPEN_USER_M1317.3_V_ZUXOS_1.1.10.122_ST_250828.", "The stock SP Flash Tool package provides boot, init_boot, vendor_boot, dtbo, lk and preloader images; their hashes and the values derived from them are recorded across the firmware, cpu, memory, storage, display, input, gpu, network, audio, power and packaging areas.", "No public Lenovo kernel source or DTS for this board was found; every hardware value so far comes from the stock firmware and the live device inventory.", "The unit reports ro.product.device TB365FC, ro.product.name TB365FC_PRC, ro.board.platform mt6835 and ro.boot.hardware mt8755 on Android 15 build AP3A.240905.015.A2/250828_122 (kernel 5.15.170), with ro.boot.verifiedbootstate orange and ro.boot.flash.locked 0."]
completion = ["Source pins resolve, the effective configuration contains the intended TB365FC overrides and every selected component has an owning area."]
limits = ["The APFS Data volume UUID and the unique chip ID are payload inputs and still unmeasured; the panel variant, the self-built boot image and the FD base are settled on hardware (see firmware and display). example stays true until the payload inputs are measured."]
next_action = ["Measure the APFS Data volume UUID and the unique chip ID once XNU is installed, then clear example = true."]
evidence = [
  { kind = "device", reference = "tools/collect-device-info.sh", command = "tools/collect-device-info.sh", revision = "5ba47e6284567baa3450f9d82b5d56963cd14035", result = "Collected the redacted identity and hardware inventory that the areas below now cite." },
]

[[area]]
id = "firmware"
status = "implemented"
components = []
paths = ["proprietary-files.txt", "tools/**", "README.md"]
inputs = ["Stock TB365FC firmware package (Android 15, build TB365FC_CN_OPEN_USER_M1317.3_V_ZUXOS_1.1.10.122_ST_250828), unlocked bootloader state, fastboot mode, the stock boot/vendor_boot/dtbo partitions and the UEFI firmware from uefi-tb365fc.", "Measured boot geometry: boot.img header v4 (4096-byte pages); vendor_boot header v4 with kernel_addr 0x40000000, ramdisk_addr 0x66F00000, tags_addr/dtb_addr 0x47C80000 and cmdline \"bootopt=64S3,32N2,64N2\"."]
configuration = ["Plan A implemented: the FD is packed as the gzip kernel of an Android boot v4 image, LK decompresses it to kernel_addr 0x40000000 and jumps into the SEC entry; no shim is needed.", "Resources/Configs/tb365fc.toml keeps header_version = 4, the FD window 0x40000000/0x400000 and the 1 MiB FAT12 UNIXNU ramdisk; the stock init_boot and vendor_boot ramdisks and DTB stay in place.", "Firmware paths in board.toml [firmware] point at Platforms/Lenovo/tb365fcPkg; the five Mu base-core fixes are applied from uefi-tb365fc Resources/MuPatches at build time over the upstream Mu_Basecore pin."]
procedure = ["Extract the stock boot, vendor_boot and dtbo partitions and read them with tools/unpack_boot_image.py and tools/extract_fdt.py.", "Build the UEFI FD, flash the boot image, and record the first screen, last confirmed stage and log source."]
findings = ["init_boot.img is header v4 with a 2,066,170-byte ramdisk; vendor_boot.img is header v4 with vendor_ramdisk_size 27,731,435 and dtb_size 190,500.", "dtbo.img holds one 240,233-byte DTBO with 208 fragments; the vendor_boot DTB is the MT6835 base tree (model \"MT6835\") and the overlay targets use unresolved 0xffffffff phandles until LK merges them.", "lk.img (2,897,568 bytes) carries kernel_load_addr and dtb_addr as runtime variables rather than text-form constants; the few 32-bit words equal to 0x40080000 have no established role, so the FD base stays the Plan A convention proven on merlinx and camellia until a hardware log confirms it.", "The stock boot images are padded to their partition sizes (boot and vendor_boot 64 MiB, init_boot and dtbo 8 MiB); the hashes in proprietary-files.txt cover the padded files.", "On the tablet the boot, vendor_boot and dtbo images match the pinned stock hashes, and /proc/iomem reserves the header addresses: dtb at 0x47c80000 and the ramdisk at 0x66f00000-0x68be2fff.", "init_boot_a does not match the pinned stock hash: the unit runs SukiSU Ultra in LKM mode (a kernelsu module is loaded and the stock kernel carries no KernelSU strings), so the pin still describes the package, not this unit's rooted boot partition.", "The stock cmdline carries fastboot_enable=1 and bootopt=64S3,32N2,64N2; neither demonstrates fastboot boot support.", "The first bring-up image booted on the unit: LK accepted the self-built v4 image, SEC cleared the LK scanout, the Project Silicium logo appeared and the UniXNU menu followed at 1600x2560; the 1.7 MiB image is far below the 64 MiB boot_a limit.", "The FD base is 0x40000000 (the stock vendor_boot kernel_addr), not the earlier 0x40080000 plan; the primary stack sits at 0x40400000 and the LK reservations (DTB 0x47C80000, ramdisk 0x66F00000) survive the handoff.", "In the booted firmware Volume Up/Down move the menu selection, Power and Enter activate entries, and Tools opens the Advanced Logger viewer with QR pages, five speed gears and Power/Enter to exit."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["The XNU/DarwinBoot handoff and the ADT payload are not implemented; the image was flashed to this unit's boot_a only, boot_b stays stock as the recovery path."]
next_action = ["Build the XNU payload and boot image, then record the DarwinBoot handoff and the first XNU checkpoint."]
evidence = [
  { kind = "source", reference = "proprietary-files.txt", result = "SHA-256 pins for the stock boot, init_boot, vendor_boot, dtbo, lk and preloader images this area derives its geometry from." },
  { kind = "source", reference = "tools/unpack_boot_image.py", result = "Parsed the stock boot, init_boot and vendor_boot headers; produced the header versions, sizes and load addresses recorded above." },
  { kind = "device", reference = "proprietary-files.txt", command = "sha256sum stock/boot_a.img stock/vendor_boot_a.img stock/dtbo_a.img stock/init_boot_a.img", revision = "5ba47e6284567baa3450f9d82b5d56963cd14035", result = "boot_a, vendor_boot_a and dtbo_a match the pins; init_boot_a differs because of the SukiSU LKM patch." },
  { kind = "source", reference = "https://github.com/LittleStar-OuO/uefi-tb365fc/commit/7cf23b62ad34ab4c71b502299fc049fb8af6786e", result = "The bootable firmware sources: v4 boot path, MuPatches applied over the upstream Mu_Basecore pin, FD window and panel settings described in the README." },
]

[[area]]
id = "cpu"
status = "planned"
components = []
paths = ["dts/**", "configs/**", "patches/**"]
inputs = ["Measured from the stock vendor_boot DTB: 6x Cortex-A55 at MPIDR affinities 0x0-0x500, 2x Cortex-A76 at 0x600-0x700, GIC distributor 0x0C000000 (256 KiB), redistributors 0x0C040000 (2 MiB) and a 13 MHz architected timer."]
configuration = ["CONFIG_XNU_ARMCPU=y and CONFIG_XNU_ARM_DT_PLATFORM=y.", "dts/mt6835.dtsi carries the measured cluster layout, the PSCI conduit and the GIC ranges; tb365fc.dts enables the CPUs."]
procedure = ["Compare dts/mt6835.dtsi with the stock FDT /cpus, interrupt-controller and timer nodes.", "After the first boot, check the PSCI conduit and per-CPU bring-up against /proc/cpuinfo and the stock dmesg."]
findings = ["The stock topology is one GICv3 domain: A55 at affinity 0x0 and 0x100-0x500 (cluster type E), A76 at 0x600/0x700 (cluster type P). The earlier MT6833-style 0x0-0x1 / 0x100-0x105 guess was wrong.", "The architected timer runs at 13 MHz (clock-frequency 0xc65d40), and GICD spans 0x40000 bytes rather than 64 KiB.", "The stock tree has a /psci node (compatible arm,psci-1.0, method smc) and every CPU uses enable-method = \"psci\"; the dtsi conduit matches it.", "The stock tree uses four-cell interrupt specifiers whose trailing cell is a MediaTek wakeup flag; the ADT keeps the standard three-cell GIC form.", "The on-device /proc/cpuinfo lists 8 CPUs: six 0xd05 (Cortex-A55) and two 0xd0b (Cortex-A76), matching the DTB affinities."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["SMP is not enabled in UniXNU; the PSCI conduit and cluster types are untested there, although Android already runs all eight cores."]
next_action = ["Boot the first CPU on hardware, confirm the PSCI conduit, then enable the remaining cores one cluster at a time."]
evidence = [
  { kind = "device", reference = "dts/tb365fc.dts", command = "adb shell cat /proc/cpuinfo", revision = "5ba47e6284567baa3450f9d82b5d56963cd14035", result = "Core count and part numbers (0xd05 x6, 0xd0b x2) match the cluster layout in the device tree." },
]

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**", "tools/**", "patches/**"]
inputs = ["DRAM base and size, reserved-memory carveouts and the IOMMU/SMMU stream inventory.", "The stock tree declares CMA pools (ssmr and ssheap, 256 MiB each, 16 MiB/2 MiB alignment) and dynamic carveouts whose final addresses are assigned by LK."]
configuration = ["tb365fc.dts must expose exactly one enabled memory node with one contiguous range; the shared ADT generator rejects anything else.", "Reserved regions stay outside the contiguous DRAM range reported to XNU."]
procedure = ["Read the stock DTB memory and reserved-memory nodes and reconcile them with /proc/iomem and /proc/meminfo on the rooted device.", "Regenerate the ADT and confirm chosen/dram-base and dram-size match the extracted values."]
findings = ["The stock DTB memory node is a 1 GiB stub at 0x40000000 (0x0 0x40000000 0x0 0x40000000) that LK replaces at boot, so the DRAM size cannot be read from the DTB.", "Measured on the tablet: MemTotal is 7,991,068 kB, CmaTotal 737,280 kB, and /proc/iomem maps DRAM from 0x40000000 to 0x23fffffff, confirming the 8 GiB range in tb365fc.dts.", "The live map reserves 0x47c80000-0x47ce6fff (DTB), 0x66f00000-0x68be2fff (vendor ramdisk) and a large block from 0x20888f000 to 0x23e5fffff; the ADT must keep such ranges out of the region handed to XNU."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["The reserved ranges are LK-assigned and this is Android's post-LK view, not a UniXNU handoff contract; the final carveouts remain unknown."]
next_action = ["Regenerate the ADT once the UEFI FD runs and diff its memory map against this inventory."]
evidence = [
  { kind = "source", reference = "tools/extract_fdt.py", result = "Extracted the base DTB from the stock vendor_boot image and dumped its memory and reserved-memory nodes." },
  { kind = "device", reference = "dts/tb365fc.dts", command = "adb shell cat /proc/meminfo; adb shell su -c cat /proc/iomem", revision = "5ba47e6284567baa3450f9d82b5d56963cd14035", result = "MemTotal and the System RAM interval 0x40000000-0x23fffffff confirm the 8 GiB memory node." },
]

[[area]]
id = "storage"
status = "planned"
components = []
paths = ["package/**", "patches/**", "tools/**"]
inputs = ["Storage host candidates in the stock DTB: ufshci@112b0000 (\"mediatek,mt8183-ufshci\", reg 0x112b0000/0x2300, IRQ 0x189) is enabled, while mmc@11230000 (\"mediatek,mt6835-mmc\", reg 0x11230000/0x10000 + 0x11e70000/0x1000, IRQ 0x183) and mmc@11240000 are explicitly disabled.", "Stock scatter: boot_a 0x28F00000, vendor_boot_a 0x2CF00000, init_boot_a 0x30F00000, dtbo_a 0x31700000, super 0x4B000000 (0x2C0000000 bytes), userdata at byte 0x34C800000 in both the EMMC and UFS layout.", "The userdata partition geometry and the Data volume UUID."]
configuration = ["[userdata] first_lba = 0x34C800, last_lba = 0x1DC8FF7 and lba_bytes = 4096 come from the on-device GPT; the APFS Data volume UUID is still REQUIRED.", "A storage component is selected only after the host-controller inventory; no storage gate is enabled in tb365fc_defconfig yet."]
procedure = ["Read /proc/partitions, the GPT (sgdisk -p on the boot LUN: /dev/block/sda* for UFS or /dev/block/mmcblk0* for eMMC) and the queue/logical_block_size on the rooted device.", "Record the userdata entry LBA range and the APFS volume UUID used for root matching."]
findings = ["The stock DTB enables a UFS host (ufshci@112b0000) and disables both MSDC hosts; the dtbo also carries the mt6377_vufs rail. The earlier \"eMMC on MSDC_0\" reading came from the scatter's first layout section and is not established.", "The scatter is a download map, not the GPT: its pgpt entry is NONE and the userdata size 0xC0000000 is the factory image, so the real partition may extend further.", "Measured on the tablet: the UFS host 112b0000.ufshci drives a Samsung KLUDG2R1JF-B0F1 LUN with 4096-byte logical sectors; /dev/block/sdc reports 249,921,536 512-byte sectors (127.96 GB) and a 71-entry GPT.", "GPT entries: userdata 0x34C800-0x1DC8FF7 (111,091,680 KiB), boot_a 0x28F00 and vendor_boot_a 0x2CF00 (64 MiB each), init_boot_a 0x30F00 and dtbo_a 0x31700 (8 MiB each), super 0x4B000 (11 GiB); the init_boot_b entry is 11,776 KiB, an asymmetry in the factory table.", "The LK log reports the UFS link as \"HS-G3-2, 1 lane\"."]
completion = ["Host: register, clock, link and SMMU facts match the board inventory.", "Reads: SCSI capacity, GPT and known blocks are correct; OS/SystemOS windows stay within userdata.", "Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region."]
limits = ["UniXNU's firmware has no UFS driver (MsdcDxe is the only storage path) and the SMMU stream wiring is unknown; the Data volume UUID cannot be set until APFS is installed."]
next_action = ["Port a UFS host path into the firmware, then record the GPT and the Data volume UUID once APFS is installed."]
evidence = [
  { kind = "source", reference = "tools/extract_fdt.py", result = "Identified the enabled UFS host, the disabled MSDC hosts and their register windows in the stock base DTB." },
  { kind = "device", reference = "tools/pull-stock-images.sh", command = "adb shell su -c 'dd if=/dev/block/sdc bs=4096 count=34' with a local GPT parse", revision = "5ba47e6284567baa3450f9d82b5d56963cd14035", result = "GPT at 4096-byte sectors: the userdata LBA range and the A/B boot partition sizes match the board.toml [userdata] values." },
]

[[area]]
id = "display"
status = "implemented"
components = []
paths = ["package/**", "patches/**", "dts/**", "tools/**"]
inputs = ["DSI panel variant from the stock overlay: panel1@0 \"boe,hx83122b,vdo\" or panel2@1 \"tm,nt36532,vdo\", both video-mode with TE.", "Panel rails and GPIOs: power enable GPIO 0x22, backlight enables 0x15/0x19, reset GPIO 0x56 (86), bias GPIOs 0x7c (124) and 0x97 (151).", "Backlight controllers ST7758 and AW99706 at I2C addresses 0x2e and 0x76 on two panel channels.", "Panel resolution, refresh rate and init sequence from the vendor LCM driver; the device tree carries no timings."]
configuration = ["Bootstrap relies on the firmware GOP framebuffer only; no XNU display provider is selected yet."]
procedure = ["Record the active panel compatible, wm size and wm density on the tablet and match them with the stock LCM driver name from the LK/kernel log.", "Record the GOP mode from the UEFI boot log when the first firmware image runs."]
findings = ["The board ships with either a BOE HX83122B or a Tianma NT36532 video-mode panel using the same rails, reset and TE wiring.", "Measured on the tablet: 1600x2560 at 90.00 Hz with a physical density of 249.46 dpi (ro.sf.lcd_density 320), so the panel is portrait 1600x2560.", "Both panel1@0 and panel2@1 stay enabled in the live merged FDT; LK picks the variant at runtime from the panel ID.", "The LK log (/proc/pl_lk) names the active driver: lcm_compare_id matches \"hx83122b_boe AF\" and LK uses \"cava_hx83122b_boe_vdo_cphy_dsc_90hz_lcm_drv\" (BOE HX83122B, video mode, CPHY, DSC, 90 Hz) with fps=9009.", "The same log reads the backlight ids: AW99706 answers on I2C 0x76 with id 0x7 while ST7758 returns 0, so this unit uses the AW99706 controller on both channels.", "The UEFI firmware reuses the stock LK scanout 1600x2560x32 at 0xFCF2B000 (0xFA0000 bytes) through SimpleFbDxe; the boot logo and the UniXNU menu render with correct geometry and colors on the unit, so the GOP mode is 1600x2560x32."]
completion = ["A known frame appears with correct geometry and colors, then userland presentation and backlight controls work."]
limits = ["XNU has no display provider yet; the DSI timings and init sequence still live inside the vendor LCM driver and UniXNU does not drive the backlight."]
next_action = ["Extract the DSI timings and init sequence for cava_hx83122b_boe_vdo_cphy_dsc_90hz_lcm_drv and write the XNU display provider; the firmware GOP path is already verified."]
evidence = [
  { kind = "source", reference = "tools/extract_fdt.py", result = "Extracted the stock dtbo overlay that declares both panel variants, their rails and the backlight controllers." },
  { kind = "device", reference = "tools/collect-device-info.sh", command = "adb shell dumpsys SurfaceFlinger | grep activeMode", revision = "5ba47e6284567baa3450f9d82b5d56963cd14035", result = "Active mode 1600x2560 at 90.00 Hz, dpi 249.46, matching wm size and ro.sf.lcd_density 320." },
  { kind = "device", reference = "tools/collect-device-info.sh", command = "adb shell su -c cat /proc/pl_lk", revision = "ce3fb214d55f674ef937781e076c8f8f36ed08a5", result = "LK log names the selected BOE HX83122B LCM driver, reports fps 9009, and identifies AW99706 as the backlight controller." },
]

[[area]]
id = "input"
status = "implemented"
components = []
paths = ["package/**", "patches/**", "dts/**", "tools/**"]
inputs = ["Touch over SPI at 10 MHz (0x989680) with spi-cpha: IRQ GPIO 4 (active low), reset GPIO 43 (0x2b), dual driver set himax,hxcommon and novatek,NVT-ts-spi, Novatek 40x64 node grid (mp-criteria-6096).", "Pogo keyboard node \"lenovo,lenovo_keyboard\" and MT6377 PMIC keys."]
configuration = ["Input components are selected only after the SPI bus and GPIO inventory; no input gate is enabled yet."]

[[area]]
id = "power"
status = "planned"
components = []
paths = ["package/**", "patches/**", "dts/**", "tools/**"]
inputs = ["MT6377 PMIC (bucks, LDOs, charger, gauge, RTC, keys, accdet), MT6685 RTC/clock buffer, the MT6319 external buck (mt6315_3 regulator) and the RT5133 GPIO expander.", "MM8013 fuel gauge, a PPS charger path built on the Southchip SC89890H plus an SGM charger, and the AW35615 USB-PD controller."]
configuration = ["The bootstrap image runs without a battery/charger driver; sleep-disabled defaults stay in place."]
procedure = ["Record PMIC registers, regulator rails and battery thresholds from the stock DTB before writing a power driver."]
findings = ["The PMIC is MT6377, not MT6359; it also provides the MT6377-keys used for the power and volume buttons.", "The stock overlay lists the full regulator set (vbuck1-6, vs1/vs2, vsram, va12/vaud18/vaud28, vaux18, vbif28, vcn33/vcn18, vxo22, vm18, vemc, vio18, vrf rails, vmc, vusb, vmch) and the gauge/RTC/charger children.", "Charging is a PPS path (\"mediatek,charger,pps\") with a two-charger configuration: Southchip SC89890H at I2C 0x6a and an SGM charger at 0x6c, with the AW35615 PD controller at 0x22.", "Measured on the tablet: the MM8013 gauge driver fg_mm801310c reports VBAT/VBUS, and the charger stack runs sc8989x on I2C 7-006a plus sc8541 on 5-006a under the PPS policy; MT6377 supplies the PMIC keys and the headset-jack codec path."]
completion = ["Declared power controls and battery readings match observations; each claimed sleep/resume transition restores its dependent peripherals."]

findings = ["Touch is a Himax/Novatek SPI part on IRQ GPIO 4 with reset on GPIO 43.", "A Lenovo pogo keyboard and MT6377 PMIC keys (power, volume) are present.", "Measured on the tablet: /dev/input exposes himax-touchscreen (event2), lenovo-stylus (event3), mtk-kpd (event1), mtk-pmic-keys (event0), hall_irq (event5) and the MT6377 headset jack (event4); the Himax driver is the one bound on this unit.", "In the UEFI menu Volume Up/Down move the selection and Power or Enter activate the highlighted entry, including the Tools viewer (Up/Down change the QR speed, Power/Enter exit); the KPD matrix bit 0 carries Volume Up and the MT6377 PMIC keys carry Volume Down and Power."]

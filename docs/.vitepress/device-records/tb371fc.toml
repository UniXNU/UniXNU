schema_version = 1

[device]
name = "tb371fc"
soc = "SM8250"
os_profile = "ipados-17.7.11-21H461"
summary = "V135 实机基线；应用、设置、触摸和 GPU 正常；壁纸仍黑并暂停调试。公开构建入口需要本地私有输入，完整 XNU 源码重编译及电池/音量键仍未完成。"

[[area]]
id = "configuration"
status = "implemented"
components = []
paths = ["board.toml", "device.toml", "upstream/**"]
inputs = ["TB371FC / bootloader product spinel；Snapdragon 870、SM8250 系列、Adreno 650；测试配置 8 GB + 128 GB。"]
configuration = ["board.name=tb371fc，os_profile=ipados-17.7.11-21H461；example=true，components.include=[]。"]
procedure = ["先阅读 BUILDING 与来源锁，再运行源码及官网记录检查。"]
findings = ["V129 已整理为公开源码快照；设备身份与上游来源已有独立记录。"]
completion = ["官网设备标识与适配记录一致，来源固定且公开内容不包含私有输入。"]
limits = ["本 board 仅提供目录身份，不是通用构建器的完整入口；不复制旧工作区过时的 host-only 说明。"]
next_action = ["整理实际 XNU、UEFI 和组件构建配方后再接通完整 board 配置。"]


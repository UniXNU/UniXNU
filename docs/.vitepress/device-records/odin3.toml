schema_version = 1

[device]
name = "odin3"
soc = "SM8750"
os_profile = "ipados-17.7.11-21H461"
summary = "AYN Odin 3 on the Pagani SM8750 base: iPadOS 17.7.11 (21H461) boots from a microSD ESP to the SpringBoard lock screen with eight CPUs online. Root runs on verified read-only SD windows; Data persists on a dedicated partition. Display is a GOP handover with software rotation; touch identity is implemented but input is not demonstrated; GPU, Wi-Fi, audio and brightness are out of scope."

[[area]]
id = "configuration"
status = "implemented"
components = ["NativePrelink", "Sm8750Platform"]
paths = ["board.toml", "feeds.toml", "unixnu.lock", "configs/**", "patches/xnu/**", "scripts/**", "package/**"]
inputs = ["unixnu.lock pins xnu d8b80295118ef25ac3a784134bcf95cd8e88109f, Pagani drivers 14f50fce9778a8bb19ec6b0b7dc199863526c996 and sm8750 b79d675e522383c29131ccda8529fda45e1f2852. The 21H461 kernelcache pin stays in board.toml. The apps SMMU is ARM MMU-500 and is not enabled."]
configuration = ["Odin identity, eight CPUs with the Pagani SMP path (sheng-smp, sheng-smp-gic, armcpu-self-ipi), 4 GiB owned RAM; no inherited PKX110 peripheral arguments."]
procedure = ["Resolve status; defconfig odin3_defconfig; build kernel, payload and local medium; no device commands."]
findings = ["The old OnePlus README and porting record have been retained as explicitly named reference files, rather than reusing their hardware verification levels."]
completion = ["Resolved profile and final reports agree with the built inputs."]
limits = ["Local module overrides are intentional and are not upstream pin qualification."]
next_action = ["Keep each candidate in its own report and SHA. Do not fold the fan, row-layout, cluster or resume-0 branches into this area's status."]
evidence = [{kind = "source", reference = "board.toml", result = "Complete selection and kernelcache pin."}]

[[area]]
id = "firmware"
status = "implemented"
components = ["PaganiDarwinBoot"]
paths = ["modules/Pagani/drivers/PaganiDarwinBoot/**"]
inputs = ["Existing OpenABL v1.2; BLS entry with ODIN3.DTB splash reservation."]
configuration = ["payload.loader=driver; no firmware build or ABL update."]
procedure = ["Preserve the existing GOP and BLS handoff; inspect local images before a separately authorized boot."]
findings = ["The user's diagnostic page remains visible with changing timer/poll counters; firmware scanout is already working."]
completion = ["Same loader handoff and stable framebuffer in the new boot."]
limits = ["Firmware is the existing OpenABL. There is no Mu FD, no fastboot boot and no Advanced Logger QR exporter, because the ABL is not replaced."]
next_action = ["Keep the OpenABL GOP and the BLS splash DTB. Do not add a firmware log exporter. The kernel card log is XNSDLOG1, read by scripts/h1/sd-inspect.sh."]
evidence = [{kind = "source", reference = "README.md", result = "Odin boot route and evidence boundary; project reports carry the original user transcript."}]

[[area]]
id = "cpu"
status = "implemented"
components = ["PaganiArmCpu", "PaganiArmDTPlatform"]
paths = ["dts/**", "modules/Pagani/drivers/PaganiArmCpu/**", "modules/Pagani/drivers/PaganiArmDTPlatform/**"]
inputs = ["SM8750 GIC and 19.2 MHz architectural timer; eight-CPU DTS with PSCI SMC."]
configuration = ["Native architectural timer and PAN enabled; secondary CPUs started through the Pagani SMP path. Main uses 6E/2P tags and __ARM_AMP__/Edge; identity-only touch profile retains the prior no-Edge configuration."]
procedure = ["Retain the previously booted platform settings."]
findings = ["Timer/poll progress is observed; it is not proof of userland progress."]
completion = ["Kernel continues through root and exec without a new exception."]
limits = ["SMP was previously observed; Edge scheduling, per-domain load and UI affinity are not hardware-qualified. Recount is accounting, not DVFS."]
next_action = ["On the host, record that the touch3 ADT has no cluster-type and that the 6E/2P candidate is unmerged. Do not change preferred-cluster policy."]
evidence = [{kind = "source", reference = "configs/odin3_defconfig", result = "Unchanged CPU/PAN policy."}]

[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["dts/**", "board.toml"]
inputs = ["Measured Odin RAM range and 4 GiB contiguous owned window (8 GiB: logo without page on hardware, cause not determined; see docs/builds/odin3-swap-geometry-20261029.md)."]
configuration = ["payload.adt.owned_memory_size=0x100000000."]
procedure = ["Keep GOP allocation outside ordinary RAM ownership and validate actual console geometry."]
findings = ["No DMA presentation path is enabled; CPU copy validates source/destination bounds.", "The card ADT 624d0938 (14188 B, image d3-fan3-uhs, same hash as p1 on 2026-10-29) carries dram-base 0x80000000, dram-size 0x3E9A5D000 and darwinboot-memory-size 0x100000000. Its /arm-io children are intc and sdhci only. The apps SMMU is ARM MMU-500 at 0x15000000 in the AYN DTSI and is left disabled; ArmSmmu4K is not selected."]
completion = ["No framebuffer overrun and accepted geometry in runtime display diagnostics."]
limits = ["The owned window stays 4 GiB. The 15.65 GiB DDR node is not the window XNU owns. No UEFI ConventionalMemory map was read, so carveouts stay unresolved. The apps SMMU is not enabled and is not programmed."]
next_action = ["Do not enable iommu@15000000 and do not change owned_memory_size. Read a UEFI ConventionalMemory map from a log already captured before resizing the window."]
evidence = [{kind = "source", reference = "modules/Pagani/drivers/NativeMobileDisplay/NativeLegacyDisplay.cpp", result = "PE_current_console and memory-bound checks."}]

[[area]]
id = "storage"
status = "implemented"
components = ["SoftwareAES", "PaganiVerifiedRoot", "NativeVirtioBlock", "NativeRamBlock"]
paths = ["drivers/OdinSd/**", "modules/Pagani/drivers/NativeRamBlock/**", "modules/Pagani/drivers/NativeVirtioBlock/**", "modules/Pagani/kits/PaganiVerifiedRoot/**"]
inputs = ["Existing signed OS/SystemOS policy windows on microSD; FD326389 Data seed."]
configuration = ["OdinSd occupies the NativeUfs link slot, SDCC2 only. PackedRAMDisk Data is volatile by default. Experimental sheng-data-persist=1/2 requires a unique GUID-pinned UniXNUData partition and both GPT copies; no Data candidate is enabled here."]
procedure = ["Retain the previously booted SDHCI fixes and policies; perform only host readback of local image files."]
findings = ["The user observed SystemOS authorization and Data mount. The SD store adapter now passes actual-code and overlay host tests; writes wait for card programming and readback, without claiming UFS FUA or power-loss atomicity. Root snapshot serialization and software completion deadlines are guarded. CMD6 high-speed selection uses byte16, not the byte13 support bitmap."]
completion = ["Same root/Data milestones without integrity or command errors."]
limits = ["No UFS; persistent Data not activated or hardware-tested. Partition provisioning, durability, speed and boot-time savings remain unmeasured. Shared-cache authorization hashes remain per boot."]
next_action = ["Boot the same p1 again. A generation-1 header with the 84027 present bits still set means Data resumed. Do not rewrite p1 and do not set sheng-data-reset."]
evidence = [{kind = "source", reference = "drivers/OdinSd/OdinSd.cpp", result = "PIO SD provider and bounded verified-root windows, not a UFS driver."}]

[[area]]
id = "display"
status = "implemented"
components = ["NativeMobileDisplay", "NativeKeyStoreEvents", "Stage7Probe", "PaganiPanel"]
paths = ["modules/Pagani/drivers/NativeMobileDisplay/**", "modules/Pagani/drivers/Stage7Probe/**", "modules/Pagani/drivers/NativeKeyStoreEvents/**", "modules/Pagani/drivers/PaganiPanel/**"]
inputs = ["Odin ICNA3520 already scanning the firmware GOP; original 21H461 Legacy ABI."]
configuration = ["NativeLegacyDisplay CPU backend and software 60 Hz notification; odin-gop-only=1 blocks all PKX110 peripheral startup. AppleKeyStore stand-in enabled (offline-key-events=1, sheng-aks=1) as in the Pagani reference. Panel is portrait 1080x1920; sheng-fb-rotate=1 shows the system a 1920x1080 display and turns each frame 90 degrees to the left into the GOP (display-rotation stays 0)."]
procedure = ["Run console and display timer tests; qualify compiled 358-slot ABI and original bindings; build kernel/payload/medium; observe one boot later."]
findings = ["DISPLAY 0 was an empty diagnostic stage string, not a hardware enumeration result. The previous profile omitted the system display archive and its init caller. IOSurface matching now uses service class with a fallback, not one IOName.", "Hardware (medium 5d5ffd71, display-rotation=90): every swap rejected with reason 3 (layer-0 rectangles or size words differ from the GOP size); what the compositor sent was not recorded. The 21H461 kernelcache never reads display-rotation; only libMobileGestalt does. See docs/builds/odin3-swap-geometry-20261029.md."]
completion = ["Display publication, valid user client/swap, a real system frame and correct handoff."]
limits = ["First lock-screen frame observed; distortion and stability unresolved. No physical DSI/panel/reset/brightness programming; no GPU or measured vblank. Embedded Pagani peripheral objects are compile-only."]
next_action = ["Keep odin-gop-only=1. Brightness transport is undetermined, so do not add a backlight driver or a calibration boot. Image 101bb1d1 is the reserved display checkpoint and is not part of this action."]
evidence = [{kind = "source", reference = "modules/Pagani/drivers/Stage7Probe/Stage7Probe.cpp", result = "Hard GOP-only startup guard and class-based IOSurface wait."}, {kind = "host", reference = "modules/Pagani/drivers/NativeMobileDisplay/Test/request-state.c", command = "ASan/UBSan host test of Test/request-state.c, recorded in docs/builds/odin3-swap-geometry-20261029.md", revision = "8596d94a9bd296c0ca68f5150e2f539d531fb196", result = "Rotation of a BGRA frame in both directions, tile edges and refusals under ASan/UBSan."}]

[[area]]
id = "input"
status = "implemented"
components = ["PaganiInput", "QcomGeniSpi"]
paths = ["modules/Pagani/drivers/PaganiInput/**", "modules/Pagani/drivers/Stage7Probe/*Touch*", "modules/Pagani/drivers/Stage7Probe/FocalTech.h", "modules/Pagani/drivers/Stage7Probe/GeniI2c.h", "scripts/build-odin3-touch.py", "modules/Pagani/drivers/Stage7Probe/*Fan*", "scripts/build-odin3-fan.py"]
inputs = ["AYN d0bd123 Odin DTS: generic ft5426/I2C4 0x38, GPIO161 reset/162 IRQ. ROCKNIX/distribution 2a01f59e3329fd14923ccbe6f703cd84f0367196 confirms the same bus/pins/rails/extent. OTA overlay: FT3519 type 0x35190489, 10 contacts, 1080x1920; all 11 DTB variants confirm GENI 0xa90000, SPI357, QUP1 stream 0xa3."]
configuration = ["Independent odin-touch=0..4 (absent/off by default); odin-gop-only continues to block every PKX110 provider. Stage3 reads ID/FW/mode before contact reads. Stage4 requires odin-touch-id equal to the measured register pair; no guessed default ID. Retained FIFO I2C only; no flash updater, power/reset writes or SMMU changes."]
procedure = ["Run host touch/FIFO ASan/UBSan tests and exact 207-slot IOHIDDevice object comparison, compile/link/prelink; later authorize stage3 separately, measure the ID, and only then qualify scanning/HID/UI."]
findings = ["OnePlus S3910/GPIO/RPMh constants are not Odin inputs.", "OdinTouch candidate compiles/links/prelinks; 10-contact coherent decoder, inverse display rotation, normalized HID ranges and explicit releases pass host tests. Logical /arm-io/touch node avoids inventing a >16MiB GENI address; GPIO162 is not encoded as a GIC IRQ. See project docs/builds/odin3-touch-20261029.md."]
completion = ["Future genuine Odin input reports and UI response."]
limits = ["Hardware input unqualified; no known measured A3/9F identity, cold power/reset or GPI/DMA adoption. No board firmware upgrade. Physical buttons not implemented. The candidate refuses incompatible retained state rather than guessing."]
next_action = ["The missing input is the measured FT3519 ID/FW pair. No host source has it. Leave odin-touch off and do not guess A3/9F."]
evidence = [{kind = "host", reference = "modules/Pagani/drivers/Stage7Probe/Test/touch.c", command = "python3 modules/Pagani/drivers/Stage7Probe/Test/test-touch.py", revision = "93757bb5027fe4888b382c42ed5318b33acce603", result = "Real decoder/transport core under ASan/UBSan: rotations, 10 IDs, release, bounds, repeated START, tails, refusal and timeout/poison PASS."}]

[[area]]
id = "gpu"
status = "planned"

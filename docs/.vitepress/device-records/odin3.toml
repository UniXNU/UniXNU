findings = ["A software refresh request is not hardware acceleration or measured refresh.", "G1 has no MMIO writes or CX_MISC/GX/GMU/CP/SMMU accesses. A synchronous framebuffer checkpoint must succeed before each attempt; otherwise the survey cancels. Host ASan/UBSan ladder and renderer tests pass; hardware not determined. See docs/builds/odin3-adreno830-g1-20261029.md in the project."]
completion = ["Future independently qualified GPU execution and presentation."]
limits = ["GPU acceleration not determined. Host-side inputs only: no GPU register has been read on the Odin; EL1 access to SCM/TZ, GDSC/clocks and the GPU SMMU is not demonstrated."]
next_action = ["Keep the CPU backend. Do not open the GPU until display has a recorded result and touch has a measured ID."]
evidence = [{kind = "source", reference = "configs/odin3_defconfig", result = "GPU disabled."}]


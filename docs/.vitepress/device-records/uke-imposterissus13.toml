[[area]]
id = "display"
status = "device-verified"
components = ["GopFramebuffer", "NativeUfs"]
paths = ["package/LegacyDisplayProbe.cpp", "package/OfflineGOP*.mm", "package/DpuProbe.cpp", "drivers/NativeUfs/NativeUfs.cpp", "scripts/build-native-legacy-display.py", "scripts/check-dpu-probe-host.py", "docs/dts-reference/mdss-cliffs-map.md"]
inputs = ["UEFI GOP framebuffer; panel O82 3200x2136 with the splash at 0xe3940000/0x2b00000.",
  "Overlay-present Legacy driver and the recorded mobile-graphics ABI candidates.",
  "DPU track: cliffs DTB mdss_mdp@0xae00000 (sde-off 0x1000, VIG 0x5000/0x7000, CTL0 0x16000, INTF1/2 0x36000/0x37000, PP0 0x6a000, LM0 0x45000), apps_smmu 0x15000000 display streams SID 0x1c00 mask 0x02."]
configuration = ["Kernel arguments offline-legacy-* (register, gop, phase 4), offline-mobile-graphics-load=1.",
  "offline-legacy-base-present=1 and offline-legacy-noconsole=1 gate the own-present path (the gpu-framepresent v2/v3 verified set); without base-present presentBase returns at its first line and the screen stays on the boot frame.",
  "The GPU track arguments (sheng-gpu-power=9, sheng-gpu-metal=1, offline-mobile-graphics-client=1, sheng-gpu-pool=0, sheng-fb-gpu=0) restore the compositor's 1200-byte overlay records whose layer 6 frame the own-present path resolves.",
  "The default-surface fallback is disabled so only resolved overlay surfaces present.",
  "DPU track: uke-dpu=<1|2> runs the read-only live DPU snapshot (default off); uke-dpu-test=<1..4> runs the bounded controlled-pipe test (default off); uke-dpu-scanout>=1 builds the display bank's stage-1 window in NativeUfs (default off)."]
procedure = ["Build the legacy display archive and boot with the offline-legacy arguments."]
findings = ["The present chain resolved the overlay layer and put real UI on screen (white lock screen, home indicator, swipe prompt).",
  "A blank after a few seconds was the blank/idle transaction falling back to the pure-black default surface; v3 presents only resolved overlay surfaces.",
  "2026-10-28 fmt2 boot: the swap path rejects every frame (UKE: swap accepted=0 reason=2 surface=0) and the screen stays on the boot console while the system runs fully in userland; identical to the 2026-10-27 session, so the patch adoption is not the cause.",
  "2026-10-28 root cause: those frozen-screen runs never set offline-legacy-base-present=1, so presentBase returned before doing anything and never logged; the accepted=0 reason=2 surface=0 line is the self-kick's pre-translation validation (the request's +2624 surface slots fill only inside the original swap_submit), not an own-present resolution failure.",
  "presentBase now also honors the family's own second rule from swap_submit: a record ID equal to the default surface's ID names fb+0x1618 directly (the CPU-renderer 1288-byte records name that surface on layer 0).",
  "The Data seed handoff is closed out: the scratch Data mount panic (ENOENT at kern_exec.c:8196) was a missing PackedRAMDisk/TrustCache handoff in the test payload, fixed by wiring data-seed-200/owner-data-200.dbr and the owner trust cache into unixnu.local.toml.",
  "DPU archaeology: the cliffs DTS block offsets minus sde-off (0x1000) equal the DPU 9.x anchors sheng's DisplayTimingProbe uses (VIG0/1 0x4000/0x6000, CTL0 0x15000, INTF1/2 0x35000/0x36000, PP0 0x69000, LM0 0x44000); the stock DPU driver in this drop stops at DPU 7.x, so the DTB plus the live firmware snapshot are the register authority.",
  "DPU surface addressing: the display streams are SID 0x1c00/0x1c02 with qcom,handoff-smrs in the cliffs apps_smmu node; the pipe address registers are 32-bit while XNU memory starts at 0x8C0000000, so scanout needs the ShengUfs display-bank stage-1 window (ported as native_ufs_dpu_map in NativeUfs).",
  "P2 (gpucomp26): the compositor's two-plane 'b3a8' frame is scanned by the DPU natively. Plane 0's 4 B/texel colour words (rows 4*width apart) are XRGB2101010, whose SSPP SRC_FORMAT 0x000276ff is the firmware's own ARGB8888 word 0x000237ff (unpack 0x03020001) with alpha bit 8 clear and DX bit 14 set, per the stock dpu_hw_sspp_setup_format/dpu_formats.c in the reference kernel; plane 1 is the alpha byte, whose row is the record's stride field. The 34,177,024-byte frame maps only its 27,340,800-byte plane-0 prefix into one slot; the CPU decode remains the fallback when the display-bank window is unavailable.",
  "gpucomp26 log (recovery, userdata window, t=16..917 s): UKE DPU: direct ready fmt=000237ff/000237ff unpack=03020001 tenbit=000276ff; four b3a8 frames mapped by their plane-0 prefix (direct slot ... bytes=27340800); UKE DPU: tenbit sample p0=18060180 p0c=37edfb7e alpha=ff/ff, so the alpha plane is 0xFF, the frame is opaque and the XRGB2101010 word order is the right one. One stall snapshot at t=78.4 s and none after; GPU commit-to-complete still averages 50.9 ms over 8884 commits in 893 s (about 9.9/s).",
  "gpucomp27 ports the upstream display's refresh tick (GopFramebuffer 33e941a): startVsync/vsyncTick/armVsync, getRefreshAttributes at slot 301 and setDisplayRefreshProperties in registerService, with the builder binding _native_legacy_vsync_notify (0xfffffff005796720) and _native_legacy_set_refresh_properties (0xfffffff00579ebb8) after checking the original bytes; board.toml sets sheng-vsync=120 (armcpu-diagnostics dropped to stay at 987 of 1000 command-line bytes). The direct path now prints UKE DPU: flip n=... tb=... skip=... fb=... latch=...us max=...us vsync=... every 120 frames and the first eight UKE DPU: skip lines, so the next log separates compositor starvation from display-path loss.",
  "gpucomp27 counters: flips ran at 10-28 fps with skip=0 and fb=0, so the display path drops nothing; the latch waits for the frame boundary (mean 4.1 ms, max 8.4 ms, one 120 Hz frame) and the flip is tear-free. The compositor commits every 85-100 ms when idle and 12-30 ms in bursts, one full-screen pass with 60 draws over 6.68 Mpx per frame, commit-to-complete 27-41 ms; the GMU perf vote is accepted (X v0/0, index 9 = 950 MHz, bandwidth 6), so the frame cost is fill work, not clock.",
  "Flicker root cause found in the display code: dpuSlot rotated the four slots round-robin and could pick the slot the pipes were scanning, remapping that IOVA to a new surface while the pipe still fetched the old frame, one mixed frame per burst of new surfaces (app transitions, blur effects). gpucomp28 selects by LRU and never the shown slot (upstream directSlot rule) and records it after each flip.",
  "gpucomp28 also removes the one-frame delay: CoreAnimation completes its command buffer before submitting the swap (the runtime WC row is its waitUntilCompleted, 29 calls, 738 ms), and upstream flips the submitted surface; the delay only added up to a whole frame of display latency (about 100 ms at 10 fps).",
  "Open on the GPU side: SR 5 refusals of 3200x2136 surface textures (pf80 BGRA / pf554 ten-bit) with OutOfMemory(Device), and 220 GB of shadow copy-backs (J surface cache) over a 320 s run; both may add cost to the compositor path and need a separate look.",
  "gpucomp29 counted 22 drained and 1298 busy flips: the GPU ring was non-empty in 98 percent of flips, so holding each frame one swap longer did not mean holding a complete one (the compositor submits before its work retires). That is why transitions and blur effects kept flickering and why the first seconds after boot flashed black.",
  "gpucomp30 gives the direct path a completion fence: dpuPrepareFrame does the sleepable work (slot mapping, source format) at swap time, a work-loop timer polls native_gpu_idle (the CP ring drained) every 500 us and only then writes the registers (dpuFlipPrepared), forcing the flip after 30 ms and counting it (fence=drained/forced) so a ring that never drains cannot freeze the panel; dpuSlot now avoids both the shown and the pending slot and a newer frame replaces one still waiting.",
  "The CPU levels are logged again without a new boot argument: CpuFreqProbe runs its read-only mode on the GPU track (sheng-gpu-power>=9), reports the level each EPSS domain runs at (f<MHz>, LUT[perf_state]) and logs UKE CPU: ...; the windows are 0x17d91000/0x17d92000/0x17d93000, referenced by the vendor crash-dump link lists.",
  "gpucomp30 showed that CP_RB_RPTR==CP_RB_WPTR is not a completion signal (the CP has read the commands, the pixel work may still run), so that fence behaved like the unfenced gpucomp28: everything that moved flickered.",
  "gpucomp31 takes the fence from the only party that knows: the plugin Metal runtime. NativeGOPWire gains NGP_DIRECT ('DIRC'), the presenter offers it when sheng-fb-gpu=1 and uke-dpu-scanout>=3, the client waits in NBWaitInFlight for every command buffer committed before the offer (exactly this frame's work, the earlyOn gate removed) and completes, and the display flips its pipes in that completion (completeDirect) with a 100 ms watchdog that drops an unanswered frame; clients without the mode are refused and the display keeps its own timing.",
  "The plugin had to be rebuilt for the direct mode (CDHashes c063675e/4be6b25b/ee022a5f, owner trust regenerated, addon blob 21,178,648 bytes, 12 entries). On Linux the plugin build must not pass -fuse-ld=lld: the iOS xcrun wrapper already injects --ld-path to its ld shim, and the two together hand clang driver flags to ld64.lld.",
  "gpucomp37 measured the GPU path itself: a 27 MB fill takes 14.8 ms (1.76 GB/s) and a copy 13.9 ms (3.75 GB/s), so the compositor's ~67 MB of shadow traffic per frame is about 18 ms before any rendering. The bottleneck is GPU-to-host memory throughput, not shading.",
  "Upstream was fetched with its feature branches: NativeAdreno feat/ipados27-gpu-parity (14 commits, 2026-10-29 02:39) carries the work that targets this exactly - cache maintenance counted per phase with uncached imports skipped (its message: the 1.5 GiB pool took 41 ms with preemption off), no XNU contiguous search when the pool exists, BO pool growth in chunks, on-demand GPU page tables, msm hangcheck with restart. ArmSmmu4K has the matching feat branch (30ec63b, page tables on demand).",
  "gpucomp38 is those branches merged: our nine A732/GMU commits rebased onto the adreno feat branch with the conflicts resolved (borrow and adopt side by side, the GMU pool adopt taking only the five payloads because page tables are on demand now, the GPU pool adopt for the five buffers, at(i) for the grown entry table, dropViews split into a locked form and a wrapper), plus a weak native_pmap_user_mappings stub and a UKE GPU: maint phase row. The SMMU kit is the feat commit; the build needs --local-module kit:ArmSmmu4K= that checkout.",
  "Local toolchain fixes on the way: build-arm-driver.py dropped the recipe's -Wno-missing-designated-field-initializers and -Wno-unused-but-set-global, which made clang reject the XNU headers and then assert inside RecordLayoutBuilder (the earlier 'clang frontend command failed due to signal'); both are back, and a compile that dies by signal is retried.",
  "The upstream feature branch was merged and boots: gpucomp46 (kernel 15ad83d8, payload 48967bf0) ran 918 s with conn switch=0 cp=0 mode=1 mount=0/0 shared=0 tables=10/1 in=31 out=40, o2/0/1 and fence=4892/28 (99.4 percent fenced, drops down from 11-12 percent), gpu=12.1 ms offer-to-completion. The per-process client address space works on the fused 31-bit aperture because clientWindow() places every client at 0x10000000 + 1.75 GiB (its own page tables make the same window free for all of them); createVm, setScope and the client opens then all succeed.",
  "A later boot of the same image panicked with OSMetaClass::applyToInstances+0xf4 (caller OSKext::loadExecutable, pc 0xfffffff007904548, esr 0x56000004 SVC, x8 NativeLegacyDisplay::getMetaClass); the string resolves to '>maxDepth' at libkern/c++/OSMetaClass.cpp:1118, i.e. a metaclass superclass chain deeper than sDeepestClass. That is kernel data being overwritten, and it appeared only after the feature branch's per-process address spaces and on-demand page tables, intermittently (one boot 918 s clean, the next panics during kext load).",
  "The gpu_qcom_scm aperture call (SVC_MP 0x0c / cmd 0x1b, ARGS(4)) succeeds for context banks 0-3 but the SMMU keeps reporting a 31-bit stage-1 input (in=31), so the upstream 2^ias model cannot be used here; the client window is what adapts instead.",
  "Panic capture: the pram hand-off (uke_panic_flush) produced no UKE PANIC line and a variadic call to the kernel printf printed only the prefix (Darwin passes variadic arguments on the stack), so the panic screen now copies its text into uke_panic_shadow (exported by the probe) and the probe heartbeat prints it; the screen also mutes the console on entry and draws only the message at scale 3.",
  "The revert to the bootable baseline exposed how a local build picks its driver: feeds.toml's Adreno740 commit (f1a2aee, the m9f-era tip) is documentation only for a local= source, and the build stages whatever that checkout has. gpucomp47/48 therefore built with f1a2aee and rendered on the CPU, while the image that rendered on the GPU was gpucomp37, built from uke-a732-single @ c950906 (the local A732 commits rebased onto upstream perf/gpu-smoothness). The two payloads' kernel.macho symbol tables settle it: gpucomp37 has retiredReaper, NativeAdrenoRing::kick/writeWptr, native_adreno_stall*/ring_window/wptr_fence/unstick, AGXDeviceUserClient::dropViewsLocked and NativeAdrenoHandleIndex; f1a2aee has none of them. gpucomp49 (driver c950906, plus the probe's pool_mib write before bring-up and the {1,9,6} initial HFI vote that the same commit had) has exactly gpucomp37's kernel size (52,281,344 B) and differs only in __LINKEDIT (216 B) and the six omitted feat telemetry symbols; user-verified on device on 2026-10-29.",
]
completion = ["A known frame appears with correct geometry and colors and stays up."]
limits = ["The GPU compositor now renders through the mainline stack (Adreno740 5c8c145, ArmSmmu4K 3ba9245, AdrenoMetal ce5e19e, Turnip rebuilt for the new driver ABI); uke-dpu-scanout=3 scans the compositor's BGRA surfaces directly with a one-frame delay, about 15 fps on device.",
  "GPU commit-to-complete averages 51 ms (9.7 commits/s, worst 1.1 s) over 8892 commits, with 6 failed commits; STATUS3 bit24 (SMMU stalled) during KaleidoscopePoster blur effects, recovered by the upstream stall handler after about 1 s.",
  "b3a8 two-plane frames now present through the direct path; the CPU plane decode remains only for a board without the display bank's stage-1 window.",
  "The direct path still polls CTL_FLUSH synchronously (cap 100 ms, measured about 1 ms) and delays one frame; the upstream non-blocking latch timer is not ported yet and the display/DRAM bandwidth vote is still missing."]
next_action = ["The baseline is gpucomp49 (driver c950906, display cd8a7b2, metal 739de5b, feeds pinned to c950906): GPU compositing through the DPU direct path with the plugin fence, about 30 fps on device.",
  "The parked feature track (docs/DPU-TASKS.md §28) resumes with isolation tests: single client, forced shared VM, sheng-gpu-ttbr=1/2, then TTBR0 switching timing and a memory canary, to explain the OSMetaClass >maxDepth corruption before the per-process address spaces are adopted again."]

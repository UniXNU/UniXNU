schema_version = 1
# First written 2026-11-08 from the uke repository's porting.toml, with the area ids kept identical
# so the two records read side by side. Status vocabulary is the schema's own: device-verified /
# host-verified / implemented / planned / not-applicable. There is no "unknown": work with no
# citable evidence is `planned`, and an area with nothing to do is `not-applicable`.
#
# The record describes the repository's single board: iPadOS 27.0.1 / 24A446 (board.toml, format 2).
# The 17.7.11 / 21H461 line is archived at tag `line-ipados-17` (docs/IPADOS17-ARCHIVE.md) and its
# results appear in findings, marked as the 17 line.
#
# evidence.revision is the commit the result was recorded at — 40 hex digits, because the checker
# compares it against the repository. Where the original entry carried a round number or a
# timestamp instead (u159, "2026-11-08 16:13"), that text is kept inside result as
# "; recorded <text>", so nothing is lost when the commit takes its place.

[device]
name = "muyu"
soc = "SM8635"
os_profile = "ipados-27.0.1-24A446"
summary = "Muyu, iPadOS 27.0.1 (24A446) line as the repository's official format 2 board: payload reaches APFS SystemCryptex mount and owner-cache enumeration (panel photo 2026-11-08 14:36); the panel is the only log channel — USB CDC ACM (blocked at DEPCFG, 16 probes accepted / 0 executed) and the Linux pstore/init_boot-reader were abandoned 2026-11-08 and their code removed the same day (docs/ABANDONED-CHANNELS.md); device restored to stock 2026-11-08 16:18 with no recorded reason. 17-line desktop (CPU-composed ~1.4 fps) predates this ledger. GMU cold start + full HFI device-verified 2026-10-30; GX rail blocked; GPU paused since 2026-11-02. The 17.7.11 (21H461) line boots to a CPU-composed desktop (~1.4 fps) and is archived at tag line-ipados-17 (docs/IPADOS17-ARCHIVE.md). See docs/HANDOFF-2026-11-08.md and STATUS.md."

[[area]]
id = "configuration"
status = "host-verified"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink"]
paths = ["board.toml", "feeds.toml", "unixnu.lock", "configs/muyu-userland_defconfig", "patches/xnu-27/"]
inputs = ["board.toml is the board (schema_version = 2, soc_source = sm7675, os_profile = ipados-27.0.1-24A446). It is the only board file in the repository; the 17 line is the tag line-ipados-17.",
  "The SoC layer is pinned in feeds.toml (kind = \"soc\", name = sm7675) at 7f857a8, and unixnu.lock records the same commit, so the two cannot drift.",
  "24A446 kernelcache sha256 38e6d9fa5f789b82... — the same OS-profile member the uke line prelinks against (kernel.json inputs.kernelcache_sha256).",
  "Framework: the ../UniXNU checkout (one framework, upstream main merged plus the 27-line commits), output under out/muyu/ipados-27.0.1-24A446/muyu-userland/."]
configuration = ["schema_version = 2, SM8635 device on the sm7675 24A446 OS profile, muyu kit. Patch series is four layers, the shape UniXNU-uke uses: arch:patches/xnu/series (64) + soc:patches/xnu-12377/series (2: sheng-platform-power, native-smp-secondary) + os:patches/xnu/series (4) + device:patches/xnu-27/series (4) = 74. unixnu status --json prints the resolved order, and scripts/audit-27-config.py fails if its own count differs.",
  "105-token boot config identical across u150-u157; u158/u159 drop exactly muyu_usb=1 muyu_usb_panic=1."]
procedure = ["cd UniXNU; ./unixnu build kernel -D ../UniXNU-muyu; ./unixnu build payload -D ../UniXNU-muyu --data-ramdisk fw/data-seed.img --trust-cache fw/trust-24A446/24A446-original-trust.bundle",
  "python3 UniXNU-muyu/scripts/patch-vendor-boot.py --base /tmp/vendor_boot_base_96m.img --payload <out>/payload/payload.img --output fw/vendor_boot_27-uNNN.img"]
findings = ["The repository builds the 27 line from a clean checkout since 2026-11-08 22:30. Before that the 27-line config lived only in a temp tree, then in a second board file that had to be copied over board.toml; the board was promoted in place and the temp path is no longer a build input.",
  "u152-u159 kernel version strings all read '(u151)': the device source was not bumped after u151; multi-MB image diffs between rounds are consistent with LTO/layout churn plus payload repack, and the u157->u158 delta is exactly 989 bytes (FAT timestamps, random-seed, boot-args region).",
  "Last build (16:13) reports mapping_complete=false, runtime_qualified=false, loadable=false, allow_missing=true, missing AppleARMWatchdogTimer + IOHIDFamily, 26 stub sites, Image4 personality dropped; it was flashed anyway (u159) with no recorded decision.",
  "CLEANUP 2026-11-08 21:20, restructured 22:05, format 2 22:30 (maintainer: 'the 27 line is many AIs handing over, keep it clean', then 'follow the 17 line structure', then 'the repository is not in the official format'). The 27 line could not build itself from this repo, and four smaller faults hid behind that. (1) The series was declared by the board and here, but had never been committed; patches.py does not glob and does not fall back — it raises 'patch series missing' and stops — so every u-round was built from a temp tree whose copy of the file existed only there. (2) That recovered file pasted the framework patches in as 67 absolute paths plus 5 device patches (72). It has been replaced by the layered form the framework and uke actually use — arch/soc/os/device, each resolved into its own checkout — so the device layer is now only patches/xnu-27/series and nothing in it can fall out of step with the framework. (3) The two lines shared one patch directory, and a schema_version 1 board globs patches/xnu/*.patch: the 27 line's 4 patches were being applied to 17-line kernels, and a 17-line patch parked in a backlog/ subdirectory was silently dropped from them. Split now — patches/xnu/ = 17 line (16 patches, archived with tag line-ipados-17), patches/xnu-27/ = 27 line (4 patches, listed) — and scripts/audit-27-config.py fails if the two overlap or if the series and its directory disagree. (4) native-source-storage=1, -bravearkdeferredconsole and muyu-ignition-trace=1 had no parser in any checkout; the first two are uke's names (-ukedeferredconsole / uke-ignition-trace) and for ignition u44's sysctl two-liner only ever existed in the temp tree, so IPADOS27-MIGRATION §6.58.2 is not reproducible from here. All three are comments now. (5) configs/muyu-27-defconfig never existed; the board names configs/muyu-userland_defconfig. (6) The SoC layer was documented as one patch from a private sm8635 repository while the board actually resolved sm7675 through feeds.toml; the audit now reads soc_source and the count is 2, not 1.",
  "FRAMEWORK CONSOLIDATION 2026-11-08 22:40, which resolves the deviation recorded at 21:40: the 16:12 build resolved its compatibility patches through the core UniXNU checkout while this record said UniXNU-27, and the two had drifted (offline-owner-boot-manifest, offline-owner-systemos-mount, zzz-boot-progress differ). The fork was unshallowed, merged onto upstream f924843, and the eight 27-line commits that existed only in the old clone were merged in on top, so ../UniXNU is now the one framework for both lines. The old clone is frozen as a reference; the porting audit reports a single checkout and cross-checks its patch count against unixnu status --json."]
completion = ["defconfig/kernel/payload build completes and the prelinked MH_FILESET kernel.macho is produced; boot config embedded in the payload is machine-readable from the images."]
limits = ["No manifest/hash verification of the packed image (uke's release/verify step is not used). The unqualified-final-build policy is undocumented."]
next_action = ["Record why the 16:13 unqualified build was flashed; decide a policy for loadable=false candidates; keep board.toml the single board file (the 17 line is a tag, not a second board)."]
evidence = [
  { kind = "host", reference = "docs/HANDOFF-2026-11-08.md", result = "u158 = u157 + 989 bytes: FAT timestamps + chosen random-seed + boot-args region removing muyu_usb/muyu_usb_panic; recorded images fw/vendor_boot_27-u157.img 27507b1e... / u158 0bf6ba5f... [§3]", command = "python3 diff-clusters vendor_boot_27-u157.img vendor_boot_27-u158.img", revision = "714179fd56cf909e3725e9c6681eb76fa253075b" },
  { kind = "host", reference = "docs/HANDOFF-2026-11-08.md", result = "kernelcache_sha256 38e6d9fa... equals the uke-recorded 24A446 member; candidate 95,764,480 B sha256 7b083c24..., loadable=false; recorded 2026-11-08 16:13 build [artefact: kernel/kernel.json]", command = "cat out/muyu/ipados-27.0.1-24A446/muyu-userland/kernel/kernel.json", revision = "0000000000000000000000000000000000000000" },
  { kind = "source", reference = "board.toml", result = "format 2 board promoted in place: schema_version = 2, soc_source = sm7675, os_profile = ipados-27.0.1-24A446, four-layer patch_series" },
]

[[area]]
id = "firmware"
status = "implemented"
components = ["DarwinBoot", "Mu-Silicium"]
paths = ["scripts/patch-vendor-boot.py", "fw/stock/"]
inputs = ["Mu-Silicium UEFI fd packed into boot.img (2.1 MB), built 2026-11-05 and reused since.",
  "Stock vendor_boot template (/tmp/vendor_boot_base_96m.img) patched with the payload ramdisk."]
configuration = ["boot partition carries the UEFI fd; vendor_boot carries the XNU payload via patch-vendor-boot.py; ABL boots the init_boot ramdisk (stock Android) — see diagnostics."]
procedure = ["tools/muyu-flash-mode.sh xnu fw/vendor_boot_27-uNNN.img (preflight + flash vendor_boot + fastboot boot boot.img, all ledgered)"]
findings = ["The vendor_boot patch pipeline has been exercised hundreds of times per the ledger (2651 rows) without a packaging failure.",
  "The EDK2/UEFI artifact is a 2026-11-05 build not regenerated by the current flow; UniXNU/out deletion would lose it (UKE-FULL-WALKTHROUGH §5, unchanged)."]
completion = ["UEFI menu boots the payload entry from vendor_boot on this device."]
limits = ["UEFI firmware itself is not rebuilt by the current flow; no verify step; 'firmware' here means the boot path, not a re-qualified FD build."]
next_action = ["Regenerate boot.img from Mu-Silicium sources once, record its sha, and add it to the ledger as a build step rather than a reused artifact."]
evidence = [
  { kind = "device", reference = "docs/HANDOFF-2026-11-08.md", result = "hundreds of preflight+flash vendor_boot+boot rows with rc=0 through 2026-11-08; recorded u159 2026-11-08T08:14:20Z [artefact: logs/flash-ledger.tsv]", command = "grep -c preflight logs/flash-ledger.tsv", revision = "714179fd56cf909e3725e9c6681eb76fa253075b" },
]


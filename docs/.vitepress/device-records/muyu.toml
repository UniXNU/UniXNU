[[area]]
id = "memory"
status = "planned"
components = ["ArmDTPlatform"]
paths = ["board.toml", "docs/ABANDONED-CHANNELS.md"]
inputs = ["board.toml [kernel.prelink] carries owned_memory_size = 0x130000000 (4.75 GiB) and dram_size = 0x80000000, the SMEM RAM table value read from the device.",
  "Boot arg kt_fixed_zones=120 in the active config; no bank map, no jetsam or zone-growth observation has been recorded for either line."]
configuration = ["The kernel is given one owned-memory window; the rest of the physical map is governed by the device tree the payload generator compiles from dts/muyu.dts."]
procedure = ["Build the payload, boot, and read the owned-memory figure the kernel prints next to the page-table setup; compare it with 0x130000000."]
findings = ["Nothing is measured. The 17 line boots with this window, which says the inherited braveark SM8635 layout is not obviously wrong, not that it is qualified.",
  "The 3 GiB and 2 GiB windows were tried on the 17 line and neither fixed the boot-task timeout (board.toml comment next to owned_memory_size); the window was returned to 4.75 GiB without a memory-side explanation."]
completion = ["The owned-memory window the kernel reports equals the board's value on the 27 line, and one boot records the page-table size it implies."]
limits = ["No owned-memory figure, no bank map check and no jetsam observation on the 27 line: this area is planned, not implemented."]
next_action = ["Take the owned-memory line off the first trustworthy screen capture once the screen channel is re-planted (docs/SCREEN-ONLY.md §4), then record it here with the commit it was read at."]
evidence = []


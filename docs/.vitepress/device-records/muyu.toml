findings = ["DECISION 2026-11-08 17:30: USB CDC ACM and the Linux-side log path (init_boot-reader v1-v4, pstore/ramoops) are ABANDONED; the panel is the only output channel. Rationale: USB produced no conclusion in ~29 rounds, the Linux path was never even flashed, while the panel produced a conclusion every round since u143. See docs/SCREEN-ONLY.md.",
  "[abandoned] USB CDC ACM: ~29 rounds (u128-u159) without a working enumeration; final failure is DEPCFG queued-never-started with the UTMI/eUSB2 PHY apparently suspended (ConnectSpeed reads Full-Speed while dcfg DevSpeed=0/High-Speed); the SUSPHY clears were ordered after endpoint commands, too late for DEPCFG (§60.3).",
  "[abandoned] Twelve of the u136-u147 rounds measured a core that our own reset path had wedged — invalid readouts; the two effective turns were u143 (state onto the framebuffer) and u148 (56-row log page): after the observation method was fixed, three rounds reached 'only DEPCFG left'.",
  "[abandoned] The pstore/init_boot-reader channel was built (v3/v4) and host-verified for header/layout only; it was never flashed or run.",
  "Panel readout is device-verified as THE working channel: every conclusion since u143 came from photographs of the framebuffer. Engine lives in osfmk/console/video_console.c (575 uncommitted lines) and is now rescued into drivers/MuyuDebug + patches/xnu/wip/muyu-screen-wip-20261108.patch.",
  "Version tag discipline is broken: the round number is hardcoded per printf (one image carries both '(u151)' and '(u155)'), which made the 11-08 round reconstruction draw a wrong conclusion until corrected in HANDOFF-2026-11-08 §3.5.",
  "CORRECTION 2026-11-08 17:50 (maintainer): the screen capabilities were NOT missing — the iOS 17 line (21H461) already implemented single-source build tags (sheng-build-tag -> BootProgress.c:194,509), auto page rotation (BootUiTraceProbe.c page=(seconds/8)%pages with a 'STACK64 n/pages' label, present as a string in the flashed 17-line images), panic replay (BravearkLastLog.c pram FUNK printed by the next boot + ramoops ring), crash-report rendering (MuyuCrashLog.c, muyu-crash-* in the flashed images), watchdog autoreset (sheng-autoreset), the 48-row diagnostic page, and a dozen check-boot-*.py validators — all archived verbatim in package/ (= kits/muyu/ on the 27 tree). The 27 kernel simply dropped them at link/config time: only _boot_progress_poll/_tag remain, no STACK64, 25 boot args vs the 17 line's 68. See docs/SCREEN-ONLY.md §3.",
  "Honest caveat: the flashed 17-line builds also ran the BootProgress layer as weak stubs (LegacyDisplayStubs.c: 'the first-console configuration disables the BootProgress layer'; every muyu defconfig has CONFIG_XNU_BOOT_PROGRESS unset; the one config that sets it, muyu-full-plus_defconfig, self-declares 'does not build from a clean tree yet'). The 17-line panel showed console text + STACK64 + MUYU probe rows, not the 48-row page. Porting = enabling the layer, not writing it."]
completion = ["Framebuffer log pages give full boot context from a single photograph; that is the accepted, only channel."]
limits = ["No real-time channel; information is capped by panel area (~230x40 chars per page) and requires a person to photograph; nothing is machine-readable; event ordering relies on tick numbers printed on the page; a dark panel loses everything, so the pram panic page is the lifeline."]
next_action = ["Per docs/SCREEN-ONLY.md §4, port back instead of designing new: set CONFIG_XNU_BOOT_PROGRESS=y + CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y on the 27 defconfig, relink BootProgress/BootUiTraceProbe/BravearkLastLog/MuyuCrashLog from kits/muyu via the existing build-native-legacy-display.py and build-boot-log.py, put sheng-build-tag on the vendor_boot cmdline, then run the check-boot-*.py suite as the flash gate. (The files.arm64 USB registration was already dropped with the driver on 2026-11-08 — the wip screen patch now registers only muyu_debug.c.)"]

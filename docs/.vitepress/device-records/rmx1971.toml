[[area]]
id = "diagnostics"
status = "device-verified"
components = []
paths = ["package/BootProgress.c", "package/BootFaultProbe.c", "package/BootDiagExport.c", "board/realme/rmx1971/**"]
inputs = [
  "Log transport: the framebuffer only. No UART on retail units, and the USB gadget never enumerates.",
  "U-Boot side: environments compiled into the image, since nothing can be typed at its prompt.",
]
configuration = [
  "Kernel: boot-progress=2 selects the full panel; the console pane keeps the latest seven lines.",
  "U-Boot: four environments (main, probe, diag, usb) are separate builds because CONFIG_ENV_DEFAULT_ENV_TEXT_FILE is compiled in.",
]
procedure = [
  "Read the stage line and the eight PC samples, then resolve a PC against the kernel's LC_SYMTAB.",
]
findings = [
  "Every PC sample landing on _machine_idle is what distinguished 'waiting for a root device' from a crash; the same method identified the vfs_mountroot retry loop from the stage history.",
  "The panel's stage line is the only place a driver message survives, so the UFS driver writes its verdict there instead of relying on printf.",
  "A three-image set made the ABL behaviour observable: boot.img (the real thing), boot-probe.img (sleep 15; reset, proves bootcmd was reached) and boot-stub.img (300 bytes of assembly that paints the screen and resets, proves the ABL jumped).",
]
completion = [
  "Any boot failure can be attributed to a phase from the panel alone, without a serial port.",
]

paths = ["drivers/ShengUfs", "package/OdinUfsBoard.h", "package/OdinUfsTransport.h", "package/OdinUfsTransport.c", "package/OdinUfsGcc.h", "package/OdinUfsGccTests.c", "package/ufs/NativeUfs.cpp", "package/ufs/GccUfs.h", "package/ufs/README.md", "package/OdinUfsSmmu.h", "package/OdinUfsSmmu.c", "package/OdinUfsTransportTests.c", "package/OdinUfsSmmuTests.c", "scripts/*ufs*", "scripts/*storage*", "scripts/*userdata*", "scripts/*root*"]
inputs = ["Controller, PHY, clocks, reset and power, SMMU, DMA, handoff, storage layout and OS interface, each with a source and an owner (docs/porting/ufs.md hardware inventory)."]
configuration = ["board.toml [userdata] now carries the measured geometry: first_lba 2967552, last_lba 61844474, lba_bytes 4096, with the OS and Cryptex1,SystemOS windows.", "dts/odin.dts inherits the exported ufshc and ufsphy nodes from sm8350.dtsi; both windows align inside a non-zero 16 MiB arm-io base, so unlike the touch engine the storage driver can live in the kernel.", "configs/odin_defconfig leaves CONFIG_XNU_NATIVE_UFS unset - not because the component is missing, it is selected and built, but because the flags open a link chain this port has not closed (limits); native-ufs-root=1 is added with it and never before. The plan is now consistent, so the archive build no longer refuses; what the flags do at link time is recorded in the experiment below, and the kernel does not force-load the driver until a known block has been read back on the unit.", "Selection is now the documented shape rather than a board-only recipe: ShengUfs is in the complete [components] include array, feeds.toml pins its source to package/ufs (so the tree's drivers/ShengUfs is a link into this repository and unixnu status reports origin local (feeds)), and [kernel] archives now names the storage family after the arch profile's own entries. Writing that list out was forced rather than chosen: archive_plan() takes the merged board table, profiles/arch/arm64/profile.toml supplies an explicit eight-entry archives array, and arrays replace inherited arrays - so with three more selected kernel-stage components and no position for them, the kernel step stopped with \"[kernel] archives needs component entries for: RamBlock, ShengUfs, VirtioMmioBlock\". The claim recorded here earlier - that an absent archives key means implicit, therefore everything selected gets built, which is why libArmCpu.a, libArmDTPlatform.a and libSoftwareAES.a exist - is withdrawn: those three were built because the inherited arch entries name them. The cost of the restatement is drift: if the arm64 profile gains a recipe, odin's copy silently omits it.", "The catalog's revision pin (99d8bcd3) no longer describes the bytes for this board: a locally pinned module reports its revision as the device repository's own commit, so the fork's provenance lives in package/ufs/README.md and in git history. RamBlock is selected as well, because it is the caller that sizes and opens the Data store, and the contract between the two archives was checked rather than assumed: nm -u on build/ram-block/libRamBlock.a (301472 bytes, built by the catalog recipe with the same object audit) asks for six native_ufs_store_* names and nm --defined-only on odin's libShengUfs.a defines exactly those six - which matters because the imports are weak, so a missing export would not fail the link, it would fail the address test at NativeRamBlock.cpp:89 and leave the store silently never opened. XNU_NATIVE_RAM_BLOCK=1 additionally requires XNU_NATIVE_AES=1 (build-xnu-4k-baseline.sh:214-219) and odin already resolves CONFIG_XNU_NATIVE_AES=y, so that gate is met today. What this tree does not have is the CONFIG_XNU_NATIVE_UFS_ARCHIVE a sibling device record passes for its own fork: line 639 hardcodes UFS_ARCHIVE to build/sheng-ufs/libShengUfs.a and grep finds no such variable here, so pointing the pipeline at that path is the contract, not a workaround. Archive digests are no more build identifiers than the FD's were: rebuilding the same source through the same recipe moved build/odin-ufs/libOdinUfs.a from 130b09aa to 007aa5f0, because ar records timestamps - so a digest says which instance ran, not which bytes are in the kernel."]
procedure = ["Inventory from the vendor tree, then transcribe the reviewed ShengUfs contract (adopt sequence, UTRD and UPIU packing, completion policy, SMMU takeover, write windows) into package/OdinUfs*.{h,c}.", "Assert every byte of the descriptors and every write order against a scripted controller and a scripted SMMU on the host: sh package/run-tests.sh.", "On the device, run the read-only milestones in order: registers, DMA, one command, capacity and known blocks, root mount, persistence."]
findings = ["UFS host window 0x1d84000/0x3000 with inline crypto at 0x1d88000/0x8000 and its HWKM at 0x1d90000/0x9000, GIC_SPI 265, two lanes per direction, QMP phy 0x1d87000/0xe10, apps SMMU stream id 0xE0.", "The unit's LUN 0 uses 4096-byte logical blocks while the GPT is addressed in 512-byte LBAs: /sys/class/block/sda33 reports start 23740416 and size 471015384 in 512-byte sectors, fastboot's partition-size is 0x38263FB000, and both divide by eight exactly. The eUFS part is a Samsung KLUEG8UHDC-B0E1 (rev 0200).", "Resolved: the board's eUFS is clocked by the GCC_UFS_PHY_* family (CFG 0x77010 AXI, 0x77018 AHB, 0x7705c UNIPRO, 0x77064 ICE, 0x770cc aggregate; RCGs 0x77024 with mnd_width 8, 0x7706c and 0x77084 with mnd_width 0; BCR 0x77000, GDSC 0x77004). The 0x75xxx card family belongs to an external slot. og_ufs_phy_enable() programs it and refuses to write M/N/D into an mnd_width=0 RCG.", "The host window, the GDSC address and the apps SMMU physical base are identical on SM8550 and SM8350, so the UFS controller IP carries over; the divergence is the PHY window (0x1d80000/0x2000 vs 0x1d87000/0xe10), the stream id (0x60 vs 0xE0), the SMMU compatible (arm,mmu-500 vs qcom,qsmmu-v500) and every GCC branch offset. 0x77018 means AXI on SM8550 and AHB on SM8350: an offset imported by analogy would clock the wrong branch.", "Two refusals in the upstream SMMU planner are dead ends on this generation, and the sibling SM7475 port proved it on hardware: the candidate-bank scan stops after the top eight, and an exclusive firmware mapping of our own stream onto another bank is refused as a conflict. OdinUfsSmmu.c keeps both refusal strings, scans every bank, and adds a takeover mode that resets the firmware's bank to a clean bypass context after proving no other stream points at it.", "Completion policy is deliberately unforgiving: a timeout or a fatal interrupt bit quarantines the host and the buffer stays allocated, because the controller may still own that memory with the doorbell back at zero. No cancel, no reset, no retry.", "The gate to a component, not to the porting layer: scripts/build-arm-driver.py compiles a driver archive against XNU source-build compile records (build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/iokit/DEVELOPMENT/IOPlatformExpert.cpo.json). The claim recorded here on the strength of one FileNotFoundError - that odin has no such records, that its kernel step is only a patched prelinked cache, and so that a storage driver cannot be built on this machine - was wrong and is withdrawn the same day: those records do exist, 528 MB of ios-obj with 123 cpo.json files under the assembled device tree, three driver archives were already built for odin from them (libArmCpu.a, libArmDTPlatform.a, libSoftwareAES.a, each logged -Werror build and arm64-apple-ios17.0 object audit passed), and an unmodified SM8550 storage driver builds in the same tree (libShengUfs.a 514112 bytes). The repro that produced the error ran UniXNU/scripts/build-arm-driver.py, whose ROOT is the shared repository and which therefore looks in UniXNU/build, a directory that does not exist; the kernel step runs the copy inside the device tree, where ROOT resolves to the tree that holds the records. What actually blocks odin is a port, not a build system: the component's SoC constants (host/PHY bases, GCC branch ids, apps-SMMU stream, userdata geometry) are SM8550 values and must become odin's, which are already pinned and host-tested in package/OdinUfs*.{c,h}. CONFIG_XNU_NATIVE_UFS and the [kernel] archives key stay unset until that substitution exists and has been read back on the unit, because a driver that has only ever compiled sits below the docs' block-reads/root/persistence milestones.",
 "The boot-argument surface of the fork is eleven names, read from its own source: native-ufs-probe, native-ufs-root, native-ufs-diagnostics, native-ufs-stats-delay and seven sheng-prefixed policy arguments (sheng-log, sheng-log-reserve, sheng-data-persist, sheng-dpu, sheng-dpu-scanout, sheng-wifi, sheng-wifi-attr). native-ufs-stream and native-ufs-smmu-takeover, which other device records pass for their UFS bring-up, are not parsed here at all - this implementation takes the stream id as the compiled constant 0xE0 - so copying those records verbatim would have bought arguments that do nothing.", "The Data store has no board address: native_ufs_store_open (NativeUfs.cpp:1283-1310) computes first = userdata_last + 1 - reserve - blocks from the GPT it parsed, where reserve is sheng-log-reserve MiB times 256 four-KiB blocks, default 1024, anything over 16384 falling back to the default, and it refuses with the words size or overlaps the root image. The log is fixed at the last 32 MiB of the partition (kLogReserveBlocks 8192) with a 256 MiB export region below it (kExportBlocks 65536), opened as one 73728-block write window, and the reserve must hold both or the log refuses with reserve too small for the log. The reserve is a lifetime value: the source says changing it moves the store and the old one reads as blank.", "For this unit that rule resolves to concrete LBAs, asserted on the host: a 4 GiB store lands at 60533755, the 1024 MiB reserve occupies 61582331..61844474, the log region is 61836283 for 8192 blocks, the log write window starts at 61770747 for 73728 blocks, and 188416 blocks (736 MiB) of reserve go unused between the store and that window.", "The Data size is not a board field either: native_ufs_store_open has no caller in the driver. It is one of the five exports drivers/RamBlock/NativeRamBlock.cpp:89-96 weak-imports and calls, and RamBlock sizes the store from its own RAM disk, so owner Data needs RamBlock selected and linked (XNU_NATIVE_RAM_BLOCK=1, build-xnu-4k-baseline.sh:207,719) plus the --data-ramdisk seed payload.check_data_input demands with CONFIG_XNU_OWNER_DATA_MOUNT.",]
completion = ["Host: descriptor bytes, register write order, completion and quarantine policy and the SMMU plan are pinned by tests against the reviewed contract.", "Device: registers readable and clock/link state matching the chosen path; buffers reachable and one command completing; capacity and known blocks correct; the configured root mounts and launchd starts; writes survive the documented reboot inside the allocated Data region."]
limits = ["No device run of the transport: nothing here has yet touched the UFS controller; the geometry and the part identity came from a read-only recovery boot, not from this code.", "What was recorded as 'ShengUfs cannot be selected here' is closed: the SM8550 fork in package/ufs is now selected under the catalog identity, with its source pinned by feeds.toml, and the catalog recipe builds it into the archive the link names. What remains is not a build question: CONFIG_XNU_NATIVE_UFS, native-ufs-root=1 and the payload Data seed stay unset, because a driver that panics on a stalled request list does not go into the image the owner's phone boots. And what \"stays unset\" was measured rather than deferred: with the plan fixed, turning those flags on in a reverted experiment made the kernel link refuse six strong vr_*/verified_root_* names (whose provider libVerifiedRootProbe.a needs the selected root's verified-root policy bundle, a payload product this tree does not build yet) plus the weak _boot_progress_poll, for which no provider exists in this workspace at all. Enabling the driver is that chain, not two flags."]
next_action = ["On the next sighting of unit 11b5d7c3, before anything else: scripts/read-boot-trace.py pull, which still owes the v10 firmware's UNIXNU.TXT.", "Enablement is a link chain now, and its two open ends are named: get the verified-root policy bundle for the selected root (build/verified-root-systemos/verification.json, host-derivable from the local IPSW) so scripts/build-verified-root-probe.py can produce libVerifiedRootProbe.a and the six strong vr_* imports resolve, and decide boot-progress explicitly instead of stubbing it - either this port carries package/BootProgress.c plus scripts/build-boot-progress.py as the sheng and ishtar records do, or XNU_BOOT_PROGRESS stays off and the chain stops asking for _boot_progress_poll. The flags and arguments themselves are already read out of the code and are the easy half: CONFIG_XNU_NATIVE_UFS=y plus native-ufs-root=1, CONFIG_XNU_NATIVE_RAM_BLOCK=y with sheng-data-persist=1 or =2 and the --data-ramdisk seed payload.check_data_input demands, and sheng-log-reserve fixed once before the first write, because the store address depends on it and a changed reserve makes the old store read as blank.", "Then, once that chain resolves and a kernel actually links the driver, the read-only milestones from docs/porting/ufs.md in order: registers readable, buffers reachable, one command completing, capacity and known blocks, root mount, persistence - each recorded at its own level, observed with scripts/read-boot-trace.py capture because the panel shows nothing before the display stack exists. Milestones cannot be reached by flashing an image that does not contain the driver, so this step is after the two open ends, not parallel to them."]
evidence = [
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/arch/arm64/boot/dts/vendor/qcom/lahaina.dtsi", result = "ufshc@1d84000 with ufs_ice 0x1d88000/0x8000 and ufs_ice_hwkm 0x1d90000/0x9000, GIC_SPI 265, two lanes per direction, iommus = <&apps_smmu 0xE0 0x0>" },
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/arch/arm64/boot/dts/vendor/qcom/xiaomi-sm8350-common.dtsi", result = "QMP phy 0x1d87000/0xe10 with compatible qcom,ufs-phy-qmp-v4-lahaina" },
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/Documentation/devicetree/bindings/clock/qcom,gcc-sm8350.yaml", result = "the board eUFS requests GCC_UFS_PHY_* with freq-table-hz 75/300 MHz, so the card family at 0x75xxx does not apply" },
    { kind = "source", reference = "https://github.com/UniXNU/ShengUfs/blob/e2b32cc429e8cf1501161c1d8c517f8994ceb9b2/GccUfs.h", result = "the reviewed SM8550 clock transcription, used here as the divergence table: GDSC 0x77004 and host 0x1d84000/0x3000 match odin, AXI/AHB/UNIPRO branch offsets do not" },
    { kind = "source", reference = "https://github.com/UniXNU/ShengUfs/blob/e2b32cc429e8cf1501161c1d8c517f8994ceb9b2/NativeUfs.cpp", result = "adoption sequence and register map transcribed: mask 0x24, stop 0x60, publish 0x50/0x54, clear 0x20, run 0x60, wait HCS bit1; the host is only read when the GDSC is powered and AXI is not halted" },
    { kind = "source", reference = "https://github.com/UniXNU/ShengUfs/blob/e2b32cc429e8cf1501161c1d8c517f8994ceb9b2/RootCommands.h", result = "hostSubmit's UTRD word packing, PRDT entry layout, big-endian UPIU fields, response header checks 1 to 7, the fatal-status quarantine rule and the store/log window bounds are the contract OdinUfsTransport.c implements" },
    { kind = "source", reference = "https://github.com/UniXNU/ShengUfs/blob/e2b32cc429e8cf1501161c1d8c517f8994ceb9b2/SmmuTakeover.h", result = "SMMUv2 planning refusals (stage 1 capability, all four encoded address widths, geometry, conflicting mapping, bank not bypass) copied field by field, including the refusal strings" },
    { kind = "source", reference = "https://github.com/UniXNU/UniXNU/blob/main/docs/.vitepress/device-records/marble-milacy.toml", result = "a device-verified SM7475 port with the same stream 0xE0: its probe found smr=800000e0 s2cr=2 on a firmware-chosen bank, which upstream refused, and the fix was the full-bank scan plus the takeover reset" },
    { kind = "source", reference = "https://github.com/UniXNU/UniXNU/blob/main/docs/guide/userdata.md", result = "first_lba and last_lba come from the GPT entry named userdata on the device, lba_bytes is its logical block size, and root_match_volume_uuid comes from the selected OS image's APFS root volume" },
    { kind = "host", reference = "package/OdinUfsTransportTests.c", command = "cc -std=c11 -Wall -Wextra -Werror -I package -o /tmp/ufs-tests package/OdinUfsTransport.c package/OdinUfsTransportTests.c && /tmp/ufs-tests", revision = "e2b32cc429e8cf1501161c1d8c517f8994ceb9b2", result = "descriptor bytes and every register write asserted against a scripted controller: handoff refusals, stop timeout, the six-write adopt order, the SMMU hook running between stop and publish, quarantine after timeout and fatal status, response reasons 1-7, sense decode, LUN-0-only writes and both window edges" },
    { kind = "host", reference = "package/OdinUfsSmmuTests.c", command = "cc -std=c11 -Wall -Wextra -Werror -I package -o /tmp/ufs-smmu-tests package/OdinUfsSmmu.c package/OdinUfsSmmuTests.c && /tmp/ufs-smmu-tests", revision = "e2b32cc429e8cf1501161c1d8c517f8994ceb9b2", result = "the SM7475 unit's residue reproduced in a mock register file: refused without takeover, planned and configured with it, six writes in the required order; shared or masked mappings still refuse, nine taken banks fall through to a tenth, and the unsupported stage-1, width and geometry cases are final" },
    { kind = "device", reference = "FACTS.md", command = "fastboot boot twrp-3.7.0_11-0-odinx.img; adb shell 'cat /sys/block/sda/queue/logical_block_size /sys/class/block/sda33/start /sys/class/block/sda33/size'; adb shell 'cat /sys/class/scsi_device/*/device/model'", revision = "b10d580b7b224f609b25256a879b1ae9b8569278", result = "unit 11b5d7c3: LUN sda reports a 4096-byte logical block, sda33 start 23740416 and size 471015384 (512-byte units) giving 58876923 blocks = 241159876608 B, and the eUFS is a Samsung KLUEG8UHDC-B0E1 rev 0200; read-only, so the controller itself has still not been driven by this port" },
    { kind = "host", reference = "FACTS.md", command = "ls -l UniXNU/out/odin/ipados-17.7.11-21H461/odin/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/iokit/DEVELOPMENT/IOPlatformExpert.cpo.json; find UniXNU/out/odin/*/odin/tree/build/xnu/ios-obj -name '*.cpo.json' | wc -l; cat UniXNU/out/odin/*/odin/logs/component-ArmCpu.log; cd UniXNU/out/odin/ipados-17.7.11-21H461/odin/tree && git clone git@github.com:UniXNU/ShengUfs.git (checkout 99d8bcd3e43dd24fc3c8437c67b5d4cc71ab94d0) plus VerifiedRoot@974f043d0c71ba2e60331483a41c6c6d35274ee3 and VirtioMmioBlock@4e1013eb8c45077b57f8d38d61b389fe899ea1c3 at the paths components.toml gives, then UNIXNU_XNU_ARCH=arm64 UNIXNU_IOS_VERSION=17.0 python3.13 scripts/build-arm-driver.py ShengUfs; ls -l build/sheng-ufs; file build/sheng-ufs/NativeUfs.o; shasum -a 256 /tmp/odin-payload-v10.img", revision = "99d8bcd3e43dd24fc3c8437c67b5d4cc71ab94d0", result = "the wall this area reported at 06:21 does not exist. The compile records are there (528 MB ios-obj, 123 cpo.json, the IOPlatformExpert record 10011 bytes), three driver archives were already built for odin from them, and the SM8550 storage driver - unmodified, with only its two pinned dependencies added - builds too: 'ShengUfs: -Werror build and arm64-apple-ios17.0 object audit passed', libShengUfs.a 514112 bytes, NativeUfs.o a 510296-byte arm64 Mach-O object. The FileNotFoundError that produced the earlier claim is real but is about a path convention: UniXNU/scripts/build-arm-driver.py has ROOT = the shared repository, whose build/ does not exist, while the kernel step runs the tree's copy, where ROOT is the tree holding the records. kernel.log's own header line says the intended flow is source build then prelink, and prelink.log's 'executable bytes unchanged' is therefore about no component being selected, not about one being unbuildable. Nothing shipped changed: board.toml still selects five components with no [kernel] archives key, /tmp/odin-payload-v10.img is still 860d63a4f044415d…, and the copied SM8550 sources and build/sheng-ufs were deleted from the generated tree so a later build cannot read them as odin's. Remaining work is the constant substitution (SM8550 host/PHY bases, GCC branch ids, apps-SMMU stream, userdata geometry -> odin values already host-tested in package/OdinUfs*.{c,h}), and qualification still needs the unit." },
    { kind = "host", reference = "package/OdinUfsGcc.h", command = "cc -std=c11 -Wall -Wextra -Werror -include stdio.h -include string.h -I package -o /tmp/ufs-gcc-tests package/OdinUfsGccTests.c && /tmp/ufs-gcc-tests; sh package/run-tests.sh | tail -4", revision = "99d8bcd3e43dd24fc3c8437c67b5d4cc71ab94d0", result = "the port's open substance is now a table rather than a search: nine of the reference driver's clock constants are paired SM8550/SM8350 with a citation on both sides - the eight branch enables plus the phy GDSC, which is 0x77004 identical (axi 0x77018->0x77010, ahb 0x77024->0x77018, tx_symbol0 0x77028->0x7701c, rx_symbol0 0x7702c->0x77020, unipro 0x77068->0x7705c, ice 0x77074->0x77064, rx_symbol1 0x770cc->0x770b8, aggre 0x770e4->0x770cc), and two are recorded as not obtained: phy_aux 0x770b0 has no SM8350 value and SM8550's ufs_mem_phy GDSC 0x9e000 has no SM8350 domain at all, so the fork refuses both instead of writing them. Two branch-enable offsets collide across generations (0x77018, 0x770cc) and SM8550's ahb enable offset 0x77024 is SM8350's gcc_ufs_phy_axi_rcg_clk register, so a base-shifting port would program a different kind of block and still read back as enabled - the suite asserts the collision count, each pair and that overlap separately so a wrong citation fails by name. The architecture-bound half needs no port at all: UFSHCI offsets, the 4096/512/1024/8192+131072 transfer geometry and 32 blocks per command, the SMMUv2 SMR/S2CR/CB layout and the 0x01d84000/0x3000 host window are identical on both. Nothing is selected into an image: the driver still has to be rebuilt with these values and then read back on the unit, which is where this area has been since 04:20." },
    { kind = "host", reference = "scripts/build-odin-ufs.py", command = "cmp -s /tmp/ShengUfs/RootCommands.h package/ufs/RootCommands.h && echo identical; diff -u /tmp/ShengUfs/NativeUfs.cpp package/ufs/NativeUfs.cpp | grep -c '^[+-][^+-]'; UNIXNU_TREE=UniXNU/out/odin/ipados-17.7.11-21H461/odin/tree python3.13 scripts/build-odin-ufs.py --clean; xcrun nm --defined-only UniXNU/out/odin/*/odin/tree/build/odin-ufs/libOdinUfs.a | grep -c 9NativeUfs; shasum -a 256 /tmp/odin-payload-v10.img", revision = "99d8bcd3e43dd24fc3c8437c67b5d4cc71ab94d0", result = "odin has a storage driver that compiles against its own kernel ABI, and it is not in any image. The fork is ShengUfs@99d8bcd3 with two files touched - package/ufs/GccUfs.h replaced with odin's values, and 22 lines in NativeUfs.cpp covering exactly the SoC-bound sites the substitution table predicted (the 0x60 stream literal in the adopt path and in the probe=7 match, the apps-SMMU base twice, the ufs_mem_phy window and the phy_aux read, and sheng's hardware comments marked as that unit's) - everything else byte-identical, verified with cmp against a fresh clone. build-odin-ufs.py prints -Werror build and arm64-apple-ios17.0 object audit passed with a 513400-byte libOdinUfs.a, then reads the artifact back: nm must define __ZN9NativeUfs10gMetaClassE and __ZN9NativeUfs12adoptAndReadEj (54 NativeUfs symbols total) and a -dM -E pass must report NATIVE_UFS_STREAM 0xE0u, AXI 0x77010u, AHB 0x77018u, host 0x01d84000ULL, PHY 0x01d87000ULL and the two unobtained registers as 0u. That check is what makes the compile mean something - a driver still carrying SM8550 constants compiles and audits identically - and it caught its own first bug, asserting an Info.plist string that was never in the object. Not selected: [kernel] archives unset, five components, /tmp/odin-payload-v10.img still 860d63a4f044415d..., because a driver that panics on a stalled request list does not go into the owner's phone before it has read a known block. Outstanding before selection: dependencies through [components] rather than copied directories, and the inherited org.blu-sharky.NativeUfs bundle identity, whose matching rules this port should not discover by booting." },
    { kind = "host", reference = "package/OdinUfsTransportTests.c", command = "cc -std=c11 -Wall -Wextra -Werror -o /tmp/ufs-transport-tests package/OdinUfsTransport.c package/OdinUfsTransportTests.c && /tmp/ufs-transport-tests", revision = "99d8bcd3e43dd24fc3c8437c67b5d4cc71ab94d0", result = "ut_place transcribed from NativeUfs.cpp:1256-1265,1294-1299 and 1468-1487 and asserted on this unit's geometry: the MiB-to-4KiB-block conversion (1024 MiB = 262144 blocks), the store landing at 60533755 for a 4 GiB request with its end exactly one reserve below the partition end, the log at 61836283 for 8192 blocks with the export region making one 73728-block window at 61770747, the 736 MiB of reserve left unused, all three refusal words (size, overlaps the root image, reserve too small for the log) reached by name, the >16384 MiB reserve falling back to the default, a zero reserve refused while the log is on and accepted with it off, and the resulting windows satisfying the transport's own write-time ut_in_window checks at both edges and in the gap between them" },
    { kind = "source", reference = "https://github.com/UniXNU/RamBlock/blob/4be2d7eb05ef5a98126c91e0302c149140c0e3e1/NativeRamBlock.cpp", result = "the Data side of the story: six weak imports (native_ufs_store_mode/open/read/write/sync/gpt_check, lines 35-40) and attachStore() at 89-96 refusing unless all five of the working ones are present, sizing the store from the RAM disk itself ((isBig ? big.bytes : sparse.bytes) / 4096 with persist::windowBlocks on top), recording the returned first LBA and printing the driver's own refusal word - which is why enabling odin's root needs RamBlock selected, not a board field for the Data address" },
    { kind = "host", reference = "board.toml", command = "PATH=/tmp/py313bin:$PATH ./unixnu tree -D ../UniXNU-odin --os ipados-17.7.11-21H461; ls -l out/odin/ipados-17.7.11-21H461/odin/tree/drivers/ShengUfs; PATH=/tmp/py313bin:$PATH ./unixnu status --json -D ../UniXNU-odin", revision = "99d8bcd3e43dd24fc3c8437c67b5d4cc71ab94d0", result = "the documented selection path works for a board fork: with ShengUfs in [components] include and feeds.toml pinning its source to package/ufs, the assembled tree links drivers/ShengUfs -> UniXNU-odin/package/ufs and status reports origin \"local (feeds)\" with the device repository's own commit as the revision. Selecting it changes the tree and the archive, not the image - CONFIG_XNU_NATIVE_UFS is untouched." },
    { kind = "host", reference = "scripts/build-odin-ufs.py", command = "UNIXNU_DEVICE=$PWD python3.13 scripts/build-odin-ufs.py --clean; python3.13 out/odin/ipados-17.7.11-21H461/odin/tree/scripts/build-arm-driver.py ShengUfs; xcrun nm --defined-only out/odin/.../tree/build/sheng-ufs/libShengUfs.a | grep -c 9NativeUfs; shasum -a 256 out/odin/.../tree/build/{sheng-ufs/libShengUfs.a,odin-ufs/libOdinUfs.a}", revision = "99d8bcd3e43dd24fc3c8437c67b5d4cc71ab94d0", result = "the catalog recipe builds odin's driver: \"ShengUfs: -Werror build and arm64-apple-ios17.0 object audit passed\", 513480 bytes with NativeUfs.o inside and 54 NativeUfs symbols including __ZN9NativeUfs10gMetaClassE and __ZN9NativeUfs12adoptAndReadEj. Two consequences recorded honestly: the slot no longer needs this board's recipe to install into it (build-odin-ufs.py stopped writing build/sheng-ufs/, so the pipeline owns the path the link reads), and a rebuilt archive of unchanged source changed digest from 130b09aa to 007aa5f0 because ar stores timestamps - the digest identifies a run, not a content check." },
    { kind = "host", reference = "board.toml", command = "PATH=/tmp/py313bin:$PATH ./unixnu tree -D ../UniXNU-odin --os ipados-17.7.11-21H461; python3.13 out/odin/ipados-17.7.11-21H461/odin/tree/scripts/build-arm-driver.py RamBlock; xcrun nm -u out/odin/ipados-17.7.11-21H461/odin/tree/build/ram-block/libRamBlock.a | grep -o _native_ufs_store_[a-z_]* | sort -u > /tmp/imports.txt; xcrun nm --defined-only out/odin/ipados-17.7.11-21H461/odin/tree/build/sheng-ufs/libShengUfs.a | grep -o _native_ufs_store_[a-z_]* | sort -u > /tmp/defines.txt; comm -13 /tmp/defines.txt /tmp/imports.txt", revision = "4be2d7eb05ef5a98126c91e0302c149140c0e3e1", result = "RamBlock selected, built and matched against the storage archive: the tree gains drivers/RamBlock at 4be2d7eb plus the legacy_name alias directory drivers/NativeRamBlock, the catalog recipe prints \"RamBlock: -Werror build and arm64-apple-ios17.0 object audit passed\" into a 301472-byte archive, and the difference between the six native_ufs_store_* names RamBlock imports and the six odin's libShengUfs.a defines is empty - the comm output printed nothing, which is the check that the weak imports will actually resolve rather than quietly leaving the store closed" },
    { kind = "host", reference = "board.toml", command = "cp configs/odin_defconfig /tmp/odin_defconfig.shipped && printf 'CONFIG_XNU_NATIVE_UFS=y\nCONFIG_XNU_NATIVE_RAM_BLOCK=y\n' >> configs/odin_defconfig && PATH=/tmp/py313bin:$PATH ./unixnu defconfig odin_defconfig -D ../UniXNU-odin && PATH=/tmp/py313bin:$PATH ./unixnu build kernel -D ../UniXNU-odin --os ipados-17.7.11-21H461", revision = "a6684e23138e0acd933e4a0182e91ffd8a0fe1c5", result = "the experiment this area had been avoiding: with the flags on, the kernel step first refused at the plan - \"[kernel] archives needs component entries for: RamBlock, ShengUfs, VirtioMmioBlock\" as written by kernel.py, which disproved the record's own explanation that an absent archives key means every selected component gets built (the arch profile supplies an explicit eight-entry list, and arrays replace inherited arrays), and after the list was stated out verbatim with the storage family appended, ld refused: _verified_root_key, _verified_root_policies, _verified_root_policy_count, _vr_open, _vr_verify_block and _vr_xnu_crypto as strong undefined externals from libShengUfs.a[2](NativeUfs.o) and _boot_progress_poll, an undefined weak external, refused as well. So selection is closed and enablement is a chain, and the two open ends have names: libVerifiedRootProbe.a (build-verified-root-probe.py, which reads build/verified-root-systemos/verification.json - the selected root's verified-root policy bundle) and a boot-progress writer, which in the sibling records is a device-repository file (package/BootProgress.c plus scripts/build-boot-progress.py) odin does not have. Nothing of the experiment ships: the defconfig was restored from the copy, the plan fix and the component selection did, and the tree's kernel.macho and kernel.json were restored from the pre-experiment snapshot and re-verified as 14d587cdfe65d49a and a12496ad, the bytes inside /tmp/odin-payload-v10.img (860d63a4f044415d) and the boot image flashed at 04:20" },
    ]
[[area]]
id = "display"
status = "planned"
components = []
paths = ["package/*Display*", "package/OdinDisplayBacklight*", "package/*Framebuffer*", "package/AppleARMBacklight.cpp", "package/GeniI2c*", "scripts/*display*", "scripts/*gop*", "scripts/*framebuffer*"]
inputs = ["Controller and panel identity, the DSI windows and splash region, the brightness transport and its encoding, the tear-check wiring and the enable GPIOs, each with a source."]
configuration = ["dts/odin.dts keeps the panel block as documentation until the scanout path exists; the geometry already verified there is 1080x2400 DSC 1.1 command mode at 60 Hz with porches 40/20/10 and 2000/2704/2.", "package/OdinDisplayBoard.h holds the panel and brightness facts with per-value citations; package/OdinDisplayBacklight.h/.c holds the transport rules, and neither bakes in an 8-bit assumption.", "uefi-odin's Include/RAW.inc now names this board's own panel description, extracted from its XBL volume as Panel_K8_42_02_0a_amoled_dsc_cmd.xml with the stock GUID 6FF4EF1B-166B-4D80-B27D-4A31E6D3B298; USE_CUSTOM_DISPLAY_DRIVER stays 0, matching venus.dsc, so the shared SimpleFbDxe path is what a first build uses."]
procedure = ["Read the panel description first-hand and quote it line by line.", "Read the brightness path in the vendor display driver (techpack/display/msm/dsi/dsi_panel.c) and the DRM helper it calls, and implement the encoding and the holds as a transport-agnostic layer.", "Assert packets, bounds and hold behaviour on the host with a recorded bus.", "Then establish firmware scanout, then the kernel backend, then brightness against the real panel."]
findings = ["Panel is 1080x2400 DSC 1.1 command mode (slice 1080x12, one slice per packet, bpc 10, bpp 8) at 60 Hz, backlight over DCS with no dedicated IC, TE on gpio82 (mdp_vsync mux 1), reset on gpio24, vddio and vddd enables on gpio42 and gpio83, ESD error interrupt on gpio75, and an avdd L13C supply.", "Corrected against the vendor driver: brightness is written as the raw level, 16 bits, bounded only at 0xffff (dsi_panel.c:562-588) - it is NOT scaled into 8 bits, and an earlier revision of OdinDisplayBoard.h claimed it was, which would have made levels above 255 unreachable.", "This panel declares qcom,mdss-dsi-bl-inverted-dbv (panel dtsi:39), and the driver exchanges the two bytes of the level when that flag is set (dsi_panel.c:583-584). With the DRM helper's low-parameter-first payload (drm_mipi_dsi.c:1057-1061) the two rules cancel, so the level appears big-endian on the link - a port that implements either rule alone produces a plausible-looking but wrong packet.", "Two holds happen before any transport is touched: an unchanged level is recorded and dropped (dsi_panel.c:659-661), and this panel sets qcom,bl-update-flag = delay_until_first_frame (dtsi:40, parsed at dsi_panel.c:2567), so the first change waits for a queued frame. In command mode both are about real packets on a real link, not cosmetics.", "odin's panel sets no qcom,bl-dsc-cmd-state, so the driver's default leaves the brightness write in high-speed mode; a panel that declared dsi_lp_mode would be sent in escape mode instead, and the layer models that as state rather than a constant.", "Board range confirmed with real line numbers: bl_ctrl_dcs, min 2, max 4095, brightness-init-level 100 (xiaomi-sm8350-common.dtsi:282-286). The mi,HBM and clone bands (1..2047, threshold 2047, clone 8191, dtsi:684-701) are recorded but unmodelled because their consumers are in the Xiaomi extras, not in dsi_panel.c.", "Also confirmed on the way through: qcom,mdss-dsi-te-dcs-command = 1 with te-check-enable and te-using-te-pin, tx-eot-append, lp11-init and panel-mode-switch (panel dtsi:30-38), which is the tear-effect configuration the display stage needs.", "Closed on the device: the 90 Hz and 120 Hz porch sets are 1000/1336 and 500/652 with the horizontal blanking unchanged, read from the applied device tree's timing@1 and timing@2, and the 60 Hz description in this unit's XBL volume reproduces timing@0 exactly (2000/2704/2 at 1100000000 bit-clock, 4 lanes). Still open: the demura/dc-vi follow-up writes the driver performs after a successful brightness update (dsi_panel.c:588-592).", "A transcription this port corrected from its own record: the Lineage panel dtsi asks for two slices per packet at lines 249, 459 and 669 and that value had been marked [V] in package/OdinDisplayBoard.h, but this unit's applied device tree says one in all three timings and so does the panel description inside its own firmware volume. One slice per packet is a different wire format from two, so the device wins; the header now says one and names the two sources that agree.", "xbl_a carries two k8 descriptions and only one of them is the driver's: the freeform file in the volume (slice 1080x12, profile 8, porches 2000/2704) matches the device tree, while a single-line copy in the ELF data section carries slice height 40, profile 4 and porches 20/8 that no odin timing uses. The FDF points at the volume copy with its stock GUID."]
completion = ["A known frame appears with correct geometry and colors, then userland presentation and backlight controls work."]
limits = ["Only the brightness encoding layer is implemented and host-verified; firmware scanout and the XNU display backend are not, so this area stays planned.", "The DSI controller windows are [R] from the extraction pass and no packet has yet been seen on a link, though DisplayDxe itself is now extracted from this unit's volume rather than assumed.", "The AOD 0x51 hold (aod_bl_51ctl) is not modelled because this unit's setting for it is unknown.", "avdd stays unresolved: the reported gpio 12 at a fixed 5500000 uV contradicts this unit's own supply list, which carries avdd as a 3000000 uV PMIC entry, so nothing drives that rail from the header value yet."]
next_action = ["Build the firmware against the generated Binaries/odin, confirm the menu on the panel, then wire odb_set/odb_first_frame to the real DSI transport and measure brightness."]
evidence = [
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/arch/arm64/boot/dts/vendor/qcom/display/dsi-panel-k8-42-02-0a-dsc-cmd.dtsi", result = "1901 lines re-read first-hand: 60 Hz timing block at 47-58 (1080x2400, 40/20/10, 2000/2704/2), DSC block, TE and ESD wiring, and the brightness-relevant lines 30-40 (te-dcs-command 1, bl-inverted-dbv, bl-update-flag delay_until_first_frame) plus 684-701 for the mi,HBM bands" },
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/arch/arm64/boot/dts/vendor/qcom/xiaomi-sm8350-common.dtsi", result = "331 lines read: the odin panel overlay at 281-290 gives bl_ctrl_dcs, min 2, max 4095, brightness-init-level 100, TE gpio 82 and reset gpio 24, promoting those from [R] to [V]; a second panel node above it declares a 0..255 range with TE gpio 83" },
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/techpack/display/msm/dsi/dsi_panel.c", result = "5236 lines read for the brightness path: update_backlight bounds at 0xffff, forces LPM only under lp_mode, byte-swaps under bl_inverted_dbv; set_backlight skips an unchanged level and holds under LP1; the bl-update-flag strings are parsed at 2560-2568" },
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/drivers/gpu/drm/drm_mipi_dsi.c", result = "mipi_dsi_dcs_set_display_brightness at 1054-1066: DCS 0x51 with a two-byte payload ordered low byte then high byte" },
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/arch/arm64/boot/dts/vendor/qcom/lahaina.dtsi", result = "cont_splash region 0xea600000 size 0x2300000 at lines 484-487" },
    { kind = "host", reference = "package/OdinDisplayBacklightTests.c", command = "cc -std=c11 -Wall -Wextra -Werror -I package -o /tmp/bl-tests package/OdinDisplayBacklight.c package/OdinDisplayBacklightTests.c && /tmp/bl-tests", revision = "a8182d2e0fe29a8fbd78fae66a6b1818a5df205f", result = "packets asserted byte for byte (100 -> 51 00 64, 0x0F2C -> big-endian pair, 1000 and 3000 distinct), the two bounds failing as different errors, skip-if-equal writing nothing, the first-frame hold releasing only the newest level, the LP-mode and bus-failure cases leaving the recorded level untouched" },
    { kind = "host", reference = "package/OdinBoardTests.c", command = "cc -std=c11 -Wall -Wextra -Werror -o /tmp/odin-board-tests package/OdinBoardTests.c && /tmp/odin-board-tests", revision = "a8182d2e0fe29a8fbd78fae66a6b1818a5df205f", result = "the 8-bit scaling checks replaced by range, init-level, inverted-dbv, wire-order and unmodelled-band checks" },
    { kind = "device", reference = "scripts/import-odin-uefi.py", command = "fastboot boot twrp-3.7.0_11-0-odinx.img; adb exec-out 'dd if=/dev/block/by-name/xbl_a bs=1048576' > facts/xbl_a.img; UNIXNU_UEFI=../uefi-odin python3 scripts/import-odin-uefi.py --image facts/xbl_a.img", revision = "97c410c65a47737e01541f5f7f58a3fc16b4f05c", result = "the board's own panel description, Panel_K8_42_02_0a_amoled_dsc_cmd.xml with GUID 6FF4EF1B-166B-4D80-B27D-4A31E6D3B298, extracted from the volume in this unit's xbl_a; read back it carries 1080x2400, vertical porch 2000/2704/2, DSC 1.1 slice 1080x12, one slice per packet, profile 8, 60 Hz, 1100000000 bit-clock and 4 lanes - the same numbers the applied device tree reports" },
    { kind = "host", reference = "package/OdinBoardTests.c", command = "sh package/run-tests.sh", revision = "97c410c65a47737e01541f5f7f58a3fc16b4f05c", result = "thirteen suites pass with the porch sets, the one-slice-per-packet value, the 10 bpc to 8 bpp pair, the 1.1 GHz bit clock and the TE and reset pins now asserted against the device's own readings" },
    ]
[[area]]
id = "input"
status = "host-verified"
components = []
paths = ["drivers/ShengHidInput", "drivers/ShengNovatekTouch", "package/*Touch*", "package/FtsProtocol*", "package/OdinTouchPipeline*", "package/*Button*", "scripts/*touch*", "scripts/*hid*"]
inputs = ["Controller identity, bus pins and clocks, the command set and event framing, the bring-up order, the firmware image path and the contact report contract, each with a source."]
configuration = ["board.toml selects no input component: the protocol runs in the firmware because the arm-io 16 MiB base rule cannot export SE11, so QcomGeniSpi is a firmware-side dependency of uefi-odin rather than a kernel component here.", "package/OdinTouchBoard.h holds the bus, pin, clock and axis facts with [V]/[R] marks; package/OdinDisplayBoard.h holds the panel geometry the axis space is divided against; the orientation is passed to the report layer as an argument because the vendor sets no rotation property on this board.", "configs/odin_defconfig stays as the minimal set: the HID consumer arrives with the firmware producer, not before."]
procedure = ["Extract the command set, framing and timings from the vendor driver with per-line citations (FtsProtocol).", "Establish the bring-up order from the same tree and encode it as one pipeline function per vendor step (OdinTouchPipeline).", "Assert the whole path on the host with a scripted bus that replays FIFO records by length: raw bytes in, contacts out (sh package/run-tests.sh).", "On the device, confirm the first working frame, then measure orientation, then verify the report against the panel."]
findings = ["SE11 sits on wrapper qupv3_1 (stream id 0x43) with the bus on gpio48/49/50 and the chip select split out to gpio51 by the odin pinctrl override; touch reset and irq are gpio22 and gpio23 at 8 mA active drive. The per-pin roles of the three bus lines are not stated by the vendor, so they must be read from the first working frame.", "Consequence of the 16 MiB arm-io base rule: the touch protocol has to run in firmware, which makes QcomGeniSpi reusable and leaves FtsProtocol as the only new code.", "Bring-up order, read from the vendor tree rather than inferred: interrupts down, reset line low 10 ms, poll the FIFO for the whole-byte ready event 0x03, then read the 208-byte system information block. The chip id is read only on the failed-reset path, where it decides between no panel and panel-without-firmware. Sensing is switched with {0xA0,0x00,0x01} and off with {0xA0,0x00,0x00}.", "A defect this port found and fixed in its own earlier code: the ready event had been matched as (byte >> 4) == 0x03, which accepts 0x30 (a leave-point event) and rejects the only byte that means ready, so a successful reset looked like a timeout. The high nibble is the dispatch index (fts.c:4849), the id is the whole byte (ftsCore.c:237).", "Two defects of the same class came out of wiring the pipeline: a bus failure inside the ready poll was reported as a timeout, hiding a broken serial engine behind a slow-looking reset; and sensing could be started on a controller that never announced itself.", "Axis space is ten times the panel (10800 x 24000) with super resolution enabled, so the report layer divides by ten and clamps; ten contacts is the ceiling and surface ids are monotonic and never reused, which the pipeline test asserts through a full frame and an eleventh contact.",  "The board's own firmware image was recovered read-only from the mounted vendor partition: st_fts_k8.ftb, 124072 bytes, SHA-256 dedfe0fd65d0801d2d7a557f6d87d01fa1fe6d341494a565f28fa623d5144c79, with stm_fts_production_limits.csv (25982 bytes). The recovery kernel names it during probe, so the file is the one this controller is flashed from.", "Parsed with this port's own reader, the real header agrees with every constant transcribed from the vendor tree: signature 0xAA55AA55, format version 1, target bytes 0x36 0x40 - exactly FTS_DCHIP_ID_0 and FTS_DCHIP_ID_1 - and section sizes 120404 + 3600 + 0 + 0 = 124004, which is the file minus its 64-byte header and 4-byte trailing CRC.", "A second defect of the ready-event class, found by running the reader over the real image: the four page counts at FLASH_ORG_INFO_INDEX 280 are single bytes (ftsFlash.c:512-516 indexes them with index++), and this port read them as 32-bit fields. On this board the bytes are 44, 1, 2, 1 while the word at 280 is 0x0102012C, so the CX base would have landed hundreds of thousands of pages past the real one - an erase-and-burn into the wrong flash area. The fallback rule was also wrong: the vendor selects the fixed bases when ANY of the four counts is zero, not when their sum is.", "Observed on the running board rather than transcribed: the vendor FTS driver 5.2.4.1 probes over SPI and registers an input device at /devices/platform/soc/a8c000.spi/spi_master/spi2/spi2.0, which is the SE11 window this port drives from firmware; the probe also reports tp vendor 56, tp color 50 and the fingerprint-on-display regions 4180 x 16810."]
completion = ["Touches map to the display, simultaneous contacts keep stable IDs, release events arrive, and buttons produce expected HID reports."]
limits = ["No device run of this port's own code: the frames, the order and the report are asserted against a scripted controller, and the recovery log shows the vendor driver working, not ours.", "The burn path has now got its image - st_fts_k8.ftb is in facts/, never committed - but no erase or DMA write has been attempted, so the flash arithmetic stays host-only.", "Orientation is unmeasured, so it is an argument rather than a constant; the sensor matrix behind the fts,* filter arrays is undecoded, which only affects the axis limits."]
next_action = ["Read the first working frame on the device to settle the three bus lines' per-pin roles and the orientation, then produce the HID producer in uefi-odin on top of otp_poll."]
evidence = [
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/drivers/input/touchscreen/fts_spi/fts.c", result = "fts_init at 5417-5465 gives the bring-up order and puts the chip-id probe on the failed-reset branch only; the event batch at 4836-4855 walks remaining+1 records, stops at EVT_ID_NOEVENT and dispatches on the high nibble" },
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/drivers/input/touchscreen/fts_spi/fts_lib/ftsCore.c", result = "fts_system_reset at 85-146 (interrupts down, reset low 10 ms, poll for ready, three attempts); pollForEvent at 193-265 compares readData[0] as a whole byte and flags an unsolicited ready event as an IC reset; setScanMode at 338-355 is the three-byte frame, two for low power" },
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/drivers/input/touchscreen/fts_spi/fts_lib/ftsSoftware.h", result = "event ids at 273-281 (0x00 none, 0x03 ready, 0x13 enter, 0x23 motion, 0x33 leave, 0x43 status, 0x53 user, 0xE3 debug, 0xF3 error) with NUM_EVT_ID derived from the high nibble, and the scan mode selectors at 86-89" },
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/arch/arm64/boot/dts/vendor/qcom/odin-sm8350.dtsi", result = "FocalTech fts@0 compatible st,spi, reset gpio22, irq gpio23, 7 MHz, panel phandle dsi_k8_42_02_0a_dsc_cmd" },
    { kind = "host", reference = "package/OdinTouchPipelineTests.c", command = "cc -std=c11 -Wall -Wextra -Werror -I package -o /tmp/otp-tests package/OdinTouchPipeline.c package/FtsProtocol.c package/OdinTouchReport.c package/OdinTouchPipelineTests.c && /tmp/otp-tests", revision = "a8182d2e0fe29a8fbd78fae66a6b1818a5df205f", result = "the whole path on a scripted bus: ready then sys-info with no chip id read, the A0 00 01 and A0 00 00 frames, a three-record batch ending as two contacts at panel units, ids never reused, an unsolicited ready returning the state to re-init, error and status records counted but not decoded, ten contacts then an eleventh refused, palm dropped by the type mask" },
    { kind = "host", reference = "package/FtsProtocolTests.c", command = "cc -std=c11 -Wall -Wextra -Werror -o /tmp/fts-protocol-tests package/FtsProtocol.c package/FtsProtocolTests.c && /tmp/fts-protocol-tests", revision = "a8182d2e0fe29a8fbd78fae66a6b1818a5df205f", result = "byte frames asserted literally, plus the two directions of the ready-event fix: 0x03 is accepted and 0x30 is not" },
    { kind = "device", reference = "FACTS.md", command = "fastboot boot twrp-3.7.0_11-0-odinx.img; adb shell 'dmesg > /tmp/dmesg.txt'; adb shell 'mount -o ro /dev/block/mapper/vendor_a /mnt/vro'; adb exec-out 'cat /mnt/vro/firmware/st_fts_k8.ftb' > facts/st_fts_k8.ftb; shasum -a 256 facts/st_fts_k8.ftb", revision = "7ba1ec98bec7d94bc341bd49aec89562ea9fde69", result = "the board's own touch firmware recovered read-only (124072 bytes, sha256 dedfe0fd...): its header parses clean through fts_ftb_check, its target bytes are the 0x36/0x40 this port carries, its page counts are the bytes 44,1,2,1, and the recovery kernel that used it registered input3 on a8c000.spi/spi2.0" },
    { kind = "host", reference = "package/FtsProtocolTests.c", command = "cc -std=c11 -Wall -Wextra -Werror -I package -o /tmp/fts-protocol-tests package/FtsProtocol.c package/FtsProtocolTests.c && /tmp/fts-protocol-tests", revision = "7ba1ec98bec7d94bc341bd49aec89562ea9fde69", result = "the page-count fix pinned against the real image: bytes 44,1,2,1 give CX base 46080 words and config base 48128, the same bytes read as one 32-bit field give 0x0102012C and a different base, and a zero in any single count - not only a zero sum - selects the fixed bases" },
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/arch/arm64/boot/dts/vendor/qcom/odin-sm8350.dtsi", result = "a second SPI device on this board that the port had not listed: &qupv3_se2_spi is status ok with ir-spi@0, compatible ir-spi-led, reg 0, spi-max-frequency 19200000 (lines 716-725), so SE2 and its pins are in use by a consumer-IR receiver and must not be handed to anything else" }
    ]
[[area]]
id = "gpu"
status = "host-verified"
components = []
paths = ["package/*Gpu*", "package/*Gmu*", "package/*Adreno*", "scripts/*adreno*", "scripts/*gpu*", "scripts/*metal*", "scripts/*turnip*", "scripts/*air*"]
inputs = ["The graphics IP identity and its windows, the power domain and clock owner, the CP packet encoding this generation emits, and the GMU boot sequence, each with a source."]
configuration = ["dts/sm8350.dtsi exports gfx 0x3d00000/0x40000 plus 0x3d61000 and 0x3de0000, gmu 0x3d6a000 and kgsl-smmu 0x3da0000; the firmware's own ACPI table for the same silicon declares one MON0 device covering 0x3d00000, 0x3d60000, 0x3d90000 and 0x3de0000, so the merged coverage and the ADT tuples agree.", "The GPU clock controller is at 0x3d90000 (OGP_GPUCC_BASE) with CX/GX domains at 0x3d9106c and 0x3d9100c: they are inside the graphics window, not the GCC's, so they cannot be programmed through a GCC mapping. Nothing maps it yet - GPUCC is one of the power board's own five windows (OGP_W_GPUCC) and no driver has been written to supply the mapping, which is why the DSDT does not declare it under another device's id.", "AdrenoFirmware is the only reusable catalog component here (it is SoC-neutral); Adreno740 and Sm8550Platform are SM8550-scoped and are not applicable to a 660."]
procedure = ["Inventory first-hand from the vendor tree (already done: chipid, windows, GMU, PDC, ZAP, power domains).", "Build the packet layer against the encoding the vendor driver actually emits, asserted on the host, before touching a submission path.", "Then the GMU boot sequence, then a render, then presentation."]
findings = ["Adreno 660 (A650 family), chipid 0x06060000, with GMU 0x3d6a000, PDC 0x0b290000 and the ZAP blob a660_zap loaded at pil_gpu 0x8e71a000.", "Correction that saves a whole module: this generation does not emit PM4 type-3 packets. The vendor driver builds every CP command with cp_type7_packet (adreno_pm4types.h:188-203, used at adreno_a6xx.c:1008 CP_ME_INIT, 1120 CP_SET_PSEUDO_REGISTER, 1133 CP_CONTEXT_SWITCH_YIELD, 1255 CP_SET_MARKER), so the existing type-4/type-7 coverage is the right base and a type-3 path would be dead code.", "Type-7 header encoding is count in bits[14:0] with an odd-parity bit at 15, opcode in bits[22:16] with an odd-parity bit at 23; type-4 adds an 18-bit register index with its own parity. The builder therefore has to compute parity, not copy a literal, and the tests must pin it.", "Two structural requirements visible in the same code and easy to miss: every 64-bit GPU address is written through cp_gpuaddr as a two-word low/high split, and the CP can be in protected mode - the driver brackets address-writing packets with cp_protected_mode(0) and cp_protected_mode(1). A builder that ignores either produces a packet stream the CP rejects.", "CP_ME_INIT is emitted as a single packet whose payload size is A6XX_CP_INIT_DWORDS - 1 with an ordinal mask and conditionally present fields, so the field count is derived from the mask rather than fixed.", "Inventory of the catalog driver, measured rather than assumed: Adreno740 takes every window from the device tree (NativeAdrenoService.cpp parses the provider's reg, requires at least two, and builds the GMU adapter's bases from node->windowAddress(index)/windowBytes(index)), so addresses are not this port's blocker.", "What does block it: both probe filters are substring tests over the compatible block - advertisesAdreno() wants the bytes qcom,adreno, advertisesGmu() wants qcom,adreno-gmu - and this unit's a6xx nodes say qcom,kgsl-3d0 and qcom,gpu-gmu, so the driver would bind neither. The sheng coupling is narrow and decisive: 6 of 61 files mention Sheng, 3 include ShengGmu.h, and that header lives only in Sm8550Platform (UniXNU-sm8550-common), which is the driver's first catalog dependency and is not applicable to a 660.", "The substring rule is also the hazard: qcom,adreno occurs inside qcom,adreno-smmu, which this port publishes on iommu@3da0000 with exactly the two windows the driver's count check accepts, and RBBM_STATUS at 0x840 lies well inside that 128 KiB block - so a byte-substring matcher on this board binds the GPU SMMU and reads its global registers as if they were the graphics core. An odin driver must match compatible elements, not bytes.", "The two generations' GMU nodes genuinely differ, so the a7xx window list cannot be reused: the a7xx node publishes three windows (gmu 0x3d6a000/0x35000, rscc 0x3d50000/0x10000, gmu_pdc 0xb280000/0x10000) and the driver binds only at three or more, while this unit's publishes two (kgsl_gmu_reg 0x3d6a000/0x34000, kgsl_gmu_pdc_cfg 0xb290000/0x10000) because RSCC belongs to the GPU node at a6xx (window index 2, 0x3de0000/0x10000)."]
completion = ["GPU submissions complete, mapping/fence handling is correct, a known image renders, and the selected Metal client presents it."]
limits = ["No implementation yet: the packet builder and the GMU boot path are the next pieces of work, and the GX power domain has never been brought up on this port.", "The ZAP firmware blob and the GMU/OOBP images are vendor binaries and are not in these repositories, so the GMU path cannot be exercised before they are obtained from the unit.", "The catalog Adreno740 driver is not a route to GPU on this board and is not selected: it matches a7xx compatible names this unit does not use, its GMU cold start needs Sm8550Platform's ShengGmu layer, and its five-window adapter expects three GMU windows where this board publishes two. Editing a catalog component's needles, class and bundle names is refused by its own AGENTS.md, so the work is an odin-scoped a6xx component.", "Nothing binds graphics today even if a driver existed: gpu@3d00000, gmu@3d6a000 and iommu@3da0000 are all status = \"disabled\" in dts/sm8350.dtsi, [kernel] archives names no GPU archive, and CONFIG_XNU_NATIVE_ADRENO is not set for odin."]
next_action = ["Write the a6xx GPU component for this board: element-wise compatible matching against qcom,kgsl-3d0 and qcom,gpu-gmu, windows taken from reg in the order the tree publishes them, and the bundle identity the catalog rules require of a new component rather than an edited one.", "Then run the power board's staged sequence read-only on the first hardware boot - ogp_run photographs GCC AHB, CX, GX, RBBM_STATUS and the gfx SMMU stream without writing anything - because every gate downstream assumes a rail and a clock this port has never proved up.", "Then the GMU bring-up from a6xx_gmu.c on top of the type-7 builder already tested here: ZAP through PAS 13 into pil_gpu_region, logos and OOBP, CM3 start, HFI handshake - which needs the vendor firmware images, so it cannot start on the host.", "Then the ringbuffer start, then a known render, then presentation."]
evidence = [
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/drivers/gpu/msm/adreno_pm4types.h", result = "cp_type3/4/7_packet builders at 176-203 with the odd-parity helper at 165-173, the reserved-bit check in pkt_is_type3, and the CP opcode table (CP_WAIT_MEM_WRITES 0x12, CP_WAIT_FOR_ME 0x13, CP_WAIT_REG_MEM 0x3c, CP_EVENT_WRITE 0x46, CP_WAIT_REG_EQ 0x52, CP_LOAD_STATE 0x30)" },
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/drivers/gpu/msm/adreno_a6xx.c", result = "2811 lines read: the CP command stream is type-7 throughout (1008, 1120, 1133, 1255), 64-bit addresses go through cp_gpuaddr as a low/high pair, address-writing packets are bracketed by cp_protected_mode, and CP_ME_INIT's payload is A6XX_CP_INIT_DWORDS-1 words with fields present only when the ordinal mask enables them" },
    { kind = "source", reference = "https://github.com/Project-Silicium/Silicium-ACPI/blob/2d465ad77c25de908f0ec7bdfcb57f865b61233c/Platforms/Xiaomi/venus/Decompiled/DSDT.dsl", result = "the sibling SM8350 firmware's MON0 device declares 0x3d00000/+0x3f010, 0x3d60000/+0x3f000, 0x3d90000/+0x9000 and 0x3de0000/+0x10000, and MMU1 declares the kgsl SMMU at 0x3da0000/+0x20000 - an independent confirmation of the gfx, GPU_CC and GPU SMMU windows this port took from the device tree" },
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/arch/arm64/boot/dts/vendor/qcom/lahaina-gpu.dtsi", result = "chipid 0x06060000, GMU 0x3d6a000, PDC 0xb290000 and the a660_zap PIL entry at 0x8e71a000" },
    { kind = "host", reference = "package/OdinGpuPm4Tests.c", command = "cc -std=c11 -Wall -Wextra -Werror -I package -o /tmp/pm4-tests package/OdinGpuPm4.c package/OdinGpuPm4Tests.c && /tmp/pm4-tests", revision = "a8182d2e0fe29a8fbd78fae66a6b1818a5df205f", result = "parity checked against a popcount oracle; type-7 roundtrip for every opcode and a sweep of counts, with both parity bits and bits 27:24 each refused independently; ME_INIT asserted word by word including the padding dword and the declared-count refusal; protected-window balance in both directions; the CP_REG bit-18 collision demonstrated by a packet the reader accepts and the writer refuses" },
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/drivers/clk/qcom/gcc-lahaina.c", result = "4426 lines read for the GPU entries: gcc_gpu_cfg_ahb_clk 0x71004, gcc_gpu_gpll0_clk_src enable_reg 0x52000 mask BIT(15) and gcc_gpu_gpll0_div_clk_src BIT(16) (2248-2270) - the same word and bits SM8550 uses - while gcc_gpu_memnoc_gfx_clk is 0x7100c against SM8550 0x71010 and gcc_gpu_snoc_dvm_gfx_clk matches at 0x71018" },
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/drivers/clk/qcom/gpucc-lahaina.c", result = "682 lines read: gpu_cc_ahb 0x1078, cx_gmu 0x1098, gx_gmu 0x1064, hlos1_vote_gpu_smmu 0x5000 - and no struct gdsc anywhere in the file, which is why SM8350 takes its power domains from qcom,gdsc device tree nodes rather than from the clock driver" },
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/drivers/gpu/msm/a6xx_reg.h", result = "RBBM_STATUS dword 0x210 and RBBM_STATUS3 0x213 at lines 139-140, scaled by four for the byte offsets the observation layer uses" },
    { kind = "host", reference = "package/OdinGpuPowerBoardTests.c", command = "cc -std=c11 -Wall -Wextra -Werror -I package -o /tmp/gpub-tests package/OdinGpuPowerBoard.c package/OdinGpuPowerBoardTests.c && /tmp/gpub-tests", revision = "a8182d2e0fe29a8fbd78fae66a6b1818a5df205f", result = "the gated sequence asserted by read counts rather than values: with the GCC AHB branch off, including the hardware-gated case where the enable is set and CLK_OFF is set, no read is issued to GPUCC, the Adreno SMMU or the graphics window; with CX up and GX down the status registers stay unread; the gfx stream is found past an earlier group belonging to another stream; a window that fails to read is recorded as unavailable rather than idle" },
    { kind = "source", reference = "https://github.com/UniXNU/Adreno740/blob/a9a2cbb43b89d672e2921e19721a6438b738b17f/NativeAdrenoService.cpp", result = "the driver's inputs are the device tree, not constants: advertisesAdreno() accepts a compatible block containing qcom,adreno (105), start() parses provider reg through NativeAdrenoBoard::parseReg and refuses fewer than two windows (227), maps windows 0 and 1 as the GPU register and CX windows, and binds the GMU adapter from node->windowAddress(index)/windowBytes(index) only when the GMU node publishes three or more windows (261-272)" },
    { kind = "source", reference = "https://github.com/UniXNU/Adreno740/blob/a9a2cbb43b89d672e2921e19721a6438b738b17f/NativeAdrenoGmuService.cpp", result = "advertisesGmu() (25) wants the bytes qcom,adreno-gmu, so the node it publishes windows for is found by the same substring rule; the service itself maps each reg tuple and performs no access - the comment says powering CX/GX, starting the CM3 and loading firmware belong to the GPU bring-up, not to this node" },
    { kind = "source", reference = "https://github.com/Project-Silicium/Mu-Silicium/blob/f971025b5f4478425aa9ef30658102a2506e7f59/Resources/DTBs/gts9wifi.dts", result = "the a7xx GMU node this port is compared against: compatible = \"qcom,adreno-gmu-740.1\", \"qcom,adreno-gmu\" with three reg windows named gmu, rscc and gmu_pdc (2540-2543) - 0x3d6a000/0x35000, 0x3d50000/0x10000, 0xb280000/0x10000 - which is the shape the driver's three-window minimum and its five-window adapter were written against" },
    { kind = "device", reference = "FACTS.md", command = "adb shell \"dtc -I fs -O dts /proc/device-tree\" > facts/live-dtb.dts; grep -n -A6 'qcom,gmu@3d69000 {' facts/live-dtb.dts", revision = "a8182d2e0fe29a8fbd78fae66a6b1818a5df205f", result = "unit 11b5d7c3's own applied tree: the GPU node is qcom,kgsl-3d0@3d00000 with compatible = \"qcom,kgsl-3d0\" and seven windows (kgsl_3d0_reg_memory 0x3d00000/0x40000, cx_dbgc 0x3d61000/0x800, rscc 0x3de0000/0x10000, isense_cntl 0x3d8b000/0x2000, qdss_gfx 0x6900000/0x80000, rdpm_cx 0x634000/0x1000, rdpm_mx 0x636000/0x1000) and GIC_SPI 300; the GMU node is qcom,gmu@3d69000 with compatible = \"qcom,gpu-gmu\" and two windows (kgsl_gmu_reg 0x3d6a000/0x34000, kgsl_gmu_pdc_cfg 0xb290000/0x10000) with GIC_SPI 304 and 305 - neither compatible contains qcom,adreno, and RSCC is on the GPU node, as the a6xx layout requires" },
    { kind = "host", reference = "package/OdinGpuBindingTests.c", command = "cc -std=c11 -Wall -Wextra -Werror -I package -o /tmp/gpu-binding-tests package/OdinGpuBinding.c package/OdinGpuBindingTests.c && /tmp/gpu-binding-tests", revision = "a9a2cbb43b89d672e2921e19721a6438b738b17f", result = "the binding inventory asserted: the seven a6xx GPU windows and two GMU windows with names and sizes, the four the authored tree exports, both a7xx needles refused for this board's GPU and GMU compatibles, the substring rule accepting the GPU SMMU's compatible block where an element-wise matcher refuses it, the GMU block one page smaller than a7xx, and the two generations' PDC bases 0xb280000 and 0xb290000 demonstrably not the same window" },
]

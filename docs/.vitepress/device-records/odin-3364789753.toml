evidence = [
    { kind = "host", reference = "package/OdinReservations.c", command = "cc -std=c11 -Wall -Wextra -Werror -include stdio.h -include string.h -o /tmp/odr-tests package/OdinReservations.c package/OdinReservationsTests.c && /tmp/odr-tests", revision = "a8182d2e0fe29a8fbd78fae66a6b1818a5df205f", result = "the modem PIL versus DXE heap question is a lifetime question rather than an overlap: no-map regions bind the OS while the firmware heap is reclaimed at ExitBootServices; 21 regions enumerated, proven non-overlapping, totalling 640-768 MiB and all ending below 0xECA00000" },
    { kind = "device", reference = "dts/odin.dts", command = "adb -s 11b5d7c3 pull /dev/logfs/UefiLog0.txt && grep -E 'Rank 0 size|Total Installed|Total Available|RAM Entry|Add Base|pFrameBufferBase|uFrameBufferSize' UefiLog0.txt", revision = "0ec682bc685fb997f787484c1c1d76d898ea0567", result = "unit 11b5d7c3's own XBL and UEFI report the memory the port had been declaring unmeasured: 'Rank 0 size = 8192 MB, Rank 1 size = 0 MB', 'Total Installed RAM : 8192 MB (0x0200000000)', 'Total Available RAM : 8087 MB (0x01F9700000)' in two entries 0x80000000+0x39700000 and 0xC0000000+0x1C0000000, so DRAM ends at 0x280000000 and the 105 MB missing below 0xC0000000 is XBL's reservation rather than absent memory. LPDDR5, 1555 MHz at boot, 1709 MHz current, 3196 MHz max enabled. The same file names the framebuffer the memory map claims: DisplayDxe pFrameBufferBase 0xEA600000, uFrameBufferSize 10368000 = 1080 x 2400 x 4" },
    { kind = "host", reference = "https://github.com/qine233/uefi-odin/commit/eb6b80045f27d4838236295ccfcdcfecfedf8ebe", command = "grep -n 'AddMem, SYS_MEM.*Conv' ../uefi-odin/Platforms/Xiaomi/odinPkg/Library/MemoryMapLib/MemoryMapLib.c; sed -n '88,100p' ../Mu-Silicium/Silicon/Silicium/SiliciumPkg/Library/MemoryInitPeiLib/MemoryInitPei.c; grep -rn 'PcdSystemMemorySize' ../uefi-odin/Platforms/Xiaomi/odinPkg/odin.dsc ../Mu-Silicium/Mu_Basecore/ArmPkg/ArmPkg.dec", revision = "eb6b80045f27d4838236295ccfcdcfecfedf8ebe", result = "what the boot payload's memory actually is: MemoryInitPei.c:97 turns a map entry into an allocation HOB only for EFI_RESOURCE_SYSTEM_MEMORY or EfiRuntimeServicesData, and odin's only EfiConventionalMemory rows are DXE Heap 0x9B800000+0x03C00000 and DBI Dump 0xE1A00000+0x00F00000 - 75 MiB in total, which is the whole reach of the DXE allocator, so the 80 MiB ramdisk ABL staged elsewhere cannot be allocated over. That is also why venus carries no {\"Kernel\", 0xA8000000, 0x10000000, Reserv} row and odin copied that, while the newer boards (sheng, garnet, ingres, marble, nuwa, onyx) need it. PcdSystemMemorySize is set by nobody - ArmPkg.dec:256 defaults it to 0 and odin.dsc:45 sets only the base - so the question is answered at run time by GetMemoryMap in the bring-up trace rather than by those PCDs" },
]


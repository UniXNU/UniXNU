evidence = [
    { kind = "host", reference = "package/OdinClocks.c", command = "cc -std=c11 -Wall -Wextra -Werror -o /tmp/odin-clock-tests package/OdinClocks.c package/OdinClocksTests.c && /tmp/odin-clock-tests", revision = "a8182d2e0fe29a8fbd78fae66a6b1818a5df205f", result = "GCC clock layer implemented and tested against a mock register file: SE11 branch 0x1839c with vote bit 25 and RCG 0x183a0, CFG/M/N/D matching the vendor values for the same table entries, the 2h-1 pre divider, CEIL rate rounding from 7 MHz to 7372800, timeout reporting and refusal of hardware-owned domains" },
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/arch/arm64/boot/dts/vendor/qcom/lahaina.dtsi", result = "cpu@0..cpu@7 carry reg 0x0, 0x100 through 0x700: the core number lives in MPIDR Affinity1, which is what the SoC feed patch for start.s assumes" },
    { kind = "host", reference = "scripts/package.sh", command = "cp -R ../UniXNU-odin ../UniXNU-odin-probe; in the copy set board.example = false; cd ../UniXNU-odin-probe; bash scripts/package.sh --os ipados-17.7.11-21H461 --check", revision = "e66022542ef0bab3283bfa8e4f66d282412f9d23", result = "the SoC series is resolved into the build order: 60 patches, with native-smp-secondary.patch at position 57 taken from the pinned sm8350 feed, and odin_defconfig accepted" },
]


[[area]]
id = "power"
status = "host-verified"
components = []
paths = ["package/*Battery*", "package/*Battmgr*", "package/OdinPowerBoard*", "package/*Power*", "package/*PlatformPower*", "package/QcomQmp*", "package/QcomRpmh*", "package/QcomScm.h", "scripts/*power*", "scripts/*battery*"]
inputs = ["Every rail each subsystem is fed from, with its voltage, load, enable GPIO, boot-on state and any parent supply, each quoted from the board device tree."]
configuration = ["The rails stay described in the device tree as the vendor writes them; package/OdinPowerBoard.h is where the port keeps the ordering and the gates, because XNU has no regulator framework to read the DT phandles.", "dts/sm8350.dtsi's ufs node now carries the vcc/vccq/vccq-parent note next to the controller it feeds, so the dependency is visible where the controller is described.", "No regulator node is added to the board DTS: these are consumer properties of the Linux drivers, and exporting them into the ADT would describe a device the port does not have."]
procedure = ["Read the supply properties out of the board and overlay dtsi files with line numbers.", "Transcribe them as a table, leaving a value at zero where the tree declares none instead of filling it in.", "Encode the parent-before-child rule and the three subsystem gates, and assert every row against the file it came from."]
findings = ["Storage: vcc = pm8350_l7 at 2504000..2950000 uV, 800000 uA; vccq = pm8350_l9, 900000 uA with no level declared on this board; and vccq's qcom,vccq-parent-supply = pm8350_s12 at 210000 uA (xiaomi-sm8350-common.dtsi:124-138). The parent is the part a port cannot see from the controller node, and enabling l9 without it powers an rail from a source that is not on.", "Display: dsi_panel_pwr_supply_k8 is an ordered list - vddio then vddd then avdd - with 1800000/1800000/3000000 uV, enable loads 60700/60700/10000 uA, disable loads 80/80/0 and a two-millisecond pre-off and post-on sleep on every entry (display/lahaina-sde-display-common.dtsi); the rails themselves are display_prim_vddi on tlmm 42, display_prim_vddd on tlmm 83, both regulator-boot-on, and L13C (odin-sm8350.dtsi:37-49, 412-414).", "Input: touch vdd = L2C with no level or load stated on this board, avdd = touch_avddsource_vreg, a fixed regulator on tlmm 132 at 3008000 uV, regulator-boot-on and regulator-always-on (odin-sm8350.dtsi:92-93, 81-85, 55-58).", "Because two of the fixed rails are boot-on, a warm handoff from vendor firmware has them already enabled; the state model starts from that instead of demanding GPIO writes that have happened, and the gates still refuse anything whose LDO is down.", "Two rails are deliberately recorded with zeros: vccq's level and L2C's level and load are not declared by this board, so the module carries them as undeclared and no consumer treats zero as a default."]
completion = ["Host: the rail table, the parent ordering and the three gates are asserted against the device tree rows they came from.", "Device: declared power controls and battery readings match observations; each claimed sleep/resume transition restores its dependent peripherals."]
limits = ["No PMIC access path yet: this layer describes which rails, in which order and with what loads, but the writes go through a driver that does not exist for SM8350 here.", "Battery, charger and gauge are not inventoried at all, and suspend/resume sequencing is untested, so the second half of this area stays open.", "The loads are the values the board declares, not measurements; a rail shared with a subsystem this port has not examined may carry more than these rows say."]
next_action = ["Wire opb_enable and the three gates into the firmware's PMIC sequencing before the first storage or display attempt, then inventory the battery and charger nodes."]
evidence = [
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/arch/arm64/boot/dts/vendor/qcom/xiaomi-sm8350-common.dtsi", result = "331 lines read first-hand: 124-138 give the eUFS supplies including the vccq parent, 209-275 show the panel candidate nodes, 281-290 the odin overlay that selects k8 with bl_ctrl_dcs and the TE/reset GPIOs" },
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/arch/arm64/boot/dts/vendor/qcom/odin-sm8350.dtsi", result = "733 lines read first-hand: 37-49 the two fixed panel regulators with their TLMM GPIOs and regulator-boot-on, 55-58 the 3008000 uV always-on touch avddsource, 81-93 the touch supply properties, 405-414 the panel supply-entry phandle and vddio/vddd/avdd" },
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/arch/arm64/boot/dts/vendor/qcom/display/lahaina-sde-display-common.dtsi", result = "1022 lines, the dsi_panel_pwr_supply_k8 node transcribed entry by entry: order, voltages, enable and disable loads and the two-millisecond sleeps" },
    { kind = "host", reference = "package/OdinPowerBoardTests.c", command = "cc -std=c11 -Wall -Wextra -Werror -I package -o /tmp/power-tests package/OdinPowerBoard.c package/OdinPowerBoardTests.c && /tmp/power-tests", revision = "a8182d2e0fe29a8fbd78fae66a6b1818a5df205f", result = "every row asserted against its citation, name lookups shown to be exact rather than prefix-matching, vccq refused before its parent with the parent named as the reason, an undeclared rail refused with the bit mask untouched, boot-on rails honoured on a warm start, a force-marked child still refused by the gate that re-checks the parent, and the panel sequence checked entry by entry including both sleeps" },
    { kind = "source", reference = "https://github.com/Inkypen79/kernel_xiaomi_odin/blob/a8182d2e0fe29a8fbd78fae66a6b1818a5df205f/arch/arm64/boot/dts/vendor/qcom/odin-sm8350.dtsi", result = "the recorded contradiction is closed: the family file enables wil6210 (xiaomi-sm8350-common.dtsi:204-206, with qcom,wireless-fw-name idt9412.bin just above it, a WiGig image), while the odin overlay disables its root port - &pcie1 and &pcie1_msi at lines 708-714 - so the WiGig node is dead on this unit and the working WLAN is the QCA6490 on pcie0" }
]

[[area]]
id = "diagnostics"
status = "planned"
components = []
paths = ["scripts/check-*", "scripts/probe-*", "scripts/audit-*", "scripts/read-*", "scripts/prepare-*", "scripts/data/**", "package/tests/**", "package/*Tests*", "package/*Diagnostic*", "package/*Probe*", "package/Boot*", "package/linux-log/**", "unixnu.lock"]
inputs = ["Identify the diagnostics hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for diagnostics."]
procedure = ["Follow the diagnostics stage in the porting guide and record the actual commands."]
findings = ["The board's checks are commands, not narratives: sh package/run-tests.sh builds and runs the host programs (board-facts, touch-bus, fts-protocol, clocks, reservations, touch-report, ufs-transport, ufs-smmu and the rest) and every line ends all checks passed, and scripts/check-odin-firmware.py is the preflight gate that re-hashes every Binaries/odin module against manifest.json, resolves each INF named by DXE.inc and APRIORI.inc, compares Resources/Configs/odin.toml against the rows MemoryMapLib.c actually carries, and refuses the raw configs that belong to ConfigurationMapLib instead of the firmware volume.", "check-odin-firmware.py separates the two ways a firmware build can fail: exit 1 means a board file is wrong here, and exit 2 means a vendor input is missing on this machine. A green run therefore never implies the vendor bytes were verified, and the archive scripts say the same thing in words - download and extract print why they skipped rather than exiting silently on a path they did not take.", "A checker earns its place by finding something: scripts/check-odin-dsdt.py is a preflight entry and its rule that every ACPI window and interrupt must appear in this unit's own device tree caught two wrong SPI-to-ACPI conversions in the table's first draft (0x194 for 0x164 and 0x100 for 0xd0, where the rule is plus 32). It also refuses to be a gate on machines that cannot run it, since a review input that is absent is not a defect: without acpica or without facts/ it prints skipped and exits 0, and only --require, the form the preflight uses, turns an absent input into a failure. Which copy it reads is now a checked property rather than an assumption: with --uefi naming a real Mu-Silicium checkout the table lives at Silicium-ACPI/Platforms/Xiaomi/odin (that is what odin.dsc:95's odin/AcpiTables.inf resolves against), so the checker prefers the installed overlay over the authored uefi-odin/ACPI copy and a stale install fails the run.", "A check script must not depend on where it was invoked from. Every board script here used to take the device repository from Path(__file__).parents[1], which is right for a human running it in place and wrong for the build driver, which copies scripts/ into the build tree and runs them there - the first real firmware build proved it with FileNotFoundError on tree/proprietary-files.txt. All of them now read $UNIXNU_DEVICE, which firmware.py already exports, and fall back to __file__ only so that the documented standalone commands keep working.", "A kernel build that stops at a patch tells you where it stopped, not why, because the driver reverts the tree on failure and the next command sees a pristine checkout. The reproducible localizer is to replay the selected series one patch at a time in the scratch tree (git checkout -- . and git clean -fdq first, then git apply -p1 per entry, then git apply --check for the one that failed): it turned 'the iOS 17 series does not apply' into 'one hunk needs the XNU_SHENG_PMGR block, which no series in that profile creates' in a single pass. The firmware build has the same shape: the compiler error was 'no such file or directory: ENABLE_SECUREBOOT=', and the answer was in the failing module's cc_resp.txt, which showed '-D -D' where the modules that compile show '-D ENABLE_SECUREBOOT=0'."]
completion = ["Each claimed milestone has a reproducible command, a matching source/image revision and an accessible result."]
limits = ["Every check here runs on the host against this board's own artifacts. Nothing observes the device: the firmware and the boot image now exist as bytes, but no firmware has booted, so the runtime diagnostics - the framebuffer handover, the ADT the loader reads, the modem PIL regions still live at ExitBootServices - have no observations yet, and boot.json records hardware_tested = false."]
next_action = ["Run the built FD on unit 11b5d7c3 through fastboot boot, which writes nothing, and record the stage it reaches: SEC, the BDS menu, the framebuffer, and whether the loader publishes odin's DSDT; the host gate stays as it is until then."]
evidence = [
    { kind = "host", reference = "package/OdinBoardTests.c", command = "dtc -I dts -O dtb -i ../UniXNU-sm8350-common/dts -o /tmp/odin.dtb dts/odin.dts", revision = "a8182d2e0fe29a8fbd78fae66a6b1818a5df205f", result = "compiles with no errors over 11 exported hardware nodes" },
    { kind = "host", reference = "package/OdinBoardTests.c", command = "python3 scripts/make-adt.py --dtb /tmp/odin-all2.dtb --os-profile profiles/os/ipados-17.7.11-21H461/profile.toml --board ../UniXNU-odin/board.toml --output /tmp/odin-all2.adt", revision = "a8182d2e0fe29a8fbd78fae66a6b1818a5df205f", result = "ADT generated at 16708 bytes with arm-io base 0x1000000 size 0x17000000" },
    { kind = "host", reference = "package/OdinBoardTests.c", command = "python3 scripts/porting-record.py check --device ../UniXNU-odin", revision = "a8182d2e0fe29a8fbd78fae66a6b1818a5df205f", result = "13 structured areas checked" },
    { kind = "host", reference = "package/OdinBoardTests.c", command = "sh package/run-tests.sh", revision = "97c410c65a47737e01541f5f7f58a3fc16b4f05c", result = "the board-facts suite grew panel timing and DSC assertions taken from the device rather than from a sibling board's source tree, and still passes as thirteen suites" },
    { kind = "host", reference = "package/FtsProtocolTests.c", command = "cc -std=c11 -Wall -Wextra -Werror -I package -o /tmp/fts-protocol-tests package/FtsProtocol.c package/FtsProtocolTests.c && /tmp/fts-protocol-tests", revision = "c6a5a54c5e9920d0ffb9d3207b680ad880420799", result = "the suite is what caught the transcription on its own terms: given the byte counts 44,1,2,1 it expects CX at 46080 words and config at 48128, and it keeps a separate case for the same fixture read as one 32-bit field, which gives 0x0102012C and a different base" },
    
    { kind = "host", reference = "scripts/check-odin-firmware.py", command = "UNIXNU_UEFI=../uefi-odin python3 scripts/check-odin-firmware.py; echo $?", revision = "8cd72da0ad99f6b21217a4e8536233e1eb17027d", result = "all checks passed with exit 0 against the generated tree: 94 modules and 51 raw files re-hashed from manifest.json, 99 INF references resolved, odin.toml matched against the MemoryMapLib rows it claims to come from" },
    { kind = "host", reference = "scripts/check-odin-dsdt.py", command = "python3 scripts/check-odin-dsdt.py --require; python3 scripts/check-odin-dsdt.py", revision = "388d27768e571cc61b3d4bf939098fc4752be3b1", result = "the same command in both forms, as the board needs them: with the tree and acpica present it reports 16 devices, 18 windows and 5 interrupts verified and exits 0, and it is the run that failed the first draft on two interrupt conversions before the table was committed" },
    { kind = "host", reference = "scripts/build-odin-dtb.py", command = "cd UniXNU/out/odin/ipados-17.7.11-21H461/odin/tree && UNIXNU_DEVICE=/Users/zhouzhou/Documents/Qoder/2026-10-13/f2fb76e0/UniXNU-odin UNIXNU_UEFI=/Users/zhouzhou/Documents/Qoder/2026-10-13/f2fb76e0/Mu-Silicium PATH=$TMPDIR/pybin:$PATH python3 scripts/build-odin-dtb.py 2>&1 || true  # then the same six entries through ./unixnu firmware", revision = "98744370b3ccf66fb367fe6ce4f817e9f54e5df9", result = "run from the build tree rather than the device repository, this is the form that used to fail: the traceback pointed at tree/proprietary-files.txt, which is why the root moved to $UNIXNU_DEVICE. With that in place all six preflight entries exit 0 from inside the tree, and build-odin-dtb.py writes build/odin/odin.dtb (6955 bytes) where [bootimg] dtb points, naming the feed directory it resolved by pin" },
    { kind = "host", reference = "unixnu.lock", command = "GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0='url.git@github.com:.insteadOf' GIT_CONFIG_VALUE_0='https://github.com/' ./unixnu fetch -D ../UniXNU-odin", revision = "98744370b3ccf66fb367fe6ce4f817e9f54e5df9", result = "the lock is rewritten by the fetch, not by hand: sm8350 resolves to 7fffe977373f39ed0d06e9fd4fbf56688704c7e1, the commit carrying the three-cluster CPU block, and the nine other pins are unchanged - which is also the run that shows HTTPS is unavailable on this network and the SSH rewrite is what resolves it" },
]

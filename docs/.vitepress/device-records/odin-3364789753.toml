findings = ["The SKU question is settled from this unit's own applied device tree, not from a sibling board: the node is wlan: qcom,cnss-qca6490@b0000000 with compatible \"qcom,cnss-qca6490\" and bluetooth: bt_qca6490, so the combo chip is QCA6490 and wil6210 does not apply to this board.", "The same node gives the wiring the driver needs: reg smmu_iova_ipa 0xb0000000/0x10000 plus tcs_cmd 0xb2e5510/0x690, wlan-en-gpio 64, bt-en-gpio 65, sw-ctrl-gpio 153, qcom,wlan-rc-num 0 so the device sits behind PCIe RC0 (pcie0 at 0x1c00000), a dynamic ramdump region of 0x420000 and a vdd-wlan-aon supply.", "The recovery kernel log proves the reserved region is real on this board - cnss_wlan_region initialized as a shared-dma-pool - but the recovery build carries no cnss driver, so no PCIe binding and no firmware load were observed; that is still a running-OS measurement."]

schema_version = 1

[device]
name = "odin"
soc = "SM8350"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Mi MIX 4 (Snapdragon 888+). Inputs and shared-support gaps live in FACTS.md; no hardware value below is measured until the device rows there close."

[[area]]
id = "configuration"
status = "host-verified"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore", "scripts/collect-device-inputs.sh"]
inputs = ["Identify the configuration hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for configuration."]
procedure = ["Follow the configuration stage in the porting guide and record the actual commands."]
findings = ["board.toml, feeds.toml and odin_defconfig resolve; the ADT generator accepts the board and publishes /chosen/boot-manifest-hash; the release preflight enumerates 60 patches before the example gate. The inputs that remain are the ones only the unit can supply, and scripts/collect-device-inputs.sh gathers them read-only after refusing any product other than odin.", "Measured on unit 11b5d7c3 on 2026-11-05: the production shell cannot read the GPT, so the one-shot recovery boot path was used. userdata is sda33, first_lba 2967552 and last_lba 61844474 in 4096-byte LBAs (sysfs 512-byte start 23740416 and size 471015384; fastboot partition-size 0x38263FB000 and GPT entry 61 agree). The same run fixed the SKU as 8 GB and captured the applied device tree, including the k8 panel node.", "The root volume UUID comes from the IPSW, not the device: the single System volume of 044-76040-038.dmg is 04769D26-2CA0-4825-B443-E2E5F88300F2, and make-adt.py writes it into /chosen/root-matching as an IOMedia UUID match.", "[firmware] is the board key that turned from a placeholder into a contract, and the first real EDK II build is what finished it: six preflight entries in the documented order, the four submodules of the Mu-Silicium checkout (Binaries deliberately absent, because odin's vendor modules are generated from xbl_a rather than taken from Device-Binaries), twelve PACKAGES_PATH entries and, as of 2026-11-06, patches = [] - measured in the checkout, Resources/MuPatches holds Auth-Service, Boot-Manager, Timer and Usb-Bus only, so the inherited Gic-Spurious.patch would have stopped the build at git apply --check. [board] example is false now: every input the flag was holding is measured on unit 11b5d7c3 (memory map, userdata geometry, root volume UUID, DSDT), and the platform seed was never a board fact - it is a --unique-chip-id argument per run.", "The first real kernel build on this board stopped inside the patch series, and the cause is not ours: the ipados-17.7.11-21H461 OS series opens with patches/xnu/zzz-boot-progress.patch, whose bsd_init.c:773 hunk instruments the block that patches/xnu/sheng-platform-power.patch creates, and no series in that profile applies the latter. Measured on the pinned xnu-10063.141.1 tree: all 56 arm64 entries apply cleanly and the failure is that one hunk alone. The fix is in the SM8350 feed (its series now carries the 15-line guarded block before the OS series, which is where it has to land because board patches run last), and the macro is defined by nothing in these profiles, so the code stays dead on this generation. feeds.toml and unixnu.lock moved to that feed commit 15fab28de068fae8aa41c54e8519740a6bf6dc43.", "The cores the feed describes were wrong, and this unit's own tree says so: it labels all eight qcom,kryo and splits them by capacity-dmips-mhz and qcom,freq-domain into 0x400/domain 0 on affinity 0x0-0x300, 0x79a/domain 1 on 0x400-0x600 and 0x800/domain 2 on 0x700 - 4x Cortex-A55, 3x Cortex-A78, 1x Cortex-X1. The feed had seven A78s plus an X1 and no capacity at all, so dts/sm8350.dtsi now carries the three cluster identities with the capacities and domains quoted, and feeds.toml and unixnu.lock moved to 7fffe977373f39ed0d06e9fd4fbf56688704c7e1 (tag v0.3.1).", "[payload] moved from 192 MiB to 80 MiB and gained panic_screen = true, both decided by the unit rather than by convention: a 192 MiB payload volume plus the firmware on top of it (202461184 bytes) dies mid-Booting on this unit while 85020672 bytes of the same content is accepted, and max-download-size reads 805306368 - so the rule that binds is the partition the image would be flashed into, not the download buffer, and the debug UART the board's own tree names - qcom,qup_uart@98c000 - is on internal pins rather than USB, so a stop without the panel showing something is a stop with no evidence at all. The platform seed lives in UniXNU/unixnu.local.toml, which .gitignore keeps out of every repository."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["binaries and the ACPI table are no longer configuration gaps - Binaries/odin generates from facts/xbl_a.img and the retail SKU reads 2106118C - and board.example is false, so the gates that remain are the per-run ones: --unique-chip-id for the ADT seed, and CONFIG_XNU_NATIVE_UFS / CONFIG_XNU_NATIVE_ADRENO, which need SM8350 components that do not exist yet."]
next_action = ["Take the first fastboot boot of the packed boot.img on unit 11b5d7c3; the image is host-verified but boot.json still records hardware_tested = false until the board says otherwise."]
evidence = [
    { kind = "host", reference = "scripts/collect-device-inputs.sh", command = "scripts/collect-device-inputs.sh", revision = "a8182d2e0fe29a8fbd78fae66a6b1818a5df205f", result = "identity guard refuses a non-odin unit (exercised against a connected clover device) and the geometry path converts 512-byte start/size to the 4096-byte LBA pair, warning instead of emitting unaligned values; exercised with a scripted adb, since the odin unit was not attached" },
    { kind = "device", reference = "FACTS.md", command = "fastboot boot twrp-3.7.0_11-0-odinx.img; adb shell 'cat /sys/class/block/sda33/start /sys/class/block/sda33/size'; fastboot getvar partition-size:userdata; dd if=/dev/block/sda bs=4096 skip=1 count=33", revision = "b10d580b7b224f609b25256a879b1ae9b8569278", result = "unit 11b5d7c3 (2106118C, sku odin, hwversion 7.9.0): sda33 start 23740416 and size 471015384 in 512-byte sectors, logical_block_size 4096, so first_lba 2967552 and last_lba 61844474; fastboot reports 0x38263FB000 and primary GPT entry 61 the same extent; the SKU is 8 GB (DT memory 7.897 GiB, MemTotal 7378824 kB); the production shell denies the same files, which is why a one-shot recovery boot was used and nothing was written" },
    { kind = "host", reference = "board.toml", command = "dtc -I dts -O dtb -i ../UniXNU-sm8350-common/dts -o /tmp/odin.dtb dts/odin.dts && python3.13 ../UniXNU/scripts/make-adt.py --dtb /tmp/odin.dtb --os-profile ../UniXNU/profiles/os/ipados-17.7.11-21H461/profile.toml --board board.toml --unique-chip-id 0102030405060708 --output /tmp/odin-adt.bin", revision = "a9473a93f4bee34c61b393b60ae2e7ed751301d3", result = "the sidecar builds at 14084 bytes and /chosen/root-matching carries IOProviderClass IOMedia with UUID 04769D26-2CA0-4825-B443-E2E5F88300F2, so root selection matches the volume the payload will write; the test seed is local only and never enters the board" },
    { kind = "host", reference = "board.toml", command = "python3 - <<'EOF' import sys; sys.path.insert(0, '../UniXNU/scripts')\nfrom unixnu.config import load_toml\nfrom pathlib import Path\nfw = load_toml(Path('board.toml'))['firmware']\nprint(len(fw['preflight']), len(fw['submodules']), len(fw['patches']), len(fw['packages']))\nEOF", revision = "8cd72da0ad99f6b21217a4e8536233e1eb17027d", result = "the board resolves through UniXNU's own TOML loader with the firmware block complete: five preflight entries, four submodules, one patch and twelve package paths" },
    { kind = "host", reference = "feeds.toml", command = "cd out/odin/ipados-17.7.11-21H461/odin/tree/refer/xnu && git checkout -- . && git clean -fdq && python3 replay.py  # every series entry in order, git apply -p1, then git apply --check for the next one", revision = "15fab28de068fae8aa41c54e8519740a6bf6dc43", result = "the replay localized the failure to a single hunk: 56 arch patches apply on the pinned tree, zzz-boot-progress then fails only at bsd_init.c:773; with the SM8350 feed series carrying sheng-platform-power.patch the same replay reports 60 of 61 applied and grep finds the boot_progress_stage line inside the PMGR block, so the hunk matches. The only entry the replay could not resolve is the driver-internal component:XnuPrelink prefix, which the real build handles" },
    { kind = "host", reference = ".github/workflows/host-tests.yml", command = "sh package/run-tests.sh", revision = "a8182d2e0fe29a8fbd78fae66a6b1818a5df205f", result = "the same seventeen suites the local run passes, run on every push with UniXNU and its QcomGeniSpi submodule checked out beside the device repository; the first two runs proved the checkout layout is itself a dependency, failing on a missing GeniSpi.c until the device was placed under 'device' and submodules were fetched. The count has grown with the port - it read thirteen when this row was written and reads seventeen now - so the row is re-checked against sh package/run-tests.sh rather than trusted from memory" },
    { kind = "host", reference = "board.toml", command = "PATH=$TMPDIR/pybin:$PATH ./unixnu firmware -D ../UniXNU-odin --uefi ../Mu-Silicium -j 8 && ./unixnu bootimg -D ../UniXNU-odin --uefi ../Mu-Silicium --dtb out/odin/ipados-17.7.11-21H461/odin/tree/build/odin/odin.dtb", revision = "98744370b3ccf66fb367fe6ce4f817e9f54e5df9", result = "the board builds with example = false instead of being refused: 165 modules, SILICIUM_UEFI.fd at 2097152 bytes (sha256 4562fe592a4a841cba3d30d4bb73f7896241a41bad1248a6e3631d93a289bb46, the exact [uefi_fd] size bootimg asserts) and boot.img at 1134592 bytes with boot.json recording header v1, kernel_address 0x8000, tags_address 0x1e00000, shim 192 bytes and the verify() round trip passing" },
    { kind = "host", reference = "feeds.toml", command = "dtc -I dts -O dtb -i ../UniXNU-sm8350-common/dts -o build/odin/odin.dtb dts/odin.dts && dtc -I dtb -O dts build/odin/odin.dtb | sed -n '/cpus {/,/};/p'", revision = "98744370b3ccf66fb367fe6ce4f817e9f54e5df9", result = "the boot-image tree carries the corrected clusters: four arm,cortex-a55 at reg 0x0/0x100/0x200/0x300 with capacity 0x400, three arm,cortex-a78 at 0x400/0x500/0x600 with 0x79a and one arm,cortex-x1 at 0x700 with 0x800, 0 dtc errors and 0 warnings; check-odin-dsdt.py still reports 8 CPUs against the tree" },
    { kind = "host", reference = "board.toml", command = "./unixnu payload && ./unixnu bootimg --dtb out/odin/ipados-17.7.11-21H461/odin/tree/build/odin/odin.dtb", revision = "93e111a5ce242b34ebbf93624c04979c59232468", result = "the payload step builds the 80 MiB volume from the board's own keys: patch-xnu-entry-probe.py --panic-screen --no-reset on the staged kernel copy, dtc for device-tree/hardware.dtb against the pinned sm8350 feed, and payload.json recording kernel_sha256 14d587cdfe65d49a..., adt_sha256 e9659a94a9b4b384..., panic_screen true and payload_bytes 83886080; bootimg then produces an 85020672-byte image, inside the one-shot limit this unit measures" }
    ]

[[area]]
id = "firmware"
status = "host-verified"
components = []
paths = ["proprietary-files.txt", "board.toml", "scripts/sync-odin-uefi.py", "scripts/download-odin-firmware.py", "scripts/extract-odin-firmware.py", "scripts/odin_firmware_inputs.py", "scripts/import-odin-uefi.py", "scripts/check-odin-firmware.py", "scripts/check-odin-dsdt.py", "scripts/apply-odin-sec-patch.py", "scripts/build-odin-dtb.py", "scripts/read-boot-trace.py"]
inputs = ["Identify the firmware and boot hardware, resources and existing component interfaces for this board."]
configuration = ["board.toml [firmware] now lists eight preflight entries in the order the porting guide gives it - install this board's overlay into the checkout, then download, extract, import, check - beside the config, dsc and fd keys, so the firmware step checks the vendor inputs before EDK II runs.", "The same table declares the Mu-Silicium checkout the build needs: submodules (Common/Mu, Common/Mu_OEM_Sample, Silicium-ACPI, the pinned openssl tree - not Binaries, because odin is not in Project-Silicium/Device-Binaries and its modules come from the importer), the one patch the edk2 checkout takes (Gic-Spurious, measured against mu_basecore 8f10084c), and the twelve PACKAGES_PATH entries a Lahaina package resolves against. The Mu-Silicium checkout's own edits cannot ride in patches - firmware.py applies those with git -C edk2 - so the SEC handoff travels as Resources/Patches/Sec-EntryArg.patch and a preflight entry.", "board.toml [firmware.image] stays a documented hole rather than a guess: no official MIX 4 fastboot URL has been confirmed from the CDN, so the download and extract scripts read the key, skip with the reason when it is unset and the local dump satisfies proprietary-files.txt, and refuse when neither holds.", "The vendor modules are generated, not stored: scripts/import-odin-uefi.py writes Binaries/odin into the firmware checkout named by UNIXNU_UEFI, and every FILE_FREEFORM and INF path in uefi-odin points into that tree."]
procedure = ["Dump the partition that carries the UEFI volume read-only (facts/xbl_a.img), hash it, and keep it out of Git.", "Slice the EDK II volume out of the image and unpack it with the pinned UEFIExtract A76, then generate one .inf per module with the GUID the stock volume gives it.", "Point the package's DXE.inc, APRIORI.inc and RAW.inc at the generated tree and re-resolve the board on the host."]
findings = ["The whole UEFI lives in xbl, not abl: abl_a is 2 MiB whose single volume carries one LZMA-compressed LinuxLoader and no DXE driver at all, while xbl_a holds a 2564096-byte FFS2 volume at 0x93000 with the SEC core, the DXE core, two nested volumes (gzip GUID-defined sections, GUID e91f301d-79be-5343-91c2-d23bc959ae0c) and 91 DXE drivers.", "94 AArch64 modules and 51 freeform files now generate from this unit's own volume, and every Binaries/odin path the odin package names resolves - 99 references across DXE.inc and APRIORI.inc, none missing. UFSDxe, DisplayDxe, EnvDxe, I2CDxe, SPIDxe, GpiDxe, PILDxe, TzDxeLA and QcomChargerDxeLA are all present.", "The raw config files carry the same GUIDs as the venus package's RAW.inc byte for byte (uefipil.cfg 21E9BDD9, QcomChargerCfg.cfg 45FE4B7C, BATTERY.PROVISION F780C779, SecParti.cfg A1E235DE), so the SM8350 firmware volume layout is shared across these boards and odin's FDF needed no invented GUIDs.", "uefiplat.cfg, BDS_Menu.cfg and logo1.bmp exist in the volume but stay out of the FDF: the platform description here comes from Library/ConfigurationMapLib, which is what venus does too.", "proprietary-files.txt now names the inputs by digest instead of listing categories: xbl_a (14ef0bd6...) as the source of every vendor module, boot_a for the header version and rollback, st_fts_k8.ftb (dedfe0fd...) and stm_fts_production_limits.csv from the mounted vendor image, and the remaining OS-side blobs - aop, GPU zap, adsp, Wi-Fi firmware - still marked REQUIRED_FROM_IMAGE because the official archive is not pinned yet.", "The Mi MIX 4 has no sheng-style global archive: its builds are China-only (the CNXM suffix), the newest stable measured for this line is OS1.0.8.0.UKMCNXM on Android 14, and Xiaomi publishes one MD5 per fastboot package on bigota/hugeota.d.miui.com with no SHA-256 and no browsable listing. The mirror-digested packages found by search could not be tied to that revision, so the scripts take the MD5 as the mandatory check and the SHA-256 as optional - and when only the MD5 is pinned they print the measured SHA-256 to record before the extraction deletes the archive.", "The whole preflight chain exits 0 on this machine without an archive: download and extract report the unset pin plus the matching local dump, import re-slices the volume from facts/xbl_a.img, and check-odin-firmware.py re-hashes Binaries/odin against manifest.json, resolves DXE.inc and APRIORI.inc, compares Resources/Configs/odin.toml with the board's own MemoryMapLib rows and refuses the raw configs that belong elsewhere. Pin an archive and the same four commands do the documented thing instead.", "The board's DSDT could not be acquired, so it was written and then made checkable: iasl compiles DSDT.asl with 0 errors and 0 warnings into 1189 bytes, and scripts/check-odin-dsdt.py recompiles it, refuses a committed DSDT.aml that differs, round-trips through the decompiler, and rejects any of its 18 memory windows or 5 interrupts that facts/odin-fdt.dts does not state. That last rule is what caught two wrong SPI-to-ACPI conversions in the first draft (0x164 written as 0x194 and 0xd0 as 0x100; the rule is SPI plus the 32 offset, which UFS confirms independently as 0x109 to 0x129, the value the published MTP table carries).", "The shim this board boots with is not the upstream one, and the difference is load-bearing: Project-Silicium/Mu-Silicium's BootShim/BootShim.S (sha256 0f412999b77f8daa...) jumps to the firmware volume without cleaning the D-cache, and states the ARM64 header's Image Size as FD_SIZE alone. The copy this port carries from UniXNU/uefi-sheng@66421cb7 (e3c053fe31bda287...) walks the FD range with dc cvac, issues ic iallu with dsb sy and isb before br x5, and reports FD_SIZE + (_Payload - _Head). mkbootimg.py by contrast is byte-identical to upstream (55037fd1a6d6cd86...), so the packer odin.toml's keys describe is the packer the checkout ships. Practical consequence for the build: the --uefi checkout has to be overlaid with this board's BootShim, not used as cloned. And odin.toml's values match the sibling venus.toml (0x9FD00000/0x200000, header_version 1) even though they were taken from odin's own MemoryMapLib rows first, which is a cross-check rather than a copy.", "Two claims the published SM8350 tables make do not hold on this unit: the first GENI wrapper is not at 0x0a600000 (that is the DWC3 controller the same bootargs names), it is qcom,qupv3_0_geni_se@9c0000 with its engines at 0x980000..0x99c000; and the GPU clock controller is its own node clock_gpucc: qcom,gpucc@3d90000 rather than part of qcom,kgsl-3d0, so it is declared nowhere in the table because this board has no ACPI driver for a clock controller and package/OdinGpuPower.c votes on it directly. The pin controller keeps the convention both published SM8350 tables use: node pinctrl@f000000, pin registers at REG_BASE 0x100000 inside it, so GIO0 is declared at 0x0F100000 for 0x300000.", "The firmware volume now exists, and it contains this board's own ACPI table: ./unixnu firmware against a completed Mu-Silicium checkout builds 165 modules into Build/odinPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd, 2097152 bytes - the exact [uefi_fd] size bootimg asserts - and the 1189-byte DSDT.aml occurs verbatim inside FVMAIN.Fv at offset 6918624, which is the proof that RuleOverride = ACPITABLE odin/AcpiTables.inf consumed odin's table rather than a sibling's. It is absent from the FD itself because the FD carries FVMAIN_COMPACT, an LZMA-compressed volume. bootimg then packs gzip(BootShim + FD) + DTB into a 1134592-byte header-v1 image whose own verify() decompresses and compares every section.", "Two defects that only a real build could surface, both now fixed where they belong. First, the preflight scripts derived the board root from __file__, which is the device repository only when the script runs in place; the build driver copies scripts/ into the build tree and runs them there, so the first run died on proprietary-files.txt not found under out/odin/.../tree. Every script now takes its root from $UNIXNU_DEVICE, with __file__ as the fallback for a human run. Second, Silicon/Silicium/SiliciumPkg/SiliciumPkg.dsc.inc:13 puts -D ENABLE_SECUREBOOT=$(ENABLE_SECUREBOOT) into every CLANGPDB compile, and an undefined value makes the expansion the bare word ENABLE_SECUREBOOT= - which GNU make reads as an assignment prefix and hoists off the recipe line, leaving -D -D in the module's cc_resp.txt and clang's 'no such file or directory' on the first module. [firmware.defines] ENABLE_SECUREBOOT = 0 fixes it and is also upstream's own default in build_active_devices.sh, matching the shared include's !if (ENABLE_SECUREBOOT) == 0 branch that an unmodified vendor XBL needs.", "The boot image's device tree gained a producer, which is what docs/porting/packaging.md assigns to a firmware preflight script and what board.toml had only ever described in a comment: scripts/build-odin-dtb.py resolves the SoC feed by matching feeds.toml's pin against git rev-parse HEAD in UniXNU/out/feeds/UniXNU-sm8350-common-* or the sibling clone, compiles device:dts/odin.dts with the [device_tree] include_dirs, refuses any dtc warning, checks the FDT magic and writes the [bootimg] dtb path relative to the build tree - 6955 bytes. Note that a bare ./unixnu bootimg does not read [bootimg] dtb (only release resolves it), so the flag has to be passed there.", "The first temp boots on the unit measured the packing limit rather than the boot itself: 202461184 bytes (a 192 MiB payload volume plus the 1108 KiB of shim and firmware on top of it) is refused mid-Booting with fastboot's usb_read failed, while 85020672 bytes of the same content sends in 1.9 s and answers Booting OKAY. The claim that this is the staging buffer being boot_a's size was withdrawn the same day: fastboot getvar max-download-size reads 805306368, so what binds is the partition the image would be flashed into. [payload] size_mib therefore drops to 80, which the payload step itself proves fits (kernel.macho is 51937280 bytes, and payload.build() refuses a volume smaller than its files). panic_screen = true joins it because this board has no host-reachable console: the debug UART qcom,qup_uart@98c000 that the tree names is on internal pins, not USB, so a kernel stop has to be visible on the panel, which is what patch-xnu-entry-probe.py --panic-screen --no-reset does to the payload's copy of the kernel.", "Three of our images left fastboot and came back inside about twenty seconds, and that is recorded as a stop, not as a cause. The one host-side artifact that would separate 'UEFI ran and found no OS' from 'the jump never reached SEC' is uefivarstore (sde60): DarwinBoot's boot entry for the ODIN volume only exists if Mu's BDS reached it. Reading that partition needs root, and the root route this file was built from - one-shot TWRP - now fails authentication on this ROM (FAILED remote: 'Failed to load/authenticate boot image: Load Error', twice, with the same image that produced the GPT, the applied DT and xbl_a). boot.json and payload.json keep hardware_tested = false, and no reason for the stop is claimed anywhere until one of those two observations is available. The owner-authorized partition write narrowed it anyway: flashing the same 85020672-byte image to boot_a and rebooting lands the same way with nothing on the panel at all - no BDS menu, no boot logo and no panic screen, which the payload's copy of the kernel is built to leave there (--panic-screen --no-reset). So the stop is before the first framebuffer write, in the shim or SEC/PEI, and it is not the benign case of a UEFI that came up and found no operating system."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["The FD and the boot image are host-verified only: nothing has run on the unit, so boot.json's hardware_tested = false is still the honest state, and the vendor modules odin.dsc links come from this unit's own xbl_a dump rather than an archive anyone else can fetch. uefi-odin carries the files that checkout's layout puts outside the package - BootShim/BootShim.S, Resources/Configs/odin.toml, Resources/Scripts/mkbootimg.py, Resources/Patches and Resources/MuPatches, Platforms/Xiaomi/odinPkg and ACPI/Platforms/Xiaomi/odin - the first and the packer byte-identical to UniXNU/uefi-sheng at 66421cb7bb5694843aec8de1ca3d1de4c20cca38. That placement is automated now: scripts/sync-odin-uefi.py is preflight entry one, takes the manifest from the overlay's own Git index filtered to the prefixes that belong in a firmware tree (22 of the 25 tracked files; README.md, ACPI/README.md and .gitignore are deliberately not installed onto a third-party checkout), maps ACPI/Platforms to Silicium-ACPI/Platforms, installs by byte comparison, re-reads every destination after copying and refuses a target that is not a Mu-Silicium checkout. Before it, the mapping was three documented manual copies and a machine that had not done them failed with missing-file messages that did not name the cause.", "An FD sha256 identifies a build instance, it does not describe firmware content: measured 2026-11-06, a build whose inputs were byte-for-byte the previous build's (the sync reported 22 of 22 already current) produced an FD differing in 1,058,661 of 2,097,152 bytes, because all 160 module .efi files relink. So the checks that close this area are the volume's own census (FV/Ffs directory names, FVMAIN.inf's EFI_FILE_NAME lines, FILE_GUID and signature-string hit counts, the entry-arg HOB GUID's FD offset against Sec.map) and not a digest comparison.", "board.toml [firmware.image] has no official archive URL, so an unattended run on a machine without this unit's read-only xbl_a dump cannot fetch the inputs; scripts/collect-device-inputs.sh is the only route today.", "The preflight needs python3 3.11 or newer for tomllib - the same requirement UniXNU's own loader has - while this host resolves python3 to the 3.9 Apple build, so a build run needs a python3 that points at 3.13 first in PATH. EDK II additionally needs Mu's pip-requirements.txt installed: this Homebrew interpreter fails inside python3 -m venv at ensurepip, so the route is pip3.13 install --user --break-system-packages.", "odin/DSDT.aml is authored, not dumped, and authored is not the same as observed: the table is consistent with this unit's applied device tree and with the conventions both published SM8350 tables use, and it now demonstrably ships inside FVMAIN, but no firmware has booted on the board to confirm a driver reads those windows the way the tree intends."]
next_action = ["First action on the next sighting of unit 11b5d7c3: scripts/read-boot-trace.py pull - stock recovery is rooted and mounts logfs read-only, so this reads the v10 run that already happened at 08:25 without booting anything, and sha256sum /dev/block/by-name/boot_a against e0c67f73... to confirm the owner's partition is still itself. Then: which ABL message ended the run, whether UNIXNU.TXT reached ReadyToBoot, and what fdt handoff reports for the device tree and the initrd range. If it dies mid-Booting rather than mid-firmware, the payload image is 516096 bytes above the largest size this unit has answered Booting OKAY to, so the first move is [payload] size_mib = 78 and the second is the FD-only image.", "Confirm an official MIX 4 fastboot archive for this firmware revision from Xiaomi's CDN, record its url, md5 and bytes in board.toml [firmware.image], and let the preflight verify the MD5 and print the SHA-256 to pin before the extraction deletes the archive.", "Build the payload and userdata root, which is the step that needs the platform seed and the absolute [userdata] LBAs, and only after boot_a and the partition table are backed up."]
evidence = [
    { kind = "device", reference = "scripts/import-odin-uefi.py", command = "fastboot boot twrp-3.7.0_11-0-odinx.img; adb exec-out 'dd if=/dev/block/by-name/xbl_a bs=1048576' > facts/xbl_a.img; sha256sum facts/xbl_a.img; UNIXNU_UEFI=../uefi-odin python3 scripts/import-odin-uefi.py --image facts/xbl_a.img", revision = "97c410c65a47737e01541f5f7f58a3fc16b4f05c", result = "unit 11b5d7c3: xbl_a is 8388608 bytes with sha256 14ef0bd648b68f476a6cc4aed49453e5476c1375017da9e8d2940e03ef225264; one FFS2 volume at 0x93000 of 2564096 bytes; the importer reports 94 AArch64 modules and 51 raw files written to Binaries/odin, with nothing written to the device" },
    { kind = "host", reference = "scripts/import-odin-uefi.py", command = "python3 - <<'EOF' # every Binaries/odin INF named by the package must exist after the import\nimport re,os\nfor inc in ('DXE.inc','APRIORI.inc'):\n    for line in open('uefi-odin/Platforms/Xiaomi/odinPkg/Include/'+inc):\n        if line.strip().startswith('INF ') and 'Binaries/odin' in line:\n            assert os.path.exists('uefi-odin/'+line.strip()[4:].strip()), line\nEOF", revision = "97c410c65a47737e01541f5f7f58a3fc16b4f05c", result = "99 references across the two includes all resolve against the generated tree, and the pinned UEFIExtract download matches the same A76 hash the sheng importer uses" },
    { kind = "source", reference = "https://github.com/UniXNU/UniXNU/blob/main/docs/porting/packaging.md", result = "the documented firmware step is a board preflight that downloads the pinned archive, keeps only the named inputs, deletes the archive and generates the binary modules the volume builds from; import-odin-uefi.py is odin's half of that, and the archive pin is what is still missing" },
    { kind = "device", reference = "scripts/import-odin-uefi.py", command = "adb shell 'ls /sys/firmware/acpi/tables'; python3 -c \"import re;d=open('facts/xbl_a.img','rb').read();print([d.count(s) for s in (b'DSDT',b'APIC',b'FACP',b'GTDT',b'IORT',b'MCFG',b'PPTT',b'DBG2')])\"", revision = "7ba1ec98bec7d94bc341bd49aec89562ea9fde69", result = "no ACPI tables anywhere on this unit: /sys/firmware/acpi/tables does not exist even under root adb, /sys/firmware carries only devicetree and fdt, the real bootargs say androidboot.dtbo_idx=26 with dtb_idx=0, and all eight ACPI signatures count zero in xbl_a; the GPT has no sdt, acpi or toolsfv partition either" },
    { kind = "source", reference = "https://github.com/UniXNU/uefi-sheng/tree/main/Platforms/Xiaomi/venusPkg", result = "odinPkg generated by mechanical renaming of the proven venus package: odin.dsc, odin.fdf, APRIORI and DXE driver order, DeviceBuild.py and the configuration map, with the venus panel descriptions replaced by the verified odin values" },
    { kind = "source", reference = "https://github.com/Project-Silicium/Silicium-ACPI/blob/2d465ad77c25de908f0ec7bdfcb57f865b61233c/Platforms/Xiaomi/venus/AcpiTables.inf", result = "the firmware's ACPI manifest is a submodule file, not a device-package one: [Binaries] with the device DSDT.aml, Common/SSDT.aml and Lahaina/APIC+FACP+GTDT, with a FILE_GUID shared by every device in the repository - so odin needs only its own DSDT, and the SM8350 SoC tables are already published" },
    { kind = "source", reference = "https://github.com/Project-Silicium/Silicium-ACPI/tree/2d465ad77c25de908f0ec7bdfcb57f865b61233c/Silicon/Qualcomm/Lahaina", result = "APIC, DBG2, FACP, GTDT, IORT, MCFG, PPTT with decompiled .dsl sources plus DSDT_Minimal.asl (eight ACPI0007 CPU devices) and venus/Decompiled/DSDT.dsl, a 926 KB table dumped from a real SM8350 unit; used as an independent cross-check of this port's register map - UFS host, apps SMMU, kgsl SMMU, debug UART, mdss, the four gfx/GPU_CC windows and the GENI wrapper blocks all agree, ACPI merging per block what the device tree lists per function" },
    { kind = "host", reference = "scripts/check-odin-firmware.py", command = "PATH=$TMPDIR/pybin:$PATH UNIXNU_UEFI=../uefi-odin UNIXNU_DEVICE=$PWD python3 scripts/download-odin-firmware.py && python3 scripts/extract-odin-firmware.py --delete-archive && python3 scripts/import-odin-uefi.py && python3 scripts/check-odin-firmware.py", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38", result = "the four board.toml preflight entries each exit 0 in order: download and extract report that [firmware.image] is unset while facts/ matches the two full digests in proprietary-files.txt, import re-slices 94 modules and 51 raw files from facts/xbl_a.img, and check reports 94 modules, 51 raw files, source 14ef0bd648b68f47 followed by all checks passed" },
    { kind = "host", reference = "scripts/odin_firmware_inputs.py", command = "python3 - <<'EOF' # synthetic roots: missing file, wrong digest, optional-only pin\nimport tempfile, pathlib, sys\nsys.path.insert(0, 'scripts'); import odin_firmware_inputs as o\nroot = pathlib.Path(tempfile.mkdtemp()); (root/'facts').mkdir()\n(root/'proprietary-files.txt').write_text('xbl_a.img|' + 'a'*64 + '\\n-opt.img|' + 'b'*64 + '\\n')\nprint(o.local_dump_complete(root)); (root/'facts/xbl_a.img').write_bytes(b'x'); print(o.local_dump_complete(root))\n(root/'proprietary-files.txt').write_text('-opt.img|' + 'b'*64 + '\\n'); print(o.local_dump_complete(root))\nEOF", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38", result = "the skip is claimed only when every required full-length digest is present and matches: a missing file, a mismatching dump and a pins-only-optional board all report False, so neither script pretends an unverified archive was handled" },
    { kind = "host", reference = "board.toml", command = "python3 - <<'EOF' import sys; sys.path.insert(0, '../UniXNU/scripts')\nfrom unixnu.config import load_toml\nfrom pathlib import Path\nfw = load_toml(Path('board.toml'))['firmware']\nuefi = Path('../uefi-odin')\nprint(len(fw['preflight']), len(fw['submodules']), fw['patches'], len(fw['packages']))\nprint((uefi/'Resources/Scripts/mkbootimg.py').is_file(), (uefi/'Resources/Configs/odin.toml').is_file(), (uefi/fw['dsc']).is_file())\nEOF", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38", result = "the board resolves through UniXNU's own TOML loader: four preflight scripts, four submodules, one inherited Mu patch and twelve package paths, and uefi-odin passes cli.need_uefi - the Resources/Scripts/mkbootimg.py, Resources/Configs/odin.toml and odin.dsc the docs layout requires are all present" },
    { kind = "source", reference = "https://github.com/UniXNU/UniXNU/blob/main/docs/zh/porting/uefi-firmware.md", result = "the Mu-Silicium layout the firmware step reads is BootShim/BootShim.S, Resources/Configs/<device>.toml, Resources/Scripts/mkbootimg.py and Platforms/<Vendor>/<device>Pkg, and the same page lists [firmware] submodules and patches as the way a board declares its checkout - uefi-odin now ships the first three for odin and board.toml declares the rest" },
    { kind = "source", reference = "https://github.com/UniXNU/uefi-sheng/tree/66421cb7bb5694843aec8de1ca3d1de4c20cca38", result = "BootShim.S and mkbootimg.py were vendored from the proven sheng tree byte for byte (sha256 e3c053fe31bda28780c048b7144cdd407576234bd344bcc2f405f6a985aeb552 and 55037fd1a6d6cd861add76c2083d5d4321373bf714acae3f6a40deb004c27d47), so the shim that copies the FD to FD_BASE and the packer that checks its length are the same code the sheng board boots with" },
    { kind = "host", reference = "scripts/check-odin-dsdt.py", command = "iasl -sa DSDT.asl && python3 scripts/check-odin-dsdt.py --require", revision = "388d27768e571cc61b3d4bf939098fc4752be3b1", result = "iasl compiles the authored table with 0 Errors and 0 Warnings at 1189 bytes; the checker verifies 16 devices (8 CPUs against the tree's 8 cpu nodes, and UFS0, MMU0, MMU1, UARD, URS0, URS1, GPU0, GIO0), 18 register windows and 5 interrupts against facts/odin-fdt.dts, confirms the committed DSDT.aml equals a fresh compile, and proves the decompile and recompile round trip returns identical bytes" },
    { kind = "device", reference = "scripts/check-odin-dsdt.py", command = "grep -n 'reg = <0x3d90000\\|qcom,gpucc@\\|qupv3_0_geni_se@9c0000\\|a600000.dwc3' facts/odin-fdt.dts", revision = "7932be0bd0d783e72973afdd2cb94e536f4d43ed", result = "unit 11b5d7c3's own tree contradicts two inherited SM8350 ACPI claims and the table follows the tree: qupv3_0 is the node qcom,qupv3_0_geni_se@9c0000 (0x9c0000/0x2000) with engines at 0x980000..0x99c000 while 0xa600000 is the DWC3 controller the bootargs name, and the GPU clock controller is its own node clock_gpucc: qcom,gpucc@3d90000 (0x3d90000/0x9000), not part of qcom,kgsl-3d0's seven reg windows" },
    { kind = "host", reference = "board.toml", command = "GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0='url.git@github.com:.insteadOf' GIT_CONFIG_VALUE_0='https://github.com/' PATH=$TMPDIR/pybin:$PATH ./unixnu firmware -D ../UniXNU-odin --uefi ../Mu-Silicium -j 8; python3 - <<'EOF' # is odin's table actually in the volume?\nimport pathlib\nfd = pathlib.Path('../Mu-Silicium/Build/odinPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd').read_bytes()\naml = pathlib.Path('../uefi-odin/ACPI/Platforms/Xiaomi/odin/DSDT.aml').read_bytes()\nfv = pathlib.Path('../Mu-Silicium/Build/odinPkg/DEBUG_CLANGPDB/FV/FVMAIN.Fv').read_bytes()\nprint(hex(len(fd)), fd.count(b'DSDT'), fv.find(aml), fv.count(b'DSDT'))\nEOF", revision = "98744370b3ccf66fb367fe6ce4f817e9f54e5df9", result = "the checkout resolves and builds for real: BaseTools compiled, the four submodules fetched over SSH (mu_plus, mu_oem_sample, Silicium-ACPI at f50bc115, openssl at the pinned 67b5686b) with Mu_Basecore at 64f4789 as the separate edk2 tree, 165 modules, and the FD is 0x200000 bytes - the size bootimg asserts. The authored DSDT is inside: the 1189 bytes match at FVMAIN.Fv offset 6918624 with 8 DSDT signature occurrences and an APIC, while the FD itself shows none because it carries the LZMA FVMAIN_COMPACT volume" },
    { kind = "host", reference = "scripts/build-odin-dtb.py", command = "cd UniXNU/out/odin/ipados-17.7.11-21H461/odin/tree && UNIXNU_DEVICE=../../../.. ./unixnu firmware ...  # first run, then: grep -n 'CLANG -D' Build/odinPkg/DEBUG_CLANGPDB/AARCH64/SiliciumPkg/Library/MemoryInitPeiLib/MemoryInitPeiLib/OUTPUT/cc_resp.txt", revision = "98744370b3ccf66fb367fe6ce4f817e9f54e5df9", result = "the two build defects localized themselves. The preflight traceback is FileNotFoundError on tree/proprietary-files.txt, which is the scripts'-root-from-__file__ assumption breaking the moment the driver copies them into the build tree; and the failing module's cc_resp.txt reads '-D CLANG -D -D __DEPRECATED_AARCH64_4K_RUNTIME_GRANULARITY' where every module that compiles reads '-D CLANG -D ENABLE_SECUREBOOT=0', which is make hoisting the bare ENABLE_SECUREBOOT= assignment off the recipe line and leaving the -D dangling" },
    { kind = "source", reference = "https://github.com/UniXNU/UniXNU/blob/main/docs/porting/packaging.md", result = "the same table that documents the archive preflight defines [bootimg] dtb as 'Device tree of the boot image, relative to the build tree. A firmware preflight script builds it' - which is why the DTB now has a producer in the preflight rather than a hand-run dtc line, and why its path is resolved against the tree, not the device repository" },
    { kind = "device", reference = "board.toml", command = "fastboot -s 11b5d7c3 getvar slot-retry-count:a; fastboot -s 11b5d7c3 flash boot_a /tmp/odin-payload-boot.img; fastboot -s 11b5d7c3 reboot; fastboot -s 11b5d7c3 flash boot_a facts/boot_a.img; fastboot -s 11b5d7c3 set_active a; fastboot -s 11b5d7c3 reboot; adb -s 11b5d7c3 shell getprop sys.boot_completed", revision = "cef9b88020dd3b7d64956e9f7793c81007b1fe79", result = "unit 11b5d7c3: slot-retry-count a=6 and b=5 with both slots slot-successful no, and current-slot moving from b to a on its own - the A/B bookkeeping, not the image format, is what had been refusing fastboot continue and the TWRP temp boot. Our image wrote in 2.1 s (Sending and Writing OKAY) and the reboot came straight back to fastboot with nothing on the panel, so the stop precedes any framebuffer write. Restoring the stock dump byte-for-byte plus set_active a brings the phone back to sys.boot_completed = 1 on release 17, which is what makes the next partition test safe" },
    { kind = "device", reference = "board.toml", command = "adb -s 11b5d7c3 reboot bootloader; fastboot -s 11b5d7c3 getvar product; fastboot -s 11b5d7c3 boot /tmp/odin-fd-only.img; fastboot -s 11b5d7c3 boot /tmp/odin-payload-boot.img; fastboot -s 11b5d7c3 boot ~/Downloads/twrp-3.7.0_11-0-odinx.img", revision = "93e111a5ce242b34ebbf93624c04979c59232468", result = "unit 11b5d7c3, product odin, unlocked yes, nothing written to any partition: 1134592 bytes answers Sending OKAY and Booting OKAY, 202461184 bytes answers Sending OKAY then Booting ERROR usb_read failed / FAILED (Status read failed), 85020672 bytes sends in 1.9 s and answers Booting OKAY, and each of the three has the phone back in fastboot within about twenty seconds. The control is the TWRP image this file's measurements came from: it now fails with FAILED (remote: 'Failed to load/authenticate boot image: Load Error') on both attempts, which is what closes the root route to uefivarstore (sde60). Same unit, same session: max-download-size 805306368, current-slot b, slot-count 2, and after the three runs fastboot continue answers Resuming boot FAILED (remote: 'Failed to load image from partition: Load Error') while set_active b is accepted and the following reboot lands back in fastboot - the A/B logic refusing to load boot_b, with no partition written by any command here and the recovery options recorded in FACTS.md" },
    { kind = "device", reference = "FACTS.md", command = "adb -s 11b5d7c3 shell 'mkdir -p /dev/logfs; mount -t vfat /dev/block/sda13 /dev/logfs'; adb -s 11b5d7c3 pull /dev/logfs/UefiLog1.txt; fastboot -s 11b5d7c3 boot /tmp/odin-fd-only.img; fastboot -s 11b5d7c3 boot /tmp/odin-fd-vendor-dtb.img", revision = "0ec682bc685fb997f787484c1c1d76d898ea0567", result = "unit 11b5d7c3 keeps a host-readable firmware log: logfs (sda13) is a FAT volume with one 64 KiB vendor UEFI console file per boot (UefiLog0..4.txt, rotated), and it survives into whatever OS boots next. That is what localized the stop that looked like 'the firmware does not boot': our first image's file ends at 'No match found for Soc Dtb type' / 'Error: Appended Soc Device Tree blob not found', so ABL decompressed gzip(BootShim + FD) and then refused the handoff on the boot image's device tree; adding qcom,msm-id advances it to 'ApplyOverlay: ufdt apply overlay failed' (no /__symbols__ to overlay onto); the vendor base SoC tree (476052 bytes, 3043 nodes) reaches 'Apply Overlay total time: 2494 ms' and 'Start EBS [10449]' - the firmware volume is handed control. pureason reads 40001 for that boot against 40011 for a working kernel handoff. All of it from one-shot boots: A/B retry count NOT decremented, nothing written" },
    { kind = "host", reference = "scripts/build-odin-dtb.py", command = "cd UniXNU/out/odin/ipados-17.7.11-21H461/odin/tree && UNIXNU_DEVICE=../../../../UniXNU-odin python3.13 ../../../../UniXNU-odin/scripts/build-odin-dtb.py && cmp build/odin/odin.dtb /tmp/odin-soc-dtb-v21.dtb", revision = "0ec682bc685fb997f787484c1c1d76d898ea0567", result = "the producer now slices the base SoC tree out of vendor_boot by chip id rather than compiling this port's dts, requires the /__symbols__ node, refuses an ambiguous match, and reproduces byte-for-byte the blob that demonstrably boots on the unit; dts/odin.dts keeps feeding the payload hardware tree instead. Alongside it OdinBringupLog dispatches in APRIORI DXE immediately behind DiskIo/Partition/UFSDxe/Fat and writes UNIXNU.TXT to the volume that owns UefiLog0.txt - a fresh 512 KiB dd of uefivarstore after a run still holds only the 14 stock variables, and the vendor BDS banner reads 'UEFI NV tables are enabled as VOLATILE!', so the variable sink cannot persist here and the file is the only persistent instrument" },
    { kind = "source", reference = "https://github.com/UniXNU/UniXNU/blob/main/docs/porting/uefi-firmware.md", result = "the page's Required integration table names six modules a board firmware volume must carry - UniXNU (menu and configuration reader), UniXNUDxe (boot-option registration), DarwinBootPkg/Driver/DarwinBoot.inf (XNU loader), UniXNURamDiskDxe (publish the Mu-Silicium FDT initrd as a read-only block device), DiskIoDxe and Fat - plus the HobLib and FdtLib mappings, and it says sheng's Include/DXE.inc is where those dependencies already sit. odin had only DiskIo and Fat: a search for darwinboot, macho and kernel.macho across the whole Mu-Silicium checkout returns nothing, so loader = \"firmware\" was an unbacked claim rather than a working path" },
    { kind = "host", reference = "FACTS.md", command = "git clone --depth 1 git@github.com:UniXNU/uefi-sheng.git /tmp/uefi-sheng && sed -n '100,130p' /tmp/uefi-sheng/Platforms/Xiaomi/shengPkg/sheng.dsc && sed -n '40,56p' /tmp/uefi-sheng/Platforms/Xiaomi/shengPkg/Include/DXE.inc; PATH=/tmp/py313bin:$PATH ./unixnu firmware -D ../UniXNU-odin --uefi ../Mu-Silicium -j 8", revision = "6d9146e7d7bca7cb15549e33abaa9bcc70e5d777", result = "the four modules were added at the same places the proven board puts them: UniXNU and UniXNUDxe next to the SMBIOS tables in the FDF, UniXNURamDiskDxe and DarwinBoot listed ahead of DiskIo/Partition/Fat - sheng's own comment explains that ordering, because this build's image verification refuses a driver loaded off a volume - and only UniXNULib needed a new library mapping since SiliciumPkg.dsc.inc:184,322 already supplies HobLib and FdtLib. All four compiled and the FD stayed 0x200000 bytes; the claim that they were therefore in the volume was wrong and is corrected by the two entries below, as is the placement: sheng's DXE.inc:47-50 is the file-content list, not APRIORI" },
    { kind = "host", reference = "https://github.com/qine233/uefi-odin/blob/9e3f7aa0e99c8074cbff86001158a4cee1308460/Platforms/Xiaomi/odinPkg/Include/DXE.inc", command = "python3 - <<'EOF' # does the FD actually carry the modules the DSC built?\nimport pathlib, struct\ndef gb(t):\n    p = t.split('-'); return struct.pack('<IHH', int(p[0],16), int(p[1],16), int(p[2],16)) + bytes.fromhex(p[3]+p[4])\nfv = pathlib.Path('../Mu-Silicium/Build/odinPkg/DEBUG_CLANGPDB/FV/FVMAIN.Fv').read_bytes()\nfor n, g in (('UniXNURamDiskDxe','75CA63AD-FBAE-4A06-92A0-F937C671251D'), ('DarwinBoot','1B64AF87-8415-4B57-9B16-680D70913B9F')):\n    print(n, fv.count(gb(g)))\nEOF; ls Mu-Silicium/Build/odinPkg/DEBUG_CLANGPDB/FV/Ffs | grep -ci unixnu", revision = "9e3f7aa0e99c8074cbff86001158a4cee1308460", result = "compiling a module is not shipping it: the two drivers built into AARCH64/.../OUTPUT/*.efi yet their FILE_GUID counted 0 in FVMAIN.Fv, no Ffs directory existed for them and FVMAIN.inf did not name them, because an INF that appears only inside APRIORI DXE { } is a dispatch-order reference and this build's GenFds drops it without a word. FV content is the [FV.*] INF list - here DXE.inc and RAW.inc - so all three of UniXNURamDiskDxe, DarwinBoot and OdinBringupLog are now listed in DXE.inc in front of DiskIo/Partition/Fat (sheng's placement) and keep their APRIORI entries for ordering; after the rebuild the GUIDs count 2, 2 and 3, FVMAIN carries UNIXNURAMDISK 7 times and DarwinBoot 4, taken size moves 0x8ce380 to 0x908c70 and the FD is still exactly 0x200000" },
    { kind = "source", reference = "https://github.com/UniXNU/uefi-sheng/tree/66421cb7bb5694843aec8de1ca3d1de4c20cca38/Silicon/Silicium/SiliciumPkg/Sec", result = "the second half of the handoff was missing in the shared tree, not in odinPkg: UniXNURamDiskDxe takes the FDT address from a GUID HOB 0xDAEE82E6-8090-4E72-BFB9-78C13CD4E359 that upstream Mu-Silicium's SEC never builds (grep -rni EntryArg over Silicon/Silicium, Common/Mu and Common/Mu_OEM_Sample returns nothing, and SiliciumPkg.dec declares only the token space), so the driver can only print no entry argument HOB. sheng's SEC supplies it - ModuleEntryPoint.S stores x0 in a .quad slot in the entry section, Sec.c publishes it with BuildGuidDataHob after PlatformPeim(), the FD/stack maintenance becomes WriteBackInvalidateDataCacheRange because a plain invalidate can discard that very store, and SecCleanInvalidateDataCacheAll plus msr SPSel, #1 handle the caches and stack select ABL leaves. Its Exception.S, Sec.h and ArchSec.c are byte-identical to this checkout's, so the delta is reviewable rather than a fork; the per-constructor DEBUG calls, CheckHobList and the split constructor list were left out because they print to a serial port this board cannot read" },
    { kind = "host", reference = "scripts/apply-odin-sec-patch.py", command = "UNIXNU_UEFI=../Mu-Silicium python3.13 scripts/apply-odin-sec-patch.py --check-only; git -C ../Mu-Silicium checkout -- <the five SEC files>; UNIXNU_UEFI=../Mu-Silicium python3.13 scripts/apply-odin-sec-patch.py; ./unixnu firmware -D ../UniXNU-odin --uefi ../Mu-Silicium -j 8; python3 - <<'EOF' # read the FD, not the sources\nimport pathlib\nfd = pathlib.Path('../Mu-Silicium/Build/odinPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd').read_bytes()\nprint(hex(fd.find(bytes.fromhex('e682eeda9080724ebfb978c13cd4e359'))))\nEOF", revision = "9e3f7aa0e99c8074cbff86001158a4cee1308460", result = "the patch is carried in uefi-odin/Resources/Patches/Sec-EntryArg.patch and applied by a seventh preflight entry, because [firmware] patches is aimed at the edk2 checkout (git -C edk2 apply) while these files live in the Mu-Silicium one. Both paths were exercised - fresh apply after git checkout -- of the five files, and the already-applied branch, each ending with the tree diff compared byte-for-byte against the patch and the four anchors (str x0,[x1], BuildGuidDataHob, Sec.inf [Guids], the .dec declaration) re-read from the source. The firmware build then runs it as preflight entry six of seven and rebuilds; the HOB GUID's 16 bytes sit in the FD at 0xcb78, which is gSiliciumEntryArgHobGuid's address in Sec.map, and Sec.map also carries SecCleanInvalidateDataCacheAll at 0x75000 and gSecEntryArg0 at 0x790b8" },
    { kind = "host", reference = "https://github.com/qine233/uefi-odin/commit/eb6b80045f27d4838236295ccfcdcfecfedf8ebe", command = "./unixnu firmware -D ../UniXNU-odin --uefi ../Mu-Silicium -j 8; python3 - <<'EOF' # the instrument shipped, and the unset PCD stopped being printed\nimport pathlib\nfv = pathlib.Path('../Mu-Silicium/Build/odinPkg/DEBUG_CLANGPDB/FV/FVMAIN.Fv').read_bytes()\nfd = pathlib.Path('../Mu-Silicium/Build/odinPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd').read_bytes()\ng = bytes.fromhex('e682eeda9080724ebfb978c13cd4e359')\nprint(hex(len(fd)), hex(fd.find(g)), fv.count(g), [fv.count(s) for s in (b'fdt handoff:', b'memory map:', b'FREE-MEMORY', b'sysmem')])\nEOF", revision = "eb6b80045f27d4838236295ccfcdcfecfedf8ebe", result = "the bring-up trace now reports the handoff instead of leaving it inferred: the FD is still 0x200000 with the HOB GUID at 0xcb78, the GUID appears twice in FVMAIN (UniXNURamDiskDxe's static copy plus this reader), fdt handoff:/memory map:/FREE-MEMORY all occur in the volume and sysmem occurs zero times - the entry line no longer prints PcdSystemMemorySize, which this board never sets. Two API corrections came out of the build itself: GetMemoryMap is the five-argument form (MapKey, DescriptorSize, DescriptorVersion) and NEXT_MEMORY_DESCRIPTOR lives in UefiLib, so the walk uses the returned descriptor stride rather than sizeof (EFI_MEMORY_DESCRIPTOR). Repacked after this rebuild: /tmp/odin-payload-v8.img 85536768 bytes (sha256 272cfd59…), /tmp/odin-fd-v8.img 1650688 (235b5178…), FD e8ba59ce…" },
    { kind = "host", reference = "scripts/read-boot-trace.py", command = "python3.13 scripts/read-boot-trace.py --self-test && python3.13 scripts/read-boot-trace.py parse <dir with the two samples> && sh package/run-tests.sh | tail -1", revision = "eb6b80045f27d4838236295ccfcdcfecfedf8ebe", result = "the round trip the next device session has to do is one command: it checks fastboot getvar product is odin, boots the image once without writing any partition, waits for the board to end its own run, mounts logfs, pulls UNIXNU.TXT and UefiLog0..4.txt and prints what the boot proved. Its classifier is asserted rather than trusted: the catalogued ABL messages resolve in run order, the three fdt-handoff failures each get their own cause (a missing HOB is blamed on preflight entry seven, a non-DTB x0 on the shim or ABL, and FREE-MEMORY refuses the run as uninformative for the payload), a trace without ReadyToBoot is stated as never having reached a boot option, and all three dead ends - no rooted Android, a board that answers neither USB state, and a payload sitting in free memory - stop without writing. Suite 14 of package/run-tests.sh" },
    { kind = "source", reference = "https://github.com/UniXNU/uefi-sheng/blob/66421cb7bb5694843aec8de1ca3d1de4c20cca38/Resources/MuPatches/Gic-Spurious.patch", result = "the file this board's records said was not public is in the sibling SM8350 board's own repository, and its PORTING.md:36 names the case it exists for: an unregistered level interrupt, IPCC INTID 0x105 among them. It patches the no-handler branch of GicV3IrqInterruptHandler to GicV3DisableInterruptSource before the end-of-interrupt and to report a source that will not mask - without it an acknowledged level interrupt with nobody registered re-fires on the same CPU forever" },
    { kind = "host", reference = "board.toml", command = "cp /tmp/uefi-sheng/Resources/MuPatches/Gic-Spurious.patch uefi-odin/Resources/MuPatches/; shasum -a 256 …; git -C Mu-Silicium/Mu_Basecore apply --check …/Gic-Spurious.patch; ./unixnu firmware -D ../UniXNU-odin --uefi ../Mu-Silicium -j 8; git -C Mu-Silicium/Mu_Basecore status --short; python3 - <<'EOF' # the strings the patch adds, in the volume that ships\nimport pathlib\nfv = pathlib.Path('../Mu-Silicium/Build/odinPkg/DEBUG_CLANGPDB/FV/FVMAIN.Fv').read_bytes()\nprint([fv.count(s) for s in (b'cannot be masked', b'Spurious GIC interrupt')], hex(len(pathlib.Path('../Mu-Silicium/Build/odinPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd').read_bytes())))\nEOF", revision = "9e3f7aa0e99c8074cbff86001158a4cee1308460", result = "[firmware] patches is used for the first time and it is the right mechanism for this file: the target ArmPkg/Drivers/ArmGicDxe/GicV3/ArmGicV3Dxe.c lives in mu_basecore, applies cleanly at the pinned 8f10084c, and both GicV3DisableInterruptSource (line 366) and GicV3GetInterruptSourceState (line 395) are already there. The build log shows the apply, mu_basecore is clean again afterwards, FVMAIN carries both new strings once, and the FD is unchanged at 0x200000. sha256 of the patch 62d09395b43bd998b8f84da293ae0d7aba4aa1f27ec9c539ab89efdc1d24464e; repacked /tmp/odin-payload-v9.img 85536768 bytes (5ab3167b…) and /tmp/odin-fd-v9.img 1650688 (040c8bb8…), FD 8f774244bdc32012…" },
    { kind = "host", reference = "FACTS.md", command = "grep -n 'linux,initrd-start' ../UniXNU/package/UniXNUPkg/Driver/UniXNURamDiskDxe/UniXNURamDiskDxe.c; grep -n 'PcdUniXNUConfigPath' ../UniXNU/package/UniXNUPkg/UniXNUPkg.dec; grep -n 'unixnu.toml\\|initrd =' ../UniXNU/scripts/unixnu/payload.py; grep -n 'gUniXNULoaderProtocolGuid' ../UniXNU/drivers/DarwinBoot/DarwinBootPkg/Driver/DarwinBoot.inf ../UniXNU/package/UniXNUPkg/Library/UniXNULib/Boot.c; grep -n 'UNIXNU_LOADER_REVISION' ../UniXNU/package/UniXNUPkg/Include/Protocol/UniXNULoader.h ../UniXNU/drivers/DarwinBoot/DarwinBootPkg/Driver/DarwinBoot.c", revision = "eb6b80045f27d4838236295ccfcdcfecfedf8ebe", result = "the nine links from ABL to XNU read in the sources rather than inferred from a boot: x0 survives BootShim, the HOB carries it, UniXNURamDiskDxe has Depex TRUE, Fat and DiskIo are in the volume, PcdUniXNUConfigPath defaults to exactly the path payload.py writes (so the reader and the volume agree without a board override), loader = \"firmware\" means no [[driver]] line and Boot.c:58 therefore LocateProtocols the in-FD DarwinBoot, and both sides include the same UniXNULoader.h where UNIXNU_LOADER_REVISION is 0x00020000, so the revision check cannot fail from a forked header. Shapes only - no row of this table is an observation, which is why the trace driver and read-boot-trace.py exist" },
    { kind = "host", reference = "scripts/sync-odin-uefi.py", command = "UNIXNU_UEFI=../Mu-Silicium python3.13 scripts/sync-odin-uefi.py --check; rm ../Mu-Silicium/Resources/Patches/Sec-EntryArg.patch; printf '# drift\n' >> ../Mu-Silicium/Platforms/Xiaomi/odinPkg/Include/RAW.inc; UNIXNU_UEFI=../Mu-Silicium python3.13 scripts/sync-odin-uefi.py --check; echo exit=$?; UNIXNU_UEFI=../Mu-Silicium python3.13 scripts/sync-odin-uefi.py; grep -c drift ../Mu-Silicium/Platforms/Xiaomi/odinPkg/Include/RAW.inc", revision = "42e726c3d8493e13ec6c2666b0d84bf17a99c60c", result = "the manual overlay copies become a checked step. Against the real trees: --check reports all 22 files current and exits 0; after deleting Sec-EntryArg.patch and appending '# drift' to RAW.inc it names exactly those two paths and exits 1; the install run reports '22 overlay files in ../Mu-Silicium, 2 installed, 20 already current', the re-check is clean and the injected drift is gone (grep count 0). The manifest is git -C uefi-odin ls-files filtered to BootShim/, Resources/Configs|Scripts|Patches|MuPatches/, Platforms/Xiaomi/ and ACPI/Platforms/ - 22 of the 25 tracked files; README.md, ACPI/README.md and .gitignore are excluded on purpose, because the checkout has its own and a sync step overwriting a third-party repository's notes is not a sync. ACPI/Platforms maps to Silicium-ACPI/Platforms (that is where odin.dsc:95 resolves odin/AcpiTables.inf); Binaries/odin stays with import-odin-uefi.py and Silicon/Silicium with apply-odin-sec-patch.py, which runs later in the same list, so entry one cannot undo the SEC handoff. Inserting it moves every later ordinal by one: apply-odin-sec-patch.py, described as the sixth of seven in the entry above, is the seventh of eight, and read-boot-trace.py's no-entry-HOB cause now names preflight entry 7 - its own self-test asserts that string, so the renumbering is checked rather than hoped. Every destination is re-read after copying, and a $UNIXNU_UEFI without Silicon/Silicium/SiliciumPkg/Sec is refused with the reason named." },
    { kind = "host", reference = "scripts/sync-odin-uefi.py", command = "python3.13 scripts/sync-odin-uefi.py --self-test; sh package/run-tests.sh | tail -3", revision = "42e726c3d8493e13ec6c2666b0d84bf17a99c60c", result = "the step is asserted on the host the way the trace reader is, in a temporary throwaway overlay/checkout pair: 13 assertions - refusal of a target that is not a firmware checkout, the manifest being the overlay Git index filtered by prefix, --check listing all six uninstalled files and writing nothing and exiting 1, install copying six, the ACPI prefix mapping landing the DSDT under Silicium-ACPI/Platforms/Xiaomi/odin, README.md and .gitignore not installed, a second install being a no-op, --check clean afterwards, a locally edited file caught byte for byte and repaired, and a file newly added to the overlay picked up without editing this script. It is suite 15 (uefi-sync) of run-tests.sh, which now prints 15 green lines." },
    { kind = "host", reference = "FACTS.md", command = "python3 - <<'EOF' # FD from the v9 image versus the FD the eight-entry build just made\nimport pathlib, zlib, hashlib\nb = pathlib.Path('/tmp/odin-fd-v9.img').read_bytes()\ni = b.find(b'\\x1f\\x8b\\x08'); old = zlib.decompressobj(47).decompress(b[i:])[192:192+0x200000]\nnew = pathlib.Path('../Mu-Silicium/Build/odinPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd').read_bytes()\nprint(sum(1 for k in range(len(old)) if old[k] != new[k]), next(k for k in range(len(old)) if old[k] != new[k]), [new.find(old[k:k+256]) for k in (0, 0x40000, 0x80000, 0xc0000, 0x100000)])\nEOF\nfind ../Mu-Silicium/Build/odinPkg/DEBUG_CLANGPDB -name '*.efi' -newermt '2026-11-06 07:00' | wc -l", revision = "42e726c3d8493e13ec6c2666b0d84bf17a99c60c", result = "a full rebuild of unchanged sources is not byte-reproducible, so the FD digest cannot be the content check this area has been using it as. Inputs verified identical first (the sync reported 22 of 22 already current before and after the build), then the FDs compared: 1,058,661 of 2,097,152 bytes differ, the first difference is at 0x7a010, and 256-byte windows taken from the old FD at 0x0/0x40000/0x80000 sit at the same offsets while the ones at 0xc0000 and beyond are found nowhere in the new FD - so content and layout both moved, not a uniform shift. The cause is on disk: 160 module .efi files newer than the build and 0 older, i.e. the whole tree relinked, and FVMAIN.Fv grew 0x908c70 to 0x90b000. Only one module kept its old stamp (the 'Nov  5 2026' string at 0xab68 is in both). The DTB digest 48cc079c is unchanged across the same builds, which is the counter-example: dtc over these sources is deterministic, the EDK II link is not." },
    { kind = "host", reference = "board.toml", command = "python3.13 ./unixnu firmware -D ../UniXNU-odin --uefi ../Mu-Silicium -j 8 (eight preflight lines in the log); python3.13 ./unixnu bootimg -D ../UniXNU-odin --uefi ../Mu-Silicium --dtb out/odin/ipados-17.7.11-21H461/odin/tree/build/odin/odin.dtb; cp …/boot/boot.img /tmp/odin-payload-v10.img; ./unixnu bootimg … --ramdisk none; cp … /tmp/odin-fd-v10.img", revision = "42e726c3d8493e13ec6c2666b0d84bf17a99c60c", result = "the eight-entry build runs sync, download, extract, import, check-odin-firmware, check-odin-dsdt --require, apply-odin-sec-patch and build-odin-dtb and ends at Build/odinPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd (2097152 bytes, sha256 59d21101…). Content re-verified in that build rather than assumed: FV/Ffs has UniXNURamDiskDxe 75CA63AD…, DarwinBoot 1B64AF87…, OdinBringupLog 6E2F6B4E…, UniXNU 9B665204… and UniXNUDxe 29B950CF… each with one EFI_FILE_NAME line in FVMAIN.inf; FVMAIN.Fv counts the entry-arg HOB GUID 2, UNIXNURAMDISK 7, DarwinBoot 4, 'fdt handoff:' 3, 'memory map:' 1, 'FREE-MEMORY' 1, 'Spurious GIC interrupt' 1, 'cannot be masked' 1 and 'unixnu.toml %a' 1; the HOB GUID is once in the FD at 0xcb78 = gSiliciumEntryArgHobGuid in Sec.map, with SecCleanInvalidateDataCacheAll at 0x75000 and gSecEntryArg0 at 0x790b8; apply-odin-sec-patch.py --check-only says already applied. Repacked: /tmp/odin-payload-v10.img 85536768 bytes (sha256 860d63a4f044415d…, kernel 6cfe4697…, ramdisk 83886080, shim 192, header_version 1) and /tmp/odin-fd-v10.img 1650688 (673a93a16104faa7…); v9 retired. Note for the next run: the payload image is 516096 bytes ABOVE 85020672, the only size this unit ever answered Booting OKAY to, and that earlier 'both images are under the accepted size' sentence in FACTS was arithmetically wrong - if a one-shot boot dies mid-Booting the first move is [payload] size_mib = 78." },
    { kind = "device", reference = "FACTS.md", command = "adb shell id; adb shell 'mount -o ro /dev/block/by-name/logfs /dev/logfs_ro; ls -l /dev/logfs_ro'; adb pull each UefiLog*.txt; python3.13 scripts/read-boot-trace.py parse <dir>; fastboot getvar product/current-slot/slot-successful:a/slot-retry-count:a; fastboot boot /tmp/odin-payload-v10.img; poll fastboot devices and adb devices", revision = "42e726c3d8493e13ec6c2666b0d84bf17a99c60c", result = "the FD that went into this run is sha256 59d21101...; the unit returned at 08:16:39 without a power-key hold, and the session measured three things the plan did not know. (1) Stock recovery runs adbd as uid=0 (context u:r:su:s0) and mounts logfs read-only, so reading the instruments needs no partition write at all - the older instruction to flash a recovery into boot_a is retired, and read-boot-trace.py grew a pull step and a read-only mount to match. (2) The five UefiLog files present at 08:20 came to Start EBS with one boot showing Apply Overlay total time: 399 ms, and neither has a ReadyToBoot line, so those runs stopped inside DXE - those logs are from the pre-instrument images, which had neither OdinBringupLog nor DarwinBoot shipping. (3) fastboot boot of /tmp/odin-payload-v10.img at 08:25 (Sending OKAY 1.939s, Booting OKAY 0.169s, nothing written) brought the unit back on its own into recovery at 08:26:30, where the 04:20 round had needed a physical recovery - the entry_probe_reset_delay = 6 build does end by itself. The catch that keeps this from being the run the port is waiting for: adb dropped after about ninety seconds, before the mount landed, so the UNIXNU.TXT that this FD writes has still not been read, and the unit has been off both channels since. Slot state read alongside it: current-slot a, slot-successful:a no, retry-count 3 (was 6), boot_a itself untouched by any of this. The first action on the next sighting is read-boot-trace.py pull." },
]

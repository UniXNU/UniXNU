procedure = ["Build UEFI through the official DeviceBuild.py and stuart path in the UEFI checkout.", "Build the payload and boot image with the official UniXNU tools after the firmware FD is available."]
findings = ["Official UEFI builds completed offline and the device reached the Darwin handoff; UFS link/DP success and later NOP/descriptor issues were observed in separate captures.", "An earlier firmware candidate ran with a mistaken UFS reference-clock setting and is recorded as unresolved; this repository does not claim that the boot LUN was written, and it does not claim that the current firmware is safe for another hardware run.", "The board now imports shared MT6989 CPU/GIC/timer resources from UniXNU-mt6989-common while keeping firmware paths and handoff policy board-specific.", "The complete arch/SoC/OS/device XNU patch sequence remains in the format 2 package graph."]
completion = ["A reviewed firmware revision builds, enters DarwinBoot, publishes the documented framebuffer and preserves the handoff memory contract."]
limits = ["The UEFI source and current unx18 safety candidate live in the separate ChallengeThePeak/Silicium-Rothko repository; current firmware runtime closure and the cause of the earlier reference-clock incident remain open."]
next_action = ["Qualify the official DeviceBuild/stuart adapter and complete UFS command/state boundary before any future matched runtime claim."]
evidence = [
  { kind = "source", reference = "board.toml", result = "Canonical ChallengeThePeak/Silicium-Rothko firmware repository, DSC, FD and package contract are recorded." },
  { kind = "host", reference = "docs/verification.md", command = "DeviceBuild.py; stuart; official payload and boot_v4 packaging", revision = "7005848b8fad68ac2a74f18547a77d92ac3f11b8", result = "The imported unx18 source snapshot built the final PHY-skip FD SHA256 7fedccdf2097080689526b0fcea14caa22c70d9dcf14af035dd841128c921bf9; this does not validate later repository edits or the full release adapter." }
]


schema_version = 1

[device]
name = "rothko"
soc = "MT6989"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Redmi K70 Ultra (MT6989) UniXNU port. Device testing reached the activation page with UFS HS-G5 root access, active CMD display presentation, Goodix/HID activity and eight-core SMP; touch interaction, key wake, Wi-Fi, Bluetooth, battery and stable post-activation behavior remain open."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "XnuPrelink"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", "patches/xnu/series", "unixnu.lock"]
inputs = ["MT6989 / Dimensity 9300 board identity, eight CPUs, 13 MHz timer, GICv3 and the iPadOS 17.7.11 / 21H461 donor profile.", "Stock effective DT, board partition geometry and the reviewed component and patch inputs."]
configuration = ["board.toml selects the rothko board, published mt6989 common source, ipados-17.7.11-21H461 profile and device:dts/rothko.dts.", "rothko_defconfig, soc:configs/mt6989.config and patches/xnu/series select the kernel configuration and ordered XNU changes.", "unixnu.lock pins woaphone/xnu-mtk branch rothko, immutable patch base 53bc420e5acda41c1689f6690a85841393a347cf and final fd4edc747395525a914987bb88f063b5e549ecc7."]
procedure = ["Run unixnu defconfig rothko_defconfig -D ../UniXNU-rothko.", "Run unixnu fetch, unixnu status --json and unixnu tree, then run scripts/porting-record.py check."]
findings = ["The device repository consumes published MT6989 CPU, PSCI, GICv3 and timer resources.", "The raw XNU feed names woaphone/xnu-mtk branch rothko at fd4edc7, but the OS profile currently overrides its effective revision with Apple d8b802.", "The selected arch/SoC/OS/device graph contains 77 patches; its full application and resulting kernel have not been qualified.", "The separate 18-patch replay from immutable 53bc420 reproduces exactly the source tree of fd4edc7.", "Board DTS is a hardware inventory/profile input; the minimal ADT generator does not parse it."]
completion = ["Effective source revision, selected patch graph, archive recipes and generated ADT must reproduce the intended K70U inputs before build qualification."]
limits = ["The full Format 2 release is not qualified: effective XNU pin, driver recipe registration and firmware build adapter remain open.", "The board DTS memory length currently differs from payload DRAM/owned-memory policy; a stock static memory node is not the live LK mblock map.", "The common layer currently covers CPU/PSCI/GIC/timer; clocks, power domains, SMMU/DMA and peripheral policy remain device-specific."]
next_action = ["Move genuinely reusable MT6989 bus, clock or power resources into the common repository only after a second device or independent hardware trace confirms them."]
evidence = [
  { kind = "source", reference = "board.toml", result = "Format 2 board identity and source contract are present." },
  { kind = "host", reference = "docs/offline-audit-2026-11-07.md", command = "unixnu status --json; release --no-deps --check; porting-record.py check", revision = "13e5973748a8447cbb90520c9a2dd5e65e272435", result = "Local profile/record inspection passed with cached common/XnuPrelink inputs; effective source revision and full build integration remain open." },
]

[[area]]
id = "firmware"
status = "host-verified"
components = ["DarwinBoot"]
paths = ["board.toml", "proprietary-files.txt", "package/**", "local.toml.example"]
inputs = ["Separate ChallengeThePeak/Silicium-Rothko firmware repository, rothko DSC/FD paths, DarwinBoot handoff, GOP framebuffer and 56 MiB payload FAT volume.", "UEFI device reset, PHY, refclk and BlockIO state are treated as firmware-owned and audited separately from XNU."]

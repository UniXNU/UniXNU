schema_version = 1

[device]
name = "piano"
soc = "SM8750"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Pad 8 Pro (piano, SM8750) boots iPadOS 17.7.11 from RAM through a Mu-Silicium based UEFI, using the SM8750 support and the board-owned storage, PMGR and firmware integration. Not booted on the device yet."

[[area]]
id = "configuration"
status = "implemented"
components = []
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore", "porting.toml", "README.md"]
inputs = ["SM8750 SoC support from the OnePlus 13T port (UniXNU-sm8750-common), an iPadOS 17.7.11 (21H461) IPSW, and a UniXNU checkout pinned by the packaging workflow."]
configuration = ["board.soc_source = sm8750; board.os_profile = ipados-17.7.11-21H461; board.kit = piano; schema_version = 2.", "configs/piano_defconfig selects the native UFS, AES, virtio block and ram block archives plus CONFIG_XNU_SHENG_PMGR; configs/piano_bootstrap_defconfig is the same selection with CONFIG_XNU_SHENG_PMGR off.", "[kernel].archives is read from board.toml, not from the defconfig, so a selection change has to touch both files."]
procedure = ["Run ./unixnu defconfig piano_defconfig -D ../device from the UniXNU checkout.", "Run ./unixnu fetch, ./unixnu ipsw fetch -D ../device and ./unixnu tree -D ../device.", "Trigger .github/workflows/package-bare-metal.yml with os=17 and jobs=4."]
findings = ["The kernel step runs as two passes. configs/piano_bootstrap_defconfig builds a kernel without the sheng PMGR binder and stages it as build/xnu-prelink/native-owner-ufs-rootauth3-candidate.macho, because build-sheng-platform-power.py refuses to start without a reference candidate ('No reference candidate available').", "The PMGR binder is listed in [kernel].archives, which the bootstrap pass also reads, so the candidate step removes that line from board.toml with python (macOS sed -i treats the next argument as the suffix), builds, and restores the file.", "build-sheng-platform-power.py compiles $TREE/kits/sheng/ShengPlatformPower.cpp, while the board ships the source at package/ShengPlatformPower.cpp; the defconfig step now copies it into both out/.../piano/tree/kits/sheng and out/.../piano_bootstrap/tree/kits/sheng.", "audit-amfi-pmgr-contract.py reads tree/.cache/firmware/kernelcache.macho/kernelcache.release.ipad7.decompressed, so the candidate step copies out/ipsw/21H461/kernelcache.decompressed there.", "The UEFI checkout is read-only, and its piano.dsc lacks the UniXNULib mapping (error 4000), so patches/uefi/piano-dsc-unixnulib.patch is applied in the prep step with the two-level uefi/uefi/pianoPkg/piano.dsc path.", "patches/xnu/series on the SoC side already carries sheng-platform-power.patch; adding it to the device series applies it twice and fails at bsd_init.c:688.", "The device release is driven by scripts/package.sh, which only resolves [package] unixnu from board.toml and hands everything else to the pinned UniXNU checkout.", "The payload cannot travel in the boot image: a vendor ABL refuses a ramdisk that large, so the bootimg step is invoked with --ramdisk none and boot.img is the UEFI firmware plus the device tree only (3162112 bytes). The payload is handed over USB instead, and the boot manager waits for it; that wait used gBS->Stall, which is a busy wait on the metronome and dispatches no event notify, so the 5 ms FbPoll timer that reads the fastboot endpoint never ran and nothing could ever be staged. PianoFastbootWaitPayload now pumps FbPoll by hand with the periodic timer cancelled.", "The board exposes only volume up (SCAN_LEFT), volume down (SCAN_RIGHT) and power (Enter), while the UniXNU menu navigated on SCAN_UP/SCAN_DOWN and treated SCAN_RIGHT as boot the selected entry. A volume press could therefore not move the highlight and the first press booted the selected entry. patches/unixnu-menu-volume-keys.patch accepts SCAN_LEFT as up and SCAN_RIGHT as down and stops treating SCAN_RIGHT as boot; power still sends Enter.", "ShengUfs hardcodes its GCC offsets in GccUfs.h and declares SM8550 clocks as a board dependency, so no ufshc nodes in piano.dts can make it work. The rest of the driver is portable: it never programs the PHY, the SMMU helper scans the stream-match table, and the root layout is parsed from the payload. scripts/prepare-shengufs-gcc.py moves the eight offsets that differ to their SM8750 values, in both the fetched feed and the assembled tree.", "CONFIG_XNU_NATIVE_LEGACY_DISPLAY stays off. Enabling it makes bsd_init.c and the mobile graphics client call native_legacy_display_probe, which only kits/sheng/LegacyDisplayProbe.cpp defines; this board ships no such file and the kernel link fails with that symbol undefined."]
completion = ["All source pins resolve, every selected component is covered by an area, and the two-pass kernel build links with the sheng PMGR archive force-loaded."]
limits = ["The UniXNU revision is pinned in the workflow; the effective component set is only visible through ./unixnu status.", "The boot image no longer carries the payload, so a boot needs the host to stage payload.img inside the boot manager's wait window."]
next_action = ["Compare ./unixnu status --json output whenever a defconfig, fragment or source pin changes.", "Boot the payload over USB and record whether the menu reports a published volume and where XNU stops.", "The DarwinBoot EL1 patch is applied inside UniXNU's driver submodule, so the prep step initialises exactly that submodule first (git -C UniXNU submodule update --init --depth 1 drivers/DarwinBoot): UniXNU itself is checked out with fetch-depth 1 and no submodules, and without the init the patch has no tree to apply to and the follow-up grep fails the job."]
evidence = [
  { kind = "source", reference = ".github/workflows/package-bare-metal.yml", result = "candidate pass, ShengPlatformPower.cpp staging and the fixed kernelcache path for the PMGR audit; the prep step also applies patches/uefi/piano-dsc-unixnulib.patch and patches/uefi/piano-fastboot-payload.patch, patches/uefi/bootshim-image-size.patch and patches/uefi/mu-sec-entry-arg.patch (the last two against uefi/deps/Mu-Silicium, because that checkout and its BootShim and SEC sources only exist after tools/setup-deps.sh), and patches/unixnu-bootimg-text-offset.patch and patches/unixnu-menu-volume-keys.patch against the pinned UniXNU checkout (the first also carries the USB bring-up trace and the payload channel), and runs scripts/prepare-unixnu-diagnostics.py on its UniXNULib/Config.c, and runs scripts/prepare-shengufs-gcc.py on its out directory after the tree step" },
  { kind = "source", reference = ".github/workflows/package-bare-metal.yml", result = "the bootimg step passes --ramdisk none, so the run reports 'ramdisk: empty' and a 3162112-byte boot.img while the 160 MiB payload.img stays a separate artifact" },
  { kind = "source", reference = "scripts/prepare-shengufs-gcc.py", result = "rewrites GCC_UFS_PHY_AHB_ENABLE 0x77024 to 0x77028, TX_SYMBOL0 0x77028 to 0x7702c and RX_SYMBOL0 0x7702c to 0x77030 (two of these swap roles with a neighbour), plus UNIPRO_CORE 0x7706c, ICE_CORE 0x7707c, PHY_AUX 0x770bc, RX_SYMBOL1 0x770d8 and AGGRE_AXI 0x770f0; it fails when no GccUfs.h exists and is idempotent" },
  { kind = "source", reference = "patches/unixnu-menu-volume-keys.patch", result = "Menu.c accepts SCAN_LEFT as up and SCAN_RIGHT as down, and SCAN_RIGHT no longer boots the selected entry" },
  { kind = "device", reference = "reports/uefi-boot-42968500580.md", command = "fastboot boot boot.img; fastboot stage payload.img; fastboot oem ramdisk; then volume up/down and power on the UniXNU menu", revision = "f37b9f3866df66105c93483df2551e528b61836a", result = "Menu.c accepts SCAN_LEFT as up and SCAN_RIGHT as down; volume up/down move the highlight and power confirms (operator-confirmed on the device). The USB payload path reaches the boot manager: staging the 160 MiB payload.img takes 1.370 s, so the FbPoll pump works, but 'fastboot oem ramdisk' answers 'cannot publish the payload' because PublishVolume copied the buffer with a 160 MiB AllocatePool that returned out of resources. Reverted to aliasing the staged buffer in c75b22e; not yet re-tested." },
  { kind = "source", reference = "configs/piano_bootstrap_defconfig", result = "bootstrap selection: identical to piano_defconfig except CONFIG_XNU_SHENG_PMGR, with CONFIG_XNU_NATIVE_LEGACY_DISPLAY left off because kits/sheng/LegacyDisplayProbe.cpp is absent" },
  { kind = "source", reference = "board.toml", result = "board identity, component selection, [kernel].archives and [package].unixnu the packaging workflow consumes" },
]

[[area]]
id = "firmware"
status = "implemented"
components = []
paths = ["proprietary-files.txt", "patches/uefi/**"]
inputs = ["Mu-Silicium based UEFI for SM8750, spliced through tools/setup-deps.sh, plus the board UEFI repository pinned by the workflow."]
configuration = ["[firmware] config = piano, dsc = Platforms/Xiaomi/pianoPkg/piano.dsc, fd = Build/pianoPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd.", "[firmware].packages lists the UEFI root, {tree}/package, {tree}/kits, {tree}/drivers/DarwinBoot and the EDK II/Mu trees.", "[firmware.defines] UNIXNU = 1 and DEVICE_MODEL = piano."]
procedure = ["Run uefi/tools/setup-deps.sh in the UEFI checkout.", "Apply patches/uefi/piano-dsc-unixnulib.patch at the repository root.", "Run ./unixnu build firmware -D ../device --uefi ../uefi/deps/Mu-Silicium."]
findings = ["The firmware volume failed with error 4000 ('Instance of library class [UniXNULib] is not found for module ... UniXNU.inf') because pianoPkg/piano.dsc had no LibraryClasses mapping for UniXNULib; the patch adds it.", "ENABLE_SECUREBOOT defined empty made '#if ENABLE_SECUREBOOT == 1' an invalid token; the DSC now defines it as 0.", "The firmware packages list needs drivers/DarwinBoot rather than the older PaganiDarwinBoot path.", "The payload cannot travel in the boot image: a vendor ABL refuses the 160 MiB ramdisk (oem debuglog shows UNIXNURAMDISK publishing the stale 38.9 MB Android initrd the device tree still names), and vendor_boot is only 96 MiB, so neither field fits a 125 MB kernel. The fastboot path carries it instead: FB_MAX_DOWNLOAD rises to 256 MiB, 'oem ramdisk' publishes the staged bytes as a read-only BlockIo volume for the FAT driver, and DeviceBootManagerAfterConsole waits up to 180 s for that volume before UniXNU scans the volumes once (twenty seconds raced the host's re-enumeration: the firmware drops off the bus shortly after the menu is drawn, so every attempt lost the enumeration and nothing was ever staged). The patch also keeps the fastboot bring-up trace: the UsbDevice protocol and StartEx results are printed and held, and both are retried (10 x 200 ms and 5 x 300 ms). PmicDxe stays disabled: its SPMI channel 690 access faults because ABL no longer grants that channel to the apps execution environment, and the fault is what the vendor comment records. UFS still enumerates, so the protocols the storage path needs are provided by the unconditionally loaded charger and platform drivers; a StartEx failure would point at the rails rather than at a missing protocol.", "The stock boot manager never started UniXNU.efi: DeviceBootManagerAfterConsole ran PianoDtbInstall, PianoFastbootStart, StartEspLoader and StartFvApp(AndroidBoot), so the menu built into the firmware volume was unreachable. The first patch added a StartFvApp call with UniXNU's FILE_GUID; the board then booted UEFI all the way to the console and dropped into the UEFI Shell instead of the menu, because StartFvApp built its device path from DevicePathFromHandle(LoadedImage->DeviceHandle), which inside BDS does not carry a usable firmware volume path, so EfiBootManagerBoot failed silently. StartFvApp now reads the PE32 section with GetSectionFromAnyFv and calls LoadImage/StartImage itself, and prints each outcome on the console so the next boot states whether the image is in a volume, failed to load, or returned.", "The payload volume publishes on the device: build 43001198573 (28ab843) answers 'fastboot oem ramdisk' with OKAY in 11 ms after 'stage' moves 160 MiB in 3.918 s, and the UniXNU menu then offers the xnu entry (reports/uefi-boot-43001198573.md). The earlier 'cannot publish the payload' was the duplicated A9C6827C device path, not the transfer buffer: with 3E7B9C41 and no 160 MiB copy the install succeeds. The memory log is not retrievable in that session - oem debuglog plus get_staged return 0 bytes, because the firmware stops servicing the fastboot endpoint once UniXNU takes the console.", "The fastboot poll timer is re-armed after the payload window. PianoFastbootWaitPayload cancels the 5 ms FbPoll timer so it can pump the endpoint by hand, and only restored it on the no-payload path: once the payload arrived the firmware still answered 'oem ramdisk' but ignored 'oem debuglog', which is why the 43001198573 run produced a 0-byte memory log right after a successful publish. Both paths re-arm now, so UniXNU's DEBUG lines stay reachable after the menu appears - the only channel this board has, since it has no serial port and the XNU display path is not up yet.", "The fastboot poll timer is re-armed after the payload window, so the memory log stays reachable once UniXNU owns the console: the 43021581743 run returned 174,337 bytes of debuglog after 'oem ramdisk' answered OKAY, where the earlier build returned 0.", "The 160 MiB FAT32 payload (2 KiB clusters) could not be read back on the device: UniXNU loaded unixnu.toml from it, but the XNU entry returned EFI_VOLUME_CORRUPTED right after opening Payloads/kernel.macho, and DarwinBoot surfaced that as 'Volume Corrupt'. Rebuilding the same three files into a 4 KiB-cluster FAT16 volume (40,915 clusters) moved the failure to the next guard, so the read succeeded; the payload step now writes FAT16 by dropping mformat's -F and asking for -c 8.", "DarwinBoot then refused the handoff with EFI_UNSUPPORTED. Its Boot() guard rejects staged kexts, a passed-in device tree, or a current exception level other than EL1; the device log shows 0 staged kexts and the entry carries no dtb (UniXNUPrepareDeviceTree returns early when Entry->Dtb is NULL), so the exception level is what fired: Mu-Silicium's SEC configures HCR_EL2 and stays at EL2, while XNU must start at EL1. DarwinBoot now accepts EL2 and switches to EL1 (HCR_EL2.RW=1, SPSR_EL2=EL1h|DAIF, ELR_EL2=entry, eret) immediately before entering the kernel, instead of the previous 'br x1' at EL2.", "The DarwinBoot patch needs its submodule first: UniXNU is checked out without submodules, so drivers/DarwinBoot is empty at prep time and the patch step must run 'git -C UniXNU submodule update --init --depth 1 drivers/DarwinBoot' beforehand.", "The package workflow takes a 'runner' workflow_dispatch input (macos-26 default, macos-15 as a fallback) because macos-26 is a limited-preview image and a dispatch can sit queued for an hour; the job's runs-on reads that input so a stuck queue is bypassed by re-dispatching with macos-15.", "DarwinBoot now DEBUG-prints the boot request inputs (kext count, device tree pointer and size, raw CurrentEL) before its guard, because the device still returns Unsupported with the EL2 acceptance applied and every other disjunct is false in the configuration.", "The UniXNU screen surface is PixelRedGreenBlueReserved8BitPerColor on this board; keeping only the BGR case made DarwinBootVideoFromGop return EFI_UNSUPPORTED, which the menu reports as the xnu entry failing. Both orders are accepted and the buffer is passed through unchanged."]
completion = ["The firmware step emits SILICIUM_UEFI.fd for pianoPkg with the UniXNU application linked in."]
limits = ["The firmware boots and publishes the payload, but no XNU boot has been captured: the memory log is empty in every session that reaches the menu, so a failure after the menu would show only on the screen."]
next_action = ["Capture the XNU verbose output from the menu (screen or pstore): publish, menu and input are confirmed, the kernel handoff is not."]
evidence = [
  { kind = "source", reference = "patches/uefi/piano-fastboot-payload.patch", result = "reports the USB device protocol lookup and StartEx result on the console, each held for two seconds, so the piano-uefi fastboot bring-up can be diagnosed without a serial port" },
  { kind = "source", reference = "patches/uefi/piano-fastboot-payload.patch", result = "starts UniXNU.efi from the firmware volume before the ESP loader and AndroidBoot fallbacks (loading it with GetSectionFromAnyFv plus LoadImage/StartImage rather than a device path built from the BDS loaded image), and carries the payload over USB instead of the boot image ramdisk: FB_MAX_DOWNLOAD rises to 256 MiB, oem ramdisk publishes the staged bytes as a read-only BlockIo volume, and the boot manager waits up to 180 s for it before UniXNU scans the volumes, because the firmware leaves the USB bus shortly after the menu is drawn and a twenty-second window raced the host's re-enumeration" },
  { kind = "source", reference = "patches/uefi/piano-fastboot-payload.patch", result = "PianoFastbootWaitPayload raises the payload window from 20 s to 180 s (commit 28ab843): the host has to see the re-enumerated piano-uefi device, stage 160 MiB and publish it, and the firmware leaves the USB bus shortly after the menu appears, so the shorter window lost the race on every attempt. The wait pumps FbPoll by hand with the periodic timer cancelled, because gBS->Stall is a metronome busy wait that dispatches no event notify" },
  { kind = "device", reference = "reports/uefi-boot-43001198573.md", command = "fastboot boot boot-43001198573.img; fastboot stage payload-43001198573.img; fastboot oem ramdisk; then select the xnu entry on the UniXNU menu", revision = "28ab8431b5c77ff7a20e20b5f85f88afc3be2cb6", result = "oem ramdisk answers OKAY [0.011s] after stage moves 160 MiB in 3.918s, and the menu offers the xnu entry (operator-confirmed bootable). The payload volume therefore mounts: the 3E7B9C41 device path and the staged-buffer aliasing fixed the EFI_ALREADY_STARTED failure. oem debuglog plus get_staged return 0 bytes because the firmware stops servicing the fastboot endpoint once UniXNU takes the console" },
  { kind = "source", reference = "patches/uefi/piano-fastboot-payload.patch", result = "PianoFastbootWaitPayload re-arms the periodic FbPoll timer in both outcomes instead of only when no payload arrives, so 'oem debuglog' and 'get_staged' keep working after the payload volume is published and the UniXNU menu owns the console" },
  { kind = "device", reference = "reports/uefi-boot-43021581743.md", command = "fastboot boot boot-43021581743.img; fastboot stage payload-43021581743.img; fastboot oem ramdisk; fastboot oem debuglog; fastboot get_staged uefi.log", revision = "b0dcac2791caa8e3f20130f55e0c60fd14b3a478", result = "Payload volume publishes and the memory log is retrievable after the menu (174,337 bytes). With the CI-built FAT32 payload the XNU entry returns Volume Corrupt after opening kernel.macho; with a locally rebuilt FAT16 payload the same entry returns Unsupported, which is DarwinBoot's inputs/exception-level guard (0 kexts, no device tree, so EL2 against a loader that only accepted EL1)." },
  { kind = "source", reference = "patches/darwinboot-el1.patch", result = "DarwinBoot accepts EL2 in the Boot() guard and switches to EL1 before entering the kernel (HCR_EL2.RW, SPSR_EL2=EL1h|DAIF, ELR_EL2=entry, eret); applied to the pinned 3c75734 tree" },
  { kind = "source", reference = "patches/unixnu-payload-fat16.patch", result = "Payload volume is written as FAT16 with 8 sectors per cluster instead of forced FAT32, because EnhancedFatDxe cannot read the 125 MB kernel back out of the FAT32 volume" },
  { kind = "source", reference = "patches/uefi/piano-dsc-unixnulib.patch", result = "adds the UniXNULib LibraryClasses mapping that fixes the error 4000 firmware build failure" },
  { kind = "source", reference = "patches/uefi/piano-fastboot-payload.patch", result = "PublishVolume must alias the staged transfer buffer and publish on a device path of its own. The device run showed 'fastboot: publish mData=C8433000 size=0xA000000 ready=0' followed by 'fastboot: publish failed Already started': InstallMultipleProtocolInterfaces answers EFI_ALREADY_STARTED when the device path is already in the handle database, and UniXNURamDiskDxe had installed the same A9C6827C-1BD8-410C-885A-C46500F7D836 node while publishing the stale Android initrd. The volume now uses 3E7B9C41-8D52-4A6F-B1C7-2A5E9D4308BF. The copy added earlier is also gone: a 160 MiB AllocatePool returns out of resources. Status lines use DEBUG (), because Print () reaches ConOut only and never the memory log" },
]

[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu", "ArmDTPlatform"]
paths = ["dts/**", "package/*Arm*", "scripts/*armcpu*"]
inputs = ["SM8750 CPU nodes in the device tree, the ARM generic timer, and the GICv3 ranges of the SoC."]
configuration = ["CONFIG_XNU_ARMCPU, CONFIG_XNU_ARM_DT_PLATFORM and CONFIG_XNU_NATIVE_ARCH_TIMER in piano_defconfig.", "board.toml [components].include selects ArmCpu and ArmDTPlatform; [kernel].archives builds both as components."]
procedure = ["Run ./unixnu build kernel -D ../device and inspect logs/component-ArmCpu.log.", "Boot with cpus=1 in the kernel arguments (board.toml [payload].kernel_args)."]
findings = ["The first RAM boot is limited to one CPU through the cpus=1 kernel argument, so smp bring-up is not exercised yet.", "The BCM2837 panic buffer address in the shared code is not mapped on this device, so CONFIG_XNU_DT_PANIC_REGION is enabled to take the panic region from the device tree."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works."]
limits = ["Only one CPU is expected to be online on the first boot."]
next_action = ["Raise cpus once one CPU boots to user space."]
evidence = [
  { kind = "source", reference = "configs/piano_defconfig", result = "ArmCpu, ArmDTPlatform, native arch timer and DT panic region selections" },
]

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**", "package/*Memory*"]
inputs = ["DRAM layout, the reserved regions of the SM8750 firmware, and the owned memory size handed over by UEFI."]
configuration = ["[payload] dram_size = 0x180000000; [payload.adt] owned_memory_size = 0x100000000.", "[adt.defaults.u32] sleep-disabled = 1."]
procedure = ["Read the UEFI memory map from the firmware serial output and compare it with dts/piano.dts reservations."]
findings = ["The owned memory size is 4 GiB while the payload DRAM size is 6 GiB; no device boot has validated the split yet."]
completion = ["The kernel boots with the retained reservations intact and DMA of the storage and display controllers stays inside the owned range."]
limits = ["A device memory map has not been captured yet."]
next_action = ["Capture the UEFI memory map on the first boot and reconcile it with the device tree."]
evidence = []

[[area]]
id = "storage"
status = "implemented"
components = ["ShengUfs", "VirtioMmioBlock", "RamBlock", "VerifiedRoot"]
paths = ["scripts/prepare-ufs-policies.py", "scripts/build-ufs-storage-bindings.py", "scripts/build-verified-root-probe.py", "configs/**"]
inputs = ["iPadOS 17.7.11 (21H461) IPSW, the signed verified-root policies from 044-76040-038.dmg and 044-76034-038.dmg, and the original kernelcache as the ABI reference."]
configuration = ["CONFIG_XNU_NATIVE_UFS, CONFIG_XNU_NATIVE_VIRTIO_BLOCK, CONFIG_XNU_NATIVE_RAM_BLOCK and CONFIG_XNU_VERIFIED_ROOT_PROBE.", "CONFIG_XNU_NATIVE_UFS_ARCHIVE, CONFIG_XNU_NATIVE_VIRTIO_BLOCK_ARCHIVE, CONFIG_XNU_NATIVE_RAM_BLOCK_ARCHIVE and CONFIG_XNU_VERIFIED_ROOT_ARCHIVE point at the archives the kernel step builds.", "[payload].kernel_args carries native-ufs-root=1; [payload.adt].root_match_volume_uuid names the APFS volume 04769D26-2CA0-4825-B443-E2E5F88300F2 of 044-76040-038.dmg."]
procedure = ["Run ./unixnu ipsw fetch -D ../device to place the IPSW under out/ipsw/21H461.", "Run python3 scripts/prepare-ufs-policies.py --tree <tree> --inputs <ipsw> --openssl-prefix $(brew --prefix openssl@3).", "Run ./unixnu build kernel -D ../device, which builds ShengUfs, VirtioMmioBlock and RamBlock and their bindings against kernelcache.decompressed."]
findings = ["The three storage components share one set of binding objects: 468d1fd put the raw bindings only in libShengUfs.a and let VirtioMmioBlock and RamBlock reuse them, which removed twelve duplicate symbols at link time.", "67ad370 dropped a native_ufs_store_write stub already provided by NativeUfs.o, and 2b1e6ec kept only the weak native_ufs_store_write_cached stub.", "The policies step has to read the DMG files from out/ipsw/21H461, not from the device output directory (e04d7c2).", "The verified-root probe needs -Wno-missing-include-dirs because the probe compiles outside the SDK include set (70c6fc7).", "The binding scripts take the kernelcache as the ABI reference and the PMGR audit reads it from tree/.cache/firmware/kernelcache.macho/, so the candidate step copies it there."]
completion = ["The kernel links with the storage archives, the prelink succeeds, and the payload declares the native UFS root."]
limits = ["No UFS controller has been probed on the device; the APFS root has never been mounted."]
next_action = ["Boot with native-ufs-root=1 and capture the first UFS probe output."]
evidence = [
  { kind = "source", reference = "scripts/prepare-ufs-policies.py", result = "extracts and signs the verified-root policies from the two iPadOS DMG inputs" },
  { kind = "source", reference = "configs/piano_defconfig", result = "storage selections and archive paths the kernel links" },
]


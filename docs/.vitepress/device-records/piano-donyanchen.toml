  { kind = "source", reference = "patches/uefi/bootshim-image-size.patch", result = "bootimg rejected run 42816650617 with 'the ARM64 image header does not describe the shim plus the firmware volume': the pinned Mu-Silicium writes FD_SIZE alone into the image_size field (0x300000), while bootimg requires len(shim) + FD_SIZE (0x300070). The patch sets the field to 'FD_SIZE + _Payload - _Head'. It also writes 0 into the text_offset field instead of FD_BASE, because piano's ABL reads text_offset as a displacement from the load address: the absolute 0xA7100000 made it place the image outside its reservation and the tablet returned to fastboot with a black screen after 'Booting OKAY'. The stock piano kernel reports text_offset 0x0; an aarch64-none-elf build of the patched shim gives 112 shim bytes with _Payload at 0x70, text_offset 0x0 and image_size 0x300070" },
  { kind = "source", reference = "patches/uefi/piano-fastboot-payload.patch", result = "piano's DeviceBootManagerAfterConsole starts the ESP loader and AndroidBoot and never started UniXNU.efi, so the menu the board builds into its own firmware volume was unreachable; the patch calls StartFvApp with UniXNU.efi's FILE_GUID (9B665204-A133-47A2-9396-9E2B370A4E25) before the ESP and Android fallbacks" },
  { kind = "source", reference = "patches/uefi/mu-sec-entry-arg.patch", result = "Mu-Silicium SEC overwrites x0 before it reads it, so the device tree pointer the Android bootloader passes is lost; UniXNURamDiskDxe then reports 'no entry argument HOB' and never publishes the payload volume, which leaves the boot menu without an entry. The patch keeps x0 in x19 across the platform initialisation, passes it to SecEntry and builds the DAEE82E6-8090-4E72-BFB9-78C13CD4E359 HOB once the HOB list exists (the same fix the marble port needed)" },
  { kind = "source", reference = "patches/unixnu-bootimg-text-offset.patch", result = "bootimg.py required text_offset to equal FD_BASE, which is the Mu-Silicium convention, while the ARM64 specification defines the field as a displacement from the load address and piano's ABL reads it that way (its stock kernel reports 0). The shim now writes 0, so the patch accepts 0 or the firmware base and keeps the image-size check strict" },
  { kind = "source", reference = "board.toml", result = "[bootimg.image] kernel_compression = none follows uefi/piano.toml [boot_image_kernel] kernel_compression = none; without it bootimg falls back to its gzip default for a board that asks for an uncompressed kernel field" },
]


[[area]]
id = "gpu"
status = "not-applicable"
components = []
paths = ["dts/**", "package/*Gpu*", "package/*Adreno*"]
inputs = ["Adreno 830 GMU and SMMU, which are out of scope for the first RAM boot."]
configuration = ["CONFIG_XNU_NATIVE_ADRENO is not set in piano_defconfig."]

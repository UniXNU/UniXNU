configuration = ["No network component is selected in board.toml."]
procedure = ["Not applicable for the first RAM boot."]
findings = ["The community SM8750 support has no working Wi-Fi component for this platform, so the first boot is offline."]
completion = ["Not applicable while the network component set is empty."]

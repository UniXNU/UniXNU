[[area]]
id = "power"
status = "implemented"
components = ["AppleKeyStoreState"]
paths = ["package/ShengPlatformPower.cpp", "scripts/build-sheng-platform-power.py", "scripts/audit-amfi-pmgr-contract.py"]
inputs = ["The original ApplePMGR implementation of the reference kernelcache, and the 340-entry provider table of IOPMGR."]
configuration = ["CONFIG_XNU_SHENG_PMGR in piano_defconfig; the bootstrap defconfig leaves it off.", "[payload].kernel_args carries sheng-pmgr=2."]
procedure = ["Build the bootstrap kernel without the PMGR binder and stage it as the reference candidate.", "Run ./unixnu build kernel -D ../device, which runs build-sheng-platform-power.py against that candidate.", "Read logs/archive-15-build-sheng-platform-power.log."]
findings = ["build-sheng-platform-power.py audits the AMFI read/OR/write sequence and the AppleT8011PMGR provider slots of the reference candidate before it emits the archive, and refuses to build when either check fails.", "The instrument inherits only the two original AON slots (320, 321) from ApplePMGR and refuses every unimplemented slot through unavailable(), so a missing power backend stops instead of writing.", "The bootstrap pass cannot run the same binder because the binder is the thing that needs the candidate it produces; the candidate step therefore strips it from [kernel].archives for that pass only.", "The archive is registered late (llvm-objcopy removes __DATA,__mod_init_func) and the script asserts the late registration cannot change the instructions of the object."]
completion = ["The kernel links with libShengPlatformPower.a force-loaded and keeps the original AMFI and PMGR dispatch unchanged."]
limits = ["The instrument is a refusal-first integration, not a functional power backend, and is not runtime qualified (runtime_qualified = false in its build report)."]
next_action = ["Read the sheng-pmgr=2 output on the first boot and record which slots refuse."]
evidence = [
  { kind = "source", reference = "package/ShengPlatformPower.cpp", result = "guarded PMGR provider that inherits only the original AON slots" },
  { kind = "source", reference = "scripts/build-sheng-platform-power.py", result = "candidate-backed audit, original bindings and late registration of the PMGR archive" },
]

[[area]]
id = "packaging"
status = "planned"
components = ["DarwinBoot", "XnuPrelink", "SoftwareAES"]
paths = ["scripts/*payload*", "scripts/*image*", "scripts/*flash*", "patches/xnu/**", "package/Kit.toml", "scripts/build-software-aes-bindings.py"]
inputs = ["The linked XNU kernel, the prelink tool at kits/XnuPrelink, the iPadOS 17.7.11 kernelcache as the prelink hash reference, and the DarwinBoot booter."]
configuration = ["[kernel.prelink] tool = kits/XnuPrelink/emit_prelink.py, kernel = build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf, slide = -0x1000000.", "[kernel.prelink].kernelcache_sha256 pins the 21H461 kernelcache; [kernel.prelink].roots lists the eleven IOKit and kext roots the prelink closure keeps.", "[bootimg] embed_payload = true, partition = unixnu, lba 44928768..61705983 at 4096 bytes per LBA, with OS and SystemOS windows."]
procedure = ["Run ./unixnu build kernel -D ../device, then ./unixnu build package -D ../device.", "Run ./unixnu build firmware --uefi ../uefi/deps/Mu-Silicium, ./unixnu build payload -D ../device and ./unixnu bootimg -D ../device."]
findings = ["The kernel links and prelinks successfully on the macOS runner: kernel.macho sha256 4c9dcef0... was produced in run 42755922774.", "The DarwinBoot firmware package registers the board store hooks and the VerifiedRoot policy archive (5e6b930).", "The payload requires the linked kernel to carry the sheng PMGR integration; dropping CONFIG_XNU_SHENG_PMGR or the archive makes it fail with 'native UFS root kernel lacks the linked sheng PMGR integration'.", "The boot image targets a unixnu partition, but the device currently has only userdata, super and metadata. The Partition Manager layout and the DSU-style approach of the Pagani port are both still open."]
completion = ["Kernel and prelink succeed, the payload contains every declared input, and boot.img matches the bootloader format and size limit."]
limits = ["payload and bootimg have not completed yet, and no boot img has been flashed or RAM-booted."]
next_action = ["Complete the payload and bootimg steps, then decide between a unixnu partition and a DSU-style RAM boot before touching the device."]
evidence = [
  { kind = "source", reference = "board.toml", result = "prelink tool, kernel path, slide, roots and the boot image partition geometry" },
  { kind = "source", reference = ".github/workflows/package-bare-metal.yml", result = "kernel, package, firmware and payload steps pass on run 42812944686 (head 0c76f70); the payload step emits payload/payload.img at 160 MiB and the hardware device tree at device-tree/hardware.dtb, and the boot image step takes both --uefi and --dtb because it compiles BootShim, runs the Mu-Silicium mkbootimg.py and embeds the device tree in the image header" },
  { kind = "source", reference = "patches/uefi/bootshim-image-size.patch", result = "bootimg rejected run 42816650617 with 'the ARM64 image header does not describe the shim plus the firmware volume': the pinned Mu-Silicium writes FD_SIZE alone into the image_size field (0x300000), while bootimg requires len(shim) + FD_SIZE (0x300070). The patch sets the field to 'FD_SIZE + _Payload - _Head'; an aarch64-none-elf build of the patched shim gives 112 shim bytes, _Payload at 0x70 and image_size 0x300070" },
  { kind = "source", reference = "board.toml", result = "[bootimg.image] kernel_compression = none follows uefi/piano.toml [boot_image_kernel] kernel_compression = none; without it bootimg falls back to its gzip default for a board that asks for an uncompressed kernel field" },
]

[[area]]
id = "diagnostics"
status = "planned"
components = ["VerifiedRoot", "AppleKeyStoreState"]
paths = ["scripts/check-*", "scripts/probe-*", "scripts/audit-*", "scripts/read-*", "scripts/data/**", "package/tests/**", "package/*Tests*", "package/*Diagnostic*", "package/*Probe*", "package/Boot*", "package/linux-log/**", "unixnu.lock"]
inputs = ["UEFI serial output, the XNU verbose boot log, and the boot_progress_poll weak stub added in d185787."]
configuration = ["CONFIG_XNU_EARLY_BOOT_PROGRESS is enabled; CONFIG_XNU_BOOT_PROGRESS is not set.", "[payload].kernel_args carries -v, debug=0x14e, startup_debug=0 and pagani-platform-status=1."]
procedure = ["Capture the UEFI serial console during fastboot boot.", "Read the panic and progress lines from the captured output."]
findings = ["The early boot progress path needs boot_progress_poll, which a weak stub provides until a board implementation exists (d185787).", "Several patch series add panic output for early boot (zzzz-early-boot-progress, zzzzz-root-panic-progress, zzzz-boot-progress-panic-output), so a failure before serial init still reaches the screen."]
completion = ["Each claimed milestone has a reproducible command, a matching image revision and an accessible result."]
limits = ["No serial capture of a device boot exists yet."]
next_action = ["Set up a serial or pstore capture before the first RAM boot."]
evidence = [
  { kind = "source", reference = "patches/xnu/series", result = "early boot progress and panic output patches applied to the XNU tree" },
]

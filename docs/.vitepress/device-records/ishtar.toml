configuration = ["CONFIG_XNU_BOOT_PROGRESS=y selects the boot-progress observer in gpu_defconfig.", "Two implementations provide the entry points: BootProgressMin.c is self-contained and links into any configuration, while BootProgress.c is the full monitor and requires the audited UFS, owner-root, Virtio and source-corecrypto build.", "payload.panic_screen = true and payload.panic_framebuffer give the panic path a place to draw."]
procedure = ["Run scripts/build-boot-progress-min.py to build libBootProgress.a and confirm the undefined-symbol gate passes.", "Boot the image and photograph the panel; the last numbered log line identifies the stage the kernel did not survive.", "Compare the last stage against the checkpoint list to pick the next area to investigate."]
findings = ["The observer must never fault: a diagnostic that faults turns a hang into a hang with no output. Every kernel pointer is probe-translated with AT S1E1R before it is read, and every framebuffer store is bounded by the geometry the console reported.", "boot_progress_active() stays false until a framebuffer has been validated, so a board with no usable framebuffer keeps its normal console output instead of going silent.", "Once the observer binds, the normal console output is suppressed; a rendering fault therefore leaves a half-drawn screen with no textual output. The panic screen is a separate mechanism and is unaffected.", "The self-contained implementation is chosen by default because the full monitor reads UFS and Virtio counters directly and fails the link in a reduced configuration.", "A fixed-size literal destination can be constant-folded into mov/movk immediates, so a string that is visibly in the source may not appear in __cstring. Verifying that a patch reached the image needs a string that is genuinely stored as a literal."]
completion = ["The screen shows the boot-progress panel and the last logged stage identifies where the kernel stopped."]
limits = ["The observer has never rendered on ishtar hardware; its layout has only been verified on the host with a synthetic framebuffer.", "The full monitor implementation cannot be selected without the audited storage, owner-root, Virtio and corecrypto build."]
next_action = ["Boot the boot-progress image on ishtar and record the last logged stage together with a photograph of the panel."]


[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["dts/ishtar.dts", "board.toml"]
inputs = ["8 GiB declared DRAM at 0x80000000.", "Splash framebuffer reserved region at 0xb8000000, size 0x2b00000.", "Payload DRAM size and owned memory size recorded in board.toml."]
configuration = ["dts/ishtar.dts declares memory@80000000 with reg = <0 0x80000000 0x2 0x0>, which needs two size cells because a single 0x200000000 literal is truncated by dtc.", "reserved-memory/splash_region is labelled cont_splash_region and marked no-map so the kernel never allocates over the firmware's framebuffer.", "payload.dram_size = 0x200000000; payload.adt.owned_memory_size = 0x130000000."]
procedure = ["Compile the board DTS and confirm the memory node size is 0x200000000 rather than a truncated value.", "Inspect the generated ADT for the owned memory size and the reserved region list before assembling the payload."]
findings = ["Declaring less DRAM than the phone physically has is deliberate: the physmap and the page-table allocator will otherwise reach addresses no DRAM backs. The SM8550 reference boards declare less than the fitted DRAM for the same reason.", "The reserved splash region must stay no-map. Mapping it as normal memory lets the page-table allocator hand out the framebuffer and the firmware's splash output disappears.", "The size cell count is the single easiest value to get silently wrong; dtc truncates a 64-bit literal in a one-cell property without failing."]
completion = ["The ADT reports the intended DRAM and owned memory sizes and the reserved splash region appears in the handoff list."]
limits = ["Memory has not been validated on hardware; the declared size follows the reference board policy rather than a measurement of this unit.", "SMMU and DMA address-translation ownership is not configured for this board."]
next_action = ["Compare the ADT memory description against the firmware's memory map on the first device boot."]


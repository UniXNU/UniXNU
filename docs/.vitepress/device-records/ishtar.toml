schema_version = 1

[device]
name = "ishtar"
soc = "SM8550"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi 13 Ultra (ishtar) reuses shared SM8550 support and the sheng kit, and owns its board tree, partition geometry, firmware package and payload policy. This record states what is implemented, what is only configured, and what has not been observed on hardware."

[[area]]
id = "configuration"
status = "implemented"
components = []
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", "patches/**", ".github/**"]
inputs = ["SM8550 shared source pinned in feeds.toml at 23b2049fcd9e30356161def84231334fb55ecca9.", "iPadOS 17.7.11 build 21H461 OS profile.", "Board identity xiaomi,ishtar and the sheng kit reused unchanged."]
configuration = ["board.schema_version = 2; board.name = ishtar; board.soc = SM8550; board.kit = sheng; board.os_profile = ipados-17.7.11-21H461.", "kernel.defconfig = sheng_defconfig; config_fragments apply arch, soc then os, and the device defconfig applies last.", "kernel.patch_series is arch, soc, os then device, so a board patch cannot be shadowed by a shared one."]
procedure = ["Run ./unixnu defconfig sheng_defconfig -D ../UniXNU-ishtar from UniXNU.", "Run ./unixnu status --json -D ../UniXNU-ishtar and confirm profiles resolve in ARM64, SoC, OS, device order.", "Run ./unixnu tree -D ../UniXNU-ishtar and confirm kits/sheng is selected and the device package lands in tree/package."]
findings = ["The board reuses kit sheng because the package scripts, ADT generator and archive plan are shared with the SM8550 reference board; only board.toml values and the device tree differ.", "Arrays replace inherited selections rather than extending them, so kernel.archives lists every archive the link needs even though most entries come from sheng.", "Three defconfigs exist for different purposes: sheng_defconfig carries the board build, gpu_defconfig enables CONFIG_XNU_BOOT_PROGRESS, bringup_defconfig disables every optional component for early entry debugging."]
completion = ["All source pins resolve, status reports the intended overrides, and tree/ contains the device package plus the shared scripts."]
limits = ["The board does not yet carry its own kit; it inherits sheng's. A divergent board package would need kits/ishtar and a board.kit change.", "gpu_defconfig currently leaves CONFIG_XNU_NATIVE_UFS, CONFIG_XNU_NATIVE_LEGACY_DISPLAY and CONFIG_XNU_NATIVE_MOBILE_DISPLAY disabled."]
next_action = ["Split the board-specific package code out of kit sheng once the bring-up stabilises, so the ishtar tree stops depending on sheng's file layout."]


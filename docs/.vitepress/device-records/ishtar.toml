reference = "configs/gpu_defconfig"
result = "gpu profile builds without the boot-progress layer (CONFIG_XNU_BOOT_PROGRESS=n); the kernel baseline guard requires the audited native-UFS and owner-root builds, which this profile does not carry yet."
[[area.evidence]]
kind = "source"
reference = "board.toml"
result = "gpu archive plan keeps build-adreno-link-stubs.py; build-gop-legacy-display.py was tried and reverted because its audit-mobile-graphics-legacy step needs the owner-root reference candidates (native-owner-*-candidate.macho) that only the audited UFS/owner-root chain produces. The GPU/display kit is tracked as its own workstream."
[[area.evidence]]
kind = "source"
reference = ".github/workflows/package.yml"
result = "tools step now installs the lld-link toolchain (dtc llvm lld cmake mtools ipsw) with a fail-fast check, matching the upstream packaging template; the kernel link needs lld-link on the macOS runner."
[[area.evidence]]
kind = "source"
reference = ".github/workflows/package.yml"
result = "the ishtar device binaries are vendored in the uefi-sheng fork and installed into Binaries/ishtar before packaging, because the Binaries submodule upstream does not carry this device; the firmware build needs RawFiles/SecParti.cfg from there."
[[area.evidence]]
kind = "source"
reference = ".github/workflows/package.yml"
result = "the uefi-sheng checkout is recursive, because the firmware volume submodules are the binary modules the volume builds from (the framework template and docs say so); the ishtar Binaries set is then installed over the submodule path."
[[area.evidence]]
kind = "source"
reference = "board.toml"
result = "bootimg.dtb names ../device-tree/hardware.dtb relative to the tree, which is where the dts build writes it; the release flow passes it to bootimg, which otherwise fails with device tree (--dtb) not found."
[[area.evidence]]
kind = "source"
reference = ".github/workflows/package.yml"
result = "the images leave the runner encrypted: a random AES-256 key encrypts the tar, and RSA-OAEP to ci/boot-image-recipient.pem protects the key, because the images carry the prelinked Apple kernelcache."








[[area]]
id = "firmware"
status = "implemented"
components = []
paths = ["board.toml", "proprietary-files.txt", "scripts/extract-files.py", "scripts/build-uefi-sheng.sh"]
inputs = ["ishtarPkg under uefi-sheng Platforms/Xiaomi, built from the sheng firmware tree.", "Stock ishtar firmware DTB for the boot-image step.", "Vendor firmware inventory in proprietary-files.txt, fetched from the recorded upstream commit."]
configuration = ["firmware.config = ishtar; firmware.dsc = Platforms/Xiaomi/ishtarPkg/ishtar.dsc; firmware.fd = Build/ishtarPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd.", "firmware.defines sets DEVICE_MODEL = ishtar, ENABLE_SECUREBOOT = 1, MEMORY_PROTECTION = TRUE and SHIP_MODE = FALSE.", "firmware.patches applies Resources/MuPatches/Gic-Spurious.patch, shared with the SM8550 reference board."]
procedure = ["Run ./unixnu firmware -D ../UniXNU-ishtar --uefi ../uefi-sheng.", "Record the firmware commit, the produced FD path and the handoff memory map before any boot attempt.", "Build the payload, then assemble the boot image with the firmware DTB and inspect boot.json for ramdisk_bytes and dtb_appended."]
findings = ["The firmware package name and the device model are both ishtar, so the DSC, the FD path and the ADT product string must agree or the image builds under the wrong identity.", "The firmware DTB is an input to boot-image assembly only; XNU consumes the separately generated ADT, which is why device-tree and ADT values are maintained in different places.", "proprietary-files.txt fetches from a recorded upstream commit so the firmware inventory is reproducible without a local vendor dump."]
completion = ["The firmware FD builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["The firmware tree is uefi-sheng, not a dedicated uefi-ishtar repository; ishtarPkg lives inside it.", "No firmware revision or handoff memory map has been recorded from a device boot yet."]
next_action = ["Capture the firmware revision, the FD size and the handoff memory map on the first successful device boot."]


kind = "source"
reference = "board.toml"
result = "Board identity, partition geometry, archive order, firmware package, payload policy and ADT overrides"

[[area.evidence]]
kind = "source"
reference = "feeds.toml"
result = "SM8550 shared source pinned to a full commit"
[[area.evidence]]

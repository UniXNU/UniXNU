[[area]]
id = "packaging"
status = "host-verified"
components = ["XnuPrelink"]
paths = ["scripts/*payload*", "scripts/*image*", "scripts/*flash*", "patches/**", "ci/*boot-image*"]
inputs = ["The iPadOS 17.7.11 restore image of the OS profile (members fetched with range requests), a platform seed, the firmware volume, the firmware's FdtBlob."]
configuration = ["patches/xnu/series applies fuxi-touch-probe.patch after the arch, SoC and OS series.", "[payload] kernel_args set the touch probe stage and its panic report; panic_screen = true; [payload.adt] owned_memory_size 0x130000000.", "[bootimg] payload = \"image\" and [bootimg.image]: header v0 (fuxi-legacy.toml's container), text_offset 0. The options are in OddlyLabs/UniXNU branch fuxi (scripts/unixnu/bootimg.py)."]
procedure = ["./unixnu build kernel; ./unixnu build payload --uefi ../uefi-fuxi --unique-chip-id <seed>; ./unixnu build firmware --uefi ../uefi-fuxi --target DEBUG; ./unixnu bootimg --uefi ../uefi-fuxi --target DEBUG --dtb <FdtBlob>.", "CI encrypts boot.img to ci/boot-image-recipient.pem; ci/decrypt-boot-image.sh decrypts it with the owner's private key."]
findings = ["fuxi-touch-probe.patch keeps only original XNU lines as context, so changes to the shared series around it do not break it.", "Measured on hardware in matejkoo217/uefi-fuxi: the ABL's fastboot boot refuses a header v4 image (Invalid Parameter), so the fastboot image uses the v0 container; and the ABL keeps the boot image ramdisk in vendor_boot, so the payload follows the firmware volume and the image size at header offset 0x10 covers it (Kerfand: 0x0C300200 for a 192 MiB payload).", "The first kernel build in CI at 8b4c03f linked and prelinked; bsd_init calls native_touch_probe in the linked kernel.", "The CI image at 2bbd399 advertises image size 0x0C300200 (shim 0x200, firmware 0x300000, payload 0xC000000), the value Kerfand measured for a booting 192 MiB payload. gzip brings the whole image to 11.1 MiB because the payload volume is mostly free space.", "The payload's ADT has dram-size 0x80000000 and darwinboot-memory-size 0x130000000, the values of UniXNU-sheng and of both community fuxi ports."]
completion = ["Kernel and prelink succeed, payload contains all declared inputs, and the boot image matches the bootloader format and size limit."]
limits = ["The platform seed in CI is a fixed bring-up value, not the phone's own; replace it before booting to userland.", "No boot image has been started on the device."]
next_action = ["Boot the decrypted image with fastboot boot (the owner's decision) and photograph the panic screen."]
evidence = [
  { kind = "host", command = "./unixnu build kernel --device fuxi", revision = "8b4c03f69fc15878d7ee92c0f157215fa235d78d", reference = "https://github.com/OddlyLabs/unixnu-fuxi/actions/runs/41261795785", result = "Kernel linked and prelinked; bsd_init calls _native_touch_probe" },
  { kind = "host", command = "./unixnu build payload --uefi ../uefi-fuxi --unique-chip-id 0x0123456789abcdef; ./unixnu bootimg --uefi ../uefi-fuxi --target DEBUG --dtb <FdtBlob>", revision = "2bbd3993e97081db16d8ecc00c58c78f53200b8e", reference = "https://github.com/OddlyLabs/unixnu-fuxi/actions/runs/41273003819", result = "boot.img v0, 11677696 bytes (sha256 931ac9582632...), uploaded encrypted; decrypted with ci/decrypt-boot-image.sh, ci/check-boot-image.py passes: text offset 0, firmware and 192 MiB FUXIESP payload in the kernel image, FdtBlob appended, kernel.macho with the touch probe, its ADT and the boot arguments of board.toml" },
]


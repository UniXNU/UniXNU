[[area]]
id = "diagnostics"
status = "device-verified"
components = ["ShengPreflight"]
paths = ["scripts/check-*", "scripts/probe-*", "scripts/audit-*", "scripts/read-*", "scripts/prepare-*", "scripts/test-usb-ram-full.py", "scripts/boot-ram-window-once.py", "diagnostics/**", "package/*Probe*", "package/*Diagnostic*", "package/*Tests*", "package/Boot*", "unixnu.lock"]
inputs = [
  "The USB bulk console log from the receiver window, the device screen for photographed state, and the host check reports for each candidate.",
  "The device identity preflight: serial, product and unlocked state, plus the expected image SHA256.",
]
configuration = [
  "Each attempt writes to its own out/<candidate>/attempt-NN directory with the boot profile named. The test host may keep photographs and raw reports there, but those directories are not committed. The iteration log transcribes selected readings from device photographs and is the evidence available in the repository.",
  "The canonical iteration log is diagnostics/ram-root/usb-bulk.md, appended in order, with conclusions backfilled into the candidate REVIEW.",
]
procedure = [
  "Run the host checks in the order the candidate REVIEW gives, and record each real exit code rather than the exit status of a pipeline.",
  "Boot a single window with scripts/boot-ram-window-once.py or a full transfer with scripts/test-usb-ram-full.py, passing --expected-sha256.",
  "Read the log, photograph the reached stage, then append the candidate and conclusion to the iteration log.",
]
findings = [
  "Committed records available to a reader: diagnostics/ram-root/usb-bulk.md (181901 bytes), usb-bulk-evidence.json (39315 bytes), commandcode-evidence.json, full-os-audit.json, watchdog-service.md, apfs-ram-model.md, uefi-ram-transfer.md, wsl-linux-rebuild.md and windows-wsl-migration.md.",
  "An archived stop reading was corrected from 0010ff11 to DSTS=0x0010FFD1 for photograph IMG_7055. Both readings support the same conclusion: DEVCTRLHLT=0, USBLINKST=4, and the core never confirmed halt.",
  "The later XNU handoff attempts summarized here record normal_controller_stop_verified=false, so receiver stop is unverified for that attempt series. The earlier standalone v23 receiver run passed normal controller stop.",
  "The EP0 and stop model checks compile without -DFUXI_USB_DMA32 and without the two macros of the current build, so they do not test the delivered translation unit, and their fixtures are not committed. They cannot serve as host verified evidence.",
  "The ForceRM difference against the upstream dwc3_ep0_end_control_data() is a command construction difference only. V-C, which drops ForceRM, still reaches the same Endpoint Command 0x8 on Physical EP 0 timeout, and the photograph shows the difference directly: the submitted command word is cmd=108 where V-A and V-B submit cmd=908, the delta being DWC3_DEPCMD_HIPRI_FORCERM (BIT11, 0x800). With the trace macro, the UFS prefix (V-B, FUXI_DATA_PORT_UFS=0, same sequence shape) and ForceRM all tested, those three axes are closed.",
  "An intermittent failure must not be recorded as a certain one: in V-C two EndTransfer completions succeeded at the same endpoint and call site before the third failed, and the earlier reading that EP0 ENDTRANSFER never completes was wrong.",
  "A proposed fix that clears Ep0RestartFailed together with the EndTransferPending flags was rejected by the driver's own host model, which asserts at dwc3-ep0-host.c:329 that CommandWrites equals Commands and at :325 that Dwc3SetHalt on EP0 returns EFI_DEVICE_ERROR. Six of the 19 cases guard exactly this: no further DEPCMD may be written to a block whose CMDACT might never clear, which is also the suspected physical cause here. The change was withdrawn instead of deleting the protection, and the model is back to 19/19.",
  "One real consequence was confirmed while withdrawing it: the early-out at Dwc3Endpoint.c:895 returns before the DWC3_DCFG device address is cleared and before the unstall loop, so after the first END failure every later bus reset only sends messages to the receiver and changes nothing in hardware, which keeps the old device address. The conclusion is narrowed to the first failed END being the first cause and the lockout being an amplifier, so clearing the lockout is not the fix.",
  "Where a log line is ambiguous the record keeps the ambiguity: the v41 last cache-open err=2 does not contradict the successful map because several paths are probed, child=-1 with pe=-1 means the PID was not captured rather than a failed spawn, the abbreviated Rep name is unconfirmed, and the v43 SIGTRAP has no faulting PC or ESR so its direct cause is unproven.",
]
completion = [
  "Each claimed milestone has a reproducible command, a matching source or image revision, and an accessible result.",
]
limits = [
  "Candidate REVIEW.md files, the check JSON reports and the photographs live in out/ or on the host and are not committed, so evidence links point at the committed iteration log instead of the primary artifact.",
  "Board records live on feat/ramdisk-test while the catalog reads the default branch, so this area cites pinned blob URLs rather than repository-relative paths.",
  "The top level UniXNU-fuxi clone tracks only main, so it needs a fetch before the experiment branch can be inspected there.",
]
next_action = [
  "Commit each candidate's REVIEW.md and its check reports beside the iteration log so that evidence can reference the primary artifact by path.",
]


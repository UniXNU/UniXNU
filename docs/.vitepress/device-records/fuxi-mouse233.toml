schema_version = 1

[device]
name = "fuxi"
soc = "SM8550"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi 13 (fuxi). XNU for iPad7,1 iPadOS 17.7.11 boots from RAM: a UEFI USB bulk receiver takes the payload into DRAM, the UniXNU menu starts DarwinBoot, and XNU switches its root from the RAM block device to the APFS system volume."

# The receiver path is the board's mainline. Board conclusions live on
# feat/ramdisk-test in diagnostics/ram-root/, so evidence that cites them uses
# pinned blob URLs: the catalog reads the default branch, where those files are
# not committed yet.

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform"]
paths = ["board.toml", "board.full.toml", "feeds.toml", "unixnu.lock", "configs/**", ".gitmodules", ".github/**", ".gitignore", "README.md", "AGENTS.md"]
inputs = [
  "Xiaomi 13 (fuxi), SM8550, fastboot serial fcde91e with an unlocked bootloader.",
  "iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw as the unchanged OS payload.",
  "The UniXNU tree that provides the build driver, plus edk2 and XNU sources resolved into unixnu.lock.",
]
configuration = [
  "board.toml: [board] name fuxi, soc SM8550, soc_source sm8550, os_profile ipados-17.7.11-21H461, kit sheng.",
  "board.toml: [ipsw] product iPad7,1, version 17.7.11, build 21H461, device_class j120ap, chip_id 0x8011, board_id 12, fetched members KernelCache, DeviceTree, StaticTrustCache and Cryptex1,SystemTrustCache.",
  "board.toml: [kernel] defconfig fuxi_defconfig, with fuxi_full_defconfig, fuxi_ramroot_defconfig and sheng_defconfig also present in configs/.",
  "board.toml: [firmware] config fuxi and dsc Platforms/Xiaomi/fuxiPkg/fuxi.dsc; [payload] volume FUXIPAYL.",
  "feeds.toml declares the IOStorageFamily refer source at ref IOStorageFamily-315, commit e45fbe30a7879e0b16e26dddb78538f1b00e0bff, because scripts/audit-storage-interface.py needs the IOBlockStorageDevice description that the UniXNU feeds do not carry.",
  "unixnu.lock pins xnu d8b80295118ef25ac3a784134bcf95cd8e88109f and edk2 cfb93724a06ff86ff5ba971413368a7809ee42a5.",
]
procedure = [
  "Record the working state first: git status --short, because several sessions share this checkout.",
  "Parse the board: python3 -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path(\"board.toml\").read_text())[\"board\"])'.",
  "Resolve the board with the driver of the tree the candidates use: ./unixnu status -D ../UniXNU-fuxi.",
  "Validate this record: python3 scripts/porting-record.py check --device ../UniXNU-fuxi, and add --base <revision> on a proposed branch.",
]
findings = [
  "The board was format 1: board.toml carried no schema_version, so scripts/sync-devices.py classified it as a legacy entry and the generated device page was a repository link only. The identity fields schema_version = 2, soc_source and os_profile are what the catalog needs to render this record.",
  "kit stays sheng on purpose. The archive builders inherited from sheng address the device package as kits/sheng, so the value is a link name in the assembled tree, not the board identity.",
  "The upstream OS profile profiles/os/ipados-17.7.11-21H461/profile.toml already carries the same [ipsw] values (iPad7,1, 17.7.11, 21H461, j120ap, chip_id 32785, board_id 12) and the same xnu revision, so the board level [ipsw] is now a redundant override rather than the only source of those values.",
  "[components] include is empty and stays empty in this change. The board still builds the Native* sources (NativeRamBlock, NativeUfs, NativeAES, NativePrelink) that the pre-format-2 driver resolves from its own tree; those names are not in components.toml, and the record checker runs with strict catalog mode. The catalog IDs used in this record (RamBlock, ShengUfs, SoftwareAES, XnuPrelink, ArmSmmu4K) are the canonical names of the same implementations.",
  "Adding schema_version = 2 does not disturb the recovered candidates: the pre-format-2 driver ignores the key and ./unixnu status still exits 0, while the format-2 driver stops at feeds.toml needs a source with kind = \"soc\" and name = \"sm8550\".",
]
completion = [
  "board.toml, feeds.toml, the defconfigs and unixnu.lock resolve together, and the record identity matches the board name, soc and os_profile.",
  "The device page is generated from this record instead of a bare repository link.",
]
limits = [
  "The layered format 2 build path is not adopted. It needs a SoC source entry pinned in feeds.toml, a component selection, and a [device_tree] source, and this repository has no dts/ directory.",
  "The board.toml header comment described the Xiaomi Pad 6S Pro (sheng) after the fork; it now names the Xiaomi 13 (fuxi).",
  "The README now documents the fuxi RAM receiver workflow. Keep its build steps aligned with this record when the board workflow changes.",
]
next_action = [
  "Add the sm8550 SoC source with a pinned commit to feeds.toml, author dts/fuxi.dts, and fill [components] include with catalog IDs once the board builds through the layered driver; then rerun ./unixnu status and the record check.",
  "Keep the README scope, dependencies, build entry points and link to this record aligned with the current fuxi workflow.",
]


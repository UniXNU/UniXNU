[[area]]
id = "firmware"
status = "host-verified"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", "scripts/build-uefi-sheng.sh", "scripts/build-fuxi-ram-diagnostic.py", "scripts/build-preflight.sh", "scripts/build-session-image.sh", "scripts/build-flash-image.sh", "scripts/build-boot-progress.py", "package/Boot*", "diagnostics/ram-root/uefi-ram-transfer.md"]
inputs = [
  "fuxiPkg DSC and FDF in the uefi-fuxi repository, EDK2 at the pinned commit, and the Mu_Basecore tree with the BaseTools built as Linux ELF binaries.",
  "The Docker container unixnu-fuxi-build-arm64, which hosts BaseTools, the EDK2 checkout and the build Python environment.",
  "A device in fastboot mode, sequence number fcde91e, with an unlocked bootloader.",
]
configuration = [
  "[firmware] config fuxi, dsc Platforms/Xiaomi/fuxiPkg/fuxi.dsc, fd Build/fuxiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd.",
  "[firmware.defines] carries the receiver switches: TRY_SID_ROUTE, KEEP_PHY, SYSTEM_HANDOFF, DATA_PORT_UFS, DATA_PORT_PROBE, SCM_QUERY and USB_EP0_TRACE.",
  "The delivered artifact Mu-fuxi-usb-ram.img is a combined image, so a repack is not a UEFI-only change.",
]
procedure = [
  "Build the firmware entry inside the container with scripts/build-fuxi-usb-ram.py, keeping --try-usb-route --keep-phy and adding --system-handoff for system payloads.",
  "Run the four host checks (SMMU audit, USB route, receiver, image) and record real exit codes.",
  "Boot one window with fastboot boot after confirming the device with fastboot devices, then transfer.",
]
findings = [
  "The receiver ends the transfer after 180 s without host traffic and then attempts shutdown. Whether it returns to the menu or stays resident depends on the candidate, so automatic return to Android cannot be assumed.",
  "While the receiver window is open, fastboot lists no device. An empty list is not evidence of shutdown and must not trigger a retry boot.",
  "kernel_handoff in the build configuration is a configuration bit, not proof that control reached XNU.",
  "The M1 native UFS diagnostic build was disassembled and contains zero SMC instructions in the native UFS module, and the no-SMC and query variants differ by exactly one SMC site as intended.",
  "USB_EP0_TRACE=0 earlier meant the branch produced no EP0 trace at all because the FUXI_TRACE(Arg) macro expanded wrongly, not merely that logging was reduced. Opening the trace did not even compile: the macro is defined as DEBUG Arg while the call sites already carry their own parentheses, so DEBUG received two arguments. It was corrected to DEBUG (Arg) at four sites in Dwc3Endpoint.c and two in FuxiUsbRamDxe.c, and the delivered EFI now contains four FUXI EP0 strings and one USBRAM: setup rt where the parent candidate had none.",
  "Receiver shutdown is still not achieved: V-A, V-C and V-B each ended the window with STOP status=Time out and buffers retained, and the host showed no VID_1209 in 278, 109 and 250 samples across the three runs.",
]
completion = [
  "The image builds in the container, passes the host checks with exit 0, and on device reaches the UniXNU menu and DarwinBoot and calls ExitBootServices.",
]
limits = [
  "Framebuffer presentation and full reservation preservation are not verified on this board, so this area is not claimed as device verified.",
  "Receiver shutdown is unverified for the later XNU handoff attempts summarized here: they record normal_controller_stop_verified=false, and the corrected stop readback DSTS=0x0010FFD1 with DEVCTRLHLT=0 and USBLINKST=4 shows the core never confirmed halt. The earlier standalone v23 receiver run did confirm normal controller stop.",
  "USB disappearance alone does not prove the receiver stopped; a photograph of HALTED, restored routing and USBRAM QUIESCE: Success is required.",
]
next_action = [
  "Capture photographs of HALTED, route restoration and USBRAM QUIESCE: Success in one receiver attempt, then raise this area to device-verified with that attempt directory as the reference.",
]


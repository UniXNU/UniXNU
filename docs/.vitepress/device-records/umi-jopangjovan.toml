configuration = ["Enable only cpu0; retain disabled secondary topology and E/P tags for later qualification."]
procedure = ["scripts/check-hardware.py --stock-dtb /path/to/umi.dtb"]
findings = ["The host check confirms CPU affinities, GIC resources, timer rate and PSCI match stock; ADT conversion succeeds."]
completion = ["cpu is complete only after its hardware checkpoints are recorded with source/image identities."]
limits = ["Timer delivery, PSCI startup and IPIs have not been tested in UniXNU on this device."]

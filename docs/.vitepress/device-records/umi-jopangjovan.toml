schema_version = 1

[device]
name = "umi"
soc = "SM8250"
os_profile = "ipados-17.7.11-21H461"
summary = "Standalone UniXNU migration. Early source-built XNU checkpoints are observed on UMI; full kernel boot remains incomplete. HakiOS results are reference evidence only."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", "scripts/check-hardware.py"]
inputs = ["UniXNU arm64 profile, stock UMI DTB and pinned SM8250 platform source."]
configuration = ["Format 2 board; iPadOS 17.7.11 / Darwin 23.6; umi_defconfig; cpus=1."]
procedure = ["Run ./unixnu defconfig umi_defconfig -D ../UniXNU-umi and ./unixnu status --json."]
findings = ["The layered arch/SoC/OS/device configuration resolves successfully with a local development SoC override. Remote feed pins the published SoC commit."]
completion = ["configuration is complete only after its hardware checkpoints are recorded with source/image identities."]
limits = ["configuration: no standalone UniXNU hardware result yet."]
next_action = ["Resolve the pinned feed without local overrides and build the kernel after toolchain installation."]

[[area.evidence]]
kind = "source"
reference = "BRINGUP.md"
result = "Standalone board and firmware interfaces implemented; host checks documented separately."

[[area]]
id = "firmware"
status = "implemented"
components = ["DarwinBoot"]
paths = ["reports/firmware-build.json", "scripts/check-vendor-inputs.py"]
inputs = ["UMI firmware source 72279e8ff783bd108255097185415902d5c1f77e; 309 locally extracted UMI XBL files recorded by hash in the firmware repository."]
configuration = ["FD 0x9fc00000 + 0x300000; 1080x2340 GOP; board-local SEC entry-argument HOB; UniXNU/DarwinBoot/ramdisk/FAT modules."]
procedure = ["./unixnu firmware; ./unixnu package; ./unixnu bootimg --ramdisk <smoke FAT payload>."]
findings = ["DEBUG firmware builds. The reduced module set reaches the UniXNU menu and launches HelloPayload on UMI. RESULT PASS 0 passed 0 failed confirms basic EFI launch only."]
completion = ["firmware is complete only after its hardware checkpoints are recorded with source/image identities."]
limits = ["Local vendor files are not distributed. Device menu, FAT initrd discovery, basic EFI launch, XNU entry and several early initialization checkpoints are observed; full kernel boot remains unverified."]
next_action = ["Temporarily boot the standalone XNU diagnostic image and capture its last progress stage."]

[[area.evidence]]

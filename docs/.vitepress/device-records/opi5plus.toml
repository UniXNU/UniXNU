  { kind = "source", reference = "evidence/m5/M5-16-default-surface-lookup.md", result = "The default surface lives at original field +5656 and the family's creator (slot 299) is gated by an unset byte at +6016; the adapter sets the byte, retains the created surface and publishes it at +5656" },

[[area]]
id = "input"
status = "device-verified"
components = []
paths = ["dts/opi5plus.dts", "board.toml", "package/Opi5plusHid/NativeHidInput.cpp", "package/Opi5plusHidProbe.cpp"]
inputs = ["No touch panel and no input controller on the board's own wiring: no ads7846, no focaltech or novatek node, no DSI connector.", "USB: the SoC's xHCI/DWC3 controllers and the board's USB ports; USB keyboards, mice and standard HID touch screens are the intended input devices (plan.md §3.2 lists a USB HID touch screen as a P2 purchase).", "A serial or scripted injection channel, which needs no hardware and is the first step in plan.md M6."]
configuration = ["The HID device is configured outside board.toml: configs/opi5plus_display_defconfig force-loads build/opi5-hid/libOpi5plusHid.a (package/Opi5plusHid/NativeHidInput.cpp plus package/Opi5plusHidProbe.cpp), and the payload script passes the arguments it reads - opi5-hid=1 loads the original IOHIDFamily, opi5-hid-input=1|2 selects device only or device plus injector, sheng-touch-hid adds the digitizer collection, offline-hid-auto-home=<seconds> the unattended Home presses. board.toml's kernel_args lists none of them.", "The EVB10's panel half (evb10-touch*, evb10-touch-xmax/ymax, evb10-vop*) has no counterpart here - no DSI panel, no touch controller and no VOP2 scan-out for it - so none of it is enabled. The EVB10's HID half is the half that applies, and package/Opi5plusHid is its port."]
procedure = ["M6 step 1: a scripted injection channel (the counterpart of the EVB10's evb10-touch-demo) to drive the UI and measure frame rate without hardware; opi5-hid-input=2 selects it in the round-3 payload.", "M6 step 2: USB input over the SoC's DWC3 xHCI controllers. The host stack is not written here - 21H461 already carries IOUSBHostFamily, AppleUSBXHCI and IOUSBHostHIDDevice - so the step is getting those kexts into the prelink in front of this SoC's controllers rather than writing a HID driver; the limits size that work."]
findings = [
  "Measured on the board 2026-11-12 (round 3, log `logs/boot-round3.log` in the project working tree, not committed; evidence/round3-result.md): the synthetic injector's reports are accepted and they reach the userland. The injector armed with the digitizer collection ('inject: armed, mode 2, digitizer 1, 21 samples x 20 ms', line 1743), the digitizer properties were published on the event service itself ('digitizer properties published on the event service 0xfffffff361568a40', line 1869 - the line round 2 never printed), the injector saw the driver appear on it (line 1870) and IOHIDEventDriver had already opened the device (line 1756). 210 gestures produced 4,830 reports (exactly 23 per gesture: two for the Home press/release plus 21 for the swipe), fails 0 and last result 0x0 in every one of the 39 heartbeats from t+34 s to t+1171 s, open 1 throughout, and none of the three failure lines ('waiting: no event driver', 'waiting: not open', 'giving up on the open gate') appears anywhere in the capture.",
  "The reports move the UI: 16 of the round's 20 `gop blit` frames are copied in the 40 s after the lock screen first appears (4 frames held from t+900 to t+1560, then 5 at t+1575, 7 at t+1580, 11 at t+1595, 13 at t+1600, 16 at t+1605, 20 at t+1615, static to t+1800), and the operator saw the panel go Apple logo (about 00:05) -> lock screen (about 00:20) -> home screen with nothing plugged in. Round 2, with no injector, held 4 frames at t+1500, crept to 54 by t+3575 and stayed on the lock screen for all 63 minutes. The only command-line difference between the two runs is opi5-hid-input=1 -> =2, so the unlock is attributable to the injection and not to a display change.",
  "Negative results of the same run: no 'ignoring digitizer event ... from unsupported service' and no 'unsupported service' anywhere, so the reports were not accepted by the kernel and then dropped by backboardd; `vsync sent` is still 0 in every line, so the unlock happens without a vsync ever being armed; and a wireless mouse hot-plugged during the run still changed nothing, which is the expected result while the kernel has no USB host stack.",
  "Measured on the board 2026-11-11 (round 2): no USB device ever attaches (a wireless mouse hot-plugged during the run changed nothing) and no HID report reaches the userland, so the UI is visible and cannot be driven. Two readings of that run are retired as evidence and must not be used as gates again: the three 'XhcDriverBindingStart: XHCI started for controller @ ...' lines are UEFI output from the firmware's own XhciDxe.efi, printed before 'DARWINBOOT: hand-off' (evidence/round2-result.md), so they say the firmware has USB and nothing about XNU's kernel stack; and 'IOHIDSystem absent' - repeated in all 120 registry reports, one every 30 s from t+30 to t+3600 - asked for a class this kernel does not have. Both questions round 2 left open are now settled, and both are answered yes: IOHIDSystem is not a service this userland starts because the class does not exist anywhere in 21H461 (evidence/m5/M5-08), and the EVB10 touch code is the HID path this port has - its device is the one HID device in the build, and the same log shows 'NativeHidInput:0x... open by IOHIDEventDriver:0x...', so the original event driver does open it.",
  "The absence is total, measured on the 21H461 binary in round 3: the kernelcache's 40 IOHID* class names do not include IOHIDSystem, the 'site.' metaclass strings do not include site.IOHIDSystem, no C++ mangled name contains 11IOHIDSystem, and none of the 237 prelinked kexts has a personality with IOClass IOHIDSystem (com.apple.iokit.IOHIDFamily itself has seven: IOHIDResource, IOHIDEventServiceUserClient, IOHIDLibUserClient, R1 Merge, HID Game Controller Pointing Driver, ShuttleExpress and StarkPorscheWheel). The image carries the string exactly once, in __TEXT.__os_log at file offset 0xabfeac, as the macOS stackshot log 'IOHIDSystem posted stackshot event 0x%08x'.",
  "The event path that does exist, and the metric to use from now on: backboardd goes through the user-space IOHIDEventSystem/IOHIDEventSystemClient in BackBoardHIDEventFoundation, enumerates the kernel objects whose IOClass is IOHIDEventService, and IOServiceOpen creates IOHIDEventServiceUserClient or IOHIDEventServiceFastPathUserClient; nothing in that path goes through IOHIDSystem. backboardd's own 746 imports carry neither _IOHIDEventSystemClientCreate nor the strings IOHIDSystem, IOHIDResource or IOHIDDevice. Count matched IOHIDEventService instances, not a macOS class name.",
  "Round 2's 'input completely dead' was a command-line result, not a broken link. NativeHidInput sets touchEnabled only for sheng-touch-hid=1, and the round-2 line did not carry it, so the published report descriptor holds a keyboard collection and no digitizer collection: report ID 3 does not exist. native_touch_set_sink() is an empty function on this board (package/Opi5plusHidProbe.cpp:43), so touchSend() is dead code, and the only report that fires on its own - the Home report - is refused by native_hid_input_requested() (package/Opi5plusHidProbe.cpp:48-63) unless offline-hid-auto-home=<seconds> is on the command line, which round 2 also lacked. No report could ever have arrived, by design; the device was healthy (the same boot runs 'init 1 attach 1 start 1' and then IOHIDEventDriver opens it). Round 3's fix reuses the opi5-hid-input value instead of adding an argument name: 1 is round 2's behaviour (device only), >=2 builds the device, forces the digitizer collection on so report ID 3 exists, and starts the synthetic report injector, and a new name was not affordable because the line has 7 bytes left of its 1000.",
  "Input is the area where copying the EVB10 would be most tempting and most wrong: the touch half (Evb10Touch, its DSI panel and the evb10-touch-xmax/ymax coordinate arguments) is a board-specific I2C controller that has no counterpart here. The HID half is different and was already ported as package/Opi5plusHid - it is the device round 2 saw start.",
  "A USB HID touch screen is the cheapest way to get real touch events, because it speaks the standard HID report descriptor that IOHIDFamily already understands - the work then sits in the USB host path, not in a device-specific driver.",
  "The GOP frame buffer gives the input work a fixed, known coordinate space (the firmware's resolution) instead of a panel's native one, which removes the scaling problem the EVB10 solved with evb10-touch-xmax/ymax.",
  "USB is a prelink question, not a driver one: the 21H461 image carries the whole host stack (IOUSBHostFamily, AppleUSBXHCI, AppleUSBOHCI, AppleUSBEHCI, AppleUSBHub, AppleUSBHostCompositeDevice and IOUSBHostHIDDevice with its 'Generic Keyboard' personality on provider IOUSBHostInterface), and IOHIDFamily/IOHIDEventDriver are already in this port's prelink. The macOS names are all absent - AppleUSBHostFamily, AppleUSBXHCIPCI, AppleUSBTCKeyboard, IOUSBHIDDriver, AppleUSBHIDDriver - so a PCIe-matched route has no object. The RK3588's USB is SoC MMIO straight to three DWC3 xHCI controllers at 0xFC000000/0xFC400000/0xFCD00000 (two ports each) and two EHCI controllers (one port each), none of it on PCIe. The kernel side is not a symbol gap either: all-kpi.exp's 5,807 entries contain no USB symbol (the kexts provide those) and IOCreateReceivePort does not exist in XNU 10063.141.1 at all, so no stub for it. The real gap is 17 kexts that would have to enter the prelink (dependency closure 29, of which the current 31 roots cover 12); only com.apple.driver.watchdog and com.apple.iokit.IOACPIFamily are declared but have no binary in the image.", "Round 4 closed bluetoothd at the exec gate with zero code: opi5plus-block-exec=bluetoothd (patch 0006, the same patch the mobileactivationd work uses) makes the kernel refuse the daemon's exec ('opi5plus: exec of /usr/sbin/bluetoothd blocked', logs/boot-round4.log:2439) and the 'exit bluetoothd[' corpse lines fell from 268 in round 3 to 0 in round 4 - the daemon never starts at all, so its 10 s restart loop is gone rather than silenced. The board still reached the desktop by itself that round, so the unlock path never needed bluetoothd.", "Round 6's serial=1 (INPUT bit clear) closed the console's receive path for input purposes and gave its FIFO to NativeSd's reset hook (the Ctrl-] board reset, tools/wsl/serial-reset.py, verified on the board at about 19 s back to Linux; evidence/round4-6-result.md S4). Serial input is therefore not a channel on this board until the hook and a future serial reader agree on arbitration.",
]
completion = ["Reached for the scripted-injection half of the condition, measured on the board 2026-11-12 (round 3, evidence/round3-result.md): the injected HID reports reach the userland - 4,830 reports, 0 fails, last result 0x0, the event service open 1 for the whole run - and they move the UI reproducibly: the same 5.4 s gesture cycle drove SpringBoard from the lock screen into the home screen, which round 2 did not do in 63 minutes. The pointer-and-keyboard half of the condition is still unmet, because no USB device enumerates.", "Remaining for the condition as written (`pointer and keyboard events reach the userland`): a USB HID keyboard, mouse or touch screen over the SoC's xHCI controllers, which needs the host stack in the prelink; the injector stands in for it until then."]
limits = ["The injection is a scripted gesture stream, not a touch panel: one Home press/release plus one vertical swipe down the centre line every 5.4 s from t+20. It proves the HID event path end to end and says nothing about coordinates from a real digitiser, pressure, multi-touch or a second finger.", "`vsync sent` is still 0 in every vsync line of round 3, exactly as in round 2: the injected gesture reaches the compositor without any vsync being armed, so this round says nothing about the refresh path and the counter stays an open question.", "A wireless mouse hot-plugged during this run still changed nothing. That is the expected result, not a new symptom: `configs/` carries no USB configuration and IOUSBHostFamily / AppleUSBXHCI are not in the prelink, so there is no host stack for the device to attach to. The `XHCI: Initialize DWC3` / `XhcDriverBindingStart` lines in the same log are the firmware's XhciDxe.efi, printed before `DARWINBOOT: hand-off`.", "USB is 6-15 working days (1.5-3 weeks) at best, far more than one round: 17 kexts into the prelink with a dependency closure of 29, platform glue for three DWC3 xHCI controllers that are not on PCIe, and two declared dependencies (com.apple.driver.watchdog, com.apple.iokit.IOACPIFamily) that the image does not carry. The recommendation is a prelink feasibility decision first, not a scheduled port."]
next_action = ["M6 round 4 candidate 1: keep the injector in the payload as the regression input for every later round - it is the only thing that has ever moved this UI - and make the gesture set reproducible (a fixed Home press/release plus a swipe the log can name) before the round that changes the display or the GPU underneath it.", "M6 round 4 candidate 2: decide whether the USB host stack is feasible as a prelink exercise at all (17 kexts, closure 29, 6-15 working days as the limits record). This is a feasibility decision, not a port, and it is what stands between scripted injection and a real pointer or touch screen.", "M6 round 4 candidate 3: `vsync sent=0`, still unexplained after two rounds, and the horizontal banding inside the large glyphs, which this round did not revisit. Neither is blocking input; both are carried in evidence/round3-result.md.", "Keep counting matched IOHIDEventService / IOHIDEventDriver instances and never ask for IOHIDSystem again: 0 was a correct reading of a class that does not exist, and non-zero counts are what the round-3 probe prints."]
evidence = [
  { kind = "device", reference = "evidence/round3-result.md", result = "Round 3's board measurement, 2026-11-12: the injected HID reports are accepted (649 gestures, 14,927 reports, 0 fails, last result 0x0, event service open 1) and they drive SpringBoard from the lock screen into the home screen, which round 2 did not do in 63 minutes; 16 of the round's 26 `gop blit` frames fall in the 40 s after the lock screen appears. The capture itself is `logs/boot-round3.log` in the project working tree, not committed, and the page cites its line numbers. The revision named here is the commit that carries the three source changes this run measured and the evidence pages that describe it: verified on the board in commit add944299c5d4ce98a417aea53b678b6031fb387.", command = "py -3 tools/boot-uefi.py --port COM3 --baud 1500000 --log logs/boot-round3.log", revision = "add944299c5d4ce98a417aea53b678b6031fb387" },
  { kind = "source", reference = "evidence/round2-result.md", result = "Round 2's input measurements, corrected in round 3: 0 USB devices after a hot-plug, no HID report observed, IOHIDSystem absent from every 30 s registry report (a class that cannot exist), and the EVB10 touch driver running on a board with no touch controller while IOHIDEventDriver opens its device" },
  { kind = "source", reference = "evidence/m5/M5-08-iohidsystem-does-not-exist-on-ipados.md", result = "The early record that IOHIDSystem is a macOS name: no such class in the kernelcache, no personality creating one, and the iOS event path is IOHIDEventService" },
  { kind = "source", reference = "evidence/m5/M5-06-display-published-iohidsystem-missing.md", result = "The superseded 'backboardd waits for IOHIDSystem' gate, kept as the record this area no longer builds on" },
  { kind = "source", reference = "package/Opi5plusHidProbe.cpp", result = "native_touch_set_sink() is empty (line 43) and native_hid_input_requested() (lines 48-63) refuses the Home report without offline-hid-auto-home, which is why round 2 received nothing" },

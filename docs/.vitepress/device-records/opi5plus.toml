schema_version = 1

[device]
name = "opi5plus"
soc = "RK3588"
os_profile = "ipados-17.7.11-21H461"
summary = "Orange Pi 5 Plus (RK3588, 8 GiB, SD only, HDMI only). The iPadOS 17.7.11 userland boots from this repository's payload and 250+ processes run; at 2560x1440 the compositor's frames reach the panel through the firmware's GOP frame buffer and a forked IOMobileFramebufferLegacy, and the board shows its lock screen. Input does not reach the userland yet: no USB device enumerates, and the two names earlier rounds cited as evidence are retired - IOHIDSystem is not a class of this kernel, and the XHCI start lines are the firmware's, not XNU's - so the UI is visible and cannot be driven. The three places where this board differs from the RK3588 EVB10 reference port (SD instead of eMMC, HDMI through GOP instead of a DSI panel and VOP2, three RAM banks instead of one) are all implemented; the picture still carries a banding defect inside large glyphs."

# --- configuration ------------------------------------------------------------------------------------
[[area]]
id = "configuration"
status = "planned"
components = ["XnuPrelink", "ArmDTPlatform"]
paths = ["board.toml", "feeds.toml", "configs/*_defconfig", "local.toml.example", ".gitignore", "AGENTS.md", "README.md"]
inputs = ["UniXNU checkout (Python 3.11 or newer) with its module submodules initialised (kits/XnuPrelink and drivers/* are submodules and are empty after a plain clone).", "UniXNU-rk3588-common pinned at bff921845d3e72151e6b6cda528cd80eb652b70a in feeds.toml; the pin was verified to exist upstream with git ls-remote/git fetch of that exact object before it was written here.", "The OS profile profiles/os/ipados-17.7.11-21H461 (iPad7,1 / j120ap / build 21H461 / chip 0x8011) from the UniXNU checkout; it supplies the IPSW identity, the prelink inputs and the Apple device-tree identity, so no [ipsw], [kernel.prelink] or [adt.root] table is repeated here.", "A platform seed for --unique-chip-id that is not stored in any repository, and the trust caches of the IPSW.", "board/current-opi5plus.dts (the board's own decompiled device tree, 348 KB) as the fact source for memory, CPUs and peripheral addresses."]
configuration = ["schema_version = 2; [board] name/soc/soc_source/os_profile/kit; [components] include lists all six canonical components explicitly, XnuPrelink included, because the include array replaces rather than merges the arch and SoC layers.", "[kernel] config_fragments names all three fragments (arch, soc, os) and [kernel] patch_series all four series files (arch, soc, os, device) for the same reason: an array in board.toml replaces the inherited one, it does not extend it.", "[kernel] archives lists a component: entry for exactly ArmCpu, ArmDTPlatform and AppleKeyStoreState —the three catalog components whose build_stage is kernel —and does not name GopFramebuffer (embedded), DarwinBoot (firmware) or XnuPrelink (prelink).", "[payload] dram_size is in [payload], not [payload.adt]; [payload.adt] carries chip_id, unique_chip_id, owned_memory_size and packed_data_ramdisk, and deliberately omits root_match_volume_uuid and the format 1 keys cpu_regs / psci_method (both are ignored in format 2 and the values come from the DTS).", "[payload] kernel_args enables only arguments that something in the resolved build parses; each group names its reader. Arguments for absent hardware are commented out with the step that will switch them on."]
procedure = ["From the UniXNU checkout, in WSL: ./unixnu defconfig opi5plus_defconfig -D ../UniXNU-opi5plus; ./unixnu fetch -D ../UniXNU-opi5plus; ./unixnu status --json -D ../UniXNU-opi5plus; ./unixnu tree -D ../UniXNU-opi5plus; python3 scripts/porting-record.py check --device ../UniXNU-opi5plus.", "Device tree alone: dtc -I dts -O dtb -o /tmp/opi5plus.dtb dts/opi5plus.dts -i ../UniXNU-rk3588-common/dts.", "Every command has to run on Linux or macOS. The Windows host of this project drives a WSL distribution (wsl -d unixnu -u root -e bash -lc ...) because scripts/unixnu/cli.py only has Linux and Darwin branches."]
findings = ["The five commands pass. defconfig writes out/opi5plus/ipados-17.7.11-21H461/opi5plus/.config by concatenating arch:configs/common.config, soc:configs/rk3588.config, os:configs/ipados.config and configs/opi5plus_defconfig in that order; status --json reports six components, the four configuration_sources and the resolved patch order; tree assembles the build tree; the porting record validates.", "dram_size belongs to [payload] and is compared with the single memory range of the device tree (scripts/unixnu/devicetree.py generate(): payload.get('dram_size')). Written into [payload.adt] it is silently ignored, and the DTS would then never be checked against the hardware. UniXNU-evb10 also keeps it in [payload].", "In format 2, [payload.adt] cpu_regs and psci_method do nothing: the ADT's /cpus children come from the DTS CPU nodes' reg (the MPIDR affinity) and /psci comes from the DTS /psci node's method. Only scripts/unixnu/payload.py's format 1 branch passes them to an external ADT tool.", "The include / config_fragments / patch_series / archives arrays replace the inherited value. Merging is by dictionary key only (scripts/unixnu/profiles.py merge()), so an omitted entry is an omitted feature, not a default.", "The SoC repository's soc.toml has no [kernel] table: it contributes [soc] and [components] include = [ArmCpu, ArmDTPlatform] only. Every fragment, series and archive this board needs is therefore named in this repository.", "unique_chip_id = \"required\" makes the payload step refuse to run without --unique-chip-id; devicetree.py also rejects a zero seed ('Platform identity requires a nonzero u64 seed and u32 chip ID'). A zero seed in unixnu.local.toml, like the local example file this project started from, fails at the payload step, not at defconfig.", "The console arguments carry over from the EVB10 unchanged because serial@feb50000 is the same Synopsys DesignWare 16550-compatible UART at the same 1.5 Mbaud: the SoC patch rk3588-pe-serial-16550.patch and the node in rk3588.dtsi are shared, not copied."]
completion = ["Status planned. Reached: the repository materialises, resolves, assembles a tree and validates its record on a Linux host, and the device tree compiles without a warning.", "Remaining for host-verified: a kernel build and a payload build from this configuration on the build host, which needs the Linux toolchain (scripts/linux/setup-toolchain.py), the external Apple inputs and a platform seed.", "Remaining for device-verified: a payload that boots on the board."]
limits = ["This area's own status is still the skeleton's: the repository materialises, resolves, assembles a tree and validates, and nothing here is claimed beyond that.", "The 1000-byte command-line limit is enforced by payload.py before the volume is written; the two packed payloads measure 946 bytes / 52 arguments (round 1) and 993 bytes / 54 arguments (round 2), the second read back from the running kernel's own boot-args line."]
next_action = ["M3: fill patches/xnu/series, build the kernel and the payload, and turn this area host-verified with the build command and its revision.", "When the repository is published, add its entry to UniXNU's devices.toml (the RK3588 section has only evb10 today) and commit unixnu.lock."]
evidence = [
  { kind = "source", reference = "board.toml", result = "The format 2 configuration: eight sections, the six canonical components, the four patch series entries, the boot-argument rationale" },
  { kind = "source", reference = "configs/opi5plus_defconfig", result = "One kernel configuration: profiles' Adreno/mockfs/UFS/VirtIO switched off, CS hash cache and trust-cache runtime on, no board archive linked yet" },
  { kind = "source", reference = "feeds.toml", result = "SoC source pinned to bff921845d3e72151e6b6cda528cd80eb652b70a" },
]

# --- firmware and boot ---------------------------------------------------------------------------------
[[area]]
id = "firmware"
status = "implemented"
components = ["DarwinBoot", "GopFramebuffer"]
paths = ["board.toml", "dts/opi5plus.dts"]
inputs = ["A uefi-opi5plus checkout: an edk2-rk3588 derived Mu-Silicium tree with UniXNUPkg, DarwinBoot, UniXNURamDiskDxe, DiskIoDxe and Fat in its DSC/FDF. It does not exist yet (plan.md M1).", "orangepi-5plus_UEFI_Release_v1.1.img (6,915,584 bytes) from the edk2-rk3588 v1.1 release, as the prebuilt baseline that proves HDMI, USB and the serial port before anything self-built is flashed.", "16 MiB SPI NOR, currently holding the vendor loader (BL31/OP-TEE/U-Boot FIT). board/spi-backup-16MB.bin, sha256 1571be2188fe764eaaa3f0e8154719e651b7d124f9e92a3b7a5bee20cf9d74c4, is the rollback.", "The 3-pin debug UART (GND/RXD/TXD, 3.3 V) on the board's left edge and a USB-TTL module that supports 1 500 000 baud (CH343, CP2102N or FT232RL). The two Type-C ports are not serial: one is power only, the other is OTG/data."]
configuration = ["[board] kit = \"opi5plus\" names the device package mount point (kits/opi5plus in the build tree); there is no package/ directory yet, and unixnu tree supplies the UniXNU UniXNUPkg, so the tree still assembles.", "[payload] volume = \"OPI5PLUSESP\" (11 characters is the FAT limit; the name is exactly 11), size_mib = 128, loader = \"firmware\", title.", "[payload] kernel_args console group: -v, serial=1, debug=0x10014e. serial=1 keeps the console on the UART and clears the INPUT bit, so the receive FIFO has a single reader (the reset hook in package/NativeSd); debug=0x10014e lifts the serial-output lock and restarts after a panic instead of parking in KDP.", "ROM boot order and the SPI layout are the firmware repository's business; this repository only assumes the firmware loads the payload volume and prints to UART2."]
procedure = ["M1 on the board: flash orangepi-5plus_UEFI_Release_v1.1.img to /dev/mtd0 with flash_erase + flashcp, or through the data Type-C port in MaskROM with RKDevTool; then check the HDMI menu, USB keyboards and the serial log at 1 500 000 baud.", "Rollback: flashcp board/spi-backup-16MB.bin /dev/mtd0, or MaskROM plus RKDevTool if nothing boots."]
findings = ["The console facts match the EVB10 exactly: rk3588.dtsi declares serial@feb50000 as a Synopsys DesignWare APB UART (16550 compatible) with reg-shift 2 and reg-io-width 4, and the SoC series carries rk3588-pe-serial-16550.patch to bind it. Only the [userdata] geometry and the display path differ, so the console half of the EVB10 bring-up applies unchanged.", "The board has no eMMC and no NVMe, so the only way to reach a root volume from the firmware today is a USB or SD mass-storage device that this XNU does not drive. That is why [userdata] is a placeholder and why this area stays planned even though the firmware itself is the same code base as the EVB10's.", "The board's own device tree leaves uart2 disabled and the boot firmware enables it (its bootargs carry console=ttyS2,1500000). The device tree here therefore enables &uart2 explicitly; without it the ADT would have no uart16550 node and the kernel console would fall back to nothing."]
completion = [
  "Done, and verified on the board: the firmware shows its menu on HDMI, USB input works through the opi5-hid arguments, UART2 logs at 1 500 000 baud, the OPI5PLUSESP payload volume this repository writes is listed by the firmware and handed to DarwinBoot, and the DarwinBoot hand-off log prints the kernel base, entry and frame buffer.",
]
limits = [
  "No firmware repository exists for this board, so [firmware] is absent from board.toml and unixnu bootimg cannot work: the SPI NOR keeps the vendor loader and every self-built image goes in as a payload volume on the SD card. Writing SPI is refused by policy (plan.md section 9).",
]
next_action = [
  "None while the payload-volume route works; revisit only if a self-built UEFI image is needed to change the memory map.",
]
evidence = [
  { kind = "source", reference = "dts/opi5plus.dts", result = "Console node enabled on the shared rk3588.dtsi; eMMC left disabled with the reason written next to it" },
]

# --- cpu and interrupts ---------------------------------------------------------------------------------
[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu", "ArmDTPlatform"]
paths = ["dts/opi5plus.dts", "board.toml", "configs/opi5plus_defconfig"]
inputs = ["Eight cores: 4x Cortex-A76 at up to 2.304 GHz and 4x Cortex-A55 at 1.8 GHz (docs/hardware.md, MemTotal and cpuinfo from the running board).", "GIC-600 (GICv3) at 0xfe600000 with redistributors at 0xfe680000, 128 KiB per core; 24 MHz generic timer, both from the shared rk3588.dtsi and programmed by the firmware.", "PSCI 1.0 over SMC: TF-A BL31 runs at EL3 and cores started by CPU_ON arrive at EL2, which is what rk3588-smp-el2.patch handles."]
configuration = ["dts/opi5plus.dts inherits /cpus and /psci from rk3588.dtsi unchanged. The SoC file lists the four Cortex-A76 cores first (reg 0x400..0x700) and the four Cortex-A55 cores after (reg 0x000..0x300), because XNU numbers logical CPUs in node order and this kernel's scheduler takes the lowest-numbered idle core; rk3588-boot-cpu-mpidr.patch makes XNU pick its boot CPU by MPIDR instead of by node order, so the boot A55 can be the fifth node.", "[payload] kernel_args cpu group: sheng-smp=1 (ArmCpu.cpp: secondary startup is opt-in), armcpu-self-ipi=1 and armcpu-mmio-sgi=0 (the IPI path), cpumask=31 and sched-slowcpus=240.", "cpumask counts logical CPUs: 31 = 0x1f keeps logical 0..4, i.e. the four A76 cores plus the boot A55, and parks the other three A55s. sched-slowcpus=240 (0xf0) marks logical 4..7 as slow.", "No unixnu,cluster-type on the CPU nodes. The generator supports it (devicetree.py emits cluster-type 'E' or 'P'), but the RK3588 SoC repository's own guide says the working kernel runs without it, and adding it would be an untested claim; the SoC facts stay in the SoC repository."]
procedure = ["Build the kernel and check XNU's own CPU enumeration in the serial log, then run the payload on the board: the ARM64 and SoC series must apply to a fresh XNU clone first."]
findings = ["The DTS needs no CPU or PSCI work of its own: the whole topology, the MPIDR numbering and the PSCI method come from the shared rk3588.dtsi, which is exactly the split the SoC repository is for. devicetree.py then reads /cpus/*/reg for the ADT's cpuN reg values and /psci/method for the ADT's psci node, so [payload.adt] cpu_regs and psci_method are redundant in format 2 and are not written.", "Listing the A76 cores first is a scheduler workaround, not a hardware fact: the nodes are numbered cpu4..cpu7 then cpu0..cpu3 in rk3588.dtsi, and the firmware still starts an A55. Both patches that make this consistent (rk3588-boot-cpu-mpidr and the ArmCpu boot-core slot patch applied by the SoC's apply-armcpu-patches.py) are in the SoC layer and are named in [kernel] archives ahead of component:ArmCpu.", "apply-armcpu-patches.py must run before component:ArmCpu in [kernel] archives: ArmCpu has no patch channel of its own, so the SoC script patches the checkout first. Getting that order wrong silently builds an unpatched ArmCpu."]
completion = [
  "Done: eight cores are discovered, sheng-smp=1 brings the secondaries up under the EL2 entry path, and cpumask=31 leaves five logical CPUs running (the four A76 cores plus the boot A55).",
]
limits = [
  "Frequency scaling, thermal behaviour and the A76/A55 split under load are unmeasured; sched-slowcpus=240 marks logical 4..7 slow on the SoC repository's recommendation rather than on a measurement from this board.",
]
next_action = [
  "Measure the split only if the display or GPU work turns out to be CPU-bound.",
]
evidence = [
  { kind = "source", reference = "dts/opi5plus.dts", result = "Board DTS inherits /cpus and /psci from rk3588.dtsi and adds no cluster-type" },
]

# --- memory and DMA -------------------------------------------------------------------------------------
[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["dts/opi5plus.dts", "board.toml"]
inputs = ["8 GiB fitted, but not contiguous. The board's own device tree (board/current-opi5plus.dts, decompiled) describes three banks: <0x0 0x00200000 0x0 0xefe00000>, <0x1 0x00000000 0x1 0x00000000> and <0x2 0xf0000000 0x0 0x10000000>, with the rest of the property padded with zeros.", "Resulting split: low bank 0x0000_0000-0xefff_ffff minus the 2 MiB the firmware keeps, high bank 0x1_0000_0000-0x1_ffff_ffff, and a 256 MiB bank at 0x2_f000_0000. The gap 0x0f00_0000-0x0fff_ffff and everything between 0x2_0000_0000 and 0x2_f000_0000 is not described as RAM.", "A 0x1000_0000 CMA reservation at 0x1000_0000 in the vendor tree's reserved-memory, plus ramoops at 0x110000 and disabled minidump regions.", "The UEFI memory map of the firmware, which has not been read on this board yet; it is the real input for owned_memory_size."]
configuration = ["One enabled memory node with exactly one reg range: memory@100000000 { reg = <1 0x00000000 1 0x00000000> } = 4 GiB at 0x1_0000_0000, the largest single bank. devicetree.py refuses more than one range ('ADT handoff requires one contiguous DRAM range') and refuses a memory node with several ranges, so 8 GiB cannot be declared as the board really is.", "[payload] dram_size = \"0x100000000\" (4 GiB) matches that range byte for byte. A mismatch fails with 'payload.dram_size differs from the hardware DTS'.", "[payload.adt] owned_memory_size = \"0xF8000000\" (3.875 GiB; raised from 0x80000000 on 2026-11-09). This is the window DarwinBoot claims from the UEFI memory map: the first run of conventional memory long enough to hold it, taken from that run's first 2 MiB boundary.", "Why the high bank and not the low one: the high 4 GiB range has no TF-A, OP-TEE, firmware-volume or Rockchip carve-out in it, and it lies entirely above 4 GiB, so a 32-bit DMA engine cannot reach it by accident. The low bank is 3.83 GiB and carries the firmware's own reservations."]
procedure = ["Compare three things on the board: the firmware memory map (UEFI shell memmap or the DarwinBoot log), the memory node in dts/opi5plus.dts, and the dram-base/dram-size/darwinboot-memory-size the generated ADT carries. The ADT sidecar can be read out of the payload image with mcopy -i payload/payload.img ::/EFI/UniXNU/Payloads/kernel.macho.adt."]
findings = ["plan.md's M2 table assumes dram_size 0x200000000 (8 GiB) for this board. That is not expressible: the board's RAM is three ranges, and the ADT handoff takes one contiguous range whose size [payload] dram_size must equal. Declaring 8 GiB would describe memory the board does not have between 0x0f00_0000 and 0x1_0000_0000 and between 0x2_0000_0000 and 0x2_f000_0000.", "The vendor tree pads the memory reg property with zeros to a fixed length (the property carries 46 cells for three ranges). This is why reading it needs care: the trailing zeros are padding, not a fourth range starting at 0.", "The 2 MiB at the bottom (0x0-0x1f_ffff) is not RAM in the vendor description; the low bank starts at 0x0020_0000. Any future decision to declare the low bank instead of the high one starts from 0x0020_0000, not from 0.", "The 2 GiB starting value was justified with 'the kernel's DMA reaching only the low 4 GiB is a constraint of the board's controllers'. That does not hold for the only block device this board has: package/SdHost is PIO only (SdHost.h:19-22 'IDMAC is left out on purpose', :529 'DMA off'), so nothing on the storage path needs a 32-bit-reachable window.", "Measured on the board 2026-11-09 with the firmware carrying gEfiMdeModulePkgTokenSpaceGuid.PcdImageLargeAddressLoad=FALSE (logs/boot-r2a-3.log): owned_memory_size 0xF8000000 makes DarwinBoot take the window from the high bank, 'DARWINBOOT: ARM64 ... pa=0x10007C000 ... owned=0xF8000000' and 'window 0xF8000000 bytes', and XNU reports vm_page_bootstrap: 967425 free pages (3.69 GiB) and 84 processes by t+355 s. The same 128 MiB payload at 2 GiB took the low bank at pa=0x5807C000 with 483496 free pages, so the upper bank is one contiguous run once the firmware stops pinning the prebuilt Realtek UNDI driver at 0x180000000.", "The high bank is contiguous only because of that firmware change: before it, DxeCore loaded RtkUndiDxe.efi at its linked address 0x180000000, which split 0x1_0000_0000-0x2_0000_0000 into two ~2 GiB runs and left no run long enough for 3.875 GiB."]
completion = [
  "Done: the ADT's dram-base/dram-size match the declared node, DarwinBoot reports the 3.875 GiB window it took at pa=0x10007C000 in the high bank, and XNU's live RAM counters agree with it (967425 free pages, 84 processes by t+355 s).",
]
limits = [
  "Round 2 (2026-11-11) ends at 6,180 free pages (about 24 MB) at t+3600, down from 568,193 at t+600, with vspec 236,942 and vcomp 0 for the whole run: 254 processes fit, but a client that asks for a large buffer at that point cannot be served, which is the state to watch before any frame-rate or GPU-pool work.",
  "8 GiB fitted but not contiguous: the ADT takes one contiguous range (the high 4 GiB), so the owned window is 3.875 GiB of it and the other banks stay outside.",
  "The memory region that package/Opi5plusDisplay/NativeLegacyDisplay.cpp publishes at 0x1_0000_0000 for 256 MiB now overlaps the owned window, which starts at 0x1_0000_7C000. The node only carries properties and nothing maps it, but the placement was chosen on the assumption that the kernel does not own that bank and must not survive the vram retirement.",
]
next_action = [
  "Keep the unused banks out of the owned window; wanting them later is an ADT decision, not a driver change.",
  "Align the three memory values: dts/opi5plus.dts memory@100000000 reg and [payload] dram_size are 4 GiB while [payload.adt] owned_memory_size is 3.875 GiB. That is legal today because devicetree.py only compares dram_size with the node, but the node still declares 4 GiB of DRAM the window does not take.",
]
evidence = [
  { kind = "source", reference = "dts/opi5plus.dts", result = "The declared range, the three real banks and the arithmetic that reconciles them with the fitted 8 GiB" },
  { kind = "source", reference = "board.toml", result = "dram_size in [payload] and owned_memory_size in [payload.adt] with their constraints" },
  { kind = "source", reference = "evidence/m2/M2-01-owned-window-3g875.md", result = "DarwinBoot takes pa=0x10007C000 with owned=0xF8000000 and XNU bootstraps 967425 free pages" },
  { kind = "source", reference = "evidence/m2/M2-01-owned-window-3g875.md", result = "The 2 GiB and 3.875 GiB runs side by side: pa, the free-page counts and what the window predicts" },
]

# --- storage and root -----------------------------------------------------------------------------------
[[area]]
id = "storage"
status = "implemented"
components = ["AppleKeyStoreState"]
paths = ["board.toml", "dts/opi5plus.dts", "scripts/audit-sd-storage.py", "scripts/bind-sd-storage.py", "scripts/build-sd-driver.py", "scripts/data/opi5plus-storage-interface-audit.json", "configs/opi5plus_defconfig", "package/NativeSd/NativeSd.cpp", "package/SdHost/SdHost.h", "patches/xnu/0002-mount-data-volume.patch"]
inputs = ["The board's only block device: a 30 GB SD card behind mmc@fe2c0000 (0xfe2c0000, 16 KiB of registers, SPI 203), compatible rockchip,rk3588-dw-mshc / rockchip,rk3288-dw-mshc, 4-bit, up to 150 MHz, currently GPT with one 30 GB ext4 partition starting at LBA 32768 (board/sd-snapshot.txt).", "No eMMC (mmc@fe2e0000) and no NVMe on this board (docs/hardware.md: no mmcblk0, no NVMe in lspci).", "The IPSW's OS and Cryptex1,SystemOS images for the two windows, and the APFS volume UUID of the OS window for /chosen/root-matching (both M4).", "An eMMC module for OPi5, 32 or 64 GB, as Plan A (plan.md §3.2)."]
configuration = ["[userdata] first_lba = 32768, last_lba = 62914559, lba_bytes = 512, windows = OS and Cryptex1,SystemOS. The capacity is (62914559 - 32768 + 1) * 512 = 32 212 992 KiB = 30.72 GiB, a placeholder sized for a 32 GiB card's largest partition; it is NOT the geometry of the card in the board today and no image has been built against it.", "[payload.adt] root_match_volume_uuid is deliberately absent, so the generator emits no /chosen/root-matching property and the kernel falls back to the boot volume. Writing a UUID that no volume actually has would be worse than writing none.", "dts/opi5plus.dts leaves &emmc disabled and declares mmc@fe2c0000 with status disabled; neither carries unixnu,adt-name, so neither reaches the Apple device tree and neither can be mistaken for a published block device.", "No emmc=* kernel arguments. Their parser is the Rk3588Emmc driver, which this board cannot use until the module exists.", "sd-clock-div is parsed in package/NativeSd/NativeSd.cpp start() (default 0, the divider off); sd-clock-div=1 was round 7's measurement and is not on the production command line. The read-back evidence is the one-time line 'opi5plus: sd clock: CLKDIV=%x CLKSRC=%x CLKENA=%x' that NativeSd prints after a clock update lands: at div=0 it reads CLKDIV=0 CLKSRC=0 CLKENA=1 (logs/boot-round9.log:1700), while the boot log's own 'CLKDIV=1' dump is the firmware's, taken before the driver took over, and describes nothing the driver ran."]
procedure = ["Plan A (preferred): fit the eMMC module, create a GPT with a userdata partition of at least 12 GiB in Linux, add the Rk3588Emmc submodule and the two EVB10 archive entries (build-<board>-drivers.py Rk3588Emmc, bind-emmc-storage.py) back into [kernel] archives, set the real first_lba/last_lba, and enable emmc=4 plus the emmc-data-* group in kernel_args.", "Plan B (fallback): write an XNU host driver for mmc@fe2c0000 in SD mode —DesignWare MSHC with the SDHCI register set, 32-bit DMA, GPT parsing and the same window publication —then the same userdata layout and the same arguments, renamed to the new driver's arguments.", "Plan B's binding half, once the driver source exists: python3 scripts/audit-sd-storage.py (only when the kernelcache pin changes, and only against a kernel built without the archive), python3 scripts/build-sd-driver.py NativeSd, python3 scripts/bind-sd-storage.py, then python3 scripts/bind-sd-storage.py --verify-kernel ../kernel/kernel.json. tools/wsl/176-test-bind-sd.sh runs the whole sequence and refuses with a message instead of a traceback when the object is absent.", "Either way: ./unixnu build userdata --ipsw <ipsw> --dry-run first, to check capacity against the manifest before writing 8.8 GiB of image."]
findings = ["Round 2 (2026-11-11) found and fixed what the round-1 daemons were dying of, and it was not the mount. The mobile directories on the Data volume were owned by root: the seed's skeleton created /private/var/mobile, mobile/Library and mobile/tmp as root, opi5plus_ensure_dir() skipped a directory that already existed, the seed returned early on a volume that already carried .opi5plus-seeded, and launchd's fixup-mobile-tmp job skips existing directories too - so the owner was never corrected, mobile (501) could not mkdir inside its own tmp, and the daemons that do this at startup exited 1 every 10 s. Patch 0002 (commit ca0cef3af5d351624786ff1aad40d23957a73686) now creates those directories with their final owner and applies the attributes on EEXIST, so the result no longer depends on which of the four steps runs first. The stat probe then reports 501:501 040755 for all three and 0:0 041777 for /private/var/tmp, and biomed, callservicesd and nsurlsessiond stop exiting; bluetoothd keeps its own loop because it is the one process that prints its TMPDIR failure and continues.", "This is the largest difference from the EVB10 and the reason the area cannot be scaffolded beyond placeholders. The EVB10 reuses Rk3588Emmc (rockchip,rk3588-dwcmshc at 0xfe2e0000) and its evidence covers eMMC root and Data; this board has no card on that controller at all.", "The SD controller is a different block: mmc@fe2c0000 is DesignWare MSHC driven in SD mode (Linux bounds it as dw_mmc, the vendor tree calls it rockchip,rk3588-dw-mshc), 4-bit and up to 150 MHz, where the eMMC path uses the SDHCI-compatible dwcmshc in 8-bit HS400 at 200 MHz. Sharing one driver would be a rewrite, not a parameter.", "Plan A needs no device-tree change: mmc@fe2e0000 is part of the SoC and is described in rk3588.dtsi already, so fitting the module is a hardware and [userdata] change plus two archive entries. That is why the skeleton keeps the node with status = \"disabled\" and a comment saying exactly this.", "AppleKeyStoreState is selected in [components] include and is listed as this area's component because the storage path is what publishes the volumes AppleKeyStore reads; it is a catalog component with build_stage kernel, so it also appears in [kernel] archives.", "[userdata] first_lba/last_lba were chosen as the largest partition of a 32 GiB card (LBA 32768 to 62914559, the same start LBA the current card uses for its single partition) so that a real layout is plausible in size, not because anything was measured on the current 30 GB card. The current card's last LBA is 62929886, and its single ext4 partition spans the whole card.", "The binding half of Plan B now exists offline: scripts/audit-sd-storage.py records the original IOBlockStorageDevice ABI from the pinned kernelcache (190 vtable slots, 176 kernel bindings, 14 pure virtual) into scripts/data/opi5plus-storage-interface-audit.json, scripts/build-sd-driver.py compiles the submodule source to an object, and scripts/bind-sd-storage.py checks that object slot by slot against the record and emits build/native-sd/libNativeSd.a with the 18 non-exported addresses as absolute symbols. The record is a property of the pinned original kernelcache (sha256 f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7), which is the same image the EVB10 port was audited against, so every recorded address matches that port.", "Plan A no longer needs the EVB10's archive entries: this board has its own pair (build-sd-driver.py NativeSd, bind-sd-storage.py) at the end of [kernel] archives, and configs/opi5plus_defconfig force-loads build/native-sd/libNativeSd.a after the link stubs. Adding Rk3588Emmc would still be the EVB10 pair.", "The audit cannot be regenerated from a kernel that carries libNativeSd.a: .globl/.set makes the linker publish the bound names, so the candidate exports 183 of the 190 recorded names instead of the original image's 176, and the audit's 'unexpected original/native kernel binding count' check refuses. The EVB10 has the same property and simply never regenerates its committed JSON during a build; regenerate this one only after removing libNativeSd.a from CONFIG_XNU_EXTRA_LD_ARCHIVES.", "The Data volume's directory skeleton was incomplete, and that is a container failure, not a mount failure: 0002 mounts /private/var correctly (device-verified display62/63) but opi5plus_ensure_dirs only made the launchd-level directories (/private/var/db, vm, mobile, tmp, keybags, preferences, root, run, log, protected), so neither /private/var/containers nor /private/var/hardware existed. iPadOS keeps its persistent state in the container tree, and mobileactivationd's _performMigration creates group(systemgroup.com.apple.mobileactivationd)/Library/ucrt before it serves anything: with the parent missing it reports 'Failed to create %@', takes the failure branch of main(), traps in _main.cold.5 and never boots its XPC server, which is the daemon SpringBoard's main thread waits on without a deadline (evidence/m7/M7-09, M7-10).", "The skeleton now lists that tree one level at a time -- containers, containers/Shared, containers/Shared/SystemGroup, the mobileactivationd system group container with Library/ucrt, Library/dcrt and Library/internal, containers/Data, containers/Data/System -- plus /private/var/hardware and /private/var/hardware/MobileActivation, and the parent directories of the activation files Apple delivers (hardware/dcrt, hardware/sdcrt, hardware/factory, mobile/Library/mad). The files themselves are still never created by this port. Every entry is a 0755 mkdir, root-owned because the kernel makes it, in table order (opi5plus_mkdir makes exactly one directory per call, so a parent has to precede its child), and a repeat boot only reports EEXIST. Not yet run on the board: no boot has happened since 0002 gained these entries.", "0002 now seeds the Data volume the way UniXNU-evb10's evb10-userland-mounts.patch does, because a mount is not a first boot: the OS volume's /private/var tree is copied in from mount->mnt_vnodecovered (directories, regular files through the OS volume's decmpfs, symbolic links, the source's mode and owner, staged_system_apps left out), the runtime directories /private/var/keybags, mobile, mobile/tmp, tmp and run are made, and five XML preference plists are written into /private/var/mobile/Library/Preferences (com.apple.purplebuddy, .purplebuddy.notbackedup, .managedconfiguration.notbackedup, .springboard, .migration) so that the Setup assistant is skipped and SpringBoard keeps the screen on; three MobileGestalt caches are unlinked on every boot rather than once, because a cached MainScreenScale=0 is what turns FBSDisplayMode into 1072x1904 scale 0. The marker /private/var/.opi5plus-seeded is written only on a persistent Data volume and only after a copy with no failures, so sd-data-seed=0 is the way back; on the 64 MiB RAM seed the marker cannot survive a reset and that boot seeds again. Nothing of it has run on the board yet.", "sheng-aks=1 and offline-key-events=1 are enabled in kernel_args, and they are what makes this kernel register an AppleKeyStore IOService at all: package/KeyStoreProbe.cpp native_keyevents_probe() returns early without both (offline-key-events at :78, then the ephemeral-storage-or-sheng-aks gate at :92) and attaches the owned service only when no AppleKeyStore metaclass exists yet (:93-117). Without that service MKBEventsRegister() answers NULL, SessionSyncEngine.Keybag's singleton initialiser takes the cbz and brk #1s, and liveactivitiesd - the carrier of the com.apple.activitykit BSService domain and the mach name com.apple.sessionservices - dies in its own initialisation, which is why chronod's synchronous XPC to it never returns and SpringBoard waits there instead of drawing. The lock state it reports is an answer, not a state: no SEP, no passcode, sheng-aks-sls (default 0 = unlocked) selects the number, and every real keybag operation fails.", "Rounds 4-10 (2026-11-12) priced the PIO read path with counters that ride the display beat line (evidence/round4-6-result.md, evidence/sd-clock-investigation.md): a 64 KiB chunk costs 5.67 ms at about 11.5 MB/s. Round 4's first sample read 12,484 STATUS polls per chunk; round 5's two-phase loop (fill to a 128-word watermark, then drain) cut that to 121, round 8's batch 32 raised it to 449, and the chunk time did not move in either case - so the poll count and the batch size are both falsified as the constraint. The fill/drain split (round 9) puts 81.6% of the chunk time in phase 1, waiting for the FIFO to fill against the card, and 8.8% in the CPU's drain; the CLKDIV/CLKSRC/CLKENA read-back ('opi5plus: sd clock: CLKDIV=0 CLKSRC=0 CLKENA=1', logs/boot-round9.log:1700) shows the divider off at div=0. Round 7's sd-clock-div=1 doubled the chunk time (5,671 -> 10,957 us, 11.5 -> 5.99 MB/s, logs/boot-round7.log:1967), so the CIU divider is linearly effective. Round 10's fill-per-burst at batch 128 lands on 41.4 us - the ~26 MHz base-clock prediction (39.4 us, +5% off), with the 52 MHz prediction (19.7 us) excluded by 2.1x - i.e. the card clock is about 26 MHz from the CRU clock tree, PIO runs at 89% of the 13 MB/s it offers, and the next 2x is clock-tree work, not driver work."]
completion = [
  "Device-verified 2026-11-11 (round 2): kernel 45fbfab3cae0c66dcf73b85ba08a82ae7a580b0c4e6beabab1d81f76dc0a3893, payload 80e4f2965501789a851974bd8366fd686c56aacc6bc443ceb2f3c36fc527d2e1, command line 993 bytes / 54 arguments, patch 0002 at commit ca0cef3af5d351624786ff1aad40d23957a73686. The mobile directories carry uid 501 gid 501, the Data volume takes 61,272 blocks of writes (dbavail 392,450 at t+5 -> 331,178 at t+3600) inside 286,338 requests with 0 failures, and four of the five sampled daemons stop exiting (bluetoothd's loop is not this fix's). Log: logs/boot-round2.log in the project working tree (not committed); the summarised record is evidence/round2-result.md.",
  "Done: NativeSd publishes the OS and SystemOS windows read-only, XNU mounts the root from SystemOS with the dyld shared cache, /private/var is the writable Data volume with the kernel's directory skeleton, and launchd reaches 'Early boot complete. Continuing system boot.'",
  "Device-verified 2026-11-08: with sd-data-persist=1 the Data volume is a 64 MiB card window at userdata lba 62796767..62929886 (SDDATA01 header v1 state 2, gen 1), formatted once and reused on later boots; kernel 03eb54fd (bounce-cache fix) + payload 152e1184 (display63): '/private/var is the Data volume now' on disk3s1 OwnerData, 0 ENOSPC lines through t+505 (RAM baseline: 477). Logs: logs/display61-uefi.log, logs/display62-uefi.log, logs/display63-uefi.log.",
]
limits = [
  "Round 2 wrote about 239 MiB into the Data volume (dbavail 392,450 -> 331,178, 61,272 blocks at 4 KiB) and read 19.1 GiB (40,139,008 blocks) before t+2400, with 0 failures: the volume now carries a real userland's containers rather than a seed, and its size is still the 2048 MiB window, not yet measured against a full container.",
  "SD sequential read is about 11 MiB/s (sd-clock-div=0 removes the firmware divider). The Data volume used to be a 64 MiB RAM seed that filled from about t+500 s (free_blocks 349 of 16384), driving an ENOSPC storm; with sd-data-persist=1 it is a 64 MiB card window at the end of userdata instead (display62: 0 ENOSPC lines through t+505 vs 477 on the RAM baseline). The container size is inside the seed's superblock but the seed does not have to be the whole container: NativeSd accepts containerBytes >= seed size and zeroes what the seed does not cover, so the 64 MiB window becomes a 2048 MiB one carrying 8.90 MiB of front (evidence/m7/M7-04).", "The PIO read path is at its card's delivery rate and no software change will move it: ~11.5 MB/s measured against the ~13 MB/s a 26 MHz 4-bit card clock offers (89% efficient, evidence/sd-clock-investigation.md). The constraint is the CRU clock tree, not the driver - poll shape, batch size and phase split were all tried and all left the 5.67 ms chunk unchanged. Doubling throughput means moving the sdmmc source clock to 52 MHz in the CRU (UniXNU-rk3588-common) and re-measuring with the same counters.",
]
next_action = [
  "Match the card Data volume in launchd mount-phase (-P 1 role lookup); the kernel patch mount on /private/var already succeeds (device-verified display62/63).",
]
evidence = [
  { kind = "source", reference = "evidence/round2-result.md", result = "Round 2: the mobile directories' owner as the cause of the 10 s daemon exits and the fix in patch 0002, the 993-byte command line, and the stat probe that reads 501:501 for /private/var/mobile{,/Library,/tmp}" },
  { kind = "source", reference = "board.toml", result = "The placeholder [userdata] geometry, the comment recording both plans and why neither is verified, and the ordering comment for the two SD archive entries at the end of [kernel] archives" },
  { kind = "source", reference = "dts/opi5plus.dts", result = "SD controller declared and disabled, eMMC node left disabled with the Plan A note" },
  { kind = "source", reference = "scripts/data/opi5plus-storage-interface-audit.json", result = "The original IOBlockStorageDevice ABI as it stands in the pinned kernelcache: 190 vtable slots, 176 kernel bindings (162 inherited, 14 pure virtual), vtable 0xfffffff005cb44c0, metaclass 0xfffffff006add1d0. Produced by scripts/audit-sd-storage.py; the addresses are a property of the image, not of the driver." },
  { kind = "source", reference = "scripts/bind-sd-storage.py", result = "Refuses to emit build/native-sd/libNativeSd.a unless the compiled object matches the record slot by slot, has no pure virtual slots, imports no unbound original symbol and does not import the abstract D1/D0; --verify-kernel re-checks the linked kernel's extents afterwards" },
  { kind = "source", reference = "patches/xnu/0002-mount-data-volume.patch", result = "opi5plus_ensure_dirs() now creates the container tree -- /private/var/containers, containers/Shared/SystemGroup/systemgroup.com.apple.mobileactivationd/Library/{ucrt,dcrt,internal}, containers/Data/System -- and /private/var/hardware/MobileActivation as ordered 0755 mkdirs, plus only the parent directories of the Apple-delivered activation files, which the kernel never writes" },
  { kind = "source", reference = "patches/xnu/0002-mount-data-volume.patch", result = "opi5plus_seed_tree() with opi5plus_seed_copy_dir()/opi5plus_seed_prefs_write(): the first-boot seed of the Data volume, five XML preference plists and the marker /private/var/.opi5plus-seeded, plus opi5plus_wipe_mobilegestalt() and its three cache paths on every boot. Generated by tools/wsl/331-patch-xnu-data-mount.py and emitted by tools/wsl/334-make-device-xnu-patch.sh; sd-data-seed=1 in [payload] kernel_args" },
  { kind = "device", reference = "evidence/sd-clock-investigation.md", result = "Rounds 7-10 on the board, 2026-11-12: the SD PIO read path measured with its own counters. A 64 KiB chunk costs 5.67 ms at ~11.5 MB/s; sd-clock-div=1 doubles it (11.5 -> 5.99 MB/s, the CIU divider linearly effective); batch 128 -> 32 and the two-phase poll shape both left the chunk time unchanged (two falsified models); the fill/drain split reads 81.6% waiting for the card and 8.8% CPU; the CLKDIV/CLKSRC/CLKENA read-back shows CLKDIV=0 at div=0; and the fill per 128-word burst is 41.4 us, the ~26 MHz base-clock prediction (+5%), with 52 MHz excluded by 2.1x. Conclusion: the card clock is ~26 MHz from the CRU clock tree, PIO is 89% efficient, and doubling throughput means moving the sdmmc source clock to 52 MHz in the CRU, not a driver change. Logs: logs/boot-round{7,8,9,10}.log in the project working tree, not committed.", command = "py -3 tools/boot-uefi.py --port COM3 --baud 1500000 --log logs/boot-round10.log", revision = "818f9b64bbe0facfe3f6b982d4dccc6a822edd4f" },
]

# --- display ---------------------------------------------------------------------------------------------
[[area]]
id = "display"
status = "implemented"
components = ["GopFramebuffer"]
paths = ["dts/opi5plus.dts", "configs/opi5plus_defconfig", "board.toml"]
inputs = [
  "HDMI0 only: hdmi@fde80000 (two 64 KiB register windows at 0xfde80000 and 0xfde90000, five SPIs 169-172 and 360, compatible rockchip,rk3588-dw-hdmi), fed by VOP2 at vop@fdd90000.",
  "No DSI panel and no touch screen; the board's own device tree has hdmi0 enabled and every dsi node disabled or absent.",
  "The firmware's GOP frame buffer, at the native 2560x1440 the EDID selects: PE_current_console returns it directly (video 0xe6760000 + 0xe10000), so nothing has to be pinned in the firmware.",
  "The display archive, which now exists: build/native-legacy-display/libNativeLegacyDisplay.late.a, built by scripts/build-native-legacy-display.py from package/Opi5plusDisplay (backend, probe, KeyStore stub, GOP presenter and the 358-slot ABI for the original IOMobileFramebufferLegacy).",
]
configuration = [
  "[components] include carries GopFramebuffer (its build_stage is embedded, so it must NOT appear in [kernel] archives) and the SoC repository's Rk3588VopDirect.",
  "Two kernel passes: configs/opi5plus_defconfig keeps CONFIG_XNU_NATIVE_LEGACY_DISPLAY=n, and configs/opi5plus_display_defconfig sets it to y, which is what force-loads the archive already built against the first pass.",
  "kernel_args carry the offline-legacy-* group (parsed in package/Opi5plusDisplay) plus rk3588-vop-direct=1, rk3588-vop-esmart=2 and rk3588-vop-vp=2 (parsed by Rk3588VopDirect), each entry naming its parser in board.toml.",
  "dts/opi5plus.dts keeps vop@fdd90000 and hdmi@fde80000 disabled and without unixnu,adt-name: Rk3588VopDirect drives both through its own rk3588-vop-* arguments and finds the frame buffer itself, so no ADT node is involved.",
]
procedure = [
  "Build pass A, then pass B with the archive. Check logs/archive-15-build-opi5plus-display.log for error: and take the kernel sha256 from the build output: unixnu build kernel returns 0 even when the archive fails to compile and the payload step would pack the previous kernel.",
  "Boot and read the serial log rather than the screen: the probe prints D1..DA, the beat line reports process count and stage, and the display's own line reports swap ok / copy / retired / frames plus the VOP direct flips.",
  "The frame path to watch is compositor swap -> backend copy (14745600 B, status 0) -> VOP2 latch. When a frame does not appear, the family's default_fb_surface is the first thing to check.",
]
findings = ["Round 2 (2026-11-11) put a real UI on the panel. The compositor's surfaces are Apple's two-plane lossless 'b3a8' spelling, whose accessor reports the last plane's row (width bytes) while the pixels sit in plane 0; the backend now accepts that format and copies with width * 4 as the source row (commit 1ef2c87b29215d1b56cb851f207d3513066dbdeb). The run then shows 54 swaps accepted and 0 refused, 54 GOP blits of 14,745,600 B (88.6-95.7 ms a frame, 796,262,400 B in total), up to 22 framebuffer clients and 273 calls, and the lock screen on the panel.", "The display difference is not just \"HDMI instead of DSI\": the EVB10 composites and scans out through VOP2 with zero-copy and a GPU fence, which is where its 52 fps comes from. A GOP frame buffer is a linear buffer the firmware already scans out, so the kernel side is a CPU copy or a GPU blit into it. plan.md M5 already sequences it that way (picture first, VOP2 only if the frame rate is not enough).", "GopFramebuffer is verified on a different device in the catalog (verified_devices = [sheng]) and is the component the UniXNU docs describe for exactly this situation: a board whose firmware keeps the display. Selecting it here does not make this area verified; it makes the sources available.", "The EVB10's second defconfig (evb10_display_defconfig) exists because its display archive is built from an earlier kernel pass. This port has one defconfig because there is no such archive to build yet; when there is, it will need the same two-pass arrangement, which is worth remembering before inventing a different one.", "M5 state after the 2026-11-07 runs (evidence/m5/M5-09): the display archive, the GOP presenter and the SoC repository's Rk3588VopDirect component all build and are linked; userland opens IOMobileFramebuffer at about t+780 s (IOMFB_FDR_Loader, then backboardd) and VOP direct initialises on the board (VOP IOMMU paging on, Esmart window e6760000), but the compositor's first swap fails inside the original driver with 'IOMFB: default_fb_surface: No Default FB Surface found', the 5 s swap_wait_gated timeout follows, and the cancellation path reaches abstract slot 345, where this port's guard panics. The GOP CPU-copy path cannot complete a swap, which is why the VOP2 component was brought in.", "Pinning Rk3588VopDirect also moved the SoC pin to b5f5d949, whose rk3588.config turns CONFIG_XNU_NATIVE_AES on; the kernel link then requires build/software-aes/libSoftwareAES.a, so [kernel] archives and [components] include both gained SoftwareAES plus build-software-aes-bindings.py. Omitting the component from include fails with '[kernel] archives: component SoftwareAES is not selected'.", "The model-transfer path in package/Opi5plusDisplay/NativeLegacyDisplay.cpp refuses a swap with kIOReturnNotReady for ten different reasons and used to say only that; native_legacy_transfer_diagnosed() now records the surface half (width, height, format, planes, stride, allocation, descriptor length) and the firmware console half (PE_Video base, width, height, depth, rotation, stride) plus the display's own size, and the periodic report prints them once per distinct refusal. The abort that follows (abstract slot 345 through the guard) is a symptom of that refusal, not a separate fault.", "M5 state after the 2026-11-08 runs (evidence/m5/M5-15): the swap completes. At 2560x1440 the compositor opens IOMobileFramebuffer, submits three swaps, the backend copies 14745600 bytes each with status 0, retires three generations and VOP2 latches three flips (mean 9.3 ms, worst 16.5 ms). The picture then stops because the original family refuses 'default_fb_surface: No Default FB Surface found' and the presentation selector 6 answers kIOReturnBusy (0xe00002d5) for surface id 0x80000000 while 1, 0x80000001 and 0x80000003 succeed. Supplying that surface through the original IOSurfaceRoot factory is the remaining piece; the reference implementation stops in the same place, so this is parity with it rather than a regression.", "The exit report (sd-exit=1, the kern_exit.c hook plus a ring the beats flush) exists because launchd only says 'Process[x] crashed: name. Too many corpses being created.' and a userland that dies on its first frame says nothing else. It separates exit(code) from signal death in one line and it found the open item on this board: about twenty daemons including backboardd receive SIGKILL in one beat window at t+690 with no memorystatus or shutdown message anywhere, and launchd restarts them. The sender of those SIGKILLs is the next thing to trace.", "The default framebuffer surface turned out to be at original field +5656, not behind the 'create_default_fb_surface()' slot the documentation's wording suggests (that slot, 316, is a 20-byte no-op on the swap-completion path). The family's own creator is slot 299, it stores what it built at +5664, and it returns early unless the byte at +6016 is set - and nothing in the prelinked family writes that byte, because it belongs to the platform driver this port does not ship. The adapter now sets the byte before start(), retains what start() created and publishes it at +5656; evidence/m5/M5-16 has the addresses and the four risks.","The 64 MiB Data seed cannot be grown by shipping a bigger seed: the APFS container size is inside the image (mkapfs, tools/wsl/tmp-make-seed64.sh), so extra payload bytes would be unused. The volume sits at 349-1000 free blocks of 16384 from about t+500 s, which is what every writing daemon runs into; the fixes are a Data window on the SD card or fewer guest writes, not a bigger ramdisk.", "The default framebuffer surface needs a display memory REGION, not a slot and not a hand-made surface (evidence/m5/M5-17). Slot 299 asks IOSurface for a surface in the region named 'PurpleGfxMem', which in turn is the alias IOSurfaceRoot gives the region it builds from a /vram registry node; without that node the region count is zero, installMemoryRegions() returns at once, and every surface the family lays out carries a null region. layout_buffers() dereferences that region as its fifth instruction (0xfffffff00578d110), so all four experiments that produced a region-less surface reset the board, including the one that never published it. Both adapter paths now read [surface+0x28] and refuse to publish without a region.", "The ADT generator can only publish hardware nodes under /arm-io (devicetree.py writes cpus, psci, arm-io and chosen), while IORegistryEntry::fromPath(\"/vram\") wants a root child named vram. So the region has to come from a platform driver that publishes that service, or from a change to the ADT generator; a device-tree node alone cannot reach it. Until then the display keeps the M5-15 behaviour: three compositor frames, swap completed, default_fb_surface unanswered.", "The display archive now publishes the /vram node itself (an IOService named 'vram' carrying {0x1_0000_0000, 256 MiB}; owned_memory_size is 2 GiB inside the firmware's low bank, so that 4 GiB bank is DRAM the kernel does not own). IOSurfaceRoot still reports a region count of zero: IORegistryEntry::fromPath(\"/vram\") answers 0 in both the service and the device-tree planes for all three placements tried (attached to getServiceRoot() = the platform expert J120AP, to its parent, and to getRegistryRoot()), and the service's own start() returns success without filling the table. The image export for that node must therefore be replaced by writing the region table where the service's start() would have written it (+0x158 name, +0x168 alias, +0x178 cache word, count at +0x180) and calling the installer it keeps at +0x188; evidence/m5/M5-18 has the placements and the offsets.", "A build trap cost two runs: unixnu build kernel exits 0 even when the display archive fails to compile, and the payload step then packs the previous kernel. The checks that are trustworthy are the error count in logs/archive-15-build-opi5plus-display.log, the 'kernel: <sha256>' line of the build, and a string that only the new code contains in kernel.macho. Two compile rules of that file: the device-tree plane symbol is gIODTPlane (IOKit/IODeviceTreeSupport.h is not in the archive's include set, so export it), and an extern \"C\" declaration inside a function body is ill-formed - it belongs at file scope above the class."]
completion = [
  "Implemented and device-verified on the board 2026-11-11 (round 2): at 2560x1440 the compositor's swaps complete and their frames reach the panel, so the board shows its lock screen - 54 swaps accepted and copied, 54 GOP blits of 14,745,600 B with 0 refused, up to 22 framebuffer clients and 273 calls, kernel 45fbfab3cae0c66dcf73b85ba08a82ae7a580b0c4e6beabab1d81f76dc0a3893, commit 1ef2c87b29215d1b56cb851f207d3513066dbdeb, log logs/boot-round2.log, summarised in evidence/round2-result.md. What the picture still gets wrong is in the limits.",
]
limits = [
  "The picture is not clean: the lock-screen clock digits carry horizontal banding while the small text is clean, and the screen is static (54 frames in 3,600 s), so it is not tearing. The candidates in the same log are the metal2vulkan-degrade-shadowed-texture warnings - 'a 2D A8Unorm texture of 332x200 over a buffer at offset 64 with rows of 352 bytes ... the driver refuses a DRM_FORMAT_MOD_LINEAR image for host allocations with rows 352 bytes apart (ERROR_INITIALIZATION_FAILED)' - while the GOP copy itself is byte-complete (pitch 10240 = 2560 * 4, 14,745,600 B a frame, 0 refused). The one-shot 'biplanar surface accepted' line does not appear in the capture, so the accepted frames were not two-plane b3a8 surfaces at the moment of first acceptance, and which shape reaches the digits is unresolved.",
  "The refresh path never runs: all 62 vsync lines from t+590 to t+3575 read 'vsync hz=60 sent=0 arms=0 idle=0 late=0 start=1 refresh=1' and no line in the log carries a non-zero sent, so 54 swaps complete without the userland ever arming a vsync.",
  "The scanout path is verified end to end (evidence/m7/M7-06): a green fill written into the boot framebuffer and pointed at by the window appeared on the panel, so the VOP scans the address this port programs and CFG_DONE latches it; the next compositor swap then replaced it with its own surface. What the panel shows is therefore the content of the compositor's frames.",
  "Those frames are the boot screen's own picture, not a UI: after the third swap the window moved to another compositor surface (slot 3, physical 0x1ccdf3000) and the panel went back to the Apple logo, with the surface's corner pixels uniformly opaque black. SpringBoard is not producing a real frame yet.",
  "The default surface is NOT what blocks the UI, and the region table is a dead end in this form (evidence/m7/M7-07): filling IOSurfaceRoot's region entry with the fields its own start() writes makes the service report a region (region count after installer 1) and then stops userland surface allocation altogether - the Mali surface cache stays at n=0 bytes=0, the render server never submits a swap in 1590 s, and the panel keeps the boot logo, where the same payload with an empty table makes three frames at t+935. An entry with no memory behind it (there is no /vram node to attach a range to) is worse than no entry, so the fill is offline-legacy-vram-region, default 0. Surface id 0x80000000 still answers e00002d5 (kIOReturnNoSpace) and a region-less surface still faults in layout_buffers at 0xfffffff00578d110, but the EVB10 port reaches its lock screen without either: it never calls create_default_fb_surface() and never touches +5656.",
  "The fence is required and bounded: with rk3588-vop-fence=1, 2 of 2 swaps arrived with GPU work not done and both flips waited (mean 7.6 ms, longest 8.3 ms, 0 gave up). The 81% measurement in package/Mali/docs/notes.zh-CN.md reproduces on this board.",
    "The activation XPC has to be answered, not failed (evidence/m7/M7-10): refusing the daemon's exec (opi5plus-block-exec=mobileactivationd, patch 0006) does make launchd's spawn fail, but SpringBoard's main thread stays in the same synchronous -[MadGate getActivationState:] wait - launchd keeps the request and neither answers nor drops it. Replacing the binary is the way: patch 0007 mounts a payload directory over /usr/libexec and the resolved path went from 2960496 bytes (the sealed daemon) to 70176 (the stand-in), with the rest of the boot unchanged.",
  "The stand-in is killed by AMFI before it runs: 'Launch Constraint Violation (enforcing), (Constraint not matched) launching proc: /usr/libexec/mobileactivationd', SIGKILL 56 times between t+775 and t+1320, so it never checks in and never answers. The trust cache carries its cdhash (all three modules load); the missing piece is that an owner-trusted binary's constraint category is not the platform one. The base series already has the switch: mac_proc_check_launch_constraints() returns 0 when sheng-no-lc=1 is on the command line, and that argument was not on this payload.",
  "SpringBoard is the gate, not the render server (evidence/m7/M7-08): the sampler shows its main thread inside dyld and the Objective-C runtime from t+360 to t+1100 (single threaded, four consecutive samples on the same realizeClassWithoutSwift pc), then blocked from t+1140 to the end of the capture in a synchronous XPC with no timeout - -[SBLockdownManager lockdownState] -> _MAEGetActivationStateWithError -> -[MadGate getActivationState:]. Two more SpringBoard threads wait the same way on biomed (BiomeFoundation _BMXPCFileManager) and on the TCC permission service (PowerLog). The daemons being waited on are the ones that die: mobileactivation SIGTRAP 17 times in 1470 s, biomed exit 1 57 times, and 564 process exits in total.",
  "gop X/Y in the beat line is the letterbox's presents/refusals, not a GOP-write count: opi5_gop_present() increments Y when its null gate refuses (evb10-fb-w/-h are not on this payload's command line, so opi5_fb_override never maps anything), and it is called for every successful transfer (LegacyDisplayProbe.cpp:58, :357, gate :802-804). 'gop 0/4' therefore says the letterbox ran four times and refused four times; it does not say the GOP was never written. The frame-buffer writes of the direct path are counted as native_legacy_gop_mirror. The output is HDMI1 (DetectDisplays: HDMI0 Not Found, HDMI1 Success, VP2's only enabled plane is Esmart2); docs/hardware.md and plan.md still say HDMI0 and are wrong, and this repository's AGENTS.md said so too until it was corrected with the evidence.",
  "Since 2026-11-11 the direct path also writes the frame buffer (boot-arg opi5-gop-mirror, default 1; NativeLegacyDisplay::gopMirrorPresent): the frame the window just latched is copied into the firmware's GOP through bootMapping and the window is pointed back at it, so every successful swap ends with a real GOP write and the beat line prints 'gop blit N frames (M refused), last B us'. It also runs the content scan the CPU copy path used to own, which is why frames becomes non-zero on a direct-only boot. The cost is the CPU copy the M5 path always had (tens of ms per frame); opi5-gop-mirror=0 restores zero-copy scanout. Take the frame-buffer base from PE_current_console, never from a note: boot-stub-5 had it at 0xe6740000, not the 0xe6760000 the M5 records carry.",
]
next_action = [
  "Boot the stand-in again with sheng-no-lc=1 on the command line (the base series' mac_proc_check_launch_constraints escape): the stub should then check in to com.apple.mobileactivationd.lockdown and answer getActivationState: with Activated. Two witnesses: the sampler's SpringBoard chain moving off _mach_msg2_trap, and the panel.",
  "Finish mobileactivationd, which the UI is synchronously blocked on: its 16 SIGTRAPs are the brk #1 at the end of _main.cold.5 (0x1001eeac0 unslid, pc == lr, per-launch slide, one brk at page offset 0xac0 in the image and the frame distance 0x198704 fixed across launches). main() takes its failure branch, the noreturn die call returns, and the compiler's unreachable trap becomes the signal. Resolve the two chained-fixup imports called just before the brk (0x1001eeab4 and 0x1001eeabc) to name the call that returns; the crash line already prints their target registers when they are called.",
  "Find why the storage group cannot start (evidence/m7/M7-09): PerfPowerService aborts in PowerLog startStorage -> _err -> abort, assistantd, dmd and ScreenTimeAgent abort in the same frames, biomed/biomesyncd/nsurlsessiond/bluetoothd/callservicesd exit 1 instead - on a Data volume with 96% free and 0 NativeSd failures. Sandbox, container layout and the APFS view are the three candidates; sd-trace-io=1 is the next instrument.",
]

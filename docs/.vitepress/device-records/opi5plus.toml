# --- image assembly -------------------------------------------------------------------------------------
[[area]]
id = "packaging"
status = "planned"
components = ["XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "patches/xnu/series", "feeds.toml", "dts/opi5plus.dts"]
inputs = ["XNU at the OS profile's revision, the ARM64, SoC, OS and device patch series in that order, the Apple device tree generated from dts/opi5plus.dts, a 96 MiB payload volume, and the owner trust-cache digests.", "A platform seed for --unique-chip-id and the trust-cache bundle, neither of which is in a repository."]
configuration = ["[payload] volume = \"OPI5PLUSESP\" (FAT labels are truncated at 11 characters), size_mib = 96, loader = \"firmware\", title = \"UniXNU Orange Pi 5 Plus\", panic_screen = false.", "[payload] trust_cache_sha256 repeats the OS profile's two digests explicitly: the first is the profile's own, the second covers the SystemOS cryptex of the owner image. An array here would replace the profile's, so both are written out.", "[payload.adt] chip_id = \"0x1\" and unique_chip_id = \"required\"; packed_data_ramdisk = false because the Data seed is a raw APFS container.", "[adt] supplies defaults (sleep-disabled, vmm-present), product (model \"xunlong,orangepi-5-plus\", thin-bezel) and buttons (hold/voldown/volup, home-button-type 2). Root defaults, chosen-node strings and the Apple product identity come from the OS profile."]
procedure = ["From the UniXNU checkout: defconfig, fetch, status --json, tree, porting-record check. Then, at M3: ./unixnu build kernel, ./unixnu build package, ./unixnu build payload --unique-chip-id <hex> --trust-cache <bundle> --data-ramdisk <seed>, ./unixnu bootimg.", "Note the step names: build takes kernel, package, firmware, payload, userdata plus all and prelink. There is no build uefi; firmware is built with ./unixnu build firmware --uefi <Mu-Silicium checkout>."]
findings = ["Round 2 (2026-11-11) packed and booted this configuration's payload: 993 bytes of command line with 54 arguments, read back from the running kernel's own boot-args line and 7 bytes under the 1000-byte ceiling payload.py enforces; kernel 45fbfab3cae0c66dcf73b85ba08a82ae7a580b0c4e6beabab1d81f76dc0a3893 (51,695,616 B), payload 80e4f2965501789a851974bd8366fd686c56aacc6bc443ceb2f3c36fc527d2e1 (100,663,296 B). The two sampler slots dropped to fit were opi5plus-bt7 and opi5plus-bt8 (evidence/round2-baseline/README.md).", "The four arrays in board.toml (components include, config_fragments, patch_series, archives) are replacements, not merges, so each one is written in full. The six components are all six the RK3588 port needs, XnuPrelink included: the OS profile's [kernel.prelink] tool points at kits/XnuPrelink/emit_prelink.py, and dropping it from include would drop the prelink tool.", "The four patch series files are all named even though patches/xnu/series is empty: the arch, SoC and OS series are where the actual patches are, and an empty device series is a valid fourth segment. patches.plan() skips comments and blank lines, so a series file with only a comment resolves to nothing and is accepted.", "kernel_args has a hard 1000-byte limit and a strict character class ([A-Za-z0-9_.\\-]+ with an optional =[A-Za-z0-9_.,/\\-]+ value), both enforced by payload.py before the volume is written. The enabled list is 158 bytes and every argument matches.", "[kernel] archives names exactly the three catalog components whose build_stage is kernel. Naming an embedded, firmware or prelink component there does not fail —archive_plan() silently skips those —which makes a wrong entry easy to miss; the comment in board.toml says which three are required and why the others must stay out.", "The SoC's apply-armcpu-patches.py has to precede component:ArmCpu: ArmCpu has no patch channel of its own, so the SoC script applies the RK3588 fixes to the checkout first."]
completion = ["Planned. Done means: a kernel and a payload built from this configuration boot on the board through the firmware, with the DarwinBoot hand-off log and the kernel version printed on UART2."]
limits = ["No kernel build, no payload build and no boot has been attempted from this repository. The Apple inputs (kernelcache, trust caches, Data seed) and a platform seed are prerequisites for the last two steps and none is in a repository."]
next_action = ["M3: fill patches/xnu/series, build the two steps, and record the command, the revision and the kernel hash in this area."]
evidence = [
  { kind = "source", reference = "evidence/round2-result.md", result = "The kernel, payload and command line as they were booted on 2026-11-11: 45fbfab3..., 80e4f296..., 993 bytes / 54 arguments" },
  { kind = "source", reference = "board.toml", result = "The payload and ADT tables, the archive order and the boot-argument rationale" },
  { kind = "source", reference = "patches/xnu/series", result = "The device series exists and is empty, with what it is expected to gain and when" },
]

# --- diagnostics ----------------------------------------------------------------------------------------
[[area]]
id = "diagnostics"
status = "planned"
components = []
paths = ["board.toml", "dts/opi5plus.dts"]
inputs = ["UART2 at serial@feb50000, 1 500 000 baud, 3.3 V TTL on the board's left edge (GND/RXD/TXD), which is the only channel that sees UEFI, DarwinBoot and early XNU output.", "The two Type-C ports are not usable for logs: one is power only, the other is OTG/data and presents no serial device."]
configuration = ["[payload] kernel_args console group: -v, serial=1, debug=0x10014e. serial=1 keeps the console on the UART and clears the INPUT bit (serial=3's 0x02), so serial_keyboard_poll never starts and the receive FIFO belongs to NativeSd's reset hook; output is unaffected. debug=0x10014e lifts the serial-output lock and restarts after a panic instead of parking in KDP, which is what makes a bare board recoverable without a debugger.", "panic_screen = false: no panic text overlaid on the frame buffer, because there is no display yet."]
procedure = ["Capture from the host with a USB-TTL module and log to a file for the whole boot, then split the log at the bring-up stage boundaries (firmware, UniXNU menu, payload, DarwinBoot, kernel entry, launchd). On this bench the adapter is COM3 at 1 500 000 8N1 and only one reader may hold the port at a time."]
findings = ["Round 2 made the exit line name the image a frame belongs to: opi5plus_text_base() takes the start of the lowest executable mapping of the task's map (the main executable's __TEXT on iOS) and the sampler prints it as 'text 0x...' after the process name (commit 1ef2c87b29215d1b56cb851f207d3513066dbdeb), so a user frame at 0x100xxxxxx no longer needs the ASLR slide guessed before it means anything. The map's read lock is taken only if it is free, because this runs on the exit path; a held lock, a vanished map or a start off the 16 KB page prints 'text -'.", "The console is the same UART at the same rate as the EVB10, so the EVB10's diagnostics arguments carry over unchanged. Its diagnostic patches did not, at first, because they instrument process bookkeeping and user stacks through EVB10 code paths; two pieces were then ported in reduced form and are now this port's own (patches/xnu/0004-thread-sample.patch and 0005-crash-trace.patch - a named-process user-stack sampler called from the heartbeat, and a signal-death fault dump). With the dyld shared cache extracted to /opt/uland and dsc.py --slide, every address they print becomes a function name, which is how SpringBoard's blocking synchronous XPC was found (evidence/m7/M7-08).", "A board with no storage and no native display has exactly one diagnostic channel, and it is the serial port. That makes the UART wiring a P0 purchase in plan.md §3.2, and it means the first bring-up evidence has to be text, not a screenshot.", "The stage marker set the port grew is the thing that made the display work readable: the probe prints D1..DA over the same UART, the display keeps beat counters (swaps, copies, flips, latch time), and the kernel patches add sd-exec, sd-ps, sd-exit, sd-syscall, sd-trace-io and sd-clock-div. sd-exit matters most: launchd only says 'Too many corpses being created', while the kern_exit hook separates exit(code) from signal death in one line and found that about twenty daemons including backboardd were SIGKILLed in one window.", "The board must be able to recover without a debugger. sd-watchdog=15 reprograms the firmware's DW watchdog and kicks it every 5 s, and sd-auto-reboot panics (rather than returning through the watchdog path) when its budget runs out, because a hang was observed where the watchdog line never printed 'armed' and the old path sat in XNU for thirty minutes. A panic resets the SoC over PSCI, which is the only reset available once the payload owner has the CPU.", "A panic screen does not clear itself across a reset: the firmware leaves video memory alone, so the previous boot's panic banner stays on the HDMI output until something repaints the frame buffer. A live beat line in the capture, not the screen, is what says the current boot is healthy."]
completion = ["Done means: a boot log from power-on to launchd is captured, stored with its sha256, and each bring-up stage can be pointed at in it. That has been true since M3; what remains is the frame-buffer-side evidence, which the display area owns."]
limits = ["The UART capture stops at the end of its window rather than at a marker, so a run that is quiet for longer than the capture looks the same as a hang; the beat counters exist to tell those apart.", "The board's clock is wrong after a reset, so durations are taken from /proc/uptime or from the kernel's own t+N s beats, never from wall-clock timestamps."]
next_action = ["Keep the beat line in every diagnostic payload; when the display path stabilises, add a frame counter to the same line so 'has a picture' is readable from the serial log alone."]
evidence = [
  { kind = "source", reference = "board.toml", result = "The console argument group and panic_screen = false" },
  { kind = "source", reference = "patches/xnu/0004-thread-sample.patch", result = "The named-process thread sampler: each thread's last-trap user registers and frame-pointer chain, from the heartbeat, off unless opi5plus-bt names a process. Eight name slots (opi5plus-bt / -bt2 ... -bt8, 16 characters each), added when SpringBoard turned out to wait on a fourth process" },
  { kind = "source", reference = "patches/xnu/0005-crash-trace.patch", result = "The signal-death fault dump: saved user registers and user frame chain from exit_with_reason(), same symbolisation path" },
]

# --- software AES -------------------------------------------------------------------------------------
[[area]]
id = "software-aes"
status = "planned"
components = ["SoftwareAES"]
paths = ["board.toml", "porting.toml"]
inputs = ["Pinning Rk3588VopDirect moved the SoC pin to b5f5d949, whose rk3588.config turns CONFIG_XNU_NATIVE_AES on; the kernel link then wants build/software-aes/libSoftwareAES.a."]

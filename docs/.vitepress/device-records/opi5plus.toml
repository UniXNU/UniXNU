  { kind = "source", reference = "evidence/m5/M5-18-vram-region-campaign.md", result = "The archive publishes /vram (IOService, 256 MiB at 0x1_0000_0000) and fills the region table directly through the service's own installer; fromPath(\"/vram\") answers 0 in both planes for all three placements, so the table fill replaces the path lookup" },
  { kind = "source", reference = "evidence/m7/M7-06-window-follows-green-then-snapshot.md", result = "The scanout follows this port's window: the hand-painted green reached the panel and the third compositor swap put the boot picture back, so the frames reach the panel and their content is the boot screen" },

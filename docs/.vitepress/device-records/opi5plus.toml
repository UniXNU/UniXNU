# --- gpu ------------------------------------------------------------------------------------------------
[[area]]
id = "gpu"
status = "implemented"
components = []
paths = ["board.toml", "configs/opi5plus_display_defconfig", "proprietary-files.txt", "scripts/build-mali-firmware.py", "package/Mali"]
inputs = ["Mali-G610 MP4 at gpu@fb000000 (0xfb000000, 2 MiB, SPIs 92-94), the same GPU as the EVB10 (docs/hardware.md: /sys/class/misc/mali0, driven by panfrost under Linux).", "The Mali CSF firmware mali_csffw.bin: Arm Valhall, arch 10.8, 274432 bytes. This board's copy comes from the Rockchip BSP image the board itself runs, /lib/firmware/mali_csffw_g15p0/mali_csffw.bin, sha256 ad91511a77fa110af46a2a29cad9e225524d9cfa9fe35bdce96606d354e607de. It is NOT the EVB10's 8e7c821a build: same size and same CSF format, different content, and it reports header 0.2 with the entry list ending at 880 where the EVB10's build reports 0.3 ending at 960.", "package/Mali, the driver submodule shared with the EVB10 (Ken-u/Mali), now initialised.", "MaliMetal (Ken-u/MaliMetal) for the user-space stack (PanVK plus metal2vulkan): cloned, not built or packed yet."]
configuration = ["package/Mali is initialised and builds: [kernel] archives runs build-mali-firmware.py (package/Mali/tools/gen-fw-inc.py over .cache/firmware/mali_csffw.bin) and build-opi5plus-drivers.py Mali (package/Mali/Mali.cpp -> build/mali/libMali.a), and configs/opi5plus_display_defconfig force-loads that archive next to libLinkStubs/libNativeSd/libRk3588VopDirect/libOpi5plusHid.", "board.toml kernel_args carry mali=8 (power, GPU_ID, firmware, MCU, several groups, the service). mali-metal waits for MaliMetal and the payload's NativeMaliMetal.addon; the pll/div/ycbcr/aflush/epri tuning arguments stay commented out.", "The five inert stubs that stood in for mali_start, mali_fence_take/done/describe and mali_clean_caches are deleted from package/LegacyDisplayProbe.cpp; libMali.a defines all five (llvm-nm reports them as T), so the display archive and the VOP direct component link against the driver instead of against no-ops.", "gpu@fb000000 is described in rk3588.dtsi with status disabled and no unixnu,adt-name, because the Mali driver addresses the GPU by its fixed physical base rather than through the device tree. That is a SoC-level fact and is inherited, not restated."]
procedure = ["M7: add the Mali driver submodule and its firmware include builder, enable the mali* argument group, then verify in this order: context creation and command submission, readback, a composited frame, and only then the frame rate over a scripted 60 s scroll."]
findings = ["The GPU is the one subsystem where this board matches the EVB10 closely enough that the work was mostly reuse: same Mali-G610 MP4, same firmware architecture, same driver. What had to be done was packaging (submodule, firmware digest, the archive wiring), not hardware.", "Refusing to copy the EVB10's firmware digest turned out to be right: this board's copy is a different Arm build (ad91511a vs 8e7c821a). An inherited digest would either have failed the extraction or, worse, accepted a file nobody had hashed -- and the difference is real, not cosmetic: this build reports CSF header 0.2 with entries ending at 880.", "Measured on the board 2026-11-09 with mali=8 (logs/boot-mali-1.log): power domain 12 comes on, GPU_ID 0xa8670005 (arch 10.8.6 product 7), L2/MCU/MMU described, clock probed at 198 MHz, CPU memory fill 52176 MB/s and copy 22500 MB/s, a 512 MiB pool of 2 MiB granules, the 274432-byte firmware mapped in 7 sections with 36864 bytes of page tables at 0x12de00000, AS0 enabled, the MCU booted and raised its interrupt, CSF interface v1.1.0 with 8 groups, the global interface config and ping acknowledged (req 0x10e ack 0x10e) and MaliService registered with a sandbox grant list that already names backboardd, SpringBoard, PosterBoard, WidgetRenderer_D and the poster extensions.", "The GOP display path changes what the GPU has to do: without a VOP2 scan-out there is no zero-copy flip, so the composition target is the firmware's frame buffer and every frame crosses the bus once more. plan.md's >=30 fps target at 1080p is the thing to measure, not the EVB10's 52 fps to match.", "The CoreAnimation preference that keeps the render server on 8-bit BGRA is written by patch 0003, and the Data seed of 0002 took it away again: the seed copies the OS volume's /private/var over the Data volume with O_CREAT|O_TRUNC, so the stock .GlobalPreferences.plist landed on top of the one just written. Every earlier round logged pref bits 0xf (deep 0, BGRA surfaces, swaps accepted); the seed round logged 0xc, deep 1 and 'b3a8' 10-bit biplanar surfaces, which NativeLegacyDisplay::validateSwap() refuses with reason 4. The GPU add-on call now runs below the seed block in kern_exec.c, so the key is written last before launchd."]
completion = ["Half done. The driver brings the GPU up on this board and registers its service; what is still missing is everything above it: a context submitting and reading back, a GPU-composited UI at 1080p, and a recorded frame rate over a scripted interaction."]
limits = ["A live run now exists with the GPU stack visible and a Data volume that fits (evidence/m7/M7-05): 1505 s, 150 processes, the add-on mounted at stage 5, the render server loading the plug-in through the union, 26 Vulkan pipelines with 0 failures, and the compositor's five swaps completing (5 x 14745600 B, status 0) with five VOP2 flips latched.", "The five flipped frames do not reach the panel: the screen still shows the firmware's boot logo. Either the composited surface is not what we think (surface id 0x80000000 still answers e00002d5 while 0x80000001 and 0x80000003 succeed), or the VOP window we program (0xe6740000, from PE_Video) is not the window the panel scans (the firmware set Esmart2 to 0xe6730000 at boot).", "Only five swaps ever arrive, because a static UI draws once; that is expected but it means the run says nothing about the frame rate yet.", "The round before this one panicked at t+660 s inside Apple's storage stack, in its error path after this port's block device refused a zero-length request during a write burst (evidence/m7/M7-05 has the disassembly). The fix - complete zero-length requests, chunked writes through the bounce buffer, log and retry refusals - survived 242067 requests and 29034112 blocks with 0 failures.", "The Data volume is 2048 MiB on the card (lba 58735583 + 4194304 blocks) and the payload carries only its 9330688-byte front; the first boot reformatted it, later boots keep it (header v1 state 2).", "No frame-rate measurement on this board yet: five frames is not a rate.",]
next_action = ["One boot, one change: fill the VOP window with a solid colour at initialisation and let it latch. If the panel changes colour the flips do reach the display and the composited content is the problem; if it stays on the logo, the window/base pair (0xe6730000 versus 0xe6740000) is.", "Then the default surface (0x80000000, M5-15/M5-16) for the client calls that still answer e00002d5, and after that a scripted 60 s scroll for the frame rate.",]
evidence = [
  { kind = "source", reference = "proprietary-files.txt", result = "This board's firmware digest (ad91511a...) with its provenance, and why the EVB10's does not apply" },
  { kind = "source", reference = "evidence/m7/M7-02-mali-bringup-on-board.md", result = "The whole M0..M8 bring-up: GPU_ID, 198 MHz, the 512 MiB pool, firmware in 7 sections, MCU boot, CSF v1.1.0 handshake, MaliService registered" },
  { kind = "source", reference = "package/Mali/README.md", result = "What each mali=<milestone> level covers and which arguments tune it" },
  { kind = "source", reference = "evidence/m7/M7-01-mali-metal-stack-built.md", result = "The user-space stack built: PanVK dylib, Rust bridge, plug-in bundle and the addon, with their cdhashes, the commands, and the two inputs that had to be substituted" },
  { kind = "source", reference = "evidence/m7/M7-03-gpu-addon-delivered.md", result = "The add-on unpacked and mounted: 3 files written, stage 5 (our bundle visible next to the sealed ones), 3 trust modules loaded, AGXAccelerator registered with NativeMaliMetalDevice" },
  { kind = "source", reference = "evidence/m7/M7-04-userland-reaches-compositor.md", result = "Userland reaches the compositor: 106 processes, SpringBoard/backboardd/IOMFB_FDR_Loader running, 5 framebuffer clients and 19 calls; swap ok 0 rej 0 (no swap submitted) because that run skipped the union mount; the 64 MiB Data volume is the seed's own size, and the front of a 2048 MiB container is 9330688 bytes" },
  { kind = "source", reference = "evidence/m7/M7-05-frames-flipped-screen-unchanged.md", result = "The first run with the union mounted and a Data volume that fits: 1505 s, 150 processes, 26 Vulkan pipelines 0 failures, five swaps accepted and copied (14745600 B, status 0) and five VOP2 flips latched, while the panel still shows the boot logo; plus the zero-length-request panic the SD fixes removed" },
  { kind = "source", reference = "evidence/m7/M7-06-window-follows-green-then-snapshot.md", result = "The fence on this board: 2 of 2 swaps arrived with GPU work not done, both flips waited (mean 7.6 ms, longest 8.3 ms, 0 gave up); and the readback that shows the scanout following the window this port programs" },
]


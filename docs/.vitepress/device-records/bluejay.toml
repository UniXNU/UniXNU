inputs = ["STMicro FTM5 touch, chip ID bytes 0x36 0x48, SPI11 / USI11 at 0x10D40000, USI mode register 0x10C2100C, max 10 MHz.", "Pins: gpp23-0..2 SPI function 2, CS gpp23-3, IRQ gpa9-0 (XEINT_20), reset gpp26-0, TS_SPI_SEL gpp26-1.", "Power: S2MPG10 LDO25M/LDO26M. Keys: power gpa10, vol+ gpa8, vol- gpa7, all active low."]

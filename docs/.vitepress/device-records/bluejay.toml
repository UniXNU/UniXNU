schema_version = 1

[device]
name = "bluejay"
soc = "GS101"
os_profile = "ipados-17.7.11-21H461"
summary = "Google Pixel 6a (bluejay, Tensor G1) port scaffold. Hardware values come from the pixelios-kernel research port, which boots XNU 8796 with the iOS 16.7 userland on this phone; this repository restates them in UniXNU format. No UniXNU image has been built or booted for this board yet."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot", "GopFramebuffer"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", ".github/**", ".gitignore"]
inputs = ["Google Pixel 6a (bluejay), Tensor G1 (GS101), 6 GiB DRAM (2 GiB low bank + 4 GiB high pair, measured), 128 GiB UFS, 1080x2400 panel.", "pixelios-kernel hardware descriptions: soc/google/gs101/soc.json, device/google/bluejay/board.json, docs/research/05-fact-check.md."]
configuration = ["board.soc_source = gs101 pins UniXNU-gs101-common; board.os_profile = ipados-17.7.11-21H461.", "config_fragments apply in order arch, soc, os; the resolved defconfig bluejay_defconfig applies last.", "patch_series is arch, soc, os, device; every series except device is inherited and currently empty for this SoC."]
procedure = ["From a UniXNU checkout: ./unixnu defconfig bluejay_defconfig -D ../UniXNU-bluejay", "./unixnu fetch -D ../UniXNU-bluejay; ./unixnu status --json -D ../UniXNU-bluejay", "python3 scripts/porting-record.py check --device ../UniXNU-bluejay"]
findings = ["UniXNU ships only iPadOS 17.7.11, iPadOS 26.5.2, iPadOS 27.0.1 and macOS 27.3 OS profiles. There is no iPhone/iOS 16.7-20H19 profile, so this scaffold selects the oldest shipped profile; a native iPhone profile is required before the result is a real phone port.", "pixelios boots XNU 8796 (iOS 16 generation). UniXNU pins a newer XNU and its own ordered patch series, so the pixelios patch stack is not reused as-is.", "The pixelios shim is a bare-metal EL2 loader, not UEFI. Its hardware facts (UFS cold re-init, HS-G4 link, memory map, device tree) are reusable; its code is not a UniXNU component.", "The SoC commit pinned in feeds.toml is the first commit of UniXNU-gs101-common and must be replaced with the reviewed published commit.", "The device owns no board driver submodules yet: Gs101Ufs, FTM5 touch and GS101 power are unassigned."]
completion = ["Every source pin resolves; status shows the intended profiles, components and patch order; the porting record check passes."]
limits = ["No component build has been attempted; UniXNU, uefi-bluejay and a working IPSW profile are missing."]
next_action = ["Clone UniXNU beside this repository, run defconfig, fetch and status, and record the resolved output."]
evidence = [{ kind = "source", reference = "https://github.com/PixOS-Project/pixelios-kernel/blob/main/device/google/bluejay/board.json", result = "Board hardware values (DRAM banks, framebuffer, userdata geometry, keys, touch)." }, { kind = "source", reference = "https://github.com/PixOS-Project/pixelios-kernel/blob/main/soc/google/gs101/soc.json", result = "SoC register bases, GIC/timer, UFS, USB, UART, WLAN and GPU resources." }]

[[area]]
id = "firmware"
status = "implemented"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", ".github/workflows/package.yml", "board.toml", "scripts/build-boot-dtb.py"]
inputs = ["tuxmanxd/uefi-bluejay: the Mu-Silicium GS101/Pixel 6a platform (bluejayPkg + GS101Pkg), installed with scripts/apply.sh.", "Google Pixel 6a factory image for vendor firmware inputs.", "ABL hands over a linear framebuffer at 0xfac00000 and a live FDT."]
configuration = ["[firmware] config = bluejay, dsc = Platforms/Google/bluejayPkg/bluejay.dsc, fd = Build/bluejayPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd.", "[firmware.defines] DEVICE_MODEL = bluejay. [bootimg.image] header_version 4, kernel_compression none: ABL rejects a nonzero arm64 text_offset, so the shim is built with text_offset 0.", "[bootimg] dtb is written by the firmware preflight: a 4 KiB FDT envelope followed by the real payload volume, because the pack stage appends only that file to the kernel field.", "[payload] size_mib 54: the volume carries kernel.macho (49.5 MiB) plus the ADT; boot.img is checked against boot_partition_bytes 67108864."]
procedure = ["Install uefi-bluejay into a Mu-Silicium checkout with scripts/apply.sh, following https://unixnu.com/porting/uefi-firmware, then build the firmware volume with build_uefi.py -d bluejay.", "Run scripts/package.sh --check --os 17.", "Boot the artifact with fastboot boot and read the panel."]
findings = ["The stock bootloader boots Android boot images only, so UniXNU must be packaged as a boot image first (layer 1) before the firmware volume is reachable; the pixelios fastboot boot flow proves this path on the phone.", "ABL sets up the panel framebuffer and provides no framebuffer node in its FDT; the address and size are measured (0xfac00000, 0x9e3400).", "The phone is read-only toward storage in the pixelios pre-kernel path; any UniXNU firmware must preserve that property until the userdata install is explicit.", "Tensor ABL caps the boot image ramdisk at 32 MiB (measured 2026-11-15: 4 and 32 MiB boot, 36/40/42/44/46/48/54/56 MiB are refused, header v0 and v4 alike), while the prelinked kernel alone is 49.5 MiB. The payload therefore travels in the kernel field, which accepts 56 MiB.", "ABL does not parse bytes appended after the FD: a kernel field with 54 MiB of 0xAA after the FD still boots the firmware, so the field can carry the payload volume behind a 4 KiB envelope."]
completion = ["The firmware volume builds, UniXNU.efi runs from it, the menu appears on the panel and the memory map matches the DTS reservations."]
limits = ["The menu scrolls without input on hardware; the xnu boot entry has not been reached yet. No firmware archive pin and no proprietary file hashes yet."]
next_action = ["Boot the kernel-field payload image, confirm that UniXNU finds EFI/UniXNU/unixnu.toml on the payload volume, then fix the menu input/redraw bug."]
evidence = [{ kind = "source", reference = "https://github.com/PixOS-Project/pixelios-kernel/blob/main/docs/research/01-boot-path.md", result = "Boot chain, ABL handoff, framebuffer and boot image parameters." }]

[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu"]
paths = ["dts/bluejay.dts", "configs/bluejay_defconfig"]
inputs = ["8 cores: 4x Cortex-A55, 2x Cortex-A76, 2x Cortex-X1.", "GICD 0x10400000 (64 KiB), GICR 0x10440000 (1 MiB, 8 redistributors, stride 0x20000).", "CNTFRQ 24.576 MHz; virtual timer PPI 11 = INTID 27."]
configuration = ["cpus/timebase-frequency = <24576000>; psci method smc.", "unixnu,cluster-type = E for cpu0-3 and P for cpu4-7 in the board DTS.", "CONFIG_XNU_ARMCPU=y and CONFIG_XNU_ARM_DT_PLATFORM=y."]
procedure = ["Compile dts/bluejay.dts against soc:dts, boot, and read the CPU and interrupt bring-up lines from the kernel log."]
findings = ["The big cluster mixes A76 and X1 cores; treating cpu4-7 as one P cluster is a scheduling policy choice, not a hardware boundary.", "GICv3 needs both the distributor and all eight redistributor frames; a truncated GICR size leaves secondary CPUs unable to start.", "pixelios boots all 8 CPUs with a custom boot-CPU driver (XNU patch 0018), which UniXNU ArmCpu replaces."]
completion = ["All 8 CPUs come online, IPIs work, the timer ticks at 24.576 MHz and secondary CPUs survive idle."]
limits = ["Not run on hardware in this configuration; cluster mapping has not been validated under UniXNU."]
next_action = ["Boot the firmware and kernel and record the CPU startup and timer lines."]
evidence = [{ kind = "source", reference = "https://github.com/PixOS-Project/pixelios-kernel/blob/main/docs/research/05-fact-check.md", result = "GIC and timer values confirmed against the vendor DTS." }]

[[area]]
id = "memory"
status = "implemented"
components = ["ArmDTPlatform"]
paths = ["dts/bluejay.dts", "board.toml"]
inputs = ["DRAM banks measured: 0x80000000 (2 GiB, carve-outs), 0x880000000 and 0x900000000 (2 GiB each, contiguous, no reserved range inside).", "XNU range: 0x884000000 size 0xf0000000 (the high pair after the firmware payload window, 3840 MiB, 137.9 MiB under the 0xF89F6000 run measured with the kernel image still held).", "USB DMA carve-out: 0xf8800000 size 0x1000000 (ABL, no-map)."]
configuration = ["One memory node for the high range only: reg = <0x8 0x84000000 0x0 0xf0000000>.", "payload.adt.owned_memory_size = 0xf0000000; dram_size = 0xf0000000.", "The first 64 MiB of the high range (0x880000000) is the firmware payload window: reserved in the UEFI map, outside XNU's node.", "reserved-memory/framebuffer@fac00000 is no-map."]
procedure = ["Compare the firmware memory map with the DTS, then check that XNU boots with the full 4 GiB and no overlap."]
findings = ["XNU maps [kernel, physBase+memSize) cacheable, so the range must contain no carve-out and its base and size must be multiples of 32 MiB (16K-granule L2 block). The high pair, minus the 64 MiB payload window, satisfies both.", "The payload volume travels in the boot image kernel field because Tensor ABL caps the ramdisk at 32 MiB; BootShim copies it to 0x880000000 before the MMU is on, and the firmware maps that window as reserved.", "The low bank cannot be handed over whole: ABL reserves several no-map ranges, including its 16 MiB USB event buffer. Its allocation moves between boots (0xF8B92000, 0xF8D12000 observed).", "The 0xfac00000 framebuffer is below the XNU range, so it needs a reservation for firmware/DarwinBoot but does not fragment owned memory."]
completion = ["XNU sees 0xf0000000 bytes of owned memory, boots past pmap setup, and the framebuffer, USB carve-outs and payload window stay untouched."]
limits = ["The low bank is not adopted; memory outside the window is unavailable to the OS."]
next_action = ["Measure the firmware memory map in the UniXNU boot log and confirm the DTS reservations."]
evidence = [{ kind = "source", reference = "https://github.com/PixOS-Project/pixelios-kernel/blob/main/device/google/bluejay/board.json", result = "DRAM banks, XNU RAM range, framebuffer and USB DMA range with measurement notes." }]

[[area]]
id = "storage"
status = "planned"
components = []
paths = ["dts/bluejay.dts", "configs/bluejay_defconfig"]
inputs = ["UFS host controller 0x14700000, vendor HCI +0x1100, UNIPRO 0x14780000, PHY/PMA 0x14704000.", "UFS LUN 0 GPT: userdata first 0x22F1E6, last 0x1DC03FA, 4096-byte LBAs.", "Cold re-init after the bootloader shuts the controller down, then HS-G4 link."]
configuration = ["&ufs and &ufsphy status = okay; CONFIG_XNU_NATIVE_UFS=y.", "[userdata] first_lba/last_lba/lba_bytes in board.toml."]
procedure = ["Implement a Gs101Ufs component (or a board driver) from the pixelios UFS cold-init sequence, then mount the iOS root read-only and verify the GPT geometry."]
findings = ["The bootloader leaves the UFS controller off; a plain HCI reset is not enough and the pixelios shim reprograms vendor HCI, UNIPRO and the PHY before the link trains.", "The link is switched to HS-G4 (12x read throughput); the gear change is part of bring-up, not a later optimisation.", "The root lives in userdata, so the partition geometry is fixed by the phone GPT and is recorded in board.toml.", "No shared UniXNU UFS component supports Exynos/GS101 UFS yet; ShengUfs is Qualcomm-specific and cannot be reused."]
completion = ["The kernel enumerates the UFS LUNs, reads the GPT and mounts the root; a full read of userdata completes without CRC errors."]
limits = ["No driver code; the pixelios implementation is bare-metal C in the shim, not an XNU kext."]
next_action = ["Port shim ufsinit.c to a UniXNU storage component and prove a read-only userdata read."]
evidence = [{ kind = "source", reference = "https://github.com/PixOS-Project/pixelios-kernel/blob/main/soc/google/gs101/shim/ufsinit.c", result = "UFS cold re-init, vendor HCI/UNIPRO/PHY windows and HS-G4 sequence." }]


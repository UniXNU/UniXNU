paths = ["dts/bluejay.dts", "board.toml"]
inputs = ["Framebuffer 0xfac00000, size 0x9e3400, 1080x2400, stride 4320, a8r8g8b8, set up by ABL.", "No framebuffer node in the firmware FDT."]
configuration = ["reserved-memory/framebuffer@fac00000 label cont_splash_region, no-map.", "CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y."]
procedure = ["Describe the scanout buffer as the GOP handoff, boot, and check that the boot logo and the first frames appear."]
findings = ["ABL programs the panel and leaves a linear buffer; there is no display controller driver in the pixelios pre-kernel path.", "1080x2400 with a 4320-byte stride is 4 bytes per pixel with no padding beyond the width.", "The pixelios kernel only patches an early framebuffer console (XNU patch 0003) and later hands off to a software-rendered UI."]
completion = ["The firmware menu and the XNU boot text render, and the framebuffer is not reclaimed as free memory."]
limits = ["No panel, backlight or DPU driver; brightness control is absent."]
next_action = ["Map the measured buffer into GopFramebuffer and confirm the handoff on hardware."]
evidence = [{ kind = "source", reference = "https://github.com/PixOS-Project/pixelios-kernel/blob/main/device/google/bluejay/board.json", result = "Framebuffer base, size, width, height and stride." }]


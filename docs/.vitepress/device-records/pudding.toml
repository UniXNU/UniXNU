[[area]]
id = "storage"
status = "implemented"
components = ["VerifiedRoot"]
paths = ["scripts/pudding_ufs.c.txt", "scripts/pudding_ufs_extents.h", "scripts/patch-pudding-ufs.py", "scripts/patch-pudding-*.py", "scripts/pudding_rd*", "scripts/vendor/**", "scripts/*ufs*", "scripts/*storage*", "scripts/*userdata*", "scripts/*root*"]
inputs = ["SM8850 UFS host reuses bootloader-initialized UTRL; UFS LUN 0xD0; SMMU SID 0x60 remains bootloader passthrough; 4 KiB native blocks; userdata GPT range 3535360..128627706.", "Persistent diagnostics are limited to the pinned iosroot file's unused tail, after the 2,290,688-block image boundary; no Android partition or slot writes."]
configuration = ["BSD bdevsw root reader is selected; ShengUfs/IOStorageFamily static linkage is disabled because required private symbols are not exported.", "READ CAPACITY(10) requires 4096-byte blocks; GPT header/entry CRCs, type GUID and exact userdata bounds are validated.", "Pinned extents map file blocks [2290688,2290945) to userdata-relative blocks [40995328,40995585); all 257 blocks are unique, contiguous, within userdata, and the extent set has no overlap.", "Logger-owned UFS commands use try-lock and return EBUSY on lock contention; ordinary BSD root reads retain blocking command-lock semantics.", "Logger bootstrap is serialized with an atomic start guard; header write/sync failures schedule delayed callout retry, and syscall pump retries initialization if thread-call allocation fails."]
procedure = ["Generate bsd/dev/pudding_ufs.c with scripts/patch-pudding-ufs.py.", "Run device-dump/check_log_extents.py, device-dump/test_pudding_gpt_guard.py and device-dump/verify_all_patches.sh; focused-compile with device-dump/compile_any.py pudding_ufs.c.", "Boot only with fastboot boot; retrieve the pinned log region read-only from Android after return."]
findings = ["2026-11-11 23:20: Implemented compact signed-prefix BSD VerifiedRoot integration. Shared C adapter reconstructed both complete source windows read-only (2,290,185 hashes), byte-identical to original authenticated envelopes; exact generation1, imageSHA256, full-envelopeSHA384, OS1536-byte final block and GPT slice+17408 checked. Fresh blocks are verified within bounce lock before copying. Original verifier/crypto sources remain hash-pinned and unchanged. APFS selected volume UUID plus actual readonly root/cache devices bind original owner publisher; callback readiness fails closed. Host negative/sanitizer tests and six affected focused ARM64 translation units pass; publisher independent review passed after errno inversion repair. Full build/UFS review pending; no device runtime authentication/publication claim and no device operations. See device-dump/pudding-verified-root-runtime-report.md and docs/PROGRESS.md in workspace.", "2026-11-11: Host-only staging repair limits payload to DATA_BYTES - in_block so the OS slice remainder cannot overflow the actual 128 KiB allocation. A separate static bounce mutex spans all fragmented reads through successful copy; strategy lock order is bounce then command, logger remains log then command without bounce, and probe uses staging only before ready. Six host tests cover 45,056 bounds cases, exact bytes, concurrency/failure models and original-defect negative controls; independent review and focused generated pudding_ufs.c compilation passed. No full rebuild or hardware validation of this repair yet; pinned-tail write boundaries are unchanged.", "The BSD bdevsw path reaches real UFS GPT/manifest and APFS root reads; it avoids unsupported static IOStorageFamily linkage.", "Screen evidence reached periodic log flush and ring read, but did not show a return marker. The read path can block on pudding_ufs_cmd_lock before its bounded UFS command poll, so logger requests now try-lock and should retry on the next scheduled interval.", "The earlier raw ring had header v1/seq=0/total=0 and SHA-256 2ad7d9db9c7270e957232d795c36cb2c33e8c06cac965979331dbd4876e428a4; it was stale, not current-boot evidence.", "2026-11-10: Replaced logger destination read-modify-write with a full 4 KiB RAM-ring block copy. Device boot committed header seq=99,total=42884; ring write, ring sync, header write/sync and final flush all returned 0. Fresh raw log SHA-256 400063aff2b3cc90858630089f3c4513cf50213869a64c81f8d4b6cb7ca2adaf.", "The same boot reached launchd and dyld shared-region mapping; syscall 536 returned 0. It then entered _DebuggerTrapWithState+0xec (ESR EC=0/TRAP_DEBUGGER); the original panic message is not present in the committed ring and remains unresolved."]
completion = ["Host: capacity, GPT, pinned extents, write allowlist and focused compilation pass.", "Device: current RAM boot produces a fresh committed logger header/ring and periodic try-lock retries do not stall root reads.", "Root: the configured APFS root mounts and launchd continues beyond the last recorded syscall."]
limits = ["Fresh logger persistence is device-verified, but panic snapshot capture/clean-sync gate and original panic cause remain unverified.", "No display, touch, GPU, Wi-Fi, audio or sustained power-management milestone is claimed here."]
next_action = ["Trace panic snapshot generation, debugger clean-sync eligibility, lock/controller preflight and panic-log commit without widening the pinned-tail write allowlist; then continue beyond shared-region syscall 536."]
evidence = [{ kind = "source", reference = "scripts/pudding_ufs.c.txt", result = "BSD UFS reader, GPT/capacity validation, bounded logger write window, and logger-only try-lock implementation." }, { kind = "source", reference = "scripts/pudding_ufs_extents.h", result = "Static FIEMAP extent table for the pinned image, including the dedicated log tail." }, { kind = "source", reference = "scripts/patch-pudding-ufs.py", result = "Generates the maintained UFS implementation into the active XNU work tree." }]


paths = ["drivers/NativeUfs/**", "scripts/*ufs*", "scripts/*storage*", "scripts/*os-delta*", "patches/xnu-ipados18/0006-*", "tools/zizhan/phone/pinalloc.c", "tools/zizhan/mac/install_pinned.py"]
inputs = ["UFS 3.1 and Android userdata (f2fs).", "OS, SystemOS and Data images prepared locally from 22H374 on macOS."]
configuration = ["pong_shngroot_4k=<4K block> identifies the root image extent.", "pong_ufs_async=0; pong_ufs_defer enabled by default."]
procedure = ["install_pinned.py uses pinalloc to allocate a contiguous 19.4 GiB /data/hackios/root.img, writes OS/SystemOS/Data windows and reports its first block.", "RootLayout publishes each window as separate IOMedia.", "0006 immediately sends matched notifications when publishResource finds IOResources still configuring."]
findings = ["Before 0006, roughly three of four boots failed to mount root. APFS probing held its lock while waiting for IOBSD, forming a cycle with IOResources configuration; waiting-thread dumps identified it in g28. g36-g39 mounted root in 4/4 trials after the fix.", "OS, SystemOS and writable Data mount; stock 22H374 launchd starts.", "Existing SmmuTakeover WIP selects SMR/S2CR validity and SID mask from IDR0.EXIDS. APPSSMMU on this phone has EXIDS disabled; g272-retry through g275 mounted root, wrote fresh UFS klog and returned to Android. EXIDS-enabled behavior has host build coverage only."]
completion = ["Mount root reliably and preserve Data writes across boots."]
limits = ["The root image is a pinned f2fs file. Never move or defragment it in Android; a 40 GiB placeholder was used to preserve a contiguous extent."]
next_action = ["Provide a software IOAESAccelerator for AppleImage4 to resolve its wait on /defaults."]
evidence = [
  {kind = "source", reference = "docs/progress/2026-10-30-root-and-autoloop.md", result = "Root layout, root-mount deadlock analysis and before/after 0006 results."},
]


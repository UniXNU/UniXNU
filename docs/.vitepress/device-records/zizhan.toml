schema_version = 1

[device]
name = "zizhan"
soc = "SM8475"
os_profile = "ipados-18.7.10-22H374"
summary = "Xiaomi MIX Fold 2：iPadOS 18.7.10 主屏、内屏触摸、Adreno 730 渲染（120 Hz 面板，滑动约 54 fps）与电池读数；基于 UniXNU-pong"

[[area]]
id = "configuration"
status = "host-verified"
components = ["PongPlatform24"]
paths = ["board.toml", "proprietary-files.txt", "feeds.toml", "unixnu.lock", "configs/**", "dts/**", "migration/format2/**", "scripts/*format2*", "scripts/build-pong-profile-kernel.py"]
inputs = ["zizhan（22061218C）实机 /sys/firmware/fdt，MIUI V14.0.15.0.TLRCNXM（Android 13，内核 5.10.136）", "UniXNU-pong 的 SM8475 公共层与 PongPlatform24（Nothing Phone (2)，同为 SM8475）", "iPad7,11 的 iPadOS 18.7.10 22H374 restore"]
configuration = ["board.toml：name = zizhan，device_tree = dts/zizhan.dts，kernel.defconfig = zizhan_ipados18_gpu_defconfig", "configs/zizhan_ipados18_gpu_defconfig：CONFIG_XNU_PONG_ADRENO_PLATFORM=y、CONFIG_XNU_PONG_POWER=y、CONFIG_XNU_PONG_WIFI=n、CONFIG_XNU_PONG_BACKLIGHT=n", "patches/xnu-ipados18/series：0001–0006、0008–0014，按序号应用"]
procedure = ["tools/gen_reserved.py 按 pong.dts 的布局从实机 DT 生成 dts/zizhan.dts：model、compatible、DRAM 区间和 reserved-memory 换成 zizhan 的值。", "固件段指向 uefi-zizhan 的 Platforms/Xiaomi/zizhanPkg/zizhan.dsc。", "其余沿用 Pong 的四层选择（ARM64、SM8475、22H374、板级）。"]
findings = ["zizhan 与 Pong 的 DRAM 第二段不同（0xf4600000+0xba00000，Pong 为 0xf1400000+0xec00000），ADSP carveout 为 0x9fd00000+0x3100000（Pong 为 0x85700000+0x2800000）；其余 SMEM、IPCC、AOSS、cmd-db 地址相同。", "构建脚本不读取 board 名，改名 zizhan 不影响 Pong 脚本。"]
completion = ["dts/zizhan.dts 能编译，内核与启动镜像能构建，手机能进入 iPadOS 主屏"]
limits = ["外屏（DSI-2，1080x2520）、Wi-Fi、音频没有接入，配置里关闭。"]
next_action = ["用发布的版本打包启动镜像并上机跑一轮，记录设备结果。"]
evidence = [{kind = "source", reference = "docs/progress/2026-10-28-device-prep.md", result = "记录了实机硬件参数、全分区备份和原厂 UEFI 内存表对照。"}, {kind = "source", reference = "docs/progress/2026-11-01-battery.md", result = "记录了 zizhan 与 Pong 的硬件地址差异。"}, {kind = "host", command = "GitHub Actions zizhan macOS build（macos-15-intel，Xcode 16.4，pong_ipados18_ci_defconfig）", revision = "28d9f4fe869293e7a384b18b800ceb8dd56c1244", reference = "https://github.com/qiumochen/UniXNU-zizhan/actions/runs/41304992346", result = "托管 runner 上解析四层配置、编译 dts/zizhan.dts、应用全部 13 个 XNU 补丁并链接出 CI 内核，产物 pong-macos-products 已上传。"}]

[[area]]
id = "firmware"
status = "implemented"
components = ["PongPlatform24"]
paths = ["drivers/DarwinBoot24/**", "scripts/build-darwinboot24*"]
inputs = ["uefi-zizhan（uefi-pong 加 Platforms/Xiaomi/zizhanPkg）", "原厂 uefi_b 的 uefiplat.cfg 内存表"]
configuration = ["MemoryMap：PIL Reserved 大小 0x1DC00000，删去 Demura 和 QTEE", "SimpleFbDxe：framebuffer 0xb8000000，2160x1916（bootloader 留下的 cont_splash_region）", "启动方式：fastboot boot，不写任何分区"]
procedure = ["build_fw.sh 用 EDK II 构建 zizhanPkg 的 FD；build_bootimg.py 把 BootShim、FD 和实机 DTB 拼成 boot v4 镜像。", "DarwinBoot24 读取 UniXNU 菜单配置，交接 XNU 前武装看门狗（pong_autoreset）。", "命令行不能超过 1023 个字符，ci_boot_ufs.sh 在打包时检查。"]
findings = ["内屏显示 Silicium logo 和 UniXNU 菜单，颜色和方向正确；DarwinBoot24 能交接给 XNU。", "DarwinBoot24 拒绝启动时，把原因追加到 logfs:\\BOOTFAIL.TXT，然后重试，最后回到 fastboot。"]
completion = ["fastboot boot 后进入 UniXNU 菜单并启动 XNU；任何失败都能自动回到 fastboot"]
limits = ["高通 DXE 二进制沿用 uefi-pong 的 Binaries/pong；没有 zizhan 自己的 DisplayDxe，外屏不点亮。"]
next_action = ["改用原厂 FV 里的 Panel_L18_38_0c_0a_sec_dsc_cmd.xml 尝试点亮外屏。"]
evidence = [{kind = "source", reference = "docs/progress/2026-10-29-xnu-bringup.md", result = "UEFI、DarwinBoot24 交接和 XNU 早期启动的上机记录。"}]

[[area]]
id = "cpu"
status = "implemented"
components = ["PongPlatform24"]
paths = ["drivers/ArmCpu/**", "drivers/ArmDTPlatform/**", "scripts/build-pong-armcpu*", "scripts/build-pong-platform*", "patches/xnu-ipados18/0003-*", "patches/xnu-ipados18/0005-*", "patches/xnu-ipados18/0008-*", "patches/xnu-ipados18/0014-*"]
inputs = ["SM8475：4 个 Cortex-A510、3 个 Cortex-A710、1 个 Cortex-X2；GICv3；19.2 MHz 定时器；PSCI"]
configuration = ["ADT cluster-type（PONG_ADT_CLUSTERS=1），内核用 __ARM_AMP__ 构建两个 cluster", "boot-arg pong_fast_pri（默认 47）和 pong_fast_cpu（默认 7）", "ml-timeout-lock-panic-scale=40、interrupt-masked-debug-mode=1"]
procedure = ["0008 把 E/P 两个 cluster 交给 AMP 调度器；0014 让 UI 优先级线程先用空闲的 X2；0003 限制 qsort 递归深度，避免启动栈溢出。"]
findings = ["8 个 CPU 全部启动。AMP 内核如果 ADT 里没有 cluster-type，会在早期卡住（g97）。", "这个 SoC 在 Gunyah 下普通的停顿也会超过 DEVELOPMENT 内核的 500 µs 中断屏蔽阈值，所以超时按 sheng 的做法放大 40 倍，中断屏蔽检查只记录不 panic。", "SpringBoard 主线程在 app 打开卡顿时 0.73 个核跑在 A710、只有 0.09 跑在 X2（g170），0014 因此让 UI 线程先用 X2。"]
completion = ["8 核启动，滑动时 UI 线程优先落到 X2"]
limits = ["没有温控；连续多轮后手机发热，ramoops 出现大量位翻转。"]
next_action = ["接入 SM8475 的温度传感器和 CPU 调频限制。"]
evidence = [{kind = "source", reference = "docs/progress/2026-10-30-root-and-autoloop.md", result = "8 核启动（k4），E/P 调度对比和 tsample 线程采样记录。"}, {kind = "source", reference = "docs/progress/2026-11-01-120hz-and-cadence.md", result = "X2 优先调度的测量和结果。"}]

[[area]]
id = "memory"
status = "implemented"
components = ["PongPlatform24"]
paths = ["configs/pong-memory-sm8475.json", "drivers/PongAdreno/ArmSmmu4K/**"]
inputs = ["实机 DT 的 memory 和 reserved-memory 节点"]
configuration = ["dts/zizhan.dts 的 memory@80000000 和 reserved-memory"]
procedure = ["DarwinBoot24 只把实际拥有的 RAM 区间交给 XNU。"]
findings = ["XNU 打印 Pong RAM: 4 owned banks, 9728 MiB；物理内存 12 GiB，空洞不会分配给 VM。"]
completion = ["XNU 启动并打印受管内存"]
limits = ["受管容量 9728 MiB，没有用上全部物理内存。"]
next_action = ["核对 0x9_0000_0000 以上的区间能否交给 XNU。"]
evidence = [{kind = "source", reference = "docs/progress/2026-10-29-xnu-bringup.md", result = "k1 打印受管内存 9728 MiB。"}]

[[area]]
id = "storage"
status = "implemented"
components = ["PongPlatform24"]
paths = ["drivers/NativeUfs/**", "scripts/*ufs*", "scripts/*storage*", "scripts/*os-delta*", "patches/xnu-ipados18/0006-*", "tools/zizhan/phone/pinalloc.c", "tools/zizhan/mac/install_pinned.py"]
inputs = ["UFS 3.1；Android userdata 分区（f2fs）", "22H374 的 OS、SystemOS、Data 镜像（在 Mac 上用 IPSW 制作）"]
configuration = ["boot-arg pong_shngroot_4k=<4K 块号>：根镜像在 userdata 里的起始块", "pong_ufs_async=0（默认），pong_ufs_defer 默认开"]
procedure = ["install_pinned.py 用 pinalloc 在 Android /data 里分配一个物理连续的 19.4 GiB 文件 /data/hackios/root.img，写入 OS、SystemOS、Data 三个窗口，打印起始块号。", "RootLayout 按这个块号把三个窗口作为独立的 IOMedia 发布。", "0006：publishResource 发现 IOResources 还在配置中时，立即投递 matched 通知。"]
findings = ["没有修 0006 之前，大约每 4 次启动有 3 次失败（Failed to mount root device）。原因是 APFS 容器探测在 IOBSD 发布之前运行，持有 APFS 的锁去等 IOBSD，与 IOResources 配置形成死锁环（g28 用 0005 的等待线程转储抓到）。修复后 g36–g39 4/4 正常挂根。", "OS、SystemOS 和可写 Data 三个卷都能挂载，原厂 22H374 launchd 能启动。"]
completion = ["每次启动都能挂根；Data 卷的写入在下次启动后仍在"]
limits = ["根镜像在 Android 的 f2fs 文件里，Android 里不能移动或碎片整理这个文件（用一个 40 GiB 的占位文件保持连续）。"]
next_action = ["给 AppleImage4 提供软件 IOAESAccelerator，消除它在 /defaults 上的永久等待。"]
evidence = [{kind = "source", reference = "docs/progress/2026-10-30-root-and-autoloop.md", result = "根文件系统方案、挂根死锁的根因分析和 0006 修复前后的对比。"}]

[[area]]
id = "display"
status = "implemented"
components = ["PongPlatform24"]
paths = ["configs/pong-display-sm8475.json", "drivers/PongPower/PongBacklight*", "scripts/*display*", "patches/xnu-ipados18/0009-*", "patches/xnu-ipados18/0011-*", "patches/xnu-ipados18/0012-*", "patches/xnu-ipados18/0013-*"]
inputs = ["内屏 DSI-1，2160x1916，命令模式，DSC，60/120 Hz", "bootloader 留下的 cont_splash_region（0xb8000000 + 0x2b00000）"]
configuration = ["ADT display-scale 和 artwork-scale-factor = 2（1080x958 点）", "pong_panel_hz（默认 120）", "pong_dpu_flip=1、pong_dpu_bufs=2、pong_zc=2、fb_swapwait=1（内核默认值）"]
procedure = ["DSI 命令 FIFO 发出 DT 里 timing@1 的 timing-switch 命令，把面板切到 120 Hz。", "DPU 直接翻页到 CoreAnimation 自己的画布，三缓冲，不再用 GPU 拷贝。"]
findings = ["display-scale 为 3 时 1916/3 不是整数，SpringBoard 的状态栏 Auto Layout 无限递归崩溃；改成 2 后主屏正常（u3）。", "INTF_1 帧计数从 60.5/s 变为 120.2/s，翻页 latch 上限从 16.6 ms 降到 8.3 ms，合成滑动的帧率从 44.6 升到 54–55 fps。", "去掉每帧 2.5 ms 的扫描输出拷贝后，每帧都被显示，没有撕裂计数。"]
completion = ["内屏显示 iPadOS 主屏，120 Hz 下滑动帧率稳定"]
limits = ["外屏没有驱动；背光沿用 bootloader 的状态，系统里不能调节亮度。"]
next_action = ["接入面板背光的 DCS 命令，让亮度设置生效。"]
evidence = [{kind = "source", reference = "docs/evidence/2026-10-30-u3-ipados-homescreen.jpg", result = "内屏显示 iPadOS 主屏（u3）。"}, {kind = "source", reference = "docs/progress/2026-11-01-120hz-and-cadence.md", result = "120 Hz 切换和帧率测量。"}, {kind = "source", reference = "docs/progress/2026-11-01-zero-copy-and-return-paths.md", result = "DPU 翻页零拷贝三缓冲的实现和测量。"}]

[[area]]
id = "input"
status = "implemented"
components = ["PongPlatform24"]
paths = ["userland/touch.c", "drivers/NativeHidInput/**", "drivers/GoodixTouch/**", "userland/ui_compat18.c", "patches/xnu-ipados18/0002-*", "patches/xnu-ipados18/0010-*"]
inputs = ["内屏触摸 ST FTS（spi0.0 fts-pri），固件 st_fts_l18.ubin", "PMIC 电源键"]
configuration = ["boot-arg pong_touch=1，touch_flip 默认 2（y 镜像）", "电源键长按 pong_button_reset 毫秒（默认 3000）后热复位到 fastboot"]
procedure = ["0002 加入 bsd/dev/pong_fts.c：SE4 只能给 GSI 用，所以 SPI 用 GPIO 模拟。", "触摸事件走 Pong 原有的 HID 路径交给 backboardd。"]
findings = ["用触摸在主屏上打开了「设置」（t4）。", "长按电源键 3 秒能把手机从运行中的 iOS 送回 fastboot。"]
completion = ["触摸能点开应用、滑动页面"]
limits = ["外屏触摸（spi2.0 fts-sec）没有驱动；音量键没有核对。"]
next_action = ["核对音量键的 PMIC 外设地址。"]
evidence = [{kind = "source", reference = "docs/evidence/2026-10-30-t4-settings-by-touch.jpg", result = "用触摸打开了「设置」。"}, {kind = "source", reference = "docs/progress/2026-10-30-root-and-autoloop.md", result = "触摸驱动的轮次记录。"}]

[[area]]
id = "gpu"
status = "implemented"
components = ["PongPlatform24"]
paths = ["drivers/PongAdreno/**", "drivers/PongMetal/**", "patches/mesa/**", "patches/metal2vulkan/**", "scripts/*metal*", "scripts/*adreno*", "scripts/*turnip*"]
inputs = ["Adreno730v3；手机自带固件 a730_sqe.fw、gmu_gen70000.bin、a730_zap.*（不进仓库）", "Turnip 和 metal2vulkan"]
configuration = ["PONG_ADRENO_FIRMWARE 指向固件目录", "pong_gpu_level（GMU 起始档位，默认 9 = 710 MHz）", "内核默认拒绝 MercuryPosterEx 使用 GPU（pong_gpu_deny=- 恢复）"]
procedure = ["Adreno bring-up 等 rootvnode 出现后再开始；Metal provider 在挂根之后才发布。", "扫描输出按 surface 缓存映射和导入。"]
findings = ["GPU 渲染的主屏和动画已由用户照片确认。", "壁纸扩展 MercuryPosterEx 会和 backboardd 抢 GPU，基线 13 轮里有 5 轮整机 GPU 丢失；拒绝它之后 6/6 没有丢失，滑动帧率平均 54.5 fps。", "固定 900 MHz 不比 DCVS 快，GPU 频率不是瓶颈。"]
completion = ["主屏和应用由 GPU 渲染，长时间滑动没有 GPU 丢失"]
limits = ["壁纸扩展不能用 GPU；metal2vulkan 每次提交仍有约 10–20 ms 的 CPU 开销。"]
next_action = ["支持 IOSurfaceSharedEvent 监听，让壁纸扩展重新使用 GPU。"]
evidence = [{kind = "source", reference = "docs/progress/2026-10-30-root-and-autoloop.md", result = "GPU bring-up、GPU 丢失的诊断和拒绝壁纸扩展的对照实验。"}, {kind = "source", reference = "docs/progress/2026-10-31-frame-timeline.md", result = "逐帧 GPU 提交时间线。"}]


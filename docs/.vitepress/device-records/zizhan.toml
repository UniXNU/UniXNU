"g206 agreed with Android sysfs: 100%, 4444 mV, charging 426 mA, 34.40 C, full capacity 3507 mAh, design 4500 mAh and 907 cycles.", "Rename the battery service AppleSmartBattery because PerfPowerServices PLBatteryAgent and powerd health calculation select that class. Publish Serial, BatteryData and MaximumCapacityPercent. Settings Battery Health reported 78% (3483/4500 mAh).", "The health spinner follows batteryDataUnavailable: thermalmonitord never publishes com.apple.thermalmonitor.ageAwareMitigationState and powerd lacks Battery Service State.", "USB plug/unplug changes charge state and current direction (+300/-520 mA, v7).", "Settings checks MobileGestalt D6/BMDrlb8V3WSiqL8gL+w then AppleAuthCPRelay isTrustedForUI for battery authentication. This battery has no Apple authentication chip; ui_compat18.c reports the capability false, without inventing genuine-part status.", "The primary L18 panel uses real DCS reads and verified nonzero writes/restoration. CoreBrightness service publication is gated on actual readback and native class readiness; asynchronous DSI transactions retain ownership through completion and quarantine still-active failed DMA.", "POWER-02 now separates lockscreen, display-off, individual-device quiesce and platform suspend, with per-owner drain/resume/rollback contracts. Current custom owners lack a complete paired power transition chain; target-state independent return remains unknown. This is host design, not suspend/resume implementation.", "The complete POWER-02 design covers native lock/screen-off policy, runtime PM, per-CPU/context and shared-domain idle, with SYSTEM_SUSPEND as a feature-dependent alternative. Read-only Android reports freeze/mem and default s2idle, RTC wake enabled and enabled rail-pc states; no system sleep was performed. Live vendor TCS tuple order/type4 conflicts with existing sleep/active slot assumptions under the mainline binding; matching vendor ownership must be resolved before programming sleep/wake sets. Periodic workers and retained high votes are explicit work, not solved by black pixels or lower CPU frequency.", "Power inventory regression now uses a synthetic FDT rather than a private captured DTB. Seven parser cases cover resource shapes, unresolved IRQs, board identity, missing CPUs and cyclic domains; local full daily-use coverage is 67 cases. These are host-only checks, with no additional sleep/wake qualification.", "The November 9 publication retained the first Linux Daily-use CI failure: GCC rejects mixed enum/integer mock return values under -Wextra. The DSI command test now explicitly returns uint32_t/unsigned values, preserving fault/completion replay semantics; runtime drivers are unchanged."]

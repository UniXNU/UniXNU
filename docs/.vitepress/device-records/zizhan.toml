[[area]]
id = "diagnostics"
status = "implemented"
components = ["PongPlatform24"]
paths = ["migration/ipados18/**", "scripts/pong_adt_contract.py", "userland/settings_compat18.c", "userland/init.c", "porting.toml", ".github/**", "tools/**", "docs/**", "patches/xnu-ipados18/0004-*"]
inputs = ["ramoops at 0x85200000, logfs and USB adb/fastboot."]
configuration = ["pong_autoreset=<seconds> (default 300), pong_autoreset_sb.", "pong_klog_4k copies kernel logs into a fixed UFS file.", "pong_gtrace, pong_gtrace_delay, pong_gtrace_ib and touch_lat provide timed per-frame traces."]
procedure = ["cycle.sh temporarily boots, waits for watchdog fastboot return, uses RamoopsDump to write logfs, returns to Android and pulls logs.", "Panic, a three-second power-key hold and deadline reset all return to fastboot while retaining DRAM logs."]
findings = ["The loop needs no key presses. Missing pong_autoreset in g152 was mistaken for a bus freeze.", "Repeated hot trials cause bit flips in DRAM ramoops; the pong_klog_4k UFS copy avoids that corruption.", "pong_url and pong_pane open Settings; settings_compat18.c prints views/specifiers/spinners/accessibility at 6/12/20/30 seconds. settings-ui.py decodes escaped non-ASCII output.", "gs_all=2 in 0005 also samples waiting threads; gsym.py resolves complete stacks. This traced synchronous XPC to timed waiting in gethostuuid.", "pong_gtrace_delay moves capture after SpringBoard startup. Fence age separates persistent stalls from in-flight work at reset.", "USB enumeration probes have six-second limits; fastboot boot has a 180-second transfer limit and preserves failure instead of claiming boot.", "The old g268 waiter ran under user-domain launchd with heartbeats but no device enumeration; this is historical evidence.", "Failed logfs export/pull removes stale and partial local copies. Screenshot decode removes old PNGs when the new trial has none.", "Only matching current arm/successful-boot markers permit UFS klog readback; otherwise recover ramoops, preventing old pinned klog reuse.", "boot.sh checks device/image before reboot; adb reboot is bounded to 30 seconds. fastboot visibility requires a successful command.", "logfs export/pull are limited to 60/120 seconds and remove stale/partial outputs on failure.", "g272-retry through g275 completed temporary boots, deadline return and fresh UFS logs. g276 never booted after USB vanished in the fastboot transition.", "Rear USB-A passed 10/10 Android-fastboot-Android transitions without replug. After the matching companion-port action and three-second settle, a 100168 KB image transferred and booted once.", "The host replay uses -iquote so Darwin shim headers do not shadow glibc linux/errno.h. Record CI now uses the reviewed e67a79eb64012e8f30ba04c56ea37753bdb720a2 checker and compares committed paths against the push-before or PR-base SHA, in addition to structural validation. All matched owner areas must update findings/evidence. A separate Ubuntu/clang job replays the existing SMMU, WMI, DHCP and USB regressions against pinned Ath12kWifi headers without private inputs.", "g301-g303 stack sampling separated SpringBoard wifi_manager_open, wifid SystemConfiguration quiet waiting and normal configd run loops. The optional bounded Settings probe selects only the exact private SSID, uses native secure-text and Join handlers, logs no credentials and requires independent association/HTTPS evidence. UISwitch dumps report actual on/enabled state.", "Optional read-only Wi-Fi progress diagnostics and kernel thread sampling distinguished an executing dispatcher stall from a sleeping waiter. The actual timer-pass regression now reproduces the original nested-removal hang and validates the generated fix; g341 native UI actions are accepted only alongside independent DHCP transactions, HTTPS and cleanup evidence.", "Default and radio-off package paths were run with the system bash, including unset PROFILE/WIFI; no empty-array nounset failure remains. Device evidence is collected from an actual default package with automatic return.", "New display host regression checks actual brightness-helper initialization/forwarding and concurrent DSI ownership without hardware. Frame-latency analysis reports retained matches and sample counts; failed hypotheses and genuine shared-cache ENOMEM panic remain evidence, not success.", "BOOT-01 adds failure-path kernel_map total/free/largest-space diagnostics only; both reduced CI and full default kernels built successfully. g393 reached the autoreset deadline, returned fresh klog and Android, but did not reproduce the CS4K allocation failure; no root cause or repair is claimed.", "Daily-use host regressions cover thermal input errors/units/FDT references, preserved partial captures, local service-policy drift and actual catalog generation. Android captures use bounded non-PTY shell stdin; raw data stays outside the public repository. Daily-use host workflow is included in the 11-07 publication; cloud results are recorded separately from local checks. Its first cloud run failed because power-inventory tests required a private local DTB. A synthetic FDT now supplies the same parser shapes without private inputs, with foreign-board, missing-CPU and domain-cycle rejection controls; isolated replay and all 67 local daily-use tests pass. See docs/progress/2026-11-07-publication.md for exact-SHA CI results.", "11-07 daily-use host runner passes 34 cases, including exhaustive TSENS signed/invalid decoding under sanitizers, gated finite reads, identity-ranges evidence, ADT resources and actual BOOT-01 patch roundtrip/negative control. g395 temperature SKIP and the changed g396 32-sensor PASS are separately retained. g396 original supervisor FAIL at cycle rc0 was caused by an immediate Android-completion check; a bounded follow-up witnessed boot_completed=1 46.224 seconds later. The original result is not overwritten.", "Post-g396 cycle.sh now preserves logs then requires a bounded Android-ready witness (target product and boot_completed=1), instead of equating ADB visibility with framework readiness. Six mock race/timeout/identity cases and a current-device read-only invocation pass; final daily-use host count is 40. The later g397 query-only cycle passed the integrated bounded Android-completion witness; g396 original supervisor FAIL is retained.", "POWER-02 research reviewed native XNU, 18 fixed Linux primary files, saved live FDT and bounded Android read-only interface/CPU inventory. An initial stdin transfer timed out and is recorded as input failure; narrow direct reads succeeded. No suspend/alarm/cpuidle write, reboot or kernel rebuild was requested. Acceptance requires functional recovery, real device/SoC residency and matched energy measurements; original unsolved hardware limits remain visible.", "The November 9 direct-fastboot Weather trial retained both the empty 167-byte ramoops and a fresh 2111718-byte pinned deadline copy. Native Location Services URL navigation was accepted and Preferences spawned; the black image was captured on the first frame because the hardware absolute clock was already 579 seconds, beyond pong_shot=150. This is early capture, not proof of Settings rendering failure.", "The November 9 publication retained the first Linux Daily-use CI failure: GCC rejects mixed enum/integer mock return values under -Wextra. The DSI command test now explicitly returns uint32_t/unsigned values, preserving fault/completion replay semantics; runtime drivers are unchanged."]
completion = ["Every trial automatically returns to Android and yields fresh complete logs."]
limits = ["pong_shot currently compares a requested second count with the hardware absolute clock rather than a per-boot relative origin. A long fastboot stay can trigger it on the first frame, before requested UI content. A second frame-relative interval is prepared as a diagnostic compensation; it has not yet been device-verified. The same trial failed all Wi-Fi DMA arena budgets, so it cannot qualify Weather networking.", "Direct USB-C can still fail enumeration and lacks supported host-port probing. Rear USB-A is the verified path. Port-state bits do not prove VBUS power-off; prefer current-trial UFS klog over corrupt ramoops."]
next_action = ["Use rear USB-A for unattended trials; retry only once for an explicit USB write failure during transfer. Follow the actually triggered checks at the published SHA; run cloud kernel builds manually for staged releases or toolchain/build changes while retaining both local kernel configurations. BOOT-01 awaits a naturally occurring CS4K allocation failure to collect map free-space diagnostics; do not manufacture memory exhaustion or repeat g393 unchanged."]

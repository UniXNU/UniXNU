[[area]]
id = "diagnostics"
status = "implemented"
components = ["PongPlatform24"]
paths = ["migration/ipados18/**", "scripts/pong_adt_contract.py", "userland/settings_compat18.c", "userland/init.c", "porting.toml", ".github/**", "tools/**", "docs/**", "patches/xnu-ipados18/0004-*"]
inputs = ["ramoops at 0x85200000, logfs and USB adb/fastboot."]
configuration = ["pong_autoreset=<seconds> (default 300), pong_autoreset_sb.", "pong_klog_4k copies kernel logs into a fixed UFS file.", "pong_gtrace, pong_gtrace_delay, pong_gtrace_ib and touch_lat provide timed per-frame traces."]
procedure = ["cycle.sh temporarily boots, waits for watchdog fastboot return, uses RamoopsDump to write logfs, returns to Android and pulls logs.", "Panic, a three-second power-key hold and deadline reset all return to fastboot while retaining DRAM logs."]
findings = ["The loop needs no key presses. Missing pong_autoreset in g152 was mistaken for a bus freeze.", "Repeated hot trials cause bit flips in DRAM ramoops; the pong_klog_4k UFS copy avoids that corruption.", "pong_url and pong_pane open Settings; settings_compat18.c prints views/specifiers/spinners/accessibility at 6/12/20/30 seconds. settings-ui.py decodes escaped non-ASCII output.", "gs_all=2 in 0005 also samples waiting threads; gsym.py resolves complete stacks. This traced synchronous XPC to timed waiting in gethostuuid.", "pong_gtrace_delay moves capture after SpringBoard startup. Fence age separates persistent stalls from in-flight work at reset.", "USB enumeration probes have six-second limits; fastboot boot has a 180-second transfer limit and preserves failure instead of claiming boot.", "The old g268 waiter ran under user-domain launchd with heartbeats but no device enumeration; this is historical evidence.", "Failed logfs export/pull removes stale and partial local copies. Screenshot decode removes old PNGs when the new trial has none.", "Only matching current arm/successful-boot markers permit UFS klog readback; otherwise recover ramoops, preventing old pinned klog reuse.", "boot.sh checks device/image before reboot; adb reboot is bounded to 30 seconds. fastboot visibility requires a successful command.", "logfs export/pull are limited to 60/120 seconds and remove stale/partial outputs on failure.", "g272-retry through g275 completed temporary boots, deadline return and fresh UFS logs. g276 never booted after USB vanished in the fastboot transition.", "Rear USB-A passed 10/10 Android-fastboot-Android transitions without replug. After the matching companion-port action and three-second settle, a 100168 KB image transferred and booted once.", "The host replay uses -iquote so Darwin shim headers do not shadow glibc linux/errno.h. Record CI now uses the reviewed e67a79eb64012e8f30ba04c56ea37753bdb720a2 checker and compares committed paths against the push-before or PR-base SHA, in addition to structural validation. All matched owner areas must update findings/evidence. A separate Ubuntu/clang job replays the existing SMMU, WMI, DHCP and USB regressions against pinned Ath12kWifi headers without private inputs.", "g301-g303 stack sampling separated SpringBoard wifi_manager_open, wifid SystemConfiguration quiet waiting and normal configd run loops. The optional bounded Settings probe selects only the exact private SSID, uses native secure-text and Join handlers, logs no credentials and requires independent association/HTTPS evidence. UISwitch dumps report actual on/enabled state.", "Optional read-only Wi-Fi progress diagnostics and kernel thread sampling distinguished an executing dispatcher stall from a sleeping waiter. The actual timer-pass regression now reproduces the original nested-removal hang and validates the generated fix; g341 native UI actions are accepted only alongside independent DHCP transactions, HTTPS and cleanup evidence.", "Default and radio-off package paths were run with the system bash, including unset PROFILE/WIFI; no empty-array nounset failure remains. Device evidence is collected from an actual default package with automatic return."]
completion = ["Every trial automatically returns to Android and yields fresh complete logs."]
limits = ["Direct USB-C can still fail enumeration and lacks supported host-port probing. Rear USB-A is the verified path. Port-state bits do not prove VBUS power-off; prefer current-trial UFS klog over corrupt ramoops."]
next_action = ["Use rear USB-A for unattended trials; retry only once for an explicit USB write failure during transfer. Follow both record and kernel CI at the published SHA."]
evidence = [
  {kind = "device", command = "cycle.sh out/g344-default-combined/pong-xnu-initial.img g344-default-combined 480", revision = "cc016a5c44c1ed074e98ea7c1104c1e5cbdff88f", reference = "docs/evidence/2026-11-05-default-gpu-wifi.txt", result = "Combined device defaults without DEFCONFIG/PROFILE/WIFI overrides passed native automatic association, keys, DHCP and HTTPS 200. Zero link loss or canvas-mapping errors; three complete Settings screenshots, deadline return and fresh UFS log."},
  {kind = "host", command = "ci_kernel.sh default and explicit CI; ci_boot_ufs.sh default/WIFI=0/explicit CI; check-wifi-host.py", revision = "cc016a5c44c1ed074e98ea7c1104c1e5cbdff88f", reference = "docs/evidence/2026-11-05-default-gpu-wifi.txt", result = "Default and radio-off package paths were run with the system bash, including unset PROFILE/WIFI; no empty-array nounset failure remains. Device evidence is collected from an actual default package with automatic return."},
  {kind = "host", command = "check-wifi-host.py --shared Ath12kWifi", revision = "959b00b1b81186c40b75b16a1c27c512062a2e1a", reference = "docs/evidence/2026-11-05-wifi-lifecycle.txt", result = "Actual original/adapted timer traversal replay plus notification FIFO, SMMU, WMI, DHCP, staging and USB regressions passed; no phone or private input needed."},
  {kind = "device", command = "cycle.sh g339-kernel-sample, g340-progress-watch, g341-timer-reentry; decode-shots.sh", revision = "959b00b1b81186c40b75b16a1c27c512062a2e1a", reference = "docs/evidence/2026-11-05-wifi-lifecycle.txt", result = "Busy worker and unchanged progress generation localized the failed control; fixed kernel completed native off/on, independent DHCP/HTTPS/cleanup, full screenshots and deadline return with a fresh UFS log."},

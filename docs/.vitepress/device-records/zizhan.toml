findings = ["At scale 3, 1916/3 is fractional and SpringBoard status-bar Auto Layout recurses until crash; scale 2 reaches Home Screen (u3).", "INTF_1 counters changed from 60.5/s to 120.2/s and latch ceiling from 16.6 to 8.3 ms. The early synthetic workload improved from 44.6 to 54-55 fps; later display-link measurements are in gpu.", "Removing the 2.5 ms per-frame scanout copy presented every submitted frame without counted tears.", "Pre-create and retain cached mappings for actual reserved panel slots, then lease bounded subdescriptors to canvases; failed reservations are not offered. DSI timing and asynchronous brightness share an owner lease. Real read/write/readback and native Settings slider targets 512/1331/1024 passed; no photometry is invented.", "POWER-02's immediate deliverable is the native request-to-inner-panel-off/wake-to-visible-first-frame slice; CPU deep idle and unrelated device runtime PM are later increments. MiniIOMobileFramebuffer RequestPowerChange still has no hardware transaction. The public IOGraphics power enum is Off=0, MinUsable=1, On=2; one prior device observation saw only scalar=1, so the off/on request and completion ABI remain unqualified.", "A bounded DSI command DMA path now consumes one dedicated DarwinBoot24 low-address page, requires a fresh fixed display group/context snapshot with identity mode before each long packet, and restores controller registers only after DMA completion and idle. Host replay and builds pass; no long packet or panel transition has run on device."]

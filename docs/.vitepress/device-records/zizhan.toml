  {kind = "host", command = "check-wifi-host.py; compile/sign native UI and wifi-service18; actual OS delta manifest/hash preflight and readback", revision = "92ef6d2de5419ce5c5aa8bfe36ab25a9fadeffb7", reference = "docs/evidence/2026-11-04-wifi-settings-and-roaming.txt", result = "Root and overlay staging passed with preserved stock metadata and wifid services. UI/helper built and signed; OS-only device deltas were checked before and after writing."},
  {kind = "source", reference = "docs/progress/2026-10-29-xnu-bringup.md", result = "Build-chain description."},
  {kind = "host", command = "ZIZHAN_SRC=<work dir> ci_prep.sh && DEFCONFIG=zizhan_ipados18_gpu_defconfig JOBS=10 ci_kernel.sh", revision = "1ec1190f4e3467a36a7a7402bc766dfdf688adf1", reference = "docs/evidence/host-build-zizhan_ipados18_gpu.txt", result = "A clean Apple-silicon Mac Studio build (Xcode 26.6.0) produced an 18321080-byte DEVELOPMENT_ARM64_PONG kernel with the same zizhan boot-argument strings as device trials."},
  {kind = "source", reference = "docs/progress/2026-11-02-gpu-astc-and-fairplayd.md", result = "Installed-image fairplayd restoration is distinguished from EXCLUDED18 full-rebuild policy; no additional device-verified status."},

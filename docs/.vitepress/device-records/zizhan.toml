procedure = ["ci_prep.sh prepares dependencies; ci_kernel.sh builds; ci_boot_ufs.sh prelinks and creates the boot image.", "build-xnu-ipados18.sh uses patch --forward in series order to avoid reversing already-applied hunks."]
findings = ["After the series is applied, clean xnu-11417.140.69 matches the actual build tree file by file.", "Disable three newer-clang warnings under -Werror; support both Intel and arm64 macOS hosts.", "ADT /chosen requires unique-chip-id and chip-id. Without IOPlatformUUID, gethostuuid blocks and timed/locationd/contextstored/PowerUIAgent lead to a frozen Battery page. build-ipados18-bootimg-local.py supplies a software seed, not an Apple hardware identity.", "fairplayd.A2 exits immediately in this port; launchd KeepAlive retains its port and queued requests have no response. EXCLUDED18 removes it on a full rebuild.", "The packer enforces 1020 command-line bytes. Omit default pong_ui_software=0, pong_software_ui=0 and pong_ram_banks=1 to save about 54 bytes.", "ADT /product udid-version=1 requires SerialNumber, ECID, WifiAddress and BluetoothAddress; disabled Wi-Fi stalls MobileGestalt and Settings ISDefaults. With a /chosen seed, use the stock iPhone17,1 version 2 (ChipID-ECID); first Settings screen fell from 6.4 to 1.2 seconds.", "On November 2, fairplayd was restored from pre-g213 OS for Weather diagnosis. g245 recorded 2560 frames, 2453 moving at 72.0 fps and no failed lookups, but respawn persisted. EXCLUDED18 still removes it on full rebuild.", "Read-only inspection found fairplayd cache/plist in current OS and g213, absent in f245. Kernel builds do not change that installed service state; use the same kernel and B1-A-B2 ordering for a device control.", "g279 installed a signed native DHCP helper/job into the 22H374 OS after old-window/block prechecks, then read back blocks against the manifest. The phone launched the service.", "The November 4 compliance audit found that the existing local and macOS build pipelines had not adopted the latest upstream package interface. This round adds the upstream package.sh template and the 22H374 defconfig mapping; template parity and TOML mapping pass.", "The release command is absent from the current local UniXNU checkout (0fc0fc1). The available release implementation (e67a79e) has no 22H374 profile, and its generic build/pack steps do not select the device's Darwin24 prelink and UFS image scripts; --check therefore cannot pass and a full package workflow is not yet valid.", "Full 22H374 preparation copies stock InterfaceNamer bundle metadata into the overlay with its documented native 30/10-second fallback. The signed UI helper is opt-in; tests use local-only credential files, verified OS delta preflights and readbacks. No fake dynamic-store Quiet state is injected.", "Local build and package defaults select the combined device profile. Runtime GPU/Wi-Fi enablement follows the kernel report; explicit overrides produce a single value per key. Reduced cloud CI remains explicitly selected.", "Panel parameters are selected from the zizhan display JSON. New patches retain bounded VM/signature-cache failure stages without bypassing genuine failures. The power archive receives the actual GPU macro so CPU-only CI and full kernels coordinate the correct DSI owner.", "BASE-01 now records explicit 22H374 service policy and policy hash in build plans/job reports; refresh_jobs inherits a recorded policy and the legacy default still excludes fairplayd. Isolated stage_jobs catalogs from matching stock inputs differ only by fairplayd presence. A local APFS/overlay/runtime audit reports the default rebuild mismatch; no complete image rebuild or device behavior is qualified by catalog staging.", "Fixed three missing unified-diff context prefixes in the uncommitted BOOT-01 patch0019; generated C is unchanged. Forward/reverse replay and corrupted-format control pass, as do reduced and repeated full kernel builds. The packaged g395 ADT TSENS bytes match reviewed board JSON; no OS installation occurred.", "On November 8, an isolated OS370 clone removing only the fairplayd launchd job was installed with full-window readback. With the same kernel/loader/UI/helper, v23r5 removed the captured locationd MIG1203 stall, restored its main run loop, and started weatherd on demand; a location-settings prompt was observed by the user and in the partial screenshot. Weather remained --; no permission grant, GPS fix, or weather data success was demonstrated."]
completion = ["Build a bootable image reproducibly from a published device revision and record host and device results separately."]
limits = ["Apple images, firmware and ABI binaries are prepared locally.", "The generic job-restore.sh had static checking only. The installed diagnostic candidate now follows the default fairplayd exclusion, while canonical OS370 still retains the job. The first same-runtime exclusion trial unblocked locationd; no B1-A-B2 re-add control or default promotion has completed.", "scripts/package.sh now matches the upstream template and board.toml maps 22H374 to the GPU defconfig, but package.yml is not present and upstream release cannot select this Darwin24 profile or its UFS-specific build chain. Current CI builds the reduced kernel by default, not a clean end-to-end release or a full Wi-Fi/GPU image."]
next_action = ["Add a supported configuration-driven Darwin24 kernel/prelink/payload/boot recipe to the upstream release interface; then validate 22H374 --check, wire local UEFI/Apple inputs and package.yml, and complete a full local package before claiming adoption.", "Inspect native Location Services state and the remaining weatherd/fairplay dependencies without granting permissions or fabricating replies; retain the same-runtime re-add control and Battery regression before any default promotion."]

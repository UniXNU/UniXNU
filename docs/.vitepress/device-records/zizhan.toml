[[area]]
id = "firmware"
status = "implemented"
components = ["PongPlatform24"]
paths = ["drivers/DarwinBoot24/**", "scripts/build-darwinboot24*"]
inputs = ["uefi-zizhan: uefi-pong plus Platforms/Xiaomi/zizhanPkg.", "Stock uefi_b uefiplat.cfg memory map."]
configuration = ["PIL Reserved size=0x1DC00000; remove Demura and QTEE.", "SimpleFbDxe: framebuffer=0xb8000000, 2160x1916, inherited cont_splash_region.", "Temporary fastboot boot only; do not flash partitions."]
procedure = ["build_fw.sh builds the zizhanPkg FD with EDK II; build_bootimg.py combines BootShim, FD and the device DTB into boot v4.", "DarwinBoot24 reads the UniXNU menu and arms pong_autoreset before XNU handoff.", "ci_boot_ufs.sh rejects command lines above its 1020-byte limit; DarwinBoot24 requires fewer than 1024 bytes."]
findings = ["The inner panel shows the Silicium logo and UniXNU menu with correct color and orientation; DarwinBoot24 hands off to XNU.", "On refusal, DarwinBoot24 appends the reason to logfs:\\BOOTFAIL.TXT, retries, then returns to fastboot.", "A Wi-Fi kernel with larger embedded firmware occupied the temporary low-memory ReadFile buffer while the loader requested scanout pages. Free copied kernel/ADT inputs before reserving the optional 96 MiB pool. g299/g300 used the same kernel with radio disabled; the changed loader restored the real pool and complete screenshots.", "The zizhan DarwinBoot24 panel pool reservation is 128 MiB below 4 GiB, leaving five canvas slots with the default two display buffers. v6 and subsequent ordinary-display trials exercised this loader; this does not qualify DSI power-off or sleep."]
completion = ["Temporary boot reaches the menu and XNU; failures retain an automatic return path."]
limits = ["Qualcomm DXE binaries still come from uefi-pong Binaries/pong. There is no zizhan DisplayDxe and the outer panel stays off."]
next_action = ["Audit the stock FV Panel_L18_38_0c_0a_sec_dsc_cmd.xml before attempting outer-panel support."]
evidence = [
  {kind = "source", reference = "docs/progress/2026-11-08-panelpool-128.md", result = "Publication ownership reconciliation for the cumulative 11-08/09 firmware change; host and device evidence remain separated, with runtime limits retained."},
  {kind = "device", command = "cycle.sh g299-wifi-kernel-radio-off; cycle.sh g300-loader-radio-off", revision = "03363797d9ffb10fd35ad5823331e89b4bb3c624", reference = "docs/evidence/2026-11-04-wifi-settings-and-roaming.txt", result = "Loader-only comparison changed no-pool fallback into a real 96 MiB zero-copy pool and full sampled screenshot."},
  {kind = "source", reference = "docs/progress/2026-10-29-xnu-bringup.md", result = "Device record of UEFI, DarwinBoot24 handoff and early XNU boot."},
]

[[area]]
id = "cpu"
status = "implemented"
components = ["PongPlatform24"]
paths = ["drivers/ArmCpu/**", "drivers/ArmDTPlatform/**", "scripts/build-pong-armcpu*", "scripts/build-pong-platform*", "patches/xnu-ipados18/0003-*", "patches/xnu-ipados18/0005-*", "patches/xnu-ipados18/0008-*", "patches/xnu-ipados18/0014-*", "configs/zizhan-thermal-sm8475.json", "scripts/zizhan_tsens_inputs.py"]
inputs = ["SM8475: four Cortex-A510, three Cortex-A710, one Cortex-X2; GICv3, 19.2 MHz timer and PSCI."]
configuration = ["ADT cluster-type is required with PONG_ADT_CLUSTERS=1; build two clusters with __ARM_AMP__.", "pong_fast_pri=47 and pong_fast_cpu=7 by default.", "ml-timeout-lock-panic-scale=40; interrupt-masked-debug-mode=1."]
procedure = ["0008 exposes E/P clusters to AMP, 0014 prefers an idle X2 for UI-priority threads, and 0003 bounds qsort recursion to avoid early stack overflow."]
findings = ["All eight CPUs start. An AMP kernel without ADT cluster-type stalls early (g97).", "Under Gunyah, ordinary pauses can exceed the DEVELOPMENT 500 us interrupt-masking threshold. Following sheng, scale timeouts by 40 and log masking violations; preserve genuine fatal panic handling.", "In g170, a stalled app-opening workload used 0.73 CPU on A710 and 0.09 on X2 for the SpringBoard main thread; 0014 gives UI work X2 preference.", "Read-only Android inventory found 81 thermal zones, 62 cooling devices and three CPU frequency policies; four temperature reads failed and remain explicit errors. Live FDT identifies two TSENS-v2 providers and confirms the current three EPSS/PDMEM domain addresses. These are input observations, not XNU thermal control.", "THERM-01 default-off one-shot TSENS-v2 observation is qualified in g396: two 2.8 banks, 32 unique VALID last-temperature words, independently checked signed deciC decoding and 35.5-46.9 C range. g395 temperature SKIP is retained; its extra TRDY gate was removed according to the actual v2 getter. This proves a bounded register observation, not update freshness, calibration, continuous monitoring or thermal control.", "POWER-02 source review found that ArmCpu halt directly affects the executing CPU, while the native XNU sleep coordinator calls halt on CPU objects; correct target-CPU shutdown/idle continuation and boot-CPU resume are prerequisites. Live DT has rail-pc and shared l3-off/llcc-off states with local-timer-stop; declared parameters and Android cumulative idle counts are inputs, not XNU suspend qualification. Scheduling, EPSS and physical PSCI-domain topologies must remain distinct."]
completion = ["Start eight cores and place UI threads on X2 when available."]
limits = ["No thermal control. Repeated trials heat the phone and can corrupt DRAM ramoops logs."]
next_action = ["Design bounded multi-time sampling, update/age/error semantics and cross-system sensor mapping checks before any continuous temperature service or policy. Vendor normal/map policies are not readable as plaintext in this audit; do not adopt DT high-temperature trips or Android scaling maxima as the XNU thermal policy."]
evidence = [
  {kind = "source", reference = "docs/progress/2026-11-07-power-unattended.md", result = "POWER-02 candidate corrects the Darwin24 remote haltCPU/local quiesceCPU contract. Host builds and normal ADSP trial do not qualify CPU suspend, context restore or target-state wake."},
  {kind = "source", reference = "docs/plan/2026-11-07-lockscreen-suspend-design.md", result = "POWER-02 complete design and read-only audit only; runtime code, kernel/image, OS installation and sleep qualification unchanged."},
  {kind = "source", reference = "docs/evidence/2026-11-07-tsens-readonly.txt", result = "Sanitized two-bank version/control and 32 raw VALID words with decoded temperatures, source dirty-snapshot and actual kernel/image identity. One-shot read-only scope; no freshness or thermal-policy claim."},
  {kind = "source", reference = "docs/progress/2026-11-07-tsens-readonly.md", result = "Uncommitted candidate: full/reduced builds and 34 host cases PASS; g395 temperature SKIP, g396 32 VALID observations PASS. Original supervisor FAIL remains preserved; Android completion was independently witnessed 46.224 seconds later within a 120-second window."},
  {kind = "source", reference = "docs/progress/2026-11-06-daily-use-development.md", result = "Android-only bounded read-only inventory, explicit error handling, reproducible board-input generation and host replay. No new XNU MMIO or thermal-policy qualification."},
  {kind = "source", reference = "docs/progress/2026-10-30-root-and-autoloop.md", result = "Eight-core boot (k4), E/P scheduling comparison and tsample thread records."},
  {kind = "source", reference = "docs/progress/2026-11-01-120hz-and-cadence.md", result = "X2 preference and cadence measurements."},
]


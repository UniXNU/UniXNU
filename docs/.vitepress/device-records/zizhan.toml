findings = ["User photos confirm GPU-rendered Home Screen and animations.", "MercuryPosterEx competes with backboardd: 5/13 baseline trials lost the GPU. Denying it yielded 6/6 without loss and an early mean scrolling rate of 54.5 fps.", "Fixed 900 MHz did not outperform DCVS; GPU clock was not the limiting factor.", "A ledger-killed GPU client (SBRendererService on Battery) freed BO pages with user mappings alive, causing pmap_assert_free. PongAdrenoClient::dropViews now unmaps/releases mappings; NativeAdrenoMemory::release calls pmap_disconnect per page before returning pages to VM.", "After ASTC layout fixes, g248/g249 opened Weather with DeviceSupportsASTC=1; six segmented images per run had 135/135 columns across the screen. g251 Clock and g252 Settings also had complete app images.", "g253/g254 completed 592/592 and 403/403 GPU submissions. A one-submit deadline difference was backboardd work issued 26 ms before reset, not persistent fence blockage.", "Tungsten called PXCreateContext with 0x0, triggering Photos assertions. A Photos-only hook clamps zero axes to 1; g262/g263 and final-kernel g264 reached Photos with ASTC both off and on.", "g296 observed UIKit.InProcessAnimationManager; the old UIViewInProcessAnimationManager-only hook missed it. g298 matched the actual class, filtered 121 requests and reached 95.3 moving fps versus 56.7-58.4 baseline. Trace presentation gaps p50/p90 improved from about 16.6/33.3 to 8.3/16.6 ms.", "Cold-start and late-allocation controls distinguish actual cached-map reuse from ordinary allocation. The rare g342 display failure remains unqualified, and wait-time snapshots are now distinguished from live completion. Main-screen idle first frame remains about 80 ms; the early CA flush candidate regressed to about 302 ms and was removed rather than enabled."]
completion = ["Render Home Screen and apps through the GPU without GPU loss during sustained scrolling."]
limits = ["Wallpaper extensions cannot use the GPU; metal2vulkan still spends about 10-20 ms CPU time per submission.", "Sampled screenshots verified Home Screen, Weather, Clock, Settings and Photos after ASTC fixes. Multitasking, touch animations and Photos album/search/edit paths need manual checks; ASTC remains off by default. Stuck-copy and poison detection remain enabled for previously observed GPU losses.", "Photos launch and album landing page are verified; grid, search, edit and image viewing after first-use prompts need manual interaction. IOSurfaceSharedEvent listeners are still missing.", "g298 improves the synthetic animation tail; first frame after idle remains about 75-80 ms. g363 measured 79.76 ms median and a controlled early-flush candidate regressed to 301.68 ms, so it was removed. This is not a global 120 fps or resolved first-frame claim.", "g342 had failed canvas mappings and an old wait snapshot that appeared one fence behind. That snapshot is not the live CP timestamp; revised summaries read actual completion separately. Early slot mappings remove late physical pager recreation, but the rare display failure was not reproduced under control; do not claim every GPU hang fixed."]
next_action = ["Implement IOSurfaceSharedEvent listeners before restoring dependent services and wallpaper GPU access.", "Use retained HID/gesture/swap/panel segments to investigate the remaining main-screen front-end delay; native Settings scroll samples were substantially faster. Preserve the rejected early-flush control and qualify fairplayd/wallpaper independently."]
evidence = [
  {kind = "source", reference = "docs/progress/2026-11-07-power-unattended.md", result = "POWER-02 scanout candidate keeps the existing timing control as default and adds opt-in packet-type-preserving FIFO execution. Software presenter drain does not acknowledge GPU/DPU latch or release live surfaces for power collapse."},
  {kind = "device", command = "cycle.sh g374-live-fence-control, g375-live-60hz; clean prepared-state promotion", revision = "9d7afd134e56d14dcdd2d0862f3a18f49427b49a", reference = "docs/evidence/2026-11-05-display-and-backlight.txt", result = "Normal 120/60 Hz trials returned complete screenshots and HTTPS200 with direct CP completion763/763 and665/665. Older wait snapshots do not prove hangs. Actual clean OS/UI/helper and manifest were verified and promoted with retained rollback artifacts, without further phone writes."},
  {kind = "device", command = "cycle.sh g372-stall-watch, g374-live-fence-control", revision = "9d7afd134e56d14dcdd2d0862f3a18f49427b49a", reference = "docs/evidence/2026-11-05-display-and-backlight.txt", result = "Legacy wait snapshot 763/762 differed from direct CP completion763/763 at deadline, with original ring protocol unchanged. Corrected report distinguishes old waits from live hardware completion; three complete screenshots and HTTPS passed, no actual stale-fence watch fired."},
  {kind = "device", command = "cycle.sh g345, g346, g347, g348, g363, g365, g368; frame-latency.py", revision = "88e5106dca99c03b9be1af02ceae5b041480a83d", reference = "docs/evidence/2026-11-05-display-and-backlight.txt", result = "Persistent panel mappings were reused on real canvases. Rare g342 display failure was not reproduced; old wait snapshots alone do not prove a hardware stall. Idle first panel median79.76ms; early flush regressed301.68ms and was removed. Healthy trace/deadline work is distinguished from long fence stalls."},
  {kind = "device", command = "cycle.sh g296-gpu-default, g297-gpu-native; replace UI library and reuse g296 image for g298-gpu-fixed", revision = "42629e5d8d86ead5c4b57d752e3b3187e702ed6f", reference = "docs/evidence/2026-11-04-g298-displaylink.txt", result = "Matching the real UIKit animation class activated filtering; moving fps 56.7-58.4 to 95.3. All trace submissions completed, zero lost events. Animation tail improved; first frame did not. All three trials returned to Android."},
  {kind = "source", reference = "docs/progress/2026-10-30-root-and-autoloop.md", result = "GPU bring-up, GPU-loss diagnosis and wallpaper-denial controls."},
  {kind = "source", reference = "docs/progress/2026-10-31-frame-timeline.md", result = "Per-frame GPU submission timeline."},
  {kind = "host", command = "metal-refresh.sh astc-final (bridge/plugin build)", revision = "e3be89264924267a610e472e559c9d4d8a66b803", reference = "docs/progress/2026-11-02-astc-layout.md", result = "Final Metal bridge/plugin builds passed; ASTC format numbers checked against the iPhoneOS SDK."},
  {kind = "device", command = "round.sh g247 pong_touch_synth=3 tsa=1118 touch_lat=1 pong_shot=60 pong_shot_ms=1000 pong_astc=1", revision = "e3be89264924267a610e472e559c9d4d8a66b803", reference = "docs/progress/2026-11-02-astc-layout.md", result = "ASTC=1: Weather appeared in the left region of three old-format screenshots; automatic Android return. Right-side data was missing."},
  {kind = "device", command = "metal-refresh.sh watermark; cycle.sh g249", revision = "c9c8fd274c279a8571b525a1e1dbdf8eddf84d9d", reference = "docs/progress/2026-11-02-shot-and-watermark.md", result = "With the watermark bridge and ASTC=1, Weather started and all six Home/Weather images were complete; automatic Android return. Fence-stall diagnosis remained open at that point."},
  {kind = "device", command = "cycle.sh g250–g252", revision = "caa3a06b6b809be46146fc890995b16d51c8a99c", reference = "docs/progress/2026-11-02-shot-and-watermark.md", result = "Clock and Settings started with complete screenshots. Photos repeatedly exited with PXPixelSizeAreaIsZero. Each trial returned to Android."},
  {kind = "device", command = "cycle.sh g253, g254; pong_gtrace_delay, pong_gtrace, pong_gtrace_ib", revision = "a0eb276866aee06a31189f182335760d5a39d4a9", reference = "docs/progress/2026-11-02-fence-diagnostics.md", result = "Both traces had no lost events; all submissions completed and zero-copy fences did not time out. Deadline fence was normal work issued 26 ms before reset."},
  {kind = "source", reference = "docs/progress/2026-11-02-gpu-astc-and-fairplayd.md", result = "Historical ASTC follow-ups, installed fairplayd state and unverified display-link WIP."},
  {kind = "device", command = "cycle.sh g262-g264; pong_astc=0/1; Photos PXCreateContext hook", revision = "1ebf568205630bc5fa25737ae95392d2908f0e8a", reference = "docs/progress/2026-11-03-photos-context.md", result = "The hook clamps Tungsten 0x0 to 1x1; Photos stopped hitting the zero-size assertion. Final ASTC=1 trial stayed running and returned to Android."},
  {kind = "host", command = "Read-only prepared OS/UI inspection; build/sign UI library and Metal bridge/plugin; CI/GPU kernel builds; ui-refresh.sh no-device preflight", revision = "103d97f1ecc7c874429ae1003d29c4a45c4eb383", reference = "docs/progress/2026-11-03-displaylink-host.md", result = "Prepared image contained the hook; UI, bridge/plugin and CI/GPU builds passed. With no device the refresh script left the image untouched. No new device fps or screenshots."},
  {kind = "source", reference = "docs/progress/2026-11-06-overnight.md", result = "Earlier clock-only image interpretations were withdrawn: all 16 original captures match the raw pixel records and macOS independently decodes complete static home content. g380/g381 add bounded normal-boot coverage without resolving the rare g342 cause. Temporary shot diagnostics and presentation candidates were removed from maintained source; no graphics fix is claimed. A genuine CS4K allocation panic remains a separate boot limitation."},

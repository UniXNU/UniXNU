schema_version = 1

[device]
name = "zizhan"
soc = "SM8475"
os_profile = "ipados-18.7.10-22H374"
summary = "Xiaomi MIX Fold 2: iPadOS 18.7.10 inner display, touch, Adreno 730 rendering and battery readings, derived from UniXNU-pong. A 120 Hz panel and 95.3 moving fps in one synthetic workload; experimental Wi-Fi HTTPS works, Settings join and cross-band reconnect remain unresolved."

[[area]]
id = "configuration"
status = "host-verified"
components = ["PongPlatform24"]
paths = ["board.toml", "proprietary-files.txt", "feeds.toml", "unixnu.lock", "configs/**", "dts/**", "migration/format2/**", "scripts/*format2*", "scripts/build-pong-profile-kernel.py"]
inputs = ["zizhan (22061218C) live /sys/firmware/fdt; MIUI V14.0.15.0.TLRCNXM, Android 13, kernel 5.10.136.", "SM8475 shared support and PongPlatform24 from UniXNU-pong (Nothing Phone (2)).", "iPad7,11 iPadOS 18.7.10 / 22H374 restore."]
configuration = ["board.toml: name=zizhan; device_tree.source=device:dts/zizhan.dts; kernel.defconfig=zizhan_ipados18_gpu_defconfig.", "Default GPU config: CONFIG_XNU_PONG_ADRENO_PLATFORM=y, CONFIG_XNU_PONG_POWER=y, CONFIG_XNU_PONG_WIFI=y, CONFIG_XNU_PONG_BACKLIGHT=n.", "Apply patches/xnu-ipados18/series in order: 0001-0006 and 0008-0014."]
procedure = ["Generate dts/zizhan.dts from the live DT with tools/gen_reserved.py, replacing model, compatible, DRAM and reserved-memory in the Pong layout.", "Select uefi-zizhan Platforms/Xiaomi/zizhanPkg/zizhan.dsc; retain ARM64, SM8475, 22H374 and board layers."]
findings = ["The second DRAM bank is 0xf4600000+0xba00000, versus Pong 0xf1400000+0xec00000. ADSP uses 0x9fd00000+0x3100000, versus Pong 0x85700000+0x2800000. SMEM, IPCC, AOSS and cmd-db addresses agree.", "The Pong build scripts do not depend on the board name.", "The device default now enables GPU and Wi-Fi together. The old Wi-Fi defconfig is a relative symlink to the canonical GPU defconfig; local default build/packaging no longer needs separate profile or radio-enable options. The board-specific Wi-Fi hardware inputs remain in zizhan-wifi-sm8475.json.", "One canonical device defconfig enables GPU and Wi-Fi; the previous Wi-Fi name is a compatibility symlink. Default and explicit reduced CI kernels built successfully."]
completion = ["Compile the board DTS, kernel and boot image, then reach the iPadOS Home Screen on the phone."]
limits = ["Outer display and audio remain disabled. Default GPU/Wi-Fi integration does not qualify untested long-duration or broader network cases; see the network limits."]
next_action = ["Keep build and device evidence separate and reproduce the published configuration before changing board inputs."]
evidence = [
  {kind = "device", command = "cycle.sh out/g344-default-combined/pong-xnu-initial.img g344-default-combined 480", revision = "cc016a5c44c1ed074e98ea7c1104c1e5cbdff88f", reference = "docs/evidence/2026-11-05-default-gpu-wifi.txt", result = "Combined device defaults without DEFCONFIG/PROFILE/WIFI overrides passed native automatic association, keys, DHCP and HTTPS 200. Zero link loss or canvas-mapping errors; three complete Settings screenshots, deadline return and fresh UFS log."},
  {kind = "host", command = "ci_kernel.sh default and explicit CI; ci_boot_ufs.sh default/WIFI=0/explicit CI; check-wifi-host.py", revision = "cc016a5c44c1ed074e98ea7c1104c1e5cbdff88f", reference = "docs/evidence/2026-11-05-default-gpu-wifi.txt", result = "One canonical device defconfig enables GPU and Wi-Fi; the previous Wi-Fi name is a compatibility symlink. Default and explicit reduced CI kernels built successfully."},
  {kind = "source", reference = "docs/progress/2026-10-28-device-prep.md", result = "Live hardware, partition backup and stock UEFI memory-map comparison."},
  {kind = "source", reference = "docs/progress/2026-11-01-battery.md", result = "Board-specific addresses and differences from Pong."},
  {kind = "host", command = "GitHub Actions zizhan macOS build (macos-15-intel, Xcode 16.4, pong_ipados18_ci_defconfig)", revision = "28d9f4fe869293e7a384b18b800ceb8dd56c1244", reference = "https://github.com/qiumochen/UniXNU-zizhan/actions/runs/41304992346", result = "Hosted macos-15-intel runner resolved four layers, compiled the DTS, applied 13 XNU patches and linked the CI kernel; pong-macos-products uploaded."},
]

[[area]]
id = "firmware"
status = "implemented"
components = ["PongPlatform24"]
paths = ["drivers/DarwinBoot24/**", "scripts/build-darwinboot24*"]
inputs = ["uefi-zizhan: uefi-pong plus Platforms/Xiaomi/zizhanPkg.", "Stock uefi_b uefiplat.cfg memory map."]
configuration = ["PIL Reserved size=0x1DC00000; remove Demura and QTEE.", "SimpleFbDxe: framebuffer=0xb8000000, 2160x1916, inherited cont_splash_region.", "Temporary fastboot boot only; do not flash partitions."]
procedure = ["build_fw.sh builds the zizhanPkg FD with EDK II; build_bootimg.py combines BootShim, FD and the device DTB into boot v4.", "DarwinBoot24 reads the UniXNU menu and arms pong_autoreset before XNU handoff.", "ci_boot_ufs.sh rejects command lines above its 1020-byte limit; DarwinBoot24 requires fewer than 1024 bytes."]
findings = ["The inner panel shows the Silicium logo and UniXNU menu with correct color and orientation; DarwinBoot24 hands off to XNU.", "On refusal, DarwinBoot24 appends the reason to logfs:\\BOOTFAIL.TXT, retries, then returns to fastboot.", "A Wi-Fi kernel with larger embedded firmware occupied the temporary low-memory ReadFile buffer while the loader requested scanout pages. Free copied kernel/ADT inputs before reserving the optional 96 MiB pool. g299/g300 used the same kernel with radio disabled; the changed loader restored the real pool and complete screenshots."]
completion = ["Temporary boot reaches the menu and XNU; failures retain an automatic return path."]
limits = ["Qualcomm DXE binaries still come from uefi-pong Binaries/pong. There is no zizhan DisplayDxe and the outer panel stays off."]
next_action = ["Audit the stock FV Panel_L18_38_0c_0a_sec_dsc_cmd.xml before attempting outer-panel support."]
evidence = [
  {kind = "device", command = "cycle.sh g299-wifi-kernel-radio-off; cycle.sh g300-loader-radio-off", revision = "03363797d9ffb10fd35ad5823331e89b4bb3c624", reference = "docs/evidence/2026-11-04-wifi-settings-and-roaming.txt", result = "Loader-only comparison changed no-pool fallback into a real 96 MiB zero-copy pool and full sampled screenshot."},
  {kind = "source", reference = "docs/progress/2026-10-29-xnu-bringup.md", result = "Device record of UEFI, DarwinBoot24 handoff and early XNU boot."},
]

[[area]]
id = "cpu"
status = "implemented"
components = ["PongPlatform24"]
paths = ["drivers/ArmCpu/**", "drivers/ArmDTPlatform/**", "scripts/build-pong-armcpu*", "scripts/build-pong-platform*", "patches/xnu-ipados18/0003-*", "patches/xnu-ipados18/0005-*", "patches/xnu-ipados18/0008-*", "patches/xnu-ipados18/0014-*"]
inputs = ["SM8475: four Cortex-A510, three Cortex-A710, one Cortex-X2; GICv3, 19.2 MHz timer and PSCI."]
configuration = ["ADT cluster-type is required with PONG_ADT_CLUSTERS=1; build two clusters with __ARM_AMP__.", "pong_fast_pri=47 and pong_fast_cpu=7 by default.", "ml-timeout-lock-panic-scale=40; interrupt-masked-debug-mode=1."]
procedure = ["0008 exposes E/P clusters to AMP, 0014 prefers an idle X2 for UI-priority threads, and 0003 bounds qsort recursion to avoid early stack overflow."]
findings = ["All eight CPUs start. An AMP kernel without ADT cluster-type stalls early (g97).", "Under Gunyah, ordinary pauses can exceed the DEVELOPMENT 500 us interrupt-masking threshold. Following sheng, scale timeouts by 40 and log masking violations; preserve genuine fatal panic handling.", "In g170, a stalled app-opening workload used 0.73 CPU on A710 and 0.09 on X2 for the SpringBoard main thread; 0014 gives UI work X2 preference."]
completion = ["Start eight cores and place UI threads on X2 when available."]
limits = ["No thermal control. Repeated trials heat the phone and can corrupt DRAM ramoops logs."]
next_action = ["Integrate SM8475 thermal sensors and CPU frequency limits."]

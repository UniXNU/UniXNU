  {kind = "host", command = "ci_kernel.sh default and explicit CI; ci_boot_ufs.sh default/WIFI=0/explicit CI; check-wifi-host.py", revision = "cc016a5c44c1ed074e98ea7c1104c1e5cbdff88f", reference = "docs/evidence/2026-11-05-default-gpu-wifi.txt", result = "Default device packaging now starts the compiled radio without WIFI=1; explicit WIFI=0 disables only the radio, and reduced CI packaging does not claim a compiled radio."},
  {kind = "device", command = "cycle.sh out/g342-clean-native/pong-xnu-initial.img g342-clean-native 600; cycle.sh out/g343-clean-settings/pong-xnu-initial.img g343-clean-settings 480", revision = "959b00b1b81186c40b75b16a1c27c512062a2e1a", reference = "docs/evidence/2026-11-05-wifi-lifecycle.txt", result = "Both clean-stock-wifid boots returned HTTPS 200 with continued UP status. No-Settings g342 had a canvas-mapping failure and a wrapped early log, so no UI pass is claimed. g343 retained one association/key handshake, zero link loss and three complete Settings screenshots with no fixture or temporary test UI/helper."},
  {kind = "host", command = "check-wifi-host.py --shared Ath12kWifi; ci_kernel.sh Wi-Fi/CI/GPU", revision = "959b00b1b81186c40b75b16a1c27c512062a2e1a", reference = "docs/evidence/2026-11-05-wifi-lifecycle.txt", result = "Three kernel configurations built; actual old timer pass hangs under nested removal, adapted pass handles recursion, cancellation, running rearm, budget and future deadlines. FIFO ordering/full/wrap and existing regressions pass."},
  {kind = "device", command = "cycle.sh g335-fixed, g337-deferred-events, g340-progress-watch, g341-timer-reentry", revision = "959b00b1b81186c40b75b16a1c27c512062a2e1a", reference = "docs/evidence/2026-11-05-wifi-lifecycle.txt", result = "Real service binding and deferred notifications eliminated repeated short-run disconnects. Timer fix passed native radio off/on: two distinct DHCP ACK transactions, two HTTPS 200 responses, cleanup and continued worker progress. g340 failure is retained as the control."},
  {kind = "device", command = "cycle.sh g312, g314, g331, g332", revision = "718f73ce424d427c2ecdc757b9c64eb7cd4f3dca", reference = "docs/evidence/2026-11-04-wifi-settings-and-roaming.txt", result = "Stored credential reuse and real 64 MiB operation passed. Native automatic join and HTTPS 200 passed; original-wifid/no-Settings/default-128 MiB repeated HTTPS, but periodic disconnects remain."},
  {kind = "host", command = "ci_kernel.sh Wi-Fi/CI/GPU; LLVM 18 loader build; UI/helper compile and codesign; check-wifi-host.py on macOS and Ubuntu", revision = "92ef6d2de5419ce5c5aa8bfe36ab25a9fadeffb7", reference = "docs/evidence/2026-11-04-wifi-settings-and-roaming.txt", result = "Three kernel configurations, loader/UI/helper builds and host regression suites passed. Native metadata staging preserves stock endpoints and rejects other OS builds."},
  {kind = "device", command = "cycle.sh g304-rate-crossband, g306-rate-2g-to-5g, g309-native-settings-join", revision = "92ef6d2de5419ce5c5aa8bfe36ab25a9fadeffb7", reference = "docs/evidence/2026-11-04-wifi-settings-and-roaming.txt", result = "Both frequency directions passed three HTTPS 200 responses and disconnect cleanup without RDDM. Native Settings join independently passed WPA2, DHCP and HTTPS with kernel auto-association disabled."},
  {kind = "host", command = "ci_kernel.sh CI/GPU/Wi-Fi configs; check-wifi-host.py; wifid plist/cache staging replay; compile/sign UI library", revision = "fbac25628cfd36365c2850407bc77c3121b36780", reference = "docs/progress/2026-11-04-wifi-native-repair.md", result = "Bounded waits under a busy pump, skb ownership, lease and USB regressions passed. Native interface and firmware-failure cleanup built; host and device findings remain separate."},

schema_version = 1

[device]
name = "zizhan"
soc = "SM8475"
os_profile = "ipados-18.7.10-22H374"
summary = "Xiaomi MIX Fold 2: iPadOS 18.7.10 inner display, touch, Adreno 730 rendering and battery readings, derived from UniXNU-pong. A 120 Hz panel and 95.3 moving fps in one synthetic workload; native Wi-Fi Settings join, automatic association and cross-band reconnect have bounded device evidence; thermal control, sleep/wake and daily-use qualification remain open."

[[area]]
id = "configuration"
status = "host-verified"
components = ["PongPlatform24"]
paths = ["board.toml", "proprietary-files.txt", "feeds.toml", "unixnu.lock", "configs/**", "dts/**", "migration/format2/**", "scripts/*format2*", "scripts/build-pong-profile-kernel.py"]
inputs = ["zizhan (22061218C) live /sys/firmware/fdt; MIUI V14.0.15.0.TLRCNXM, Android 13, kernel 5.10.136.", "SM8475 shared support and PongPlatform24 from UniXNU-pong (Nothing Phone (2)).", "iPad7,11 iPadOS 18.7.10 / 22H374 restore."]
configuration = ["board.toml: name=zizhan; device_tree.source=device:dts/zizhan.dts; kernel.defconfig=zizhan_ipados18_gpu_defconfig.", "Default GPU config: CONFIG_XNU_PONG_ADRENO_PLATFORM=y, CONFIG_XNU_PONG_POWER=y, CONFIG_XNU_PONG_WIFI=y, CONFIG_XNU_PONG_BACKLIGHT=y.", "Apply patches/xnu-ipados18/series in order: 0001-0006 and 0008-0021."]
procedure = ["Generate dts/zizhan.dts from the live DT with tools/gen_reserved.py, replacing model, compatible, DRAM and reserved-memory in the Pong layout.", "Select uefi-zizhan Platforms/Xiaomi/zizhanPkg/zizhan.dsc; retain ARM64, SM8475, 22H374 and board layers."]
findings = ["The second DRAM bank is 0xf4600000+0xba00000, versus Pong 0xf1400000+0xec00000. ADSP uses 0x9fd00000+0x3100000, versus Pong 0x85700000+0x2800000. SMEM, IPCC, AOSS and cmd-db addresses agree.", "The Pong build scripts do not depend on the board name.", "The device default now enables GPU and Wi-Fi together. The old Wi-Fi defconfig is a relative symlink to the canonical GPU defconfig; local default build/packaging no longer needs separate profile or radio-enable options. The board-specific Wi-Fi hardware inputs remain in zizhan-wifi-sm8475.json.", "One canonical device defconfig enables GPU and Wi-Fi; the previous Wi-Fi name is a compatibility symlink. Default and explicit reduced CI kernels built successfully.", "The canonical device profile now also enables verified L18 backlight. A board-specific version-2 ADT uses the live primary-panel maximum 2047, minimum nonzero 4, DSI0 and VC0; mismatched Pong panel parameters are rejected.", "THERM-01 adds a zizhan-only TSENS/EPSS input JSON from live Android FDT; it contains no adopted thermal policy. The 11-07 default-off observer now gets reviewed physical resources through an ADT contract. A separate explicit 22H374 service-presence control can stage the installed OS370 fairplayd selection without changing default exclusions.", "The publication records the zizhan-only fixed display-domain board resource and its guarded ADT encoding; foreign or changed apertures are rejected. Host resource/transport replays and both kernel configurations passed; no new display power qualification is claimed."]
completion = ["Compile the board DTS, kernel and boot image, then reach the iPadOS Home Screen on the phone."]
limits = ["Outer display and audio remain disabled. Default GPU/Wi-Fi integration does not qualify untested long-duration or broader network cases; see the network limits."]
next_action = ["Keep build and device evidence separate and reproduce the published configuration before changing board inputs."]
evidence = [
  {kind = "source", reference = "docs/progress/2026-11-09-publication.md", result = "Publication ownership reconciliation for the cumulative 11-08/09 configuration change; host and device evidence remain separated, with runtime limits retained."},
  {kind = "source", reference = "docs/progress/2026-11-06-daily-use-development.md", result = "Live board inputs and isolated service-policy catalogs; no new kernel configuration or default runtime capability."},
  {kind = "host", command = "ci_kernel.sh default/reduced; inspect compiled settings and ADT; UI/helper compile/sign", revision = "88e5106dca99c03b9be1af02ceae5b041480a83d", reference = "docs/evidence/2026-11-05-display-and-backlight.txt", result = "The default enables GPU, Wi-Fi and verified primary L18 brightness with board-owned limits. Reduced CI still builds without GPU-only references."},
  {kind = "device", command = "cycle.sh out/g344-default-combined/pong-xnu-initial.img g344-default-combined 480", revision = "cc016a5c44c1ed074e98ea7c1104c1e5cbdff88f", reference = "docs/evidence/2026-11-05-default-gpu-wifi.txt", result = "Combined device defaults without DEFCONFIG/PROFILE/WIFI overrides passed native automatic association, keys, DHCP and HTTPS 200. Zero link loss or canvas-mapping errors; three complete Settings screenshots, deadline return and fresh UFS log."},
  {kind = "host", command = "ci_kernel.sh default and explicit CI; ci_boot_ufs.sh default/WIFI=0/explicit CI; check-wifi-host.py", revision = "cc016a5c44c1ed074e98ea7c1104c1e5cbdff88f", reference = "docs/evidence/2026-11-05-default-gpu-wifi.txt", result = "One canonical device defconfig enables GPU and Wi-Fi; the previous Wi-Fi name is a compatibility symlink. Default and explicit reduced CI kernels built successfully."},
  {kind = "source", reference = "docs/progress/2026-10-28-device-prep.md", result = "Live hardware, partition backup and stock UEFI memory-map comparison."},
  {kind = "source", reference = "docs/progress/2026-11-01-battery.md", result = "Board-specific addresses and differences from Pong."},
  {kind = "host", command = "GitHub Actions zizhan macOS build (macos-15-intel, Xcode 16.4, pong_ipados18_ci_defconfig)", revision = "28d9f4fe869293e7a384b18b800ceb8dd56c1244", reference = "https://github.com/qiumochen/UniXNU-zizhan/actions/runs/41304992346", result = "Hosted macos-15-intel runner resolved four layers, compiled the DTS, applied 13 XNU patches and linked the CI kernel; pong-macos-products uploaded."},

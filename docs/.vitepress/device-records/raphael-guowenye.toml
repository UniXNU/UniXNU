findings = ["The default intentionally disables unqualified hardware. Explicit handset wrapper adds SoftwareAES, VirtioMmioBlock and VerifiedRoot, handset-storage.series and native-diagnostic.series, storage/root/UFS recipes. ArmCpu upstream is not linked; independent SoC archive occupies its integration slot. Publication20261105 splits device and SoC repositories; feeds and lock pin guowenye/UniXNU-sm8150-common at c77321d82010250d6f100d7c17d7e721c17782bf. Public workspace orchestration, tests and source locks are retained under development/; no private inputs or generated images are included.", "License publication20261105 adds the full upstream BSD-2-Clause-Patent text, preserves existing file notices and pins the SoC at its licensed source commit c77321d82010250d6f100d7c17d7e721c17782bf. Only licensing, documentation and source references changed; no build or handset result is added."]
completion = ["All profile roots, source pins, overrides, component closure and patch order resolve; package maps to kits/raphael."]
limits = ["Shared SoC is published and pinned in feeds.toml and unixnu.lock. Default config is not handset qualification; complete production recipes remain incomplete.", "This publication captures the current source snapshot, not the exact historical source state of each local experiment. Historical raw logs and device inputs remain private; local summaries do not establish a formal public verification level."]
next_action = ["Published device source includes preserved workspace scripts, tests and source locks under development/. Keep the reviewed SoC commit pinned and collect new immutable public verification evidence separately."]


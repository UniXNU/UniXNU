inputs = ["SM8150 from this handset and Xiaomi raphael-p-oss 663db50e195a8a54c8565ac4ab0c6d9ba7d80db0; arm64 and ipados-17.7.11-21H461 profiles."]
configuration = ["Format2; soc_source=sm8150; kit=raphael; canonical raphael_defconfig plus arch:common.config and soc:sm8150.config. Arrays replace inherited lists. Local SoC/XNU/edk2 overrides are in ignored local.toml."]
procedure = ["From workspace: python3 scripts/check_repository_layout.py; run unixnu defconfig raphael_defconfig, status --json and tree with -D UniXNU-raphael --out artifacts/layout-check; run scripts/porting-record.py check --device UniXNU-raphael from UniXNU."]
findings = ["The default intentionally disables unqualified hardware. Explicit handset wrapper adds SoftwareAES, VirtioMmioBlock and VerifiedRoot, handset-storage.series and native-diagnostic.series, storage/root/UFS recipes. ArmCpu upstream is not linked; independent SoC archive occupies its integration slot.", "Publication20261105 adds the full BSD-2-Clause-Patent license used by existing SPDX declarations and links it from each repository README. The public repositories contain licensed source snapshots; active hardware source pins remain unchanged."]
completion = ["All profile roots, source pins, overrides, component closure and patch order resolve; package maps to kits/raphael."]
limits = ["The shared SoC is published and pinned in feeds.toml and unixnu.lock. The default config is not handset qualification.", "This source snapshot does not replace the exact source state of historical experiments. Raw logs and device inputs remain private; source summaries do not establish a formal public verification level."]
next_action = ["Freeze complete reviewed device/SoC/workspace commits, then pin the published SoC feed and rerun the same resolution."]


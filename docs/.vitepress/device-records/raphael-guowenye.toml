inputs = ["SM8150 from this handset and Xiaomi raphael-p-oss 663db50e195a8a54c8565ac4ab0c6d9ba7d80db0; arm64 and ipados-17.7.11-21H461 profiles."]
configuration = ["Format2; soc_source=sm8150; kit=raphael; canonical raphael_defconfig plus arch:common.config and soc:sm8150.config. Arrays replace inherited lists. Local SoC/XNU/edk2 overrides are in ignored local.toml."]

findings = ["165251Z CommCenter-focus run:375 independent UFS records,305200 bytes,dropped0,complete360s snapshot and RETURNING;2 display frames,no transfer error,watchdog18 checkins/0 failures,no panic reason recorded.SpringBoard still waits for LS database;lsd in original signature scan;CommCenter main in CFRunLoop with active workers,no fixed deadlock proven.Android/root/new boot ID/transient cleanup verified;full return remains failed/null,no desktop.Next704MiB memory contrast retains360/420s contract and original service policy.", "704MiB exact boot-grant option implemented in producer,SEC,MMU/pmap recovery,decoder and image checker after confirmed vm-pageshortage. Production C transition tables match independent Python decoder for256/512/704MiB;three rejection cases andASan/UBSan pass. Original loader already supports this aligned capacity. ADT changes only memory-size. New payload ready;old extent identity rejected beforeQEMU. No704MiB handset orQEMU success yet;current handset remains frozen512MiB CommCenter snapshot.", "163051Z automatic return and cleanup:429 UFS log records,98309 bytes,dropped0. Original watchdogd reason persisted before unchanged panic and matches independently CRC-verified static text:CommCenter four induced crashes and180s without checkin;backboardd and other listed services healthy. Full delta overflow remains failed/null. Original vm-pageshortage kills observed. Next diagnostic samples CommCenter in existing8 slots at qualified360/420s contract before observed368/500s panics;no desktop or baseband root-cause claim.", "102222Z handset confirms RAM Data isssd1. Automatic Android return and normal cleanup completed;297 independent UFS records,81044 bytes,dropped0. Original watchdogd selector2 requested panic before planned snapshot;1MiB delta overflow keeps full report failed/null. Independent7/8 mutable CRC ranges prove panic source but not its text. Next candidate persists original2048-byte selector2 reason through existing UFS log before unchanged panic; no desktop verified.", "095342Z independent UFS snapshot:724 records/no loss,2349 retired frames,58 watchdog checkins/no failure, no desktop. lsd progressed from IconServices sync wait to original signing scan; IconServices ISStoreMapTable faults in original throttle_lowpri_io. OS/SystemOS report isssd1 while RAM Data reports isssd0. NativeRamBlock now publishes the standard solid-state medium dictionary before family startup, covering RAM and optional UFS flash store; original throttle policy,512MiB and720/780s bounds retained. Build and handset qualification pending.", "Sparse Data first all-zero writes now leave missing pages unallocated using serialized4KiB staging. Partial/short copies, existing-page zero writes and optional write-through zero commits preserved.4000 differential operations plus zero/short/OOM, existing overlay/direct and extracted production batching tests pass ASan/UBSan. Memory/desktop effect awaits handset.", "UFS-backed immutable volumes now publish standard Device Characteristics / Medium Type = Solid State before storage-family startup. Phone040940Z reported isssd0 while backboardd remained in dyld ObjC fixups and SpringBoard waited for BKSDisplayGetMainScreenInfo. Phone043333Z persisted325 records/288724 bytes with zero drops and complete service snapshot after manual Android recovery. OS/SystemOS report isssd1, confirming the property; display clients/frames remain0 and backboardd is still in dyld selector fixups. Existing counters show roughly15MiB/s early and5MiB/s in service startup with zero read errors; full recovery checkpoint and desktop remain rejected. A subsequent candidate batches contiguous native reads up to16KiB across five owned DMA pages while retaining each original4KiB authentication before publishing the whole chunk. Extent37, real UFS-model45 and actual-controller-method10 ASan/UBSan cases pass; full887-record kernel, prelink/payload and39 recovery-QEMU checks pass. Handset045614Z independently persisted371 records/297594 bytes with zero drops and a complete snapshot after manual Android recovery; early throughput reaches about21MiB/s with roughly3.95 blocks/command, service startup remains about5MiB/s with roughly1.2 blocks/command and zero read errors. Display clients4/frames0;11 watchdog checkins without failure. Full checkpoint remains failed. Preallocation with Android fallocate then in-place dd fixes the observed final-log-block fragmentation without relaxing the original contiguous-allocation gate.", "The native XNU provider now exposes a kernel-only synchronous diagnostic write entry with lifecycle/I/O serialization, aligned policy copy, exact capacity/preimage checks, immutable OS/SystemOS extent exclusion, explicit permission revocation and error quiescence. Default profiles do not invoke it or expose it to userspace. An explicit private --native-ufs-write-policy diagnostic links an owned8256-byte policy and one normal-thread observer caller, waits for controller readiness, stops after one terminal result, and requires exact preflight and post-reboot readback. The complete887-record XNU build and prelink pass; one linked caller and exact policy bytes are checked in both images. Handset100353Z fully passed native once-only write,63 stages,result/OCS0,revoked permission,nonce/full checkpoint,normal-reboot file/raw-media/guards and Android cleanup. The10-poll observer recorded1402.405ms/3 pets;205.900s automatic Android return. First094934Z independently wrote/persisted but failed the unchanged >=2-pet checkpoint gate after208ms; preserved failed report. Explicit --ufs-console-log-report now links a nonblocking original-console queue and one bounded append session over a newly allocated immutable plaintext log file. Each4096-byte record contains a private boot identifier, sequence, physical counter and CRC; normal-thread flushes use WRITE10/FUA, SYNCHRONIZE CACHE and readback. Android extraction does not require a matching FDT return. Host queue/append ASan/UBSan and decoder tests pass. Phone030111Z followed by manual Android recovery independently qualifies191 persistent sequential records/60664 bytes/917 lines, zero reported drops, increasing counters, no invalid tail and unchanged guards. The original FDT checkpoint remains rejected; the log reaches service snapshot completion/RETURNING with clients/frames0.", "SEC C++ now explicitly inherits -mstrict-align: the frozen write candidate merged Completion initialization into an unaligned64-bit store at Transport+0x26c before the first command. AArch64 MMU-off validation with explicit SCTLR.A reproduces the old alignment fault and passes with strict alignment; complete firmware/recovery QEMU passes21 checks. The repaired candidate20261102T012856Z passed nonce, write/FUA/flush/readback and post-reboot media/guard checks; the two previous runs returned no native record and their media remained unchanged after Android recovery.", "Explicit diagnostic UFS write transport now implements WRITE10/FUA and exact-range SYNCHRONIZE CACHE10. Real QEMU8.2.2 UFS model passes68 cases plus40 cases after process restart, including actual firmware preimage gate, unchanged bytes outside the allocation, direction/FUA encoding, range/LUN/partial-block denial and residual/SCSI/OCS failures without retries. Handset20261102T012856Z independently passed all63 write-stage bits, ordinary Android reboot and exact file/raw-media readback with unchanged guards and full root/FDT cleanup. This qualifies one SEC diagnostic block, not native XNU writes or persistent Data. A new plaintext immutable12KiB project allocation grants only its middle4KiB, with both surrounding blocks preserved; firmware checks preimage before writing. Existing4392-byte FDT record is reused as version6 and normal Android reboot is followed by exact file/raw-media readback.", "Handset190907Z fully passed: original APFS Data stage4/status0/readonly0;226 seed entries and611715 bytes written/read back;RamBlock130 writes/ze
fore unchanged panic; no desktop verified.", "095342Z independent UFS snapshot:724 records/no loss,2349 retired frames,58 watchdog checkins/no failure, no desktop. lsd progressed from IconServices sync wait to original signing scan; IconServices ISStoreMapTable faults in original throttle_lowpri_io. OS/SystemOS report isssd1 while RAM Data reports isssd0. NativeRamBlock now publishes the standard solid-state medium dictionary before family startup, covering RAM and optional UFS flash store; original throttle policy,512MiB and720/780s bounds retained. Build and handset qualification pending.", "Sparse Data first all-zero writes now leave missing pages unallocated using serialized4KiB staging. Partial/short copies, existing-page zero writes and optional write-through zero commits preserved.4000 differential operations plus zero/short/OOM, existing overlay/direct and extracted production batching tests pass ASan/UBSan. Memory/desktop effect awaits handset.", "UFS-backed immutable volumes now publish standard Device Characteristics / Medium Type = Solid State before storage-family startup. Phone040940Z reported isssd0 while backboardd remained in dyld ObjC fixups and SpringBoard waited for BKSDisplayGetMainScreenInfo. Phone043333Z persisted325 records/288724 bytes with zero drops and complete service snapshot after manual Android recovery. OS/SystemOS report isssd1, confirming the property; display clients/frames remain0 and backboardd is still in dyld selector fixups. Existing counters show roughly15MiB/s early and5MiB/s in service startup with zero read errors; full recovery checkpoint and desktop remain rejected. A subsequent candidate batches contiguous native reads up to16KiB across five owned DMA pages while retaining each original4KiB authentication before publishing the whole chunk. Extent37, real UFS-model45 and actual-controller-method10 ASan/UBSan cases pass; full887-record kernel, prelink/payload and39 recovery-QEMU checks pass. Handset045614Z independently persisted371 records/297594 bytes with zero drops and a complete snapshot after manual Android recovery; early throughput reaches about21MiB/s with roughly3.95 blocks/command, service startup remains about5MiB/s with roughly1.2 blocks/command and zero read errors. Display clients4/frames0;11 watchdog checkins without failure. Full checkpoint remains failed. Preallocation with Android fallocate then in-place dd fixes the observed final-log-block fragmentation without relaxing the original contiguous-allocation gate.", "The native XNU provider now exposes a kernel-only synchronous diagnostic write entry with lifecycle/I/O serialization, aligned policy copy, exact capacity/preimage checks, immutable OS/SystemOS extent exclusion, explicit permission revocation and error quiescence. Default profiles do not invoke it or expose it to userspace. An explicit private --native-ufs-write-policy diagnostic links an owned8256-byte policy and one normal-thread observer caller, waits for controller readiness, stops after one terminal result, and requires exact preflight and post-reboot readback. The complete887-record XNU build and prelink pass; one linked caller and exact policy bytes are checked in both images. Handset100353Z fully passed native once-only write,63 stages,result/OCS0,revoked permission,nonce/full checkpoint,normal-reboot file/raw-media/guards and Android cleanup. The10-poll observer recorded1402.405ms/3 pets;205.900s automatic Android return. First094934Z independently wrote/persisted but failed the unchanged >=2-pet checkpoint gate after208ms; preserved failed report. Explicit --ufs-console-log-report now links a nonblocking original-console queue and one bounded append session over a newly allocated immutable plaintext log file. Each4096-byte record contains a private boot identifier, sequence, physical counter and CRC; normal-thread flushes use WRITE10/FUA, SYNCHRONIZE CACHE and readback. Android extraction does not require a matching FDT return. Host queue/app
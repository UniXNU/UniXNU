findings = ["1536MiB extends the local exact recovery to multiple L1 slots with up to three L2 and two edge L3 pages; the original XNU bootstrap allocation order is checked across all16 pages. Actual C ASan/UBSan and independent Python verify every granted recovery page, edge exclusion and unchanged legacy transition bytes. High-PA multi-L1 original-kernel recovery QEMU passes39 checks with24576-byte transition tables; the1536MiB handset contrast is running, desktop unverified.", "Explicit896MiB candidate selects an existing audited high-PA interval and extends exact loader/recovery policies; QEMU exercises the same high physical address regime. Original256/512/704MiB branches remain. High-PA recovery QEMU passes39 checks. The896MiB handset returned automatically to Android, with complete600/1000s process snapshots and3548 persistent UFS records; BackBoard proc-thrashing and a later CommCenter watchdog panic remain, no desktop.", "171336Z704MiB handset contrast:initial VM1801664KiB pages,378 independent UFS records,dropped0,complete360s snapshot;599 frames/0 transfer errors,22 watchdog checkins/0 failures,no recorded pressure kill or panic,3.70GiB reads versus512MiB5.12GiB.SpringBoard still waits for LS seeding;lsd parses application Info.plist.Android/root/transient cleanup verified;full return failed/null,no desktop.Next retains704MiB and uses qualified720/780s observer contract.", "512MiB rootless QEMU qualified all39 checks after alignment-aware one-L1 placement and exact bootstrap-table bound256; captured real512MiB tables and corrupted-descriptor rejection also pass ASan/UBSan. Handset185720Z confirms real_phys_size536870912 and original launchd main with restored snapshots and Android cleanup; same critical tzinit status30 panic rejects full checkpoint. No new RAM ownership generalization.", "Explicit512MiB allocation candidate retains audited handset RAM/guards and one-L1 exact recovery mapping;39 host boundary/negative checks pass. Same frozen240s kernel; subsequent185720Z independently confirms actual allocation and recovery.", "DT-described RAM is not free RAM. Firmware, native mappings, signed extent plans and DMA ownership are separate contracts; dynamic Linux pools are not allocated by inspection DTS."]
completion = ["Every touched span has explicit owner/lifetime/translation/cache and DMA policy; failures retain buffers until safe restoration."]
limits = ["No general SMMU takeover, complete RAM ownership or arbitrary concurrent DMA qualification.", "This source snapshot does not replace the exact source state of historical experiments. Raw logs and device inputs remain private; source summaries do not establish a formal public verification level."]

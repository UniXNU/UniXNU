[[area]]
id = "userspace"
status = "device-verified"
components = ["ShengUfs", "DarwinBoot"]
paths = ["configs/peridot_defconfig", "board.toml", "scripts/mockfs-launchd.S"]
inputs = ["mockfs (XNU's minimal executable-root filesystem), a Data ramdisk carrying a static arm64 Mach-O, and rd=md0."]
configuration = ["CONFIG_XNU_SOURCE_MOCKFS=y is the last mockfs line in configs/peridot_defconfig. xnu_env() takes the last value, and an earlier '# CONFIG_XNU_SOURCE_MOCKFS is not set' silently disabled the build (the vfs_conf.o marker stayed 0 and no mockfs symbol reached the kernel).", "board.toml sets kernel_args = -v rd=md0 sheng-pmgr=2 amfi_get_out_of_my_way=1 peridot-allow-unsigned-root=1, payload packed_data_ramdisk = false so the ADT publishes a plain RAMDisk, and no native-ufs-probe value so the UFS driver does not touch rootdev.", "The root device content is a static Mach-O built by tools/build-launchd.sh. tools/add-unixthread.py replaces LC_MAIN with LC_UNIXTHREAD because load_lcmain() marks LC_MAIN images as needing dyld, and clears MH_DYLDLINK/MH_PIE; tools/strip-dylinker.py rewrites the LC_LOAD_DYLINKER command as two LC_SOURCE_VERSION commands so no file offset moves.", "peridot-allow-unsigned-root=1 makes process_signature() treat the unsigned ramdisk executable as CS_SIGNED|CS_VALID; without it the MAC exec hook kills pid 1 with OS_REASON_EXEC/SECURITY_POLICY before any user code runs."]
procedure = ["bash peridot/tools/build-launchd.sh", "bash peridot/tools/build-ramdisk-root.sh pNNN (payload with --data-ramdisk, 64 MiB crop, mkbootimg)", "fastboot boot out/Mu-peridot-pNNN.img"]
findings = ["launchd and dyld run from the UFS-backed APFS restore root (p368/p371), which proves the signed userspace contract on this board.", "p372-p381: the kernel execs an Apple tool as pid 1 from peridot-init-path/arg1..3 boot arguments and the tool really drives the platform storage. After fixing the bdevsw write count units (buf_count bytes vs 512-byte blocks) and the disk ioctls newfs_apfs requires (DKIOCGETFEATURES / DKIOCISSOLIDSTATE / DKIOCSYNCHRONIZE), newfs_apfs formatted the 8 GiB install target and the kernel found the APFS NXSB superblock at offset 32 (p381).", "p376-p379: newfs_apfs pushed 1088+ strategy writes (including a full-device initialization pass) with no I/O errors and the writes are on disk (p378 scan: nz=3 firstnz=1), so the bdevsw RMW/FUA path works under real tool traffic.", "Public snapshot: board.toml only drops the Adreno735 selection; the launchd path is unchanged."]
completion = ["init executes a static arm64 image, its syscalls return correct results, and the output reaches the panel."]
limits = ["pid 1 can be any existing ramdisk executable via the boot arguments, but there is no shell in the restore ramdisk and the APFS root is read-only, so multi-step tool runs need one binary per boot or a custom static init; tool output is invisible because the exec path has no console file descriptors.", "newfs_apfs can format the install target, but running asr/restored against it still needs the IPSW OS image on the device (or a userspace disk-image channel) and the tools have to be driven one boot invocation at a time."]
evidence = [
  { kind = "device", reference = "scripts/mockfs-launchd.S", command = "fastboot boot out/Mu-peridot-p131.img with kernel_args -v rd=md0 sheng-pmgr=2 amfi_get_out_of_my_way=1 peridot-allow-unsigned-root=1", revision = "283feb0deb1ed0c4909ff4e664f0113e3d9acbff", result = "The panel shows 'PERIDOT-USERSPACE pid=0x0000000000000001 fd=0x0000000000000000': init started from the mockfs root, getpid() returned 1, open(/dev/console) returned fd 0, write() reached the console, and the system stays up with no panic." },
    { kind = "device", reference = "patches/xnu/peridot-bdevsw-root.patch", command = "fastboot boot out/Mu-peridot-p368.img with kernel_args -v native-ufs-probe=36 sheng-pmgr=2 amfi_get_out_of_my_way=1 peridot-allow-unsigned-root=1 offline-apfs-load=1 rd=md1 amfi-allows-trust-cache-load=1 amfi_allow_any_signature=1 -restore", revision = "23770733a454667dd844787f8fe40fb8b13219cf", result = "p368: com.apple.xpc.launchd[1] and restored_external[3] run from the UFS-backed APFS root; image out/Mu-peridot-p368.img (kernel sha in out/manifests/p368.json)." },
    { kind = "device", reference = "patches/xnu/peridot-init-args.patch", command = "fastboot boot out/Mu-peridot-p373.img (native-ufs-probe=40, peridot-init-path=/System/Library/Filesystems/apfs.fs/newfs_apfs, peridot-init-arg1=/dev/nu0)", revision = "afbb8b92da434da9606da77aa93c8e94de697aea", result = "Kernel execs newfs_apfs as pid 1; the tool starts device I/O and the kernel data-aborts in planUfsSmmuBank (pc 0xfffffff0079d9134). p374 (probe 41) reports target block 0 still zero: found=0 head=00000000. out/screen-p372-init-override-exec-failed.jpg, out/screen-p373-newfs-data-abort.jpg, out/screen-p374-target-check-after-newfs.jpg" },
    { kind = "device", reference = "drivers/ShengUfs/NativeUfs.cpp", command = "fastboot boot out/Mu-peridot-p381.img (native-ufs-probe=40, peridot-init-path=/System/Library/Filesystems/apfs.fs/newfs_apfs, peridot-init-arg1=/dev/nu0)", revision = "9f31ce00dc7b5300c03da6c9792039cac7296bfb", result = "newfs_apfs runs as pid 1 and formats the 8 GiB install target: kernel verification reports NATIVE_UFS init: found=1 off=32 head=78505f5c ok=1 (APFS NXSB on the target). out/screen-p381-newfs-apfs-container-ok.jpg; the earlier ioctl/exit-73 diagnosis is in out/screen-p380-newfs-ioctls.jpg." },

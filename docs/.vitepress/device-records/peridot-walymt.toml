findings = ["Prelink inputs come from the OS profile; this board must not restate them.", "2026-11-15: the kernel build is reproducible (same kernel.macho sha256 4d078ac1... across runs), the kernel blob is gzip mtime=0 (1,830,003 bytes), every payload build re-extracts kernel.macho/trust cache/Data seed and compares them with the inputs, and out/manifests/<name>.json records the hashes (current kernel sha256 2cb5e7ad..., image p360 68,943,872 bytes).", "The macOS-only skip-setup and seed-data-grow steps are not needed for the RAM-disk root path.", "Public snapshot: the Adreno735 archive step is removed from board.toml because its firmware is local-only; the rest of the packaging is unchanged."]

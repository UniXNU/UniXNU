limits = ["There is no clean-checkout CI: the WSL build tree <unixnu-checkout> and the EDK2 tree behind <Mu-Silicium> are prepared by hand and only their heads/hashes are recorded.", "The boot-image ramdisk limit is 96 MiB; the payload budget is checked in build-apfs-md.sh and there is ~30 MiB headroom."]

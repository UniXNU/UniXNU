schema_version = 1

[device]
name = "peridot"
soc = "SM8635"
os_profile = "ipados-17.7.11-21H461"
summary = "Redmi Turbo 3 / POCO F6 on Qualcomm SM8635 (cliffs). The board selects the iPadOS 17.7.11 profile and the SM8635 shared support. As of 2026-11-15 the kernel mounts the real APFS RestoreRamDisk container from UFS userdata as a memory-device root, runs Apple signed launchd/restored_external under AMFI with the ramdisk trust cache, and publishes the same window as a writable block device; the install-to-disk path (restore/asr) and the plain block-device root are still open."

[[area]]
id = "configuration"
status = "implemented"
components = []
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore"]
inputs = ["SM8635 shared support, the iPadOS 17.7.11 profile, this board's defconfig and the pinned component sources."]
configuration = ["board.soc = SM8635; board.soc_source = sm8635; board.os_profile = ipados-17.7.11-21H461.", "The board selects only ArmDTPlatform, ArmCpu, SoftwareAES, XnuPrelink and DarwinBoot; storage, display and input components are added when their board recipes exist."]
procedure = ["Read https://unixnu.com/porting/device-repository and https://unixnu.com/porting/records.", "Run ./unixnu defconfig peridot_defconfig -D ../UniXNU-peridot from the UniXNU checkout.", "Run ./unixnu status --json -D ../UniXNU-peridot and review profiles, components, source pins and patch order."]
findings = ["Tables merge in ARM64, SoC, OS and device order. Arrays replace inherited selections, so every required component and fragment is listed explicitly.", "The board inherits [ipsw] and [kernel.prelink] from the OS profile. Overriding either in board.toml would desynchronise the kernelcache pin from the components it was qualified against.", "Public snapshot 2026-11-17: the Adreno735 component is no longer selected in board.toml because its GPU firmware is vendor data and is not redistributed; the driver and kit sources remain for later work (docs/proprietary.md)."]
completion = ["All source pins resolve, status shows the intended component set and patch order, and the porting record check passes."]
limits = ["The SM8635 shared repository is new and unverified; its addresses are copied from the board's stock DTS."]
next_action = ["Resolve the SM8635 source pin and run status once the shared repository is published."]

[[area.evidence]]
kind = "source"
reference = "board.toml"
result = "Board identity, profile selection, component list, firmware and payload inputs."

[[area]]
id = "firmware"
status = "device-verified"
components = ["DarwinBoot"]
paths = ["board.toml", "proprietary-files.txt", "package/", "docs/uefi-bringup.md"]
inputs = ["Mu-Silicium Platforms/Xiaomi/peridotPkg, its Resources/Configs/peridot.toml, the stock firmware DTB and the PSCI SMC interface."]
configuration = ["firmware.dsc = Platforms/Xiaomi/peridotPkg/peridot.dsc; firmware.config = peridot; firmware.fd = Build/peridotPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd.", "The firmware DSC and FDF must embed UniXNU, UniXNUDxe, DarwinBoot, UniXNURamDiskDxe, DiskIoDxe and FAT support.", "bootimg.image pins header_version = 0 and pagesize = 4096; the device rejects every signed-header variant."]
procedure = ["Build the stock peridotPkg firmware first and boot it with fastboot boot to verify display, side buttons and block devices.", "Then run ./unixnu build firmware -D ../UniXNU-peridot --uefi ../Mu-Silicium and boot the resulting image."]
findings = ["peridotPkg already loads at 0xA7100000 with size 0x300000 and reports display, internal storage, side buttons, USB device mode and mass storage as working in the Mu-Silicium status page.", "Mu-Silicium labels peridot Inactive: the platform has no active maintainer, so any firmware fault has to be fixed here.", "Measured on the device: the RELEASE build produces a 3 MiB SILICIUM_UEFI.fd and the Silicium UEFI menu appears on the panel.", "Header v4, v4 with os_version and v1 are all rejected with Failed to load/authenticate boot image: Invalid Parameter; only header v0 with pagesize 4096 boots.", "With no bootable entry the menu returns to the bootloader after a while, and repeated failed fastboot boot attempts make the bootloader mark the active slot unbootable until fastboot --set-active clears it.", "Public snapshot: the Adreno735 archive entry is removed from board.toml together with the component, so the firmware and payload builds no longer pull the vendor GPU firmware placeholder."]
completion = ["The firmware boots, shows the UniXNU menu, publishes the payload RAM disk and hands the framebuffer to DarwinBoot."]
limits = ["The peridot firmware configuration is unmaintained upstream; SM8635 and SM7675 share the Palawan platform package.", "The firmware volume has no bootable entry yet, so the menu is the end of the current chain."]
next_action = ["Add UniXNU, DarwinBoot and UniXNURamDiskDxe to the firmware volume so the menu has a boot option."]

[[area.evidence]]
kind = "source"
reference = "https://github.com/Project-Silicium/Mu-Silicium/blob/main/Platforms/Xiaomi/peridotPkg/peridot.dsc"
result = "FD base and size, framebuffer geometry, SM8635 platform selection."

[[area.evidence]]
kind = "device"
reference = "docs/uefi-bringup.md"
result = "Silicium UEFI menu appears on the panel when booted with header v0 and pagesize 4096."
command = "fastboot boot Mu-peridot.img"
revision = "8b9acafab284a2f0d2ad91cf4c4dac204236e75b"

[[area]]
id = "cpu"
    status = "device-verified"
components = ["ArmCpu", "ArmDTPlatform"]
paths = ["dts/**", "dts/vendor/peridot-stock.dts"]
inputs = ["Eight cores with MPIDR 0x000 through 0x700, GIC distributor at 0x17100000, redistributors at 0x17180000 with 0x40000 stride, 19.2 MHz timer and PSCI over SMC."]
configuration = ["dts/peridot.dts includes sm8635.dtsi from the SoC source.", "cpu_regs lists every MPIDR in the ADT; clusters are A520 (E), A720 (P) and X4 (P)."]
procedure = ["Compile the board DTS and inspect enabled CPUs, GIC ranges and timer properties in the ADT.", "Record per-CPU entry, timer interrupts and IPI delivery for each core."]
findings = ["The stock DTS describes every core as qcom,kryo; the dtsi uses the ARM generic compatible strings so the platform expert builds CPU nubs.", "GIC and redistributor ranges match SM8550 exactly, so the SoC dtsi can keep that layout."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer and IPI handling work on each core."]
limits = ["CPU frequency policy is a board input and is not implemented."]
next_action = ["Verify the redistributor count against GICR_TYPER on the device.", "Add CPU idle/power-off once the install path exists."]

[[area.evidence]]
kind = "source"
reference = "dts/vendor/peridot-stock.dts"
result = "CPU MPIDR values, GIC ranges and redistributor stride."

[[area.evidence]]
kind = "device"
reference = "configs/peridot_defconfig"
command = "fastboot boot out/Mu-peridot-p354.img and out/Mu-peridot-p359.img with kernel_args -v native-ufs-probe=18 sheng-pmgr=2 amfi_get_out_of_my_way=1 peridot-allow-unsigned-root=1 offline-apfs-load=1 rd=md1 amfi-allows-trust-cache-load=1 amfi_allow_any_signature=1 -restore"
revision = "5aba75132ed14960f3205fa810aaf64cca67c982"
result = "SMP boot on all 8 cores (MAX_CPUS 8 / MAX_CPU_CLUSTERS 2 fixed the topology-parser stall); Apple launchd reaches userspace (HANDOFF-2026-11-15.md section 7)."

[[area]]
id = "memory"
    status = "device-verified"
components = []
paths = ["dts/**", "dts/vendor/peridot-stock.dts", "board.toml"]
inputs = ["DRAM at 0x80000000, 12 GiB on this unit (ddr_size = 0x0c). UEFI runs inside 0xA7100000 to 0xA7400000; the display reservation is 0xE3940000 with size 0x2B00000."]
configuration = ["device_tree.source = device:dts/peridot.dts with include_dirs = [soc:dts].", "payload.dram_size = 0x80000000 and payload.adt.owned_memory_size = 0x100000000 are the values the working images boot with; they are smaller than the 12 GiB physical DRAM because the bring-up only needs a contiguous owned window."]
procedure = ["Compare the firmware memory map, the DTS memory and reserved-memory nodes and the ADT memory-map entries before the first boot.", "Check every DMA range against the controller address width and SMMU mapping before enabling a driver."]
findings = ["DRAM is 12 GiB on this unit but the ADT publishes a smaller owned window; the apps SMMU sits at 0x15000000 and the UFS DMA stream 0x60 is bypassed through it.", "2026-11-15: a 176 MiB wired buffer for the APFS container is allocated and addressed by the UFS DMA engine, and the same path writes back to UFS (p356).", "Public snapshot: board.toml only drops the Adreno735 selection; the memory map and ADT values are unchanged."]
completion = ["Every handoff region is accounted for and each DMA engine reaches its range with the documented cache policy."]
limits = ["The RAM size varies by SKU and the ADT owned window is smaller than physical DRAM; the 184 MiB APFS container is allocated as wired memory at boot."]
next_action = ["Read the firmware memory map and record it here.", "Size the ADT owned window from the real memory map before any large install target is mapped."]

[[area.evidence]]
kind = "device"
reference = "drivers/ShengUfs/NativeUfs.cpp"
command = "fastboot boot out/Mu-peridot-p354.img and out/Mu-peridot-p359.img with kernel_args -v native-ufs-probe=18 sheng-pmgr=2 amfi_get_out_of_my_way=1 peridot-allow-unsigned-root=1 offline-apfs-load=1 rd=md1 amfi-allows-trust-cache-load=1 amfi_allow_any_signature=1 -restore (probe 33 write test)"
revision = "5aba75132ed14960f3205fa810aaf64cca67c982"
result = "The 184,549,376-byte APFS container is read into a 176 MiB wired buffer and registered with mdevadd; the same SMMU/DMA path writes back (p356 match=1 restore=0/0 ok=1)."


[[area]]
id = "storage"
    # Implemented and device-tested: the transport, the manifest and the
    # IOStorageFamily hand-off work; the root volume still does not mount.
    status = "device-verified"
components = ["ShengUfs", "VirtioMmioBlock", "VerifiedRoot"]
paths = ["board.toml", "feeds.toml", "configs/peridot_defconfig", "drivers/ShengUfs", "dts/vendor/peridot-stock.dts"]
inputs = ["UFS host at 0x1d84000 with size 0x3000, ICE at 0x1d88000, ICE hardware key manager at 0x1d90000, MCQ registers, PHY at 0x1d80000 and the apps SMMU stream 0x60."]
configuration = ["ShengUfs is vendored under drivers/ShengUfs and declared as a local source in feeds.toml, so it can be adapted for cliffs and the build survives an unreachable github.com.", "Root path (2026-11-15): native-ufs-probe=18 reads the 184,549,376-byte RestoreRamDisk APFS container from the start of userdata into wired memory, registers it as md1 and leaves it as rootdev; rd=md1 plus patches/xnu/peridot-rd-wait.patch mount it through the APFS restore/ramdisk branch, and the same window is published as a writable IOBlockStorageDevice (disk0/disk1/disk1s1).", "peridot-apfs-register.patch re-registers the prelinked apfs vfs in front of mockfs; peridot-rootauth.patch lets peridot-allow-unsigned-root=1 replace the missing volume seal."]
procedure = ["Read the GPT and confirm the userdata entry before writing any board value.", "After WSL access is available, run the peridot UFS binding wrapper on the active tree and verify its archive and current kernel.json; then boot with native-ufs-probe=2 and =10 for read-only transport/GPT checks before any write."]
findings = ["The host and PHY addresses match SM8550, but the PHY compatible is qcom,ufs-phy-qmp-v4-cliffs and the controller adds ICE and MCQ regions the SM8550 implementation does not use.", "Fix A from audit/2026-11-15-enotblk.md works: the UFS window is published as a bdevsw disk, claimed and adopted inside the rd= wait loop, and APFS mounts the container through its ramdisk restore branch from the real UFS disk.", "The bdevsw path needs the page-cache buf_map strategy, a real write path (WRITE(10)+FUA through ufsWriteWindow with counts in 512-byte blocks) and the disk ioctl contract (DKIOCGETFEATURES/ISSOLIDSTATE/SYNCHRONIZE plus max-transfer/segment); Apple newfs_apfs then formats the 8 GiB install target (p381).", "The iPadOS System container extracted from the IPSW OS image (6,077,546,496 bytes, NXSB, block_count 1483776) can be staged into userdata through a fastboot sparse image and mounted as root: its /sbin/launchd is exec-ed from UFS (p383). dyld then needs the shared cache, which iOS 16+ keeps in a cryptex (Cryptex1,SystemOS).", "Public snapshot: board.toml only drops the Adreno735 selection; the UFS/APFS root path is unchanged."]
completion = ["SCSI capacity, GPT and known blocks are correct, then the configured root volume mounts and launchd starts."]
limits = ["The root is mounted through APFS's restore/ramdisk branch and is read-only; a writable system volume needs the mount flags opened or a native block-device root.", "The staged iPadOS System container is bootable far enough to exec launchd but cannot run it without the dyld shared cache / cryptex content; the restore container remains at userdata offset 0 and the OS container at offset 1 GiB.", "The bdevsw strategy is serialised by one lock; the screen remains the only diagnostic channel."]
next_action = ["The official SHNGROOT userdata install flow is verified on hardware: userdata-root.img (9,382,658,048 bytes) was flashed (12 chunks, 226 s) and Mu-peridot-p418.img (PROBE=55) parsed the SHNGROOT manifest, skipped the OS window GPT, claimed the Apple_APFS partition as root and started launchd from /sbin/launchd; only the dyld shared cache (SystemOS cryptex) is still missing. Next: probe 56 = SHNGROOT OS root + SystemOS (/dev/nu1) + the 12 GiB staging volume (/dev/nu2), then the probe=5 file-vnode graft flow (mount staging, copy cryptex.img, graft) to provide the cache.", "Keep the ad-hoc probes (native-ufs-probe 18/40/45) available for bisection; the 8 GiB staging container at 12 GiB survived the 9.4 GB userdata flash."]

evidence = [
  { kind = "host", reference = "drivers/ShengUfs/NativeUfs.cpp", command = "cd <unixnu-checkout> && ./unixnu defconfig peridot_defconfig -D ../UniXNU-peridot && ./unixnu kernel -D ../UniXNU-peridot", revision = "2e767bc7aa14e0dfaec774cfe73d3180fcb74dfd", result = "NativeUfs.cpp builds to a 473 KB object with 634 symbols, libShengUfs.a is produced, and -force_load reaches the kernel link line." },
  { kind = "host", reference = "configs/peridot_defconfig", command = "cd <unixnu-checkout> && UNIXNU_KERNELCACHE=$PWD/out/ipsw/21H461/kernelcache.decompressed ./unixnu kernel -D ../UniXNU-peridot", revision = "2e767bc7aa14e0dfaec774cfe73d3180fcb74dfd", result = "With CONFIG_XNU_NATIVE_UFS=y the link stops on IOBlockStorageDevice (external IOStorageFamily kext), verified_root_key/policies (VerifiedRoot) and boot_progress_poll; the option is back to unset so the tree still builds." },
  { kind = "source", reference = "dts/vendor/peridot-stock.dts", result = "ufshc@1d84000 with reg size 0x3000, iommus <&apps_smmu 0x60 0> and GCC clock-controller@100000: the three constants the SM8550 transport assumes all match." },
  { kind = "device", reference = "drivers/ShengUfs/NativeUfs.cpp", command = "fastboot boot out/Mu-peridot-ufsprobe.img with kernel_args -v native-ufs-probe=2", revision = "2e767bc7aa14e0dfaec774cfe73d3180fcb74dfd", result = "The vendored SM8550 transport matched peridot ufshc and ran its read-only inspection on device: the six GCC UFS PHY clock branches (axi, ahb, uniphy, txs, rxs, aux) all read 0x11, so fastboot leaves the link clocked. The gdsc values printed as 0xff22227ff890000, which does not look like a power-domain status register, so the SM8550 GCC offsets are probably wrong for cliffs and must be re-derived before anything is written." },
  { kind = "host", reference = "docs/boot-bisection.md", revision = "02a562d39c4cbd160633d3ab611010a994d54848", command = "python .tmp/build_userdata_image.py --ipsw <local iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw>; python .tmp/verify_userdata_image.py <generated userdata-root.img>", result = "Generated a 9,382,658,048-byte SHNGROOT v1 image with OS and SystemOS windows. Both IPSW members matched the OS profile SHA-256 pins; independent header, bounds, per-window and full-image SHA-256 checks passed. Capacity used the measured 0x78587FB000-byte partition size only; physical first/last GPT LBA remain unset, the image was not flashed, and hardware boot was not tested." },
  { kind = "device", reference = "drivers/ShengUfs/NativeUfs.cpp", command = "fastboot boot out/Mu-peridot-p115.img with kernel_args -v native-ufs-probe=17 native-ufs-mountroot=1 peridot-apfs-vfsmount=1", revision = "283feb0deb1ed0c4909ff4e664f0113e3d9acbff", result = "Cross-container reads at offsets 0, 4 MiB, 64 MiB and 1 GiB all returned status 0, so the transport serves the whole window. Both APFS entry points fail: apfs_vfsop_mountroot and a direct VFS_MOUNT gated by peridot-apfs-vfsmount=1 both return ENOENT at apfs_vfsop_mount:2479. Cause: the flashed userdata image is the update payload, not an installed system. Container 4096 x 1483776 (6,077,546,496 bytes) with UUID 50f8a67f-afc1-4aaf-...; volume 04769d26-... named DawnUpdate21H461.J120J121J207J208OS carries no root snapshot (com.apple.os.update absent) and no role, so it cannot serve as a root volume." },
    { kind = "device", reference = "patches/xnu/peridot-rd-wait.patch", command = "fastboot boot out/Mu-peridot-p368.img with kernel_args -v native-ufs-probe=36 sheng-pmgr=2 amfi_get_out_of_my_way=1 peridot-allow-unsigned-root=1 offline-apfs-load=1 rd=md1 amfi-allows-trust-cache-load=1 amfi_allow_any_signature=1 -restore", revision = "23770733a454667dd844787f8fe40fb8b13219cf", result = "p368 (and the p362-p367 series): APFS container mounted from the real UFS bdevsw disk, /sbin/launchd loaded through decmpfs from that root, real launchd+restored_external running (out/screen-p368-ufs-root-real-launchd.jpg)." },
    { kind = "device", reference = "drivers/ShengUfs/NativeUfs.cpp", command = "fastboot boot out/Mu-peridot-p368.img with kernel_args -v native-ufs-probe=36 sheng-pmgr=2 amfi_get_out_of_my_way=1 peridot-allow-unsigned-root=1 offline-apfs-load=1 rd=md1 amfi-allows-trust-cache-load=1 amfi_allow_any_signature=1 -restore", revision = "23770733a454667dd844787f8fe40fb8b13219cf", result = "p361 probe 34: IOBlockStorageDevice write path self test ok=1 (devio block=64 read=0 write=0 reread=0 match=1 restore=0 verify=0 ok=1, out/screen-p361-probe34-devio-ok.jpg)." },
    { kind = "device", reference = "drivers/ShengUfs/NativeUfs.cpp", command = "fastboot boot out/Mu-peridot-p369.img with kernel_args -v native-ufs-probe=37 ... rd=md1 -restore", revision = "3d189e6c9cc382663f59b8b7c583fdaef3ff556e", result = "p369: InstallTarget (8 GiB at userdata+1 GiB) published and writable through IOBlockStorageDevice (page=0/0/0/0, 4 MiB write+verify+restore in 8 ms); rootflags=0x1480d001 (read-only root). out/screen-p369-install-target-ok.jpg" },
    { kind = "device", reference = "patches/xnu/peridot-bdevsw-root.patch", command = "fastboot boot out/Mu-peridot-p370.img / out/Mu-peridot-p371.img with native-ufs-probe=38 / 39", revision = "3d189e6c9cc382663f59b8b7c583fdaef3ff556e", result = "p370: container copied to the install target and verified (176 MiB, 1408 chunks, 570 ms). p371: booted from the installed target, real launchd/restored_external running. out/screen-p370-install-copy-ok.jpg, out/screen-p371-installed-target-real-launchd.jpg" },
    { kind = "device", reference = "tools/udif-extract.py", command = "fastboot flash userdata userdata-os.sparse.img (5.9 GiB sparse, 124.8 s); fastboot boot out/Mu-peridot-p383.img (native-ufs-probe=43)", revision = "d940feca1017ef8497f168d7e1b0937e85e27947", result = "The iPadOS System APFS container (6,077,546,496 B, NXSB, block_count 1483776) mounts from UFS and /sbin/launchd is exec-ed; dyld stops at /usr/lib/libSystem.B.dylib (no dyld cache). out/screen-p383-os-root-launchd-dyld.jpg" },
    { kind = "host", reference = "tools/udif-extract.py", command = "udif-extract.py 044-76040-038.dmg -> <work>/os-container.img; inspect 044-76034-038.dmg (raw APFS)", revision = "d940feca1017ef8497f168d7e1b0937e85e27947", result = "OS image extracts to a 6,077,546,496-byte APFS container (NXSB, 1483776 blocks) whose launchd is exec-ed when staged as root (p383); Cryptex1,SystemOS is a raw 3,303,014,400-byte APFS container (volume DawnUpdate21H461...SystemCryptex) containing dyld_v1 arm64 shared cache. The kernel graft path is syscall 549 graftdmg + VNOP_IOCTL(FSIOC_GRAFT_FS)." },
    { kind = "device", reference = "patches/xnu/peridot-cryptex-graft.patch", command = "fastboot flash userdata userdata-os.sparse.img (restore@0, OS@1GiB, cryptex@8GiB, 9.1 GiB sparse); fastboot boot out/Mu-peridot-p38{4,5,6}.img", revision = "9e6b9464d6b03a451827631b9484954ff958d99e", result = "p384: path probe shows /sbin/launchd and /usr/lib on the mounted System volume but /System/Library/Caches/com.apple.dyld and /System/Cryptexes/OS are ENOENT. p385/p386: kernel cryptex graft called before load_init_program; APFS FSIOC_GRAFT_FS returns EINVAL (graft failed: 22). Screens: out/screen-p384-cryptex-paths.jpg, out/screen-p385-launchd-shared-region-fail.jpg, out/screen-p386-graft-einval.jpg" },
    { kind = "device", reference = "patches/xnu/peridot-cryptex-graft.patch", command = "fastboot boot out/Mu-peridot-p387.img (native-ufs-probe=45, SystemOS cryptex at userdata+8GiB)", revision = "542e3f06028389798f9ef2f2dd058038823e59ca", result = "kernel_mount(\"apfs\") attempts from bsd_init fail before launchd: noargs=22 EINVAL, kernel char** device path=14 EFAULT (APFS wants user-space mount args), graft=22 EINVAL. out/screen-p387-apfs-mount-errno.jpg" },
    { kind = "device", reference = "patches/xnu/peridot-cryptex-graft.patch", command = "kernel builds p388-p395; fastboot boot out/Mu-peridot-p39{1,2,5}.img with PROBE=45/46", revision = "8d5ad00b916e99efd22d753e13296bda02acd259", result = "p388 direct mount() = EPERM (MACF); p389 kernel_mount with user-space args = EINVAL; p390/p391 field variants all EINVAL; p392 restore-root init override /apfs.fs/mount_apfs = ENOENT; p395 root probe ld=0 dyld=0 fs=2 mp=2 smp=2 ump=2 (184 MiB restore container has launchd/dyld but no apfs.fs tools). Screens: out/screen-p388-userspace-mount-eperm.jpg … out/screen-p395-root-launchd-dyld-only.jpg" },
    { kind = "device", reference = "drivers/ShengUfs/NativeUfs.cpp", command = "kernel builds p396-p400; fastboot boot out/Mu-peridot-p39{6,7}.img (PROBE=46 + peridot-init-path=/System/Library/Filesystems/apfs.fs/mount_apfs) and p400 (PROBE=45 + peridot-cryptex-probe=3)", revision = "2ca8baed6bcd67e4218842ee24135af888a644e4", result = "p396 mount_apfs runs as pid 1 and calls mount(2); APFS cannot read /dev/nu1 superblock because nu1 lacked a bounce buffer. p397 after the fix APFS scans the container (spaceman_scan_free_blocks) but apfs_vfsop_mount:2550 refuses to mount the sealed cryptex volume; mount_apfs exits 65. p400 graft retry with the block-device vnode instead panics (nested panic at pe_init.c:778, far=0x598). Screens: out/screen-p396-userland-mount-apfs-einval-read.jpg, out/screen-p397-apfs-spaceman-scan-then-unable.jpg, out/screen-p400-nested-panic-graft-only.jpg" },
    { kind = "device", reference = "drivers/ShengUfs/NativeUfs.cpp", command = "fastboot boot out/Mu-peridot-p401.img (PROBE=49 + newfs_apfs /dev/nu0), Mu-peridot-p402/p403.img (PROBE=51 + peridot-cryptex-probe=4)", revision = "bbb5ee8efe94b62066eb63ac32cb8a7b05b368b3", result = "p401: newfs_apfs formatted the 8 GiB container at userdata+12 GiB (verify thread: found=1 off=32). p402/p403: the file-graft test builds /cryptex.img and calls the graft on a file vnode, but vnode_open returns ENOENT because mountroot did not root from the empty staging volume - it fell back to the restore ramdisk root (e2/e3 probes show /usr/lib exists, so root is not the new volume). Infrastructure for absolute reads, file creation and vn_rdwr copies is in place. out/screen-p401-staging-volume-formatted.jpg, out/screen-p402-file-graft-open-enoent.jpg, out/screen-p403-file-graft-open-enoent-again.jpg" },
    { kind = "device", reference = "drivers/ShengUfs/NativeUfs.cpp", command = "fastboot boot out/Mu-peridot-p406.img (PROBE=52 + probe=5), Mu-peridot-p407.img (PROBE=53 + mount_apfs /dev/nu2 /usr), Mu-peridot-p408.img", revision = "103c60c0fbb943a4f2700a69d2d0c982298f048e", result = "p407 captured the real mount_apfs APFS argument blob: after the fspec pointer, u64 mount flags=0, u16=1 and zeros. p406/p408 mounting the writable staging container at /System/Library/Caches from kernel_mount still returns EINVAL, so the regular mount path difference (kernel_mount vs mount(2)) or the mount context must be investigated; whether mount_apfs itself can mount /dev/nu2 has not been verified yet. out/screen-p406-secondary-mount-einval.jpg, out/screen-p407-mountargs-dump.jpg, out/screen-p408-file-graft2-einval.jpg" },

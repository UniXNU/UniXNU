components = []
paths = ["dts/vendor/peridot-stock.dts", "dts/sm8635.dtsi", "proprietary-files.txt"]
inputs = ["DWC3 at 0xa600000 with its child window 0xd93c, apps_smmu stream 0x40, GIC SPI 133 for the core interrupt and 130 for the power event, eUSB2 PHY and PMIC repeater, QMP combo PHY at 88e8000, UCSI over the PMIC GLINK channel and usb-role-switch."]
configuration = ["No USB node exists in this port's dtsi and no USB component is selected."]
procedure = ["Select QcomDwc3, then generate the QMP USB3 table from the palawan Linux tree.", "Regenerate the XDCI and XHCI class layouts against the 21H461 kernelcache and add the USB stacks to the kernel prelink roots.", "Confirm the core interrupt and the UCSI/vbus hooks for this board before any transfer test."]
findings = ["UniXNU already ships the whole solution as QcomDwc3, derived from AppleUSBXDCI and AppleUSBXHCI; on sheng it enumerates at 10 Gbps and 480 Mbps, pairs with a Mac and starts lockdown sessions, while host mode is only partially verified.", "peridot's stock DTS already describes every board input the recipe asks for: DWC3 at 0xa600000, the same 0x40 SMMU stream as sheng, an eUSB2 PHY with its PMIC repeater, a QMP combo PHY and qcom,ucsi-glink.", "The interrupt differs from sheng: sheng uses INTID 165, peridot's dwc3 node carries GIC SPI 133 with the power event on 130, so the mapping has to be confirmed before registration.", "The local UniXNU checkout predates QcomDwc3; the catalog lists only QcomGeniSpi, so the component pin and the prelink roots have to be added first.", "The ABI scripts in the QcomDwc3 repository name the 24A446 kernelcache, while this port selects ipados-17.7.11-21H461, so both layout files must be regenerated.", "sheng keeps fairplayd.A2 and adid disabled with the USB stack enabled; both enabled stop SpringBoard from finishing boot."]
completion = ["The device enumerates over USB, pairs with a Mac and a lockdown session starts."]
limits = ["No USB driver is selected and nothing is modelled in the dtsi."]
next_action = ["Raise the UniXNU pin to a revision that carries QcomDwc3 and add it to the component list.", "Generate drivers/QcomDwc3/QcomQmpUsb3.h from the palawan tree and regenerate both ABI layouts for 21H461."]


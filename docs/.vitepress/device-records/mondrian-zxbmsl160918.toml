status = "host-verified"
components = []
paths = ["docs/USERLAND-ROUTES-2026-11-02.md", "scripts/*payload*", "scripts/*image*", "patches/**", "kits/**", "package/**", "userland/**", "v98-source.md", "prebuilt/**", "pong-payload.patch", "pong-unixnu.patch", "scripts/apply-core-patches.sh", "scripts/build-*.py", "scripts/build-*.sh", "scripts/create-mac-*.py", "scripts/emit_prelink_autoslide.py", "scripts/fetch-ios16-assets.py", "scripts/inspect-install-readiness.py", "scripts/k60-macos-preflight.sh", "scripts/k60-prelink-local.py", "scripts/make-pong-adt.py", "scripts/pong_adt_contract.py", "scripts/save-xnu-patch.py", "scripts/test-initrd-qemu.py", "scripts/k60-prelink-darwin24.py", "scripts/k60-bootstrap-pt-model.py", "scripts/adt-generate.py", "scripts/extract-kernelcache-kexts.py", "scripts/parse-kernelcache-im4p.py"]
inputs = ["Identify the image assembly hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for image assembly."]
procedure = ["Follow the image assembly stage in the porting guide and record the actual commands."]
findings = ["The three local trees use different userland models: ours keeps an OS+SystemOS read-only APFS union from the unixnu partition; ios-sweet-k60 rewrites a writable HFSX image at build time; UniXNU-pong prepares at run time inside its own static init that becomes PID 1 and then execs launchd. Selected approach: diagnose first and do not replace PID 1, because the launchd chain is already verified and the pong adapter targets Darwin 24 ABI. Our kernel already carries exec_inject and bindfs, so the pong model remains available if the blocker turns out to need run-time preparation. See docs/USERLAND-ROUTES-2026-11-02.md.", "The kernel links and prelinks on macOS CI. Format 1 run 40631225483 produced 54349824 bytes; format 2 run 40650877574 produced 54419456 bytes at the same slide -0xb9c000 and the same lowest component extent 0xfffffff004426600.", "The 69632-byte difference is a real fix, not noise: the format-1 glob applied zzzzzz-pong-init-scratch-allocation.patch through fuzz and the panic string it adds is absent from that kernel, while the strict format-2 series applies it at its intended place and the string is present. The checked scratch allocation had never reached a qualified kernel before.", "mzyxsl daed6b5 fixes the local prelink helper to merge the OS-profile prelink table and board overrides. A real prelink of the 0238 native kernel succeeded with 32 roots and automatic slide -0xb9c000, 53788672 bytes, SHA-256 bb33682837f1807ef28d385cf09acf94f2749f49b3f7337d22348dcbf6c4b9df. Use --profile/--kit for non-sibling checkouts."]
completion = ["Kernel and prelink succeed, payload contains all declared inputs, and the boot image matches the bootloader format and size limit."]
limits = ["Hardware inputs and implementation are pending for this board."]
next_action = ["Inventory the required image assembly inputs before implementation."]
evidence = [{ kind = "host", reference = "https://github.com/Emilelu/UniXNU/actions/runs/40650877574", result = "Build kernel succeeded on macOS from this revision: prelink slide -0xb9c000, 54419456 bytes, lowest component extent 0xfffffff004426600", command = "./unixnu build kernel -D ../UniXNU-mondrian", revision = "6a10bf5e42ecfad7eed2789cc091287d31009623" }, { kind = "host", reference = "scripts/verify-boot-img-payload.py", result = "Route a-18 chain reproduces end to end: kernel 20,872,544 B (15966fcd) -> prelink 54,808,576 B -> payload 201,326,592 B -> boot-darwin24-bc6.img. The verifier confirms the kernel slot is the 112-byte shim plus the rebuilt FD, the ramdisk slot is byte-identical to payload.img, and the in-volume kernel.macho matches the built kernel.", command = "python3 scripts/k60-prelink-darwin24.py && python3 scripts/verify-boot-img-payload.py --img /mnt/d/Android/k60-ios/boot-darwin24-bc6.img --payload /tmp/k60build/out/mondrian/ipados-18.7.10-22H374/mondrian/payload/payload.img --kernel /tmp/k60build/out/mondrian/ipados-18.7.10-22H374/mondrian/kernel/kernel.macho", revision = "e636e445b621bed4fac0069f3604b87061350a8d" }]


schema_version = 1

[device]
name = "opd2515"
soc = "SM8845"
os_profile = "ios-16.5-20F66"
summary = "OPPO Pad mini 5G (OPD2515, SM8845P / Alor) experimental UniXNU port. The BDS fastboot path, payload, DarwinBoot handoff and first XNU entry probe are device verified; MMU completion, storage, root volume and userland are not."

[[area]]
id = "configuration"
status = "host-verified"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "porting.toml", "feeds.toml", "unixnu.lock", "patches/unixnu/**", ".github/**"]
inputs = ["Use the live OPD2515 device tree and sysfs identity for SM8845P / Alor, 1680x2520, 6 GiB handoff window.", "Use UniXNU upstream 8ec13bb1077502e53e8ba3b82c56842589b5c837 plus the OPD2515 patch series for the iOS 16.5 profile and firmware changes."]
configuration = ["Board is opd2515, SoC is SM8845, profile is ios-16.5-20F66 and the selected components are ArmDTPlatform, ArmCpu, SoftwareAES, XnuPrelink and DarwinBoot.", "The platform seed stays local as UNIXNU_UNIQUE_CHIP_ID and is never committed."]
procedure = ["Run python3 ../UniXNU/scripts/porting-record.py check --device . with the pinned UniXNU source.", "Validate that the generated OPD2515 patch applies to the pinned upstream commit."]
findings = ["The recovery identity macan / OnePlus_15R is donor metadata; the live fingerprint oplus/ossi/ossi and device tree identify this tablet.", "The active bootloader is stock GBL/BDS. No replacement firmware partition is needed or permitted for bring-up."]
completion = ["board.toml, porting.toml and feeds.toml parse and agree.", "All selected components and the fixed source revision resolve in the UniXNU checkout.", "The platform seed and vendor inputs remain outside Git."]
limits = ["Only the entry-probe component set is configured. Storage, display, input, GPU, network, audio and power components are intentionally absent."]
next_action = ["Re-run this record check after every board or profile change and after any UniXNU rebase."]
evidence = [
  { kind = "host", reference = "docs/evidence/porting-check.txt", command = "python3 ../UniXNU/scripts/porting-record.py check --device .", revision = "de8962a9bcf838bfc16b8571f43449663d094194", result = "All 13 structured areas parsed and validated." },
  { kind = "host", reference = "docs/evidence/s9-host-validation.txt", command = "python3 scripts/verify.py", revision = "840fbdb4f7260dedcde53a10dc5c437ef28e30b8", result = "Records the S9 stage-3 artifact hashes and host readback checks." },
  { kind = "source", reference = "patches/unixnu/0001-feat-opd2515-advance-firmware-boot-to-XNU-handoff.patch", result = "Reproducible patch from upstream main 8ec13bb1077502e53e8ba3b82c56842589b5c837." },
]

[[area]]
id = "firmware"
status = "device-verified"
components = ["XnuPrelink", "DarwinBoot"]
paths = ["package/unixnu.toml", "patches/unixnu/**", "tools/**", "docs/evidence/**"]
inputs = ["Stock GBL/BDS fastboot environment, a valid boot image generated by the device package, and Apple-derived payload inputs supplied locally.", "DarwinBoot and a bundle-format trust cache for XNU 8796 iOS 16.5."]
configuration = ["The payload uses volume OPD2515, a 208 MiB FAT image and one DarwinBoot driver entry.", "The boot image uses header version 0, 4096-byte pages, base 0x10000000, kernel offset 0x8000 and tags offset 0x100."]
procedure = ["Build the OPD2515 package, verify every payload member and boot-image segment, then use fastboot boot only.", "After each run, enter OrangeFox/REC and read the authorized userdata-tail log without formatting userdata."]
findings = ["BDS discards the Android boot-image ramdisk, so the EFI application scans the retained fastboot buffer and republishes it as a block device.", "DarwinBoot path LoadImage was denied by Security2; loading from a private memory buffer while retaining firmware Security2 validation succeeded."]
completion = ["BDS enumerates the image, executes UniXNU, loads DarwinBoot and reaches the kernel handoff with no signature error.", "The latest source revision is retested on hardware after any rebase."]
limits = ["S8 is device verified from the pre-rebase image. The S9 stage-3 image is host verified only.", "No firmware partition may be modified."]
next_action = ["Boot the S9 image once in BDS and record whether the green, blue and magenta checks are followed by a reset after about six seconds."]
evidence = [
  { kind = "device", reference = "docs/evidence/s8-darwinboot-xnu-handoff.jpg", command = "fastboot boot <validated-opd2515-boot-image>", revision = "de8962a9bcf838bfc16b8571f43449663d094194", result = "DarwinBoot printed inputs validated, exited boot services and handed off to the kernel." },
  { kind = "host", reference = "docs/evidence/s9-host-validation.txt", command = "python3 scripts/verify.py", revision = "840fbdb4f7260dedcde53a10dc5c437ef28e30b8", result = "S9 adds only the six-second MMU-post-enable reset probe and passes host readback." },
  { kind = "source", reference = "patches/unixnu/0001-feat-opd2515-advance-firmware-boot-to-XNU-handoff.patch", result = "Adds boot ramdisk recovery, persistent diagnostics and the Security2-safe DarwinBoot load path." },
]

[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu", "SoftwareAES"]
paths = ["configs/opd2515_defconfig", "dts/opd2515.dts", "patches/xnu/**", "docs/evidence/**"]
inputs = ["Eight-core PSCI topology, GICv3, 19.2 MHz generic/system timers and software AES from the SM8845 shared source."]
configuration = ["opd2515_defconfig enables the DT platform, ArmCpu, native architectural timer, native AES, panic region and runtime trust cache.", "UFS, virtio block, display, Adreno, RAM block and armvirt personality remain disabled during the entry probe."]
procedure = ["Build the prelinked XNU payload and inspect it for the stage 1, stage 2 and panic-screen changes before booting."]
findings = ["The entry stub executes far enough to produce the blue and magenta checks, but this is not evidence that full CPU discovery or interrupt setup completed."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling is verified on hardware."]
limits = ["No secondary-CPU or interrupt-controller result is currently proven by the XNU entry evidence."]
next_action = ["Boot S9 and measure the reset delay after the green, blue and magenta checks; do not add storage or display work before the MMU transition is proved."]
evidence = [
  { kind = "source", reference = "patches/xnu/zzz-boot-progress.patch", result = "Defines the green, blue and magenta boot progress checkpoints." },
  { kind = "device", reference = "docs/evidence/s8-post-handoff-unixnu-menu.jpg", command = "fastboot boot <validated-opd2515-boot-image>", revision = "de8962a9bcf838bfc16b8571f43449663d094194", result = "Blue and magenta bars were visible after DarwinBoot handoff." },
  { kind = "host", reference = "docs/evidence/s9-host-validation.txt", command = "python3 scripts/verify.py", revision = "840fbdb4f7260dedcde53a10dc5c437ef28e30b8", result = "S9 contains a single six-second MMU-post-enable reset checkpoint; device timing is pending." },
]

[[area]]
id = "memory"
status = "host-verified"
components = ["ArmDTPlatform"]
paths = ["board.toml", "dts/opd2515.dts", "docs/evidence/memory-window-audit.txt", "configs/opd2515_defconfig"]
inputs = ["Live OPD2515 memory nodes, reserved-memory regions, PSCI/GICv3 data and the 1680x2520 framebuffer geometry."]
configuration = ["The first bring-up owns one contiguous 6 GiB window from 0x980000000 to 0xB00000000.", "The framebuffer is described at 0xFC800000 with size 0x2B00000."]
procedure = ["Compare the chosen handoff window against all fixed reserved-memory nodes and compile the device tree before packaging."]
findings = ["The 6 GiB window has no overlap with the 57 fixed reserved-memory nodes in the captured live device tree.", "The ADT handoff exposes a 32-bpp 1680x2520 framebuffer with 6720-byte rows."]
completion = ["The handoff map is internally consistent and no reserved region overlaps the selected window.", "A future XNU platform expert must re-audit the full physical map after MMU enable."]
limits = ["The static audit covers only the entry-probe window and does not prove XNU memory initialization."]
next_action = ["After the MMU checkpoint is passed, capture the kernel's memory map and recheck all high-memory ranges."]
evidence = [
  { kind = "host", reference = "docs/evidence/memory-window-audit.txt", command = "python3 scripts/verify.py", revision = "de8962a9bcf838bfc16b8571f43449663d094194", result = "Parses the repository metadata and confirms the documented 6 GiB handoff window and framebuffer evidence are internally consistent." },
  { kind = "source", reference = "dts/opd2515.dts", result = "Board memory and framebuffer reservation used by the current entry probe." },
]

[[area]]
id = "storage"
status = "planned"
components = []
paths = ["board.toml", "package/unixnu.toml", "tools/read-log-device.sh", "tools/decode-boot-log.ps1"]
inputs = ["The XNU UFS controller, UFS host, SMMU, GPT and future OS/SystemOS/Data windows are not yet implemented.", "The UEFI diagnostic path sees userdata through EFI_PARTITION_INFO_PROTOCOL for a 4 MiB tail window."]
configuration = ["UEFI diagnostics locate GPT partition userdata and write only the last 4 MiB after explicit authorization.", "The XNU defconfig currently disables NativeUfs and has no root-volume handler."]
procedure = ["Use OrangeFox/REC only to read the UEFI diagnostic tail; never format userdata or write a boot partition."]
findings = ["On the 491,334,463,488-byte userdata partition, the diagnostic window begins at 491,330,207,744 and does not imply XNU storage support."]
completion = ["The XNU UFS driver registers the controller, reads the GPT and mounts the configured root without touching unrelated windows."]
limits = ["Storage and root are not started. The persistent EFI log is the only implemented storage operation."]
next_action = ["Keep storage disabled until the MMU transition and panic path are observable."]
evidence = []

[[area]]
id = "display"
status = "device-verified"
components = ["ArmDTPlatform"]
paths = ["dts/opd2515.dts", "package/unixnu.toml", "patches/xnu/zzz-boot-progress.patch", "docs/evidence/**"]
inputs = ["The live framebuffer is 1680x2520, 32 bpp, row stride 6720 bytes at 0xFC800000."]
configuration = ["The boot-image DTB publishes the cont_splash_region and package menu uses the same framebuffer geometry.", "DarwinBoot receives the framebuffer base from the EFI handoff."]
procedure = ["Use the early color bars and UniXNU menu as the first display acceptance, then inspect DarwinBoot text before attempting an XNU display driver."]
findings = ["UniXNU and DarwinBoot text are visible at the correct geometry and scale.", "The blue and magenta bars prove the kernel entry probe can draw before MMU setup."]
completion = ["A panel driver preserves the verified geometry, colors and backlight controls and a Metal client presents to the display."]
limits = ["No XNU-native panel driver, backlight service or GPU presentation is implemented."]
next_action = ["Do not start panel work until the kernel reaches a stable post-MMU diagnostic path."]
evidence = [
  { kind = "device", reference = "docs/evidence/s8-darwinboot-xnu-handoff.jpg", command = "fastboot boot <validated-opd2515-boot-image>", revision = "de8962a9bcf838bfc16b8571f43449663d094194", result = "DarwinBoot text and framebuffer geometry are visible on hardware." },
]

[[area]]
id = "input"
status = "device-verified"
components = []
paths = ["package/unixnu.toml", "docs/evidence/**", "README.md"]
inputs = ["Firmware-provided ConIn events from the tablet's physical volume keys and power button."]
configuration = ["The UniXNU menu uses the stock firmware console input and a three-second countdown."]
procedure = ["Use volume keys to pause and traverse the menu; power confirms an entry only when an intentional test is required."]
findings = ["The user successfully paused the menu and selected entries with physical keys in S4 through S8."]
completion = ["Touch digitiser, touch HID and XNU-side hardware buttons are implemented and verified."]
limits = ["Only firmware ConIn is verified; no XNU touch or button driver exists."]
next_action = ["Keep firmware input for diagnostics until XNU display and storage are available."]
evidence = [
  { kind = "device", reference = "docs/evidence/s8-post-handoff-unixnu-menu.jpg", command = "fastboot boot <validated-opd2515-boot-image>", revision = "de8962a9bcf838bfc16b8571f43449663d094194", result = "The UniXNU menu and countdown were navigable with physical volume keys." },
]


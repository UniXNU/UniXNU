[[area]]
id = "packaging"
status = "host-verified"
components = ["XnuPrelink", "DarwinBoot"]
paths = ["package/unixnu.toml", "scripts/**", "tools/**", "patches/xnu/**", "docs/evidence/s8-host-validation.txt", "docs/evidence/s9-host-validation.txt"]
inputs = ["Apple-derived kernel/ADT/trust cache inputs remain local.", "The build requires an iOS 16.5 profile and a platform seed supplied outside Git."]
configuration = ["The package has one DarwinBoot driver and two menu entries: XNU and return to firmware.", "Kernel args are -v and serial=3 and the menu timeout is three seconds."]
procedure = ["Run the porting-record checker, package preflight, full package build and payload readback.", "Inspect every artifact size and SHA-256 before any device test."]
findings = ["The trust cache must be a DarwinBoot-compatible v2 bundle rather than the original Apple IM4P.", "S9 changes only 64 kernel bytes to add the six-second MMU-post-enable reset checkpoint; all other payload members and boot-image segments match S8."]
completion = ["Kernel and prelink succeed, payload members match their sources, boot segments match, and the resulting image passes a controlled fastboot-boot test."]
limits = ["The S9 package is host verified; the latest device milestone remains S8 from the pre-rebase image.", "Host readback does not prove that the MMU-enable instruction executes."]
next_action = ["Publish hashes with each build, keep generated binaries out of this repository, and attach the S9 device timing before claiming MMU progress."]
evidence = [
  { kind = "host", reference = "docs/evidence/s8-host-validation.txt", command = "python3 scripts/verify.py", revision = "de8962a9bcf838bfc16b8571f43449663d094194", result = "Records the post-rebase artifacts, sizes and SHA-256 values plus payload readback checks." },
  { kind = "host", reference = "docs/evidence/s9-host-validation.txt", command = "python3 scripts/verify.py", revision = "840fbdb4f7260dedcde53a10dc5c437ef28e30b8", result = "Records the S9 single-variable kernel change, immutable payload members and final image hash." },
  { kind = "source", reference = "package/unixnu.toml", result = "Defines the XNU menu, DarwinBoot driver and return action." },
]

[[area]]
id = "diagnostics"
status = "device-verified"
components = []
paths = ["docs/evidence/**", "tools/read-log-device.sh", "tools/decode-boot-log.ps1", "README.md", "STATE.md", "PROGRESS.md"]
inputs = ["Early framebuffer colors, UniXNU status lines and the authorized userdata-tail log provide diagnostics without a serial console."]
configuration = ["The 4 MiB tail window contains a generated header and text; the menu displays ramdisk and log state.", "DarwinBoot and the kernel entry probe provide green, blue and magenta checkpoints.", "S9 enables only the official stage-3 reset probe with a six-second delay after the MMU-enable instruction."]
procedure = ["Capture screen and photos, then read the exact userdata tail through REC after each failed boot.", "Record timestamp, last UNIXNU/DARWINBOOT lines and whether the screen reset, returned or stalled."]
findings = ["S8 reached DarwinBoot handoff and the magenta entry checkpoint, then a new UniXNU menu appeared without a confirmed timing cause.", "S9 reached the same green, blue and magenta checkpoints and then hard-reset after a user-observed delay of several seconds; exact timing was not measured.", "After the S9 reset, Android reported ro.boot.bootreason=reboot, on OPD2515."]
completion = ["A reproducible command, source/image revision and accessible result accompany every claimed hardware milestone."]
limits = ["No serial console is available and the XNU path cannot use EFI services after boot-services exit.", "The S9 hard reset is a preliminary MMU-post-enable result, but the exact magenta-to-reset interval remains unknown."]
next_action = ["Repeat S9 unchanged with a stopwatch or video. If reset occurs at about six seconds, mark stage 3 final and test stage 4 after _arm_vm_init in _arm_init."]
evidence = [
  { kind = "device", reference = "docs/evidence/s8-darwinboot-xnu-handoff.jpg", command = "fastboot boot <validated-opd2515-boot-image>", revision = "de8962a9bcf838bfc16b8571f43449663d094194", result = "Shows DarwinBoot validation and handoff messages." },
  { kind = "device", reference = "docs/evidence/s8-post-handoff-unixnu-menu.jpg", command = "fastboot boot <validated-opd2515-boot-image>", revision = "de8962a9bcf838bfc16b8571f43449663d094194", result = "Shows the green, blue and magenta checkpoints and the later UniXNU menu." },
  { kind = "host", reference = "docs/evidence/s9-host-validation.txt", command = "python3 scripts/verify.py", revision = "840fbdb4f7260dedcde53a10dc5c437ef28e30b8", result = "Records the S9 reset-probe construction and host readback; device timing remains pending." },
  { kind = "device", reference = "docs/evidence/s9-entry-bands-reboot.jpg", command = "fastboot boot <S9-boot-image with SHA-256 FA3930AE...>", revision = "840fbdb4f7260dedcde53a10dc5c437ef28e30b8", result = "Shows green, blue and magenta after DarwinBoot handoff; the user then observed a hard reset after several seconds." },
]

findings = ["Only the pre-MMU framebuffer color bars exist; no GPU command stream executes."]
completion = ["A known image renders through the intended display and Metal client with correct fencing and memory policy."]
limits = ["No GPU code or hardware result exists."]
next_action = ["Keep Adreno disabled and revisit after userland bring-up prerequisites."]
evidence = []


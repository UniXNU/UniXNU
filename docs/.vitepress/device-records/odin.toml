evidence = [
    { kind = "source", reference = "https://github.com/UniXNU/uefi-sheng/tree/main/Platforms/Xiaomi/venusPkg", result = "odinPkg generated by mechanical renaming of the proven venus package: odin.dsc, odin.fdf, APRIORI and DXE driver order, DeviceBuild.py and the configuration map, with the venus panel descriptions replaced by the verified odin values" },
    { kind = "source", reference = "https://github.com/Project-Silicium/Silicium-ACPI/blob/2d465ad77c25de908f0ec7bdfcb57f865b61233c/Platforms/Xiaomi/venus/AcpiTables.inf", result = "the firmware's ACPI manifest is a submodule file, not a device-package one: [Binaries] with the device DSDT.aml, Common/SSDT.aml and Lahaina/APIC+FACP+GTDT, with a FILE_GUID shared by every device in the repository - so odin needs only its own DSDT, and the SM8350 SoC tables are already published" },
    { kind = "source", reference = "https://github.com/Project-Silicium/Silicium-ACPI/tree/2d465ad77c25de908f0ec7bdfcb57f865b61233c/Silicon/Qualcomm/Lahaina", result = "APIC, DBG2, FACP, GTDT, IORT, MCFG, PPTT with decompiled .dsl sources plus DSDT_Minimal.asl (eight ACPI0007 CPU devices) and venus/Decompiled/DSDT.dsl, a 926 KB table dumped from a real SM8350 unit; used as an independent cross-check of this port's register map - UFS host, apps SMMU, kgsl SMMU, debug UART, mdss, the four gfx/GPU_CC windows and the GENI wrapper blocks all agree, ACPI merging per block what the device tree lists per function" },
]

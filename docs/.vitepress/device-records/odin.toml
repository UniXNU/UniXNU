schema_version = 1

[device]
name = "odin"
soc = "SM8350"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Mi MIX 4 (Snapdragon 888+). Inputs and shared-support gaps live in FACTS.md; no hardware value below is measured until the device rows there close."


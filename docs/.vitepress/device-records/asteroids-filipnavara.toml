findings = ["2026-11-13 (irq1): BootLog prints the driver's job times ([gpu jobs], [gpu long], [gpu slow], from UniXNU-sheng fecc4c2) and fence waiters ([fence wake]). The compositor's (backboardd) frames take about 10 ms of GPU time at 895 MHz (34 IBs, 278 KiB); the long ones 41-58 ms with 60-128 IBs. 2797 of 7276 jobs ran over 8 ms. The GPU itself is the frame-time limit, not queueing.", "iOS 27 builder (2026-11-04, not built yet): scripts/build-native-legacy-display-27.py is sheng's build-gop-legacy-display-27.py (UniXNU-sheng 965460a) with the IPSW device's fixtures (d48ap: legacy-display-24A446-d48.json, hid-device-24A446-d48.json), IOMobileGraphicsFamily's text range from the fixture (family_text, the iPad range moved by its kext offset) in place of the iPad constant, kits/asteroids, and this board's drivers from the iOS 17 builder (CPU frequency, panel and brightness, TFA9873 speaker and audio DSP, battery, buttons, FocalTech touch over GENI SPI, GPU power with NativeAdreno's staged classes and the gen8 kits) compiled with the 27 kernel flags. The HID event driver is compiled against the profile's pinned public IOHIDFamily (NATIVE_HID_SOURCE_API) and bound to the original IOHIDDevice by sheng's slot and discriminator rules. Sheng's generated support file stubs boot progress (none on 27); our LegacyDisplayStubs.c is weak. The Metal accelerator comes from UniXNU's build-adreno740-accelerator.py (d48ap plan). Sheng's two-pass kernel build (native-slide in cycle27.sh) is not needed: the builder binds fixed collection addresses and XnuPrelink recomputes the adapter branches.", "The display area owns only the 24A446 display and HID fixtures and their remap tools by name; scripts/policies (iOS 27 root policies) belongs to storage.", "iOS 27 (2026-11-04): scripts/legacy-display-24A446-d48.json and hid-device-24A446-d48.json are sheng's iPad17,3 class fixtures remapped and verified for the iPhone17,4 kernelcache (details in the configuration area); the iOS 27 display builder that uses them is not written yet.", "T37 (2026-10-26): DSI0 is reachable under Gunyah (T37a st=1), the brightness test ran (T37b), and with asteroids-panel=3 iOS sets the brightness and sleep turns the panel off and on again (T37d). It is a board default since then.", "T37: the panel (Visionox RM69220 AMOLED, video mode, DSI0 at 0x0ae94000, dsi-ctrl v2.8) takes DCS commands through the controller's TPG command FIFO, scheduled for the first front-porch line (package/PanelProbe.cpp, asteroids-panel=1..4): brightness 51 hi lo (10..4095), off 28 + 10, on 11 + 29. The iOS brightness service is sheng's AppleARMBacklight.cpp with the DCS write instead of I2C (package/AsteroidsBacklight.cpp); level 0 turns the panel off.", "The CPU copy (143-285 ms a frame) mapped the surfaces cacheable without invalidation and showed stale patches; the GPU copy removes both.", "GopFramebuffer 33e941a's direct scanout needs ShengUfs's display SMMU window (native_ufs_dpu_map); our NativeUfs fork has none, so package/LegacyDisplayStubs.c supplies weak zero stand-ins that keep it off.", "T40c (2026-10-27): BootProgress.c's cpu0_park defaults off (see cpu).", "T40k-T42 (2026-10-27): zero copy on the 3a. NativeUfs sheng-dpu-linux=1 sets the display bank up as Linux does: CBA2R and CBAR written (the apps SMMU is qcom,virt-smmu and the hypervisor attaches the bank on that write), TCR2 with the ASID size and SEP, cached inner-shareable walks with T0SZ 28, TTBR0 with an ASID. The bank then took stage 1 without a fault (T40k), where every earlier setup faulted at level 0, even with blocks lacking the access flag (T40i-af). T41: 1018 direct flips, 4.4 ms mean latch, once startDirect waited for the bank (40 ms); frames showed half drawn (the wallpaper without the app), so T42 flips only once the GPU's completed fence reaches the newest fence submitted at the swap.", "T42 (2026-10-28): the GPU wait never ran (0 of 1272 flips), yet opening apps still alternated the new frame with the wallpaper alone. The original completion (IOMobileFramebufferLegacy slot 295, its body at 0xfffffff00578a96c in 21H461) clears the current swap and releases its surfaces, and it ran as soon as a swap latched: the compositor got back the surface still on screen and drew its next frame over it. T43: sheng-dpu-hold=<ms> keeps the shown swap current until the next latch (or <ms> without a new swap) and only then completes it; [direct scanout] held / timed out count the two.", "T44: [direct scanout] adds frame gaps (flip to flip: up to 17, 25, 34, 50, 100 ms, longer, the longest under a second), to measure the frame rate opening an app reaches under blur.", "T43-copy (2026-10-28): copy mode felt slower and choppier than older builds. Its log (25 minutes) shows the copy path as before: 5310 GPU copies, none failed, no CPU throttling. The session was heavier, though: two wallpaper renderers (PosterBoard, CollectionsPoster) on the GPU, 691 MB of GPU memory against 345-582 MB, and seven times the time freeing it. Every counter covers the whole boot. T46: the [frames] row counts frames shown by copy and by flip and the gaps between them (T44's flip-only histogram moved there).", "T46 (2026-10-28): zero copy with the end-of-submission GPU cache flush still alternated the new frame with the wallpaper alone. 1102 flips in 78 s: 68 % of the gaps 17 ms or less, 17 % up to 25 ms, 3 % over 50 ms. T47 reverts the guesses that did not fix it: the GPU wait (904bccf) and the frame hold (8393a37) in GopFramebuffer (d4f7b59, the direct path is a5fc6bf's again), keeping the frame counting.", "T47 review (2026-10-28): T42's flip wait never waited. It found the GPU's fence page through NativeAdreno's native_adreno_fence_phys, which only NativeAdreno's service sets; this board attaches the ring in GpuPowerProbe, so it stayed 0 (no [fence page] row in any log) and gpuCaughtUp() always answered done. 'No flip waited for the GPU' therefore says nothing. T48: sheng-dpu-probe=1 samples what the display fetches (4 x 4 luminance grid through an uncached mapping) at the flip, the latch, each refresh tick and when the surface leaves, with the real fences (GpuPowerProbe native_gpu_fences); sheng-dpu-flipdelay=<us> and sheng-dpu-gpuwait=1 test late GPU work. T47-copy: copy mode is GPU-bound (23 % of frames within 17 ms against 68 % with zero copy; 435 of 1507 busy windows at the ceiling).", "T49: [mic peaks] (the capture's peak per second and its start time) and BTN taps=.", "T49-probe/T49-gpuwait (2026-10-28): the flicker's cause is flipping to frames the GPU has not finished. With the probe, 663 of 703 flips found GPU work outstanding and 277 surfaces changed between flip and latch (222 more before leaving the screen, none on a refresh tick while shown). Waiting for every submission made before the flip (the real fences from GpuPowerProbe) gave 0, 0 and 0 over 821 flips, 691 waits over 1 ms, longest 23.6 ms, and no visible flicker; smoothness felt like copy mode. T50 makes it the default: board.toml sets sheng-dpu-scanout=2 and sheng-dpu-linux=1, GopFramebuffer waits unless sheng-dpu-gpuwait=0.", "T51: [frame time] splits each frame into compositor time, swap to screen and flip to latch; [frames] gains a 9 ms (120 Hz) bucket. The panel is advertised as 24-120 Hz (sheng-vsync=120).", "T51: per frame, compositor time had a wide spread, swap to screen 8-12 ms (the GPU), flip to latch 4.5 ms mean; they run in series because the compositor starts the next frame only when the swap completes. T52: sheng-dpu-early-done=1 completes a direct swap when its flip is programmed.", "T53: the boot log gains [gpu work] (BootLog.c), the GPU work per submission by render passes against its GPU time.", "T54: the boot log gains [gpu sysmem why]; [gpu work] drops the draw count.", "T55: the boot log gains [gpu ops] (GPU time per kind of work).", "T61: BootProgress.c also anchors boot_diag_scan_gpu (BootDiagExport.c), which the periodic GPU trace export (sheng-gpu-trace-export, see diagnostics) calls; its rounds include the half-resolution screen, so a trace comes with what was shown.", "T62: BootLog.c gains the [gpu tables] and [gpu recovery] rows (see diagnostics).", "T64 (2026-10-29): build-native-legacy-display.py no longer checks board.toml gpu_pool_* against GpuPowerBoard.h (both gone with the BO pool); BootLog's [bo pool] row is [bo memory] (diagnostics area).", "T64: BootLog.c adds the [gpu uc] rows (diagnostics area).", "T65: the boot log adds a [bo pool] row (native_adreno_pool_stats): pool MiB and chunks, the reservation's and write-combine's IOReturn, BOs from the pool, BOs sent to the system, MiB in use and peak.", "T73 (2026-10-30): native_legacy_display_late_probe records which probe bsd_autoconf's thread is in (native_late_probe_step) and the thread itself, for the boot log's [late probe] and [kernel threads] rows (T67 and T72 hung inside it).", "T76 (2026-10-30): the board classes here register through OSKextRegisterBoardClasses (zzyg-board-class-registration.patch), under the kext lock, in place of preModLoad/postModLoad alone, which deadlocked T75f's boot (storage area).", "T76's first kernel build (run 41109301209) failed: XNU has no kOSReturnNoMemory; OSKextRegisterBoardClasses and its callers use kOSKextReturnNoMemory (libkern/OSKextLib.h), and the helper has a prototype before its definition.", "T76's second kernel build (run 41111730079) failed in ShengPlatformPower.cpp: BoardClasses.h had been included after the file's last #include, which there sits inside the ShengPlatformPower class; every probe now includes it after its first #include.", "T89 (2026-11-02): BootLog.c prints the microphone's [mic port] row (native_mic_port, audio area) after [mic regs]; BootLogStandins.c gives it a weak stand-in.", "T93 (2026-11-02): BootLog.c prints [mic codec] (native_mic_codec, audio area) after [mic port]; BootLogStandins.c gives it a weak stand-in.", "T94 (2026-11-02): [mic codec] prints whenever [mic port] does.", "T95 (2026-11-02): BootLog.c prints [mic page] (native_mic_page, audio area) after [mic codec]; BootLogStandins.c gives it a weak stand-in.", "iPadOS 27 (2026-11-10): LegacyDisplayProbe publishes the GOP nub as a plain IOService (an IOPlatformDevice under IOResources failed PAC in compareName) and skips interpose() under ptrauth (its vtable copy hit a PAC-signed pointer in memmove); AsteroidsBacklight overrides getMetaClass instead of copying a vtable.", "iPadOS 27 GPU presentation (2026-11-11): the display takes frames from the GPU copy (gpu-addon=1 fb-gpu=1); native_legacy_gpu_offer must pass the frame's format to native_gop_gpu_offer (without it the screen stayed black), and swaps wait for the GPU fence or copy. Zero-copy scanout (dpu-scanout=2) is off: it presented no frame on 27. Graphic artifacts remain.", "2026-11-13: the board build links only the ath11k Wi-Fi module (scripts/build-native-legacy-display-27.py: the qcacld selector was removed with the abandoned qcacld path).", "2026-11-13: iPadOS 27 composited in half float ('RGhA', 20184K swap surfaces) because vmm-present makes MobileGestalt answer IsVirtualDevice, on which QuartzCore's IOMFBDisplay::framebuffer_pixel_format keeps RGhA. board.toml's text fixup (dyld_shared_cache_arm64e.01+0x4061928, tbnz to NOP, as sheng's macOS 27.3) makes it 8-bit BGRA: 10168K surfaces, mean GPU time per submission 9.9 to 7.8 ms, submissions over 17 ms 26 to 19 %, windows at the GPU clock ceiling 29 to 13 % (bofix2 against bgra1); smoother, no new artifacts. Direct scanout (dpu-scanout=2) can now take the frames.", "2026-11-13: zero-copy scanout on iPadOS 27 (logs/zc1). UniXNU's GopFramebuffer (b0d812d) hard-codes sheng's pipes (VIG 0 and 1, flush 0x3) and boot memory (0xb8000000, stride 0x2fa0); drivers/GopFramebuffer asteroids-27 (6191d8f) ports the asteroids fork's dpu-flush pipe choice and the GOP's boot memory onto it. With 8-bit frames: 2749 direct flips, 3 surfaces mapped, no map failures, latch 4.9 ms mean and 8.9 ms at most, no GPU copies; GPU submissions 8171 to 3592 and GPU time 64.1 to 44.7 s against the GPU copy (bgra1); the screen works."]
completion = ["The desktop presents through the legacy display with measured frame times."]
limits = ["Graphic artifacts on iPadOS 27; under 60 frames per second."]
next_action = ["Find the source of the iPadOS 27 artifacts.", "Measure the frame gaps with zero copy ([frames] rows) and look at what keeps the GPU busy per frame."]


[[area]]
id = "network"
status = "implemented"
components = ["Ath11kWifi"]
paths = ["package/Wifi*", "package/AsteroidsWifi.cpp", "package/WpssProbe.cpp", "drivers/Ath11kWifi/**", "scripts/*wifi*", "scripts/decode-wpss-diag.py", "dts/asteroids.dts", "scripts/*wcn*", "scripts/vendor-fwlog-to-fwd.py"]
inputs = ["The WCN6750 behind the WPSS (the vendor's wpss.mdt, regdb and board data from vendor_b), its 32 kHz sleep clock on PMK8550 GPIO5, and the network's name and key for test images (UNIXNU_WIFI_JOIN, never committed)."]
configuration = ["wifi=5 starts the WPSS (PAS, SMP2P, GLINK, QRTR) and the module: Linux ath11k, mac80211 and cfg80211 over drivers/Ath11kWifi's runtime, wpa_supplicant for WPA2. WifiNet (sheng's, unchanged) gives iOS en0 and the Apple80211 requests; the dts exports a wlan node so launchd starts wifid.", "AsteroidsWifi.cpp enables the sleep clock (wifi-sleepclk), attaches the 16 MSI vectors ath11k uses as GIC SPIs (wifi-irq=0 polls every millisecond instead) and keeps a 20 ms backstop poll (wifi-irq-poll). The radio's address goes to the device tree for MobileGestalt. wifi-idle-ps (default 1) lets the firmware use IMPS. wifi-aj=1 (test images) joins the network of the Data add-on's join.txt."]
procedure = ["Build a join image with UNIXNU_WIFI_JOIN and wifi-aj=1, fastboot boot it, pull the log; the wifi-net rows show the join, DHCP, en0 address and packet counts, the wifi: load row the worker's rounds and interrupts per second."]
findings = ["Settings shows the Wi-Fi row and page, lists networks and joins one, and web pages load (wifi91, 2026-11-13): the board writes the radio's address to /chosen/mac-address-wifi0 and /arm-io/wlan local-mac-address (as sheng 3e679fb), where MobileGestalt reads WifiAddress and WifiAddressData; without them Settings had no Wi-Fi.", "The firmware's scan asserts (whalRxMpduPop, wal_monitor, whalRecvDmaLeakRecovery) were the missing WCN sleep clock: UEFI leaves PMK8550 GPIO5 off; with it on, IMPS works and scans complete (wifi78).", "Association and WPA2 work (wifi79). Broadcast and multicast frames were dropped as unprotected until ath11k rebuilt their IV from the descriptor's PN words: the WCN6750 stores no IV for decrypted group frames (wifi87).", "wifi87/88: DHCP from iOS's own client (192.168.1.148), IPv4/IPv6/ARP traffic both ways (35k packets in by 280 s in wifi89). The one remaining mac80211 drop (0x1000f) is the AP relaying the station's own broadcasts.", "Interrupts (wifi88): 16 of 32 vectors fit ArmCpu's 24 SPI slots; the worker went from about 1000 to 6-150 rounds per second.", "wifid (wifi89/90): with the wlan node, wifid opens en0's Apple80211 interface; iOS then sets the clock from the network about 3 minutes after boot. Settings' Wi-Fi page works since wifi91.", "qcacld (Qualcomm's host driver) built on an icnss backend but did not fit the kernelcache's code window (about 2.3 MB over); it was removed with the other dead ends of the bring-up (2026-11-13): the vendor-audit switches (wifi-wmi-vendor, wifi-dp-vendor, wifi-qmi-vendor, wifi-fse, wifi-ddr), the translated SMMU window (wifi-iommu), the register snapshots against the vendor stack (wifi-regdump), the firmware post-mortem reader and the board's DHCP probe. The git history keeps them."]
completion = ["The device joins a network and passes traffic.", "Settings shows and controls Wi-Fi, and the status bar shows it."]
limits = ["Several Apple80211 requests of wifid are answered 102 (unsupported). Bluetooth is not started."]
next_action = ["Boot a regular board image (wifi=5 is in board.toml's iOS/iPadOS 27 kernel arguments since 2026-11-13) and check Wi-Fi comes up without the test flags.", "Answer the Apple80211 requests wifid still gets 102 for; check that a join from Settings survives a reboot (remembered network) without wifi-aj; Bluetooth."]


[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu"]
paths = ["package/CpuFreq*", "patches/xnu/**", "patches/xnu-12377/**", "dts/**"]
inputs = ["Four Cortex-A520 (cpus 0-3, EPSS domain 0) and four Cortex-A720 (4-6 domain 1, 7 domain 2); EPSS domains at 17d91000/17d92000/17d93000.", "Gunyah hypervisor: SGIs are not delivered, so IPIs use armcpu-spi-ipi=1."]
configuration = ["sheng-smp=1 and armcpu-spi-ipi=1 in board.toml; unixnu,cluster-type E/P in dts/asteroids.dts; sheng-cpufreq=<mode> selects the CPU governor."]
procedure = ["Boot with sheng-cpufreq=1 and the banner on, read the CPU row (domain state and LUT), then sheng-cpufreq=4."]
findings = ["The CPU governor is sheng's CpuFreqProbe with 4/3/1 CPUs per domain and no L3 vote (the 3a has no EPSS L3).", "patches/xnu-12377 (iOS 27 profile, 2026-11-04) takes sheng's xnu-12377 CPU idle helper and E/P Edge scheduler (zzye, zzyf) in place of our xnu-10063 copies; the xnu-10063 zzyf also set __ARM_AMP__ and two clusters in BCM2837.h, which sheng's xnu-12377 zzyf leaves to its iPadOS 27 bring-up patch (not yet checked on the 3a).", "The E/P Edge scheduler and the idle-time helper are sheng's zzyf and zzye patches (patches/xnu).", "T40c (2026-10-27): the cpu0 park thread is off by default (sheng-cpu0-park=0, as UniXNU-sheng d361b53): the E/P Edge scheduler places work by cluster, and T39b found the park thread holding cpu0 at 100 %. The governor and the AMP and idle patches already match sheng's latest.", "T64 (2026-10-29): dts/asteroids.dts's memory node covers the whole high bank (0x8C0000000 + 0x23FE00000), equal to board.toml dram_size, since the GPU pool at its top is gone (memory area).", "T76 (2026-10-30): the board classes here register through OSKextRegisterBoardClasses (zzyg-board-class-registration.patch), under the kext lock, in place of preModLoad/postModLoad alone, which deadlocked T75f's boot (storage area).", "T76's first kernel build (run 41109301209) failed: XNU has no kOSReturnNoMemory; OSKextRegisterBoardClasses and its callers use kOSKextReturnNoMemory (libkern/OSKextLib.h), and the helper has a prototype before its definition."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["The governor and the E/P scheduler are not yet verified on the phone (T35)."]
next_action = ["Boot T35a (read-only) and T35b (governor) and record the clocks and frame rate."]


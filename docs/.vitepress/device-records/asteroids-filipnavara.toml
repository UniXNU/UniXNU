schema_version = 1

[device]
name = "asteroids"
soc = "SM7635"
os_profile = "ipados-17.7.11-21H461"
summary = "Nothing Phone (3a) boots iPadOS 27.0.1 (24A446, the iPad17,3 images) from its UFS userdata partition to the home screen, with touch, buttons, the GPU add-on (Turnip and Metal on the Adreno 810), system apps, icons and the wallpaper (2026-11-11); iPadOS 17.7.11 (21H461) remains the board's default profile. Shared SM7635 support and board-owned storage, GPU, input and power integration. Wi-Fi (WCN6750, Linux ath11k on the WPSS) joins a WPA2 network, gets an address over DHCP and passes traffic, with interrupts, wifid and Settings (join from the Wi-Fi page, 2026-11-13). Bring-up runs as numbered staged tests."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "XnuPrelink"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore", "LICENSE", "scripts/make-asteroids-adt.py"]
inputs = ["SM7635 SoC profile (rootstockos/UniXNU-sm7635-common), iPadOS 17.7.11 build 21H461, asteroids_defconfig, the board's own driver forks as submodules."]
configuration = ["board.soc_source = sm7635; board.os_profile = ipados-17.7.11-21H461; schema_version = 2.", "drivers/Adreno740, drivers/ShengUfs, drivers/ShengHidInput, drivers/ArmDTPlatform and kits/AdrenoFirmware are this repository's submodules at their catalog paths and take precedence over UniXNU's."]
procedure = ["Run ./unixnu status --json -D ../UniXNU-asteroids from rootstockos/UniXNU and review profiles, components and patch order."]
findings = ["2026-11-13 (irq1): the iPadOS 27 payload runs with gpu-irq=1 gpu-timeline=1 (the GPU area); the other OS payloads keep gpu-irq=0.", "The Data seed workflow (.github/workflows/data-seed.yml) takes an os_profile input (2026-11-04): ipados-17.7.11-21H461 as before, or ios-27.0.1-24A446 with the iPhone17,4 OS volume (details in the storage area).", "Format 2 builds every selected component's kernel recipe, so [kernel] archives lists them as component: entries in the format 1 order; build-arm-driver.py skips Adreno740 and VirtioMmioBlock while their configuration switches are off, as format 1 never built them (T36 run 40297420036).", "Format 2 applies the arch, SoC and OS configuration fragments before the defconfig; bootstrap_defconfig turns off the five options common.config adds, so both passes have their format 1 configuration (checked with parse_config: no differences).", "Format 2 keeps only catalog components, so the forks of NativeAdreno and NativeUfs moved from their legacy names to drivers/Adreno740 and drivers/ShengUfs; legacy aliases are made only for UniXNU's own sources.", "T36 is the first format 2 image (build tag T36). Every board.toml value matches the format 1 board (4f05a36) except what moved to the SoC and OS profiles, the ADT tool options and the firmware pins (proprietary-files.txt); a dry-run pack caught kernel_args lost in the first rewrite.", "The ADT from the shared generator matches the former make-asteroids-adt.py output except for the OS profile's additions (J120AP first in the root compatible, product-id, /product/audio) and the arm-io window, which now covers UFS.", "T40a (2026-10-27): every fork has one working branch, asteroids (former branches are archive/* tags); drivers/ArmDTPlatform became the submodule fork rootstockos/ArmDTPlatform; the record check runs rootstockos/UniXNU's workflow and catalog, since UniXNU main's catalog does not know Sm7635Platform or QcomPmicRtc.", "T40c (2026-10-27): build tag T40; the GPU governor and fence spin are board defaults (see gpu).", "T40d (2026-10-27): sheng-lite=1 as on sheng; sheng-disable-jobs keeps only bluetoothd and coreduetd (the lite list holds the XPC wait cycle). The kernel from fork asteroids-dev 0d215db carries native-union-root-checkdirs.patch: the SystemOS union over / no longer leaves the OS root one usecount short (T40c's shutdown panic in vnode_rele_ext).", "T50: board.toml kernel_args gain sheng-dpu-scanout=2, sheng-dpu-linux=1 and sheng-audio=1.", "T64 (2026-10-29): [payload] dram_size 0x23FE00000 and [payload.adt] owned_memory_size 0x1F0000000 (7.75 GiB) over the whole high bank, which the uefi-asteroids map now declares as one run without GPU_Pool; [gpu] gpu_pool_base and gpu_pool_bytes are gone with the BO pool (memory area).", "T64: owned_memory_size is 0x180000000 (6 GiB) instead of 7.75 GiB until the kernel carries UniXNU 2867796's larger bootstrap table pool (memory area).", "T76 (2026-10-30): gpu-addon.yml's encrypted artifact also carries NativeAdrenoMetal.unstripped and libvulkan_freedreno.unstripped (build-asteroids-metal-plugin.py keeps Turnip unstripped), for symbolizing the encode thread's CPU profile; the phone gets neither.", "arm64e requirements (2026-11-03, https://unixnu.com/porting/arm64e, checked in recovery's Linux 6.6.114 on the 3a): all 8 CPUs (4 Cortex-A520 MIDR 0x410fd801, 4 Cortex-A720 0x410fd811) report paca and pacg (address and generic authentication); the kernel runs with CONFIG_ARM64_PTR_AUTH=y and CONFIG_ARM64_PTR_AUTH_KERNEL=y at EL1 under the same Qualcomm hypervisor, so EL1 writes the key registers and PAC instructions run without traps (HCR_EL2.API and APK set). The user wants iPhone iOS 27, not iPadOS: upstream has only ipados profiles (17.7.11, 26.5.2, 27.0.1-24A446), so the port will carry its own iPhone iOS 27 profile after the upstream sync.", "iPhone iOS 27 target (owner, 2026-11-04): iPhone 16 Plus, iPhone17,4 d48ap (chip 0x8140, board 0x0a), iOS 27.0.1 24A446, the build of the iPadOS 27 profile. Its kernelcache (kernelcache.release.iphone17, decompressed 77987840 bytes, sha256 fa07057bf34f33af1ec26681ad0c87c13e5aaa548a300740eddb0e92876e5f95) is a fileset of 305 entries at the classic iOS base (AMFI at 0xfffffff00764ece0, the iPad's at 0xfffffe00...). The UI scale is one whole number (LegacyDisplayProbe.cpp publishes /chosen display-scale, 2 today = 540 points): bring-up runs at 3 (360 points, pixel exact); the iPhone 16 Plus size (430 points, 2.51) needs a 1290x2796 frame scaled to the panel afterwards. hoshikv/UniXNU-peridot (SM8635) carries an unfinished ios-27.0.1-24A446 profile for iPhone14,5 (no AMFI address, iPad root UUIDs as placeholders, no hardware result).", "iPhone17,4 pins (2026-11-04, against the iPad17,3 24A446 kernelcache, sha256 38e6d9fa..., the iPadOS profile's pin): all 32 compared kexts (the 31 prelink roots, AMFI, IOMobileGraphicsFamily, IOSurface, IOHIDFamily, the kernel) carry the same bundle versions. com.apple.iokit.IOHIDEventDriver is a codeless kext (personalities only, load address INT64_MAX) on both, with no fileset entry on either, so all 31 roots apply and HidInputProbe needs no change (the earlier note that it did was wrong). AMFI early security init: the iPad wrapper (0xfffffe00092551ac) calls initializeAppleMobileFileIntegrity at 0xfffffe00092549f4; that function matches uniquely in the iPhone __TEXT_EXEC at 0xfffffff00920f854 (12 to 48 masked instructions), called from two sites as on the iPad, and its wrapper is 0xfffffff00921000c, byte for byte the iPad's. The fileset prelink links at the native address and ignores the profile slide. User space is not cache independent: on arm64e upstream's NativeAdrenoMetalPlugin.mm writes four QuartzCore globals and patches one instruction (0x184461928) at iPad 24A446 shared cache addresses, and package/AsteroidsMetalPlugin.mm writes the EDR headroom global the same way; on the iPhone's own dyld cache those addresses are other memory, so they need a per cache table before the first iPhone boot.", "Per cache QuartzCore sites (2026-11-04): package/AsteroidsMetalPlugin.mm writes the EDR headroom override (QuartzCore debug_values index 21) only where kQuartzCoreSites holds the running dyld shared cache's UUID, and marks 0x6EF0 elsewhere; CA_DISPLAY_EDR_HEADROOM is set either way. Addresses by name from each cache's symbols (ipsw dyld symaddr, local/tools/ipsw-bin): iPad17,x CE33B2BA-2EBB-3B58-A04E-1953E12112AE debug_values 0x1e7020fc0; iPhone17,4 A54D617A-342B-3A29-8F63-B9F93CE76141 0x1e7024fc0. In the iPhone cache QuartzCore's code sits at the iPad's addresses (CARenderServerStart 0x1846dce88, framebuffer_pixel_format 0x184461838) and its data 0x4000 higher (_ca_debug_options 0x1e702516c, is_virtualized 0x1e701fdd9), so the iPad address would have written another global silently. Upstream's NativeAdrenoMetalPlugin.mm, which writes more of them, is not built for this board. UniXNU 63b3d7e adds the ios-27.0.1-24A446 profile (root volumes 634783FE OS, FA95C6F7 SystemOS) and decrypts AEA images with ipsw on Linux; the iPhone userdata image (15.02 GiB, OS 10104078336 bytes at 0x100000, SystemOS 6020923392 at 0x25a500000) is in local/userdata-ios27, not written.", "xnu-12377 patch stack for the iOS 27 profile (2026-11-04, checked with git apply on xnu ac9718fb, as UniXNU patches.py applies it): arch (arm64e) 64, SoC 2, OS 4 and device 12 patches apply in board order (arch, SoC, OS, device). UniXNU-sm7635-common 47dc6aa adds patches/xnu-12377 (sm8550's versions; our two xnu-10063 SoC patches are identical to sm8550's). patches/xnu-12377/series is sheng's xnu-12377 board series without its Wi-Fi and latency traces (CPU idle, E/P Edge, audio add-on mount, source storage hook, iPadOS 27 bring-up), our class registration, rootstockos/UniXNU's five xnu-10063 bring-up patches unchanged, and the watchdog policy ported to sheng's xnu-12377 call site. Not yet set for the profile: the board build scripts are iOS 17 arm64 only (build-asteroids-platform-power.py requires the iOS 17 target; build-native-legacy-display.py and build-ufs-original-bindings.py match the 21H461 kernelcache), and sheng builds its 27 display with its own build-gop-legacy-display-27.py.", "iPhone17,4 class ABI fixtures (2026-11-04): sheng builds the iPadOS 27 display and input against reviewed iPad17,3 fixtures (scripts/legacy-display-24A446.json, IOMobileFramebufferLegacy, 379 slots; hid-device-24A446.json, IOHIDDevice, 207). scripts/remap-24A446-display-fixture.py (with kcremap_24A446.py) rewrites them for the iPhone kernelcache: each address is moved by fileset entry, segment and offset and verified, vtable slots are the iPhone's own chained-fixup pointers with PAC key, diversity and address diversity equal to the iPad's and targets equal by offset or by masked code (display 215 offset, 161 code, 3 kernel; HID 57, 146, 4; the kernel is built per SoC, so a kernel target is the iPhone vtable's own), and the display fixture's 10 byte checks match exactly. collection_slide is 0: the iPhone cache is already at the link base 0xfffffff007004000, where the iPad's 0x1f000000000 moves the iPad cache. Results: scripts/legacy-display-24A446-d48.json (vtable 0xfffffff0082d2000), scripts/hid-device-24A446-d48.json (vtable 0xfffffff0082b26b0).", "iPadOS 27 bring-up (2026-11-11): the board builds and boots ipados-27.0.1-24A446 with the iPad17,3 identity (./unixnu build ... --os ipados-27.0.1-24A446). [kernel] patches/xnu-12377 gains zzzzzzzzz-board-sigp-reinit-assert.patch (assert_ml_cpu_signal_is_enabled accepts a core sheng_sigp_recover brought back), zzzzzzzzza-board-wcomb-carveouts.patch (write-combined and RT mappings at or above 0x80000000 stay Normal memory, not Device-GRE: the ADSP loader's unaligned copies aborted) and zzzzzzzzzb-board-launchd-cache-overlay.patch (the add-on's xpc/ over /System/Library/xpc, for launchd_job_environment).", "Built-in boot arguments (package/BootWatchdogPolicy.c PE_builtin_boot_args, 2026-11-11): owner-staged-apps=1 owner-dataprotect=1 disable-jobs=com.apple.cameracaptured sched_preemption_disable_debug_mode=0 interrupt-masked-debug-mode=0 validation_disables=0x11040. The generic timer runs at 19.2 MHz, not Apple's 24 MHz: ml-timeout-<name> values are picoseconds, and the interrupt-masked timeout is reloaded from ml-timeout-interrupt-masked-b at the end of bsd_init, so the sched hygiene checks are turned off instead.", "Upstream sync (2026-11-12): UniXNU main 2b545ea merged into rootstockos/UniXNU asteroids-resync (Mesa list: upstream's patches first, the A810 ones after; turnip-darwin-first-alloc-failure.patch rebased onto the process-wide GPU address allocator) and UniXNU/Adreno740 main 54b41b8 into the gen8 fork (8be2626). ShengUfs (eight concurrent UFS commands) and ArmDTPlatform (a new RTC design) were not merged: both conflict with the board's own paths.", "Repositories (2026-11-12): the forks are published under github.com/filipnavara (UniXNU, UniXNU-asteroids, uefi-asteroids, NativeAdreno, ArmDTPlatform, GopFramebuffer, NativeUfs, AdrenoFirmware); .gitmodules points at them.", "2026-11-13 board.toml, iPadOS 27: wifi=5 (Wi-Fi on by default), text_fixups (QuartzCore composites in 8-bit BGRA, see display) and dpu-scanout=2 dpu-linux=1 dpu-flush=1 (zero-copy scanout through VIG 0, see display); the GopFramebuffer submodule follows its asteroids-27 branch."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["The SoC profile (rootstockos/UniXNU-sm7635-common) and the UEFI binaries (rootstockos/Device-Binaries) stay under rootstockos."]
next_action = ["Boot the 2026-11-12 sync on the phone and record it."]


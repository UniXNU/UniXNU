[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = ["DRAM high bank 0x8C0000000-0xAFFE00000 (9 GiB less 2 MiB, one conventional run since T64) for the XNU window; GMU pool at 0xE6440000 (32 MiB), reserved in the uefi-asteroids memory map. Until T63 a GPU pool sat at 0xABFE00000 (1 GiB)."]
configuration = ["owned_memory_size 0x180000000 (6 GiB, T64; 4.75 GiB before) and dram_size 0x23FE00000; the DTS memory node equals dram_size."]
procedure = ["Check that payload.dram_size equals the DTS memory node and that DarwinBoot places the window."]
findings = ["384 MiB of owned memory left iPadOS short; 4.75 GiB in the high bank (uke's layout) is enough.", "Metal's 64 MiB blocks need a 1 GiB GPU pool outside the XNU window.", "T62b-light (2026-10-29): with every app on the GPU the 1 GiB pool filled and the GPU stopped once BOs fell back to scattered pages, while XNU had 849 pages free. T64: no pool; user BOs are XNU's pageable memory (sheng's Adreno740 882f4bf) and the window grows from 4.75 to 7.75 GiB over the whole high bank, leaving 1.25 GiB of the run to UEFI's own allocations.", "T64 first boot (2026-10-29): 7.75 GiB stopped at the kernel's entry, the green and blue bars without the magenta one: before the MMU is on, start.s maps the window twice with 1 GiB per L2 table page, and UniXNU's native-4k-bootstrap-capacity patch held 16 pages, enough for 6 GiB; the patch's own guard loops when the pool runs out. The window is 6 GiB until a kernel with UniXNU 2867796 (22 pages, windows up to 9 GiB; staged, not built) is built, then 7.75 GiB."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["The GMU pool is a fixed reservation in the firmware memory map. DarwinBoot gives XNU at most 8 GiB."]
next_action = ["Record the firmware memory map with each firmware change."]


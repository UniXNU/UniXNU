configuration = ["sheng-audio takes bits (sheng-adsp=2 is required, the default): any nonzero value serves the audio service, 2 plays a 1.5 s 750 Hz test tone at boot, 8 runs the lock sound test.", "sheng-audio-pa moves the DSP period buffer (default 0xe6200000, the splash region's tail); sheng-audio-tone-ms and sheng-audio-atten set the tone.", "asteroids-audio-i2s = interface | data lines << 8 | bits << 16 (default primary MI2S, SD1, 32-bit: the amplifiers take their data on gpio17); asteroids-audio-prm bits (default 3): 1 LPASS core vote, 2 MI2S bit clock request.", "asteroids-mic=<stage> (default 8 since T96n, with sheng-audio; 0 leaves the microphone off) brings up the WCD9378 microphone path in stages: 1 rails (ldob7, ldob8) and codec reset (gpio162), 2 PRM votes and VA/TX core clocks, 3 LPI SoundWire pins and VA/TX macro clocks, 4 VA SoundWire master (0x33b0000, v1.7) and enumeration, 5 codec init (SCP setup, io_init, SDCA class load), 6 capture path (ports, micbias 1, SmartMIC0 sequencer, TX decimator 1 by asteroids-mic-dec), 7 DSP capture graphs and a 2 s capture test, 8 capture for the plug-in. asteroids-mic-port = sample interval | offset1 << 8 | lane << 16 (default 1 | 1 << 8). asteroids-mic-mux=1 switches the VA macro to its own core clock (0x3420000 = 1) as the vendor clock manager does (default off). asteroids-mic-usage sets the SmartMIC0 ADC usage (default 3 NORMAL; 5 ADC_LP wants interval 3), asteroids-mic-pageswap=0 the MIPI page order, asteroids-mic-frame=0 skips the bank switch.", "The GPU addon carries sheng's audio server plug-in as audio/ShengAudio.driver (scripts/build-asteroids-metal-plugin.py builds it with scripts/build-sheng-audio-hal.py unless --no-audio, and adds its CDHash to the owner trust module); patches/xnu/zzyd-board-audio-addon-mount.patch mounts audio/ over /System/Library/Audio/Plug-Ins/HAL."]
procedure = ["Read the [audio] and [amps] rows: stage, DSP status, amplifiers found (amps=3: both), clocks stable (lock=), errors, SMMU result, I2C engine, PRM results (bus= second word), I2C failures.", "Run scripts/check-audioreach-host.py after changing the graph commands."]
findings = ["T38 ports sheng's audio DSP bring-up (AdspProbe.cpp, sheng-adsp=1 survey, 2 start) with the 3a's IPCC (0x405000), carveouts (0x99300000, 0x99280000) and crash-reason partition; the firmware comes from modem_a (LUN 4) through NativeUfs's native_ufs_part_find/read (rootstockos/NativeUfs efa8271, from UniXNU's ShengUfs).", "T41: speakers are two NXP TFA9873 (P 0x34 slot 0, S 0x35 slot 1) on QUPv3 wrapper 1 SE6 (SE13, 0x898000, gpio59/60), reset gpio141/142 (active high), fed by primary MI2S (gpio15-18, function 2) as two 32-bit slots at 48 kHz. The container carries no amplifier firmware (a dummy patch), only bitfield settings.", "T41: the microphone is AMIC1 of a WCD9378 (mixer_paths handset-mic: ADC1, MIC BIAS1 by the card routing, ADC_LP, volume 6) on the VA macro's SoundWire master; the handset mic back end is CODEC_DMA-LPAIF_RXTX-TX-3 as on sheng. The codec register recipe is the July 2026 LKML WCD9378 TX driver (v2, paged SDCA registers, built-in power sequencers); the master is v1.7 (apps command FIFO at 0x31c).", "T41: package/AsteroidsAudioProbe.cpp is sheng's AudioProbe.cpp with the 3a's board steps and the TFA9873 programs (AsteroidsTfa9873.c) in place of the CS35L43's; the speaker device runs 32-bit while the stream stays 16-bit (the playback converter widens it). The amplifiers power up after the graphs start, since they wait for the bit clock. No microphone path.", "T40k (2026-10-27): the speaker path ran end to end (DSP graphs, the service, the plug-in, a 48 kHz stream without gaps; both TFA9873 rev B found, clocks and PLL locked) but was silent: on I2S0 SD0 the amplifiers got the clocks and no data. T40k-spk-sd1 (asteroids-audio-i2s=0x200200) played the boot tone and iOS sound through both speakers: the amplifiers take their data on SD1 (gpio17), the default since T41.", "T41: TFA9873 STATUS0 bits 1, 2 and 4 (DCOCPOK, OTDS, UVDS) are ok flags in NXP's field list, not alarms; [audio] err= counts real alarms only (OCDS, MANALARM, NOCLK, TDMERR or a missing ok flag).", "T41, T41-mux: mic stage 4 fails. The rails are voted, the PRM grants the macro and codec votes and the VA/TX core clocks, the LPI pins and macro clocks are set (VA SWR_CONTROL 1) and the master (v1.7) keeps its settings, but COMP_STATUS never shows the link up, no interrupt fires and no device attaches. With asteroids-mic-mux=1 (the VA clock source switch) the master's registers read back 0, so the switch stays off. T42 adds [mic extra]: the codec reset pin read back, COMP_STATUS over time and, with asteroids-mic-pmic=1, the codec's LDOs from the PMIC.", "T42 (2026-10-28): the codec reset pin read back GPIO_IN_OUT 2 (output high, pad low): gpio162 is a TLMM eGPIO (132-166, recovery's pinmux egpio group) and the probe left EGPIO_ENABLE (bit 12) clear, so the pad was not the TLMM's and the WCD9378 stayed in reset (link 0x40002 throughout, no slave). T43 sets the bit. The amplifier resets (gpio141/142) have the same flaw but are active high, so a pad left low releases them. Recovery's device tree: the codec rails are RPMh ldob7 (rxtx, io; already on for the eUSB2 repeater) and ldob8 (buck, on demand), micbias bobb1; SID 1 0x146 has no APID and 0x147 is not an LDO, so the T42 PMIC read can show nothing.", "T43: with EGPIO_ENABLE the codec reset reads back 3 (pad high), yet the VA master's link stays 0x40002 from 1 ms to the end and no slave attaches: the master itself does not run the bus. Next: its clock (the VA macro's SoundWire clock and the 19.2 MHz VA core clock through the PRM).", "T46 (2026-10-28): the mic rows are the same in T42, T43, T46 and T46-copy: rails voted, PRM grants all four requests, LPI pins function 1, VA SWR_CONTROL 1, reset now high, yet COMP_STATUS 0x40002 from 1 ms to the end (bit 0, the frame generator, never set), interrupt status 0, no slave. Against mainline's qcom_swrm_init (drivers/soundwire/qcom.c) the probe missed the v1.7 step: SWRM_LINK_MANAGER_EE (0x018) = 1 for the CPU, then MCP_BUS_CTRL = CLK_START << EE_CPU (4); it wrote 2, EE 0's clock start. T47 follows mainline's order and values. Recovery's DT has no swrm-hctl or EE property for this master.", "T47-mic7 (2026-10-28): every mic stage ran (st=70): bus up (COMP_STATUS 0x100001), the WCD9378 TX device enumerated as device 1 (id 0x01170223, the DT's wcd9378-tx-slave), the codec set up, the SmartMIC0 sequencer at PS0, TX decimator 0, the DSP's capture graphs; 200 of 200 periods came back. The level was near silence: peak 34 of 32767, mean under 1, 18559 non-zero samples. The vendor's handset-mic path records AMIC1 (ADC1, SWR_MIC0) and AMIC3 (ADC2, SWR_MIC4) at ADC volume 6; the probe takes AMIC1 only. T49: asteroids-mic-capture-s=<s> (up to 30) and a [mic peaks] row with the peak of each second.", "T50: sheng-audio=1 (speakers for iOS, no boot test tone) is a board default.", "T51: the 20-second capture came back complete (2000 of 2000 periods) but silent: peak 33 in the first second, exactly 0 in the next 19. The mic path delivers no codec data.", "T76 (2026-10-30): the board classes here register through OSKextRegisterBoardClasses (zzyg-board-class-registration.patch), under the kext lock, in place of preModLoad/postModLoad alone, which deadlocked T75f's boot (storage area).", "T76's second kernel build (run 41111730079) failed in ShengPlatformPower.cpp: BoardClasses.h had been included after the file's last #include, which there sits inside the ShengPlatformPower class; every probe now includes it after its first #include.", "T89 (2026-11-02): T51's capture was digital zero after its first second, the decimator fed nothing. The probe took AMIC1 through TX SMIC MUX0 into DEC0 (DMA channel mask 1); the vendor's handset-mic path (mixer_paths_volcano_qrd.xml amic_1_3) takes AMIC1 through TX SMIC MUX1 = SWR_MIC0 into DEC1 and AMIC3 through SMIC MUX2 = SWR_MIC4 into DEC2, both on TX_AIF1_CAP, and its default sets TX SMIC MUX0 to ZERO; the vendor TX macro passes the decimator mask as the codec DMA channel mask (tx_macro_get_channel_map). The VA macro's SoundWire mic clock setup for a VA-hosted master (bolero 2.1: VA_TOP_CSR_SWR_MIC_CTL0-2 = 0xCC) is already in the probe. asteroids-mic-dec=<n> (default 1) picks the decimator (mux 0x100 + 8n, path 0x400 + 0x80n) and the capture asks for mask 1 << n; [mic port] reads back the decimator's muxes and path, the codec's data port 1 (PortCtrl, ChannelEn in both banks, IntStat, PrepareStatus) and SCP_FrameCtrl in both banks, and the master's port 1 control, 300 ms into the capture. Boot: asteroids-mic=7 asteroids-mic-capture-s=20.", "T89mic (2026-11-02, asteroids-mic=7 asteroids-mic-capture-s=20, kernel run 41445466871): still digital zero after the first second (peaks 32 then 0 for 19 s, from 22.7 s; the user made noise and silence in turns). [mic port]: dec 1 with mask 0x2, TX muxes SWR_MIC0 / SWR_MIC and the path enabled and unmuted (0x24), the codec's port 1 channel 1 enabled in both banks, the master's port 1 likewise (0x1000101), but the codec's SCP_FrameCtrl 0 in both banks: it frames at the default 48 rows by 2 columns while the master frames at 50 by 16 (0x101c 0xf). Commands ride in column 0 and work; the data port does not line up.", "T90 (2026-11-02): after the port setup the probe writes the master's bank 1 frame (0x105c) like bank 0 and broadcasts SCP_FrameCtrl_B1 = the same shape (device 15), mainline's sdw_bank_switch with qcom_swrm_pre_bank_switch, so the codec and the master switch to bank 1 at 50 rows by 16 columns together. asteroids-mic-frame=0 skips it. [mic port] then reads SCP_FrameCtrl bank 1 as 0xf.", "T90mic (2026-11-02, capture 30 s from 43.1 s): unchanged: peaks 33 then 0, the codec's SCP_FrameCtrl still 0 in both banks and the master's MCP_STATUS (0x104c) 0, bank 0. The broadcast never landed: mainline (qcom_swrm_cmd_fifo_wr_cmd) sends a broadcast with command id 0xf (SWR_BROADCAST_CMD_ID), and the probe's swrWrite gave it an ordinary id. The first T90mic boot ended in fastboot, not recovery, and was not pulled.", "T91 (2026-11-02): swrWrite uses id 0xf for device 15 and waits 10 ms after the bank switch; [mic port] [6] is the master's MCP_STATUS (bit 0 the bank in use) in place of its port control 2.", "T92 (2026-11-02, static review against the vendor master refs/nulldebris-modules swr-mstr-ctrl.c, the Volcano audio DT and sheng's working WCD938x capture): the probe never prepared the codec's port: sheng writes DP1_PrepareCtrl (0x105) before ChannelEn, and T90's DP1_PrepareStatus read 0. T92 writes 0x105 = 1 and polls PrepareStatus for up to 10 ms before enabling the channel. Same as sheng and kept: codec HCtrl 0xff, master HCTRL 0xf0, sample interval 1. Sheng frames at 50 by 16 without a bank switch and records, so the T90/T91 bank switch is kept but may not be needed (asteroids-mic-frame=0). The vendor master computes a TX port's interval as 2 x bus clock / channel rate - 1 with offset1 and lane from the codec driver's table (not in the local trees); the Volcano VA master maps ADC1 to port 1 channel 1 (SWRM_TX1_CH1) and sets mipi-sdw-block-packing-mode 1. T91's kernel build was cancelled for T92.", "T92mic (2026-11-02): still digital zero (peaks 32 then 0, from 34.1 s). The master is now on bank 1 (MCP_STATUS 1), so the 0xf broadcast lands at the master; the codec's SCP_FrameCtrl and DP1_PrepareStatus still read 0.", "Static review (2026-11-02), LKML WCD9378 v2 (lkml.iu.edu/2607.3/09185.html, tested on the Fairphone 6, SM7635): ADC1 leaves on codec port 1 channel BIT(0) to master port 1 channel BIT(0) (no ChMap register, software only); the TX ports are SDW_DPN_SIMPLE with simple_ch_prep_sm, so no prepare is needed and PrepareStatus 0 is expected (T92's 0x105 write is harmless); bps 1; lane_control_support; clock_reg_supported (the core programs SCP bus-clock base/scale; without it capture is dead, per the cover letter): the probe already writes 0x4d = 1 (19.2 MHz) and 0x62/0x72 = 2 (/2), matching a 9.6 MHz bus (master clock divider 0 on the 9.6 MHz macro clock). The driver writes no raw 0xe0/0xf0; the probe's 0x01 there came with the first bring-up (b0a33bf) without a source. Mainline sm8550 TX SoundWire (sm8550.dtsi swr2): the ADC ports run sample interval 1, offset1 0, on lanes 1 and 2; only the DMIC ports (interval 3, offset1 1) use lane 0, which also carries the command column; sheng records on lane 2. The probe ran ADC1 at interval 1 on lane 0 with offset1 1. T92l1 / T92l2: the T92 kernel with asteroids-mic-port=0x10001 / 0x20001 (interval 1, offset 0, lane 1 / 2).", "T92l1 (2026-11-02, asteroids-mic-port=0x10001): still digital zero (peaks 32 then 0 from 33.2 s; the run lasted 605 s and ended in fastboot). The master's port 1 took interval 1 at offset 0 (0x1000001). A 150 Hz high-pass decimator turns a constant bit stream into exactly 0 after a short transient (the first second's peak of 32 in every run), so the decimator runs and its SWR_MIC input is constant.", "Static review, second pass (2026-11-02): the lpass-cdc TX and VA macros (refs/nulldebris-modules lpass-cdc-tx-macro.c, -va-macro.c) need nothing the probe lacks for a SWR_MIC decimator on a VA-hosted master: the VA SWR_MIC_CTL0-2 = 0xcc (done), TX_TOP_CSR_SWR_CTRL only cleared at power-down, the amic TX hold clear is the codec's ANA_TX_CH2 HPF init bit (done). The LKML driver's codec writes match: io_init (TXFE_DIV bypass, TX support clock, PDM watchdog, SM0-2 micbias selects), SmartMIC0 usage 0x05 (ADC_LP), IT11_MICB 0x05 (WCD9378_MICB_USAGE_2P75V for the board's 2750 mV micbias 1), PS0 request. Left: the lane (T92l2 next), offset, the probe's unsourced 0xe0/0xf0 write, and the T90 bank switch.", "T92l2 (2026-11-02, asteroids-mic-port=0x20001, lane 2 as sheng): still digital zero (peaks 32 then 0 from 33.2 s; again via fastboot, then recovery on its own). Third review pass, lpass-cdc TX decimator power-up: CFG0 bit 7 clear for an analog SWR mic (0x50 here), DEC mode ADC_DEFAULT (no mixer path sets TX DEC MODE), 150 Hz high-pass so no gate sequence, clock enable 0x20 and rate 4 (48 kHz) in PATH_CTL, TX SWR_INPUT is a plain input pin, and the TX macro never touches its SWR_CONTROL (only the VA macro does). The macro side matches the vendor driver throughout; the constant input is on the codec or bus side.", "Stock modules (2026-11-02): recovery's kernel loads only gpr and spf_core (no sound card), so vendor_dlkm_a was read out of super read-only (dd of sectors 18504096 + 162696 from the LP metadata; local/stock/vendor_dlkm_a.img, ext4) for the stock wcd9378_dlkm.ko, swr_ctrl_dlkm.ko, lpass_cdc_*_dlkm.ko and machine_dlkm.ko (no source). The Volcano codec node (volcano-audio-overlay.dtsi wcd9378-codec) maps ADC1 to codec port index 0, mask 0x1, SWRM_TX1_CH1, and qcom,swr-tx-port-params gives <offset1 lane> for four use cases of four ports: use case 0 (9.6 MHz bus) port 1 = OFFSET1_VAL1 LANE0, the probe's original values; use case 1 (4.8 MHz) port 1 = VAL0 LANE1.", "Sample interval: the vendor master takes 2 x bus clock / channel rate - 1, and Qualcomm's WCD937x-family drivers give an ADC port 4.8 MHz in ADC_LP and 9.6 MHz in NORMAL/HIFI; the LKML WCD9378 driver uses NORMAL on a 9.6 MHz bus with mainline's interval 1. The probe ran ADC_LP (SmartMIC usage 0x05, as the vendor's TX0 MODE ADC_LP) with interval 1, the NORMAL timing. T92s3: the T92 kernel with asteroids-mic-port=0x103 (interval 3, offset 1, lane 0): LP with LP timing on use case 0.", "T92s3 (2026-11-02, asteroids-mic-port=0x103): still digital zero (peaks 32 then 0 from 33.9 s); the master took interval 3 (0x1000103). Every port timing tried (interval 1 and 3, offsets 0 and 1, lanes 0-2) gives the same constant input, so the codec most likely sends nothing.", "T93 (2026-11-02): [mic codec] reads the codec's state 300 ms into the capture: TX sequencer 0 status (SEQ_TX0_STAT), SmartMIC0 FUNC_STAT, PDE11 actual and requested power state, IT11 usage and micbias, SYS_USAGE_CTRL, TX_NEW_CH12_MUX, ANA_TX_CH1/CH2, CDC_ANA_TX_CLK_CTL, CDC_AMIC_CTL, TXFE_DIV_CTL, PDM_WD_CTL0, SM0_MB_SEL and MB_PULLUP_EN. asteroids-mic-usage=<n> (default 0x05 ADC_LP) sets the SmartMIC0 usage, so NORMAL (0x03) can run with interval 1. The probe's 0xe0/0xf0 write stays: per the user it came from the Nothing kernel or measurements in recovery. Boots: T93lp (usage 5, port 0x103) and T93n (usage 3, port 0x101).", "T93n (2026-11-02, NORMAL usage 3, interval 1, offset 1, lane 0): still digital zero (peaks 31 then 0 from 32.6 s), and no [mic codec] row: it printed only when its first two words were nonzero, and a failed read gives 0xff, so every paged codec read returned 0, the usage register written 3 a moment before among them. The probe's PS0 check (ACT_PS 0) since T47 therefore proves nothing.", "T94 (2026-11-02): wcdPage writes SCP_AddrPage1/2 before every paged access instead of caching them (asteroids-mic-pagecache=1 restores the cache): if the codec drops its page registers, every later paged access, writes included (micbias, usage, PS0 request), lands on page 0, which would leave the ADC off. [mic codec] now prints whenever [mic port] does.", "T94n (2026-11-02): still digital zero (peaks 30 then 0 from 33.3 s), and [mic codec] read 0 in every byte with the page registers written before each access. The [mic] row's /10 is the device id's high word (DT reg <0x10 0x01170223>), not a paged read, and efuse=0 is a paged read: no paged codec read has returned data since T47, so the codec's paged writes (io_init, class load, micbias, usage, PS0 request) may never have landed either, which would leave its ADC off. The Qualcomm paging patch the LKML WCD9378 series depends on (soundwire: qcom: add SCP address paging support, 999f80904763, lkml.iu.edu/2607.1/13485.html) programs SCP_AddrPage1/2 and sets bit 15 of the wire address, as the probe does.", "T95 (2026-11-02): [mic page]: SCP_AddrPage1/2 read back after setting them for ANA_TX_CH1 (beside the values written), the raw read FIFO word of that paged read, the master's interrupt status (0x200) before and after it, DEV_VER (0x40100070) through paging, ANA_TX_CH1, the unpaged SCP_DevId_0 and the failed reads.", "T95's first kernel build (run 41485458782) failed: the [mic page] block declared failed a second time in micPortSnapshot; it counts in pageFailed now.", "T95n (2026-11-03): [mic page] back/wrote 80308030: SCP 0x48/0x49 read back 0x30/0x80, exactly as written for ANA_TX_CH1 (0x4018000e); the paged read's FIFO word 0xa00 (data 0, its own id), interrupt status 0x6 before and after (no command error), DEV_VER and the ADC gain 0 through paging while the unpaged SCP_DevId reads 0x23. The paged space answers but holds nothing: the address is wrong, not the bus.", "T96 (2026-11-03): the page register order. Qualcomm's regmap-swr (refs/nulldebris-modules soc/regmap-swr.c, the stock driver's path) writes address bits 30:23 (mask 0x7f800000) to SCP 0x48 and bits 22:15 (0x007f8000) to 0x49, with the low 16 bits | 0x8000 on the wire; the probe used the MIPI header's order (0x48 bits 22:15, 0x49 bits 30:23) since T47, so every paged access went to an empty address (0x0018000e for 0x4018000e): no codec read returned data and none of its writes (io_init, class load, micbias, usage, PS0 request) landed, so the ADC never ran, whatever the port timing. The stock wcd9378_dlkm.ko uses the same 0x4018xxxx/0x41xxxxxx space (1461 words of 0x4018xxxx). wcdPage now uses Qualcomm's order; asteroids-mic-pageswap=0 restores the old one. Boots: T96n (NORMAL usage 3, interval 1) and T96lp (LP, interval 3).", "T96n (2026-11-03, NORMAL usage 3, interval 1, offset 1, lane 0, decimator 1): the microphone records. 3000 of 3000 periods, peak 991 of 32767 (about -30 dBFS), mean 29, 1398442 non-zero samples; per-second peaks from 33.2 s: 448 294 35 28 36 97 319 279 140 348 321 178 113 779 560 296 573 708 128 991 744 772 325 362 329 394 315 317 381 595, rising and falling with the user's noise and silence. The codec now answers: [mic codec] usage 3, micbias 0x05, ANA_TX_CH1 0x26 (gain 6), TX sequencer status 2; [mic] efuse 0x110 (0 before); [mic page] wrote 0x80/0x30 and reads back the gain 0x26 through paging. The page register order was the fault from T47 on.", "T97 (2026-11-03): the microphone is on by default: asteroids-mic defaults to 8 (capture serves the plug-in's input stream, after the 2 s boot capture test) and the SmartMIC0 usage to 3 (NORMAL, with the port's default interval 1, offset 1, lane 0 and decimator 1), the T96n combination."]
completion = ["Playback and capture through the audio server."]

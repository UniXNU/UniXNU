[[area]]
id = "storage"
status = "implemented"
components = ["ShengUfs", "RamBlock", "SoftwareAES", "VirtioMmioBlock", "VerifiedRoot"]
paths = ["package/Source*.cpp", "package/BootProcessWorker.c", "package/BootReset.c", "scripts/fetch-os-volume.py", ".github/workflows/data-seed.yml", "drivers/ShengUfs", "drivers/NativeUfs", "scripts/policies/**", "scripts/sign-root-policies.py", "scripts/verify-root-policies.py", "scripts/build-arm-driver.py", "scripts/build-ufs-original-bindings.py", "scripts/ci-bootstrap-candidate.sh", "scripts/pull-asteroids-data.py"]
inputs = ["UFS host 0x1d84000 and PHY 0x1d80000 (SM8550's windows), apps SMMU stream 0x60; userdata LUN 0 blocks 0x256248-0x3a8bffa."]
configuration = ["native-ufs-root=1 and native-ufs-allow-unverified=1; sheng-data-persist=2 keeps Data at the end of userdata."]
procedure = ["Build the userdata image, write it to userdata from recovery, boot, and pull the Data volume with scripts/pull-asteroids-data.py."]
findings = ["iOS 27 storage (2026-11-04): drivers/ShengUfs (rootstockos/NativeUfs asteroids 9e1cc29) merges UniXNU/ShengUfs main: the source API, the header-only policy handoff and readPolicyTable, which reads \"<window>.vroot\" and requires its size to be the bare hash table (block count x 32), so the userdata objects are the tables (OS 78938112, SystemOS 47038464 bytes) and the image was rebuilt. Kept ours where they met: TCR2 from IDR2 and the Linux-style display bank, the counters outside the verified block guard. package/SourceStorage.cpp, SourceRootPolicies.cpp, SourceRootBinding.cpp, BootReset.c and BootProcessWorker.c are sheng's (965460a), unchanged, for build-sheng-source-storage.py, which now looks in kits/<board kit> (UniXNU bd4766a). The Data seed workflow takes os_profile: for ios-27.0.1-24A446 it fetches and decrypts the iPhone17,4 OS volume (scripts/fetch-os-volume.py; ipsw and aea on macOS) and seeds from its var tree (launchd c640246d..., LastSystemVersion 24A446).", "iOS 27 root policies (2026-11-04): on arm64e component:ShengUfs builds the source storage runtime (build-sheng-source-storage.py), which mounts only a root authenticated by a signed policy. scripts/policies/ios-27.0.1-24A446/{OS,SystemOS} hold our own policies, signed with a local owner RSA-3072 key (local/owner-keys, never in a repository; trusted key sha256 c97a039baef14b94...) by scripts/sign-root-policies.py over the userdata image's windows: OS 10104078336 bytes, 2466816 blocks, sha256 b73d3753...; SystemOS 6020923392 bytes, 1469952 blocks, 17ca9d50.... scripts/verify-root-policies.py authenticated each with UniXNU's VerifiedRoot C code (built as a Linux host library with its OpenSSL provider): the full envelope, the 544-byte header alone, every block and the whole digest. Only the headers, trusted keys and records are here: the full manifests (79 and 47 MB) are the userdata image's objects OS.vroot and SystemOS.vroot (XNU_SOURCE_STORAGE_TABLES=userdata), in local/userdata-ios27 (not written).", "Format 2 builds VirtioMmioBlock as ShengUfs's dependency; build-arm-driver.py skips it while XNU_NATIVE_VIRTIO_BLOCK is off.", "NativeUfs (the ShengUfs fork) is built without the verified-root check until signed volume policies exist.", "Its IOBlockStorageDevice imports bind against the original class in a bootstrap kernel candidate built first in CI.", "T67, T72 and T72 again (2026-10-29/30) hung before the root mount: NativeUfs published SystemOS and never saw IOMedia under it (no block request, \"SystemOS volume  not ready\" after 30 s), while the UFS transport kept writing the log and every processor sat idle. bsd_init's stage markers stopped at bsd_autoconf, whose late probes had not reached the CPU clock row ([clocks] absent, [gpu uc] stage 0, B st=0); T71 on the same kernel booted. Both stalled together, so a race between the probes and IOKit matching; T73 logs where each thread waits.", "T75f (2026-10-30) hung before the root mount and T73's [kernel threads] rows caught it: a lock-order deadlock. The boot thread, in native_keystore_probe (late probe step 1, key events stage 1), held OSMetaClass's class lock from preModLoad and waited in postModLoad for sKextLock (OSKext::lookupKextWithIdentifier); IOConfigThread_'IOResources' held sKextLock loading a kext (OSKext::load, OSRuntimeInitializeCPP) and waited for the class lock in preModLoad; IOConfigThread_'NativeUfsBlock' waited for sKextLock in IOCatalogue::personalityIsBoot, so the SystemOS disk never got a driver. XNU takes sKextLock first; the board's probes took only the class lock. Intermittent because it needs a kext load during the probe's registration, right after bsd_autoconf publishes IOBSD. T76: OSKextRegisterBoardClasses (patches/xnu/zzyg-board-class-registration.patch) registers board classes under sKextLock, and all eight probes that called preModLoad/postModLoad use it.", "iPadOS 27 (2026-11-11): data_gib = 88: 90 GiB did not fit beside the 14.7 GiB 27 root image, the 1 GiB log reserve and the 4 MiB guard, and the Data store was refused (colour bars, no boot). A seed is only rebuilt with --init-data. SourceStorage reads the \"log\" partition name. owner-dataprotect=1 is needed for PosterBoard; a Data store made before it keeps no wallpaper until a data-reset boot (boot-reset.img).", "2026-11-13: drivers/ShengUfs (our NativeUfs fork) merged upstream ShengUfs b6fe07b (877f9e9): up to eight concurrent UFS commands with Linux ufshcd queueing, completion and DMA, cached store writes (the Data overlay syncs before its bitmap; the fork's forced-unit-access stand-in is gone), short completion waits spun through, the window devices reported as solid state, and the verified-root table cache. One boot (logs/ufs1): first GPU work and first frames at 52 s instead of 60-72 s; the Data volume checked clean with fsck_apfs afterwards (logs/data-ufs1)."]
completion = ["The root volume mounts read-only from UFS and Data persists across boots."]
limits = ["Root reads are not authenticated."]
next_action = ["Build the owner verified-root bundle."]


findings = ["iOS 27 input (2026-11-04): drivers/ShengHidInput moves to UniXNU/ShengHidInput 71a40e7 (three commits: the arm64e event driver vtable copy re-signed with Apple's slot discriminators, which are name-derived and the same in every 24A446 IOHIDFamily-2238.120.5) and is compiled with NATIVE_HID_SOURCE_API by build-native-legacy-display-27.py.", "Touch is polled; stage 2's RPMh votes need a completion check.", "Every button constant equals sheng's (SPMI arbiter v7 at the same addresses, same PPIDs).", "TouchState.cpp's placeholder button sink is gone: ButtonProbe.cpp owns native_buttons_set_sink.", "T47 (2026-10-28): quick button clicks did not register, a slightly longer hold did: the thread reads the levels when it wakes, and a short press is up again by then. T49: with sheng-buttons-taps=1 the interrupt handler records which buttons fired, and one that is up again without a reported press is reported as a 30 ms tap; BTN taps= counts them.", "T49-gpuwait: quick taps still did not register although every edge raised an interrupt and a report (45 of 45, taps=0): the driver saw them and iOS ignored them. T50: sheng-buttons-hold-ms=<ms> delays a release until the press has lasted that long.", "T51: 4 button interrupts, 4 reports, with sheng-buttons-hold-ms=80; whether quick taps were tried is unknown.", "T76 (2026-10-30): the board classes here register through OSKextRegisterBoardClasses (zzyg-board-class-registration.patch), under the kext lock, in place of preModLoad/postModLoad alone, which deadlocked T75f's boot (storage area).", "T76's first kernel build (run 41109301209) failed: XNU has no kOSReturnNoMemory; OSKextRegisterBoardClasses and its callers use kOSKextReturnNoMemory (libkern/OSKextLib.h), and the helper has a prototype before its definition.", "T76's second kernel build (run 41111730079) failed in ShengPlatformPower.cpp: BoardClasses.h had been included after the file's last #include, which there sits inside the ShengPlatformPower class; every probe now includes it after its first #include.", "iPadOS 27 (2026-11-10): touch works after two fixes: ShengHidInput reads the touch-hid node (not sheng-touch-hid), and iPadOS 27's DriverKit event service rewrites the digitizer usage pair to (1,6), so backboardd dropped the contacts; HidInputProbe's digitizerPairGuard thread publishes (0x0D,4) again. Buttons work."]
completion = ["Contacts and buttons reach backboardd as HID events."]

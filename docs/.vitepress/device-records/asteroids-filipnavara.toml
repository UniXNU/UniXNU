findings = ["2026-11-13 (irq1): the board's gpuIrq hands RBBM_INT_0_STATUS to native_adreno_gpu_interrupt (as UniXNU-sheng 0215f34), so the driver's fence waiters sleep until the completion pass: 7271 interrupts, 6532 sleeps, no deadline misses, no periodic wakes; pauses outside the lock 352765 (zc1) -> 6533. The CP stamps read the generation's always-on counter (Adreno740 816de6a; 0x0980 is another register on gen8) and the board turns them on with gpu-timeline=1 (or diag=1): all 7276 jobs stamped.", "NativeAdreno's GMU headers (NativeAdrenoGmuConfig.h, NativeAdrenoGmuPlatform.h) include ShengGmu.h, so the driver compiles also take kits/Sm7635Platform (T36 run 40296339052).", "The gen8 GMU cold start and command-database parser are the SoC kit Sm7635Platform (UniXNU-sm7635-common), as sheng's are Sm8550Platform; the board keeps ShengGmuVotes.c. scripts/check-asteroids-gmu.py passes against the kit.", "The render server composites on the A810 (window server ready in 1.9 s instead of 30.8 s).", "The GPU clock does not limit the frame rate: 1050 MHz was barely faster than 763 MHz.", "T40b (2026-10-27): drivers/Adreno740 is UniXNU Adreno740 main (5c8c145) merged into our gen8 fork (rootstockos/NativeAdreno asteroids 60f16a6): ABI v2 (128 buffers per submission), no full GPU TLB flush per submission, owned and exclusive imports mapped without alias scans. The board's GPU probe keeps its ABI structures and native_adreno_publish signature; it passes no GMU AHB fence status to the ring (the new optional fence_cookie/fence_status), so WPTR writes stay unchecked as before.", "T40c (2026-10-27): sheng's GPU governor is on by default in board.toml (sheng-gpu-dcvs=1) with the 3a's range: floor level 6 (763 MHz, the former fixed level; sheng's floor 3 is 510 MHz here and held every frame in T39b), ceiling level 7 (895 MHz; no GPU thermal throttle yet). Fence waits spin (sheng-gpu-irq=0) as a board default.", "T40d (2026-10-27): IO coherence. Nothing here set native_adreno_io_coherent, so the merged driver cleaned and invalidated every imported page around every submission (T40c log: 18 s and 361 GiB of maintenance for about 3000 submissions). GpuPowerProbe now runs UniXNU-sheng's coherenceProbe (08cde20) before publishing: a kernel page mapped write-back inner-shareable, GPU reads of CPU-dirty lines and CPU reads of GPU writes both proved against DRAM; only then is it on (sheng-gpu-coherent=0 skips it). The driver keeps GPU-written imports non-coherent (myron 5bbeb3b). Turnip's 1 ms waits (pandora 6265e2d) were already fixed upstream (100 ms slices in turnip-darwin-kmd.patch); kern.maxvnodes is 66560 from upstream's iPadOS profile.", "T44: [gpu load] counts the dcvs thread's 16 ms windows with work by busy share (under 25, 50, 85 %, 85 % or more, and those at the ceiling, where the GPU was the limit at the highest level allowed) and the longest fully busy run, to tell a GPU-bound frame from one held up elsewhere.", "T43 (2026-10-28): zero copy still alternated the new frame with the wallpaper alone with the shown swap held (586 held to the next latch, 44 by timeout; held swaps also slowed animations, so the compositor waits on the completion), and no flip ever waited for the GPU. The ring flushes the GPU caches (CACHE_FLUSH7, CACHE_INVALIDATE7) only in the prologue of the next submission, so a finished frame's last passes reach memory late: the GPU copy read them through those caches, the display fetches memory. T45: sheng-gpu-endflush=1 (NativeAdreno) adds CACHE_FLUSH7 and CP_WAIT_FOR_IDLE before each framed fence.", "T45 (first build, 2026-10-28): sheng-gpu-endflush never took effect: this board attaches the ring in package/GpuPowerProbe.cpp (gRing), not in NativeAdreno's service, where the boot argument was read. T45b sets it on gRing.", "T46: the GPU was the limit at times while opening apps: of 1098 windows with work, 117 were 85 % busy or more, 111 of them at the ceiling (level 7), the longest fully busy run 149 ms. T47 reverts the end flush and the published fence in NativeAdreno (cd2bbe5, the ring is 1139088's again) and its setting in GpuPowerProbe.", "T48: GpuPowerProbe exports native_gpu_fences (the ring's submissions and the fence page's completed timestamp) for the display probe.", "T49-gpuwait (2026-10-28): scrolling and app opening keep the GPU at its ceiling. 511 of 1075 waited-on fences stayed pending 8 ms or more (121 for 16-32 ms); per-submission cache maintenance cleaned 65 GiB in 114 s (3.6 s of CPU); clients made 198049 fence waits, 99 % timing out at once. T51 measures it: GPU time per submission from the submit hook (NativeAdreno native_adreno_ring_hook) and the fence interrupt, with GPU idle and queued time; maintenance bytes by kind of buffer; the timeouts clients ask for.", "T51 (first build): the board's declaration of NativeAdreno's ring hook carried weak_import inside an extern \"C\" block, which makes it a definition; it is now a plain declaration, set unconditionally (the driver always provides it).", "T51 (2026-10-28): 1979 frames in 118 s, 48 % 17-25 ms apart, 7 % within 9 ms. Swap to GPU done was 8-12 ms for 1180 frames. Per-submission maintenance cleaned 126 GiB (7.0 s of CPU), nearly all read-only imports (127722 MiB counted): every submission cleaned every client's imports, since the VM is shared. Clients made 573185 zero-timeout fence polls (about 4900 per second); the big cores ran 67 % busy. [gpu time] stayed empty: its fences were only taken from the GPU interrupt, and the board runs sheng-gpu-irq=0. T52: sheng-gpu-own-maint=1 (NativeAdreno per-client maintenance), GPU timing also from the display's flip wait and the governor tick.", "T52 (2026-10-28): GPU time per submission, now measured: mean 13.6 ms at level 7 (n=1035; 371 between 17 and 25 ms), 9.0 ms with the GPU held at level 9 (n=1095), so the time scales with the clock and its bandwidth vote: the GPU does too much work per frame rather than stalling. Per-client maintenance changed nothing (55 MiB per submission): the compositor submits nearly everything and owns the imports it cleans. sheng-gpu-irq=1 cut clients' fence polls from 573185 to 13707. T53: the asteroids Turnip patch (UniXNU patches/mesa/turnip-asteroids-stats.patch) counts each submission's passes, system-memory passes, blits, draws and render area; [gpu work] ties them to GPU time.", "T53 (2026-10-28): with Turnip's counts, 5535 of 7713 render passes (72 %) ran in system memory rather than GMEM, and submissions with such a pass took 7.4 of the 12.3 s of GPU time (60 %); 26153 blits, copies and clears (about 20 per submission); 585 single-pass submissions averaged 8.9 ms of GPU time. The draw count read 0 throughout. T54: the reason for each system-memory pass (tile memory too small, feedback loop, too many tiles without HW binning, autotune and so on) per submission, tied to GPU time; asteroids-tu-debug=<flags> in the boot arguments adds Turnip debug flags (gmem, sysmem) for one boot.", "T54 (first add-on build): Turnip with the reason counts compiled; the plugin failed because setTurnipDebug sat inside the publish-only namespace while one caller is outside it. It now sits before that block.", "T54 (2026-10-28): every system-memory pass was Turnip's autotune choice (586 submissions, 6.6 of 10.8 s of GPU time); nothing forced it. Forcing GMEM (asteroids-tu-debug=gmem) put every pass in GMEM and rendered correctly, but GPU time per submission only went from 11.0 to 10.5 ms (single-pass submissions 11.4 to 9.8 ms): where the passes render is not what costs. The Reduce Transparency test could not run (Settings crashes opening Accessibility: Preferences sig 11 at PC 0). T55: GPU timestamps around each pass, blit, copy, resolve and clear give GPU time per kind (turnip-asteroids-timing.patch, [gpu ops]).", "T55 (2026-10-28): stuck at the Apple logo. Not a GPU hang (47 submissions in 100 s, the GPU idle): the wallpaper poster extensions (AegirPoster, KaleidoscopePoster) asked for Metal 12 times each and AegirPoster aborted (signal 6) on every launch, which no earlier boot showed; [gpu ops] collected 14 command buffers and 41 timing brackets that never ran. T56: the brackets are inert unless TU_DW_TIME is set, which the plugin does only in the render server with asteroids-tu-time=1.", "Correction to T55: AegirPoster aborted 5 times in T49-gpuwait too, which booted normally, so the poster crashes are an older bug and not why T55 stayed at the Apple logo. What T55 changed is the timing brackets in every process, the render server included, which made only 47 submissions in 100 s with 41 brackets never written. T56 (timing off) and T56-time (timing in the render server only) separate the two.", "T55-T56 (2026-10-28): the cause of T55's hang was the timing stamps, not the posters: fence 52, the render server's first frame, never completed (51 written), so every later frame waited and PosterBoard's open was refused once the driver stopped taking clients. T56 (brackets inert) booted normally with 913 submissions. T57: the stamps copy the always-on counter with CP_REG_TO_MEM (as Turnip's autotune does, which runs on every boot here), the end stamp after a wait for idle; asteroids-tu-time=passes times render passes only.", "T57 (2026-10-28): t57-passes hung the same way: fence 55 never completed (54 written), and [gpu ops] showed 10 command buffers whose 10 brackets were never written. Both stamp methods wrote into the command buffer's sub-stream memory, which Turnip allocates GPU read-only unless marked writeable, and the Darwin backend maps it with read-only permission. T58: the slots come from the sub stream's GPU-writable memory (tu_cs_set_writeable around the allocation, as Turnip does for GPU-written clear data).", "T58 (2026-10-28): t58-passes booted (1033 submissions): the stamps work once their slots are GPU-writable, confirming T55 and T57 hung on writes to read-only command memory. GPU time per submission 10.2 ms mean; timed render passes took 8.0 of its 10.6 s: 1692 GMEM passes 7.2 s (4.3 ms each), 4031 system-memory passes 0.8 s (0.2 ms each, the autotune's small ones). Untimed in this mode: 19239 blits and the rest (2.5 s); a pass's start stamp does not wait for idle, so blits still running when the next pass starts count toward that pass. t58-all brackets the blits too.", "T58-all (2026-10-28): with everything bracketed (998 submissions, 10.5 s of GPU time, 9.8 s inside brackets): 1636 GMEM passes 7.2 s (4.4 ms each, unchanged from t58-passes, so no blit time had leaked into them), 4897 system-memory passes 0.9 s (0.19 ms), 20876 copies 1.7 s (0.08 ms), 509 clears and 8 blits negligible, no resolves. GMEM passes are 68 % of GPU time.", "T59: asteroids-tu-time=tiles splits each GMEM pass into stages: begin with binning (to after tu6_tile_render_begin), the first subpass's loads and clears (a stamp in draw_cs under the GMEM render-mode condition), draws and stores per tile, summed on the GPU with CP_MEM_TO_MEM as the occlusion queries accumulate, and the pass's end; with tile counts, tile size, render area, HW binning and attachments loaded and stored. The totals reach NativeAdreno as SetMetadata tagged TILE (native_adreno_tiletime) and the log as [gpu tiles].", "T59 (2026-10-28): t59-tiles booted. 1849 GMEM passes, 8.2 s (the per-tile stamps add about 1 s over T58): begin with binning 0.35 s, loads and clears 1.14 s, draws 4.99 s, stores 1.24 s, between tiles 0.50 s, end 0.01 s. 64 tiles per pass (max 85) of about 33K pixels for about 2.0 MP of render area: the A810's GMEM is 576 KiB (NativeAdreno profile 0x90000), so a full-screen pass is cut into many small bins; HW binning ran in 1499 passes; about one attachment loaded and one stored per pass. Per pixel, these passes ran at about 0.46 MP/ms against about 1 MP/ms for the autotune's system-memory passes (0.22 MP each).", "T59-sysmem (2026-10-28): every pass forced to system memory (asteroids-tu-debug=sysmem): 5900 passes, 7.3 s; 746 submissions, 13.0 ms of GPU time each. GPU time per megapixel of render area was the same as with the autotune's mix (9677 ms / 4593 MP = 2.1 ms/MP; t58-all 10546 / 5017 = 2.1): the large passes cost about 2.1 ms/MP in either mode, so tiling is not what makes them slow; their per-pixel work is.", "T60: [gpu frags] splits timed passes into large (1 MP of render area or more) and small, and takes each pass's draw count and samples passed from the autotune's finished entries (its BANDWIDTH metric), so samples per pixel of render area gives overdraw. The turnip-asteroids-stats draw counter had never been sent (the submit word has no bits left), which is why the draw count read 0. The totals reach NativeAdreno as SetMetadata tagged FRAG (native_adreno_fragstats).", "T60 (2026-10-28): 634 submissions, 13.4 ms of GPU time each. 1319 large passes took 6.2 s (4.7 ms each) for 2.52 MP of render area, the full screen; 2719 small passes took 0.2 s (70 us, 59K px). Measured large passes averaged 99 draws (most 262) and 9.2M samples, an overdraw of 3.6; small ones 5 draws and an overdraw of 2.3. Large-pass time per sample is about 0.5 ns, about 3.5 samples per clock at the 895 MHz ceiling (the draws stage, 61 % of a GMEM pass in T59, makes it about 3.2 Gsamples/s). The large passes are slow because CoreAnimation stacks about 3.6 full-screen layers in roughly 100 draws, each shaded and blended in full; on Apple GPUs hidden-surface removal skips the occluded opaque fragments, on the A810 without a depth buffer nothing does. [gpu dcvs] still prints sheng's MHz labels (220-680) for the 3a's levels.", "T61: a GPU trace so that new measurements need no new build. asteroids-tu-trace=<letters> (AsteroidsMetalPlugin.mm, render server only) sets Turnip's TU_DW_TRACE (UniXNU patches/mesa/turnip-asteroids-timing.patch): binary records in m2v/gpu/trace.bin of every timed pass (GPU start and end, render area, GMEM or system memory, tiles and tile size, HW binning, the attachments' formats, load, store, clear, UBWC and tiling, the draws recorded), every draw (vertex and fragment shader ids from the stages' BLAKE3, blend enable and factors, write mask, depth and stencil state, scissor, count), every shader once (ir3's statistics: instructions, nops, texture and SFU counts, registers, waves, sync stalls) and the autotune's samples passed per pass. Letters: p passes, d draws, b shader binaries (1 = pdb), s each draw's samples passed (an occlusion-query pair around every draw, accumulated over tiles by the GPU, with a wait for idle after each draw, so GPU time in that mode is not representative), t GMEM stages, a blits and copies. The file stops at 56 MiB. scripts/gpu-trace.py reports on it (passes by size with overdraw, large-pass draws by blend state with their samples, the fragment shaders behind them with their statistics, render targets) and dumps CSV tables and shader binaries; its record layouts were checked against the C structs by compiling them (118, 60, 76 and 24 bytes). The Turnip changes compile on Linux against the pinned Mesa with every recorded patch applied (local/mesa-full, kgsl build in local/mesa-check).", "T61 (2026-10-28): the trace works end to end: t61 booted, 7 export rounds, pull-asteroids-log fetched and decoded it (5726 passes, 127601 draws, 71 shaders over 35 s, nothing lost). The Metal bridge records each pass's draws in a secondary command buffer, so draws carry the secondary's serial; gpu-trace.py joins each secondary to the next primary serial, which matches the autotune's draw count for 1567 of 1570 passes. The blend fields are not valid: every draw reads factors 0, 0, 0, because Turnip keeps static blend state in the pipeline and not in the command buffer's dynamic state, where the recorder reads it. Findings, large (full-screen) passes, 7.8 s in all: (1) 252 passes with 200-400 solid fills take 12.9 ms each (11.3 ms in system memory, so not tiling) at an overdraw of 11.8, about 41 % of the time; each fill is a 768-vertex mesh drawn by one of two fragment shaders, vertex color times alpha (9 instructions) or the same plus metal2vulkan's exact 8-bit output rounding (85 instructions: per-channel flags from a constant, scale, rndne, compare, select), about 151 and 65 per pass. 232 passes with 100-200 fills take 4.0 ms at an overdraw of 2.2. (2) 1325 passes with few draws (about 8, overdraw 0.19), mostly with the attachment loaded and stored, take 2.3 ms each in GMEM and 1.7 ms in system memory, about 38 %; 155 with no draws at all take 0.8 ms. The exported screen is the console layer (black under zero-copy scanout), so it does not show the scene. ir3-disasm from the local Mesa build (local/mesa-check, chip ffff44010000) disassembles the trace's shader binaries.", "T61-samples (2026-10-28, asteroids-tu-trace=pdbs): the per-draw sample counters ran without a hang (101786 draws, 37 s; GPU times not representative: a wait for idle after each draw). Large passes drew 9.98 G samples. The 768-vertex solid fills that dominate the draw count are tiny (about 325 pixels each for the 9-instruction one); the pixels go to shaders that end in metal2vulkan's exact 8-bit output rounding (saturate, NaN test, x255, rndne, compare with +-0.5, correct, x1/255, select by per-channel flags from c4), about 50 instructions on top of 5-15 of real work: 31 of 66 fragment shaders, 71 % of the samples and 95 % of the instruction-weighted work. The largest single consumer, 6238666134616236 (interpolated color then the rounding, 82 instructions), drew 4.9 G samples at 1.67 M per draw. Upstream development removed this rounding (70068f7c, 'Leave color writes to the device's own conversion', 2026-10-28); the pinned translator only skips it for drivers it has measured (VkProperty::MetalColorWrites, MoltenVK), with no option to set it. Light passes (fewer than 20 fills): 1199, median coverage 0.19 of the screen, 58 % under a quarter, mostly loading and storing the whole attachment (GMEM 621, system memory 517).", "T61-stages (2026-10-28, asteroids-tu-trace=pdbt; gpu-trace.py now splits large passes by coverage, the autotune's samples over the render area): large GMEM passes drawing under a quarter of the screen (459, about 85 tiles, 20 draws) took 2.7 ms each: loads 0.90, draws 0.45, stores 0.94, between tiles 0.38 ms, so about 80 % is loading and storing the whole attachment around a small change; large system-memory passes at the same coverage (66) took 0.17 ms. At coverage 1-3 GMEM took 4.5 ms (draws 2.9) against 2.3 ms in system memory (8 passes); at 8 or more, 13.7 ms with 12.0 ms of draws. The autotune still chose GMEM for most light passes. Load and store run at about 11.5 GB/s each way (10.3 MB of BGRA8 in 0.9 ms). T62 plan: metal2vulkan updated to development (exact output rounding removed) plus a toggleable Turnip choice of system memory for passes whose history draws little of their area.", "T62 (2026-10-29, built, not booted): metal2vulkan moves to development eeb79340 (UniXNU a49a8dd), where color writes are the device's own conversion (70068f7c) and float maths the device's (4817f3bdf, cdc09276f), removing the exact 8-bit output rounding that T61-samples found in 95 % of the large passes' fragment work. The bridge is rootstockos/AdrenoMetal asteroids (137eeb1, forked from UniXNU/AdrenoMetal): the 16 shared patches and sheng's 21 from feat/ipados27-gpu-parity (which stays on the old pin) were triaged against development; 17 remain (skip draws without a pipeline, two-plane shadow as memory lies, padded framebuffers through a new PaddedRowsPolicy::AliasWrites since development removed padded-row aliasing, priming cache, refuse_rebinds now actually set by the bridge, optional shader cache, sRGB extended-range blend, bitreverse, growing memory blocks, patches without control points, heap texture size, Core Image libraries and two small speedups); the rest (keep final pass, fewer allocations per draw, keep draw commands and lists, map tracker keys, and most of sheng's draw-path patches) are done in development by LiveBind, SpareLiveBinds, ViewportList and KeptRenderPasses. Turnip: asteroids-tu-light=<percent> (TU_DW_LIGHT, render server only) renders a pass in system memory when its history draws less than that share of its area (T61-stages: 2.7 ms in GMEM against 0.17 ms in system memory for passes under a quarter of the screen); trace pass records flag such passes (4), and draws read the pipeline's static blend state. Not covered: the translator's own tests beyond the touched areas, and any device run.", "T62 (2026-10-29), every Metal process on the GPU, as sheng's iPadOS 27 branches do (UniXNU-sheng 9800f8cd): drivers/Adreno740 merges UniXNU/Adreno740 feat/ipados27-gpu-parity (rootstockos/NativeAdreno asteroids ad01b92): no connection cap, growing object, queue and job tables, a BO pool of contiguous chunks, msm hangcheck and restart, and per-process GPU address spaces (own page table and ASID, 4 GiB to 2^ias) switched into the GPU's bank: mode 2 by CP_SMMU_TABLE_UPDATE in the ring, only where the board opened the CP's SMMU aperture and one switch is proved at publication, else mode 1, the CPU writing TTBR0 with the GPU idle. This board keeps mode 1: asteroids-gpu-cp-aperture=1 makes sheng's qcom_scm_set_gpu_smmu_aperture call (off: the CP switch has not run on an A810). Kept from this fork in the merge: the gen8 slice SRAM init before the table switch, the reserved GMU pool (its table pages now on demand), single-stream contexts, per-client maintenance, and the loader-kept BO pool (adoptPool) as an adopted chunk of the chunked pool (write-combined, zeroed with stores, never given back). The merge had refused a nonzero submit reserved word, which carries the asteroids Turnip's counts; that check is gone. The board publishes the context's ias with va_start GpuClientVaStart and grants the accelerator to every process (NativeSandboxGrantProcess \"*\"); the plugin's client list is \"*\". UniXNU 2b79721 takes sheng's Turnip backend for the new ABI (address allocator, BO cache returned under pressure) and ArmSmmu4K 30ec63b. Host tests on Linux (GMU and GPU contexts, the board GMU pool, VM, SMMU memory, GMU memory and map) pass; the kernel, board and Turnip backend only build on CI.", "T62 first kernel build (run 40785590664) failed to link: _native_pmap_user_mappings, which the merged NativeAdrenoMemory::release weak-imports from sheng's XNU patch for a diagnostic count; GpuPowerProbe.cpp now defines a weak stand-in that finds no mapping, as it does for boot_log_export_put. The add-on (run 40785594609) built: metal2vulkan development, the bridge, sheng's Turnip backend and the plugin compile for iOS.", "T62 (2026-10-29, booted): slower, with more glitches: the kernel's grant patch (UniXNU zzw-native-adreno-sandbox-grant) compared NativeSandboxGrantProcess \"*\" as a process name, so no process had the grant: the sandbox refused AGXDeviceUserClient to backboardd and the apps, Turnip reported no device (VK_ERROR_INITIALIZATION_FAILED), the render server composited on the CPU (71 ms a frame) and crashed twice (an alignment fault on a store), and only SpringBoard and Preferences, whose profiles allow the class, opened the GPU. The gpu-trace in that log was T61t's file left on the persistent Data. UniXNU feb5612: \"*\" names every process.", "T62b (2026-10-29): backboardd and seven apps each on their own GPU address space (mode 1 table switches), no crash, but no faster than T61: 12.2 ms of GPU time per submission against 12.0, 2.7 ms per megapixel of render area against 2.2 (the apps' own rendering now counts too), compositor 52 ms a frame against 47; mapping into the per-process tables took 492 ms in all against 25. No trace file: m2v/gpu was missing on the phone (Turnip makes only its last directory).", "T62b-light (2026-10-29, asteroids-tu-light=100): no felt difference; it froze after many app opens. At 352-358 s the 1 GiB BO pool filled (1023 MiB in use, backboardd 873 MiB, seven GPU clients), 61 BOs fell back to scattered pages, and the render server's submission 1490 never completed: no SMMU fault, no recovery, every later wait timed out. Photos and ScreenshotServicesService aborted on an uncaught exception (!PXPixelSizeAreaIsZero(roundedSize)). Sheng's answer, user BOs from system memory with no pool (Adreno740 882f4bf), would move them into XNU's 4.75 GiB window, where 849 pages were free; the loader-kept GiB would then go unused unless the window takes it back. Not merged.", "T63 (2026-10-29, built from UniXNU 2ee276c): the Metal stack is sheng's: drivers/AdrenoMetal is UniXNU/AdrenoMetal feat/ipados27-gpu-parity ca7faaf (rootstockos/AdrenoMetal asteroids b4fb935), metal2vulkan development 624bab39 under sheng's 18 bridge patches (all apply; in-place written textures replace T62's padded-rows policy), with the encoding thread, the telemetry table (the boot log's rows from native_adreno_metal_rows, empty until now), priming from the OS image's 159 metallib paths (scripts/data/prime-list.txt, embedded in __DATA,__primelist), cache import (off here: the driver has no method 0x7101) and the half-float scanout conversion; GopFramebuffer 90b64ef for its header only (the kernel builds this repository's fork). package/AsteroidsMetalPlugin.mm is sheng's plugin with this board's diagnostics: the asteroids-tu-* boot arguments (and the trace's directory made whole), the render server's stacks as BT pieces, the stack-only mode, supportsConditionalLoadStore answered NO, the deep framebuffer off by preference with sheng's render-server memory writes removed, and the clients list. The kernel and Turnip are T62b's.", "T64 (2026-10-29): the GPU's BOs move into XNU's memory. drivers/Adreno740 merges sheng's feat/ipados27-gpu-parity again (rootstockos/NativeAdreno asteroids c24a81c): user BOs are pageable system memory the driver wires (882f4bf), no fixed pool, the import region method 0x7101 (aa015f7); this fork keeps adopt() for the GMU pool. GpuPowerProbe no longer tests and adopts the loader-kept pool (mode 17 step 1), GPB_GPU_POOL_* and board.toml gpu_pool_* are gone, and the boot log's [bo pool] row is [bo memory] (system BOs, spans, MiB in use and peak, refusals). The loader's map (uefi-asteroids) drops GPU_Pool and the window grows to 7.75 GiB (memory area). Host tests on Linux pass (GMU and GPU contexts, VM, system memory, SMMU memory, GMU memory and map) except test_memory's stale 256 MiB budget check, as before the merge.", "T64 first kernel build (run 40832768114) failed to link: _native_ufs_import_blocks and _native_ufs_import_read, which the merged driver's import method 0x7101 (aa015f7) weak-imports from sheng's ShengUfs; GpuPowerProbe.cpp now defines weak stand-ins that report no region, as for native_pmap_user_mappings, so the method answers not ready and the plugin's cache import stays off.", "T64 at 6 GiB (2026-10-29): booted, but every process rendered on the CPU: no Metal askers, no GPU clients, no ASTEROIDS GPU report lines. The kernel client's test (mode 17) ran its steps (6 system BOs allocated and mapped, 34 submissions completed) yet missed, so the accelerator was never published (dcvs off, no userWatch); its result lines had left the kernel buffer, the board kept no row of them, and this boot's unified log never reached Data. GpuPowerProbe now keeps the round, burst and summary lines (native_gpu_uc_text) for BootLog's [gpu uc] rows, and asteroids-gpu-publish-unverified=1 (off by default) publishes despite a miss, to see whether user space renders while the test fails.", "T64b and T64b-nomedia (2026-10-29): the kernel's own test passed (rounds 4/4, burst 32/32), but the first user job (fence 41) never completed, from mediaserverd and, with mediaserverd off the client list, from backboardd: GPU 99% busy, no SMMU fault, the ring read pointer past the IB packet. T63 (T62b's kernel, the loader-kept pool, the same add-on) ran well: 1703 submissions at 7.3 ms of GPU time, compositor 33 ms a frame. A host walk of scattered BOs in a 48-bit per-process table found every page right (833 pages), so the tables are not it. xnu-10063 zero-fills a system BO's pages through the cacheable kernel alias and then sets the write-combined attribute without cleaning a line (pmap_batch_set_cache_attributes cleans for VM_WIMG_RT only); sheng's allocateSystem cleans only default-attribute BOs. NativeAdreno 4063b92 cleans and invalidates every write-combined system BO by physical address after the VM hands it over. GpuPowerProbe now gives the driver a DRAM reader (ml_phys_read_word), so a stall's [gpu stall] rows can show a system BO's words instead of deadbeef.", "T65: drivers/Adreno740 takes NativeAdreno 5e2b23e: user BOs come from a pool reserved at GPU bring-up again (sheng's ad01b92 chunks, sheng-gpu-pool MiB, default 1536, without the adopted range), one span each, system memory when it is full. T64c's system BOs left 228876 owned spans live, VM insert/erase 641/841 ms against T63's pooled 61/74 ms, BoAlloc/Map/Free 196/457/940 us against 59/146/222, compositor mean 139 ms against 33 ms.", "T65: GpuPowerProbe makes sheng-gpu-import-skip default to 1: T63 spent 89 GiB (about 3 ms of each 4.4 ms submission) cleaning read-only imports every submission; T40f measured skipping it at 7x cheaper submissions with no stale content.", "T65 (2026-10-29): the pool served all 2029 BOs (peak 789 MiB, none to system), VM map/unmap 148/130 ms, import cleaning 0; compositor frames under 8 ms 82 % (T63 63 %, T64c 28 %), flip gaps under 9 ms 44 %, GPU 7.1 ms a submission. Felt better but not 120 fps.", "T65-sysmem (asteroids-tu-debug=sysmem) and T65-1050 (level 9, 18.6 GB/s DDR vote against 8.17) repeat T59 and T52/[gpu 3] with today's stack and change nothing felt: large passes 2.2 ms (sysmem) and 2.57 ms at overdraw 2.8 (1050; 0.36 against 0.39 ns a sample), near-empty linear load/store passes about 2.4 ms in GMEM either way. Neither tiling, GPU clock nor the DDR vote limits the frame. Not yet tested in any log: sheng-dpu-early-done=1 (T52, NativeLegacyDisplay), which ends T51's serial compositor -> GPU -> latch chain.", "T65-early (2026-10-29, sheng-dpu-early-done=1, its first run): worse. Flip gaps under 9 ms 21 % against T65's 44 %, swap to screen 11.6 ms against 6.7, GPU queued 8.0 s in 1508 submissions against 16.4 s in 5464, GPU time 9.3 ms a submission against 7.1, 632 of 1047 work windows at the ceiling. Freed from the latch, the compositor only queues more GPU work, so the serial chain is not the limit: the GPU's work per frame is. Stays off.", "T65-samples (2026-10-29, asteroids-tu-trace=pdbsa, first measurement of occlusion; local/triage/occlusion-from-trace.py): 1317 large passes, 8.44 G samples, 69 % from opaque draws (blend off). At least 3.70 G (43.8 %) were shaded under a later opaque draw covering 95 % or more of the pass (575 passes have one); counting partly covering opaque draws as independently placed, about 56 %. Turnip saw no feedback loops (sysmem reason 0), so these draws do not read the destination. On Apple GPUs hidden-surface removal skips them; here a translator-side depth order (opaque draws front to back with depth writes, then blended draws in order with the depth test, LRZ rejecting) would.", "Metal against Vulkan passes (the plugin's S row against the trace): T65 26407 Vulkan passes and 11291 full-screen against Metal's 24253 and 9590 with draws equal to 0.4 % (+18 % full-screen); T65-samples, scaled by draws (trace 91 % of Metal's), about +5 %. metal2vulkan adds some full-screen passes, between 5 and 18 % in these two runs; which ones is not yet known.", "T73 (2026-10-30, T72's Turnip rule of passes under 100 draws in system memory unprofiled, UniXNU 7dd0abb; reverted in b239c19): no such pass ran in GMEM (T71: 1106), and it felt worse than T71. Per full-screen pass, 25-99 draws cost 0.94 ms mean against 1.86 ms, under 25 draws 1.66 against 1.67 ms: T71's 89 us system-memory median came from the autotuner sending only cheap passes there. The run drew 4.9 full-screen passes a frame against 3.2 (GPU 18.3 ms a frame, flip gaps under 9 ms 17 %), so whole-run numbers do not compare.", "The extra Vulkan passes (2026-10-30, metal2vulkan 624bab39 with the bridge patches, render/inline_first.rs): a compositor pass opens inline with its memoryless color in a transient image; a later draw that writes that color splits the pass (WorkCounts::inline_memoryless_write_splits), and the new instance loads and stores both attachments. The traces show it as back-to-back full-screen pairs in one command buffer, the first clearing the second attachment and the second loading and storing it: 2002 in T65 (against about 1700 full-screen passes more than Metal) and 343 in T71. The split itself costs little: the gap between the halves is a median 13-48 us (T73: 221 splits, 11 ms in 55 s), and most second halves render in system memory, where their loads and stores cost almost nothing; their own time (T71 516 ms, median 1.6 ms) is draws that run either way. Not worth changing for frame time. metal2vulkan also stores Metal's DontCare attachments on Turnip (no measured DriverFact) and always renders over the whole attachment.", "T74s (2026-10-30, T71's Turnip with asteroids-tu-debug=sysmem, every pass in system memory): no red/blue colour flips, which T70 to T74 showed from time to time. So the flips come from GMEM rendering of the screen surface, a linear 1080x2392 IOSurface whose height is not whole GMEM blocks, which sheng's turnip-render-mode-for-attachment-memory.patch (UniXNU ca59120) loads with a 3D blit and stores with the unaligned CP blit (store_cp_blit, its swap chosen as if GMEM ignored the attachment's swap). Not yet narrowed to the load or the store.", "T75 (2026-10-30, UniXNU e0f3223, add-on only): three changes from the open/close analysis. (1) The compositor's surface renders in SYSMEM (Turnip: a linear attachment over unpadded owner memory never takes GMEM), the fix for T70-T74's colour flips. (2) Priming in list order with scripts/data/prime-list.txt led by QuartzCore and CoreImage, the other system frameworks next, applications last, MTLReplayer dropped: T74's priming read the list as a sorted set, spent 88 s on MTLReplayer's ray-tracing kernels (201 of 264 refused) and never reached QuartzCore. (3) Frame traces per process in m2v/gpu (frames-<pid>.trace), exported with the GPU trace: the shared frames.trace was truncated by every process's writer. From T74b's telemetry: commit to scheduled about 3 ms per command buffer (2578 waits for it, 7.3 s), commit to completion callback 23 ms mean against about 5 ms of GPU work, and the render server starts each frame from the previous one's completion (the bridge's earlyOn, reverted by sheng for blur reading unfinished frames). Ruled out by counters: write-combined reassertion (0 ms), surface cache flushes (1.7 ms in all).", "T76 (2026-10-30): the board classes here register through OSKextRegisterBoardClasses (zzyg-board-class-registration.patch), under the kext lock, in place of preModLoad/postModLoad alone, which deadlocked T75f's boot (storage area).", "T75 (2026-10-30, add-on 23 on the T73 kernel): no colour flips; open and close felt no faster, so priming (which reached QuartzCore first) was not the stutter. Its per-process frame trace (frames-56.trace, backboardd, 1960 command buffers in 76 s): heavy command buffers (120 draws or more, n=1126) took 2.8 ms from creation to commit on the render thread, then 8.1 ms median from commit to scheduled and 20 ms to completion (p90 38 ms); light ones (under 60 draws) waited 11.2 ms to be scheduled, queued behind heavy ones on the bridge's serial encode thread. The render server waited for scheduled 867 times (2.2 s). Big cores averaged 2.1-2.3 GHz during the animations ([cpu gov]), so the encode thread's Vulkan recording and submission, about 40 us a draw, is the gap before each heavy frame's GPU work.", "T75f (2026-10-30, T75 with sheng-cpufreq-min=3000, every CPU at its highest level): heavy command buffers took 2.9 ms to commit and 8.5 ms from commit to scheduled, as in T75 (2.8 and 8.1 ms): the governor already held the big cores at 2.4-2.5 GHz, 88-96 % busy, during the animations. Light ones fell from 11.2 to 1.6 ms (the floor only helps between animations). The 8 ms is CPU work on the bridge's encode thread at full clock. T76: the bridge samples that thread with asteroids-sample=1 (AdrenoMetal 9db50e8, m2v/gpu/cpu-<pid>.profile), and the add-on artifact carries NativeAdrenoMetal.unstripped and libvulkan_freedreno.unstripped to symbolize it.", "T76's first kernel build (run 41109301209) failed: XNU has no kOSReturnNoMemory; OSKextRegisterBoardClasses and its callers use kOSKextReturnNoMemory (libkern/OSKextLib.h), and the helper has a prototype before its definition.", "T76's second kernel build (run 41111730079) failed in ShengPlatformPower.cpp: BoardClasses.h had been included after the file's last #include, which there sits inside the ShengPlatformPower class; every probe now includes it after its first #include.", "T76's third kernel build (run 41114667427) hung for 25 minutes in the CI bootstrap's GitHub fetch of the pinned Linux sources for the GMU header, which had no time limit, so kernel.org's fallback never ran (cancelled). prepare-asteroids-gmu.py now gives a source up when it sends under 1 KiB/s for a minute or takes 15 minutes, and falls back as on a refusal.", "T76 (2026-10-30, kernel with the class registration fix, which booted; add-on 24 with asteroids-sample=1): the encode thread's profile (cpu-56.profile, 34064 samples) found it idle in condition_variable::wait for 88 % of samples and in kernel calls for 6.5 %, so the 8 ms from commit to scheduled (T75) is not its work: metal2vulkan holds a submission while two of its queue's run (command_buffer/group.rs), and the GPU is the busy one. [gpu work]: single-pass submissions averaged 8.8 ms of GPU time (1142, 10062 ms) against about 2 ms for a traced full-screen pass; 38967 blits in 2237 submissions; [gpu load] 492 windows at 85 % or more at the ceiling level. The pass trace times render passes only, so the earlier finding that late frames left the GPU idle was wrong. Most blits are copies into shadowed textures (L row: 568 shadowed, 32701 copies in): metal2vulkan copies every byte of a host-page texture each time it is used unless the platform gives it a dirty-page log (dirty_pages.rs, HostMemory::with_dirty_pages), and the bridge gives none.", "T77 (2026-10-30, T76 kernel, add-on 25 with the SR/SC rows from AdrenoMetal 517b87c, asteroids-tu-trace=pdba, which times every copy, blit and clear): the class registration fix booted again. 112 host-page textures were shadowed, 53 for their pitch and 59 for their placement (no other reason, no in-place check ran), and their copies in moved 3518 Mi texels, nearly all from host pages (about 14.7 GB). In the trace (76 s), copies took 1223 ms of 3938 ms of timed GPU work (31 %, 7905 copies, median 144 us), system-memory passes 2344 ms, GMEM passes 365 ms. [gpu time] (7642 ms, n=933) is not GPU execution: GpuPowerProbe measures from submission until the CPU notices the fence (GPU interrupt with sheng-gpu-irq=1, flip wait or governor tick), so it includes late wakes (T39b: 72 % late); T76's reading of the GPU as busy was overstated. backboardd's heavy command buffers took 24.7 ms median from commit to completion (13.4 ms to scheduled) against about 6 ms of traced GPU work; light ones 3.7 ms. Next, T77i (packed, not booted): the same image with the board default sheng-gpu-irq=0 (spinning fence waits), to see whether completions noticed late hold back metal2vulkan, which submits only once fewer than two of its queue's submissions are outstanding.", "T77i (2026-10-30, T77 with the board default sheng-gpu-irq=0): completion detection is not the open/close bottleneck. With the GPU line detached, a caller's fence wait (NativeAdrenoPublish.cpp runCore) polls with 20 us IODelay pauses (314600 pauses for 10898 waits), so completions are seen within tens of microseconds; the mean wait barely changed (1.86 ms in T77, 1.94 ms). backboardd's heavy command buffers (2073, about 7x T77's 294: 42 open/close bursts against 6) still took 24.15 ms median from commit to completion (T77 24.73) and 10.88 ms to scheduled (13.38); light ones 5.32 ms (3.73). Per burst, heavy command buffers ran at a median 66.5/s (T77 56.2, from 6 bursts only), with 15 % of their commit intervals over 33 ms (21 %). [gpu time] does not get more accurate with the line off: gpuTimeFences runs only from the interrupt, flip wait, governor tick and native_gpu_fences, not from the ring's polls (191 batched detections against 1). The 24 ms is not a late wake.", "Review of T77/T77i (2026-10-31, local/tools/gpubusy.py and passes.py on trace.bin): T77's 'about 6 ms of traced GPU work' per heavy command buffer and its reading of T76's busy GPU as overstated were wrong. Merging the trace's GPU start and end stamps of every pass, copy, blit and clear, backboardd's own work kept the GPU busy 65 % of the animation bursts' wall time in T77 (3757 of 5814 ms) and 75 % in T77i (24544 of 32761 ms), about 12 ms per heavy command buffer: render passes in system memory 62 %, copies into shadows 32 % (T77i: 52261 copies, SR pitch 263 and placement 419, 22697 Mi texels in). The commit-to-scheduled wait is metal2vulkan's CompletionPolicy::Grouped (the bridge keeps the UNTRUSTED default) holding a group while two submissions of its VkQueue are outstanding, so it is queueing on the GPU too; nothing between the commit and the ring makes the CPU wait for the GPU (Turnip's Darwin backend emulates timelines in DEFERRED submit mode and resolves waits to ring fences), and the completion waiter reaches the kernel's fence wait. The GPU's work per frame stays the limit, as T52 and T65-early found: the levers are the copies (T76's dirty-page log) and the occluded samples (T65-samples). Untested: turnip-a810-sysmem-ccu.patch halves the system-memory colour cache for every pass, those without depth included. The trace's binning flag is set only in staged mode (TU_DW_TIME=tiles), so pdba runs read 0 for every pass.", "T78 (2026-10-31, add-on only, measurements behind letters of asteroids-tu-trace since the command line is at 976 of 1000 bytes): q (UniXNU patches/mesa/turnip-asteroids-submit-trace.patch) records each kernel submission in trace.bin, CLOCK_UPTIME_RAW ns before and after it (the frames trace's clock) and its command buffers' serials, so local/tools/gaps.py can fit the always-on counter to the CPU clock and file every GPU idle gap of 1 ms or more in the bursts as kernel (submitted before the gap), held (a commit before the gap not yet scheduled) or late (nothing committed); h (AdrenoMetal NativeMetalObjects.rs DirtyMeasure) gives every no-copy memory a dirty-page source that never answers, so the runtime still copies every byte but counts the copies a log would decide, while a utility thread hashes the watched pages at most four times a second and counts the unchanged ones weighted by stamps, and each watch notes whether its pages are private or shared (boot log rows DP, DW, DH); c (patches/mesa/turnip-a810-sysmem-ccu-color.patch) gives system-memory passes the whole 128 KiB colour cache and half the depth cache in place of half colour and whole depth (480 of 576 KiB with the VPC buffers), an A/B against the halved colour cache. Planned boots: pdbaq (the gaps, and the cache A/B's base), pdbaqc (its other side, compared per pass of each kind), pdbaqh (the copies; h moves the gated copies' recording to submission and adds a hashing thread, so its timing is not compared), pdbsa (occluded samples on today's stack).", "T78q (2026-10-31, asteroids-tu-trace=pdbaq, 104 s): the GPU waits for work, not only the reverse. local/tools/gaps.py fits the always-on counter to the CPU clock by the GPU's idle periods (offset 1.40 ms, drift -2.1 ppm; 424 of 446 idle periods of 5 ms or more ended 0-1 ms after a submission returned; the traced serials can't be used, since each submission starts with untraced shadow copies, serial 0). In 18 bursts (24380 ms) backboardd's work kept the GPU busy 76 % (system-memory passes 12220 ms, copies 5713, GMEM 523); gaps of 1 ms or more took 5704 ms (23 %): the GPU idle with work already in the kernel 173 ms (29), held 3126 ms (723, median 3.0 ms: a command buffer committed before the gap not yet scheduled), late 2405 ms (352, median 6.1 ms: nothing committed). Completion is seen on time (completion callbacks a median 0.3 ms from the GPU end of their traced work), and the Grouped hold is not what holds: only 81 of 1223 command buffers queued behind another were scheduled within 0.5 ms of a completion, and at their scheduling 0 (423) or 1 (687) of the queue's submissions were outstanding. Commit to scheduled grows with the command buffers committed earlier and not yet scheduled, whether the GPU is busy or idle: none 2.8 ms median with the GPU idle, one 12.7 ms, two 21.9 ms; a queued command buffer is scheduled a median 9 ms after the one before it, in two modes (under 0.5 ms or about 10-13 ms), with no relation to its copies or draws. So a serial stage on the CPU between commit and the kernel submission holds the work: the encode thread (it runs every encoder call's runtime half and then the commit, NativeBridgeMetalFrontend.mm submit) or metal2vulkan's scheduler thread; the trace has no stamp between them. The review's 'the GPU's work per frame stays the limit' holds for 76 % of the bursts, not for the idle 23 %. CoreAnimation waited for scheduling 933 times (2631 ms) and for completion 41 times (508 ms), counted only after encodeDrain, so its time waiting for the encode thread to catch up is not in either.", "T78c (2026-10-31, asteroids-tu-trace=pdbaqc, 86 s): the whole colour cache for system-memory passes (turnip-a810-sysmem-ccu-color.patch: colour full, depth half) does not help. Matched against T78q by mode, the colour attachment's load and store, area and draws (local/tools/t78/ab.py), the cells with the same work ran 1-5 % slower (full-screen SCut with 64 or more draws 4354 to 4528 us, LSut 5021 to 5189, LS 9998 to 10253); the cells that moved more (+352 %, -54 %) differ in their work between the runs, since draws are capped at 64 in the match and the apps opened were not the same. The bursts were the same as T78q: GPU busy 76 % of 19847 ms, gaps of 1 ms or more 23 % (kernel 181 ms, held 2492, late 1814). The patch only acts behind letter c and goes with the next build.", "T78h (2026-10-31, asteroids-tu-trace=pdbaqh, booted twice): the measurement crashes the render server. The first boot was left untouched (its static stacks and idle CPU were an idle phone, not a freeze); in the second (112 s, used from the start) backboardd died with SIGSEGV four times (pids 56, 262, 270, 279, each after 10-20 s of use), every time at the same instruction with ESR 0x92000007 (a read, translation fault at level 3) at a page-aligned address, on a Rust-spawned thread: the bridge's hashing thread read the first word of a watched page that was no longer mapped. A watch lives until metal2vulkan drops its shadow log, and the watched memory (all of it shared with other tasks: 74 sources, 37 watches, 52 MB, no private pages) can be unmapped before that, so the thread's alive flag does not keep the pages. What the counters had in one render server's life: 72 shadow copies in (L row cp 73) of which 72 gated and copied whole as designed (94 MB), so the gate does cover the shadow copies in; the hashing gave no share of unchanged pages (2 rounds, nearly every page first seen). The fix is in the measurement: read the pages with mach_vm_read_overwrite, which fails on an unmapped page, instead of loading them.", "T78s (2026-10-31, asteroids-tu-trace=pdbsa, 90 s, no render server crash): the occlusion T65-samples measured is unchanged on today's stack (local/triage/occlusion-from-trace.py, the same script): 2751 large passes with per-draw samples (46 without), 18.05 G samples, 70 % from opaque draws; at least 7.87 G (43.6 %) were shaded under a later opaque draw covering 95 % or more of the pass (1290 passes have one; T65-samples 43.8 %), and about 56.1 % counting partly covering opaque draws as independently placed (T65 about 56 %). Opaque draws are nearly all either tiny (43711 under a tenth of the pass) or full-screen (4332 at nine tenths or more), so the lower bound is the part a whole-draw rule could take: drawing nothing before a later full-screen opaque draw in the same pass.", "T78s, what the hidden pixels cost (local/tools/t78/pxcost_s.py, hidcost_strict.py): large system-memory passes that load and store the screen (LS, 2412) follow their pixels, time = 342 us + 340 us per million opaque samples + 473 per million blended (R2 0.90; the s letter's wait after each draw goes into the per-draw term), opaque pixels about 61 % of their time: 0.34 ns a pixel is about 11.7 GB/s of 4-byte writes, T61's DRAM rate, so in system memory every shaded pixel is a DRAM write. That is why T69's depth prepass lost (it added a full-screen depth buffer's traffic to every pass). But what a draw-skipping rule could drop safely is small: of the opaque draws over 95 % of a pass, 1694 cover all of it and 2572 cover 97-98 % (the rest of the screen still shows earlier draws), and before a cover of the whole pass with all four channels written there are 2.62 G opaque samples in LS passes (30 % of theirs, about 0.9 s at that rate) and almost none in SC passes. On T78q's bursts that is about 1.1 of 18.5 s of GPU work, near 5 %, and the translator cannot know a draw covers the pass when it records it (its positions come from the vertex shader). The 43.6 % share counted the 97-98 % covers as hiding everything before them; hidden pixels are not a large lever by any rule known to be safe.", "T79 (2026-10-31, add-on 27, UniXNU 03a1d0c, AdrenoMetal 4ea92e4): the shadows' cause, not their cost. metal2vulkan answers Metal's 16 bytes for a linear texture's offset and rows in a buffer (deviceLinearTextureAlignmentBytes, minimumLinearTextureAlignmentForPixelFormat:), while Turnip's linear images on the A810 start and step their rows at 64; QuartzCore lays out its textures over buffers by the device's answer, so the runtime bound none in place and shadowed each, copying every byte in before every use (every shadow in T76-T78 was for pitch or placement). The bridge now answers 64 for those queries and the linear private counts (NativeMetalObjects.rs LINEAR_IN_PLACE); the runtime still takes 16, so a texture placed by the old rule is shadowed as before; the IOSurface answers stay 16 (no IOSurface texture was shadowed) and the frontend's iosurfaceReadOnlyTextureAlignmentBytes asks for that answer instead of the linear one. Whether QuartzCore asks the device for each of these textures is what the boot shows: the SR row's pitch and placement counts and the trace's copy time against T78q. The same add-on carries the dirty-page measurement's fix (pages read with mach_vm_read_overwrite, DH gone counts the unmapped ones), frame trace types 6 (a commit's runtime half on the encoding thread, with the thread's CPU time) and 7 (encodeDrain waits), to split T78q's commit-to-scheduled delay, and drops the colour-cache A/B. Planned boots: pdbaq, then pdbaqh if shadows remain.", "T79q (2026-10-31, two boots of pdbaq): the copies went and the picture broke. Copy time over the run fell from 5839 ms (T78q, 65 s) to 136 ms (115 s); the L row's textures in place rose from 220 to 415, of them at Metal's pitch 31 to 18; shadows for pitch fell from 236 to 3, for placement stayed (202 to 281). The open/close animations felt smooth. But small textures were scrambled in blocks: text (Settings' title and rows, the App Library's labels, with a garbled copy below), the Dock's and Settings' icons and the wallpaper's blurred shadow, while full-screen layers, the clock's digits and the App Library's large icons were clean (photos, no screen capture: the diag frame is the teardown's text). Every texture over host pages is bound in place unchecked (HostPageTexturePolicy::InPlaceWrites), so the scrambled ones are read through a linear image. Turnip steps a linear image's rows at 64 bytes a texel byte (256 for BGRA8, 64 for R8; fd6_layout.c) and takes an explicit layout at 64 bytes; the textures newly in place are mostly at Turnip's own step, so 1- and 2-byte mask textures (glyphs, blurred shadows) are the likeliest; the explicit-pitch ones were already in place in T78q without visible damage, which argues against them. Not settled: no log said which formats went in place. requiredLinearTextureBytesPerRowForDescriptor: still padded rows to 16 while the queries answered 64. The first boot also ended backboardd with SIGKILL at about 70 s (cause not found); the second had a Photos abort (MobileSlideShow sig 6), not looked into.", "T80 (2026-11-01, UniXNU f2ce6cc, AdrenoMetal 13b40af): one add-on, the answer picked by TU_DW_TRACE letters: o the runtime's 16 (T78's layout, to show the build itself is clean), w 64 texels (Turnip's own step: 64 bytes a texel byte, 256 where no format is named), r 16 for 1- and 2-byte texels and 64 for the rest, none 64 (T79); requiredLinearTextureBytesPerRowForDescriptor: pads by the same answer. l logs each texture over a buffer (m2v/gpu/textures-<pid>.txt: format, texel bytes, size, rows, Turnip's own row, the rows' class, in place and at Metal's pitch). Planned boots: pdbaql, pdbaqwl, pdbaqrl (pdbaqol if all three scramble); the clean letter with the copy time nearest T79q's becomes the default.", "T80l (2026-11-01, pdbaql): icons still in shuffled blocks; backboardd restarted once and ran at 120 FPS after. The texture log shows backboardd's icons (RGBA8 58x58 and 128x128 over buffers, rows 256 and 512) in place over Turnip's own linear image (driver pitch, not DRM_FORMAT_MOD_LINEAR); T78 refused that class for pitch and copied it, and its 31 explicit-pitch textures drew clean. Most glyphs (A8) lie 64 bytes into their buffer and stay copied (placement). L inp 82/5, refused 1 for pitch and 51 for placement.", "T80r (2026-11-01, pdbaqrl): same blocks. The 16-byte answer for 1- and 2-byte texels left Core Animation's rows unchanged (an A8 43 wide still 64), so r and w lay icons out as none does; w and o were not booted. L inp 190/13. textures-<pid>.txt persists in the cache across boots: T80r's textures-253.txt is T80l's.", "T81 (2026-11-01): AdrenoMetal bridge patch 0022 adds metal2vulkan boot letters: k takes the DRM_FORMAT_MOD_LINEAR image at Metal's pitch for every texture in place, never the driver's own linear image; n keeps a texture only read a shadow (its copies are what T79 removed). Planned boots: pdbaqkl (clean icons and smooth would make k the default), then pdbaqnl if k still scrambles.", "T81k (2026-11-01, pdbaqkl): still blocks in icons, text and the live wallpaper's shadow. All 1107 textures in place were the DRM_FORMAT_MOD_LINEAR image (L inp 1107/1107), so the image kind is not the cause. Text glyphs are mostly shadows and the wallpaper is another process, so in-place textures over buffers are not the whole story either. The RM row moves with the answer: tile memory rendered 310M pixels in T78q (16) and 1127-1227M in T79q, T79q2 and T80r (64). textures-<pid>.txt appends across boots when a pid repeats.", "T81 revert (2026-11-01, AdrenoMetal a903895, UniXNU a0db373): the bridge letters o, w, r and metal2vulkan patch 0022 (k, n) are gone, as none changed the scrambling; the 64-byte answer, its use in requiredLinearTextureBytesPerRowForDescriptor and the l texture log stay. Next: T82s, add-on 29 with asteroids-tu-debug=sysmem (every pass in system memory, trace letters pl for the 1000-byte command line).", "T82s (2026-11-01, pl + asteroids-tu-debug=sysmem): no pass in tile memory (RM gmem 0, 7701 passes in system memory) and the same blocks: tile memory is not the cause.", "T82c (2026-11-01, pql + sheng-gpu-import-skip=0, imports cleaned around every submission): worse, with blocks also on elements that were clean, 103 GPU hangs at 99 % busy and a backboardd SIGSEGV, after which the system drew on the CPU. The cleaning itself took 32 ms (9234 passes, 1631 MiB), so turning the whole switch back on is no fix and no answer.", "T83 (2026-11-01, AdrenoMetal 3814805, UniXNU 7140588): two letters to split what is left. v sets HostPageTexturePolicy::Shadow, so every texture over host pages is copied in as in T78 while the answers stay 64: blocks with v are in the layout, none are in reading in place. x watches each sampled source over a buffer or surface (hash at commit and at completion: RC row) and copies an unchanged one back through the GPU on a queue of its own, comparing it with the CPU's bytes (RB: checks, equal, different, moved, skipped, differing 64-byte lines and 4 KiB pages of those compared, all-zero; RF: the first four). Planned boots pdbaqx, then pdbaqv.", "T83x (2026-11-01, pdbaqx): RC watched 247/3 raced 0/0, RB n229 eq229 ne0: every source unchanged during GPU use, and the GPU's copy of each equal to the CPU's bytes. Its readback read client memory Core Animation had unmapped and crashed backboardd (SIGSEGV). T83v (pdbaqv, HostPageTexturePolicy::Shadow): still blocks, as the user saw before backboardd faulted on a null pointer. So neither reading in place nor any cache (CPU or GPU) is the cause: the GPU draws the bytes it is given, copied or not.", "T85 (2026-11-01, AdrenoMetal 6e83314, UniXNU 8446ded): v and the readback are gone; letter y writes the CPU's bytes of the first 48 distinct small sources a frame samples (then every 25th up to 96) at their commit to m2v/gpu/dump-<pid>-<n>-f<format>-<w>x<h>-r<rows>-<s|b>.bin; local/tools/dumps.py turns them into PNGs. Blocks in the dumps put the cause in whatever writes those bytes under the 64-byte answer.", "T85y (2026-11-01, pdbaqy): 106 dumps of the render server's sampled sources (icons 58x58 and 128x128 RGBA8, A8 text such as the date, RG8 64x64 masks) are clean in memory. With T83x (the GPU reads them as written) the render server's sources are not where the blocks come from. The T79 photos put the blocks in the wallpaper's blurred flower shadows, drawn by the poster in its own process, which the boot letters (render server only) never reached. The watch's hashing at completion still read unmapped client memory: backboardd SIGSEGV with x or y on.", "T86 (2026-11-01, AdrenoMetal 39bb4ec, UniXNU 405641e): the bridge answers 64 for linear alignment in backboardd only, the runtime's 16 in every other process. package/AsteroidsMetalPlugin.mm: boot letter z skips shader priming. Every new runtime or Turnip build primes all libraries again (T81k: 34 of 155, 927 pipelines) from 90 s after the device opens, during animations; a backboardd restarted after a crash ran at 120 Hz (user, T80l and T85y). Planned boots pdbaq (blocks?) and pdbaqz (smooth from the start?).", "T86d (2026-11-01, pdbaq): blocks still in the wallpaper's flower shadows, no backboardd crash, L inp 62/5. The first boot was refused (Load Error) for every image: slot a was unbootable with its retry count spent, as nothing marks our boots successful; fastboot set_active a reset it (retry count 7).", "T80o (2026-11-01, pdbaqol, add-on 28: the runtime's 16 in every process): no blocks. So the blocks are drawn live by the render server's 64-byte answer, not saved in a wallpaper render, and not drawn by another process. MobileSlideShow's sig 6 abort happens here too, so it is not the answer's.", "T87 (2026-11-01, AdrenoMetal 541a19a, UniXNU 3fc28a6): letters put one answer back to the runtime's in the render server: A the format-free alignments, B minimumLinearTextureAlignmentForPixelFormat:, C requiredLinearTextureBytesPerRowForDescriptor:; with l each distinct question and answer goes to m2v/gpu/answers-<pid>.txt. Planned boots pdbaqlA, pdbaqlB, pdbaqlC.", "T87a (2026-11-02, pdbaqlA): no blocks, not 120 Hz and far better than 15 fps (user). answers-<pid>.txt: the render server asks only deviceLinearTextureAlignmentBytes, linearTextureAlignmentBytes and deviceLinearReadOnlyTextureAlignmentBytes, once each; never minimumLinearTextureAlignmentForPixelFormat: or requiredLinearTextureBytesPerRowForDescriptor:. So A is T80o again: L inp 538/19, refused for pitch 246, 29509 copies. The blocks and the copies T79 removed come from the same answer. T87az (A plus z, no shader priming) booted for the post-crash 120 Hz question.", "T88 (2026-11-02, AdrenoMetal eedebfa, UniXNU d0443d7): the bridge answers the runtime's 16 again. UniXNU patches/mesa/turnip-narrow-linear-rows.patch: the A8xx texture descriptor states a linear row pitch in bits (TEX_LINE_OFFSET), and only render targets and the 2D engine (A2D pitch shr 6) step rows at 64 bytes, so an explicit DRM_FORMAT_MOD_LINEAR image that is never an attachment or storage image takes rows at any multiple of 16 bytes and of its texel (descriptor alignment field clamped to 0); transfers touching one are skipped. Core Animation's sampled textures then bind in place at 16-byte rows without the copies. Planned boot pdbaql: no blocks, smooth, and pitch refusals near 0.", "T87az (2026-11-02, pdbaqlAz): priming off (PR libs 0/0), maybe slightly smoother than T87a (user: possibly placebo), L inp 224/8, 127 pitch refusals, 20738 copies: priming is not the main cost.", "GPU work shelved (2026-11-02, AdrenoMetal 7e19eb9, UniXNU eb5bf59): the user calls T87a's state good enough. Default: the runtime's 16-byte linear answer (no blocks, faster than T78 but not T79's 120 Hz). Not built or booted: T88 (turnip-narrow-linear-rows.patch, UniXNU d0443d7) and its CI run were dropped untested. Removed: letters A, B, C, the y source dump (its watch read unmapped client memory and crashed backboardd) and z (no priming, no clear gain). Open: what in the render server the 64-byte answer draws as blocks (its sampled sources are clean in memory and on the GPU); why a backboardd restarted after a crash runs at 120 Hz; MobileSlideShow sig 6 in every run since T79, T80o included.", "Upstream sync (2026-11-03, branches sync/upstream-2026-11-03; UniXNU main f61fd6c merged as dc88d19 + 969df26): AdrenoMetal is upstream's (UniXNU/AdrenoMetal 243d63c) instead of the rootstock fork, whose T78-T88 experiments stay on its asteroids branch; upstream answers the runtime's 16-byte linear alignment as the shelved default did. The Mesa list is upstream's (GMEM mutable and memory-side swap, transient attachments in GMEM, frame diagnostics, queue priorities, thread render mode) plus turnip-a810-sysmem-ccu; turnip-render-mode-measured (GMEM red/blue swap on the A810, T70-T74, now fixed upstream) and the asteroids measurement patches (stats, timing, submit trace: TU_DW_TRACE, gpu-trace.py) are dropped. All patches apply in order at the Mesa pin. The kernel GPU driver stays the NativeAdreno gen8 fork (upstream Adreno740 has no A8xx). package/AsteroidsMetalPlugin.mm drops CacheImport.h and the shader-cache fallback (pipelines are compiled on the device only upstream) and keeps the pipeline-pack import.", "Upstream's Turnip patches (2026-11-03 sync) call NativeAdrenoMethodSetPriority (17) and NativeAdrenoMethodNote (18); NativeAdreno 38227e7 declares them and their records in NativeAdrenoABI.h so Turnip compiles. The asteroids kernel implements neither and answers kIOReturnUnsupported, which Turnip takes as not accepted (queue priorities stay normal, frame notes are dropped). UniXNU acf69e3 gives turnip-frame-diagnostics.patch its missing new-file header, so git apply takes the whole recorded list (gpu-addon run 41598242089 failed on both).", "sync1 (2026-11-03; kernel run 41596757530, add-on run 41600013844) broke the screen. backboardd crashed at 56 s with SIGSEGV at 0; its crash report from the Data volume, symbolized with the add-on's unstripped binaries: Turnip's tu_emit_subpass_begin<chip 8> wrote through a null command stream after tu_cs_reserve_space could not add a BO, under the bridge's RenderLowering::draw_indexed. The kernel refused no BO ([bo memory] refused 0). The GPU then never finished fence 88 (hangs 1, 5, 10 from 58 s, no restart) and the kernel refused backboardd's reopen (PUB no device: VkResultCode(-3)), so the hangs followed the crash. 4 s before it the bridge rendered a memoryless BGRA8 1080x2392 texture through a 10 MB scratch image (its pass splits into 2 instances). The unified log stops 35 s before the crash. mixA (the sync kernel with the pre-sync add-on: device 9be0e5b, AdrenoMetal 7e19eb9) booted clean: no crash, 197 GMEM passes, fences to 1172, mic peaks 817 and 476. The fault is in the sync add-on (upstream AdrenoMetal and the new Turnip list).", "T98: UniXNU 89438f4 adds turnip-darwin-first-alloc-failure.patch: the first failed Turnip BO allocation or map of a process goes to the kernel's report line as AF <step> s<KiB> f<flags> k<status> u<MiB in use> h<largest hole MiB> c<cached MiB> <process> (steps r retired BOs, v GPU range, a BoAlloc, m BoMap, p BoCpuMap, i CPU mapping, H host import range).", "T98 (2026-11-04; the sync kernel with add-on run 41624545358, UniXNU 89438f4): 76 s with no crash, no GPU hang and fences to 1422, but also no AF line and no memoryless full-screen pass, so the allocation failure did not recur and was not measured. The RM gmem row reads 0 in every boot of the synced add-on (T98 too): its counters came from turnip-asteroids-stats.patch, which the sync dropped, so sync1's 0 GMEM passes was a missing counter, not a measurement.", "T98 unlocked and looked right (owner, 2026-11-04); sync1 broke on its first unlock. sync1 ran with a cold shader cache (V cache hit 0, miss 64; the first boot of upstream's shared shader cache) and T98 with a warm one (hit 60, miss 92), so the failure may need a cold cache; not measured. T98 is the synced image kept; its first allocation failure line stays in as the check for a recurrence.", "package/AsteroidsMetalPlugin.mm (2026-11-04): the arm64e EDR headroom write takes its QuartzCore address from kQuartzCoreSites, keyed by the running dyld shared cache's UUID (iPad17,x 24A446 and iPhone17,4 24A446, read by name from each cache), and writes nothing by address on another cache (marker 0x6EF0). The iPhone cache's QuartzCore data is 0x4000 above the iPad's; details in the configuration area.", "iPadOS 27 GPU add-on (2026-11-11): Turnip (Mesa with the A810 patches), the Metal plug-in and the Rust bridge build for arm64e; the host needs bison 3.8.2, glslang (glslangValidator), a glslc and the rust-src component. The home screen, system apps and icons render; iconservicesagent runs CoreImage on the CPU (CI_ENABLE_METAL_GPU=0 through launchd_job_environment), since metal2vulkan does not expose CoreImage's built-in kernels by name. Wallpapers are PNG overlays (make-wallpaper-overlay.py; HEIC needs a hardware decoder).", "Open (2026-11-11): one boot without a Data reset showed an early GPU stall (150 jobs, a 182 s busy run) after which attaching a process address space failed with an SMMU fault (ArmSmmu4KFault, operation 11) and clients were refused. Upstream Adreno740's recovery work (an access fault no longer fails the other address spaces) is in the 2026-11-12 sync.", "Upstream sync (2026-11-12, fork 8be2626): GPU recovery per address space, the per-mapping maintenance list (the board's gpu-import-skip and gpu-import-policy now classify mappings there; gpu-own-maint is gone), system pages prepared outside the lock (skipped while the board's reserved BO pool exists), preemption records (allocated, not used), CP counter stamps. Upstream's stall snapshot and timeline stamps still read A7xx register offsets (diag=1 or gpu-timeline only). The board stands in for iokit_physical_descriptor_close_notify, which only UniXNU's macOS kernel has.", "2026-11-12 sync (Adreno740 8be2626, AdrenoMetal 73d582f, metal2vulkan 555b13d, Mesa patches): about half of the boots then hit a GPU SMMU translation fault ([gpu stall] smmu 80000402 or 402, the address's upper word 0) or a hang, mostly right after the lock screen was touched, and the UI froze until a reboot.", "2026-11-13: the cause was the Darwin Turnip backend: darwin_bo_finish zeroed a BO's sparse-array entry after releasing retire->lock, by when the reap could already have put the handle in the BO cache or released it to the kernel; another thread's allocation then filled the same entry and the late memset wiped it (iova 0), so a render pass emitted CP_INDIRECT_BUFFER to address 0 + offset. It became likely once AdrenoMetal's encoding thread (native-metal-encode) allocated while metal2vulkan's free thread freed. Fixed in UniXNU 1aa69d2 (patches/mesa/turnip-darwin-bo-finish-clears-under-lock.patch: the entry is zeroed right after taking the lock); three boots of heavy lock-screen use ran clean (bofix1..3).", "Diagnostics that found it (UniXNU 2e0a61e, ff77344; the SX/LF part was dropped in e69b2b5 once the fix held, LI stays): BootLog [gpu fault] rows and the A810 stall registers read per pipe (Adreno740 cde9322); Turnip notes on the kernel's Turnip report line: LI (first indirect buffer below 4 GiB, with its BO), SX (a secondary changed under a primary's render pass) and LF (who zeroed that BO: the destroying or resetting command buffer's level, state and threads, or the stack).", "Ruled out on the way, each by a faulting boot: the new Mesa patches alone, Adreno740 alone, AdrenoMetal and metal2vulkan alone, the wallpaper commit b6d2933, and tu-debug=sysmem (one fault in four runs). AdrenoMetal's encoding thread switched off (gEncodeThread=false) leaves the render server presenting black frames.", "Upstream's map-failure telemetry read a closed connection's null vm_ and panicked the kernel (wifi86); fixed in Adreno740 84b8b3a.", "iconservicesagent ran RenderBox on the GPU and aborted in RB::Device::make_index_buffer() once per boot; board.toml now puts the whole agent on the CPU (FORCE_SOFTWARE_RENDERER=1, ef1c782).", "The kernel sees GPU hangs ([gpu recovery] hangs N) but never restarts the A810 (restarts 0), so any hang freezes the UI until a reboot."]
completion = ["Core Animation renders through Metal on the GPU with measured frame times."]
limits = ["Graphic artifacts on iPadOS 27 (a green block behind the lock-screen clock's digits, stray glyphs around the date). A GPU hang is not recovered (no A810 restart). Sm8550Platform is linked as Adreno740's dependency and not used."]
next_action = ["Watch new boots for [gpu stall] smmu 80000402 rows and Turnip LI notes.", "Make the kernel's GPU recovery restart the A810 after a hang.", "The graphic artifacts."]


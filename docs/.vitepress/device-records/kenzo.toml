schema_version = 1

[device]
name = "kenzo"
soc = "MSM8956"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Redmi Note 3 (kenzo) Snapdragon 650 porting record."

[[area]]
id = "configuration"
status = "host-verified"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", "evidence/**", "scripts/prepare-kernel-patches.py", "unixnu.lock", ".gitmodules", ".github/**", ".gitignore"]
inputs = ["Xiaomi Redmi Note 3, codename kenzo; Qualcomm MSM8956; selected profile ipados-17.7.11-21H461.", "Shared SoC feed points to CodeDevB7/UniXNU-msm8956-common at c9652aca1fe3c530ef79f5dae584dd85e61b1f8c."]
configuration = ["board.toml selects ArmDTPlatform, ArmCpu, SoftwareAES, XnuPrelink and DarwinBoot; kenzo_defconfig; SoC and OS config fragments; ordered arch, SoC, OS and device patch series.", "[package] unixnu is ../UniXNU and [package.defconfig] maps ipados-17.7.11-21H461 to kenzo_defconfig."]
procedure = ["Resolve board configuration from the UniXNU checkout with unixnu status -D UniXNU-kenzo.", "Run scripts/package.sh --check --os ipados-17.7.11-21H461 from the device repository after required local sources are available.", "Dispatch .github/workflows/kernel.yml to compile only the kernel on a macOS runner and inspect its redacted logs."]
findings = ["The current repository uses format 2 and the shared SoC feed; the older handoff's build workflow description predates the current package interface.", "The package script previously stopped immediately because [package].unixnu was absent; after recording the path and profile-to-defconfig mapping, host preflight resolved kenzo_defconfig and all 59 patches.", "The local set of 86 extracted DTBs contains Qualcomm MSM8956 reference platforms, but no root model/compatible identifying Kenzo; these files do not validate board wiring.", "The kernel-only macOS workflow calls UniXNU's reusable build and uploads text logs only. Its pre-build helper removes only the optional Sheng PMGR probe hunk from the generic boot-progress patch; it fails closed if the upstream hunk layout changes.", "Local compilation was stopped at the user's request after filesystem and bootstrap issues; no kernel artifact is claimed. The workflow run is the next build attempt."]
completion = ["The pinned SoC source resolves; package preflight writes the selected configuration and patch resolution completes for the selected OS profile."]
limits = ["Package preflight, patch resolution and standalone DTS-to-ADT generation are host-verified. Kernel, UEFI firmware, payload, image assembly and device boot are unverified. The macOS Actions kernel run is pending. Firmware repository, image inputs and device seed are not configured."]
next_action = ["Run the macOS kernel workflow and record its result; identify the Kenzo UEFI source and verify board firmware paths and hardware inputs before attempting a complete package build."]
evidence = [{ kind = "source", reference = "board.toml", result = "Format 2 board selection and package path/defconfig mapping." }, { kind = "source", reference = "feeds.toml", result = "Pinned MSM8956 shared SoC feed." }, { kind = "source", reference = "evidence/2026-11-12-dtb-inventory.md", result = "No Kenzo-compatible root was found among 86 extracted DTBs; only Qualcomm MSM8956 reference platform trees matched." }, { kind = "source", reference = "evidence/2026-11-12-local-kernel-attempt.md", result = "Local XNU patching needed a Sheng-only hunk workaround; builds on /mnt/c failed during atomic header replacement, and the ext4 retry was interrupted before completion." }, { kind = "source", reference = "scripts/prepare-kernel-patches.py", result = "Pre-build helper removes only the optional Sheng PMGR progress hunk and fails if its recognized layout changes." }, { kind = "source", reference = "https://github.com/UniXNU/UniXNU/blob/c34f018aafd6befd5dc93c05a8dccd5bdce6724b/.github/workflows/macos.yml", result = "Reusable macOS workflow provides a kernel-only build with redacted text logs and no image artifacts." }, { kind = "host", reference = "evidence/2026-11-12-package-check.md", command = "bash scripts/package.sh --check --os ipados-17.7.11-21H461", revision = "b9280aaa8c6f7fd2622bdc0b28aea8b9c35438a7", result = "Passed on WSL/Linux against SoC pin 894aea231e7ac7133b2947777b2dbc89bdd4c6aa: wrote config for kenzo_defconfig, extracted profile IPSW inputs, resolved 59 patches. UniXNU source revision 5a00e20157f3975d155f13ced7593347f9f5bf73." }, { kind = "host", reference = "evidence/2026-11-12-adt-preflight.md", command = "dtc -I dts -O dtb -i <msm8956 DTSI> -o /tmp/kenzo-hardware.dtb dts/kenzo.dts; python3 scripts/make-adt.py --dtb /tmp/kenzo-hardware.dtb --os-profile profiles/os/ipados-17.7.11-21H461/profile.toml --board ../UniXNU-kenzo/board.toml --output /tmp/kenzo.adt", revision = "b9280aaa8c6f7fd2622bdc0b28aea8b9c35438a7", result = "DTS compiled and generated a 12,888-byte ADT on WSL/Linux. The standalone generator completed; this does not verify UEFI or device boot. SoC revision 894aea231e7ac7133b2947777b2dbc89bdd4c6aa; UniXNU revision 5a00e20157f3975d155f13ced7593347f9f5bf73." }]

[[area]]
id = "firmware"
status = "planned"
components = []
paths = ["proprietary-files.txt", "scripts/extract-files.py", "scripts/gen-touch-firmware.py"]
inputs = ["Kenzo stock Android boot image and extracted device-tree data are present in the sibling kenzo-dump directory; no Kenzo Mu-Silicium/EDK2 checkout is present in this workspace."]
configuration = ["board.toml currently names a provisional Kenzo DSC/FD path; there is no firmware image pin, preflight script or confirmed firmware output."]
procedure = ["Follow the UniXNU UEFI integration guide, then build and inspect the device FD and boot image on a supported host."]
findings = ["No UEFI build or physical boot evidence is recorded. The current firmware fields were adapted from a template and must be replaced with paths verified against a Kenzo firmware checkout."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["UEFI source, its revision, required Mu-Silicium modules, memory reservations, framebuffer handoff and firmware build output are unknown."]
next_action = ["Identify a maintained MSM8956/Kenzo Mu-Silicium port, inspect its DSC/FDF and board configuration, then replace provisional firmware paths and record the firmware revision."]
evidence = []

[[area]]
id = "cpu"
status = "implemented"
paths = ["dts/**", "package/CpuFreq*", "scripts/*armcpu*"]
components = ["ArmCpu"]
inputs = ["The local cpuinfo reports six processors; the shared SoC definition declares four Cortex-A53 and two Cortex-A72 cores. Earlier hardware notes list GICv2 and a 19.2 MHz architectural timer.", "The local extracted DTB set contains MSM8956 MTP/CDP/QRD/simulator reference trees but no root compatible identifying Kenzo."]
configuration = ["The shared SoC DTSI sets /cpus/timebase-frequency to 19200000, CPU affinity values 0-3 and 0x100-0x101, PSCI method smc, GICv2 ranges 0x0b000000/0x1000 and 0x0b002000/0x1000, and exports the controller as intc.", "The board configuration selects ArmCpu; the SoC fragment enables the GIC and architectural timer."]
procedure = ["Compile dts/kenzo.dts with the pinned SoC include using dtc -I dts -O dtb.", "Generate the selected OS/device ADT with scripts/make-adt.py and inspect the output against required XNU nodes.", "Before claiming hardware bring-up, compare the MPIDRs, PSCI and interrupt resources with a Kenzo-specific DTB and capture per-core XNU logs."]
findings = ["The MSM8956 SoC DTSI now supplies /cpus/timebase-frequency, routes interrupts to the GIC, and exports the GIC as ADT node intc. DTC and standalone ADT generation pass. CPU MPIDR values and GIC ranges are based on MSM8956 reference data, not a Kenzo-compatible DTB; no XNU secondary-core or IPI bring-up has been measured."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["Per-core MPIDR values, GIC interrupt specifiers, PSCI availability and IPI behavior have not been verified from the selected board DTB or on-device logs."]
next_action = ["Obtain the matching Kenzo DTB from stock firmware, then verify CPU reg/MPIDRs, GIC distributor and CPU-interface ranges, timer and PSCI nodes; validate on hardware after a UEFI boot path exists."]
evidence = [{ kind = "source", reference = "https://github.com/CodeDevB7/UniXNU-msm8956-common/commit/894aea231e7ac7133b2947777b2dbc89bdd4c6aa", result = "SoC DTSI provides the timebase, interrupt-parent and exported GIC node required by the ADT generator." }, { kind = "source", reference = "evidence/2026-11-12-dtb-inventory.md", result = "The extracted MSM8956 trees identify only reference platforms; they are insufficient evidence for Kenzo-specific CPU/GIC values." }, { kind = "source", reference = "evidence/2026-11-12-adt-preflight.md", result = "The board DTS compiled and standalone ADT generation completed on the host; physical CPU/GIC behavior is unverified." }]

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = ["The local dump reports MemTotal 1889528 kB and the current Kenzo DTS declares RAM at 0x80000000 with a 0x80000000 size.", "Extracted MSM8956 reference DTBs do not identify Kenzo and cannot establish this board's DRAM banks or reservations."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for memory and dma."]
procedure = ["Follow the memory and dma stage in the porting guide and record the actual commands."]
findings = ["MemTotal supports the 2 GiB board variant, but does not establish the complete physical bank or reserved regions. The earlier DTS comment mentioned a 3 GB variant while its reg entry described only 2 GiB; it now identifies the captured unit's 2 GiB range without making a claim about other variants."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["Complete DRAM banks, firmware carveouts, DMA addressability, cache policy and SMMU ownership remain unverified."]
next_action = ["Extract /memory and /reserved-memory from the matching Kenzo DTB, then reconcile with the UEFI handoff map before setting payload memory values."]
evidence = [{ kind = "source", reference = "evidence/2026-11-12-dtb-inventory.md", result = "The local extracted set has no Kenzo-compatible root, so its Qualcomm memory nodes cannot validate this board's map." }]


schema_version = 1

[device]
name = "picasso"
soc = "SM7250"
os_profile = "ios-16.7.16-20H392"
summary = "独立的 Redmi K30 5G / SM7250 早期移植：宿主机构建与设备运行结果分别记录。"

[[area]]
id = "configuration"
status = "host-verified"
components = ["XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "profiles/**", "configs/**", "sources.lock.toml", "upstream.rev", ".github/**", ".gitignore", ".gitattributes", "local.toml.example", "LICENSE"]
inputs = ["官方 UniXNU 格式 2、ARM64 构建工具和本仓库独立 iPhone X iOS 16.7.16 profile，SM7250 资源单独保存在本仓库。"]
configuration = ["提供固定源码版本、13 项移植记录、Actions 校验/UEFI 应用/iPhone X iOS 16 Apple 输入审计。"]
procedure = ["按 README 的校验和构建步骤执行；真机阶段见 docs/bring-up.md。"]
findings = ["提供固定源码版本、13 项移植记录、Actions 校验/UEFI 应用/iPhone X iOS 16 Apple 输入审计。", "首轮 CI 验证与 EFI 应用成功；内核发现官方可选 boot-progress 补丁冲突，当前禁用该插桩并保留 OS 预链接补丁。", "默认目标改为 iPhone X iOS 16.7.16 / 20H392；Apple manifest 与 IM4P 摘要已独立核对。Darwin 22 补丁/驱动/预链接未移植，Darwin 23 内核成功只作为历史构建证据。"]
completion = ["运行 Actions 并记录各任务的结果和提交版本。"]
limits = ["配置可解析不代表硬件已支持；iOS 16 / Darwin 22 ABI 尚未移植，内核与预链接入口明确拒绝使用 Darwin 23 配方。"]
next_action = ["运行 Actions 并记录各任务的结果和提交版本。"]
evidence = [{ kind = "source", reference = "docs/source-audit.md", result = "提供固定源码版本、13 项移植记录、Actions 校验/UEFI 应用/iPhone X iOS 16 Apple 输入审计。" }, { kind = "host", reference = "https://github.com/SuzukiR1n/UniXNU-Picasso/actions/runs/40262916511", result = "配置/DTS/C++、EFI 应用、iPhone X Apple 内核摘要与 Darwin 22 arm64 审计成功；目标 ABI 与设备启动仍待完成。", command = "GitHub Actions: Picasso build and validation", revision = "e0941c2eaffdbe4868b939fc0c472881595676e9" }]

[[area]]
id = "firmware"
status = "planned"
components = []
paths = ["proprietary-files.txt", "hardware.toml", "firmware/**"]
inputs = ["Project-Silicium/Mu-Silicium 审计版本没有 Picasso 平台。候选原厂输入基线为 MIUI V12.5.9.0.RGICNXM / Android 11。"]
configuration = ["没有从其他设备或社区移植复制 FD、DSC、FDF、内存映射或启动镜像。"]
procedure = ["按 README 的校验和构建步骤执行；真机阶段见 docs/bring-up.md。"]
findings = ["没有从其他设备或社区移植复制 FD、DSC、FDF、内存映射或启动镜像。"]
completion = ["提取原厂输入，编写平台内存图并按官方指南集成 UniXNU、DarwinBoot、RamDisk、DiskIo、FAT。"]
limits = ["缺少独立 SM7250/Picasso UEFI 平台及原厂 boot/dtbo/UEFI 二进制。"]
next_action = ["提取原厂输入，编写平台内存图并按官方指南集成 UniXNU、DarwinBoot、RamDisk、DiskIo、FAT。"]
evidence = []

[[area]]
id = "cpu"
status = "implemented"
components = []
paths = ["drivers/ArmCpu/**", "socs/sm7250/configs/**", "tests/timer_ppi.cpp"]
inputs = ["MiCode picasso-r-oss qcom/lito.dtsi：CPU affinities 0..0x700，19.2 MHz，GICD 0x17a00000，GICR 0x17a60000，stride 0x20000；虚拟 PPI 3。"]
configuration = ["直接基于官方 ArmCpu 增加定时器描述解析，GIC 使能和 IRQ 分派统一使用 PPI+16；DTS 仅启用 CPU0。"]
procedure = ["按 README 的校验和构建步骤执行；真机阶段见 docs/bring-up.md。"]
findings = ["直接基于官方 ArmCpu 增加定时器描述解析，GIC 使能和 IRQ 分派统一使用 PPI+16；DTS 仅启用 CPU0。", "默认目标改为 iPhone X iOS 16.7.16 / 20H392；Apple manifest 与 IM4P 摘要已独立核对。Darwin 22 补丁/驱动/预链接未移植，Darwin 23 内核成功只作为历史构建证据。"]
completion = ["完整编译驱动后，在真机核对定时器中断计数与 GIC 状态，再逐个启用其他 CPU。"]
limits = ["源文件中的定时器号还未通过目标设备的 CNTV/中断计数读回验证；SMP 未验证。"]
next_action = ["完整编译驱动后，在真机核对定时器中断计数与 GIC 状态，再逐个启用其他 CPU。"]
evidence = [{ kind = "source", reference = "docs/source-audit.md", result = "直接基于官方 ArmCpu 增加定时器描述解析，GIC 使能和 IRQ 分派统一使用 PPI+16；DTS 仅启用 CPU0。" }]

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**", "socs/sm7250/dts/**"]
inputs = ["MiCode Lito 源码 memory.reg 为零；原厂 bootloader 会修正 RAM。用户只确认了 128 GB 存储。"]
configuration = ["没有生成猜测的 RAM、DarwinBoot 分配窗口或保留内存；缺少内存时 ADT 生成必须失败。"]
procedure = ["按 README 的校验和构建步骤执行；真机阶段见 docs/bring-up.md。"]
findings = ["没有生成猜测的 RAM、DarwinBoot 分配窗口或保留内存；缺少内存时 ADT 生成必须失败。"]
completion = ["采集 bootloader FDT、UEFI memory map 和目标固件保留区，求出不重叠的连续窗口。"]
limits = ["RAM 容量、bootloader 修正的 FDT、UEFI EfiConventionalMemory 与保留区均未实测。"]
next_action = ["采集 bootloader FDT、UEFI memory map 和目标固件保留区，求出不重叠的连续窗口。"]
evidence = []


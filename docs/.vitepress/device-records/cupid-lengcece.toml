[[area]]
id = "packaging"
status = "host-verified"
components = ["XnuPrelink"]
paths = ["package/**", "scripts/package.sh", "patches/**"]
inputs = ["iPhone17,2 kernelcache for prelink, the OS/SystemOS images for userdata, Data seed and the platform seed (UNIXNU_UNIQUE_CHIP_ID)."]
configuration = ["board.toml [payload] builds a 176 MiB CUPIDESP FAT volume; [bootimg] packs header v0 at 4096-byte pages.", "scripts/package.sh is the standard UniXNU packaging script and reads [package] unixnu and [package.defconfig]."]
procedure = ["Install the OS profile, then run scripts/package.sh --os 27 --uefi ../uefi-cupid once the firmware exists.", "Run the macOS workflow for kernel-only builds until then."]
findings = ["Kernel and package steps do not need the firmware checkout; payload and boot image do because they embed the firmware volume.", "package/Sm8450Ufs is board-owned host-tested code, not yet part of the kernel archive: ufs-regs compiles Sm8450UfsRegs.h and Sm8450UfsHci.h with c++ -Werror on every change, and the package step continues to build only the EDK II drivers.", "The board package now also carries the host-tested UFS transport model (Sm8450UfsHci.h); it still does not enter the kernel archive, so the EDK II package step is unchanged.", "patches/unixnu/0001-patch-xnu-entry-probe-skip-nm-headers.patch is required for payload: the upstream parser crashed on a three-token nm header line (int(Symbols)) while reading the prelinked kernel.", "patches/unixnu/0002-ramdisk-find-fat-in-initrd.patch makes UniXNURamDiskDxe scan up to 256 MiB of the initrd, log the first two words at every 16 MiB boundary, and, if the 512-byte walk finds no boot sector, search byte-wise for the CUPIDESP volume label and derive the FAT start from offset 71. cupid v4 ABL publishes 0xBC8BE00 bytes starting with an LZ4 vendor ramdisk; 64 MiB and 256 MiB sector walks found no FAT although the bulk data is present.", "patches/darwinboot/0001-darwinboot-log-window-failure.patch prints NO WINDOW and the FREE runs to the console; owned_memory_size was lowered to 0x80000000 so a 2 GiB run can satisfy the kernel window while the log reports the real largest run.", "patches/xnu/pac-skip-trapped-keys.patch is the device XNU series entry that disables the native PAC key writes for the Gunyah test; it applies last, after the arch, SoC and OS series.", "patches/xnu/timers-avoid-trapped-physical-timer.patch removes the precautionary CNTP_CTL_EL0 write in _enable_virtual_timer; Gunyah traps EL1 physical-timer access. It is verified to apply on top of the PAC-skip series.", "patches/xnuprelink/fileset-cupid-24A446-symbols.json is a reviewed-function fixture pinned to the iPhone17,2 kernelcache sha256 fa07057b… for com.apple.kernel. It binds the nine original *_chk wrappers (__memcpy_chk at 0xfffffff00ad05978 and the memmove/memset/str* siblings, each with its panic-string evidence and raw-byte sha256) to the native ___*_chk symbols. Without them the matcher left __memcpy_chk unpaired and corecrypto called the unmapped-call stub from fipspost_post_integrity at 0xfffffff00ab15578.", "The same fixture now binds 0xfffffff00ab86b04 to _ml_get_hwclock. The original body is bti/mrs S3_4_C15_C10_6 (KERNEL_CNTVCTSS_EL0)/ret, a no-argument virtual-counter read; AppleM2ScalerCSCDriver imports it and panicked from its start path with a stale x30 in its __DATA and an uninitialised x0. The native ml_get_hwclock returns the same timebase without the Apple CNTVCTSS alias.", "patches/xnu/fileset-report-registers.patch replaces unixnu_fileset_unmapped with a naked thunk that saves x0/x1/x8/x16/x17/x30 and reports the raw and stripped x30 plus the import stub register. The shared stub cannot name the target, and the AppleM2 start path reaches it with a stale x30 in its __DATA.", "The fixture also binds 0xfffffff00ad714b8 to _unixnu_apple_m2_clock_state, a device shim returning state 0. The original 13432 reader uses globals at 0x7deb768/0x7deb770 that the 12377 native __DATA_CONST placement overwrites with _bootstrap_pagetables; a 55%-shape native search found no equivalent. The AppleM2 caller uses the result modulo 5 as a state index in a retry loop, so 0 selects the first state and keeps the driver off the unmapped stub. This is a bring-up workaround, not a semantic port.", "The fixture binds 0xfffffff00ac2534c to _get_thread_ro_unchecked: the original is bti/cbz/ldr x0,[x0,#0x4e8]/ret, the native is bti/ldr x0,[x0,#0x4e8]/ret, same native thread field plus a null check. This is a semantic match, not a workaround.", "The fixture now also binds 0xfffffff00b0de1d8 to _unixnu_apple_m2_property, a device shim that zeroes a valid caller buffer and returns NULL (property absent). The original 13432 helper zeroed the buffer, looked up a string by key and copied it; no 12377 equivalent matched above 0.55. The known call site ignores the return.", "fileset-report-registers.patch now saves x0..x30 and the file-set report prints the raw/stripped x30 plus up to four saved registers that point into kext __DATA_CONST/__DATA. The stub is also reached through a slot held in an arbitrary register, so x16/x17 alone were not enough; the candidate list lets the exact stubbed slot be decoded.", "The fixture now binds AppleImage4's six stubbed targets to diagnostic probe functions that panic with the target address, and the naked stub also saves the caller stack pointer and prints up to six data-range candidates from registers and the caller stack. This identifies the post-AppleM2 missing import without guessing.", "The probe boot named AppleImage4 0xfffffff00b11a998 as the missing import. It is the one-time security-flag initializer (runtime globals 0x7e35330/0x7e35350 overwritten natively) and its out-pointers are status/flags; the fixture now binds it to _unixnu_apple_image4_flags, writing status 2 and flags 0. The other five probes remain for diagnosis.", "The panic after the flags shim named AppleImage4 slot 0x8074eb8, whose original body is lck_mtx_gate_alloc_init. The XnuPrelink map from run 42481732673 had already paired the full lck_mtx_gate family to native symbols; the probe/fixture changes made the current matcher leave them unmatched. The fixture now binds init/alloc_init/open/handoff/steal/wait by raw-byte hash to the same-source native gate functions."]
completion = ["Kernel and prelink succeed, the payload contains all declared inputs, and the boot image matches the bootloader format and size limit."]
limits = ["Kernel, package and firmware are host-verified. Payload is blocked on the platform seed (UNIXNU_UNIQUE_CHIP_ID); the boot image is blocked on a cupid firmware DTB. Neither is in the repository."]
next_action = ["Build payload and boot image once the owner supplies UNIXNU_UNIQUE_CHIP_ID (8 hex digits) and cupid's firmware DTB; ./unixnu bootimg requires both the FD and a DTB, and payload refuses to build without the seed."]


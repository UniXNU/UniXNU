[[area]]
id = "storage"
status = "planned"
components = []
paths = ["drivers/**", "scripts/*ufs*", "scripts/*storage*", "package/Sm8450Ufs/**"]
inputs = ["SM8450 UFS host 0x1d84000 (SPI 265) and QMP PHY 0x1d87000; SM8450 GCC UFS clock/reset offsets; LUN 0 GPT geometry."]
configuration = ["SoC DTSI publishes ufshc/ufsphy disabled; the cupid defconfig leaves CONFIG_XNU_NATIVE_UFS unset."]
procedure = ["Add an SM8450 UFS component (or parameterise ShengUfs by SoC compatible and GCC offsets).", "Enable ufs/ufsphy in the board DTS, then record capacity, GPT and userdata window."]
findings = ["ShengUfs matches only qcom,sm8550-ufshc and hardcodes SM8550 GCC UFS registers, so it cannot drive cupid as-is.", "SM8450 UFS PHY is at 0x1d87000; SM8550 is at 0x1d80000.", "Measured from gcc-sm8450.c against ShengUfs/GccUfs.h: SM8450 branches are ufs_phy_axi 0x87018, ahb 0x87020, tx_symbol_0 0x87024, rx_symbol_0 0x87028, unipro_core 0x87064, ice_core 0x8706c, phy_aux 0x870a4, rx_symbol_1 0x870c0, aggre_ufs_phy_axi 0x870d4, ufs_phy_gdsc 0x87004. SM8450 has no separate UFS_MEM_PHY_GDSC, so a per-SoC table is required.", "package/Sm8450Ufs/Sm8450UfsRegs.h is the first SM8450 UFS component: nine 0x87xxx branch offsets, GDSC 0x87004, HC 0x1d84000, PHY 0x1d87000 and a read-only probe; .github/workflows/ufs-regs.yml compiles it with a host test.", "package/Sm8450Ufs/Sm8450UfsHci.h adds the UFSHCI command path: HCE 0x34, IS 0x20, UIC 0x90, doorbell 0x58, controller enable/disable, UIC DME_GET/link-startup, UTRD and command-UPIU layouts (READ CAPACITY(10)), transfer-list base and doorbell ring/clear, exercised against a fake controller.", "The UTRD keeps DW0-3 as raw words: the C bitfield header pads to 40 bytes, so the static asserts pin 32 bytes with the UCD base at 16 and PRDT at 28; the fake-controller test caught the padded layout.", "Fixed the UPIU header field order (LUN b1, task tag b2, IID/CS b3, CDB b12) and added ResponseUpiu (52 bytes, residual and sense fields), PrdtEntry (16 bytes), 4-byte PRDT padding and the UCD layout at 0/512/1024; the host test pins every offset."]
completion = ["Host: register, clock and link facts match the board inventory. Reads: capacity, GPT and known blocks are correct. Root: the OS volume mounts and launchd starts."]
limits = ["No SM8450 UFS driver exists in the component catalog."]
next_action = ["Add UCD/PRDT allocation, response-UPIU parsing and a SCSI READ(10) transfer to the host model; then map MMIO in a kext and verify the SM8450 GCC clocks and link startup on the phone."]


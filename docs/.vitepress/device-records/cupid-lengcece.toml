schema_version = 1

[device]
name = "cupid"
soc = "SM8450"
os_profile = "ios-27.0.1-24A446"
summary = "Xiaomi 12 (cupid, SM8450) running iOS 27.0.1 (24A446, arm64e) under an iPhone17,2 / D94AP identity. This record separates what is established from host sources from what still needs the phone."

[[area]]
id = "configuration"
status = "implemented"
components = []
paths = ["board.toml", "feeds.toml", "configs/**", "profiles/**", ".github/**", ".gitignore", "scripts/install-os-profile.sh", "scripts/build-cupid-dtb.sh", "notes/**"]
inputs = ["SM8450 SoC source pin; iPhone-flavoured iOS 27.0.1 build 24A446 profile; cupid defconfig and device tree.", "UniXNU main does not ship an ios-27 profile: this repository carries profiles/os/ios-27.0.1-24A446 and installs it into the checkout."]
configuration = ["board.os_profile = ios-27.0.1-24A446; board.soc = SM8450; board.soc_source = sm8450; schema_version = 2.", "profiles/os/ios-27.0.1-24A446 is an iPhone17,2 (D94AP) profile: IPSW pins, AMFI early-init address 0xfffffff00921000c, prelink roots, root/SystemOS image digests and volume UUIDs, and abi/original-classes.json.", "NOT the shipped ipados-27.0.1-24A446 profile: same build and XNU source, different IPSW, original kexts and ADT identity."]
procedure = ["Read https://unixnu.com/porting/device-repository and https://unixnu.com/porting/records.", "Run scripts/install-os-profile.sh ../UniXNU to install profiles/os/ios-27.0.1-24A446 into the UniXNU checkout.", "Run ./unixnu defconfig cupid_ios27_defconfig -D ../UniXNU-cupid, ./unixnu fetch -D ../UniXNU-cupid, ./unixnu status --json -D ../UniXNU-cupid."]
findings = ["iOS 27.0.1 and iPadOS 27.0.1 share build 24A446 and the same public XNU source (xnu-12377.121.6), so the OS patch series is shared. Only the IPSW, the original kexts and the ADT identity differ, which is why the profile is a separate directory rather than a board override.", "An iPhone profile is required for a phone: iPadOS presents iPad product identity, idiom and display assumptions that SpringBoard and UIKit read from /product.", "The profile was reconstructed from the published UniXNU-ishtar patches 0001, 0002 and 0005; the AMFI address is the masked-code-verified iPhone17,2 value, not the iPad17,3 one.", "Arrays replace inherited arrays: board.toml repeats every selected component, configuration fragment and patch series entry.", "The macOS workflow builds the EDK II package (UniXNU.efi) after the kernel, so a push that changes board.toml, profiles, configs or the workflow itself exercises image assembly without the phone.", "scripts/build-cupid-dtb.sh builds the firmware DTB from the LineageOS waipio-v2 + cupid overlay (cpp + dtc + fdtoverlay), sha256 6246e11cc2867946183b7e453797d5ec0fb3c49c6297115f2605a7bf8c0e0b50. It is not byte-identical to the stock vendor_boot base+dtbo merge (956745 bytes, sha256 ea574733...): the stock base is a larger vendor tree. The device reports dtb_idx 10 (Waipio v2) and revision 2.2. The live ABL FDT was pulled from the phone (sha256 3d669081f48c6a810f0d95f7c5fa37d62dcb1c40a9d6fe4eb8b79bc24bebf7f0, 773371 bytes, model 'Cupid based on Qualcomm Technologies, Inc SM8450') and scripts/build-cupid-dtb.sh accepts it with UNIXNU_CUPID_LIVE_FDT; the compiled tree now patches the cupid root identity and measures 451042 bytes (sha256 7604f605...).", "The macOS workflow now also builds cupid.dtb and a menu-only boot.img with --ramdisk none; payload still needs the platform seed., ", "macOS cpp mis-parses -x assembler-with-cpp (cc: no input files); the DTB script now defaults to clang -E and the workflow builds cupid.dtb before the kernel so a tree failure is not hidden behind a 19-minute kernel step.", "notes/FASTBOOT.md records the one-boot procedure: fastboot boot loads the image into RAM, nothing is flashed, and the unlocked state must be confirmed before the Gunyah PAC test.", "The workflow applies patches/unixnu/*.patch to the UniXNU checkout before building; patches/unixnu/0001-patch-xnu-entry-probe-skip-nm-headers.patch makes the entry-probe parser skip non-hex nm header lines.", "The payload step passes --uefi ../uefi-cupid: panic_screen=true needs Mu-Silicium FrameBufferSerialPortLib/Font.h; without it patch-xnu-entry-probe.py aborts before writing the volume.", "notes/first-boot-2026-11-07.md is the first device boot result: fastboot accepted the image but the screen stayed black, traced to the FD base 0xA7100000 versus the stock UEFI ELF window at 0xA7000000 size 0x2A2000.", "notes/first-uefi-boot-2026-11-07.md records the first successful UEFI boot: header v4 reaches BootShim and the UniXNU menu on cupid; the payload volume is not published (no SimpleFileSystem), so the menu falls back to BDS.", "The workflow applies patches/darwinboot/0001 inside the DarwinBoot submodule after the kernel step has fetched it, so the firmware build sees the window diagnostics.", "notes/PROJECT-STATE.md and notes/PROJECT-NEXT.md snapshot the working state (repos, commits, measured device facts, boot history, patches, next step) so a compacted session can resume without losing critical detail.", "notes/pac-trap-2026-11-07.md records the first XNU start and the Gunyah trap on the EL1 PAC key write; the next image disables the key-programming block.", "The workflow uploads cupid-kernel-diag: nearest symbol and llvm-objdump around the panic PC 0xfffffff00ad881c0, to distinguish a trapped PAC instruction from a trapped PAC key MSR.", "The first cupid-kernel-diag attempt produced a zero-job run because the heredoc body sat at column 1 inside the YAML block scalar; it is now indented to the block level and the file parses with yaml.safe_load.", "The panic instruction was decoded as 0xd51be228 (msr CNTP_CTL_EL0), not PAC: the screen wrapped instr=d5 onto the next line. The timer is the current blocker; the record was corrected.", "The macOS workflow installs patches/xnuprelink/fileset-cupid-24A446-symbols.json into UniXNU/kits/XnuPrelink/fixtures after ./unixnu fetch has initialized the submodule, before the kernel build. The file only adds reviewed identities for this kernelcache hash; it does not alter XnuPrelink code.", "The macOS workflow uploads cupid-native-symbols: the unstripped native development kernel, the RELEASE-LTO fileset reference, and the prelink kernel.json. These let the three remaining AppleM2 import targets be matched to native symbols offline instead of guessing.", "The native-symbol upload paths are out/cupid/<profile>/<config>/tree/build/xnu/... as recorded in kernel.json native/map, not UniXNU/build/xnu; the first upload therefore contained only kernel.json."]
completion = ["status resolves ios-27.0.1-24A446 with arch arm64e, the sm8450 SoC source and the cupid defconfig; all source pins resolve."]
limits = ["The iPhone17,2 identity advertises a 1320x2868 display; cupid is 1080x2400. Display identity is corrected with the panel milestone."]
next_action = ["Run the macOS kernel workflow and attach its defconfig/status/kernel result."]


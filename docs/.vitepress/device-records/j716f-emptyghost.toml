findings = ["CI review: native source build step succeeded at e104fe3b; encrypted transfer rejects six outputs against old four-output allowlist. Profile-specific seal/open validation and synthetic regression checks added; remote repair run pending, no device operation.", "V15 host packaging and static audits passed.", "V16 host packaging produced the source-prelinked kernel, J716F ADT and boot image used for the boot_b test.", "The source build applies a device-local patch-series compatibility fix before the pinned UniXNU resolver, so optional Sheng PMGR context is not required for J716F.", "V21 host checks passed FD/FV/FFS checksums, AARCH64 PE and linked-module identity, V21 markers, unchanged V20 embedded FAT, BootShim/gzip, both DTB copies and Android v2 header/SHA1/padding.", "The byte-identical local V21 DSC is preserved in the firmware repository; it retains the V15 FDF/output path and omits the public V15 DSC additional standard-initrd declarations. Device board.toml retains historical V17 payload settings and is not the complete V21 artifact recipe.", "V22 has an explicit paired payload builder and independent V22 firmware DSC/FDF/module lists. Both kernels use the same unpatched V21 prelink baseline and differ only in their timer literal. Final FD/FAT/file, PE, probe and Android image audits passed; no device write was performed.", "V23 rebuilds from the pinned prelink baseline, guards patch/vector/cave ranges and reseals corecrypto after all code changes. Actual extracted kernels and all four Android-v2 images passed host audits. P was flashed to boot_b; hardware functional results remain incomplete.", "V23P2 separately packages an 1824-byte guarded probe, reseals crypto and passes actual FD/FAT/PE/Android-v2 audits. Old V23 artifacts and manifest remain preserved.", "P3A/B actual FD/FAT/PE/Android-v2 audits and final crypto HMAC checks passed. Undoing the approved factor and seal reconstructs the exact pinned P2 kernel. P2 and other prior manifests remain preserved.", "V23P3A was flashed only to boot_b via fastbootd, B activated and reboot command succeeded. Video, menu identity, prefix progress and PSCI results are pending; P3B remains unflashed.", "V23P3B was flashed only to boot_b via fastbootd, B activated and reboot command succeeded. User report for P3A was brief screen then reboot; no checkpoint or PSCI result established. P3B video is pending.", "V23P4 r1 passed actual FD/FAT/PE/Android-v2, source hashes and crypto HMAC audits. Undoing its envelope, clear filter and HMAC seal reconstructs pinned P2. Original P4 was not flashed and is privately archived.", "V23P4 r1 was flashed only to boot_b through fastbootd; B activation, current-slot b and slot-unbootable:b=no were verified; reboot command succeeded. Menu identity, marker visibility, PSCI and reset observations await video. Retry-count variable is unsupported.", "V23P4 r1 video confirms both early MMIO markers and title mode 5 with prefix squares 1/2; square 3 and EL/SCTLR are not observed. Original STR was passed, but external transaction completion is unproven. Diagnostic display disappears about 15.9s after entry, then Lenovo/Android splash and r1 menu return; PMIC 0x02000001 -> 0x02000041, reset cause unknown. Next-build source preference: UniXNU menu scale changed from 4 to 3 after r1 video; not compiled or flashed. Kernel diagnostic font unchanged. Original r1 library sources were privately snapshotted and match its remote-build hashes; the next build must explicitly audit the changed menu module.", "V23P5A/B matched controls passed host image, source/HMAC, pair-delta and emulator checks. A kernel equals P4 r1; B differs only in relocated STR-to-NOP and HMAC. Both use compiled menu scale 3, identical non-payload modules, markers and title DSB. No P5 hardware trial or device write. Test A then B on boot_b. See docs/V23P5_MATCHED_MMIO_CONTROL.md.", "V23P5A was flashed only to boot_b in fastbootd; B activation, current-slot b and slot-unbootable:b=no were verified; reboot command succeeded. A menu identity, marker progression and reset observations await video. P5B remains unflashed. No PSCI or MMU-on result is claimed.", "V23P5A video confirms the compact A menu, title mode 5, prefix squares 1/2 and both early MMIO markers, reproducing P4 r1 visible progress. No square 3, EL/SCTLR or PSCI evidence. Display disappears about 17.47s after entry, followed by Lenovo/Android splash and return to A menu; PMIC 0x02000001 -> 0x02000041. Reset cause and external MMIO completion remain unknown. P5B is the next boot_b control and remains unflashed.", "V23P5B was flashed only to boot_b in fastbootd; B activation, current-slot b and slot-unbootable:b=no were verified; reboot command succeeded. Its menu identity and diagnostic progress await video. Reviewed P5A remains the visible control; no P5B functional, PSCI or MMU-on result is claimed.", "V23P5B video confirms the compact B menu, both lower envelope markers and partial title in frame 56; the diagnostic is captured in only one camera frame. Top prefix 1 completion, prefix 2/3, EL/SCTLR and A0/pre-SMC are not established. Entry band to display loss is about 0.067s (camera observation), followed by Lenovo/Android splash and return to B menu; PMIC 0x02000001 -> 0x02000041. Rapid intentional PSCI reset is a hypothesis, not a verified result. Next proposed control retains P5B and replaces only its SMC with an in-place branch, preserving the preceding DSB; not yet built. This checkpoint supersedes earlier pending/unflashed notes; no new device operations or push occurred during video review.", "V23P7 RESET r1 is host verified and unflashed. Only the P6 embedded FAT config/app changes; all non-payload inner-FV module sections and compact SEC executable match P6 exactly. Actual P6 reset driver uses SMC, queries RESET2 then falls back to SYSTEM_RESET; unused stack inputs are a host finding, not the proven failure cause. P7 defaults to read-only inventory; manual PSCI queries/firmware Warm/direct reset actions log PRE/RETURN to the validated console. Five wrapper cases, two linked record/gate cases and image/source audits passed with mocked SMC responses. First hardware trial must only photograph inventory and Query PSCI results on boot_b; no reset, retention or XNU result yet.", "V23P7 RESET r1 (uncommitted source additions on the recorded repository base; exact source/image hashes in the P7 manifest) was flashed only to boot_b through fastbootd. B activation, current-slot b and slot-unbootable:b=no were verified; reboot command succeeded. Inventory/PSCI-query observations await video. No reset trial, retention result or new XNU checkpoint is established.", "V23P8 RETENTION r1 is built and host-verified, unflashed. Only the embedded FAT config/app differs from P7; non-payload inner-FV sections and compact SEC executable match exactly. Sanitizer ring/record, three wrapper and nine linked-EFI UI cases passed. Exact image identity is in research/v23p8-retention.json.", "The pinned 42bffe8 source builder now includes standalone backport 0004 of upstream 018c8f3 to restore omitted XNU headers after a fresh clone. Exact upstream-file equivalence and fresh/repeated/reclone/failure-path checks passed; full macOS XNU compilation has not been rerun.", "V23P8 RETENTION r1 was flashed only to boot_b after exact image-hash and fastbootd identity/unlock/size gates. B activation, current-slot b and slot-unbootable:b=no were verified; reboot command succeeded. Initial ENTRY and actual retention observations remain pending.", "V23P9E/M host-verified kernel trace candidates are prepared. E logs the first kernel entry then direct SYSTEM_RESET; M logs entry, pre-MMU and post-MSR/ISB before terminal reset. A manual UEFI Query/ARM cookie and expected prior CRC/phase bind each kernel append to its session. Exactly the audited console is mapped as 64 NC pages after strict TCR/MAIR/TTBR/spare-page guards. Pre/post preserve integer registers, SP and NZCV; pre handles the already-virtual SP with M=0. Original BCM store and vectors remain unchanged. 23 actual-assembly logic cases and 12 linked-reader cases pass with mocked system registers/SMC/UEFI; E/M nonpayload FV sections and compact SEC match P8; crypto HMACs match. No P9 device write or MMU progress yet. Test E before M.", "V23P9E was flashed only to boot_b after exact image-hash and fastbootd identity/unlock/size gates. B activation, current-slot b and slot-unbootable:b=no were verified; reboot command succeeded. Await the initial read-only reader ENTRY photo before Query/ARM. No kernel entry/reset-retention observation or MMU progress yet. V23P9M remains unflashed and gated on observed E entry-record retention.", "V23P12A/B built and host verified, unflashed. Six independent pre-staged CRC-bound records use one-byte commits; ENTRY high32 binds ARM CRC and low32 is SCTLR. A skips BCM and B preserves captured original address/value, with exactly one STR/NOP probe delta and identical reader/ADT/nonpayload firmware. 58 actual-assembly and22 linked-reader mocked cases passed; final image/HMAC/source audits passed. Byte-identical P11 power app reuses22 host cases. No P12 hardware/retention/MMU-on result; A first on boot_b only.", "P12 r2 A/B built and host verified, unflashed. New reader requires explicit double confirmation before discarding a VALID saturated/exhausted console logical history; frozen entry remains, payload not bulk-cleared, INIT records old next/size, failure locks Query/ARM. 45 actual-linked reader cases passed including full-session-to-both-unchanged-kernels-to-frozen-reader flow, changed-console cancellation, failure and stale-ID gates. A/B kernel/ADT/probes equal r1 byte for byte; 58 prior assembled cases reused after identity check. Power app equals P11, 22 cases reused. Final FD/FAT/EFI/source/HMAC/nonpayload/boot-image checks passed. No r2 hardware, retention or MMU-on result; A first on boot_b only."]

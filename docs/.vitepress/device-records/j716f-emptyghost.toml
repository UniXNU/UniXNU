procedure = ["Run the latest UniXNU defconfig, status, tree, and porting-record checks from the UniXNU checkout."]
findings = ["CI review: native source build step succeeded at e104fe3b; encrypted transfer rejects six outputs against old four-output allowlist. Profile-specific seal/open validation and synthetic regression checks added; remote repair run pending, no device operation.", "The local SM8250 source remains a transition snapshot; a public common scaffold is not yet qualified for this port.", "The macOS source workflow is pinned to UniXNU 42bffe8 and keeps its J716F compatibility fixes in the device repository.", "The source qualification defconfig disables the profile's MOCKFS fixture because that fixture requires ArmCpu, while this board intentionally keeps ArmCpu disabled.", "The source-output sealing step discovers the migration-qualified report and tree instead of assuming the legacy out/j716f root.", "A public SM8250 common scaffold exists at 6bb9b025704764a662728dce1a30557a35e082d8, but it is not yet qualified or selected for this port; the local transition snapshot remains."]
completion = ["The format 2 identity, source paths, defconfig, and patch order resolve without ambiguous board fields."]
limits = ["The SoC source is local and not yet a reusable fixed public commit; component ABI inputs remain incomplete."]
next_action = ["P17 original chosen/stall/topology and boot CPU number returns reached, SCTLR M1 and all nine CRCs survived one video-observed reboot. Preserve result; audit grouped boot CPU publication/max-CPU checks, current-thread/CPU bootstrap and rtclock_early_init, with logger mapping/stack lifetime. Native provider build and IRQ qualification remain separate."]


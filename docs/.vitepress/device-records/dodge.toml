procedure = ["Run scripts/build_gpu_stack.py for the offline build chain, or --check-only to verify current artifacts and matching stage identities.", "Run .venv-gpu/bin/python scripts/build_fresh_gpu_stack.py for the separate original-IOSurface/fresh-health route; --check-only verifies completed stages and --record-existing validates and records existing outputs.", "Run .venv-gpu/bin/python scripts/build_mapped_lease_stack.py for isolated all-mapping leases and bounded lock-free map waiting; --check-only verifies completed stages.", "Run .venv-gpu/bin/python scripts/build_surface_identity_stack.py for isolated current-task identity resolution, native binding, strict full prelink and source-to-original permission/reference checks; --check-only preserves completed outputs.", "Run .venv-gpu/bin/python scripts/build_surface_pages_stack.py for the kernel-only owned-descriptor/import page association; --check-only preserves all completed outputs. The caller must already own the exact original descriptor through original-component serialization.", "Run .venv-uefi/bin/python scripts/build_native_a830.py after source preparation for the standalone Shad0w23333 native Gen8 archive.", "Run python3 scripts/check_native_a830_host.py for fifteen native A830 software-controller suites on Linux."]
findings = ["Actual full backend, target microcode/policy/board/presenter, Rust bridge, Turnip and Metal bundle builds pass. Board metal registration releases failed init/attach instances and refuses failed property writes; 15 sanitizer cases compile its actual staged function with loader/IOKit peers. Existing ASan/UBSan tests and target/4 KiB code-page readback pass. Target vendor_boot matches the captured A-slot manifest. Exact iPhone Legacy is 5728 bytes/338 slots, rejecting the iPadOS17 reference layout.", "A separate 90-object/97-entry/341-alias kernel rechecks native GPU health after a historical fence pass, after backing and before copy/retirement. Original IOSurface writer errors do not automatically reach waiting readers. Exact notification bindings, 17 original notification-chain cases, 132 frontend sanitizer cases, 84 actual-kernel paths and strict 63889 pointer readbacks pass; two unsafe source variants fail.", "Each submit conservatively holds all current VM mappings; late mapping waits outside the publisher lock, bounded by one second and 16384 attempts. Cache failure/uncertain zero-fence publication retains the whole lease. 28 new sanitizer cases, three existing suites, five source controls, 112 actual-kernel paths and strict prelink/container readback pass.", "A kernel-callable current-task resolver uses the exact original IOSurfaceRoot entry. Actual original task/client cache, membership and policy plus the custom CAS reference counter at +1000 execute; +12 is the surface ID. Thirteen sanitizer cases, three source controls, 20 original identity and 17 source-to-original paths pass. The separate 92-object/99-entry/342-alias candidate repeats 112 existing ARM64 regressions and strict prelink.", "Kernel-only association checks original descriptor identity, allocation rounding, direction, length and every imported physical page. It independently prepares/holds descriptor, surface and real native memory. Complete failure quarantines ownership; VM/job holds defer release. Thirty-five ASan/UBSan cases, four source controls, 25 new actual-linked ownership/VM paths and five instruction controls pass. A 94-object/102-entry/343-alias candidate reruns 149 earlier ARM64 regressions and strict prelink.", "The standalone Shad0w23333 Adreno830 snapshot 1a1321056ffc5428ae925f4680093718b46ca7c2 builds 51 iOS 16 objects with its matching SMMU library and exact iPhone accelerator binding. Its Darwin 22 adapter spells out data-free operations around a dependent-template compiler failure. Linux host tests account for Clang 18 aggregate-zero initialization warnings. The existing Metal frontend adds selectors 17/18 to the shared v2 base and needs a deliberate protocol merge."]
completion = ["GPU power, SMMU, firmware, queues and known shader outputs operate through the original iPhone graphics clients."]
limits = ["Source display imports resolve to real console/completion/software timer implementations. 93 bridge, 121 bounded frontend and 46 timer sanitized cases use software peers. CPU scanout is the default; experimental presenter mode requires failed/abandoned GPU work to be quiescent before callback. Isolated static linking treats nine unselected optional diagnostics as absent weak addresses; no dummy providers are present. Concrete provider/registration/power hooks, request retirement, actual producer fences/cache visibility, GPU failure quiescence, original graphics initialization and physical rendering remain unqualified. No owner trust or hardware access.", "Fresh health snapshots do not qualify GPU/presenter quiescence or cache/DMA visibility. Two new IOSurface aliases are compiled into the isolated candidate; producer registration is not wired into the Adreno client by those aliases. Actual original surface allocation and the display +5056 surface lifecycle remain unexecuted.", "Resource leases provide lifetime accounting. A kernel-only owned-descriptor/import page association exists, but source descriptor acquisition and original backing-mutation/check-to-submit serialization remain unqualified. GPU user-client import does not yet use the association. Producer registration, pending callback/cancel/exit ordering, physical GPU/cache/reset and final descriptor/surface destruction remain incomplete or unqualified.", "The standalone Gen8 archive has no CPH2653 startup or embedded firmware. It is a separate source candidate; full prelink, frontend protocol and runtime lifecycle integration are pending."]
next_action = ["Qualify the linked original-module prepare/attach and complete parent start/stop/user-client lifecycle; qualify the linked unified module/GPU/display boot coordinator through the implemented real-class GOP factory, opt-in IOBSD worker and original-service matching in the isolated candidate.", "Acquire an owned exact original surface descriptor through qualified original-component serialization, wire the checked association into GPU user-client imports, and connect per-job producer registration, asynchronous grants, completion signalling, cancellation and client exit.", "Build the standalone Adreno830Board inputs from the captured CPH2653 GPU/GMU/thermal resources and pinned firmware. Merge the iPhone Metal selector extensions and existing surface/lease ownership before selecting this backend."]
evidence = [{kind = "host", reference = "reports/public/gpu-stack.json", result = "Forty-six source/build/test stages pass: independent 54-object GPU and 64-object concrete-display/module kernels, 93 bridge, 121 frontend and 46 timer sanitized cases, 60 coordinator, ten actual frontend integration and 33 original-module orchestration sanitizer cases, plus 69 concrete-class ARM64 checks and 32 full linked original/source lifecycle CPU paths. Three original dispatcher cases check provider survival through detach; two negative controls reject a lost pin and an unreviewed native call. Fifteen board Metal registration sanitizer cases cover publication and allocation/init/property/attach cleanup with explicit loader/IOKit peers. Five full original newUserClient method paths and three admission refusals use explicit client lifetime peers. Unified boot ordering passes 24 peer cases and the actual atomic board entry passes six, including 16 concurrent callers. A separate local FAT/Android v4 development container is verified; it excludes original userspace/root and does not auto-invoke graphics. The real-class GOP publisher passes sixty host and eighteen linked CPU cases, including actual original allocation/native constructors and four real IOBSD scheduling paths. An isolated opt-in IOBSD worker passes twenty-four sanitizer cases. Existing original dispatch/lifecycle/userland/refresh CPU checks pass. The full-display strict prelink contains 27 original executable components/7 interfaces with 58962 pointer, 196 alias, 338 owned/340 base and 178 provider/14 metadata vtable, 53 constructor/53 finalizer, POST and loader readbacks plus ten corruption controls. Linked iOS16 userspace, six SPIR-V modules and four A830 code/reassembly cases pass. Default artifacts remain unchanged; original graphics initialization and runtime qualification remain incomplete.", command = ".venv-uefi/bin/python scripts/build_gpu_stack.py --check-only", revision = "1baf6d3a1d0f133d284f8b8844cc98bf5aff
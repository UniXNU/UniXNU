configuration = ["Separate 81-object input/storage/display candidate and local container; dodge-input=1 disabled by default. Original 208-byte/207-slot base, 1560-byte concrete class, 53 HID aliases and 35 opaque data-only slots. Only four extra HID operations callable. AVDD SID9 GPIO3 validates retained electrical fields, preloads physical high, then initializes direction and enable; VDD ldob4 1.8 V. QUP4 SPI loader accepts only an idle empty engine without DMA/GPI ownership, programs 442 words/69 configuration entries from the pinned 2141-byte stock SEFW and verifies every write. The stopped/unvoted/non-DFS SE4 root now initializes to the derived 19.2 MHz XO after ownership checks; existing roots/DFS use live locked GPLL0 and M/N readback, without rewriting shared PLLs/voltage. Warm SPI adoption also refuses leftover DMA/GPI/FIFO ownership. No donor LDO16 or private EventDriver mutation. Bounded event80/37 and driver264/219 declarations with 71 data-only bindings are included with a 552-byte/219-slot source edge subclass. Its Kernel personality is read back as __kernel__; original tables and event fields are accessed only through qualified APIs. Full transfer requires DMA data, command completion and engine idle before RX delivery; bounded cancel/abort/reset ACK and sticky errors prevent reuse. Source start/stop run on the workloop gate; reentrant stop retains the provider and defers parent cleanup until callbacks exit."]

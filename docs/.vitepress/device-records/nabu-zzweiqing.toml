schema_version = 1

# nabu porting record. Evidence entries of kind "host"/"device" carry a
# placeholder revision of all zeros until the first published commit exists;
# replace them with the commit that produced the run before release.
# Device evidence references point at the project's public CI run pages; the
# raw boot logs stay local per the project artifact policy and are summarized
# in the result text.

[device]
name = "nabu"
soc = "SM8150"
os_profile = "ipados-17.7-21H16"
summary = "Xiaomi Pad 5 boots a source-built XNU with the original 21H16 userland: eight cores with working SGI IPI, UFS root windows, NT36523 touch, GOP framebuffer display with A640 Metal scanout compositing, and a persistent on-ESP boot log. Interactive SpringBoard UI was demonstrated; a bounded scanout stall after the first frames is under repair. Persistent Data, network, audio and power management are not yet implemented."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "device"]
paths = ["board.toml", "feeds.toml", "components.toml", "configs/**", "dts/**", "porting.toml", ".github/**", ".gitignore", "README.md", "AGENTS.md", "LICENSE", "local.toml.example", "source-ci/**", "tools/**", "device_bringup/**", "docs/**"]
inputs = ["SM8150 board of Xiaomi Pad 5, iPad7,11 21H16 restore inputs", "UniXNU core pin 245aca1a9ec5b730b1cad80fade295800d2981f1"]
configuration = ["board.toml selects schema_version 2, soc_source sm8150 and os_profile ipados-17.7-21H16.", "The component list covers platform, cpu, boot, storage, display, GPU, input and board glue; kernel defconfig is nabu_ufs_gpu_metal_defconfig.", "Device patch series order is arch, soc, os, device."]
procedure = ["Prepare pinned upstream source, apply the device series, run the profile archives and prelink, then package the ESP payload.", "Kernel builds are dispatched to a macOS GitHub Actions runner; local steps are host-side packaging and verification."]
findings = ["The nabu bring-up line currently resolves through a project CI pipeline rather than ./unixnu; component pins match the recorded revisions in components.toml and feeds.toml.", "LLVM for Darwin ARM64 treats ';' as an asm comment marker, so multi-instruction one-line inline assembly silently drops instructions; this class of defect blocked SGI delivery until fixed.", "Selected components use canonical upstream catalog ids (ShengUfs, RamBlock, VirtioMmioBlock, XnuPrelink, AppleKeyStoreState) after the upstream Native* repository renames; feeds.toml pins every selected component to the proven commits.", "Self-referential revisions in components.toml and this record point at the first public commit 12a07055; feeds.toml tracks the SoC repository at f363dcda."]
completion = ["All source pins resolve, every selected component maps to an area, and the recorded defconfig produces a prelinked kernel candidate."]
limits = ["Format 2 resolution through ./unixnu defconfig/fetch is not yet qualified; the board still builds through the project workflow."]
next_action = ["Resolve the device through ./unixnu defconfig and porting-record check, then record the resolving commit."]
evidence = [{ kind = "source", reference = "board.toml", result = "Format 2 board selects the SM8150 soc source and the 21H16 OS profile with the full component list." }, { kind = "source", reference = "configs/nabu_ufs_gpu_metal_defconfig", result = "The shipping defconfig enables owner UFS root, RAM Data, touch, legacy display and the A640 accelerator publish." }]

[[area]]
id = "firmware"
status = "device-verified"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", "platform/**", "ufs/**", "gpu/**", "usb/**", "userprobe/**", "vendor/**"]
inputs = ["Stock Xiaomi UEFI on nabu, rEFInd installed on the 334 MiB ESP", "UniXNU.efi menu and DarwinBoot.efi driver placed under /EFI/UniXNU on the ESP"]
configuration = ["Boot menu version 1, timeout 20, default entry loads Payloads kernel.macho with its .adt and .trustcache.", "DarwinBoot requests a 1 GiB contiguous conventional-memory window (darwinboot-memory-size 0x40000000)."]
procedure = ["Write payload files to the ESP, select the nabu entry, XNU hands off from DarwinBoot with GOP framebuffer and ADT."]
findings = ["Boot, rollback and menu management on the ESP are routine; payloads of ~101 MiB Mach-O load within the reserved window.", "The stock UEFI framebuffer (1600x2560 at 0x9c000000) reaches XNU through boot_args.Video.", "No firmware image is rebuilt for this board; the vendor UEFI and rEFInd are used as shipped."]
completion = ["Payload loads, XNU starts, and the framebuffer plus memory reservations are published to the kernel."]
limits = ["Mu-Silicium firmware build is not planned; the boot depends on rEFInd and ESP file layout."]
next_action = ["Keep the firmware path unchanged; record any firmware-side regression in the run evidence."]
evidence = [{ kind = "device", reference = "https://github.com/zzweiqing/hackios-mac-batch/actions/runs/41287217331", command = "py -3 -B tools/nabu_esp_log.py pull --root", revision = "12a070555a9ef321df367311b4812f2bfa87beac", result = "Readback sequence 7831 committed with CRC pass: DarwinBoot handed the payload to XNU, kernel log captured from the ESP log extent." }]

[[area]]
id = "cpu"
status = "device-verified"
components = ["ArmCpu"]
paths = ["platform/**", "ufs/**", "gpu/**", "usb/**", "userprobe/**", "vendor/**", "configs/**", "dts/**", "patches/**"]
inputs = ["Eight Kryo 485 cores, MPIDR affinities 0x000-0x700", "GICv3: distributor 0x17a00000, redistributors at 0x17a60000 stride 0x20000, virtual timer INTID 19, 19.2 MHz counter"]
configuration = ["cpus=8 with armcpu-self-ipi=1; the ADT publishes all eight cpu nodes and the psci smc node.", "SGI delivery uses ICC_SGI1R writes after dsb ishst; the earlier SPI IPI route (intids 1008-1015) was tested and rejected."]
procedure = ["Build the cpu profile, boot the candidate, read back the committed NABULOG2 capture and compare per-core step/fail/IPI counters."]
findings = ["Inline-assembly comment semantics dropped all but the first instruction of the SGI sequence; the newline-separated form restored delivery.", "Device run 7831 shows all eight cores at step=7 fail=0 psci=0 with IPI growing past 1.3M and per-core SGI/timer counts increasing.", "A one-line asm template defect class was found in 17 sites and fixed by emitting instructions on separate lines."]
completion = ["ncpus=avail=topo=8, every secondary reaches its startup checkpoint and SGI IPI is delivered to all cores."]
limits = ["Scheduler-level CPU power management (EPSS) and idle states are not implemented."]
next_action = ["Re-run the SMP sample set on the next candidate to confirm IPI delivery stays healthy."]
evidence = [{ kind = "device", reference = "https://github.com/zzweiqing/hackios-mac-batch/actions/runs/41287217331", command = "py -3 -B tools/nabu_esp_log.py pull --root", revision = "12a070555a9ef321df367311b4812f2bfa87beac", result = "Run 7831: ncpus=avail=topo=8 across 64 samples, seven secondaries step=7 fail=0, IPI 1,320,637 and rising with fail=0." }, { kind = "source", reference = "dts/nabu.dts", result = "Board DTS publishes eight cpu nodes at affinities 0x000-0x700 with the psci smc method." }]

[[area]]
id = "memory"
status = "device-verified"
components = ["device"]
paths = ["dts/**", "platform/**", "ufs/**", "gpu/**", "usb/**", "userprobe/**", "vendor/**", "configs/**"]
inputs = ["DRAM banks [0x80000000,0x3cc00000], [0xc0000000,0x80000000], [0x140000000,0xc0000000] with a TrustZone hole at 0xb9900000..0xc0000000", "UFS SMMU at 0x15000000 with stream 0x300; A640 GPU SMMU at 0x02ca0000 with its own context"]
configuration = ["chosen.dram-base 0xc0000000 and dram-size 0x140000000 (5 GiB) bound the XNU-owned window; darwinboot-memory-size is 0x40000000.", "Managed render-target IOSurface pages are mapped Normal NC under t733-managed-rt-normal=1 on this BCM2837 config."]
procedure = ["Publish the ADT memory contract, boot, and confirm the mapped windows plus SMMU translation from kernel counters."]
findings = ["XNU accepts a single dram base/size window; Option A excludes bank 0 and the firmware hole while covering the DarwinBoot window.", "UFS DMA runs through the 0x15000000 SMMU on stream 0x300; GPU DMA runs through the A640 SMMU at 0x02ca0000.", "Framebuffer memory at 0x9c000000 sits in bank 0 and is accessed through the GOP-composited path rather than the XNU-owned window."]
completion = ["All handoff regions are accounted for; UFS and GPU DMA engines translate through their documented SMMU contexts."]
limits = ["Bank 0 low RAM and TrustZone hole handling for later stages is unresolved; SMMU fault recovery is not implemented."]
next_action = ["Record any SMMU fault telemetry on the next GPU-heavy run."]
evidence = [{ kind = "device", reference = "https://github.com/zzweiqing/hackios-mac-batch/actions/runs/41265722207", command = "py -3 -B tools/nabu_esp_log.py pull --root", revision = "12a070555a9ef321df367311b4812f2bfa87beac", result = "Run 6229: UFS windows published and GPU scanout accepted 181 frames with zero fallbacks, exercising both SMMU paths." }, { kind = "source", reference = "dts/nabu.dts", result = "Board DTS records the three DRAM banks and the reserved framebuffer/firmware ranges." }]

[[area]]
id = "storage"
status = "device-verified"
components = ["ShengUfs", "RamBlock", "VirtioMmioBlock", "AppleKeyStoreState", "VerifiedRoot"]
paths = ["ufs/**", "scripts/build-nabu-ufs*.py", "scripts/build-nabu-ram-block.py", "scripts/build-nabu-owner-root.py", "dts/**", "board.toml", "proprietary-files.txt"]
inputs = ["SM8150 UFS host controller at 0x01d84000, GCC window 0x177000, SMMU 0x15000000 stream 0x300, 4096-byte blocks", "Unallocated LUN0 range LBA 2739747-18364746 after Ubuntu partition removal; OS window at LBA 2739968 and SystemOS window at LBA 4204809"]
configuration = ["native-ufs-root=1 with direct window boot arguments publishes the OS and SystemOS windows as block devices.", "Data volume is a volatile RAM block seeded at boot with UUID 0A5EED00-0000-4000-8000-000000000001; the SystemOS cryptex union-mounts as the cache carrier C374ACD3-75FE-4FAD-B02E-FC3C9A86DA11."]
procedure = ["Stage the DMG windows into the UFS range, boot with the direct window arguments, and verify root mount plus launchd execution from the committed log."]
findings = ["The driver publishes LUN0 as a 4K read/write block device and the original window reader performs the 512-byte unit conversion.", "System volume mount and launchd execution were captured in the committed log; the RAM Data seed lets SpringBoard reach the UI.", "Persistent on-disk Data is deliberately not in the current profile; the RAM block keeps the session volatile.", "The record uses the canonical upstream ids ShengUfs/RamBlock for the proven NativeUfs/NativeRamBlock pins; VerifiedRoot closes the ShengUfs dependency set at 2854c61f."]
completion = ["Root mounts, launchd starts, and the Data seed behaves correctly for the boot session."]
limits = ["No persistent Data writes yet; media writes outside the window are not implemented.", "UFS error recovery, multiple LUNs and power collapse remain unverified."]
next_action = ["Add a bounded persistent Data region in the unallocated range once the current windows stay stable."]
evidence = [{ kind = "device", reference = "https://github.com/zzweiqing/hackios-mac-batch/actions/runs/41265722207", command = "py -3 -B tools/nabu_esp_log.py pull --root", revision = "12a070555a9ef321df367311b4812f2bfa87beac", result = "Committed log shows UFS requests completing and the system volume mounted before userland start." }]


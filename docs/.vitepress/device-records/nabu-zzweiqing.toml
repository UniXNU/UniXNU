procedure = ["Build the metal profile with the plugin addon and trust, install the ESP payload, and count command buffers, imports and scanout completions in the committed capture."]
findings = ["A640 compute graphs and scanout ran on hardware: run 9048 completed 2752/2752 command buffers and the Metal path composed the desktop.", "A waiting design defect coupled GPU completion to handler delivery (dispatch_group_wait after runtime waits), producing the observed five-frame stall; the decoupling patch is packaged, host-verified and held for installation.", "Five Metal async-creation APIs ran their callbacks synchronously on the calling thread; the fixed candidate passed 20 bounded regressions and is packaged.", "Six board patches to unixnu-adrenometal are kept in patches/components; upstream carries a different fixed-eight-slot import reuse model that does not fit this board contract."]

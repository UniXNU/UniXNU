paths = ["gpu/**", "patches/adrenometal-*.patch", "patches/mesa-turnip-a640-trace-guard.patch", "dts/**", "scripts/build-nabu-adreno.py", "scripts/build-nabu-gpu-userprobe.py"]
inputs = ["Adreno 640 v2, chip-id 0x06040001, GMEM 1 MiB", "GPU MMIO 0x02c00000, GMU 0x02c6a000, RSCC 0x02c8d000, GPU SMMU 0x02ca0000, gpucc 0x02c90000, GCC 0x00100000, PDC 0x0b290000/0x0b490000, command DB 0x85f20000, RPMh 0x18220000, AOP 0x0c300000 with doorbell 0x17c00000, ZAP region 0x98f15000", "Vendor firmware a630_sqe.fw, a640_gmu.bin, a640_zap.{mdt,b02} from the device vendor partition"]

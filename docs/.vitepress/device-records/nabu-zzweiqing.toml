limits = ["The stall defect is not proven resolved on hardware; CoreImage NBLibrary externFunctionNames gaps crash iconservicesagent without blocking the desktop.", "ZAP secure path, full power states and GMU frequency policy are not implemented."]
next_action = ["Run the packaged async-fix/completion-wait candidate and confirm sustained frame production."]

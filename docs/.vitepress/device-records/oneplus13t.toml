evidence = [
  { kind = "device", reference = "STAGE6.md", command = "User report after authorized main-3 temporary boot; no new device operation", revision = "d7dbaa020d64f730737e7b78ee61bec81aef2cc5", result = "The user confirms main-3 desktop startup, correct colors and readable diagnostics, with a slight subjective improvement over Run91. All reported VSYNC readings are zero. No complete FR/DISP/CMD values or measured new FPS were supplied, so the zero-counter cause and limiting frame stage remain unresolved. Further fixes, builds and device operations are paused at the user's request; 120 FPS and physical 120 Hz are unverified." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot -s 3B15BB01BAT00000 boot out/oneplus13t/boot/metal-main-3/boot.img", revision = "d7dbaa020d64f730737e7b78ee61bec81aef2cc5", result = "The user authorized the main-3 device test. Its 100409344-byte image SHA-256 292ea3ca0fdab1d3c71e6e5fd39e5fce22130afcc27fa17d9bd23c5fd1202cbd and the sun bootloader target were rechecked. Windows fastboot Sending/Booting returned OKAY in 3.026 seconds without flashing. Desktop, color, FR/VSYNC/DISP/CMD and performance observations are pending; transport success is not GPU qualification." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41316345393", command = "Actions main Metal run 3; check-native-metal-heap-host.py; compiled symbols/OPP and paired Android/FAT image readback", revision = "d7dbaa020d64f730737e7b78ee61bec81aef2cc5", result = "Main Metal run 3 (41316345393, d7dbaa0) passed production userspace/Data staging and actual macOS Metal heap, QoS, diagnostics, scanout-pixel and completion-protocol checks, reusing run 2's identical new kernel/base Data. The final local image passes paired kernel/Data/trust/UEFI and Android/FAT readback. New-image device performance is untested. Real host assertions cover timing reset, 40-byte completion, one-time 16-byte fallback for old kernels, real error preservation and disabled steady-frame markers. FR and software VSYNC strings and globals are present in the packaged kernel. Collect device readings before identifying the limiting stage." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41234063029", command = "Actions Run91; check-native-metal-heap-host.py; compiled OPP/QoS checks; paired Android/FAT image readback", revision = "5b11f858b3799648708778bf81d6772cc98d66be", result = "Run91 passed full kernel/Metal production builds and actual host heap, QoS, diagnostics and scanout-pixel checks. The local boot image passes matching kernel/Data/trust/UEFI and Android/FAT readback. No phone operation was performed; 525 MHz, sustained FPS and thermal behavior await device testing. Separate host processes confirm default-off and explicitly enabled stage/allocation recording. The packaged flags select sheng-gpu-sample=0 without sheng-diag=1, while retaining the existing on-screen status overlay." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41229571660", command = "Actions Run90; check-native-metal-heap-host.py; boot image Android/FAT readback", revision = "878a7e38d2d0d358bea20d78c4c38a8f2efe869d", result = "Run90 passed production iOS Metal builds and real macOS/MoltenVK heap and scanout pixel checks. The local 100380672-byte boot.img (SHA-256 91cc316ac1edcf151643bf21cda08872b8244caa80a7351a61cbaafd4090f0d4) combines compute-band preservation with the device-confirmed SYSMEM color workaround. Matching Run86 kernel, Data UUID, trust, UEFI and final Android/FAT readback pass. New-image device logs and animation performance remain pending." },
  { kind = "host", reference = "STAGE6.md", command = "ASAN_OPTIONS=detect_leaks=0 python3 scripts/check-gmu.py; check-adreno-a830.py; test-stage7.py", revision = "cdd273d72a1e3a08f118e1fb69b39ed18c3bc929", result = "Run 79 user observation confirms UI startup, 222 MHz requested, hardware busy while sliding, at most about 15 FPS and no smoother scrolling; last GPU handoff/CPU copy/overlay times are 72.2/339.1/27.1 ms. Run 80 source reuses up to six task mappings, enables the existing Metal import cache, negotiates a preserved diagnostic band across GPU/CPU paths and redraws at 4 Hz. Mapping reuse and latest nonzero method/status are visible. Host regressions pass; production build and speedup are pending." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot -s 3B15BB01BAT00000 boot out/oneplus13t/boot/metal-run-79/boot.img", revision = "8bd34b4b1f352a83fe21fcf72bf686e229b28f6b", result = "After the user reconnected fastboot and explicitly requested testing, the Run 79 image hash and sun/bootloader identity were verified. Windows fastboot boot returned Sending OKAY (2.297 s) and Booting OKAY (0.338 s), total 3.001 s, without flashing. Log: out/oneplus13t/boot/metal-run-79/fastboot-boot-20261031-203720.log. Run 79 UI startup, CLK/DISP/API readings and performance await user observation." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41196229588", command = "xnu.yml; python3 /tmp/pagani-package-run79.py", revision = "8bd34b4b1f352a83fe21fcf72bf686e229b28f6b", result = "Run 79 (41196229588, source 8bd34b4) passed cloud regressions, XNU/A830 build and prelink, Metal/Turnip, signing and Data installation in 21m41s. Downloaded kernel SHA-256 matches the final build log. New diagnostic formats and the strong presenter timing symbol are present. The local 100499456-byte out/oneplus13t/boot/metal-run-79/boot.img passes same-build Data UUID, trust, known GFX UEFI, Android v4 and FAT/file/argument readback. The user requested no phone operation; Run 79 performance and activity readings remain untested." },
  { kind = "device", reference = "STAGE6.md", command = "Run 78 user-transcribed overlay after temporary fastboot boot", revision = "b8942ef6e3c1f0e9cbbed7b54fe785fc0c6dd82e", result = "Run 78 user observation confirms UI startup, GPU Metal registered rc=0, submissions/completions 1039/1039, no poisoned jobs and GPU presentation 518/0. Scrolling was visually in the teens of FPS. The old timeout counter includes zero-timeout fence poll misses; snapshot busy means diagnostic lock contention. Error e00002c7 is Unsupported, with the triggering method not yet identified." },
  { kind = "host", reference = "STAGE6.md", command = "Verify Run 78 boot.img; fastboot getvar product/is-userspace; fastboot -s 3B15BB01BAT00000 boot out/oneplus13t/boot/metal-run-78/boot.img", revision = "b8942ef6e3c1f0e9cbbed7b54fe785fc0c6dd82e", result = "After the user connected fastboot and requested testing, the Run 78 image hash was rechecked and the target was confirmed as sun in bootloader fastboot. Windows fastboot boot returned Sending OKAY (2.297 s) and Booting OKAY (0.339 s), total 3.010 s, without flashing. Log: out/oneplus13t/boot/metal-run-78/fastboot-boot-20261031-184620.log. Device startup, SMMU/GMU progress and GPU presentation remain pending user observation." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41166974317", command = "GitHub Actions xnu.yml Run 78; gh run download; local paired payload/boot packaging and executable-symbol, Data/trust, UEFI, boot-argument and Android/FAT readback checks", revision = "b8942ef6e3c1f0e9cbbed7b54fe785fc0c6dd82e", result = "Run 78 passed all cloud regressions, production XNU/A830 compilation and prelink, and Metal/Turnip build and Data staging. The downloaded kernel hash matches the cloud result. Local out/oneplus13t/boot/metal-run-78/boot.img is 100495360 bytes with SHA-256 d6a3858561769553943822ae8d57deab0003d9419e2e82dc78bb931170455d4e. New SMMU/presenter/close-hook and diagnostic entries are executable strong symbols; Data UUID 4C02592E-3207-4785-967B-D8D1C5314E1B, original and owner trust, tested GFX UEFI, GPU-presenter boot argument and Android/FAT content readback pass. No phone operation was performed; device GPU startup, presentation and performance remain unverified." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot boot out/oneplus13t/boot/metal-run-76/boot.img; user transcribed GPU/P/GMU/DISP rows", revision = "dc3b0501d74a6286ba13aebf5c5ea34dfd16869c", result = "Power stage 7 completed; GPU SMMU returns -1 before GMU startup, Metal is unpublished. Last power offset 0x71010 value 0x08000003; display copy 253 ms / 12530 KiB." },

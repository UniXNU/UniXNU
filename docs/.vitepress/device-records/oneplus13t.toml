  { kind = "device", reference = "STAGE6.md", command = "Build-59 temporary boot; user panic photograph and matching-kernel symbol lookup", revision = "859dbce9a793d194f48399633353073df1dc880f", result = "Build 59 stopped with a scheduler ticket-lock panic while the last recorded stage was IOHIDEventDriver matching. That stage does not identify the locking caller. Touch under SMP is unqualified; build 57 remains the basic-touch baseline." },

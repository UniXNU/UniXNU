  { kind = "source", reference = "STAGE6.md", result = "After confirmed basic touch in build 57, the candidate removes pagani-peripheral-status=1 from default boot arguments. Touch transport, HID binding and coordinate handling are unchanged." },
  { kind = "device", reference = "STAGE6.md", command = "Build-57 fastboot boot; user confirmed touch is working", revision = "ad6ed2d5dcb0a12e7d0b24108440b265df33a477", result = "The user confirmed that touch is working after the build-57 temporary boot. This is hardware evidence of basic touch response beyond build-56 accepted HID reports. No HID/XY readings or separate multi-touch, coordinate-calibration, edge-gesture, sleep/wake or long-duration results were supplied." },
  { kind = "host", reference = "STAGE6.md", command = "./unixnu payload; ./unixnu bootimg; Android/FAT readback; fastboot boot", revision = "ad6ed2d5dcb0a12e7d0b24108440b265df33a477", result = "The user-authorized build-57 temporary boot returned Sending/Booting OKAY. Lock-screen state, ordinary taps, swipes and the TOUCH/HID/XY rows are requested; event binding and UI delivery remain unqualified." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40461298553", command = "Actions build 57; gh run download; kernel/source-pin and packed/raw Data verification", revision = "ad6ed2d5dcb0a12e7d0b24108440b265df33a477", result = "Build 57 compiled and linked the standalone touch descriptor, product-scoped event-driver matching, qualified per-instance dispatch and edge-origin lifecycle. The downloaded kernel contains binding/event/X/Y diagnostics and matches the pinned sources. No hardware boot was performed; binding, coordinates, ordinary taps and system gestures remain unqualified." },
  { kind = "source", reference = "STAGE6.md", result = "Following the input guide, the candidate separates touchscreen Usage 13/4 from buttons, installs a Pagani S3910 SPI-only IOHIDEventDriver personality, and requires actual driver/ABI/usage/collection binding before sending. A per-instance qualified dispatch wrapper preserves edge-origin 0x800 through release and observes event counts and X/Y. Descriptor, personality, contact/edge lifecycle, bounds and existing transport/power tests pass. Ordinary taps and system gestures remain unverified." },
  { kind = "device", reference = "STAGE6.md", command = "Build-56 temporary boot; user transcribed TOUCH/SPI rows and tested press/release, both edge swipes and power-menu Cancel", revision = "3a12121d3ef9fdee1636500665c5cbb4baf5b83c", result = "Build 56 shows TOUCH HID report r=0 with count increasing (observed 430); v is nonzero while pressed and returns to zero on release. Valid protocol and parsed contact activity now reach the kernel HID API, while UI swipes and an ordinary Cancel tap fail. Current code does not observe event-driver attachment or digitizer dispatch; keyboard-first identity, downstream matching, coordinates and release delivery require investigation." },
  { kind = "host", reference = "STAGE6.md", command = "./unixnu payload; ./unixnu bootimg; Android/FAT readback; fastboot boot", revision = "3a12121d3ef9fdee1636500665c5cbb4baf5b83c", result = "The matching build-56 image was sent with fastboot boot after the user connected the device. Sending/Booting returned OKAY; touch response and the TOUCH, SPI RX/dly or PWR diagnostic values await hardware feedback." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40448445357", command = "Actions build 56; gh run download; local kernel/source-pin and packed/raw Data verification", revision = "3a12121d3ef9fdee1636500665c5cbb4baf5b83c", result = "Build 56 compiled and linked the explicit 1800/3100 mV touch requests, 200 ms power wait and checked SPI delays of 50/0. The downloaded kernel contains the new diagnostics and matches all source pins and its RAM Data UUID. No XNU hardware test was performed; valid S3910 traffic and UI touch remain unverified." },
  { kind = "source", reference = "STAGE6.md", result = "A synchronized Android gesture capture contains 40 complete press/release cycles over 18.793234 seconds, 726 frames and 51 overlapping valid SPI RX records. Following the hummer S3910 power diagnosis, the candidate validates the 13T command DB resources, requests 1800/3100 mV, waits 200 ms, and sets checked CS/word delays to 50/0 before reset. First-read diagnostics include dly; power failures preserve resource, RSC, TCS and acknowledgement state. Host regressions pass; SE DMA and protocol validation are unchanged, and XNU touch remains unverified." },
  { kind = "device", reference = "STAGE6.md", command = "Read-only ADB root capture of Android regulator, GPIO, clock and existing SPI IPC logs; compare OnePlus touch and GENI source", revision = "bdeec6693f1b8488a3286446f0b93c13c02d6785", result = "The Android baseline uses the OnePlus HBP driver on the local 6.6.118 kernel. Retained GPI logs show ff TX, a5 23 ca 05 RX, CS delay 50 and inter-word delay 0. Idle RESET/ATTN are high and SPI is runtime suspended; live sampling captured no gesture or active interval. The current port omits an explicit SE_SPI_DELAY_COUNTERS write, but its inherited value and XNU rail state remain unknown, so timing is a candidate cause rather than a confirmed diagnosis." },
  { kind = "device", reference = "STAGE6.md", command = "Build-55 temporary boot; user transcribed TOUCH and both SPI rows, then confirmed return code b9", revision = "664530f8de814569c8255d07b67c7e2f6d6db3bd", result = "Build 55 reports TOUCH T0 00 header r=ffffffb9 v=0 n=0; SPI RX n=4 h=00000000 a=0/0 rst=3; SPI dma=1 ti=4 ri=4 st=0. The RX canary is replaced by zeros and both DMA length-in readings are 4, but no valid sensor header or UI touch is obtained. ATTN is low before/after; RESET input and output latch are high. Stock Android explicitly enables ldob4 at 1.8 V and ldob16 at 3.1 V; this port still adopts retained rails, whose XNU state is unknown." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40437346840", command = "Actions build 55; ./unixnu payload; ./unixnu bootimg; APFS/FAT readback; fastboot boot", revision = "664530f8de814569c8255d07b67c7e2f6d6db3bd", result = "Build 55 passed actual-adapter first-success retention and zero-header rejection tests, protocol/contact/button/PIO/SE DMA regressions, C/C++ compilation and original/compiled HID ABI checks. Both first-read diagnostic formats are present in the final kernel. The matching image passed readback and fastboot boot; raw RX/GPIO/counter values and usable touch remain unverified." },
  { kind = "device", reference = "STAGE6.md", command = "Build-54 temporary boot; user transcribed TOUCH row and absent SPI rows", revision = "fba147283bead8e3e9f7c3ce9edc36f012bb1ec9", result = "TOUCH T0 00 header r=ffffffb9 v=0 n=0. SPI returned success but the protocol parser rejected a zero header; touch setup stopped before HID start. No SPI error rows appeared. Valid sensor data and UI touch remain unverified." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40369222494", command = "Actions build 54; ./unixnu payload; ./unixnu bootimg; APFS/FAT readback; fastboot boot", revision = "fba147283bead8e3e9f7c3ce9edc36f012bb1ec9", result = "Build 54 compiled the DMA allocation/cache/SMMU adapter against the original kernel ABI and passed transport/contact/button regressions. The matching image passed local readback and fastboot boot. Whether the QUP stream is available and SE DMA works on the phone remains unverified." },
  { kind = "device", reference = "STAGE6.md", command = "Build-53 temporary boot; user transcribed TOUCH and SPI rows", revision = "c5edbf3617dd5effd63b74f915218539adca1476", result = "First four-byte SPI read still times out. fw=102 if=1 st=41 irq=0; FIFO tx=0 rx=0. FIFO interface disabled is observed; successful DMA and touch are not established." },
  { kind = "host", reference = "STAGE6.md", command = "Actions build 53; ./unixnu payload; ./unixnu bootimg; APFS/FAT readback", revision = "c5edbf3617dd5effd63b74f915218539adca1476", result = "Build 53 passed actual SPI callback/snapshot and protocol/contact/button regressions, C/C++ compilation and original/compiled HID ABI checks. The final image contains both SPI status formats and was temporarily booted; hardware register values are pending." },
  { kind = "device", reference = "STAGE6.md", command = "Build-51 temporary boot; user transcribed TOUCH status", revision = "9d9726f53038aa5d090dd13502064de9b4c94128", result = "Touch remains unresponsive. TOUCH T0 00 header r=ffffff92 v=0 n=0 locates the timeout in the first SPI transfer, before protocol identification. No GENI register snapshot was visible in build 51." },
  { kind = "host", reference = "STAGE6.md", command = "Actions build 51; ./unixnu payload; ./unixnu bootimg; APFS/FAT readback", revision = "9d9726f53038aa5d090dd13502064de9b4c94128", result = "Build 51 passed actual SPI read callback tests, v1/v2 protocol and contact/button/SPMI/GENI regressions, C/C++ compilation and original/compiled HID ABI checks. The matching image was temporarily booted; touch behavior and protocol status await observation." },
  { kind = "device", reference = "STAGE6.md", command = "Build-50 temporary boot; photo and user observation", revision = "1e98cc4c10c86904d7cafc6cb98dc4a29538628d", result = "Lock screen after skipping Setup; short power presses switch the screen off/on, long press opens shutdown UI. Volume presses advance the key-report counter. Touch has no response: TouchComm start r=ffffffb9, n=0, raw value hidden by camera." },
  { kind = "host", reference = "STAGE6.md", command = "Actions build 50; ./unixnu payload; ./unixnu bootimg; APFS/FAT readback", revision = "1e98cc4c10c86904d7cafc6cb98dc4a29538628d", result = "Build 50 passed actual HID descriptor parsing, TouchComm/contact/button/SPMI/GENI tests, C/C++ compilation and original/compiled HID ABI checks. The matching image was temporarily booted; touch/key response and KEYS/TOUCH rows await observation." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot -s 3B15BB01BAT00000 boot stage7-run-49/boot.img; user observation", revision = "be18db0025fbde66ffd0a55302f9c1bc0fe3c122", result = "Sending and Booting returned OKAY. The user reported no repeat panic during the test, while touch, volume/power keys and brightness remained unusable. Test duration was not specified; this does not qualify long-term stability or input." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot -s 3B15BB01BAT00000 boot out/oneplus13t/boot/stage7-run-48/boot.img", revision = "e6435b2bda6e91431f3bc0c442d1ff9c47be1451", result = "Build 48 briefly reached the UI. Touch, volume/power keys and brightness did not respond; a UFS read timed out after 297989 reads. The screenshot shows one busy sample, elapsed time beyond the deadline and a later completed DMA snapshot. No partition was flashed." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40183635568", command = "test-peripherals.py; test-stage7.py; ./unixnu kernel -j 3", revision = "e6435b2bda6e91431f3bc0c442d1ff9c47be1451", result = "TouchComm, contact lifecycle, key debounce/failure, SPMI and GENI tests passed. The HID object passed ABI checks and the S3910/GENI sources compiled as C; all three objects linked into the prelinked kernel. Hardware input remains untested." },
  { kind = "source", reference = "drivers/PaganiInput/README.md", result = "Physical HID adapters, bounded TouchComm/SPMI paths, contact and key lifecycle tests; no hardware result claimed." },
]

[[area]]
id = "gpu"
status = "host-verified"
components = ["Sm8750Platform"]
paths = ["board.toml", "dts/oneplus13t.dts", "scripts/*gpu*.py", "scripts/*gmu.py", "scripts/data/sm8750-gpu-inputs.json", "scripts/*metal*.py", "package/PaganiGpu*", "proprietary-files.txt"]
inputs = ["PKX110 Android runtime DTB SHA-256 d00767f2068d0df73fc2a077de750bba66a5420c77414db1441ff09f6f3ec223, recorded in proprietary-files.txt. It reports Adreno830v2, chip ID 0x44050001, GPU registers 0x3d00000/0x40000, GMU registers 0x3d37000/0x68000, GPUCC 0x3d90000/0x9800, GPU SMMU 0x3da0000/0x40000 and ZAP reserved memory 0x9b09a000/0x2000.", "GPU IRQs are SPI 300 and 80; GMU HFI/GMU IRQs are SPI 304 and 305. The stock GPU SMMU uses stream IDs 0 (user), 1 (LPAC), 2 (secure) and 5 (GMU).", "The stock DTB has six GPU power-level bins; the active speed bin and its voltage/bandwidth policy need measurement before power-up.", "A related OnePlus SM8750 Android device repository lists gen80000_gmu.bin, gen80000_sqe.fw, gen80000_aqe.fw and gen80000_zap.mbn. Four images are now extracted from the backup base vendor partition and pinned in scripts/data/sm8750-gpu-inputs.json; OTA overlays and current active-slot equality remain unverified.", "Adreno 830/SM8750 requires the new Gen8 backend within the retained Adreno740 component; the original A740/SM8550 startup path alone does not support this board.", "A related OnePlus SM8750 Android device repository lists gen80000_gmu.bin, gen80000_sqe.fw, gen80000_aqe.fw and gen80000_zap.mbn. PKX110 paths and bytes remain unverified.", "Adreno 830/SM8750 requires a Gen8 backend; catalog Adreno740 is scoped to A740/SM8550 and cannot be selected as the 13T GPU driver."]
configuration = ["The shared SM8750 DTSI describes GPU, GMU, GPUCC, separate GX power controller and GPU SMMU resources with status=disabled. The board DTS supplies the observed chip ID and model. The ordinary board.toml selects no GPU or Metal component. The isolated oneplus13t_metal profile selects Adreno740 and AdrenoMetal with the explicit A830 board entry; CPU framebuffer presentation remains active.", "The shared SM8750 DTSI describes GPU, GMU, GPUCC and GPU SMMU resources with status=disabled. The board DTS supplies the observed chip ID and model. board.toml selects no GPU or Metal component; CPU framebuffer presentation stays active."]
procedure = ["Validate the shared and board GPU nodes against the captured runtime DTB, including register extents, interrupts and stream IDs.", "Extract PKX110 GMU, SQE, AQE and signed ZAP firmware from the matching stock image; record paths, sizes and SHA-256 pins in proprietary-files.txt without committing blobs.", "Implement and qualify an A830 power/GMU/HFI backend, then SMMU mappings, CP submission and a bounded fence before selecting a Metal frontend."]
findings = ["The user confirms main-3 desktop startup, correct colors and readable diagnostics, with a slight subjective improvement over Run91. All reported VSYNC readings are zero. No complete FR/DISP/CMD values or measured new FPS were supplied, so the zero-counter cause and limiting frame stage remain unresolved. Further fixes, builds and device operations are paused at the user's request; 120 FPS and physical 120 Hz are unverified.", "The user authorized the main-3 device test. Its 100409344-byte image SHA-256 292ea3ca0fdab1d3c71e6e5fd39e5fce22130afcc27fa17d9bd23c5fd1202cbd and the sun bootloader target were rechecked. Windows fastboot Sending/Booting returned OKAY in 3.026 seconds without flashing. Desktop, color, FR/VSYNC/DISP/CMD and performance observations are pending; transport success is not GPU qualification.", "Main Metal run 3 (41316345393, d7dbaa0) passed production userspace/Data staging and actual macOS Metal heap, QoS, diagnostics, scanout-pixel and completion-protocol checks, reusing run 2's identical new kernel/base Data. The final local image passes paired kernel/Data/trust/UEFI and Android/FAT readback. New-image device performance is untested. Actual kernel SHA-256 e286ea49dfd3b97fa1d84abd2f788af3ce04ba70db2de9f3afbd7ffe1a3572a5, strong runtime symbols and the compiled 525 MHz OPP selection pass. A830 does not enable the upstream A740 two-ring preemption path; sustained 120 FPS remains unverified.", "Main run 2 (41312611105) passed full kernel/prelink and iOS Turnip/Metal/plugin signing. Data staging stopped because build-metal-userspace.py still passed the removed upstream --clients argument. The caller now uses the current --publish BASE OUTPUT interface. Reuse this exact kernel/base Data for the userspace retry; actual host Metal checks and final boot packaging are pending.", "Main workflow run 1 stopped at a macOS user-client host link: the fixture lacked native_adreno_now_us, which production NativeAdrenoPublish already defines. The test now uses its existing simulated clock and the full Clang/ASan/UBSan A830 checks pass. Production sources are unchanged; rerun the complete candidate build.", "Synced UniXNU main 6790e7c (merge 888876f), Adreno740 a9a2cbb and AdrenoMetal 831a9dc while retaining iPadOS 17 and Gen8 boundaries. The candidate suppresses steady-frame progress traffic, adds compatible completion timings and observed software VSYNC counters, and keeps stock 525 MHz/SYSMEM. Local protocol, ownership, timing/status, console and cadence checks pass; production build and device bottleneck measurements are pending. See STAGE6.md.", "At the user's explicit test request, Run91 image hash was rechecked and Windows fastboot accepted temporary boot on sun in 3.275 s (Sending 2.293 s, Booting 0.337 s), without flashing. Log: out/oneplus13t/boot/metal-run-91/fastboot-boot-20261101-204948.log. The user confirms desktop startup and correct colors: req=525 MHz, busy=0, active SP unknown/6, G=40 fps/20.1 ms, C=0.0/259.4, O=0.2 at 4 Hz. CMD submitted/completed=4547/4547, bad=0, P=2099/0; API current m=7 err=0, retained E=6/e00002d6. Requested clock and one busy sample do not establish actual clock or bottleneck; panel timing and thermal stability remain unmeasured.", "Run91 passed full kernel/Metal production builds and actual host heap, QoS, diagnostics and scanout-pixel checks. The local boot image passes matching kernel/Data/trust/UEFI and Android/FAT readback. No phone operation was performed; 525 MHz, sustained FPS and thermal behavior await device testing. Actual kernel instructions contain the 525000001 stock-OPP comparison, and the iOS plugin imports both QoS functions. Host completion callbacks use user-interactive QoS; stage/allocation records appear only when diagnostics are enabled.", "Run 90 user confirms correct colors and readable logs: 389 MHz requested, 28-40 GPU presentations/s, no CPU fallback, three reused scanout mappings. Next candidate integrates upstream diagnostic gating, iOS runtime QoS and SYSMEM non-lazy allocations, requests stock 525 MHz with matched voltage/bandwidth, and uses 120 Hz software pacing. Panel timing and achieved FPS remain unverified; build/download only, no phone operation.", "Run90 was temporarily booted at 2026-11-01 03:02 Asia/Shanghai after the user returned the phone to Windows bootloader fastboot. Exact image hash and product sun/is-userspace=no matched. Sending/Booting returned OKAY in 2.971 seconds; no partition was flashed. Color, complete log text and app-animation counters await feedback.", "Run90 passed production iOS Metal builds and real macOS/MoltenVK heap and scanout pixel checks. The local 100380672-byte boot.img (SHA-256 91cc316ac1edcf151643bf21cda08872b8244caa80a7351a61cbaafd4090f0d4) combines compute-band preservation with the device-confirmed SYSMEM color workaround. Matching Run86 kernel, Data UUID, trust, UEFI and final Android/FAT readback pass. New-image device logs and animation performance remain pending.", "Warm interaction feedback: repeated control-center transitions no longer stall severely, while app open/close animations remain around 20 FPS by user observation. Logs are still unreadable on the Run88 control; the remaining bottleneck is not yet measured.", "Run88 SYSMEM-only control restored normal colors on device. User estimates 30-60 FPS during smooth interaction, with control-center/cold-launch stalls and unreadable logs still present. The candidate profile now selects sysmem,nocb until A830 GMEM correctness is qualified; Run90 combines this runtime flag with the compute-band fix.", "User confirmed fastboot readiness; the exact Run88 SYSMEM control was temporarily booted at 2026-11-01 02:31 Asia/Shanghai. Sending/Booting returned OKAY in 2.946 seconds, without flashing. Color and interaction comparison await user observation.", "Run88 user feedback reports smoother interaction around 60 FPS with color corruption. A same-component sysmem,nocb boot-argument variant is packaged for controlled diagnosis; color correctness and sustained FPS remain unverified.", "Run88 user observation: UI is usable and markedly smoother, reported about 60 FPS, but colors flicker and fixed diagnostic letters disappear while changing digits remain. CLK/DISP/CMD values are unreadable. Source inspection found opaque/half-float GPU compute scanout bypassed the preserved diagnostic band; the source now dispatches visible row spans and adds pixel/padding checks for empty, middle and full bands. macOS validation and a rebuilt candidate are pending. Color-flicker root cause remains unconfirmed.", "On 2026-11-01 02:09 Asia/Shanghai the user connected fastboot and requested testing. Run88 image hash was rechecked, target sun/bootloader identity matched, and Windows fastboot boot returned Sending OKAY (2.293 s), Booting OKAY (0.336 s), total 3.052 s without flashing. Log: out/oneplus13t/boot/metal-run-88/fastboot-boot-20261101-020921.log. Phone startup, requested clock, GPU counters and frame pacing await device observation.", "Run 88 production kernel/Metal/Turnip/signing and local image readback passed; Run 89 passed actual frontend/Rust heap buffer/texture/view aliasing, retained-resource reuse, destruction, placement/non-heap controls and the old-code negative control with identical production sources. The actual iOS gpuCoreCount implementation returns 6; the kernel selects the original 389 MHz OPP. No new phone test; stable 60 FPS, active SP count, achieved clock and thermal stability remain unmeasured.", "Run 88 production iOS build/signing/Data installation passed. The host fixture assumed a full automatic texture heap returned nil, while upstream spills to a standalone texture. The fixture now detects unchanged heap occupancy and preserves actual aliasing and negative-control checks; a host-only rerun is pending. Production code is unchanged.", "Run 87 reused the exact Run 86 kernel/Data and built iOS Turnip plus the updated Metal bridge. Plugin compilation exposed an arm64e-only framebuffer helper whose definition lacked the caller guard; both now share that guard. Actual plugin/frontend/daemon syntax checks run before Rust LTO with the same build flags. A complete userspace build is pending.", "Run 85 passed all macOS host contracts and driver compilation, then final kernel linking exposed absent upstream pmap/DCVS diagnostics. The candidate now provides the real read-only user-mapping walk for the selected non-PPL XNU and records the acknowledged board HFI level in native_gpu_dcvs[1], with governor-running flag zero. The actual pmap helper passes GCC and Clang ASan/UBSan checks for invalid, empty, kernel, IOMMU, single and chained user mappings, optional outputs and balanced locks. No mapping is removed. Run 86 production compile and prelink passed. Metal stopped at an overlapping Mesa patch; the rebased 12-patch sequence now applies and reverses to the pinned source, with submit-pressure/timing regressions passing.", "The next candidate follows upstream GPU parity with matching Adreno740/Metal/SMMU/GOP and runtime pins while preserving iPadOS 17 and prior buffer/overlay fixes. It replaces the 512 MiB BO pool with system pages, integrates per-process A830 SQE/AQE mappings, requests the original 389 MHz OPP with matched voltage/bandwidth, and reports the verified six-SP topology to Metal. Active SP count and stable 60 FPS remain unverified; production build is pending.", "The follow-up for stable 60 FPS removes the remaining full-band 4 Hz write from the synchronous display path: after overlay negotiation only changed glyphs are rasterized and written; first paint and legacy clients keep full writes. Actual-code ASan/UBSan checks preserve unchanged-cell sentinels and verify changed glyphs, odd pitch, bounds and panic. Device O time and frame pacing remain unmeasured.", "The 60 FPS target is unverified. Comparison with current upstream and zeta retains existing TLB/audit and 16384-object fixes, adds the missing Metal heap alias bridge and elapsed-time-bounded shared submit backpressure, and keeps cache maintenance and completion ordering. Actual submit regression and old-code control pass; real heap bridge tests are wired into macOS CI. See STAGE6.md for references and limits.", "Run 79 user observation confirms UI startup, 222 MHz requested, hardware busy while sliding, at most about 15 FPS and no smoother scrolling; last GPU handoff/CPU copy/overlay times are 72.2/339.1/27.1 ms. Run 80 source reuses up to six task mappings, enables the existing Metal import cache, negotiates a preserved diagnostic band across GPU/CPU paths and redraws at 4 Hz. Mapping reuse and latest nonzero method/status are visible. Host regressions pass; production build and speedup are pending.", "After the user reconnected fastboot and explicitly requested testing, the Run 79 image hash and sun/bootloader identity were verified. Windows fastboot boot returned Sending OKAY (2.297 s) and Booting OKAY (0.338 s), total 3.001 s, without flashing. Log: out/oneplus13t/boot/metal-run-79/fastboot-boot-20261031-203720.log. Run 79 UI startup, CLK/DISP/API readings and performance await user observation.", "Run 79 (41196229588, source 8bd34b4) passed cloud regressions, XNU/A830 build and prelink, Metal/Turnip, signing and Data installation in 21m41s. Downloaded kernel SHA-256 matches the final build log. New diagnostic formats and the strong presenter timing symbol are present. The local 100499456-byte out/oneplus13t/boot/metal-run-79/boot.img passes same-build Data UUID, trust, known GFX UEFI, Android v4 and FAT/file/argument readback. The user requested no phone operation; Run 79 performance and activity readings remain untested.", "Run 78 user observation confirms UI startup, GPU Metal registered rc=0, submissions/completions 1039/1039, no poisoned jobs and GPU presentation 518/0. Scrolling was visually in the teens of FPS. The old timeout counter includes zero-timeout fence poll misses; snapshot busy means diagnostic lock contention. Error e00002c7 is Unsupported, with the triggering method not yet identified.", "The next candidate retains cached Metal snapshots, pairs core method/status, labels fence poll misses, samples/rasterizes status at 4 Hz and copies cached pixels per frame. It reports requested GPU MHz, guarded Gen8 hardware busy, unknown active SP count out of 6 configured SPs, and separate GPU/CPU rates plus handoff/copy/overlay timing. Host regressions and Run 79 production build/image checks pass; hardware performance remains pending.", "After the user connected fastboot and requested testing, the Run 78 image hash was rechecked and the target was confirmed as sun in bootloader fastboot. Windows fastboot boot returned Sending OKAY (2.297 s) and Booting OKAY (0.339 s), total 3.010 s, without flashing. Log: out/oneplus13t/boot/metal-run-78/fastboot-boot-20261031-184620.log. Device startup, SMMU/GMU progress and GPU presentation remain pending user observation.", "Run 78 passed all cloud regressions, production XNU/A830 compilation and prelink, and Metal/Turnip build and Data staging. The downloaded kernel hash matches the cloud result. Local out/oneplus13t/boot/metal-run-78/boot.img is 100495360 bytes with SHA-256 d6a3858561769553943822ae8d57deab0003d9419e2e82dc78bb931170455d4e. New SMMU/presenter/close-hook and diagnostic entries are executable strong symbols; Data UUID 4C02592E-3207-4785-967B-D8D1C5314E1B, original and owner trust, tested GFX UEFI, GPU-presenter boot argument and Android/FAT content readback pass. No phone operation was performed; device GPU startup, presentation and performance remain unverified.", "The enhanced candidate follows the pinned OnePlus bank policy (GPU 0/1 reserved, GMU from 2), selects invalid SMMU slots without disturbing live routes, removes optional contiguous searches for ordinary BOs, and connects the existing GPU scanout presenter only after GPU self-tests. Presenter ownership/close fallback and SMMU/allocator regressions pass on software peers; Run 78 full build and local image checks pass; hardware results are pending.", "Run 76 device feedback reached GPU SMMU with rc=ffffffff, power step=7 window=0 offset=71010 value=08000003, Metal unpublished and GMU fields zero; CPU display copy was 253 ms / 12530 KiB. The branch-clock sequence completed, but the generic SMMU failure does not identify its branch. The diagnostic candidate preserves exact return codes, preflight register snapshots and existing GMU/GPU context reports; ACTLR 0x32b matches the captured DTB. Software tests retain layout/busy-bank/ACTLR/I/O refusal and verify no MMIO from status rendering. Hardware SMMU correction awaits specific readings.", "After renewed user authorization, the paired Run 76 image passes executable GPU symbols, Data UUID, original/owner trust, tested GFX UEFI and Android/FAT readback. Boot image SHA-256 a249b0c90b9a3d8270f1de96ce1681bb39cb59a03d33d1c59c553cb3dff9683e. The target is sun in bootloader fastboot; Sending and Booting returned OKAY in 2.984 seconds without flashing. New GPU/P/GMU or M/CMD/API readings are pending; successful DEMET progression and GPU execution are unverified.", "Run 76 passed branch HALT/FSM regressions, all existing host contracts, full XNU/A830 kernel/prelink and Metal builds. Artifacts are downloaded to out/oneplus13t/actions/metal-run-76/. The 128344064-byte arm64 kernel SHA-256 54fab07ecaa0b23ba6baf61419e1a449247c00651e0fbc4e5708f1b4e9b2e26d matches the cloud log; power/start/diagnostic entries are executable strong symbols and Data UUID 2459A7A6-B0FE-4CF3-992A-8CDF16E7A155 matches. At the user request work stops after download: no boot image or phone operation; runtime and unchanged CPU display performance remain unverified.", "Run 75 device readings advanced past critical CXO to GPUCC +0x9010 (DEMET): power rc=ffffff92 (-110), value=08000000, Metal unpublished, GMU fields zero; DISP 386.4 ms / 12540 KiB. Vendor branch2 accepts CLK_OFF clear or NoC FSM ON without enable-bit readback. The corrected common branch poll passes reported-value and NoC-ON regressions while rejecting real halted states, with all 81 read and 38 write failure points and five bounded stalls passing. New device validation is pending.", "Run 75 includes the vendor-aligned branch write/delay/skip sequence and preserves the power error code. Cloud power regressions, full kernel/prelink and Metal builds passed. The paired boot image passes downloaded-kernel identity, executable GPU symbols, Data UUID, owner/original trust, tested GFX UEFI and Android/FAT readback. Windows fastboot accepted temporary boot in 3.042 seconds without flashing. Advancement beyond GPUCC +0x9008 and GMU/Metal startup remain pending new device readings; CPU presentation is unchanged.", "Run 74 device readings stop at GPU power step 6, GPUCC +0x9008 value 0x08000000; GMU is not started and Metal is not published. The pinned vendor provider writes its critical CBCRs without an enable-bit readback poll. The candidate aligns branch write/delay/skip behavior while retaining checked-clock and downstream GPU validation. The old sequence fails the non-latching critical-clock regression; the correction passes with 81 read/38 write failures and five bounded stalls. Device retest is pending.", "Run 74 user feedback confirms system startup and visible GPU information after the recorded temporary boot. The exact GPU/M/CMD/API/DISP values and their changes during interaction have not been recorded; GPU execution and low-frame-rate improvement remain unverified.", "Run 74 passed all cloud contracts, the production early-console object checks, full kernel/prelink and Metal userspace builds. The paired image passes executable GPU diagnostics symbols, Data UUID, owner/original trust, tested GFX UEFI and Android/FAT readback. Windows fastboot accepted the temporary boot in 3.227 seconds without flashing. Visible GPU rows and actual rendering remain pending user observation.", "Run 70 exposed a stale BootProgress selection: only Stage7Probe/PaganiInput used the working driver checkout, so the board compiler could not see the new status interface. The isolated profile now explicitly selects BootProgress too. A resolver regression fails before this correction and passes after it. Metal builds now require successful kernel compilation; Run 70 is not a bootable result.", "The diagnostic candidate preserves the last GPU stage/startup return and snapshots Metal connections, caller, methods and submit/completion/timeout/poison counts without waiting for the GPU lock. Failed publication shows saved power and GMU/HFI results. Actual-code host snapshot and console tests pass; diagnostic kernel/device verification is pending.", "Run 69 (41079321476, source bundle commit 823a2fa) passed A830/GMU contracts, XNU compile/prelink, Turnip/Metal builds, signing and Data staging. The actual kernel contains both direct Sm8750SocInfoGpuCode calls. The paired Data UUID is C6D2F70B-11E9-4A89-908C-C2C9B5711DF1; all three owner CDHashes and both unchanged original trust modules passed readback. The 100491264-byte metal-run-69/boot.img embeds the tested complete-GFX UEFI and matching 192 MiB FAT payload; SHA-256 df36c514399f6a9e0a71f94443013318e60f188dd5873dfd916bf51b09353ba0. Windows fastboot Sending/Booting returned OKAY in 3.044s without flashing. The user confirmed normal system startup with roughly one visible frame update per second. The previous SMEM panic was bypassed on this boot; GPU initialization and Metal rendering remain unverified.", "With the complete GFX UEFI mapping, Run 68 reached GPU board inputs and then panicked at pagani_gpu_start+0x288: PC 0xfffffff00bfd9e58, ESR 0x96000010, FAR 0xfffffff9b9737000. The faulting ldrb copies the SMEM window at offset 0x9e000 (physical 0x81d9e000). The source now reads only global-partition metadata and socinfo through volatile accesses, retains two-read ID/SKU validation, and removes both whole-SMEM copies. Cached/uncached protected-gap tests and the existing GMU host suite pass. Run 69 rebuild and temporary launch are recorded above; GPU power, command submission and Metal rendering remain unverified.", "The A830 candidate now connects command-db ARC/BCM/dependency votes, SMEM/SKU and speed-bin selection, GPUCC/CX control, secure CX initialization, native 4 KiB GPU/GMU SMMU contexts, GMU firmware/HFI and OOB/DCVS, signed ZAP/PAS, Gen8 protection/UBWC/restore state and CP submission.", "PaganiGpu.cpp publishes the user client and staged accelerator only after ZAP authentication, a secure-exit fence and a GPU memory-write check. These checks are implemented in the runtime but have not executed on the phone. Failures retain potentially live allocations and stop publication.", "A830 uses a larger SQE allocation and a separate executable AQE allocation. Existing A740 C interfaces and default behavior remain covered by software-peer tests. The Gen8 helper tests include MMIO failures, stale acknowledgements, invalid rail/SKU inputs, SCM busy/interrupted behavior and bounded timeout handling.", "The isolated oneplus13t_metal profile selects the changed sibling Stage7Probe, Adreno740 and AdrenoMetal, enables the explicit board entry, and adds IOGPUFamily. Its component recipe compiles the board runtime and stages the accelerator class; the ordinary board selection remains CPU-rendered.", "The actual 21H461 IOGPU text and four accelerator entry points match the recorded ABI. The board source passes a C++ syntax check with host fixtures, and the GMU kit builds as ordinary arm64 iOS 17 Mach-O objects. Production XNU compilation and prelink passed in cloud build 68; hardware startup remains unverified.", "The Turnip KMD recognizes chip 0x44050001 as GPU 830. The A830 plugin build excludes recorded A740 commands. The macOS build has compiled Turnip, the Metal bridge, plugin and probe daemon and passed 4 KiB signing plus owner-trust generation. The final Data stage uses the selected PaganiDarwinBoot packing helper and passed in build 68. The resulting boot.img is packaged and its embedded contents passed readback checks. Presentation uses the existing CPU framebuffer copy path.", "The stock DTB reports Adreno830v2 and qcom,adreno-gpu-gen8-0-1. GPUCC offset 0x905c is GX reset; the separate GX controller is at 0x3d68024/8. Default GPU nodes remain disabled. The opt-in board runtime maps the documented resources directly.", "The A830/Metal candidate is out/oneplus13t/boot/metal-run-68/boot.img. Build 63 and the separate read-only UEFI probe remain available as baselines. Prior UI/touch and eight-core observations establish no GPU execution. The probe tests cover 128 prerequisite combinations and read failures; an actual bus abort cannot be recovered by that adapter.", "Performance candidate after Run90: source-only bundle 7cb596187eca02ad044dce1b4454817cea74379610be9cf5b681416af01d9685; upstream Metal opt-in diagnostics, local iOS QoS/runtime trace patches, SYSMEM non-lazy allocation, stock 525 MHz and 120 Hz software pacing. Full kernel/userspace rebuild required; no phone boot until user returns. Physical refresh and 120 FPS unverified.", "Follow-up to the 60 FPS target: negotiated overlay rows now write only changed glyphs at 4 Hz. First paint and legacy clients retain full writes. The actual console regression checks unchanged-cell sentinels, changed glyphs, odd pitch, bounds and panic; ASan/UBSan and Stage7 checks pass. All previously prepared mapping, heap and submit changes are retained; phone frame pacing is still pending.", "Run 80 source-only candidate follows Run 79 user-observed 15 FPS and 27.1 ms overlay cost: reuse six task mappings, preserve the diagnostic band at 4 Hz, retain nonzero method/status and map hits, forward Metal heap alias operations, and use elapsed-time-bounded shared queue backpressure. Local lifecycle, overlay and submit positive/negative regressions pass; production and real heap bridge checks run in macOS CI. Stable 60 FPS remains the hardware target.", "The next candidate retains cached Metal snapshots, pairs core method/status, labels fence poll misses, samples/rasterizes status at 4 Hz and copies cached pixels per frame. It reports requested GPU MHz, guarded Gen8 hardware busy, unknown active SP count out of 6 configured SPs, and separate GPU/CPU rates plus handoff/copy/overlay timing. Host regressions pass; full build and performance remain pending.", "The enhanced source-only candidate follows the pinned OnePlus GPU/GMU context-bank policy, selects invalid SMMU slots while preserving live firmware routes, removes optional contiguous searches for ordinary BOs, and connects the GPU presenter after self-tests with ownership and close/error fallback. Host SMMU, presenter, fragmented allocation, GPU context mismatch, GMU/HFI and power regressions pass; cloud build and local image assembly pending; no device operation authorized for this overnight candidate.", "The stock DTB names the GPU Adreno830v2 but advertises qcom,adreno-gpu-gen8-0-1; the two strings are preserved as observed, without inferring a different GPU revision.", "The disabled DTS nodes record four GPU windows, two GMU windows, GPUCC and the separate GPU SMMU. No clock, power, firmware, SMMU or command operation is activated.", "The SpringBoard/input and eight-core candidates continue to use CPU framebuffer copies. Their hardware observations do not establish GPU/Metal acceleration."]
completion = ["GPU submissions complete, mapping/fence handling is correct, a known image renders, and the selected Metal client presents it."]
limits = ["Run 78 confirms startup, completed GPU commands and GPU scanout handoff through user-transcribed counters. Full Metal support, known shader-image correctness, measured frame rate and long-duration stability remain unqualified.", "The runtime currently retains maximum valid shared CX/MX and bus votes to avoid lowering inherited consumers. IFPC/ACD, runtime power transitions, thermal policy, GPU reset recovery, per-client SMMU spaces and persistent shader-cache export are not implemented. Run 78 user counters show 518 successful GPU scanout handoffs and zero failed ones.", "Firmware comes from a backup base vendor partition without OTA COW overlays. Equality with the active slot is unverified. Run 78 startup and GPU presentation counters are observed, while controlled shader correctness remains untested; no partition was written.", "The PKX110 GPU firmware files, hashes and active speed bin have not been captured. The A830 power sequence, SMMU ownership, submission ABI and Turnip/Metal integration have no 13T host or hardware qualification."]
next_action = ["Paused at the user's request. Preserve the main-3 result and resume investigation only on a new instruction; the VSYNC zero readings and missing frame-stage measurements remain open."]
evidence = [
  { kind = "device", reference = "STAGE6.md", command = "User report after authorized main-3 temporary boot; no new device operation", revision = "d7dbaa020d64f730737e7b78ee61bec81aef2cc5", result = "The user confirms main-3 desktop startup, correct colors and readable diagnostics, with a slight subjective improvement over Run91. All reported VSYNC readings are zero. No complete FR/DISP/CMD values or measured new FPS were supplied, so the zero-counter cause and limiting frame stage remain unresolved. Further fixes, builds and device operations are paused at the user's request; 120 FPS and physical 120 Hz are unverified." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot -s 3B15BB01BAT00000 boot out/oneplus13t/boot/metal-main-3/boot.img", revision = "d7dbaa020d64f730737e7b78ee61bec81aef2cc5", result = "The user authorized the main-3 device test. Its 100409344-byte image SHA-256 292ea3ca0fdab1d3c71e6e5fd39e5fce22130afcc27fa17d9bd23c5fd1202cbd and the sun bootloader target were rechecked. Windows fastboot Sending/Booting returned OKAY in 3.026 seconds without flashing. Desktop, color, FR/VSYNC/DISP/CMD and performance observations are pending; transport success is not GPU qualification." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41316345393", command = "Actions main Metal run 3; check-native-metal-heap-host.py; compiled symbols/OPP and paired Android/FAT image readback", revision = "d7dbaa020d64f730737e7b78ee61bec81aef2cc5", result = "Main Metal run 3 (41316345393, d7dbaa0) passed production userspace/Data staging and actual macOS Metal heap, QoS, diagnostics, scanout-pixel and completion-protocol checks, reusing run 2's identical new kernel/base Data. The final local image passes paired kernel/Data/trust/UEFI and Android/FAT readback. New-image device performance is untested. Actual kernel SHA-256 e286ea49dfd3b97fa1d84abd2f788af3ce04ba70db2de9f3afbd7ffe1a3572a5, strong runtime symbols and the compiled 525 MHz OPP selection pass. A830 does not enable the upstream A740 two-ring preemption path; sustained 120 FPS remains unverified." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41234063029", command = "Actions Run91; check-native-metal-heap-host.py; compiled OPP/QoS checks; paired Android/FAT image readback", revision = "5b11f858b3799648708778bf81d6772cc98d66be", result = "Run91 passed full kernel/Metal production builds and actual host heap, QoS, diagnostics and scanout-pixel checks. The local boot image passes matching kernel/Data/trust/UEFI and Android/FAT readback. No phone operation was performed; 525 MHz, sustained FPS and thermal behavior await device testing. Actual kernel instructions contain the 525000001 stock-OPP comparison, and the iOS plugin imports both QoS functions. Host completion callbacks use user-interactive QoS; stage/allocation records appear only when diagnostics are enabled." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41229571660", command = "Actions Run90; check-native-metal-heap-host.py; boot image Android/FAT readback", revision = "878a7e38d2d0d358bea20d78c4c38a8f2efe869d", result = "Run90 passed production iOS Metal builds and real macOS/MoltenVK heap and scanout pixel checks. The local 100380672-byte boot.img (SHA-256 91cc316ac1edcf151643bf21cda08872b8244caa80a7351a61cbaafd4090f0d4) combines compute-band preservation with the device-confirmed SYSMEM color workaround. Matching Run86 kernel, Data UUID, trust, UEFI and final Android/FAT readback pass. New-image device logs and animation performance remain pending." },
  { kind = "host", reference = "STAGE6.md", command = "ASAN_OPTIONS=detect_leaks=0 python3 scripts/check-gmu.py; check-adreno-a830.py; test-stage7.py", revision = "cdd273d72a1e3a08f118e1fb69b39ed18c3bc929", result = "Run 79 user observation confirms UI startup, 222 MHz requested, hardware busy while sliding, at most about 15 FPS and no smoother scrolling; last GPU handoff/CPU copy/overlay times are 72.2/339.1/27.1 ms. Run 80 source reuses up to six task mappings, enables the existing Metal import cache, negotiates a preserved diagnostic band across GPU/CPU paths and redraws at 4 Hz. Mapping reuse and latest nonzero method/status are visible. Host regressions pass; production build and speedup are pending." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot -s 3B15BB01BAT00000 boot out/oneplus13t/boot/metal-run-79/boot.img", revision = "8bd34b4b1f352a83fe21fcf72bf686e229b28f6b", result = "After the user reconnected fastboot and explicitly requested testing, the Run 79 image hash and sun/bootloader identity were verified. Windows fastboot boot returned Sending OKAY (2.297 s) and Booting OKAY (0.338 s), total 3.001 s, without flashing. Log: out/oneplus13t/boot/metal-run-79/fastboot-boot-20261031-203720.log. Run 79 UI startup, CLK/DISP/API readings and performance await user observation." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41196229588", command = "xnu.yml; python3 /tmp/pagani-package-run79.py", revision = "8bd34b4b1f352a83fe21fcf72bf686e229b28f6b", result = "Run 79 (41196229588, source 8bd34b4) passed cloud regressions, XNU/A830 build and prelink, Metal/Turnip, signing and Data installation in 21m41s. Downloaded kernel SHA-256 matches the final build log. New diagnostic formats and the strong presenter timing symbol are present. The local 100499456-byte out/oneplus13t/boot/metal-run-79/boot.img passes same-build Data UUID, trust, known GFX UEFI, Android v4 and FAT/file/argument readback. The user requested no phone operation; Run 79 performance and activity readings remain untested." },
  { kind = "device", reference = "STAGE6.md", command = "Run 78 user-transcribed overlay after temporary fastboot boot", revision = "b8942ef6e3c1f0e9cbbed7b54fe785fc0c6dd82e", result = "Run 78 user observation confirms UI startup, GPU Metal registered rc=0, submissions/completions 1039/1039, no poisoned jobs and GPU presentation 518/0. Scrolling was visually in the teens of FPS. The old timeout counter includes zero-timeout fence poll misses; snapshot busy means diagnostic lock contention. Error e00002c7 is Unsupported, with the triggering method not yet identified." },
  { kind = "host", reference = "STAGE6.md", command = "Verify Run 78 boot.img; fastboot getvar product/is-userspace; fastboot -s 3B15BB01BAT00000 boot out/oneplus13t/boot/metal-run-78/boot.img", revision = "b8942ef6e3c1f0e9cbbed7b54fe785fc0c6dd82e", result = "After the user connected fastboot and requested testing, the Run 78 image hash was rechecked and the target was confirmed as sun in bootloader fastboot. Windows fastboot boot returned Sending OKAY (2.297 s) and Booting OKAY (0.339 s), total 3.010 s, without flashing. Log: out/oneplus13t/boot/metal-run-78/fastboot-boot-20261031-184620.log. Device startup, SMMU/GMU progress and GPU presentation remain pending user observation." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41166974317", command = "GitHub Actions xnu.yml Run 78; gh run download; local paired payload/boot packaging and executable-symbol, Data/trust, UEFI, boot-argument and Android/FAT readback checks", revision = "b8942ef6e3c1f0e9cbbed7b54fe785fc0c6dd82e", result = "Run 78 passed all cloud regressions, production XNU/A830 compilation and prelink, and Metal/Turnip build and Data staging. The downloaded kernel hash matches the cloud result. Local out/oneplus13t/boot/metal-run-78/boot.img is 100495360 bytes with SHA-256 d6a3858561769553943822ae8d57deab0003d9419e2e82dc78bb931170455d4e. New SMMU/presenter/close-hook and diagnostic entries are executable strong symbols; Data UUID 4C02592E-3207-4785-967B-D8D1C5314E1B, original and owner trust, tested GFX UEFI, GPU-presenter boot argument and Android/FAT content readback pass. No phone operation was performed; device GPU startup, presentation and performance remain unverified." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot boot out/oneplus13t/boot/metal-run-76/boot.img; user transcribed GPU/P/GMU/DISP rows", revision = "dc3b0501d74a6286ba13aebf5c5ea34dfd16869c", result = "Power stage 7 completed; GPU SMMU returns -1 before GMU startup, Metal is unpublished. Last power offset 0x71010 value 0x08000003; display copy 253 ms / 12530 KiB." },
  { kind = "host", reference = "STAGE6.md", command = "python3 /tmp/pagani-package-run76.py; fastboot -s 3B15BB01BAT00000 boot out/oneplus13t/boot/metal-run-76/boot.img", revision = "dc3b0501d74a6286ba13aebf5c5ea34dfd16869c", result = "After renewed user authorization, the paired Run 76 image passes executable GPU symbols, Data UUID, original/owner trust, tested GFX UEFI and Android/FAT readback. Boot image SHA-256 a249b0c90b9a3d8270f1de96ce1681bb39cb59a03d33d1c59c553cb3dff9683e. The target is sun in bootloader fastboot; Sending and Booting returned OKAY in 2.984 seconds without flashing. New GPU/P/GMU or M/CMD/API readings are pending; successful DEMET progression and GPU execution are unverified." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41116080103", command = "GitHub Actions xnu.yml Run 76; gh run download; local kernel SHA-256, arm64 Mach-O, executable-symbol and paired Data UUID checks", revision = "dc3b0501d74a6286ba13aebf5c5ea34dfd16869c", result = "Run 76 passed branch HALT/FSM regressions, all existing host contracts, full XNU/A830 kernel/prelink and Metal builds. Artifacts are downloaded to out/oneplus13t/actions/metal-run-76/. The 128344064-byte arm64 kernel SHA-256 54fab07ecaa0b23ba6baf61419e1a449247c00651e0fbc4e5708f1b4e9b2e26d matches the cloud log; power/start/diagnostic entries are executable strong symbols and Data UUID 2459A7A6-B0FE-4CF3-992A-8CDF16E7A155 matches. At the user request work stops after download: no boot image or phone operation; runtime and unchanged CPU display performance remain unverified." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot boot out/oneplus13t/boot/metal-run-75/boot.img; user transcribed GPU/P/GMU/DISP rows", revision = "05bd77332e0a87d9b82f72e947e581a090e482b5", result = "Run 75 passed GPUCC +0x9008 and stopped at +0x9010 with -110 and 0x08000000. Metal is unpublished; GMU fields are zero; CPU copy remains 386.4 ms / 12540 KiB." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41110329224", command = "GitHub Actions xnu.yml Run 75; local paired payload/boot packaging and binary readback; fastboot boot", revision = "05bd77332e0a87d9b82f72e947e581a090e482b5", result = "Run 75 includes the vendor-aligned branch write/delay/skip sequence and preserves the power error code. Cloud power regressions, full kernel/prelink and Metal builds passed. The paired boot image passes downloaded-kernel identity, executable GPU symbols, Data UUID, owner/original trust, tested GFX UEFI and Android/FAT readback. Windows fastboot accepted temporary boot in 3.042 seconds without flashing. Advancement beyond GPUCC +0x9008 and GMU/Metal startup remain pending new device readings; CPU presentation is unchanged." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot boot out/oneplus13t/boot/metal-run-74/boot.img; user observed system startup and GPU information", revision = "5d3412df08c78cd513ab0ad3c3f7edbf5842bbed", result = "Boot image SHA-256 fc5e815a54c9a1bbd51610e463481cfe52bd782867ca39215909c43942301e91. Run 74 user feedback confirms system startup and visible GPU information after the recorded temporary boot. The exact GPU/M/CMD/API/DISP values and their changes during interaction have not been recorded; GPU execution and low-frame-rate improvement remain unverified." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41102040521", command = "GitHub Actions xnu.yml Run 74; local paired payload/boot packaging and binary readback; fastboot boot", revision = "5d3412df08c78cd513ab0ad3c3f7edbf5842bbed", result = "Run 74 passed all cloud contracts, the production early-console object checks, full kernel/prelink and Metal userspace builds. The paired image passes executable GPU diagnostics symbols, Data UUID, owner/original trust, tested GFX UEFI and Android/FAT readback. Windows fastboot accepted the temporary boot in 3.227 seconds without flashing. Visible GPU rows and actual rendering remain pending user observation." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot boot out/oneplus13t/boot/metal-run-69/boot.img; user observed system startup and approximate display update rate", revision = "823a2fa2ea91a31f97d3a9c6be0c792ea745c543", result = "The user reported normal Run 69 system startup with roughly one visible frame update per second. This boot bypassed the previous whole-SMEM-copy panic. GPU startup, Metal rendering and measured frame rate were not captured; no partition was flashed." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41079321476", command = "Actions build 69; llvm-nm -m and objdump; unixnu payload/bootimg; Android/FAT readback; fastboot boot", revision = "823a2fa2ea91a31f97d3a9c6be0c792ea745c543", result = "Run 69 (41079321476, source bundle commit 823a2fa) passed A830/GMU contracts, XNU compile/prelink, Turnip/Metal builds, signing and Data staging. The actual kernel contains both direct Sm8750SocInfoGpuCode calls. The paired Data UUID is C6D2F70B-11E9-4A89-908C-C2C9B5711DF1; all three owner CDHashes and both unchanged original trust modules passed readback. The 100491264-byte metal-run-69/boot.img embeds the tested complete-GFX UEFI and matching 192 MiB FAT payload; SHA-256 df36c514399f6a9e0a71f94443013318e60f188dd5873dfd916bf51b09353ba0. Windows fastboot Sending/Booting returned OKAY in 3.044s without flashing. The user confirmed normal system startup with roughly one visible frame update per second. The previous SMEM panic was bypassed on this boot; GPU initialization and Metal rendering remain unverified." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot boot out/oneplus13t/boot/metal-run-68/boot.img; user photograph and FAR/X8 transcription", revision = "c8a18da6a70b944ea35619da2113d118f00cbb82", result = "With the complete GFX UEFI mapping, Run 68 reached GPU board inputs and then panicked at pagani_gpu_start+0x288: PC 0xfffffff00bfd9e58, ESR 0x96000010, FAR 0xfffffff9b9737000. The faulting ldrb copies the SMEM window at offset 0x9e000 (physical 0x81d9e000). The source now reads only global-partition metadata and socinfo through volatile accesses, retains two-read ID/SKU validation, and removes both whole-SMEM copies. Cached/uncached protected-gap tests and the existing GMU host suite pass. A rebuilt kernel and device retest remain pending; GPU power, command submission and Metal rendering are unverified." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40658468400", command = "Actions build 68; XNU prelink; Turnip and Metal build; codesign; Data staging; local unixnu payload and bootimg; Android/FAT readback", revision = "c8a18da6a70b944ea35619da2113d118f00cbb82", result = "All cloud stages passed. Local out/oneplus13t/boot/metal-run-68/boot.img is 100491264 bytes, SHA-256 9d607f44fcf661692d2d115057dcc0aaf8650a81fc4a315764cd78f77b4f4893. The 192 MiB embedded payload, executable GPU symbols, paired Data UUID, three owner CDHashes and unchanged original trust modules passed checks. Baseline configuration is unchanged. No phone boot or flash." },
  { kind = "source", reference = "package/PaganiGpu.cpp", result = "Board startup connects power, SMMU, GMU, ZAP and Gen8 command state before guarded GPU/Metal publication; hardware execution is unverified." },
  { kind = "source", reference = "scripts/test-metal-profile.py", result = "Local profile/dependency checks passed, including exact selection of the modified Stage7Probe and unchanged CPU baseline. Source checkout rejects a mismatched commit." },
  { kind = "source", reference = "scripts/build-gmu.py", result = "Local SM8750 GPU helper archive build with object ABI and member checks; no complete kernel or Metal linkage. Reproduction and host-test scope are recorded in README.md." },
  { kind = "source", reference = "scripts/data/sm8750-gpu-inputs.json", result = "Pinned GMU/SQE/AQE/ZAP inputs from the backup base vendor partition, with active-slot match explicitly unverified." },
  { kind = "source", reference = "https://github.com/OnePlusOSS/android_kernel_oneplus_sm8750/blob/745702d5ed2c0435f2b1d3bb78bc4f48422d4191/drivers/clk/qcom/gpucc-sun.c", result = "SM8750 GPUCC register offsets, separate GX power domain and SMMU clock dependency; used as hardware facts for the read-only probe." },
  { kind = "source", reference = "README.md", result = "Source-connected A830 board runtime, isolated profile and Metal staging recipe. README separates passed helper, production build and image checks from pending device execution." },
  { kind = "source", reference = "https://github.com/RigoLigoRLC/unixnu-adreno6xx/tree/bdb86b85e5320c19db395669c5a3a91ea6a2d93d", result = "SM7325 A6xx fork separates generation-specific power, GMU and SMMU operations and requires firmware replies and a memory write before GPU service publication. No A6xx register sequence is reused on A830." },
  { kind = "source", reference = "https://github.com/zg7681/NativeAdreno-myron/tree/26220f1ab79fec643517336fbd81574bd1e0d05a", result = "Reviewed bounded GMU MMIO transport and A740 board inputs. This is not an A830 implementation." },
  { kind = "source", reference = "https://github.com/ShueiTsuki/UniXNU/tree/b881ac7dc1695ce676c856873051a487c6a9f963", result = "The inspected fork points GPU/Metal submodules at UniXNU NativeAdreno/NativeMetal. No SM8750 backend was found in this tree." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot boot out/oneplus13t/boot/stage7-gpu-resources/boot.img; user observed UI and touch", revision = "830e21446dd45a1b8c0c7b350221ce60e87c2379", result = "The resource-only candidate reached the system UI with normal basic touch. Its GPU nodes remain disabled and were omitted from ADT, so this test provides no GPU power-up or rendering evidence. The DTS changes were committed after this test." },
  { kind = "source", reference = "proprietary-files.txt", result = "The recorded Android runtime DTB hash identifies the source for the disabled GPU/GMU/GPUCC/SMMU resource nodes and board chip ID." },
  { kind = "source", reference = "https://github.com/jjpprrrr/android_device_oneplus_sm8750-common/blob/l23.2/proprietary-files.txt", result = "Related SM8750 stock firmware list supplies candidate Gen8 filenames; The later local backup extraction supplies PKX110 candidate pins; active-slot equality remains unverified." },
  {"kind" = "host", "reference" = ".ci-inputs/a830-diagnostics-sources.tar.gz", "command" = "package-metal-ci.py create --sources-only; source payload audit; console/GMU/A830 regressions", "revision" = "b8942ef6e3c1f0e9cbbed7b54fe785fc0c6dd82e", "result" = "168710 bytes, 7 repos / 55 entries, SHA-256 9ff57ae0e49d7277864cd6bea4e87751d6c2a3c49fe7b50c032cdc09f441f674; contains source and tests only, no firmware, DTB, keys or binary patches. Reuses the previously authorized encrypted Run 69 inputs. Full build pending."},
  {"kind" = "source", "reference" = "https://github.com/jjpprrrr/android_device_oneplus_sm8750-common/blob/l23.2/proprietary-files.txt", "result" = "Related SM8750 stock firmware list supplies candidate Gen8 filenames; PKX110 firmware is not pinned."},

  { kind = "host", reference = "STAGE6.md", command = "Actions build 51; ./unixnu payload; ./unixnu bootimg; APFS/FAT readback", revision = "9d9726f53038aa5d090dd13502064de9b4c94128", result = "Build 51 reused the unchanged UEFI and passed Android v4, empty ramdisk and embedded FD/FAT checks. The verified image was temporarily booted without flashing a partition." },
  { kind = "host", reference = "STAGE6.md", command = "Actions build 50; ./unixnu payload; ./unixnu bootimg; APFS/FAT readback", revision = "1e98cc4c10c86904d7cafc6cb98dc4a29538628d", result = "Build 50 reused the unchanged UEFI and passed Android v4, empty ramdisk, embedded FD/FAT and stock DTB packaging checks. fastboot boot returned OKAY without flashing a partition; this is not a runtime qualification." },

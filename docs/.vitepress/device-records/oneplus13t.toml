[[area]]
id = "display"
status = "device-verified"
components = ["NativeMobileDisplay", "PaganiPanel"]
paths = ["scripts/test-stage7.py", "scripts/prepare-boot-logo.py", "package/PaganiPeripherals.h"]
inputs = ["Firmware GOP: 1216x2640, 32 bpp, stride 4864. The active AA594_P_7_A0020 command-mode panel uses DSI0 at 0xae94000 and low-byte-first DCS brightness; normal max 0xdbb, initial level 0x599."]
configuration = ["Native Legacy CPU framebuffer, sheng-vsync=60 and pagani-panel=1. Board constants are in PaganiPeripherals.h."]
procedure = ["Run test-stage7.py and test-peripherals.py against the resolved tree; run build-pagani-peripherals.py --audit-only against the pinned kernelcache, then build the full display archive with XNU compiler records. After a separately authorized temporary boot, verify first brightness completion before testing slider and power transitions."]
findings = ["The user confirms main-3 desktop startup, correct colors and readable diagnostics, with a slight subjective improvement over Run91. All reported VSYNC readings are zero. No complete FR/DISP/CMD values or measured new FPS were supplied, so the zero-counter cause and limiting frame stage remain unresolved. Further fixes, builds and device operations are paused at the user's request; 120 FPS and physical 120 Hz are unverified.", "The user authorized the main-3 device test. Its 100409344-byte image SHA-256 292ea3ca0fdab1d3c71e6e5fd39e5fce22130afcc27fa17d9bd23c5fd1202cbd and the sun bootloader target were rechecked. Windows fastboot Sending/Booting returned OKAY in 3.026 seconds without flashing. Desktop, color, FR/VSYNC/DISP/CMD and performance observations are pending; transport success is not GPU qualification.", "Main Metal run 3 (41316345393, d7dbaa0) passed production userspace/Data staging and actual macOS Metal heap, QoS, diagnostics, scanout-pixel and completion-protocol checks, reusing run 2's identical new kernel/base Data. The final local image passes paired kernel/Data/trust/UEFI and Android/FAT readback. New-image device performance is untested. Actual frontend pixel tests preserve the diagnostic band and row padding. FR stage timings and observed software VSYNC are present; the inherited physical panel mode has no refresh-switch implementation in the current driver.", "Current oneplus13t UEFI selects SimpleFbDxe (USE_CUSTOM_DISPLAY_DRIVER=0); its sole mode and no-op SetMode preserve inherited timing. NativeLegacyDisplay publishes software refresh attributes and timer events, while PaganiPanel provides brightness/power without a refresh switch. Physical 120 Hz still needs DSI/TE evidence; Run91 handoff 20.1 ms exceeds the 8.33 ms frame budget and is being split into measured stages.", "Synced UniXNU main 6790e7c (merge 888876f), Adreno740 a9a2cbb and AdrenoMetal 831a9dc while retaining iPadOS 17 and Gen8 boundaries. The candidate suppresses steady-frame progress traffic, adds compatible completion timings and observed software VSYNC counters, and keeps stock 525 MHz/SYSMEM. Local protocol, ownership, timing/status, console and cadence checks pass; production build and device bottleneck measurements are pending. See STAGE6.md.", "At the user's explicit test request, Run91 image hash was rechecked and Windows fastboot accepted temporary boot on sun in 3.275 s (Sending 2.293 s, Booting 0.337 s), without flashing. Log: out/oneplus13t/boot/metal-run-91/fastboot-boot-20261101-204948.log. The user confirms desktop startup and correct colors: req=525 MHz, busy=0, active SP unknown/6, G=40 fps/20.1 ms, C=0.0/259.4, O=0.2 at 4 Hz. CMD submitted/completed=4547/4547, bad=0, P=2099/0; API current m=7 err=0, retained E=6/e00002d6. Requested clock and one busy sample do not establish actual clock or bottleneck; panel timing and thermal stability remain unmeasured.", "Run91 passed full kernel/Metal production builds and actual host heap, QoS, diagnostics and scanout-pixel checks. The local boot image passes matching kernel/Data/trust/UEFI and Android/FAT readback. No phone operation was performed; 525 MHz, sustained FPS and thermal behavior await device testing. BGRA and linear/encoded half-float pixels, preserved diagnostic bands and padding pass on the macOS host. Software 120 Hz pacing does not qualify physical panel refresh or 120 FPS.", "The actual display timer and fixed refresh attributes pass 60/120 Hz host checks, including notification cadence and teardown. This test-only follow-up does not change the Run91 production snapshot or establish physical panel refresh.", "Run 90 user confirms correct colors and readable logs: 389 MHz requested, 28-40 GPU presentations/s, no CPU fallback, three reused scanout mappings. Next candidate integrates upstream diagnostic gating, iOS runtime QoS and SYSMEM non-lazy allocations, requests stock 525 MHz with matched voltage/bandwidth, and uses 120 Hz software pacing. Panel timing and achieved FPS remain unverified; build/download only, no phone operation.", "Run90 passed production iOS Metal builds and real macOS/MoltenVK heap and scanout pixel checks. The local 100380672-byte boot.img (SHA-256 91cc316ac1edcf151643bf21cda08872b8244caa80a7351a61cbaafd4090f0d4) combines compute-band preservation with the device-confirmed SYSMEM color workaround. Matching Run86 kernel, Data UUID, trust, UEFI and final Android/FAT readback pass. New-image device logs and animation performance remain pending.", "Warm interaction feedback: repeated control-center transitions no longer stall severely, while app open/close animations remain around 20 FPS by user observation. Logs are still unreadable on the Run88 control; the remaining bottleneck is not yet measured.", "Run88 SYSMEM-only control restored normal colors on device. User estimates 30-60 FPS during smooth interaction, with control-center/cold-launch stalls and unreadable logs still present. The candidate profile now selects sysmem,nocb until A830 GMEM correctness is qualified; Run90 combines this runtime flag with the compute-band fix.", "Both opaque BGRA and half-float compute scanout now exclude the diagnostic band. Actual pixel tests include middle/full-frame bands and padded pitches; macOS execution is pending.", "Run88 user observation: UI is usable and markedly smoother, reported about 60 FPS, but colors flicker and fixed diagnostic letters disappear while changing digits remain. CLK/DISP/CMD values are unreadable. Source inspection found opaque/half-float GPU compute scanout bypassed the preserved diagnostic band; the source now dispatches visible row spans and adds pixel/padding checks for empty, middle and full bands. macOS validation and a rebuilt candidate are pending. Color-flicker root cause remains unconfirmed.", "The next candidate follows upstream GPU parity with matching Adreno740/Metal/SMMU/GOP and runtime pins while preserving iPadOS 17 and prior buffer/overlay fixes. It replaces the 512 MiB BO pool with system pages, integrates per-process A830 SQE/AQE mappings, requests the original 389 MHz OPP with matched voltage/bandwidth, and reports the verified six-SP topology to Metal. Active SP count and stable 60 FPS remain unverified; production build is pending.", "The follow-up for stable 60 FPS removes the remaining full-band 4 Hz write from the synchronous display path: after overlay negotiation only changed glyphs are rasterized and written; first paint and legacy clients keep full writes. Actual-code ASan/UBSan checks preserve unchanged-cell sentinels and verify changed glyphs, odd pitch, bounds and panic. Device O time and frame pacing remain unmeasured.", "The 60 FPS target is unverified. Comparison with current upstream and zeta retains existing TLB/audit and 16384-object fixes, adds the missing Metal heap alias bridge and elapsed-time-bounded shared submit backpressure, and keeps cache maintenance and completion ordering. Actual submit regression and old-code control pass; real heap bridge tests are wired into macOS CI. See STAGE6.md for references and limits.", "Run 79 user observation confirms UI startup, 222 MHz requested, hardware busy while sliding, at most about 15 FPS and no smoother scrolling; last GPU handoff/CPU copy/overlay times are 72.2/339.1/27.1 ms. Run 80 source reuses up to six task mappings, enables the existing Metal import cache, negotiates a preserved diagnostic band across GPU/CPU paths and redraws at 4 Hz. Mapping reuse and latest nonzero method/status are visible. Host regressions pass; production build and speedup are pending.", "After the user reconnected fastboot and explicitly requested testing, the Run 79 image hash and sun/bootloader identity were verified. Windows fastboot boot returned Sending OKAY (2.297 s) and Booting OKAY (0.338 s), total 3.001 s, without flashing. Log: out/oneplus13t/boot/metal-run-79/fastboot-boot-20261031-203720.log. Run 79 UI startup, CLK/DISP/API readings and performance await user observation.", "Run 79 (41196229588, source 8bd34b4) passed cloud regressions, XNU/A830 build and prelink, Metal/Turnip, signing and Data installation in 21m41s. Downloaded kernel SHA-256 matches the final build log. New diagnostic formats and the strong presenter timing symbol are present. The local 100499456-byte out/oneplus13t/boot/metal-run-79/boot.img passes same-build Data UUID, trust, known GFX UEFI, Android v4 and FAT/file/argument readback. The user requested no phone operation; Run 79 performance and activity readings remain untested.", "Run 78 user observation confirms UI startup, GPU Metal registered rc=0, submissions/completions 1039/1039, no poisoned jobs and GPU presentation 518/0. Scrolling was visually in the teens of FPS. The old timeout counter includes zero-timeout fence poll misses; snapshot busy means diagnostic lock contention. Error e00002c7 is Unsupported, with the triggering method not yet identified.", "The next candidate retains cached Metal snapshots, pairs core method/status, labels fence poll misses, samples/rasterizes status at 4 Hz and copies cached pixels per frame. It reports requested GPU MHz, guarded Gen8 hardware busy, unknown active SP count out of 6 configured SPs, and separate GPU/CPU rates plus handoff/copy/overlay timing. Host regressions and Run 79 production build/image checks pass; hardware performance remains pending.", "After the user connected fastboot and requested testing, the Run 78 image hash was rechecked and the target was confirmed as sun in bootloader fastboot. Windows fastboot boot returned Sending OKAY (2.297 s) and Booting OKAY (0.339 s), total 3.010 s, without flashing. Log: out/oneplus13t/boot/metal-run-78/fastboot-boot-20261031-184620.log. Device startup, SMMU/GMU progress and GPU presentation remain pending user observation.", "Run 78 passed all cloud regressions, production XNU/A830 compilation and prelink, and Metal/Turnip build and Data staging. The downloaded kernel hash matches the cloud result. Local out/oneplus13t/boot/metal-run-78/boot.img is 100495360 bytes with SHA-256 d6a3858561769553943822ae8d57deab0003d9419e2e82dc78bb931170455d4e. New SMMU/presenter/close-hook and diagnostic entries are executable strong symbols; Data UUID 4C02592E-3207-4785-967B-D8D1C5314E1B, original and owner trust, tested GFX UEFI, GPU-presenter boot argument and Android/FAT content readback pass. No phone operation was performed; device GPU startup, presentation and performance remain unverified.", "The enhanced candidate follows the pinned OnePlus bank policy (GPU 0/1 reserved, GMU from 2), selects invalid SMMU slots without disturbing live routes, removes optional contiguous searches for ordinary BOs, and connects the existing GPU scanout presenter only after GPU self-tests. Presenter ownership/close fallback and SMMU/allocator regressions pass on software peers; Run 78 full build and local image checks pass; hardware results are pending.", "Run 76 device feedback reached GPU SMMU with rc=ffffffff, power step=7 window=0 offset=71010 value=08000003, Metal unpublished and GMU fields zero; CPU display copy was 253 ms / 12530 KiB. The branch-clock sequence completed, but the generic SMMU failure does not identify its branch. The diagnostic candidate preserves exact return codes, preflight register snapshots and existing GMU/GPU context reports; ACTLR 0x32b matches the captured DTB. Software tests retain layout/busy-bank/ACTLR/I/O refusal and verify no MMIO from status rendering. Hardware SMMU correction awaits specific readings.", "After renewed user authorization, the paired Run 76 image passes executable GPU symbols, Data UUID, original/owner trust, tested GFX UEFI and Android/FAT readback. Boot image SHA-256 a249b0c90b9a3d8270f1de96ce1681bb39cb59a03d33d1c59c553cb3dff9683e. The target is sun in bootloader fastboot; Sending and Booting returned OKAY in 2.984 seconds without flashing. New GPU/P/GMU or M/CMD/API readings are pending; successful DEMET progression and GPU execution are unverified.", "Run 76 passed branch HALT/FSM regressions, all existing host contracts, full XNU/A830 kernel/prelink and Metal builds. Artifacts are downloaded to out/oneplus13t/actions/metal-run-76/. The 128344064-byte arm64 kernel SHA-256 54fab07ecaa0b23ba6baf61419e1a449247c00651e0fbc4e5708f1b4e9b2e26d matches the cloud log; power/start/diagnostic entries are executable strong symbols and Data UUID 2459A7A6-B0FE-4CF3-992A-8CDF16E7A155 matches. At the user request work stops after download: no boot image or phone operation; runtime and unchanged CPU display performance remain unverified.", "Run 75 device readings advanced past critical CXO to GPUCC +0x9010 (DEMET): power rc=ffffff92 (-110), value=08000000, Metal unpublished, GMU fields zero; DISP 386.4 ms / 12540 KiB. Vendor branch2 accepts CLK_OFF clear or NoC FSM ON without enable-bit readback. The corrected common branch poll passes reported-value and NoC-ON regressions while rejecting real halted states, with all 81 read and 38 write failure points and five bounded stalls passing. New device validation is pending.", "Run 75 includes the vendor-aligned branch write/delay/skip sequence and preserves the power error code. Cloud power regressions, full kernel/prelink and Metal builds passed. The paired boot image passes downloaded-kernel identity, executable GPU symbols, Data UUID, owner/original trust, tested GFX UEFI and Android/FAT readback. Windows fastboot accepted temporary boot in 3.042 seconds without flashing. Advancement beyond GPUCC +0x9008 and GMU/Metal startup remain pending new device readings; CPU presentation is unchanged.", "Run 74 user reports about 2 CPU copies per second while swiping, with the last copy taking 386.3 ms for 12540 KiB. This is CPU presentation telemetry, not GPU-rendered FPS. The power-sequence candidate does not change the display path.", "Run 74 user feedback confirms system startup and visible GPU information after the recorded temporary boot. The exact GPU/M/CMD/API/DISP values and their changes during interaction have not been recorded; GPU execution and low-frame-rate improvement remain unverified.", "Run 74 passed all cloud contracts, the production early-console object checks, full kernel/prelink and Metal userspace builds. The paired image passes executable GPU diagnostics symbols, Data UUID, owner/original trust, tested GFX UEFI and Android/FAT readback. Windows fastboot accepted the temporary boot in 3.227 seconds without flashing. Visible GPU rows and actual rendering remain pending user observation.", "Run 73 passed all host contracts but the production console object still depended on bzero: XNU MakeInc.def enables -ftrivial-auto-var-init=zero. The GPU string buffer now uses explicit volatile byte clearing with a per-variable uninitialized attribute, retaining full initialization without a runtime helper. The object regression now uses the XNU automatic-initialization flag; it reproduces the prior failure and passes the correction, as do console ASan/UBSan checks. Production runtime-helper checks remain enabled.", "Run 71 compiled the A830 board but the early-console object check rejected compiler-generated bzero from whole-array initialization. Initializing only each string first byte removes that dependency. The actual console object regression detects the old memset dependency and passes after the fix; ASan/UBSan and display tests pass. Production runtime-helper and FP/SIMD checks are retained.", "The platform overlay adds successful CPU display-copy rate, last copy duration and byte count. These are copy measurements, not panel refresh or GPU rendering FPS. The real console regression covers active/idle rate, row bounds, stale-field clearing and panic freeze with ASan/UBSan.", "PaganiPanel derives from the genuine original AppleARMBacklight class with qualified 0x370 storage and 169 virtual entries. It sends DCS 0x51/0x28/0x29 through the command FIFO and stops after a transport failure. The controller setup, DSC and panel timing stay as handed off by firmware.", "The 60 Hz software presentation timer pauses for logical display-off and resumes with a fresh deadline. Build 48 passed MMIO/timer tests, original and compiled-object ABI checks, full kernel link and prelink. PaganiPanel symbols are present in the downloaded kernel; Build-48 hardware testing reached the UI, but brightness and power-key control did not respond before a UFS timeout panic. Physical display control remains unverified.", "Build-49 feedback still reports unusable brightness and short power-key control. Build 50 retains panel map/start failures, DSI command results and accepted brightness requests on screen, with a count of successful DSI commands. The complete display archive and compiled ABI checks passed; physical control awaits runtime feedback.", "Build 50 shows the lock screen. The user confirmed short power presses switch the screen off/on and a long press opens the shutdown UI. PANEL reports DSI disabled (e00002d8); physical brightness remains unqualified. This iteration only changes the placement of diagnostic rows to clear the camera cutout.", "The next diagnostic candidate adds two retained SPI rows after KEYS/TOUCH/PANEL, below the camera. Host framebuffer bounds, overlay gating and panic-protection tests pass; no panel programming changes.", "Build 52 reached input object compilation but the early-console dependency check rejected a compiler-generated bzero from the five-row stack snapshot. The renderer now copies one 80-byte row at a time. ARM64 automatic-initialization reproduction and host display/panic checks pass; build 53 subsequently passed the full production object and final kernel build.", "DMA failures reuse the existing two diagnostic rows; SMMU refusal shows slot/bank and SMR/S2CR. The console uses the same per-row stack copy and retains panic/display boundaries. Local sanitizer checks pass.", "Build 54 passed the actual early-console runtime checks, diagnostic-row/panic regressions and compiled backlight ABI checks. DMA/SMMU diagnostic strings are present in the final kernel; brightness remains deferred.", "The first successful touch read now populates the existing two diagnostic rows even if a later protocol check fails. The number and placement of rows remain unchanged. Host console and panic-freeze checks pass.", "Build 55 passed early-console runtime and diagnostic-row/panic checks plus original/compiled backlight ABI checks. The final kernel contains both first-success SPI formats in the existing rows. Brightness remains deferred.", "Build-55 user-transcribed SPI RX and SPI dma rows confirm that the retained success snapshot is visible alongside TOUCH. This is diagnostic-overlay evidence only; brightness remains deferred.", "The existing two SPI diagnostic rows now retain the delay register or an RPMh failure snapshot. No rows are added; display-boundary and panic-preservation tests pass. Panel brightness work remains deferred.", "Build 56 passed display object/ABI and early-console checks with the new power/timing diagnostics in the existing rows. The downloaded binary contains both PWR formats and the SPI dly field; panel hardware and brightness remain unqualified.", "Build 56 was temporarily booted after image readback. The new SPI delay or PWR diagnostic rows await user observation; this does not establish system-UI entry, brightness or panel behavior.", "On build 56, bottom-up and top-down swipes do not move the lock screen; the power menu opens via the physical key, but its Cancel button does not respond to touch. The static SPI rows intentionally retain the first successful read. Brightness remains deferred.", "The HID edge band uses 48 pixels normalized against the actual unrotated console dimensions. Existing rendering and panic precedence are preserved; hardware coordinate calibration is pending.", "Build 57 compiled the console-derived 48-pixel edge band and passed overlay bounds/panic regressions. Coordinates, edge calibration and UI reception remain untested on hardware.", "The build-57 image passed ADT identity, embedded-payload integrity and peripheral-argument checks, then was accepted for temporary boot. Display state, event coordinates and edge calibration await observation.", "The user reports working touch after build 57. This adds basic interactive feedback to the existing CPU display path; it does not qualify brightness, full-screen coordinate calibration or display timing.", "Build 59 passes production display object/ABI checks and retains CPU framebuffer presentation with the 60 Hz software timer. UI performance and frame presentation under the eight-core candidate remain untested.", "Fastboot accepted the build-59 temporary launch with the existing CPU presentation path. Reaching the system UI and its performance under SMP await user feedback.", "The build-59 user photograph confirms the panic renderer works on secondary affinity 0x200. System UI and sustained presentation under SMP are not qualified.", "Build 60 passes existing production display/ABI checks. The actual panic renderer displays all eight trace addresses without clipping at 1216x2640 with full stage history and fault fields in the host ASan/UBSan check. System UI under SMP remains unqualified.", "The build-60 temporary launch was accepted with the existing CPU presentation path and expanded panic trace. System UI, stability and displayed trace values await user observation.", "Build 62 passes existing display, console and original/compiled ABI checks. This build has not been booted; sustained UI behavior under eight-core scheduling remains unqualified.", "Fastboot accepted the build-62 temporary launch with the existing CPU framebuffer path. System UI behavior and sustained interaction under eight-core scheduling await observation.", "The user confirmed build-62 slot 345, object 0xfffffff9e67f9000, caller 0xfffffff00578c1cc. Original code calls this boolean TimingEnable query after a five-second swap wait timeout. A deterministic test reproduces lost handoff on console contention; the fix waits for the bounded writer and exits immediately on panic. The qualified query reports logical display state. Actual hardware contention was not captured and other timeout causes remain possible; full compilation and runtime validation are pending.", "Build 63 passes the original boolean call-site checks and compiled 358-slot vtable checks. The actual final vtable slot 345 points to isTimingEnabled and the old opaque345 guard is absent. The compiled handoff includes its contention retry. These checks do not establish that the hardware swap timeout is resolved; this build has not been booted.", "The verified build-63 image includes the logical slot-345 query and console-contention handoff retry. Fastboot accepted its temporary launch. Resolution of the prior swap timeout and sustained UI interaction await hardware observation.", "The user confirmed entry into the system after the build-63 display handoff and timing-query fixes. The prior display panic did not prevent this observed startup. This does not isolate contention as its sole cause or establish long-term swap reliability, physical vblank timing or brightness behavior.", "Follow-up to the 60 FPS target: negotiated overlay rows now write only changed glyphs at 4 Hz. First paint and legacy clients retain full writes. The actual console regression checks unchanged-cell sentinels, changed glyphs, odd pitch, bounds and panic; ASan/UBSan and Stage7 checks pass. All previously prepared mapping, heap and submit changes are retained; phone frame pacing is still pending.", "Run 80 source-only candidate follows Run 79 user-observed 15 FPS and 27.1 ms overlay cost: reuse six task mappings, preserve the diagnostic band at 4 Hz, retain nonzero method/status and map hits, forward Metal heap alias operations, and use elapsed-time-bounded shared queue backpressure. Local lifecycle, overlay and submit positive/negative regressions pass; production and real heap bridge checks run in macOS CI. Stable 60 FPS remains the hardware target.", "The next candidate retains cached Metal snapshots, pairs core method/status, labels fence poll misses, samples/rasterizes status at 4 Hz and copies cached pixels per frame. It reports requested GPU MHz, guarded Gen8 hardware busy, unknown active SP count out of 6 configured SPs, and separate GPU/CPU rates plus handoff/copy/overlay timing. Host regressions pass; full build and performance remain pending.", "The enhanced source-only candidate follows the pinned OnePlus GPU/GMU context-bank policy, selects invalid SMMU slots while preserving live firmware routes, removes optional contiguous searches for ordinary BOs, and connects the GPU presenter after self-tests with ownership and close/error fallback. Host SMMU, presenter, fragmented allocation, GPU context mismatch, GMU/HFI and power regressions pass; cloud build and local image assembly pending; no device operation authorized for this overnight candidate."]
completion = ["A known frame appears with correct geometry and colors, then userland presentation and backlight controls work."]
limits = ["The DSI brightness/blanking command path has not passed hardware testing. Physical refresh measurement, TE/vblank synchronization, high-refresh switching, brightness calibration, fade interpolation and full panel suspend/resume remain incomplete. CoreBrightness property access and coexistence with firmware scanout remain unverified."]
next_action = ["Paused at the user's request. Preserve the main-3 result and resume investigation only on a new instruction; the VSYNC zero readings and missing frame-stage measurements remain open."]
evidence = [
  { kind = "device", reference = "STAGE6.md", command = "User report after authorized main-3 temporary boot; no new device operation", revision = "d7dbaa020d64f730737e7b78ee61bec81aef2cc5", result = "The user confirms main-3 desktop startup, correct colors and readable diagnostics, with a slight subjective improvement over Run91. All reported VSYNC readings are zero. No complete FR/DISP/CMD values or measured new FPS were supplied, so the zero-counter cause and limiting frame stage remain unresolved. Further fixes, builds and device operations are paused at the user's request; 120 FPS and physical 120 Hz are unverified." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot -s 3B15BB01BAT00000 boot out/oneplus13t/boot/metal-main-3/boot.img", revision = "d7dbaa020d64f730737e7b78ee61bec81aef2cc5", result = "The user authorized the main-3 device test. Its 100409344-byte image SHA-256 292ea3ca0fdab1d3c71e6e5fd39e5fce22130afcc27fa17d9bd23c5fd1202cbd and the sun bootloader target were rechecked. Windows fastboot Sending/Booting returned OKAY in 3.026 seconds without flashing. Desktop, color, FR/VSYNC/DISP/CMD and performance observations are pending; transport success is not GPU qualification." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41316345393", command = "Actions main Metal run 3; check-native-metal-heap-host.py; compiled symbols/OPP and paired Android/FAT image readback", revision = "d7dbaa020d64f730737e7b78ee61bec81aef2cc5", result = "Main Metal run 3 (41316345393, d7dbaa0) passed production userspace/Data staging and actual macOS Metal heap, QoS, diagnostics, scanout-pixel and completion-protocol checks, reusing run 2's identical new kernel/base Data. The final local image passes paired kernel/Data/trust/UEFI and Android/FAT readback. New-image device performance is untested. Actual frontend pixel tests preserve the diagnostic band and row padding. FR stage timings and observed software VSYNC are present; the inherited physical panel mode has no refresh-switch implementation in the current driver." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41234063029", command = "Actions Run91; check-native-metal-heap-host.py; compiled OPP/QoS checks; paired Android/FAT image readback", revision = "5b11f858b3799648708778bf81d6772cc98d66be", result = "Run91 passed full kernel/Metal production builds and actual host heap, QoS, diagnostics and scanout-pixel checks. The local boot image passes matching kernel/Data/trust/UEFI and Android/FAT readback. No phone operation was performed; 525 MHz, sustained FPS and thermal behavior await device testing. BGRA and linear/encoded half-float pixels, preserved diagnostic bands and padding pass on the macOS host. Software 120 Hz pacing does not qualify physical panel refresh or 120 FPS." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41229571660", command = "Actions Run90; check-native-metal-heap-host.py; boot image Android/FAT readback", revision = "878a7e38d2d0d358bea20d78c4c38a8f2efe869d", result = "Run90 passed production iOS Metal builds and real macOS/MoltenVK heap and scanout pixel checks. The local 100380672-byte boot.img (SHA-256 91cc316ac1edcf151643bf21cda08872b8244caa80a7351a61cbaafd4090f0d4) combines compute-band preservation with the device-confirmed SYSMEM color workaround. Matching Run86 kernel, Data UUID, trust, UEFI and final Android/FAT readback pass. New-image device logs and animation performance remain pending." },
  { kind = "host", reference = "STAGE6.md", command = "ASAN_OPTIONS=detect_leaks=0 python3 scripts/check-gmu.py; check-adreno-a830.py; test-stage7.py", revision = "cdd273d72a1e3a08f118e1fb69b39ed18c3bc929", result = "Run 79 user observation confirms UI startup, 222 MHz requested, hardware busy while sliding, at most about 15 FPS and no smoother scrolling; last GPU handoff/CPU copy/overlay times are 72.2/339.1/27.1 ms. Run 80 source reuses up to six task mappings, enables the existing Metal import cache, negotiates a preserved diagnostic band across GPU/CPU paths and redraws at 4 Hz. Mapping reuse and latest nonzero method/status are visible. Host regressions pass; production build and speedup are pending." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot -s 3B15BB01BAT00000 boot out/oneplus13t/boot/metal-run-79/boot.img", revision = "8bd34b4b1f352a83fe21fcf72bf686e229b28f6b", result = "After the user reconnected fastboot and explicitly requested testing, the Run 79 image hash and sun/bootloader identity were verified. Windows fastboot boot returned Sending OKAY (2.297 s) and Booting OKAY (0.338 s), total 3.001 s, without flashing. Log: out/oneplus13t/boot/metal-run-79/fastboot-boot-20261031-203720.log. Run 79 UI startup, CLK/DISP/API readings and performance await user observation." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41196229588", command = "xnu.yml; python3 /tmp/pagani-package-run79.py", revision = "8bd34b4b1f352a83fe21fcf72bf686e229b28f6b", result = "Run 79 (41196229588, source 8bd34b4) passed cloud regressions, XNU/A830 build and prelink, Metal/Turnip, signing and Data installation in 21m41s. Downloaded kernel SHA-256 matches the final build log. New diagnostic formats and the strong presenter timing symbol are present. The local 100499456-byte out/oneplus13t/boot/metal-run-79/boot.img passes same-build Data UUID, trust, known GFX UEFI, Android v4 and FAT/file/argument readback. The user requested no phone operation; Run 79 performance and activity readings remain untested." },
  { kind = "device", reference = "STAGE6.md", command = "Run 78 user-transcribed overlay after temporary fastboot boot", revision = "b8942ef6e3c1f0e9cbbed7b54fe785fc0c6dd82e", result = "Run 78 user observation confirms UI startup, GPU Metal registered rc=0, submissions/completions 1039/1039, no poisoned jobs and GPU presentation 518/0. Scrolling was visually in the teens of FPS. The old timeout counter includes zero-timeout fence poll misses; snapshot busy means diagnostic lock contention. Error e00002c7 is Unsupported, with the triggering method not yet identified." },
  { kind = "host", reference = "STAGE6.md", command = "Verify Run 78 boot.img; fastboot getvar product/is-userspace; fastboot -s 3B15BB01BAT00000 boot out/oneplus13t/boot/metal-run-78/boot.img", revision = "b8942ef6e3c1f0e9cbbed7b54fe785fc0c6dd82e", result = "After the user connected fastboot and requested testing, the Run 78 image hash was rechecked and the target was confirmed as sun in bootloader fastboot. Windows fastboot boot returned Sending OKAY (2.297 s) and Booting OKAY (0.339 s), total 3.010 s, without flashing. Log: out/oneplus13t/boot/metal-run-78/fastboot-boot-20261031-184620.log. Device startup, SMMU/GMU progress and GPU presentation remain pending user observation." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41166974317", command = "GitHub Actions xnu.yml Run 78; gh run download; local paired payload/boot packaging and executable-symbol, Data/trust, UEFI, boot-argument and Android/FAT readback checks", revision = "b8942ef6e3c1f0e9cbbed7b54fe785fc0c6dd82e", result = "Run 78 passed all cloud regressions, production XNU/A830 compilation and prelink, and Metal/Turnip build and Data staging. The downloaded kernel hash matches the cloud result. Local out/oneplus13t/boot/metal-run-78/boot.img is 100495360 bytes with SHA-256 d6a3858561769553943822ae8d57deab0003d9419e2e82dc78bb931170455d4e. New SMMU/presenter/close-hook and diagnostic entries are executable strong symbols; Data UUID 4C02592E-3207-4785-967B-D8D1C5314E1B, original and owner trust, tested GFX UEFI, GPU-presenter boot argument and Android/FAT content readback pass. No phone operation was performed; device GPU startup, presentation and performance remain unverified." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot boot out/oneplus13t/boot/metal-run-76/boot.img; user transcribed GPU/P/GMU/DISP rows", revision = "dc3b0501d74a6286ba13aebf5c5ea34dfd16869c", result = "Power stage 7 completed; GPU SMMU returns -1 before GMU startup, Metal is unpublished. Last power offset 0x71010 value 0x08000003; display copy 253 ms / 12530 KiB." },
  { kind = "host", reference = "STAGE6.md", command = "python3 /tmp/pagani-package-run76.py; fastboot -s 3B15BB01BAT00000 boot out/oneplus13t/boot/metal-run-76/boot.img", revision = "dc3b0501d74a6286ba13aebf5c5ea34dfd16869c", result = "After renewed user authorization, the paired Run 76 image passes executable GPU symbols, Data UUID, original/owner trust, tested GFX UEFI and Android/FAT readback. Boot image SHA-256 a249b0c90b9a3d8270f1de96ce1681bb39cb59a03d33d1c59c553cb3dff9683e. The target is sun in bootloader fastboot; Sending and Booting returned OKAY in 2.984 seconds without flashing. New GPU/P/GMU or M/CMD/API readings are pending; successful DEMET progression and GPU execution are unverified." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41116080103", command = "GitHub Actions xnu.yml Run 76; gh run download; local kernel SHA-256, arm64 Mach-O, executable-symbol and paired Data UUID checks", revision = "dc3b0501d74a6286ba13aebf5c5ea34dfd16869c", result = "Run 76 passed branch HALT/FSM regressions, all existing host contracts, full XNU/A830 kernel/prelink and Metal builds. Artifacts are downloaded to out/oneplus13t/actions/metal-run-76/. The 128344064-byte arm64 kernel SHA-256 54fab07ecaa0b23ba6baf61419e1a449247c00651e0fbc4e5708f1b4e9b2e26d matches the cloud log; power/start/diagnostic entries are executable strong symbols and Data UUID 2459A7A6-B0FE-4CF3-992A-8CDF16E7A155 matches. At the user request work stops after download: no boot image or phone operation; runtime and unchanged CPU display performance remain unverified." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot boot out/oneplus13t/boot/metal-run-75/boot.img; user transcribed GPU/P/GMU/DISP rows", revision = "05bd77332e0a87d9b82f72e947e581a090e482b5", result = "Run 75 passed GPUCC +0x9008 and stopped at +0x9010 with -110 and 0x08000000. Metal is unpublished; GMU fields are zero; CPU copy remains 386.4 ms / 12540 KiB." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41110329224", command = "GitHub Actions xnu.yml Run 75; local paired payload/boot packaging and binary readback; fastboot boot", revision = "05bd77332e0a87d9b82f72e947e581a090e482b5", result = "Run 75 includes the vendor-aligned branch write/delay/skip sequence and preserves the power error code. Cloud power regressions, full kernel/prelink and Metal builds passed. The paired boot image passes downloaded-kernel identity, executable GPU symbols, Data UUID, owner/original trust, tested GFX UEFI and Android/FAT readback. Windows fastboot accepted temporary boot in 3.042 seconds without flashing. Advancement beyond GPUCC +0x9008 and GMU/Metal startup remain pending new device readings; CPU presentation is unchanged." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot boot out/oneplus13t/boot/metal-run-74/boot.img; user observed system startup and GPU information", revision = "5d3412df08c78cd513ab0ad3c3f7edbf5842bbed", result = "Boot image SHA-256 fc5e815a54c9a1bbd51610e463481cfe52bd782867ca39215909c43942301e91. Run 74 user feedback confirms system startup and visible GPU information after the recorded temporary boot. The exact GPU/M/CMD/API/DISP values and their changes during interaction have not been recorded; GPU execution and low-frame-rate improvement remain unverified." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41102040521", command = "GitHub Actions xnu.yml Run 74; local paired payload/boot packaging and binary readback; fastboot boot", revision = "5d3412df08c78cd513ab0ad3c3f7edbf5842bbed", result = "Run 74 passed all cloud contracts, the production early-console object checks, full kernel/prelink and Metal userspace builds. The paired image passes executable GPU diagnostics symbols, Data UUID, owner/original trust, tested GFX UEFI and Android/FAT readback. Windows fastboot accepted the temporary boot in 3.227 seconds without flashing. Visible GPU rows and actual rendering remain pending user observation." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot boot stage7-run-63/boot.img; user-observed system, touch and CPU/RAM overlay", revision = "3c39bafed673ce1233f533e5b8193a1436d894a3", result = "The user confirmed entry into the system after the build-63 display handoff and timing-query fixes. The prior display panic did not prevent this observed startup. This does not isolate contention as its sole cause or establish long-term swap reliability, physical vblank timing or brightness behavior." },
  { kind = "host", reference = "STAGE6.md", command = "./unixnu payload; ./unixnu bootimg; Android/FAT/ADT readback; fastboot boot", revision = "3c39bafed673ce1233f533e5b8193a1436d894a3", result = "The verified build-63 image includes the logical slot-345 query and console-contention handoff retry. Fastboot accepted its temporary launch. Resolution of the prior swap timeout and sustained UI interaction await hardware observation." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40520726310", command = "Actions build 63; download; actual display-vtable, Clutch-policy and paired Data checks", revision = "3c39bafed673ce1233f533e5b8193a1436d894a3", result = "Build 63 passes the original boolean call-site checks and compiled 358-slot vtable checks. The actual final vtable slot 345 points to isTimingEnabled and the old opaque345 guard is absent. The compiled handoff includes its contention retry. These checks do not establish that the hardware swap timeout is resolved; this build has not been booted." },
  { kind = "host", reference = "STAGE6.md", command = "ASan/UBSan console and display regressions; exact original slot-345 ABI checks", revision = "14f50fce9778a8bb19ec6b0b7dc199863526c996", result = "The user confirmed build-62 slot 345, object 0xfffffff9e67f9000, caller 0xfffffff00578c1cc. Original code calls this boolean TimingEnable query after a five-second swap wait timeout. A deterministic test reproduces lost handoff on console contention; the fix waits for the bounded writer and exits immediately on panic. The qualified query reports logical display state. Actual hardware contention was not captured and other timeout causes remain possible; full compilation and runtime validation are pending." },
  { kind = "host", reference = "STAGE6.md", command = "./unixnu payload; ./unixnu bootimg; Android/FAT/ADT readback; fastboot boot", revision = "c87bced3d8fba74f11c9f91ed6494fb741f29f90", result = "Fastboot accepted the build-62 temporary launch with the existing CPU framebuffer path. System UI behavior and sustained interaction under eight-core scheduling await observation." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40505777459", command = "Actions build 62; download; source-pin, linked Clutch policy and paired Data verification", revision = "c87bced3d8fba74f11c9f91ed6494fb741f29f90", result = "Build 62 passes existing display, console and original/compiled ABI checks. This build has not been booted; sustained UI behavior under eight-core scheduling remains unqualified." },
  { kind = "host", reference = "STAGE6.md", command = "./unixnu payload; ./unixnu bootimg; Android/FAT/ADT readback; fastboot boot", revision = "faa6aa2cbd8d0a005f85cb2ad6749c769df6e586", result = "The build-60 temporary launch was accepted with the existing CPU presentation path and expanded panic trace. System UI, stability and displayed trace values await user observation." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40499765573", command = "Actions build 60; download; source-pin, panic-format and paired Data verification", revision = "faa6aa2cbd8d0a005f85cb2ad6749c769df6e586", result = "Build 60 passes existing production display/ABI checks. The actual panic renderer displays all eight trace addresses without clipping at 1216x2640 with full stage history and fault fields in the host ASan/UBSan check. System UI under SMP remains unqualified." },
  { kind = "device", reference = "STAGE6.md", command = "Build-59 temporary boot; user panic photograph and matching-kernel symbol lookup", revision = "859dbce9a793d194f48399633353073df1dc880f", result = "The build-59 user photograph confirms the panic renderer works on secondary affinity 0x200. System UI and sustained presentation under SMP are not qualified." },

  { kind = "host", reference = "STAGE6.md", command = "./unixnu payload; ./unixnu bootimg; Android/FAT/ADT readback; fastboot boot", revision = "859dbce9a793d194f48399633353073df1dc880f", result = "The matching build-59 boot image passed local assembly/readback, including eight actual ADT CPU affinities and all SMP arguments. Fastboot accepted the user-authorized temporary launch in 2.680s without flashing. System startup and CPU/RAM observations await feedback." },

findings = ["Progress is preserved on device main. The d7dbaa0 seven-repository source snapshot matches all current shared-source diffs and additions byte for byte. The five remaining UEFI source/documentation changes are archived as .ci-inputs/uefi-pagani-progress.patch against 50b7313f40684aa25481cd109d7f48b9a50663fa, with exact apply/tree/reverse checks. Device records are committed directly. Existing CI inputs are unchanged; no new build or phone operation was performed.", "The 2026-10-30 Run 68 retries exposed CPRDxe faults at offsets 0x5FD0 and 0x6054, then ClockDxe+0x100A8 with FAR 0x5080. DAL/HWIO registers GFX 0x03D00000/1 MiB; partial GPUCC/CPR/SMMU resource HOBs made that whole-region registration fail and left the ClockDxe GPUCC base unset. The board now exposes one complete GFX Device MMIO region. Host regression, UEFI build and final-image readback pass. Fastboot accepted this image in 2.964s without flashing, and the user confirmed UEFI completed and XNU started. XNU then panicked while copying SMEM for GPU board inputs.", "The local GPU probe candidate rebuilds UEFI with a complete Device MMIO GFX aperture at 0x3d00000/0x100000, covering GPUCC, CPR and GPU SMMU without partial resource-HOB conflicts. Its standalone EFI application is built through the DSC and staged only in the dedicated payload; normal XNU boot does not call it. Firmware build passed; its Run 68 boot failure and CPR-map correction are recorded above.", "PKX110 ABL uses init_boot ramdisk during fastboot boot; embedded payload plus the BootPayload HOB remains necessary.", "UniXNURamDiskDxe, DiskIoDxe and FAT support the standard FDT handoff; the rebuilt FD contains both paths.", "Build 54 reused the unchanged UEFI and passed complete embedded-payload readback. The same-build kernel, trust cache and RAM Data were temporarily booted without flashing.", "Build 55 reused the unchanged UEFI and passed Android v4, empty ramdisk and embedded FD/FAT checks. Actual kernel, trust cache and volatile Data match this build. Sending and Booting returned OKAY without flashing a partition.", "Android regulator state reports pm_humu_l4 enabled at 1.8 V for spi0.0-vdd and pm_humu_l16 enabled at 3.1 V for spi0.0-vcc. This is a software power-state baseline, not a physical voltage measurement or evidence that the rails remain enabled under XNU. The read-only capture used the existing debugfs mount and changed no firmware or device configuration.", "Android command DB confirms ldob4 at 0x40800 and ldob16 at 0x41900. The candidate now explicitly enables those touch rails through apps DRV-2 before reset, while retaining GENI microcode. The firmware image is unchanged; no flash or temporary boot is authorized in this build round.", "Build 56 is downloaded with its matching inputs. Firmware and the build-55 boot image remain unchanged; no build-56 boot image, temporary boot or flash was performed.", "The build-56 Android v4 image embeds the unchanged UEFI and a 160 MiB payload containing the matching kernel, trust cache and RAM Data. Local readback passed; fastboot accepted the user-authorized temporary boot without flashing a partition.", "Build 56 reaches valid TouchComm v1 identification and parsed touch reports through retained GENI microcode and SE DMA. The first header is a5 10 1c 00 and the captured SPI delay register is 0xc800; no firmware image or partition was flashed.", "The HID candidate retains build-56 GENI firmware, SE DMA, touch power and SPI timing. No firmware change, image assembly or device boot is part of this build round.", "Build 57 is downloaded with matching inputs; no boot image was assembled, no firmware changed and no device boot or flash was performed. The existing build-56 boot configuration is preserved.", "The build-57 Android v4 image embeds the unchanged 3 MiB UEFI and a 160 MiB FAT with the matching kernel, trust cache and RAM Data. Local readback passed and fastboot accepted the temporary boot; no partition was flashed.", "The build-59 Android v4 image embeds the unchanged 3 MiB UEFI and a 160 MiB payload with the matching kernel, trust cache and RAM Data. Local readback passed and fastboot accepted temporary launch; no firmware or partition was flashed.", "The build-60 Android v4 image embeds the unchanged 3 MiB UEFI plus 160 MiB payload containing the matching kernel, trust cache and RAM Data. Local readback passed and fastboot accepted temporary launch; no firmware or partition was flashed.", "The build-62 Android v4 image embeds the unchanged 3 MiB UEFI plus a 160 MiB FAT with the matching kernel, trust cache and RAM Data. Readback passed and fastboot accepted temporary launch; no firmware or partition was flashed.", "The build-63 Android v4 image embeds the unchanged 3 MiB UEFI and a 160 MiB FAT containing the matching kernel, trust cache and RAM Data. Readback passed and fastboot accepted temporary launch; no firmware or partition was flashed.", "The user-confirmed build-63 system startup verifies the existing embedded-payload boot route with the recorded unchanged 3 MiB UEFI and matching payload. The standard initrd route was not separately exercised and no partition was flashed."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["Build 48 reached the UI through the existing embedded-payload path. The standard initrd driver was not separately exercised."]
next_action = ["Retain this verified embedded-payload baseline; collect UEFI allocation evidence before enlarging the XNU memory window."]

  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41116080103", command = "GitHub Actions xnu.yml Run 76; gh run download; local kernel SHA-256, arm64 Mach-O, executable-symbol and paired Data UUID checks", revision = "dc3b0501d74a6286ba13aebf5c5ea34dfd16869c", result = "Run 76 passed branch HALT/FSM regressions, all existing host contracts, full XNU/A830 kernel/prelink and Metal builds. Artifacts are downloaded to out/oneplus13t/actions/metal-run-76/. The 128344064-byte arm64 kernel SHA-256 54fab07ecaa0b23ba6baf61419e1a449247c00651e0fbc4e5708f1b4e9b2e26d matches the cloud log; power/start/diagnostic entries are executable strong symbols and Data UUID 2459A7A6-B0FE-4CF3-992A-8CDF16E7A155 matches. At the user request work stops after download: no boot image or phone operation; runtime and unchanged CPU display performance remain unverified." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot boot out/oneplus13t/boot/metal-run-75/boot.img; user transcribed GPU/P/GMU/DISP rows", revision = "05bd77332e0a87d9b82f72e947e581a090e482b5", result = "Run 75 passed GPUCC +0x9008 and stopped at +0x9010 with -110 and 0x08000000. Metal is unpublished; GMU fields are zero; CPU copy remains 386.4 ms / 12540 KiB." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41110329224", command = "GitHub Actions xnu.yml Run 75; local paired payload/boot packaging and binary readback; fastboot boot", revision = "05bd77332e0a87d9b82f72e947e581a090e482b5", result = "Run 75 includes the vendor-aligned branch write/delay/skip sequence and preserves the power error code. Cloud power regressions, full kernel/prelink and Metal builds passed. The paired boot image passes downloaded-kernel identity, executable GPU symbols, Data UUID, owner/original trust, tested GFX UEFI and Android/FAT readback. Windows fastboot accepted temporary boot in 3.042 seconds without flashing. Advancement beyond GPUCC +0x9008 and GMU/Metal startup remain pending new device readings; CPU presentation is unchanged." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot boot out/oneplus13t/boot/metal-run-74/boot.img; user observed system startup and GPU information", revision = "5d3412df08c78cd513ab0ad3c3f7edbf5842bbed", result = "Boot image SHA-256 fc5e815a54c9a1bbd51610e463481cfe52bd782867ca39215909c43942301e91. Run 74 user feedback confirms system startup and visible GPU information after the recorded temporary boot. The exact GPU/M/CMD/API/DISP values and their changes during interaction have not been recorded; GPU execution and low-frame-rate improvement remain unverified." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41102040521", command = "GitHub Actions xnu.yml Run 74; local paired payload/boot packaging and binary readback; fastboot boot", revision = "5d3412df08c78cd513ab0ad3c3f7edbf5842bbed", result = "Run 74 passed all cloud contracts, the production early-console object checks, full kernel/prelink and Metal userspace builds. The paired image passes executable GPU diagnostics symbols, Data UUID, owner/original trust, tested GFX UEFI and Android/FAT readback. Windows fastboot accepted the temporary boot in 3.227 seconds without flashing. Visible GPU rows and actual rendering remain pending user observation." },

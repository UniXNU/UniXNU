configuration = ["kernel.prelink roots preserve the previously qualified subset; payload.adt.root_match_volume_uuid=04769D26-2CA0-4825-B443-E2E5F88300F2."]
procedure = ["Run ipsw fetch, kernel, build package, firmware, payload, bootimg in order; inspect payload.json and the ADT in FAT."]
findings = ["Progress is preserved on device main. The d7dbaa0 seven-repository source snapshot matches all current shared-source diffs and additions byte for byte. The five remaining UEFI source/documentation changes are archived as .ci-inputs/uefi-pagani-progress.patch against 50b7313f40684aa25481cd109d7f48b9a50663fa, with exact apply/tree/reverse checks. Device records are committed directly. Existing CI inputs are unchanged; no new build or phone operation was performed.", "The user authorized the main-3 device test. Its 100409344-byte image SHA-256 292ea3ca0fdab1d3c71e6e5fd39e5fce22130afcc27fa17d9bd23c5fd1202cbd and the sun bootloader target were rechecked. Windows fastboot Sending/Booting returned OKAY in 3.026 seconds without flashing. Desktop, color, FR/VSYNC/DISP/CMD and performance observations are pending; transport success is not GPU qualification.", "Main Metal run 3 (41316345393, d7dbaa0) passed production userspace/Data staging and actual macOS Metal heap, QoS, diagnostics, scanout-pixel and completion-protocol checks, reusing run 2's identical new kernel/base Data. The final local image passes paired kernel/Data/trust/UEFI and Android/FAT readback. New-image device performance is untested. out/oneplus13t/boot/metal-main-3/boot.img is 100409344 bytes, SHA-256 292ea3ca0fdab1d3c71e6e5fd39e5fce22130afcc27fa17d9bd23c5fd1202cbd; Data UUID 6FC4EA70-B24F-44E4-8394-ABDAB0CDC877. Boot arguments retain 120 Hz software pacing, disabled expensive sampling and sysmem,nocb.", "Main run 2 (41312611105) passed full kernel/prelink and iOS Turnip/Metal/plugin signing. Data staging stopped because build-metal-userspace.py still passed the removed upstream --clients argument. The caller now uses the current --publish BASE OUTPUT interface. Reuse this exact kernel/base Data for the userspace retry; actual host Metal checks and final boot packaging are pending.", "Main workflow run 1 stopped at a macOS user-client host link: the fixture lacked native_adreno_now_us, which production NativeAdrenoPublish already defines. The test now uses its existing simulated clock and the full Clang/ASan/UBSan A830 checks pass. Production sources are unchanged; rerun the complete candidate build.", "Synced UniXNU main 6790e7c (merge 888876f), Adreno740 a9a2cbb and AdrenoMetal 831a9dc while retaining iPadOS 17 and Gen8 boundaries. The candidate suppresses steady-frame progress traffic, adds compatible completion timings and observed software VSYNC counters, and keeps stock 525 MHz/SYSMEM. Local protocol, ownership, timing/status, console and cadence checks pass; production build and device bottleneck measurements are pending. See STAGE6.md.", "At the user's explicit test request, Run91 image hash was rechecked and Windows fastboot accepted temporary boot on sun in 3.275 s (Sending 2.293 s, Booting 0.337 s), without flashing. Log: out/oneplus13t/boot/metal-run-91/fastboot-boot-20261101-204948.log. The user confirms desktop startup and correct colors: req=525 MHz, busy=0, active SP unknown/6, G=40 fps/20.1 ms, C=0.0/259.4, O=0.2 at 4 Hz. CMD submitted/completed=4547/4547, bad=0, P=2099/0; API current m=7 err=0, retained E=6/e00002d6. Requested clock and one busy sample do not establish actual clock or bottleneck; panel timing and thermal stability remain unmeasured.", "Run91 passed full kernel/Metal production builds and actual host heap, QoS, diagnostics and scanout-pixel checks. The local boot image passes matching kernel/Data/trust/UEFI and Android/FAT readback. No phone operation was performed; 525 MHz, sustained FPS and thermal behavior await device testing. out/oneplus13t/boot/metal-run-91/boot.img is 100392960 bytes, SHA-256 c05b470241545b7feb003426c1e236cab289edf02df9bff4d465961fa834588d; Data UUID is 40DDD231-F4AE-4443-818F-8085CB168DBE. Both branch histories remain reachable, and subsequent source changes and Metal dispatches use main.", "Merged all 33 Metal-branch-only commits with the three main-only commits, preserving both histories and all structured record lists. Existing CI inputs are identical to the already-published branch. A830 builds now dispatch metal.yml on main; xnu.yml retains the CPU baseline. The two branch tips are synchronized at the merge.", "Run 90 user confirms correct colors and readable logs: 389 MHz requested, 28-40 GPU presentations/s, no CPU fallback, three reused scanout mappings. Next candidate integrates upstream diagnostic gating, iOS runtime QoS and SYSMEM non-lazy allocations, requests stock 525 MHz with matched voltage/bandwidth, and uses 120 Hz software pacing. Panel timing and achieved FPS remain unverified; build/download only, no phone operation.", "Run90 was temporarily booted at 2026-11-01 03:02 Asia/Shanghai after the user returned the phone to Windows bootloader fastboot. Exact image hash and product sun/is-userspace=no matched. Sending/Booting returned OKAY in 2.971 seconds; no partition was flashed. Color, complete log text and app-animation counters await feedback.", "Run90 passed production iOS Metal builds and real macOS/MoltenVK heap and scanout pixel checks. The local 100380672-byte boot.img (SHA-256 91cc316ac1edcf151643bf21cda08872b8244caa80a7351a61cbaafd4090f0d4) combines compute-band preservation with the device-confirmed SYSMEM color workaround. Matching Run86 kernel, Data UUID, trust, UEFI and final Android/FAT readback pass. New-image device logs and animation performance remain pending.", "Run88 SYSMEM-only control restored normal colors on device. User estimates 30-60 FPS during smooth interaction, with control-center/cold-launch stalls and unreadable logs still present. The candidate profile now selects sysmem,nocb until A830 GMEM correctness is qualified; Run90 combines this runtime flag with the compute-band fix.", "User confirmed fastboot readiness; the exact Run88 SYSMEM control was temporarily booted at 2026-11-01 02:31 Asia/Shanghai. Sending/Booting returned OKAY in 2.946 seconds, without flashing. Color and interaction comparison await user observation.", "The pure-source follow-up rebuilds Metal with diagnostic-band preservation and a real host pixel regression, reusing the unchanged Run86 kernel. The local Run88 SYSMEM control differs only in sheng-tu-debug=sysmem,nocb; image readback passed.", "On 2026-11-01 02:09 Asia/Shanghai the user connected fastboot and requested testing. Run88 image hash was rechecked, target sun/bootloader identity matched, and Windows fastboot boot returned Sending OKAY (2.293 s), Booting OKAY (0.336 s), total 3.052 s without flashing. Log: out/oneplus13t/boot/metal-run-88/fastboot-boot-20261101-020921.log. Phone startup, requested clock, GPU counters and frame pacing await device observation.", "Final candidate out/oneplus13t/boot/metal-run-88/boot.img is 100376576 bytes, SHA-256 94e52bfec0fa7e82b7fee4f67ce8b8883ffe7011b09c10d552bbeffd52d215a9. Exact Run86 kernel, same-seed Data UUID E50A9074-8440-4F63-A08C-1E8A188CEFB9, signed plugin/owner/original trust, GFX UEFI, GPU symbols, Android v4 and FAT/argument readback pass. Run89 host heap recheck succeeded; no phone operation was performed.", "Run 88 boot.img is 100376576 bytes, SHA-256 94e52bfec0fa7e82b7fee4f67ce8b8883ffe7011b09c10d552bbeffd52d215a9. Exact Run86 kernel, Data UUID, owner/original trust, strong GPU/pmap/DCVS entries, GFX UEFI, Android v4 and FAT readback pass. Host heap recheck and device performance remain pending.", "Run 87 reused the exact Run 86 kernel/Data and built iOS Turnip plus the updated Metal bridge. Plugin compilation exposed an arm64e-only framebuffer helper whose definition lacked the caller guard; both now share that guard. Actual plugin/frontend/daemon syntax checks run before Rust LTO with the same build flags. A complete userspace build is pending.", "Run 86 completed XNU/A830 prelink. The next userspace-only build reuses its paired kernel/Data and verifies their UUID, while retaining the pinned original trust modules. All 12 Mesa patches apply and reverse exactly; the final backpressure patch preserves upstream submit timing. Local boot packaging is pending.", "Run 85 passed all macOS host contracts and driver compilation, then final kernel linking exposed absent upstream pmap/DCVS diagnostics. The candidate now provides the real read-only user-mapping walk for the selected non-PPL XNU and records the acknowledged board HFI level in native_gpu_dcvs[1], with governor-running flag zero. The actual pmap helper passes GCC and Clang ASan/UBSan checks for invalid, empty, kernel, IOMMU, single and chained user mappings, optional outputs and balanced locks. No mapping is removed. Run 86 production compile and prelink passed. Metal stopped at an overlapping Mesa patch; the rebased 12-patch sequence now applies and reverses to the pinned source, with submit-pressure/timing regressions passing.", "The next candidate follows upstream GPU parity with matching Adreno740/Metal/SMMU/GOP and runtime pins while preserving iPadOS 17 and prior buffer/overlay fixes. It replaces the 512 MiB BO pool with system pages, integrates per-process A830 SQE/AQE mappings, requests the original 389 MHz OPP with matched voltage/bandwidth, and reports the verified six-SP topology to Metal. Active SP count and stable 60 FPS remain unverified; production build is pending.", "The follow-up for stable 60 FPS removes the remaining full-band 4 Hz write from the synchronous display path: after overlay negotiation only changed glyphs are rasterized and written; first paint and legacy clients keep full writes. Actual-code ASan/UBSan checks preserve unchanged-cell sentinels and verify changed glyphs, odd pitch, bounds and panic. Device O time and frame pacing remain unmeasured.", "The 60 FPS target is unverified. Comparison with current upstream and zeta retains existing TLB/audit and 16384-object fixes, adds the missing Metal heap alias bridge and elapsed-time-bounded shared submit backpressure, and keeps cache maintenance and completion ordering. Actual submit regression and old-code control pass; real heap bridge tests are wired into macOS CI. See STAGE6.md for references and limits.", "Run 79 user observation confirms UI startup, 222 MHz requested, hardware busy while sliding, at most about 15 FPS and no smoother scrolling; last GPU handoff/CPU copy/overlay times are 72.2/339.1/27.1 ms. Run 80 source reuses up to six task mappings, enables the existing Metal import cache, negotiates a preserved diagnostic band across GPU/CPU paths and redraws at 4 Hz. Mapping reuse and latest nonzero method/status are visible. Host regressions pass; production build and speedup are pending.", "After the user reconnected fastboot and explicitly requested testing, the Run 79 image hash and sun/bootloader identity were verified. Windows fastboot boot returned Sending OKAY (2.297 s) and Booting OKAY (0.338 s), total 3.001 s, without flashing. Log: out/oneplus13t/boot/metal-run-79/fastboot-boot-20261031-203720.log. Run 79 UI startup, CLK/DISP/API readings and performance await user observation.", "Run 79 (41196229588, source 8bd34b4) passed cloud regressions, XNU/A830 build and prelink, Metal/Turnip, signing and Data installation in 21m41s. Downloaded kernel SHA-256 matches the final build log. New diagnostic formats and the strong presenter timing symbol are present. The local 100499456-byte out/oneplus13t/boot/metal-run-79/boot.img passes same-build Data UUID, trust, known GFX UEFI, Android v4 and FAT/file/argument readback. The user requested no phone operation; Run 79 performance and activity readings remain untested.", "Run 78 user observation confirms UI startup, GPU Metal registered rc=0, submissions/completions 1039/1039, no poisoned jobs and GPU presentation 518/0. Scrolling was visually in the teens of FPS. The old timeout counter includes zero-timeout fence poll misses; snapshot busy means diagnostic lock contention. Error e00002c7 is Unsupported, with the triggering method not yet identified.", "The next candidate retains cached Metal snapshots, pairs core method/status, labels fence poll misses, samples/rasterizes status at 4 Hz and copies cached pixels per frame. It reports requested GPU MHz, guarded Gen8 hardware busy, unknown active SP count out of 6 configured SPs, and separate GPU/CPU rates plus handoff/copy/overlay timing. Host regressions and Run 79 production build/image checks pass; hardware performance remains pending.", "After the user connected fastboot and requested testing, the Run 78 image hash was rechecked and the target was confirmed as sun in bootloader fastboot. Windows fastboot boot returned Sending OKAY (2.297 s) and Booting OKAY (0.339 s), total 3.010 s, without flashing. Log: out/oneplus13t/boot/metal-run-78/fastboot-boot-20261031-184620.log. Device startup, SMMU/GMU progress and GPU presentation remain pending user observation.", "Run 78 passed all cloud regressions, production XNU/A830 compilation and prelink, and Metal/Turnip build and Data staging. The downloaded kernel hash matches the cloud result. Local out/oneplus13t/boot/metal-run-78/boot.img is 100495360 bytes with SHA-256 d6a3858561769553943822ae8d57deab0003d9419e2e82dc78bb931170455d4e. New SMMU/presenter/close-hook and diagnostic entries are executable strong symbols; Data UUID 4C02592E-3207-4785-967B-D8D1C5314E1B, original and owner trust, tested GFX UEFI, GPU-presenter boot argument and Android/FAT content readback pass. No phone operation was performed; device GPU startup, presentation and performance remain unverified.", "The enhanced candidate follows the pinned OnePlus bank policy (GPU 0/1 reserved, GMU from 2), selects invalid SMMU slots without disturbing live routes, removes optional contiguous searches for ordinary BOs, and connects the existing GPU scanout presenter only after GPU self-tests. Presenter ownership/close fallback and SMMU/allocator regressions pass on software peers; Run 78 full build and local image checks pass; hardware results are pending.", "Run 76 device feedback reached GPU SMMU with rc=ffffffff, power step=7 window=0 offset=71010 value=08000003, Metal unpublished and GMU fields zero; CPU display copy was 253 ms / 12530 KiB. The branch-clock sequence completed, but the generic SMMU failure does not identify its branch. The diagnostic candidate preserves exact return codes, preflight register snapshots and existing GMU/GPU context reports; ACTLR 0x32b matches the captured DTB. Software tests retain layout/busy-bank/ACTLR/I/O refusal and verify no MMIO from status rendering. Hardware SMMU correction awaits specific readings.", "After renewed user authorization, the paired Run 76 image passes executable GPU symbols, Data UUID, original/owner trust, tested GFX UEFI and Android/FAT readback. Boot image SHA-256 a249b0c90b9a3d8270f1de96ce1681bb39cb59a03d33d1c59c553cb3dff9683e. The target is sun in bootloader fastboot; Sending and Booting returned OKAY in 2.984 seconds without flashing. New GPU/P/GMU or M/CMD/API readings are pending; successful DEMET progression and GPU execution are unverified.", "Run 76 passed branch HALT/FSM regressions, all existing host contracts, full XNU/A830 kernel/prelink and Metal builds. Artifacts are downloaded to out/oneplus13t/actions/metal-run-76/. The 128344064-byte arm64 kernel SHA-256 54fab07ecaa0b23ba6baf61419e1a449247c00651e0fbc4e5708f1b4e9b2e26d matches the cloud log; power/start/diagnostic entries are executable strong symbols and Data UUID 2459A7A6-B0FE-4CF3-992A-8CDF16E7A155 matches. At the user request work stops after download: no boot image or phone operation; runtime and unchanged CPU display performance remain unverified.", "Run 75 device readings advanced past critical CXO to GPUCC +0x9010 (DEMET): power rc=ffffff92 (-110), value=08000000, Metal unpublished, GMU fields zero; DISP 386.4 ms / 12540 KiB. Vendor branch2 accepts CLK_OFF clear or NoC FSM ON without enable-bit readback. The corrected common branch poll passes reported-value and NoC-ON regressions while rejecting real halted states, with all 81 read and 38 write failure points and five bounded stalls passing. New device validation is pending.", "Run 75 includes the vendor-aligned branch write/delay/skip sequence and preserves the power error code. Cloud power regressions, full kernel/prelink and Metal builds passed. The paired boot image passes downloaded-kernel identity, executable GPU symbols, Data UUID, owner/original trust, tested GFX UEFI and Android/FAT readback. Windows fastboot accepted temporary boot in 3.042 seconds without flashing. Advancement beyond GPUCC +0x9008 and GMU/Metal startup remain pending new device readings; CPU presentation is unchanged.", "Run 74 boot image fc5e815a54c9a1bbd51610e463481cfe52bd782867ca39215909c43942301e91 reaches the system and displays the GPU diagnostics. The observed power-stage failure is recorded in STAGE6.md. The next source-only candidate corrects the critical-clock sequence and preserves power error codes; its new image and device result are pending.", "Run 74 user feedback confirms system startup and visible GPU information after the recorded temporary boot. The exact GPU/M/CMD/API/DISP values and their changes during interaction have not been recorded; GPU execution and low-frame-rate improvement remain unverified.", "Run 74 passed all cloud contracts, the production early-console object checks, full kernel/prelink and Metal userspace builds. The paired image passes executable GPU diagnostics symbols, Data UUID, owner/original trust, tested GFX UEFI and Android/FAT readback. Windows fastboot accepted the temporary boot in 3.227 seconds without flashing. Visible GPU rows and actual rendering remain pending user observation.", "Run 73 passed all host contracts but the production console object still depended on bzero: XNU MakeInc.def enables -ftrivial-auto-var-init=zero. The GPU string buffer now uses explicit volatile byte clearing with a per-variable uninitialized attribute, retaining full initialization without a runtime helper. The object regression now uses the XNU automatic-initialization flag; it reproduces the prior failure and passes the correction, as do console ASan/UBSan checks. Production runtime-helper checks remain enabled.", "Run 72 stopped in the new host object check because macOS fortified stdio macros conflicted with kernel function declarations. The console fixture now undefines snprintf/vsnprintf macros after including stdio; a local macro reproduction fails before the correction and passes after it, and the actual object plus sanitizer checks pass. Production checks remain unchanged.", "Run 71 compiled the A830 board but the early-console object check rejected compiler-generated bzero from whole-array initialization. Initializing only each string first byte removes that dependency. The actual console object regression detects the old memset dependency and passes after the fix; ASan/UBSan and display tests pass. Production runtime-helper and FP/SIMD checks are retained.", "Run 70 exposed a stale BootProgress selection: only Stage7Probe/PaganiInput used the working driver checkout, so the board compiler could not see the new status interface. The isolated profile now explicitly selects BootProgress too. A resolver regression fails before this correction and passes after it. Metal builds now require successful kernel compilation; Run 70 is not a bootable result.", "The next source-only CI bundle includes the GPU status overlay and its actual-code snapshot/console regressions; firmware/DTB inputs are reused from the immutable Run 69 encrypted bundle. The Metal workflow now runs the BootProgress sanitizer test before production compilation; runtime diagnosis remains pending.", "Run 69 (41079321476, source bundle commit 823a2fa) passed A830/GMU contracts, XNU compile/prelink, Turnip/Metal builds, signing and Data staging. The actual kernel contains both direct Sm8750SocInfoGpuCode calls. The paired Data UUID is C6D2F70B-11E9-4A89-908C-C2C9B5711DF1; all three owner CDHashes and both unchanged original trust modules passed readback. The 100491264-byte metal-run-69/boot.img embeds the tested complete-GFX UEFI and matching 192 MiB FAT payload; SHA-256 df36c514399f6a9e0a71f94443013318e60f188dd5873dfd916bf51b09353ba0. Windows fastboot Sending/Booting returned OKAY in 3.044s without flashing. The user confirmed normal system startup with roughly one visible frame update per second. The previous SMEM panic was bypassed on this boot; GPU initialization and Metal rendering remain unverified.", "The isolated Metal CI input is an encrypted snapshot of seven source checkouts plus pinned private firmware. The 2026-10-30 SMEM fix bundle passed source-byte and encryption round-trip checks; Run 69 was dispatched from 823a2fa. Plaintext firmware and the decryption key remain outside Git.", "The complete-GFX retry at out/oneplus13t/boot/metal-run-68-gfx-map-20261030/boot.img is 100491264 bytes, SHA-256 8a1a6fb5a17da313475a02a90df81247042f15f1e7c6fab28b50c0dcd3f76154. Final-image readback confirms GFX 0x03D00000/0x100000 without partial overlapping mappings; BootShim, stock DTBs and the entire 192 MiB Run 68 FAT payload match the original byte-for-byte. Sending and Booting returned OKAY in 2.964s without flashing. The user confirmed UEFI handoff, followed by an XNU SMEM-read panic. This image still contains the original Run 68 kernel; the selective-SMEM source fix is not yet included.", "The local stage7-gpu-probe/boot.img is 87965696 bytes, SHA-256 e12cf997467d1c03a43888459a42a3f464979ec77ab3dd80eaa05e4465b86473. It contains rebuilt UEFI and the optional probe, plus byte-identical Build 63 kernel/trust/Data/ADT. Android v4 unpack verification and FAT readback pass. The menu waits for manual selection. No cloud build, push, flash or hardware boot was performed.", "Kernel ABI and IPSW stay at 21H461. NativePrelink stays pinned in the community bundle; the OS series selects its matching patches.", "Four byte-qualified userspace fixups now come from the shared OS profile and common validated-page implementation. Board root UUID and PackedRAMDisk/TrustCache placeholders are preserved.", "Android boot v4 packages gzip(BootShim+3 MiB FD+160 MiB FAT) followed by all stock DTBs; Android ramdisk remains empty.", "The build-48 kernel and matching trust/Data inputs are assembled at out/oneplus13t/boot/stage7-run-48/boot.img: 87945216 bytes, SHA-256 ed302c539495dcae18e21fefe0a424d4f09f2b5f480741dbd5b5f6f7ab44a9fe. The existing firmware was reused after confirming its source inputs and FD hash were unchanged. Image unpacking and FAT readback passed. The later temporary boot reached the UI, with nonfunctional peripheral controls and a subsequent UFS read-timeout panic; see STAGE6.md.", "Build 49 boot.img remains 87945216 bytes with SHA-256 5bceb7c3cac31cafde66d8b349c0fec547684aa16e7266645af544a7ae20564f. Its temporary boot succeeded and the user reported no repeat panic in this test. The next image must pair its new kernel, trust cache and pre-edited skip-Setup Data from one cloud build; the next image does not exist yet.", "Build-57 boot.img is 87957504 bytes, SHA-256 33ad1883076f25b944ccde4fd89776e28c9576589eb0cc6fb8e6df10aeee8b55, at out/oneplus13t/boot/stage7-run-57/boot.img. Android v4, empty ramdisk, unchanged UEFI and actual FAT kernel/trust/Data/ADT passed readback. Fastboot accepted the user-requested temporary boot without flashing; earlier images are retained.", "Build-59 kernel/kernel.macho is downloaded at out/oneplus13t/actions/run-59/ with 127803392 bytes and SHA-256 2f501babd1daf3a60700588d21b1ff90394d471fd82751158c726ebaf1033400. Its paired RAM Data UUID is 2B2FB879-4530-4537-8CBD-50692F3F0CA0. Source pins, packed/raw Data integrity and UUID embedding pass; no build-59 boot image has been assembled or booted.", "Build-59 boot.img is 87957504 bytes with SHA-256 a58808d933c713e5a32c068f36791d09d2917d2216c7b788250a5a8bafcca349 at out/oneplus13t/boot/stage7-run-59/boot.img. Android v4, unchanged UEFI, actual FAT inputs, eight-affinity ADT and boot arguments passed readback. Fastboot accepted the temporary launch in 2.680s without flashing a partition.", "The verified build-59 image was temporarily loaded successfully, then panicked in the kernel. The next image must use the diagnostic kernel and its matching trust/Data inputs; previous images are retained.", "Build-60 kernel/kernel.macho is downloaded at out/oneplus13t/actions/run-60/ with 127803392 bytes and SHA-256 422074400f8eff7b9be51dfec3e895a207f304deb678ba527dcaf23da2eeea35. Its paired RAM Data UUID is E81D6D67-C2F6-4CAC-9FF9-100EDFF76900. Source pins, selected diagnostic patch, actual panic strings, packed/raw Data integrity and UUID embedding pass; no build-60 boot image was assembled or booted.", "Build-60 boot.img is 87957504 bytes with SHA-256 fddce67146aca4ce607975264689f3cac014f712f7409c00d5f4de923315b4bf at out/oneplus13t/boot/stage7-run-60/boot.img. Android v4, unchanged UEFI, FAT inputs, eight-affinity ADT and same-build kernel/trust/Data checks pass. Fastboot Sending/Booting returned OKAY in 2.659s without flashing.", "Build-62 kernel/kernel.macho is downloaded at out/oneplus13t/actions/run-62/ with 127803392 bytes and SHA-256 671d5cc0c9b60b594b481914d3a5874d88e78ebac906834e78577618cfe6629e. Paired RAM Data UUID is 9E72E6D9-AC74-428E-A275-E8A25FD3264C. Source pins, actual Clutch policy, panic strings, packed/raw Data integrity and UUID embedding pass. No build-62 boot image was assembled or booted.", "Build-62 boot.img is 87957504 bytes with SHA-256 d15c0f5fca06ad13047e653aeaa778b1d3b5c6610448113143d5aa6ab7f1bd2b at out/oneplus13t/boot/stage7-run-62/boot.img. Android v4, unchanged UEFI, actual FAT inputs, eight-affinity ADT and boot arguments passed readback. Fastboot accepted the temporary launch in 2.671s without flashing a partition.", "The verified build-62 temporary boot subsequently panicked at display slot 345. No replacement image has been assembled or booted; its kernel, trust cache and RAM Data remain the current local packaging inputs, and earlier images are retained.", "Build-63 kernel/kernel.macho is downloaded at out/oneplus13t/actions/run-63/ with 127803392 bytes and SHA-256 076c87c95bf3a1496722f4bddf7538b4be336cc80908e4ef3a15eeb4b0f64540. Paired RAM Data UUID is 1726EAC0-2168-4118-AFD6-19E12FE306E7. Source pins, actual display vtable, Clutch policy, packed/raw Data integrity and UUID embedding pass. No build-63 boot image was assembled or booted.", "Build-63 boot.img is 87957504 bytes with SHA-256 af6090c46e4b56a5d83d201273a2bb67466bd13457c44921a3d9e56cd7b41149 at out/oneplus13t/boot/stage7-run-63/boot.img. Android v4, unchanged UEFI, actual FAT inputs, eight-affinity ADT and boot arguments passed readback. Fastboot accepted temporary launch in 2.791s without flashing a partition.", "The user-confirmed build-63 system startup used boot.img SHA-256 af6090c46e4b56a5d83d201273a2bb67466bd13457c44921a3d9e56cd7b41149, 87957504 bytes, with the recorded same-build kernel/trust/Data and unchanged UEFI. The temporary boot route is device-observed; no partition was flashed.", "Performance candidate after Run90: source-only bundle 7cb596187eca02ad044dce1b4454817cea74379610be9cf5b681416af01d9685; upstream Metal opt-in diagnostics, local iOS QoS/runtime trace patches, SYSMEM non-lazy allocation, stock 525 MHz and 120 Hz software pacing. Full kernel/userspace rebuild required; no phone boot until user returns. Physical refresh and 120 FPS unverified.", "Run 89 (41219310884) succeeded: actual frontend/Rust heap aliasing, retained-owner reuse, texture views, release, placement and non-heap checks passed; the old missing-alias control failed as expected. Production code is identical to Run88, whose local boot.img passed full pairing/readback, SHA-256 94e52bfec0fa7e82b7fee4f67ce8b8883ffe7011b09c10d552bbeffd52d215a9. Device performance is untested.", "Run 88 production build and local boot readback passed. This test-only source update accounts for the upstream automatic-heap standalone texture fallback; existing aliasing assertions and old-code control remain. Run88 artifacts are reused for the host recheck.", "Run 87 built Turnip and the iOS Metal bridge. This source-only update guards the arm64e-only framebuffer helper and checks plugin/frontend/daemon syntax before Rust LTO; reuse still selects the exact Run 86 kernel and base Data.", "Run 86 kernel build passed. This source-only update rebases Mesa backpressure after upstream timing and adds optional paired-kernel reuse for userspace rebuilds; UUID and original trust checks remain required.", "Run 86 resolves the two production link dependencies exposed by Run 85: a real read-only PVH user-mapping walk for the selected non-PPL XNU, adapted from the public DroidVM patch, and board HFI level telemetry after the acknowledged vote. GCC/Clang ASan/UBSan helper tests and full GMU checks pass; the helper applies after all four selected pmap patches. Source-only input: 234265 bytes, 64 entries, SHA-256 6f3adbc4b07b9a20cddb4ca376306a117afa72c7b2721e73349710fcb2433542. No mapping removal or dynamic frequency governor is introduced.", "Run 85 supplies the pmap/DCVS host doubles missing from GMU/GPU context and user-client fixtures, following the existing system-memory fixture. Run 84 showed that weak_import alone did not resolve absent executable definitions on Apple. Full Linux sanitizer regressions pass. Source-only input: 230319 bytes, 62 entries, SHA-256 64921c4bcff2fd2e5d728abd265d10df2bedd230b263cbeab109a93141bf5f70. Production pmap/cache behavior is unchanged.", "Run 84 preserves weak_import on Apple host/production builds and uses weak only for Linux host tests, fixing the optional pmap/DCVS symbol link failure in Run 83. Full Linux A830 sanitizer regressions pass. Replacement source-only input: 230140 bytes, 62 entries, SHA-256 6aa3a6fa3ab170693c50777783bdf7e062430b8e4764f0f65ecf979e16b73dd6. Run 83 already passed macOS GMU/HFI/389 MHz votes, SMMU/presenter, SMEM and Gen8 initialization checks.", "Run 83 removes the obsolete BO-pool variable from the SMMU test fixture after Clang rejected it as unused in Run 82. Clang SMMU/presenter and complete A830 software runtime checks pass. Replacement source-only bundle: 229966 bytes, 62 entries, SHA-256 fe6242b47c64e9f55574ff9e27ec0a89bd358f0bf3f2f959b19ec9160eaee517. All parity, 389 MHz and overlay changes are retained.", "Run 82 source-only input is 229626 bytes / 62 entries from seven repositories, SHA-256 4109d2d4ed53b0bb0d141991209326cfbbfbeaa70369077f0452fdd162d40e77. The bootstrap restore applies the git index and updates public submodule pins after each patch, retaining the new GPU/SMMU/GOP dependency revisions. The immutable Run 69 firmware ciphertext is reused. Build 41207690832 is in progress; local boot assembly follows successful production output.", "Follow-up to the 60 FPS target: negotiated overlay rows now write only changed glyphs at 4 Hz. First paint and legacy clients retain full writes. The actual console regression checks unchanged-cell sentinels, changed glyphs, odd pitch, bounds and panic; ASan/UBSan and Stage7 checks pass. All previously prepared mapping, heap and submit changes are retained; phone frame pacing is still pending.", "Run 80 source-only candidate follows Run 79 user-observed 15 FPS and 27.1 ms overlay cost: reuse six task mappings, preserve the diagnostic band at 4 Hz, retain nonzero method/status and map hits, forward Metal heap alias operations, and use elapsed-time-bounded shared queue backpressure. Local lifecycle, overlay and submit positive/negative regressions pass; production and real heap bridge checks run in macOS CI. Stable 60 FPS remains the hardware target.", "The next candidate retains cached Metal snapshots, pairs core method/status, labels fence poll misses, samples/rasterizes status at 4 Hz and copies cached pixels per frame. It reports requested GPU MHz, guarded Gen8 hardware busy, unknown active SP count out of 6 configured SPs, and separate GPU/CPU rates plus handoff/copy/overlay timing. Host regressions pass; full build and performance remain pending.", "The enhanced source-only candidate follows the pinned OnePlus GPU/GMU context-bank policy, selects invalid SMMU slots while preserving live firmware routes, removes optional contiguous searches for ordinary BOs, and connects the GPU presenter after self-tests with ownership and close/error fallback. Host SMMU, presenter, fragmented allocation, GPU context mismatch, GMU/HFI and power regressions pass; cloud build and local image assembly pending; no device operation authorized for this overnight candidate.", "Run 71 compiled the A830 board but rejected bzero in the early console object. The source-only replacement initializes only string starts and adds an actual-object runtime-helper regression before kernel compilation. The old object depends on memset; the corrected object and console/display sanitizer tests pass. Existing firmware ciphertext and production object checks are unchanged.", "Run 70 found the diagnostic profile still resolved BootProgress from the old device pin. The replacement source-only bundle explicitly selects the working BootProgress; its real resolver regression fails on the old selection and passes on the fix. Metal now waits for kernel success. Firmware ciphertext is unchanged.", "The diagnostic upload contains only seven source checkouts, with no firmware/DTB entries or binary patches. The existing encrypted firmware file is unchanged. The actual workflow merge self-check confirms exact new source bytes and the same five pre-existing input entries. Console and GPU snapshot regressions pass; cloud/device results are pending."]
completion = ["Kernel and prelink succeed, payload contains all declared inputs, and the boot image matches the bootloader format and size limit."]
limits = ["Build 63, the resource-only candidate and Run 69 have user-confirmed system startup through temporary boot. Run 69 still updates the visible UI at roughly one frame per second; GPU acceleration, partition flashing and persistence are unqualified.", "Build 63 and the resource-only GPU candidate are device-observed through temporary boot. This does not qualify partition flashing, persistence or later images."]
next_action = ["Retain the verified build-63 image and its matching inputs as the baseline for later independently checked images."]
evidence = [
  { kind = "host", reference = "STAGE6.md", command = "Compare published source snapshot with current worktrees; apply/tree/reverse checks for the UEFI source-only patch", revision = "d7dbaa020d64f730737e7b78ee61bec81aef2cc5", result = "Progress is preserved on device main. The d7dbaa0 seven-repository source snapshot matches all current shared-source diffs and additions byte for byte. The five remaining UEFI source/documentation changes are archived as .ci-inputs/uefi-pagani-progress.patch against 50b7313f40684aa25481cd109d7f48b9a50663fa, with exact apply/tree/reverse checks. Device records are committed directly. Existing CI inputs are unchanged; no new build or phone operation was performed." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot -s 3B15BB01BAT00000 boot out/oneplus13t/boot/metal-main-3/boot.img", revision = "d7dbaa020d64f730737e7b78ee61bec81aef2cc5", result = "The user authorized the main-3 device test. Its 100409344-byte image SHA-256 292ea3ca0fdab1d3c71e6e5fd39e5fce22130afcc27fa17d9bd23c5fd1202cbd and the sun bootloader target were rechecked. Windows fastboot Sending/Booting returned OKAY in 3.026 seconds without flashing. Desktop, color, FR/VSYNC/DISP/CMD and performance observations are pending; transport success is not GPU qualification." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41316345393", command = "Actions main Metal run 3; check-native-metal-heap-host.py; compiled symbols/OPP and paired Android/FAT image readback", revision = "d7dbaa020d64f730737e7b78ee61bec81aef2cc5", result = "Main Metal run 3 (41316345393, d7dbaa0) passed production userspace/Data staging and actual macOS Metal heap, QoS, diagnostics, scanout-pixel and completion-protocol checks, reusing run 2's identical new kernel/base Data. The final local image passes paired kernel/Data/trust/UEFI and Android/FAT readback. New-image device performance is untested. out/oneplus13t/boot/metal-main-3/boot.img is 100409344 bytes, SHA-256 292ea3ca0fdab1d3c71e6e5fd39e5fce22130afcc27fa17d9bd23c5fd1202cbd; Data UUID 6FC4EA70-B24F-44E4-8394-ABDAB0CDC877. Boot arguments retain 120 Hz software pacing, disabled expensive sampling and sysmem,nocb." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41234063029", command = "Actions Run91; check-native-metal-heap-host.py; compiled OPP/QoS checks; paired Android/FAT image readback", revision = "5b11f858b3799648708778bf81d6772cc98d66be", result = "Run91 passed full kernel/Metal production builds and actual host heap, QoS, diagnostics and scanout-pixel checks. The local boot image passes matching kernel/Data/trust/UEFI and Android/FAT readback. No phone operation was performed; 525 MHz, sustained FPS and thermal behavior await device testing. out/oneplus13t/boot/metal-run-91/boot.img is 100392960 bytes, SHA-256 c05b470241545b7feb003426c1e236cab289edf02df9bff4d465961fa834588d; Data UUID is 40DDD231-F4AE-4443-818F-8085CB168DBE. Both branch histories remain reachable, and subsequent source changes and Metal dispatches use main." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41229571660", command = "Actions Run90; check-native-metal-heap-host.py; boot image Android/FAT readback", revision = "878a7e38d2d0d358bea20d78c4c38a8f2efe869d", result = "Run90 passed production iOS Metal builds and real macOS/MoltenVK heap and scanout pixel checks. The local 100380672-byte boot.img (SHA-256 91cc316ac1edcf151643bf21cda08872b8244caa80a7351a61cbaafd4090f0d4) combines compute-band preservation with the device-confirmed SYSMEM color workaround. Matching Run86 kernel, Data UUID, trust, UEFI and final Android/FAT readback pass. New-image device logs and animation performance remain pending." },
  { kind = "host", reference = "STAGE6.md", command = "ASAN_OPTIONS=detect_leaks=0 python3 scripts/check-gmu.py; check-adreno-a830.py; test-stage7.py", revision = "cdd273d72a1e3a08f118e1fb69b39ed18c3bc929", result = "Run 79 user observation confirms UI startup, 222 MHz requested, hardware busy while sliding, at most about 15 FPS and no smoother scrolling; last GPU handoff/CPU copy/overlay times are 72.2/339.1/27.1 ms. Run 80 source reuses up to six task mappings, enables the existing Metal import cache, negotiates a preserved diagnostic band across GPU/CPU paths and redraws at 4 Hz. Mapping reuse and latest nonzero method/status are visible. Host regressions pass; production build and speedup are pending." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot -s 3B15BB01BAT00000 boot out/oneplus13t/boot/metal-run-79/boot.img", revision = "8bd34b4b1f352a83fe21fcf72bf686e229b28f6b", result = "After the user reconnected fastboot and explicitly requested testing, the Run 79 image hash and sun/bootloader identity were verified. Windows fastboot boot returned Sending OKAY (2.297 s) and Booting OKAY (0.338 s), total 3.001 s, without flashing. Log: out/oneplus13t/boot/metal-run-79/fastboot-boot-20261031-203720.log. Run 79 UI startup, CLK/DISP/API readings and performance await user observation." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41196229588", command = "xnu.yml; python3 /tmp/pagani-package-run79.py", revision = "8bd34b4b1f352a83fe21fcf72bf686e229b28f6b", result = "Run 79 (41196229588, source 8bd34b4) passed cloud regressions, XNU/A830 build and prelink, Metal/Turnip, signing and Data installation in 21m41s. Downloaded kernel SHA-256 matches the final build log. New diagnostic formats and the strong presenter timing symbol are present. The local 100499456-byte out/oneplus13t/boot/metal-run-79/boot.img passes same-build Data UUID, trust, known GFX UEFI, Android v4 and FAT/file/argument readback. The user requested no phone operation; Run 79 performance and activity readings remain untested." },
  { kind = "device", reference = "STAGE6.md", command = "Run 78 user-transcribed overlay after temporary fastboot boot", revision = "b8942ef6e3c1f0e9cbbed7b54fe785fc0c6dd82e", result = "Run 78 user observation confirms UI startup, GPU Metal registered rc=0, submissions/completions 1039/1039, no poisoned jobs and GPU presentation 518/0. Scrolling was visually in the teens of FPS. The old timeout counter includes zero-timeout fence poll misses; snapshot busy means diagnostic lock contention. Error e00002c7 is Unsupported, with the triggering method not yet identified." },
  { kind = "host", reference = "STAGE6.md", command = "Verify Run 78 boot.img; fastboot getvar product/is-userspace; fastboot -s 3B15BB01BAT00000 boot out/oneplus13t/boot/metal-run-78/boot.img", revision = "b8942ef6e3c1f0e9cbbed7b54fe785fc0c6dd82e", result = "After the user connected fastboot and requested testing, the Run 78 image hash was rechecked and the target was confirmed as sun in bootloader fastboot. Windows fastboot boot returned Sending OKAY (2.297 s) and Booting OKAY (0.339 s), total 3.010 s, without flashing. Log: out/oneplus13t/boot/metal-run-78/fastboot-boot-20261031-184620.log. Device startup, SMMU/GMU progress and GPU presentation remain pending user observation." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41166974317", command = "GitHub Actions xnu.yml Run 78; gh run download; local paired payload/boot packaging and executable-symbol, Data/trust, UEFI, boot-argument and Android/FAT readback checks", revision = "b8942ef6e3c1f0e9cbbed7b54fe785fc0c6dd82e", result = "Run 78 passed all cloud regressions, production XNU/A830 compilation and prelink, and Metal/Turnip build and Data staging. The downloaded kernel hash matches the cloud result. Local out/oneplus13t/boot/metal-run-78/boot.img is 100495360 bytes with SHA-256 d6a3858561769553943822ae8d57deab0003d9419e2e82dc78bb931170455d4e. New SMMU/presenter/close-hook and diagnostic entries are executable strong symbols; Data UUID 4C02592E-3207-4785-967B-D8D1C5314E1B, original and owner trust, tested GFX UEFI, GPU-presenter boot argument and Android/FAT content readback pass. No phone operation was performed; device GPU startup, presentation and performance remain unverified." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot boot out/oneplus13t/boot/metal-run-76/boot.img; user transcribed GPU/P/GMU/DISP rows", revision = "dc3b0501d74a6286ba13aebf5c5ea34dfd16869c", result = "Power stage 7 completed; GPU SMMU returns -1 before GMU startup, Metal is unpublished. Last power offset 0x71010 value 0x08000003; display copy 253 ms / 12530 KiB." },
  { kind = "host", reference = "STAGE6.md", command = "python3 /tmp/pagani-package-run76.py; fastboot -s 3B15BB01BAT00000 boot out/oneplus13t/boot/metal-run-76/boot.img", revision = "dc3b0501d74a6286ba13aebf5c5ea34dfd16869c", result = "After renewed user authorization, the paired Run 76 image passes executable GPU symbols, Data UUID, original/owner trust, tested GFX UEFI and Android/FAT readback. Boot image SHA-256 a249b0c90b9a3d8270f1de96ce1681bb39cb59a03d33d1c59c553cb3dff9683e. The target is sun in bootloader fastboot; Sending and Booting returned OKAY in 2.984 seconds without flashing. New GPU/P/GMU or M/CMD/API readings are pending; successful DEMET progression and GPU execution are unverified." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41116080103", command = "GitHub Actions xnu.yml Run 76; gh run download; local kernel SHA-256, arm64 Mach-O, executable-symbol and paired Data UUID checks", revision = "dc3b0501d74a6286ba13aebf5c5ea34dfd16869c", result = "Run 76 passed branch HALT/FSM regressions, all existing host contracts, full XNU/A830 kernel/prelink and Metal builds. Artifacts are downloaded to out/oneplus13t/actions/metal-run-76/. The 128344064-byte arm64 kernel SHA-256 54fab07ecaa0b23ba6baf61419e1a449247c00651e0fbc4e5708f1b4e9b2e26d matches the cloud log; power/start/diagnostic entries are executable strong symbols and Data UUID 2459A7A6-B0FE-4CF3-992A-8CDF16E7A155 matches. At the user request work stops after download: no boot image or phone operation; runtime and unchanged CPU display performance remain unverified." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot boot out/oneplus13t/boot/metal-run-75/boot.img; user transcribed GPU/P/GMU/DISP rows", revision = "05bd77332e0a87d9b82f72e947e581a090e482b5", result = "Run 75 passed GPUCC +0x9008 and stopped at +0x9010 with -110 and 0x08000000. Metal is unpublished; GMU fields are zero; CPU copy remains 386.4 ms / 12540 KiB." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41110329224", command = "GitHub Actions xnu.yml Run 75; local paired payload/boot packaging and binary readback; fastboot boot", revision = "05bd77332e0a87d9b82f72e947e581a090e482b5", result = "Run 75 includes the vendor-aligned branch write/delay/skip sequence and preserves the power error code. Cloud power regressions, full kernel/prelink and Metal builds passed. The paired boot image passes downloaded-kernel identity, executable GPU symbols, Data UUID, owner/original trust, tested GFX UEFI and Android/FAT readback. Windows fastboot accepted temporary boot in 3.042 seconds without flashing. Advancement beyond GPUCC +0x9008 and GMU/Metal startup remain pending new device readings; CPU presentation is unchanged." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot boot out/oneplus13t/boot/metal-run-74/boot.img; user observed system startup and GPU information", revision = "5d3412df08c78cd513ab0ad3c3f7edbf5842bbed", result = "Boot image SHA-256 fc5e815a54c9a1bbd51610e463481cfe52bd782867ca39215909c43942301e91. Run 74 user feedback confirms system startup and visible GPU information after the recorded temporary boot. The exact GPU/M/CMD/API/DISP values and their changes during interaction have not been recorded; GPU execution and low-frame-rate improvement remain unverified." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41102040521", command = "GitHub Actions xnu.yml Run 74; local paired payload/boot packaging and binary readback; fastboot boot", revision = "5d3412df08c78cd513ab0ad3c3f7edbf5842bbed", result = "Run 74 passed all cloud contracts, the production early-console object checks, full kernel/prelink and Metal userspace builds. The paired image passes executable GPU diagnostics symbols, Data UUID, owner/original trust, tested GFX UEFI and Android/FAT readback. Windows fastboot accepted the temporary boot in 3.227 seconds without flashing. Visible GPU rows and actual rendering remain pending user observation." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot boot out/oneplus13t/boot/metal-run-69/boot.img; user observed system startup and approximate display update rate", revision = "823a2fa2ea91a31f97d3a9c6be0c792ea745c543", result = "The user reported normal Run 69 system startup with roughly one visible frame update per second. This boot bypassed the previous whole-SMEM-copy panic. GPU startup, Metal rendering and measured frame rate were not captured; no partition was flashed." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41079321476", command = "Actions build 69; llvm-nm -m and objdump; unixnu payload/bootimg; Android/FAT readback; fastboot boot", revision = "823a2fa2ea91a31f97d3a9c6be0c792ea745c543", result = "Run 69 (41079321476, source bundle commit 823a2fa) passed A830/GMU contracts, XNU compile/prelink, Turnip/Metal builds, signing and Data staging. The actual kernel contains both direct Sm8750SocInfoGpuCode calls. The paired Data UUID is C6D2F70B-11E9-4A89-908C-C2C9B5711DF1; all three owner CDHashes and both unchanged original trust modules passed readback. The 100491264-byte metal-run-69/boot.img embeds the tested complete-GFX UEFI and matching 192 MiB FAT payload; SHA-256 df36c514399f6a9e0a71f94443013318e60f188dd5873dfd916bf51b09353ba0. Windows fastboot Sending/Booting returned OKAY in 3.044s without flashing. The user confirmed normal system startup with roughly one visible frame update per second. The previous SMEM panic was bypassed on this boot; GPU initialization and Metal rendering remain unverified." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/41079321476", command = "package-metal-ci.py create; source-byte checks; AES-256-CBC encryption and decryption round-trip; gh workflow run xnu.yml", revision = "823a2fa2ea91a31f97d3a9c6be0c792ea745c543", result = "The isolated Metal CI input is an encrypted snapshot of seven source checkouts plus pinned private firmware. The 2026-10-30 SMEM fix bundle passed source-byte and encryption round-trip checks; Run 69 was dispatched from 823a2fa. Plaintext firmware and the decryption key remain outside Git." },
  { kind = "host", reference = "STAGE6.md", command = "unixnu firmware; unixnu bootimg; compare unpacked Run 68 payload and DTBs", revision = "cdd273d72a1e3a08f118e1fb69b39ed18c3bc929", result = "The complete-GFX retry at out/oneplus13t/boot/metal-run-68-gfx-map-20261030/boot.img is 100491264 bytes, SHA-256 8a1a6fb5a17da313475a02a90df81247042f15f1e7c6fab28b50c0dcd3f76154. Final-image readback confirms GFX 0x03D00000/0x100000 without partial overlapping mappings; BootShim, stock DTBs and the entire 192 MiB Run 68 FAT payload match the original byte-for-byte. Sending and Booting returned OKAY in 2.964s without flashing. The user confirmed UEFI handoff, followed by an XNU SMEM-read panic. This image still contains the original Run 68 kernel; the selective-SMEM source fix is not yet included." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot boot out/oneplus13t/boot/stage7-gpu-resources/boot.img; user observed UI and touch", revision = "830e21446dd45a1b8c0c7b350221ce60e87c2379", result = "The resource-only image is 87957504 bytes, SHA-256 34b8738bf6ad044df6045039971936644d32690fa354c524478aed51719e0a22. Fastboot Sending and Booting returned OKAY in 2.656s without partition flash; the user confirmed system UI and normal touch. The DTS additions were committed after this test." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot boot stage7-run-63/boot.img; user-observed system, touch and CPU/RAM overlay", revision = "3c39bafed673ce1233f533e5b8193a1436d894a3", result = "The user-confirmed build-63 system startup used boot.img SHA-256 af6090c46e4b56a5d83d201273a2bb67466bd13457c44921a3d9e56cd7b41149, 87957504 bytes, with the recorded same-build kernel/trust/Data and unchanged UEFI. The temporary boot route is device-observed; no partition was flashed." },
  { kind = "host", reference = "STAGE6.md", command = "./unixnu payload; ./unixnu bootimg; Android/FAT/ADT readback; fastboot boot", revision = "3c39bafed673ce1233f533e5b8193a1436d894a3", result = "Build-63 boot.img is 87957504 bytes with SHA-256 af6090c46e4b56a5d83d201273a2bb67466bd13457c44921a3d9e56cd7b41149 at out/oneplus13t/boot/stage7-run-63/boot.img. Android v4, unchanged UEFI, actual FAT inputs, eight-affinity ADT and boot arguments passed readback. Fastboot accepted temporary launch in 2.791s without flashing a partition." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40520726310", command = "Actions build 63; download; actual display-vtable, Clutch-policy and paired Data checks", revision = "3c39bafed673ce1233f533e5b8193a1436d894a3", result = "Build-63 kernel/kernel.macho is downloaded at out/oneplus13t/actions/run-63/ with 127803392 bytes and SHA-256 076c87c95bf3a1496722f4bddf7538b4be336cc80908e4ef3a15eeb4b0f64540. Paired RAM Data UUID is 1726EAC0-2168-4118-AFD6-19E12FE306E7. Source pins, actual display vtable, Clutch policy, packed/raw Data integrity and UUID embedding pass. No build-63 boot image was assembled or booted." },
  { kind = "source", reference = "STAGE6.md", result = "The verified build-62 temporary boot subsequently panicked at display slot 345. No replacement image has been assembled or booted; its kernel, trust cache and RAM Data remain the current local packaging inputs, and earlier images are retained." },
  { kind = "host", reference = "STAGE6.md", command = "./unixnu payload; ./unixnu bootimg; Android/FAT/ADT readback; fastboot boot", revision = "c87bced3d8fba74f11c9f91ed6494fb741f29f90", result = "Build-62 boot.img is 87957504 bytes with SHA-256 d15c0f5fca06ad13047e653aeaa778b1d3b5c6610448113143d5aa6ab7f1bd2b at out/oneplus13t/boot/stage7-run-62/boot.img. Android v4, unchanged UEFI, actual FAT inputs, eight-affinity ADT and boot arguments passed readback. Fastboot accepted the temporary launch in 2.671s without flashing a partition." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40505777459", command = "Actions build 62; download; source-pin, linked Clutch policy and paired Data verification", revision = "c87bced3d8fba74f11c9f91ed6494fb741f29f90", result = "Build-62 kernel/kernel.macho is downloaded at out/oneplus13t/actions/run-62/ with 127803392 bytes and SHA-256 671d5cc0c9b60b594b481914d3a5874d88e78ebac906834e78577618cfe6629e. Paired RAM Data UUID is 9E72E6D9-AC74-428E-A275-E8A25FD3264C. Source pins, actual Clutch policy, panic strings, packed/raw Data integrity and UUID embedding pass. No build-62 boot image was assembled or booted." },
  { kind = "host", reference = "STAGE6.md", command = "./unixnu payload; ./unixnu bootimg; Android/FAT/ADT readback; fastboot boot", revision = "faa6aa2cbd8d0a005f85cb2ad6749c769df6e586", result = "Build-60 boot.img is 87957504 bytes with SHA-256 fddce67146aca4ce607975264689f3cac014f712f7409c00d5f4de923315b4bf at out/oneplus13t/boot/stage7-run-60/boot.img. Android v4, unchanged UEFI, FAT inputs, eight-affinity ADT and same-build kernel/trust/Data checks pass. Fastboot Sending/Booting returned OKAY in 2.659s without flashing." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40499765573", command = "Actions build 60; download; source-pin, panic-format and paired Data verification", revision = "faa6aa2cbd8d0a005f85cb2ad6749c769df6e586", result = "Build-60 kernel/kernel.macho is downloaded at out/oneplus13t/actions/run-60/ with 127803392 bytes and SHA-256 422074400f8eff7b9be51dfec3e895a207f304deb678ba527dcaf23da2eeea35. Its paired RAM Data UUID is E81D6D67-C2F6-4CAC-9FF9-100EDFF76900. Source pins, selected diagnostic patch, actual panic strings, packed/raw Data integrity and UUID embedding pass; no build-60 boot image was assembled or booted." },
  { kind = "device", reference = "STAGE6.md", command = "Build-59 temporary boot; user panic photograph and matching-kernel symbol lookup", revision = "859dbce9a793d194f48399633353073df1dc880f", result = "The verified build-59 image was temporarily loaded successfully, then panicked in the kernel. The next image must use the diagnostic kernel and its matching trust/Data inputs; previous images are retained." },
  { kind = "host", reference = "STAGE6.md", command = "./unixnu payload; ./unixnu bootimg; Android/FAT/ADT readback; fastboot boot", revision = "859dbce9a793d194f48399633353073df1dc880f", result = "Build-59 boot.img is 87957504 bytes with SHA-256 a58808d933c713e5a32c068f36791d09d2917d2216c7b788250a5a8bafcca349 at out/oneplus13t/boot/stage7-run-59/boot.img. Android v4, unchanged UEFI, actual FAT inputs, eight-affinity ADT and boot arguments passed readback. Fastboot accepted the temporary launch in 2.680s without flashing a partition." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40483050380", command = "Actions build 59; download; source-pin and paired Data verification", revision = "859dbce9a793d194f48399633353073df1dc880f", result = "Build-59 kernel/kernel.macho is downloaded at out/oneplus13t/actions/run-59/ with 127803392 bytes and SHA-256 2f501babd1daf3a60700588d21b1ff90394d471fd82751158c726ebaf1033400. Its paired RAM Data UUID is 2B2FB879-4530-4537-8CBD-50692F3F0CA0. Source pins, packed/raw Data integrity and UUID embedding pass; no build-59 boot image has been assembled or booted." },
  { kind = "host", reference = "STAGE6.md", command = "./unixnu payload; ./unixnu bootimg; Android/FAT readback; fastboot boot", revision = "ad6ed2d5dcb0a12e7d0b24108440b265df33a477", result = "Build-57 boot.img is 87957504 bytes, SHA-256 33ad1883076f25b944ccde4fd89776e28c9576589eb0cc6fb8e6df10aeee8b55, at out/oneplus13t/boot/stage7-run-57/boot.img. Android v4, empty ramdisk, unchanged UEFI and actual FAT kernel/trust/Data/ADT passed readback. Fastboot accepted the user-requested temporary boot without flashing; earlier images are retained." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot -s 3B15BB01BAT00000 boot stage7-run-49/boot.img; user observation", revision = "be18db0025fbde66ffd0a55302f9c1bc0fe3c122", result = "Sending and Booting returned OKAY. The user reported no repeat panic during the test, while touch, volume/power keys and brightness remained unusable. Test duration was not specified; this does not qualify long-term stability or input." },
  { kind = "host", reference = "STAGE6.md", command = "test-format2.py; test-stage6.py; ./unixnu kernel -j 3; ./unixnu payload; ./unixnu bootimg; FAT readback", revision = "be18db0025fbde66ffd0a55302f9c1bc0fe3c122", result = "Build 49 passed configuration, UFS regressions, complete kernel link/prelink and matching boot-image assembly/readback. The UFS completion recheck is included; hardware retest remains pending." },
  { kind = "device", reference = "STAGE6.md", command = "fastboot -s 3B15BB01BAT00000 boot out/oneplus13t/boot/stage7-run-48/boot.img", revision = "e6435b2bda6e91431f3bc0c442d1ff9c47be1451", result = "Build 48 briefly reached the UI. Touch, volume/power keys and brightness did not respond; a UFS read timed out after 297989 reads. The screenshot shows one busy sample, elapsed time beyond the deadline and a later completed DMA snapshot. No partition was flashed." },
  { kind = "host", reference = "README.md", command = "./unixnu payload; ./unixnu bootimg; mcopy FAT readback and input hash checks", revision = "fcab49e2ea2f9ddfaa08ee6e8109ba7ed67029ac", result = "The build-48 boot image passed Android v4, embedded payload and stock-DTB round-trip checks. FAT readback matched the cloud kernel, trust cache and Data seed; all three pagani peripheral arguments and the 4 GiB DarwinBoot, root UUID and PackedRAMDisk/TrustCache handoff properties passed. Hardware remains untested." },
  { kind = "host", reference = "MIGRATION.md", command = "./unixnu kernel -j 3; ./unixnu build package; ./unixnu firmware; ./unixnu payload; ./unixnu bootimg", revision = "af2ba2975a5f0f6dcedfdcc719a1c646876f5804", result = "Kernel/prelink, 160 MiB FAT payload and 87928832-byte Android v4 boot image succeeded. Extracted ADT and payload kernel hashes match the reports; no GPU addon is supplied." },
  { kind = "source", reference = "board.toml", result = "Current format-2 selection and board policy." },
  { kind = "source", reference = "STAGE6.md", result = "Historical PKX110 observations through build 39; no claim of migrated-image hardware verification." },
  {"kind" = "host", "reference" = ".ci-inputs/a830-diagnostics-sources.tar.gz", "command" = "package-metal-ci.py create --sources-only; source payload audit; console/GMU/A830 regressions", "revision" = "b8942ef6e3c1f0e9cbbed7b54fe785fc0c6dd82e", "result" = "168710 bytes, 7 repos / 55 entries, SHA-256 9ff57ae0e49d7277864cd6bea4e87751d6c2a3c49fe7b50c032cdc09f441f674; contains source and tests only, no firmware, DTB, keys or binary patches. Reuses the previously authorized encrypted Run 69 inputs. Full build pending."},
]

[[area]]
id = "diagnostics"
status = "device-verified"
components = ["BootProgress", "Stage7Probe"]
paths = ["patches/xnu/**", "scripts/test-kernel-source.py", "scripts/backup*", "scripts/p13-f2fs-shrink.c", "scripts/audit-original-pmgr.py", "scripts/test-root-audit.py"]
inputs = ["Early framebuffer, root checkpoints and panic rendering remain enabled. Source-only diagnostics are separate from the prelinked userspace kernel."]
configuration = ["XNU_BOOT_PROGRESS=y; XNU_EARLY_BOOT_PROGRESS=y; optional native-root-audit triggers the binding report."]
procedure = ["Run the panic/ADT/boot container checks; preserve old run artifacts; capture the last completed checkpoint in a future explicitly authorized temporary boot."]
findings = ["The user confirms main-3 desktop startup, correct colors and readable diagnostics, with a slight subjective improvement over Run91. All reported VSYNC readings are zero. No complete FR/DISP/CMD values or measured new FPS were supplied, so the zero-counter cause and limiting frame stage remain unresolved. Further fixes, builds and device operations are paused at the user's request; 120 FPS and physical 120 Hz are unverified.", "The user authorized the main-3 device test. Its 100409344-byte image SHA-256 292ea3ca0fdab1d3c71e6e5fd39e5fce22130afcc27fa17d9bd23c5fd1202cbd and the sun bootloader target were rechecked. Windows fastboot Sending/Booting returned OKAY in 3.026 seconds without flashing. Desktop, color, FR/VSYNC/DISP/CMD and performance observations are pending; transport success is not GPU qualification.", "Main Metal run 3 (41316345393, d7dbaa0) passed production userspace/Data staging and actual macOS Metal heap, QoS, diagnostics, scanout-pixel and completion-protocol checks, reusing run 2's identical new kernel/base Data. The final local image passes paired kernel/Data/trust/UEFI and Android/FAT readback. New-image device performance is untested. Real host assertions cover timing reset, 40-byte completion, one-time 16-byte fallback for old kernels, real error preservation and disabled steady-frame markers. FR and software VSYNC strings and globals are present in the packaged kernel. Collect device readings before identifying the limiting stage.", "Synced UniXNU main 6790e7c (merge 888876f), Adreno740 a9a2cbb and AdrenoMetal 831a9dc while retaining iPadOS 17 and Gen8 boundaries. The candidate suppresses steady-frame progress traffic, adds compatible completion timings and observed software VSYNC counters, and keeps stock 525 MHz/SYSMEM. Local protocol, ownership, timing/status, console and cadence checks pass; production build and device bottleneck measurements are pending. See STAGE6.md.", "At the user's explicit test request, Run91 image hash was rechecked and Windows fastboot accepted temporary boot on sun in 3.275 s (Sending 2.293 s, Booting 0.337 s), without flashing. Log: out/oneplus13t/boot/metal-run-91/fastboot-boot-20261101-204948.log. The user confirms desktop startup and correct colors: req=525 MHz, busy=0, active SP unknown/6, G=40 fps/20.1 ms, C=0.0/259.4, O=0.2 at 4 Hz. CMD submitted/completed=4547/4547, bad=0, P=2099/0; API current m=7 err=0, retained E=6/e00002d6. Requested clock and one busy sample do not establish actual clock or bottleneck; panel timing and thermal stability remain unmeasured.", "Run91 passed full kernel/Metal production builds and actual host heap, QoS, diagnostics and scanout-pixel checks. The local boot image passes matching kernel/Data/trust/UEFI and Android/FAT readback. No phone operation was performed; 525 MHz, sustained FPS and thermal behavior await device testing. Separate host processes confirm default-off and explicitly enabled stage/allocation recording. The packaged flags select sheng-gpu-sample=0 without sheng-diag=1, while retaining the existing on-screen status overlay.", "The actual display timer and fixed refresh attributes pass 60/120 Hz host checks, including notification cadence and teardown. This test-only follow-up does not change the Run91 production snapshot or establish physical panel refresh.", "Run 90 user confirms correct colors and readable logs: 389 MHz requested, 28-40 GPU presentations/s, no CPU fallback, three reused scanout mappings. Next candidate integrates upstream diagnostic gating, iOS runtime QoS and SYSMEM non-lazy allocations, requests stock 525 MHz with matched voltage/bandwidth, and uses 120 Hz software pacing. Panel timing and achieved FPS remain unverified; build/download only, no phone operation.", "Run90 passed production iOS Metal builds and real macOS/MoltenVK heap and scanout pixel checks. The local 100380672-byte boot.img (SHA-256 91cc316ac1edcf151643bf21cda08872b8244caa80a7351a61cbaafd4090f0d4) combines compute-band preservation with the device-confirmed SYSMEM color workaround. Matching Run86 kernel, Data UUID, trust, UEFI and final Android/FAT readback pass. New-image device logs and animation performance remain pending.", "Warm interaction feedback: repeated control-center transitions no longer stall severely, while app open/close animations remain around 20 FPS by user observation. Logs are still unreadable on the Run88 control; the remaining bottleneck is not yet measured.", "Run88 SYSMEM-only control restored normal colors on device. User estimates 30-60 FPS during smooth interaction, with control-center/cold-launch stalls and unreadable logs still present. The candidate profile now selects sysmem,nocb until A830 GMEM correctness is qualified; Run90 combines this runtime flag with the compute-band fix.", "The supplied Run88 photo shows overwritten static diagnostic letters and remaining changing digits. Full-frame compute writes bypassed the existing blit exclusion; the presenter now preserves the negotiated band.", "Run88 user observation: UI is usable and markedly smoother, reported about 60 FPS, but colors flicker and fixed diagnostic letters disappear while changing digits remain. CLK/DISP/CMD values are unreadable. Source inspection found opaque/half-float GPU compute scanout bypassed the preserved diagnostic band; the source now dispatches visible row spans and adds pixel/padding checks for empty, middle and full bands. macOS validation and a rebuilt candidate are pending. Color-flicker root cause remains unconfirmed.", "Run 85 passed all macOS host contracts and driver compilation, then final kernel linking exposed absent upstream pmap/DCVS diagnostics. The candidate now provides the real read-only user-mapping walk for the selected non-PPL XNU and records the acknowledged board HFI level in native_gpu_dcvs[1], with governor-running flag zero. The actual pmap helper passes GCC and Clang ASan/UBSan checks for invalid, empty, kernel, IOMMU, single and chained user mappings, optional outputs and balanced locks. No mapping is removed. Run 86 production compile and prelink passed. Metal stopped at an overlapping Mesa patch; the rebased 12-patch sequence now applies and reverses to the pinned source, with submit-pressure/timing regressions passing.", "The next candidate follows upstream GPU parity with matching Adreno740/Metal/SMMU/GOP and runtime pins while preserving iPadOS 17 and prior buffer/overlay fixes. It replaces the 512 MiB BO pool with system pages, integrates per-process A830 SQE/AQE mappings, requests the original 389 MHz OPP with matched voltage/bandwidth, and reports the verified six-SP topology to Metal. Active SP count and stable 60 FPS remain unverified; production build is pending.", "The follow-up for stable 60 FPS removes the remaining full-band 4 Hz write from the synchronous display path: after overlay negotiation only changed glyphs are rasterized and written; first paint and legacy clients keep full writes. Actual-code ASan/UBSan checks preserve unchanged-cell sentinels and verify changed glyphs, odd pitch, bounds and panic. Device O time and frame pacing remain unmeasured.", "The 60 FPS target is unverified. Comparison with current upstream and zeta retains existing TLB/audit and 16384-object fixes, adds the missing Metal heap alias bridge and elapsed-time-bounded shared submit backpressure, and keeps cache maintenance and completion ordering. Actual submit regression and old-code control pass; real heap bridge tests are wired into macOS CI. See STAGE6.md for references and limits.", "Run 79 user observation confirms UI startup, 222 MHz requested, hardware busy while sliding, at most about 15 FPS and no smoother scrolling; last GPU handoff/CPU copy/overlay times are 72.2/339.1/27.1 ms. Run 80 source reuses up to six task mappings, enables the existing Metal import cache, negotiates a preserved diagnostic band across GPU/CPU paths and redraws at 4 Hz. Mapping reuse and latest nonzero method/status are visible. Host regressions pass; production build and speedup are pending.", "After the user reconnected fastboot and explicitly requested testing, the Run 79 image hash and sun/bootloader identity were verified. Windows fastboot boot returned Sending OKAY (2.297 s) and Booting OKAY (0.338 s), total 3.001 s, without flashing. Log: out/oneplus13t/boot/metal-run-79/fastboot-boot-20261031-203720.log. Run 79 UI startup, CLK/DISP/API readings and performance await user observation.", "Run 79 (41196229588, source 8bd34b4) passed cloud regressions, XNU/A830 build and prelink, Metal/Turnip, signing and Data installation in 21m41s. Downloaded kernel SHA-256 matches the final build log. New diagnostic formats and the strong presenter timing symbol are present. The local 100499456-byte out/oneplus13t/boot/metal-run-79/boot.img passes same-build Data UUID, trust, known GFX UEFI, Android v4 and FAT/file/argument readback. The user requested no phone operation; Run 79 performance and activity readings remain untested.", "Run 78 user observation confirms UI startup, GPU Metal registered rc=0, submissions/completions 1039/1039, no poisoned jobs and GPU presentation 518/0. Scrolling was visually in the teens of FPS. The old timeout counter includes zero-timeout fence poll misses; snapshot busy means diagnostic lock contention. Error e00002c7 is Unsupported, with the triggering method not yet identified.", "The next candidate retains cached Metal snapshots, pairs core method/status, labels fence poll misses, samples/rasterizes status at 4 Hz and copies cached pixels per frame. It reports requested GPU MHz, guarded Gen8 hardware busy, unknown active SP count out of 6 configured SPs, and separate GPU/CPU rates plus handoff/copy/overlay timing. Host regressions and Run 79 production build/image checks pass; hardware performance remains pending.", "After the user connected fastboot and requested testing, the Run 78 image hash was rechecked and the target was confirmed as sun in bootloader fastboot. Windows fastboot boot returned Sending OKAY (2.297 s) and Booting OKAY (0.339 s), total 3.010 s, without flashing. Log: out/oneplus13t/boot/metal-run-78/fastboot-boot-20261031-184620.log. Device startup, SMMU/GMU progress and GPU presentation remain pending user observation.", "Run 78 passed all cloud regressions, production XNU/A830 compilation and prelink, and Metal/Turnip build and Data staging. The downloaded kernel hash matches the cloud result. Local out/oneplus13t/boot/metal-run-78/boot.img is 100495360 bytes with SHA-256 d6a3858561769553943822ae8d57deab0003d9419e2e82dc78bb931170455d4e. New SMMU/presenter/close-hook and diagnostic entries are executable strong symbols; Data UUID 4C02592E-3207-4785-967B-D8D1C5314E1B, original and owner trust, tested GFX UEFI, GPU-presenter boot argument and Android/FAT content readback pass. No phone operation was performed; device GPU startup, presentation and performance remain unverified.", "The enhanced candidate follows the pinned OnePlus bank policy (GPU 0/1 reserved, GMU from 2), selects invalid SMMU slots without disturbing live routes, removes optional contiguous searches for ordinary BOs, and connects the existing GPU scanout presenter only after GPU self-tests. Presenter ownership/close fallback and SMMU/allocator regressions pass on software peers; Run 78 full build and local image checks pass; hardware results are pending.", "Run 76 device feedback reached GPU SMMU with rc=ffffffff, power step=7 window=0 offset=71010 value=08000003, Metal unpublished and GMU fields zero; CPU display copy was 253 ms / 12530 KiB. The branch-clock sequence completed, but the generic SMMU failure does not identify its branch. The diagnostic candidate preserves exact return codes, preflight register snapshots and existing GMU/GPU context reports; ACTLR 0x32b matches the captured DTB. Software tests retain layout/busy-bank/ACTLR/I/O refusal and verify no MMIO from status rendering. Hardware SMMU correction awaits specific readings.", "After renewed user authorization, the paired Run 76 image passes executable GPU symbols, Data UUID, original/owner trust, tested GFX UEFI and Android/FAT readback. Boot image SHA-256 a249b0c90b9a3d8270f1de96ce1681bb39cb59a03d33d1c59c553cb3dff9683e. The target is sun in bootloader fastboot; Sending and Booting returned OKAY in 2.984 seconds without flashing. New GPU/P/GMU or M/CMD/API readings are pending; successful DEMET progression and GPU execution are unverified.", "Run 76 passed branch HALT/FSM regressions, all existing host contracts, full XNU/A830 kernel/prelink and Metal builds. Artifacts are downloaded to out/oneplus13t/actions/metal-run-76/. The 128344064-byte arm64 kernel SHA-256 54fab07ecaa0b23ba6baf61419e1a449247c00651e0fbc4e5708f1b4e9b2e26d matches the cloud log; power/start/diagnostic entries are executable strong symbols and Data UUID 2459A7A6-B0FE-4CF3-992A-8CDF16E7A155 matches. At the user request work stops after download: no boot image or phone operation; runtime and unchanged CPU display performance remain unverified.", "Run 75 device readings advanced past critical CXO to GPUCC +0x9010 (DEMET): power rc=ffffff92 (-110), value=08000000, Metal unpublished, GMU fields zero; DISP 386.4 ms / 12540 KiB. Vendor branch2 accepts CLK_OFF clear or NoC FSM ON without enable-bit readback. The corrected common branch poll passes reported-value and NoC-ON regressions while rejecting real halted states, with all 81 read and 38 write failure points and five bounded stalls passing. New device validation is pending.", "Run 75 includes the vendor-aligned branch write/delay/skip sequence and preserves the power error code. Cloud power regressions, full kernel/prelink and Metal builds passed. The paired boot image passes downloaded-kernel identity, executable GPU symbols, Data UUID, owner/original trust, tested GFX UEFI and Android/FAT readback. Windows fastboot accepted temporary boot in 3.042 seconds without flashing. Advancement beyond GPUCC +0x9008 and GMU/Metal startup remain pending new device readings; CPU presentation is unchanged.", "Run 74 user transcribed GPU power rc=ffffffff, Metal not published, P step=6 w=1 off=9008 val=8000000 and all-zero GMU fields. The board collapsed the power error to -1; the candidate preserves the actual Sm8750GpuPowerOn return code. The observer adds no MMIO access.", "Run 74 user feedback confirms system startup and visible GPU information after the recorded temporary boot. The exact GPU/M/CMD/API/DISP values and their changes during interaction have not been recorded; GPU execution and low-frame-rate improvement remain unverified.", "Run 74 passed all cloud contracts, the production early-console object checks, full kernel/prelink and Metal userspace builds. The paired image passes executable GPU diagnostics symbols, Data UUID, owner/original trust, tested GFX UEFI and Android/FAT readback. Windows fastboot accepted the temporary boot in 3.227 seconds without flashing. Visible GPU rows and actual rendering remain pending user observation.", "Run 73 passed all host contracts but the production console object still depended on bzero: XNU MakeInc.def enables -ftrivial-auto-var-init=zero. The GPU string buffer now uses explicit volatile byte clearing with a per-variable uninitialized attribute, retaining full initialization without a runtime helper. The object regression now uses the XNU automatic-initialization flag; it reproduces the prior failure and passes the correction, as do console ASan/UBSan checks. Production runtime-helper checks remain enabled.", "Run 72 stopped in the new host object check because macOS fortified stdio macros conflicted with kernel function declarations. The console fixture now undefines snprintf/vsnprintf macros after including stdio; a local macro reproduction fails before the correction and passes after it, and the actual object plus sanitizer checks pass. Production checks remain unchanged.", "Run 71 compiled the A830 board but the early-console object check rejected compiler-generated bzero from whole-array initialization. Initializing only each string first byte removes that dependency. The actual console object regression detects the old memset dependency and passes after the fix; ASan/UBSan and display tests pass. Production runtime-helper and FP/SIMD checks are retained.", "Run 70 exposed a stale BootProgress selection: only Stage7Probe/PaganiInput used the working driver checkout, so the board compiler could not see the new status interface. The isolated profile now explicitly selects BootProgress too. A resolver regression fails before this correction and passes after it. Metal builds now require successful kernel compilation; Run 70 is not a bootable result.", "GPU diagnostics reuse the existing platform status overlay, retain startup failures across normal display logs, and use a nonblocking driver snapshot before disabling console interrupts. The CPU-only profile retains its existing two rows; no MMIO is added by the observer.", "A830 preboot probe v1 prints each pending MMIO address before access and retains raw GPUCC/SMMU values plus Result/CC/SMMU counts for a photograph. Result 1 skips SMMU when prerequisites are absent. A bus abort or hang can still stop the application. The local test artifact is out/oneplus13t/boot/stage7-gpu-probe/boot.img.", "Early framebuffer, root checkpoints and panic rendering remain enabled. Source-only diagnostics are separate from the prelinked userspace kernel.", "Build 39 reached the iPadOS UI; see STAGE6.md. The complete driver archive plan passes on macOS. The early boot-logo builder now reads the IPSW from the format-2 output root and compiles successfully. A host regression checks that the final link selects the RAMBlock object beside the configured archive; the final kernel/prelink and local firmware, payload and boot-image assembly have now passed; build 48 subsequently reached the UI and captured the UFS timeout panic. Its screenshot distinguishes the earlier busy sample from the later completed DMA snapshot; see STAGE6.md.", "Build-49 feedback reports no repeat panic while input and brightness remain unusable. pagani-peripheral-status=1 keeps KEYS/TOUCH/PANEL stages, hexadecimal result/sample and decimal successful report/command counts visible after display handoff. The same three rows refresh once per second and after frame copies; host tests cover opt-in behavior, bounds, preserved UI pixels and panic precedence.", "Power failures retain PWR address/hardware/slot and status/command snapshots in the existing two diagnostic rows. Successful first-read diagnostics add the actual SPI delay register. Host tests verify formatting, retained first-read evidence and frozen panic output; kernel compilation passed in build 56, while hardware readings remain pending.", "Build-56 kernel size is 127799296 bytes and SHA-256 is 42500cf7b10de6ef3f51c1114de5f31f7652c1697e4844d53d40d77bf0848121. Local checks passed for source pins, actual PWR/dly strings, packed/raw RAM Data integrity and matching UUID E9CAF07B-447E-4020-AF28-0E4B3A0B1296. Hardware readings await a separately authorized boot.", "Build-56 boot.img is 87953408 bytes, SHA-256 66aebc977d9558905f25851b8753e06556bb64f29df25a8d5feab3e970e3b5fd. Android header, embedded UEFI/FAT, matching kernel/trust/Data and ADT arguments passed readback. Fastboot Sending/Booting returned OKAY in 2.683s, without flashing; runtime diagnostics await observation.", "Build-56 readings are SPI RX n=4 h=001c10a5 a=0/0 rst=3 and SPI dma=1 ti=4 ri=4 st=0 dly=c800. These are fixed first-read snapshots. TOUCH v is the contact-ID mask and n counts accepted handleReport calls, not UI events. Add downstream binding/dispatch and X/Y observation in the next candidate.", "After valid touch parsing, two existing rows show HID binding bits, usage, dispatch/digitizer counts, edge starts, input/event X/Y and event mask. Protocol/SPI failure snapshots and panic freeze remain intact. Full binding is 0x1f; accepted reports and dispatched events remain separate from UI delivery.", "Build-57 kernel is 127803392 bytes with SHA-256 42dd53a4341d47ac5da894ae4ad1df02f7f5e5b5d7de5ee3b58ed07f0b744a87. Source pins, actual HID/XY/wait/bind strings, packed/raw Data integrity and UUID ADDC2464-BA09-47F6-B71E-EA117F2C0F73 passed local checks. Hardware readings await a separate boot instruction.", "Build-57 image readback verified the matching kernel and Data UUID ADDC2464-BA09-47F6-B71E-EA117F2C0F73. Fastboot Sending/Booting returned OKAY in 2.706s. The image directory contains fastboot-boot.log; TOUCH/HID/XY or SPI/PWR readings await user observation.", "Build-57 user feedback confirms working touch, but the HID binding/event counters and XY rows have not been transcribed. Preserve the verified image as the basic-touch baseline; detailed counters and gesture behavior remain unmeasured.", "Normal console writers use a nonblocking cross-CPU lock after VM setup; contended observations are skipped and a first-writer panic owner prevents another CPU from replacing its message. The opted-in platform overlay reports processor_count, processor_avail_count, timer/IPI bitmaps and RAM/free/available MiB in two rows. Touch status is disabled by default.", "Build 59 compiles the SMP console, passes first-panic ownership and contention tests, and contains the CPU registered/online, timer/IPI and RAM status formats. The actual runtime values have not yet been observed.", "The build-59 image enables the two CPU/RAM status rows and disables touch status rows. The user has been asked to transcribe registered/online CPU counts, timer/IPI masks and RAM MiB after the accepted temporary launch; no runtime values are recorded yet.", "The build-59 panic identifies pset0+0x100 on secondary affinity 0x200 but lacks a call trace. The device patch preserves the ownership assertion and appends compact IDs, ticket state and an eight-frame XNU backtrace. The host regression covers 0-8 frames, zero-filled unused entries, formatting and unchanged lock state; full compilation and hardware trace capture are pending.", "Build 60 contains the CPU/compact-ID/ticket and BT 0-7 formats in the actual linked kernel. The real diagnostic function passes 0-8-frame and unchanged-lock checks, and the actual renderer keeps all eight addresses visible. Hardware capture and the panic root cause remain pending.", "The matching build-60 image was temporarily launched. If the lock panic repeats, capture cpu/ctid/owner/tickets and all BT 0-7 addresses for symbolication against this exact kernel. No new device trace has been recorded yet.", "The build-60 photo provides all eight return addresses. Its own symbols and call instructions locate thread_select after Clutch steal on the thread termination path; current and owner compact IDs both equal f1d34. This identifies the recursive pset0 lock mechanism. The ownership assertion and bounded backtrace remain enabled for the correction.", "Build 62 retains the ticket ownership assertion, logical CPU/compact thread IDs, raw ticket state and eight bounded return addresses. Existing source and console tests pass, and the actual kernel contains the expected formats. Hardware verification of the scheduler correction remains pending.", "The build-62 image retains the CPU/RAM status rows and bounded ticket-lock trace while disabling touch status rows. Runtime CPU counts, timer/IPI masks or a new panic trace await user feedback after the accepted temporary launch.", "Normal SMP diagnostics retain try-lock behavior. Display ownership handoff now retries contention and aborts on panic ownership; the actual-code regression fails before the fix and passes after it with ASan/UBSan. Panic remains independent of a stopped console-lock owner. The slot-345 method is qualified against exact original instructions and its timeout format.", "Build 63 passes actual-code console contention and panic regressions with ASan/UBSan, including handoff success after the other writer releases and immediate failure when a panic owner exists. The normal log try-lock and first-panic retention remain unchanged. Hardware contention was not captured in the build-62 photograph.", "The build-63 image retains CPU/RAM status rows and the bounded ticket-lock trace while disabling touch status rows. Actual CPU counts, timer/IPI masks or a new panic trace await user feedback after the accepted temporary launch.", "The user read CPU reg=8 online=8 T=ff I=ff and RAM MiB=4096 free=24 avail=2368 from the build-63 overlay. The masks show historical nonzero per-core timer/IPI counts, not rate or cross-core stress coverage. The memory counters are dynamic snapshots.", "Follow-up to the 60 FPS target: negotiated overlay rows now write only changed glyphs at 4 Hz. First paint and legacy clients retain full writes. The actual console regression checks unchanged-cell sentinels, changed glyphs, odd pitch, bounds and panic; ASan/UBSan and Stage7 checks pass. All previously prepared mapping, heap and submit changes are retained; phone frame pacing is still pending.", "Run 80 source-only candidate follows Run 79 user-observed 15 FPS and 27.1 ms overlay cost: reuse six task mappings, preserve the diagnostic band at 4 Hz, retain nonzero method/status and map hits, forward Metal heap alias operations, and use elapsed-time-bounded shared queue backpressure. Local lifecycle, overlay and submit positive/negative regressions pass; production and real heap bridge checks run in macOS CI. Stable 60 FPS remains the hardware target.", "The next candidate retains cached Metal snapshots, pairs core method/status, labels fence poll misses, samples/rasterizes status at 4 Hz and copies cached pixels per frame. It reports requested GPU MHz, guarded Gen8 hardware busy, unknown active SP count out of 6 configured SPs, and separate GPU/CPU rates plus handoff/copy/overlay timing. Host regressions pass; full build and performance remain pending.", "The enhanced source-only candidate follows the pinned OnePlus GPU/GMU context-bank policy, selects invalid SMMU slots while preserving live firmware routes, removes optional contiguous searches for ordinary BOs, and connects the GPU presenter after self-tests with ownership and close/error fallback. Host SMMU, presenter, fragmented allocation, GPU context mismatch, GMU/HFI and power regressions pass; cloud build and local image assembly pending; no device operation authorized for this overnight candidate."]

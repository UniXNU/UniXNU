schema_version = 1

[device]
name = "oneplus13t"
soc = "SM8750"
os_profile = "ipados-17.7.11-21H461"
summary = "OnePlus 13T PKX110: build 63 device-confirmed system startup and normal touch, CPU reg=8 online=8 T=ff I=ff, RAM 4096 MiB; Clutch single-pset, read-only UFS root; cross-core stress and long-term stability unqualified."

[[area]]
id = "configuration"
status = "host-verified"
components = ["PaganiArmDTPlatform", "NativeAES", "NativeKeyStoreEvents"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore", "upstream.rev", "unixnu.lock", "drivers/*", "kits/*", "modules/*", "scripts/test-format2.py", "scripts/fixtures/**", "local.toml.example", "unixnu", "scripts/test-layout.py", "scripts/test-upstream.py", "scripts/prepare-xnu-source.py", "scripts/build-*.py", "scripts/build-*.sh", "scripts/audit-stage7-display.py", "scripts/original_stage7.py", "patches/unixnu-framework.patch"]
inputs = ["Four layers: ARM64, pinned sm8750, ipados-17.7.11-21H461, OnePlus 13T. Arrays are complete replacements."]
configuration = ["schema_version=2; soc_source=sm8750; complete component/fragment/archive arrays; configs/oneplus13t_defconfig."]
procedure = ["From UniXNU: defconfig oneplus13t_defconfig -D ../UniXNU-Pagani_SM8750; fetch; status --json; tree; run scripts/test-format2.py with the main scripts on PYTHONPATH."]
findings = ["Progress is preserved on device main. The d7dbaa0 seven-repository source snapshot matches all current shared-source diffs and additions byte for byte. The five remaining UEFI source/documentation changes are archived as .ci-inputs/uefi-pagani-progress.patch against 50b7313f40684aa25481cd109d7f48b9a50663fa, with exact apply/tree/reverse checks. Device records are committed directly. Existing CI inputs are unchanged; no new build or phone operation was performed.", "Main Metal run 3 (41316345393, d7dbaa0) passed production userspace/Data staging and actual macOS Metal heap, QoS, diagnostics, scanout-pixel and completion-protocol checks, reusing run 2's identical new kernel/base Data. The final local image passes paired kernel/Data/trust/UEFI and Android/FAT readback. New-image device performance is untested. UniXNU upstream main 6790e7c is merged as 888876f; Adreno740 a9a2cbb and AdrenoMetal 831a9dc are integrated with the local A830/iPadOS 17 changes. Source snapshot SHA-256 d15114cb1caa2d03817d586c561d70ce2a0d20697537b254a30516eb15507453 is published on device main.", "Main run 2 (41312611105) passed full kernel/prelink and iOS Turnip/Metal/plugin signing. Data staging stopped because build-metal-userspace.py still passed the removed upstream --clients argument. The caller now uses the current --publish BASE OUTPUT interface. Reuse this exact kernel/base Data for the userspace retry; actual host Metal checks and final boot packaging are pending.", "Main workflow run 1 stopped at a macOS user-client host link: the fixture lacked native_adreno_now_us, which production NativeAdrenoPublish already defines. The test now uses its existing simulated clock and the full Clang/ASan/UBSan A830 checks pass. Production sources are unchanged; rerun the complete candidate build.", "Synced UniXNU main 6790e7c (merge 888876f), Adreno740 a9a2cbb and AdrenoMetal 831a9dc while retaining iPadOS 17 and Gen8 boundaries. The candidate suppresses steady-frame progress traffic, adds compatible completion timings and observed software VSYNC counters, and keeps stock 525 MHz/SYSMEM. Local protocol, ownership, timing/status, console and cadence checks pass; production build and device bottleneck measurements are pending. See STAGE6.md.", "Run91 passed full kernel/Metal production builds and actual host heap, QoS, diagnostics and scanout-pixel checks. The local boot image passes matching kernel/Data/trust/UEFI and Android/FAT readback. No phone operation was performed; 525 MHz, sustained FPS and thermal behavior await device testing. The Metal profile uses 120 Hz software pacing, sysmem,nocb and disabled expensive diagnostics; the CPU baseline remains unchanged. Full Metal branch history is merged into main; future builds use main/metal.yml.", "Merged all 33 Metal-branch-only commits with the three main-only commits, preserving both histories and all structured record lists. Existing CI inputs are identical to the already-published branch. A830 builds now dispatch metal.yml on main; xnu.yml retains the CPU baseline. The two branch tips are synchronized at the merge.", "The actual display timer and fixed refresh attributes pass 60/120 Hz host checks, including notification cadence and teardown. This test-only follow-up does not change the Run91 production snapshot or establish physical panel refresh.", "Run 90 user confirms correct colors and readable logs: 389 MHz requested, 28-40 GPU presentations/s, no CPU fallback, three reused scanout mappings. Next candidate integrates upstream diagnostic gating, iOS runtime QoS and SYSMEM non-lazy allocations, requests stock 525 MHz with matched voltage/bandwidth, and uses 120 Hz software pacing. Panel timing and achieved FPS remain unverified; build/download only, no phone operation.", "Run90 passed production iOS Metal builds and real macOS/MoltenVK heap and scanout pixel checks. The local 100380672-byte boot.img (SHA-256 91cc316ac1edcf151643bf21cda08872b8244caa80a7351a61cbaafd4090f0d4) combines compute-band preservation with the device-confirmed SYSMEM color workaround. Matching Run86 kernel, Data UUID, trust, UEFI and final Android/FAT readback pass. New-image device logs and animation performance remain pending.", "Run88 SYSMEM-only control restored normal colors on device. User estimates 30-60 FPS during smooth interaction, with control-center/cold-launch stalls and unreadable logs still present. The candidate profile now selects sysmem,nocb until A830 GMEM correctness is qualified; Run90 combines this runtime flag with the compute-band fix.", "The Metal workflow now runs the actual scanout pixel regression after heap reuse, retaining the Run86 kernel for the userspace-only diagnostic-band rebuild.", "verify_only requires reuse_run_id and a completed Metal/Data artifact. It fetches the same pinned translator and reruns the real host heap test after test-only changes, preserving the completed production candidate.", "The Metal workflow can reuse a selected kernel-only Actions artifact for userspace rebuilds. It checks seed/config/kernel UUID agreement, retains the base Data, and fetches only the two hash-pinned original trust modules; full kernel builds remain the default.", "The next candidate follows upstream GPU parity with matching Adreno740/Metal/SMMU/GOP and runtime pins while preserving iPadOS 17 and prior buffer/overlay fixes. It replaces the 512 MiB BO pool with system pages, integrates per-process A830 SQE/AQE mappings, requests the original 389 MHz OPP with matched voltage/bandwidth, and reports the verified six-SP topology to Metal. Active SP count and stable 60 FPS remain unverified; production build is pending.", "The 60 FPS target is unverified. Comparison with current upstream and zeta retains existing TLB/audit and 16384-object fixes, adds the missing Metal heap alias bridge and elapsed-time-bounded shared submit backpressure, and keeps cache maintenance and completion ordering. Actual submit regression and old-code control pass; real heap bridge tests are wired into macOS CI. See STAGE6.md for references and limits.", "Run 78 passed all cloud regressions, production XNU/A830 compilation and prelink, and Metal/Turnip build and Data staging. The downloaded kernel hash matches the cloud result. Local out/oneplus13t/boot/metal-run-78/boot.img is 100495360 bytes with SHA-256 d6a3858561769553943822ae8d57deab0003d9419e2e82dc78bb931170455d4e. New SMMU/presenter/close-hook and diagnostic entries are executable strong symbols; Data UUID 4C02592E-3207-4785-967B-D8D1C5314E1B, original and owner trust, tested GFX UEFI, GPU-presenter boot argument and Android/FAT content readback pass. No phone operation was performed; device GPU startup, presentation and performance remain unverified.", "The enhanced candidate follows the pinned OnePlus bank policy (GPU 0/1 reserved, GMU from 2), selects invalid SMMU slots without disturbing live routes, removes optional contiguous searches for ordinary BOs, and connects the existing GPU scanout presenter only after GPU self-tests. Presenter ownership/close fallback and SMMU/allocator regressions pass on software peers; Run 78 full build and local image checks pass; hardware results are pending.", "Run 74 user feedback confirms system startup and visible GPU information after the recorded temporary boot. The exact GPU/M/CMD/API/DISP values and their changes during interaction have not been recorded; GPU execution and low-frame-rate improvement remain unverified.", "Run 74 passed all cloud contracts, the production early-console object checks, full kernel/prelink and Metal userspace builds. The paired image passes executable GPU diagnostics symbols, Data UUID, owner/original trust, tested GFX UEFI and Android/FAT readback. Windows fastboot accepted the temporary boot in 3.227 seconds without flashing. Visible GPU rows and actual rendering remain pending user observation.", "Run 73 passed all host contracts but the production console object still depended on bzero: XNU MakeInc.def enables -ftrivial-auto-var-init=zero. The GPU string buffer now uses explicit volatile byte clearing with a per-variable uninitialized attribute, retaining full initialization without a runtime helper. The object regression now uses the XNU automatic-initialization flag; it reproduces the prior failure and passes the correction, as do console ASan/UBSan checks. Production runtime-helper checks remain enabled.", "Run 72 stopped in the new host object check because macOS fortified stdio macros conflicted with kernel function declarations. The console fixture now undefines snprintf/vsnprintf macros after including stdio; a local macro reproduction fails before the correction and passes after it, and the actual object plus sanitizer checks pass. Production checks remain unchanged.", "Run 71 compiled the A830 board but the early-console object check rejected compiler-generated bzero from whole-array initialization. Initializing only each string first byte removes that dependency. The actual console object regression detects the old memset dependency and passes after the fix; ASan/UBSan and display tests pass. Production runtime-helper and FP/SIMD checks are retained.", "Run 70 exposed a stale BootProgress selection: only Stage7Probe/PaganiInput used the working driver checkout, so the board compiler could not see the new status interface. The isolated profile now explicitly selects BootProgress too. A resolver regression fails before this correction and passes after it. Metal builds now require successful kernel compilation; Run 70 is not a bootable result.", "The diagnostic Metal workflow runs the actual BootProgress console sanitizer regression in addition to existing A830/GMU/display checks. It uses the existing platform-status option and changes no GPU clocks, address windows or renderer publication policy.", "Four profiles select 18 components. PaganiInput and PaganiPanel are embedded in the ABI-qualified display archive and depend on QcomGeniSpi plus Sm8750Platform. Build 48 passed the complete configuration checks, driver compilation, final kernel link and prelink. Its source pins are device e6435b2bda6e91431f3bc0c442d1ff9c47be1451, main 42ffa07e9b82f7ffc37499392b2751e146647a6a, drivers 143e958bea8ae8ad7f47723cd105a589084f913d and SoC 9e90b16861612c0251c453ccbf6cf10592ea87e2.", "The documentation workflow checks out pinned driver submodules so repository-relative evidence links resolve during validation. Current pins include the UFS completion recheck. Build 49 passed cloud regressions, full kernel link and prelink; its matching boot image passed local assembly and readback. Build-49 hardware feedback is recorded below.", "Official UniXNU ae68700 is merged with the maintained 13T catalog. The J120AP/product-id identity and all selected XNU patches pass the updated format-2 contract. Build 49 was temporarily booted; the user reported no repeat panic during the observed test. Build 50 includes Setup completion preferences, upstream HID collection ordering and retained peripheral diagnostics. Cloud compilation, original/compiled ABI checks, full link/prelink and matching image readback passed; fastboot accepted the temporary boot, with runtime feedback pending.", "Build-50 hardware feedback confirms the lock screen after skipping Setup and working short/long power-key actions. Touch failed during TouchComm startup. Build 51 corrects SPI read bytes, detects v1/v2 and retains detailed protocol diagnostics below the camera cutout. Portable and cloud regressions, full compilation/link/prelink and matching image readback passed; fastboot accepted the temporary boot, with touch behavior awaiting observation.", "Build-51 hardware feedback reports first-transfer SPI timeout (T0 00 header, r=ffffff92, v=0, n=0). The next candidate exposes the existing pre-cancel GENI snapshot; its adapter and overlay regressions pass. Full compilation of this diagnostic update is pending.", "Build 52 reached input object compilation but the early-console dependency check rejected a compiler-generated bzero from the five-row stack snapshot. The renderer now copies one 80-byte row at a time. ARM64 automatic-initialization reproduction and host display/panic checks pass; build 53 subsequently passed the full production object and final kernel build.", "Build-53 feedback confirms GENI FIFO_IF_DISABLE=1 and a first-read timeout. The next candidate selects existing SE DMA for FIFO-disabled engines and supplies the board SMMU extent. Local transport, overlay and both SMMU build variants pass; full compilation and hardware DMA remain pending.", "Build 54 passed all component contracts, regressions, full compilation/link/prelink and image readback. Source pins: device fba1472, main 1397e2d, drivers 26a32f5, SoC b6706a5. Fastboot accepted the temporary boot; hardware DMA/touch feedback is pending.", "Build-54 hardware feedback reports T0 00 header r=ffffffb9 v=0 n=0 with no SPI error rows. The next candidate retains the first successful RX/header, GPIO levels and DMA counts. Local actual-adapter and overlay regressions pass; its full kernel build is pending.", "Build 55 passed all 18 component contracts, regressions, original/compiled ABI checks, full compilation/link/prelink and matching image readback. Source pins: device 664530f, main b689e9a, drivers 339d4df, SoC b6706a5. Fastboot accepted the temporary boot; first-read diagnostic values and touch behavior await observation.", "Build-55 hardware feedback confirms a completed four-byte SE DMA read with TX/RX length-in 4 and idle GENI state, but all RX bytes are zero. Touch still fails with -71 before HID startup. The next investigation compares stock Android power and SPI state.", "A read-only Android 16 baseline on the local 6.6.118 kernel confirms enabled 1.8 V/3.1 V touch rails and retained SPI logs with valid a5 frames. The OnePlus driver uses cs_clk_delay=50 and inter_words_delay=0; this port does not explicitly program SE_SPI_DELAY_COUNTERS. No runtime code or build-55 image changed.", "The next touch candidate adds board-owned RPMh resource names/voltages and SPI delays, with shared checked controller operations. Actual-adapter, power fault, transport and overlay regressions pass. Build 56 passed full cloud compilation and downloaded-artifact checks; this round ended without a device boot.", "Build 56 passed all 18 component contracts, regressions, original/compiled ABI checks and full kernel link/prelink in 20m13s. Source pins: device 3a12121, main ca164eb, drivers cab2d4d, SoC a06a072. The kernel and paired inputs are downloaded and locally verified; no image assembly or device boot was performed.", "After the user connected fastboot, the matching build-56 image passed local assembly and readback. Sending and Booting returned OKAY for fastboot boot, with no partition flash. Runtime touch/power feedback is pending.", "Build-56 hardware feedback confirms a valid S3910 identification header and successful kernel HID submissions (r=0, observed n=430), with a nonzero contact mask on press and zero on release. Lock-screen swipes and tapping Cancel in the power menu remain unresponsive. UI touch is not qualified.", "The next candidate pins drivers 6038f39 and main 5ae8fe4, with a standalone 13/4 touch descriptor, product-scoped event-driver matching and qualified 21H461 event dispatch. Host regressions and original ABI checks pass; full compilation and download are pending.", "Build 57 passed all 18 component contracts, host regressions, original/compiled ABI checks and full kernel link/prelink in 17m11s. Source pins are device ad6ed2d, main 5ae8fe4, drivers 6038f39 and SoC a06a072. The kernel and paired inputs are downloaded and locally verified.", "After the user connected fastboot, the matching build-57 image passed assembly and readback. Fastboot Sending and Booting returned OKAY in 2.706s without flashing. System startup and touch behavior await hardware feedback.", "After the build-57 temporary boot, the user confirmed that touch is working. Basic touch response is now device-observed for source ad6ed2d and the recorded build-57 image; detailed gesture and stability qualification remains incomplete.", "The next candidate selects eight SM8750 CPU affinities and the platform status overlay, disables the touch overlay and retains the 4 GiB owned window. The full patch chain, 18 component contracts, actual XNU topology lookup, 21 ARM64 assembly blocks, eight kernel-source checks and console/peripheral regressions pass locally. Cloud compilation and device validation are pending.", "Build 58 failed during bootstrap start.s assembly because HAS_CLUSTER exposed Apple-only CPU_OVRD accesses. The corrected SoC profile sets NO_CPU_OVRD=1. A regression compiling actual reset/resume assembly with the selected board header reproduces the old failure and passes after the fix; the full patch chain and 18 component/ADT contracts pass. Full recompilation and eight-core hardware validation remain pending.", "Build 59 passed all host contracts, actual reset/resume assembly checks, production object/ABI checks and full kernel link/prelink in 21m38s. Source pins are device 859dbce, main 13cc99b, drivers 3ba7f19 and SoC 76fb502. The kernel and paired inputs are downloaded and locally verified; no new boot image or device boot was performed.", "The matching build-59 boot image passed local assembly/readback, including eight actual ADT CPU affinities and all SMP arguments. Fastboot accepted the user-authorized temporary launch in 2.680s without flashing. System startup and CPU/RAM observations await feedback.", "Build-59 user feedback confirms a scheduler ticket-lock panic on MPIDR affinity 0x200 after the accepted temporary boot. The next device-only diagnostic patch retains the eight-core policy and adds lock identity plus a bounded call trace; full compilation is pending.", "Build 60 passed all cloud contracts, nine source-kernel regressions, production object/ABI checks and full kernel link/prelink in 11m49s. The exact device faa6aa2, main 13cc99b, drivers 3ba7f19 and SoC 76fb502 inputs are downloaded and verified. No build-60 image or device boot was performed.", "The build-60 image passed local assembly/readback and fastboot accepted the user-authorized temporary launch in 2.659s without flashing. Runtime behavior and the new CPU panic trace await observation.", "The candidate pins SoC 37ccfbe and main d967069 for the Clutch single-pset policy. All eight CPU affinities, two hardware clusters and the 4 GiB owned window are retained. The selected-source regression reproduces the old double lock and passes the correction. The full patch chain, 18 component contracts, eight-core ADT, actual reset/resume assembly and nine kernel-source checks pass; full compilation is pending.", "Build 61 stopped before kernel compilation because the new host fixture redefined the macOS SDK __unused macro under -Werror. The test now keeps an existing system definition with #ifndef; the actual single-pset kernel correction is unchanged. A fresh full build is required.", "Build 62 passed all cloud contracts, original/compiled ABI checks and full kernel link/prelink in 21m29s. Device c87bced, main d967069, drivers 3ba7f19 and SoC 37ccfbe match the downloaded inputs. The macOS fixture correction passes; no new device boot was performed.", "The matching build-62 image passed assembly/readback and fastboot accepted the user-authorized temporary launch in 2.671s without flashing. System startup and CPU/RAM observations await feedback.", "The display-timeout candidate pins drivers 14f50fc and main 52560be. The full patch chain, 18 component contracts, eight-affinity ADT, actual reset/resume assembly and Clutch single-pset regression pass locally. The touch implementation and 4 GiB window are retained. Full compilation is pending.", "Build 63 passed all cloud contracts, original/compiled ABI checks and full kernel link/prelink in 17m00s. Device 3c39baf, main 52560be, drivers 14f50fc and SoC 37ccfbe match the downloaded inputs. No new device boot was performed.", "The matching build-63 image passed assembly/readback and fastboot accepted the user-authorized temporary launch in 2.791s without flashing. System startup and CPU/RAM observations await feedback.", "Build-63 user feedback confirms system startup and normal touch with CPU reg=8 online=8 T=ff I=ff and RAM MiB=4096. This is tied to the recorded image and exact build-source pins; no runtime code or configuration changed after the test.", "Performance candidate after Run90: source-only bundle 7cb596187eca02ad044dce1b4454817cea74379610be9cf5b681416af01d9685; upstream Metal opt-in diagnostics, local iOS QoS/runtime trace patches, SYSMEM non-lazy allocation, stock 525 MHz and 120 Hz software pacing. Full kernel/userspace rebuild required; no phone boot until user returns. Physical refresh and 120 FPS unverified.", "verify_only requires a completed candidate via reuse_run_id and reruns host checks without changing production outputs.", "Run 82 candidate integrates the upstream GPU parity drivers, dynamic SMMU tables, system BO allocation and per-client GPU contexts while retaining iPadOS 17. A830 SQE/AQE mappings and Gen8 packet/counter fields are adapted; Metal exposes the six configured SP cores. The board requests the stock 389 MHz OPP with its level 60 and bandwidth index 4. Host A830/GMU/SMMU/presenter/Stage7 and submit-pressure regressions pass. Source-only archive: 229626 bytes, 7 repos / 62 entries, SHA-256 4109d2d4ed53b0bb0d141991209326cfbbfbeaa70369077f0452fdd162d40e77. Restore now applies and updates public submodule pins. Production and sustained 60 FPS checks remain pending.", "Run 80 source-only candidate follows Run 79 user-observed 15 FPS and 27.1 ms overlay cost: reuse six task mappings, preserve the diagnostic band at 4 Hz, retain nonzero method/status and map hits, forward Metal heap alias operations, and use elapsed-time-bounded shared queue backpressure. Local lifecycle, overlay and submit positive/negative regressions pass; production and real heap bridge checks run in macOS CI. Stable 60 FPS remains the hardware target.", "The enhanced source-only candidate follows the pinned OnePlus GPU/GMU context-bank policy, selects invalid SMMU slots while preserving live firmware routes, removes optional contiguous searches for ordinary BOs, and connects the GPU presenter after self-tests with ownership and close/error fallback. Host SMMU, presenter, fragmented allocation, GPU context mismatch, GMU/HFI and power regressions pass; cloud build and local image assembly pending; no device operation authorized for this overnight candidate.", "Run 71 compiled the A830 board but rejected bzero in the early console object. The source-only replacement initializes only string starts and adds an actual-object runtime-helper regression before kernel compilation. The old object depends on memset; the corrected object and console/display sanitizer tests pass. Existing firmware ciphertext and production object checks are unchanged.", "Run 70 found the diagnostic profile still resolved BootProgress from the old device pin. The replacement source-only bundle explicitly selects the working BootProgress; its real resolver regression fails on the old selection and passes on the fix. Metal now waits for kernel success. Firmware ciphertext is unchanged.", "The diagnostic workflow adds the actual console sanitizer regression and accepts a source-only bundle. It reuses the immutable, hash-verified Run 69 ciphertext and existing CI secret for the same firmware/DTB inputs."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["The main fork carries community catalog entries; stock upstream alone cannot resolve this selection."]
next_action = ["Keep build 63 as the verified eight-core baseline and validate further platform changes independently."]

  { kind = "host", reference = "STAGE6.md", command = "test-format2.py with actual ARM64 reset/resume assembly", revision = "19e9b8114df32c45b0b36fc32c187db24bf521c6", result = "Build 58 failed during bootstrap start.s assembly because HAS_CLUSTER exposed Apple-only CPU_OVRD accesses. The corrected SoC profile sets NO_CPU_OVRD=1. A regression compiling actual reset/resume assembly with the selected board header reproduces the old failure and passes after the fix; the full patch chain and 18 component/ADT contracts pass. Full recompilation and eight-core hardware validation remain pending." },

  { kind = "host", reference = "STAGE6.md", command = "Android/FAT/ADT readback of stage7-gpu-resources/boot.img", revision = "830e21446dd45a1b8c0c7b350221ce60e87c2379", result = "The resource-only DTS candidate retains all eight CPU affinities in ADT and the verified build-63 kernel. This boot confirmed system UI and touch, but supplied no new CPU counters or directed cross-core stress result." },

  { kind = "host", reference = "STAGE6.md", command = "./unixnu payload; ./unixnu bootimg; Android/FAT/ADT readback; fastboot boot", revision = "3c39bafed673ce1233f533e5b8193a1436d894a3", result = "The actual build-63 image retains eight CPU affinities, both hardware clusters, PSCI SMC and SMP/GIC/self-IPI arguments, with the binary-verified Clutch single-pset kernel. Fastboot Sending and Booting succeeded; registered/online counts and timer/IPI masks remain unobserved." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40520726310", command = "Actions build 63; download; actual display-vtable, Clutch-policy and paired Data checks", revision = "3c39bafed673ce1233f533e5b8193a1436d894a3", result = "The actual build-63 Clutch table retains multiple_psets_enabled=0 and the expected steal callbacks. All eight affinities and SMP arguments remain selected. Online counts and runtime stability are still unqualified." },
  { kind = "device", reference = "STAGE6.md", command = "User-reported build-62 panic photograph and confirmed slot/caller", revision = "c87bced3d8fba74f11c9f91ed6494fb741f29f90", result = "Build-62 user feedback reports a display slot-345 panic, not the preceding scheduler ticket-lock trace. No registered/online or timer/IPI values were supplied, so all-eight-core operation and scheduler stability remain unqualified. The single-pset policy is retained." },
  { kind = "host", reference = "STAGE6.md", command = "./unixnu payload; ./unixnu bootimg; Android/FAT/ADT readback; fastboot boot", revision = "c87bced3d8fba74f11c9f91ed6494fb741f29f90", result = "The actual build-62 image retains all eight CPU affinities, two hardware clusters, PSCI SMC and SMP/GIC/self-IPI arguments, with the verified Clutch single-pset kernel. Fastboot Sending and Booting succeeded; registered/online counts and timer/IPI masks remain unobserved." },
  { kind = "host", reference = "https://github.com/IssacL04/UniXNU-Pagani_SM8750/actions/runs/40505777459", command = "Actions build 62; download; source-pin, linked Clutch policy and paired Data verification", revision = "c87bced3d8fba74f11c9f91ed6494fb741f29f90", result = "The actual build-62 Clutch dispatch table has multiple_psets_enabled=0, compared with 1 in build 60, with both steal callbacks still matching their symbols. The existing pset_create gate shares the boot pset across all eight CPUs while retaining both hardware clusters. Selected-source regression and full compilation pass; eight-core online counts, interrupt coverage and runtime stability remain unqualified." },
  { kind = "source", reference = "STAGE6.md", result = "Build-60 hardware trace has CPU 2, ctid=owner=f1d34, tickets=b0ae0144 and thread_select+0x84c reacquiring pset0 after Clutch steal. The selected callback returns without unlocking; two hardware clusters had enabled two psets and exposed that stub. The SoC correction disables Clutch multiple_psets_enabled, using the existing pset_create gate to share pset0 across all eight CPUs while preserving real hardware cluster IDs. The selected-source regression reproduces the old failure and passes this policy; hardware validation is pending." },

[[area]]
id = "cpu"
status = "device-verified"
components = []
paths = ["package/CpuFreq*", "scripts/*armcpu*", "drivers/ArmCpu/**"]
inputs = [
  "SM8475 eight-core MPIDR table from the vendor device tree: 0x000..0x700 with Aff1 equal to the core index.",
  "PSCI CPU_ON targets and the ADT per-CPU reg values; GIC range, timer frequency and IPI configuration from the SoC dtsi.",
]
configuration = [
  "board.toml [payload] cpus = 8.",
  "dts/mondrian.dts must not override the SoC dtsi cpu nodes; the ADT generator needs their compatible string and unixnu,cluster-type.",
  "PSCI CPU_ON uses the same MPIDR value as the ADT per-CPU reg.",
]
procedure = [
  "Start the boot CPU, then start CPU 1..7 through PSCI and record each `ArmCpu: CPU N PSCI start PASS result=0` line.",
  "Verify that each secondary reaches its own entry checkpoint and serves a timer interrupt before claiming per-core completion.",
]
findings = [
  "The SM8475 hardware MPIDRs are flat: 0x000..0x700, Aff1 = core index. The vendor device tree and the Android tree carry the same table, and this firmware rejects every CPU_ON target outside it. The 4/3/1 A510/A710/X2 grouping in Android sysfs is L2/L3 cache topology, not MPIDR affinity.",
  "A starting core is matched to its cpu data by MPIDR & 0xFFFF against the ADT per-CPU reg, and the same value is the PSCI target, so the ADT must carry the real MPIDRs.",
  "usblog-20261111-233246 reports `ArmCpu: CPU 1 PSCI start PASS result=0` through `CPU 7`, so all eight cores start.",
]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["All eight cores start through PSCI; per-secondary timer/IPI checkpoints beyond the entry are not yet instrumented. The 2026-11-11 capture has no recorded source revision; revision pending."]
next_action = ["Add a per-secondary timer/IPI checkpoint and record it on the next boot."]
evidence = [
  { kind = "device", reference = "README.md", command = "scripts/k60-device.sh boot E:/k60-work/usb-a-stage/out/boot-v15-20261108.img", revision = "0000000000000000000000000000000000000000", result = "usblog-20261111-233246 (sha256 A6165F2404568C1D3D6C44EC1E71DB59039FF03CC2A1FE573692D231336EA51A): ArmCpu CPU 1..7 PSCI start PASS result=0; all eight cores online." },
]

[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["docs/audits/MEASURED-HIGH-WINDOW-2026-11-02.md", "dts/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*", "probes/**", "scripts/build-window-*", "scripts/test-window-qemu.py"]
inputs = [
  "SM8475 DRAM map from live serial: six RAM banks with a 28 GiB hole at 4..32 GiB; the unit has 12 GiB installed.",
  "Reserved regions owned by UEFI/DXE and the loader's DarwinBoot window; SMMU and DMA ownership.",
]
configuration = [
  "board.toml [payload] dram_size = 0x140000000; [payload.adt] owned_memory_size = 0x130000000 (4.75 GiB window).",
  "dts/mondrian.dts memory nodes and the loader memory map must describe the same banks and reservations.",
]
procedure = [
  "Read /memory/reg from live serial and rooted /proc/iomem; compare with the loader window before changing owned_memory_size.",
  "Boot a candidate window and record mem=actual=managed plus the loader's `window ... bytes at pa ...` line.",
]
findings = [
  "Live serial-6033dbec /memory/reg and rooted /proc/iomem give six RAM banks with a 28 GiB hole at 4..32 GiB. The installed 12 GiB cannot be one XNU window: the longest contiguous unreserved run is 8.65 GiB (0x840000000..0xa69b78000).",
  "The 4 GiB window booted XNU at mem=actual=managed=4096 MiB. An 8 GiB window (arena equal to the whole 8 GiB) was refused: DXE occupies part of the arena, so DarwinBoot returned to the UniXNU menu.",
  "An 8.625 GiB arena [0x840000000,0xa68000000) with a 7 GiB window is accepted: the loader printed window 0x1c0000000 bytes at pa 0x8400200000 and HANDOFF EXIT RETURN 0. DarwinWindowSizeValid caps a window at 8 GiB, so 12 GiB is not reachable at all.",
  "board.toml now declares the next ladder step, a 4.75 GiB window (owned_memory_size = 0x130000000), after a 5 GiB window reported NO WINDOW.",
]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["The 4 GiB window and the 8.625 GiB arena are the measured configurations; the current 4.75 GiB window has no device capture yet, and 12 GiB is physically impossible as one window. The 2026-11-11 capture has no recorded source revision; revision pending."]
next_action = ["Boot the 4.75 GiB window and record mem=actual=managed plus the loader window line before updating this area to device-verified."]
evidence = [
  { kind = "host", reference = "docs/audits/MEASURED-HIGH-WINDOW-2026-11-02.md", command = "python3 repair-high-window.py; build-uefi-8g.sh; build-kernel-summary.sh; package-textonly.py", revision = "48abe35d0a0a57f5fea9f9ba1e570800021ae6b1", result = "8.625 GiB arena and 7 GiB window; strict v4 round trip PASS; image sha256 8ea52daf4b3e926d4840e13a73fa00c9cadf9b3f1e97e1ececfdaa446e1afc34." },
  { kind = "device", reference = "docs/audits/MEASURED-HIGH-WINDOW-2026-11-02.md", command = "fastboot boot /mnt/e/k60-work/candidates/7g/boot-ios16-7g-textonly.img", revision = "e06211de59325bbd086c312324bdbf40e21d1045", result = "Loader accepted window 0x1c0000000 bytes at pa 0x8400200000 and HANDOFF EXIT RETURN 0; console output from XNU not yet observed." },
]


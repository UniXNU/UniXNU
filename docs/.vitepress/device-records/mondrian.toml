  { kind = "device", reference = "docs/engineering/PITFALLS.md", command = "scripts/k60-device.sh boot E:/k60-work/usb-a-stage/out/boot-v15-20261108.img", revision = "0000000000000000000000000000000000000000", result = "P-124/P-125: INT low 16 times; 0x10308 64-byte snapshot identical; 0x10400 changed 551 bytes between snapshots; touch points stay 0." },

[[area]]
id = "input"
status = "implemented"
components = []
paths = ["drivers/ShengHidInput", "drivers/ShengNovatekTouch", "package/*Touch*", "package/*Button*", "scripts/*touch*", "scripts/*hid*"]
inputs = [
  "Goodix GT9916R Berlin-D on SPI SE4 (990000.spi); TLMM GPIO 20 reset and GPIO 21 INT; IOVDD pm8350c_l2 and AVDD GPIO71.",
  "Config blob goodix_cfg_group_m11a.bin (ic=Berlin, cfg_type=1, sensor=255, pid=9916R, 1488-byte payload).",
]
configuration = [
  "board.toml kernel_args k60_touch_se=19; dts/mondrian.dts touch node compatible xiaomi,m11a-spi.",
  "Poll cadence changed from 2 ms to 20 ms in the touch patch; the read window is 0x10000..0x107FF.",
]
procedure = [
  "Power the rails through RPMh ACTIVE TCS4; use GPIO bit-bang SPI mode 0 with a 2 us half-period; probe 0x10000 for the BRL identity string.",
  "Download the 1488-byte config to fw_buffer_addr 0x1205c, then poll touch_data_addr 0x10308 every 20 ms and snapshot 0x10400 for raw frames.",
]
findings = [
  "The chip is a Goodix GT9916R Berlin-D. The protocol is BRL: 0x10000 reads `BERLIN 9916R 05.80.02.63`, while GTP registers 0x8140, 0x8047, 0x804E and 0x814E all return 0x00. `goodix_ts` is only the module name, not the protocol.",
  "Power: TLMM window 0x80000 + RPMh ACTIVE TCS4 + CMD_STATUS criterion; rails come on without timeout.",
  "SPI: SE4 (990000.spi) is GSI-only and its FIFO is disabled by hardware, so the driver uses GPIO bit-bang (mode 0, 2 us half-period). dev_confirm writes 8 x 0xAA to 0x10000 and reads them back consistently.",
  "Config: `CFG-START state=80 ack=80 OK-config-ready`; `CFG-DL wrote=1488/1488 bad=0 -> DATA-OK`; `CFG-WRITE ack=80 OK`; `CFG-EXIT ack=80 OK-config-applied`; `CFG-RESET re-handshake OK (rb=01)`.",
  "The chip is scanning: INT goes low 16 times and the 0x10400 raw-frame area changes by 551 bytes between snapshots. The 0x10308 touch report area never changes and its first byte stays 0x00, so no touch point is produced.",
]
completion = ["Touches map to the display, simultaneous contacts keep stable IDs, release events arrive, and buttons produce expected HID reports."]
limits = ["Touch points remain zero: 0x10308 first byte stays 0x00 although 0x10400 raw frames change by 551 bytes. The 20 ms poll cadence is not yet device-verified; the 2026-11-11 capture has no recorded source revision (revision pending)."]
next_action = ["Boot with the 20 ms poll, snapshot 0x10000..0x107FF on each INT-low event, and record whether 0x10308 becomes non-zero; if it stays zero, decompile vendor goodix_core.ko for the real startup sequence."]

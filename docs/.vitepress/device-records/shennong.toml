schema_version = 1

[device]
name = "shennong"
soc = "SM8650"
os_profile = "ios-27.0.1-24A446-iphone16pro"
summary = "Xiaomi 14 Pro (23116PN5BC)。UEFI 菜单稳定（v6）；iPadOS 17.7.11 供体上 XNU 走到 vfs_mountroot、UFS/SMMU/GPT/SHNGROOT 根卷已真机验证。当前供体 iPhone17,1 iOS 27.0.1（arm64e，XNU 12377.121.6）卡在开 MMU 之前的 trampoline 窗口，持久日志与实机镜像重建见 docs/agent-progress.md。"

[[area]]
id = "configuration"
status = "host-verified"
components = ["ArmDTPlatform", "XnuPrelink"]
paths = ["board.toml", "configs/**", "feeds.toml", "dts/**", "scripts/make-shennong-adt.py", "scripts/apply-prelink-slide.py", "scripts/prelink-storage-bindings.json"]
inputs = ["SM8650 / shennong 的 board.toml 身份字段：name=shennong、soc=SM8650、os_profile=ios-27.0.1-24A446-iphone16pro", "SoC feed 固定为 UniXNU-sm8550-common 的 pin（SM8650 与 SM8550 的 UFS GCC 偏移完全一致）", "板级 ADT 由 scripts/make-shennong-adt.py 生成，只含 cpu0 与必要属性"]
configuration = ["board.toml：schema_version=2；[kernel].archives 使用 component: 语法；[kernel.prelink].slide=-0x1000000", "defconfig：CONFIG_XNU_NATIVE_UFS=y、CONFIG_XNU_BOOT_PROGRESS=y、CONFIG_XNU_ARM_DT_PLATFORM=y、CONFIG_XNU_SOURCE_MOCKFS=y、CONFIG_XNU_SOURCE_CORECRYPTO14=y", "payload 的 ADT 在 CI 中被板级树覆盖（mcopy 覆盖 kernel.macho.adt 并回读 sha256 校验）"]
procedure = ["Actions → kernel → Run workflow；job 内先跑第一遍 bootstrap，再打补丁、重建归档，跑第二遍正式 kernel", "量取 IOStorageFamily 绑定：scripts/scan-prelink-storage.py --ipsw <IPSW> --device-class j120ap --tree <TREE> --output scripts/prelink-storage-bindings.json", "按 slide 平移并提交：scripts/apply-prelink-slide.py --bindings … --board board.toml"]
findings = ["schema_version 升到 2 后，payload 的 ADT 改由 IPSW 设备树派生，会带回 iPad 的 /cpus，导致 AppleARMCPU 认领失败并 panic；必须用板级 ADT 覆盖", "绑定表量自原厂 kernelcache，而 prelink 会把每个组件平移 [kernel.prelink] slide；不平移时绑定的构造函数落在零字节上", "量出来的 pin 必须提交回仓库：构建消费的是仓库里的 pin，流水线只在构建后才测量"]
completion = ["所有源码 pin 可解析；组件与 patch 顺序在记录中可见；CI 两条 pass 均能产出 kernel.macho 与 payload.img"]
limits = ["配置层的真机验证只覆盖到 vfs_mountroot 与存储栈；显示/输入等子系统的配置尚未开始"]
next_action = ["根窗口发布通过后，为显示与输入补配置项（framebuffer、touch）"]
evidence = [
  { kind = "host", reference = "docs/handoff/UFS-E3-2026-11-05.md", result = "CI 解析 board.toml、选入全部组件并产出 kernel.macho 与 payload.img", command = "Actions kernel run 42003983808", revision = "14eaf555283f05334555ca596c56d32069156f3e" },
]

[[area]]
id = "firmware"
status = "device-verified"
components = []
paths = ["package/**", "docs/bringup.md", "scripts/repack-v0-bootimg.py"]
inputs = ["Mu-Silicium shennongPkg（不在本仓库）构建的 UEFI 固件卷 SILICIUM_UEFI.fd，0x300000 字节", "boot image 采用 header v0 + gzip(BootShim+FD) + append_dtb，模板取自本机固定镜像", "DTB 由 FD 内置，不依赖 ABL 的 vendor_boot"]
configuration = ["fastboot boot 直接启动 boot image；不写 boot/vendor_boot 等引导分区", "panic 屏由 payload 内的 BootProgress 组件直接绘制到帧缓冲"]
procedure = ["python3 scripts/repack-v0-bootimg.py --template Mu-shennong-smp.img --payload payload.img --out Mu-<variant>.img", "usbip 把设备接进 WSL 后：fastboot boot Mu-<variant>.img"]
findings = ["UEFI v1–v6 的失败点依次是 PmicDxe、UFSDxe（初始化期 UFS Sleep）、SPMIDxe 打偏、电源链连带、菜单二次重绘；修法见 docs/bringup.md", "header v4 在 fastboot boot 场景拿不到 ABL 的 DTB，必须用 v0 + append_dtb"]
completion = ["固件构建、进入 UniXNU、稳定显示菜单、发布帧缓冲并保留内存保留区"]
limits = ["UEFI 固件不在本仓库，无法由 CI 复现；boot image 组装依赖本机模板"]
next_action = ["把 UEFI 固件的构建输入（shennongPkg 配置与补丁）单独整理并记录到可复现路径"]
evidence = [
  { kind = "device", reference = "docs/bringup.md", result = "UEFI v6 菜单稳定显示 10 秒，logo 清晰", command = "fastboot boot Mu-shennong-6-pmgr2.img", revision = "14eaf555283f05334555ca596c56d32069156f3e" },
]


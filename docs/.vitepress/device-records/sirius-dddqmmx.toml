[[area]]
id = "packaging"
status = "implemented"
components = ["XnuPrelink"]
paths = [ "scripts/make-uboot-payload.py",  "scripts/build-xnu-4k-baseline.sh",  "dts/**"]
inputs = [
  "The payload FAT volume is the flashed artifact of this port; there is no boot.img.",
  "The prelink inputs (kernel path, roots, slide, early security initializer) come from the OS profile; the board does not override them.",
]
configuration = [
  "[payload] sets volume SIRIUSESP, 256 MiB, loader = payload, dram_size and the kernel command line.",
  "[payload.adt] keeps only chip_id: the platform seed is supplied per build with --unique-chip-id when the userland stages need it.",
]
procedure = [
  "./unixnu build kernel, ./unixnu build package, then bash scripts/build-darwinboot.sh (or the CI workflow), ./unixnu build payload, and finally make-uboot-payload.py --output the volume to flash.",
]
findings = [
  "The Linux namespace build successfully prelinks candidate kernel b94137f50c1558336e7df296ffd1157a1d4b0a850b8b9458b5b52d223c1ad971 and assembles payload a5620f295a09ca8ca6d179d12669777cf2d8356b42307505a7c4bd39a61709bb. This candidate has not been flashed. Board archive recipes bind display/HID ABI and add the real keystore, cpufreq, touch and GMU sources.",
  "The eMMC probe ships in the same force-loaded archive as the USB console, so the package list and payload layout are unchanged.",
  "Format 2 generates kernel.macho.adt from the DTS, so the legacy ADT script is retired; make-uboot-payload.py still finishes the volume because U-Boot needs the EFI binaries inside it.",
  "scripts/build-xnu-4k-baseline.sh is a copy of the UniXNU script with one board deviation: the boot-progress interlock only requires the source crypto provider.",
  "The legacy build applied patches/xnu/*.patch by glob (56 files); format 2 applies only what the series list names, and the ARM64 and OS series assume the two files they omit are present. native-smp-secondary.patch sets MAX_CPUS 8 and Affinity1 core numbering; sheng-platform-power.patch supplies the bsd_init.c block that zzz-boot-progress.patch quotes as context (CONFIG_XNU_SHENG_PMGR is off, so its code compiles to nothing). Both now live in the sdm710 SoC series, which applies before the OS series.",
  "The first format 2 kernel build on Linux failed at the last patch, zzz-boot-progress.patch, with a bsd_init.c context mismatch: the missing piece was sheng-platform-power.patch, not the moved native-smp-secondary. With both in the SoC series the whole series applies and the kernel prelinks: kernel.macho 50 MB, __TEXT 0xfffffff007004000, 30 kernelcache components, 69294 bindings.",
  "The kernel step also runs on Linux through UniXNU's toolchain installer, which builds a patched LLVM, cctools-port ld64, MIG, iig and lzfse. That installer writes /opt/unixnu-linux, /usr/bin shims and distribution packages, so this port runs it inside a Podman image (containers/xnu-linux/) and leaves the host untouched. The alternative, Allenwdk/xnu-linux-toolchain, uses the system clang with portable-kalloc-type-builtins.patch and cctools-port, but needs a path-layout adapter for the driver's checks.",
  "The first flashed build hung on hardware with the entry probe's blue bar and no magenta bar. The cause was a defconfig override, not the kernel sources: CONFIG_XNU_NATIVE_ARCH_TIMER=n. build-xnu-4k-baseline.sh sets NATIVE_ARCH_TIMER=${XNU_NATIVE_ARCH_TIMER:-${XNU_ARMCPU:-0}}, so the legacy build ran with 1; at 0, architectural-timer-entry.patch compiles the BCM2837 local interrupt router write (0x40000040 + cpu*4, Raspberry Pi local peripherals) into start.s. SDM710 has nothing at that address, and the store aborts before the MMU is on. The defconfig now leaves the ARM64 profile value (y) alone and documents why.",
  "Diagnosis method worth repeating: the legacy kernel from payload-full.img boots with this repository's new UniXNU.efi, DarwinBoot.efi and DTS-generated ADT (it reaches _sleh_irq and panics on the known early timer PPI), so the EFI side and the ADT are sound and the regression is in the kernel build. Comparing the two kernels' start_first_cpu bodies then showed the extra router write as the only semantic difference.",
  "With the timer override removed the Linux-built kernel boots past the MMU on hardware: the boot-progress panel reports TOPO boot=0 max=7 nums=01234567, the console reaches IOKit (PE_init_iokit, IONVRAM initImageFormat) and then the CPU takes an IRQ it cannot dispatch. lr 0xfffffff00741754c is _sleh_irq+0x70, the same NULL per-CPU handler the legacy kernel hit.",
  "That IRQ is DarwinBoot's early timer PPI. GIC_SGI_PPI_ENABLE included bit 19, so the EL1 virtual timer fired before ArmCpu::start installed the handler. DarwinBoot now enables SGIs 0..15 only and leaves INTID 19 to ArmCpu (armcpu-timer-intid=19), which is what the handoff's next step asked for.",
  "With the timer PPI left to ArmCpu the next stop was AppleARMPlatform's CPU class: it matches cpu0..cpu7 because IODTPlatformExpert compares IONameMatch by prefix ('cpu' matches 'cpu0'), starts first, and panics with 'CPU configuration in device tree is invalid' (its AppleARMCPU.cpp validates max_cpus, cpu-id, interrupts and function-* properties that an Apple device tree carries). The native ArmCpu personality (IOPlatformDevice, probe score 2000) did not win that match even after probe() added 40000, so make-uboot-payload.py rewrites the AppleARMCPU IONameMatch from cpu to xpu in the personality plist inside kernel.macho (equal length, nothing moves).",
  "A frozen panel is not proof of a hang: the panel repaints from the timer interrupt, so before ArmCpu enables the timer PPI the last painted second stays on screen while the kernel may still be running. Checkpoints (armcpu-panic=N, panics at entry/prepareGic/registration/controller/initCPU/registerService) are what distinguish the two.",
  "ArmCpu::start then failed inside initDistributor: it re-ran the quiesce sequence (GICD_CTLR &= ~3, wait, restore with ARE) over the state DarwinBoot had already programmed, which clears the group enables and leaves the core with no interrupts at all; the boot then sits in IOKit matching with a frozen panel. The fix keeps the firmware state when GICD_CTLR already reports affinity routing plus group 1 and only quiesces the SPIs. After it the panel advances (time=31s, IRQ=1076) and the kernel reaches bsd_init with TOPO boot=0 max=7, PROBE calls=17 acc=8 num=7 reg=700 - eight CPUs online.",
  "The next blocker is AMFI: 'AMFI: No PMGR?' @ConfigurationSettings.cpp:235. The unchanged target AMFI finds the PMGR through IOService::serviceMatching(\"ApplePMGRNub\") + waitForMatchingService, then reads the provider at nub+0x88 and calls its readAon/writeAon slots (OR bit 2). The original classes are ApplePMGR (storage 0x4b8a8) and ApplePMGRNub (0x740); UniXNU/scripts/audit-amfi-pmgr-contract.py pins the exact instructions. amfi_get_out_of_my_way=1 does not skip the check. Two routes remain: instantiate the original classes the way UniXNU-sheng does (OSKextLoadKextWithIdentifier + a generated OriginalPMGRABI.h + a published nub), or patch the AMFI block in the prelinked kernel.",
  "AMFI is cleared without touching the target kernel: the nub helpers behind AMFI's readAon/writeAon return 0 when the provider stored at nub+0x88 is NULL, so publishing a real but provider-less ApplePMGRNub satisfies the latch (read 0, OR 4, write no-op). package/SiriusPmgr.cpp allocates the class through OSMetaClass::getMetaClassWithName + alloc + init, attaches it to the platform and registers it from the sheng_pmgr_run hook in bsd_init (CONFIG_XNU_SHENG_PMGR=1, sheng-pmgr=2), and its build script writes the archive to build/sheng-platform-power/libShengPlatformPower.a because build-xnu-4k-baseline.sh force-loads exactly that path.",
  "With AMFI satisfied the boot passes bsd_init and stops at 'Failed to mount root device' @IOKitBSDInit.cpp:984 with 8 CPUs, IRQ=2145, 61 s of live uptime: the kernel now runs to the point where it needs a storage driver and a root filesystem, which this board does not have yet (no UFS or VirtIO block component, no APFS container on the payload volume).",
  "scripts/build-xnu-4k-baseline.sh also builds the owner SystemOS union mount in its bring-up mode (XNU_BRINGUP_OWNER_CACHE): the board has no owner root chain yet, and the eMMC windows authorize the mount only under sirius-allow-unverified=1. The same script's Data mount switch accepts the bring-up mode, so the Data seed the macOS runner builds can be mounted at /private/var.",
  "The same build script compiles the Data seed path for this board (XNU_SIRIUS_DATA_SEED): kern_exec.c gets XNU_NATIVE_RAM_BLOCK=1 for the typed seed API without linking RamBlock, whose archive needs the native AES storage closure this board does not build; NativeEmmc provides the implementation.",
]
completion = [
  "The kernel prelinks against the pinned 21H461 kernelcache, the payload contains the kernel, the ADT and the DarwinBoot driver, and the flashed volume boots from U-Boot.",
]
limits = [
  "The kernel step needs macOS and Xcode, or the container image with UniXNU's Linux toolchain; the board script must be re-based on the upstream script when UniXNU changes it.",
]
next_action = [
  "Run the new payload once and diff the generated ADT against the legacy one before flashing.",
  "Boot the prelinked kernel on the phone and record the stage rows; the build side is now reproducible on Linux (container image, see downloads).",
]
evidence = [
  { kind = "source", reference = "docs/HANDOFF.zh-CN.md", result = "Build and deploy loop, the CI kernel artifact and the payload layout on the vendor partition." },
]

[[area]]
id = "diagnostics"
status = "implemented"
components = []
paths = ["scripts/tests/**", "scripts/agent-*.sh", "docs/HANDOFF-AGENT*.md", "package/**", "scripts/patch-xnu-entry-probe.py", "scripts/xnu-panic-screen.c", "scripts/capture-usb-console.py", "docs/HANDOFF.zh-CN.md", "docs/evidence/**", "patches/xnu/**", "scripts/build-sirius-emmc.py"]
inputs = [
  "The panel and the serial console are the two evidence channels; since the DWC3 CDC console works, the host captures the kernel log directly and photographs are only a fallback.",
]
configuration = [
  "panic_screen = true patches the entry probe and the panic screen into the payload kernel.",
  "boot-progress=2 draws the kernel console lines; debug=0x14e keeps the debug output on.",
]
procedure = [
  "Record the last checkpoint printed on the panel and in the U-Boot/XNU log for every boot, with the kernel and payload hashes of that run.",
]
findings = [
  "End-to-end unattended debug loop and Setup boot verified on local hardware (kernel ad6a9709..., payload afa7def2...): agent-flash.sh sends FASTBOOT over /dev/ttyACM0 to return XNU to ABL fastboot in 4-7 s without button presses, flashes vendor, reboots into XNU, and capture-usb-console.py records the in-kernel 8 GiB APFS containerResize, zero ENOSPC, Setup launch at 294.6 s, AppleKeyStoreState activity (100 opens, 1430 calls), IOHIDEventDriver attachment (stage 4), and 5514 accepted frame copies (~19 fps). See docs/evidence/sirius-20261030-local-boot.md.",
  "The previous ios-ui-up verdict was a false success based only on process launches: the same capture reports ENOSPC and only six confirmed frame copies. A later 12-second capture received zero bytes, and a nine-byte FASTBOOT request did not produce a fastboot device. USB corrections derive received length from completed TRB residual bytes, parse exact newline commands across packets, and serialize pollers. USB and mock flash failure regressions pass; hardware verification of the new image is pending. See docs/evidence/sirius-20261030-local-boot.md.",
  "A register write-and-read-back test is the next diagnostic for the eMMC data phase, because SDHCI_TRANSFER_MODE reads back 0x33 after writing 0x13, which separates a write the vendor layer ignores from a command that is never sent.",
  "The eMMC probe reports every step (controller registers, the clock tree, the response registers around CMD0/CMD1 and each failure) into the USB console ring, which is how the card clock and CMD2 findings above were obtained without a photograph.",
  "The eMMC probe reports through sirius_usb_log_char() straight into the USB console ring, because kernel console output stops reaching the ring long before bsd_init runs.",
  "Stage bands (entry, pre-MMU, panic) and the TOPO/PROBE/MEM rows replaced the LED and UART guessing of earlier bring-up.",
  "A panic snapshot forces a panel re-render at panic time; before it, rows could show a stale frame.",
  "The USB panel row names its fields after what they hold (step, txev, rxev, chars, echo, poll) instead of the register names they were first wired to, so a photograph can be read without the source.",
  "The CDC console hands the console ring to the host once per attach: the pump timing that works (a short inline poll loop that breaks after the ring is drained) delivered the 3813-byte boot log on every attempt, while longer loops and a DTR-gated pump delivered nothing, so that timing is treated as load-bearing until the periodic path runs during bsd_init.",
  "The post-exec wait is instrumented on the kernel side rather than through the driver: sirius-post-exec-trace.patch prints the exec thread-switch flags, every user thread start (from thread_bootstrap_return, so one line means the exec'd thread never ran and two mean it did), the first pid 1 syscalls with their returns, every bsd_ast for pid 1 and the first user faults after the exec, and the eMMC heartbeat prints the counters so one capture answers the question.",
  "The exec does not stall after activate: load_init_program prints the scratch page (0x1000, the first free page of the init map), then the init thread is inside copyout() and takes 62,673,044 faults in about a minute while it stays TH_RUN, so the wait is a tight fault-retry loop, not a sleep.",
  "PAN is not the cause: the kernel reports PAN implemented with PSTATE.PAN already 0, and CONFIG_XNU_NATIVE_PAN=n compiles copyio's user_access_enable()/disable() away anyway, so nothing in this kernel ever sets it.",
  "The mapping is not missing either: the first fault is a level-1 translation fault, but afterwards pmap_find_phys finds the page, AT S1E1W resolves the same address and vm_fault returns KERN_SUCCESS, while the retried store faults again as a level-3 permission fault; the raw leaf PTE the pmap holds is now dumped next to ESR/FAR/PC to see which AP bits it carries.",
  "The pid 1 kernel stack, dumped out of band by the heartbeat and symbolized against mach.development.bcm2837.unstripped, shows _bcopyout+0x38 under _load_init_program_at_path+0x6c under _bsdinit_task+0x74, which is the copyout of the launchd path.",
  "The loop is not limited to the copyout: with the trust-cache bundle back in the payload the exec completes (execve activate 0, AMFI answers nothing) and the exec'd thread enters userland at pc 0x100924e50, where it takes 92 million instruction aborts in about a minute on three addresses (ESR 0x82000007, level-3 translation faults) without ever issuing a syscall or a single block read; the entry point is right, the code pages are simply not visible to the CPU.",
  "Both loops have the same shape: vm_fault opens the page in thread->map's pmap and returns KERN_SUCCESS, while the CPU keeps taking the fault. AT S1E1W and pmap_find_phys disagree about the physical page behind 0x1000, which points at the CPU running with a pmap that is not the thread's after the exec task switch.",
  "A payload built without --trust-cache leaves the ring reporting no external trust caches found and AMFI kills launchd with namespace 9 (OS_REASON_EXEC) code 8; the same kernel with the bundle present reaches execve activate 0 without an exec-policy line, so that panic is a build-argument slip, not a regression.",
  "The eMMC driver reads in runs (one CMD18 with Auto-CMD12 for up to 256 blocks, the buffer described piece by piece in an ADMA2 table) and climbs the card clock one proven step at a time (sirius_emmc_hs=3: 25, 50, 100 MHz), each step verified against blocks read at the 400 kHz identification rate; the single-block path stays as the fallback the runs were proven against.",
  "kern_exec.c's GPU-addon installer (zzy-native-gpu-addon-mount.patch) references native_ram_block_gpu_addon, which only RamBlock provided; this board ships no addon, so package/NativeEmmc.cpp answers its absence and the kernel links again.",
  "The kernel-side md path (IOKitBSDInit -> mdevadd -> IOKit guidance) attached the seed container but published no volume from it: nx_is_mount_valid reported 'invalid fsindex: -1' in an earlier run, and with the RAM window published by the same kernel APFS still enumerated no volume on it, so the Data mount failed with ENOENT. package/NativeEmmc.cpp now publishes the seed as its own RAM block device instead, and the volume APFS puts on it is the one the owner Data mount opens.",
  "package/NativeEmmc.cpp is the reference port's driver: it publishes the payload's Data seed as a read-write RAM block device (prepareDataSeed, ramReadWrite) and answers native_ram_block_volume_seed over the volume APFS puts on it. The log-only instruments that driver reads through weak_import (sirius_cpufreq_*, sirius_fb_*) needed definitions of this board's own, because the static kernel link does not resolve a weak import.",
  "docs/HANDOFF-AGENT.md hands the port to the next agent: this host has no root and no container runtime, so the XNU build runs through ~/.unixnu/run.sh (a user namespace that binds the toolchain into /opt and a Darwin-shim overlay over /usr/bin); U-Boot must be built with the GCC cross toolchain because the clang build is rejected by ABL; the Data seed is built by the data-seed workflow on a macOS runner and published as an encrypted release asset. The same document specifies the unattended debug loop this port still lacks: a conclusion must be able to return the phone to ABL fastboot (PON_SOFT_RB_SPARE = 0x04 through SPMI, then PSCI SYSTEM_RESET) without the volume-down chord, and a script must flash, reboot, capture the CDC console and decide the next round on its own.",
]
completion = [
  "Each claimed milestone has a reproducible command, a matching source and image revision and an accessible result.",
]
limits = [
  "The CDC console delivers the console ring as it stood when the host attached; making the whole boot stream live is the remaining work.",
]
next_action = [
  "Add the boot row and hash triple to every hardware result recorded here, and attach the captured console log rather than a photograph whenever one exists.",
]
evidence = [
  { kind = "source", reference = "docs/HANDOFF.zh-CN.md", result = "Entry probe, panic screen, panel rows and the evidence convention of the port." },
  { kind = "device", reference = "docs/evidence/sirius-usb-console-20261026-1605.log", command = "sudo python3 scripts/capture-usb-console.py --wait 60 --duration 190 --output /tmp/boot.log", revision = "366abe2948fdb0c1554f7e0b89b731160f4527a4", result = "3813 bytes of kernel log read from /dev/ttyACM0 over the DWC3 CDC console." },
]

[[area]]
id = "boot-chain"
status = "implemented"
components = []
paths = [".gitmodules", "uboot/**", "efi/**"]
inputs = [
  "Boot chain: ABL -> U-Boot (boot partition) -> UEFI -> UniXNU.efi on the vendor partition -> DarwinBoot.efi -> XNU.",
  "The U-Boot fork github.com/57UU/u-boot branch sirius/v2.0 carries the board support for sdm710-xiaomi-sirius and sirius-build.sh's ENV_FILE option; the UniXNU boot chain itself is environment text, not source.",
  "The EDK II package that builds UniXNU.efi, the DXE drivers and DarwinBoot comes from the UniXNU framework's package/ directory.",
]
configuration = [

schema_version = 1

# Machine-checked record of the sirius port. `python3 scripts/porting-record.py check
# --device <this repository>` from a UniXNU checkout validates it, and the Device
# documentation workflow runs the same check.
#
# Status vocabulary: planned, implemented, host-verified, device-verified, not-applicable.
# Every claim here is backed by docs/HANDOFF.zh-CN.md, by the board sources listed in paths,
# or by a device observation recorded with its commit.

[device]
name = "sirius"
soc = "SDM710"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Mi 8 SE running the UniXNU source kernel through its own U-Boot UEFI: 8 GiB persistent APFS Data container resized in-kernel with zero ENOSPC, launchd early boot, SpringBoard, backboardd and Setup.app running with sustained ~19 fps CPU-copied GOP presentation, AppleKeyStoreState and FTS521/ShengHidInput touch active, and unattended USB FASTBOOT return to ABL verified."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "dts/**", "configs/**", ".github/**", ".gitignore", "local.toml.example"]
inputs = [
  "SoC: SDM710 (Kryo 360, 2x Cortex-A75 + 6x Cortex-A55), GIC-500 GICv3, 19.2 MHz Qualcomm XO counter, PSCI over SMC.",
  "DRAM: 6 GiB model, 2 GiB at 0x80000000 plus 0xfd6c0000 at 0x100000000, 0x17d6c0000 usable.",
  "Target OS: the unchanged iPad7,1 iPadOS 17.7.11 (21H461) restore image, the same kernelcache as fajita and sheng.",
  "Hardware sources: mainline sdm670.dtsi, the vendor kernel tree and measurements on the phone.",
]
configuration = [
  "board.toml is format 2 (schema_version = 2) and selects soc_source = sdm710 and os_profile = ipados-17.7.11-21H461.",
  "dts/sirius.dts describes memory, the eight cores and their affinities, and includes the SoC DTSI for the GIC, PSCI and counter.",
  "configs/sirius_defconfig keeps the first-console kernel configuration and turns off the profile settings the image does not use yet.",
  "The prelink roots, slide, early security initializer and Apple device-tree identity come from the OS profile; the board adds sleep-disabled, the product model and the button set.",
]
procedure = [
  "From a UniXNU checkout: ./unixnu defconfig sirius_defconfig -D ../UniXNU-sirius.",
  "Then ./unixnu fetch, ./unixnu status --json and ./unixnu tree; the output is out/sirius/ipados-17.7.11-21H461/sirius/.",
  "Compile the hardware tree through the payload step (prototype: dtc -I dts -O dtb -i <soc>/dts dts/sirius.dts).",
]
findings = [
  "Local 2026-10-31 verification (kernel ad6a9709..., payload afa7def2...): removing sirius-skip-setup=1 while no Metal GPU driver exists avoids the PosterBoard SIGABRT loop and lets SpringBoard launch CPU-rendered Setup.app, while NativeEmmc + BootWatchdogPolicy seed and online-resize the persistent eMMC APFS Data container from 32 MiB to 8 GiB (2097152 blocks) with zero ENOSPC.",
  "Local 2026-10-30 integration selects GopFramebuffer, AppleKeyStoreState and ShengHidInput, links the late display archive, enables CPU frequency, FTS521 touch and GMU phase 2, and carries a 256 MiB Data seed fallback. Persistent Data mounted on this unit, but 256 MiB still reaches ENOSPC. Default panic autoreset has been removed because the panic buffer may contain recovered assertions.",
  "board.toml gained build-sirius-emmc.py in the archive list next to the USB console entry.",
  "board.toml lists build-sirius-emmc.py alongside the other archives, because the SDCC1 probe is compiled the same way as the USB console and joins the same force-loaded archive.",
  "Format 2 replaced the hand-written ADT generator of the legacy port (scripts/make-sirius-adt.py) with a board DTS: the payload step compiles the tree and derives kernel.macho.adt from it.",
  "The arm-io base is derived from the exported nodes, not written by hand: the GIC at 0x17a00000 makes the window start at 0x17000000, which XNU reads as the SoC base.",
  "The legacy port set ipad_identity = true; in format 2 the same identity is the OS profile's [adt] tables, so the board only states its deviations.",
  "configs/sirius_defconfig keeps the ARM64 profile's CONFIG_XNU_NATIVE_PAN=y: Kryo 360 implements PSTATE.PAN, the kernel leaves SCTLR_EL1.SPAN clear, so every exception entry from EL0 sets PAN and only the PAN build's copyio clears it; with the flag off the pid 1 exec loops in copyout() of the launchd path (tens of millions of faults, each resolved by vm_fault and taken again).",
  "The Data volume needs an APFS seed built with macOS hdiutil/diskutil (UniXNU's prepare-owner-data-fixture.py), so .github/workflows/data-seed.yml builds it on a hosted macOS runner: 256 MiB for a RAM seed, 8192 MiB for the persistent container. The seed also goes to an encrypted release asset (data-seed-<size>mib) because an artifact download needs a GitHub token the build host does not keep, while a release asset is readable without one.",
  "configs/sirius_defconfig mounts the payload's APFS Data seed at /private/var before launchd (CONFIG_XNU_OWNER_DATA_MOUNT, UUID 9399864F-... of the 256 MiB seed the data-seed workflow built); launchd's own mount -P 1 task exits 66 without it and the exit panics the boot. [payload] size_mib is 512 so the seed and the kernel fit in one vendor volume.",
  "The data-seed workflow builds the seed at the size given as its size_mib input: 32 MiB is the ungrown fixture the reference port mounts, and the 256/8192 MiB values are the grown containers; the seed carries a new volume UUID per build, which NativeEmmc reports when it differs from CONFIG_XNU_OWNER_DATA_VOLUME_UUID.",
  "A 32 MiB seed is the ungrown fixture itself and skips the container grow: the grown 256 MiB container attaches but APFS publishes no volume from it (checkpoint desc/data 0/0, no disk1s1), while the reference port mounts the ungrown 32 MiB seed as disk3s1/OwnerData.",
  "The seed in use is the ungrown 32 MiB fixture (release asset data-seed-32mib, owner-data.cdr cd3bbd46..., volume 7F00D031-C00B-4368-A3FF-D4788A1323D6); CONFIG_XNU_OWNER_DATA_VOLUME_UUID records it.",
]
completion = [
  "status --json resolves the ARM64, sdm710, iPadOS and device layers, prints a non-empty patch order and shows the device package as kits/sirius.",
  "The compiled hardware tree carries one contiguous memory range equal to payload.dram_size, eight enabled CPUs and a PSCI method.",
]
limits = [
  "The SoC profile is new: only the GIC, PSCI, counter and the timer INTID are shared, everything else is still board-local.",
  "No device-verified configuration has been recorded against a commit of this repository yet; the evidence is the legacy port's handoff document.",
]
next_action = [
  "Run status --json and tree against this repository and commit the resulting unixnu.lock.",
  "Rebuild the payload from dts/sirius.dts and compare the generated ADT with the legacy one before the next hardware boot.",
]
evidence = [
  { kind = "source", reference = "docs/HANDOFF.zh-CN.md", result = "Hardware values, the boot chain and the bring-up history of the legacy port, from which this configuration is carried over." },
]

[[area]]
id = "firmware"
status = "implemented"
components = ["DarwinBoot"]
paths = ["scripts/make-uboot-payload.py", "drivers/DarwinBoot/**"]
inputs = [
  "The device runs sirius-distro (mainline Linux) and its boot partition carries U-Boot 2026.07 with EFI_LOADER, the UEFI boot manager, GOP through vidconsole and EFI block volumes over FAT.",
  "UniXNU.efi is built on the host by ./unixnu build package; DarwinBoot.efi is built from drivers/DarwinBoot.",
  "The payload volume goes to the unused vendor partition mmcblk0p80 (3 GiB) and is selected by a marker file.",
]
configuration = [
  "board.toml has no [firmware] table: there is no Mu-Silicium firmware and no boot image on this port.",
  "[payload] loader = \"payload\" makes the generated unixnu.toml load Payloads/DarwinBoot.efi as a [[driver]] instead of expecting it in the firmware volume.",
  "scripts/make-uboot-payload.py adds \\EFI\\BOOT\\BOOTAA64.EFI (UniXNU.efi) and the DarwinBoot.efi driver to the payload FAT volume.",
]
procedure = [
  "fastboot flash boot the U-Boot image, fastboot flash vendor the finished payload volume, then select the UniXNU menu entry in U-Boot.",
  "U-Boot boots UniXNU when /EFI/UniXNU/BOOTUNIXNU exists on the vendor partition and boots Linux otherwise.",
]
findings = [
  "DarwinBoot now records free memory runs and the final EFI map; the integrated payload booted on the local unit. USB control corrections are built in a separate unflashed candidate.",
  "The eMMC work adds no firmware component: the payload still boots through U-Boot with the same marker file.",
  "U-Boot's UEFI services are enough for UniXNU, DarwinBoot and XNU: no Mu-Silicium platform port is needed for this board.",
  "DarwinBoot's GIC-500 pre-configuration (the iBoot role) is what lets the kernel pass lockdown and start kexts on this SoC.",
  "The pre-configuration must not enable the EL1 virtual timer PPI early: on SDM710 that is INTID 19 and it fires before ArmCpu installs its handler.",
]
completion = [
  "U-Boot starts UniXNU from the FAT volume, the menu lists the xnu entry, and DarwinBoot hands control to the kernel with the device tree, framebuffer and command line.",
]
limits = [
  "The boot chain is U-Boot specific: it is not reproducible with the Mu-Silicium flow of the other ports and is not covered by ./unixnu firmware or ./unixnu bootimg.",
]
next_action = [
  "Keep the U-Boot side (sirius-distro) pinned by revision in the handoff document; it is the firmware for this port.",
]
evidence = [
  { kind = "source", reference = "docs/HANDOFF.zh-CN.md", result = "Boot-chain diagram, the marker-file boot rule and the DarwinBoot GIC pre-configuration rationale." },
]

[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu"]
paths = ["drivers/ArmCpu/**",  "dts/sirius.dts"]
inputs = [
  "Eight Kryo 360 cores at Affinity1 0x000..0x700, boot CPU cpu0; cpu0-5 Cortex-A55, cpu6-7 Cortex-A75.",
  "GIC-500 distributor 0x17a00000/0x10000, redistributor 0x17a60000/0x100000, stride 0x20000.",
  "The EL1 virtual timer is GIC PPI 3 / INTID 19 (Apple uses PPI 11 / INTID 27); the SoC counter runs at 19.2 MHz.",
]
configuration = [
  "dts/sirius.dts lists all eight cores in boot order with their compatible strings; the ADT carries the same order.",
  "The kernel command line selects the board behaviour: sheng-smp=1, cpus=8, armcpu-self-ipi=1, armcpu-timer-intid=19.",
  "drivers/ArmCpu/ArmCpu.cpp is the board copy of the component: it adds the non-Apple timer INTID, the /cpus probe counters and the sheng-smp claim path.",
]
procedure = [
  "Build the kernel, then read the boot-progress TOPO line to confirm the topology and the probe decision.",
]
findings = [
  "The eMMC bring-up does not touch the CPU selection or the ArmCpu driver; board.toml only gained an archive entry.",
  "The boot-progress TOPO row confirms the kernel topology on hardware: boot=0 max=7 nums=01234567.",
  "With sheng-smp=1 the native ArmCpu claims every /cpus nub; without it the kernelcache AppleARMCPU takes the nubs and panics with \"CPU configuration in device tree is invalid\" because it requires /cpus/max_cpus.",
  "AppleARMCPU still wins the nubs at the current stage, which is the open IOKit blocker.",
]
completion = [
  "Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU with the board INTID.",
]
limits = [
  "IOKit attach of the native ArmCpu is not yet proven; the last trusted snapshot shows AppleARMCPU holding /cpus.",
]
next_action = [
  "Stop pre-enabling the timer PPI in DarwinBoot, re-read the probe row, and confirm ArmCpu installs its IRQ handler before the timer fires.",
]
evidence = [
  { kind = "source", reference = "docs/HANDOFF.zh-CN.md", result = "Timer INTID measurement, the TOPO checkpoint and the AppleARMCPU panic analysis." },
]

[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["dts/sirius.dts"]
inputs = [
  "Usable DRAM 0x17d6c0000 from 0x80000000 (6 GiB model: 2 GiB then 0xfd6c0000 at 0x100000000).",
  "The framebuffer handed over by U-Boot sits at 0x9c000000 (1080x2240 splash).",
]
configuration = [
  "The DTS memory node is a single contiguous range and board.toml repeats the size as [payload] dram_size; the driver refuses a mismatch.",
  "The ADT receives dram-base, dram-size and the CHRP NVRAM proxy from the payload step.",
]
procedure = [
  "Read the MEM row of the boot-progress panel and compare it with the DTS range.",
]
findings = [
  "The local boot used the 0xaa000000 contiguous window. SPMI PON register windows are mapped per channel instead of mapping the entire 32 MiB channel region.",
  "The eMMC probe maps two register windows (GCC and SDCC1) and reads only; the payload memory map is unchanged.",
  "The single contiguous range is what DarwinBoot's window allocation and the ADT handoff require; the two physical banks are described as one range on purpose.",
]
completion = [
  "The kernel memory map accounts for every handoff region, and no DMA engine or framebuffer range overlaps the kernel window.",
]
limits = [
  "DMA and SMMU behaviour is untested: there is no storage or GPU driver yet.",
]
next_action = [
  "Capture the kernel's memory map row after the next IOKit break-through and reconcile it with the DTS.",
]
evidence = [
  { kind = "source", reference = "docs/HANDOFF.zh-CN.md", result = "DRAM split, framebuffer address and the memory-map checkpoint." },
]

[[area]]
id = "storage"
status = "device-verified"
components = []
paths = ["docs/HANDOFF.zh-CN.md", "package/sirius_emmc.c", "package/NativeEmmc.cpp", "scripts/derive-storage-bindings.py", "scripts/build-native-emmc.py"]
inputs = [
  "The reference unit is eMMC, not UFS: the UFS transport and its sheng integration points do not apply to this board.",
  "The original kernelcache is the only source of IOStorageFamily's addresses; its kext images carry no symbol table, so they are derived from the dispatch table itself.",
]
configuration = [
  "board.toml lists build-sirius-emmc.py (the SDCC1 probe) and build-native-emmc.py (the IOKit block driver) in [kernel] archives; CONFIG_XNU_NATIVE_UFS stays off.",
  "[userdata] carries the 512-byte geometry and the OS/SystemOS windows read from the device's own GPT.",
]
procedure = [
  "Build the kernel with that archive list: the driver's storage imports are bound at the prelink slide and archived with it.",
  "Read the evidence off the boot-progress console: the probe prints the GPT rows, the driver logs the block count it publishes.",
]
findings = [
  "In-kernel 8 GiB APFS Data container resize verified on hardware (kernel ad6a9709..., payload afa7def2...): when the eMMC Data container at LBA 35627008 has fewer than 2097152 4 KiB blocks, NativeEmmc::prepareDataWindow writes the clean 32 MiB fixture from /chosen/memory-map/RAMDisk to LBA 35627008 and publishes an 8 GiB (16777216-sector) NativeEmmcBlock store; after /dev/disk3s1 mounts, BootWatchdogPolicy calls sirius_apfs_try_resize_data(\"post-mount\"), which invokes prelinked AppleAPFSUserClient::containerResize (0xfffffff005673e7c, prologue-checked) with new_size=0, growing disk3 from 8192 to 2097152 blocks (8 GiB) with rc/status 0 and 0 ENOSPC across the entire boot.",
  "scripts/grow-data-container-macos.sh prepares an 8 GiB copy of an existing Data seed using hdiutil and diskutil resizeContainer, checks the volume and geometry, and refuses Linux or overwriting an output. Shell syntax and Linux refusal tested; the macOS resize itself has not run here.",
  "Local evidence: the 256 MiB persistent Data window at LBA 35627008 mounts disk3s1 OwnerData. Early boot completes, but containermanagerd reports ENOSPC at capture time 185.8s. The APFS Whole-media filter is present; successful Data lookup is confirmed. Increasing APFS capacity remains blocked on macOS diskutil/hdiutil or a larger prepared seed.",
  "The data path works: ADMA2 reads return EFI PART from LBA 1, the GPT header parses (entries_lba=2, count=84, size=128) and 81 partitions with geometry are listed; boot 1179648..1310719, vendor 11010048..17301503, userdata 17301504..122142686.",
  "Five conditions had to hold at once: the RCG2 encoding (CFG=0x2017, M=1, N=0xfc, D=0xfb), 1.8 V I/O (the board's vqmmc), the 32-bit interrupt/error map at 0x30/0x32/0x36, the ADMA descriptor address at 0x58/0x5c rather than 0x00, and cache maintenance (flush_dcache64) because the engine reads memory and not the CPU cache.",
  "SMMU is not the blocker: the boot chain leaves it disabled (scr0=0x00230406, bit0=0) and writing S2CR hung the SoC twice, so the driver only reads SMMU state.",
  "IOStorageFamily is a kext of the original kernelcache, so the archive form of the driver left IOBlockStorageDevice undefined at the kernel link (ld: 'a missing vtable usually means the first non-inline virtual member function has no definition').",
  "The prelink slides every component by a constant: extents[].va = original + slide for each segment and bindings[] carries new_site = site + slide, so the addresses the driver needs are the kernelcache's plus the slide.",
  "The dispatch table is identifiable without a live snapshot: of the 190 pinned slot names 176 are kernel exports, exactly one __DATA_CONST table matches all of them, the other 14 slots point at the kext's own BRK traps, the single constructor that stores table+16 forwards to the actual IOService constructor and the base destructor resolves to IOService's.",
  "Eleven imports are bound (dispatch table, metaclass, protected constructor, base destructor and seven methods); when the prelinked kernel exists the derivation also checks it holds the same constructor at the slid address, so a wrong slide cannot pass.",
  "The SHNGROOT manifest at userdata LBA 17301504 describes two windows (OS 17303552+11870275, SystemOS 29175808+6451200); publishing them as their own IOBlockStorageDevice makes APFS mount disk0, disk1s1 and disk2s1 (the OS volume DawnUpdate21H461.J120J121J207J208OS) and bsd_init completes.",
  "A thread_call has a single pending slot: thread_call_enter1 neither queues a second call nor preserves the first parameter, so passing requests there silently dropped completions and any caller waiting on such a request hung with the kernel otherwise idle. Requests now sit on a software queue that one drain services.",
  "Completing a block request from another thread deadlocks this stack the same way the drop did (reads and blocks frozen at the same point, no error, the drain asleep), so doAsyncReadWrite completes inline by default.",
  "The recurring 'Taking non-sleepable RW lock with preemption enabled' panic is the trust cache runtime lock, not a pmap lock: lock 0xfffffff007b3b548 resolves to _trust_cache_rt_lock and the first caller to _query_trust_cache+0x70. trust_cache_runtime_init() is not compiled into this build, so the lock word reads all zeros (lck_rw_can_sleep == false) and lck_rw_lock_shared panics at lock_rw.c:1400; the driver's heartbeat now mirrors the panic text into the USB ring, which is how the addresses were read.",
  "With the runtime guarded to answer KERN_NOT_FOUND, AMFI refuses every image and the kernel kills launchd with namespace 9 (OS_REASON_EXEC) code 8 (EXEC_EXIT_REASON_SECURITY_POLICY); recording and clearing that answer with sirius-skip-cs=1 makes exec_activate_image return 0, so execve of /sbin/launchd completes.",
  "The card clock can be raised from the identification rate with the same table U-Boot programs: the RCG divider field holds (div * 2 - 1) and DUAL_EDGE is set when n != m, so the 400 kHz entry (CXO, div 12, m 1, n 4) is CFG 0x2017 and 25 MHz (GPLL0_EVEN, div 6, m 1, n 2) is CFG 0x260B; 25 MHz stays inside default speed, 50 MHz would need the CMD6 high-speed switch.",
  "With the original trust-cache bundle in the payload and the runtime initialised at startup, AMFI answers the exec policy itself: the boot prints execve activate 0 without the sirius-skip-cs bypass line, so the Apple-signed launchd is trusted rather than skipped into.",
  "The 25 MHz switch reads the GPT signature back at the new rate on device (the probe prints EMMC clock25=ok), so the RCG encoding above is confirmed rather than assumed.",
  "Throughput at the identification clock is about 550 blocks/s (0x3FC to 0x84A in two seconds), the expected ceiling for 400 kHz on a four-bit bus, so the 400 kHz setting is a speed problem and not the cause of the stalls.",
  "The init exec returns 0 and then nothing asks the driver for another block: reads stop at 0x10D (269 requests, 0x98F blocks) while the heartbeat keeps counting, so the wait is past the storage stack. The caller side is now instrumented (sirius-post-exec-trace.patch): the exec thread-switch state, every new user thread start at thread_bootstrap_return, the first pid 1 syscalls with their returns, each bsd_ast for pid 1 and the first user faults after the exec, all written to the same USB ring and summarised by the heartbeat.",
  "The caller-side probe closes that question: the pid 1 thread stays in load_init_program_at_path, inside copyout() of the launchd path, and takes 62.6 million faults in about a minute. The stall is a fault loop in the exec path, not a storage wait.",
  "The eMMC driver reads in runs and climbs the card clock (see diagnostics); the eMMC windows are authorized for the SystemOS union mount by package/NativeEmmc.cpp's native_verified_block_* hooks, only under sirius-allow-unverified=1.",
  "The Data seed reaches the kernel as the payload initrd: DarwinBoot copies it into the window named by /chosen/memory-map/RAMDisk and IOKitBSDInit turns that into md0. APFS refused to mount /dev/md0 (invalid fsindex) with the kernel-side md path, so NativeEmmc publishes the seed itself as a read-write RAM window (prepareDataSeed) and answers native_ram_block_volume_seed over it, the way RamBlock does on sheng; the owner Data mount then finds the volume by its provider chain instead of the block layer'd whole-disk naming.",
  "The Data seed is published by package/NativeEmmc.cpp itself (prepareDataSeed): the seed DarwinBoot put in /chosen/memory-map/RAMDisk becomes a read-write RAM block device named Data, APFS publishes its volume there, and the owner Data mount opens it through native_ram_block_volume_seed. Nothing is written back to the payload; the volume starts from the seed at every boot.",
]
completion = [
  "The eMMC registers, GPT and the SHNGROOT windows are correct; APFS mounts the OS volume, bsd_init completes, init execs /sbin/launchd and execve returns 0.",
]
limits = [
  "Read-only: the transfer path has no write command and reportWriteProtection() says so.",
  "After the successful execve of launchd the driver receives no further requests: the remaining wait is past the storage stack, not in it.",
  "The card clock is still the identification rate (400 kHz, about 550 blocks/s measured); nothing raises it to high speed yet.",
  "The exec policy no longer needs a boot argument: the payload carries the original trust-cache bundle and the kernel initialises its runtime at startup. The sirius-skip-cs bypass is kept in the patch series, unused, in case a future image falls outside the bundle.",
]
next_action = [
  "Verify the 25 MHz switch (sirius_emmc_hs=1) reads the GPT signature back and measure the new block rate; then decide whether the CMD6 high-speed switch to 50 MHz is worth it.",
  "Keep the trust-cache bundle in step with the OS build when the IPSW changes (its sha256 is pinned in board.toml [payload] trust_cache_sha256).",
  "Boot the post-exec-probe kernel and read the counters: two SIRIUS user thread start lines mean the exec'd thread was scheduled, and the last init syscall enter without a matching return names the call it never comes back from.",
  "Raise the SDCC1 clock out of identification speed (GCC root clock plus the card's high-speed mode).",
]
evidence = [
  { kind = "device", reference = "docs/HANDOFF.zh-CN.md", command = "fastboot flash vendor sirius-obs.img; fastboot reboot; capture-usb-console.py --duration 240", revision = "d867b1d6498dc4d0f4ae4e18060762dcae6c5847", result = "NativeEmmc starts from bsd_init, publishes 0x747BFDF blocks of 512 bytes, and IOStorageFamily reads block 0, block 1 and block 2 with 21 sectors (the 84 GPT entries) through doAsyncReadWrite; the heartbeat keeps ticking with the transfer count fixed at seven, so the boot ends at the root-device wait. Log in docs/HANDOFF.zh-CN.md." },
  { kind = "host", reference = "docs/HANDOFF.zh-CN.md", command = "./scripts/xnu-container.sh run bash -lc './unixnu build kernel --skip-setup -D ../sirius'", revision = "a47f0d6b4615c3cdebf92102400a1bc302eb6d73", result = "The kernel links with NativeEmmc in the image (kernel.macho sha256 372820eb1b2cd9ecee15d769d1296771d0c8141c2681626d54651a62473446b8); the GitHub macOS runner builds the same archive (kernel workflow run 40386710258)." },
  { kind = "device", reference = "docs/HANDOFF.zh-CN.md", command = "fastboot flash vendor sirius-if.img; fastboot reboot; capture-usb-console.py --duration 220", revision = "bb812428dccd1f676455813ad198ed2bee4a8e3e", result = "APFS mounts disk0/disk1s1/disk2s1, bsd_init completes, execve of /sbin/launchd prints activate enter, namei 0, 'exec policy answered 1, skipped by boot arg' and finally 'execve activate 0'; the driver then has no transfer in flight and the read count stops at 0x10D, so the remaining wait is past storage." },
  { kind = "source", reference = "package/sirius_emmc.c", result = "SDCC1 bring-up, the ADMA2 read path and the GPT parse." },
]

[[area]]
id = "display"
status = "implemented"
components = ["GopFramebuffer"]
paths = ["package/BootProgress.c", "package/BootLog.c", "package/Font.h", "scripts/build-boot-progress.py", "drivers/GopFramebuffer/**"]
inputs = [
  "U-Boot hands over a 1080x2240 splash framebuffer at 0x9c000000 through GOP (vidconsole).",
  "The panel is 1080x2244 DSI; there is no backlight or display driver in the kernel yet.",
]
configuration = [
  "CONFIG_XNU_BOOT_PROGRESS=y links the boot-progress layer; boot-progress=2 on the command line draws the kernel console lines.",
  "package/Font.h is vendored from Mu-Silicium, so the archive builds without a UEFI checkout.",
]
procedure = [
  "Build kernel, payload and volume, boot, and read the panel: stage lines, TOPO, PROBE, MEM and panic text.",
]
findings = [
  "Post-interaction UI freeze root-caused and fixed on hardware (kernel ff57d694..., payload fad069ea...): after touch interaction in Setup.app, backboardd switches to the iPad7,1 1536x2048 canvas (r0 = 0,0,1536,2048 -> r1 = 0,0,1080,2240), which NativeLegacyDisplay::validateSwap previously rejected with reason=3 ('verify_swap failed for swap id: ...'), freezing the display. NativeLegacyDisplay now validates and scales full-frame surfW x surfH -> 1080x2240 BGRA surfaces with a 64-bit unrolled nearest-neighbor blit (1332/1332 swaps accepted, 0 rejected), BootWatchdogPolicy always writes SpringBoard's no-watchdog/no-auto-dim/no-idle-sleep preferences, and sirius_touch flushes same-batch EVT_ENTER/EVT_LEAVE transitions so fast taps are not coalesced away.",
  "With the 8 GiB persistent Data container and sirius-skip-setup=1 removed (kernel ad6a9709..., payload afa7def2...), SpringBoard (135.2 s), backboardd (165.7 s), iconservicesagent (171.9 s) and Setup.app (294.6 s) run without storage errors, and GopFramebuffer copies 5514 accepted frames (0 rejected) at ~10.3 ms mean (~19 fps) with verified non-black pixel counts (41011 on the Apple logo, 28199 on Setup).",
  "The local boot registers the GOP display and copies six frames; SpringBoard and backboardd exec events do not establish a visible or usable UI. HuajiFruit logs copied into docs/evidence are reference observations, not results for this unit.",
  "The panel gained an EMMC row (step, version, capabilities, state, clock, power, clock-branch halts) next to the USB row, so the storage bring-up is visible without a serial link.",
  "The USB row (drawn by this panel) labels its six values after what they now carry - step, txev, rxev, chars, echo, poll - because they were first wired to register names and had drifted.",
  "The panel is the readable kernel log of this port: it renders the console, the TOPO/PROBE rows and panic() output.",

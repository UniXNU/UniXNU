[[area]]
id = "packaging"
status = "host-verified"
components = ["XnuPrelink"]
paths = ["package/**", "scripts/package.sh", "patches/**"]
inputs = ["iPhone17,2 26.5.2 kernelcache for prelink, the OS/SystemOS images for userdata, Data seed and the platform seed (UNIXNU_UNIQUE_CHIP_ID)."]
configuration = ["board.toml [payload] builds a 176 MiB CUPIDESP FAT volume; [bootimg] packs header v0 at 4096-byte pages.", "scripts/package.sh is the standard UniXNU packaging script and reads [package] unixnu and [package.defconfig]."]
procedure = ["Install the OS profile, then run scripts/package.sh --os ios-27.0.1-24A446 --uefi ../uefi-cupid once the firmware exists.", "Run the macOS workflow for kernel-only builds until then."]
findings = ["patches/xnuprelink/fileset-cupid-23F84-symbols.json is a reviewed fixture for the iPhone17,2 26.5.2 kernelcache. It binds sixteen kernel functions/thunks by string/call evidence, including the lck_mtx_gate open/steal/alloc/free family and the pmap PPL functions. The first batch paired the lck_mtx_gate allocator (alloc_init) with the native destroy, and the native gate check panicked: 'Trying to destroy a gate that was allocated by gate_alloc_init; gate_free should be used'. The corrected deallocator is _lck_mtx_gate_free. fileset-register-report.patch replaces the simple stub with a register-saving report (x0-x30, x16/x17, data-slot candidates) so any remaining stub names its slot instead of relying on the stale tail-branch return address.", "build-fileset-release-reference.py --tree . --lto is required for iOS 26: the stripped native kernel cannot shape-match the kernel-function imports of the original kexts, so without the symbol-bearing reference prelink left 1668 targets / 18367 sites. The reference cut that to 92 owner-site pairs / 766 sites; the sixteen-binding batch and --allow-missing write the candidate, and the register report names any remaining slot.", "The iPhone 26 prelink layout leaves only 0x119f40 before AppleARMPlatform __DATA_CONST; the DEVELOPMENT native __DATA_CONST plus __LASTDATA_CONST exceed it. patches/xnu/no-assert-strings.patch removes most of the __assert strings so the native constants fit. MACH_ASSERT stays defined: the ipc_port ABI is 160 bytes, and a MACH_ASSERT=0 build failed the genassym static assertion at 144. DTrace/LOCK_STATS also stay on.", "Kernel and package steps do not need the firmware checkout; payload and boot image do because they embed the firmware volume.", "package/Sm8450Ufs is board-owned host-tested code, not yet part of the kernel archive: ufs-regs compiles Sm8450UfsRegs.h and Sm8450UfsHci.h with c++ -Werror on every change, and the package step continues to build only the EDK II drivers.", "The board package still carries the host-tested UFS transport model (Sm8450UfsHci.h); it does not enter the kernel archive, so the EDK II package step is unchanged.", "patches/unixnu/0001-patch-xnu-entry-probe-skip-nm-headers.patch is required for payload: the upstream parser crashed on a three-token nm header line (int(Symbols)) while reading the prelinked kernel.", "patches/unixnu/0002-ramdisk-find-fat-in-initrd.patch makes UniXNURamDiskDxe scan up to 256 MiB of the initrd, log the first two words at every 16 MiB boundary, and, if the 512-byte walk finds no boot sector, search byte-wise for the CUPIDESP volume label and derive the FAT start from offset 71. cupid v4 ABL publishes 0xBC8BE00 bytes starting with an LZ4 vendor ramdisk; 64 MiB and 256 MiB sector walks found no FAT although the bulk data is present.", "patches/darwinboot/0001-darwinboot-log-window-failure.patch prints NO WINDOW and the FREE runs to the console; owned_memory_size was lowered to 0x80000000 so a 2 GiB run can satisfy the kernel window while the log reports the real largest run.", "patches/xnu/timers-avoid-trapped-physical-timer.patch removes the precautionary CNTP_CTL_EL0 write in _enable_virtual_timer; Gunyah traps EL1 physical-timer access. It is the only device XNU series entry after the pivot.", "The iOS 27 reviewed-symbol fixture (30 shims), the PAC key-write skip and the report-registers probe were removed: the iPhone 26 kernel is the same XNU major/minor as the source, so prelink must pair natively and --allow-missing/--fileset-reference are gone.", "The 13432-only shims (corecrypto wrappers, AppleM2 clock/property, AppleImage4 flags/gates, sandbox checks, AppleARMPlatform lookup and the AMFI DRBG initializer) are not part of the iOS 26 build; they were responses to the 24A446 source mismatch."]
completion = ["Kernel and prelink succeed with no missing targets, the payload contains all declared inputs, and the boot image matches the bootloader format and size limit."]
limits = ["Kernel, package and firmware are host-verified. Payload is blocked on the platform seed (UNIXNU_UNIQUE_CHIP_ID); the boot image is blocked on a cupid firmware DTB. Neither is in the repository."]
next_action = ["Build payload and boot image once the owner supplies UNIXNU_UNIQUE_CHIP_ID and cupid's firmware DTB; the macOS workflow already stages boot-v4 images."]


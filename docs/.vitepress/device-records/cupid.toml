schema_version = 1

[device]
name = "cupid"
soc = "SM8450"
os_profile = "ios-27.0.1-24A446"
summary = "Xiaomi 12 (cupid, SM8450) running iOS 27.0.1 (24A446, arm64e) under an iPhone17,2 / D94AP identity, with the iOS 26.5.2 (23F84) image kept as a fallback. This record separates what is established from host sources from what still needs the phone."

[[area]]
id = "configuration"
status = "implemented"
components = []
paths = ["board.toml", "feeds.toml", "configs/**", "profiles/**", ".github/**", ".gitignore", "scripts/install-os-profile.sh", "scripts/build-cupid-dtb.sh", "notes/**"]
inputs = ["SM8450 SoC source pin; iPhone-flavoured iOS 27.0.1 build 24A446 profile, with iOS 26.5.2 build 23F84 retained as fallback; cupid defconfigs and device tree.", "UniXNU main does not ship an iPhone OS profile: this repository carries profiles/os/ios-27.0.1-24A446 and profiles/os/ios-26.5.2-23F84 and installs them into the checkout."]
configuration = ["board.os_profile = ios-27.0.1-24A446; board.soc = SM8450; board.soc_source = sm8450; schema_version = 2.", "profiles/os/ios-27.0.1-24A446 is the iPhone17,2 (D94AP) 24A446 profile with the upstream XnuPrelink 24A446 fixture retargeted to the iPhone collection; profiles/os/ios-26.5.2-23F84 remains the fallback.", "NOT the shipped ipados-27.0.1-24A446 profile: different IPSW, original kexts and ADT identity."]
procedure = ["Read https://unixnu.com/porting/device-repository and https://unixnu.com/porting/records.", "Run scripts/install-os-profile.sh ../UniXNU to install both iPhone profiles into the UniXNU checkout.", "Run ./unixnu defconfig cupid_ios27_defconfig -D ../UniXNU-cupid, ./unixnu fetch -D ../UniXNU-cupid, ./unixnu status --json -D ../UniXNU-cupid."]
findings = ["The upstream 24A446 fixture's data entries: the 13 vnodeop_desc descriptors are retargeted to the iPhone 27 collection by their unique vnop_* name strings and vdesc_name slots; the 8 metaclass slots and _gIODTPHandleKey, _audio_active, _tk_rawcc, _tk_nin and _gPESerialBaud remain to be retargeted by the reference data map/source consumers. notes/IOS27-SHENG.md records the fixture/recipe, the generic sheng 24A446 bring-up hunks and the relevant 4 KiB/arm64e/prelink/security/bring-up docs. ", "The sheng 24A446 boot uses XnuPrelink's upstream fileset-24A446-symbols.json (156 native bindings), not a 30-shim list. Retargeted to the iPhone17,2 24A446 kernelcache by exact function hash (36) and shape (93) and merged with the old iOS 27 shims that still have compiled C functions, the local prelink with the old native/reference leaves 55 stubs/17 missing (140 fixture inputs), versus 137 stubs for the old 30-shim build. The iOS 27 profile is restored and selected; iOS 26.5.2 remains a staged fallback. ", "The iPhone17,2 26.5.2 kernelcache reports xnu-12377.122.8~1/RELEASE_ARM64_T8140 and has 302 fileset entries; the newest public source is xnu-12377.121.6. Same major/minor, so the iOS 26 profile applies only zzz-boot-progress and not the Darwin 26 syscall/KPI patches that 24A446 needs.", "An iPhone profile is required for a phone: iPadOS presents iPad product identity, idiom and display assumptions that SpringBoard and UIKit read from /product.", "The first iOS 26 prelink without a fileset reference left 1668 targets / 18367 sites (apfs 3757, AppleM2 2706, AppleARMPlatform 1755, ApplePMGR 1443, IOGPUFamily 1427). With the reference the exact tree left 92 owner-site pairs / 766 sites. The sixteen reviewed bindings in patches/xnuprelink/fileset-cupid-23F84-symbols.json cover ml_set_interrupts, two PMGR thunks, zfree, uiomove64, zalloc_ro, task_deallocate, vnode_getwithref, the AppleImage4 security-flag shim, the lck_mtx_gate open/steal/alloc/free family, and the pmap PPL functions. The first boot panic named AppleImage4 0xabda26c; the second was a tail-branch stub from AppleImage4, so fileset-register-report.patch now saves x0-x30 and prints x16/x17 plus data-slot candidates. --allow-missing still writes the candidate; any remaining stub is named exactly by the report. The iPhone 26 native __DATA_CONST (0x11c000) and __LASTDATA_CONST do not fit before AppleARMPlatform __DATA_CONST at +0x119f40, so prelink fails with 'Native __DATA_CONST overlaps a retained segment'. patches/xnu/no-assert-strings.patch keeps MACH_ASSERT (the prelinked ipc_port ABI stays 160) but no-ops the assert/assertf/assert3 message macros, removing most of the 0x2ef3c __assert section. DTrace and LOCK_STATS stay enabled: disabling DTrace broke the bsd partial link, and turning MACH_ASSERT off changed ipc_port from 160 to 144 bytes. AMFI early init: the 24A446 value 0xfffffff00921000c is the wrapper at AppleMobileFileIntegrity __TEXT_EXEC+0xe7ec; the same offset lands mid-function in 23F84. The 23F84 wrapper is 0xfffffff008edda30 (__TEXT_EXEC+0xdee0): it calls the original initializer at 0xfffffff008edd2a0 and returns 0.", "The iPhone 26 fileset has every root of the iPad 26 profile except com.apple.iokit.IOHIDEventDriver; the class itself ships in IOHIDFamily.", "Arrays replace inherited arrays: board.toml repeats every selected component, configuration fragment and patch series entry.", "The macOS workflow repairs two stale UniXNU submodule gitlinks before fetch: ArmCpu 2e11cda/16040839 to the existing 93a5030, and AppleKeyStoreState 6ff4f11 (gone from the remote) to main 58e5461. The latter blocked build 42779052201 in the resolve step. The macOS workflow builds the EDK II package (UniXNU.efi) after the kernel, so a push that changes board.toml, profiles, configs or the workflow itself exercises image assembly without the phone.", "scripts/build-cupid-dtb.sh builds the firmware DTB from the LineageOS waipio-v2 + cupid overlay (cpp + dtc + fdtoverlay), sha256 6246e11cc2867946183b7e453797d5ec0fb3c49c6297115f2605a7bf8c0e0b50. It is not byte-identical to the stock vendor_boot base+dtbo merge (956745 bytes, sha256 ea574733...): the stock base is a larger vendor tree. The device reports dtb_idx 10 (Waipio v2) and revision 2.2. The live ABL FDT was pulled from the phone (sha256 3d669081f48c6a810f0d95f7c5fa37d62dcb1c40a9d6fe4eb8b79bc24bebf7f0, 773371 bytes, model 'Cupid based on Qualcomm Technologies, Inc SM8450') and scripts/build-cupid-dtb.sh accepts it with UNIXNU_CUPID_LIVE_FDT; the compiled tree now patches the cupid root identity and measures 451042 bytes (sha256 7604f605...).", "macOS cpp mis-parses -x assembler-with-cpp (cc: no input files); the DTB script now defaults to clang -E and the workflow builds cupid.dtb before the kernel so a tree failure is not hidden behind a 19-minute kernel step.", "notes/FASTBOOT.md records the one-boot procedure: fastboot boot loads the image into RAM, nothing is flashed, and the unlocked state must be confirmed before the Gunyah PAC test.", "The workflow applies patches/unixnu/*.patch to the UniXNU checkout before building; patches/unixnu/0001-patch-xnu-entry-probe-skip-nm-headers.patch makes the entry-probe parser skip non-hex nm header lines.", "The payload step passes --uefi ../uefi-cupid: panic_screen=true needs Mu-Silicium FrameBufferSerialPortLib/Font.h; without it patch-xnu-entry-probe.py aborts before writing the volume.", "notes/first-boot-2026-11-07.md is the first device boot result: fastboot accepted the image but the screen stayed black, traced to the FD base 0xA7100000 versus the stock UEFI ELF window at 0xA7000000 size 0x2A2000.", "notes/first-uefi-boot-2026-11-07.md records the first successful UEFI boot: header v4 reaches BootShim and the UniXNU menu on cupid; the payload volume is not published (no SimpleFileSystem), so the menu falls back to BDS.", "The workflow applies patches/darwinboot/0001 inside the DarwinBoot submodule after the kernel step has fetched it, so the firmware build sees the window diagnostics.", "notes/PROJECT-STATE.md and notes/PROJECT-NEXT.md snapshot the working state (repos, commits, measured device facts, boot history, patches, next step) so a compacted session can resume without losing critical detail.", "notes/pac-trap-2026-11-07.md records the first XNU start and the Gunyah trap on the EL1 PAC key write; the next image disables the key-programming block.", "The panic instruction was decoded as 0xd51be228 (msr CNTP_CTL_EL0), not PAC: the screen wrapped instr=d5 onto the next line. The timer is the current blocker; the record was corrected.", "The macOS workflow uploads cupid-native-symbols (unstripped native kernel, kernel.json and kernel.map.json) so an unmatched target can be reviewed against real symbols offline.", "The iOS 27-only reviewed-symbol fixture, the PAC key-write skip, the report-registers probe and the 24A446 profile were removed at the pivot to iOS 26. The device XNU series now contains only the timer patch.", "The iPhone 26 OS and Cryptex1,SystemOS images decrypt on macOS with /usr/bin/aea: OS 094-54688-107.dmg has sha256 14b119c0d44826e080c9cd61f3f5cf9ff7449d990b1f5e0dfb4b93fc3a29d58b and volume 1A2E284A-0A7E-40A9-8F5D-35A1C1F44E9E; Cryptex1,SystemOS 094-54806-109.dmg has sha256 7e992fd0fde7339a45607b511f4c024641f71095c6730de0a1c9f47b3970df56 and volume 21AAD942-A60B-4026-B7B4-0A57205CC9A9."]
completion = ["status resolves ios-27.0.1-24A446 with arch arm64e, the sm8450 SoC source and the cupid_ios27 defconfig; the iPhone17,2 24A446 kernelcache prelinks with the retargeted 24A446 fixture."]
limits = ["The iPhone17,2 identity advertises a 1320x2868 display; cupid is 1080x2400. Display identity is corrected with the panel milestone."]
next_action = ["Run the macOS kernel workflow, record the stubbed/missing target counts, and boot the staged image on cupid."]


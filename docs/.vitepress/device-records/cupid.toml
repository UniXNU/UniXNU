[[area]]
id = "firmware"
status = "host-verified"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", "scripts/*firmware*"]
inputs = ["A Mu-Silicium UEFI fork for cupid (uefi-cupid), cupid's stock UEFI/ABL firmware and the live ABL device tree.", "PSCI SMC entry, GOP framebuffer handoff and the memory map UniXNU may own."]
configuration = ["board.toml [firmware] names config cupid, dsc Platforms/Xiaomi/cupidPkg/cupid.dsc and the SILICIUM_UEFI.fd path.", "Firmware DSC/FDF must embed UniXNU, UniXNUDxe, DarwinBoot, UniXNURamDiskDxe, DiskIoDxe and FAT support."]
procedure = ["Fork uefi-sheng into uefi-cupid, add cupidPkg and its Binaries/cupid module from the stock UEFI image.", "Build with ./unixnu build firmware -D ../UniXNU-cupid --uefi ../uefi-cupid.", "Record the firmware revision, FD size and the handoff memory map."]
findings = ["uefi-cupid is forked from UniXNU/uefi-sheng and carries Platforms/Xiaomi/cupidPkg: CUPID_VENDOR_HW = 0, USE_CUSTOM_DISPLAY_DRIVER = 0, WaipioPkg.dsc.inc (SM8450, 8 cores, GIC 0x17100000), SimpleFbDxe on ABL's 1080x2400 scan-out, and UniXNUPkg + DarwinBoot + UniXNURamDiskDxe.", "The memory and configuration maps are copied from the SM8450 ingres platform (same DRAM base, FD window and SoC carveouts) and are REQUIRED to be replaced with cupid's stock uefiplat.cfg.", "The minimal configuration deliberately omits Binaries/cupid, so no stock vendor module is needed to build the firmware volume; vendor clocks, UFS, USB, charger and the stock display chain are a later CUPID_VENDOR_HW = 1 step.", "The stock splash_region (0xb8000000 + 0x2b00000) is present in waipio display DTSI and is assumed in the payload and boot image."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves documented reservations."]
limits = ["cupidPkg builds and produces SILICIUM_UEFI.fd, but the memory map and FD base are still the ingres SM8450 values and vendor hardware is off; neither is device-verified."]
next_action = ["Build firmware with ./unixnu build firmware --uefi ../uefi-cupid and record the FD size; then import Binaries/cupid from the HyperOS archive for CUPID_VENDOR_HW = 1."]


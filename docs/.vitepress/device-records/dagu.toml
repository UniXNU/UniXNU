]

[[area]]
id = "cpu"
status = "planned"
components = []
paths = ["dts/dagu.dts", "feeds.toml"]
inputs = [
  "SoC include dts/sm8250.dtsi: eight Kryo 585 cores, cpu@0..@300 Cortex-A55, cpu@400..@700 Cortex-A77, timebase-frequency 19200000, psci method smc.",
  "GICv3 at 0x17a00000 (distributor 64 KiB) and 0x17a60000 (redistributors), compatible arm,gic-v3, from the same SoC include.",
  "qcom,msm-id family 356 from kona.dtsi / kona-v2.dtsi / kona-v2.1.dtsi; board-id 51 0 from the dagu overlay.",
]
configuration = [
  "dagu.dts includes sm8250.dtsi and does not override CPU status; all eight SoC CPU nodes remain enabled.",
  "payload.adt.chip_id = 356, derived from the kona qcom,msm-id, with unique_chip_id required.",
]
procedure = [
  "Keep CPU affinities and GIC ranges in the SoC repository. Record any dagu-specific enable or disable decisions in dts/dagu.dts.",
  "Confirm the live msm-id revision (0x10000 / 0x20000 / 0x20001) from a dagu firmware DTB or sysfs once the device can be read.",
]
findings = [
  "The dagu overlay is built against kona.dtb, kona-v2.dtb and kona-v2.1.dtb, so the running msm-id revision depends on silicon and the selected base DTB. SM8250-AC corresponds to kona v2.1 (356 0x20001).",
  "payload.adt.chip_id is a software identity, not an ECID.",
]
completion = [
  "Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU.",
]
limits = [
  "No dagu host or device CPU bring-up has been run. cpu_regs is not pinned in board.toml.",
]
next_action = [
  "After a firmware package exists, confirm MPIDR / enabled cores from a dagu DTB or live FDT.",
]
evidence = [
  { kind = "source", reference = "https://github.com/FFT-infra/UniXNU-sm8250-common/blob/166235ec2480ff0992627b7aafa15c65ce6b4efa/dts/sm8250.dtsi", result = "Eight-core map, PSCI smc, GICv3 0x17a00000/0x17a60000 and 19.2 MHz timebase." },
  { kind = "source", reference = "https://github.com/LineageOS/android_kernel_xiaomi_sm8250/blob/6b34d24765327d746074c8e53b5ad0d24a51acc7/arch/arm64/boot/dts/vendor/qcom/dagu-sm8250-overlay.dts", result = "dagu qcom,board-id = <51 0>." },
  { kind = "source", reference = "https://github.com/LineageOS/android_kernel_xiaomi_sm8250/blob/6b34d24765327d746074c8e53b5ad0d24a51acc7/arch/arm64/boot/dts/vendor/qcom/kona-v2.1.dtsi", result = "kona v2.1 qcom,msm-id = <356 0x20001>." },
]

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/dagu.dts", "board.toml"]
inputs = [
  "Public device documentation lists RAM SKUs of 6 GB, 8 GB and 12 GB paired with 128 GB, 256 GB and 512 GB UFS.",
  "The opened dagu overlay and dagu-sm8250.dtsi do not publish a /memory reg. Stock kona.dtsi uses a zero placeholder.",
  "Family-common reserved nodes inherited through xiaomi-sm8250-common.dtsi: xbl_aop_mem at 0x80600000 size 0x260000, disp_rdump_memory at 0xb0400000 size 0x01000000. These are not a complete dagu memory map.",
]
configuration = [
  "dts/dagu.dts memory@0 currently has reg = <0 0 0 0> as an explicit placeholder.",
  "payload.dram_size is intentionally unset so a single SKU is not pinned.",
]
procedure = [
  "On the target SKU, record the live /memory ranges and reserved holes, then set a single memory node and payload.dram_size for that SKU only.",
]
findings = [
  "Inventing a dram_size would silently exclude the other shipping SKUs. The skeleton records the variants and leaves a TODO.",
  "A conventional SM8250 DRAM base of 0x80000000 appears in other ports and in Linux board practice, but it is not written into this DTS as a measured dagu range.",
]
completion = [
  "The ADT DRAM range matches the measured SKU, and reserved regions used at handoff are accounted for.",
]
limits = [
  "No on-device memory map or firmware DTB memory node for dagu has been read in this work.",
]
next_action = [
  "Measure the target unit's DRAM banks and reserved holes; do not copy elish or enuma sizes.",
]
evidence = [
  { kind = "source", reference = "https://github.com/Rinko-Studio/android_device_xiaomi_dagu/blob/66695faea165da63e7a8eac781ea2241df06a6dd/README.md", result = "Documents Memory SKUs 128GB/6GB, 256GB/8GB and 512GB/12GB RAM." },
]


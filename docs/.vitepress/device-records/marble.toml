[[area]]
id = "memory"
status = "planned"
components = []
paths = ["device/early/**", "legacy-xnu/patches/**", "touch/marble_smmu_stream.*", "dts/**"]
inputs = ["Validated ADT, physical map, reservations, DMA widths/cache policy and stream ownership."]
configuration = ["Record actual board keys, device-tree properties, build flags and source revisions as resolved; no placeholder profile or feed value is treated as established."]
procedure = ["Use the documented offline workflow with explicit user-supplied inputs; preserve the command, source revision and observable result for each milestone."]
findings = ["Memory handoff/reservations, DMA widths/cache policy and SMMU ownership. Touch GPI and QUP wrapper have distinct DMA contexts.", "The sanitized DTS omits guessed RAM/reservation ranges. Legacy firmware allocated a real512MiB window; a DRAM envelope is not RAM capacity. GPI ring SID0x5b6 and QUP payload SID0x5a3 are separate mapping roles, not a DMA-safety proof."]
completion = ["Memory reservations reconcile and each enabled DMA engine stays within a verified mapped range."]
limits = ["SMMU decoder handles already-read words only; it does not program MMIO, DMA or SMMU. This area is not claimed Format-2 implemented or verified."]
next_action = ["Audit reservations and implement/verify each needed DMA context before enabling peripheral DMA."]


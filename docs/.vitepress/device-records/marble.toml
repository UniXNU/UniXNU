schema_version = 1

[device]
name = "marble"
soc = "SM7475"
os_profile = "ios-16.7.16-20H392"
summary = "Community legacy XNU 8796 source port for Marble. A historical temporary boot reached iOS Hello, but touch/setup remain incomplete; no matching upstream Format-2 profile/feed or Format-2 device build is claimed."

[[area]]
id = "configuration"
status = "planned"
components = []
paths = ["board.toml", "feeds.toml", "configs/**", "patches/xnu/series", "mac-build/**", "AGENTS.md", ".github/**", ".gitattributes", ".gitignore", "local.toml.example", "unixnu.lock", "sources.lock.json", "patches/xnu/**"]
inputs = ["iOS 16.7.16 inputs, reviewed SM7475 feed and board-specific ADT/configuration."]
configuration = ["Record actual board keys, device-tree properties, build flags and source revisions as resolved; no placeholder profile or feed value is treated as established."]
procedure = ["Use the documented offline workflow with explicit user-supplied inputs; preserve the command, source revision and observable result for each milestone."]
findings = ["Resolve board pins, OS profile, SoC feed, source selection, array replacements and patch order. No matching iOS 16.7.16 profile or reviewed SM7475 feed was present at upstream 0fc0fc1f9ddd0fbd4787738afef38667df5e0a95.", "Added the schema-2 identity, a real reference-only Git lock, matching iPhone restore identity/member hashes, input inventories and the official record workflow. The matching OS/SoC implementations are still absent, so example=true remains a build guard; a 13-area record pass is not a resolved build."]
completion = ["Reviewed profile/feed exists; all source pins and config resolve; selected components and overrides are recorded."]
limits = ["The published v4 tree is based on XNU 1b191cb58250d0705d8a51287127505aa4bc0789 and is an older dirty snapshot, not the exact tested kernel source. This area is not claimed Format-2 implemented or verified."]
next_action = ["Obtain reviewed matching upstream profile/feed, then resolve board pins and a clean source migration."]


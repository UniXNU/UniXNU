[[area]]
id = "input"
status = "planned"
components = []
paths = ["touch/**", "legacy-xnu/overlay/**", "dts/**"]
inputs = ["Goodix protocol, pin/power state, GPI ownership and verified mappings."]
configuration = ["Record actual board keys, device-tree properties, build flags and source revisions as resolved; no placeholder profile or feed value is treated as established."]
procedure = ["Use the documented offline workflow with explicit user-supplied inputs; preserve the command, source revision and observable result for each milestone."]
findings = ["Goodix SPI SE4/static GPII0, TLMM, power/interrupt state and separate GPI/wrapper SMMU contexts.", "Goodix9916R uses SPI0x990000,CS0,15MHz child limit, GPIO20reset/GPIO21IRQ. GCC IDs94/134/135 and GPI TX0/RX1/SEID4/protocol1/64TREs are inventoried. Clock enable/read/restore and snapshot return are observed; no Goodix SPI transaction or physical iOS touch exists."]
completion = ["Goodix transaction completes with bounded DMA/events and iOS HID contacts operate through setup."]
limits = ["Physical iOS touch is not implemented. Clock/prerequisite probes and host decoders do not implement a GPI DMA provider or HID event path. This area is not claimed Format-2 implemented or verified."]
next_action = ["Establish DMA ownership/mappings, implement GPI completion and Goodix protocol, then verify HID delivery."]


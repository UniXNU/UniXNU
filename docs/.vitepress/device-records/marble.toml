procedure = ["Use the documented offline workflow with explicit user-supplied inputs; preserve the command, source revision and observable result for each milestone."]
findings = ["Matching restore-derived firmware, boot payload, device-qualified FDT and handoff inputs. Private firmware/system images are not included.", "Measured legacy layout is Platforms/Xiaomi/marblePkg/marble.dsc and Build/marblePkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd, Android header v4. Board package integration is explicitly unfinished; no fabricated Kit.toml or vendor hash is used."]
completion = ["Clean payload boots and documents firmware, framebuffer and memory handoff."]
limits = ["Historical experimental kernel reached Hello through temporary fastboot boot; the published v4 source does not exactly reproduce that image. This area is not claimed Format-2 implemented or verified."]
next_action = ["Build the boot payload from public sources plus user-supplied firmware, then validate handoff on target."]


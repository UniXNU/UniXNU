[[area]]
id = "firmware"
status = "device-verified"
components = []
paths = ["docs/**", "tools/**"]
inputs = ["Vendor LK bootloader on the B slot, BootShim raw payload stub, mu-based UEFI firmware (Silicium e5Pkg), DarwinBoot EFI loader, payload FAT volume."]
configuration = ["Boot chain: BootROM to FDL to LK to BootShim to UEFI (4 MiB SILICIUM_UEFI.fd) to UEFI Shell (startup.nsh) to E5BootMenu.", "B slot boots the payload (misc slot record: B priority 15, A Android fallback 14); watchdog 300 s reboots failed boots.", "BootManagerLib launches the Shell through an E5 protocol (GUID 9A48E983-AB52-4043-828C-5366DCDADB26) resolved by LocateProtocol at TPL_APPLICATION because DXE event queues never drain without timer interrupts."]
procedure = ["Build the firmware and payload with uefi/build-e5.sh, make-e5-payload.py and mk-boot-payload.py in the e5-xnu repository.", "Flash with tools/e5-uefi-cycle.sh flash (writes boot_b payload at LBA 8 plus the misc slot record).", "Collect logs with tools/e5-uefi-cycle.sh collect (Android pstore ramoops zones survive the reboot)."]
findings = ["UEFI timer interrupts are not delivered (GIC delivery unconfirmed), so the UniXNU menu counts down by polling and UEFI event notifications at or below the current TPL never dispatch.", "AON registers are clock-gated: the keypad and AON GPIO banks need set-mirror clock writes (0x64901004, 0x64901018) before any register access or the AXI bus wedges.", "The Shell must be started from PlatformBootManagerAfterConsole via a direct protocol call; a signalling event queues forever without timer ticks.", "The paired complete FD and BootShim at e5-xnu b6949f4 boot both CI-306 experiments. The second report observes E5-PREV-CONSOLE: E5TW pos=16307 tail 4096, proving the previous kernel header reaches the actual UEFI reader. Both cycles return to fresh Android boot IDs on slot A after full payload readback verification.", "CI-314 Data rounds 61 and 62 preserve the entire already tested firmware prefix. Both complete 62926860-byte payloads match flash readback and return to Android A under fresh boot IDs. Round 61 recovers the matching-UUID APFS policy panic; round 62 changes only the ADT via e5-xnu 188f904 and retains live d=100/published/ready checkpoints after the early console wraps. Firmware code is unchanged; the paired reader and collector continue to retain usable evidence. See docs/logs/data-volume-round61.json and data-volume-round62.json.", "Rounds 63-65 all preserve the same complete firmware prefix and CI-315 boot payload. Each 62926860-byte payload matches full flash readback before reboot. The collector requires changed Android boot IDs and recovers the matching kernel panic in 63/64; the R65 retained ring instead records continued late service activity without panic/ENOSPC. Android A recovers after every test. See docs/data-capacity.md and docs/logs/data-capacity-round63.json through round65.json.", "The v6 display registration experiment uses the retained r79 payload firmware, EFI files, seed, trust cache and lcd ADT. Only kernel.macho is replaced with CI 335; the complete candidate payload is verified against boot_b before reboot. The family audit JSON records a host observation and does not qualify new firmware code.", "R81 uses CI336 with 32768 more kernel bytes. The payload helper extends only the kernel chain into 16 verified free FAT16 clusters and adjusts its directory size; firmware bytes and every other file allocation/content remain fixed against r80. Both FAT tables agree, independent mtools reads reproduce all nine files, and all 62926860 flash bytes match before the sole reboot. R81 completes the hardware-watchdog cycle and returns to fresh Android A; retained current-v7 samples and the full unchanged Data hash are archived. This qualifies the fragmented kernel FAT read on this boot, not new firmware functionality."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["GIC timer delivery in UEFI is still broken; countdown and Shell launch work around it with polling and direct protocol calls."]
next_action = ["Root-cause the missing UEFI timer interrupt through GIC distributor/CPU-interface state dumps."]


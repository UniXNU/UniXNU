[[area]]
id = "emmc-windows-r257"
status = "device-verified"
components = []
paths = ["scripts/emmc/SystemOSWindow.h", "scripts/emmc/NativeEmmc.cpp", "scripts/emmc/NativeSd.cpp"]
inputs = ["r256 verdict: deterministic console-text/zeros delivered by SD reads (APFS obj_checksum_verify failures) plus a watchdogd crash panic at kernel+970-1000s; user order to move SystemOS+Data to eMMC raw windows inside a shrunk userdata (10 GiB reservation).", "Shrunk f2fs userdata p70 to 3107840 blocks (GPT end 40103935) with the kanoqwq/openwrt-tools f2fs-online worker; SystemOS container dd'ed to LBA 40103936 (sha b4908cde...) and grown 4 GiB Data container to LBA 46555136 (sha d8b88ba4...), both readback-verified."]
configuration = ["SystemOSWindow.h: E5SystemOS::base 12582912->40103936, E5Data::base 19034112->46555136; sectors, UUIDs and superblock CRC unchanged. Bases now sit past SD capacity so NativeSd::fits() self-refuses and the eMMC host owns both windows.", "NativeSd.cpp: window refusal no longer fails start(); the host still arms the UMP9620 watchdog (e5-systemos-boot) and publishes the SD card read-only. The SD card must stay inserted: no card means no watchdog arming path.", "NativeEmmc.cpp: multi-block CMD18 readMulti with whole-range 0xCAFEBABE poison + tail-poison fail (r256 silent-corruption defense), r253 verify-retry windowReadVerified, r254 rw+ big-read trace, per-sector CMD24 writeSingle for Data writes, setDivider/liftClock (capabilities base clock, <=26 MHz legacy ceiling, CMD6 EXT_CSD 183 4-bit + HC1, 4x LBA1 CRC stability checks, fallback to identify clock), E5SystemOSDeviceEmmc/E5DataDeviceEmmc wrapper devices published from start() after superblock probes before registerService.", "XNU boot-arg panic_on_crash_disabled=1 (existing TUNABLE, kern_exit.c:1695) demotes the watchdogd-exit panic; launchd (initproc) panics remain."]
procedure = ["Commit kext changes, dispatch the kernel builder with this device_ref, fetch kernel.macho via e5-xnu tools/e5-kernel-fetch.sh.", "Pack the r257 trial from the accepted USB artifacts with --extra-arg panic_on_crash_disabled=1 and the watchdog policy; flash, verify readback, run one bounded cycle with native USB capture, collect journal+pstore."]
findings = ["Latest R284 evidence supersedes the early r257/r261 bring-up failures: current windows at OS32018432/SystemOS43888768/Data50339968 boot original userland with no retained integrity/panic markers and all 37 protected samples pass. R286 only adds gated HID startup to NativeSd.cpp; the tested window geometry and storage transfers are preserved.", "R257 brick + recovery; R258 first eMMC-windows boot (journal bytes served to Data reads); R259/R260 liftClock DMA overrun (fixed 858522d); R261 journal-off boot: windows mount, SystemOS union succeeds, one 16 KiB read at window chunk 6170 corrupted with content that exists nowhere on media while Android reads the LBA clean - corruption is in the XNU read path, per-call deterministic, beyond 1 MiB. See the R255..R261 findings entries in the usb-console area for details."]
completion = ["The bounded OS/SystemOS/Data windows mount with correct UUID/geometry, original userland reads and Data writes complete without retained integrity errors, protected windows pass and Android A recovers."]
limits = ["v4 multi-block SDMA behavior on this controller is unproven until the r257 log shows readMulti success; the poison tail check turns non-advancing transfers into hard read failures instead of silent corruption.", "Clock lift is capped at the 26 MHz legacy ceiling; HS200/HS400 tuning is out of scope. If liftClock fails, windows still serve at the identify clock (kilobytes/s) and the scan will not finish in any watchdog window."]
next_action = ["r262 corruption map: sparse per-1MiB CRC coverage of both windows + dense fault region + wrong-chunk hex dump; identify the wrong-content source and the positional/time distribution, then fix the read path."]


inputs = ["Unisoc sprd,sdhci-r11 eMMC host at physical 0x22200000 (warm-inherited from LK: card selected in TRAN state, RCA 1), eMMC 61079552 sectors (29.125 GiB) with a 70-entry GPT, cache partition at LBA 0xd0a800 size 0x20000 sectors (64 MiB; corrected from the earlier 1 GiB claim), full disk mmcblk0.", "Independent Unisoc sprd,sdhci-r11 SD host (sdio0) at physical 0x22210000, IRQ SPI 203; SD16G SDHC card, 30244864 sectors (~14.4 GiB), RCA 0x5048, Android runs it at SDR104 4-bit 1.8 V.", "The SD card currently carries the original OS raw GPT image at LBA 0 (6077580800 bytes, SHA256 e5634d04a8ac35f024845f583394e0a35deb26a04cb0c00286a8674e25a9a4f2). Its APFS partition spans LBA 34..11870241 and OS volume UUID 04769D26-2CA0-4825-B443-E2E5F88300F2. The earlier e5-openwrt ext4 fixture and Android references remain archived.", "Card power and ADI facts (vendor source audit): vmmc/vqmmc are UMP9620 PMIC LDOs LDO_VDDSDCORE/LDO_VDDSDIO reached over the ADI bus at physical 0x64400000 with the slave window at 0x64420000; LDO enable = PD bit clear (0x21ac/0x21b8), 3.0 V = VOL 0xb4 (0x21b0/0x21bc), write-protect unlock 0x23d0 = 0x6e7f; aon fast-hotplug block at 0x64900520/0xba0 with APB-prot direct-access lock sequence when locked."]
configuration = ["NativeEmmc (scripts/emmc/NativeEmmc.cpp) is compiled into the kernel by e5_emmc_build.py against the storage ABI derived from the pinned kernelcache.", "v2-v4 probes cover card identification, EXT_CSD, SDMA/ADMA MBR/GPT reads and boot_b/misc readback. v5 publishes the whole disk and IOGUIDPartitionScheme enumerates 70 partitions.", "v7 published a cache window at LBA 0xd0a800 with an incorrect 0x200000-sector length; v8 corrects it to the actual GPT/sysfs length of 0x20000 sectors (64 MiB), bounded by physical card capacity. The 8 MiB test image inside that partition contains its own GPT and an APFS volume E5EMMC; the physical eMMC GPT is unchanged.", "board.toml and the ADT now select SD OS volume UUID 04769D26-2CA0-4825-B443-E2E5F88300F2. The separate eMMC recovery baseline #59 retains UUID 238A9EDD-6788-4B2E-BA4E-C1F70AE25B64, kernel 262/v8, a 512 MiB memory request and the signed v9 seed; #58 retains its 256 MiB handoff.", "NativeSd (scripts/emmc/NativeSd.cpp + SdProtocol.h, personality in patches/xnu/e5-emmc-personality.patch) publishes the SD card read-only. Cold path: ap-ahb sdio0_eb gate, adi_eb gate/reset/mux (idempotent), PMIC LDO enable over ADI (3.0 V both rails), fast-hotplug enable with detect-polarity bit21 SET (cd-gpios flags are 0 on this board), host RESET_ALL + DEBOUNCE DLL backup bits, card hw_reset pulse, 400 kHz 1-bit legacy init (double CMD0, CMD8/ACMD41/CMD2/CMD3/CMD9), capacity pinned to 30244864, 4-bit ACMD6, then the sdio0 chain is observed (not forced) and switched to the Android rpll chain for 24.375 MHz default speed with full re-verify.", "v15 adds CMD18 multi-block reads (readSectors, 16-sector chunks, v4 32-bit block counts, CMD12 stop, self-compared against single-block CRCs before adoption) used by doAsyncReadWrite; measured 128 sectors: single 36207 us (1.77 MiB/s) vs multi 5995 us (10.7 MiB/s, 6.0x).", "v16 adds the ext4 read-side walk (pure parsers ext4ParseExtents/ext4CountDirents in SdProtocol.h): sb at LBA 2050 -> group descriptor 0 (inode table fs-block 145) -> root inode 2 extent -> root directory fs-block 4241 with 22 dirents and CRC32 70633ae6, all read through the CMD18 path after the speed-mode verify. The image's superblock first_ino/inode_size fields are corrupt (0/11); the real 256-byte inode stride is proven from the on-disk tables and passed explicitly.", "Acceptance automation: tools/e5-sd-check.py (e5-xnu) validates every board report from the last 'NativeSd: v1 start' marker — cold-path evidence (gate/pmic/hotplug polarity/CMD8 echo/ACMD41/CMD3/CSD/selected), four reference-LBA CRCs, mode verify (legacy or default with rpll chain), ext4 walk lines, timings, and the full eMMC regression set."]
procedure = ["Clone the existing test image, preserve its volume UUID, create /dev and install the signed v9 PID1, ls/cat/clock and numeric aliases. Generate the trust cache from the actual installed binaries; see docs/emmc-seed.md.", "Back up and compare the previous 8 MiB cache test image before replacing only that existing test region from Android; verify the entire replacement by readback SHA256.", "Keep kernel/ADT/EFI/configuration fixed, rebuild FAT and rerun mk-boot-payload.py, flash through e5-uefi-cycle.sh and verify the full boot payload by readback before collect.", "Require the expected eMMC window, E5EMMC UUID/mount, INIT-START-v9, console fd0, TIOCGETA/ICANON, raw command exit statuses and SH READY/READ-BLOCK in the same report.", "For SD rounds: capture Android references first (tools/e5-sd-reference.py, ext4 walk recon via adb dd), then flash the kernel with the new NativeSd version and gate the round on tools/e5-sd-check.py PASS over the collected report (see docs/logs/sd-round-log.md for the 17-round root-cause chain)."]
findings = ["R286 integrates gated E5 HID startup and its archive before launchd. The accepted display/storage implementation and original Apple family instructions are preserved; new input runtime qualification is pending. ", "R278 candidate: Data writes use 1..8-sector SDMA CMD25 after an on-boot qualification on the existing spare page at LBA 58728704, outside Data. The spare page and both adjacent guard pages are read twice; a distinct per-word pattern is written/read back, both guards are checked, and all three pages are restored through CMD24 and read back. Failed qualification retains CMD24; failed restoration refuses window publication. Every enabled Data write retains staged bytes in the non-DMA shadow and succeeds only after card-ready, CMD18 readback and byte-for-byte agreement, with ioLock held throughout. A full pre-R278 4GiB Data backup is retained by the host before flashing. Host compilation/link/prelink and mtools payload readback pass (kernel abcfc2d2); device acceptance pending.", "R277 adds a lock-free VM page census next to E5IO/E5CS4K. The live kernel manages 512MiB (131072 pages), not the full physical 2GiB; measure pressure while the built-in application database seeds before attributing all small I/O to a stalled graph.", "R275 live observation: the pre-launchd sweep executes in PID 1; pinned ubc_subr.c identifies cs_native4k_prepare as the eager 16K-authentication/4K-digest derivation path. Sampled 1MiB reads take about 74ms with only 1-3us waiting for ioLock. R276 removes unused diagnostic CRC passes after the trace quota (including the discarded CRC on every non-first bulk chunk), retains canary rereads/comparison and locked delivery, and publishes existing native4k read/hash timing counters. Device acceptance pending.", "R274 holds ioLock across staging, DMA/verification and client delivery on both eMMC window paths and Data I/O; NativeSd Data I/O follows the same rule. The supplied R274 USB capture has three boots with no CAFEBABE, APFS checksum/corruption, code-signature load-error or panic markers. R275 adds a lock-free cumulative E5IO dump and bounded E5READ timing/context samples (first four large requests and every 128th thereafter); context PID is not necessarily the original requester, counters are submitted requests, and hardware validation remains pending. In R274 boot1, two post-early-boot samples advance by 127370 requests and 1220784 sectors (596.086 MiB), so absence of large-read logs does not establish storage inactivity.", "Physical GPT edits were restored across reboot in earlier tests; the boot-chain mechanism is not isolated. Partition-content writes survive. Current tests leave the physical GPT untouched.", "The v6 second-device/bare-container attempts did not produce a root mount, including the publisher-thread variant. v7 publishes the GPT-wrapped image through the original matched service and mounts it; the separate effects of GPT wrapping and publication were not isolated.", "IOKit reads through doAsyncReadWrite are verified for GPT, APFS metadata and seed executables. This proves the tested read path, not every error/recovery case.", "Flash #54 mounts E5EMMC with old v8; #55 adds v9, real console fd0, ICANON and four standard commands exiting 0. An extra long-argument cat SIGBUS is reproduced before its first trace in #56. #57 fixes the shared static-tool C stack alignment: all five commands exit 0 and the marker file is read. Its original argument pointer is 0x16fdffde8 (8 modulo 16), preserved while the working SP is aligned. SH READY/READ-BLOCK follow with no devfs, AMFI or child exception failure.", "The #55 through #59 seed-root images match full post-boot readback. #58 changes only the kernel and validates error-first reads, truthful write protection and the measured 64 MiB cache limit. #59 changes only the ADT memory request and passes the same five-command root workload.", "SD bring-up root-cause chain (rounds 1-13, docs/logs/sd-round-log.md): Android shutdown residue (PMIC LDOs off, host ap-ahb gate off) plus two decode errors and one silent misconfiguration. ADI reads external-aborted because /soc/aon child unit addresses are OFFSETS against ranges 0x64000000 (controller 0x64400000, slave window 0x64420000), not the raw 0x400000/0x420000 from the node names — the cause of five panic rounds. With power on, every response command failed command-CRC with a zero response register: the aon fast-hotplug detect-polarity bit21 was inverted versus the vendor expectation (E5 cd-gpios flags cell is 0; the 0x23 cell is the pin number), and the fast-hotplug machinery gates the response path while it believes no card is present. Setting bit21 made CMD8 echo immediately; rounds 14-15 confirmed the clean driver.", "SD throughput ladder (round 16): 6.5 MHz single-block (v14) -> 24.375 MHz single 1.77 MiB/s -> 24.375 MHz 16-sector CMD18 10.7 MiB/s with byte-identical self-check; the rpll sdio0 chain left by Android shutdown is alive at XNU (src 195 MHz observed, no fallback needed).", "The ext4 walk is fully decoded offline against the card (docs/logs/sd-ext4-reference.json + raw captures): root inode 2 (itable+256, extents flag) -> single extent -> fs-block 4241 -> 22 dirents incl '.' inode 2, init (file, inode 537), OpenWrt markers overlay/rom; driver evidence lines ride the same board reports and are checker-gated.", "The ADT-only image-set identity correction resolves the actual mount-phase-1 exit 66. Original launchd reaches mount-phase-2, init-with-data-volume, fips, keybag, usermanagerd and tzinit task markers. The next genuine panic is tzinit[17] exiting 30 after no writable Data is found and its system-partition fallback returns EROFS. The original OS/SystemOS SD windows remain read-only.", "After round 60, a read-only 32 MiB SD Data readback has SHA256 42b81cab9b044819aa69d498b2dcf67dcefdcbb9a90651a04891c30d089b00b8. All five checksummed APSB objects and diskutil on the corresponding read-only local image report UUID 30ADC749-351F-4FFF-998A-20E1B683859F; the driver selected stale UUID B5A22774-89CF-41E5-A62B-5AFA6B2710BC. Source now matches the fixture and repeats publication/lookup checkpoints in late sampled SD reads. Host identity, negative controls, failure cleanup and patch application pass. CI 314 builds and prelinks a0a5f1e291b93eda422eeaa945f2c71f622eaabc. Full-readback round 61 confirms RAM publication, the correct UUID at /dev/disk4s1 and entry into RW mount; original APFS then panics on unencrypted Data (apfs_vfsops.c:2276). Its binary checks the /filesystems/DoNotUseSEP property before that guard; round 62 adds only that ADT property through the e5-xnu payload helper. Round 62 adds only that ADT property and all five late samples report d=100, p=published, q=ready; original APFS advances from xid 6 to at least 246 through real RAM Data writes. Later services then exhaust the 32 MiB volume (209-211 free blocks) and report ENOSPC. The card remains unchanged and Android A recovers. Early tzinit exit lines are overwritten, so its explicit exit-zero checkpoint is not retained. See docs/data-volume-uuid.md.", "Round 63 preparation expands the same Data UUID to a 128 MiB APFS RAM image (262144 sectors) after round 62 ENOSPC. Host image checksum/UUID validation and window tests pass; all 82 ordered patches apply. A development-only startup hook sets and reads back the mounted Data root uid/gid 0:0 and mode 0755 before claiming d=100. The original OS/SystemOS windows remain read-only; CI and board acceptance are pending.", "CI 315 and rounds 63-65 validate the 128 MiB volatile Data window. d=100 now includes read-back verification of Data root uid/gid 0:0; t=17:0 directly records the committed normal tzinit exit. Round 63 ENOSPC is caused by a roughly 127 MiB watchdogd core; round 64 redirects the core path and retains the same watchdogd SIGTRAP without ENOSPC. Round 65 adds the root-owned standard launchd override for com.apple.watchdogd only: 248 late samples remain d=100/published/ready/t=17:0, reads reach 251392, and no panic or ENOSPC is captured over the hardware-watchdog window. The entire 128 MiB card fixture remains unchanged after each observed run. This is a development baseline with no SEP and a per-service watchdog policy, not persistent Data or complete UI qualification.", "Display probe v6 adds sampled m/k/l registration, loader-state and full-return telemetry to NativeSd progress. The SD transfer and Data publication paths are unchanged; CI 335 compiles, links and prelinks v6 successfully. R80 retains 202 complete late samples with d=100/published/ready/t=17:0 and completed requests 221312..247040. The full 128 MiB card fixture hash is unchanged after fresh Android A returns. This headless registration test does not qualify UI or persistent Data.", "V7 adds persistent v/s/r construction, registered-parent-size and postModLoad telemetry. SD transfers and Data policy are unchanged. R81 retains 173 complete samples at d=100/published/ready/t=17:0 with request counters 225408..247424, while the concrete allocation/init/release checks all pass. Fresh Android A returns; the complete 128 MiB Data fixture hash is unchanged.", "2026-11-05: r184-r198 hash mismatches name SystemOS disk8s1 inode 50 (dyld_shared_cache_arm64.01), not writable Data. Android buffered and O_DIRECT reads independently reproduce varying wrong bytes at the exact failing pages while eMMC controls pass. A backed-up rewrite of the unchanged original .01 extent restores all four pages (40/40 direct reads), the full 3,303,014,400-byte SystemOS SHA256 b4908cde, and protected metadata. Cold-boot validation is pending in r199; SD media/controller fault separation and long-term retention remain unqualified. See docs/logs/systemos-repair-20261105.json.", "NativeSd exposes cumulative submitted-request read accounting as RD=512-byte-blocks:operations on the sampled progress line; compare counter deltas with census timestamps to measure SD scan throughput. The card-backed Data fixture is loaded into a volatile RAM device at each boot.", "The r239 source adds experimental CMD25 writes and an e5-data-persist boot-argument gate for a 1800-second Data-window flush at LBA 19034112 (262144 sectors). Hardware write correctness, crash consistency and cross-boot database retention are unqualified. Back up and verify the complete destination window before enabling the gate; build and verify a fresh payload from this source before a device trial.", "The opt-in e5-emmc-log-test=<nonce> probe validates primary GPT header and entry-array CRCs, the known boot_b partition bounds, payload and AVB metadata exclusion, and writes one CRC-tagged CMD24 sector at boot_b+61 MiB. It checks R1/programming completion, flushes an enabled eMMC cache, and reads the sector back before publishing the read-only service. R240 passes the single-sector write and warm-reset readback with cache disabled: CMD24 status 00000003, R1 00000900; all other boot_b bytes and the GPT are unchanged. See docs/logs/emmc-log-probe-r240.json. e5-wdt-seconds accepts 60..3600 seconds for bounded diagnostic boots; the default remains 3600 seconds.", "The e5-emmc-log=<nonce> journal captures console bytes in a 64 KiB RAM queue using a nonblocking producer lock, then commits CRC-checked 512-byte records from a thread call. Eight independent boot slots occupy boot_b offsets 61..63 MiB; early records are retained while later records rotate inside their own boot slot. Producer contention and queue overruns are counted. Storage failures quarantine the DMA buffer and stop the journal. R241 and R242 qualify periodic console writes and cross-boot slot isolation with 86 and 73 valid records, no reported dropped bytes, CRC failures or stream gaps. See docs/logs/emmc-boot-journal-r242.json. Cold power loss, interrupted media writes and full slot rotation remain unqualified.", "The r244 source adds the opt-in e5-data-wt Data write-through: the Data block service lands every written range on the card (8-sector CMD25 chunks under the host lock, the DMA copy inside the lock) before completing the I/O and completes kIOReturnIOError when the card write fails, turning the RAM image into a read cache. WR=blocks:operations:failures rides the sampled progress line next to RD=. The r239 pre-lock memcpy in flushDataWindow moves inside the lock. r233/r234 established that each watchdog kill leaves the LS recovery file in place so every boot restarts the full bundle rebuild; write-through is the persistence half of letting a completed database survive to the fast path. Card-write correctness, crash consistency and cross-boot retention are unqualified until a device round passes: back up the destination window first, then compare RD/WR deltas with the LS census.", "R243 (kernel 461e2f06, watchdog 3600 s, journal nonce 20261106, 511 records over 40.2-3635.4 s, zero drops) answers the cold-rebuild question: the LS seeding group never returned to zero (E5LSD raw=fffffffb constant at the single census, t=1483.6 s), SpringBoard never spawned, and the SD host served its last read at t=68.4 s (call 512 of the throttled rw log, ~1.2 MiB total) - the userland runs from pre-staged RAM, so the rebuild is not I/O-bound and no APFS/spaceman ENOSPC appears through the window. At the census one lsd thread (tid 2b5) is still inside the bundle enumeration (CoreServices+0x9515c in the LSDatabaseBuilder region over InstalledContentLibrary +0x53948/+0x499c8 frames) while the other workers sit parked at CoreServices+0x145050: a single long-running scan that does not terminate in one clean hour on this board, versus the same userland reaching SpringBoard in 100 s-5 min under QEMU. The CA-state-gated census fired only once, so E5LSDH/E5THS histories are empty and slow-versus-looping stays open; the next round needs a forced periodic census and the WR= counters to measure Data write volume. See e5-xnu docs/ls-coldrebuild-r243.md.", "The r245 source (feat/data-media-window-r245) grows the Data window to 4 GiB (8388608 sectors, same base 19034112, ~1.3 GiB card spare) and serves it media-direct: reads stream 16-sector CMD18 chunks and writes land as 16-sector CMD25 chunks under the host lock before their block I/O completes, both counted in RD=/WR=; a failed chunk answers kIOReturnIOError. The 128 MiB RAM image, its boot-time whole-window load/verify and the r239/r244 flush/write-through machinery are removed - there is nothing volatile left to mirror. prepareDataDevice keeps the NXSB gate and cross-checks the container block count against the window (a stale small fixture logs MISMATCH instead of surfacing as ENOSPC later). The card container must be grown to 4 GiB macOS-side first (apfs resizeContainer preserves the volume UUID); the 2026-11-06 pristine fixture backup is e5-xnu uefi/build/data-wt-r244/backup/data-window-128m-r243.gz. E5CAProbe census no longer requires a backboardd task (r243 sampled once in 3600 s) and a new e5_ca_probe_periodic runs it every 60 s from the display paint tick, dumping 2 s later - the series answers slow-versus-looping for the LS scan. Watchdog rounds stay at 600 s. Card-write correctness, crash consistency and cross-boot retention remain unqualified until the device round passes.", "R245 device round (kernel bf1fe73d, payload 9d72e318, watchdog 600 s, journal nonce 2026110602): the 4 GiB media-direct window publishes cleanly (container 1048576 blocks match, no publication failure) and the boot reaches the SystemOS container about 18 s earlier than r243 (no whole-window load), but the console freezes mid-printf at the SystemOS disk dev_init (~39 s) - the retained ring ends on a half-printed line - and nothing at all prints for the remaining ~560 s until the PMIC watchdog recovers. The journal slot for this nonce holds zero records because the journal starts at 39.5 s, right at the freeze; the ramoops dmesg zones carry the console. No Data-window op is on the timeline (the startup script mounts Data after SystemOS), the swap-file failure preceding the freeze also occurs in r243 which continued past it, and the census would not fire until 90 s. r246 (fix/data-window-instrument-r246) instruments the first sixteen media-direct ops, drops both dataMediaIO directions to the 8-sector command shape, and adds a ~5 s paint-tick heartbeat so the next capture separates console death from system death.", "R246 device round (kernel 9dc8adef): the media-direct Data reads work - sixteen-plus dmio rd ops (metadata then 8-sector walks to block 40128, zero failures) and the boot mounts the OS volume - but the kernel panics in the SystemOS-container phase (~40 s) in every one of three boots (generations 4-6), each journal slot again holding zero records because the panic lands before the first 5 s journal commit while the panic dump itself only reaches the RAM tee (the E5-PREV-CONSOLE firmware salvage caught the banner tail). r247 (fix/data-window-instrument-r246 + panic-flush) adds e5_journal_flush_panic: the tee panic hook drains the queue to eMMC on the panic CPU with try-locked host access (a stopped CPU may own ioLock; the flush gives up rather than spins), and the journal cadence drops to 2 s.", "R247c device round (kernel a9fc3670, payload 9da969ac, DoNotUseSEP ADT restored): the deepest 4 GiB boot yet - the Data volume mounts read-write (disk8s1 mount-complete, E5SystemOS data mount result 0), launchd starts, 40 paint-tick heartbeats run to ~450 s and the journal captures 271 records. The round also proves the panic-capture stack end to end: the r247b panic text (E5PANIC: unencrypted data volume is not allowed @apfs_vfsops.c:2276) landed in both the journal and the firmware salvage - root cause was every payload since r244 using the bare CI ADT without the set-e5-scratch-data.py DoNotUseSEP injection (the r245/r246 freezes were the same panic dying mid-print). The remaining failure is the write path: the first media-direct Data writes fail at the command level (NativeSd: mwrite fail lba 19034128 n 8 st 00018001 r1 00000c00 - the r239 multi-block CMD25 shape, never hardware-validated), and the reset-poisoned host later serves EIO to OS-volume reads (fsck binary page-in at ~450 s fails errno 5, launchd emergency-exits on the boot task). r248 replaces writeSectors with per-sector CMD24, the shape the r240 probe proved on this host.", "R248/r248b/r249 device rounds (kernels 41006f8b/6e3fd277): per-sector CMD24 writes work - zero NativeSd write failures - and the first APFS transactions ever land on the card and survive reboot (six container blocks at 0x1000-0x6000 differ from the pristine grown seed when read back from Android). The boot now mounts the 4 GiB Data volume, starts launchd and then dies deterministically at ~84 s in three consecutive boots (journal commits stop at 84.x s with identical record counts, no daemon ever spawns, a panic banner reaches the firmware salvage). All three panic-capture channels miss the reason: the journal dies with the system, the r247 panic flush produces no output (it runs before the debugger stops the other CPUs and can deadlock on the tee ring lock), and the r249 lock-free bare sector needs a path that never executes. r250 (9a28e7d) adds a fourth channel that cannot fail: the panic hook writes the PANI magic, the panic caller PC and the first 32 reason bytes to physical 0xC6000000/0xC6002000 - plain DRAM that the firmware ring-resume prints unconditionally on every boot with no locks, console or eMMC in the path.", "R250 device round (kernel 58f27bb8): the scratch channel arms cleanly (NativeEmmc: panic scratch mapped) and the boot repeats the deterministic death one record later (85 records, 86.6 s) - but the firmware reads 0xFFFFFFFF from both 0xC6000000 and 0xC6002000 on the next boot, so not even the initialization zeros survive the reset path. Either the ~86 s death is a hard freeze that never calls panic(), or the region is scrubbed across the PMIC watchdog reset. Next probe for the channel: a rolling heartbeat word written every second distinguishes a silent region (still readable next boot) from a cleared one.", "R251 (device, pending flash): the r250 0xFFFFFFFF readback is attributed to the mapping class, not the region: the prz console tee writes through ml_io_map() device windows and demonstrably survives the watchdog reset, so r251 maps the panic scratch 0xC6000000+0x3000 the same way (ml_io_map, uncached device), elogs the PREVIOUS boot's scratch words before touching anything (scratch pre - journal-persisted answer even if the firmware read stays dead), arms word0=E5X1 0x31583545 with word1=journal nonce and verifies readback, adds a heartbeat: the 2 s journal pass lock-free stores pass count (word2) + uptime ms (word3) to the scratch before any media work; the panic hook keeps PANI 0x494E4150 + pc + FNV(reason). Interpretation matrix: E5X1+pass count in the firmware line = channel works, death is a hard freeze; scratch-pre readable in journal while firmware reads junk = loss in the LK/DDR-init window; PANI = real panic captured. [Entry reconstructed r253: the original append was truncated mid-write when the session ran out of context.]", "R251 outcome + R252 + R253 (device+host, local-build era): the first fully local kernel (this Mac, Xcode 27.1, pinned unixnu tree; ce8e6d3c, LC_UUID 003BACCC-E87F-3A00-902E-85B9E6CAC8F3) boots and journals (nonce 2026110602 generations decode 85/86 records). Scratch channel verdict: arm+readback of E5X1 works in-boot, but the zone does not survive reset (next XNU init pre-reads zeros, firmware reads LK-era junk 00024200/7A31000A/01B07A00/03D87011) - 0xC6000000 is rewritten by early firmware/LK between XNU death and any reader; plain-DRAM scratch closed, prz console zone (0xFFF80000/0xFFFB0000) remains the only cross-reset channel. That zone delivered the full r250 death reason: apfs_announce_hash_mismatch disk6s1 inode 54 (= dyld_shared_cache_arm64.05, 115458048 B, extent LBA 13080016) stream offset 86409216 expected 211fbc3f079f3e60cad3591f0dd6e84847b2e34d8fa551ee50d8dd3e4d687b8b got 326cf18c... then bdfb6494... (same offset, DIFFERENT got bytes per boot) -> apfs_vnop_read retval 94 -> check_signature pid 1 error 94 -> dyld cache not loaded -> launchd Library not loaded /usr/lib/libSystem.B.dylib -> initproc panic (kernel UUID 1D514D4E = r250 CI build). r252 forensics: Android raw pull of the whole SystemCryptex container (mmcblk1 skip=6144 count=3150, base LBA 12582912) vs staged source uefi/build/system-audit/userdata/systemos.img - Nov 5 full readback b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f was byte-perfect, today exactly 9 real differing 4K blocks all inside dyld subcache extents (container bytes 335101952/335392768/340467712/340926464/340934656/341037056/341123072 in .05, 1813651456 in .33.dylddata, 2040143872 in .35), every differing byte a SINGLE-BIT flip (XORs 0x10/0x40/0x08/0x80/0x02) -> marginal media cells reading unstably under XNU bursts, degraded after the r248+ write-enabled boots; XNU got-hashes exist nowhere on card. Repairs: 9-block rewrite (readback x5 == source) still failed next boot at offset 80969728 (whack-a-mole) -> FULL container rewrite from the staged source (dd seek=6144 conv=notrunc, 194 s) with TWO full readbacks == b4908cde. Boot outcome: boot-8 hit the same wall (check_np failure, journal ends 15.5 s uptime at DPU t=310 ticks; paint tick = 50 ms so E5HB %600 = 30 s, E5DPU %100 = 5 s - counters are TICKS not seconds), but boot-9 RAN PAST THE WALL: launchd alive (E5PROC pid=1 exit=0 active=1), 20 processes seen, 60 services registered (E5LIVE seq=3), journal 210 records, DPU ticks with live panel CRC to t=2810 (140 s), then silent death at ~140 s (no records after; ring clobbered by the Android fallback so panic-vs-freeze unknown). r253 change (6a7b8d0): read verify-retry in the NativeSd base read path - every 8-sector CMD18 and single-sector chunk is re-read and delivered only when two consecutive reads agree (3 reads max, last wins); RV=chunks:unstable rides the rw-done census. Kernel f6ea63cde7b2e321c9035f3606df1566b4343a914b4fd9fde9cc89f8ad41ff1c, payload e5-uefi-r253.bin (e50bc10b9c3d513b, 62926860 B). Pending flash outcome.", "R253 + R254 (device+host): media ruled out, 300 s watchdog found. r253 (6a7b8d0) added read verify-retry (two-agree delivery, 3 tries) to the NativeSd read loop: zero 'rv unstable' lines in the 208-record gen-10, delivered chunks pairwise-stable, so post-rewrite media reads are clean. r254 (f6a67ab) traced big reads: gen-12 journaled 726 records (511 retained), a streaming sequential scan of 1 MiB reads (rw+ exit full 2048/2048 each, LBAs 14709168->14715312 stepping +2048 = SystemOS container byte ~1.09 GiB, the LS bundle-rebuild scan), last record 'rw+ enter 2048 at 14715312'. All four long boots (r251 boot-9, r253 gen-10/11, r254 gen-12) die at uptime_ns 338.3/338.5/338.8/339.4 s - a deterministic timer, not media, not a wedge. Calibration: NativeEmmc arms the UMP9620 watchdog at driver start (boot-arg e5-wdt-seconds=300, census line 'wdt window 300s'), driver start is ~38 s into kernel boot, 38+300=338 s kill; nothing pets it. The system at death was healthy: reads completing, launchd alive (20 procs), panel painting live CRCs. Tick scale corrected by uptime_ns correlation: 1 paint tick = 120 ms (8.3 Hz), E5HB every 600 ticks = 72 s, E5DPU t= every 100 ticks = 12 s; uptime_ns is authoritative. Fix flashed: payload toml e5-wdt-seconds 300->3600 patched in-FAT (file 789->790 B, same cluster, dir size field patched, payload e5-uefi-r254-wdt3600.bin ec0e88b3, source uefi/Platforms/Unisoc/e5Pkg/payload/unixnu.toml synced). Expect the kill at ~3638 s uptime, giving the rebuild scan a full 3600 s (r243 precedent: lsd scan still active at 1483 s, 25x slower than QEMU). Next wall if the scan finishes: the SpringBoard/lsd CoreServices+0x1029c8 dispatch_group_wait era. The SD card has proven marginal cells (9 single-bit-flip blocks rewritten in the r252 full container restore) - replacement advisable long-term.", "R255 (device+host, 2026-11-07): first live-watched boot over native USB CDC ACM + first scan-rate measurement. Payload d7a8377f built from the accepted USB artifacts (kernel 185e7376 = r254 source + USB console, firmware d2603981, wdt 600, nonce 2026110701, e5-usb=1), flash readback verified. USB capture connected 0.7 s after start ('E5 XNU log'), 552576 B over 589.2 s dropped=0, disconnect = the watchdog kill; kernel.log is now the authoritative stream (journal slot 2026110701 retained only 511 records as a partial ring). The LS bundle-rebuild scan ran the full window at a steady 3.25-3.37 MiB/s: 2045 completed 1 MiB reads (rw+ exit full), LBA 12633360 -> 16805536 with a read in flight at death. The scan restarted from the SAME LBA 12633360 as r254 and re-read the identical region - deterministic, no cross-boot checkpoint; r255's 600 s covered exactly 2x r254's 300 s. Census every 60 s (E5CA g=2..18) all counters 0 (no SB, no transitions), E5PROC launchd only, panel painting with a single static CRC 11b0af80 the whole window. System healthy at death - the watchdog is the only killer. Projection: SystemOS container spans ~LBA 12414384..18865584 (3.07 GiB); remaining ~1.0 GiB needs ~310 s more reading, scan ends ~kernel+950-975 s, then lsd DB write + SB/backboardd chain (unmeasured on board; QEMU ~100 s post-ready, board historically 10-25x slower). Watchdog policy hardened this round: payload default 300 s, ceiling 600 s, longer windows require the user's explicit E5_WDT_AUTHORIZED=<seconds> (e5-xnu 5a10f17); tools/e5-scan-project.py (e5-xnu) parses rw+/E5CA/E5DPU from a live capture for rate+projection. r256 needs a >600 s window (recommend 1800) to cover scan end + first SB chain attempt, pending user authorization. See e5-xnu docs/ls-scan-rate-r255.md.", "R256 (device+host, 2026-11-07): first SpringBoard spawn on device, then watchdogd-crash panic ended the boot. Payload aa55cb47 (user-authorized 1200 s window, nonce 2026110702) flashed with both USB products captured live; the scan restarted deterministically at LBA 12633360 at 3.2-3.28 MiB/s exactly as r255. After the scan window: runningboardd pid=26, SpringBoard pid=27 spawned (E5PROC seq=23), lsd registered the SB bundle (E5LSDI pid=27 t=/System/Library/CoreServices/SpringBoard.app) - the first on-device SB spawn. APFS then logged obj_checksum_verify/obj_read failures whose cksum/oid bytes decode to ASCII console-log text (deterministic wrong content delivered by SD reads, mechanism unresolved; 9 rv-unstable LBAs). watchdogd crashed 3x (E5EXC exc 6, faulting struct read as all zeros) and XNU panicked: watchdogd[103] exited -- exit reason namespace 2 subcode 0x5 (panic at ~kernel+970-1000 s, before the 1238 s hardware kill; USB capture the only record). Root cause of the panic: kern_exit.c proc_handle_critical_exit panics when a POSIX_SPAWN_PANIC_ON_CRASH process dies; boot-arg panic_on_crash_disabled=1 disables it for non-initproc (TUNABLE exists in xnu-10063.141.1, no kernel patch needed). E5CA census all-zero whole run, panel CRC static - no UI atoms yet. Artifacts: e5-xnu uefi/build/sb-r256/.", "R257 (device+host, 2026-11-07): eMMC window migration round; device bricked at first cold boot after GPT shrink edit, recovered via fastboot. Online f2fs shrink of userdata p70 (5729280 -> 3107840 4KiB blocks) via openwrt-tools f2fs-online worker; GPT end-LBA edit on both copies; SystemOS+Data dd-ed to raw LBAs 40103936/46555136; all readback-verified while Android stayed up. r257 payload (kernel 9889ec6e, kext eMMC windows @41edabe) flashed to boot_b, slot B armed; on reboot the device never enumerated any USB product and stayed dark; LK fastboot later showed a broken partition view (read miscdata fail / get partition info fail / boot ctrl unreadable). Prime suspect: this unit-s LK rejects the edited GPT at cold boot (U30 Pro and changxing60 units cold-booted the same edit); boot_b likely never loaded; kernel dark-panic not excluded. Recovery: fastboot
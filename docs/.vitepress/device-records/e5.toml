configuration = ["e5-hid-ui-capture=10..60 selects periodic stable read-only scanout captures after120s, IDs300up; disabled bydefault and inCPUcanvasmode. It uses the existing single-pending off-workloop capture worker and does not inject touch.", "e5-touch-irq=1 uses GPIO13 falling-edge detection and level-high sharedSPI40/INTID72, with a providerless IOInterruptEventSource on the owned HID workloop. The primary callback only acknowledges GPIO13 and queues work; no I2C in IRQ. e5-touch-irq-cycle=1 tests mask/drain/detach/reattach after300s and2sall-up quiet.", "e5-touch-event-ms=1..16 selects the HID-workloop timer rearm interval only after strict GPIO event setup. Default/invalid values and non-event modes retain16ms. R299 uses2ms as a timing control; actual period includes handler work.", "e5-touch-gpio-events=1 selects strict masked GPIO13 RIS polling after normal-mode restoration. Only an observed falling-edge latch authorizes a packet read; startup, held-low and recovery do not bypass the gate. Bounded event traces use mach_absolute_time ticks.", "e5-touch-canvas=1 requires e5-hid=1 e5-touch=3 e5-no-vc, disables automatic tests/UI captures and ordinary compositor scanout writes. e5-touch-reset=2 requests a one-time startup sensor reset; e5-touch-raw=1 records bounded packet/IRQ-level evidence.", "e5-hid=1 publishes a hash-qualified 207-slot IOHIDDevice subclass; e5-hid-test=1 enables one automatic Home press/release. e5-touch=1/2/3 selects resource, sensor-register and polled packet/HID stages. Runtime input remains unqualified until the isolated board trials pass.", "UEFI: E5BootMenu installs a SimpleTextIn merge (keypad first, chained serial ConIn) on a vendor-path handle so the official UniXNU menu counts it.", "XNU: e5-keys2.patch polls the matrix keypad in the serial keyboard path and feeds cons_cinput into /dev/console. AON gate 0x64900000 and AON GPIO 0x64170000 require set-mirror clock writes before peripheral access. The older fd230 e5-keys path is retained but is not the normal tty input path."]
procedure = ["Watch the menu stop its countdown on a physical key press and navigate with arrows and select.", "Boot the seed and type through the serial console into the on-screen shell."]
findings = ["R390 completes the full frame-gated sequence (open Settings, subpage row, Back, 17-release scroll, Home, reopen) with zero failures and all seven capture frames rendered; Home/reopen passes for the first time. The scroll phase executed with content changes but its sampled frame is near top, so scroll offset proof is weaker than r385.", "R385 verifies100..115ms short taps, actual Notifications content and Back; real touch cancels automation after the scroll. R386 repeats the same coordinates and delays without mixed input.", "R387 FPS diagnostics retain zero-update intervals for five seconds after input; reported interval and response-window rates remain distinct from physical refresh. Settings automation excludes capture/logging while held and preserves hardware-input cancellation.", "R309 diagnostic makes the isolated Settings sequence wait for two actual CPU-presented frames before Home, then wait ten seconds before the tap. Synthetic mode3 requires its completed Home sequence and the native digitizer driver, not a physical sensor packet. Actual finger activity still defers/cancels the test. Other input modes and real hardware readiness remain unchanged. This corrects the R308 reproduction gate, not the Settings application itself.", "R308 diagnostic adds a single synthetic Settings tap at the verified SE2 desktop coordinate 122,318 (mode3), after one Consumer Home pulse. Hardware activity retains cancellation priority; the test sends a down/up pair and no following gestures. The 64-thread/objc lock observer remains enabled to reproduce the application stall autonomously. No GPU or rendering change is included.", "R305 manualPhone1x touch/Home/app-switcher/layout pass:601callbacks/599good,2coalesced,594event/5timer reads,0bad/recovery/foreign;294changes/23single taps/6drags/2dual releases/all-up/final0.426HID nofail/drop,originalclientdelivery,2433displayframes/30FNVcaptures,900s/fullreadback/allthree37/AndroidA pass. Allautomaticinputoff. Settings entersblack,post-settingsHome untested; currentB2D258C1 logscoveronlyearlystartup, so no uniquecause is claimed. See docs/input-se2-r305.md.", "R305 frontend identity uses authentic iPhoneSE2 D79AP/iPhone12,8 product data from17.7/21H16 Apple DT. ProductIDc459fdb0eef455588dbc6f587c20a5372792bbf8 matches the current21H461 MobileGestalt table(row57,type0x80bb21e1). Artworkphone/subtype569/scale1 and chosendisplay-scale1 select native320x480 UIpoints. E5 board/UMS hardware, kernel/OS ABI,rootUUID/reservations and hardware compatibility suffixes remainfixed. A whitelisted retained-ADT edit proves unrelated property bytes unchanged; phone layout/runtime mustbe verified.", "R304 preparation adds Home test5: two nativeConsumerMenu down/up pairs,100msheld plus150msgap, for app-switcher recovery. Physical matrix diagnostics have a separate256-sample budget so lateHome presses remain observable after hundreds of touchreports. R303 physicalMenu changes UItohome structure before the600sautomaticcontrol, butSettings becomesblack and singleHome/automaticHome cannotrestorevisiblehome; doubleHome operator test wasnotperformedbeforewatchdog. User900s authorization persists; nativeHome/pixels/appstate will be checked separately.", "R303 preparation restores physicalMenu to native ConsumerMenu page0xC/usage0x40. The phone-own backboardd control logs explicitly classify this pair as Home; physicalCommand-H in R302 returns success atHID but has no lockscreen effect. Descriptor/nativefamily remain unchanged; ASan/UBSan key/chord/release tests pass. User explicitly authorizes900s nexttrial, with late600s singleConsumerHome control and periodicUIcaptures. R302 operator confirms originaltouch response and screenshots show lockscreen-to-wallpaperpicker via realtouch; Home/desktop remainunqualified.", "R301 actual callback/transport pass:386 callbacks/readsgood,341deferred/45timer reads,158hardwarechanges/2dualcomplete/final0,operatortracks+clears,4FNVcanvasframes,allthree37/37 andAndroidA. Mask/drain/detach/reattach generation2 succeeds, but no post-reuse callback/input observation; complete reuse remainsINCOMPLETE. R300safe refusal was an invalidgroupvisibility check, not proof of securedSPI ownership. ActualR301 GICD_CTLRreads0x12 despite BSPalias request; successful callback delivery is the authority. See docs/input-gic-r300.md.", "R302 preparation adds optional periodic UI snapshots, using the existing two-read stable RGB565/FNV capture worker. Capture queuing runs in the HID loop; frame emission stays off that loop. Busy requests retryafter1s and IDsadvanceonlyonqueued requests. This allows readiness and actualfinger actions to be observed before the old550s-onlydeadline. CurrentR301 frozenkernel keepscanvas/GIC isolation; originalUI acceptance will follow.", "R300 safely refuses the masked parent at readbacka000 before enablingGPIO13; detach/mask/drain return0. Linux irq-gic-v3.c states IGROUPR writes/readback are only relevant in single-security-state mode. R301 records GICD_CTLR/DS visibility, requires group1 only when visible, and verifies nonsecure ISENABLER access when enabling. ArmCpu now enables both Group1 aliases in the dual-state nonsecure view, matching BSP0x13; single-state view retains0x12 and does not additionally enableGroup0. No DS/security-state change is made.", "R300 preparation adds ArmCpu masked attach, owner-qualified enable/mask and gate-based detach/drain through an isolated local module override. A closed atomic gate excludes new context users; timeouts retain closing ownership and resources. The GPIO callback censuses all16shared banks, acknowledges onlyGPIO13, and contains foreign-source conflicts without clearing their events. Deferred work consumes callback counts, records coalescing, and retains unread callback tokens through500msI2Crecovery; the16ms timer provides retry and status checks but no idle packet reads. Optional idle lifecycle cycle validates reuse. Host and actual callback/UI qualification remain separate.", "R299 completes the isolated2ms GPIO event/CPUcanvas trial:301 valid packets,zero errors/recoveries;274433GPIO polls/301reads/274132skips.65 sampled timestamp orders and actual2ms setting pass.232hardware changes include3single drags/1dual sequence with complete all-up,final0 and no error-terminated sequence. Operator confirms tracking and ring removal.244HID reports/fail0/drop0,frames200..203 original checksums,full payloadreadback/allthree37/37/AndroidA/no retained panic pass. Optional600s canvas frame204 absent; GIC/originalSpringBoard actions remain separate. See docs/logs/input-gpio-cadence-r299.json.", "Source audit of selected ArmCpu9066b53bbc82e92a98ec44a11dd50fd13eaf1a1b finds armcpu_spi_attach immediately unmasks the parent and armcpu_spi_count observes callbacks, but no mask/detach/inflight-wait API exists. The primary dispatcher calls handler/context before EOIR. This lifecycle interface must be added before an owned GPIO callback can release resources safely. Live FDT gpio@170000 interrupts0/0x28/4 confirms sharedSPI40/INTID72 level-high, independently of GPIO13 falling-edge selection.", "R299 preparation adds a bounded1..16ms event cadence option without changing I2C, decoder or one-read-per-consumed-latch semantics. R298 live evidence shows ordered traces and consistent masked GPIO accounting with idle read suppression, but two malformed packets each coincide with pending_after1. This correlation does not establish a race;2ms is a subsequent timing control. R298 Android A, three37/37 windows and five original-checksum canvas frames pass;276 hardware changes,two dual releases/final0 are observed, while transport remainsFAIL.", "R298 preparation consumes GPIO13 RIS with pin-only W1C before I2C, preserving edges arriving during the transaction. IE remains masked; no GIC callback is installed. Timer/edge/read/skip/low-without-edge counters and bounded observed/start/end timestamps distinguish read gating from packet validity. RIS can coalesce edges and observation time is not the physical edge timestamp. Host/build and device evidence are recorded separately in docs/input-gpio-events-r298.md.", "R297 logs contain 1088 hardware contact changes, 12 complete two-contact releases and final active0. The operator confirms five targets, drag, two rings, ring removal and Home indicator. However 18 malformed packets/18 recoveries remain; the GPIO census reports other_enabled0/other_pending0 across16 banks at startup only. See the e5-xnu R297 archive; this is not error-free transport or GIC qualification.", "R297 preparation adds an opt-in exclusive CPU touch canvas, a bounded raw-frame/key queue, stable-ID trails and active-ring removal. Errors and queue loss cancel old paths; worker stop waits before releasing the validated 0xbe000000/307200-byte mapping. Readback-qualified milestone frames use the existing encoder. It is raw sensor-to-scanout evidence, not UIKit acceptance; host and device qualification are pending.", "R297 e5-touch-reset=2 tests one startup GPIO14 high10ms/low10ms/high60ms reset after pin qualification, matching the observed Android resume path for flash-backed3536. Mode1 remains conditional after4 failed identification reads. Firmware/configuration/normal-mode checks remain mandatory; no firmware programming. e5-touch-raw=1 has bounded separate two-contact packet budgets and before/after GPIO13 samples. The I2C algorithm and strict decoder stay unchanged.", "The R296 operator repeat of device5bacf9d FAILS: last periodic40961 reads/40955good,6 packet-format rejects/6 recoveries,311 HID reports without reported failure/drop,61 retired frames. Keys and bottom-edge swipe do not unlock; hardware logs max1 contact. Later Android control has two complete simultaneous slot0/1 sequences, so dual touch is possible on the phone. Original backboardd delivers paired physical touch events to SpringBoard, but keyboardFocus buffering times out and the later automatic keys have no destination. See the linked e5-xnu reflash evidence; the earlier idle R296 PASS is separate.", "R296 device5bacf9d terminal-FIFO fix passes:40961 valid packets,bad0,recoveries0;18 HID reports/fail0/drop0,1366 retired displayframes;all100/101/102 captures and all three37/37 windows/fullpayloadreadback pass;AndroidA/no retained panic. Snapshot102 black after Photos tap:app contents remain visually unqualified;R295 UIKit action evidence stands. Later IRQ-census f4d9e13 is host-built only. See docs/logs/input-runtime-r296.json.", "Post-R296-freeze e5-touch-irq-probe1 reads all16 GPIO banks after qualified clock/map setup. Records IE/RIS/MIS/IS/IBE/IEV and nonowned-bank masks; no interrupt-register write or parent attachment. SPI40/INTID72 is shared, so GPIO13 masking alone cannot contain an unrelated pending bank. IC is W1C, never saved/restored. ArmCpu parent mask/detach and callback lifetime remain prerequisites; board census pending.", "Recovered R295 device unified logs from read-only R296 Data backup prove UIKit Direct Touch195,425 hits Photos Dock, launches com.apple.mobileslideshow and completes home-screen-to-application transition. Backboardd touchstats down1/up1/destinationSpringBoard. See docs/logs/input-ui-r295.json. Automatic UI action is verified; missing102/physical actuation remain unqualified, and transport timeout still makes overall R295FAIL.", "R295 digitizer UC belongs to backboardd pid57: open1, enqueued2, dropped0, type11, queue head=tail0x1e0. DisplayIntegrated/Built-In/HIDServiceSupport true. Queue consumption is proven; Photos UI is unqualified because capture stops around621s before snapshot102. Original runner incomplete; independent Android A/postboot37PASS on resume. At least24 frames/no retained panic, one recurring FIFO timeout0x310420. R296 tests the qualified terminal-tail fix with unchanged HID/tap control and complete capture.", "Post-R295 preparation: I2C terminal-tail handling retains first-interrupt readiness qualification, but drains an idle nonempty final FIFO after a previously qualified read even if its final IRQ was lost. Host race fixture reproduces old Timeout/received16/status0x310420 and passes after correction; initial unqualified FIFO, terminal NACK/short read, final-byte NACK, and existing protocol ASan/UBSan cases pass. R294 race is plausible, not device-established; frozen R295 still uses the old bus code and new transport requires a later trial.", "R295 preparation extends the existing off-workloop public registry probe to event-service properties and child user clients. DebugState EnqueueEventCount, DroppedEventCount, LastEventType/Time and EventQueue XML distinguish original report processing from client delivery/consumption. IOUserClientCreator and per-client isOpen identify real subscribers; no original method/vtable or report descriptor changes. Touch-test2 taps only the fully visible Photos Dock at195,425, then leaves the UI unchanged until capture; mode1 keeps the gesture suite. Runtime evidence pending.", "R294 native IOHIDEventDriver attaches and processes the separate digitizer reports (two transducers, grouped, LastReportTime present). All16 synthetic phases/32 HID reports finish without report errors or active contacts; Settings does not open in checked snapshots101/102. One I2C packet timeout status0x310420 means overall automated FAIL.33 display frames, full payload readback and pre/postflash/postboot37/37 pass; fresh Android A and no retained panic. See docs/logs/input-runtime-r294.json.", "Split report3 submission now enters the digitizer instance's own workloop with runAction, matching the audited Sheng caller invariant. This is synchronization hardening, not a proven explanation for R292 UI failure; the native-family handleReport internal locking was not established from available sources. No transport/descriptor semantics change.", "R293 split-service metadata identifies a waiting AppleUserHIDEventDriver proxy with no Digitizer/DebugState, followed by AppleUserHIDDrivers server timeout. The original kernelcache has no ordinary native TouchScreen13/4 personality; the SafeBoot broad13 case is vendor-specific. New touch-native1 installs an owned native IOHIDEventDriver/IOHIDFamily catalogue match for13/4, score60000 before publication. Original module instructions/vtables are unchanged. Discovery now requires DebugState instead of accepting an unstarted subclass; public probe logs actual class names. This matching change still requires its isolated device trial.", "R292 additionally records6 malformed packet rejections (Count/Inconsistent) during physical contacts, with successful I2C transfers; prior raw bytes were not retained, so no torn-read/palm/decoder diagnosis is established. The next transport log includes all18 raw bytes and pre-abort status for invalid packets, retaining strict validation and existing lift/recovery behavior. UI routing remains the priority of the split-service trial.", "User R292 confirms desktop entry but no touch UI response although hardware move/lift packets and HID reports succeed. Snapshot100 is black at440s and101/102 showlockscreen, so450s is not a qualified UI-ready deadline. Next touch-split1 uses a second instance of the same audited207-slot class for a touch-only primaryDigitizer service, independent workloop and public properties; main service retains keys and owns the sole I2C poller. Services publish afterstart; an opt-in off-gate public Keyboard/Digitizer/DebugState probe records grouping/LastReportTime without private ABI hooks. Pre-suite hardware activity defers untilallup+2squiet; in-suite input cancels. Sensor readiness resets on transfer recovery. The next bounded trial uses550s keyboard/600s touch/640s snapshot.", "R2911301201 reads3536 boot0x0240/config0x0c0e0dd0/chip0x2d5c,204-byte config SHA19cc5ee07b370300680e4136c0ded6225cc21ee405716da29fc8a3a196b0a820 with zero16-bit checksum and matching slave0x2e. Initial padsIRQ/reset30,SDA/SCL0 are already correct; no mux field changes or conditional reset pulse occur. Pin clock/reset GPIO initialization/settle differ from R290, so their individual effects are not isolated. Sensor packets have no errors/recoveries and all16 synthetic touch phases complete with no active contact; physical finger/UI effect is unqualified. Next code validates config checksum/address before packets, reads every16ms to avoid missed GPIO pulses, targets Settings with synthetic touch and takes snapshot102. Physical Menu candidate changes to Command-H with release/chord coverage; Consumer Menu diagnostic remains independent. Source header added to ABI audit inputs.", "Before optional pad-mode changes, GPIO14's high output latch/direction is prepared, then the pad is connected and given60ms to settle. This avoids a stale low-latch reset glitch; the explicit reset test remains one pulse after4 failed identity reads. Other pad fields and the IIC matrix route are preserved.", "User R290 test confirms physical arrows move UI focus; Home remains faulty and touch is prioritized. R290 completes199 frames,160 matrix transitions,336 reports and a live observer, with no failures/drops/panic; AndroidA/post37pass. Fresh Android probe identifies3536/config0x0c0e0dd0 and resets on probe/resume before idle suspend. Opt-in touch-pinmux1 selects proven GPIO13/14 func4, mode2 also tests inferred dedicated SDA3/SCL3 func1, with clock-before-access, bit-field-only RMW/readback and stop restoration. No matrix-route or firmware programming.", "Early R2903e6a554 still reports NACK with a live observer, so the IRQ-qualified ACK correction is not the only blocker. Next code retains pre-abort status/read-or-write phase/time, adds opt-in read-only pads/IIC-route/line probes with independently derived pinctrl PA0x642e0000 and pin-eb EB1 bit11, and permits one vendor-style reset only after4 failed reads and a GPIO14 func4 pad qualification. No I2C pad-mux write or firmware programming; RAM-only runtime code is preserved by default.", "R289 completes Consumer Menu/Command-H/Return/Command-H with16 accepted reports and a live independent observer; checked snapshots show Chinese lock screen to desktop and at least35 frames retire. This proves the sequence effect, not physical Menu or the effective single action. Touch mode2 identity fails on NACK; Android A and postboot37/37 pass. Single-action test modes2=Command-H and3=Return are now prepared with before/after captures; R2903e6a554 remains frozen for the isolated ACK fix.", "R289 early observer/options appear and the HID tick progresses at stage10; touch A3 returns NACK. BSP ACK is checked in IRQ context, whereas the first adapter checked RX_ACK before IRQ. The correction gates NACK by I2C_INT and adds a transient-PendingAck host negative control. Registry walking now stops after first event-driver attachment and queue bursts are limited to8 transitions; stop and producer-side monitor fields distinguish termination from stalls. User physical tests still report no key/touch UI response; current e5-touch2 is identity-only.", "R288: corrected AP-AHB gate0x20000000 changes89->2089, I2C3 version900, IRQ/reset1. Thirty-six matrix reports complete with zero HID failures/drops, but HID workloop telemetry stops and timed Home/captures do not occur. The user reports no key/touch UI response; touch mode1 was resource-only. R289 adds an independent stage/options observer and moves scanout capture off the HID workloop before sensor packet tests.", "R287 stable read-only scanout captures100/101 pass full checksums and show a Chinese lock screen before/after Consumer Menu. Clock text is clipped at the narrow viewport edges; no desktop or unlock transition is qualified. The next diagnostic sequence tests Consumer Menu, Command-H, Return and Command-H separately while preserving normal physical key mappings. Source-driver gate translation is now independently derived from real FDT ranges, including a negative control rejecting0x20003000 before device access.", "R287 resources: the obsolete gate base0x20003000 read zero before/after the set write. The driver safely refused controller access, without panic. FDT apahb-gate reg is address0,size0x3000 under syscon@20000000; corrected base0x20000000/set0x20001000. R288 will qualify this before sensor transactions. A gated synthetic tap/drag/two-contact HID test is also prepared; ambiguous report completions retain possibly-down IDs for explicit future lifts.", "R286 hardware: hash-qualified original IOHIDDevice parent size208 and owned size288; native IOHIDEventDriver attached. Synthetic Home down/up reports both return success, with four accepted keyboard/consumer reports, zero drops/failures and held state0. Fifteen real display frames complete; no retained integrity/panic markers; Android A and protected windows37/37 recover. Physical keys and desktop effect remain separately unqualified.", "Next input revision separates keyboard and Consumer Control Application collections, maps raw TLSC IDs0/1 to HID IDs1/2, qualifies big-endian 16-bit sensor addressing and records firmware/config identity through temporary direct mode with mandatory normal-mode restoration. A gated read-only before/after scanout capture verifies autonomous UI changes. No firmware-flash update or new DPU writes are introduced.", "E5 KEY_MENU at matrix row3/col0 maps to Consumer Menu usage0x40 (iOS Home); Back maps to keyboard Escape, Select/Phone to Return, arrows and digits to keyboard usages. The existing serial scanner is the sole owner of keypad INT_RAW and feeds a 64-entry transition queue, preserving releases and same-scan fast taps. GPIO127 is explicitly configured as an input before volume-down sampling.", "Host ASan/UBSan checks pass for wiring/Home/chords/fast taps, contact bounds/stable IDs/lifts, and polled I2C repeated-start/FIFO/NACK/timeout recovery. Original IOHIDFamily text, constructor/descriptor anchors and 207-slot ABI are hash-qualified against the original 21H461 kernelcache. See docs/logs/input-host-audit.json and input-source-inventory.json.", "The actual TLSC6x bus PA is 0x22270000 after AP-AHB translation. Its AP-AHB gate is bit13 at0x20000000 (set mirror0x20001000). AP-I2C3 mux is at0x200100a0 and divider at0x2001009c; AON GPIO needs its clock first. The first implementation preserves working pinmux/reset/firmware, uses 400kHz register transfers with 10ms bounds and releases all HID contacts on errors. GPIO IRQ is initially polled; interrupt routing and firmware/config identity still need qualification.", "The keypad block reads sane values in XNU (E5KINIT 000f7f030000000077777777: CTRL row/column enables correct, KEY_STATUS idle pattern). The caller is the implemented e5-keys2 serial poll hook.", "Fixed-v8 controls: original kernel 242 fails (#35); changing only two address-forming instructions succeeds (#36), and source-built 244 succeeds (#37). An e5-keys token with kernel 241 also boots (#38). Earlier claims of general binary-layout or token-content fragility are withdrawn.", "Flash #41 verifies real console fd0, TIOCGETA=0 and ICANON=1, four commands exiting 0 and a blocking canonical read. Earlier CONSOLE-FD 2 was an unhandled ENOENT from a missing /dev directory. Physical key and serial command entry still require separate on-device acceptance.", "Stock Android enumerates tlsc6x_touch in addition to sprd-keypad and gpio-keys; the claim that this board has no touch panel is withdrawn. Touch hardware binding and XNU HID support remain pending."]
completion = ["Touches map to the display, simultaneous contacts keep stable IDs, release events arrive, and buttons produce expected HID reports."]

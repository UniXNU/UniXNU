schema_version = 1

[device]
name = "e5"
soc = "UMS9621"
os_profile = "ipados-17.7.11-21H461"
summary = "Rongyue E5 is a 5G senior bar phone (feature-phone form factor) with a removable battery, a 3.5-inch 320x480 ST7365P RGB565 panel, 2 GiB RAM, eMMC and a Unisoc UMS9621 (Qogirn6Lite) SoC with 2x Cortex-A76 plus 6x Cortex-A55. The record covers the BootROM-FDL-LK-BootShim-mu UEFI chain, XNU hand-off, framebuffer console, matrix keypad input, seed userland, the read-only eMMC block service and the read-only SD card service (native SD host, default-speed multi-block reads and an ext4 walk over the e5-openwrt image)."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "RamBlock"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore"]
inputs = ["UMS9621 SoC feed, iPadOS 17.7.11 build 21H461 OS profile, XNU 10063.141.1 source pin, device defconfig."]
configuration = ["board.name = e5; board.soc = UMS9621; board.soc_source = ums9621; board.os_profile = ipados-17.7.11-21H461; schema_version = 2.", "kernel.defconfig = e5_defconfig; patch_series applies arch, soc, os then device series.", "Device kernel archives add e5_emmc_build.py (NativeEmmc IOKit storage driver), RamBlock with virtio-mmio bindings, e5_derive_audit.py storage ABI audit from the pinned kernelcache IPSW, SoftwareAES bindings and mockfs fixture."]
procedure = ["Run ./unixnu defconfig e5_defconfig --device <repo> from the UniXNU checkout.", "Run ./unixnu status --json --device <repo> and confirm profiles, source pins and patch order.", "CI (kernel-builder workflow) builds kernel.macho from the pinned sources on a macOS runner."]
findings = ["Arrays replace inherited selections in board.toml; the device list restates every required component.", "CI rebuilds from identical patch content are not byte-identical; kernel behaviour was validated by flash evidence instead of binary hashes.", "Patches must be generated against the arch+soc+os-patched tree; anchors against pristine Apple XNU fail where UniXNU series modify the same files (for example arm_init.c gains boot_progress helpers). The payload now requests 512 MiB through payload.adt.owned_memory_size; flash #59 qualifies that setting with kernel 262 and all other inputs fixed.", "board.toml now publishes a 48-byte development boot-manifest-hash and the E5.Bringup.ImageSet.v1 owner domain for the exact verified OS/SystemOS image pair. The pinned common ADT generator reproduces the board-tested sidecar byte for byte with its saved random seed; all pre-existing properties remain unchanged.", "V7 adds the ordered e5_display_build.py archive step after storage compilation. It appends the concrete display probe to the already force-loaded E5 archive, verifies the exact original family and every compiled virtual binding, and strips only the owned automatic initializer. CI 336 passes compile/link/prelink and its final linked inheritance/late-init audit. R81 confirms the resulting concrete factory/init/release path with all 173 late samples at a=3 v=1ff s=18a0 r=0; this does not qualify display publication or scanout."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["Hardware-facing patch changes still require device validation. The earlier general binary-layout-fragility diagnosis was withdrawn after fixed-seed control experiments isolated incorrect keypad MMIO addresses."]
next_action = ["Keep source and payload inputs pinned per experiment; change one variable and retain matching flash evidence for hardware-facing changes."]


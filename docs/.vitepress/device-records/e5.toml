components = []
paths = ["docs/network-bringup.md", "docs/logs/android-wcn-*.json", "docs/logs/android-wcn-*.log"]
inputs = ["Stock Android uses Unisoc sprd_wlan_combo.ko (SC2355 backend) and wcn_bsp.ko; runtime chip ID 0x2355B001 identifies Marlin3 Lite. Parent compatible unisoc,marlin3lite_sdio; WLAN child sprd,sc2355-sdio-wifi.", "Wi-Fi host: sprd,sdhci-r11 at physical 0x22220000, size 0x1000, 4-bit SDIO; mmc2 negotiates SDR104. DT interrupt SPI 202 (GIC INTID 234), level high. WCN power/reset/wake GPIOs and PMIC rails are shared with BT/FM/GNSS.", "Actual firmware /odm/firmware/wcnmodem.bin (947120 bytes, SHA256 780c448afbaa614efdb1ffc71ffb6bc05b91d34f752d7994569d5c2dbf1c2a41); Android selects wifi_board_config.xpe.ini (7395 bytes, SHA256 3ff60f8e6756e839cf51531d52965dc43446492d843c749da60f1ad70ac7fde6)."]
configuration = ["No Wi-Fi component is selected in board.toml. Ath12kWifi targets different hardware and has been removed from this area; a Unisoc WCN/SC2355 implementation and XNU network interface are required.", "Vendor modules: sprd_wlan_combo depends on cfg80211, wcn_bsp and sipc-core; wcn_bsp depends on sipc-core and trusty-ipc. These combo-module dependencies do not change this board's observed SDIO transport.", "Android firmware search path is /vendor/firmware,/odm/firmware. Preserve the XPE board configuration, regulatory data and per-unit factory addresses when preparing local driver inputs; do not substitute AA configuration or generate calibration values."]
procedure = ["In Android, run python3 tools/e5-wcn-inventory.py --output <record.json> --extract dumps/android-wcn-private from e5-xnu; the capture reads modules, bindings, WCN boot messages and vendor blobs without changing radio state.", "Compare the live /sprd-marlin3 node, SDIO host and module aliases with the extracted module metadata; pin matching SC2355/WCN source and firmware before implementing board hooks.", "Implement WCN power/reset/clock and SDIO CMD52/CMD53/IRQ handling, then reproduce firmware boot, CMD_SYNC_VERSION, CMD_DOWNLOAD_INI and CMD_GET_INFO before network registration.", "Add the XNU networking/802.11 adapter, then measure scan, association, key installation, DHCP, bidirectional traffic and repeated stop/start before claiming device support."]
findings = ["Android confirms SC2355 SDIO with chipid=2355b001 and firmware MARLIN3_20A_RLS2_W24.17.7 / sc2355_marlin3_lite, dated 2024-04-28 15:41:09. The generic combo module also contains SC2332/SIPC and SC2355/PCIe aliases; those are not evidence of this board using either bus.", "The DTS firmware partition /dev/block/by-name/wcnmodem does not exist on this device. The extracted ODM firmware size matches the 947120-byte successful Android download; use the actual ODM file as the input.", "Android selects Marlin3 Lite chip index 2 with IPD(1), parses wifi_board_config.xpe.ini and sends CMD_DOWNLOAD_INI. Boot logs also contain command-version mismatches and an UNKNOWN_ERROR response for the third INI section; a future port must handle firmware responses rather than assume every section is accepted.", "The TSX symlink targets missing /mnt/vendor/productinfo/wcn/tsx_bt_data.txt; Android logs the default 0xffff. /mnt/vendor/wcn is empty at capture. This does not establish an absent RF calibration requirement; board INI, efuse and factory data still need auditing."]
completion = ["Host resources and shared WCN power ownership match the stock board; SDIO functions and IRQ/data transfers work.", "Firmware reaches its version checkpoint and SC2355 command/event framing, credits, board configuration and regulatory setup work.", "XNU scans and associates with the chosen security mode, obtains an address, transfers packets in both directions and recovers across repeated stop/start cycles."]
limits = ["Only Android inventory and blob extraction are verified; no XNU WCN/SC2355 driver or networking acceptance yet.", "Source equivalence to the extracted dirty vendor revisions, SDIO DMA/cache constraints, command framing, firmware/efuse calibration handling and the target iPadOS 802.11 ABI still need implementation/audit.", "Factory addresses stay local. Bluetooth, FM, GNSS and the 5G modem are separate follow-up work; shared WCN power handling must preserve their ownership."]
next_action = ["Compare the six hashed source files at sprd-linux-devs/linux b93bbc3a36fd3c1acae0e44b93d909f7fe942182 with the extracted vendor module metadata and command ABI. Then implement board power/reset, SDIO function/IRQ transfer and the WCN firmware version checkpoint as the first milestone."]


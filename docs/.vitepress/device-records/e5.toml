procedure = ["Build seed binaries with the iphoneos SDK, ad-hoc codesign, collect cdhashes with codesign -dvvv, build the trust cache, pack the seed, assemble the payload, wrap the boot image and flash."]
findings = ["Payload FAT layout and boot image size are stable across rounds; the packed ramdisk size varies with the seed contents and shifts the staging window without breaking boot.", "A stale trust cache produces an AMFI unsuitable-CT-policy panic for PID 1; rebuilding the cache fixed it (flash 7 to 8).", "Flashes #55-#57 preserve kernel/ADT/EFI/configuration file hashes while replacing the trust cache for the actual signed eMMC-root binaries. Root and boot payload are fully read back before reboot; the static-tool entry correction changes ls/cat signatures and requires rebuilding both numeric aliases and the cache. #58 preserves every file except the kernel and matches the earlier kernel-only repacker byte-for-byte. #59 replaces only the ADT memory property, validated over the entire sidecar. Original-system input assembly and independent full-image/window verification are implemented in e5-xnu/tools/e5-system-root.py.", "The E5TW repair reproduces CI 305 from UniXNU 066c8d8315f83749d28bcae2faf3595718646be5 plus the pinned arch/SoC/OS series: all five incoming tee blob hashes match, and all 81 patches apply without recount or fuzz. Patches are exported from staged source with git diff. CI 306 compilation and two full-readback board runs subsequently validate this patch and its persisted ring header.", "Kernel 306 builds and prelinks at device revision 54347d444c71064ba254a8cb9abd787264cd007a. Its paired complete UEFI boots with the same ADT, trust and original OS/SystemOS inputs, and all 62926860 payload bytes match flash readback. A second controlled experiment retains that kernel and firmware, changes only ADT chosen metadata derived from the exact rehashed OS/SystemOS bytes, and is board-verified through mount-phase-2 and the later tzinit EROFS panic.", "The second CI-306 payload changes only kernel.macho.adt among nine FAT files and preserves the whole firmware prefix. All 62926860 bytes match flash readback. The common profile/board ADT generator exactly reproduces its tested metadata, and the payload is retained as the new staging baseline.", "The next source build adds e5-data-progress.patch after the existing device series; all 82 pinned patches apply without recount or fuzz. It preserves exit semantics and records tzinit only after P_LEXIT/p_xstat commit. Data size changes to 128 MiB while its UUID is retained. Kernel CI and full payload readback/board qualification are required before accepting this source.", "CI 315 compiles, links and prelinks source 519a72775fad6b6fd71c1ffbb2b68e41c4838d2e with all 82 pinned patches. Kernel UUID D79DCFE4-737E-3041-A570-388C447577D9 matches board panics in rounds 63/64. R63 changes only kernel.macho from R62; R64/R65 retain the entire same boot payload and vary only independently verified Data fixtures. Guest inode uid/gid fields and containing APFS Fletcher64 checksums are adjusted in a copy for the root policy; strict host read-only mounts verify stored owner 0:0 and reproduce the installed image byte-for-byte. The final boot/Data pair is frozen as e5-xnu baseline-data-r65."]
completion = ["Kernel and prelink succeed, payload contains all declared inputs, and the boot image matches the bootloader format and size limit."]
limits = ["The boot image is built on the host and flashed from Android; no on-device packaging yet."]
next_action = ["Automate the seed-to-payload chain into one script with a single UUID hand-off to reduce manual ADT patching."]


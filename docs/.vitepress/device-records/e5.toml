[[area]]
id = "storage"
status = "implemented"
components = ["RamBlock"]
paths = ["docs/data-capacity.md", "docs/logs/data-capacity-*.json", "docs/logs/data-capacity-*-console.txt", "docs/sd-os-root.md", "docs/data-volume-uuid.md", "docs/logs/data-volume-*.json", "docs/logs/data-volume-*-console.txt", "docs/logs/sd-gpt-*", "scripts/emmc/**", "scripts/*ufs*", "tools/userspace/**", "docs/emmc-seed.md", "docs/system-volume-audit.md", "docs/logs/emmc-*.json", "docs/logs/emmc-*.log", "docs/logs/system-*.json", "docs/logs/uefi-report-161217.txt", "docs/logs/uefi-report-162200.txt", "docs/logs/uefi-report-163029.txt", "docs/logs/uefi-report-170641.txt", "docs/logs/uefi-report-172018.txt"]
inputs = ["Unisoc sprd,sdhci-r11 eMMC host at physical 0x22200000 (warm-inherited from LK: card selected in TRAN state, RCA 1), eMMC 61079552 sectors (29.125 GiB) with a 70-entry GPT, cache partition at LBA 0xd0a800 size 0x20000 sectors (64 MiB; corrected from the earlier 1 GiB claim), full disk mmcblk0.", "Independent Unisoc sprd,sdhci-r11 SD host (sdio0) at physical 0x22210000, IRQ SPI 203; SD16G SDHC card, 30244864 sectors (~14.4 GiB), RCA 0x5048, Android runs it at SDR104 4-bit 1.8 V.", "The SD card currently carries the original OS raw GPT image at LBA 0 (6077580800 bytes, SHA256 e5634d04a8ac35f024845f583394e0a35deb26a04cb0c00286a8674e25a9a4f2). Its APFS partition spans LBA 34..11870241 and OS volume UUID 04769D26-2CA0-4825-B443-E2E5F88300F2. The earlier e5-openwrt ext4 fixture and Android references remain archived.", "Card power and ADI facts (vendor source audit): vmmc/vqmmc are UMP9620 PMIC LDOs LDO_VDDSDCORE/LDO_VDDSDIO reached over the ADI bus at physical 0x64400000 with the slave window at 0x64420000; LDO enable = PD bit clear (0x21ac/0x21b8), 3.0 V = VOL 0xb4 (0x21b0/0x21bc), write-protect unlock 0x23d0 = 0x6e7f; aon fast-hotplug block at 0x64900520/0xba0 with APB-prot direct-access lock sequence when locked."]
configuration = ["NativeEmmc (scripts/emmc/NativeEmmc.cpp) is compiled into the kernel by e5_emmc_build.py against the storage ABI derived from the pinned kernelcache.", "v2-v4 probes cover card identification, EXT_CSD, SDMA/ADMA MBR/GPT reads and boot_b/misc readback. v5 publishes the whole disk and IOGUIDPartitionScheme enumerates 70 partitions.", "v7 published a cache window at LBA 0xd0a800 with an incorrect 0x200000-sector length; v8 corrects it to the actual GPT/sysfs length of 0x20000 sectors (64 MiB), bounded by physical card capacity. The 8 MiB test image inside that partition contains its own GPT and an APFS volume E5EMMC; the physical eMMC GPT is unchanged.", "board.toml and the ADT now select SD OS volume UUID 04769D26-2CA0-4825-B443-E2E5F88300F2. The separate eMMC recovery baseline #59 retains UUID 238A9EDD-6788-4B2E-BA4E-C1F70AE25B64, kernel 262/v8, a 512 MiB memory request and the signed v9 seed; #58 retains its 256 MiB handoff.", "NativeSd (scripts/emmc/NativeSd.cpp + SdProtocol.h, personality in patches/xnu/e5-emmc-personality.patch) publishes the SD card read-only. Cold path: ap-ahb sdio0_eb gate, adi_eb gate/reset/mux (idempotent), PMIC LDO enable over ADI (3.0 V both rails), fast-hotplug enable with detect-polarity bit21 SET (cd-gpios flags are 0 on this board), host RESET_ALL + DEBOUNCE DLL backup bits, card hw_reset pulse, 400 kHz 1-bit legacy init (double CMD0, CMD8/ACMD41/CMD2/CMD3/CMD9), capacity pinned to 30244864, 4-bit ACMD6, then the sdio0 chain is observed (not forced) and switched to the Android rpll chain for 24.375 MHz default speed with full re-verify.", "v15 adds CMD18 multi-block reads (readSectors, 16-sector chunks, v4 32-bit block counts, CMD12 stop, self-compared against single-block CRCs before adoption) used by doAsyncReadWrite; measured 128 sectors: single 36207 us (1.77 MiB/s) vs multi 5995 us (10.7 MiB/s, 6.0x).", "v16 adds the ext4 read-side walk (pure parsers ext4ParseExtents/ext4CountDirents in SdProtocol.h): sb at LBA 2050 -> group descriptor 0 (inode table fs-block 145) -> root inode 2 extent -> root directory fs-block 4241 with 22 dirents and CRC32 70633ae6, all read through the CMD18 path after the speed-mode verify. The image's superblock first_ino/inode_size fields are corrupt (0/11); the real 256-byte inode stride is proven from the on-disk tables and passed explicitly.", "Acceptance automation: tools/e5-sd-check.py (e5-xnu) validates every board report from the last 'NativeSd: v1 start' marker — cold-path evidence (gate/pmic/hotplug polarity/CMD8 echo/ACMD41/CMD3/CSD/selected), four reference-LBA CRCs, mode verify (legacy or default with rpll chain), ext4 walk lines, timings, and the full eMMC regression set."]
procedure = ["Clone the existing test image, preserve its volume UUID, create /dev and install the signed v9 PID1, ls/cat/clock and numeric aliases. Generate the trust cache from the actual installed binaries; see docs/emmc-seed.md.", "Back up and compare the previous 8 MiB cache test image before replacing only that existing test region from Android; verify the entire replacement by readback SHA256.", "Keep kernel/ADT/EFI/configuration fixed, rebuild FAT and rerun mk-boot-payload.py, flash through e5-uefi-cycle.sh and verify the full boot payload by readback before collect.", "Require the expected eMMC window, E5EMMC UUID/mount, INIT-START-v9, console fd0, TIOCGETA/ICANON, raw command exit statuses and SH READY/READ-BLOCK in the same report.", "For SD rounds: capture Android references first (tools/e5-sd-reference.py, ext4 walk recon via adb dd), then flash the kernel with the new NativeSd version and gate the round on tools/e5-sd-check.py PASS over the collected report (see docs/logs/sd-round-log.md for the 17-round root-cause chain)."]
findings = ["Physical GPT edits were restored across reboot in earlier tests; the boot-chain mechanism is not isolated. Partition-content writes survive. Current tests leave the physical GPT untouched.", "The v6 second-device/bare-container attempts did not produce a root mount, including the publisher-thread variant. v7 publishes the GPT-wrapped image through the original matched service and mounts it; the separate effects of GPT wrapping and publication were not isolated.", "IOKit reads through doAsyncReadWrite are verified for GPT, APFS metadata and seed executables. This proves the tested read path, not every error/recovery case.", "Flash #54 mounts E5EMMC with old v8; #55 adds v9, real console fd0, ICANON and four standard commands exiting 0. An extra long-argument cat SIGBUS is reproduced before its first trace in #56. #57 fixes the shared static-tool C stack alignment: all five commands exit 0 and the marker file is read. Its original argument pointer is 0x16fdffde8 (8 modulo 16), preserved while the working SP is aligned. SH READY/READ-BLOCK follow with no devfs, AMFI or child exception failure.", "The #55 through #59 seed-root images match full post-boot readback. #58 changes only the kernel and validates error-first reads, truthful write protection and the measured 64 MiB cache limit. #59 changes only the ADT memory request and passes the same five-command root workload.", "SD bring-up root-cause chain (rounds 1-13, docs/logs/sd-round-log.md): Android shutdown residue (PMIC LDOs off, host ap-ahb gate off) plus two decode errors and one silent misconfiguration. ADI reads external-aborted because /soc/aon child unit addresses are OFFSETS against ranges 0x64000000 (controller 0x64400000, slave window 0x64420000), not the raw 0x400000/0x420000 from the node names — the cause of five panic rounds. With power on, every response command failed command-CRC with a zero response register: the aon fast-hotplug detect-polarity bit21 was inverted versus the vendor expectation (E5 cd-gpios flags cell is 0; the 0x23 cell is the pin number), and the fast-hotplug machinery gates the response path while it believes no card is present. Setting bit21 made CMD8 echo immediately; rounds 14-15 confirmed the clean driver.", "SD throughput ladder (round 16): 6.5 MHz single-block (v14) -> 24.375 MHz single 1.77 MiB/s -> 24.375 MHz 16-sector CMD18 10.7 MiB/s with byte-identical self-check; the rpll sdio0 chain left by Android shutdown is alive at XNU (src 195 MHz observed, no fallback needed).", "The ext4 walk is fully decoded offline against the card (docs/logs/sd-ext4-reference.json + raw captures): root inode 2 (itable+256, extents flag) -> single extent -> fs-block 4241 -> 22 dirents incl '.' inode 2, init (file, inode 537), OpenWrt markers overlay/rom; driver evidence lines ride the same board reports and are checker-gated.", "The ADT-only image-set identity correction resolves the actual mount-phase-1 exit 66. Original launchd reaches mount-phase-2, init-with-data-volume, fips, keybag, usermanagerd and tzinit task markers. The next genuine panic is tzinit[17] exiting 30 after no writable Data is found and its system-partition fallback returns EROFS. The original OS/SystemOS SD windows remain read-only.", "After round 60, a read-only 32 MiB SD Data readback has SHA256 42b81cab9b044819aa69d498b2dcf67dcefdcbb9a90651a04891c30d089b00b8. All five checksummed APSB objects and diskutil on the corresponding read-only local image report UUID 30ADC749-351F-4FFF-998A-20E1B683859F; the driver selected stale UUID B5A22774-89CF-41E5-A62B-5AFA6B2710BC. Source now matches the fixture and repeats publication/lookup checkpoints in late sampled SD reads. Host identity, negative controls, failure cleanup and patch application pass. CI 314 builds and prelinks a0a5f1e291b93eda422eeaa945f2c71f622eaabc. Full-readback round 61 confirms RAM publication, the correct UUID at /dev/disk4s1 and entry into RW mount; original APFS then panics on unencrypted Data (apfs_vfsops.c:2276). Its binary checks the /filesystems/DoNotUseSEP property before that guard; round 62 adds only that ADT property through the e5-xnu payload helper. Round 62 adds only that ADT property and all five late samples report d=100, p=published, q=ready; original APFS advances from xid 6 to at least 246 through real RAM Data writes. Later services then exhaust the 32 MiB volume (209-211 free blocks) and report ENOSPC. The card remains unchanged and Android A recovers. Early tzinit exit lines are overwritten, so its explicit exit-zero checkpoint is not retained. See docs/data-volume-uuid.md.", "Round 63 preparation expands the same Data UUID to a 128 MiB APFS RAM image (262144 sectors) after round 62 ENOSPC. Host image checksum/UUID validation and window tests pass; all 82 ordered patches apply. A development-only startup hook sets and reads back the mounted Data root uid/gid 0:0 and mode 0755 before claiming d=100. The original OS/SystemOS windows remain read-only; CI and board acceptance are pending.", "CI 315 and rounds 63-65 validate the 128 MiB volatile Data window. d=100 now includes read-back verification of Data root uid/gid 0:0; t=17:0 directly records the committed normal tzinit exit. Round 63 ENOSPC is caused by a roughly 127 MiB watchdogd core; round 64 redirects the core path and retains the same watchdogd SIGTRAP without ENOSPC. Round 65 adds the root-owned standard launchd override for com.apple.watchdogd only: 248 late samples remain d=100/published/ready/t=17:0, reads reach 251392, and no panic or ENOSPC is captured over the hardware-watchdog window. The entire 128 MiB card fixture remains unchanged after each observed run. This is a development baseline with no SEP and a per-service watchdog policy, not persistent Data or complete UI qualification.", "Display probe v6 adds sampled m/k/l registration, loader-state and full-return telemetry to NativeSd progress. The SD transfer and Data publication paths are unchanged; CI 335 compiles, links and prelinks v6 successfully. R80 retains 202 complete late samples with d=100/published/ready/t=17:0 and completed requests 221312..247040. The full 128 MiB card fixture hash is unchanged after fresh Android A returns. This headless registration test does not qualify UI or persistent Data.", "V7 adds persistent v/s/r construction, registered-parent-size and postModLoad telemetry. SD transfers and Data policy are unchanged. R81 retains 173 complete samples at d=100/published/ready/t=17:0 with request counters 225408..247424, while the concrete allocation/init/release checks all pass. Fresh Android A returns; the complete 128 MiB Data fixture hash is unchanged."]
completion = ["Host: SDHCI register, clock, card mode and DMA facts match the board inventory for both hosts.", "Reads: eMMC capacity, GPT and known blocks are correct; all exported windows stay within their containing partition. SD capacity, CSD, RCA and four reference blocks match the Android capture; the ext4 sb/gdt/inode/dirent chain matches the golden walk.", "Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region."]
limits = ["XNU eMMC/SD writes remain unsupported. The eMMC recovery volume is a custom APFS seed. The original SD OS image mounts and reaches launchd/libignition with full checker PASS in round 27; Preboot entitlement handling, SystemOS/dyld-cache attachment and writable Data remain unqualified.", "v8 passes thirteen host completion/error and six window-boundary cases; #58 mounts the same root and runs all five commands with the corrected 64 MiB read-only window. Hardware CRC/timeout injection and failed-request recovery remain untested.", "Five batch commands and tty setup passed in #57/#58; physical keypad and serial command entry remain separate acceptance items.", "NativeSd is read-only at 24.375 MHz default speed (SDR50/SDR104 + DLL tuning not attempted; Android reference is 208 MHz SDR104). CMD18 chunks are capped at 16 sectors within one 8 KiB DMA page; multi-block is adopted only after CRC self-check. The ext4 walk covers depth-0 extent trees and one directory block per extent — enough for this image's root; deep trees/hard links/xattrs are out of scope. The card is treated as a fixed golden fixture; a rewritten card changes the checker expectations."]
next_action = ["Preserve the paired e5-xnu baseline-data-r65 boot and 128 MiB Data fixtures, with the no-SEP property, core-output control and explicit watchdogd development override. Data RW/root ownership and tzinit exit zero are qualified; do not regress to a mismatched old 32 MiB kernel/image pair.", "Qualify the next actual userland or hardware dependency: late R65 logs show missing AppleKeyStore connectivity, missing Bluetooth DT/address and noncritical liveactivitiesd crashes. Full UI and service health remain open.", "Implement native IOWatchdog/power and persistent Data separately; the current physical-card driver stays read-only while Data writes go to RAM. Keep Android A and exact destination backups available."]


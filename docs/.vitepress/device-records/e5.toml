he runtime enables compiler and completion QoS requests only on macOS, leaving iOS as no-ops. R371 extends those existing Darwin paths to iOS and adds bounded driver compile QoS/effective-priority and wall/CPU timing. The actual-function iOS codegen regression has no priority calls before and emits them after; iOS release bridge/frontend builds and target17-system import checks pass. R371 new thread-statistics diagnostics triggered SANDBOX25/code221 in backboardd; they were removed without relaxing policy. R372 retains the iOS QoS frontend and qualified driver and has no process crash, but an indexed-draw variant exceeds its unchanged20s translation budget. R373 limits the existing process pipeline-making budget to one call in flight, retaining all shader work and limits. It has no compile-budget failure and reaches the first UI command-buffer callback(31draws/5blits), then64KiB command allocation fills64 BO handles at72,298,496 mapped bytes. R374 ABI1.6 expands BO handles and submit pins to256, with a separately allocated table to satisfy IOKit16KiB object size. Legacy288-byte64-handle submissions and new1056-byte256-handle submissions are independently bounds-checked; GPUVA512MiB and per-BO256MiB limits remain. Actual allocator host regression fills64 before and256 after, rejects overflow, and frees all descriptors. Kernel and userspace build successfully; hardware UI qualification remains pending. Signature and mmap policies remain unchanged. Physical observation remains deferred. The current Mesa and Metal frontend patches plus the E5 entry source are retained in this repository. A separate e5-metal=1 UI candidate publishes NativeE5Accelerator under the original IOAcceleratorES metaclass after loading IOGPUFamily and checking its extent. A read-only bindfs union exposes the owned NativeE5Metal bundle at the standard System extensions path. Four named UI processes receive the existing OS-profile IOKit grant; no UI file-mapping override is enabled. Discovery and o
findings = ["dmesg-ramoops-0 is a circular ring holding multiple boots; per-build markers (INIT-START-vN) are required to separate fresh output from residue.", "Kernel printf stays buffered without timer interrupts; the e5_panic_print tee path is what reliably reaches pstore.", "Raw wait status matters: #55/#56 print EXIT 0 for a child killed by SIGBUS, but EXITH is 0x0a. Cat startup traces locate the failure before C entry; #57 aligns the C stack while preserving the original argc/argv pointer and all five commands exit 0. Read errors in cat now return exit 67 instead of silently reporting success.", "The E5TW tee header at unaligned PA 0xFFF81F1B uses volatile byte stores and publishes the next-write position for every character. Its literal magic is 0x57543545, matched by the UEFI reader. Actual writer/reader tests retain the last 4 KiB across multiple ring wraps and short final panic text; ARM64 instruction checks reject unaligned word stores. The EDK2 reader module builds; two board runs now verify raw-ring panic capture and the BootShim E5TW reader branch.", "CI 306 and the first E5TW board run recover the complete ordered 24568-byte raw console ring at pstore offset 0x1F00, position 16307. Kernel UUID F6A3666A-8868-3E30-BC01-5D1A69866445 matches the artifact. The actual panic is mount[3] exit 66 after missing boot-manifest-hash. Existing hooks triple panic characters, so decoding the full ring is required; a 4 KiB printed tail alone lacks the main panic line.", "Two independent board sessions recover complete E5TW raw rings at positions 16307 and 19018 with the same expected kernel UUID. The first captures mount[3] exit 66; after the controlled ADT repair the second captures tzinit[17] exit 30. Raw pstore, ordered bytes, normalized text, source hashes and fresh Android boot IDs are retained per run."]

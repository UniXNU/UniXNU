configuration = ["The original Legacy framebuffer family retains source fences and ownership while converting full-screen BGRA or validated linear b3a8 to the firmware-owned320x480 RGB565 buffer.", "Use backboardd CAEnableDeepFramebuffer=false for this SDR panel. R379 confirms native BGRA desktop presentation; R385 confirms actual Settings content.", "The presenter advertises Mach FrameInfo transport0 with count1 and boolslot336=false; r388-r390 prove this advertisement (not the reports, which remain unimplemented in slot337) is required for the desktop composite. A protected native-list walk delivers only initialized references, clears the live-port mask after unregistration, and retains the existing100ms software-notification timer. No hardware-vblank timestamp is claimed."]
procedure = ["Boot the payload, wait for the seed shell, and read the E5FB lines from the collected report while watching the panel.", "Run the E5KINIT read-back from the matrix keypad for the keypad-side sanity values."]

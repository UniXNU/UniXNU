[[area]]
id = "diagnostics"
status = "device-verified"
components = []
paths = ["patches/xnu/e5-data-progress.patch", "tools/userspace/**", "patches/xnu/e5-ram-console-tee.patch", "patches/xnu/e5-uplink.patch"]
inputs = ["Persistent pstore ramoops zones (dmesg-ramoops-0..5, console-ramoops-0) surviving the watchdog reboot into Android; e5-uplink fd 229 write mirror; E5FB rendered-text mirror; E5KINIT register read-back."]
configuration = ["tools/e5-uefi-cycle.sh collect pulls the pstore zones into dumps/uefi-report-HHMMSS.txt after each flash cycle.", "The E5UL uplink lines are written from the seed shell through the kernel write hook with the E5UL prefix and reach the persistent ring."]
procedure = ["Flash, wait for the watchdog reboot into Android, then collect and grep the report for the E5 markers."]
findings = ["dmesg-ramoops-0 is a circular ring holding multiple boots; per-build markers (INIT-START-vN) are required to separate fresh output from residue.", "Kernel printf stays buffered without timer interrupts; the e5_panic_print tee path is what reliably reaches pstore.", "Raw wait status matters: #55/#56 print EXIT 0 for a child killed by SIGBUS, but EXITH is 0x0a. Cat startup traces locate the failure before C entry; #57 aligns the C stack while preserving the original argc/argv pointer and all five commands exit 0. Read errors in cat now return exit 67 instead of silently reporting success.", "The E5TW tee header at unaligned PA 0xFFF81F1B uses volatile byte stores and publishes the next-write position for every character. Its literal magic is 0x57543545, matched by the UEFI reader. Actual writer/reader tests retain the last 4 KiB across multiple ring wraps and short final panic text; ARM64 instruction checks reject unaligned word stores. The EDK2 reader module builds; two board runs now verify raw-ring panic capture and the BootShim E5TW reader branch.", "CI 306 and the first E5TW board run recover the complete ordered 24568-byte raw console ring at pstore offset 0x1F00, position 16307. Kernel UUID F6A3666A-8868-3E30-BC01-5D1A69866445 matches the artifact. The actual panic is mount[3] exit 66 after missing boot-manifest-hash. Existing hooks triple panic characters, so decoding the full ring is required; a 4 KiB printed tail alone lacks the main panic line.", "Two independent board sessions recover complete E5TW raw rings at positions 16307 and 19018 with the same expected kernel UUID. The first captures mount[3] exit 66; after the controlled ADT repair the second captures tzinit[17] exit 30. Raw pstore, ordered bytes, normalized text, source hashes and fresh Android boot IDs are retained per run.", "Round 63 adds persistent in-kernel tzinit wait-status and pid fields, recorded by the accepted process exit thread and echoed in sampled NativeSd t=pid:raw_wait_status rows. ffffffff means unseen; 0 means normal exit zero, while nonzero exit codes and signals retain their native wait encoding. This supplies direct exit evidence even if early console lines wrap. Source patch application is verified; runtime proof is pending.", "The post-P_LEXIT/p_xstat tzinit hook is now board verified: t=17:0 survives console wrap in rounds 63, 64 and all 248 complete late R65 samples. R63 core output masks the original watchdogd cause; R64 core opening fails with ENOTDIR in 0.086 seconds, preserving the surrounding console without ENOSPC. The original watchdogd user fault PC/assertion text remains unobserved; offline missing-service/open-error branch execution is not mislabeled physical root-cause proof.", "R109 diagnostic preparation is isolated on fix/display-submit-trace-r109. The original CI362 scanout attribution is corrected in docs/logs/display-content-audit-r108.json; all 86 resolved patches replay with pinned source inputs, recorded in docs/logs/display-submit-r109-patch-check.json. Only kernel diagnostic code and the panel probe change; payload/firmware/Data acceptance remains pending.", "R109/CI363 qualifies the submission diagnostic on device. Full payload readback passes; all 101 retained read samples show F=1:557a87bd while 42413 video-console character calls are suppressed. Original selectors 3/4/5 have zero calls. backboardd PID 56 repeatedly calls selector 6 (SwapWait), with at least 11911 calls, zero successes and last status e00002d5 Busy; selector 12 (RequestPowerChange) is called once and returns e00002c7 Unsupported. The native power/readiness contract is the next target, not an inferred empty scene. Fresh Android A returns after 665 s; full 128 MiB Data SHA c1744ab4 and protected OS/SystemOS metadata remain unchanged. No physical panel observation or UI presentation claim.", "After arm_vm_init establishes the phase-1 mapping, the console tee also calls e5_bootlog_putc, a nonblocking RAM-only producer supplied by the E5 storage archive. Early physical-address console output avoids atomic queue operations. An opt-in worker persists console records to a bounded boot_b journal; RAM pstore remains available. R241 and R242 qualify periodic console writes and retention of the preceding boot slot across warm watchdog resets: 86 and 73 valid records, no reported dropped bytes, CRC failures or stream gaps. Cold power loss and full slot rotation remain unqualified."]
completion = ["Each claimed milestone has a reproducible command, a matching source or image revision and an accessible result."]
limits = ["Reports concatenate several boots; ring rotation can wipe early markers during log floods."]
next_action = ["Add a boot-counter prefix to every uplink tag so multi-boot residue is unambiguous."]


limits = ["Only Android inventory and blob extraction are verified; no XNU WCN/SC2355 driver or networking acceptance yet.", "Source equivalence to the extracted dirty vendor revisions, SDIO DMA/cache constraints, command framing, firmware/efuse calibration handling and the target iPadOS 802.11 ABI still need implementation/audit.", "Factory addresses stay local. Bluetooth, FM, GNSS and the 5G modem are separate follow-up work; shared WCN power handling must preserve their ownership."]
next_action = ["Compare the six hashed source files at sprd-linux-devs/linux b93bbc3a36fd3c1acae0e44b93d909f7fe942182 with the extracted vendor module metadata and command ABI. Then implement board power/reset, SDIO function/IRQ transfer and the WCN firmware version checkpoint as the first milestone."]


[[area]]
id = "firmware"
status = "device-verified"
components = []
paths = ["docs/**", "tools/**"]
inputs = ["Vendor LK bootloader on the B slot, BootShim raw payload stub, mu-based UEFI firmware (Silicium e5Pkg), DarwinBoot EFI loader, payload FAT volume."]
configuration = ["Boot chain: BootROM to FDL to LK to BootShim to UEFI (4 MiB SILICIUM_UEFI.fd) to UEFI Shell (startup.nsh) to E5BootMenu.", "B slot boots the payload (misc slot record: B priority 15, A Android fallback 14); watchdog 300 s reboots failed boots.", "BootManagerLib launches the Shell through an E5 protocol (GUID 9A48E983-AB52-4043-828C-5366DCDADB26) resolved by LocateProtocol at TPL_APPLICATION because DXE event queues never drain without timer interrupts."]
procedure = ["Build the firmware and payload with uefi/build-e5.sh, make-e5-payload.py and mk-boot-payload.py in the e5-xnu repository.", "Flash with tools/e5-uefi-cycle.sh flash (writes boot_b payload at LBA 8 plus the misc slot record).", "Collect logs with tools/e5-uefi-cycle.sh collect (Android pstore ramoops zones survive the reboot)."]
findings = ["UEFI timer interrupts are not delivered (GIC delivery unconfirmed), so the UniXNU menu counts down by polling and UEFI event notifications at or below the current TPL never dispatch.", "AON registers are clock-gated: the keypad and AON GPIO banks need set-mirror clock writes (0x64901004, 0x64901018) before any register access or the AXI bus wedges.", "The Shell must be started from PlatformBootManagerAfterConsole via a direct protocol call; a signalling event queues forever without timer ticks.", "The paired complete FD and BootShim at e5-xnu b6949f4 boot both CI-306 experiments. The second report observes E5-PREV-CONSOLE: E5TW pos=16307 tail 4096, proving the previous kernel header reaches the actual UEFI reader. Both cycles return to fresh Android boot IDs on slot A after full payload readback verification."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["GIC timer delivery in UEFI is still broken; countdown and Shell launch work around it with polling and direct protocol calls."]
next_action = ["Root-cause the missing UEFI timer interrupt through GIC distributor/CPU-interface state dumps."]


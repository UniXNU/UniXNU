ss (zero poison-tail failures, zero rv-unstable - the two-agree verify saw the same wrong bytes twice, deterministic per LBA). All paths hold ioLock on inspection, so the aliasing mechanism stayed hidden; r259 diagnostic/mitigation: window I/O moved to the second half of the shared 8KiB DMA page (journal staging keeps the first 4KiB), per-call LBA+crc32 trace for the first 64 window reads, SDHCI ARGUMENT/TRANSFER_MODE readback drift check after every CMD18, probes moved under ioLock, one E5JRN pass marker per flush. Artifacts: e5-xnu uefi/build/sb-r258/ (capture 29984B kernel.log, journal boot-25 slot), expected-crcs table uefi/build/sb-r259/expected-crcs-data.txt.", "R259/R260 (device+host, 2026-11-07): r259 diagnostics kernel + r260 journal-off self-test both data-aborted in liftClock before any window work - r260 reproduced the identical signature (abort right after the caps print, far=regs+0x3000, x22=0xcafebabe; pc shifted 0x44 by the added self-test code). Root cause: the r259 buffer split moved window I/O to the second 4 KiB half of the 8 KiB DMA page but liftClock still probed with 16-sector readMulti - CMD18 SDMA wrote 4 KiB past the page end and corrupted adjacent kernel memory (r258 never hit this: its window buffer was the full page). Fix 858522d: readMulti hard-clamped to n<=8 (the half-page ceiling every window path already uses), probe at 8 sectors. Lesson: SDMA length must be checked against the ACTUAL buffer span, not the nominal page. Artifacts: uefi/build/sb-r259/r259/capture/kernel.log, uefi/build/sb-r260/r260/capture/kernel.log.", "R261 (device+host, 2026-11-07): fix verified + journal-off verdict: corruption persists, media exonerated at the fault LBA. Payload 9563f060 (kernel 471eaca6, journal dropped via --drop-arg e5-emmc-log, panic_on_crash_disabled=1, wdt 600): liftClock succeeded (div 8, 8-sector 1790us ~2.3MB/s), all three eMMC windows published, SELFTEST t0/t1/t2 CLEAN bad=0 over the first 1 MiB of os/dm/spare, APFS mounted BOTH windows with zero corruption complaints - then boot went further than ever: E5SystemOS union mount succeeded (disk8s1 SystemCryptex volume, uuid 8846FE78, dyld cache header verified, dyld_flags 0x8) and Data mounted rw (disk6s1). launchd exec died: apfs_announce_hash_mismatch inode 49 (the dyld_shared_cache_arm64 480KiB stub) file offset 475136 len 16384 - expected sha256 bc402e98... got ea20f5bb... -> dyld cache registration failed -> Library not loaded libSystem.B.dylib -> initproc failed panic (panic_on_crash_disabled does not cover initproc). Forensics: inode 49 tail 16 KiB located UNIQUELY in systemos.img at byte 25272320 = eMMC LBA 40153296 (window chunk 6170, ~24.1 MiB in - beyond self-test coverage); Android dd of that exact LBA returns the CORRECT bc402e98 content; the wrong ea20f5bb content exists NOWHERE in systemos.img, boot_b-64MiB, or Data-window-head-64MiB (aligned+sliding 4K/16K sha256 prefix scans) - the wrong bytes are not stale media content, they are a composite or DRAM-sourced mix. zero rv-unstable, zero xfer drift, zero poison failures all round: the wrong bytes were served consistently to both verify reads. r262 = corruption map (sparse 1-per-1MiB CRCs across both windows + dense fault region + wrong-chunk 32B hex dump). Artifacts: uefi/build/sb-r261/r261/capture/kernel.log, bootb-64m.bin, data-head-64m.bin.", "R264 (device+host, 2026-11-07): kernel 37c70bad payload a5decb3c wdt 300 journal off. SD media publication gated off (e5-sd-publish). FIRST BOOT WITH ROOT ON EMMC: Got boot device E5OsRootDeviceEmmc, BSD root disk4s1. Data window published and mounted rw (disk6s1) after head restore. Full prep chain green: union mount disk8s1, dyld cache header verified, dyld_flags 0x8. NEW FAILURE: panic Process 1 exec of /sbin/launchd failed errno 8 (ENOEXEC) kern_exec.c:8444. Host image /sbin/launchd is a valid arm64 MH_MAGIC_64 (compressed on media, signature scan misses). Cryptex has no /sbin so union cannot shadow launchd. Zero rv/drift/FAIL lines. SELFTEST t1 CLEAN bad=0 (dmh+osf+osd+sp + oss 1536 chunks before deadline bail). Roaming-fault pattern: corrupt-read sites moved from cryptex (r258/r261/r263) to root volume launchd exec. Media re-verified from Android chunked: all windows intact. r265: three-agree reads with shadow delivery, 4096-call wr trace, eMMC cache-off CMD6 byte 33.", "R265/R266 (device+host, 2026-11-07): r265 v50b 4dc13434 three-agree reads: root eMMC ok, SELFTEST CLEAN, zero rv3 disagreements, but prep failed EARLIER with ENOENT at kern_exec.c:8341 - 3x read cost made cryptex APFS mount miss the 30s IOMedia helper deadline (late wr #227-228 os 29db080 show cryptex still mounting). r266 v51 d22315df two-agree + shadow-copy delivery restored full chain: root eMMC, union+dyld+data mounted, then load_init_program -> /sbin/launchd -> ChunkCompression.cpp:618 decode failed for compression algorithm 0x205 -> decmpfs_fetch_uncompressed_data err 22 -> errno 8 ENOEXEC -> initproc panic (identical in r264). STORAGE EXONERATED COMPLETELY: all 8 launchd compressed chunks (wr #452-459, LBA 0x28bf470.. OsRoot+5.1GiB) logged CRCs match osroot-bare.img byte-exactly; whole-log sweep: all 187 OsRoot reads image-perfect. Cryptex reads showed logged-crc != image at 86/137 sites with content = image bytes from exactly 0xF080 sectors lower (6 independent hits) - now understood as f2fs residue, see R267.", "R267 (device+host, 2026-11-07): TWO root causes closed. (1) NativeEmmc.cpp windowRead multi-chunk delivery bug: data->writeBytes(c*512,...) wrote each 4KiB chunk at descriptor byte c*512 instead of c*4096 - chunks overlapped, so any count>8 read delivered 1/8-sampled garbage while every chunk CRC (logged from winD8 pre-delivery) stayed perfect; single-chunk reads (self-tests, superblocks, launchd chunks) were correct, which is why self-tests passed and APFS b-tree bulk reads corrupted decmpfs metadata into bogus algorithm 0x205. Fix 908144d, kernel v52 61143108824312dd6572aeac56eb77f7fcb86f2a7a98a3b21b35cd1df18444ec. (2) Windows live INSIDE p70 tail which Android vold resize.f2fs regrows to partition end at EVERY Android return (no fstab flag; Android 13 behavior): post-r266 chunk scans show osroot and systemos windows MASS-rewritten on media (91/92 and 50/50 64MiB chunks differ) while their 64KiB heads stayed intact - resize+GC rewrites gigabytes across the freed tail; r256-r266 roaming faults (Data-head zeros, spare zeroing, -0xF080 shifted bytes = stale chunk-file remnants) all trace to this. Defense per round: full re-place -> f2fs shrink to 8GiB -> flash B_TRIES=7 (LK allows 2..7) so the device stays in XNU boots with no Android return between attempts; preflight window verify gates every flash.", "R267 (device+host, 2026-11-07): LAUNCHD RUNS. Kernel v52 61143108 (writeBytes c*512->c*4096 fix 908144d), payload 0ea441fe trial 2026110713 wdt 300 journal dropped panic_on_crash_disabled=1, B_TRIES=7 session (3 boots captured). Operational: f2fs shrink itself zeroes the freed tail synchronously (eMMC applies F2FS_IOC_RESIZE_FS discards immediately) - correct order is SHRINK FIRST THEN PLACE; all four windows re-placed chunk-verified (osroot d8808bea, systemos b4908cde, data d8b88ba4, spare a88e884d) post-shrink. EVERY BOOT: full chain green - OsRoot root, union mount, dyld header verified, Data mounted rw, launchd exec SUCCEEDED (reads continue past the 8 compressed chunks #452-459 with identical CRCs, then dyld/lib content reads #460+), shared_region check_np warnings (launchd alive), LS cold scan STARTED on the cryptex (rw+ enter 896 at 43937232 = +23.7MiB, same offset family as r256), scan reached ~+55MiB, ST t1 CLEAN bad=0, wdt 300 clean kill, NO PANIC ANYWHERE. Non-fatal anomaly: nx_checkpoint_find_highest_xid disk8 'object type 0xcafebabe @ checkpoint descriptor block 30' on first cryptex contact every boot - recovers, mounts, runs. Scan rate ~0.21 MiB/s (31.6MiB in ~150s) -> 3GiB cold scan ~4h on eMMC: unreachable in any wdt window. NEXT: pre-seed LS database via QEMU (same IPSW 21H461 cold rebuild completes ~100s there per unixnu.com/devices QEMU virt record), transplant Data volume with DB, skip cold rebuild on board. Artifacts: uefi/build/sb-r267/r267/capture/kernel.log, docs/emmc-launchd-decode-r267.md.", "R268 (device+host, 2026-11-07): bulk-read path + throughput root cause. Kernel v53 53336e391b002335c5eab99c7c7e8fe76b9acde6d3250cd412dbe29ccd2f2440 (b6ac61e): dedicated 64KiB IOBufferMemoryDescriptor bulk buffer + readMultiBig (n<=128 CMD18 SDMA, poison/drift/CMD12 discipline) + windowRead bulk path (>=64 sectors: 128-sector chunks, first-chunk two-agree CRC canary, per-chunk wr#ob CRC logging) + liftClock rewrite (card CMD6 EXT_CSD 185 HS switch + 4-bit + fastest-first SDCLKFS ladder). Payload becf3c8e trial 2026110714 wdt 300 B_TRIES=7. RESULT per boot (deterministic): HS switch y, fast mode div 2, scan bulk read rw+ 896 at 43937232 COMPLETED (r256/r267 never finished it) then rw+ 2016 in flight at kill; SELFTEST t1 CLEAN; no panic. BUT 128-sector probe = 27.6ms = 2.33 MB/s — IDENTICAL per-byte rate to r267 div8 8-sector (1.79ms/4KiB = 2.25 MB/s): divider writes and HS did nothing. ROOT CAUSE (from 'inherit' log line): LK leaves the host at clk=0x0207 (SDCLKFS=2 + clock-source bits 0x07 = FAST parent) hc1=0x20 (bit5 = 8-BIT bus; DMA select bits[4:3]=00 SDMA) with vendor DLL tuned (dll 0xa0000102 dly 0x3434b760 off 0x00202000) and reads tens of MB/s in that state; our identify re-init writes 0xFFC1 whose low byte muxes the SLOW parent (source bits 0xC0), and setDivider preserved the CURRENT source bits — every rung divided the slow parent. Also learned: caps base field reads 0 (invalid, matches E5BootMenu.c comment 'do not infer Hz from the capability field'). r269 fix (ee2fc3a, kernel v54 68061786b61d4774): snapshot inhClk/inhHc1/inhDll/inhDly/inhOff before identify; liftClock restores DLL regs, CMD6 183=2 8-bit + HC1 bit5 (4-bit fallback), divider rungs on the INHERITED source bits starting at LK's own SDCLKFS. QEMU pre-seed kept as fallback (no longer primary). Placement ops: 256MiB chunks (~19min all four windows), md5sum not md5 on device.", "R269 (device+host, 2026-11-07): CLOCK FIX LANDED + STORAGE FULLY EXONERATED + LAUNCHD RUNS + 3-MIN SHARED-CACHE MAP FOUND. Kernel v54 68061786b61d47745f55dbb5ffb316f3ab17dd5e31dadbca296e2d86baa612f1 (ee2fc3a): identifyAndRead snapshots LK inherit state (clk 0207/hc1 20/dll a0000102 dly 3434b760 off 00202000) BEFORE any host write; liftClock restores DLL regs + CMD6 183=2 8-bit + HC1 bit5 + SDCLKFS ladder {LK's 2,4,8,16,0xFF} on INHERITED clock-source bits (identify's 0xFFC1 write muxes slow parent - old setDivider kept dividing it; probe now 'fast mode div 2 src 00 8-bit; 128-sector in 48 us'). Payload 7af31622 trial 2026110715 wdt 300 B_TRIES=7, 3 boots. RESULTS: (1) bulk streaming now ~17 MB/s - the 3GiB cryptex scan completes in ~3min per boot (RD=65455 ops/6.4M sectors per boot, 128-sector CMD18 chunks); (2) ALL 657 logged ob-bulk-read CRCs byte-perfect vs images (window-aware verify: osroot-bare.img base 32018432, systemos.img base 43888768) - delivery PROVEN clean; (3) SELFTEST t1 boot1 CLEAN 75ms, boots 2-3 bad=43 - ALL 258 mismatches in dms (Data sparse area) with got32 = APFS file content (asset names, format strings) = EXPECTED live-system writes to the rw Data volume (fsck/mount/lsd DB), NOT corruption; (4) launchd exec + runs + boot tasks progress (mount-phase-1, data-protection, detect-installed-roots, commit-boot-mode); (5) xpcproxy 'ChunkCompression.cpp:404 invalid resource map' x26 per boot - NON-FATAL for most services (tasks ran) but unresolved; (6) THE PRE-LAUNCHD 3-MIN SCAN: between 'load_init_program: attempting /sbin/launchd' and launchd hello, the ENTIRE cryptex container is linearly read (+23.7MiB to +2.8GiB, same start LBA family as r256's lsd scan) = dyld shared-cache mapping reading the cryptex cache file (decmpfs chunks); with wdt 300 launchd lands at +3:57 leaving <60s for services -> SB unreachable in window. r
findings = ["Screen output after the XNU hand-off is verified on device: the shell banner and E5 prompt render on the panel and mirror to serial (30 E5FB lines per boot across four reproducible flashes).", "kPETextMode with a zero v_display was required; with serial=3 the UART stays the kernel printf console while vcputc renders to the framebuffer.", "CI 332 static audit shows IOMobileFramebuffer/Service/Legacy MetaClass allocation stubs return NULL. The r77/r79 c=12 allocation mask cannot establish missing registration; v6 records metaclass presence and kext loaded/started/CPP state separately. CI 333 v5 did not compile (OSPtr misuse and private start call); v6 removes that path and abstract-class personalities. CI 335 compiles, links and prelinks v6 at device revision 9db769180fcf76dc0043f2436e9436aaa5a39901. R80 now confirms c=12 m=15 k=3f l=0 a=1 in all 202 late samples: family loaded/started/CPP initialized, Service/Legacy metaclasses present, abstract factories NULL and lcd nub present. At R80, concrete E5Display and UI were still unimplemented/unqualified.", "V7 implements a concrete E5Display construction probe with the exact 358-slot/0x18a0-byte original Legacy inheritance. The owned metaclass is initialized once after family startup under preModLoad/postModLoad. It checks actual parent identity/size/ancestry, then tests the concrete metaclass factory, original init and release/instance-count balance. All nine unqualified backend leaves fail loudly; start refuses activation. CI 336 compiles, links and prelinks this probe and its final linked vtable/initializer audit passes. R81 qualifies concrete registration/factory/original init/release: all 173 complete late samples show a=3 v=1ff s=18a0 r=0 with balanced instance counts. No attach/start/publication, userclient or frame presentation is qualified.", "R92/r93 offline symbolication resolves all nine anchors to FBSDisplayMode +0x244 at unslid 0x19f3d0744. The mode tuple is rejected; the failing field is unknown. R94 adds a bounded 80-byte copyin from breakpoint x19, logged as raw E5OBJ19 words for host interpretation only; CI and device verification are pending.", "R95/CI350 retains two FBSDisplayMode snapshots with width=320 height=480 preferredScale=0 stored scaleOverride=0 refreshRate=60 gamut=1 hdr=0 rotation=0. The deterministic invalid predicate is zero UI scale. Add adt.chosen.u32.display-scale=1 for native pixels per point; R96 preserves the CI350 kernel/Data and changes only this ADT property. Runtime repair is pending.", "R96 changes only /chosen/display-scale=1 in the actual ADT while retaining the CI350 kernel and r95 Data. During the approximately 665s round, the unchanged first-SpringBoard-breakpoint retention diagnostic captures no SB snapshot and the current ring contains no SB E5EXC/E5CRASH or panic. Pitch/lifecycle controls and full 128 MiB Data readback pass; fresh Android A returns. Continuous SB liveness, presented frames and liveactivitiesd failures remain unqualified/open. R97 adds a kernel-side crc32 probe of the 0xBE000000+0x4B000 scanout window (F= rides the rw-done echo): SB-enabled 108 changes vs headless 120 — crc alone cannot attribute drawing. R99 prints 20x60 block thumbnails to the ring: left-edge periodic identical bands = kernel fb console text. R100 disables the fb console via a length-preserving boot-args patch (e5-fb -> e5-xx): fill becomes near-solid non-text, rate unchanged. R101 repeats r100 headless: 120 changes remain. The surviving drawer is the userspace compositor (backboardd) rendering through E5Display — the userspace display pipeline is alive end-to-end; SpringBoard-attributable content and visual acceptance remain open. Rounds 104-108 push attribution to closure: the color histogram of the live panel is EXACTLY two values (88 percent black, 12 percent white, zero grays - hard-edged binary content), glyph tiles sampled 144 px apart are byte-identical (a repeating 8x8 tile lattice, not text), and the tile crc animates every change tick while the histogram stays constant. With every kernel-side painter provably gated off (the fd-hook console needs the e5-fb boot arg, absent in the card-readback-verified toml; kernel printf is serial+E5TW only; no panic path fired), the drawer is the userspace compositor loop submitting frames continuously: backboardd renders an animated binary-noise placeholder for an EMPTY scene. The display pipeline is proven to swap frames end-to-end; the remaining gap to visible UI is SpringBoard-side layer content, not the kernel path."]

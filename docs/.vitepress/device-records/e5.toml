[[area]]
id = "usb-console"
status = "device-verified"
components = []
paths = ["patches/xnu/e5-usb-console.patch", "scripts/usb/**", "docs/usb-console.md"]
inputs = ["E5 vendor FDT, e5-linux Qogirn6lite PHY/MUSB/UMP9620 ADI definitions, XNU 10063.141.1 patched baseline."]
configuration = ["Board payload defaults to e5-usb=1; native full-speed polling CDC ACM at physical 0x64a00000, product E5 XNU log, VID:PID 0525:a4a7.", "Independent 1 MiB kernel log history and 1 ms worker. No EFI callbacks, descriptors or memory pointers are retained after handoff."]
procedure = ["Export the identical shared CDC/PHY implementation with e5-xnu/tools/sync-e5-usb-kernel.py against the prepared preceding patch series.", "Rebuild the pinned source kernel and prelink, pack a bounded B-slot trial, verify flash readback and collect firmware/native USB plus Android recovery through e5-uefi-cycle.sh."]
findings = ["The native transport buffers early console bytes before arm_vm_init, then maps its own MMIO and reinitializes controller/PHY. Console producers use a nonblocking lock after VM initialization; USB completion advances the delivery cursor. A startup worker keeps enumeration and idle output alive.", "Trial 2026110617 qualifies native CDC after firmware handoff on macOS: 76,344 firmware bytes, 34,066 initial kernel bytes and 97,397 kernel bytes after closing/reopening the reader. The kernel stream includes early E5 markers, Darwin 23.6.0, VM startup and BSD root disk4s1. All 25 sampled heartbeats report sent==written and dropped=0.", "EP0 IN replies must release SETUP RX ownership before filling TX. PIO UNDERRUN is an empty-FIFO NAK, including after a packet ACK; treating it as failure duplicated 64-byte packets. Both transports share the corrected implementation. Normal printf/vprintf is captured at common console_write/unbuffered entries before panel/UART policy."]
completion = ["Native CDC ACM enumerates after ExitBootServices, captures kernel startup and idle heartbeat, survives a reconnect, and the bounded trial returns to Android A."]
limits = ["Hardware capture used macOS; Linux discovery/reader coverage is host-fixture only. The reconnect test closes/reopens the serial reader, without physical unplugging.", "A kernel failure before native MMIO mapping cannot deliver its early buffer over USB; panic drain and cold power loss were not separately forced."]
next_action = ["Retain the verified USB kernel/payload as a bring-up baseline; separately qualify physical unplug/replug, Linux hardware capture and panic-context delivery."]


[[area]]
id = "display"
findings = ["R388-R390 pin the FrameInfo advertisement as load-bearing: opaque213 answering count1/Success (empty64-byte key, transport0, still no completion reports in slot337) is REQUIRED for the desktop composite. R388 with e5-frameinfo=0 (count0/Unsupported) boots identically to R387 then stalls the BGRA UI session at16 frames of boot-progress content (source_rgb stays ~8k px; R387 jumps to ~79k at frame5), the main render client keeps fi=0 (R387 fi nonzero), UnityPosterExten and ShortcutsTopHits crash, and ui-ready automation never arms. R389 reproduced the identical failure by accident (toml-inherited value, kept as a determinism control) and R390 restored e5-frameinfo=1 with byte-identical kernel/ICD/Data: desktop at79k px, complete Settings navigation, Home to a real desktop and successful Settings reopen (first pass of the r385-r387 boundary). Evidence docs/logs/gpu-r388-evidence.json, gpu-r389-evidence.json, gpu-r390-evidence.json and ui-r390/.", "R385 captured the native Settings root, Notifications page and return to Settings. Physical touch cancelled the automated run after scrolling, so Home/reopen acceptance remained incomplete. R386 repeats the complete sequence with passive GPU timing.", "R387 candidate restores native Mach FrameInfo transport: original slot336 true skips reference initialization for an unsupported shared queue. Pinned XNU returns Success without a send for a null reply port; the old list-node-as-reference fallback therefore did not establish delivery. The replacement walks only native live lists under their command gate, checks node+0x18 ports and uses two/six-word FrameInfo/vsync payloads. Host regression fails on the old sender and passes ASan/UBSan on the replacement; runtime FPS and complete navigation remain pending.", "R384 fuses source pixel statistics into RGB565 conversion while preserving independent destination readback. Actual last-present work falls from roughly180ms to50ms; this excludes GPU and queue waits and does not establish smooth UI.", "R377 candidate accelerates Bifrost register interference by tracking nonzero live nodes; exact constraints/affinity/live-state differential tests cover MOV, BLEND, dual destinations and partial masks through24000nodes (27-29x stage speedup). R376 delivered native Home and Settings taps but remained at two lock-screen frames while a helper pipeline compiled. Follow-up input mode4 adds frame-gated Settings row/Back/scroll/Home/reopen diagnostics; physical touch cancels and missing frames stop the sequence. All interaction outcomes remain pending.", "R375 qualifies linear b3a8 XR10-to-RGB565 presentation: original backboardd completed two UI command buffers; both swaps accepted, copied and retired with zero failures. Actual plane layouts are 320x480, row1280 at0 and row320 at614400. FNV23d7ef95 frames show the original Chinese date/time lock screen and status bar. Host pixel/bounds ASan+UBSan and kernel build pass; Android A recovery, all three protected-window checks and complete Data backup pass. Physical panel and desktop interaction remain unqualified. See docs/logs/display-r375-b3a8-evidence.json.", "R309 diagnostic makes the isolated Settings sequence wait for two actual CPU-presented frames before Home, then wait ten seconds before the tap. Synthetic mode3 requires its completed Home sequence and the native digitizer driver, not a physical sensor packet. Actual finger activity still defers/cancels the test. Other input modes and real hardware readiness remain unchanged. This corrects the R308 reproduction gate, not the Settings application itself.", "R307 candidate expands opt-in deep task observations to 64 threads with truncation markers and reads the pinned libobjc runtimeLock before/after. Stack sampling now selects processes by name, restoring backboardd/lsd coverage after adding application targets. R306 shows SpringBoard main and HID threads waiting in Objective-C class lookup while Preferences waits for applicationInitializationContext; the lock owner and cause are not yet established.", "R306 adds opt-in BGRA/source and RGB565/scanout summaries plus current Preferences/MobileSlideShow thread observations to isolate black Settings content. Kernel 814bccb2a646d48ac32307c078a530a8d761c8d96dbb63c53e1398d61d8255f3 builds with frozen source matching; host pixel/layout checks pass. Pre/postflash 37/37 and full payload readback pass; runtime and application content are pending. Original userland is unchanged.", "R306 adds opt-in e5-ui-pixels1 source/destination pixel summaries at the existing retained BGRA copy path, logging dark/blank transitions and bounded periodic samples. Rejected format/composition changes are logged even late in a boot. Preferences and MobileSlideShow join the process/thread/dyld snapshots with exact same kernel ABI and static scratch storage. No pixel/fence/format acceptance or display behavior is changed; this distinguishes missing producer content from conversion and process startup failure.", "R297 canvas mode reserves the validated firmware scanout for one diagnostic writer. The normal CPU presenter neither maps nor accepts compositor swaps in this mode, and e5-no-vc is mandatory. Readback-checked milestone images are canvas evidence only; no original UI copy/retirement, new DPU sequencing, vblank or physical power recovery is claimed. Host and device qualification are pending.", "R286 integrates gated E5 HID startup and its archive before launchd. The accepted display/storage implementation and original Apple family instructions are preserved; new input runtime qualification is pending. ", "R284 hardware confirms at least 32 real BGRA-to-RGB565 copies and original retirements with zero copy failures; final swap API count 36. Pending masks change from 1:0 to 1:1 while surface identity remains valid. The user confirmed visible iOS UI. Android recovered and all 37 protected chunks passed without retained integrity/panic errors. Initial black-frame RLE capture is complete; later visible UI has no full capture. Exact desktop state and touch remain unqualified. See docs/logs/runtime-r284.json.", "R283 hardware: IOPM callback sets requested=1 powered=1, then the CPU presenter accepts three real BGRA surfaces. Rechecking original mutable request masks in the pending queue rejects copying (reason6). R284 keeps the accepted full-frame plan and surface identity, rechecks actual format/backing bounds and retains the fence/retirement protocol. Pending masks are logged; R284 hardware qualification is recorded in docs/logs/runtime-r284.json.", "R283 preparation registers two logical display IOPM states and retains the original setPowerState callback. R282 initial hardware log confirms requested=0 powered=1 after firmware reporting; the original submit gate still depends on requested. Two bounded RLE captures verify destination pixels with a complete-frame checksum for host PNG decoding; physical output remains separately unverified. R283 hardware confirms successful IOPM callback and three accepted BGRA surfaces, but no copied/retired frame; Android recovered and all 37 protected chunks passed. See docs/logs/runtime-r283.json.", "R281 completed 8096 swap calls, unchanged panel CRC 11b0af80, no retained integrity/panic markers, Android recovered and protected windows passed 37/37. Presenter logging was suppressed; see docs/logs/runtime-r281.json.", "R282 preparation reports retained firmware power through the hash-qualified original slot-354 state setter, preserving the client requested state. Bounded CPU presenter and state-transition events remain visible independently of e5-ca-state, including refusal geometry. R281 used the suppressed old helper; missing E5CPU rows in that run do not prove absence of validation/copy. R282 hardware: requested remains 0 and powered=1, 6663 swaps never reach CPU validation, no retained integrity/panic errors, Android recovery and 37/37 protected chunks pass; see docs/logs/runtime-r282.json.", "R279 reaches the SpringBoard UIApplication run loop and real SwapBegin/SwapEnd, but original selector 3 fails with No Default FB Surface found; the user reports no SpringBoard pixels. R281 preparation connects hash-qualified original IOSurface getters, request validation, bounded BGRA-to-RGB565 copying and original current-swap retirement. SwapWait now uses the original completion state; host sanitizer checks cover padded rows, colors, alignment and rejected bounds. Default-surface absence is also seen on successful comparable ports and is not established as the sole blocker. No new display kernel is device-qualified yet.", "R277 diagnostics: periodic CA inspection retains the last observed backboardd PID (with name/lifetime revalidation) instead of clearing it to zero. R275/R276 sampled the array before it was populated and otherwise lost every late display-state snapshot. Fix dyld_image_info stride from 168 to the ABI 24 bytes; the old image enumeration skipped six entries at a time.", "R275 independent timer is live on eMMC-only: E5OBS/E5PROC/E5LIVE and E5DPU appear while PID 1 reads the cache. R275 CPU values exposed an older probe bug: cpu_time_eqos_stats at 0x4f8 is a task field, not a thread field. R276 samples real accumulated absolute ticks through recount_thread_time_mach while task_lock protects the member; prior E5TH cpu values are invalid.", "R274 eMMC-only boots skip SD media publication, so the SD read-completion frame kick never runs and neither the runtime census nor the delivery/DPU timer starts. R275 starts an independent, serialized kernel-priority timer from display startup, samples processes/registry/panel/eMMC counters every approximately 32 seconds, and schedules the 60-second deep thread probe outside display delivery. The native family notification stays on the delivery worker. Census now includes launchd/logd/lsd/watchdogd and IOWatchdog registry presence. Host compilation is verified; R275 device acceptance is pending."]

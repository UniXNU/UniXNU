[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["dts/**", "package/*Memory*", "board.toml", "docs/system-volume-audit.md", "docs/logs/system-*.json", "docs/logs/emmc-flash59.json", "docs/logs/uefi-report-172018.txt"]
inputs = ["2 GiB DRAM starting at 0x80000000; vendor reserved regions from the live device tree; kernel, ADT, ramdisk and boot-args staging windows."]
configuration = ["Flash #57/#58 use a 256 MiB owned window with kernel physical base 0xC407C000, boot-args at 0xC819C000 and staging top 0xC8234000. The ADT declares 2 GiB DRAM but originally omitted darwinboot-memory-size.", "payload.adt.owned_memory_size = 0x20000000 (512 MiB) is accepted in flash #59: loader mem=20000000 and owned=0x20000000, followed by the same root and five successful commands. The UEFI High RAM donor is 0xC4000000..0xF0000000, separate from framebuffer, initrd and top-of-RAM logs.", "PE_init_platform copies boot_args Video fields; Video v_display is forced to 0 so XNU picks the text-mode console and maps the framebuffer itself."]
procedure = ["Read the DarwinBoot staging debug lines (kernel va/pa, args address, video base) from a collected report.", "Verify the APFS seed volume mounts from the ramdisk (E5SEED volume UUID in board.toml)."]
findings = ["The packed ramdisk growth from 291040 to 467184 bytes shifted the staging top by 0x2C000 without affecting boot; staging is size-independent within the reserved window.", "Memory ownership hand-off follows the boot_args ABI of XNU 10063.141.1 (struct sizes 0x480 verified against pexpert/arm64/boot.h).", "The complete clean sidecar is parsed before/after the 512 MiB request; all properties except /device-tree/chosen/darwinboot-memory-size remain byte-identical. Kernel, seed, trust cache, EFI files and firmware are held fixed for flash #59.", "The board-tested E5 image-set identity adds only boot-manifest-hash and its development-domain tag under chosen. All memory request, DRAM geometry, reserved ranges and other ADT properties retain their bytes; the 512 MiB request is preserved in both CI-306 experiments and the common generator exactly reproduces the tested sidecar.", "V7 adds the ordered concrete display archive without changing ADT memory ownership, framebuffer reservations or Video handoff. Its bounded factory probe requires the registered Legacy size to equal 0x18a0 before constructing an object, adds no private state, releases the allocation and checks instance-count balance. It does not map/write scanout memory. CI 336 compiles the exact size/dispatch checks; r81 measures the original parent size as 0x18a0, validates identity/ancestry and owned metadata, and confirms allocation/init/release with balanced instance count. No scanout memory is mapped or written."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["SMMU is not configured; DMA uses coherently-mapped buffers with explicit cache maintenance.", "#59 verifies the 512 MiB handoff and unchanged seed workload. High-page stress, complete DMA coverage and memory pressure under original userland are not yet measured; physical DRAM size is not an acceptance claim for a 2 GiB XNU window."]
next_action = ["Use #59 as the current seed baseline and retain #58 as the 256 MiB fallback. Measure memory pressure and allocator limits when original launchd/dyld and services are introduced."]


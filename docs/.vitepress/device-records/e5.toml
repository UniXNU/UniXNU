limits = ["Physical GPU panel observation, hardware-vblank timestamps, rotation, compressed surfaces and display/backlight power recovery remain unqualified.", "R390 captures the complete Settings navigation including Home and reopen, but scroll has only near-top sampled frames and physical panel observation and hardware-vblank timing remain unqualified."]
next_action = ["Settings functional acceptance is complete (r390); reduce interaction latency from the measured bottlenecks: synchronous queue submit waits (0.1-2.3s per SubmitWaitMany with 7-93 batches) and multi-second shader recompiles (19.4s observed inside a session; only weak_ref mem_cache exists).", "Then prioritize battery/charging and shared Wi-Fi/Bluetooth power ownership."]


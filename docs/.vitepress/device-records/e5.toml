configuration = ["board.name = e5; board.soc = UMS9621; board.soc_source = ums9621; board.os_profile = ipados-17.7.11-21H461; schema_version = 2.", "kernel.defconfig = e5_defconfig; patch_series applies arch, soc, os then device series.", "Device kernel archives add e5_emmc_build.py (NativeEmmc IOKit storage driver), RamBlock with virtio-mmio bindings, e5_derive_audit.py storage ABI audit from the pinned kernelcache IPSW, SoftwareAES bindings and mockfs fixture."]
procedure = ["Run ./unixnu defconfig e5_defconfig --device <repo> from the UniXNU checkout.", "Run ./unixnu status --json --device <repo> and confirm profiles, source pins and patch order.", "CI (kernel-builder workflow) builds kernel.macho from the pinned sources on a macOS runner."]
findings = ["R305 manualPhone1x touch/Home/app-switcher/layout pass:601callbacks/599good,2coalesced,594event/5timer reads,0bad/recovery/foreign;294changes/23single taps/6drags/2dual releases/all-up/final0.426HID nofail/drop,originalclientdelivery,2433displayframes/30FNVcaptures,900s/fullreadback/allthree37/AndroidA pass. Allautomaticinputoff. Settings entersblack,post-settingsHome untested; currentB2D258C1 logscoveronlyearlystartup, so no uniquecause is claimed. See docs/input-se2-r305.md.", "R305 frontend identity uses authentic iPhoneSE2 D79AP/iPhone12,8 product data from17.7/21H16 Apple DT. ProductIDc459fdb0eef455588dbc6f587c20a5372792bbf8 matches the current21H461 MobileGestalt table(row57,type0x80bb21e1). Artworkphone/subtype569/scale1 and chosendisplay-scale1 select native320x480 UIpoints. E5 board/UMS hardware, kernel/OS ABI,rootUUID/reservations and hardware compatibility suffixes remainfixed. A whitelisted retained-ADT edit proves unrelated property bytes unchanged; phone layout/runtime mustbe verified.", "R286 integrates gated E5 HID startup and its archive before launchd. The accepted display/storage implementation and original Apple family instructions are preserved; new input runtime qualification is pending. ", "R277 qualifies a 640MiB DarwinBoot ownership request on this board: 144080 free plus 19760 wired pages at bootstrap, full 600-second runtime, no retained corruption/panic, fresh Android return. board.payload.adt.owned_memory_size now defaults to 0x28000000; the typed property is the only ADT change, within the conventional-memory donor.", "Arrays replace inherited selections in board.toml; the device list restates every required component.", "CI rebuilds from identical patch content are not byte-identical; kernel behaviour was validated by flash evidence instead of binary hashes.", "Patches must be generated against the arch+soc+os-patched tree; anchors against pristine Apple XNU fail where UniXNU series modify the same files (for example arm_init.c gains boot_progress helpers). The payload now requests 512 MiB through payload.adt.owned_memory_size; flash #59 qualifies that setting with kernel 262 and all other inputs fixed.", "board.toml now publishes a 48-byte development boot-manifest-hash and the E5.Bringup.ImageSet.v1 owner domain for the exact verified OS/SystemOS image pair. The pinned common ADT generator reproduces the board-tested sidecar byte for byte with its saved random seed; all pre-existing properties remain unchanged.", "V7 adds the ordered e5_display_build.py archive step after storage compilation. It appends the concrete display probe to the already force-loaded E5 archive, verifies the exact original family and every compiled virtual binding, and strips only the owned automatic initializer. CI 336 passes compile/link/prelink and its final linked inheritance/late-init audit. R81 confirms the resulting concrete factory/init/release path with all 173 late samples at a=3 v=1ff s=18a0 r=0; this does not qualify display publication or scanout.", "R109 diagnostic preparation is isolated on fix/display-submit-trace-r109. The original CI362 scanout attribution is corrected in docs/logs/display-content-audit-r108.json; all 86 resolved patches replay with pinned source inputs, recorded in docs/logs/display-submit-r109-patch-check.json. Only kernel diagnostic code and the panel probe change; payload/firmware/Data acceptance remains pending."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["Hardware-facing patch changes still require device validation. The earlier general binary-layout-fragility diagnosis was withdrawn after fixed-seed control experiments isolated incorrect keypad MMIO addresses."]
next_action = ["Keep source and payload inputs pinned per experiment; change one variable and retain matching flash evidence for hardware-facing changes."]


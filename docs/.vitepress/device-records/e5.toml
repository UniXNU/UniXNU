inputs = ["Rongyue E5 Mali-G57 Valhall v9 Job Manager, GPU_ID 0x90910010, shader mask 0x5, VA48/PA40, AS 0xff, JS 0x7; stock Android kbase r41p0 UK 11.38."]
configuration = ["e5-mali-g1=1 e5-metal=1 enables the native kernel/Metal stack; the original compositor renders with GPU, followed by CPU RGB565 conversion.", "ABI1.7 accepts both64/256-handle SubmitMany packets and offers combined SubmitMany/WaitAtom with unchanged legacy APIs. PANVK_E5_SEPARATE_WAIT=1 selects the old userspace round-trip path for measurements.", "Imported shared memory retains original CPU cache attributes. Every pinned imported range is cleaned before submission and writable imports are cleaned/invalidated on actual terminal retirement.", "e5-gpu-perf=1 samples the first8 and every64th job. Its out-of-object timing table preserves the IOService size limit; the diagnostic is disabled by default."]
procedure = ["Freeze source and kernel hashes, run the e5-xnu e5-uefi-cycle pipeline with 900-second watchdog, verify all 37 partition chunks before flash, after flash and after return, and capture a verified Data-after backup.", "Require actual job completion, zero unexpected errors, and independent full-frame pixel/hash comparison before accepting rendering; repeat reused descriptors before testing imported scanout."]
findings = ["R388 adds ABI1.7 timing instrumentation to the first working UI session (r390): E5SHADERPERF (panvk_compile_shaders) and E5QUEUEPERF (gpu_queue_submit) sample first8/powers2/slow calls; E5GPUPERF samples submit cache, true GPU/IRQ completion, observation latency and retire cache per atom. Measured r390: single shader compiles reach 19.4s inside the session (r388 boot saw 15.5/15.1/9.9s; r389 max4.9s - a distribution, per-run order varies) while the runtime holds only a weak_ref mem_cache (disk cache disabled in this Meson build), so pipeline destruction forces recompiles; queue submits with 43-93 batches take 0.6-2.3s under the single synchronous SubmitWaitMany call while individual atoms execute in ~100us with ~4-6ms kernel overhead. These two paths, not the RGB565 copy, dominate interaction latency. RGB565 paired scalar access and the FrameInfo count1 advertisement are retained as verified behavior.", "R386 sampled per-job cache clean, GPU/IRQ completion, completion observation and retirement sync separately. First-eight startup jobs have larger scheduling delays; later sampled cache stages are about2..5ms each, hardware/IRQ time about0.2..29ms and observation delay near zero. Do not generalize startup latency to steady-state FPS.", "ABI1.7 adds selector16 combining the existing SubmitMany and bounded500ms WaitAtom without a second IOKit round trip. The driver releases its state lock before waiting and reuses the exact cache publication/pin/retirement path; active timeout/fault is not DONE. Mesa uses the new call only on minor>=7, with the legacy two-call path retained. Actual-source ASan/UBSan tests cover both paths and failed/pending completion refusal; the new signed ICD/kernel await R387.", "Source inputs are pinned with SHA256-checked ordered Mesa, MaliMetal, Metal2Vulkan and ArmCpu patches. The ArmCpu lifetime dependency remains device-carried rather than pushed to the shared upstream.", "R313-R336 establish device identity, MMU/BO operations and JM write-value readback. R332 and R337 clear tests produce exact full-frame RGB565 results.", "R337 preserves the complete GPU-written TCTX polygon value. Fullscreen VS/FS rendering passes with mismatch=0 and FNV cf06c8848298b325, with two submitted/completed jobs and zero errors. The second variant faults at reused job descriptors; their GPU-written 16-byte header prefixes were not reset.", "R339 fixes the analytic fragment shader: integer upper-left pixel coordinates need +0.5 pixel centres, no vertical flip, the corrected edge direction and floating-point comparisons. Fullscreen and triangle each pass eight alternating repetitions; every triangle has mismatch=0, inside=39810 and FNV 65013b65352f3955. Clear also matches exactly, with zero GPU failures, faults, timeouts or resets.", "R339 runner rc0, full payload readback and all three 37/37 checks pass. Android A returns with a new boot ID and unchanged CID/sector count. The verified 4GiB Data-after hash 8075a4a5... matches R338. Full frozen evidence is in docs/logs/gpu-r339-evidence.json.", "R340 compiles and passes all offscreen controls (34 submitted/completed, zero faults/timeouts/resets/MMU faults) but rejects scanout before submission. Import accounting and teardown return to zero. Host reproduction proves entryPhys retained NX bit54: the valid leaf 00400000be000743 decoded as physical 00400000be000000 rather than be000000.", "R341 fixes NX leaf physical-address decoding and passes 75/75 imported pages at PA be000000. All 16 direct scanout frames match the independent host reference byte-for-byte, with two stable reads and zero CPU presenter copies. Total jobs are 66 submitted/completed; faults/timeouts/resets/MMU faults and active/mapped/BO resources are zero. Full 900-second run, runner rc0, all three 37/37 checks and fresh Android A return pass; the complete 4GiB Data-after SHA256 matches R340 and the latest-three backup retention pass completes successfully.", "R343/R344 exposed a probe plist but iOS 21H461 loaded its signed precomputed launchd cache; no user-probe entry was captured. R344 USB disconnected before the end of the window and automatic Android return timed out (runner rc1). The user reconnected/powered the phone; harvest, postboot 37/37, Android A identity and a complete SHA256-verified Data backup then closed recovery without relabeling the automatic run PASS.", "R345 verifies genuine userspace G1 ABI 1.1: a normal LC_MAIN program ran as PID1 before launchd, opened E5MaliG1, queried raw properties, mapped 64 BOs, rejected invalid cache/65-handle requests, verified last-handle pinning and completed eight RGB565 GPU clears with zero mismatches/FNV e2c50ed21b7e2325. Submitted/completed=8/8; faults/timeouts/resets/MMU faults and final active/mapped/BO counters=0. It execed original launchd in place. Runner rc0, three 37/37, Android A and complete Data SHA256 4837f188ca13910827c75a66130993cfa89f977c6d0b3d41a364878743c52201 pass. PanVK, Metal, original SpringBoard GPU rendering and physical observation remain unqualified. See docs/logs/gpu-r345-evidence.json.", "R345 restores the official 21H461 Skip Setup policy on media-direct eMMC Data using a clone of the fresh R344 backup. A 364544-byte delta passed independent command replay, full installed 4GiB readback and adjacent-sector/GPT/37-window checks. All five policy dictionaries and zh-Hans/zh_CN persist after boot with mobile UID501; Setup has no captured process census, while SpringBoard is active. containers/Temp was verified before install and absent after boot. Iconservices crash markers remain; no visible home-screen claim is made.", "R346 prepares explicit mode3 startup for a signed probe and native PanVK library staged under owned Data. The kernel checks the staged probe is a bounded regular file before ordinary exec; mode2 retains the verified embedded ABI probe. Vulkan execution and UI qualification remain pending this new build.", "R346 reached its signed staged PID1 probe but dlopen of the PanVK ICD failed with file-system sandbox blocked mmap; no Vulkan GPU job is qualified. The probe handed off to original launchd. R347 prepares e5-gpu-map=1: diagnostic reporting and a development-only MAC mapping grant for that exact ICD path, qualified eMMC Data, PID1 named e5vk-probe, private mappings and no RWX. Descriptor permissions and later VM/code-signature validation remain. R347 mapped the ICD executable segment after the original MAC EPERM, opened the genuine E5MaliG1 client, then trapped on MRS CTR_EL0 in util_cache_granularity during physical-device properties. No GPU job ran. PC and LR match the signed ICD instruction and caller at image offsets 0x19b538 and 0x70ee8. The fatal handler retained PID1 until the watchdog; automatic return, runner0, three 37/37 checks and a complete 4GiB backup passed. See docs/logs/gpu-r347-evidence.json. R348 uses the kernel ABI 64-byte cache granularity in property queries and deferred-sync coalescing. Native Vulkan compute (1024 integers) and a 320x480 RGBA triangle both pass with zero mismatches; submitted/completed4/4, faults/timeouts/resets/MMU faults0, both client resources0. The probe execs original launchd and SpringBoard/backboardd remain active. Runner0, three37/37 and a complete Data backup pass (SHA256 2d976207567ffdcab7ab26e24e013d155fa7d884bd556816e72bdb0ee3ab2209). See docs/logs/gpu-r348-evidence.json. Metal and original UI GPU composition remain unqualified. A separate Metal candidate adds opt-in mode4 for e5metal-probe and map2 for that PID1 probe to load only its signed plugin and ICD. Mode3/map1 behavior remains intact. Authored Metal compute and triangle passed on host Apple M5 (zero mismatches, triangle FNV 417503084e2ac225); iOS shader translation passes within 20s/500MiB. The separate kernel candidate compiles as SHA256 60ae7868ccba4a8fc874536b80d2c72817f99368631c274de6d38897bf6aa8b2. Its Metal ICD also exports vkGetInstanceProcAddr for the Rust bridge direct-loader contract. R349 dedicated Metal compute/graphics pass on E5 with exact reference pixels, five jobs completed and zero final resources; full round closeout is in progress. Original UI GPU composition remains unqualified. The next candidate adds ABI1.2 ImportUser for page-aligned writable ranges in the retained owner task, non-executable GPU mappings, kernel cache maintenance, and DMA-safe unpinning. PanVK advertises host import only for ABI1.2 and accepts only non-coherent cached memory types. R350 rejected all six invalid/read-only imports and retained ordinary Metal rendering, but the runtime refused noncoherent no-copy memory before a GPU import. The ABI1.3 candidate holds write-combining through XNU pmap per imported physical page, with reference counts across clients and restoration on last release and exposes coherent host imports only on that ABI; physical GPU IO coherence remains false. R351 confirmed alias reference counts and exact per-page cache restoration, but the first no-copy dispatch was rejected before hardware submission: the legacy submit validator omitted userMd-backed BOs. The next kernel recognizes every descriptor backing in submission and free-slot selection; it reuses the signed R351 programs and a 600-second focused window. R352 passes both CPU-to-GPU-to-CPU no-copy rounds, survives releasing one of two client references, and renders a real IOSurface with zero pixel mismatches. All nine jobs complete with zero faults/timeouts/resets/MMU faults; cache restoration mismatches and remaining imported-page references are zero. Original launchd handoff succeeds. Full round closeout and original UI qualification are tracked separately. R354 creates the original backboardd Metal device after using its sandbox-approved com.apple.backboardd cache namespace, then rejects QuartzCore framebuffer fetch. R355 enables E5 v9 color rasterization ordering and native LD_TILE, but its ordered uint recurrence fails with a zero flat varying; no hardware faults or leaked resources occur. Host compilation preserves the uint output, secondary vertex program and flat fragment load with matching location offsets and no FP32 flush. R356 tests exact generic varying packet strides against constant and vertex-id controls plus independent uint and UNORM fetch recurrences; all four Apple M5 references pass. R356 all four rendering cases fail: constant and vertex-id varyings read as zero, uint fetch follows the zero-step recurrence, and UNORM readback retains initialization bytes. All 16 jobs complete without GPU errors or final resources; recovery and full Data backup pass. R357 corrects uncached/coherent ordinary allocations by owning anonymous CPU memory and importing it through the proven ABI1.3 page policy. It combines real compute/render checks with opt-in post-VTC heap/packet readback; R357 ordinary coherent allocation and compute pass; UNORM now reads rendered data rather than its initialization bytes. GPU heap readback finds all 48 sentinel writes at the packet varying area, while fragment inputs still read zero. All 17 jobs complete and final resources/cache references are zero. R358 uses typed descriptor-based v9 fragment varying loads, explicit packet offset1024 and strides, and reserves the varying descriptor prefix before sampler/dynamic-buffer lowering. Host compilation emits LD_VAR_FLAT_IMM.u32; allocation lifetime checks still pass without GPU submission. R358 passes genuine compute, both varying controls and the ordered uint/UNORM framebuffer-fetch recurrences with exact Apple M5 reference hashes and zero pixel mismatches. All17 jobs complete with zero GPU errors and final resources/cache references. The typed descriptor path resolves the fragment varying failure. R359 original SpringBoard/backboardd rendering is queued after automatic R358 recovery, using the identical signed user stack and original mmap policy. R359 fails before opening the native device: its probe-only trust module omitted the different system-plugin CodeDirectory, while the system bu
result = "unixnu,cluster-type is E on cpu0 to cpu3 and P on cpu4 to cpu7. Those rows are only valid together with the feed patch native-smp-type-clusters.patch, which raises MAX_CPU_CLUSTERS to 2 and defines __ARM_AMP__: parsed against MAX_CPU_CLUSTERS 1 the topology parser maps a P core to cluster 1 and writes past the end of cluster_phys_to_logical on the stack, and the kernel dies before the console comes up. scripts/check-smp-topology.py refuses the unpaired form"

schema_version = 1

[device]
name = "dby-w09"
soc = "SM8250"
os_profile = "ipados-17.7.11-21H461"
summary = "Huawei MatePad 11 (DBY-W09, kona) runs iPadOS 17.7.11 with the donor identity iPad7,1 / j120ap. The board owns its partition geometry, defconfig, boot package and build recipes; XNU, driver and kit implementations come from the shared tree. This record states what is implemented, what has been observed on hardware and what is still missing."

[[area]]
id = "configuration"
status = "implemented"
components = []
paths = ["board.toml", "feeds.toml", "unixnu.lock", "configs/**", "scripts/build-xnu-4k-baseline.sh", ".gitignore", ".gitattributes", "local.toml.example", "porting.toml", "AGENTS.md", "README.md"]

inputs = ["iPadOS 17.7.11 build 21H461 for iPad7,1 (chip_id 0x8011, board_id 12, device_class j120ap).", "Shared hardware description and drivers resolve through [components] plus the two feeds in feeds.toml: the sm8250 SoC feed and the ShengUfs driver replacement.", "One defconfig, configs/dby_w09_defconfig, named by board.toml [kernel] defconfig."]
configuration = ["board.toml sets schema_version = 2, so the profile layers, dts/, the SoC repository and patch_series are read as format 2.", "[board] kit = dby_w09 maps package/ to kits/dby_w09 in the assembled tree.", "[ipsw] pins the restore URL, identity and two root-image member hashes; [userdata] records the userdata GPT entry; [device_tree] selects dts/dby_w09.dts with the SoC include directory, and scripts/unixnu/devicetree.py generates the ADT.", "feeds.toml pins two sources beyond the base repository: kind = soc sm8250 (FFT-infra/UniXNU-sm8250-common) and kind = driver ShengUfs (FFT-infra/NativeUfs-alioth, the SM8250 stream of the same driver). ./unixnu fetch clones both at their pinned commits and records them, with every Apple reference source and edk2, in unixnu.lock. Machine paths belong to the ignored local.toml or --local-module."]
procedure = ["Read https://unixnu.com/porting/device-repository and https://unixnu.com/porting/records.", "From the UniXNU checkout run ./unixnu defconfig dby_w09_defconfig -D ../UniXNU-dby_w09, then ./unixnu status --json -D ../UniXNU-dby_w09 and ./unixnu tree -D ../UniXNU-dby_w09.", "Check that every printed module source is the intended one before building."]
findings = [
  "The iOS flashlight gate is a build-time ADT input: docs/guide/mobilegestalt.md:14-32 lists the /product properties as things the payload writes when the image is built, and scripts/unixnu/devicetree.py:280-287 turns any non-property key of an [adt.*] table into a child node of the same form, so [adt.product.camera.u32] flash = 1 emits the node AVFlashlight asks about (refer/PaganiDrivers/drivers/PaganiTorch/README.md:76: +[AVFlashlight hasFlashlight] is MGGetBoolAnswer of camera-flash, which is the property flash of IODeviceTree:/product/camera existing at all). adt-walk.py over the payload that shipped as ord216 reads /product -> /camera -> flash = 01000000. What is NOT settled is written here rather than left hidden: the mother adds that node from the kernel only when the plug-in is visible and the driver runs, so a static ADT copy also answers camera-flash on a boot where dby-ti is off, and on 2026-11-09 the owner reported that Control Center lists a camera whose opening restarts SpringBoard. Cause is being attributed before any further flash.",
  "The catalog name is `dby-w09`, not `dby_w09`: scripts/sync-devices.py parses board.toml through board_data(), which returns None unless [board] name matches SLUG = [a-z0-9][a-z0-9-]*, so an underscore makes the twice-daily scan discover the repository and then skip it -- none of the registered devices has an underscore, while repository names may keep one (IssacL04/UniXNU-Pagani_SM8750 registers as oneplus13t). porting-record.py:validate requires device.name to match board.toml and config.py:80 builds out/<name>/ from it, so the record name and the two out/ paths in the prose moved with the board name; kit = dby_w09, configs/dby_w09_defconfig, dts/dby_w09.dts, [firmware] config and scripts/check-dby_w09.py are directory or file names and are unchanged.",
  "board.toml on 2026-11-05 pins the firmware tree as the published `WQSQW/uefi-dby_w09@423e222`, and the sm8250 SoC feed checkout is at its pinned commit `6bb9b025704764a662728dce1a30557a35e082d8` with a clean work tree, so `unixnu fetch` reproduces both feeds.", "scripts/ is an overlay, not a symlink: tree.py:assemble copies core, then the SoC repository, then the device repository into out/<device>/tree/scripts, so scripts/build-xnu-4k-baseline.sh in this repository IS the board kernel step and core's copy is only the default it replaces. When core changes that script the board copy has to be re-diffed by hand; today the two differ only in the QcomXnuUsbDebug hunks.", "components.toml is symlinked from core and the device repository cannot extend it (tree.py:assemble), so a module with no catalog spec reaches the kernel as package/<Name> plus a [kernel] archives script slot; that is the official shape for QcomXnuUsbDebug, and [components] says so instead of pretending to select it.", "Editing configs/*_defconfig alone is inert: the kernel build reads the generated out/dby-w09/.config, so defconfig must run again after every defconfig change.", "The donor identity is not a free choice. Prelink, ADT, PMGR contract and Metal inputs are written against iPad7,1 / 21H461, the only combination with an official qualified reference; another donor means redoing target adaptation from scratch.", "kernel_args are measured, never assumed: the CPU round passed armcpu-self-ipi=1 and moved sheng-cpufreq from 2 to 3, so the accepted line is 46 arguments and 984 bytes against the 1000-byte gate in core/scripts/unixnu/payload.py:35. The probe that spent the whole reserve (sheng-banner=1, 47 arguments and 999 bytes) was built, flashed, read and reverted at the owner's instruction on 2026-11-05: a readable log outranks painted text, and he never asked for the text back. So the line is at 984 with 16 bytes free again, and qcom-usb-ctl=1 (15 bytes with its space) has gone back from queued to affordable. On 2026-11-05 21:43 the line moved to 46 arguments and 993 bytes: sheng-log=1 was dropped (-12 bytes, the owner judged the userdata log window useless after it was built and read) and -enable_kprintf_spam added (+21). That flag is the only thing missing between the 3844-byte / 65-line console and full kprintf: the QUD port rewrites pe_kprintf.c so qcom_usb_debug_kprintf_requested = !disable_kprintf_output, which is false on a DEVELOPMENT kernel unless this argument is present, leaving only the _cnputs printf tee. On 2026-11-06 00:08 the owner approved a trim and the line was re-measured at 42 arguments and 901 bytes with 99 free: offline-legacy-retire=1 (-23), boot-ui-focus=launchd (-21), boot-ui-focus4=SpringBoard (-26) and sheng-data-reset=1 (-18) were each dropped together with their separating space. None of the four carried behaviour, and that was checked at the reader, not assumed: offline-legacy-retire and offline-legacy-cpu-present feed one OR at NativeLegacyDisplay.cpp:522 (if (!(retire==1 || cpuPresent==1 || force)) return false;), cpu-present stays, so the retire path is untouched; the two boot-ui-focus rows re-added processes BootProcessProbe.c:36 already lists (launchd sits at slot 0, SpringBoard at slot 2 with trace_slot={0,1,1}), so the sample table simply falls back to its default; sheng-data-reset=1 never enters a branch because BootWatchdogPolicy.c:51 acts only on reset==2, leaving the persist argument as the one that works. The reclaimed reserve goes to the backlight argument under the naming rule now written at the top of kernel_args: a board-prefixed short key, dby-bl=1, takes 9 bytes including its separator where the sheng-backlight=1 the earlier budget assumed would have taken 18. That rule is the answer to the 1024-byte ceiling being structural (DarwinBoot.c:542 CommandLine[1024] copies straight into boot_args.CommandLine, which the kernel declares as BOOT_LINE_LENGTH 1024 at pexpert/arm64/boot.h:25): a new switch either earns a short board name or moves to the device tree through PE_get_default and /defaults, which devicetree.py:376 already emits.",
          "payload_sha256 can never repeat between two builds of one source: generate() writes os.urandom(64) as /chosen/random-seed (core/scripts/unixnu/devicetree.py:308), so the ADT differs by seed bytes only. Measured on 2026-11-05 by extracting kernel.macho.adt and unixnu.toml out of the accepted 4e808ec1 image and the reverted c1303fb6 image with mcopy -i and diffing them: the two command lines are byte-identical and the ADT differs in 62 bytes inside one 64-byte range (393..456). Identity of a payload is that diff, not its sha.",
  "A fresh output tree is not self-sufficient on this board: the board slug dby-w09 (catalog rejects the underscore) derives the whole output directory from [board] name, so out/dby-w09/... starts empty while out/dby_w09/... holds the previous round. Three build-tree inputs that no builder on Linux can make have to be carried across: the two xnu-prelink reference candidates that build-sheng-hid-input.py:20 and build-gop-legacy-display.py:109 hard-require (the device builder build-platform-power.py:5 defines the fallback and documents it as this board-s previous prelinked kernel, but the HID and display consumers have no such branch), the pruned QEMU observation record build/display-analysis/mobile-graphics-legacy-abi.json that audit-mobile-graphics-legacy.py:61 falls back to, and CONFIG_XNU_VERIFIED_ROOT_ARCHIVE, whose only writer build-cpu-desktop-kernel.py:9 is macOS-only. All three contain Apple kernelcache bytes, so they can never be committed.",
  "An untracked local copy of the shared tree accumulates board-specific edits silently. Every module that the board build depends on must be named here, otherwise this repository cannot reproduce the kernel (see README Deviations).",
  "The porting-record gate only fires for files an area claims, and three of this board-s live sources were claimed by nobody: package/DbyBattery.cpp, package/BatteryProbe.cpp, package/DbySmartPA.cpp and package/GeniI2c.c/h matched no area paths at all, so several rounds of battery, PA and bus work could be committed without the gate ever asking for a record change -- the skip is silent, it does not read as a pass. They are now claimed by power and audio. The mirror image of the same defect is package/BootLog.c, which sits under network: an area that has nothing to do with it, which is how its behaviour got asserted in three other areas without ever being checked there.",
  "Two output trees live on the build host and only one is current: out/dby-w09 (the catalog name, hyphen) and out/dby_w09, the format-1 tree from before the 2026-11-05 rename. A wrapper pointed at the stale one does not fail, it prints a kernel hash, an archive listing and a payload that belong to no image ever flashed -- measured on 2026-11-06, where it reported the 2026-11-05 kernel a6382e52 after the real build had produced b587c637. Any proof read off a build directory has to name the directory it came from, and the hash has to be recomputed from the file that actually went to the device.",
  "Two boot arguments were reversed on 2026-11-08 and both reversals are measurements rather than tidying. offline-legacy-unit-scale went to 1 to test whether the panel flicker was the scale; the verdict came the same day: the interface dropped to the very small tier (1 lays the panel out as 1600 x 2560 logical points on a 10.8-inch tablet) and the flicker kept happening, so the value went back to 2 and the flicker was settled by the supply, not by this argument. dby-bl was switched off for the same experiment and its cost was equally immediate: without it the brightness control disappears entirely, because package/BacklightProbe.cpp:24 returns from sheng_backlight_probe() unless the argument parses as 1, which leaves the AppleARMBacklight classes unregistered and nothing published. It is back on, and the flicker was never a candidate inside that gate: the four amplifiers are probed at :22, two lines before the dby-bl test, so dropping the argument could not have changed what the smartpa path does. Both rows now carry their measured reason in board.toml so the next hand reaches for the result instead of repeating the experiment.",
  "The defconfig rule above is a step and not a note, and it recurred on the torch archive: `configs/dby_w09_defconfig:130` already named three archives and `tree/build/dby-torch/libDbyTorch.a` (256216 B) already existed, yet kernel pass 1 died on `Undefined symbols: _dby_torch_start, referenced from: _monitor in libBootProgress.a(BootProgress.o)` because the generated `out/dby-w09/ipados-17.7.11-21H461/dby_w09/.config:148` still carried the two-archive line. `BOOTSTRAP=0` in that same log is what excluded the bootstrap-link explanation, and re-running `./unixnu defconfig dby_w09_defconfig -D ../UniXNU-dby_w09` made both passes return 0. A red link row naming an archives symbol is read as the missing step, not as a recipe that failed.",
  "The argument line is re-measured every round rather than carried forward, and on 2026-11-09 it paid for the torch. At this commit the joined `kernel_args` are 49 arguments and 989 bytes against the 1000-byte gate, so 11 bytes are free and ` dby-torch=2` is on the line. The payment came from `-no_slto_panic`, chosen by enumeration and not by preference: 22 candidate names were searched across this repository, core, the sm8250 SoC feed, the xnu feed and uefi-sheng, and that one has exactly one reader (`osfmk/kern/startup.c:473`, which only clears the `SECURITY_READ_ONLY_LATE` `spinlock_timeout_panic` consulted at `locks.c:417`, `:506`, `:599` and `:621`), is absent from the CRITICAL_ARGS dict of `scripts/check-regression.py`, and no accepted boot console capture has ever printed a spinlock timeout. `-apfs_shared_datavolume` looked just as spare and is not spendable: it is pinned in that same dict, in `scripts/regression-baseline.json`, and in the official provisioned-Data shape at `core/scripts/check-provisioned-data.py`. The second rule this swap teaches: `scripts/check-regression.py` diffs the shipped line against the recorded baseline list and fails on a vanished argument, so removing one from `board.toml` without moving `scripts/regression-baseline.json` in the same commit turns the gate against whoever reads it next; both files move together here, the baseline now lists 48 arguments, the shipped line 49, the lost set is empty and the only addition is the torch argument. The visible boot self-test is still not affordable (` dby-torch=1` plus ` dby-torch-test=NNNN` costs 31 bytes against 11 free), so what the line arms is the read-only dry run."
,
  "`board.toml` gained a `patch_series` entry this round and nothing else: `device:patches/xnu/series-torch` is appended after `device:patches/xnu/series-audio`, last, with a comment naming the reason (both hunks of the torch patch anchor on lines the audio patch inserts). That is the whole of the ordering rule for this repository - `scripts/unixnu/patches.py` prepare() resolves the list and applies it literally, and re-clones the XNU work tree when the series signature changes, so a reordered or renamed entry is a tree that builds differently rather than a comment that can be wrong quietly. `kernel_args` is untouched at 49 arguments and 989 joined bytes, so the torch native arguments are still not on the line and nothing accepted moved.",]
completion = ["Status resolves without error, every referenced file exists in the repository, and no personal path is required to build."]
limits = ["The kernel step this board builds with lives in the repository, so its diff against core is maintained by hand.", "./unixnu status calls any local.toml module override unpinned, so the reproducibility verdict only holds for the published shape: a machine that adds a local.toml prints not reproducible for this same commit."]
next_action = ["Re-run status after any profile, source pin or defconfig change and record the effective module list."]


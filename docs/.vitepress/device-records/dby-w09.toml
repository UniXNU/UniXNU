[[area]]
id = "input"
status = "device-verified"
components = ["ShengHidInput", "ShengNovatekTouch", "QcomGeniSpi"]
paths = ["package/DbyTouch/**", "package/GeniSpi*", "package/HidInputProbe.cpp", "package/IliTddi*", "package/Nvt*", "package/TouchBoard.h", "package/TouchProbe.cpp", "scripts/build-dby-touch.py", "scripts/gen-touch-firmware.py"]
inputs = ["Capacitive touch panel (Novatek N9Z family over TDDI) and three physical keys (power, volume up, volume down), polled on the SE14 GENI SPI bus.", "The keys are already usable in firmware; the DbyTouch stack reports them in XNU as an HID consumer as well.", "Touch firmware image for this panel, carried verbatim in package/DbyTouch/DbyTouchFw.h."]
configuration = ["[components] selects ShengHidInput, ShengNovatekTouch and QcomGeniSpi from the catalog; the board producer DbyTouch reaches the kernel through [kernel] archives and scripts/build-dby-touch.py.", "[kernel.prelink] roots already include com.apple.iokit.IOHIDFamily and com.apple.iokit.IOHIDEventDriver, so the OS side of HID is inside the prelink closure.", "[payload] kernel_args carry the stage ladder: dby-touch=8 dby-touch-se=1 sheng-touch-hid=1 sheng-buttons=1, with offline-hid-input=1 offline-hid-home=1 offline-key-events=1 on the consumer side."]
procedure = ["Read https://unixnu.com/porting/input completely before writing board code: transport and sensor, publishing reports through the qualified IOHIDDevice ABI, then physical buttons.", "Keep the vendor-verified driver sources byte-identical to the accepted implementation, then change one variable per flash and read the stage ladder."]
findings = [
  "`DbyTouch` is the accepted producer for this panel (Novatek N9Z, 1600x2560, mode 0): on hardware it reports points on the lock screen against payload `09c3aad6…`, so the earlier no-XNU-HID-device limit is closed. The Home and volume keys go through the board `KeypadDeviceLib` in the firmware tree.", "The stage ladder gates the chip side only: once the SE answers (dby-touch-se=1) stage2 chains to stage5, which reads frames and publishes contacts, so dby-touch=2 already reaches the UI. Reading the number as a feature switch misattributes every later failure.", "Publishing reports means subclassing the original IOHIDDevice with its exact 207-slot vtable and 0xd0 instance size; an approximate header changes the instance layout and the failure appears far from its cause.", "The N9Z command mailbox and the 0x30000 firmware array are board data, not SoC data: taking the SM8550 board's controller sources as-is for this panel is the trap on this line.",
  "The publish cadence question is closed by reverting, not by re-tuning. The rung ladder {8208, 2048, 1024, 512, 128} and every number measured on it (read=11178 us on the 128 rung, loop=25994 us, about 67 us per piece) describe a read path that exists only in our tree: the accepted driver has no ladder, it reads at a fixed DBY_TOUCH_FRAME_CHUNK piece with a memset per piece. On 2026-11-06 the self-invented read path went back with `git checkout e61237a -- package/DbyTouch/DbyTouch.cpp package/DbyTouch/DbyTouchBoard.h`, which removed +470/-24 lines and the nine symbols stage5ReadAdaptive, gTouchChunks, gTouchChunkStep, gTouchChunkFail, gTouchTxPad, gTouchFaultTry, dbyTouchCompensateBase, gTouchBaseLift and gTouchIdleRun; kernel 916f71cd and payload e4a24792 were then rebuilt from the restored source. So the cadence figures above are measurements of reverted code and are not a criterion for anything. What stands: this unit is a three-firmware integration assembled by its owner, the stage-8 upload really does run (dby-touch=8 dby-touch-se=1 sheng-touch-hid=1, byte-for-byte the reference kernel-args.txt values), and the accepted read shape is part of that contract, not a detail to optimise.",
  "Withdrawn inference. The 2026-11-06 sentence that eliminated GENI_ERR_TIMEOUT (-110) because a silent engine would cost about 20 ms at poll_limit 20000 was arithmetic on an unmeasured constant: it assumed one empty-poll iteration costs 1 us, and that iteration cost was never measured on this bus, so both the 20 ms figure and the -110 exclusion it produced are void. The refusals it set out to explain (the cf=1/1/1/0 row) came from the ladder described in the entry above, and the fault latch it defended -- snap_irq, snap_status, snap_txfs, snap_rxfs copied on every failed piece plus a 4-byte CS-release transfer inserted inside stage5ReadChunked -- was itself our addition. Putting an instrument inside the data path it measures is how this panel went from working to dead, and no raw errno was ever recorded for that boot.",
  "A diagnostic column that never moves is a bug, not a baseline: gTouchUsLoopMin was re-armed to 0 at every publish window while the sample test also accepts gTouchRateN == 0, so every row after the first printed loop=26088/0/26305 -- a minimum of 0 us, which reads as a free loop. It re-arms at 0xFFFFFFFF now.",
  "The deferred question -- touch stops working after a while -- did not reproduce at this cadence: the 2026-11-06 capture is 745 lines over a 420 s window and the loop was still publishing when it closed (n=15936, i.e. 15936 x 26 ms = 414 s of it, rf=0 read failures, IRQ timeouts 0, no panic row). Whatever killed the earlier streams sat on the 76 ms path, so the silent read-fail backoff stays a hypothesis about the old cadence rather than a measured cause of this one. A second, free measurement on that same boot, taken at 10:35 while the console ring replayed: 89,800 publish cycles in the captured stream (n=28928 up to n=118750, about 39 minutes at the 26 ms cadence, i.e. roughly 51 minutes of uptime) and every row still reports chunk=128, cf=1/1/1/0, wait=1 us, IRQ timeouts 0, rf=0, with no [touch] link clear row and no panic anywhere in 199807 bytes. So on this cadence the loop does not degrade with age. What the same replay cannot decide: all 360 [touch] p= rows in it read h=0 an=0 live=0 cc=0, i.e. no contact was confirmed during that period -- and whether a finger was on the panel is not recoverable from the console, so it stands as an open observation on this line rather than a measured defect. Both captures in this entry were taken on the reverted ladder build, not on the accepted read path, so they describe our own code and not the panel."]
completion = ["A touch or key event reaches SpringBoard and the lock screen can be dismissed on hardware."]
limits = ["This area records the accepted DbyTouch stack and the catalog consumer; the hand-built producer that preceded it is retired, so its counters no longer describe the shipped path."]
next_action = ["Use working input as the instrument for the next frontier instead of panel photographs, and re-open this area only if a touch regression appears."]


[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu", "ArmDTPlatform"]
paths = ["package/CpuFreq*", "scripts/*armcpu*"]

inputs = ["Eight ARM64 cores (SM8250 Kryo 585): four Cortex-A55 (cpu0-3) and four Cortex-A77 (cpu4-7), MPIDR core number in Affinity1 so the phys ids are 0x000 through 0x700.", "GICv3 interrupt controller, PSCI through SMC; secondary start is PSCI CPU_ON, taken from the ArmCpu component.", "Three EPSS frequency domains at 0x18591000/0x18592000/0x18593000 with 4/3/1 cores each, the qcom-cpufreq-hw epss register interface (reg_enable 0x0, reg_domain_state 0x20, reg_dcvs_ctrl 0xb0, reg_freq_lut 0x100 with 4-byte rows, reg_perf_state 0x320). This SoC declares no EPSS L3, so the L3 window the SM8550 reference probes maps is absent here.", "native-smp-secondary.patch and native-smp-type-clusters.patch, now from the SoC feed at a6e7e36 (the pin the official SM8250 board uses), and package/CpuFreqProbe.cpp taken unchanged from that same board.", "ArmCpu pinned in feeds.toml to xVanTuring/ArmCpu@a9c4585, the same pin the official SM8250 board uses, for the cluster-aware registration and the completion call described in findings.", "AppleARMPlatform and ApplePMGR kept in the prelink roots of board.toml [kernel.prelink]."]
configuration = ["dts/dby_w09.dts declares unixnu,cluster-type = \"E\" on cpu0-3 and \"P\" on cpu4-7, in the same file that enables the eight cores.", "[payload] kernel_args enables sheng-smp=1, armcpu-diagnostics=1, armcpu-spi-ipi=1 and armcpu-self-ipi=1, and sheng-cpufreq=3 (vote every domain that reads enabled its highest non-turbo level).", "scripts/build-gop-legacy-display.py compiles CpuFreqProbe.cpp from the same IOPlatformExpert record as the display and key-store probes and puts CpuFreqProbe.o in the force-loaded late archive, which is what makes sheng_cpufreq_probe/sheng_cpufreq_poll resolve instead of hitting the weak no-op in LinkStubs.c.", "early_security_init points at the unmodified AppleMobileFileIntegrity __TEXT_EXEC address of the donor kernelcache.", "ArmCpu is the shared secondary-core and IPI driver, pinned in feeds.toml to xVanTuring/ArmCpu@a9c4585 rather than the directory's UniXNU/ArmCpu@9066b53; ArmDTPlatform publishes the platform description it reads from the handoff device tree. The 19 armcpu_* symbols this board's package/kits/scripts read were checked against the fork before the pin moved, so the panel rows are unchanged.", "board.toml [kernel] patch_series still lists device: before os:, but only for sheng-platform-power now: the two SMP patches moved to their official layer when the sm8250 feed pin moved from 6bb9b02 to a6e7e36."]
procedure = ["Build the kernel and payload, boot the device and read the boot-progress checkpoints for the CPU stage.", "Run scripts/check-smp-topology.py from the device repository before flashing: it exits non-zero for a tree that declares cluster-type tags without the cluster patch, and that combination kills the kernel before the console comes up.", "Read panel row 39 (BootProgress.c:342, drawn once native_cpufreq_stage reaches 2): CPUFREQ d0/d1/d2 each with the enable bit, the current level in MHz, the voted LUT index and the level seen before the vote.", "Where the panel is ambiguous, reproduce the same image in the offline QEMU harness and read the diagnostic counters as text."]
findings = ["Secondary cores come up only when the IPI path matches what the ADT declares; armcpu-spi-ipi=1 was needed after an early bring-up that reached user space on one core.", "An SGI does not reach these cores: ArmCpu.cpp:34 records that IPIs are software-pended SPIs, and XNU only enables a core's IPI after that core has itself sent one, so each core has to signal itself in initCPU. The reader is at ArmCpu.cpp:365 and was already linked; the board simply never passed armcpu-self-ipi=1, which the official same-SoC board's cpu record lists as one of four required arguments.", "sheng-cpufreq was in this board's kernel_args long before anything read it: the call site LegacyDisplayProbe.cpp:495 resolved to the weak no-op in LinkStubs.c:96, so no boot of this port has ever issued a frequency vote and the domains sat on whatever the reset left. The argument's bytes were paid for; the vote was not.", "unixnu,cluster-type must never ship without native-smp-type-clusters.patch. With MAX_CPU_CLUSTERS still 1 the topology parser takes phys_cluster_id = (cluster_type == P), which is 1, and writes cluster_phys_to_logical[1] past a one-element stack array; release builds do not assert, the kernel just dies before the console. The official SoC patch is also what raises MAX_CPU_CLUSTERS to 2 and defines __ARM_AMP__, so this board needs no separate AMP patch.", "The same patch gives the Edge scheduler per-bucket cluster preferences for the case with no performance controller: fixed-priority and above-utility timeshare buckets prefer the first P cluster, utility and background the E cluster. That is the official mechanism for keeping UI work on the big cores; nothing here is a board-local scheduler.", "The directory's ArmCpu cannot use that mechanism: at 9066b53 both registration paths (ArmCpu.cpp:402 for the boot core, :452 for a secondary) set info.cluster_type = ml_get_boot_cluster_type(), so all eight cores are declared as the boot cluster and the DTS cluster-type tags never reach the processor record. It also never calls ml_cpu_init_completed(); the only call site in this XNU tree is AppleARMSMP.cpp:236, and this board brings secondaries up through ArmCpu, so the Edge scheduler is told nothing about inter-cluster edges -- without them no thread migrates or is stolen across clusters. That is why MAX_CPU_CLUSTERS 2 plus cluster tags alone could not have fixed the lag, and why the pin is the official part of this round: xVanTuring/ArmCpu@a9c4585 reads topology->cpus[cpu].cluster_type per core and calls ml_cpu_init_completed() once every core of the topology has registered, and derives the SPI IPI INTID base from GICD_TYPER instead of the fixed 1008, which is sheng's number.", "armcpu-self-ipi=1 is read in both copies (ArmCpu.cpp:365 sets gSelfIpi, used at :536 and :550 in the pinned copy), so the argument was never dead code here -- it was simply never passed."]
completion = ["All cores run, the timer and IPI path is stable, user space is scheduled across them, and the E/P split reaches the scheduler with each EPSS domain voted to its highest non-turbo level."]
limits = ["CPU idle states are still not ported: no domain is asked to park a core, and the idle path stays whatever the reset default is.", "The cluster vote and the per-domain frequency readings are wiring plus the official checker in this round; the on-device numbers arrive with the first boot that draws row 39."]
next_action = ["Read row 39 and the per-process CPU rows from the UFS log window once package/linux-log exists -- the banner is off by the owner's choice, so the panel no longer shows them. The P cluster (c4-c7) should carry the UI workload, which is the alioth record's own success criterion; until rows exist the evidence is his own report that the system is much smoother.", "Then idle states, which nothing on this board has touched yet."]


[[area]]
id = "firmware"
status = "device-verified"
components = []
paths = ["proprietary-files.txt", "scripts/extract-files.py", "scripts/gen-touch-firmware.py"]

inputs = ["UniXNU UEFI (Silicium mu-derived) tree exposing Platforms/Huawei/dby_w09Pkg/dby_w09.dsc and Resources/Configs/dby_w09.toml.", "EDK II base packages and the DarwinBoot driver package, resolved from the build tree.", "Stock Huawei boot image: the panel, the three physical keys and USB device mode are already usable at the firmware level."]
configuration = ["board.toml [firmware] records config = dby_w09, the DSC path, Build/dby_w09Pkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd, preflight scripts/check-dby_w09.py and the PACKAGES_PATH list.", "[firmware.defines] sets DEVICE_MODEL = dby_w09, ENABLE_SECUREBOOT = 1, MEMORY_PROTECTION = TRUE and SHIP_MODE = FALSE."]
procedure = ["Build the firmware in its own tree, then pass the checkout to the payload build with --uefi.", "Boot the tablet into fastboot from that firmware and flash the payload; read the screen state after each attempt."]
findings = [
  "`unixnu build firmware` is now the only firmware entry point used here: `WQSQW/uefi-dby_w09@423e222` built `Build/dby_w09Pkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd` (8,388,608 bytes) with 0 `error:` lines, 1 upstream warning from `SiliciumPkg.dsc.inc(211)`, and preflight `50 memory descriptors checked, 0 static errors`. The same tree rebuilt an FD that matches the flashed one on 106 of 107 FFS entries, the outlier being the 8-byte CodeView PDB GUID in `PcdDx_.ffs`.", "./unixnu build firmware does work against this checkout, contrary to what this area recorded until 2026-11-05: run it from the core checkout with --uefi <uefi tree> --edk2 <core mu_basecore feed> -D <device repository> --jobs 4 and it produces Build/dby_w09Pkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd in 103-119 s. edk2 must be the core feed because the Mu_Basecore checkout has no brotli, and python3 must be 3.11 or newer for tomllib.", "Whether a blob reaches the firmware volume is decided by the PE32| line of the module INF, not by which file the packaging script copies: a patched UsbConfigDxe.patched.efi next to the vendor binary is invisible in the FV until the INF names it, so read the FFS list before believing a note about what was shipped.", "A DEBUG firmware volume is not byte-reproducible: __DATE__ and __TIME__ change on every rebuild, so the boot packaging gate compares the FD timestamp against the sources it must include and records the hash instead of pinning it.", "The firmware handoff is what makes XNU visible: the GOP framebuffer and the entry-argument HOB are consumed by the legacy display backend, so a display failure is usually a firmware-side reservation problem, not a driver problem.", "The device enters fastboot from the UEFI port, which is the only supported way to write the payload partition.", "The panel's Error: Image at <base> start failed: Not Found does identify the image: EDK2 prints the load base both in the Loading driver line (Mu_Basecore/MdeModulePkg/Core/Dxe/Image/Image.c:869) and in the start-failure line (Image.c:1902), so the address printed next to USB boot desired was MsBootPolicy.efi itself, and the status is what its entry point returned. It only ever runs because this platform registered no boot option for UniXNU: the official recipe in UniXNUPkg/Driver/UniXNUDxe/UniXNUDxe.inf is to put that registrar driver in the same firmware volume as the application, so on dispatch it writes a Boot#### for the app and moves it to the front of BootOrder and the platform BDS starts UniXNU like any other boot option - but dby_w09.dsc and dby_w09.fdf shipped only UniXNU.inf. BDS therefore fell through to Silicium's Internal Storage option, which names the MsBootPolicy FV file (Silicon/Silicium/SiliciumPkg/Library/MsBootOptionsLib/MsBootOptionsLib.c:246), and that application finds no BOOTAA64.EFI on any SimpleFileSystem (Common/Mu/PcBdsPkg/MsBootPolicy/MsBootPolicy.c:345, No handles survived filtering!) and returns EFI_NOT_FOUND at :346. Wiring UniXNUDxe into the same FV is the fix; USB boot desired, but no USB devices found on first attempt is that same MsBootPolicy USB step and was never a USB regression."]
completion = ["The firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["The firmware lives in its own repository and is not yet published, so a machine that clones only this repository cannot rebuild the FD that the recorded boot image was made from."]
next_action = ["Publish the firmware repository at the commit whose UsbConfigDxe.inf names the vendor binary, so the boot image in README is reproducible from two pinned repositories instead of one plus a workbench."]


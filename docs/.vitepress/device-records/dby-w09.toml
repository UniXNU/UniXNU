[[area]]
id = "power"
status = "device-verified"
components = []
paths = ["package/ShengPlatformPower.cpp", "scripts/build-platform-power.py",
         "package/DbyBattery*", "package/BatteryProbe*", "package/DbyTorch/**", "scripts/build-dby-torch.py", "scripts/check-dby-torch-host.py",
         "scripts/test-dby-torch-media-mount-patch.py", "patches/xnu/series-torch",
         "patches/xnu/zze-dby-torch-media-mount.patch", "package/DbyCamera/**", "package/DbyTorch/ios/**",
         "scripts/build-dby-camera-plugin.py", "scripts/add-dby-camera-data.py", "scripts/add-dby-camera-trust.py"]

inputs = ["ApplePMGR from the donor kernelcache (original __TEXT_EXEC hash 2c433279d004…).", "SM8250 PMGR/regulator contract as reached by the shared board scripts.", "The payload's native-ufs-root gate, which demands exactly one sheng-pmgr=2 and a linked _sheng_pmgr_run."]
configuration = ["[kernel] archives runs scripts/build-platform-power.py after the driver recipes so the audit reads the original kernelcache from the pinned cache.", "[payload] kernel_args set sheng-pmgr=2."]
procedure = ["Build the kernel and let the payload build assert the PMGR gate; then boot and read whether AMFI's PMGR dependency holds on hardware.", "Record the contract audit output (extent hashes) with the build, because a mismatch is upstream refusing the input rather than a local error to bypass."]
findings = [
  "ord216 settled both of the torch rules that ord214 had wrong, on hardware. [V] leds-qpnp-flash-v2.c reads STATUS1 and STATUS2 only from its led-fault-irq handler (1992-2013), and every recorded board DT places that interrupt at INT_RT_STS bit 0, so a STATUS1 seen while the line is clear is a ramp-up artefact and not a fault: DbyTorchCore.c fault_of() answers nothing unless DBT_V_LED_FAULT is set, lamp_fault() puts the LED away with the accepted switch_disable ladder and leaves the write gate open, and the gate that closes until reboot is reserved for what actually loses the bus (a refusal, a failed read-back, an spmi error). The board row from the same day, in backticks: FAULT vph-droop rc=-5 off=0 s1=00 s2=10 rt=01 reg=0x43 status=0x1 refused=0: off, and the next request lights it again, and the request after it lit. ord214-s own reading is a host fixture now: STATUS1 0x01 with INT_RT_STS 0x90 returns DBT_OK with faults == 0, Test/core.c.",
  "The PMGR bridge is still the accepted sheng implementation: the second `build kernel` pass links the real `_sheng_pmgr_run` and `./unixnu build payload` for `09c3aad6…` accepted it on this board, which is the gate that rejects a kernel without that symbol.", "The AMFI/PMGR pairing is a hard gate with a clear failure: without ApplePMGR in the roots the contract audit cannot take its extent and the platform-power archive is never produced, so the payload refuses the image.", "Regulator votes themselves are not yet modelled for kona; the verified part is the contract and the payload gate, which is why this area is host-verified rather than device-verified.",
  "The battery producer is package/DbyBattery.cpp plus package/BatteryProbe.cpp: the official alioth producer ABI (an IOPMPowerSource provider over the 16-slot native_battery_stats) with the transport replaced, because this board has no ADSP stack in this tree while its stock DTBO describes the gauge as qcom,fg-gen4 and the charger as qcom,qpnp-smb5 on SPMI -- so it reads the arbiter-s observer engine at 0x0e600000 directly, the same channel DbyTouch runs on. It is read-only by construction: the chnls window is never mapped, no PMIC configuration register is written, no charger or bark/bite path is touched, and a value that cannot be read stays -1 / unknown rather than 0. What was wrong in the round before this one is the reporting, not the transport: all thirteen rows used IOLog, which this console does not mirror, and BatteryProbe returned silently from both of its early gates, so a boot that never parsed dby-battery, a boot whose module registration failed (-10/-11) and a boot whose PMIC never answered were three names for the same empty screen. Every branch now prints through kprintf and stage is latched into native_battery_stats[0] with the upstream sign convention. A row from this driver is on the console now: the 2026-11-06 capture carries the arbiter census, one published dictionary and 84 cycle rows, which is what turned the two complaints about the battery line into measured defects rather than guesses.",
  "Both complaints are inside that one capture and both are this file, not the PMIC. The percentage that differs from boot to boot is the transport latch: rows #1-#61 answered op=1 tx=14 clean=14 to=0 err=0, cycle #62 issued one transaction and took one error bit, and the operation-form ladder then latched for the whole boot - rows #63 through #84 carry tx=0 clean=0 to=0 with every field reason 2, so for 22 more cycles no transaction was even attempted. After that the dictionary the UI shows is frozen at whatever the last good cycle published, and where a boot freezes is wherever its own first error lands: that is the 「每次开机都不一样」. The latch is gone - a silent engine now ends only that cycle, prints which cycle it ended, and the next cycle re-walks the ladder.",
  "The charging icon that dies on a brightness slide was a charging test this tablet's own kernel does not make. The branch that is compiled here is Huawei's smblib_get_prop_batt_status() (smb5-lib.c:2111-2162; it is Huawei's because merge_kona_defconfig:5912 sets CONFIG_HUAWEI_POWER_EMBEDDED_ISOLATION=y): a disjunction of the direct-charge stage window, the wireless adapter type and (usb_present && !usb_icl_change_irq_enabled && !input_suspend), each then rewritten to NOT_CHARGING by health COLD, OVERHEAT or OVERVOLTAGE - and the SMB5 3-bit regulation stage is not in it. What the port tested was stage in [Trickle..Taper], and a load step walks that stage through INHIBIT or PAUSE for a sample at a time, so the icon switched off while the cell was still taking current. IsCharging now reads the vendor's own inputs (USBIN_PLUGIN_RT_STS bit 4 for presence; POWER_PATH_STATUS USE_USBIN bit 4 together with VALID_INPUT_POWER_SOURCE_STS bit 0 for usb_online; CHARGING_ENABLE_CMD; STATUS_7 TOO_COLD and TOO_HOT). One wording correction recorded here because the first version of this sentence conflated two registers: the term the status rule subtracts is chg->input_suspend, which is the driver's cache of USBIN_CMD_IL bit 0 - smblib_get_usb_suspend() reads that bit and smblib_set_usb_suspend() is its only writer (smb5-lib.c:418-431, 770-790) - not of POWER_PATH_STATUS bit 6, which is only the echo of the vote and is kept in the row as sus=. The stage keeps the one use the vendor gives it: saying the cell is full.",
  "Two of the rule's terms needed a decision rather than a transcription, and both are recorded in the source. usb_icl_change_irq_enabled is read as false, not dropped: SMB5's smblib_set_usb_suspend() votes icl_irq_disable_votable (smb5-lib.c:767-785) and the only writer of the field is a HIZ_MODE setter (qpnp-smb5.c:2322), so false is the vendor's own steady state and the third term is the live path for a wired charge. OVERVOLTAGE is left out, because smblib_get_prop_batt_health() asserts it only after comparing the gauge VOLTAGE_NOW with the float-voltage votable plus 40 mV (smb5-lib.c:2413-2429); honouring the raw BAT_OV bit alone would claim a state the vendor itself refuses to. COLD and OVERHEAT need nothing but STATUS_7 and both are read. Reporting moved to upstream's shape: one publish per cycle end, a per-field reason byte, and every field that did not answer named in the row, so a missing number and a zero cannot be confused by a reader.",
  "f2-payload-168 answered both battery defects on hardware and then did not reach the lock screen, and the two halves are recorded apart. What the rows proved: the first ten cycles each carried why=00000000000, meaning all eleven fields answered, with tx=16 clean=16 to=0 err=0, soc=59 mv=3887 on the first cycle and soc=58 mv=3846 ma=+422 by the tenth, chg=1 the whole way and full=0 - so the vendor status rule and the measured current agree, which the stage-window rule never managed. What the same flash did not survive: the panel stayed on the Apple logo - and the 163-versus-167 touch comparison built on top of that was invalid from the start, because the argument above was missing from every payload of the day, so the two images could not differ in the way I claimed and no such A/B was ever owed a device boot. What is nevertheless measured and stands: the accepted touch contract is intact, git diff --stat e61237a -- package/DbyTouch/ is empty, so the current 4988-line DbyTouch.cpp is byte-identical to the accepted commit. The friend's kit is the source of the touch *approach* only; this device is maintained in this repo, and its history is the baseline - the 1213-line gap against his 01-src drop is that drop being a partial earlier snapshot, not leftover edits of mine.",
  "The poll bound is the part of this transport that was never the vendor-s shape. spmi-pmic-arb.c decrements PMIC_ARB_TIMEOUT_US once per readl_relaxed() with udelay(1) between the reads, which is one millisecond of polling per transaction; this file spun up to 200000 uncached reads on the same status word, on the default IOKit work loop, because it had copied the count from DbyTouch-s boot path where it is a one-shot. On a silent engine that is hundreds of milliseconds per cycle of a loop every driver shares.",
  "The other half of the charge complaint - the icon that stays after the cable comes out - is a defect on the presence axis, not the charging axis, and the enable bit has nothing to do with it: CHARGING_ENABLE_CMD is a configuration mirror the firmware leaves set, so it can say inhibited but can never say charging. Two things made the icon survive an unplug. First, publish() gated setExternalConnected, setExternalChargeCapable and setIsCharging on those reads having answered, so a cycle whose transactions died republished nothing and the last true value stayed in the registry for the rest of the boot; upstream decodes an absent answer as false (ShengBattmgr.c:152-159) and publishes unconditionally (ShengBattery.cpp:95-99,107), and the three booleans now do the same, with charging ANDed behind presence and the unknown-is-not-zero rule kept for the numbers only. Second, and this is the state userland actually reads: IOPMrootDomain::acAdaptorConnected is initialised true (IOPMrootDomain.cpp:1667) and its only writer is the AC branch of handlePowerNotification() (:8459-8472), which decodes presence as the message carrying kIOPMSetValue (:8460; IOPMPrivate.h:156 and :160 for the two constants) - and that branch is reached only through receivePowerNotification() (:8293-8315), which queues the work onto pmPowerStateQueue (:8311) instead of running it on the caller thread. Nothing on this board had ever called it, and updateStatus() cannot carry the state either: it writes the registry and sends kIOPMMessageBatteryStatusHasChanged (IOPMPowerSource.cpp:177-216, the message at :211), which has no consumer anywhere in the pinned XNU outside its own definition at IOPM.h:865. So the root domain kept believing AC was attached and the status bar repainted only when an unrelated event invalidated it - which is precisely the observed behaviour of the mark disappearing on a brightness slide. On every presence edge now, publish() calls getPMRootDomain()->receivePowerNotification(kIOPMSetACAdaptorConnected | (attached ? kIOPMSetValue : 0)) once, the same push Apple uses for its own services from IOUserServer::powerSourceChanged() (IOUserServer.cpp:5496-5509, via getSystemStateNotificationService(), assigned during setPlatform() at IOService.cpp:1600 and dereferenced unguarded by Apple at IOUserServer.cpp:7017). post_sys_powersource() was checked as an alternative route and rejected: it compiles to a no-op on iOS (vm_shared_region.c:4009-4019).",
  "The lag the user measured on the 173 boot - 「终于正常了，但是反应很迟缓，得等好一会才正确反馈」 - says the presence fix landed and the cadence did not: it is the timer, not the transport. Upstream never ran one timer for this. ShengBattery.cpp:47 keeps kRequestMs = 2000 and kRefreshMs = 60000 with kSlowEvery = 10, and sheng_battmgr_refresh(&bm, ++refreshes % kSlowEvery == 0) picks which field set a cycle reads, publishing only at BmCycleDone. This file carried a single IOTimerEventSource at 60 s, so a plug or unplug edge could wait a whole cycle before the dictionary and the root-domain push moved. 175 splits it the upstream way: a 2 s status timer reads only what chargingOf() and externalOf() consume - Current, Plug (USBIN_PLUGIN_RT_STS), Online/Suspend (POWER_PATH_STATUS), USBIN_CMD_IL, Enable, the STATUS_7 health bits and the regulation stage - and republishes every cycle; the 60 s timer keeps the slow tier, meaning the capacity and voltage reads, the four charger-limit diagnosis bytes and the battery-presence fields, which now carry a distinct reason byte 7 (kWhySlowOnly) so a fast row can never be misread as thirteen timeouts. The three numeric stats slots are written only by a cycle that actually holds the field, which is what stopped native_battery_stats oscillating to -1 between tiers. Why this is a timer and not an interrupt is stated rather than glossed: the vendor does not poll either - qpnp-smb5.c reacts on the SMB5 usbin_change_pend interrupts, and the only poll-shaped numbers in that tree are deglitches (OTG_DEFAULT_DEGLITCH_TIME_MS 50, DEFAULT_FCC_STEP_UPDATE_DELAY_MS 1000, bc12 500/1200 ms), so no 2 s Android interval is being copied here. This service has no PMIC interrupt path at all (native_battery_stats[9] = 0 and the census row's irq-owner field say the same), so the 2 s tier is the honest stand-in until an SPI is attached through armcpu_spi_attach() (.local-armcpu/ArmCpu.cpp:877); the interval itself is upstream's number, not a guessed one.",
  "The charge-icon complaint is now closed at the panel rather than on the console, and the boot that decides it is payload-ord209.img (sha256 592c632b74abcf0d...), not 168, 171, 173 or 174: that image carries the presence-first publish, the vendor status rule and the 2 s/60 s cadence split in the same build whose [apr] rows prove the audio ladder at real time, so the four booleans the status bar reads were exercised together for the first time. The owner-s read of this boot is that the charging mark behaves. What the transport still costs is stated once and not papered over: no PMIC interrupt is attached here (native_battery_stats[9] = 0), so a cable edge is published up to 2 s after it happens, where the vendor would react on usbin_change_pend immediately.",
  "The flashlight producer is `package/DbyTorch/` and it reaches the kernel the way every other board archive does, so its first proof is a symbol table and not a boot: `scripts/build-dby-torch.py` builds `build/dby-torch/libDbyTorch.a` (256216 B), `board.toml` gives it a `[kernel] archives` slot after the driver recipes, `configs/dby_w09_defconfig:130` appends it to `CONFIG_XNU_EXTRA_LD_ARCHIVES`, and `package/BootProgress.c:116` names `dby_torch_start()` as a strong reference so the plain non-force_load path pulls it in. On kernel `05d697b0be1471b8`: `llvm-nm --extern-only` shows `dbt_spmi_read/open/discover/allowed/write/reset_interlock/emergency_stop`, `dbt_config_make/test_ms/current_law/level_ma`, `dbt_core_init/set/poll/export` and the five `dby_torch_*` entry points all defined.",
  "The transport is the one the battery already runs on, and the write side is fenced by a gate rather than by intent. `DbyTorchSpmi.c:107 dbt_spmi_allowed()` is the only path by which a write reaches the PM8150L flash block, `:145` refuses anything the whitelist does not cover, `:163` drops the interlock when the LED mask reads back zero, and `:178 dbt_spmi_emergency_stop()` is the single stop the header permits (`DbyTorchSpmi.h:77`: `EN_LED_CTRL` to 0 for this board-s led-mask with `MOD_CTRL` off), the rule itself stated at `DbyTorchSpmi.h:53` -- a channel may be switched on only once the gate has written every field it owns. `scripts/check-dby-torch-host.py` reports PASS on the strict compile of the two portable sources, 9045 spmi checks against a model of the v5 arbiter and the flash block (discovery, the owned mapping, both ladders, the whitelist over all 256 bytes, read-modify-write, failures, the one stop), 1580100 core checks (the boot arguments- configuration, the current law with the PM8150L erratum, dry run, refusals before any write, the vendor on and off sequences, every level of 300 mA, the 5 minute limit, the thermal derate, every fault bit) and PASS args over the four boot arguments -- then prints its own limit: no --tree, so it built no kernel archive. Host checks do not establish that the LED lights."
,
  "The flashlight of iOS is `package/DbyTorch/DbyTorchIos.{h,c,cpp}` and it is a publication and not a script hook: when `dby-ti=1` and `dby-torch=1` are both parsed on the same line the kernel registers the `AppleH6CamIn` service, its mediaserverd-only user client and the `flash` property of `IODeviceTree:/product/camera` - the property `MGGetBoolAnswer(\"camera-flash\")` answers, which is the only thing that makes a Control Center toggle exist at all. It refuses when either argument is missing, when `dby-torch` is not 1, or when the mount below does not show the plug-in, because a button that does nothing is the failure the mother-s own gate is written against. `scripts/check-dby-torch-host.py --tree` compiles and links it on 2026-11-09: 5 objects, 25 entry points, 239 kernel imports each defined by that tree-s own linked kernel, the class initializer staged out of `__mod_init_func` with `llvm-objcopy --remove-section` plus `--globalize-symbol=...__GLOBAL__sub_I_DbyTorchIos.cpp`, `_kprintf` present, `_IOLog` absent, `LC_BUILD_VERSION` iOS 17. The tree-s *last linked* kernel does not carry it: `build/xnu/ios-obj/mach.development.bcm2837` defines 23 `_dby_torch|_dbt_` rows - 20 extern entry points - and no glue symbol at all, because that kernel was linked before `DbyTorchIos.*` existed. Both numbers are measured; the 24 this record carried was one of my own inflations.",
  "The mount that verdict reads is a fifth `native_gpu_addon_mount()` in `native_gpu_addon_prepare()`, added by `patches/xnu/zze-dby-torch-media-mount.patch` with `patches/xnu/series-torch`: source `/private/var/ngpu/mediacapture` (the directory the Data seed delivers, the same carrier as the audio HAL), point `/System/Library/MediaCapture`, `visible` that point itself and `own` `/System/Library/MediaCapture/H6ISP.mediacapture`. The sealed root has no entry at that point, so there is nothing there to prove the lower layer with and the directory stands for it - verbatim the mother-s shape at `refer/Pagani/patches/xnu/phone-torch-overlay.patch`, kept as one argument (`dby_torch_ios_commit(int plugin_visible)`) rather than widened into something the mother does not have, with this tree-s counter numbering and this board-s argument names. The window is `0xe00`, which is arithmetic and not a guess: `kern_exec.c:8193` allocates the scratch as one `map_page_size` (16 KiB), a mount consumes its window plus `0x130`, the four existing mounts take `0x400`, `0x600`, `0x800` and `0xa00`, and `0xc00` belongs to the `mkdir` and `unlink` paths that run after the mounts.",
  "`series-torch` is the last entry of `board.toml`-s `patch_series` because both hunks of the patch are anchored on lines that `zzyd-sheng-audio-addon-mount.patch` inserts, so the order is a hard requirement - and it is measured rather than asserted. Replaying the recorded `xnu-inputs.json` series with the audio patch removed makes this patch fail (`rc=1`, `error: bsd/kern/kern_exec.c: 补丁未应用`); the full 66-patch series plus this one applies onto a fresh shared clone of `d8b80295118ef25ac3a784134bcf95cd8e88109f`, leaving five distinct `native_gpu_addon_mount` offsets with `0xe00` last and a clean `git apply --reverse --check`. `scripts/unixnu/patches.py` prepare() applies the resolved list literally, so an edited patch series is only reviewable by replaying it.",
  "The two new counters reach the console the way this repository already does it, and that is a correction as much as an addition. There is no `boot_progress_trace` in this tree or in this repository - the mother has one, and inventing a Linux-side stand-in for it is not a port - so the ladder goes out on `package/BootLog.c`-s `A` row, which `boot_log_tick(now)` re-renders after the mounts run: the five `native_gpu_addon*` pairs are `weak_import` externs, weak definitions live in `package/BootProgressStubs.c` so the archive links before the kernel carries them, and the row gained `mount4=stage/status mount5=stage/status` with `char row[120]` widened to `char row[200]`. Reading `mount5`: `1` with a status is no `/private/var/ngpu/mediacapture` (a delivery problem, not a mount problem), `2` or `3` a refused bindfs mount, `4` a lookup the sealed root does not answer, `5` the overlay took and the commit will publish. Doing this found a record-versus-build mismatch in the same row: this file stated the `A` row printed `mount4=`, and it never did - the audio HAL stage was defined and never rendered.",
  "`scripts/test-dby-torch-media-mount-patch.py --inputs <out>/<device>/<os-build>/<board>/xnu-inputs.json` is the gate for all three of the above: 7 tests, `Ran 7 tests in 14.511s OK`, covering the patch shape (only `bsd/kern/kern_exec.c`, exactly two hunks), the two argument names against what `DbyTorch.cpp` parses and what the README table documents, the class and bundle names against the glue and the record, the `weak_import` declaration against the definition and the prototype, the counters against BootLog and the stubs, the series file against `board.toml`-s last entry and against every other series file, and the replay. It is now a step of `scripts/check-dby-torch-host.py --tree` (`PASS mount patch: 7 tests against .../dby_w09/xnu-inputs.json`), because a README that says one command is the whole host check has to mean it after each new part; that command is RC=0 end to end and `scripts/check-regression.py` prints `checks=93 pass=93 fail=0 kernel_args_bytes=989` with these edits in.",
  "What this round cannot prove from the host is named instead of deferred. The `CMCapture` class-to-bundle table for 21H461 is not readable on this machine (there is no shared cache here), so this record said the plug-in would be delivered under every candidate `<H..>ISP.mediacapture` name with a per-name counter saying which one the vendor opened. That spray is dropped and the correction is the mother-s, not mine: `package/DbyTorch/DbyTorchIos.h:63` names one service (`AppleH6CamIn`) and the bundle is one file (`H6ISP.mediacapture`) because H6 is the last entry of CMCapture-s table and the only one of the five that the pinned kernelcache does not carry (it has H9, H10 and H13) - `refer/PaganiDrivers/drivers/PaganiTorch/TorchIos.h` states the same reason for the same iOS. Nothing here ever implemented the spray: one name is in the patch, the header, the builder and the staging script. And the command line: ` dby-torch=1 dby-ti=1` costs 16 joined bytes against the 11 free at 989, so the same full enumeration of every reader in every tree that paid for ` dby-torch=2` was run again over all 49 entries - and this time it found nothing to spend: each `offline-legacy-*` row gates a branch of NativeLegacyDisplay.cpp (gop at :383, pm and phase at :98-102, register at :128, validate at :313, transfer at :149), `kt_fixed_zones=120` overrides XNU's own 260 (zalloc_internal.h:485; the 120 branch is watchOS-or-KASAN only), `dk=0` overrides IOKit's default-on DriverKit debug (IOKitDebug.h:134, IOUserServer.cpp:88), `panic_on_crash_disabled=1` keeps a crashed daemon off the panic path (kern_exit.c:1695) and `-enable_kprintf_spam` is the only route by which kprintf reaches the console at all (pe_kprintf.c:50). The 2026-11-06 loss of `sheng-data-reset=1` is why enumeration and not preference decides, and here the answer was the naming rule already written at the top of kernel_args instead: the switch is `dby-ti=1` at 8 bytes, the armed line measures 50 entries and 998 bytes with 2 free in core's own payload.check_args, and no argument was removed.",
  "The iOS halves of this round are ports, file for file, of what the mother board ships for the same iOS build. `package/DbyTorch/ios/DbyTorchPlugin.{h,m}` is `refer/PaganiDrivers/drivers/PaganiTorch/ios/TorchPlugin.{h,m}`, `package/DbyCamera/ios/DbyCameraProvider.m` and `DbyCameraPattern.{c,h}` are the three `PaganiCamera/ios/` files of the same name, and `scripts/build-dby-camera-plugin.py`, `scripts/add-dby-camera-data.py` and `scripts/add-dby-camera-trust.py` are `build-pagani-camera-plugin.py` and the two halves (plug-in staging, trust merge) of `add-pagani-camera-data.py`, which the mother runs through one script and this repository keeps as one step per file. Only names moved: `dbt_plugin_load`, `dbc_plugin_load`, `DbyCameraTestPattern`, `org.unixnu.dby_w09.camera`, `/private/var/ngpu/mediacapture`. Every gate of the mother builder is kept and each is a refusal rather than a warning: `-target arm64-apple-ios17.0`, the FLAGS list `-O2 -g0 -Wall -Wextra -Werror -fno-objc-arc -fvisibility=hidden -dynamiclib -Wl,-no_warn_inits`, `-install_name /System/Library/MediaCapture/H6ISP.mediacapture`, `nm -gU` refusing any `CaptureDeviceCreate` export (exporting one makes the vendor believe there is a default device, which is the failure `DbyTorchIos.h` is written against), `nm -u` refusing an undefined `_OBJC_CLASS_$_CMIO...`, `otool -l` demanding the install name and `minos 17.0`, a `__mod_init_func` section or named constructor, `otool -L` refusing any library outside the system, then `codesign --force --sign - --pagesize 4096 --identifier org.unixnu.dby_w09.camera` and a `trust.json` whose CDHash is read out of that signature. The three name pairs the torch plug-in and the kernel must agree on (`DBT_PLUGIN_SERVICE`/`DBT_IOS_SERVICE`, `_PROCESS`, `_SELECTOR`) are compared define by define before anything is compiled, so the plug-in cannot drift away from the service the kernel publishes.",
  "Why the two plug-ins are one file, and why a torch-only seed is not a smaller version of the answer but a different, non-working one: `-[BWFigCaptureDeviceVendor initWithDefaultDeviceCreateFunction:cmioExtensionDeviceCreateFunction:cmioDiscoverySession:]` (0x1a693fcf4, the bail at 0x1a693fde0, read in 21H461 by the mother) returns nil when the default create function is empty and `kern.hv_vmm_present` is 0 - on a phone it is 0, because that is a device-tree property the QEMU recipes name and this board does not set - so `+sharedCaptureDeviceVendor` is nil for the whole boot, every message sent to it lands nowhere, and the six vendor methods `DbyTorchPlugin.m` replaces are never called. A torch-only delivery therefore gives a kernel that publishes `AppleH6CamIn`, a `flash` property on `/product/camera`, a Control Center toggle - and no path from that toggle to the LED. `DbyCameraProvider.m` corrects that init from the same Mach-O, with its own constructor independent of the torch one: it passes a permanently failing placeholder through the nil check and writes `_defaultDeviceCreateFunction` back to empty afterwards, so the vendor ends up exactly as it is today except that it exists. The test pattern is armed by the staged marker `ngpu/mediacapture/DbyCameraTestPattern` - `/System/Library/MediaCapture/DbyCameraTestPattern` once the union mount runs - and not by a boot argument, for the mother-s stated reason: it costs no command-line bytes and only means something on a seed that carries the bundle. The QR payload is the mother-s string verbatim (`DBC_QR_TEXT` = `https://unixnu.com/pagani-cam-test`, `DbyCameraPattern.h:29`) and the modes are 1920x1080 and 1280x720 with 720p active, because a rewrite of a test fixture proves nothing.",]
completion = ["The audit, the archive and the payload gate pass, and the device boots with the PMGR provider registered."]
limits = ["No frequency, idle or charger policy is implemented. Battery reporting is ported read-only (package/DbyBattery.cpp over the SPMI observer engine) and its rows are device-measured, and the official-semantics rewrite has been flashed once (f2-payload-168, which answered both defects on the console but did not leave the Apple logo); f2-payload-171 (cb28519bbbe250376918d8f01e549d15bb76c885c9b6076f137b8919903ea5a4, to preload at 18:34:04) is the first image that carries the official 60 s cadence, the vendor 1000-poll bound and the restored data argument together, so the battery verdict - percentage stable across boots, charge icon surviving a brightness slide - is judged at the panel on this boot and on no earlier one. One recorded correction while doing it: the kernel command line is gated at 1000 bytes by unixnu build payload (board.toml's older comment cited DarwinBoot.c:542 and said 1024); the HEAD argument table is 45 arguments / 966 bytes, and 171 ships those 45 plus the three board feature gates under repair (dby-bl, dby-pa, dby-battery) at 998 bytes, with only my own newest diagnostic argument armcpu-self-ipi=1 deferred to stay inside the gate. There is no capacity teaching and no charger or float-voltage configuration read; battery health reaches this file as two STATUS_7 bits feeding the status rule, not as a published health property. f2-payload-173 (payload_sha256 673ad03e4a91c5e844c6a484e2207d09336502eafda305ac95130da286d46eb4, kernel_sha256 5ffc0dc39925c27eacd7d37eb12253fcf9ea8e36941b7e041359166baf5d6365) is the first image in which the presence fix is actually linked: the payload-only step does not recompile the display-late archive, so payload 172 shipped the 17:24 DbyBattery.o - an object older than the edit and with no reference to getPMRootDomain - and was never flashed. 173 was built by the official kernel-then-payload entry, its object carries that reference, and it went to preload after the 18:59 payload, so the charge-icon verdict is judged on this boot and not on 171 or 172.",
  "Two cadences ship now and their limits differ: 174 put the five official reasons a cell would not take current (the input-suspend vote, the requested ICL, the ceiling, the applied ICL and the float voltage) into the 60 s row, and 175 put the reaction on the 2 s tier. Neither image writes a charger register, so a blocker that the rows name can still only be answered by the official host-side control path over a transport whose write side is not proven - the chnls window stays unmapped and the five prohibitions (no PMIC configuration write, no charger configuration, no bark/bite, no invented logging, no invented capacity) are unchanged. The reaction time is bounded by the timer, not by the PMIC: with no interrupt, a cable event is up to 2 s old when it is published.",
  "The 60 s tier is what the capacity complaint is judged on and a fast cycle deliberately leaves the percentage alone, so a reader who checks the icon within 2 s of an unplug is reading a different field set from the one that carries soc=.",
  "The torch rows are read on hardware and the console gap of the previous round is closed. payload-ord212-torch.img (sha256 ec17ddd4fe7d8426a7514a755702e87296efc5ec9637cffd7014454ecc1911e0, kernel de7a04fa...) booted with ` dby-torch=1 dby-ti=1` on the line (50 entries, 998 bytes, 2 free) and VID_1209/PID_316d enumerated, so the capture holds `[torch] start mode=1 max_ma=300 hard_ma=500 ppid=0x5d3 leds=0x1 log=1 test_ms=0`, `[torch] spmi rc=0 v=0x50010000 apid=97 ee=0 own=0 slots=352 hits=1`, `[torch] id flash=18/04 ppid=0x5d3`, the register dump and `ready ... code=23 hard_code=39 apid=97 off_s=300 reads=20 writes=0`. Mode 1 is what ran, and the identity reads mode 2 exists to earn came back inside it. What is still not measured is light: `writes=0` says no channel was switched on, because nothing asked - neither `dby-torch-test` nor the user client has been driven on this board - so the current formula (code 23 for 300 mA under the hard code 39 for 500 mA) is read-back-correct and never photometrically verified, and the 5 minute bound and the fault ladder stay host-tested. The panel half is unchanged and is the complaint: no flashlight toggle, Camera.app still will not open - which is the iOS advertisement, not the SPMI write, and the same boot says why: `[torch] ios not made: the plug-in is not on the root`."
,
  "The iOS half is now read on the device down to one refusal and no further. `[torch] ios not made: the plug-in is not on the root` is `pgt_ios_final()` answering `plugin_visible == 0`, i.e. the fifth mount reporting that /private/var/ngpu/mediacapture held nothing, because the Data volume in that payload carries no `H6ISP.mediacapture`. The sources are in the tree, so what is missing is a Mach-O this machine cannot produce: `xcrun --sdk iphoneos` plus `codesign --pagesize 4096` exist only on Darwin, which is the same reason the audio server plug-in is built by the macOS Data-seed workflow, and an ad hoc signature means the CDHash of those exact bytes has to join the owner trust cache before mediaserverd - a platform process - maps the code. Until one seed carries the bundle and one trust bundle carries its hash, no host check can stand in for the panel verdict, and mediaserverd-s dlopen trust chain on this board is itself unproven (audiomxd took the same shape and needed its hash in the owner cache first).",]
next_action = ["Add a device checkpoint for the regulator path once the boot is repeatable.",
  "Build the plug-in where it can be built and flash what it produces. The two remaining steps are the mother-s, moved to the one runner that has the toolchain: beside the audio steps in the macOS Data-seed workflow, `python3 device/scripts/build-dby-camera-plugin.py --out <temp>/dby-camera-plugin` and then `python3 device/scripts/add-dby-camera-data.py --test-pattern <temp>/data-final.dbr <temp>/data-camera.dbr`, staged into the pre-grow base so the volume UUID is kept and the round stays payload-only. Then `scripts/add-dby-camera-trust.py` puts the job-s own `trust.json` CDHash into the owner trust bundle, the payload is rebuilt with `--data-ramdisk` and `--owner-trust-cache`, and `preload` takes it - no kernel rebuild, because the UUID is the ord212 one. The console verdict is `[torch] ios made` in place of `not made`, beside the `mount5=` pair; the panel verdict is a Control Center toggle that lights the LED and a code scanner that shows the scrolling bars and the QR. The camera sensor pipeline (stage 2, task 212) and the windows on which VID_1209/PID_316d does not enumerate (task 223) stay separate rounds.",]


[[area]]
id = "display"
status = "device-verified"
components = ["GopFramebuffer"]
paths = ["scripts/build-boot-progress.py", "scripts/build-gop-legacy-display.py", "scripts/patch-xnu-entry-probe.py", "scripts/xnu-panic-screen.c", "package/BootProgressDisplay.h", "package/BootUiTraceProbe.c", "package/AppleARMBacklight*", "package/BacklightProbe*"]

inputs = ["Firmware GOP framebuffer handed over by the UEFI port.", "Panel mode published through /chosen display-scale.", "Unmodified IOMobileFramebufferLegacy and IOMobileGraphicsFamily from the donor kernelcache."]
configuration = ["[kernel] archives build the legacy display backend with build-gop-legacy-display.py and force_load it.", "[payload] kernel_args keep the official offline-legacy-* sequence with offline-legacy-unit-scale=1 and offline-legacy-phase=4.", "panic_screen = true patches the panic screen into the payload copy of the kernel.", "GopFramebuffer is the selected shared component that publishes the firmware framebuffer to that backend."]
procedure = ["Rebuild the payload for an argument change, rebuild the kernel only for a driver change, flash and photograph the panel.", "Read the display checkpoints (stage, client calls, swap validation, frame count) as text from the diagnostic page."]
findings = [
  "scripts/build-gop-legacy-display.py binds the legacy backend to a reference kernel image: it takes build/xnu-prelink/native-owner-mobile-graphics-candidate.macho, or the newest native-owner-ufs-cpu-desktop-*-candidate.macho when that name has been pruned, and writes its original-bindings.S with .globl/.set at the absolute addresses read from it. That directory is written by core scripts/unixnu/kernel.py:prelink, which runs after the link, so the first kernel pass of a fresh clone has no candidate to bind against and the step stops with `No reference candidate available` rather than building without a display. The board carries no seed for it: the bindings are only valid for a candidate this panel has already booted, and a committed copy would freeze the kernel identity it was taken from.",
  "The display and PMGR builders import native_prelink from the official kit directory kits/XnuPrelink in the assembled tree. They previously prepended kits/NativePrelink, a name retired upstream, so that path never existed for a fresh clone.",
  "scripts/build-boot-progress.py compiles the board BootProgress.c with the panic-screen glyph table (Font.h) taken from the Mu-Silicium checkout passed with --uefi, so the firmware tree is a build input of the kernel step; a missing checkout is now the documented prerequisite error instead of an empty -I that surfaces as a fatal missing-header error.", "The legacy backend's own start already dispatches the hardware start; calling it a second time from board code produced a crash storm that looked like a panel failure.", "Scale is the gate that decided everything: preferredScale 0 makes the unchanged -[FBSDisplayMode _initWithWidth:height:preferredScale:] trap, SpringBoard never finishes and the render server ignores the panel. Publishing /chosen display-scale with unit-scale=1 closed it.", "Once the OS owns the panel, the diagnostic page must not take it back. boot-diag-resume=10 alternated our text page with the iPadOS lock screen because an ambient screen legitimately scans out nothing for more than ten seconds.", "The lock screen with its clock and home indicator is now on the panel on hardware, which is the first presented iPadOS frame observed on this board.",
  "scripts/build-gop-legacy-display.py:293 asserted that the only ready reader of native_battery_stats[16] is the [battery] row in BootLog.c and that the row never printed for lack of a producer. The second half was an assumption and the first half is false: BootLog.c is compiled by no builder in this tree, so the row is not in the image (ar membership, builder grep and symbol table in the diagnostics area). The comment now states what was measured instead."]
completion = ["An iPadOS frame is presented and stays presented across a normal idle period."]
limits = [
  "A fresh clone needs one kernel pass that produces a prelink candidate before the legacy display archive can link; build/xnu-prelink/ is a build product, not a repository input.", "No hardware cursor, no vsync-driven swap accounting and no DPU-specific timing on this SoC: the path is a GOP-backed legacy scanout."]
next_action = ["Keep the panel with the OS across idle, then make the lock screen passable (see the input area)."]


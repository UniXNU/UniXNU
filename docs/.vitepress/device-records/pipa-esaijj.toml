inputs = ["Mu-Silicium uefi-pipa platform (Platforms/Xiaomi/pipaPkg/pipa.dsc, pipa.fdf, Resources/Configs/pipa.toml) and the pipa UEFI memory map."]
configuration = ["board.toml [firmware] builds Platforms/Xiaomi/pipaPkg/pipa.dsc and expects Build/pipaPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd.", "check-pipa.py verifies the dsc/fdf/includes, the pipa.toml [uefi_fd] and [boot_image] values, the page alignment and non-overlap of MemoryMapLib descriptors, and the Binaries/pipa inputs."]
procedure = ["Clone xVanTuring/uefi-pipa branch pipa, then run python3 scripts/check-pipa.py with UNIXNU_UEFI pointing at it."]
findings = ["2026-11-10 Replaced the TB-J716F firmware paths with pipaPkg and the pipa memory descriptors (UEFI FD 0x9fc00000+0x300000, stack 0x9ff90000+0x40000, display reserved 0x9c000000+0x2400000)."]
completion = ["The pipa firmware source builds with UniXNU, the boot memory driver and DarwinBoot added."]
limits = ["The uefi-pipa checkout and its Binaries submodule are external; the static firmware checks are skipped when the checkout is absent."]
next_action = ["Run check-pipa.py against a full uefi-pipa checkout and build the FD."]


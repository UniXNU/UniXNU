schema_version = 1

[device]
name = "pipa"
soc = "SM8250"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Pad 6 (pipa / SM8250-AC) porting record for UniXNU iPadOS 17.7.11. The board data comes from the public xVanTuring/UniXNU-pipa and xVanTuring/uefi-pipa ports; this fork's build has not been booted on hardware."

# Status vocabulary used here:
#   implemented   - source and board configuration are present and build through the static/host checks
#   host-verified - the named host command passes in this tree
#   planned       - not enabled or not written yet
#   device-verified is deliberately absent: no pipa device evidence exists for this fork.

[[area]]
id = "configuration"
status = "host-verified"
components = ["XnuPrelink", "DarwinBoot", "SoftwareAES", "AppleKeyStoreState"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", "socs/**", ".github/**", "local.toml.example", "README.md"]
inputs = ["Xiaomi Pad 6 board identity (SM8250-AC, 16 GB measured unit), iPadOS 17.7.11 (21H461 / j120ap) OS profile, pipa_defconfig, and device:dts/pipa.dts."]
configuration = ["board.toml uses schema_version = 2, name = pipa, kit = pipa, soc = SM8250, soc_source = sm8250, os_profile = ipados-17.7.11-21H461, and device:dts/pipa.dts.", "configs/pipa_defconfig selects ArmDTPlatform, ArmCpu, SoftwareAES, RamBlock, VirtioMmioBlock (Verified), VerifiedRoot, ShengUfs, GopFramebuffer, Adreno 650, BootProgress and PMGR.", "The boot image uses the pipa UEFI values: base 0x10000000, kernel_offset 0x8000, tags_offset 0x100, pagesize 2048, header_version 1."]
procedure = ["Run dtc -I dts -O dtb -i socs/sm8250/dts dts/pipa.dts -o /tmp/pipa.dtb, then python3 scripts/check-pipa.py."]
findings = ["2026-11-11 Replaced the TB-J716F board file, defconfig, DTS, patch names and workflow paths with the pipa equivalents; removed the TB-J716F DTS and backlight sources from the build tree.", "2026-11-10 Read the pipa DRAM banks, userdata window, boot-image parameters and ADT values from xVanTuring/uefi-pipa (Resources/Configs/pipa.toml, Resources/DTBs/pipa.dts) and from Android's /memory on the measured 16 GB unit."]
completion = ["The board identity, source paths, defconfig and patch series resolve, and the fallback DTB compiles."]
limits = ["Only static and host checks have run; nothing in this fork has been booted on a Xiaomi Pad 6."]
next_action = ["Boot the packaged image and record the first pipa hardware evidence."]


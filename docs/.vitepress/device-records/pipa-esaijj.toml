kind = "host"
revision = "421c34bdcaf116bd15b8a895fa81ee483d4d8f31"
reference = "dts/pipa.dts"
command = "dtc -I dts -O dtb -i socs/sm8250/dts dts/pipa.dts -o /tmp/pipa.dtb"
result = "The pipa fallback tree compiles with the shared SM8250 CPU, GICv3, timer and PSCI nodes."

[[area.evidence]]
kind = "host"
revision = "421c34bdcaf116bd15b8a895fa81ee483d4d8f31"
reference = "scripts/check-pipa.py"
command = "python3 scripts/check-pipa.py"
result = "Stages build/pipa/pipa.dtb from uefi-pipa when available (or compiles dts/pipa.dts) and writes build/pipa/check.json with hardware_boot_demonstrated = false."


findings = ["CoreAnimation XR10/b3a8 composition striped on A650 although every single format-550 operation probed exact; forcing sRGB BGRA8 (text_fixups + gamut) removed the stripes. text repage keeps the fixups after a code page is evicted.", "LegacyDisplayProbe starts the haptics, camera, ADSP, audio, sensors and Bluetooth threads after the display is up; the display path itself is unchanged.", "LegacyDisplayProbe also starts the S Pen thread (weak t970_pen_start) after the display is up; the display path is unchanged."]

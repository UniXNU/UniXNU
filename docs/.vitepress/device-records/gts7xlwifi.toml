schema_version = 1

[device]
name = "gts7xlwifi"
soc = "SM8250"
os_profile = "ipados-17.7.11-21H461"
summary = "Samsung Galaxy Tab S7+ Wi-Fi (SM-T970). iPadOS 17.7.11 desktop with 8 cores in 4+3+1 clusters and DVFS, native UFS root and Data, GPU-composited UI (Adreno 650), touch, brightness, USB debug console and battery; Wi-Fi at PCIe stage 4."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore", "local.toml.example", "unixnu.lock", "LICENSE", "AGENTS.md", "MIGRATION.md", "README.md", "README_EN.md"]
inputs = ["SM8250 layer FFT-infra/UniXNU-sm8250-common 166235ec; iPadOS 17.7.11 21H461 kernelcache as prelink donor."]
configuration = ["board.toml [components] include, [kernel] patch_series (arch, soc, device before-os, os, device), [payload] text_fixups and ADT product strings."]
procedure = ["./unixnu build kernel; ./unixnu build payload --trust-cache <owner trust cache>."]
findings = ["A payload built without --trust-cache lacks the ADT trust-cache slot and the boot menu reports Compromised Data.", "board.description is the catalog title; it names the working functions so this record is told apart from the single-core sm-t970 bootstrap.", "The Wi-Fi stack archive libT970Wifi.a is force-loaded through CONFIG_XNU_EXTRA_LD_ARCHIVES, and board.toml lists build-t970-wifi.py and the audio plug-in trust cache hash; nothing in either runs without its boot argument.", "README.md describes the state as of the combo7 test build (audio, haptics and shutdown working; Wi-Fi, Bluetooth, sensors and camera in progress).", "board.toml lists the trust-cache hashes of the addon variants that carry the Wi-Fi supplicant, the Bluetooth BlueTool service and the Turnip buffer fix.", "board.toml lists the trust-cache hashes of the later addon variants (audio ABI v3 with the microphone, and the bluetoothd patch sets); README.md describes the state as of the combo26 test build (Wi-Fi with Safari, microphone, keychain working; Bluetooth power-on and the S Pen in progress)."]
completion = ["All source pins resolve and the kernel, prelink and payload build."]
limits = ["Built against a UniXNU-next checkout with docs/host-patches applied."]
next_action = ["Drop the host patches once equivalent changes land upstream."]
evidence = [
  {kind = "source", reference = "board.toml", result = "Board configuration with component selection, patch order and payload ADT strings."},
]

[[area]]
id = "firmware"
status = "implemented"
components = []
paths = ["proprietary-files.txt", "scripts/gen-gpu-firmware-a650.py", "docs/menu/**"]
inputs = ["Samsung bootloader T970 with a UEFI boot selector on the boot partition (separate firmware tree), ESP with EFI/UniXNU."]
configuration = ["docs/menu/unixnu.toml: kernel command line <= 1000 bytes; payload at Payloads/gts7xlwifi."]
procedure = ["Copy kernel.macho, kernel.macho.adt and the trust cache to the ESP; choose the UniXNU entry in the menu (the selector defaults to TWRP after adb reboot)."]
findings = ["The A650 GMU/SQE/ZAP images are compiled in; scripts/gen-gpu-firmware-a650.py rebuilds the source from the tablet files, reassembling the ZAP ELF from its .b0N segments.", "proprietary-files.txt lists the Wi-Fi board files and regdb and the ADSP image (squashed from the split mdt by scripts/squash-mdt.py); all stay in the ignored .cache directory."]
completion = ["The menu starts XNU with the payload and its ADT."]
limits = ["The UEFI firmware itself is not in this repository."]
next_action = ["Publish the UEFI firmware tree or pin it."]
evidence = [
  {kind = "source", reference = "proprietary-files.txt", result = "Firmware inputs with sources and SHA-256."},
]

[[area]]
id = "cpu"
status = "device-verified"
components = ["ArmCpu"]
paths = ["package/CpuFreq*", "drivers/ArmCpu/**", "patches/xnu/t970-three-clusters.patch", "dts/**"]
inputs = ["Kryo 585: 4x A55 (EPSS domain 0x18591000), 3x A77 (0x18592000), 1x A77 prime (0x18593000); GICv3; TSENS 0xc263000/0xc265000."]
configuration = ["armcpu-spi-ipi=1 armcpu-spi-ipi-base=544; DTS unixnu,cluster-type and unixnu,die-cluster-id 0/1/2; sheng-cpufreq=4 sheng-cpufreq-cap=2000."]
procedure = ["Boot with all 8 cores; read SMP and CPUFREQ rows of the boot log."]
findings = ["SGI/SPI 1008..1015 are group-0 secure on this firmware, so IPIs use software-pended SPIs from 544. MPIDR AFF1 numbers single cores in one DynamIQ cluster, so the scheduling cluster comes from die-cluster-id (t970-three-clusters.patch, with the SM-T733 boot-cluster fallback). DVFS: perfcontrol class and 200 ms load per EPSS domain, 10 ms worker (after SM-T733 T733CpuPower).", "The device tree gained a wlan node (compatible qcom,qca6390) for wifid's launchd condition; CPU nodes are unchanged.", "The device tree gained a bluetooth node (/arm-io/bluetooth) so MobileGestalt reports Bluetooth; CPU nodes are unchanged."]
completion = ["Seven secondary cores reach step 7; each EPSS domain changes level with load."]
limits = ["TSENS uses the hottest sensor only; no per-cluster thermal zones."]
next_action = ["Group TSENS sensors per cluster as SM-T733 T733Thermal."]
evidence = [
  {kind = "device", reference = "docs/evidence/periph15-bootlog.txt", result = "SMP c1..c7=step7; CPUFREQ d0 1804 MHz, d1 1958 MHz, d2 844 MHz idle with 601 level changes.", command = "TWRP: python3 tools/read-boot-log.py --port <adb serial> --out logs (after booting the periph15 payload, docs/menu/unixnu.toml)", revision = "781e3528e2d5e0dc0c9c6fa1e409f5a4bc1cf0e2"},
]


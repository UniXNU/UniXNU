findings = ["Root reads are verified per 4 KiB block; Data persists across boots.", "Boot hangs after the addon install were the polled UFS wait: IODelay(2) is a timer sleep on this board (cpu_idle_latency 0) taken under gHost.lock; the poll now spins on the counter for 20 ms before sleeping, with a [ufs poll] diagnostic row. The addon install now ends with F_FULLFSYNC so a hard reset no longer loses its writes."]

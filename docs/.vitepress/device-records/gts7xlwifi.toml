[[area]]
id = "input"
status = "device-verified"
components = ["ShengHidInput", "ShengNovatekTouch", "QcomGeniSpi"]
paths = ["drivers/ShengHidInput/**", "package/T970FtsTouch.cpp", "package/HidInputProbe.cpp", "package/Button*", "package/T970Pen.cpp", "docs/spen-notes.md"]
inputs = ["STM fts1ba90a at I2C 0x49 on QUP SE5 pins 12/13, attention GPIO 15; PMIC keys."]
configuration = ["native-touch=1 sheng-touch-hid=1 t970-touch-xform=5 offline-hid-input=1."]
procedure = ["Touch the desktop; read TOUCHSTAT on the USB console."]
findings = ["The panel bus is driven as a GPIO I2C master; ShengNovatekTouch and QcomGeniSpi come in as catalog dependencies of ShengHidInput and are not used by this board.", "NativeHidInput also publishes accelerometer, gyro and orientation HID devices for the sensor service, with the 0xff00 usages backboardd and locationd look for.", "Motion HID devices set Built-In before IOHIDDevice::start so locationd's matching sees it at registration.", "The S Pen is a Wacom W9020-class digitizer on I2C (package/T970Pen.cpp): position 26712x16714, 4096 pressure levels, tilt, side button and the garage switch all decode on device. iPadOS ignores it so far: backboardd drops any touch path index of 31 or more (the first contact id 0xfe was thrown away), takes a Pencil only from its own 0x0D/0x20 digitizer service, and the separate pen service is not yet opened by the HID event system. Notes in docs/spen-notes.md."]
completion = ["Touches reach SpringBoard as HID events."]
limits = ["No palm rejection or S Pen."]
next_action = ["Add the S Pen digitizer."]
evidence = [
  {kind = "device", reference = "docs/evidence/usb-console.txt", result = "TOUCHSTAT frames and HID submissions on the live console.", command = "macOS: read /dev/cu.usbmodem* while the periph15 payload runs", revision = "781e3528e2d5e0dc0c9c6fa1e409f5a4bc1cf0e2"},
]

[[area]]
id = "gpu"
status = "device-verified"
components = []
paths = ["drivers/Adreno650/**", "kits/**", "package/Gpu*", "package/T970GpuAddon.S", "scripts/build-adreno650.py", "scripts/t970-addon-add.py", "scripts/data/xr10-probe/**", "patches/xnu/t970-gpu-addon-embedded.patch", "patches/xnu/t970-sandbox-grant-entitlement.patch", "docs/host-patches/**", "scripts/t970-turnip-variant.py"]
inputs = ["Adreno 650 (A650 GMU/SQE/ZAP), apps SMMU GPU context; AdrenoMetal userspace (metal2vulkan + Turnip) in an embedded addon."]

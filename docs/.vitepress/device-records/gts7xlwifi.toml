status = "implemented"
components = []
paths = ["package/T970Battery.cpp", "package/ShengPlatformPower.cpp", "scripts/build-platform-power.py", "docs/usb-plan.md", "scripts/gen-usb17-abi.py", "scripts/usb-abi-21H461.json"]

configuration = ["t970-battery=1 sheng-pmgr=2."]
procedure = ["Boot and read the [t970 battery] row; shut down from Settings."]
findings = ["Samsung arms the MAX77705 charger watchdog; unkicked it turns charging off (CHG_DTLS 0xb). The service kicks CHG_CNFG_06 every 10 s.", "Shutdown works: after the writable volumes are unmounted the kernel waited forever on the sealed OS volume, so a 10 s failsafe (patches/xnu/t970-shutdown-failsafe.patch) makes the PSCI call; the speaker amplifiers are muted first so there is no pop.", "Charging: input limit and charge current are set from the Type-C Rp/BC1.2 source with the AICL threshold at 4.5 V; PD source capabilities are read and 9 V PD/AFC is available behind t970-hv. The Apple USB stack port (QcomDwc3) is planned in docs/usb-plan.md with 21H461 class layouts.", "docs/usb-plan.md gains the SuperSpeed console plan and the combo24c/25 diagnosis (missing clock resume)."]
completion = ["iPadOS shows the battery level and charge state; halt powers off."]
limits = ["Input current stays at the default USB limit; shutdown does not reach PSCI yet (storage)."]

[[area]]
id = "network"
status = "implemented"
components = []
paths = ["package/T970WifiProbe.cpp", "package/MhiBoot.*", "package/T970Rpmh.inc", "package/T970WifiStack.cpp", "package/T970WifiNet.cpp", "package/T970Ath11k.c", "package/ath11k-compat/T970Ath11kCompat.h", "package/ath11k-compat/linux/dmi.h", "package/ath11k-compat/linux/of_irq.h", "package/ath11k-compat/linux/suspend.h", "scripts/build-t970-wifi.py", "docs/wifi-sources.md"]
inputs = ["QCA6390 (17cb:1101) on PCIe0: PERST GPIO 79, CLKREQ 80, WLAN_EN 90; rails smpa4/5/6, smpc8, ldoc5; stream 0x1c01."]
configuration = ["t970-wifi=<stage> (4 = link and endpoint, 5 = BHI firmware, 6 = the full ath11k stack: build/t970-wifi/libT970Wifi.a, force-loaded; the DTS wlan node must be set to okay for wifid)."]
procedure = ["Boot with t970-wifi=4 and read the [t970 wifi] rows."]
findings = ["cmd-db lists several VRM names twice; the first match is used (Linux behaviour). Stage 5 with an SMMU bypass and a 36-bit buffer reset the tablet within 20 s.", "A private apps-SMMU stage-1 bank for stream 0x1c01 (IOVA 0xa0000000, 4 MiB page-mapped arena) contains the endpoint DMA: BHI fetched the SBL with FSR staying at FORMAT 0x400 and no reset. Choosing the bank top-down and writing FSR hung a CPU at the first access; bottom-up like QcomUsbDmaDomain with 32-bit accesses works. FSR 0x400 is the AArch64 FORMAT bit, not a fault.", "Stage 6 runs Linux ath11k for QCA6390 hw2.0 with MHI, QRTR and QMI (package/T970WifiStack.cpp, scripts/build-t970-wifi.py): the firmware reaches mission mode, cache maintenance fixed the ef128100 PBL error, the QRTR name service now answers the firmware's HELLO, and WLFW is announced. The board-file download then stops with an MHI BAD_TRE completion on the IPCR uplink channel.", "The Wi-Fi supplicant (unixnu-wpa_supplicant, built by scripts/build-t970-wifi-service.py) runs from the addon on Data with a launchd cache union-mounted over /System/Library/xpc (t970-wifi-svc=1). Scanning (41 networks), the 856-byte 21H461 join request, WPA2 join, DHCP, DNS and TCP all work; wifid does not yet mark the link usable, so there is no status-bar icon and no Safari traffic.", "The Wi-Fi link is usable end to end: IPConfiguration's router check reads replies through BPF, so the driver now taps every frame from a separate thread (tapping in the receive thread hung the tablet, t970-wifi-bpf=0 turns it off), and the repeated link-changed events after a join are suppressed so wifid stops treating each one as a roam. The status-bar icon appears and Apple News loads; Safari also needs sheng-no-lc=1 because launch constraints killed its web content process. The icon still shows no signal bars."]
completion = ["Link L0, endpoint identity, BAR and MHI registers readable."]
limits = ["DMA domain works; SBL does not reach READY yet; no MHI contexts, QMI or ath11k."]
next_action = ["After BHI the device stays in PBL and never reports READY within 3 s: extend the wait to 10 s, trace EE/state/BHI status every 100 ms, compare with Linux mhi_fw_load_bhi; then MHI contexts, BHIe for the full image and the ath11k port (Chengdong-Yu/pong-wifi)."]
evidence = [
  {kind = "device", reference = "docs/evidence/periph17-wifi.txt", result = "[t970 wifi dom] rc 1 bank 6 SMR 7 ASID 0xfc00, FSR 0x400; [t970 wifi mhi] BHI from IOVA 0xa0000000, failed in WaitReady after 3000 ms.", command = "TWRP: python3 tools/read-boot-log.py --port <adb serial> (periph17 payload, t970-wifi=5)", revision = "cf6ed1702d3ddc2ace4cc988b982117e77f32c0b"},
  {kind = "device", reference = "docs/evidence/periph15-bootlog.txt", result = "[t970 wifi] link in 13 ms, endpoint 17cb:1101 class 0x0280, BAR0 at 0x60300000.", command = "TWRP: python3 tools/read-boot-log.py --port <adb serial> --out logs (after booting the periph15 payload, docs/menu/unixnu.toml)", revision = "781e3528e2d5e0dc0c9c6fa1e409f5a4bc1cf0e2"},
]

[[area]]
id = "audio"
status = "implemented"
components = []
paths = ["package/T970Adsp.cpp", "package/ShengAdsp.h", "package/T970Apr.*", "package/T970Audio.cpp", "package/T970AudioAbi.h", "package/T970AudioService.cpp", "package/Qcom*", "hal/*", "scripts/build-t970-audio-hal.py", "scripts/t970-audio-pack.py", "scripts/squash-mdt.py", "scripts/t970-android-audio-dump.sh", "patches/xnu/t970-audio-addon-mount.patch", "scripts/t970-android-mic-dump.sh"]
inputs = ["ADSP (adsp.mdt squashed to adsp.mbn, loaded through PAS/SCM), GLINK/SMEM/SMP2P/QMP to the ADSP, APR to AFE/ADM/ASM; speaker port PRI TDM RX (4 slots x 32 bit, DSP_A, short sync, delay 1); four CS35L41 amplifiers on QUP SE11 I2C 0x40-0x43."]
configuration = ["t970-adsp=2 t970-audio=32 (iOS output device through hal/T970AudioPlugIn.c and the T970AudioService ring). t970-audio-gain=<0-20> sets the amp PCM gain (default 12)."]
procedure = ["Boot with t970-adsp=2 t970-audio=32, play a system sound or music, read the [audio] and [audio svc] rows."]
findings = ["The iOS output was distorted for two reasons: startOutput cleared the whole shared ring after the path came up, erasing the samples the plug-in had already written (found with a plug-in/kernel waveform capture); and the amps sampled on the wrong bit-clock edge. Samsung's machine driver uses DSP_A with IB_NF, so SP_FORMAT SCLK_INV must be 1. The fsync errata write ASP_CONTROL4 and Android's noise gate NG_CFG were also added.", "Android runs Cirrus speaker protection firmware on the amplifier DSPs with a higher PCM gain behind it; without it the gain is kept lower.", "The built-in microphone works as an iOS input device: DMIC3 through the LPASS TX macro, decimator 0 at 48 kHz, AFE TX_CODEC_DMA_TX_3 (0xB037), ADM and an ASM read session, with the PM8150A L5 mic supply voted while capturing (defaults copied from Android with scripts/t970-android-mic-dump.sh). The shared page ABI is version 3; the microphone is on by default and t970-audio bit 8388608 turns it off."]
completion = ["iOS system sounds and media play cleanly on the four speakers."]
limits = ["No speaker protection firmware (CSPL), so the volume stays below Android's; no microphone yet."]
next_action = ["Confirm loudness with audio14 (gain 12, VPBR); later a CSPL loader for the amplifier DSPs and the microphone path."]
evidence = [
  {kind = "source", reference = "package/T970Audio.cpp", result = "AFE/ADM/ASM bring-up, CS35L41 setup (SCLK_INV, fsync errata, noise gate, VPBR) and the shared output ring."},
]

[[area]]
id = "bluetooth"
status = "planned"
components = []
paths = ["package/T970Bluetooth.cpp"]
inputs = ["QCA6390 Bluetooth on QUP0 SE6 UART (GPIO 16-19), BT_EN GPIO 76; firmware htbtfw20.tlv and htnv20.bin from the device."]
configuration = ["t970-bt=<bits> (1 run, 2 ROM readback only, 64 step mode, 128 USB mirror)."]
procedure = ["Boot with t970-bt=131 and read the [t970 bt] and [t970 bt log] rows."]
findings = ["GPIO 20-23, 28-31 and 40-43 are TrustZone-protected; touching them resets the SoC, so the driver refuses them.", "The wrap-0 AHB branches run under hardware clock gating and read off while idle.", "The controller answers HCI, takes htbtfw20.tlv/htnv20.bin at 3 Mbaud (QUP 2.5 needs 16x UART oversampling) and serves com.apple.uart.sk.bluetooth; a replacement BlueTool runs as its own launchd job. bluetoothd still exits at start because the keychain cannot store its root keys.", "With software key wrapping in AppleKeyStoreState the keychain stores bluetoothd's root keys. The stock bluetoothd then stopped at HCI commands this QCA6390 does not support; build-t970-bluetool.py patches it to skip 0x0c5b, to treat refused unsupported commands (status 628) as skipped, and to stay on legacy LE (no 0x204a, which locks the chip out of legacy scan). The driver keeps the last HCI commands and replies per session ([t970 bt hci]). bluetoothd now stays up but Settings cannot turn Bluetooth on yet."]
completion = ["The controller answers HCI_Reset and reports its version, then loads the rampatch and NVM."]
limits = ["No HCI transport into iPadOS yet."]
next_action = ["ROM readback, firmware download, then the bluetoothd transport."]
evidence = [
  {kind = "source", reference = "package/T970Bluetooth.cpp", result = "Power, clock, SMMU and GENI UART bring-up with a secure-pin guard."},
]

